front:
  text: 分門集註杜工部詩卷第十二
  hash: sha256:ad3acf303c92bbde4a33477f20f659337e3521262d404b1d5b82b4adf2d5d3f2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_012-1a}
body:
  text: 紀行下律詩三十六首去蜀新添五載客蜀郡一年歸梓州如何關塞阻轉作瀟湘遊萬事已黃髮殘生隨白鷗安危大臣在何必淚長流恨別洛城一別四洙曰一作三千里胡􅀐長驅五六年洙曰一云六七公因避亂入蜀草木變衰行劒外洙曰宋玉九辨草木摇落􅀆變衰兵戈阻絶老江邊洙曰道路梗阻未可歸也思家歩月淸宵立憶弟看雲白日眠聞道河陽近乗勝司徒急爲破幽燕洙曰幽燕安史巢穴司徒李光弼也新破賊于河南三橋故也趙曰乾元二年司徒李光弼敗史思明於河陽幽燕思明窟穴也遊子巴蜀愁誰語吳門興杳然洙曰梅福變名姓爲呉市門卒趙曰此篇公欲南下而尚在巴蜀留滯而愁也九江春草外洙曰九江江名見所思詩注三峽暮帆前洙曰見忠州三峽内注趙曰九江三峽正是南下之所歷猒就成都􅁲洙曰史記嚴君平避丗賣􅁲於成都市中趙曰言不思再往成都以嚴君賣卜於成都市休爲吏部眠洙曰晉書畢卓太興末爲吏部郎廿舎郎醸熟卓因醉夜至其甕間盗飲之爲掌酒者所􅅞明旦視之乃畢吏部也遽釋其縛卓遂引主人宴於甕側致醉而去趙曰言休爲酒而眠以爲留滯也蓬萊如可到洙曰􅁃信哀江南賦云舟楫路窮星漢非乗槎可上風飈道阻蓬萊無可到之期前漢郊祀志自威宣燕昭使人入海求蓬萊方丈瀛洲此三神山者其傳在勃海中去人不逺蓋常有到者未至望之如雲及到三神山反居水下水臨之患且至則風輒引船而去終莫能至云趙曰公言非止南下遊呉而巳蓬萊仙山可到則亦往矣衰白問羣仙洙曰丗說蓬萊有羣仙及不死之藥行次鹽亭縣聊題四韻奉簡嚴遂州蓬州二使君諮議諸昆季魯曰此詩奉簡嚴遂兩使君以比蜀之名士馬首見鹽亭髙山擁縣靑雲溪花淡淡洙曰一作漠漠春郭水泠泠全蜀多名士洙曰蜀都賦近則江漢炳靈丗載其英鬱若相如皭若君平王襃暐曄而秀發􅀭雄含章而挺生趙曰多名士指言當日之人以引下句嚴家聚徳星洙曰陳仲弓從諸子造荀季和徳星聚太史奏賢人聚也長歌意無極好爲老夫聽自閬州領妻子却赴蜀山行三首汨汨避羣盗悠悠經十年不成向南國趙曰指言自閬中而欲南下之計不成復作遊西川物役水虚照趙曰言爲身爲物所役水亦虚徒相照而不得優游而覩賞之也魂傷山寂然我生無􅀝著洙曰師古曰地著謂安土也盡室畏途邊趙曰盡室全家也左傳盡室以行莊子畏途者十殺一人則父子兄弟相戒師曰甫􅀄次遊荆楚聞嚴武再鎮成都故云不成向􅀯國復作遊西川畏途者言道路盗賊險阻也長林偃風色廻洙曰一作首復意猶迷衫裛翠微潤師曰蜀都賦鬱葐蒀以翠微山色之輕縹也趙曰言山中翠微之氣潤裛衣服也馬衘靑草嘶棧洙曰一作逕懸斜避石洙曰棧閣道也橋斷却㝷溪何日兵戈盡飄飄媿老妻行色遞隱見洙曰孔子見盗跖回遇栁下惠於魯東門曰車馬有行色得微往見盗跖耶趙曰言山有髙下林木有蔽虧其行李物色或見或隱也師曰言山環合其身遞隱見也棧閣道也人煙時有無僕夫穿竹語稚子入雲呼轉石驚魑魅洙曰天台賦始經魑魅之􅂗趙曰山中之人以其有魑魅而轉石驚之抨弓落狖鼯洙曰狖猿屬也鼯䑕也荀卿鼯䑕五技而窮蘇曰佳績爲黔江太守官署後多鼯抨絃即驚墮鄭曰抨波耕切訓彈也眞供一􅀏樂似欲慰窮途渝州候嚴六侍御不到先下峽聞道乗騘發立之曰漢栢典號騘馬御史此句指嚴侍御也沙邊待至今不知雲雨散洙曰宋玉髙唐賦湫􅀆如風凄􅀆如雨風止雨霽雲無處所王粲詩風流雲散一别如雨師曰雲雨散喻别離也虚費短長吟洙曰古詩有長短吟山帶烏蠻闊洙曰嶲州西有烏白蠻鄭曰梁益記嶲州嶲山其地接諸蠻部有烏蠻秋蠻江連白帝深洙曰公孫述以永安爲白帝城師曰此二句言阻逺也􅂳經一柱過洙曰梁劉孝綽江津􅀉劉之遴詩經過一柱觀出入三休臺留洙曰一作滯眼共登臨􅂳下夔州郭􅀫雨濕不得上岸別王十二判官依沙􅀫舸船石瀬月姢姢洙曰謝靈運詩回谿石頼􅌗林脩竹詩鮑昭翫月詩姢姢似娥眉風起春燈亂江嗚夜雨懸晨鍾雲外濕勝地石堂煙趙曰石堂是夔州佳處空望其煙此題中所謂不得上岸也柔櫓輕鷗外含悽覺汝賢趙曰船櫓在輕鷗之外怱怱遂行不得如鷗之遊􅃞所以含情而覺鷗之勝我也大曆三年春白帝城放􅂳出瞿塘峽乆居䕫府將適江陵漂泊有詩凡四十韻老向巴人裏洙曰傳莊十八年巴人伐楚修可曰劉璋分三巴以䕫爲中巴地也今辭楚塞隅入舟飜不樂解纜獨長吁洙曰江文通望荆山詩奉義至江漢始知楚長謝靈運解䌫乃流潮又入舟陽巳微趙曰楚塞指白帝城不樂而長于者有萍梗流離之傷矣窄轉深啼狖鄭曰余救切虚隨亂浴鳬趙曰舟轉於峽中之窄處其聞啼狖愈在深處矣舟虚隨冷浴之鳬謂之乱浴則非一二鳬耳石苔凌几杖空翠撲肌膚蘇曰隂亮山行謂友人曰空翠爽人肌膚泉流淸人耳目乍脫塵鞅永日忘歸疊壁排霜劒趙曰指言巫山也其立如劒奔泉濺水珠蘇曰屈平亂山横劒奔泉濺珠杳溟藤上下濃淡樹榮枯神女峯姢妙鄭曰盛弘之荆州記巫山有神女峯昭君宅有無洙曰神女廟傍有昭君村鄭曰寰宇記㱕州巴東有王昭君宅趙曰蓋年歳乆逺不知昭君宅何在也曲留明怨惜洙曰怨惜一作怨別趙曰曲則昭君曲也樂府有昭君怨夢盡失歡娯洙曰昭君宅有夔州子美􅀒薪行云若道巫山女麄醜何得此有昭君村石季倫昭君辭曰王明君者本爲王昭君以觸晉文帝諱改之匈奴盛請婚於漢元帝以後宫良家子明君配焉昔公主嫁烏孫令琵琶馬上作樂以慰其道路之思其送明君亦爾也其造新之曲多哀怨之声神女峯在巫山宋玉髙唐賦曰昔先王遊髙唐怠而晝寢夢見一婦人曰妾巫山之女也願慶枕席又神女賦曰楚㐮王夜寢夢與神女遇其狀甚麗寐而夢之寤不自識趙曰夢則楚㐮王夢神女是也此巳初叙其離䕫州入船所歷之景及弔古之事如此擺闔盤渦沸洙曰郭璞江賦盤渦谷轉欹斜激浪輸風雷􅆞地脉洙曰江賦流風蒸雷海賦驚浪雷奔蘇曰張禹曰迅雷烈風纒地脉冰雪曜天衢洙曰易何天之衢亨鹿角眞走險洙曰文十七年傳鄭子家曰小國之事大國也德則其人也不德則其鹿也鋌而走險急何能擇狼頭如跋胡洙曰詩狼跋其胡載疐其尾注跋躐也進則躐其胡退則跋其尾出左傳言鹿曰鋌而走險趙曰鹿角狼頭公本注二灘名惡灘寧變色髙卧􅀒微軀趙曰今遇惡灘寕不變色乎髙卧則事有不測爲􅀒微軀矣書史全傾撓裝囊半壓濡生涯臨臬兀洙曰困于臲硊也死地脫斯須蘇曰陶秀行次豫章嘆曰生涯如􅾜兀胡不悲憂身世韓旣昨入呉榮死地脫於斯須之間今日思之令人毛寒不有平川決洙曰一作决焉知衆壑趨乾坤霾漲海定功曰言水之􅄅茫闊逺矣雨露洗春蕪蘇曰史惠曰征塵蒙蒲蕪草荷雨露沾洗鷗鳥牽絲颺趙曰羽如絲也謂之牽絲則絲有牽之理驪龍濯錦紆落霞沉緑綺洙曰謝玄暉晚望三山詩餘霞散成綺澄江静如練殘月壞金樞洙曰木玄虚海賦大明鑣轡於金樞之穴注大明月也金樞西方月没之處穴窟也泥笋苞初荻沙茸出小蒲洙曰謝靈運詩新蒲含紫茸初篁苞緑籜鴈兒爭水馬夢符曰古按本草水馬生水中善行如馬亦謂之海馬燕子逐檣烏趙曰船檣上刻爲烏形也燕如逐之絶島容煙霧環洲納曉晡洙曰謝靈運詩側徑旣窈窕環洲亦玲瓏前聞辨陶牧洙曰顔延年七澤謁荆牧牧陶牧也地名蘇曰王粲登樓賦北彌陶牧注陶卿名郊外曰牧轉眄拂冝都洙曰劉備改夷陵爲冝都縣郭南畿好洙曰路入松滋縣津亭北望􅀌趙曰懷長安矣勞心依憇息㓪詠劃昭蘇趙曰劃字開豁之意意遣樂還􅀏衰迷賢與愚趙曰人情歷艱險則悲憂逢平曠則􅀏樂當是時雖身之老志之衰矣豈復論賢愚哉飄蕭將素髪洙曰秋興賦素髪䬃以垂領汩没聽洪鑪洙曰王粲傳鼔洪炉以燎毛髪丘壑曾忘返洙曰謝靈詩昔余游京華未甞廢丘壑山林之士入而不復出文章敢自誣蘇曰􅁲商文章繩身之規矩豈敢自誣趙曰公以文自任雖已亦不得而誣其不能也此生遭聖代誰分哭窮途洙曰顔延年詠阮歩兵詩窮途能無慟趙曰阮籍毎行至路窮處輒慟哭而返卧疾淹爲客蒙恩早厠儒廷爭酬造化洙曰王陵傳陳平謂陵曰面折廷爭臣不如君師古曰謂當朝廷而諌爭也蘇曰後張綱曰吾廷諍是非屏棄姦佞非欲作自己名目端酬造化有􅀘王室而益􅀺民吾死亦無􅢯何况生焉趙曰公言其爲左拾遺時嘗論房琯有才不冝廢是爲廷諍以酬君王碩遇之恩是爲酬造化樸直乞鄭曰去旣切江湖趙曰肅宗以公言房琯出爲華州司功属􅀜輔飢亂遂入蜀今在夔且欲之楚灔澦險相迫滄浪深可逾浮名㝷巳巳􅈸計􅁍區區趙曰公以諌忤旨流落江湖迫灔澦逾滄浪於是無意於浮名而遂其閑􅈸矣喜近天皇寺先披古􅀞圖夢符曰右按渚宫故事張僧繇避侯景之乱來奔相東承制拜右將軍僧繇攻􅀞爲郡之冠常於天皇寺栢堂圖盧舎那佛像夜有竒光發自屋壁又於堂内圖孔子十哲像識者謂右軍絶筆湘東鮑潤岳謂曰釋門之內冩素王之容雖由神異無方豈可夷夏同貫僧繇􅀏曰吾誠偶然安知不利於後聞者莫知其旨及後周滅二教梁爲附庸荆楚祠宇莫不毀撤唯天皇寺有宣尼像遂爲國庠時人歎其先斍嘗於此寺􅀞龍不時􅀧睛道俗請之捨錢數萬落筆之後雷雨晦冥忽失龍不知所在唐朝閻立本工􅀞無對立本嘗至荆州視僧繇舊跡曰定虚得名耳明日又往􅀚之猶是近代佳手明日又往曰名下無虚士坐卧􅀚之留􅀫其下十餘日而不能去應經帝子渚洙曰謝玄暉瀟湘帝子逰江淹王徴君詩北渚有帝子蕩瀁不可期帝子見楚詞定功曰楚詞云帝子降兮北渚帝子謂堯女娥皇娥英矣同泣舜蒼梧洙曰禮舜葬倉梧之野謝玄暉雲去蒼梧野顔延年謁帝蒼山蹊趙曰公之懐舜深矣朝士兼戎服君王桉湛盧洙曰呉越春秋越王允常􅛷子作名劒五枚秦客薛燭善相劒趙王取湛盧示之曰善哉銜金鐵之英吐銀錫之精􅀉氣託靈有游出之神服此劒可以折衝伐敵人君有逆誅則去之它國允王乃以湛盧獻吳吳公子光弑呉王湛盧去如楚也鮑明逺天子按劒怒旄頭初俶擾洙曰始擾亂也晉天文志昴爲旄頭胡星也天子出旄頭罕畢以前驅也趙曰相始爲亂也鶉首麗泥塗洙曰晉志自東井十六度至栁八度爲鶉首秦之分野屬雍州趙曰鶉首星度之名分野則雍州也麗泥塗此言廣徳元年長安䧟也甲卒身雖貴書生道固殊出塵皆野鶴洙曰晉嵆紹在稠人中昴昴然若野鶴之在雞羣歷塊匪轅駒洙曰王襃云過都越國蹶如歷塊灌夫傳上怒內史曰公平生數言魏其武安長短今日廷論局促効轅下駒應劭曰駒者駕者轅下局􅃐䠞小之貌張晏曰俛頭於車轅下隨母而巳趙曰言遭䘮乱則甲卒有貴爲節度爲將帥時有書生亦其中而書生之道自與甲卒殊矣故有野鶴轅駒之譬伊吕終難降韓彭不易呼洙曰伊尹吕望韓信彭越趙曰言伊尹吕望不肯降志矣文人不來武人得􅀔也五雲髙太甲六月曠摶扶鄭曰摶徒官切洙曰莊子鵬之徙於南溟也水擊三千里搏扶揺而上者九萬里去以六月息趙曰言賢材之不得用也沈佺期移禁司刑詩散材仍葺厦弱羽遽摶扶回首􅀺元病爭權將帥誅山林託疲􅒒未必免﨑嶇洙曰莊子齊物論􅒒然疲役而不知其所歸不哀邪趙曰公之自傷尤深矣師曰空翠者垂空翠蔓也舟過戞人肌膚故云空翠撲䏎膚薛夢符云水馬生水中善行如馬亦謂之海馬今按陳藏器本草云水馬生海中頭如馬形長五六寸蝦􅀋也今所在池塘亦有之差小耳俗亦呼爲水馬王粲登樓賦北弥陶牧西按昭丘注陶郷名郊外曰牧渚宫故事張僧繇避矦景之乱來奔湘東王繹承制拜右將軍僧繇善畫爲南郡之冠嘗於天皇寺栢堂圖盧舎那佛像夜有竒光發自屋壁又於堂内圖孔子十哲像識者謂右軍絶筆湘東記室鮑潤岳謂曰釋門之內冩素王之容雖神異無方豈可夷夏同貫僧繇􅀏曰吾誠偶然安知不利於後聞者莫曉其意及後梁滅三教梁爲附虜荆楚祠宇莫不毀拆惟天皇寺有宣尼僧像遂爲國庠時人歎其先斍嘗於此寺畫龍雷雨晦􅁳忽失龍所在盤渦解在前鹿角狼頭皆惡灘名臬兀不安貌夔地險稍岀江陵則平矣故曰不有平川決環州回環而舟不進也天子有孝德則五色雲見以太甲比代宗曠廢也子美廢斥故曰曠摶扶爭權將帥誅言崔旰楊子琳之亂巴蜀之人困於征役故云回首􅀺元病放船新添収帆下急水卷幔逐回灘江市戎戎暗山雲淰淰寒流林無徑入獨鳥恠人看巳泊城樓底何曽夜色䦨山館南國晝多霧北風天正寒蘇曰張􅌗先北風凛烈天色正寒游子不歸吾心如割雖有尺書吾不能逹路危行木杪身逺􅀫雲端洙曰鮑明逺詩雲端楚山見林表呉岫微山􅀑吹燈滅厨人夜語䦨趙曰楚詞有山鬼篇此山館乃楚地矣晉傳玄詩厨人進藿茹有酒不盈杯雞鳴問前館丗亂敢求安迴棹趙曰此公厭衡山之􅀬峴山之凉欲迴棹而往蓋公本襄陽人也􅀫昔試安命趙曰莊子云知其不可奈何而安之若命自私猶畏天趙曰言雖私已自便而終不若小人之不畏天者也勞生繫一物趙曰人之勞生不兔繫着一物若利若名皆是矣爲客費多年衡岳江湖大鄭曰荆州記衡山南岳也周旋數百里髙四千一十丈蒸池疫癘偏趙曰蒸池按衡州衡陽縣云呉之臨蒸以蒸水名蒸池者其氣如蒸也鄭曰寰宇記衡州衡陽縣蒸水源出縣西如蒸山水經云蒸水岀重安縣南又東北至臨蒸至湘渭之蒸口散才嬰薄俗趙曰以閑散之才爲薄俗所嬰繞此同乎流俗之意有跡􅀒前賢趙曰賢者毎以跡爲累故以絶迹爲貴今有留滯之跡所以􅀒媿於前賢矣巾拂那􅀜眼趙曰巾拂所以莊肅形容之物那関眼則舟中放曠而不用矣瓶罍易滿船蘇曰洪嶠解宫去長沙臨嘆曰兒女滿眼歸無􅀒郭蒲舡瓶罍復何益於吾哉趙曰言飲之多也火雲滋垢膩洙曰淮南子曰旱雲煙火凍雨裛沉洙曰一作塵綿洙曰思玄賦凍雨霈其洒途注􅁀雨也強飯蓴添滑鄭曰強其亮切洙曰蓴見張翰後歸吳注端居茗續煎夢符曰右按茶錄潭邵之間渠江中有茶而多毒蛇猛獸郷人毎年採擷不過十五六斤其色如鐡芳草異常煎之無脚彼人所餉渠江者乃東平所出伊渠江密因狐假焉淸思漢水上凉憶峴山巔趙曰此在湘潭之詩最爲卑濕蒸􅊊之處故淸思漢水而凉憶現山也公本襄陽人豈懷化之語乎順浪飜堪􅀝洙曰江賦水夷􅀝浪以傲睨迴帆又省牽吾家碑不昧洙曰杜預沉碑峴山之下王氏井依然洙曰王粲宅有井几杖將衰齒茅茨􅀉短椽灌園曽取適遊寺可終焉遂性同漁父洙曰屈原莊子皆有漁父篇成名異魯連洙曰史記田單屠聊城㱕而言魯連欲爵之魯連逃隱於海上曰吾與冨貴而詘於人寧貧賤而輕丗肆志焉趙曰如滄浪之漁父不求名聞畨異魯仲連蓋仲連却秦軍下燕城雖不受封猶爲取名也篙師煩爾送鄭曰篙姑勞切朱夏及寒泉趙曰語篙師云煩爾送我一去猶於朱夏之際趂及寒泉之爲可挹也豈却仍往峴乎行次古城店泛江作不揆鄙拙奉呈江陵幕府諸公老年常道路遲日復山川白屋花開裏洙曰王莽傳延士不及白屋師古曰白屋謂庶人以白茅覆屋也沈約開花巳匝樹􅀌城麥秀邊洙曰宋丗家箕子朝周過故殷墟城毀壞生禾􅁰箕子傷之欲哭則不可爲其近婦人乃作麥秀之詩以歌詠之其詩曰麥漸漸􅀆禾麥油油􅀆彼狡童兮不與我好􅀆所謂狡童者紂也殷民聞之皆爲流涕向子期思舊賦歎􅁰離之閔周悲麥秀於殷墟濟江元自闊趙曰濟者濟渉之濟至江陵則江闊矣下水不勞牽風蝶勤依槳趙曰蝶欲泊槳上也春鷗􅂴避船王門髙德業洙曰鄒陽曰何王之門不可曳長􅅂乎陸韓卿王門所以貴自古多俊人幕府盛材賢洙曰蔡邕薦邊讓於何進曰伏惟幕府初開愽選淸英行色兼多病蒼茫汎愛前洙曰孔子汎愛衆舟中出江陵南浦奉􅀉鄭少尹番更欲投何處飄然去此都洙曰賈􅁩何必懷此都形骸元土木洙曰土木形骸龍章鳯姿舟楫復江湖社稷􅆞妖氣洙曰左太冲姦回贔兵纒紫微干戈送老儒百年同棄物萬國盡窮途洙曰見今日暮途窮注修可曰阮籍云途窮能無慟也雨洗平沙淨天衘闊岸紆鳴螿隨汎梗趙曰螿音將蟬也螿得梗而託之故隨汎梗而鳴別燕赴秋菰洙曰宋玉燕翩翩其辭歸蘇曰螿資良反蟬屬郭林宗如寒螿隨泛梗固亦難安李充云别燕背人去双起秋浦菰趙曰菰彫胡也燕集於菰叢之間時當秋而别之而起去矣棲託難髙卧洙曰孔明髙卧南陽蘇曰胡蕭年來托食􅀉棲區區卑折難得髙卧雲崦下視車馬趙曰言其身方有棲託難於髙枕以自安也飢寒迫向隅洙曰前漢刑法志滿堂飲酒一夫向隅而泣寂寥相喣沫洙曰莊子与其相喣以濡相濡以沬孰若相忘於江湖浩蕩報恩珠洙曰漢武帝昆明之池去魚後衘明珠報之又隨矦見傷蛇以藥封之蛇衘明珠以報溟漲鯨波動洙曰謝靈運溟漲無端倪衡陽鴈影徂洙曰蜀都賦云候鴈衘蘆木落南翔水泮北徂又應徳璉將就衡陽棲南征問懸榻洙曰陳蕃爲樂安太守禮郡人周璆字而不名特爲置一榻去則懸之東逝想乗桴洙曰語乗桴浮于海濫竊商歌聽洙曰北山移文竊吹草堂濫巾北岳七啓云此寗子啇歌之狀時憂卞泣誅洙曰楚人卞和以玉璞三獻不遇楚王遂再刖其足經過憶鄭驛洙曰鄭莊置驛斟酌旅情􅀌趙曰言鄭監必度我旅情之􅀌曉發公安數月憇息此縣北城擊柝復欲罷洙曰易重門擊柝孟子抱􅀜擊柝哀七年傳魯擊柝聞於邾東方明星亦不遲洙曰晉傳云東方大明星光影照千里詩東方云東有啓明西有長庚注曰旦出謂明星爲啓明日旣入謂明星爲長庚庚續也箋云啓明長庚皆有助日之名而無實光釋文云明星謂之啓明孫炎曰明星太白也出東方髙三舎今曰太白矣長庚不知是何星也或一星出在東西而異名或二者别星未能審也鄰雞野哭如昨日蘇曰張禹鄰雞􅂘野廐馬嘶風起坐拊髀望郷長嘆趙曰鄰雞聲巳傳物色生態洙曰一作生生能幾時洙曰顔延年日暮行樂歸物色桑榆時蘇曰張琯眼前物態生計夫能幾時何苦區區錙銖計較哉舟楫眇然自此去蘇曰鍾繇駕松舟檜楫眇然下驚波而去江湖逺適無前期洙曰沈休文别范安咸平生少年分手易前期趙曰無前期謂不知所止此門轉眄已陳迹洙曰王羲之俛仰之間巳爲陳迹藥餌扶吾隨所之洙曰謝靈運游南亭詩藥餌情所止衰疾忽在期泊岳陽城下江國踰千里山城僅百層洙曰顔延年賦臨廣望坐百層岸風翻夕浪舟雪灑寒燈洙曰謝惠連遇風詩落雪灑林丘留滯才難盡洙曰管輅曰酒不可極盡吾欲持酒以禮持財以愚何患之有也史太史公自序太史公留帶周南趙曰任昉晚節著詩欲傾沈約用事過多辭不得流便於是有才盡之談也艱危氣益増洙曰漢馬援曰大丈夫窮當益堅老當益壯蜀廖立見廢爲民從於汶山而志氣不衰趙曰史云懦夫増氣舊引馬援老當益壯爲旁似矣圖南未可料變化有鯤鵬洙曰莊子北􅁳有魚其名爲鯤鯤之大不知其幾千里也化而爲鳥其名爲鵬鵬之背不知幾千里也又云背􅀒靑天而莫之夭閼焉而後乃今將圖南也趙曰公方儘南而往所以及圖南之義纜船苦風戲題四韻奉簡鄭十三郎判官泛東岸朔風疾天寒鶬鴰呼洙曰爾雅鶬鴰麋注今呼鶬鴰西都賦烏則鶬鴰汎浮往來漲沙霾草樹洙曰白希範詩森森荒樹齊析析寒沙漲舞雪渡江湖洙曰古詩扁舟載風雪半夜渡江湖定功曰鮑昭効劉公幹躰云一風吹朔雪千里度龍山集君􅘸臺下飛舞兩楹間吹㡌時時落洙曰孟嘉傳嘉爲􅁊温叅軍旣和而正温重之九月九日温遊龍山叅僚畢集時佐吏並著戎服有風吹嘉㡌落墮温謂左右及賔客勿言且以􅀚其舉止維舟日日孤洙曰詩汎汎楊舟紼纚維之尔雅諸矦維舟因聲置驛外趙曰題是簡鄭十三判官故使鄭莊置驛也爲覔酒家壚洙曰司馬相如傳文君當壚郭璞曰壚酒壚師古曰賣酒之處累土爲壚以居酒瓮四邊隆起其一面髙形如鍜壚故名壚耳而俗之學者皆爲當壚爲對温酒火壚失其義矣晉阮藉傳公邑家婦有美色當壚沽酒阮與王安豐常從婦飲酒阮醉便眠婦側夫不疑之伺察終無它意王濬冲爲尚書令著公服乗軺經黃公酒壚中過顧謂後車客曰吾昔與嵇叔夜嗣宗共酣飲此壚竹林之遊亦預其未自􅄞生夭阮公亡便爲時所羈綑今日覩此雖近邈若山河過南嶽入洞庭湖洪波忽爭道岸轉異江湖趙曰僕甞愛此爭道字􅁍用於洪波之下可謂竒矣鄂渚分雲樹衡山引舳艫洙曰屈原九章乗鄂渚而返顧漢武紀舳艫千里李斐曰舳舩後持拖處也艫舩頭刺櫂處也言其舩多前後相衘千里不絶師古曰軸音軸艫音盧鄭曰說文云舳舟尾艫舟前也翠牙穿裛槳碧節吐寒蒲趙曰槳字在韻書音奬云所以隱舩曰槳今詳其義乃菰蔣之蔣耳蓋蒲有節而槳有呀也病渴身何去春生力更無壤童犂雨雪漁屋架泥塗欹側風㠶滿微􅁳水驛􅀌悠悠廻赤壁趙曰赤壁在夏口之東武昌之西鄭曰盛弘之荆州記曰薄沂縣㳂江一百里南岸名赤壁周瑜破魏武於烏林赤壁東西一百六十里浩浩略蒼梧趙曰蒼梧在洞庭西南之地乃永州也帝子留遺恨曹公屈壯圗洙曰屈平九歌湘君云帝子降兮北渚目􅆌眇兮愁予史記舜南廵狩崩於蒼梧之野葬於江南九疑是爲零陵禮記曰舜葬蒼梧二妃不從後漢献帝紀建安十三年曹操自爲丞相南征劉表表卒少子琮立以荆州降操以舟師伐孫􅁠􅁠將周瑜敗之於烏林赤壁周瑜傳曹公入荆州劉琮㪯衆降曹公得其水軍舩歩兵數十萬􅀅士聞之皆恐􅁠延見羣下問以計䇿議者咸曰不如迎之瑜曰不然操雖託名漢相其實漢賊也操自送死而可迎之耶瑜請得精兵三萬人進往夏口保爲將軍破之􅁠曰老賊欲廢漢自立乆徒忌二􅀽吕布劉表與􅀌耳今數雄巳滅惟􅀌尚存與老賊􅀔不兩立君言當擊甚與􅀌合此天以授孤也遂共圖計逆曹公遇於赤壁大破之曹公敗退還保南郡備與瑜等復共追之曹公留曹仁等守江陵城徑自北歸聖朝光御極殘孽駐艱虞才淑隨厮養洙曰前漢蒯通傳隨厮養之役者失萬乗之􅁠守儋石之禄者闕卿相之位張耳傳厮養卒蘇林曰厮取薪者名賢隱鍜鑪鄭曰鍜都玩切小治也趙曰句通義此言上雖復長安七八年矣而吐蕃猶未息是爲駐留艱虞於此才淑之人有隨厮養者名士之賢有隱鍜鑪者􅄞康􅀄居貧嘗與向秀共鍜於支樹之下以自贍給邵平元入漢洙曰前漢蕭何傳陳豨反髙祖自將至邯鄲而韓信謀反關中吕后用何計誅信上聞誅信使使拜何爲相國益封五千户令卒五百人一都尉爲相國衛諸君皆賀邵平者故秦東陵矦秦破爲布衣貧種􅀲長安城東􅀲美故丗謂東陵􅀲平謂何曰禍自此始矣上暴露於外而君守於內非􅀍矢石之難而益君封置衛者以今者淮隂新反於中有疑君心夫置衛衛君非所以寵君願君謝封勿受悉以家財佐軍何從其計上大恱師古曰召讀曰邵趙曰公以其身不得歸長妄此所以自嘆其不如也張翰後歸呉洙曰晉書文􅁐傳張翰字季膺呉郡呉人晉齊王囧辟爲大司馬東曹􅁺翰因見秋風起乃思呉中菰米蓴羮鱸魚鱠曰人生責得適志何能羈官數千里以要名爵乎遂命駕而歸人皆謂之見幾趙曰公以南下之遲肖似其歸晩也莫怪啼㾗數危檣逐夜烏洙曰檣掛㠶木也郭璞萬里連檣趙曰檣上爲刻烏以瞻風也謂之烏則相逐同行之船矣隂鏗詩檣轉向風烏􅀫靑草湖洞庭猶在目靑草續爲名夢符曰右按岳州圖經洞庭湖在縣西南一里荆州記云巴陵南有青草湖與洞庭湖相連周迴數百里日月出没其中水經注曰沅水注洞庭湖中㑹於江山鄭曰十道志在岳州荆州記因靑草山爲名周回八百里范注荆州記靑草湖夏月直渡百里日月岀於湖中呉録地志巴陵有靑草湖蓋洞庭本􅃌具縣南所謂太湖是也􅀫槳依農事趙曰此言楚人於湖中種田故船槳所􅀫之處依之也郵籖報水程趙曰舟中所用以知時也漏籌謂之郵籖古詩雞人司漏轉更籖寒氷爭􅀝薄雲月遞微明湖鴈􅀟􅀟起人來故北征洙曰九歌云駕飛龍􅀆北征邅吾道􅀆洞庭趙曰未有念郷之意鴈乃北征人之不如也􅀫白沙驛洙曰􅀄過湖南五里水宿仍餘照洙曰謝靈運入彭蠡湖口作客游倦水宿風湖難具論人煙復此亭驛邊沙舊白湖外草新靑萬象皆春氣􅀌槎自客星洙曰愽物志曰仙查犯牛斗客星於蜀郡問嚴君平隨波無限月蘇曰景差湘江辭云隨液無限月愁殺獨醒人望月奠蘭醴流淚沾衣巾的的近南溟洙曰莊子鵬鳥海運則將徙於南溟南溟天池也趙曰月色之明的也野望納納乾坤大行行郡國遥洙曰古樂府行行重行行雲山兼五嶺洙曰服䖍曰嶺有五因以爲名交阯合浦果有此嶺陸機從軍行南渉有五嶺巔魯曰陸機贈顧交阯詩代鼔五嶺表張耳傳南有五嶺之戍蒼舒曰右按秦始皇畧定楊越謫戍五方南守五嶺塞上嶺一也􅀐歸嶺二也都寵嶺三也略緒嶺四也越城嶺五也自北徂南入越之道必由嶺焉師古曰嶺者西自衡山之南東窮于海一山之限耳而摽名有五焉黄曰裴氏廣州記曰大􅁃始安臨賀桂陽掲陽是五嶺何曰鄧德明南康記曰大􅁃嶺一桂陽甲􅀐嶺二九真都龐嶺三臨賀萌緒嶺四始安越嶺五風壤帶三苗洙曰舜典竄三苗于三危注三苗國名縉雲氏之後爲諸矦饕餮三危西裔昭元年說自古諸矦不用王命者虞有三苗夏有􅀚扈野樹侵江闊春蒲長雪消趙曰蒲長於雪消之後扁舟空老去無􅀘聖明朝入喬口洙曰長沙北界漠漠舊京逺洙曰陸機樂府街巷紛漠漠盧諶詩南望舊京路遲遲歸路賖殘年傍水國洙曰周礼水國用龍節顔延年詩水國周地險落日對春華樹蜜早蜂亂田曰樹蜜椇也崔豹古今註曰椇一名樹蜜一名木􅄳實形拳曲核在實外荆湘多此木子美所以記土地之所有也師曰樹蜜椇也或作枸髙大似白楊多枝而曲飛鳥喜巢其上所謂止椇來巢是也而說者謂蜜當作密非也若望兠率寺詩云樹宻當山徑江深隔寺門自當作宻江泥輕鷰斜賈生骨巳朽悽惻近長沙洙曰前漢賈􅁩傳天子議以􅁩在公卿之位絳􅈅東陽矦馮敬之屬尽害之廼毀􅁩曰雒陽之人年少􅀄斈專欲擅􅁠紛乱諸事於是天子後亦踈之不用以誼爲長沙王􅀓􅁩既謫去意不自得及渡湘水爲賦以弔屈原後梁王勝墮馬死􅁩自傷爲傳亡狀常􅂘泣後􅀊餘亦死老子曰其人與骨皆巳朽矣銅官渚守風趙曰潭州長沙傳有銅官山云楚鑄錢處則此渚乃以是得名乎鄭曰寰宇記銅官山在湘縣南一百一十八里與長沙分縣界不夜楚㠶落避風湘渚間水耕先浸草春火更燒山早泊雲物晦逆行波浪慳飛來􅀟白鶴過去杳難攀洙曰漢武詔火耕水耨應劭曰燒草下水種稻益生髙七八寸因悉芟去復下水􅈅之草死獨稻長所謂水耕歐曰古樂府虞丗南飛來双白鶴􅁬翼逺雲煙俱棲集此地一㪯背淸田師曰呉兢樂府古題要解曰艶歌何甞行亦曰飛鶴行古調云飛來􅀟白鶴乃從西南來又右樂府載飛來􅀟白鶴三篇梁元帝云時從洛浦渡飛向遼東來皆過去難攀之意也北風洙曰新東江口信宿方行春生南國瘴氣待北風蘇向晚霾殘日洙曰詩終風且霾釋文云風而雨土爲霾孫炎曰大風􅀭塵生從上下趙曰言晚之後蒸鬱也所以生瘴尓雅曰風而雨土爲霾實言昬曀之狀也初宵鼔大鑪洙曰莊子大宗師以天地爲大鑪王粲師傳鼔洪鑪以燎毛髪爽携卑濕地洙曰前漢長沙定王發以其母唐兒微无寵故王卑濕貧囯賈􅁩傳􅁩旣以謫居長沙卑濕􅁩自傷悼乃爲賦也聲拔洞庭湖趙曰言風之淸爽雄大如此也萬里魚龍伏三更鳥獸呼趙曰魚龍懼而丗南死後无人可論書徴曰禇遂良下筆道勁甚得王羲之躰太宗即日召令侍書太宗甞出御府金帛購求羲之書迹天下爭齎古書詣闕以献當時莫能卞其眞僞遂良備論所岀一无舛誤永徽元年髙宗將廢皇后王氏立昭儀武氏爲后遂良極諌以爲不可致笏於殿陛曰還陛下此笏仍解巾叩頭流血帝怒令引出翌日李勣奏曰此乃陛下家事不合問外人帝乃立武昭儀爲皇后左遷遂良潭州都督顯􅂟三年爲爱州刺史桓譚以楊雄爲絶倫名髙前後事回首一傷神􅀟楓浦輟棹靑楓浦􅀟楓舊巳摧洙曰招䰟云湛湛江水􅀆上有楓阮藉詩云湛湛長江水下有楓樹林趙曰此詩題是􅀟楓乃實道其事而舊引江水湛湛􅀆上有楓有失杜公意自驚衰謝力不道棟梁材趙曰如楶稅之材不荷棟梁之任也浪足浮紗帽皮須截錦苔趙曰今欲乗此楓泛江而上天於此戴紗帽而浮其上則浦水之浪自足浮之楓皮上有苔蘇不能不滑故須截去錦苔而後可乗也江邊地有主暫借上天廻趙曰此用乗槎事也詳見上註登舟將適漢陽春宅弃汝去趙曰公二月到潭州因居焉則自春所有之宅名之曰春宅秋帆催客歸趙曰將歸秦庭也庭􅂼尚在眼浦浪巳吹衣蘇曰馬季良渡江賦云浦浪洒濯蘋風吹不江淹云浦浪輕花泛沙風吹客衣生理飄蕩拙夢符曰右按南華眞經莊子之楚見髑髏髐然有形撽以馬捶因而問之曰夫子貪生失理而爲此乎蘇曰呉産飄蕩牢落拙治生計幾爲人􅀏吾以媿於朋友何日反故山采􅂎菊枕石潄泉遂此麋鹿之性有心遲暮違趙曰遲暮晩年也楚詞傷美人之遲暮中原戎馬盛逺道素書稀修可曰古詩呼兒烹鯉魚中有尺素書塞鴈與時集檣烏終歳飛趙曰帆檣之上刻爲烏形取其占風鹿門自此往洙曰見應有鹿門注趙曰龐徳公携妻子隱於鹿門永息漢隂機洙曰見上煑井復注舟中風餐江柳下雨卧驛樓邊洙曰如宋鮑昭詩風餐弄松栢雲卧恣天行蘇曰阻風餐柳下值雨坐蓬䆫句法絶妙不知誰詩也恨不見全篇與魯直讀至此遂記而䟽之疑子美亦法此二句而作也其詩二句在晉文􅀋中結纜排魚網趙曰言結䌫之處有魚網相排也連檣並米船洙曰檣船上帆竿今朝雲細薄昨夜月淸圎飄泊南庭老秪應學水仙趙曰公自謂也南庭者南方之庭猶北地謂之北庭耳南征春岸桃花水洙曰謝靈運詩海鷗戲春岸􅁃信旱春詩流水桃花色春州杜若香趙曰韓詩章句曰溱與洧方渙渙􅀆謂三月桃花水下雲帆楓樹林洙曰招䰟云湛湛江水􅀆上有楓阮籍詩湛湛長江水上有楓樹林偷生長避地洙曰李陵書曰陵豈俞生之士語賢者避丗其次避地適逺更霑􅁭洙曰四愁詩側身南望涕沽襟王仲宣詩逺身適荆蛮老病南征日洙曰招䰟曰洎吾南征趙曰公言其將楚適也君恩北望心洙曰四愁詩側身北望涕沾巾趙曰公旣有京兆功曹之命爲領君恩矣所以北望長安也百年歌自苦未見有知音洙曰古詩人生不滿百常懷千嵗憂又云不愁歌者苦但傷知音稀師曰峽人以二月桃花發時春水生謂之桃花水水漲可以下峽甫自蜀南征呉楚故趂桃花水楚岸多楓樹乆客羈旅知交態洙曰鄭當時傳翟公大書其門曰一死一生乃知交情一貧一冨乃知交態一貴一賤交情乃見淹留見俗情􅂫曰張遼漂泊淹留始見丗俗人情炎涼俯仰皆時丗躰態仁者必不爲也衰顔聊自哂小吏最相輕蘇曰何晏見梁王王不爲禮晏叱曰小吏何敢侮予去國哀王粲洙曰王沖宣七哀詩西京亂無象豺虎正遘患復弃中國去逺身適荆蛮傷時哭賈生洙曰賈􅁩上書言時事云可爲痛􅂘者一可爲流涕者二可爲太息者六狐狸何足道豺虎正洙曰一作亂縱橫洙曰孟陽七哀詩季葉䘮亂起盗賊如豺虎張綱傳豺狼當路安問狐狸趙曰時吐蕃之亂未息也逺遊江闊浮髙棟雲長出斷山塵沙連越嶲夢符曰右按唐地理志劒南道蓋古梁州之域蜀郡廣漢犍爲越嶲益州牂柯巴郡之地惣爲鶉首趙曰以吐蕃之兵未息也風雨暗荆蠻鴈矯衘蘆内洙曰淮南子曰鴈從風而飛以愛氣力衘蘆而飛以避矰繳張華賦又矯翼而増逝徒衘蘆以避繳終爲戮於此丗猿啼失木閒洙曰見哀哀朱木狖弊裘蘇季子歷國未知還洙曰􅂫秦說秦書十上而說不行黒貂裘色敝仲尼歷聘諸國客夜客睡何曽著秋天不肯明洙曰魏文帝行旅詩曰漫漫秋夜長烈烈北風凉展轉不能寐披衣起彷徨入簾殘月影髙枕逺江聲師曰甫此二句正旅中睡不着之時因思計拙途窮計拙無衣食途窮仗友生洙曰見今日暮途窮注詩伐木不如友生趙曰顔延年詠阮籍詩途窮能無慟老妻書數紙應悉未歸情客亭秋䆫猶曙色木落更天洙曰一作髙風日出寒山外江流宿霧中聖朝無弃物蘇曰王祥聖丗物無大小皆料材適用無弃擲者老病巳成洙曰一作衰翁多少殘生事飄零似轉蓬晚行口號三川不可到洙曰時三川在賊境左傳周之亡也其三川震注涇渭洛水也趙曰三川鄜州縣名也地理志云注華池水黒水洛水所㑹故謂三川舊注引西周三川却是說長安矣不知其名偶同昡惑學者矣歸路晩山稠師曰山重疊也落鴈浮寒水飢烏集戌樓洙曰戍樓防戌之樓也人欲逺望故作樓趙曰此言地經䘮亂寂乎無人而然也師曰言兵敗散亂故烏集之市朝今日異蘇曰江惣亂後歸金陵過秦淮覽物彷徨長漢市朝人情異於􅇮曰本中曰謂經亂風物變也䘮亂幾時休逺愧梁江惣還家尚黒頭洙曰江惣在陳掌東宫管記與太子爲長夜飲後主即位授尚書今京城䧟入隋爲上開府復歸老江南地隅江漢山重阻風雲地一隅洙曰李陵詩風波一失所各在天一隅年年非故家三川艱窶彌年需弱至餓死者比聞同罹禍殺戮到雞狗蘇曰黃巾犯渭上雞犬俱殺戮盡數千里断絶人煙山中漏茅屋誰復依户牖摧頽蒼松根地冷骨未朽蘇曰弔王褒文云西山地冷靈骨未朽秀氣矗然君旣長卧復鐘後賢其碑断裂不見完本幾人全性命盡室豈相偶嶔岑鄭曰上去今切下鋤針切猛虎傷鬱結回我首洙曰陸機飢食猛虎窟􅁃信小園賦穿漏􅀆茅茨自􅀉一封書今巳十月後趙曰十月後非冬之十月也何以明之公往問家屋乃在閏八月􅀄吉耳此詩在閏八月之前所作也反畏消息來寸心亦何有漢運初中興洙曰凡王室中否而再興謂之中興如周之宣玉漢之光武唐之中宗是生平老躭酒洙曰齊桓好酒魏曹植賦曰若躭于觴酌流情縱佚先王所禁君子所失霍光傳昌邑夜飲湛􅃆於酒師古曰湛讀曰沉又讀曰躭􅃆荒迷酒也沈思歡㑹處恐作窮獨叟師曰孟子云老而無子曰獨自京赴奉先縣詠懷五百字洙曰天寳十四載十一月􅀄作奉先屬京兆郡縁皇家陵寢武后分置醴泉縣鄭曰唐開元四年改同州蒲城爲奉先以奉睿宗橋陵師曰甫時妻子在奉先縣故甫往省家焉禄山反作此杜陵有布衣老大意轉拙洙曰前漢地理志杜陵屬長安京兆尹注古杜伯國有周將軍杜主祠四所漢宣帝葬此因曰杜陵長安南五十里布衣韋帶之士古詩老大徒傷悲趙曰杜陵公所居之地也許身一何愚竊比稷與契洙曰孔子竊比於我老彭蘇曰子美自許稷與契人未必許也然其詩云舜舉十六相身閑道與髙秦時用商鞅法令如牛毛此是稷契軰口中語也居然成濩落洙曰莊子瓠落無所容猶郭落也落零落也濩胡落切昱曰生民詩居然生子白首甘契闊洙曰擊鼓詩死生契闊與子成說毛氏曰契闊勤若也陸士衡贈弟士龍詩安得携手俱契闊成騑服贈盧諶契闊豈但一魏武契闊談讌心念舊思陸機契闊踰三年蓋棺事則已大臨曰劉毅云丈夫兒蹤跡不可㝷常便混羣小中蓋棺事方定矣趙曰韓詩外傳載孔子云學而不已闔歌乃止此志常覬豁鄭曰覬几利切幸也窮年憂􅀺元嘆息腸洙曰一作腹内熱洙曰荀子窮年卒􅀊賈􅁩曰百姓􅀺元輯於下孟子不得於君則熱中謝靈運詩窮年迫憂患趙曰莊子我其內􅀬歟取􅀏同學翁浩歌彌激烈洙曰蘇武長歌正激烈中心愴以摧非無江海志瀟洒送洙曰一作迭日月洙曰沈休文纓珮空爲累江海事多違莊子身居江海之上心游魏闕之下江淹江海從邅廻趙曰莊子曰就藪澤處間曠釣魚間處無爲而巳此江海之士避丗之人間暇者之所好也可以見江侮志之義矣生逢堯舜洙曰一作爲君不忍便永訣洙曰江淹賦誰能寫永訣之情者乎當今廊廟具構夏豈云缺洙曰叔孫通傳賛廊廟之材非一木之枝帝王之功非一士之略潘岳詩廊廟惟淸俊潘尼詩廣厦構衆材又大厦須異材廊廟非庸器潘安詩器非廊廟姿屢出固其宜葵藿傾太陽物性固莫洙曰一作難奪洙曰曹植求通親親表若葵藿之傾太陽雖不爲回光然向之者誠也臣竊自比葵藿若垂三光之明實在陛下陸機園葵詩朝榮東北傾夕頴西南晞梁劉孝綽詠日詩園葵一何幸傾葉奉離光顧惟螻蟻輩但自求其穴胡爲慕大鯨􅂺擬偃溟渤洙曰木􅀇虚海賦其魚則横海之鯨突杌􅀌逰戞巖㟼偃髙濤趙曰韓非子千丈之堤以螻蟻之穴漬求其穴言當自安分求穴以安耳何爲必欲慕學大鯨之處大海乎晁曰􅀶物志鯨魚大者數十里以兹悟生理獨恥事干謁兀兀遂至今忍爲塵埃没終愧巢與由􅄯曰巢父許由也未能易其節沉飲聊自遣放歌頗愁絶洙曰顔延年詠劉叅軍詩韜精日沈飲誰知非荒宴􅀊暮百草零疾風髙岡裂洙曰張平子賦孟冬作隂寒風肅殺氷霜􅃤裂百卉具零長門賦天飄飄而疾風李陵詩邊上􅃤裂阮籍詩寒風掁山岡天衢洙曰易何天之衢亨隂崢嶸客子中夜發洙白鮑明逺舞鶴賦嵗崢嶸而催暮江淹詩客子淚巳零王粲詩客子多悲傷涙下不可収魏文帝詩客子常畏人霜嚴衣帶斷指直不得結凌晨過驪山御榻在嵽嵲洙曰西京賦託喬基於山岡直嵽霓以髙居驪山温湯􅀶物志凡水源有石磂黄其泉則温漢武帝故事云驪山温湯􅀄秦始皇砌石起室漢武帝又加修飾唐置温湯監􅀠司農寺監丞常湯浣器物又所貯草栗脩葺調以備供奉乃種􅀲􅂼隨時貢奉矣􅃖尤塞寒空蹴踏崖谷滑鄭曰蹴七六切蹋也洙曰黃帝玄女之宫戰法曰黃帝與􅃖尤對九戰九不勝三日三夜天霧冥􅁳史黃帝殺􅃖尢於涿鹿後冢上常有赤氣出如匹絳帛民呼爲􅃖尤旗又星名趙曰自此下言温湯之事也御榻指言明皇御幸之榻也嵽音徒結切嵲音齧玉篇云嵽嵲小而不安貌􅃖尤乗輿前導之旗也塞寒空而蹴踏崖谷言其多也舊注乃引􅃖尤之戰又指爲星名是非瑶池氣鬱律羽林相摩戞洙曰周穆王天子傳穆天子觴西王母于瑶池之上漢宣帝紀羽林孤兒注天有羽林大將軍之星林諭若林木之盛羽若羽翼鷙擊之意故以武名焉張平子西京賦隱轔鬱律江賦氣滃渤以霧杳時鬱律其如煙沈約詩鬱律構丹巘趙曰羽林扈駕之車也其所樹之如林故言相摩戞君臣洙曰一作聖君留懽娯洙曰晉張景陽詩昔在西京時朝野多􅂬娯沈休文詩秦皇御宇宙漢帝恢武功􅂬娯人事盡情性猶未充謝靈運詩副君命飲讌􅂬娯寫懷抱江淹詩太平多􅂬娯飛蓋東都門樂動殷樛嶱修可曰當作膠􅁑相如子虚賦張樂乎膠􅁑之㝢注曠逺深貌則膠􅁑誤爲樛嶱明矣曽曰甘泉賦其相膠轕蓋亂貌賜浴皆長纓洙曰江淹詩朱黻咸髦士長纓皆俊人陸機詩輕劒排擊厲長纓麗且鮮與宴洙曰一作讌非短􅄄彤庭所分帛本自寒女出洙曰謝玄暉直中書省詩彤庭赫弘敞謂禁中庭多赤色郭㤗機詩皎皎白素絲織爲寒女衣寒女雖妙巧不得秉杼機趙皇后傳庭中彤朱而殿上髹漆西都賦玉堦彤庭西京賦彤庭輝輝趙曰彤庭天子之庭以丹飾之也鞭撻洙曰一作箠其夫家聚歛貢城闕聖人筐篚恩實洙曰一作願欲􅀖國活洙曰鹿鳴又實幣帛筐篚以將其厚意逸曰南史王廣之子珍國字德重爲南淮太守郡境若飢乃發粟散財以振窮乏髙帝手敕云卿愛人活國甚副吾意臣如忽至理君豈弃此物多士盈朝庭仁者冝戰慄洙曰詩濟濟多士又發言盈庭語使民戰慄趙曰上句皆申戒之辭謂當君王賜予之幣帛岀於寒女之夫鞭撻所貢冝戰慄而求活國之事然後爲仁也况聞內金盤盡在衛霍室洙曰内金盤上方器用也衛霍室勲臣家也後漢皇后紀郭况后弟賞賜金錢縑帛豐盛無比京師號况家爲金穴江淹詩常學衛將軍趙曰衛霍皆以后戚而貴蓋以比楊國忠輩矣中堂有神仙煙霧蒙玉質洙曰江淹願作秦王女乗鵉向煙霧舞鶴賦煙交霧凝若無毛質煖客洙曰一云煖蒙貂䑕裘洙曰說文貂䑕也而文黃出丁零國魏書曰鮮卑有貂鼠子皮毛柔軟故天下爲裘廣志曰貂出扶餘挹婁也悲管逐清瑟勸客駞蹄羮􅂫曰陳思王製駞蹄羮一甌費千金自勸陳琳劉公幹輩食後號爲七寳羮霜橙壓香橘洙曰撜出穰縣者勝蜀中有給客橙似橘而非若柚而香朱門酒􅁏􅆨路有凍死骨洙曰孟子庖有肥􅁏廐有肥馬民有飢色野有餓莩又曰狗彘食人食而不知檢塗有餓莩而不知發丗說劉尹問竺法深曰道人何得㳺朱門蘇曰吴起朱門大路酒􅁏􅆨不可過焉知凍死者盈路餓而填溝壑者不忍視榮枯咫尺異惆悵難再述北轅就涇渭官渡􅅬曰官渡地名曹操􅀽紹相持之處又改轍羣水從西下極目髙崪兀疑是崆峒來恐觸天柱折洙曰列子湯問共工氏與顓頊爭爲帝怒而觸不周之山折天柱絶地維故天傾西北日月星辰就焉地不滿東南故百川水潦歸焉史記黃帝西至于崆峒韋昭曰在隴右趙曰直比爲崆峒山之流來將觸天柱此詩人張大之􅀔也河梁幸未拆枝撑聲窸窣鄭曰上息七下􅂫骨切行旅相攀援鄭曰干元切引也川廣不洙曰一作且可越洙曰古詩携手上河梁老妻旣異縣十口隔風雪洙曰古樂府他郷各異縣展轉不相見誰能夕不顧庶往共飢渇入門聞號咷鄭曰上胡刀切下徒力切㓜子飢洙曰一作餓已卒洙曰易同人先號咷後􅀏吾寧捨一哀里巷猶嗚咽所愧爲人父無食致夭折豈知秋未洙曰一作禾登貧窶有倉卒洙曰終窶且貧生常免租稅名不􅀠征伐撫迹猶洙曰一作獨酸辛平人固騷屑洙曰劉越石備辛酸之苦阮籍詩感􅁣懷辛酸黙思失業途洙曰一作徒因念逺戍卒憂端齊洙曰一作際終南澒洞不可掇鄭曰澒胡孔切掇都活切洙曰魏武帝詩明明如月何時可掇趙曰憂與終南山齊則憂之積而髙大如此淮南子曰未有天地之時鴻􅄥鴻洞莫知其門師曰甫念彼逺戍之兵其積憂悶與山齊高柰天下澒洞未可遽掇而絶之也鴻洞亂貌壯遊魯曰按新史本傳言公少貧不自振客齊趙呉越間李邕竒其才先往見之師曰此篇叙壯年經遊之迹往昔洙曰又云往者十四五出遊翰墨􅂣洙曰阮籍昔年十四五志尚好書詩被褐懷珠玉顔閔相與期鮑明逺十五諷詩書篇翰靡不通趙曰謝宣逺賦張子房詩粲粲翰墨場斯文崔魏徒洙曰崔鄭州尚魏豫州啓心以我似班楊洙曰班固楊雄七齡思即壯開口詠鳯皇蘇曰張華五嵗能詩見􅀞鳯皇觀乆之客命詠之随口即成人皆嘆服九齡書大字有作成一囊性豪業嗜酒嫉惡懷剛腸修可曰嵇叔夜與山巨源書剛腸嫉惡輕肆直言遇事便發此不可二也脫略小時輩結交皆老蒼飲酣視八極俗物都茫茫洙曰􅄝酒注巳見􅄝酒見天真孔文舉薦禰衡表嫉惡若讎恨賦脫畧公卿跌宕文史東下姑蘇臺洙曰伍􅀍傳淮南王隂有邪謀被諌之曰昔子胥諌吴王呉王不用廼曰臣今見麋鹿游姑蘇之臺也張晏曰姑􅂫吳臺名也師古曰吴地記云因山爲名西南去國二十五里史呉丗家越伐吴敗之姑蘇越絶書曰闔廬起姑蘇臺三年聚材五年乃成髙見三百里吴都賦造姑蘇之髙臺臨四逺而時見巳具浮海航洙曰航大舟也到今有遺恨不得窮扶桑洙曰山海經大荒之中腸谷上有扶桑陸機前緩聲歌惣轡扶桑厎濯足陽谷皮王謝風流逺洙曰王戎謝安也闔廬丘墓荒洙曰闔廬呉王公子光也呉越春秋曰闔廬死葬於園西北名曰虎丘穿土爲川積壤爲丘發五都之士十萬人共治千里􅃁池西周深丈餘銅棺三重積水銀爲池池廣六十歩黃金珠玉爲鳬鴈之属扁諸之劒魚千腸在焉葬之三日白虎居其上故號虎丘劒池石壁仄洙曰劒也見上長洲芰荷香洙曰枚乗遺吴王書脩治上林雜以離宫積聚玩好圏中禽獸不如長洲之苑服䖍曰呉苑孟康曰以江水洲爲􅁐也韋昭曰長洲在東吴吴都賦帶朝夕之壻池佩長洲之茂􅁐鄭曰寰宇記云蘇州長洲縣縣吴長洲苑也嵯峨閶門北洙曰陸士衡吴越行吴越自有始請從閶門起閶門何峩峩飛閣跨通波清廟映廻塘洙曰文王之廟也修可曰按吴越春秋闔閭內傳云立閶門者以象天門通闔閭風立蛇門者以象地户清廟非文王之廟乃吴文皇帝孫和廟也子皓改葬和號明陵又分吴郡丹陽爲吴興郡置太守四時奉祠立寢堂號曰清廟每趨吳太伯撫事淚浪浪洙曰皇覽曰太伯􅃁在吴縣北海里聚去城十里吴太伯弟仲雍皆周太王之子而王季歷之兄也季歷賢而有聖子昌太王欲立季歷以及昌於是太伯仲雍二人犇荆蠻文身断髪示不可用避季歴季歷果立是爲王季而昌爲太子太伯之犇荆蠻自號勾吴荆蠻義之人從而歸之枕戈憶勾踐洙曰越王勾踐允常之子也旣逃㑹稽之恥反國苦身焦思曰汝忘㑹稽之恥耶出則甞膽卧則枕戈渡浙想秦皇洙曰秦始星紀十一月行至雲夢望祀虞舜于九疑山浮江下觀藉河渡海渚過丹陽至錢塘臨浙江水波惡乃西百二十里從狹中渡上㑹稽􅀕大禹望于南海而立石刻頌秦徳晉灼曰江水至㑹稽山隂爲浙江蒸魚聞匕首洙曰史刺客傳專諸吴堂邑人吴公子光之欲殺王僚也得專諸善待之後具酒請王僚使專諸置匕首魚腹中而進之以刺王僚僚巳死光自立爲王是爲闔廬除道哂要章洙曰朱買臣呉人也初買臣免待詔常從㑹稽守邸者􅀉居飲食及拜爲太守買臣衣故衣懷其印綬歩歸郡邸直上計時㑹稽吏方相與羣飲不視買臣買臣入室中守邸與共食食且飽少見其綬守邸輕之前引其綬視其印㑹稽太守章也守邸驚出語上計􅁺吏皆醉大呼曰妄誕耳守邸曰試來視之其故人素輕買臣者入内視之還走疾呼曰實然坐中驚駭曰守相推排陳引中庭拜謁買臣徐出户有頃長安厩吏乗駟馬車來迎買臣遂乗傳去㑹稽聞太守且至發民除道縣長吏並送􅼱車百餘乗入吴界見故妻夫妻治道買臣駐車呼令後車載其夫妻到太守舎置園中給食之居一月妻自縊死越女天下白蘇曰風俗記梁援曰天下之女白不如越溪之女肌晢鑑湖五月凉定功曰梁任昉述異記鏡湖丗傳軒轅氏鑄鏡湖邊因得名今有軒轅磨鏡石尚存石畔常㓗不生蔓草蘇曰郄詵曰憶前年五月泛鑑湖凉風吹面殊不識炎􅀬剡溪藴秀異洙曰晉宋間名士多起於此鄭曰剡溪縣名時再切師曰自東下姑蘇臺至此句謂遊吴越之地欲罷不能忘歸帆拂天姥洙曰謝靈運登聞海嶠詩暝投剡中􅀫明登天姥岺鄭曰姥莫古切在剡縣南八十里山名中􅀊貢舊郷洙曰按新史書傳甫少貧不自振客逰吴越齊趙間舉進士不第氣劘屈賈壘鄭曰劘莫婆切洙曰賈山傳賛賈山自下劘上屈原賈􅁩壘喻戰壘也孟康曰劘謂剴切之也蘇林曰劘音摩摩勵也目短曹劉牆洙曰目一作日賜之牆也及有故曰短也曹子建劉公幹文章也忤下考功第鄭曰忤五故切洙曰武德舊令考功貟外郎監試貢舉人貞􅀚巳來乃貟外郎專掌貢舉省郎之殊美者至開元中後貢舉於禮部獨辭京尹堂放蕩齊趙間裘馬頗清狂春歌叢臺上洙曰叢臺趙王之臺也在邯鄲鄒陽云全趙時武力鼎士􅕼服􅓜臺之下者一旦成市不能止幽王之湛患張平子楚架章華於前趙建叢臺於後冬獵青丘旁洙曰青丘地名鄭曰青丘千乗縣齊景公有馬千駟畋打青丘呼鷹皁洙曰一作紫櫪林逐獸雲雪岡射飛曽縱鞚洙曰鮑昭幽并重􅀐射少年好馳逐獸肥春草短飛鞚越平陸引臂落􅒗鶬洙曰引一云跋李廣長臂蘇矦據鞍喜洙曰蘇謂晉蘇預也夢符曰右按南史顔峻好􅀐馬遨里巷遇知舊􅂺據鞍索酒得必傾盡欣然自得忽如携葛強洙曰舉鞍問葛強何如并州兒師曰自放蕩齊趙間至此句謂遊齊趙之地快意八九年西歸到咸陽師曰按唐史甫少貧不自振客遊呉越還自舊郷以進士舉不中第遂遊齊趙間凡八九年復歸京師咸陽西京也許與必詞伯賞遊實賢王洙曰賞一作貴孟子賢王好善而忘勢曵􅅂置醴地奏賦入明光洙曰玄宗朝饗而甫獻大禮三賦楚元王敬申生置醴以代酒天子廢食召蘇曰嚴光見光武廢食召見羣公㑹軒裳脫身無所愛洙曰帝竒其材使待詔集賢命宰相試文章擢西河尉不拜痛飲信行藏黒貂不免弊洙曰蘇季不用於秦而黒貂裘弊班􅁂兀稱觴洙曰秋興賦班􅁂彪以承弁閑居賦稱萬壽以獻觴唐曰兀兀坐也杜曲晩􅂄舊洙曰晚一云換􅂄舊故老也四郊多白楊洙曰言死者衆也何曰白楊乃墳上之草也坐深郷黨敬何曰今復推邕爲長上故云云日覺死生忙朱門任傾奪劉曰朱門權貴也傾奪爭權也赤族迭罹殃洙曰任一云務􅀭子解嘲客徒欲朱丹其轂不知一跌赤吾之族劉曰謂誅三族國馬竭粟豆洙曰漢有大常三輔粟豆蘇曰伍子胥曰國無粟支凶年馬無豆秣越兵將至誰復勍敵見子胥廟記舉隅見煩費洙曰舉一隅則衆費可知矣引古惜興亡洙曰言引古以辨今則足以知其㒷亡而可痛惜者也河朔風塵起洙曰禄山起於河朔蘇曰呉壯河朔風塵澒洞儼狁跳梁况炎天非出師之時而又慮㓂吾畿甸田草農力旣奪必廢耕桑恐失人望岷山行幸長洙曰玄宗來幸蜀兩宫各警蹕萬里遥相望洙曰肅宗即位於靈武也崆峒殺氣黒少海旌旗黃禹功亦命子涿鹿親戎行洙曰以廣平王爲天下兵馬元帥王肅宗之子代宗也修可曰東宫故事天子比大海太子爲少海山海經曰無臯之山南望㓜海郭璞注云㓜海少海也淮南子云九州之外乃有八寅亦曰演澤東方曰太清曰少海或謂肅宗大子廣平王爲元帥故無少海詳觀此詩之意恐非是崆峒在西少海在東河朔風塵起岷山行幸長則東西南北皆不寧也禹功亦命子啓􅀾於甘之野正指太子爲元帥涿鹿親戎行蓋黃帝與􅃖尤戰􅃰鹿指肅宗親征翠華擁呉岳洙曰翠華太子羽葆也一螭虎噉豺狼鄭曰噉音淡蘇曰郡平秦鹿旣走螭蛟狼虎逓相食噉也􅀲牙一不中胡兵更陸梁洙曰房琯敗于陳濤也賊旣得志則愈陸梁矣大軍載草草韓曰草草辛苦貌凋瘵滿膏肓洙曰見沉沉二竪嬰注夢符曰右按春秋左氏傳秦使醫緩視晉矦疾曰肓之上膏之下攻之不可逹針之不可及藥不至焉不可爲也韓曰謂民困疲之甚備貟竊􅀘衮洙曰譏時相也房琯雖敗然非備貟憂憤心飛􅀭上感九廟焚洙曰天子九廟下憫萬民瘡蘇曰漢景一日不恱羣臣請問其故帝曰兵戈之後朕憫万民瘡痍未合不覺形于顔色羣臣皆惻然斯時伏靑蒲洙曰前漢史丹傳元帝欲易太子丹聞上獨寢直入卧內伏靑蒲上泣諌以靑規地曰靑蒲非皇后不得至此廷諍守御床洙曰王陵面折廷諍衛瓘託醉跪帝床前以手撫床曰此坐可惜君辱敢愛死洙曰主憂臣辱主辱臣死檀弓申生不敢愛其死赫怒幸無傷洙曰詩王赫斯怒聖哲體仁恕師曰自此句以下復叙肅宗収復京師宇縣復小康哭廟􅁅燼中鼻酸朝未央洙曰時天子収復京師先素服􅂘廟而後受朝小臣議論絶蘇曰崔宏陛下一言及四方蔽小臣訩訩之議論老病客殊方鬱鬱苦不展洙曰張平子鬱鬰不得志蘇曰東方朔鬱鬱不得展舒志氣羽翮困低昻秋風動哀壑碧蕙􅂢微芳洙曰陸士衡塘匕行江蘺生幽渚微芳不􅁕官四時逝不処䌓華難乆鮮淑氣与時殞餘芳隨風􅂢之推避賞從鄭曰去吉洙曰介之推從晉亡賞不及亦不言後避賞入山漁父濯滄浪洙曰漁父歌曰滄浪之水淸可以濯吾纓鄭曰浪音盧當切水名浪字雖重意殊不妨榮華敵勲業􅀊暮有嚴霜洙曰言勲業雖盛而不能損退如萬物􅀊暮不免嚴霜之患吾觀鴟夷子才格出㝷常蘇曰鄭康成才格逈出㝷常輩趙曰言榮華与勲業相敵不可妄求也然嵗聿暮而嚴霜降則傷其遲暮无復勵勲業以取榮華矣所慕者若范蠡泛舟浮海変姓名號鴟夷子其髙㪯逺引乃岀㝷常之才格也羣兇逆未定側佇英俊翔洙曰范蠡旣雪㑹稽之耻以爲大名之下不可乆居遂泛舟浮海遣懷昔我遊宋中鄭曰宋州也禹貢豫州城秦改爲梁國漢文帝封子民爲梁王於曜陽置宋州惟梁孝王都洙曰宋即古大梁也名今陳留亞洙曰陳留屬汴州也劇則貝魏俱洙曰貝魏州名在河北劇大也邑中九萬家髙棟照通衢舟車半天下主客多歡娯趙曰主則本処人客則游􅀉者白刃讎不義黃金傾有無殺人紅塵裏報荅在斯須洙曰言多豪傑也文三王傳梁孝王武始立爲代王四年徙爲淮陽王十二年因梁懷王揖入朝墮馬死无子國除遂徙王梁後七囯反梁王城守睢陽梁最爲大國居天下膏􅃾地北界㤗山西至髙陽􅂫林曰陳留北縣治宫室連屬平臺趙曰鮑明逺詩失意杯酒間白刃起相讎憶與髙李輩洙曰髙適李白論交入酒壚師曰甫昔與適白甞遊此酒壚埋甖於地也相如滌噐文君當壚也兩公壯藻思饒曰文思也得我色敷􅃾洙曰丗說王濬仲爲尚書令著公服乗軺經黃公酒壚中過顧謂後車客曰吾昔與嵇叔夜阮嗣宗共酣飲此壚竹林之遊亦預其未自嵇夭亡阮公亡便爲時所覉紲今日視此雖近邈若山河兩公李髙也言髙李得我而後懽恱故敷􅃾也蒼舒曰右按尓雅蕍榮也郭璞曰蕍猶敷蕍亦草之榮也氣酣登吹洙曰一作文臺懷古視平蕪洙曰吹臺梁王歌臺也今謂之繁臺左太冲詩酒酣氣益振鄭曰在開封縣南五里蘇曰新唐本傳云甫与李白髙適過汴州酒酣登吹臺慷􅁣懷古人莫能測蓋謂此也芒碭雲一去鴈鶩空相呼洙曰前漢髙祖隱於芒碭山澤間吕后與人俱求甞得之髙祖怪問吕后后曰適履險顔益厚庶與逹者論吞聲混瑕垢舟中苦熱遣懷奉呈楊中丞通簡臺省諸公媿爲湖外客看此戎馬亂中夜混􅀺甿脫身亦奔竄洙曰謂避臧玠之乱入衡州也趙曰湖外言洞庭湖之外衡州是也戎馬亂指言臧玠之乱平生方寸心反掌帳下難洙曰謂崔􅗕見殺也嗚呼殺賢良洙曰按新史􅗕爲治不煩苛人便安之居澧州二年増户數万詔特進五階以寵異政也不叱白刃散趙曰舊本反掌蔡伯丗本作反當其說是公自言平生有經丗之心而反當帳下有上至於賊殺賢良乃不能一叱曰叱使散盖自以爲愧矣帳下指藏玠賢良􅃌崔􅈅也吾非丈人特没齒埋氷炭夢符曰右按論語管仲奪伯氏駢邑三百飯䟽食没齒無怨言韓子曰氷炭不同噐耻以風病辭胡然泊湘岸入舟雖苦熱垢膩可漑灌痛彼道邊人形骸改昏旦洙曰痛彼遇亂而死者中丞連帥職洙曰詩有方伯連帥之職趙曰中丞陽公也舊唐書云衡州刺史陽済各出兵討臧玠謂連帥乃古之諸侯也封内權得按身當問罪先縣實諸侯半洙曰謂陽中丞也封邑半於古諸侯士卒旣輯睦夢符曰右按春秋左氏傳隨武子曰昔􅀊入陳今兹入鄭民不罷勞居無怨讟而卒乗輯睦事不奸矣啓行促精悍似聞上游兵洙曰上游江之上流也夢符曰右按前漢書項籍傳古之王者地方千里必居上游注丈頴曰居水之上流也游或作流師古曰游即流也稍逼長沙館隣好彼克脩天機自明斷趙曰公自注云陽中丞琳問罪將士皆自澧上逹長沙也南圗卷雲水北拱載霄漢美名光史臣長䇿何壯觀洙曰南圗謂圖􅀞湖南也北拱謂誅亂鉏􅁀以尊王室也如此則書於史臣者光美而見於䇿略者爲壯觀也田曰南圖蓋莊子鵬飛萬里而圖南事故子美送嚴公詩云南圖廻羽翮而北極奉星辰舊注謂􅀞湖南非是趙曰南之所圖謀欲卷盡雲水也北拱所以尊君上驅馳數公子咸願同伐叛趙曰數公子按唐史澧州刺史楊子琳道州刺史裴虬衡州刺史陽濟各出兵討賊聲節哀有餘夫何激衰懦洙曰言願同伐叛之公子聲名節槩足以振激衰懦猶軟弱也偏禆表三上鹵莽同一貫夢符曰右按前漢馮奉丗上書討􅏔願益兵上爲發六萬人太常千秋將以助焉奉丗以得其衆不須復煩將上讓之曰大將軍出必有偏禆又何疑焉始謀誰其間迴首増憤惋趙曰禆將上表而敷陳不明同一貫耳所以問在其間而爲始謀者誰徒今我回首憤惋也宗英李端公洙曰宗室之英秀也田曰右按吕温河間元王孝桀賛堂堂河間仁勇是經遹駿有聲爲唐宗英又梁邵陵王讓丹陽尹􅀄表曰臣進非民譽退異宗英尸居戎號巳紊彛典說京兆五守西漢莫追河南二尹東京罕継趙曰端公李勉也勉爲御史中丞大曆中出爲廣州刺史亦以兵討玠李肇國史􅀘曰御史相呼爲端公守職甚昭煥變通迫脅地謀畫焉得筭王室不肯微凶徒略無憚此流須卒斬神器資強幹夢符曰右按道徳經天下神噐不可爲也爲者敗之執者失之又文選西都賦州郡之豪傑五都之貨殖三選七遷充奉陵邑蓋以強幹弱枝隆上都而觀萬國也扣寂豁煩襟皇天照嗟嘆趙曰陸土衡文賦扣寂寞而求音師曰戎馬亂指臧玠之亂甫避入衡州帳下難謂崔瓘􅀍殺也甫入衡州詩亡竟流帳下血大降湖南殃是也特匹特也氷炭謂與小人不相入也臧玠之亂欲召甫甫以病辭遂伯于湘岸形骸改昬目痛彼遇乱而死者中丞指陽濟爲衡州刺史封疆之内權得按察故以兵來問罪縣實諸侯半言封邑半於古諸侯也促精悍言督促精銳強悍之兵以討玠漢書項羽自立爲西楚覇王使人徙義帝曰古之帝者地方千里必據上游乃徙義帝長沙郴縣上游江之上流也長沙屬潭州陽濟修鄰郡之好機謀果斷圖畫湖南北尊王室如是則名聲光于史籍而計䇿又何其壯􅀚也子美常送嚴公詩曰南圖廻羽翮北極捧星辰或說南圖蓋莊子鵬飛九萬里而圖南故事也數公子指澧州刺史楊子彬道州刺史裴虬之􅀋共岀兵伐玠其英聲節義足以振激衰懦偏禆副將也表三上謂上章陳臧玠之無罪言崔瓘之減剋軍士衣粮率皆鹵莽不明瓘之用心也始謀指玠也李肇國史􅀘宰相相呼曰堂老兩省相呼爲閣老尚書丞節相呼曰曹長郎中貟外御史拾遺相呼爲院長唯御史相呼爲端公李端公盖御史也名勉乃宗室大曆中出爲廣州刺史亦以兵討玠變通迫脅地言釋脅從之人以安衆心足見其明權變也焉得筭言謀畫之多也王室不肯微言李公不肯令王室之微必斬臧玠以斡止神器亦使兇徒少有憚畏扣寂言以詩發寂默而豁煩悶之懷冀皇天有以知之也詠懷二首人生貴是男洙曰莊子榮啓期三樂亦曰人之所貴者男也而予幸得之一樂也丈夫重天機洙曰莊子天機不張注不露也未逹善一身得志行所爲洙曰孟子所謂窮則獨善其身逹則兼善天下者嗟余竟轗軻將老逢艱危胡鶵逼神器逆節同所歸河洛化爲血公侯草間啼洙曰胡鶵安史也迫神器言䧟長安也安史亂何洛之間格闘尤甚故云化爲血公卿奔竄故啼於草間也西京復䧟没翠蓋蒙塵飛洙曰吐蕃䧟京師天子幸陜故曰翠蓋蒙塵飛萬姓悲赤子兩宫弃紫微洙曰玄肅二宫也倐忽向二紀姦雄多是非本朝再樹立未及正觀時日給在軍儲上官督有司洙曰國用尚乏屈不免上下督責也髙賢迫形勢豈假相扶持疲􅒒苟懷策棲屑無所施洙曰言上下顧忌無所施爲也矣先王實罪巳愁痛正爲兹洙曰禹湯罪巳漢武哀痛之詔皆先王之事也嵗月不我與蹉􅋸病於斯夜看酆城氣洙曰見紫氣衝牛斗詩注回首蛟龍池洙曰見蛟龍得雲雨注齒髪巳自料意深陳苦詞師曰莊子曰人之所貴者男也人爲萬物之靈丈夫所重者天機之靈也故君子窮則獨善其身逹則兼書天下轗軻不得志之貌紫微垣乃帝座也姦雄多是非言禄山敗思明又起也正觀時米斗三錢行旅不齎粮今國用尚乏上下督責故云未及正觀時髙賢迫形勢言進用者皆以􅀔援何暇扶持於甫哉疲􅒒甫自言衰老雖懷䇿略何所施設帝於此時下詔痛自刻責故云先生實罪已豐城獄有寳劒氣衝牛牛蛟龍得雲雨非是池中物甫自視齒髮豁凋不復若寳劒蛟龍之亨􅁬也􅀖危壞法則聖逺益愁慕飄颻桂水遊鄭曰郴州桂陽水北流入連州桂陽縣在桂水之陽悵望蒼梧暮洙曰桂水出㑹稽禹崩之地蒼梧舜葬之所潜魚不衘鈎走鹿無反顧洙曰皆避難意夢符曰右按春秋左氏傳古人有言曰鹿死不擇音鋌而走險急何能急皦皦幽曠心拳拳異平素洙曰亂離之徐不得遂其平昔幽曠之心而反拳拳然言屈身以求其全也衣食相拘閡鄭曰牛代切外閉也朋知限流寓風濤上春沙十里侵江樹逆行少吉日時節立復度井竈任塵埃舟航煩數具牽纒加老病􅃈細隘俗務萬古一死生胡爲足名數多憂汙桃源洙曰見欲問桃花􅀫注拙計泥銅柱泥乃計切洙曰見銅柱傾側注未辭炎瘴毒擺落跋渉懼虎狼窺中原焉得所歷住洙曰盗賊充斥不可爲乆住計葛洪及許靖避丗常此路賢愚誠等差自愛各馳騖鄭曰亡遇切羸瘠且如何魄奪針灸屢洙曰楊雄曰方其有事則聖賢馳騖不足擁滯僮僕慵稽留篙師怒洙曰稽留遲滯也篙師舟人也終當挂帆席天意難告訴南爲祝融客洙曰祝融峯地多神仙所居鄭曰衡山上有祝融峯勉強親杖屨結託老人星羅浮展衰歩洙曰老人星在南極羅山浮山二山合躰謂之羅浮師曰􅀖危壞法則言禄山紊紀綱也聖逺言聖人巳逺不復見三代之治也故云愁慕禹崩於桂水舜葬於蒼梧甫流離至此􅁣想舜禹之君不作賢人避出故云潜魚不衘鈎走鹿無反顧拳屈也亂離之際不得遂其平昔幽廣之心而反卑屈其身故云拳拳異平素閡不通也明知限流寓謂飄泛各在一隅逆行少吉日謂經歷風波之險也昔秦人避亂於挑花源今我泥于銅柱山其計甚拙又且多憂得無汚辱於桃源乎􅁑洪許靖皆避丗之士其賢如彼愧吾之愚困於馳騖僮僕爲之慵倦篙師亦怒其遲留甫意欲養老于羅浮庶幾豁杖屨之遊故末章有終當掛帆席之句祝融司南方茅君内傳曰大夫之内有地中之洞天三十六所羅浮之洞周回五百里名曰朱明曜真之天羅浮山記曰羅浮者蓋緫稱焉二山合體謂之羅浮在増城愽羅二縣之境有神仙所居南極星有老人星冩懷二首勞生共乾坤何處異風俗冉冉自趨競行行見羈束趙曰古樂府冉冉幕中趍古詩行行重行行無貴賤不悲無富貧亦足洙曰言貴賤貧冨一委順之而已所謂樂天知命者趙曰賤之所以悲者以貴形之也故無貴則賤者不悲貧之所不足者以富形之也故無富則貧也亦足此義甚明而舊注亂之萬古一骸骨洙曰同歸於此隣家遞歌哭鄙夫到巫峽三􅀊如轉燭洙曰言光景之迅速也全命甘留滯忘情任榮辱洙曰一歸之於眞朝班及暮齒日給還脫粟趙曰公甞爲左拾遺今又爲工部貟外郎則所謂朝班公時年五十六矣所謂暮齒然日給還脫粟而巳盖其貧故也編蓬石城東洙曰編蓬以庇風雨采藥山北洙曰一云林谷洙曰許徴君詢以采藥白雲偎畧以肆所養許畋隱居北山採藥讀易自號太易先生漢武三召不起用心霜雪間不必條蔓緑非關故安排洙曰謝靈運詩居當以待終處順故安排曽是順幽獨洙曰謝靈運詩安排徒空言幽獨頼鳴琴逹士如弦直小人似鈎曲曲直吾不知􅀒暄候樵牧洙曰後漢童謡直如弦死道邊曲如鈎封公侯趙勝􅀒暄坐睡風簷候樵牧之歸趙曰􅀒晚日之暄以候樵牧之歸也列子楊朱篇曰昔者宋國有田夫常衣緼以過冬曁春東作目曝於日不知天下之有綿纊狐貂顧謂其妻曰􅀒日之暄人莫知者以獻吾君當有重賞師曰古樂府陌上乗云盈盈公府歩冉冉府中趍冉冉無氣貌人趍競於物則其氣䘮矣凡百所行但見羈束不自由也君子當安乎富貴貧賤樂天知命而不憂甫檢校工部故云朝班暮齒乃晚年也編蓬所以禦風雨採樂所以療衰病雖不特逹然能守其節操不爲紛華所變故云用心霜雪間不必條蔓緑孟子曰古者以利爲本人當安時處順不用注意安排排着則是以利爲本是以逹理之士其直如弦􅀒暄炙背也夜深坐南軒明月照我􅂰驚風翻河漢梁棟巳出日洙曰洛神賦若白日之照屋梁羣生各一􅀫飛動自儔匹蘇日武璋云飛走水陸咸有儔匹吾亦驅其兒營營爲私實洙曰一作室天寒行旅稀􅀊暮日月疾榮名忽洙曰一作感中人洙曰楚辭以薄寒中人蘇曰許尚榮名如風箭忽然暗中丗亂如蟣虱古者三皇前滿腹志願畢定功曰顔延年曰亂丗人事如蟣虱胡爲有結繩䧟此膠與􅃮洙曰言三皇之前民未有知結繩之後民僞日起而是非交構如膠􅃮然趙曰莊子曰待繩約膠􅃮而固者是侵其徳也禍首燧人氏厲階董狐筆洙曰燧人火化而爭欲之心生董狐直筆而是非之端起故以燧人爲禍首以董狐爲厲階也君看燈燭張轉使飛蛾宻洙曰言愈察則愈䌓放神八極外俛仰俱蕭瑟趙曰莊子其疾俛仰之間再撫四海之外也見前注終契如徃還洙曰一云終然契真如得匪合洙曰一云金仙術師曰甫以私居口躰爲累不免驅兒營治生計以爲口實故也榮名忽中人謂暮年檢校工部三皇之前其風淳朴欲寡而自足結繩之後巧僞日滋如膠􅃮然是以燧人火化董狐直筆此甫所以有禍首厲階之語也有灯則有蛾有利則有爭要在放神俛仰無所凝滯視死生如往還遣遇磬折辭主人開帆駕洪濤洙曰莊子漁父篇夫子曲腰磬折言其恭也饒曰腰曲如磬之折春水滿南國炎曰謂春水生也朱崖雲日髙洙曰朱崖南海地名漢賈􅂢之罷擊朱崖鄭曰即潭州之丹崖也楊曰雲日髙言地最下也舟子廢寢食飄風爭所操洙曰乗風而行也我行匪利渉謝爾從者勞石間采蕨女鬻菜洙曰一作市輸官曹丈夫死百役暮返空村號洙曰譏役歛煩重也聞見事略同刻剥及錐刀洙曰刀錐猶刻剥也趙曰所聞所見皆似此應官曹之誅求也左傳云錐刀之末刻剥及錐刀則非特取其大者雖錐刀之􅃈末猶及之也朋曰錐刀微利也貴人豈不仁視汝如莠蒿索錢多門户洙曰誅求不一也䘮亂紛嗷嗷奈何􅃛吏徒漁奪成逋逃洙曰姦􅃛吏也漁如漁獵然不以法也逋逃走竄也自喜遂生理花時貰緼􅂁洙曰語衣敝緼􅂁也趙曰花時可以單衣而甘緼􅂁則所以得遂生理勝於逋逃之民也師曰甫覩百姓困於賦役又自喜遂其生理雖遇花時而衣緼絮所甘心不辭也釋悶四海十年不解兵犬戎也復臨咸京洙曰自禄山思明之亂方已而吐蕃復䧟京城蒭曰咸謂咸陽即西京也時禄山連結吐蕃䧟京城失道非關出襄野蒼舒曰右按莊子黃帝將見大隗乎具茨之山至于襄城之野七聖皆迷無所問塗􅀭鞭忽是過胡城修可曰丗說王敦作逆明帝􅀐巴鎮馬齎一金鞭至湖隂察車形敦晝夢日遶其城忽然驚覺曰營中有黃鬚鮮卑奴來何不􅅞取命􅀐追之不及也炎曰避宼者奔走者奔走迷道故有是句耳太也豺狼塞路人斷絶洙曰豺狼盗賊也蘇曰龐德翁狼虎塞路人迹斷絶烽火照夜屍縱橫洙曰漢制有㓂則㪯烽燧言宼亂未平故烽火照夜也天子亦應猒奔走洙曰時帝幸陜趙曰雖歸長安而有乞遷洛廵海之說羣公固合思升平蘇曰薛延慶曰羣公豈不見天子遷播自合建立功勲共竪太平但恐誅求不改轍朋曰譏賦歛之重也聞道嬖孽能全生洙曰􅃌程元振也時元振用事媒蝎大臣故吐蕃入㓂以至功臣不肯用命符曰代宗不能正其典刑江邊老翁錯料事眼暗不見風塵淸解憂減米散同舟路難思共濟向來雲濤盤洙曰雲濤盤灘名極爲險阻衆力亦不細洙曰言得其助也趙曰此言雲濤之間盤轉未出乃方言謂之盤灘者乎散與同舟之人所以謝其用力也舊注言險阻非是呀坈洙曰一作帆瞥眼過呀虚加切瞥匹蔑切趙曰呀坈者於坈如曰之呀開者也飛櫓本無蔕得失瞬息間致逺冝恐泥百慮視安危分明曩賢計兹理庶可廣拳拳期勿替師曰雲濤盤至險之灘實藉衆力操舟故得利渉譬患難之際頼衆力扶持故得國安是以昔賢計其安危衣食與衆同享其充足夫何憂患之不濟乎甫之減米亦爲國者憂以天下之意也呀坈乃難口飛櫓無根蔕言至危也屏迹衰年洙曰一作顔甘屏迹幽事供髙卧鳥下竹根行􅀛開萍葉過年荒酒價乏日併園􅂼課趙曰蓋以乏酒價之故則併課園􅂼賣之以充沽直也猶酌甘泉歌洙曰一云獨酌酣且歌歌長擊樽破修可曰丗說王大將軍每酒後輒詠魏武樂府曰老􅂹伏櫪志在千里烈士暮年壯心不巳以如意打唾壷壷盡缺子美長歌而擊樽破有􅀋於此逃難新添五十白頭翁南北逃丗難踈布纒枯骨奔走苦不暖巳衰病方入四海一塗炭乾坤萬里内莫見容身畔妻孥復随我回首共悲嘆故國莽丘墟鄰里各分散歸路從北迷涕盡湘江岸羗村三首崢嶸赤雲西馬曰赤雲西謂返照雲漢皆赤也日脚下平地洙曰楚詞云載赤雲而陵太淸西都賦云嵓峻崷崪金石崢嶸注曰崢嶸髙秀也柴門鳥雀噪歸客千里至洙曰歸客一云客子范彦龍有客欵柴門妻孥恠我在驚定還拭淚丗亂遭飄蕩生還偶然遂隣人滿墙頭感歎亦歔欷洙曰歔欷感泣也夜䦨更秉燭相對如夢寐蘇曰謂更互秉燭照之恐尚是夢也作更字讀則失其意甚矣師曰相聚與夢想不知其所以此語乃天然混成了無斧鑿㾗耳晚嵗迫逾生􅄯曰晚嵗謂暮年也還家少歡􅃐嬌兒不離􅂰畏我復却去憶昔好追凉趙曰晉安王薄晚逐凉詩曰向夕紛暄屏追凉飛覲中故繞池邊樹蕭蕭北風勁撫事煎百慮洙曰江淹詩伏枕懷百慮頼如禾􅁰收洙曰禾􅁰一作􅁰稌趙曰言􅁰梌極是盖􅁰稌所以造酒與下句相應巳覺糟床注魯曰糟床即酒醡也如今足斟酌且用慰遲暮夢符曰右按離騷經惟草木之零落􅀆恐佳人之遲暮又吟羣雞正洙曰一作忽亂呌客至雞􅃲爭洙曰一云正生驅雞上樹木始聞扣柴荆父老四五人蘇曰謝眺過鄴中貴交零落有田畯野老四五人慰眺曰道左商旅樵人問我乆逺行手中各有携傾榼濁復淸洙曰徐邈曰酒清者爲聖人濁者爲賢人酒頌挈榼提壷苦辭酒味薄􅁰地無人耕兵革旣未息兒童盡東征請爲父老歌洙曰漢祖宴父老歌大風艱難媿深情馬曰書厥子乃不知稼穡之艱難歌罷仰天歎四坐淚縱横師曰時玄宗幸蜀肅宗撫慰之道有所未盡是何父子之恩反不若隣里之深情乎四坐淚下而仰嘆深爲朝廷嘆惜此爾遣興昔在洛陽時親友相追攀送客東郊道遨遊􅀫南山洙曰張景陽詠史詩昔在西京時朝野多歡娛蕩蕩東都誾羣公祖二踈曹子建闘雞東郊道又駈上彼南山煙塵阻長河樹羽成臯閒洙曰有瞽崇牙樹羽置羽也成皐在鞏洛間羽羽旗也廽首載酒地豈無一日還洙曰前漢楊雄傳好事者載酒過之陶潜親朋好事或載酒肴而往丈夫貴壯健􅃤戚非朱顔遣興五首朔風飄胡鴈師曰禄山胡人故以胡鴈比之􅃤澹帶砂礫鄭曰浪狄切小石也洙曰鮑明逺疾風衝塞起砂礫自飛揚又胡風吹朔雪劉公幹涼風吹砂礫長林何蕭蕭立之日喻大材當亂丗蕭條不􅀗用也秋草萋更碧洙曰古詩回風動地起秋草萋巳緑立之曰草喻小人草逢秋冝凋瘁今乃萋萋而更碧北里富薫天洙曰左太冲南鄰擊鍾磬比里吹笙竽君平曰􅀭雄燎薰皇天大臨曰言武夫悍卒當禄山亂而能立功取冨貴是以富貴之􅀔薫炙天地髙樓夜吹笛洙曰占詩西北有髙樓上有弦歌聲焉知南隣客九月猶絺綌洙曰精曰絺麄曰綌君平曰隋􅀽充少時父黨過門方冬充尚衣葛戯充曰絺􅀆綌􅀆凄其以風充曰惟絺惟綌服之無斁南隣之客非服絺綌而無斁也蓋貧而無禦寒之服故耳公詩文曰自喜遂生理花時甘緼袍暮春者春服旣成花時而緼􅂁豈非無春服歟趙曰夫以九月授衣而猶絺綌花時巳暖當有春服而甘緼􅂁則公之貧如此長陵銳頭兒出獵待明發洙曰秦武安君頭小而銳趙曰詩明發不寐騂弓金爪鏑白馬蹴微雪鄭曰蹴七六切未知所馳逐但見暮光滅歸來懸兩狼洙曰詩並驅從兩狼􅀆趙曰言出獵之子馳逐未厭而日晚當歸也末句所云言其獵有所􅀗乃是貴家也師曰此詩諷國忠以貴妃之兄位宰相帶劒南節度未知所馳逐正詩不狩不獵之意歸來懸兩狼正詩有懸狟之意也門户有旌節洙曰楊國忠以劒南旌節導駕趙曰旌節貴人所建而羅列於門也􅃮有用而割膏以明自煎蘭摧白露下桂折秋風前洙曰莊子人間丗山木自㓂也膏火自煎也桂可食故伐之􅃮可用故割之兩龔死時有老父來吊哭甚哀旣而曰嗟虖薫以香自燒膏以明自消龔生竟夭天年非吾徒也阮籍詩膏火自煎燒多財爲悉害大臨曰膏􅃮蘭桂皆有用之物喻賢人君子所以煎割摧折者以爲小人所中傷也府中羅舊尹沙道尚依然洙曰故事凡拜相之後禮絶班行府縣載沙填路自私第至于城東街名沙堤赫赫蕭京兆今爲時所憐洙曰前五行志成帝時童謡曰邪徑敗良田䜛口亂善人桂樹華不實黃雀巢其顚故爲人所羡今爲人所憐蕭望之甞爲左馮翊後飲鴆自殺蘇曰明皇雖誅蕭至忠常懷之侯君集云蹭蹬至此至忠亦蹭蹬者耶故子美哀之云赫赫蕭京兆今爲時所憐又盧湛何武不赫赫遺愛常在人趙曰蕭至忠參太平公主逆謀􅀍誅雖巳誅矣然明皇賢其爲人心愛不忘後得源乾曜亟用之謂髙力士曰知吾用乾曜乎吾以貌言似至忠力士曰彼不甞􅀒陛下乎帝曰至忠誠國器但晚謬爾其始豈不賢哉此推見杜公詩意舊注引蕭望之鴆自殺非是猛虎慿其威蘇曰郭韞李鷹如猛虎慿威下視犬羊徃往遭急􅅞洙曰曹操謂吕布􅅞虎不得不急雷吼徒咆哮枝撑巳在脚忽看皮寢處洙曰子將食其肉寢處其皮立之曰左傳襄二十八年子雅子尾怒盧蒲弊曰譬之禽獸吾寢處之矣注云能殺而席其皮無復睛閃爍人有甚於斯足以勸元惡師曰禄山之猛不啻於虎而終蒙􅉁醢亦足以爲元惡之戒矣朝逢富家葬前後皆輝光共指親戚大緦麻百夫行送者各有死不須羡其強君看束􅅞去亦得歸山崗洙曰呉人殺諸􅁑瑾以蘧蒢褁屍束􅅞以蔑弃之於石子崗十朋曰詩譏貴妃於夙昔之日􅀔熖熏炙當丗及禄山亂死于馬嵬山于道傍豈非束縛之比邪分門集註杜工部詩卷第十二
