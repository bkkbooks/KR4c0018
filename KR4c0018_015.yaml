body:
  text: 時事下邊塞將帥軍旅附律詩四十四首巴山新添巴山遇中使云自陜城來盗賊還奔突乗輿恐未廽天寒邵伯樹地闊望仙臺狼狽風塵裏羣臣安在哉余曰漢武立望仙臺喜聞官軍巳臨賊宼二十韻胡虜潜京縣洙曰虜一作騎鮑明逺河陽視京縣趙曰至德二載子儀以朔方兵敗安慶緒于澧水復京師慶緒奔于陜郡此之謂潜京縣京縣者京師之縣也官軍擁賊壕鄭曰胡刀切洙曰城壕也鼎魚猶假息洙曰鼎魚穴蟻言雖假息終不能逃死趙曰南史丘遟與陳伯之書云首豪猜貳部落携離方當繫頭蛮邸縣首槀街而將軍魚遊於鼎沸之中燕巢於飛幕之上不亦惑乎穴蟻欲何逃趙曰異苑曰桓謙太元中忽有人皆長寸餘悉被鎧持槊乗具裝馬從塪中出縁机登竈蔣山道士令以沸湯澆所入處寂不復出因掘之有斛許大蟻死在穴中帳殿羅玄冕洙曰以帳爲殿羅玄冕言君臣聚謀趙曰庾肩曲水聮句曰回川入帳殿玄冕卿大夫之服言羅者羣臣侍之不一也轅門照白袍沈曰周禮以車轅爲門梁陳慶之所統之兵悉着白袍所向披靡秦山當警蹕趙曰肅宗在鳯翔也沈曰前漢出稱警入稱蹕止行人也漢苑入旌旄洙曰言内地漸復趙曰兵往長安也漢苑者上林苑也路濕洙曰一云路失羊膓險洙曰羊膓坂也在太行天下之險也光武賛金湯失險趙曰慶緒弑父之年光弼敗其衆于太原郡今杜公所謂羊膓者指太原非太行山也沈曰皇甫謐地書太原北九十里有羊膓雲横雉尾髙洙曰崔豹古今注髙宗有雉雊服章多用翟羽故有雉尾扇趙曰天子所在雲横其上如黄帝戰于涿鹿之野上常有雲氣五原空壁壘洙曰五丈原地名近長安時賊退敗故壁壘空趙曰長安縣之外有畢原自鹿原少陵原髙陽原細柳原正得原謂之五原也舊注謂五丈原非是八水散風濤洙曰関内八水一涇二渭三漄四霸五澤六浩七澧八潏散風濤言寇乱漸平趙曰言風濤止息之意今日看天意遊魂貸爾曹乞降那更得尚詐莫徒勞趙曰賊窘則乞降黠則尚詐今安賊旣爲宫軍所臨欲望如是不可也元帥歸龍種司空握豹韜趙曰至德二載以廣平王淑爲天下兵馬元帥往收長安是爲代宗也以司空郭子儀副之太公六韜有豹韜也前軍蘇武節洙曰軍一作旌蘇武至海上杖漢節旌毛盡落言前軍皆守節之士左將吕䖍刀洙曰晉書吕䖍爲刺史有佩刀相者曰三公可佩䖍乃贈别駕王祥曰苟非其人刀或爲害以卿有公輔之量故相與也言左將皆輔相之才兵氣回飛鳥洙曰羽獵賦鳥不及飛獸不得過言其疾也趙曰言氣之陵噴可彗飛鳥回也回如回天之回舊注所引非威聲没巨鼇洙曰威声雄重趙曰巨鼇屭贔之物威声所加乃至没之北狂賊懾服之意戈鋋開雪色洙曰東都賦戈鋋彗雲庄矛矟也鄭曰鋋時連切小矛也弓矢向秋毫洙曰秋毫言極末也弓矢向言雖微必中天歩艱方盡洙曰詩天歩艱難時和運更遭趙曰選云遭遇嘉運誰云遺洙曰一作貴毒螫洙曰一作蠆西京賦蕩亡秦之毒螫四子講德論曰秦之時處位任政者並施毒螫說文螫行毒也遺無遺也巳是沃腥臊洙曰如以湯沃去腥臊也漢書蛮夷腥臊睿想洙曰一作思丹墀近洙曰言將收復復坐朝也丹墀以丹漆塗之趙曰言車駕有可還之勢也神行羽衛牢趙曰神行天子之行也羽衛葆羽之衛牢則安而無警也花門騰絶漠洙曰燕山銘經磧鹵絶大漠拓羯渡臨洮石曰臨洮郡名鄭曰十道志洮郡秦漢魏置皆吐谷渾所處此輩感恩至羸俘何足操洙曰言回紇感恩而助順其勇銳所向無前趙曰時用朔方安西回紇等兵今言花門囬紇是也拓羯安西是也言其喜來助順也羸俘者虺羸之俘爾師曰此輩感帝德以兵騰度爭來助唐討賊然賊已係羸不足執也鋒先衣染血洙曰太宗平劉武周躬臨矢石血衊兩神趙曰梁武帝謂張稷有衣染天血之語騎突劒吹毛洙曰吹毛言其利也古有吹毛之劒喜覺都城動悲吹子女號家家賣釵釧只待獻香醪洙曰董卓傳吕布殺卓馳賚赦書以令官陛内外士卒皆稱萬歲百姓歌舞於道長安中士女賣其珠玉衣裝市酒肉相慶者填滿街肆喜逹行在所三首彦輔曰更始立光武爲蕭王悉令罷兵詣行在所蔡邕獨断曰天子以四海爲家謂所居爲行在所時子美自京竄至鳯翔西憶𡵨陽信洙曰歧陽在鳯翔西左傳成王有歧陽之蒐鄭曰十道志歧陽漢扶風杜陽之地無人遂却廽眼穿當落日心死著寒灰洙曰庚桑楚曰心若死灰别賦骨肉悲而心灰趙曰𡵨陽乃鳯翔也公在賊中引首西望欲知鳯翔行在消息惟無人可問徒眼穿心死而巳霧樹行相引洙曰霧一作茂師曰言甫冒霧露奔行在蓮峯望或洙曰一作忽開洙曰華山有蓮花峯趙曰一作連峯謂華州蓮花峯也非是豈有却過長之東經同華之境而來乎當以連山爲正魯曰鮑昭詩連山眇雲霧所親驚老瘦辛苦賊中來洙曰奔走憔悴故所親驚其老瘦漢書師古曰所親素所親任也愁思胡笳夕洙曰言䧟賊乆厭胡笳也蔡琰胡笳且動牧馬悲鳴胡笳動兮邊馬鳴李陵沈曰胡笳胡人卷芦葉吹之一作樂凄凉漢苑春趙曰胡笳胡人所吹則賊兵胡火也言漢苑春則追思其在賊中凄凉之時也漢儀注養鳥獸者通名爲苑雖春而凄凉言殘敝也生還今日事後漢班超妺同郡曹壽妻昭上書請超曰丐超餘年一得生還復見闕庭間道暫時人洙曰間道也言伺間隙之道而行班超從間道至䟽勒師曰暫時人言不取其性命也司隷章初覩洙曰更始以光武行司隷校尉入洛陽人見司隷僚属皆歡喜不自勝老吏或垂泣曰不圗今日復見漢官威儀由是識者皆属心焉南陽氣巳新洙曰後漢光武紀云望氣者蘇伯阿爲王莽使至南陽遥望見舂陵郭唶曰氣佳哉欝欎葱葱黄曰此二句指粛宗中㒷也喜心翻倒極嗚咽淚沾巾師曰樂極則哀継之此詩人抑揚之意死去慿誰報歸來始自憐洙曰楚詞私自憐兮何極猶瞻太白雪喜遇武功天洙曰太白山也武功縣名属鳯翔趙曰太白山在郿縣鳯翔之属縣也武功在唐不属鳯翔但近鳯朔尓公詩所以顯言歸行在也沈曰録異記曰金星之精墜於終南圭峯之西因號爲太白其精化爲白石狀如美玉常有紫氣覆之玄宗立元廟於太寕星臨淄舊邸取其石琢爲像焉影静千官裏心蘇七校前洙曰公入朝鮮當途之交故言影静心蘇言憂釋而心蘇也前漢刑法志京師有南北軍屯武帝内増七校注中壘屯騎歩兵越騎射声虎賁凢八校尉胡騎不常置故此言七也今朝漢社稷新數中興年鄭曰中竹仲反洙曰凡王室中否而再㒷謂之中㒷如周宣漢光武時唐有安史之乱故云收京三首仙仗離丹極洙曰謂大駕出幸妖星照玉除洙曰晉天文志妖星一曰彗星二曰孛星三曰天棓四曰地槍五曰天攙六曰蚩旗七曰天衝八曰國星九曰昭明十曰司危十一曰天欃彗十二曰五殘十三曰六賊十四曰獄漢十五曰旬始十六曰天鋒十七曰燭星十八曰蓬星十九曰長庚二十曰四塡二十一曰地維曹子建曰凝霜依玉除除階也說文曰除殿階也西都賦曰玉除彤庭師曰言禄山䧟京闕須爲下殿走洙曰丗說熒惑入斗天子下殿走謂避乱不可好樓居鄭曰好虚到切洙曰一云得非羣盗起難作九重居史武紀公孫卿曰仙人可見但仙人好樓居於是上令長安作蜚廉桂觀甘泉作延壽觀焉趙曰史記封禪書仙人好樓居今公以仙人比天子也師曰玄宗好神仙故有好樓居之句暫屈汾陽駕洙曰莊子堯往見四子藐姑射之山汾水之陽釋文云案汾水出太原今莊生寓言也謝靈運從遊京口北固詩昔聞汾水遊今見塵外鑣聊飛燕將書洙曰史記魯仲連傳燕將攻下聊城聊城人或讒之燕燕將懼誅因保守聊城不敢歸齊田單攻聊城歲餘士卒多死而聊城不下仲連乃爲書約之矢射城中遺將將見仲連書泣三日猶預不能自定喟然嘆曰與人刃我寕自刃乃自殺依然七廟略洙曰天子七廟趙曰兵謀謂之廟略盖謀於廟也今詩所言則在七廟之中所謀畧也師曰謂復立宗廟也更與萬方初趙曰與民更始之義生意甘衰白天涯正寂寥忽聞哀痛詔又下聖明朝洙曰漢武帝末年下哀痛之詔羽翼懷啇老洙曰漢髙祖時戚夫人以寵將移動太子吕后用張良計召四皓使侍太子朝髙祖見而問之四人各以姓名對上曰煩公調護太子四人趍去上指示戚夫人曰彼羽翼巳成難動矣啇老四皓隱於啇山文思憶帝堯洙曰堯典放勛欽明文思安安又曰聦明文思鄭玄云敬事節用之謂欽照臨四方之謂明經緯天地之謂文慮深通敏之謂思四者皆在身之德鮑曰乾元元年正月戊寅上皇御宣政殿授皇帝傳國受命宝符公云羽翼懷啇老文思憶帝堯謂裴冕杜鴻漸等輔相肅宗猶啇山四皓輔漢太子玄宗傳授猶堯授舜也叨逢罪己日洙曰罪己詔也傳臧文仲曰禹湯罪己其㒷也勃焉霑洒望青霄洙曰一云洒涕蘇曰青園翁曰秦鹿未息四海如斯終日洒淚沾衣仰霄漢而巳師曰今覩粛宗能刻責奮勵猶有所仰望也汗馬收宮闕洙曰漢䔥何傳未有汗馬之勞春城鏟賊壕鄭曰鏟楚醆切平也趙曰謂文鏟則盡削平其迹之義也賞應歌枤杜洙曰詩枤杜勞還役也反而勞之者歸及薦櫻桃洙曰歸一作福禮月令仲夏之月羞以含桃先薦寢廟即櫻桃也今所謂朱櫻者是也前漢叔孫通傳古者有春甞果方今櫻桃熟可献願陛下出因取櫻桃献宗廟上許之諸果献由此興也雜虜橫戈數功臣甲第髙洙曰武帝爲霍去病治第第宅也甲第甲猶言甲乙之次第謂第一之第田蚡治宅甲諸第萬方頻送喜無乃聖躬勞洙曰班超傳西域平定薦勲祖廟布大喜於天下師曰此聖主之勲勞人臣不冝貪大功以爲己力諷之之辭收京新添復道收京邑兼聞殺犬戎衣冠却扈從車馬巳還宮剋復誠如此扶持在數公莫令回首地慟哭起悲風遣憤聞道花門將洙曰回紇也論功未盡歸自從收帝里趙曰長安也誰復揔戎機蜂蠆終懷毒洙曰左傳君無謂邾小蜂蠆有毒况國乎蘇曰武黨廟記張良謂䔥何曰黥布軰如蜂蠆逐時暫親近人其懷毒之性不革雷霆可震威洙曰賈山傳云人主之威非特雷霆也震之以威豈有不摧折者哉趙曰大意以回紇助順討史朝義恐其恃功驕暴難制故欲早加以威而絶其如此莫令鞭血地再濕漢臣衣洙曰時回紇恃功陵暴此詩之作蓋有所警也師曰禄山乱回紇以兵助討賊其後恃功桀驁故蜂蠆終懷毒欲帝震之以威無使彼再效禄山之舀京闕也漢書云禁中非刑人鞭血之地鞭血地指禁中也花門將即回紇之將西山三首夷界荒山頂蕃州積雪邊洙曰成都記西山冬夏積雪築城依洙曰一作衣白帝洙曰白帝城在夔州此西山詩而言築城依白帝恐傳者誤矣轉粟上青天洙曰李白蜀道難難如上青天趙曰兩句通義公孫述自號白帝其所築城在髙山上本曰白帝城是巳今公言髙山之上築城依倣白帝所以轉粟之艱難如上青天也蜀將分旗鼓趙曰以吐蕃䧟松維保三州勢迫近蜀故分旗鼓以禦之羗兵助洙曰一作動鎧鋋洙曰一作井泉鄭曰鎧苦亥切甲也鋋時連切小矛也西南背和好殺氣日相纒洙曰時吐蕃䧟隴右趙曰以吐蕃背先帝時盟好而爲寇不巳辛苦三城戍長防萬里秋洙曰明皇還蜀後復分東西兩川爲兩節度西山列防秋三戍民罷于役髙適論之不聽煙塵侵火井洙曰雪賦火井滅蜀都賦火井沉熒於幽泉髙熖飛煽於天垂趙曰火井雖在卭州大率是蜀地名言吐蕃迫蜀中也孫曰蜀志云火井在臨卭雨雪閉松州洙曰注見上趙曰言松州巳䧟而閉於雨雪之中矣風動將軍幕洙曰一云蓋天寒使者裘漫山賊營壘鄭曰漫舊謨官切洙曰漫山言賊壘之多也廻首得無憂子弟猶深入趙曰子弟言充兵之人也關城未解圍蠶崖鐵馬痩宋曰寰宇記蚕崖関在永康軍西北四十七里灌口米舩稀洙曰蚕崖関灌口並西山隘口地名趙曰蚕崖在西山関隘處灌口在今永康軍戰馬不足充戰而瘦米舩以舩運之多不継而稀此爲可憂矣故有下句程曰灌口山在永康軍導江縣李膺益州記云清水路西七里灌口古所謂矢彭関辯士安邊䇿元戎决勝威洙曰元戎元帥也史决勝千里今朝烏鵲喜洙曰西都雜記云乾鵲噪而行人至欲報凱歌歸警急趙曰時髙適代崔光逺領西川節度使才名舊楚將妙略擁兵機趙曰以美髙適也玉壘雖傳檄洙曰傳檄言吐蕃入宼檄書相聞也松州㑹解圍洙曰松州在西山正控吐蕃趙曰廣德元年吐蕃取隴右十二月遂亡松維保三州公詩乃在未亡松州之前和親知計拙公主漫無歸洙曰見留花門注趙曰吐蕃方請和継而又叛青海今誰得洙曰見贈哥舒開府詩注西戎實飽飛洙曰曹公言吕布猶鷹也飽則飛去按新唐書適代崔光逺爲節度吐蕃取隴右適出兵南鄙以牽制之旣無功遂亡松維二州趙曰言青海爲吐蕃所有而其勢如鷹之飽而飛揚不就縶紲也王命漢北豺狼滿巴西道路難趙曰漢與巴相連盖吐蕃入寇之地血埋諸將甲骨斷使臣鞍趙曰廣德元年使李之芳崔倫往聘吐蕃留不遣虜破邠州入奉天天子幸陜使臣指李之芳崔倫矣骨断則憂懼而骨欲断折之義牢落新燒棧洙曰漢髙紀張艮說漢王燒絶棧道棧即閣也今謂之閣道蒼茫舊築壇洙曰漢王齋戒設壇埸拜韓信爲大將軍師古曰築土而髙曰壇除地爲埸趙曰時雍王聒爲兵馬元帥子儀副之而禦奉天之寇委子儀則舊築壇指郭令公也深懷喻蜀意洙曰司馬相如有喻巴蜀檄慟哭望王官洙曰時叚子璋反東川適與崔光逺逆戰斬之光逺不戢兵遂大掠至有断士女腕取金者故民怨哭而欲聞王命也趙曰司馬相如有喻巴蜀文公止取喻蜀字以言蜀父老以望王官之至也征夫十室幾人在千山空自多路衢唯見哭城市不聞歌洙曰民苦役故多怨哭漂梗無安地洙曰用民如榛梗飄泊不遑寧處蘇曰宗壽已身如水上浮梗南北無安身之地齒豁頭白其將柰何趙曰此公自言爾盖旅寓之人如梗之漂蕩於義分明銜枚有荷戈洙曰漢紀章邯夜銜枚擊項梁定陶師古曰銜枚者止言語讙囂欲令敵人不知其來也周官有銜枚氏枚狀如蓍横銜之蘇曰吴起中夜起謂禆將曰防彼銜枚荷戈衝突吾寨官軍未通蜀吾道竟如何有感五首將帥䝉恩澤兵戈有歳年至今勞聖主何以報皇天白骨新交戰雲臺舊拓邊趙曰言新戰之兵方横白骨將帥必有意於拓邊而功末立其在雲臺畫像議功者則是舊拓邊之功也乗槎斷消息無處覔張騫洙曰見查上似張騫注趙曰言遣使吐蕃未還所以用張騫乗槎爲喻幽薊餘虵豕洙曰爲史思未平也趙曰左傳曰吴爲封豕長虵荐食上國餘虵豕於幽薊則今歲廣德元年正月史朝義雖滅而未有臣服者乾坤尚虎狼洙曰盗賊充斥也諸侯春不貢洙曰藩鎮擅命基兆於此使者日相望洙曰董仲舒傳漢家使者冠盖相望愼勿吞青海洙曰在君不見青海頭注趙曰戒之以無事於西羗無勞問越裳洙曰見越裳翡翠無消息注趙曰戒之以無事於東夷大君先息戰歸馬華山陽洙曰武成乃偃武修文歸馬於華山之陽放牛於桃林之野示天下弗復用也洛下舟車入天中貢賦均洙曰周禮天官惟王建國注周公營邑於土中使居洛邑治天下謂之地中天地之所合也四時之所交也風雨之所㑹也隂陽之所和也然則百物阜安乃建王國焉趙曰言史朝義旣滅道路亦不阻絶矣故舟車入而貢賦均此指言長安特用洛陽爲天地之中而貢賦均焉爲譬也日聞紅粟腐洙曰太倉之粟紅腐而不可食寒待翠華春洙曰翠華天子車盖趙曰言賜予幣帛之厚實翠華之春和氣所及也上林賦曰建翠華之旗盖天子之旗也韓曰古今注黄帝與蚩尤戰常有五色雲氣金枝玉葉覆之因而作華蓋莫取金湯固洙曰賈誼金城湯池帝王萬丗之業王元長䇿金湯非粟不守長令宇宙新趙曰莊子䟽云掲天地以趍新負山岳而捨故宇宙新則一洗乾坤而命惟新矣不過行儉德盗賊本王臣蘇曰邵輝曰今賊盗蜂起驚剽郡邑皆吾王之臣蓋修徳不爭之所致者也趙曰此公致君之胷懷矣丹桂風霜急青梧日夜彫由來強幹地洙曰西都賦強幹弱枝隆上都而觀萬國未有不臣朝趙曰丹桂耐風霜之物楚辭云麗桂樹之冬榮是以青梧易彫之物楚辭又云白露下衆草兮奄彫此梧楸是巳以引下句若幹之強壯則枝無勝幹之理猶主強則臣自㱕服而朝也受鉞親賢往洙曰分茅列土親賢並建親賢同姓也時代宗爲帥趙曰受鉞者授之以節而使之受所以爲元帥也傳曰親賢並建寳應元年代宗旣即位五月以雍王适爲天下兵馬元帥舊臣謂代宗爲帥却是肅宗時矣卑宫制詔遥洙曰禹卑宫室漢以所降勑命爲制詔終依古封建洙曰封爵建國豈獨聽簫韶洙曰書簫韶九成趙曰蓋勸朝廷非特任元帥而巳終以封建之制待夫親而爲天子者豈獨聽簫韶之樂宴樂而巳乎胡洙曰一作盗滅人還亂兵殘將自疑洙曰此詩言安史旣平而僕固懷恩反側也趙曰言安史滅矣僕固懷恩以疑而叛李光弼以疑而沮登壇名絶假洙曰漢髙祖設壇埸具禮拜韓信爲大將軍髙祖曰大丈夫定諸侯即爲眞王耳何以假爲遣張良立韓信爲齊王趙曰髙祖以韓信爲大將登壇而拜之名絶假則眞拜之非持假節而已此言諸將蒙寵如此故責以下句之報主也舊注引韓信欲爲假王之事非其義報主洙曰一作執玉爾何遲領郡輒無色之官皆有詞願聞哀痛詔洙曰見忽聞哀痛詔注端拱問瘡痍洙曰時縉紳皆重内官而不樂外任故子美有無色有詞之譏也栁司馬至洙曰此詩言中原用兵民未安定也渡河歸趙曰回紇助討禄山有功乾元元年請婚肅宗以寧國公主下嫁明年可汗死公主以無子得歸秋思拋雲䯻洙曰一作鬢腰支賸洙曰一作勝寶衣羣凶猶索戰蘇曰王丗充羣兇兵猶索戰但持重吾軍然後大事可成趙曰初爲和親之因以藉具來助和親旣非而索戰則所以藉之之意又違矣迴首意多違歷歷歷歷開元事分明在眼前洙曰開元太平之事也無端賊盗起忽巳歲時遷巫峽西江外趙曰蜀江從西來故謂之西江秦城北斗邊爲郎從白首夢符曰右按後漢張衡思元賦尉尨眉而郎潜兮逮三葉而遘武注尉謂都尉顔駟也尨蒼雜色也遘遇也漢武故事曰上至郎署見一老郎鬢皓白問何時爲郎何其老也對曰臣姓顔名駟以文帝爲郎文帝好文而臣好武景帝好老而臣尚少陛下好少臣巳老是以三葉不遇也上感其言擢爲㑹稽都尉趙曰懷長安也長安城謂之北斗城卧病數秋天湖龍去逺洙曰見先帝弓劒逺注銀海鴈飛深趙曰何遜經孫氏陵詩云銀海終無浪金鳬㑹不飛萬歳蓬萊日長懸舊羽林洙曰蓬萊殿名也羽林星名漢有羽林軍趙曰句似難解盖言天子如平日平時蓬萊殿中之日懸於殿間今則懸在舊羽林中爾羽林謂今守護陵寢者提封提封漢天下洙曰東方朔傳提封頃畒師古曰亦謂提舉四方之内揔計其數也萬國尚同心洙曰民未有離德也借問懸車守何如儉德臨洙曰懸車束馬言至嶮也言以嶮爲守莫若守之以儉德也此吴起對魏文以在德不在嶮以此趙曰此篇崇德息兵之義甚明所謂束馬懸車而後得入如此而後可以守則莫如臨之以儉德也時徴俊乂入洙曰言當捜賢以自輔也草竊洙曰一作莫慮犬羊侵洙曰犬羊戎狄也願戒兵猶火恩加四海深洙曰言用兵莫若以恩也左傳衆仲曰兵猶火也弗戢將自焚蘇曰陳羣皇恩溥加海岱喜聞賊盗蕃寇揔退口號五首道志岷州崆峒西四十里鄭曰水繞崑崙虚在西北駞馬由來擁國門逆氣數年吹路斷蕃人聞道漸星奔趙曰劉孝摽廣絶交論靡不望影星奔勃律天西采玉河鄭曰唐西域傳大勃律西與小勃律接西鄰北天竺烏萇地堅昆碧盌最來多夢符曰右按唐書于闐國距京師九千七百里有玉河國人夜視月光盛処必得美玉堅昆國在唐爲黠戞斯匈奴西鄙也地當伊吾之西焉耆北白山之旁鄭曰堅昆國在康居西葱嶺北趙曰勃律天之西乃采玉河所在應是于闐國也碧盌出堅昆國舊隨漢使千堆寶少荅胡王萬疋羅趙曰舊日以千堆隨漢使入貢而中國所少荅者特萬疋羅夫以蛮夷貢献之多而中囯賜遺之不費自非服化從義而然乎師曰晋平居悔爲張鄴使于闐判官作行程記云其囯采玉之地玉河在于闐城外其源出崑山西流一千三百里至于闐界牛頭山乃流爲三河一曰白玉河在城東三十里二曰緑玉河在城西二十里三曰烏玉河在緑玉河西七里其源雖一而其玉隨地而变故其色不同毎歲五六月大水暴漲則玉隨流而至玉之多寡由水之小大至秋水退乃可采人謂之撈玉堅昆亦胡也今春喜氣滿乾坤南北東西拱至尊大曆三年調玉燭趙曰爾雅曰時和爲玉燭玄元皇帝聖雲孫趙曰爾雅釋仍孫之子爲雲孫乃七丗孫也修可曰唐以老子爲聖袒封玄元皇帝故曰聖雲孫師曰爾雅四時和爲通正四氣和爲玉燭邢昺䟽曰四時和氣温潤明照故曰玉燭又釋親孫之子爲曽孫曽孫之子爲玄孫玄孫之子爲來孫來孫之子爲晜孫晜孫之子爲仍孫仍孫之子爲雲孫注言輕逺如浮雲唐以老子爲聖祖封玄元皇帝故曰聖雲孫承聞河北諸道節度入朝歡喜口號絶句十二首禄山作逆降天誅更有思明亦巳無洙曰安禄山史思明洶洶人寰猶不定時時戰闘欲何須洙曰時尚有反者趙曰廣德元年七月吐蕃入寇矣社稷蒼生計必安蠻夷雜種錯相千周宣漢武今王是洙曰周宣中㒷漢武雄畧言除去暴亂如漢武恢復帝業如周宣也孝子忠臣後代看趙曰此篇望諸節度之忠孝如此喧喧道路多謌謡洙曰一作好童河北將軍盡入朝始是乾坤王室正却教江漢客魂銷洙曰言亦望朝廷徴用也趙曰公因喜諸節度入朝而傷其流落未可還闕朝王䰟銷者所以重嘆也舊住言亦望朝廷徴用豈公本意哉北洙曰又云不道諸公無表來茫然庶事遣人猜擁兵相學干戈銳使者徒勞萬里迴洙曰吐蕃之亂諸道節度无一人救援者朝廷遣使敦諭竟不至鳴玉鏘金盡正臣洙曰西征賦飛翠綬拖鳴玉以出禁門者衆矣趙曰鳴玉鏘金言諸節度之貴稱爲正臣則公豈待之以忠義耶修文偃武不無人洙曰武成云王來自商至于豐乃偃武修文蘇曰鄭玄曰陛下修文偃武不能使天下无人山林之士駢集闕下趙曰又責望於諸節度矣興王㑹静妖氛氣聖壽冝過一萬春蒼舒曰丗說晉武帝問孫皓聞南人好作爾汝歌頗爲不皓正飲酒因以㪯觴勸帝而言昔與汝爲鄰今與汝爲臣上汝一盃酒令汝壽萬春帝悔之又古樂府秦筝曲羅䄂䬃灑拂梧桐促柱髙張散輕宫迎歌度舞遏歸風歸風止流月壽萬春歡無歇英雄見事若通神聖哲爲心小一身洙曰不役天下以自奉燕趙休矜出佳麗洙曰古詩燕趙多佳人美者顔如玉宮闈不擬選才人洙曰唐制才人正二千石趙曰此篇喜諸節度入朝所謂節度者河北之地也旣喜其入朝却防其媚恱而献佳䴡故預以爲戒古詩云燕趙多佳人美者顔如玉才人宫中之爵號抱病江天白首郎趙曰公晚年爲尚書工部貟外郎也其字依傍馮唐白首爲郎矣空山樓閣暮春光衣冠是日朝天子草奏何人入帝郷趙曰草奏之語則公有所激矣澶漫山東一百州鄭曰澶市連切漫莫干切韓曰澶漫不供貌也削成如桉抱青丘洙曰削平也顔延年入河起陽峽踐華因削成趙曰山東言今日之河北也鄭曰青丘在青州千乗縣苞茅重入歸關内王祭還供盡海頭洙曰左傳齊桓問罪楚囯曰尓貢苞茅不入王祭不共無以縮酒東逾遼水北滹沲洙曰遼水遼東囯水也山海經云大戲之山滹沲之水出焉本代州繁畤縣東流經定州深澤縣東南即光武所度處案滹沲河舊在饒陽南至魏太祖曹操因饒河故瀆決令北注新溝水所以今在饒陽縣北趙曰舊本作呼沲非善本作滹沲是蓋河名也光武紀至滹沲河無舡遇氷合得過星象風雲喜共和洙曰西域記賛註譯曰吾受命囯之黃耇日乆矣天之無烈風雨雷也意中囯有聖人乎蓋往朝之紫氣關臨天地闊洙曰見東來紫氣滿函関注趙曰紫氣関言函谷関也周時尹喜爲関史望其有紫氣云當有聖人入関師曰言関中有佳氣也黃金臺貯俊賢多洙曰燕王置千金於臺上以延天下之士謂之黄金之臺修可曰燕昭王築臺以礼郭隗而継得樂毅之属幽燕旣平其黃金臺上俊賢復集也漁陽突騎邯鄲兒夢符曰右按後漢丗祖剋邯鄲置酒髙㑹從容謂馬武曰吾得漁陽上谷突騎欲令將軍將之武曰駑怯无方略丗祖曰將軍乆將習兵豈与我掾吏同哉酒酣並轡金鞭垂意氣即歸雙闕舞雄豪復遣五陵知洙曰漁陽突騎邯鄲游俠其豪俊勇决古有名稱也五陵漢之五陵亦豪俠所聚之地復遣五陵知謂復爲王臣也李相將軍擁薊門趙曰李相則節度使之稱相公者將軍則節度使之稱將軍者擁薊門乃河北諸道節度矣白頭惟有赤心存蘇曰馬援曰吾白頭老顔赤心壯志尚存竟能盡說諸侯入趙曰尽喜說諸侯之入朝蓋天子從來有至尊之勢也知有從來天子尊十二年來多戰埸天威巳息陣堂堂洙曰孫子堂堂之陣天威天子之威神靈漢代中興主功業汾陽異姓王洙曰郭子儀也邊塞古詩一十七首前出塞九首戚戚去故里悠悠赴交河洙曰陸士衡悠悠行邁逺戚戚憂思深古詩戚戚何所迫又悠悠隔山陂又回車駕言邁悠悠渉長道蘇曰古詩轉戰交河道修可曰按唐西州交河在伊州西七百里河水分流繞城下因以名之漢侯應上書云車師前囯王治交河公家有程期洙曰程限期㑹也亡命嬰禍羅劉曰漢竇榮亡命山林趙曰畏公家之期程而逃亡其命則必有収捕禍所及矣君巳冨土境蘇曰徐越吾君土境逺方物冨備而又取炎瘴之地恐後爲中囯患開邊一何多師曰此句譏禄山囯忠之徒爲囯生事於夷狄也棄絶父母恩吞聲行負戈洙曰陸士衡詩夕息常負戈㤗伯曰李奎𬒳掠毀冠裂冕吞聲負戈出門日巳逺不受徒旅欺師曰此言離家日乆巳習戰闘之事故徒旅不能欺也骨肉恩豈斷竦曰蘇武詩骨肉枝葉男兒死無時走馬脫轡頭梅曰木蘭曲云南市買轡頭手中挑青絲洙曰梁簡文帝紫騮馬詩青絲懸玉蹬又云宛轉青絲鞚趙曰宛轉青絲鞚絲馬鞚也捷下萬仞岡俯身試搴旗鄭曰搴起䖍切取也洙曰曹子建仰手接飛猿俯身散馬蹄狡捷過猴猿勇剽若豹螭左太冲振衣千仞岡又斬將搴旗磨刀嗚咽水洙曰嗚一作呼水赤刃傷手欲輕膓斷聲心緒亂已乆洙曰鮑昭東門行離聲断客情又行子心腸断修可曰辛氏三秦記曰隴山天水大坂也俗歌云隴頭流水嗚聲幽咽遥望秦川肝腸断絶故曰嗚咽水革曰東人西役升此而顧莫不悲思其歌云隴頭泉水流離西下念我此行飄然曠野登髙望逺涕淚雙墮丈夫誓許國憤惋復何有鄭曰惋烏慣切驚歎也功名圖騏驎蘇曰羊弘基曰丈夫兒功名立於少壯時南征北伐剪叛除姦期圗於騏驎何苦苦守筆硯度日而巳鄭曰騏渠之驎力珎切漢閣名畫功臣於此戰骨當速朽洙曰見今代騏驎閣注宋司馬造石椁孔子曰死不如速朽師曰丈夫以身許國立功圖像死何足恤况傷於離别乎此勸以義之意送徒旣有長鄭曰丁丈切洙曰髙祖以亭長爲縣送徒驪山逺戍亦有身鄭曰戍束遇切守邊也生死向前去不勞吏怒嗔師曰足見其强驅人於戰豈所謂恱以犯難民忘其死者乎路逢相識人附書與六親哀哉兩決絶不復同苦辛洙曰國忠領劒南募使遣戍盧南餉路險之舉無還者人人思乱此詩所以作也迢迢萬餘里領我赴三軍軍中異苦樂主將寧盡聞洙曰王仲宣從軍詩從軍有苦樂但問所從誰師曰爲將之道甘苦與衆同之今將樂而士苦苦樂之異如此豈善撫循士卒者乎隔河見胡騎倐忽數百羣我始爲奴僕幾時樹功勲洙曰漢衛青奮於奴僕挽弓當挽強蘇曰張諒少壯氣銳好挽強弓明帝用爲校尉用箭當用長洙曰晁錯云弩不可以及逺與短兵同射不能中與亡矢同中不能入與亡鏃同此將不省兵之過射人先射馬擒賊先擒王洙曰前漢匈奴傳月氏欲殺冐頓冐頓奔歸頭曼頭曼令將萬騎冐頓乃作鳴鏑習勒其騎射令曰鳴鏑所射而不悉射者斬後冒頓以鳴鏑單于善馬左右悉射之冒頓知其可用遂以鳴鏑射頭曼左右皆隨之遂殺頭曼而自立趙曰以言士卒之各致其功舊又引晁錯說不相十師曰甫謂射馬擒王不欲多殺傷也殺人亦有限立國自有疆蘇曰左思曰列囯分土自有疆界苟能制侵陵豈在多殺傷趙曰孟子曰定于一孰能一之不嗜殺人者能一之而喜開邊者乃好大喜功之士則公之詩豈不益於教化乎驅馬天雨雪軍行入髙山逕危抱寒石指落曽冰間鄭曰曽才登切洙曰陸士衡驅馬渉隂山山隂馬不前仰慿積雪岩俯渉堅氷渊條可曰前漢匈奴傳匈奴攻太原髙帝自將兵擊之㑹冬雨雪卒之墮指者十二三已去漢月逺何時築城還浮雲暮南征可望不可攀趙曰公詩使周王褒燕歌行無復漢地関山月唯有漠北薊城雲之意師曰暮望歸雲南征不得與之還是故嘆云云單于冦我壘鄭曰單時連切百里風塵昏晁曰王僧逹詩千里莫沙昏雄劒四五動彼軍爲我奔夢符曰古吴越春秋吴王闔閭使干將造劒二枚一干將二鏌鎁鏌鎁者干將之妻干將作劒金鐵之精未肯流干將夫婦乃断髮剪瓜投之炉中金鐵乃濡遂以成劒陽曰干將而作龜文隂曰鏌鎁而作漫理雄猶陽也烈士傳作雌劒雄劒修可曰烈士傳曰眉間尺者謂眉間廣一尺也楚人干將鏌鎁之子楚王夫人常於夏納凉而抱鐵柱心有所感遂懷孕後産一鐵楚王命鏌鎁鑄此精爲双劒三年乃成劒一雌一雄鏌鎁乃留雄而以雌進楚王劒在匣中常有悲鳴王問羣臣羣臣對曰劒有雌雄鳴者雌憶其雄也王大怒收鏌鎁殺之眉間尺乃爲父殺楚王黃曰烈士傳劒有雌雄雄干將雌莫耶越絶書曰楚王作鐵劒三枚晉鄭聞而求之不得興師圍楚之城三年不解楚引太阿之劒登城而麾之三軍破敗士卒迷惑流血千里虜其名王歸修可曰前漢匈奴傳霍去病衛青操兵歸澣海虜名王貴人以百數繫頸授轅門鄭曰繫胡計頸居勁切洙曰曹子建求自試表昔賈誼弱冠求試屬國請繫單于之頸而制其命終軍以妙年使越欲得長纓繫其王覊致北闕轅門以車轅爲門也唐曰宣帝紀單于遣其名王奉献師古注名王謂有大名以别諸小王也韓曰轅門出周礼掌舎掌王之㑹同之舎設車宫轅門注謂王行止宿險阻之處備非常潜身備行列蘇曰盧綏僣身屈志暫備行列一勝可足論蘇曰孫子曰一勝一負兵家常事不足論也從軍十年餘師曰言用兵乆也能無分寸功衆人貴苟得欲語羞雷同洙曰曲礼毋雷同注雷之發聲物無不同時應者人之言當各由已下當同然也中原有闘爭况在狄與戎洙曰前漢匈奴賛曰書戒蛮夷猾夏詩稱戎狄是膺丈夫四方志洙曰礼射義桑弧蓬矢以射天地四方示男子之有志也安可辭固窮琪曰語君子固窮梅曰甫於斯時寕可固窮不敢爲囯生事雖無分寸之功其忠於君可見矣後出塞五首鮑曰天宝十四年乙未三月壬午安禄山及契丹戰於漢水敗之故有後出塞五首爲出兵赴漁陽也男兒生丗間及壯當封侯洙曰後漢班超常輟業投筆歎曰無它志畧猶當效傳介子張騫立功異域封侯安能乆事筆硯間乎梁竦大丈夫生當封侯戰伐有功業焉能守舊丘召募赴薊門鄭曰薊古詣切洙曰鮑明逺始隨張校尉召募到河源趙曰鮑明逺結客少年埸云去郷三十載復得還舊丘吕曰召募字出吴志云中郎將周祗乞於鄱陽召募蓋召謂自隱度而應募爲召募也舊注所引在後矣軍動不可留千金買馬鞍百金裝刀頭洙曰唐刺史見觀察使皆抹苜靴足握刀頭候路左趙曰句法倣木蘭歌西市買馬鞭南市買轡頭閭里送我行親戚擁道周趙曰有枤之杜生于道周班白居上列洙曰班白者不負戴於道路矣酒酣進庶羞洙曰曹子建緩帶傾庶羞趙曰周礼庖人供䘮紀之庶羞少年别有贈洙曰古詩結客少年埸含笑看吴鈎洙曰鮑明逺騘馬金絡頭錦帶佩吴鈎薛曰右按吴越春秋吴王分聘歐冶子作名劒五一曰純鈎二曰湛盧三曰豪曹四曰魚腸五曰巨闕秦客薛燭善相劒吴王取豪曹巨闕等示之薛燭曰皆非寳劒也取純鈎示之薛燭曰光乎如屈陽之華沉沉如芙蓉始生於湖觀其文如列星之行觀其光如水溢于塘此純鈎也修可曰吴王闔閭命國中作金鈎令曰善者賞之百金有貪王之重賞者殺其二子以血統金遂成二鈎献而求賞王曰爲鈎者衆子獨求賞何以異作鈎者曰吾之作鈎也殺二子統成二鈎於是向鈎而呼二子之名曰我在此王不知汝之神也聲絶於口兩鈎俱飛著父之胷王大驚曰寡人誠負於子乃賞百金遂服而不離身見吴越春秋孝祥曰此詩有封侯功業之言則知爵不可濫受而國忠徒以貴妃之寵居極位豈非無功而受禄乎朝進東門營洙曰夏官大司馬師以門名䟽古者軍將蓋爲營治於國門魯有東門襄仲宋有相門右師皆上卿爲將軍者暮上河陽橋洙曰李陵詩携手上河梁游子暮何之王仲宣從軍詩朝發鄴都橋暮濟白馬津鄭曰河陽洺邑也落日照大旗洙曰周礼司常建九旗以待國事馬鳴風蕭蕭洙曰車攻䔥䔥馬鳴悠悠斾旌言不讙譁也荆軻歌風蕭䔥兮易水寒平沙列萬幕洙曰見十年出幕府注部伍各見招洙曰李廣幕府注幕府者以軍幕爲義軍旅無常居止故以帳幕言之程不識正部曲行伍營陣擊刀斗趙曰士卒之多則將各有一幕故一部伍之人各相招認以居幕也中天懸明月洙曰子虚賦曵明月之珠旗令嚴夜寂寥趙曰但見懸中天正照此夜而人不囂譁則令嚴可知東坡詩令嚴鍾鼓三更月乃用此也悲笳數聲動洙曰李陵書胡笳互動牧馬悲鳴沈曰笳居牙切塞上卷芦葉以吹壯士慘不驕借問大將誰恐是霍嫖姚鄭曰嫖頻妙切洙曰霍去病爲嫖姚校尉服䖍曰嫖姚勁疾之皃荀恱漢紀作票字霍去病後爲票騎將軍尚取嫖姚之字耳今讀者音票遥不當其義趙曰句法使曹子建七哀詩備問歎者誰言是客子妻十朋曰衛霍皆椒房之親以致顯貴故比之國忠然國忠以寵幸進驕暴不恤士卒士卒皆疾之故云恐是霍嫖姚古人重守邊今人重髙勲洙曰古人重守邊保其疆埸而巳今人重髙勲則邀功而生事也此後丗所以有窮兵黷武之君也豈知英雄主出師亘長雲洙曰詩我出我車鄭曰亘居鄧切極也六合巳一家四夷且孤軍洙曰髙祖曰天下同姓一家慎無反以六合爲一家遂使貔虎士奮身勇所聞洙曰牧誓如虎如貔拔劒擊大荒洙曰見回略大荒來注髙祖紀拔劒擊柱日收胡馬羣洙曰古詩胡馬嘶北風誓開玄冥北洙曰月令其神玄冥趙曰玄冥北方之神也玄冥北則尽玄冥所主之北地也持以奉吾君洙曰献功也耒曰或擊大荒或開玄冥之北爲國生事持此功以献捷於君雖受髙爵重禄不亦厚顔乎此詩諷國忠之徒獻凱洙曰周礼注凱献功之樂日繼踵兩蕃静無虞蘇曰叚容曰西北安静二蕃无虞年榖屢豐符瑞荐至冝陛下修文養士之際趙曰西北兩蕃巳寕矣漁陽豪俠地洙曰漁陽北地也朱叔元書奈何以區區漁陽結怨天子擊鼓吹笙竽洙曰左太冲南隣擊鍾磬北里吹笙竽趙曰燕薊已復而民樂也雲帆轉遼海洙曰遼海遼東郡端本曰劉晏雲㠶桂楫遼海遼東郡蘇曰吾欲張片㠶泛日本轉遼海採訪海外竒異非區區守一别駕折腰於子軰邪粳稻來東呉洙曰劉晏雲㠶桂楫趙曰吴地无粳越羅與楚練照耀輿臺軀洙曰昭七年傳皂臣輿輿臣臺曹子建下逮輿臺主將位益崇氣驕凌上都邊人不敢議議者死路衢洙曰時好邊功李林甫任蕃將也師曰主將禄山也禄山兵還賞賚無貲玄宗御承天門率百官迎迓禄山恃功髙氣凌公卿誰復敢議其事哉我本良家子洙曰石季倫詩我本漢家子趙充國六郡良家子出師亦多門蘇曰田穰苴戦伐出師自有多門余曰左傳成公十六年左氏晉政多門趙曰東坡云詳味此詩蓋禄山反時其將校有脫身歸國而禄山盡殺其妻子者不出其姓可恨也先生之言如此將驕益愁思身貴不足論躍馬二十年恐辜明主恩洙曰蔡澤曰躍馬疾駈四十三年足矣薛曰右按古樂府雉子班行以死報君恩誰能辜恩眄坐見幽州騎長驅河洛昏洙曰時禄山自幽州䧟河洛曹子建幽并游俠兒長駈䧟匈奴趙曰言禄山之來中夜間道歸洙曰見間道暫歸人注端本曰藺相如使人奉璧間道馳歸趙故里但空村洙曰顔延年去囯還故里幽門蔚蓬藜歐陽曰漢祖紀間道走軍注云間空也投空隙而行不公顯也師曰言囯忠聞禄山有变巳䧟兩都遂脫身自微路歸恐爲姦盗所獲故里但空村言其居民盡避胡也惡名幸脫免蘇曰岑永幸脫此惡名當洗耳浣心老采笋蕨窮老無兒孫蘇曰詳味此詩蓋禄山反時其將有脫身歸囯而禄山盡殺其妻子者不出姓名亦可恨也遣興三首下馬古戰塲四顧但茫然洙曰蘇子卿行役在戦塲蘇曰俆昕過洛汭無復見當日五侯第宅馳馬四顧茫然歎息風悲浮雲去黃葉墜我前朽骨穴螻蟻洙曰老子其人巳死其骨巳朽陸機挽歌豐肌饗螻蟻妍骸永夷泯修可曰莊子在上爲烏鳶食在下爲螻蟻食舊注引陸士衡詩豐肌饗螻蟻盖出於此又爲蔓草纒洙曰江淹恨賦試望平原蔓草縈骨拱木歛魂故老行嘆息今人尚開邊洙曰嚴助傳武帝時征伐四夷開置邊郡蘇曰秦彭過五原見白骨蔽野駐泊嗟嘆乆之曰今人不能艾民瘡痍尚思興師開邊豈不憫黎民之性命乎漢虜互勝負封疆不常全洙曰前漢匈奴傳當孝武時雖征伐克獲而士馬物故亦畧相當雖開河南之野建朔方之郡亦棄造陽之北九百餘里匈奴人民毎來降漢單于亦輒拘留漢使以相報復其桀驁尚若斯安肯以愛子而爲質乎韓安囯漢數千里地爭利則人馬罷虜以全制其敝去病云漢匈奴相紛拏殺傷大當秦曰孫子一勝一負兵家常事安得廉恥洙曰一作頗將三軍同晏眠師曰肅宗巳平禄山思明猶據鄴甫意欲專事鄴城奈何肉食者謀不臧尚与吐蕃再戦故甫欲得廉頗不邀功之將唯務安邊与三軍晏眠不生事可矣髙秋登塞山洙曰塞一作寒南望馬邑州洙曰前漢地理志馬邑屬鴈門郡晉太康地記云秦時建此城輙崩不成有馬周旋戮走反覆父老異之因依以築城遂名爲馬邑韓安囯傳武帝時匈奴來請和親大行王恢議擊上以恢議隂使馬邑豪聶翁壹爲間亡入匈奴謂單于曰吾能斬馬邑令丞以城降財物可盡得單于愛信以爲然而許之聶壹乃詐斬死罪囚縣其頭馬邑城下視單于使者爲信曰馬邑長吏已死可急來於是單于穿塞將十萬騎入武州塞當是時漢伏兵車騎材官三十餘萬匿馬邑旁谷中單于入塞未至馬邑百餘里覺之還去於是下恢廷尉逗留當斬恢行千金丞相蚡蚡不敢言上而言於太后曰恢首爲馬邑事今不成而誅恢是爲匈奴報仇也上朝太后太后以蚡言告上上曰首爲邑事者恢今不誅無以謝天下恢聞之乃自殺降虜東擊胡鄭曰降戸江切壯徤盡不留洙曰時回紇助順收復京師遂進收東都前漢匈奴傳曰漢大發關東輕銳士盡力擊匈奴郡囯吏三百石伉徤習騎射者皆從軍蘇曰匈奴寇邊韓安囯悉師向北少年拒敵惟老弱留守城邑穹廬莽牢落洙曰匈奴曰匈奴父子同穹廬卧師古曰穹廬旃帳也其形穹隆故曰穹廬上有行雲愁老弱哭道路願聞甲兵休洙曰前漢賈捐之傳珠崖反發兵擊之諸縣更叛連年不定上與有司議大發軍捐之建議以爲不可曰當此之時㓂賊並起軍旅數發父戦死於前子闘傷於後女子乘亭障孤兒號道路老母寡婦飲泣巷哭上以問丞相于定囯對以關東困乏民難摇動捐之議是上遂從之前漢匈奴傳匈奴上漢書曰願寢兵休士以安邊民使少者得成其老老者得安其處蘇曰王子湮年老氣衰病痺不能多飲可恨單于冦渭南老弱扶携啼泣塞道鄴中事反覆死人積如丘洙曰事反覆一云何蕭條憶昔詩云鄴城反覆不足怪後漢韓遂語馬騰曰天下反覆未可知也蘇曰馬良連年兵火尸積如丘趙曰兩京雖復平矣而賊猶保相州旣圍復解則士卒傷死可知矣鄴中乃相州也諸將巳茅土載驅誰與謀洙曰李陵与蘇武書陵爲足下當享茅土之薦䇿丈錫君玄土苴以白茅師曰鄴中叛服不常人死如丘山萬一有変諸將巳冨貴各頋私家誰與囯家謀事哉此甫爲朝廷憂也豐年孰云遲甘澤不在早洙曰陸機雲賦甘澤霶霈孫楚雪賦膏澤液普潤田中肅肅三麥實豐年曹子建良田無晚歲膏澤多豐年耕田秋雨足禾黍已映道蘇曰趙益桑麻蔽天禾黍映壟春苗九月交顔色同日老勸汝衡門士洙曰衡門見秋雨歎注時可曰詩衡門之下可以棲遟注横木爲門盖貧者之居也勿悲尚枯槁洙曰漁父形容枯槁莊子枯槁之士時來展材力先後無醜好師曰此諭衡茅之士乆困一旦遇時立功以取富貴安問其先後之不同邪甫意勉乆困之士譏驟進立功者不足爲貴但訝鹿皮翁忘機對芳草洙曰列仙傳鹿皮翁者菑川人也少爲府小臾機巧舉手能成器械岑山上有神泉人不能至也小吏白府君請木工斧斤三十人作轉輪懸閣意思叢生數十日梯道四門成上其巔作茅舎自止其旁將帥古詩四首律詩六首乆雨期王將軍不至天洙曰一作山雨蕭蕭滯洙曰一云帶茅屋空山無以慰幽獨趙曰楚辭曰幽獨處乎山中銳頭將軍來何遲洙曰傳言白起頭小而銳令我心中苦不足數看黃霧亂玄雲時聽嚴風折喬木泉源泠泠雜猿狖鄭曰余救切鼠屬子居旋泥濘漠漠飢鴻鵠鄭曰濘乃定切歳暮窮隂耿未巳人生㑹面難再得趙曰古詩㑹面安可知李延年歌佳人難再得憶爾腰下鐵絲箭射殺林中雪色鹿前者坐皮因問毛知子歷險人馬勞異獸如飛星宿落鄭曰宿思救切列星也應弦不礙蒼山髙安得突騎只五千崒然眉骨皆爾曹走乎亂丗相催促一豁明主正欝陶憶洙曰一云恨昔范増碎玉斗洙曰鴻門之㑹漢王使張良獻玉斗於范増増碎之未使吴兵著白𫀆趙曰南史梁人陳慶之麾下悉白袍所向披靡昏昏閶闔閉氛祲洙曰時賊據京師趙曰即吴之閶闔門也舊注云時賊據京師是時大曆二年京師晏然矣鄭曰祲子鴆切精氣感祥又咨㝷切十月京南雷怒號未曰十月而雷變異也寄贈王十將軍承俊將軍膽氣雄臂懸兩角弓蘇曰趙括毎出乗髙馬左右懸二白角弓趙曰孫子曰并敵一向奪其膽氣纒結青騘馬出入錦城中時危未受鉞洙曰未受鉞言未經專征趙曰受鉞則爲大將矣勢屈難爲功賔客滿堂上何人髙義同魏將軍歌將軍昔著從事衫鄭曰著陟畧切洙曰别駕亦曰治中從事孔恂爲别駕從事蘇曰吴起暫卸戰裘學著從事衣衫趙曰初爲幕官於元帥府耳鐵馬馳突重兩衘洙曰衘衘勒也蘇曰漢靈帝飛黄良駿重衘交轡趙曰馬勒重御則戰馬之謹也被堅執銳略西極洙曰前漢髙祖紀朕親彼堅執銳師古曰𬒳堅謂甲胄也執銳謂利兵也爾雅西至於邠國謂之西極崑崙月窟東蔪巖鄭曰嶄仕咸切石髙峻洙曰相如賦嶄巖參差揚雄長揚賦西壓月窟東震日城君門羽林萬猛士惡若哮虎子所監洙曰監領也君門羽林禁旅也漢有羽林軍詩噉如哮虎言其勇也趙曰申言將軍監軍於殿前也五年起家列霜㦸彦輔曰門列棨㦸也蘇曰揚素起家五年門列棨㦸韓休語子曰爾軰豈不見楊將軍乎不數年門列畫㦸况爾軰堂堂然獨守蠹簡學組綉對偶比楊將軍逺矣趙曰言將軍驟貴如此一日過海收風㠶趙曰言將軍逺征而利於速戰平生流輩徒蠢蠢長安少年氣欲盡趙曰觀將軍冨貴功名而然矣魏侯骨聳精爽緊華嶽峯尖見秋隼趙曰清秋之隼鳥也凢鷙鳥以秋而健所以比之俯曰謝承後漢書竇武上䟽曰奉承詔命精爽隕越星纒寶校金盤陁時可曰星纏寶校金盤陁盖馬裝也顔延年赭白馬賦云具服金組兼餙丹艧寶校星纏縷章霞布注云以金組青飾其裝具如星霞之布蒼舒曰右按文選張平子東京賦龍輈華轙金鑁鏤錫方釳左纛鈎膺玉瓖注蔡邕白金鍐者馬冠也髙廣各五寸上如三華形在馬髦前鍐切鏤彫節也當顱刻金爲之毛詩曰鈎膺鏤錫所謂寶校此其具也第尊卑之制殊耳又古樂府白馬金具裝横行遼水旁夜騎天駟超天河洙曰天官書漢中四星曰天駟房一星曰天良旁八星絶漢曰天漢趙曰此言將軍所騎之馬乃御廐馬也星纏寳校倒使顔延年赭白馬賦全語彦輔曰天官書漢中四星曰天駟使此者以言御廐耳攙搶熒惑不敢動鄭曰上𥘉衘下楚耕切災星洙曰攙搶妖星熒惑火星不敢動言畏其威也蘇曰司馬仲逹曰星拱帝座熒惑攙搶焉敢動翠㽔雲旓相蕩摩鄭曰旓所交切旌旗旒也洙曰翠㽔雲旓皆旗也相蕩摩舒閑也夣符曰右按文選啓翠華之葳㽔又張平子西都賦曰棲鳴鳶曳雲旓又司馬相如子虚賦下摩蘭蕙上拂羽蓋錯翡翠之葳蕤注徐廣曰錯音措或作錯紛翠㽔吾爲子起歌都護洙曰漢遣王吉護匈奴南北兩道故曰都護趙曰古樂府有丁督護歌酒䦨揷劒肝膽露鈎陳蒼蒼風玄武洙曰一本云玄武暮隋天文志鈎陳六星在紫宫中故天子殿前亦有鈎陳所以法天也蒼蒼言其明也玄武亦明星也趙曰鈎陳星名玄武關名安石曰三輔舊事曰未央宫北有玄武關舊本誤以武字爲韻云風玄武極無義理徒誤學者以鈎陳則蒼蒼以玄武則暮言當酒闌揷劒之時萬歲千秋奉明主趙曰申言將軍監軍於殿前矣臨江節士安足數洙曰夔州號臨江軍趙曰言將軍乃天子之節士非特臨江王節士而巳修可曰臨江節士史失其名唯古樂府載宋陸厥臨江王節士歌曰節士慷慨髮上衝冠彎弓掛若水長劒竦雲端是也俯曰夔州號臨江軍甫欲將軍效漢王吉都護蕃漢而臨江節士又安足數甫自稱臨江節士戯作花卿歌洙曰髙適傳梓州副使叚子璋反以兵攻東川節度李奐適率州兵與西川節度使崔光逺攻子璋斬之西川牙將花敬定者恃勇旣誅子璋大掠東蜀天子怒之師曰甫爲花卿痛惜之成都猛將有花卿夢符曰右按左太冲蜀都賦金城石郭兼市中區旣且麤崇實號成都魯曰花卿家在丹稜東館鎮至今血食其郷本朝封爲忠應公學語小兒知姓名用如快鶻風火生蒼舒曰右按南史曹景宗謂所親曰我昔在郷里騎快馬如龍與年少軰數十騎拓弓弦作礕礰聲放箭如餓䲭呌平澤中逐麞數肋射之渇飲其血飢食其胃甜如甘露漿覺耳後生風鼻尖出火此樂使人忘死不知老之將至余曰易家人卦巽上離下爲風自火出火熾則風生風生自火自内而出也象曰風自火出家人見賊唯多身始輕洙曰漢光武見大敵則勇綿州副使着柘黄洙曰綿州副使段子璋也着柘黄僣乗輿服色也趙曰而公今詩云綿州則梓州字誤傳爲綿州乎柘黃天子之服也我卿掃除即日平子璋髑髏血模糊梅曰模糊血塗貌手提擲還崔大夫洙曰子璋即叚子璋也崔大夫崔光逺也蘇曰少陵時有病瘧者少陵謂之曰吾詩可療之病者曰云何少陵曰夜闌更執燭相對如夢寐其人誦之瘧猶是也少陵曰更誦吾詩云子璋髑髏血模糊手提擲還崔大夫其人誦之果愈然則可以感鬼神信不妄矣李侯重有此節度洙曰李侯東川節度使李奂也趙曰段子璋旣攻東川則李奐必失節度矣以花卿斬之則李侯復保有節度焉人道我卿絶丗洙曰一作代無旣稱絶丗無天子何不喚取守京都洙曰譏其掠奪也黄曰子美作花卿歌雄壯激昂讀之想見其人也楊明叔爲余言花卿家在丹陵東館鎮至今有英氣血食其卿見封爲忠應公投贈哥舒開府翰二十韻鄭曰名翰其先蓋突厥施酋長哥舒部之裔今代麒麟閣何人第一功洙曰漢武帝獲麟作麒麟閣以畫功臣像也虞義詩當今麟閣上千載有雄名漢宣帝甘露三年上思股肱之美乃圖畫大將軍霍光等十二人於麒麟閣漢髙祖即位論功行封以蕭何功爲第一君王自神武洙曰尚書曰帝德廣運乃聖乃神乃武乃文前漢刑法志髙祖躬神武之才揔攬英雄駕馭必英雄洙曰吴張昭曰人君能駕御英雄開府當朝傑洙曰齊職儀曰開府儀同三司秦漢無文唐制開府儀同三司從一品官趙曰翰於天寶十一載加開府儀同三司論兵邁古風先鋒百勝在洙曰勝一作戰劉牢之爲前鋒百戰百勝號爲北府兵敵人畏之略地兩隅空洙曰漢書鄂秋曰曹參雖有野戰略地之功如此青海無傳箭洙曰翰築城青海上吐蕃攻破之移築龍駒鼻吐蕃不敢近青海趙曰胡人毎起兵則傳箭爲號或曰守城之法更夜傳箭以警其睡天山早挂弓洙曰薛仁貴傳將軍三箭定天山將士長歌入漢關天山即祁連也匈奴謂天爲祁連今鮮卑語然見武紀注所謂天山即祁連也趙曰早挂弓則不復用廉頗仍走敵洙曰見廉頗出將頻注魏絳巳和戎洙曰魏絳勸晉侯和戎以爲有五利公從之魏絳盟諸戎脩民事田以時旣而鄭人來歸賂晉侯以師悝師觸師蠲歌鐘二肆具及鎛磬女樂二八晉侯以樂之半賜魏絳曰子教寡人和戎八年之中九合諸侯如樂之和請與子樂之於是魏絳始有金石之樂禮也毎惜河湟棄新兼節制通趙曰翰十二載進封凉國公兼河西節度使盖以河湟之乆棄欲得翰收復之故使之節度河西也智謀垂睿想洙曰王忠嗣𬒳罪詔翰入朝帝虚心待之趙曰方謀復河隍而爲帝所系想出入冠諸公日月低秦樹乾坤繞漢宫趙曰此言收後之功也按傳云攻破吐蕃共濟收黄河九曲以其地置兆陽郡此所謂日月所臨特低秦樹乾坤所包獨繞漢宮胡人愁逐北洙曰言胡人數爲翰所破而敗北也吐蕃甞盗積石軍麥爲翰所破馬無還者服䖍曰自敗曰北趙曰翰之威武胡人愁其攻逐而敗北矣漢書注師敗曰北舊注引吐蕃盗麥爲翰所破非是宛馬又從東鄭曰宛於爰切洙曰漢伐大宛得天馬乃作歌曰天馬來歷無草徑千里循東道言翰能振威武故蠻夷畏服宛馬復來也夢符曰右按文選阮籍詩天馬出西北由來從東道受命邊沙逺洙曰邊沙一作軍麾翰屢節鎮邊郡歸來御席同洙曰翰甞來朝帝命髙力士賜宴詔尚食生擊鹿取血瀹膓生洛河以賜之趙曰邊沙逺指言河西爲逺御席同言復河隍功成而歸寵宴之盛此並終節制河西後來事舊注所引皆在河西節度巳前煌惑學者不得不辯軒墀曽寵鶴洙曰左傳狄人伐衛懿公好鶴鶴有乗軒者將戰國人受甲者皆曰使鶴鶴實有禄位余焉能戰余曰邵氏聞見録云子美軒墀曽寵鶴如鶴乗軒左傳注云軒大夫車也非軒墀之軒或以爲病惟知詩者能辨之畋獵舊非熊洙曰文王將出獵卜之曰所獲非熊非羆非虎非貔乃霸王之輔也於是文王獵果遇太公於渭之陽與語大說同載而歸以爲師也趙曰言翰之貴寵已如乗軒之鶴明皇得之如文王之得吕望左傳衛懿公好鶴鶴有乗軒者茅土加名數洙曰禹貢徐州厥貢惟土五色注王者封五色土爲社建諸侯則各割其方色士與之使立社燾以黄土苞以白茅茅取其㓗黄土取王者覆四方名數謂等其爵位輕重而爲之名數也故名位不同禮亦異數趙曰此言翰進封西平郡王也茅土事凡建國名以其方色之土與之立社燾以黄土苴以白茅山河誓始終洙曰沛公即位封功臣爲之誓曰使黄河如帶太山若礪國以永存爰及苗裔於是申以丹書之信重以白馬之盟又作十八侯位次杜業納說曰迹漢功臣亦皆割符丗爵受山河之誓存以著其號吏以䝉年小輕之曰彼豎子何能爲此以肉餒虎耳他日與蒙㑹又蚩辱之䝉大怒拔刀殺吏出俄因校尉袁雄自首因間言於孫策䇿竒之召至左右一云郷曲輕周處將軍拔吕䝉周處晉人字子隱膂力過人好馳騁田獵不脩細行縱情肆慾郷曲患之防身一長劒將欲倚崆峒洙曰一作防身有長劒聊亦倚崆峒宋玉賦長劒耿介倚天趙曰晉孫楚叅石苞驃騎將軍事恃才傲苞因有嫌隙吴孫䇿吕䝉召置在右子美欲有兾於翰故先引以爲言以軍事則能留孫楚異乎石苞之不容以行間則有識吕䝉如孫䇿者如此則我所防身之劒亦欲倚之於崆峒也師曰玄宗即位自負神武好開邊境駕馭英雄之士以爲將帥哥舒守開符得自選將校叅謀唐制開府儀同三司三司者三公也從一品官哥舒特膺帝眷必立大功爲麒麟第一人北征突厥西伐吐蕃略取也故云兩隅空青海軍中夜傳箭以守無傳箭言無警也宋玉曰彎弓掛扶桑早掛弓言休兵也旣敵一走竄畏吾之威斯與吾求和故云魏絳已和戎河隍乃河曲築隍以備冦王忠嗣守河隍爲冦所敗翰入朝陳攻守計帝以翰領節制虚心待之出入朝廷諸公莫敢比望日月低秦樹乾坤繞漢宮言帝任翰關中之勢由此髙大不爲冦所陵逼也吐蕃甞盗積石軍麥爲翰所敗師敗曰北冦旣敗北由是胡人畏威遂以馬入獻故曰宛馬又從東此皆援以爲喻之辭非真獻馬也翰受命節鎮邊郡故云邊沙逺及歸朝帝賜坐作生洛河以宴之故云御席同衛懿公曽寵鶴今帝之寵翰非寵鶴之比也䇿行言以計用兵不暇交戰故云遺戰伐遺棄也昭融言帝之哲鑒也翰用謀與帝意合故能聳動於帝勲業青冥上言立功之髙也交親氣槩中言氣義之感人也甫自言未獲爲翰之上客而頭巳白惜不爲翰之眷待也古詩云王孫不歸來緑盡池塘草幾年春草歇謂不能歸郷也今日暮途窮歎衰老也軍事留孫楚甫參翰幕府也行乃行伍行間識吕䝉言翰識擢甫於微賤也崆峒山在西正當吐蕃所入之道將倚劒崆峒從翰守節鎮也諸將五首漢朝陵墓對南山洙曰張孟陽七哀詩北邙何壘壘髙陵有四五借問誰家墳皆云漢丗主恭文遥相望原陵欝膴膴胡虜千秋尚入關昨日玉魚䝉葬地洙曰西京雜記長安大明宫宣政殿此殿初就毎夜見數騎衣鮮麗遊往其間髙宗使巫祝劉明奴王湛然問其所由鬼云我是漢楚王戊太子死葬於此明奴等曰按漢書戊與七國反誅死無後焉得其子葬於此鬼曰我當時入朝以路逺不從坐後病死天子於此葬我漢書目有遺誤耳明奴因宣詔與改葬鬼喜曰我昔日亦是近屬豪貴今在天子宮内出入不安改卜極爲幸甚今在殿東北入地丈餘我死時天子歛我玉魚一雙今猶未朽必以此相送勿見奪也明奴以事奏聞有勑改葬苑外及發掘玉魚宛然見在棺槨之屬朽爛巳盡自是其事遂絶早時金盌出人間洙曰孔氏怪曰盧充家西有崔少府墓一日見一府舎門進見少府與崔小女爲婚三日崔曰君可歸女生男當以相還居四年三月三日臨水戯忽見崔氏并少府抱兒還充又與盌并贈詩一首充取兒盌及詩女忽不見充詣市賣盌崔女姨曰我妹之女嫁而亡贈以金盌着棺中云田曰𥙷遺云沈炯行經漢武通天臺爲表奏之其略曰甲帳珠簾一朝零落茂陵玉盌遂出人間今公所言乃茂陵事但金玉異爾舊所引乃女子之事也趙曰此四句所以激怒諸將也漢朝天子之陵大臣之墓自以對南山千秋萬歳之固矣及胡虜入關不無侵掠也見愁汗馬西戎逼曽閃朱旗北斗閑洙曰子美父名集中兩處用閑字皆非是謂吐蕃於河隴䧟京師也趙曰前四句旣有胡虜發掘冡墓矣今継有吐蕃之難而諸將不知憤激速來長安禦戎也長安號北斗城耳多少材官守涇渭洙曰漢材官蹶張皆武臣也將軍且莫破愁顔趙曰爲將軍者當以防冦爲念且莫破愁顔而爲樂也韓公本意築三城擬絶天驕拔漢旌洙曰匈奴傳天之驕子夢符曰右按唐吕温三受降城碑黙啜強暴朔方天緫管韓國公張仁愿請築三城奪據其地中宗詔許横議不撓於是留及瓜之戍斬姦命之卒六城雷動三城岳立以拂雲祠爲中城東西相去各四百里過朝那而北闢斥候迭望幾二十所損費億萬減兵萬人趙曰漢匈奴傳自稱爲天之驕子而回紇者匈奴之種也故亦得稱天驕豈謂盡煩回紇馬翻然逺救朔方兵洙曰言築城以備蕃冦而蕃反爲唐平難也趙曰至德元年郭子儀以朔方安西回紇等兵討安慶緒其後回紇恃功侵擾中國此公所以嘆也胡來不覺潼關隘洙曰謂禄山䧟關也趙曰潼關非不隘也而胡來不覺其隘蓋以失守也此以譏哥舒翰之敗龍起猶聞晉水清洙曰謂肅宗起於靈武也趙曰河北者晉地也乃安賊所起之地肅宗龍飛而晉水復清獨使至尊憂社稷諸君何以荅升平蘇曰劉毅曰至尊獨憂社稷焦心勞思諸大夫忍食肉端然安君平洛陽宫殿化爲烽洙曰曹子建洛陽何寂寞宮殿盡燒焚休道秦關百二重洙曰張孟陽劒閣銘秦得百二併吞山河注言百二謂以二萬之衆足以當百萬得形勢也趙曰祖出前漢田肯賀髙祖曰陛下治秦中秦形勝之國也帶山阻河持㦸百萬秦得百二焉注曰秦地險固二萬人足當諸侯百萬人也滄海未全歸禹貢薊門何處盡堯封洙曰言爲盗賊所奄有也趙曰滄海指山東薊門言河北言爲盗賊所䧟也朝廷衮職雖多預天下軍儲不自供趙曰罪朝廷之臣不能補衮也下言郡國不修貢賦湏上求索而後供也稍喜臨邊王相國洙曰王縉也文中子折衝樽爼不臨邊肯銷金甲事春農洙曰蔡文姬詩金甲耀日光回首扶桑銅柱標洙曰見南海殘銅柱注趙曰馬援南征建銅柱標以勒功冥冥氛䘲未全銷越裳翡翠無消息洙曰前漢西域傳賛孝武之丗覩犀布玳瑁則建朱崖七郡自是之後明珠文甲通犀翠羽之珍盈於後宫師古注云昔周公相成王越裳氏重九譯而獻白雉譯曰吾受命國之黄耇巳日乆矣天之無烈風迅雷也意中國有聖人乎蓋往朝之南海明珠乆寂寥洙曰賈琮傳交趾土多珎異産明璣翠羽犀象瑇瑁異香美木之屬莫不自出殊錫曽爲大司馬洙曰東晉石勒侵阜陵詔加王導大司馬假以黄鉞出討之軍次江寧帝親餞于郊揔戎皆揷侍中貂洙曰漢侍中冠武弁大冠亦曰惠文冠加璫附蟬爲文貂尾爲飾也趙曰此深責諸君徒享髙爵厚恩而不能輸忠者也故有下句師曰子美甞有自平宫中吕太一南海收珠之句蓋呂太一爲廣州使舉兵叛故翡翠明珠乆不貢朝廷說者多引此詩以解太一之事揔戎皆揷侍中貂言將帥邀功皆居髙官也炎風朔雪天王地只在忠良翊聖朝洙曰言天子冒風雪於外所頼者惟忠臣而巳趙曰公以莫非王土當脩職貢必欲其來而在忠臣翊賛天子而巳矣錦江春色逐人來趙曰此篇專言嚴武也公以去年夏離成都而今年至夔初見春焉故云逐人來巫峽清秋萬壑哀洙曰殷仲文詩獨有清秋日能使髙興盡又爽籟驚幽律哀壑叩虚牝趙曰公至䕫初見秋也正憶往時嚴僕射洙曰嚴武共迎中使望郷臺趙曰嚴武鎮蜀辟公爲叅謀望郷臺在成都之北時公隨嚴僕射登此臺以迎中使也主恩前後三持節洙曰按武傳兩鎮蜀一刺綿州趙曰第一次寳應元年正月權令兩川都節制第二次於六月專以節制西川阻徐知道反不得進第三次廣德二年朝廷方正以兩川合一節度而武以黄河侍郎來軍令分明數舉盃西蜀地形天下險安危須仗出羣材洙曰劒閣銘曰形勝之地匪親勿居趙曰安危則安其危也公於八哀之言武公來雪山重武公去雪山輕正此意矣軍旅古詩二首律詩七首揚旗彦輔曰三年夏六月成都尹鄭公置酒公堂觀騎士試新旗幟俯曰代宗大曆三年甫離峽中之荆南夏六月鄭公置酒公堂觀騎士旗幟將平吐蕃之難而作此詩江洙曰一作風雨颯長夏石曰夏日長故云長夏颯動也府中有餘清洙曰謝霊運密林含餘清蘇曰張敞新秋雨過民事簡府中景物餘清我公㑹賔客肅肅有異聲君平曰鄭公持軍嚴粛有殊異声名初筵閱軍裝竦曰閱視也羅列照廣庭洙曰詩有來雍雍至止粛粛庭空六洙曰一作四馬入蘇曰任安等六馬騎直入安西都護府駊騀揚旗旌鄭曰駊布可騀王可切馬揺頭也洙曰甘泉賦崇丘陵之駊騀兮駊騀山阜之髙皃也迴迴偃飛蓋洙曰劉公幹回回自昏乱曹子建飛盖相追隨倪曰逥迴勢回旋也熠熠迸流星洙曰何東賦掉奔星之流稱又校獵賦曵彗星之飛旗來纒洙曰一作衡風飈急去擘山岳傾彭曰言揚旗去來之狀其疾速若此材歸俯身盡洙曰鮑昭詩云俯身散馬蹄妙取略地平虹蜺就掌握舒卷隨人輕洙曰髙唐賦蜺爲旌王沉賦曵招摇之脩旗婉若虹之垂天選虹旗攝麾而就卷三州䧟犬戎趙曰言去年十一月吐蕃䧟松維保三州但見西嶺青公來練猛士欲奪天邊城蘇曰班超謂將佐曰與君等仗天子之威霊擣氐羗奪天邊之城断其左臂与月氐首亦不易也此堂不易升鄭曰易以䜴切洙曰言食人之禄當懷人之憂也蘇曰王戎見陸逹議論乆之退回視逹居堂曰吾終日不易升此堂庸蜀日巳寧吾徒且加餐休適蠻與荆洙曰見近聞犬戎逺遁逃注書庸蜀微盧古詩上言加餐飯王仲宣七哀詩復弃中囯去逺身適荆蛮趙曰相勸加飡飯而不必捨去以嚴公之故也師曰甫終去蜀之荆蛮且爲是辝以美鄭公云冬狩行魯曰時梓州刺史章彛兼侍御史留後東川君不見東川節度兵馬雄校獵亦似觀成功修可曰上林賦天子校獵李竒注云以五校兵出獵也夜發猛士三千人清晨合圍歩驟同洙曰礼天子不合圍禽獸巳斃十七八鄭曰斃毗祭切頓仆也洙曰西京賦僵禽斃獸爛若磧礫白日未及移晷已狝其十七八磧音跡殺聲落日迴蒼穹幕前生致九青兕沈曰尓雅曰似牛郭璞曰角青色重千斤馲駝􅐑峞垂玄熊鄭曰馲他閣駝大何切馲駝有肉鞌行百里負千斤而知水行􅐑落猥下五毁切髙皃洙曰幕前幕帳前以熊駝負也東西南北百里間髣髴蹴踏寒山空鄭曰蹴七六切踏也洙曰羽獵賦羡漫半散䔥條数千里之外東西南北騁嗜奔欲拖蒼豨跋犀犛蹶浮麋斮巨挻搏玄猿南都賦排揵䧟扃蹵踏咸陽有鳥名鸜鵒力不能髙飛逐走蓬肉味不足登鼎爼洙曰鸚鵡賦忖陋躰之腥臊亦何勞於鼎俎鷦鷯賦毛弗施於器用肉不登於爼味言非薦羞之物也劉曰左傳有鸜鵒來巢童謡曰鸜鵒鸜鵒往来歌哭胡爲見覉虞羅中洙曰陳子昂豈不在逺遊虞羅所見㝷春蒐冬狩侯得同洙曰四時田狩諸侯得行其事趙曰周礼春蒐夏苗秋狝冬狩本天子之事也而諸侯同之故公詩曰侯得同使君五馬一馬騘洙曰章彞兼侍御史故云一馬騘故事使君五馬况令攝行大將權號令頗有前賢風蘇曰孫㞯昨見耿將軍行師號令明嚴頗有前賢威風飄然時危一老翁十年厭見旌旗紅蘇曰角里先生語薪者曰子十年厭見干戈旌旗只非今日耶喜君士卒甚整肅爲我回轡擒西戎草中狐兎盡何益蘇曰韓擒虎出獵門人諌曰將軍駈旌斾獵原野逐射馳躍以爲樂雖尽得草棘窟穴狐兎亦復何益於君子冝掃奠塵坌勒功彛鼎非細事韓大喜薦其材於朝臣亦登顯門人即岑孝務也天子不在咸陽宫洙曰時天子避狄趙曰此篇盖廣德二年十月已後作也八月吐蕃入冦十月䧟邠州及奉天車駕幸陜又三日吐蕃䧟京師故云不在咸陽宮也朝廷雖無幽王禍洙曰史申侯与西夷犬戎攻幽王於􅌐山得不哀痛塵再蒙趙曰明皇以禄山之禍已蒙塵於蜀矣今天子又以吐蕃之故蒙塵於外也嗚呼得不哀痛塵再蒙洙曰時代宗在陜詔徴天下兵而程元振用事媒蝎大臣皆疑懼不進天下無一人應召者故此詩末章大有感激也陪栢中丞觀宴將士二首極樂三軍士誰知百戰埸洙曰西都賦觀三軍之殺獲又曰像仰極樂者也無私齊綺饌趙曰梁何遜輕薄篇曰象林沓繡被玉盤傳綺食乆坐密金章夢符曰右按東晉𥘉拜官相餙供饌羊曼丹陽曰客來早者得佳設日晏則漸不復精隨客早晚時羊固拜臨海守竟日皆得精饌時以固之豐腆不如曼之真率趙曰指將士之金帶耳鮑明逺建除詩左右佩金章醉客霑鸚鵡歐曰酉陽雜爼云梁宴魏使魏肇師舉酒勸陳昭儀俄而酒至鸚鵡盃徐君房飲不盡屬肇師肇師曰海蠡蛇蜒尾翅皆張非以爲玩亦以爲罰今日直不得辭田曰鸚鵡盃名雕刻海蠡而爲之像鸚鵡形昔人以之勸酒且以爲罰爵佳人指鳯凰趙曰筵上或畫圗或繡帳上有之而佳人共指而言說也幾時來翠節特地引紅粧洙曰古詩娥娥紅粉裝謝玄暉坐昔紅裝蔓之句修可曰詳觀是詩首句云極樂三軍士乃享軍詩非可使之賦鸚鵡盖鸚鵡杯名雕刻海蠡而爲之像鸚鵡形昔人以之勸酒并爲罰爵師曰薛夢符云沈約宋書南平王鑠上赤鸚普詔羣臣爲賦袁淑文冠當時又後漢黄祖之子射大㑹賔客有獻鸚鵡者射舉酒於禰衡曰今日無以娱賔願先生爲之賦衡筆不停綴文無加點南海異物志云鸚鵡螺狀似霞杯形如鳥頭向其腹視似鸚鵡故以爲名佳人指鳯皇疑是如秦弄玉吹簫乗鳯凰飛去事繡叚裝簷額洙曰張平子美人贈我錦繡叚金花帖鼔腰趙曰上句則樂工之飾下句則工所擊之鼓一夫先舞劒洙曰子路拔劒而舞項莊舞劒爲樂百戲後歌鑣洙曰李廣傳注刁斗以銅作趙曰戲爲夔峽樵歌之音也公前篇閣夜詩曰夷歌是處起漁樵是巳江樹城孤逺雲臺使寂寥趙曰公言使寂寥豈乆無使命之來乎漢朝頻選將應拜霍嫖姚洙曰霍去病爲嫖姚將軍觀兵北庭送壯士洙曰燕太子送荆軻於易水上軻歌曰壯士一去不復還貔虎數尤多洙曰書如虎如貔師曰時回紇送兵三千助討賊故云云程曰陸機云貔似虎遼東人謂之白貔精銳舊無敵洙曰精銳猶勇敢邊隅今若何趙曰此望其必勝而憂之之辭妖氛擁白馬趙曰妖氛指言吐蕃之兵待彫戈則待北庭之賜也古鼎銘曰王命户臣賜爾和鸞黼黻彫戈元帥待彫戈莫守鄴城下師曰元帥代宗也時九節度兵圍賊將慶緒於相州甫欲誅其渠魁故云云斬鯨遼海波洙曰言當誅魁渠也趙曰思明據城宋下公謂可以緩圖且於遼海斬鯨則以吐蕃爲急也觀安西兵過赴關中待命二首四鎮富精銳洙曰言多勇銳也晉職官志四鎭通於柔逺通典鎮東將軍後漢末魏武帝爲之鎮南將軍劉表爲之魏張魯晉當陽侯杜元凱並爲之鎮西將軍後漢劉表爲之魏鍾離鄧艾爲之鎮北將軍南魏明帝太和中置劉靖許允並爲之各一人宋時四鎮與中軍通爲雜號後魏加大次尚書令夢符曰右按唐武后時右鷹揚衛將軍王孝傑擊吐蕃大破其衆復取四鎮更置安西都護府於龜兹以兵鎮守又唐志四鎮都督府謂龜兹于闐焉耆踈勒也摧鋒皆絶倫洙曰能摧鋒䧟陣也還聞獻士卒足以静風塵老馬夜知道洙曰齊相公失道管仲使隨老馬而得出以老馬多智也師曰老馬喻哥翰老將也蒼鷹飢著人鄭曰著直畧切洙曰晉載記言慕容垂猶鷹也飢則附人飽則髙飛師曰鷹飢喻禄山未髙也臨危經乆戰用意始知神洙曰精熟戰陳用意若神師曰當此時正好使之立功以充其志願故云云竒兵不在衆洙曰史兵以正合以竒勝傳云留侯用竒兵不必衆多雖多不精銳而無益萬馬救中原洙曰蔡琰謂曹公曰明公厩有萬馬蘇曰司馬仲逹曰得萬馬可解中原之急亦成於大事也談笑無河北洙曰言談笑司以却敵趙曰禄山之叛河北一帶巳䧟没今言安西兵之精銳主將於談笑之間可以蔑無河北矣東坡云已覺談笑無西戎出於此也心肝奉至尊洙曰言至誠也孤雲隨殺氣飛鳥避轅門蒼舒曰項羽傳將入轅門是也石曰轅門以車爲軍門兵屯嚴肅雖飛鳥不敢過故云云竟日留歡樂洙曰一作觀城池未覺喧洙曰言軍令整肅不囂亂也夢符曰右按周禮掌舎掌王㑹同之舎設車宫轅門注王行險阻處次車蕃御車以轅表門前漢書項籍將入轅門八陣圖彦輔曰亮推演兵法作八陣圖咸得其要桓温傳初諸葛亮造八陣圖於魚復平沙之上壘石爲八行相去二丈温見之謂此常山蛇勢也文武皆莫能識之昱曰陣勢八天地風雲飛龍翔鳥虎翼蛇蟠二革二金爲天三革三金爲地二革三金爲風三革二金爲雲四革三金爲龍三革四金爲虎四革五金爲鳥五革四金爲蛇功蓋三分國洙曰三分謂吴魏蜀也蜀記曰三分我九鼎名成八陣圖江流石不轉趙曰行客云水方落時於石磧就視則茫茫然一磧耳及登髙而望乃隱隱見其行列則武侯製作豈近於神異乎余曰按永嘉薛氏云今武侯之圗可見者三一在沔陽之髙平舊壘一在廣都之八陣郷一在魚復永安宫南江灘水上在摽聚行列依然如是者僅六百年迨今不動然天下三分如鼎足峙立蜀之所以不存者其遺恨失在吞吴而巳使不吞吴則魏豈能合并哉夕烽夕烽來不近毎日報平安塞上傳光小雲邊落點殘照秦通警急趙曰有警急之報則舉烽火以相應余曰前賈誼䟽斥候望烽燧不得卧文頴曰邊方備胡冦作髙土櫓櫓上作桔皐桔皐頭兠零以薪草置其中常低之有冦即火燃舉之以相告曰烽火多積薪冦至即燃之以望其煙曰燧張晏曰晝舉烽夜燔燧也師古曰張說誤也晝則燔燧夜則舉烽過隴自艱難趙曰言安史之兵猶岀没隴上矣聞道蓬萊殿鄭曰長安志殿在東内紫宸殿北千門立馬看分門集註杜工部詩卷第十五
