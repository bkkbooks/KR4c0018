body:
  text: 仙道古詩三首律詩一首昔遊昔謁華蓋君緑𫀆崑玉腳人棺巳上天白日亦寂寞洙曰後漢方術傳王喬為葉令後天下玉棺於堂前吏人推排終不搖動喬曰天帝獨召我邪乃沭浴服飾寢其中蓋便立覆宿昔葬於城西其夕縣車牛皆流汗喘乏而人無知者百姓乃為立廟號葉君祠暮升艮岑頂洙曰艮岑東北之岑也巾几猶未却弟子四五人入來淚俱落余時遊名山發軔在遠壑鄭曰軔而振切洙曰離騷朝發軔於蒼梧又朝發軔於天津良覿違夙願洙曰謝靈運詩搔首訪行人引領兾良覿含淒向寥廓林昏罷幽磬竟夜伏石閣王喬下天壇微月映皓鶴洙曰嵇康琴賦王喬披雲而下墜天台賦王喬控鶴以冲天何敬祖在昔王子喬有道發伊洛迢遞陵峻嶽連翩御飛鶴王喬傳或云即古仙人王子喬也劉向列仙傳曰王子喬周靈王太子晉山好吹笙作鳯鳴遊伊洛聞道士浮丘公接上山三十餘年後來於山上告桓梁曰告我家七月七日待我緱氏山頭果乘白鶴駐山頭望之不得到舉首謝時人而去晨溪嚮虛駃鄭曰駃苦夬切駃馬日行千里歸徑行巳昨豈辭靑鞋胝趙曰靑鞋山行之具公又嘗曰若耶溪雲門寺靑鞋布襪從此始胝足病也莊子曰手足胼胝悵望金匕藥東蒙洙曰東蒙山名昔者先王以為東蒙主赴舊隱尚憶同志樂伏事董先生洙曰董先生董京威也行吟常宿白社之中時乞市肆得碎繒結以自覆於今獨蕭索胡為客關塞道意久衰薄蘇曰吳詩道意夕不怡神氣覺衰歇妻子亦何人丹砂負前諾洙曰晉葛洪求勾漏令以錬丹砂雖悲髮變鬢洙曰一云鬢髮變謝玄暉詩有情知望卿誰能鬒不變詩鬒髮如雲趙曰髮之黑者曰鬒鬒髮變言變而為黑也未憂筋力弱杖藜望淸秋有興入廬霍洙曰杖一作扶一云衡謝靈運詩游羅浮行息必廬霍江淹擬靈運詩靈壇信淹留貴心非待設平明登雲峯杳與廬藿絶幽人洙曰易履道坦坦幽人貞吉陸士衡詩幽人在浚谷孤雲亦群遊神物有所歸洙曰陶潜詠貧士詩萬族各有託孤雲獨無依有一作識麟鳯在赤霄何當一來儀洙曰劉公幹何時當采儀將須聖明君書鳯凰來儀張協七命掛歸翮於靑霄之表漢書麟鳯在郊藪孔融曰麟鳯來頌聲作趙曰張茂先鷦鷯賦序彼鷲鶚鵾鴻孔雀翡翠或淩赤霄之際或託孤垠之外則鳯凰言赤霄冝矣然麟亦謂之在赤霄學者多疑之殊不知徐陵之生寶志見之曰此兒天上石麒麟自天而降亦冝在赤霄矣往與惠詢輩中年滄州期歐曰惠詢輩謂惠逺許詢也謝玄睴之宣城詩既􅌚懷祿情復協滄洲趣李善注楊雄賦云丗有黃公者起於滄洲頤神養性故後人以滄洲為隱者所居隋圖經曰漢水徑琵琶谷至滄浪洲乃漁父棹歌處即滄洲也修可曰海中十洲其一曰滄洲天髙無消息棄我忽若遺洙曰詩谷風將安將樂弃豫如遺郭泰機衣工秉刀赤弃我忽若遺古詩弃我如遺跡內懼非道流幽人在瑕疵洙曰僖七年傳不有瑕疵洪濤隱語笑洙曰曹植泛舟越洪濤晉王凝之風賦驅東極之洪濤郭璞江賦鼓洪濤於赤岸木玄虛海賦洪濤瀾汗曹玭江賦洪濤突兀而橫持蔡雍賦洪濤涌以沸騰晉蘇彥詩洪濤奔逸勞鼓枻蓬萊池洙曰孫楚賦舟人鼓枻而揚歌史漁父鼓枻而去蘇曰方鰥曰吾將吞燕日月光華鼓枻遊蓬萊酌天醴玄漿還源返腦為丗外人靑杉木版非吾所好也崔嵬扶桑日洙曰山海經曰日出陽谷浴于咸池拂於扶桑照曜珊瑚枝洙曰梁元帝馬詩照耀珊瑚鞭趙曰珊瑚焦於海底石上有五色故日所以照曜風帆倚翠蓋暮把東皇衣洙曰屈平九歌有東皇太一又孔蓋兮翠旌說苑鄂君泛舟於新陂之上張翠羽之蓋張平子東京賦翠羽之高蓋曹植曰仰撫翠蓋陸士衡詩云翩翩翠蓋羅咽漱元和津洙曰天台賦嗽以華池之泉孝祥曰黃庭經曰口為玉池太和官嗽咽靈液灾不作注云口中液水為玉津又中黃經曰伹服元和除五穀必獲寥天得其籙注云服元和謂咽津液所思煙霞微知名未足稱局促商山芝洙曰見喜晴詩注定功曰皇甫謐髙士傳秦丗道滅德消坑黜儒術四皓於是退而作歌曰莫莫髙山深谷逶迤曄曄紫芝可以療飢修可曰漢武帝曰局促效轅下駒五湖復浩蕩歲暮有餘悲洙曰張景陽詩歲暮懷百憂有志之土志未獲伸而時不我與則未嘗不以時逝為歎也故多以歲暮為之憂悲師曰幽人乃幽隱之士按唐史拾遺惠昭荀珏與友善常以詩相倡酬甫此詩思之故以二子自為幽人取易履道坦坦幽人貞吉之義神物龍也龍翔而雲從喻聖人出而賢人應之舜韶九成而鳯凰來儀蓋鳯之為物有道則見今雲未遇神龍鳯不遇有道之丗雲則無所㱕鳯則不來儀是以賢人幽隱此其時也海上有十洲乃神仙所居滄洲是其一也甫往與二子約中年功名成遂為滄洲之遊自别以來悄無音耗殆恐二子以余信道不篤見疵於余是以弃我若遺而無所思也甫詩云道意久衰薄又云丹砂負前諾是故有內懼非道流之句蓬萊池蓋海上有三島一曰蓬萊二曰方丈三曰瀛洲日出于暘谷拂于扶桑珊瑚生海底有五色如琉璃翠蓋即翠羽飾蓋也東皇乃東方青帝也元和津乃天地一元之氣津液也煙霞微謂蒼洲在煙霞深微之中自洪濤隱語笑以下比叙說滄洲之興鼓枻乃鼓楫也甫意謂若與惠荀輩遊滄洲則必鼓枻以拂扶桑之日映照珊瑚之枝須風掛帆輕倚翠蓋挹東皇漱元氣隱於煙霞之表雖功名赫赫未足為稱雖四皓歌啇紫芝猶為局促比此真樂方万遠矣奈何言不相副今復飄泛五湖尚為羇旅况年巳衰暮將與物化豈不為之悲傷乎憶昔行憶昔北尋小有洞洪河怒濤過輕舸鄭曰舸加我切洙曰茅君內傳大天之中有玄中之洞三十六所第一王屋山之洞圍万里名曰小有靑虛之天至於廣雅南楚江湘凡船之大者謂之舸辛勤不見華蓋君艮岑靑輝慘么麼鄭曰上烏堯反下亡果切劉良曰小也洙曰葛仙翁傳崑崙一曰玄圃臺一曰華蓋仙人所居趙曰公昔遊云昔謁華君深小洞宫腦王官巳上天白日亦寂寞暮升艮岑頂巾几猶未却詳考二詩之意蓋公之遊王屋本欲謁華蓋君適值君死也千崖無人萬壑靜三步回首五步坐修可曰曹公祭橋玄文有曰車過三步腹痛莫怪李陵别蘇武詩曰轅馬顧悲鳴五步一倣徨秋山眼冷魂未歸仙賞心違淚交墮洙曰謝靈運曰賞心樂事四者難并陸機中心若有違趙曰上句言望華蓋君招之而不來也下句言欲為仙賞之遊而事與願違所以悲泣也宋玉招魂有魂兮歸來者凡十二今言未字者反言之也唐昌王蘂花詩云魂消眼冷未逢真豈出於杜公乎弟子誰依白茅洙曰一作石室盧老獨啓靑銅鎖鄭曰盧遨見淮南子巾拂香餘搗藥塵階洙曰一作前除灰死燒丹火玄圃滄洲莽空闊洙曰十洲記曰崑崙山三角一角正于北辰星輝名曰閬風嶺其一角正西日玄圃臺其一角正東曰崑崙宫其一處有積金為天鏞城西千里城安金臺茅君內傳曰八海之中崑崙蓬萊方丈瀛洲白山八亭之山所以山神有洞宫修可曰葛仙傳云崑崙一曰玄圃也滄洲十洲之一洲也舊注引茅君內傳正謬妄矣金節羽衣飄婀娜鄭曰上於可切下奴可切美也落日𥘉霞閃餘映洙曰以黃金為節鳥羽為衣漢武帝拜欒大為五利將軍使衣羽衣立白茅上受印注以鳥羽為衣取其神仙飛翔之意趙曰言華蓋君金節羽衣之所往來有落日初霞之輝映王仲宣詩山岡有餘映倐忽東西無不可洙曰言其飛翔無所往而不可松風澗水聲合時鄭曰澗居晏切靑兕黃熊啼向我洙曰兕如野牛靑皮堅厚可以為㱯嶓冡之山其數多成王時東夷獻黃熊云韜曰文王囚羑里散冝生得黃熊而獻之按類書成王時不屠國獻靑熊未嘗獻黃熊也輒改以附㑹如此徒然咨嗟撫遺跡至今夢想仍猶佐趙曰公在山中愁寂不堪撫華蓋君之遺跡而夢想猶見之也袐訣隱文須內教晚嵗何功使願果洙曰使一云收更討洙曰一云覓衡陽董錬師洙曰董錬師神仙也隱於衡陽趙曰以為求仙須得有功行而傳祕訣不見華蓋君矣却思南遊而訪董錬師也南遊早鼓瀟湘柂洙曰晉庾闡楊都賦青雀飛艫余皇鼓柂夢符曰右按道藏書中有隱訣其書曰太淸九宫其最髙者稱太皇紫皇玉皇也師曰神仙有三十六洞天第一王屋山之洞名曰小有淸虛天崑崙山一曰玄圃一曰華蓋仙人之所居艮岑崑崙東北之岑甫昔遊小有洞不憚辛勤兾遇仙賞時盧道人結茅山下居焉甫謁之訪其仙術葛仙翁與費長房跳入壷中忽見殿閣崔嵬皆鎖閉葛喝之煙霧四起鎖自開闢今以盧比之葛仙翁故云獨起青銅鎖玄圃滄洲皆仙境金節以黃金為旌節羽衣以鳥羽為衣或曰鶴氅取其飛翔之意倐忽東西無不可美盧老得仙術飛空無往不可甫以乘興而來遊樂極則哀繼之故末言青兕黃熊啼向我蓋興尽而反故也撫遺跡謂撫循舊事形之夢想昔淮南王有鴻寶枕中祕訣其文字隱之不以示人故曰祕訣隱文須內教董錬師隱於衡陽即董京威也甫欲謁之故云南遊早鼓瀟湘柂柂所以正船也寄司馬山人十二韻關內昔分袂洙曰謝惠連詩飲餞野亭館分𬒮澄湖隂天邊今轉蓬洙曰曹子建詩轉蓬離本根驅馳不可說蘇曰劉韻曰年來驅馳不可與子細說恐子心折談笑偶然同道術曾留意先生早擊蒙洙曰蒙卦家家迎葪子洙曰後漢方術傳葪子訓有神異之道到京師公卿巳下候之者坐上常數百人皆為設酒脯終日不匱後因遁去遂不知所止處處識壷公洙曰費長房傳市中有老翁懸一壷於肆頭及市罷輒跳入壷中市人莫之見長房於樓上覩之異焉因往再拜長笑峨嵋北潜行玉壘東洙曰江賦峨嵋為泉陽之揭玉壘作東别之標曽曰潜行言晦迹也有時騎猛虎虛室使仙童髮少何勞白梅曰此以下甫自嘆也顔衰肯更紅望雲悲轗軻洙曰陶替詩望雲慙飛鳥臨水愧遊魚畢景羡冲融洙曰謝靈運詩餘景逐前儔謝希逸賦餘景就畢韓曰言司馬養和氣如陽春也喪亂形仍役蘇曰徐邈喪亂之際形役心勞兒女寒瘦雖有厥居不暇少安趙曰陶淵明云既自以身為形役凄凉信不通懸旌要路口趙曰史記云搖搖懸旌無所終薄倚劒短亭中修可曰宋玉賦云倚長劒兮天外康曰縣旌倚劎言屯戍之兵以防寇盜永作殊方客殘生一老翁相哀骨可換亦遣馭淸風洙曰莊子云列子御風而行泠然善也玄都壇歌寄元逸人師曰元逸人隱道士也有神仙術甫作詩寄贈之故人昔隱東蒙峯巳佩含景蒼精龍洙曰論語夫顓臾昔先王以為東蒙主以蒙山在東故曰東蒙地理志泰山蒙隂縣禹貢徐州蒙羽其藝故云蒙地也蘇曰壷翁云吾當佩含景駕蒼精逍遙於絳闕赤城含景日月之精華蒼精東方之蒼龍也佩服也趙曰蒼精龍劒也蔡曰春秋繁露曰劒佩於左蒼龍之象詠曰後漢士孫端劎銘有云從革庚辛含景吐商故人今居子午谷獨在洙曰一作並隂崖結洙曰一作白茅屋洙曰王莽傳莽以皇后有子孫瑞通子午道從杜陵直絶南山徑漢中師古曰今京城直南山有谷通梁漢道名子午谷屋前太古玄都壇靑石漠漠常風寒子規夜啼山竹裂蘇曰竇誼居蜀之津源放浪不羈月夜子規啼庭竹誼曰當山竹裂吾可歸峩峯是夕竹裂黎民命駕遁于峩峯武帝三徴不起劉曰前輩詩云子規枝上月三更常以夜啼山中嫌其夜啼其聲哀怨故燒竹爆裂以驚飛言此蓋取其僻寂也王母晝下雲旗洙曰一作蟠翻洙曰離騷載雲旗之逶迤九歌乘回風兮載雲旗神異經東方有宫靑石為墻左右闕髙百丈畫以五色左思蜀都賦猩猩夜啼子規禽也人謂望帝魂修可曰王母鳥名故子美以對子規酉陽雜爼云齊郡函山有鳥足青觜赤黃素翼絳顙名王母使者又王椿齡云其尾五色長二三尺許飛則翩翻正如旗狀趙曰對子規啼又竹裂言啼之苦也雲旗者神仙之儀衛也劉曰周穆王與王母㑹於瑶池雲旗霓裳擁簇自天而下詩言此蓋取其與神仙往來之意知君此計誠長往芝草琅玕曰應長洙曰後漢逸民論長往之軌未殊庾肩吾蜘蛛玩芝草芝葉正玲瓏十洲記鍾山在北海之子地仙家數十万耕田種芝草課計頃畒本草青琅玕生蜀郡平澤蘇業注云琅玕有數種是琉璃之類火齊寶也琅玕五色具以青者入藥為勝出嶲州以西烏白蠻中及于闐國靈異兼圖載琅玕青色生海中云海底以網掛得之𥘉出水紅色久而青黑枝柯似珊瑚而上有孔竅如蟲蛙擊之有金石之聲乃與珊瑚相類禹貢雍州厥貢璆琳琅玕尓雅云西北之美者有崑崙墟之璆琳琅玕孔安國郭璞皆以為石之似珠者而山海經云崑崙山有琅玕是玉之美者明瑩若珠之色而其狀森植耳鐵鎖髙垂不可攀致身福地何蕭爽洙曰三秦記云終南太一山左右三十里內名福地西有石室靈芝魏都賦玄雲舒霓以髙垂趙曰詩人逆料其如此如乾州金精山女仙張麗英升仙之地有鐡鎖下垂然則詩人逆料元逸人之長往亦復然乎師曰按神仙訣録有天仙地非三十六洞天八十一福地由地仙積纍功行遂超升天仙今逸人致身福地巳為地仙之流何其瀟灑清爽神氣不凡故也貽阮隱居昉陳留風俗衰人物丗不數鄭曰數所矩切洙曰晉書阮籍字嗣宗陳留尉氏人也父瑀魏丞相掾子渾姪咸咸子瞻弟孚咸弟子修孚族弟放放弟𥙿皆陳留人塞上得阮生逈繼先父祖貧知靜者性自益毛髮古修可曰謝靈運過始寧墅詩云還得靜者便車馬入鄰家蓬蒿翳環堵洙曰江文通詩顧念張仲蔚蓬蒿滿中園莊子庚桑楚鑿垣墻而殖蓬蒿昭十六年傳斬之蓬蒿藜藿而共處之月令藜莠蓬蒿並興儒行儒有一畒之宫環堵之室注環堵靣一堵也五版為堵五堵為雉張景陽詩環堵自摧毀淸詩近道要趙曰傳咸贈崔伏詩云人之好我贈我清詩識字用心苦洙曰劉棻嘗從揚雄學作竒字劉歆觀之泣曰空自苦宋曰昉善篆隸故云云尋我草徑微褰裳踏寒雨洙曰崔駰達旨辭曰與其有事則褰衣儒足冠掛不顧更議居逺村避喧甘猛虎魯曰沈休文詩避丗非避喧足明箕潁客榮貴如糞土洙曰陸士衡云徐翰少無宦情有箕潁之心晉語玉帛酒食猶糞土也愛糞土以毁五常無乃不可乎箕山名潁水名許由巢父隱處也禧二十八年傳榮季曰况瓊玉乎是若糞土也師曰識字用心苦時昉踏雨尋訪甫議欲遠引深遁謝絶當丗不接喧囂雖餧猛虎所甘心也甫謂其真有箕山潁水之節視榮貴如糞土然覃山人隱居南極老人自有星洙曰見南極一星朝北斗注趙曰老人星一名南極在井柳中乃南方星今言覃山人本隱居此地蓋自是南極之老人星也北山移文誰勒銘洙曰齊書孔稚圭字德璋同彥倫隱鍾山移應詔出德璋作北山移文其文云馳驛煙路勒移山庭徴君巳去獨松菊洙曰陶潜為徴君㱕去來云松菊猶存哀壑無光留户庭洙曰殷仲文哀壑叩虛北山移文云誘我竹松欺我雲壑豫見亂離不得巳蘇曰蘇嶷謂嵆康子與登肥遁宜其時也豫兒女滿眼又值亂離不得巳而返居塵埃中非吾素所願也子知出處必須經趙曰上句以巳微諷之言也我所以不仕而流落於外正亂離之故耳而覃山人者何事而出哉故又以能經出處譏之也髙車駟馬帶傾覆洙曰揚雄解嘲云客徒欲朱丹吾轂不知一跌赤吾之族悵望秋天虛翠屏洙曰天台賦聳壁立之翠屏與李十二白同尋范十隱居李侯有佳句往往似隂鏗洙曰陳書阮卓傳武威隂鏗字子堅五歲能誦賦日千言及長博涉史傳尤善五言詩為當時所重有集三卷行於丗余亦東蒙客洙曰語孔子曰夫顓臾昔者先王以為東蒙主在東故曰東禹貢徐州蒙羽其藝趙曰東蒙山名公時在兖州故云憐君如弟兄醉眠秋共被洙曰姜肱兄弟同𬒳而寢趙曰晉祖逖劉琨情好綢繆共被而寢携手日同行更想幽期處還尋北郭生洙曰列子與北郭生連牆而不相通趙曰北郭生指言范十隱居也舊注所引列子乃南郭生非是入門髙興廢修可曰殷仲文詩能使髙興盡侍立小童清落景聞寒杵洙曰落景落照也屯雲對古城向夾吟橘頌洙曰張華有橘詩郭璞有贊惠連有賦修可曰楚詞自有橘頌非橘詩贊賦也今備載之曰皇嘉樹橘徠服弓受命不遷生南國兮深固難從更一志兮緑葉傃榮紛可喜兮曽枝剡棘圎果博兮青黃雜揉文章爛兮精色內白類可任兮紛緼冝修姱而不愧兮差尓糿志有以異兮獨立不遷豈不可兮深固難徙廓其無求兮蘇丗獨立橫而不㐬兮閉心自愼終不失過兮秉德無私參天地兮願歲并謝與長友兮淑離不淫梗其有理兮年歲雖少可師長兮行此伯夷置以為像兮誰欲討蓴羮洙曰陸機傳機昔詣侍中王濟濟指羊酪謂機曰卿吳中何以敵此答曰千里蓴羹未下鹽豉時為名對趙曰張翰在齊王冏府冏時執權翰畏禍及因見秋風起乃思吳中菰菜蓴羮鱸魚鱠曰人生貴適志何能羈宦數千里以要名爵乎遂命駕而㱕舊注所引非師曰其時甫遊山東故云東蒙客北郭生以比范隱居小童清言無塵俗氣甫咀味李白之詩雖張翰蓴羹之美不足思也故云誰欲討蓴羮不願論簪笏悠悠滄海情趙曰故公無復簪笏之願而欲寄情江海題張氏隱居三首春山無伴獨相求伐木丁丁山更幽洙曰丁丁伐木聲鄭曰丁寧耕切伐木聲也澗鳥餘寒歷冰雪洙曰一云澗道陸機苦寒行凝水結重澗積雪𬒳長巒石門斜日到林丘洙曰謝靈運詩落雪灑林丘不貪夜識金銀氣洙曰史天官書敗軍破國之墟下積金寶上皆有氣不可不察以不貪故不夜識氣象也逺害朝看麋鹿遊洙曰伍被諌淮南王曰昔子胥諌吳王吳王不用乃曰臣今見麋鹿遊姑蘇之臺今臣亦將見宫中生荆棘露霑衣也乘興杳然迷出處洙曰言不以出處介意也對君疑是泛虛舟洙曰莊子山水篇方舟而濟於河有虛船夾觸舟雖有𥚹心之人不怒人能虛巳以遊丗孰能害之師曰歷冰雪言甫破雪訪鄭氏斜日到林丘言所居幽遠也張全身遠害於此與鹿豕游說者以麋鹿遊姑蘇之臺則誤矣虛舟以喻虛巳以遊丗之子時相見邀人晚興留濟洙曰一作霽潭鱣發發鄭曰鱣諸延切發北未切洙曰碩人詩鱣鮪發發釋文鱣大魚口在頷下長二三丈江南呼為黃魚與鯉全異發發盛貌春草鹿􅊯􅊯洙曰詩􅊯􅊯鹿鳴食野之蘋注鹿得草􅊯􅊯然鳴而相呼也蘇子卿詩去鹿鳴思野草可以喻嘉賔杜酒偏勞勸洙曰魏武帝樂府何以解我憂唯有杜康酒杜康造酒者鄭曰儀狄造灑杜康因之後丗只云杜酒張梨不外求洙曰潘安仁間居賦張公大谷之梨前村山路險歸醉每無愁師曰之子指張氏鹿食革則􅊯呦而求其類喻張氏之相招也張梨不外求言宴飲唯園果而巳意勤不必豐美其物盜賊之險可慮路險冝無愁也釋老寺觀附古詩八首律詩八首西枝村尋置草堂地夜宿贊公土室二首出郭眄細岑鄭曰眄莫甸切劉曰眄斜視也披榛得微路洙曰天台賦云披荒榛之蒙蘢趙景真書涉澤求蹊披榛覔路溪行一流水曲折方屢渡洙曰師古曰曲折言委曲也贊公湯休徒洙曰惠休上人姓湯好靜心迹素晏曰素謂質素也昨枉霞上作盛論巖中趣洙曰後漢旌車之招相望於嵓中怡然共携手恣意同逺步捫蘿澀先登洙曰天台賦攬樛木之長蘿謝靈運蔓弱豈可捫陟巘眩反顧鄭曰上語蹇切下熒絹切要求陽岡暖洙曰顔延年陽岡團精氣隂谷曳煙寒謝靈運朝旦發陽崖景落憩隂峯若涉隂嶺沍洙曰胡故切左太冲白云停隂岡丹葩曜陽林師曰山南曰陽山北曰隂山南向陽故暖山北背陽故沍寒惆悵老大藤沉吟屈蟠樹卜居意未展洙曰屈原卜居杖䇿迥且暮洙曰左大冲杖䇿招隱士趙曰字祖太公避狄杖䇿夫邠層巔洙曰一作天餘落日洙曰謝靈運築觀基層巔又云日落山照耀草蔓巳多露洙曰盧子諒凝露霑蔓草詩謂行多露天寒鳥巳歸洙曰陶潜衆鳥相與飛未夕復來㱕蘇曰鮑昭詩天寒日巳久出鳥自知歸又云天寒幽鳥㱕月出山更靜洙曰山一作人更一作巳沈休文月華臨靜夜夜靜滅氛埃土室延白光松門耿踈影洙曰謝靈運攀崖照石鏡牽葉入松門躋攀倦日短洙曰謝靈運常苦夏日短語樂寄夜永洙曰天台賦恣語樂以終日趙曰天寒則時在冬故用日短夜永出尚書日短星昴也明燃林中薪暗汲石底洙曰一作泉井大師京國舊德業天機秉洙曰莊子天機淺從來支許遊洙曰攴遁字道林講維摩經遁為法師許詢為都講遁衆謂無以歷難詢設一難以調遁不能復通興趣江湖逈數竒謫關塞洙曰李廣數竒孟康曰竒隻不耦也如淳曰數為胸奴所敗為竒不耦師古曰言廣命隻不耦合也孟說是矣數竒上所角切下居宜反黃曰師古以數竒為命隻不偶合則數乃命數之數非疏數之數也而音所角反蓋傳印之誤宋景公筆録云孫宣公奭當丗大儒亦以數竒為朔余後得江南漢書本乃所具反以此考之殆傳印者誤以具為角也因以此詩注猶仍舊音故特辨之徐敬業古詩云寄言封侯者數竒良可歎道廣存箕潁洙曰太丘道廣廣則難周謝靈運徐幹有箕潁之心何知戎馬間復接塵事屏鄭曰必郢切幽尋豈一路遠色有諸嶺修可曰郭璞詩色匕逺野嶺沉吟立夕陽晨光稍曚曨洙曰陶淵明恨晨光之熹微更越西南頂寄贊上人一昨陪錫杖洙曰天台賦振金䇿之鈴鈴金䇿錫杖也卜鄰南山幽趙曰左傳唯鄰是卜年侵腰腳衰未便隂崖秋趙曰晉潘嶽西征賦云眺華嶽之隂崖重岡北靣起竟日陽光留茅屋買兼土洙曰買一作置斯焉心所求近聞西枝西有谷杉黍洙曰一作漆稠亭午頗和暖洙曰天台賦羲和亭午孝祥曰御覽載纂要云日光曰景注云日月之光通明曰景日景曰晷日氣曰明日𥘉出曰旭曰昕曰晞注云大明曰昕晞乾也日溫曰煦在午曰亭午在未曰昳日晚曰旰日將落曰薄暮日西落光反照於東謂之返景在下曰倒景石田又足收夢符曰右按春秋左氏傳吳將伐齊越子率其衆以朝焉王及列士皆有饋賂吳人皆喜惟子胥懼曰是豢吳也夫得志於齊猶獲石田也無所用之越不為沼吳其泯矣今云石田足收則雖無用之田猶可種而穫也子美醉時歌又有石田茅屋荒蒼苔之句當期塞雨乾宿昔齒疾瘳洙曰塞一作寒徘徊虎穴上逸曰班超云不入虎穴安得虎子靣勢龍泓頭柴荆具茶茗徑路通林丘與子成二老來往亦風流洙曰謝靈運俶裝反柴荆孫綽風流為一時冠師曰二老言太公伯夷避紂之亂故隱居東海北海之濵今甫亦避唐亂而卜隱于此所以示譏也别贊上人百川日東流客去尓不息洙曰謝玄暉大江流日夜客心悲未央我生苦漂蕩何時有終極修可曰曹子建詩相思無終極贊公釋門老放逐來上國師曰贊公與房琯遊從琯既待罪替公亦𬒳謪上國京師也還為丗塵嬰侏曰陸士衡牽丗嬰時網又丗網嬰我身師曰贊公本脫俗人今反為世塵所纍嬰纍也頗帶憔悴色楊枝晨在手定功曰佛經云手把青楊枝遍灑甘露水豆子兩巳熟蘇曰崔玄見習鑿齒曰豆子熟矣張亘曰豆子眼中黑精也言無邪視也趙曰今取楊桞字以見贊當春方為寺王來秦州而巳見豆熟之際矣公宿贊公房曰杖錫何來此秋風巳颯然字同一義舊解惑楊栁字出佛書更引為齒木之用云云徒為贅矣是身如浮雲君平曰語視冨貴如浮雲維摩經是身如響屬諸因緣是身如浮雲須臾變滅是身如電念念不在安可限南北洙曰蔡謨𥘉度江曰此天所以限南北也異縣逢舊友𥘉欣寫胸臆洙曰古樂府他鄉各異縣天長關塞寒歲暮飢凍逼洙曰一云長天關塞逺歲暮飢寒迫趙曰當作飢寒字别留詩在十月而此云嵗暮者以見將為歲暮之計以救飢寒也野風吹征衣欲别向曛黑洙曰鮑明逺野風吹秋木行子心腸斷謝靈運詩朝遊窮曛黑禹稱曰日入為黑馬嘶思故櫪洙曰嘶一作鳴王正長朔風動秋草邊馬有歸心歸鳥盡斂翼洙曰陶潜日入群動息歸鳥趍林鳴古來聚散地蘇曰長安乃古今聚散榮辱之地崇山遠水惟與騷客作愁具宿昔長荆棘洙曰姑蘇臺詩荆棘霜露沾人衣相看俱衰年出處各努力蘇曰王導别阮彥曰冝努力為王古詩云明時各努力又云努力冝加飾田曰吳越春秋載越人送其子弟作離别相去之辭曰行行各努力師曰此蓋歎兩都之地昔與贊公或聚或散於此今經祿山之亂盡長荆棘况二人俱當衰年出處之迹可不勉乎謁文公上方野寺隱喬木山僧髙下居石門日色異絳氣橫扶踈洙曰江文通絳氣下縈薄注云絳氣赤霞氣也窈窕入風磴鄭曰丁鄧切薖曰風磴風路也石梯曰磴逸曰窈窕幽深貌長蘿紛卷舒洙曰陶潜既窈窕以尋壑謝靈運側徑既窈窕庭前猛虎卧洙曰高僧傳僧惠永感虎來馴遂得文公廬俯視萬家邑煙塵對階除吾師雨花外洙曰髙僧傳有講經而天雨花者不下十年餘長者自布金洙曰給孤長者以黃金側布于祗園地禪龕只晏如鄭曰龕苦含切大珠脫玷翳白月當空虛洙曰大珠曰月言其性之圎明也故佛書有摩尼珠及水月之說又曰望巳前為白月望巳後為黑月見佛書甫也南北人洙曰檀弓曰今丘也乃東西南北之人革曰甫以漂蕩無定居故云云蕪漫少耘鋤師道曰謂性地荒而不修也久遭詩酒汚師曰甫嗜酒好吟每多因詩酒忤權貴故云云何事忝簪𥚑端本曰簮𥚑士大夫之服王侯與螻蟻同盡隨丘墟願聞第一義回向心地𥘉洙曰第一義言其教無上也佛書修行有十地以歡喜為𥘉地金箆刮眼膜鄭曰箆邊迷切刮古殺切膜末各切洙曰見金箆空刮眼注師曰凡看經明逹性本譬如以金篦刮去眼膜所視豁然甫欲文公以無上教開發甫性使悟無生法價重百車渠鄭曰車昔遮切洙曰法華經或有行施金銀珊瑚真珠摩尼硨磲瑪瑙無生有汲引兹理儻吹噓大覺髙僧蘭若楷曰和尚去冬住湖南若爾者切巫山不見廬山逺趙曰廬公惠逺也松林蘭若秋風晚洙曰蘭若寺也一云蘭蘭也若杜若也修可曰釋氏要覽曰蘭若者𣑽言阿蘭若唐言無諍回分律云空靜處薩婆多論云間靜處智度遠離處大悲經云阿蘭若者離諸忽務數說不同其實無諍注以為蘭草杜若非一老猶鳴日暮鍾諸僧尚乞齊時飯香爐峯色隱晴湖洙曰香爐峯廬山之勝境也勢如香爐上有飛泉趙曰遠法師廬山記曰東南有香爐山孤峯秀起種杏仙家近白榆洙曰神仙堇奉居廬山治病重者種杏五株輕者一株號董仙杏林趙曰云近白榆言其所居之髙近乎星辰也古詩曰天上何所有歷歷種白榆飛錫去年啼邑子洙曰髙僧傳有飛錫而赴齊者定功曰要覽又云昔髙僧隱峯遊五臺出淮西擲錫飛空而往西天比丘持錫有二十五威儀凡至室中不得著地必掛於壁牙故釋子稱遊行僧為飛錫安住僧為掛錫孫綽天台賊云王喬控鶴以冲天應真飛以躡虛趙曰言其去冬往湖南也注云得真道之人執錫杖而行於虛空故云飛也邑子同邑之子也獻花何日許門徒洙曰髙僧傳僧有戒行嚴潔天女來獻花趙曰後分經載釋伽為靜慧仙人時獻五蓮花於燃燈佛此獻花之祖也其在佛僧則謂諸弟子之來從者為門徒矣大雲寺贊公房四首燈影照無睡心清聞妙香修可曰維摩經曰有國名衆香佛號香積其界皆以香作樓閣其國如來無文字說但以衆香令諸天人得入律行菩薩各坐香樹下聞斯妙香即獲得藏三眛夜深殿突兀風動金琅璫天黑閉春院地淸棲暗芳玉繩回斷絶洙曰王繩星名鐡鳯森翺翔𣑽放時出寺鍾殘仍殷床洙曰玉繩回斷絶則夜欲向晨矣鐡鳯舊注引陸倕石闕銘銅雀鐡鳯之工其說是蓋施雀鳯於屋春上者𣑽放蓋佛事至𣑽音必唱而誦之故詩外可聞也殷上聲殷其雷之殷明朝在沃野洙曰沃野千里苦見塵沙黃饒曰時西郊逆賊拒官軍未巳童兒汲井華憤捷瓶上手修可曰按本草井華水令人好顔色與諸水有異謂井中水平旦第一汲者霑灑不濡地掃除似無帚洙曰周禮宫人凡寢中之事掃除趙曰灑濡地則沮洳掃有帚則除塵根也明洙曰一作晨霞爛復道夢符曰右按廣韻復重也又古詩交疏結綺窗阿閣三重階霽霧搴髙牖修可曰陸士衡詩髙談一何綺對若朝霞爛梁元帝詩能令雲霧搴側塞𬒳徑花飄颻委墀栁洙曰九辨云皋蘭𬒳徑兮斯路漸非阮籍詩皋蘭𬒳徑路艱難丗事迫蘇曰陳衡丗路艱難老夫迫於在事隱遁佳期後洙曰郭墣遊仙詩山川隱遁捷晤語契深心郍能惣鉗口鄭曰鉗其廉切洙曰鉗口結舌蘇曰袁紹曰諸大未見朝錯㹅皆鉗口莫敢措一辭今諸侯分土公等何計奉辭還杖䇿暫別終回首洙曰曹操奉辭出征房元齡䇿杖謁於太宗軍門謝靈運山賦杖桂䇿以山逰王粲詩南登灞陵岸回首望長平徐敬業回首見長安趙曰奉辭相奉而辭別之舊注引奉辭出征其義非泱泱泥汚人聽聽國多狗鄭曰聽魚斤切洙曰宋玉九辨猛犬狺狺而迎吹兮關梁閉而不通皇天淫溢而秋霖兮后土何時得乾鮑曰天寶十五年七月賊將張通儒收録衣冠以僞命不從者殺之公晦迹幽隱故云泱泱泥汚人聽聽國多狗既未免羈洙曰一作寓絆洙曰晉慕容垂猶鷹也宜急其羈絆時來憩奔走趙曰於此未免羈絆則亦僅能時來憩息耳近公如白雪執熱煩何有趙曰詩誰能執熱逝不以濯心在水精域洙曰清淨境土也趙曰江㹅大莊嚴寺碑云光遍水精之域蓋佛寺莊嚴皆以金寶故也衣霑春雨時洞門盡徐步深院果幽期馬曰謝靈運詩平生協幽期師曰甫與贊公有期於洞門徐步以待雖春雨霑衣不為之避禮遇之誠可見矣到洙曰一作倒扉開復閉撞鍾齊及兹醍醐長發性洙曰釋經言聞正法如食醍醐然趙曰陶隱居云佛經稱乳成酪酪成酥酥成醍醐醍醐乃酥酪之精液也覺範曰丗說云淳酪養性人無妬心則醍醐之能發性抑可知巳此釋經所以取喻正法也飲食遇扶衰把臂有多日洙曰絶交論把臂之英開懷無愧辭洙曰開懷言露底裏黃鶯度結構洙曰見新亭結構罷注紫鴿下罘罳鄭曰鴿葛台切余曰前漢文帝紀未央宫東闕罘罳災師古曰罘罳謂連闕曲閣也以覆重刻垣墉之處其刑罘罳然一曰屏也罘音浮愚意㑹所適花邊行自遲湯休起我病微笑索題詩洙曰沙門惠休姓湯氏善屬文趙曰僧易惠善詩與文以比贊公也細軟靑絲履光明白㲲巾鄭曰㲲逹協切毛布也深藏供老宿取用及吾身洙曰以白㲲布為巾老宿僧之年老而有宿德者以供老宿之物而奉吾所以言其敬時可曰南史髙昌國多草木有草實如繭中絲如細纑名為白㲲國人取織以為布自顧轉無趣交情何尚新道林才不丗洙曰攴遁字道林有才辨惠逺德過人洙曰髙僧惠遠有夙德雨㵼暮簷竹風吹青洙曰一作春井芹天隂對圗畫最覺潤龍鱗師曰天隂對圗畫言二人相對如畫圗中人也揚子雲攀龍蘇附鳯翼最覺潤龍鱗言攀附贊公而有所滋潤也宿贊公房彥輔曰替大雲寺主謫此安置杖錫何來此秋風巳颯然雨荒深院菊霜倒半池蓮師曰昔慧遠禪師與陶淵明結白蓮社甫平昔與􅐌公遊從亦其比也今之霜倒半他蓮言蓮社冷落也放逐寧違性洙曰性安窮逹不以放逐而違尓虛空不離禪洙曰釋經以禪宗為空門趙曰在空寂之處亦禪家所宜相逢成夜宿隴月向人圎題玄武禪師屋壁何年顧虎頭趙曰丗說載顧愷之為虎頭將軍舊注以為僧相誤矣滿壁畫瀛洲修可曰顧愷之字長康小字虎頭晋陵無錫人多才氣尤工丹靑傳寫形勢莫不絶妙曽於瓦棺寺北殿畫維摩詰畫訖光照月餘日赤日石林氣靑天江海洙曰一作水流趙曰此自皆言所尽之景物也錫飛常近鶴洙曰天台賦振金䇿之鈴鈴飛錫杖也有人遺支道林鶴者道林放之田田引圗經舒州潜山最竒絶而山麓尤勝志公與白鶴道人欲之同謀於梁武帝帝以二人悉具靈通俾各以物識其地得者居之道人云某以鶴止處為記巳而鶴先飛去至麓將止忽聞空中錫飛聲志公之錫遂卓於山麓道人不懌然以前言不可食遂各以所識築室焉杯渡不驚鷗洙曰髙僧傳杯渡者不知其名姓常乘木杯渡河因名焉不修細行不甚精持飲酒食肉與俗人不殊佛圗澄變化詭異圗澄在石勒時以為海鷗趙曰傳燈録載劉宋時杯渡者不知姓氏常乘木杯渡水嘗宿一家竊一金像去主人追之至孟津浮木杯渡河無假風悼輕疾如飛不驚鷗使列子海人有狎鷗之意舊注所引非似得廬山路真隨惠遠遊洙曰丗說逺公在廬山雖老講論不輟弟子中或有墮者遠公曰桑榆之光理無遠照但願朝陽之輝時與並光明耳趙曰言所畫之趣似是廬山路可以尋惠遠大師也沈曰昔陶淵明與惠遠遊從結白蓮社甫以比之謁真諦寺禪師蘭若山髙處洙曰蘭若寺名煙霞嶂幾重凍泉依細石晴雪落長松洙曰天台賦落落之長松問法看詩妄觀身向酒慵未能割妻子卜宅近前峯洙曰費長房弃妻子以從壷公趙曰如宋周顒長於佛理於鍾山西立隱舍終日長𬞞雖有妻子獨處之此於卜宅近寺翁為可證也舊注以費長房弃妻子從壷公遊非是許設一難遁不能復通趙曰攴遁講維摩經許詢常設問難公蓋言我空忝為許詢之流而難酬對攴遁所以美巳上久也留别公安太易沙門隱居欲就廬山逺麗藻𥘉逢休上人洙曰湯休上人數問舟航留製作長開篋笥擬心神沙村白雪仍含凍師曰張子平西京賦其逺則有九峻甘泉涸沍寒日北至而含凍此焉清暑相如上林賦其北則含凍裂地涉氷揭河江縣紅梅巳放春先踏爐峯置蘭若徐飛錫杖出風塵洙曰爐峯香爐峯也在潯陽廬山有東西二林寺因許八奉寄江寧旻上人不見旻公三十年封書寄與淚潺湲舊來好事今能否老去新詩誰與傳洙曰與一作為碁局動隨尋澗竹洙曰尋一作幽袈裟憶上泛湖船聞君話我為官在頭白昏昏只醉眠趙曰袈裟僧人之衣詩家亦為熟字用耳寺觀古詩四首律詩一十五首遊龍門奉先寺魯訔曰龍門在西京河南縣地志曰闕塞山一名伊闕而俗名龍門巳從招提遊更宿招提境洙曰僧史後魏太武帝始光元年創立伽藍為招提之境隋大業中改天下寺為道場至唐復為寺師曰釋氏書招提菩薩皆古佛號故寺謂之招提或多伽藍或名道場其實一也隂壑生靈籟昱曰莊子齊物篇汝聞人籟而未聞地籟汝聞地籟而未聞天籟注簫也音賴彥輔曰沈佺期西嶽詩隂壑以永閉師曰山南曰陽山北彐隂以其背陽故為重隂沍寒之地風聲為天籟水聲為地籟笙竿為人籟靈籟即風也靈者善也如雨曰靈雨月林散淸影洙曰謝莊月賦聲林虛籟淪也滅波梁昭明太子鍾山解講暾出岩隱光月落林餘影師曰万物之影無如月影最清謂之金波蓋取其清也古云人間何處無風月才到僧坊分外清蓋言奉先寺風聲月影皆佳致也天闕洙曰一作閲象緯逼軾曰閲字當作闕或作䦚蔡天啓云古本作窺史以管窺天王介甫云當作天閲對雲卧為清切蔡絛云韋述東都記龍門號雙闕以與天內峙若天闕焉此遊龍門寺詩用闕字又何疑十朋曰王直方詩話亦云夢符曰右按山謙之丹陽記曰大興中議者皆言漢司徒許彧墓闕可徙施之王茂弘弗欲陪乘出宣陽門南望牛頭山兩峯曰天闕也豈煩改作帝然之又晉雷煥妙逹象緯彥輔曰庾肩吾經禹廟詩侵雲似天闕雲卧衣裳冷次公曰後漢郅惲傳惲明天文歷數仰占玄象其說逮並日非窺天者不可與啚逺鮑昭升天行有雲卧恣行天孟浩然有雲卧晝不起也欲覺聞晨鍾鄭曰覺居效切寤也令人發深省蘇曰陶淵明聞遠公議論謂人曰令人頗發深省彥輔曰庾信詩山寺響晨鍾杜言人境俱靜則發越塵慮無不省覺師曰天闕者龍門也按地理志今河南郡春秋時地屬魏後魏兼置雍州及屬秦州今龍門縣在府東一百八十里古耿國有龍山即禹所鑿三秦記云魚鱉上之即為龍否則點額而還兩山對峙如門然故曰龍門龍門乃天之闕門也王介甫以天闕不可對雲卧改為天閲閲視也視天上象緯逼近殊不知此詩乃詠龍門有取於闕其理必然二十八宿為經五星為緯象緯逼言龍門山之髙也山髙則多雲霧夜宿此寺如卧雲中衣裳皆冷潤釋氏有聲聞緣覺耳有所聞而悟未若心解之為上也其悟道則一如香岩和尚一日掃庵瓦礫擊竹聲忽然大悟又如道吾聞巫吹角瞥地大省此得乎聲聞而有所覺者也甫言睡覺忽聞晨鍾令人深有省悟其亦香岩道吾之儔得於聲間緣覺者耶山寺野寺殘僧少山園細路髙麝香眠石竹洙曰麝鹿也蘇曰麝香鳥名也石竹野花也麝香之鳥其骨極小石竹之花微弱叢生而纎短麝香所以能眠其間釋者以謂麝鹿也豈能眠於石竹或以謂釋者是師曰天厨禁臠云麝香小鳥也與蘇注同鸚鵡啄金桃亂水通人過定功曰詩涉渭為亂懸崖置屋牢蘇曰姚崇𣑽僧居麥積山下以岩造成屋今日為石岩寺上方重閣晚百里見纎毫嶽麓山道林二寺行玉泉之南麓山殊洙曰玉泉地名山足曰麓道林林壑爭盤紆修可曰盛弘之荆州記曰長沙西岸有麓山其下有精舍左右林嶺環回泉澗傍有礬石每至嚴冬其水不停霜雪宗淵麓山記云足曰麓蓋衡山之足也趙曰張平子南都賦溪壑錯謬而盤紆寺門髙開洞庭野殿腳插入赤沙湖洙曰洞庭赤沙皆湖名五月寒風冷佛國六時天樂朝香爐洙曰香爐峯名趙曰直言佛寺之香爐耳此乃衡山詩而舊注云香爐峯却是廬山寺矣地靈步步雪山草洙曰釋書言佛得道於雪山趙曰楞嚴經云雪山大力白牛食其山中肥膩香草僧寶人人滄海珠洙曰言性貟明而無瑕類也趙曰如閻立夲稱仁傑曰可謂滄海遺珠矣塔劫宫墻壯麗敵香厨松道淸涼俱夢符曰右按梁劉孝威謝東宫賜聖僧餘饌啓曰齊桓柏寢之器周穆軒宫之寶乳麋香飯素榛糗漿五杏七桃靈瓜仙棗莫不氣馥上天薰流下界石崇芳果金谷僅於万株陳湯木滋杜陸幾於千樹猶自髙謝珍竒多慙品族蓮花洙曰一作池交響共命鳥洙曰釋經有共命鳥二首一身金榜雙回三足烏洙曰三足烏言寺額金榜有回鵉反鵲之勢也趙曰阿弥陀經極樂國常有迦陵頻伽共命之鳥金榜出神異經西方有宫五色黃門有金榜而銀􅍢淮南子日中有踆烏注云三足烏也方丈涉海費時節玄圃尋河知有無洙曰天台賦涉海則方丈蓬萊張騫贊曰禹本紀言河出崑崙自張騫使大夏之後窮河源惡覩所謂崑崙者乎玄圃乃崑崙也史記海中有三神山一曰方丈玄圃崑崙山别名以言方丈元圃逺在何處皆不可得往不若今嶽麓寺之傍近可即而居也所以下向有桃源橘洲之興暮年且喜經行近春日兼蒙暄暖扶飄然班白身奚適旁此煙霞茅可誅洙曰楚詞誅鉏草茅以全生乎言當暮年𣣔誅鉏草茅旁此而居也桃源人家易制度洙曰桃源秦人避難之地易制度言丗更變也趙曰桃源在今鼎州易制度言其宫室朴略所以制度易為也舊注非橘洲田土仍膏腴洙曰橘州在長沙夢符曰右按襄陽記曰李衡於武陵龍陽洲上種橘千樹曰千頭木奴又前漢書張禹買田四百頃皆涇渭膏腴土價潭府邑中甚淳古太守庭內不喧呼昔遭衰丗皆晦迹今幸樂國養微軀依止老宿亦未晚洙曰老宿僧之年臘髙者冨貴功名焉足圖久為野客尋幽慣細學何顒免興孤洙曰見何顒興未忘注一重一掩吾肺腑洙曰一重一掩山也有如吾肺腑然夢符曰右按前漢書衛青曰吾幸得以肺腑待罪行間山花山鳥吾友于洙曰與之同處若兄弟也夢符曰右按南史劉湛傳友于素篤宋公放逐曾題壁物色分留與洙曰一作侍老夫洙曰宋之問之貶也塗經於此有詩尚在壁間師曰盛弘之荆州記曰長沙西岸有麓山其下有精舍左右林嶺環回泉澗傍有礬石每至嚴冬其水不停山足曰麓蓋衡山之足也盤紆回環也洞庭赤沙皆湖名香爐峯名楞嚴經云雲山大力白牛食其山中肥膩香草此牛唯飲雪山香水其糞微細可合和旃旜珠貟明無瑕翳其性如之塔劫即塔級也猶云一級二級甫贈李雍詩云龍宫塔廟湧浩劫浮雲衛王臺觀詩云浩劫因王造平臺訪古遊釋氏有香積厨其味淸涼如食甘露弥陀經云極樂國常有迦陵頻伽共命之鳥是諸衆鳥晝夜六時出和雅音其音演暢五根五力七菩提分八聖道分如是等法日中有三足烏金榜指寺額有回鵉返鵲之勢海中有蓬萊方丈山秦始皇遣人入蓬萊方丈求仙人歷時不得至故云費時節玄圃即崑崙河水出崑崙山甫以麓山道林猶勝於方丈玄圃暮年喜託此斬茅以居兼得日暚扶杖桃源乃秦人避亂之地易制度言丗更變也武陵啚經云橘州在龍縣東北五十里二百步周回三十里孤乃孤負也昔宋之問貶經此留題在壁甫至此復得呤詠景物故曰物色分留與老夫同諸公登慈恩寺塔洙曰李肇國史譜進士既捷列名于慈恩寺塔謂之題名貞元中劉太真侍郎試慈恩寺望杏園花詩兩京新記西京外郭城朱雀街東第三街皇城東之第一街進業坊慈恩寺隋無漏寺之故地武德𥘉廢貞觀二十年髙宗在春宫為文德皇后所立故以慈恩為名南院臨黃渠竹木森邃為京城之最寺西院浮啚六級髙三百尺永徽三年沙門玄楚所立浮啚內有𣑽本諸經數十匣浮啚前東階立太宗皇帝撰三藏聖教序及高宗皇帝述聖記二碑並禇遂良書立於弘福寺及此寺髙摽跨蒼穹烈風無時休趙曰以言其高也烈風唯髙處然後有之公古柏行又曰冥又孤髙多烈風自非曠士懷登兹翻百憂洙曰王仲宣登樓賦登兹樓以西望兮聊假日以銷憂兔爰詩我生之後逢此百憂魏文帝雜詩烈烈北風涼陸士衡詩感物百憂集劉越石云負杖行吟則百憂俱怫至曹子建遂使懷百憂潘安仁詩烈夕風厲孔子臨河而歎逝者梁鴻望帝京而作五噫甫之百憂蓋有所傷云師曰甫登此塔俯視兵火之後景物蕭條寧無憂傷乎惟曠逹之士對此能遺適耳方知象教力洙曰突厥寺碑四天之下聞諸象教王筠棲頭陀寺碑正法既沒象教陵夷注謂為形象以教人趙曰言危樓髙觀丗間無有惟託之象教而後可營足洙曰一作立可追冥搜洙曰孫興公遊天台山賦非夫遠寄冥搜篤信通神者向肯遙想而有之仰穿龍蛇窟始出枝撑幽鄭曰撑抽庚切邪柱也此塔磴道屈曲則公有龍蛇窟之句冝矣塔每級之下蓋多枝撑至其尽級髙處則為出枝撑幽矣七星在北户洙曰一云户北河漢聲西流洙曰愧文帝雜詩天漢回西流鮑明逺玩月城西門靈光賦枝牚擬丫而斜據也革曰鮑明遠詩夜移河漢落徘徊入户中趙曰言其髙也吳都賦門北户以向日於塔言户則法革經云佛以右指開寶塔户也河漢天河也黃曰漢雅云天河謂之天漢亦曰河漢以其在西若聞其流聲焉洙曰張協賦曰天漢西流羲和鞭白日洙曰晉傳玄日升歌羲和𥘉攬轡六龍並騰驤廣雅曰羲和日馭也趙曰淮南子云日馭曰羲和故於白日方可以言鞭之少昊行淸秋洙曰月令孟秋之月其帝少昊注少皥金天氏殷仲文詩獨有清秋日晉潘尼朱明送夏少昊迎秋泰山忽破碎涇渭不可求俯視但一氣焉能辨皇州洙曰謝玄暉詩春色滿皇州趙曰皆言其髙也敏功曰潘嶽西征賦化一氣而甄三才天子之都曰皇州回首叫虞舜蒼梧雲正愁洙曰山海經曰南方蒼梧之川其中有九疑山舜之所葬在長沙零陵界也惜哉瑶池飲洙曰鮑明遠舞鶴賦朝戲乎芝田夕飲乎瑶池穆天子傳周穆王觴西王母于瑶池上西王母為天子謡曰白雲在天山陵自出道里悠遠山川間之將子無死尚能復見天子答曰子㱕東土和治諸夏万民平均吾顧見汝比及三年將復而野日晏崑崙丘洙曰穆天子傳曰天子遂宿于崑崙之阿赤水之陽吉日辛酉天子升于崑崙之丘以觀黃帝之宫紀年曰周穆王西征至崑崙丘見西王母止之葛仙翁崑崙一曰玄圃一曰積石瑶房一曰閬風臺一曰華蓋一曰天柱皆仙人所居之處也趙曰此暗紀慈恩寺之事也南望而逺想蒼梧則記虞舜而思髙宗之晏駕西望而逺想瑶池則記西王母而思文德皇后之不留也敏功曰列女傳柳下惠妻為誅日惜哉乃下丗兮今公之可惜瑶池方冥乃以崑崙日宴而不得久非言文德之不留乎黃鵠去不息哀鳴何所投洙曰瑞應啚曰黃帝習樂崑崙以舞衆神玄鵠六翔其右韓詩外傳曰田饒事魯哀公而不見察謂哀公曰夫黃鵠一舉千里止君園池啄君稻粟君猶貴之以其從來逺也故臣將去君黃鵠舉矣戰國策曰莊辛謂楚襄王曰黃鵠遊於江海自以無患不知射者方修弧矢加巳百仞之上君看隨陽鴈各有稻粱謀洙曰禹貢楊州彭蠡既瀦陽鳥攸居注隨陽之鳥鴻鴈之屬冬月所居於此澤蜀都賦木落南翔氷泮北徂是也又庾信報趙王賜酒詩未知稻粱鴈何以報君恩此詩末章同歎山梁雌雉也趙曰公於前章日追思前事矣又因黃鵠之遠去雖若髙舉逺引之士然無所投止而我之俯丗徇身則未免若鴈之謀稻粱也髙曰黃鵠一舉千里志在飛騰鴻鴈隋陽志在稻梁當祿山之陷京城賢人髙舉逺引投竄林野有似黃鵠奈何詭隨之志受賊僞著不過苟得爵祿而巳豈不若隨陽之鴈志在逺圗唯在於稻梁自肥者耶陪李梓州王閬州蘇遂州李果州四使君登惠義寺春日無人境虛空不住天修可曰取佛書不住相意謂天運無常以成四時覺範曰不住者言無著也鶯花隨丗界樓閣倚山巔洙曰倚一作寄尓雅釋名山頂曰冡亦曰巔遲暮身何得洙曰言衰老而未有所得也登臨意惘然誰能解金印趙曰所以諷四使君也瀟灑共安禪洙曰一云三軍將五馬若箇合安禪蘇曰王得至少室山寺愛其瀟灑顧弟侍語曰好解金印共此安禪庶免榮華之事弟笑而不答和裴迪登新津寺寄王侍郎洙曰王時為蜀牧何限洙曰一作恨倚山木吟詩秋葉黃蟬聲集古寺鳥影度寒塘風物悲遊子蘇曰江淹過灞陵秋深葉脫漢曰何限風物寥落秪悲遊子故園之思登臨憶侍郎老夫貪佛日隨意宿僧房田曰金光明經云佛日大悲滅一切暗遊修覺寺前逰野寺江天豁山扉花竹幽詩應有神助夢符曰右按唐書張說既責嶽州而詩益淒婉人謂得江山助修可曰謝靈運嘗於永嘉西堂思詩竟日不就匆夢見惠運即得池塘生春草大以為工常云此語有神助非吾語也吾得及春遊徑石相洙曰一作深縈帶川雲自洙曰一作免去留禪枝宿衆鳥趙曰庾言安昌寺碑云禪枝四靜公於佛寺每用佛家書斯為當體漂轉暮歸愁師曰言衆僧得所棲託傷巳漂轉曽衆僧之不若也後遊寺憶曽遊處橋憐再渡時江山如有待花栁更無私趙曰言遊者皆得見之無所私也野潤煙光薄沙暄日色遲客愁全為減捨此復何之上牛頭寺靑山意不盡衮衮上牛頭趙曰衮衮相繼不斷之義出王濟說張華說史漢衮衮可聽無復能拘礙真成浪出遊花濃春寺靜竹細野池幽何處鶯啼切移時獨未休望牛頭寺牛頭見鶴林薖曰鶴林即靈仙􅔏也梯徑繞幽深洙曰一作秀麗一何深春色浮洙曰一作流山外天河宿洙曰一作沒殿隂趙曰言殿之髙也詠曰言殿髙通天河也傳燈無白日洙曰釋氏以燈諭法謂能破暗也六祖相傳一法故云傳燈故釋書有傳燈録皆言傳法趙曰此言長明燈也借傳燈字言之耳燈所以照夜而白日亦有燈故云無白日舊注遂引傳燈事非也布地有黃金洙曰見長者自布地注趙曰言佛宗佛書有黃金布地休作狂歌老回看不住心洙曰釋書有不住相常住相趙曰緣佛書有住相而公摘用之義取於無所住而生其心也上兜率寺鄭曰兜當侯切兜率知名寺洙曰佛書有兜率天宫故取以名寺真如㑹法堂洙曰貞如磾理也趙曰佛書言真如實際江山有巴蜀趙曰江山自有巴蜀時便有之此乃羊叔子所謂自有宇宙來便有此山之義棟宇自齊梁庾信哀雖久何顒好不忘洙曰何顒後漢人尚氣節感友人之義而為之復父讎與李膺善後為宦者所陷亡匿汝南間所至皆親其豪傑袁紹愛慕之私與往來結奔走之友趙曰庾信作哀江南賦所以哀者以金陵瓦解而身竄荒谷後漢未黨事起顒私入洛陽從袁紹計議其窮困閉厄者為求救援以濟其患蓋公言身巳流落有庾信之哀矣而哀愁之中不忘交好也何顒者有救之之心也師曰言甫所至為人所好詩所謂在彼無惡在此無斁是也白牛車逺近趙曰法華經云有太白牛肥徙多力以駕寶車蓋踰大乘也且欲上慈航夢符曰右眇清涼禪師序般若心經云般若者苦海之慈航昏忂之巨燭也望兜率寺樹密當山徑江深隔寺門霏霏雲氣重洙曰九章白霰雷紛其無垠兮雲霏霏而乘宇閃閃浪花翻洙曰海賦蝄象暫曉而閃尸不復知天大空餘見佛尊時應淸盥罷鄭曰盟古滿切隨喜給孤園洙曰釋書有給孤園又有給孤長者山寺洙曰得開字章留後同遊野寺根石壁諸龕遍崔嵬鄭曰龕苦含切前佛不復辨百身一莓苔洙曰天台賦踐莓苔之滑石唯有古殿存丗尊亦塵埃如聞龍象泣足令信者哀蒼舒曰右按王筠捿頭陀寺碑曰正法既沒象教陵夷又曰馬鳴幽讃龍樹虛求經曰有比丘名曰龍樹龍象猶佛象也修可曰維摩經云菩薩勢力譬如龍象又傳燈録云逹麼是六衆中所師波羅提法中龍象盡龍象乃鱗毛頭中最巨者猶麒麟之於走獸鳯凰之於飛鳥故經稱僧之出類者曰龍象非佛像也使君騎紫馬蘇曰謝靈運出守永嘉人曰騎紫馬者乃太守也蓋當日靈運宗文東同治郡猶今之守倅並行也永嘉今有紫馬詞尚傳乃播謝之德也捧擁從西來樹羽靜千里臨江久徘徊山僧衣藍縷告訴棟梁摧公為顧兵徒咄嗟檀施開夢符曰右按左氏篳簬藍縷以啓山林晋書石崇傳咄嗟而辦佛書信施檀越又王筠棲頭陀寺碑曰行不捨之檀施洽群有吾知多羅樹却倚蓮華臺諸天必歡喜鬼物何嫌猜以兹撫士卒孰曰非周才窮子失淨處髙人憂禍胎洙曰福有臺禍有胎趙曰漢武帝謂臨賀王曰汝包藏禍胎也歲晏風破肉蘇曰蘇章傳邊地霜緊沙風破肉雖重裘氊帳寒色可畏荒林寒可回思量入道苦自哂同嬰孩涪城縣香積寺官閣洙曰涪城梓州縣寺下春江深不流山腰官閣逈添愁含風翠壁孤雲細背日丹楓萬木稠小院回廊春寂寂洙曰春一作青浴鳬飛鷺晚悠悠諸天合在藤蘿外昏黑應須到上頭洙曰釋書有諸天皆言勝樂事公之末章因以見志也蘇曰常宗侍煬帝遊寶山帝曰幾時到上方琮曰昏暗應須到上頭左右失笑帝曰淳古君子也暮登四安寺鍾樓寄裴十洙曰四一作曰暮倚髙樓對雪峯僧來不語自鳴鍾孤城返照紅將斂洙曰夕陽謂之返照近市浮煙翠且重多病獨愁常閴寂趙曰易曰窺其户閴其無人王弼注云閴寂也故人相見未從容洙曰從容款曲也天台賦任緩步之從容知君苦思緣詩瘦蘇曰崔浩愛吟詠一日病起友人戲之曰非子病如此乃子苦吟詩瘦也後遂為口實因過來請問醉中書焉大洙曰一作太向交游萬事慵洙曰李曰曽有戲贈公詩云借問年來何瘦生只為從前作語苦趙曰緣苦詩之故其在交游也万事皆慵廢矣秦州雜詩二首居仁曰同作二十首一首見馬門餘見都邑門秦州山洙曰一作城北寺勝跡洙曰一云傳是隗囂宫洙曰後漢隗囂據隴西天水郡寺即囂故居苔蘇山門古洙曰一作故丹靑野殿空月明垂葉露雲逐度溪風蘇曰李隱尋友人不見謂童曰何往童不答又曰主人何往童曰白雲無心逐風度溪尓李驚異久之清渭無情極愁時獨向東山頭南洙曰一作東郭寺水號北流泉老樹空庭得淸渠一邑傳秋花危石底晚景卧鍾邊洙曰一作前俯仰悲身丗溪風為颯然洙曰颯一作肅玉臺觀滕王造趙曰觀在髙處其中有臺號曰玉臺也中天積翠玉臺洙曰一作虛遙洙曰列子曰周穆王築臺號曰中天臺樂府歌閶闔觀玉臺注帝之所居上帝髙居絳節朝修可曰顔延年應詔詩曰坤行垺浮景交映溢中天攢素既森靄積翠亦葱芊注松柏重布云積翠趙曰以臺之髙而在道觀故直指為上帝之髙居而群仙絳節所朝之處也遂有馮夷來擊鼓洙曰曹子建洛神賦馮夷鳴鼓女媧清歌馮夷乃河伯師曰張平子思玄賦云號馮夷使清津兮擢龍舟以濟豫注馮夷者弘農華隂童鄉首里人服八石得水仙為河伯龍魚河圗曰河伯姓吕名公子馮夷即河伯夫人抱朴子釋鬼篇曰馮夷華隂人以八月上庚日渡河溺水死天帝署為河伯三說不同故並載之生羽翰言飛仙也始知嬴女善吹簫洙曰秦本紀大費佐舜是為伯翳舜賜姓嬴氏列仙傳蕭史秦女弄玉之夫也教弄玉吹簫作鳯凰鳴而作鳯凰臺吹其上一旦夫妻隨鳯仙去江光隱見黿鼉窟洙曰李華海賦或屑沒於黿鼉之窟石勢參差烏鵲橋洙曰淮南子烏鵲填河成橋而渡織女趙曰石自髙處望之其勢參差可以想其如烏鵲之狀更有紅顔生羽翰便應黃鶴老漁樵玉臺觀滕王造浩劫因王造洙曰一作起劫猶丗也頭陀碑云功濟塵劫趙曰公言道觀多使道書度人經曰惟有元始浩劫之家師曰劫蓋俗謂塔之一級二級為一劫二劫子美嶽麓道林二寺行亦曰塔劫宫墻壯麗敵若以為丗劫之劫則玉臺乃滕王於髙宗調露中任閬州刺史日所造去子美未百年豈可言浩劫因主造乎平臺訪古遊洙曰梁孝王大治宫室為復道自宫連屬於平臺如淳曰平臺在大梁東北離宫所在也趙曰以梁王平臺比之綵雲簫史駐洙曰見前詩注文字魯恭留洙曰景十三年魯恭王餘𥘉治宫室壞孔子舊宅以廣其居聞鍾磬琴瑟之聲遂不敢復壞於其壁中得古文經傳云趙曰以魯恭王比滕王也以詩意推之滕王必有文書遺跡在焉宫闕通群帝洙曰道書云天有群帝而大帝最尊帝猶五方之帝也大帝比極也乾坤到十洲洙曰道書中有十州記皆言神仙境土定功曰東方朔十洲記漢武帝既見西王母言說八方巨海之中祖洲􅌡洲元洲炎洲長洲鳯麟州聚屋州流洲生洲充州云十州並是人跡所稀絶處趙曰以臺在道觀中於天地之閒由此可以到神仙十洲也人傳有笙鶴時過北山頭洙曰劉向列仙傳云王子喬周靈王太子晉也好吹笙作鳯鳴遊伊洛間道士浮丘公接上嵩山三十餘年後來於山上告桓良曰告我家七月七日侍我緱氏山頭果乘白鶴駐山頂望之不得到舉首謝時人而去分門集注杜工部詩卷之八
