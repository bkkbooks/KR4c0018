front:
  text: 分門集注杜工部詩卷第十九簡寄下律詩五十二首
  hash: sha256:e792aa9406c215db1b01a2ce52a5fb5f624a0285c174d6f79bf02d2bd3b6fadc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_019-1a}
body:
  text: 奉寄河南韋尹丈人洙曰甫故廬在偃師承韋公頻有訪問故有下句有客傳河尹逢人問孔融洙曰河尹河南尹也孔融公自比也見本題下注詩趙曰見問者河南尹也故得以孔融為比蓋李膺為河南尹而孔融造門為上客也青囊仍隱逸洙曰郭璞授業於鄭公以青囊九書與之遂開洞五行後門人切青囊未及讀為火焚之章甫尚西東洙曰章甫冠也孔子生於魯冠章甫之冠長於宋故衣縫披之衣章甫儒冠鼎食為門户洙曰列鼎而食門尸閥閲也趙曰以言河尹之貴詞埸繼國風洙曰詩之國風趙曰以言河尹之能詩尊榮瞻地絶洙曰言地望崇重踈放憶途窮洙曰阮籍詩途窮能無慟趙曰踈放公自謂也憶途窮則又言河南憶問之也濁酒尋陶令洙曰王弘九月九日送酒與陶潛潛得之便飲而歸趙曰陶淵明也常曰偶有名酒無日不傾丹砂訪葛洪洙曰事見為農詩不得問丹砂注趙曰祈心於遐年故訪葛洪洪嘗於帝乞為句漏令以出丹砂而就之江湖漂短褐洙曰短當作䄈淮南子霜雪函集䄈褐不完褐毛布鄭曰䄈臣庾切敝布襦褐胡葛切短衣霜雪滿飛蓬洙曰詩首如飛蓬定功曰班叔皮王命論注短褐粗衣也蓋公此詩作於潭州適當冬時述其羈旅流落之狀上句言短褐為江湖所漂下句言犯冒霜雪故飛蓬之髮為霜雪所蒲牢落乾坤大蘇曰余絳失意雲霄羈思牢落歸栖無巢始知乾坤之大周流道術空趙曰言天地廣大而我獨牢落雖挾道術竟於周流之際成空而無用謬慙知葪子鄭曰葪居例切洙曰後漢方術傳葪子訓有神異之道到京師公卿以下候之者坐上常數百人皆為設酒脯終日不匱真怯笑揚雄洙曰揚子解嘲曰子乃以鴟梟而笑鳯凰子徒嘆我玄之尚白吾亦嘆子之病甚不遭臾跗扁鵲悲夫趙曰揚雄著太玄人皆笑之至以為可覆醬瓿盤錯神明懼洙曰虞詡曰不遇盤根錯節何以知利器趙曰以言韋尹為政之能謳歌德義豐趙曰如鄭歌子産漢歌岑君是也尸鄉餘土室難説洙曰一作誰話祝雞翁洙曰後漢地理志偃師有尸鄉列仙傳祝溪翁居尸鄉山下養雞百餘各有名字呼名則種别而至鄭曰列仙傳祝雞公洛陽人師曰甫以孔融自比客來傳説韋尹詣甫動靜如何甫尚隱居蹤迹無定不若韋列鼎而食猶善詩章故云繼國風踈放甫自謂也甫既不仕惟以濁酒適懷丹砂自養任短褐漂泊雪蒲白頭牢落無所成就之義乾坤雖大若無所容身道術空言無道術也葪子比韋尹慚見知於韋真怯笑揚雄甫以貧蹇為時訕笑有若雄為當丗所嘲也盤錯言事繁劇韋善決斷人畏其政若神明呪雞翁甫以自比將赴成都草堂途中有作先寄嚴鄭公五首得歸茅屋赴成都洙曰潘安仁秋興賦偃息不過茅屋茂林之下真洙曰一作直為文翁再剖符洙曰謂嚴鄭公再鎮成都也文翁見李劒州詩注剖符分符也漢制符皆有合契當給符者止給其半留一半京師但使閭閻還揖讓洙曰循吏傳孝宣興於閭閻師古曰閭里門也閻里中門也敢論松竹久荒蕪洙曰陶淵明云田園將蕪胡不歸又云三徑就荒松菊猶存趙曰兩句通義公之心在愛人不私一已矣魚知丙穴猶來美洙曰左太沖蜀都賦嘉魚出於丙穴劉淵林注曰丙穴在漢中沔陽縣北有魚穴二所常以三月取之丙地名也任豫益州記曰嘉魚鱗似鰌魚師曰水經曰丙穴出嘉魚常以二月出十月入水泉懸注魚自穴下逺入水穴口向丙故曰丙穴又酉陽雜爼曰丙穴魚食乳水食之甚是溫神農本草亦云嘉魚味甘食之令人肥健俯懌此乳穴中小魚常食浮水所以益人子美稱丙穴魚美其以此歟酒憶郫筒不用酤鄭曰郫賔彌反洙曰成都記曰郫縣因水得名蜀王杜宇所都華陽風俗録曰郫人郀竹之大者傾春釀於筒閉以藕絲苞以焦葉信宿馨逹於竹外然後斷之以獻俗號為郫筒酒也修可曰郫出大竹土人截以盛酒故號郫筒至今如此非傾釀於筒候其香而斷之也故李商隱詩云錦石為棊子郫筒當酒壷則郫筒為盛酒器可知矣蘇曰山濤治蜀之郫城用筠管釀酴釀作酒浹旬方開香聞百步故蜀人傳其法效之趙曰言酒不須沽而從嚴公飲耳五馬舊曽諳小徑蘇曰古今風俗通曰王逸少出守永嘉庭列五馬繡鞍金勒出即鞚之故永嘉有五馬坊焉幾回書札待潛夫洙曰五馬見餞蕭遂州詩注潛夫見偶題謾作潛夫論注趙曰言嚴公昔曽枉駕之熟今有書札來相待其歸矣後漢王符隱居著書號潛夫論詠曰潛夫甫自比處處靑江帶白蘋洙曰清江春流也白蘋水草也左傳蘋蘩藴藻之菜是也趙曰尓雅萍之大者曰蘋故園猶得見殘春趙曰故園指成都也雪山斥候無兵馬洙曰雪山蜀之西山也無兵馬罷三城戍也天覺曰無兵馬言靖亂也錦里逢迎有主人洙曰成都記錦里城呼為錦城以江山明麗錯雜如錦故也公與嚴故德故有主人之説蘇曰王褒歸蜀謂人曰逢迎有賢主人吾當挂冠投老為林下散人耳秦曰此句言嚴再鎮成都也休怪兒童延俗客不教鵝鴨惱比鄰鄭曰比頻脂切蘇曰魏陸勗居櫟陽性淡正潔嘗見童驅鵝鴨出四顧之曰不曾使惱比鄰立町客伏其清謹趙曰公於嚴公有故舊之好而能如此則公之厚德與夫慎重可見矣比鄰者比近之鄰也習池未覺風流盡况復荆州賞更新洙曰晉山簡字季倫永嘉三年出為征南將軍鎮襄陽于時四方寇亂天下分崩主威不振朝野危懼簡優遊卒歲惟酒是耽諸習氏荆土豪族有佳園池簡每出戲遊多池上飲輒醉名之曰髙陽池師曰武每訪草堂酣飲賦詠故比之習池之遊荆州賞更新言武之來宴賞復無窮也竹寒沙碧浣花溪洙曰梁益記溪水出湔江居人多造綵箋故號浣花公之别館後為崔寧宅捨為寺今尚在焉菱洙曰一作橘刺藤梢咫尺迷趙曰公雜草堂之久宜其荒蕪矣過客徑須愁出入居人不自解東西鄭曰解佳買切曉也趙曰以蓬蒿之礙也書籖藥褁封蛛網洙曰沈休文網蟲垂戶織蜘蟵網也鄭曰籖千庶切驗也野店山橋送馬蹄趙曰言橋與店空送馬蹄於道中往來而巳蓋公不在草堂故也肯藉荒庭春草色洙曰一云新月色天台賦藉萋萋之纎草别賦春草碧色先判一飲醉如泥鄭曰判普官切洙曰後漢周澤字稚都為太常清潔循行盡敬宗廟嘗臥疾齋宮其妻哀澤老疾窺問所苦澤大怒以妻子犯齋禁逐收詔獄謝罪當丗疑其詭激時人為之語曰生丗不諧作大常妻一歲三百六十日三百五十九日一日不齋醉如泥常苦沙崩損藥欄也從江檻落風湍新松恨不髙千尺洙曰七發云髙百尺而無枝魯連子東方有松縱髙千仞無枝也趙曰公指言所種四松故欄之新松惡竹應須斬萬竿洙曰去其惡者留其善者洗竹也生理秪慿黃閣老洙曰黃閣見贈嚴八閣老詩注薖曰言甫生計皆仰于嚴也衰顔欲付紫金丹洙曰神仙有金丸可以延年却老蒼舒曰右按樂府長歌行定取金丹作幾服能今華衰得十年田曰大藥證云紫金大丹若人服食化腸為筋變髓凝骨自然不死沈曰丹陽抱陽山人大藥證曰煉鉛為粉化緑為塵自然伏火去鉛取丹更入華池還源反色再入神室更養火六十日成紫金火丹若人服食化腸為筯變髓凝骨自然不死三年奔走空皮骨蘇曰玉翦三年奔走邊鄙老夫但存皮骨誰敢有勞土事信有人間行路難洙曰言為憂患所迫而癯瘠也古詩有行路難錦宮城西生事微洙曰宫一作館師曰言土田薄有也烏皮几在還思歸洙曰以烏皮褁几也趙曰謝眺詠烏皮隱几詩曰蟠木生附枝刻削豈無施未句曲躬奉微用聊承終宴疲昔去為憂亂兵入今來巳恐鄰人非洙曰恐經亂離而人物改變側身天地更懷古洙曰側身言無所容也蘇曰張融側身俯仰天地間懷古弔今轉增悽惻回首風塵甘息機洙曰息忘也馬援回首往事甘自息機師曰甘息機言甫猒奔走也共説總戎雲鳥陳洙曰元帥也雲鳥陳名如鵝鸛之類是也夢符曰右按唐獨孤及風后八陳圖記天命聖者以廣戰術俾懸衡於未然察變於倚數握機制勝作為陳圗夫八官之位正則數不愆神不忒故八其陳所以定位也衡抗於外軸布於內風雲附其四維所以備物也虎結翼以進蛇向敵而蟠飛龍翔鳥上下其勢以致用也趙曰惣戎以言嚴公遊子公自謂也田曰太公六韜以車騎分為鳥雲之陳所謂鳥雲者鳥散而雲飛變化無窮者也不妨遊子芰荷衣洙曰北山移文焚芰製裂荷衣師曰欲參軍謀不妨吾逸態而衣芰荷之衣也弊廬遣興奉寄嚴公野水平橋路春沙映竹村風輕粉蝶喜花暖蜜蜂喧把酒冝深酌題詩好細論府中瞻暇日江上憶詞源趙曰隋文藝傳曰筆有餘力詞無竭源迹忝朝廷舊洙曰公仕三朝情依節制尊洙曰公之入蜀惟依嚴公節制持節專制也還思長者轍恐避席為門洙曰見寧紆長者轍注顔延年林間時晏開迎回長者轍趙曰欲枉嚴公之駕故用陳平事以激之也奉待嚴大夫殊方又喜故人來重鎮還須濟丗才鄭曰重直隴切厚也洙曰時武再鎮蜀常怪偏禆終日待洙曰偏禆諸將校也光武令鄧禹自選偏禆以下不知旌節隔年回洙曰旌節麾幢也楊國忠兼領劒南每幸驪山必以旌旗前引欲辭巴徼啼鶯合逺下荆門去鷁催洙曰公自言欲辭蜀而入楚趙曰此言船蓋船首畫鷁以驚水怪師曰甫與武有丗契武為成都尹甫依之及武入朝甫之巴峽今甫聞嚴再鎮蜀欲辝巴徼下荆門迓之云啼鶯者春時也鷁舟也巳督舟將行身老時危思會靣洙曰古詩道路阻且長會靣安可知一生襟洙曰一作懷抱向誰開洙曰言人不己知奉贈嚴八閣老鮑曰嚴武也至德𥘉房琯薦為給事中收長安拜京兆尹稱閣老時為給事中師曰臺閣之長謂之閣老扈聖登洙曰一云今日登扈黃閣洙曰扈扈從也宋忠曰三公黃閣前史無此義札記士􅔖與天子同公侯大夫則異鄭玄注云士賤與君同不嫌夫朱門洞啓當陽之正色三公之與天子禮秩相亞故黃其閣以示謙不敢斥天子疑是漢舊制陳三公之制開黃閣聽事明公獨妙年洙曰明公相尊美之稱也蔡文姬謂曹公曰明公廄有万馬妙年少年也蛟龍得雲雨淋曰吳志周瑜傳上疏孫權曰劉備以梟雄之姿而關羽張飛熊虎之將猥割上地以資業之恐蛟龍得雲雨終非池中物也蘇曰漢祖入關碑曰劉季用蕭曹張韓如蛟龍得時雲沛雨飛揚八紘四維雕鶚在秋天洙曰秋天􅋧鳥擊摶之時也雕鶚在秋天得其時矣客禮容踈放師曰甫性踈放雖屬官曹而嚴每以客禮優之官曹可接聮洙曰可一作許趙曰閣老尊矣惟其以客禮待公而容其踈放故雖為官曹而卑可接聮之新詩句句好蘇曰王獻之帖云早得新詩披味句句皆好荒拙未敢酬答應任老夫傳趙曰欲廣傳嚴公之詩句自非知音何以至此贈翰林張四學士鮑曰張垍也張説之子尚寧親公主明皇眷之即禁中置內宅公詩故云天上張公子宫中漢客星也翰林逼華蓋洙曰蔡雍傳擁華蓋而奉皇極逼言密迹帝座蒼舒曰右按唐百官志乘輿所在必有文詞經學之士下至上醫技術之流皆直於別院以備宴見而文書詔令則中書舍人掌之自太宗時名儒學士時時召以草制然猶未有名號乾封後封號北門學士玄宗𥘉置翰林待詔以張説陸堅張九齡等為之掌四方表疏批答應和文章既而又以中書務劇文書多壅滯乃選文學之士號翰林供奉與集賢學七分掌制誥書勑開元二十六年又改翰林供奉為學士別置學士院專掌內命凡拜免將相號令征伐皆用白麻其後選用益重而禮遇益親至號為內相又以為天子私人凡充其職者無定貟自諸曹尚書下至校書郎皆得與選入院一歲則遷知制誥班次各以其宜內宴則居宰相之下一品之上憲宗又置學士承旨唐之文宗洪文集賢分隸中書門下省而翰林學士獨無所屬焉趙曰天文志華蓋所以蔽覆天帝之座也唐止有翰林供奉明皇𥘉始改為學士置院在禁中鯨力破滄溟天上張公子洙曰公子公侯之子孫美張翰林也故稱天上言非人間人趙曰滄溟乃遊泳寬縱之地鯨力破之則如宗慤云願乘長風破万里浪之破矣夲中曰凡詩人於姓張者得曰張公子如杜牧贈張祐亦曰誰人得似張公子是今言天上以其在禁中如天上也宮中漢客星洙曰漢光武引嚴光入論太史奏客星犯御座甚急趙曰博物志載後漢人乘槎至天河之側飲牛者問嚴君平嚴曰客星犯斗牛賦詩拾翠殿蘇曰曹子建侍宴拾翠殿上命賦詩落筆即成一座驚服佐酒望雲亭洙曰賦詩佐酒言侍從宴賞也趙曰拾翠殿在東內大福殿之東南望雲亭在西內景福臺之西以其應和文章且禮遇內亭紫誥乃兼綰黃麻似六經洙曰翰林學士掌制誥紫誥謂以紫泥封誥黃麻謂寫誥詞於黃麻紙上似六經言訓辝深厚如六經昱曰隴右記武都紫水有泥每貢封璽書故詔誥有紫泥之美趙曰凡拜兔將相皆用白麻而馮鑑續事始貞觀十一年太宗詔用黃麻𥿄寫詔勑文內分金帶赤恩與荔枝靑洙曰翰林拜命日賜金荔枝帶趙曰楊文公談苑載自樞宰節度使賜二十五兩金帶無復隨髙鳯洙曰鳯後漢逸民言張翰林已在顯貴不復與鳯為偶空餘泣聚螢洙曰車㣧家貧無燈火以絹囊盛螢火以照書讀趙曰此皆公自謂也舊注謂髙鳯逸民也言翰林之貴不復與鳯為偶殊無意義豈可以人名對聚螢乎田曰謂鳯之飛鳴必在於髙詩云鳯凰鳴矣于彼髙岡杜所引雖是而未解其深意公蓋言我不能隨張翰之髙飛而止餘泣於聚螢尓車㣧家貧囊盛螢火以照書也師曰甫謂張飛騰已如髙鳯無緣追隨之也故云云此生任春草垂老獨漂萍洙曰春草言不實也流落漂泛如萍之在水蘇曰吳淑此生棄擲如春江野草任車馬踐踏趙曰意言任春時之草生幾度更不管年華之去矣皆感激之言儻憶山陽會悲歌在一聽洙曰山陽嵆康所居會竹林之會也向秀經康山陽舊居作聞笛賦趙曰預指它日隔闊之事意謂山陽之會為可憶則今日悲歌冝在一聽也楊曰未意兾張無忘舊遊故云云奉留贈集賢院崔于二學士國輔休烈昭代將垂白洙曰昭明出昭代猶明時也謝靈運詩星星白髮垂途窮乃呌閽洙曰公因不第乃獻賦阮籍哭途窮思玄賦呌帝閽氣衝星象表詞感帝王尊洙曰公嘗有詩云自怪一日聲輝赫又云往年文彩動人主修可曰此言獻三大禮賦也當天寶九載時公三十九歲雖窮真自負其才獻賦而上悅之天老書題目春官驗討論洙曰春官宗伯趙曰言召試文章所謂集賢學士如堵墻觀我落筆中書堂時也倚風遺鶂路鄭曰鶂倪歷切隨水到龍門趙曰左傳云鶂退飛過宋都風也公言倚賴風而往矣反遭回風而遺失其所往之程路也到龍門則隨水到之而巳不能過也龍門在河中府魚登者化為龍劉敞曰龍門在封州三秦記龍門魚登者化為龍竟與蛟螭雜寧洙曰一作空無燕雀喧洙曰言不能自致霄漢故雜蛟螭也燕雀喻小人趙曰到龍門而不過則猶雜蛟龍也遺鶂路而不進則不免羣雀而受其喧也靑雲猶契闊陵厲不飛翻趙曰公以文采動人主矣意其遂騰踏進用止授河西尉不行改右衛率府兵曹而巳此公所以歎也公與韋左丞詩云主上頃見徴歘然欲求伸靑冥却垂翅蹭蹬無縱鱗同意儒術誠難起趙曰乃儒冠多誤身之意家聲庶巳存洙曰見烜赫舊家聲注故山多藥物蘇曰張楷故山幸多藥物足以度流年何必塵埃中踆踆老死乎趙曰所謂故山指襄陽也甫夲襄陽人勝槩憶桃源洙曰見欲問桃花宿注欲整還鄉斾長懷禁掖垣洙曰劉禎贈徐公幹詩誰謂相去逺隔此西掖垣拘限清切禁中情無由宣思子沈心曲長嘆不能言趙曰懷崔于二學士也蓋集賢院在禁中矣謬稱三賦在難𫐠二公恩洙曰甫三獻大禮賦出身二公常謬稱述師曰叫閽言叫天子之門而訴之詞感帝王謂獻三賦而帝恱之也天老乃天子之老指宰相春官禮部也帝命宰相試文章故天老出題目而春官考之倚風遺鶂路隨水到龍門言不登第也公既不第不免與蛟螭混而為燕雀所笑青冥猶契闊言卑棲而逺於天也儒術誠難起言為儒冠所誤也禁中有東西兩掖掖垣乃禁墻也甫既不用遂有歸故山采藥怡養之意故云欲整還鄉斾贈獻納起居田舍人澄洙曰一云贈田起居獻納使獻納司存雨露邊洙曰一作偏武后𥘉置匭以受四方之書謂之理匭使玄宗改為獻納使趙曰唐制獻納使掌受封事以獻天子地分淸切任才賢洙曰劉公幹拘限清切禁趙曰以田君為起居舍人從六品上隸中書省斯為禁近矣舍人退食收封事洙曰唐以舍人給事中知匭事趙曰此言田君之職宮女開函近洙曰一作捧御筵洙曰函為匭函也宫女開函以所投封事奏御曉漏追趨靑瑣闥洙曰青瑣門也范彥龍詩攝官青瑣闥遙望鳯凰池晴窗點檢白雲篇夢符曰右按漢武帝秋風詞曰秋風起兮白雲飛淮南王安傳武帝每為報書及賜嘗召司馬相如等視草乃遣揚雄更有河東賦唯待吹噓送上天洙曰揚雄成帝時客有薦雄文有似相如還上河東賦此子美自比雄也故有唯待吹噓之句也趙曰漢成帝追觀先代遺迹思欲齊其德號上自西嶽還雄上河東賦以為勸戒今公自北於雄欲有諷諫正賴田君為獻納使而有以吹噓之也奉寄髙常侍洙曰一云寄髙三十五大夫汶上相逢年頗多洙曰地理志汶水出泰山萊蕪西南入濟在濟南魯北蜀亦有汶川出西山亦有汶川縣修可曰魯之汶今在鄆州以閔子騫有吾必在汶上之語非蜀之汶川矣飛騰無那故人何鄭曰那乃箇切洙曰故人侍御也飛騰言自致於漢霄趙曰髙適與公皆拜拾遺其後髙公至為散騎常侍則其飛騰明矣揔戎楚蜀應全未洙曰為帥也趙曰揔戎大將之事適先除楊州大都督淮南節度使以李輔國之毀出為彭蜀二州刺史蓋言雖揔戎於楚與蜀而猶未焉尹曰商代崔光逺節度西川又守彭州故云揔戎楚蜀應全未未者言年未及老也方駕洙曰一作價曹劉不啻過洙曰方齊也言文才過於曹丕劉楨也家語何翅惠哉猶過多也修可曰方駕並駕也與方舟之方同劉孝標廣絶交論曰遒文麗藻方駕曹王注謂曹植王粲此言曹劉乃曹植劉楨非曹丕今日朝廷須汲黯洙曰漢書汲黯在朝淮南寢謀言黯之材足以折衝千里爾時寇賊充斥朝廷須如汲黯者中原將帥憶廉頗洙曰馮唐傳文帝輦過郎署問馮唐曰吾居代時吾尚食監髙祛數為我言趙李齊之賢戰於巨鹿下吾每飲食意未嘗不在巨鹿父老知之乎唐對曰齊尚不如廉頗李牧之為將上曰何也唐曰臣大父在趙時為官帥將善李牧臣父故為代相善李齊知其為人也上既聞廉頗李牧為人良説乃拊髀曰嗟乎吾獨得廉頗李牧為將豈憂胸奴哉天涯春色催遲暮别淚遙添錦水波趙曰時髙常侍在成都起發赴召故云云寄髙三十五詹事鮑曰髙適肅宗竒之除楊州大都督李輔國惡其才除太子詹事安穩髙詹事兵戈久索居洙曰蕭索也子貢離群索居時來如洙曰一作知宦達歲晚莫情踈魯曰言無隨丗態天上多鴻鴈池中足鯉魚相看過半百鄭曰過古禾切不寄一行書洙曰蘇武繫書鴈足古詩呼童烹鯉魚中有尺素書古人言音信多以此二物或謂之鱗羽趙曰劉諭故人各在異方不能寄一行書通關中消息奉寄章十侍御彥輔曰時初罷梓州刺史東川留後將赴朝廷一云寄梓州張使君淮海惟楊一俊人洙曰禹貢淮海惟楊州注秋據淮南距海趙曰章侍御必揚州人故用淮海也耒曰章彛楊州人金章紫綬照靑春洙曰百官公卿表侯金印紫綬師古曰漢儀云銀印皆龜劒其文曰章謂刻曰某官之章前漢書曰丞相皆秦官金印紫綬孝祥曰靑春言年少也指麾能事回天地洙曰唐玄素有回天之力言其能回人主之意也趙曰指麾所能之事雖天地亦可回所以重大言之陸士衡有云回天倒日之力歐曰時段子璋反章討平之故云云訓練強兵動鬼神洙曰公孫瓉劎袁紹所攻與其子書曰袁氏之攻狀若鬼神梯衝舞吾樓上鼓角鳴于地中趙曰言威力所致然湘西不得歸關羽洙曰蜀將關羽字雲長先主收江南諸郡乃封拜元勳羽為襄陽太守蕩寇將軍駐江北先主西走益州拜羽董荆州事後孫權斬於臨沮河內猶宜借寇恂洙曰後漢寇恂字子翼光武取河內拜恂為太守行大將軍後潁州盜賊群起帝曰潁川迫近京師當以時定惟念卿獨能平之耳從九卿復出以憂國可知也即日車駕南征恂從至潁川盜賊悉降而竟不拜郡百姓遮道曰願從陛下復借寇君一年乃留旬長社鎮撫吏人納餘降也黃曰甫意美章善守東川恐如關羽寇恂不得去也朝覲從容問幽仄勿云江漢有洙曰一作老垂綸趙曰公自言其身而其義甚明朝曰此句甫自言也奉酬寇十侍御錫見寄四韻復寄寇往别郇瑕地洙曰見上懷愴郇殺邑注于今四十年來簪御府筆洙曰魏略曰殿中侍御史筆曰筆側階而直上問曰此何官也辛毗對曰御史簪筆書過以記不依法故泊洞庭船詩憶傷心處洙曰楚詞目極千里傷心處春深把臂前洙曰廣絶交論自昔把臂之英金蘭之友趙曰言在郇瑕相别之時南瞻按百越黃帽待君偏趙曰前漢鄧通以濯船為黃頭郎顔師古注曰濯船能授濯行船也士勝水其色黃故刺船之郎皆著黃帽因號曰黃頭郎也今寇君既按百越則所在處常艤舟以待故其帽偏也師曰郇瑕晉地子美與寇別於晉地逮今凡四十年頭簪御史筆來客荆衡間故云泊洞庭船此子美自𫐠也公為拾遺故簮白筆黃帽乃竹籜為冠按百越言寇按察楚越之郡贈陳二輔闕丗儒多汩沒洙曰汩沒不振之貌耒曰甫嘗云儒冠多誤身蓋儒者多不遇故此又云云夫子獨聲名獻納開東觀洙曰謝玄暉獻納雲臺表後漢和帝幸東觀覽書林閲篇籍博選術藝之士以充其官君王問長卿洙曰司馬相如字長卿蜀人楊得意為狗監侍上上讀子虛賦而喜之曰朕獨不得與此人同時哉得意曰臣邑人司馬相如自言為此賦上驚乃召問相如皂雕寒始急師曰皂雕御史以比輔闕補闕諫官也天馬老能行洙曰所謂窮而益堅老而益壯修可曰大宛馬名以其先乃天馬之種也自到靑冥裏休看白髮生洙曰言自可致於靑霄之上無以老自怠寄左省杜拾遺岑參新添聮步趨丹陛分曹限紫微曉隨天仗入暮惹御香歸白髮悲花落靑雲羡鳥飛聖朝無闕事自覺諫書稀奉答岑參輔闕見贈窈窕淸禁闕罷朝歸不同師曰岑為補闕屬中書居右署甫為拾遺屬門下居左署左為東而右為西故云歸不同也君隨丞相後洙曰補闕官有左右左屬門下省右屬中書趙曰豈參為補闕而兼為諸部中官邪我往洙曰一作住日華東蘇曰郭偲家住日華門東畔趙曰拾遺在百官志皆隸門下省而門下省在華門之東杜公為左拾遺故云云冉冉栁枝碧姢姢花蘂紅故人得佳句獨贈白頭翁奉簡髙三十五使君新添當代論才子如公復幾人驊騮開道路鷹隼出風塵行色秋將晚交情老更親天涯喜相見披豁對吾真寄楊五桂州鮑曰名談因州參軍段子之任即廣州段功曹也楊五長史蓋自桂徙廣段子從之五嶺皆炎熱洙曰五嶺見野望詩注冝人獨桂林梅花萬里外洙曰五嶺有海嶺以梅得名雪片一冬深聞此寬相憶為邦復好音江邊送孫楚逺附白頭吟洙曰晉孫楚字子荆嘗參石苞驃騎軍事將赴荆南寄别李劒州使君髙義驅今古寥落三年坐劒州但見文翁能化俗洙曰前漢循吏傳文翁景帝末為蜀郡太守仁愛好教化見蜀地僻陋有蠻夷風乃選郡縣小吏開敏有才者張叔等十餘人親自飭厲遣詣京師受業博士或學律令數歲蜀生皆成就歸文翁以為右職用次察舉官有至郡守刺史者又修起學官於成都市招下縣子弟以為學官弟子為除更繇髙者以補郡縣吏次為孝弟力田常選學官僮子使任便坐受事每出行縣益從學官諸生明經飭行者與俱使傳教令出入閨門縣邑吏民見而榮之數年爭欲為學官弟子冨人至出錢以求之繇是大化蜀地學於京師者比齊魯焉至武帝時乃令天下郡國皆立學校官自文翁為之始云文翁終於蜀吏民為立祠堂祭祀不絶至今巴蜀好文雅文翁之化也焉知李廣未封矦洙曰李廣傳初廣與從弟李蔡俱為郎文帝景帝時蔡積功至二千石武帝元朔中封為樂安侯廣不得爵邑官不過九卿廣之軍吏及士卒或取封矦常與望氣王朔言之朔曰將軍自念豈嘗有恨者乎廣曰吾為隴西守羌嘗反吾誘降者八百餘人詐而同日殺之至今恨獨此耳朔曰禍莫大於殺巳降此乃將軍所以不得封侯也路經灔澦雙蓬鬢天入滄浪一釣舟趙曰灔澦堆在巫峽之口滄浪則楚漁父所謂滄浪之水也公將南下故言灔澦以明其所往之處入滄浪之天乃我之扁然之釣舟也戎馬相逢更何日春風回首仲宣樓洙曰荆州有仲宣樓魏志主粲字仲宣年十七司徒辟詔除黃門侍郎以西京擾亂皆不就乃之荆州依劉表遂登江陵城樓作賦云趙曰方當戎馬之亂相逢果何曰乎仲宣樓雖起於王􅙾字仲宣自長安來依劉表登荆州之樓而有登樓賦故云仲宣樓舊注遂謂荆州有仲宣樓非也奉寄别馬巴州彥輔曰時甫除京兆功曹在東川勳業終洙曰一作真歸馬伏波洙曰謂馬巴州也馬援封伏波將軍少有大志以功名自許嘗曰男兒要當死邉以馬革褁尸何能卧床上在兒女手邪功曹非復漢蕭何洙曰功曹公自謂也前漢蕭何為沛王吏掾乃髙祖為沛公何嘗為丞督事髙祖為漢王遂以何為丞相修可曰劉貢父作詩話稱杜甫云功曹非復漢蕭何按曹參嘗為功曹非蕭何也王定國云髙祖紀何為主吏孟康注曰主吏功曹也貢父之言誤矣二説皆非按吳志虞翻為孫䇿功曹䇿曰孤有征討事未得還府卿復以功曹為吾蕭何守會稽耳扁舟繫纜沙邊久南國浮雲水上多趙曰公欲為荆楚之行尚留東川故繫纜久而空望南國也此詩蓋公雖除京兆功曹乃有南往之興而不赴矣獨把漁竿終逺去難隨鳥翼一相過知君未愛春湖色興在驪駒白玉珂洙曰前漢儒林傳王式詔除為博士既至舍中會諸大夫博士共持酒肉勞式博士江公心嫉式謂歌吹生曰歌驪駒式曰聞之於師客歌􅌐駒主人歌客毋庸歸今日諸君為主人曰尚早未可也􅌐駒逸詩見大戴禮客欲去歌之文潁曰其辝云驪駒在門僕夫具存􅌐駒在路僕夫整駕公言知馬巴州不似我欲遊江湖其興在於朝覲見君驪駒白王珂則早朝騎馬之事古詩􅌐駒在門珂者馬口中鳴珂也以白玉為之寄岑嘉州洙曰州據蜀江外趙曰岑參也不見故人十年餘不道故人無素書洙曰古詩中有尺素書願逢顔色關塞逺洙曰江淹詩願一見顔色豈意出守江城居洙曰顔延年一麾乃出守外江三峽且相接斗酒新詩終自踈謝眺每篇堪諷誦洙曰謝眺字玄暉蘇曰羊蓋曰謝公篇什俱無塵俗氣韻自可諷誦足有開發也趙曰懷憶其詩也馮唐巳老聽吹噓洙曰見白首願為郎詩注趙曰公自以馮唐為比而聽有吹噓之者泊船秋夜經春草趙曰公𥘉至雲安是去年秋時故云泊船秋夜今又見春矣故云經春色伏枕青楓限玉除洙曰見贈李八祕書詩注趙曰公卧病於此也青楓乃言楚地限玉除則公猶念還闕見君也眼前所寄選何物贈子雲安雙鯉魚洙曰古詩客從逺方來遺我雙鯉魚赴靑城縣出成都寄陶王二少尹老𬒳樊籠役洙曰一云老耻妻孥笑貧嗟出入勞客情投異縣詩態憶吾曹洙曰吾一作君師曰詩云樂爾妻孥甫晚年不得志耻為妻孥所笑貧嗟出入勞言無車馬也久客在他鄉異縣其情况可知也詩向會人吟言詩之態度思憶我曹輩方知我之志意也東郭滄江洙曰一作浪合洙曰蜀城之東二水合流而南下土人謂之合水西山白雪髙洙曰西山近接維松上有積雪經夏不消文章差底病趙曰差病校也蓋公尚投異縣以干戈雖有文章可差得病乎文章不足以療病亦如蘇東坡所謂一字不堪煮之類回首興滔滔因崔五侍御寄髙彭州一絶髙適百年巳過半秋至轉飢寒蘇曰黃旦秋至人皆實其倉箱吾見飢寒相逼為問彭州牧何時救急難師曰此一絶詩兄弟急難故云奉寄李十五祕書二首文嶷避暑雲安縣秋風早下來蘇曰阮瑀曰乘此秋風挂帆乘此下江南蓴鱸可喜暫留魚復浦洙曰巴東漢魚復縣宋曰寰宇記夔州奉節縣本漢魚復縣同過楚王臺洙曰楚襄王與宋玉遊雲夢之臺猿鳥千崖窄秦曰謂夔峽之地多崖嶂而少平地也江湖萬里開竹枝歌未好畫舸且遲回洙曰竹枝歌巴渝之遺音也惟峽人善唱趙曰速其出峽矣竹枝歌惟夔峽人歌乏為未好則離出夔峽聽好音也行李千金贈趙曰美其行贐之多余曰左傳云行李之往來杜預注云行李使人也今人以裝為行李非也衣冠八尺身飛騰知有策意度不無神班秩兼通貴趙曰唐制祕書郎從六品上所以謂之通貴公侯出異人趙曰左傳公侯之子孫必復其始李祕書必宗室之子矣玄成負文彩丗業豈沉淪洙曰漢韋賢其先韋孟少子玄成皆以經術名家趙曰韋玄成少好學修父業為相七年守正持重不及父賢而文采過之路逢襄陽少府入城戲呈楊貟外綰彥輔曰甫赴華州曰許寄貟外茯苓寄語楊貟外山寒少茯苓師曰史記龜策傳云茯苓在兔絲之下狀如飛鳥之形新雨巳天清無風以夜明兔絲去之即篝燭此地火滅記其處明日乃掘取入地四尺至七尺得矣歸來稍暄暖洙曰一云候和當為斸青冥鄭曰斸株玉切斫也師曰斸以錐刺地也翻動洙曰作倒神仙窟洙曰茯苓松枝所化斸之乃得丗言華山多茯苓神仙所居之地封題鳥獸形唐曰茯苓以鳥獸形者為上兼將老藤杖扶汝醉𥘉醒奉贈王中允維鮑曰王維字摩詰纍遷給事中祿山反為賊所得祿山素知其才迎置洛陽迫為給事中祿山大宴疑碧地維間甚悲作詩悼痛賊平下獄以詩聞行在肅宗憐之下遷太子中允中允聲名久如今契闊深共傳收庾信洙曰周書庾信字子山先與徐陵並為梁杪撰學士後仕周聘於東魏文章辭令盛為鄴下所稱信雖位望通顯嘗有鄉關之思趙曰侯景之亂梁簡文帝使庾信率宫中文武千餘人營於朱雀航及景至信以兵奔江陵梁元帝承制除信御史中丞以言王維𥘉以祿山之脅授偽命肅宗憐維釋其死下遷中允不比得陳琳洙曰琳避亂兾州袁紹𥘉使典文章作檄以告劉備言曹公失德不堪依附反譏曹公父子後紹敗曹公得琳愛其才不之責趙曰陳琳為袁紹作檄謗詈曹公及曹公得之愛之而不之咎王維在賊中祿山大宴黎園樂工皆泣維賦詩痛悼則異乎陳琳矣一病緣明主師曰甫自言得肺疾只緣思君也三年獨此心師曰言在寇庭未嘗少忘於君身雖困辱而此心無變窮愁應有作試誦白頭吟洙曰虞卿窮愁著書白頭吟以人情樂新而厭故蘇曰張跋欲娶妾其妻曰子試誦白頭吟妾當聽之跋慙悚而止此婦人女子善警戒者也贈韋七贊善鄉里衣冠不乏賢杜陵韋曲未央前洙曰未央殿基在長安杜陵韋曲地名也蘇曰袁粲字景倩幼孤祖哀之曰愍孫少好學有清才叔父淑雅重之語子弟曰我門不乏賢愍孫必當復三公古雍曲引云杜陵茂樹韋曲繁花照未央之宫前當昆明之他左風物冨秀爾家最近魁三象洙曰公自注云斗魁下兩兩相比為三台時論同歸洙曰一作因侵尺五天洙曰公自注云俚語曰城南韋杜去天尺五北走關山洙曰一作河開雨雪洙曰蕪城賦南馳蒼梧漲海北走紫塞鴈門南遊花栁塞雲煙鄭曰塞悉則切洙曰雲一作風洞庭春色悲公子蝦菜忘歸范蠡船洙曰句踐既滅吳范蠡乘扁舟泛五湖蘇曰郭林宗蝦菜菰米足以度歲使人忘歸趙曰言韋戀南地之蝦菜而忘歸如范蠡之遊五湖也崔評事弟許相迎不到應慮老夫見泥雨怯出必愆佳期走筆戲簡江閣要賔許馬迎午時起坐自天明浮雲不負靑春色細雨何孤白帝城趙曰孤負字出李陵書陵雖孤恩漢亦負德今丗多用辜負字乃俗子相承耳身過花間霑濕好醉於馬上往來輕虛疑皓首衝泥怯實少銀鞍傍險行寄髙三十五書記適歎息髙生老新詩日又多美名人不及佳句法如何洙曰按新唐書適五十始為詩即工以氣質自髙每吟一篇巳好事者輒傳主將收才子崆洞足凱歌洙曰前篇有送髙適詩云崆洞小麥熟且願休王師請公問王將焉用窮荒為趙曰主將哥舒翰也翰為河西節度使以適為掌書記崆洞隴右山名足凱歌以言必勝也聞君巳朱紱蘇曰潘嶽近聞朱紱猶慰老夫且得慰蹉跎師曰主將指哥舒收才子言收選髙適文才之士於幕府為掌書記崆洞山在西哥舒為安西都護凱歌皆適為之辝朱紱言增爵秩也所以慰甫渴别之情矣寄髙適新添楚隔乾坤逺難招病客魂詩名唯我共丗事與誰論北闕更新主南星落故園定知相見日爛熳倒芳樽贈田九判官梁丘崆洞使節上靑霄河隴降王欵聖朝鄭曰降胡江切洙曰欵納欵也趙曰乃哥舒翰獻捷之事何以明之崆洞隴右之山名也翰於天寶八載為隴右節度使興吐蕃戰于石堡城敗之拔其城更號神武軍上靑霄言入朝見天子也蓋領吐蕃降王以朝矣宛馬揔肥洙曰一作飛春苜蓿洙曰上莫六切下息六切洙曰大宛國漢時通人嗜蒲萄酒馬嗜苜蓿後二師至宛取善馬遂採蒲萄苜蓿種而歸趙曰此言得吐蕃之馬矣大宛最出良而吐蕃一帶馬無不善者苜蓿所以飼馬耳將軍只數漢洙曰一作霍嫖姚洙曰霍去病為嫖姚校尉注嫖姚皆徑疾之貌今讀音飄颻者非趙曰指出哥舒也漢霍去病為嫖姚校尉姚在漢書音作去聲而公作平聲沈存中筆談常論之矣以為無害於義鄭曰漢霍去病為嫖婔將軍音義嫖頻妙切姚羊召切皆徑疾貌今杜音飄遙余曰邵氏聞見録子美詩霍嫖姚對春苜蓿嫖姚字如律當讀平聲退之云凡為文辝宜略識字有以也夫又云子美以鄭季對文章春苜蓿對霍嫖姚或以為病惟知詩者能辨之陳留阮瑀誰爭長洙曰王粲傳始文帝為五官將及平原侯植好文學粲與北海徐幹字偉長廣陵陳琳字孔璋陳留阮瑀字元瑜汝南應璩字德璉東平劉楨字公幹並相友善曹供欲使瑀掌書記瑀終不為屈太祖辟為軍謀祭酒趙曰以比田九也以其為判官故比之阮瑀見上好在阮元瑜注京兆田郎早見招洙曰田鳯為郎端正入奏事靈帝目送鳯題柱曰堂堂乎京兆田郎鳯字秀宗趙曰又以比田九也麾下賴君才並入獨能無意向漁樵洙曰戲下謂軍之旌麾下也漁樵杜公自謂也蘇曰阮瑀語叔曰今涉仕路者如躍駿馬於薄冰何苦戀戀獨無意向漁樵乎趙曰此言主將麾下賴田君之才與諸俊並入可獨能無意而甘心於漁樵乎師曰哥舒為安西都護薜田梁丘為判官上靑霄言爵之髙也河隴降王言吐蕃部曲來降者舉地納𣢾苜蓿可以飼馬霍去病為嫖姚將軍以北哥舒阮瑀為曹洪書記故以北田漁樵甫自謂有意田薦之得廣州張判官叔卿書使還以詩代意鄉關胡騎逺趙曰鄉關以胡騎之阻故去之逺也宇宙蜀城偏洙曰蜀城因隨龜行而築故勢斜紆不正趙曰公言寓居宇宙內在蜀城之偏僻忽得炎州信洙曰廣州南故謂之炎州遙從月峽傳洙曰夷陵有明月峽趙曰荆州記巴蜀有明月峽孫曰十道志渝州有明月峽雲深驃騎幕洙曰霍夫病元狩二年為驃騎將軍趙曰張公居幕中夜隔孝廉船洙曰劉恢為丹陽尹張慿詣恢恢留宿明日乃還船須更恢出傳教求張孝廉船召同載時人滎之却寄雙愁眼相思淚點懸投簡梓州幕府兼簡韋郎十官幕下郎官安穩無趙曰出佛書問丗尊曰丗尊安穩否從來不奉一行書因知貧病人須棄能使韋郎迹也踈敬簡王明府葉縣郎官宰洙曰後漢方術傳王喬顯宗丗為葉縣今有神術即古仙人王子喬也明帝云郎官上應列宿出宰百里鄭曰葉失涉切唐韻縣名在汝州周南太史公洙曰司馬遷傳是歲天子始建漢室之封而太史公留滯周南不得從事發憤且卒如淳曰周南洛陽也張晏曰洛陽而謂周南者自陜以東皆周南之地也顔延年周南悲昔老留滯感遺氓神仙才有數流落意無窮驥病思偏秣鷹秋怕苦籠看君用髙義耻與萬人同重簡王明府甲子西南異洙曰言西南寒暑有異中土冬來只薄寒江雲何處靜洙曰一作盡蜀雨幾時乾洙曰楚詞泥汙后土兮何時乾行李須相問洙曰襄八年傳知武子使行人子貟對之曰君有楚命亦不使一介行李告於寡君注行李行人也慮諶詩簡才備行李窮愁豈有寬洙曰有一作自君聽鴻鴈響恐致稻粱難寄卬州崔録事卭州崔録事聞在果園坊洙曰坊名在成都久待無消息終朝有底忙應愁江樹逺洙曰謝玄睴詩中流辨江樹怯見野亭荒洙曰謝惠連詩飲餞野亭館浩蕩風煙外誰知酒熟香廣州段功曹到得楊五長史書功曹却歸聊寄此詩衛靑開幕府洙曰李廣傳注云衛青伐胸奴絶大漠克獲帝就拜大將軍於幕中故白幕府幕府之名始於此也楊僕將樓船洙曰漢征南越以楊僕為樓船將軍漢節梅花外春城海水邊趙曰漢遣使者必持節廣州大庾嶺多梅花故言梅花外州近海故云海水邊銅梁書逺及洙曰銅梁玉壘皆成都地名趙曰銅梁蜀地名言楊公自廣州有書來成都珠浦使將旋洙曰廣州合浦出珠使將還言段功曹將還廣州也師曰甫在蜀報楊以書附段功曹還故云云貧病他鄉老煩君萬里傳逢唐興劉主簿弟分手開元末洙曰開元二十九年改為天寶十載祿山反連年絶尺書洙曰古詩中有尺素書江山且相見戎馬未安居洙曰戎馬之際方奔走避亂未安所止劒外官人冷洙曰蜀在劒外關中驛騎踈輕舟下吳會洙曰都會之會謂當全吳都會之地主簿意何如趙曰公欲往兩浙而問主簿之意如何官亭夕坐戲簡顔十少府南國調寒杵趙曰庾信夜聽搗衣詩調聲不用吟西江浸日車趙曰淮南子日乘車駕以六龍羲和為馭客愁連蟋蟀洙曰詩蟋蟀在堂亭古帶蒹葭洙曰詩蒹葭蒼蒼不反青絲鞚洙曰見青絲絡頭為君老注趙曰鞚馬勒也青絲為之耳虛燒夜燭花老翁須地主細細酌流霞洙曰見流霞分片片注修可曰抱朴子載項曼都言到天上仙人以流霞一杯飲之戲寄崔評事表姪蘇五表弟韋大少府諸姪隱豹深愁雨洙曰謝玄暉雖無玄豹姿終隱南山霧定功曰劉向列女傳陶答妻謂其夫曰妾聞南山有玄豹霧七日不下食何也欲以澤其衣毛而成文章故藏以逺害也潛龍故起雲洙曰易潛龍勿用泥多仍徑曲心醉阻賢群洙曰中説心醉六經忍待江山麗趙曰言忍以待春景也還披鮑謝文洙曰鮑昭謝玄暉髙樓憶踈豁秋興坐氤氲寄常徴君白水靑山空復春趙曰言徴君本在白水青山之間今以其不在所以空復春也徴君晚節旁風塵洙曰徴君以其曽為朝廷禮聘而不起故謂之徴君蘇曰顔延年陶徴君晚節彌髙肯作風塵態趙曰言其晚節未路却出為官也楚妃堂上色殊衆海鶴階前鳴向人洙曰海鶴非階墀之物而今鳴向人者言徴君晚節也趙曰上句言徴君如楚妃之妍有絶衆之色下句言徴君如海鶴之髙非階墀之物而今鳴向人則以其旁風塵也萬事糾紛猶絶粒洙曰賈誼賦糾錯相紛一官羈絆實藏身趙曰言徴君也蓋愁疾病若無不有矣猶更有絶糧粒之患則其困可知一官羈絆則以成旁風塵之語舊注云公自言則公已不為官不可謂之羈絆也開州入憂知涼冷不似雲安毒熱新贈髙式顔昔别是何處洙曰是一作人相逢皆老夫故人還寂寞削迹共艱虞洙曰莊子云子削迹於衛自失論文友空知賣酒壚洙曰見為覔酒家壚注趙曰指髙式顔為論文友自失髙公則空知酒壚所在不復别有人可與共飲則亦沉滯愧處而巳酒壚使相如事平生飛動意見爾不能無趙曰言一見髙公則平生飛揚轉動之意不能自巳也義當如鳥之飛如物之動沈佺期李於侍郎祭文思含飛動師曰甫少與髙適李白常入酒壚論文酣詠自亂離以來相失今見式顔亦髙李之類不能無聳動故有末句酬孟雲卿樂極傷頭白更深愛燭紅相逢難衮衮師曰言際會不得數也告别莫匆匆趙曰衮衮相繼之意如不盡長江衮衮也字出晉書張華讀史衮衮可聽公言相逢既難得相繼故不可匆匆為別也魯曰張芳云匆匆不暇草書但恐天河落洙曰鮑明逺夜移衡漢落劉曰寓意祿山之亂恐朝廷傾陷也寧辭酒盞空洙曰孔融樽中酒不空趙曰飲盡而空也非樽中不空意明朝牽丗務揮淚各西東贈畢四曜玉臺後集載曜詩二首才大今詩伯洙曰晉有八伯疑八雋伯如侯伯之伯趙曰詩伯蓋亦宗師之稱也家貧苦宦卑飢寒奴僕賤顔狀老翁為同調嗟誰惜洙曰謝靈運誰謂古今殊異代可同調師曰同調言才調之同論文笑自知流傳江鮑體洙曰江文通鮑明逺相顧免無兒洙曰伯道無兒免無兒者言各有子也趙曰唐宗嘗曰蘇壞有子李嶠無兒免無兒言各有子以傳丗業即非伯道無兒事寄賀蘭二銛鄭曰息廉切朝野歡娛後洙曰張景陽詠史詩昔在西京時朝野多歡娛乾坤震蕩中相隨萬里日㧾作白頭翁洙曰曹丕書巳成老翁但未白頭耳歲晚仍分𬒮江邊更轉蓬勿云俱異域洙曰古詩與君俱異域飲啄幾回同寄杜位魯曰頃者與位同在故嚴尚書幕寒日經簷短窮猿失木悲洙曰淮南子曰猿顚蹶而失木又晉書曰窮猿奔林豈暇擇木修可曰謝鮑如失木之窮猿但自悲嘯峽中為客恨江上憶君時天地身何往風塵病敢辭封書兩行淚霑灑裛新詩寄杜位洙曰位京中宅近西曲江詩尾有𫐠近聞寬法離新州想見歸懷尚百憂逐客雖皆萬里去洙曰秦議逐客李斯在逐客中上書秦王留斯為客卿趙曰謂之皆萬里則所逐非止杜耳悲君巳是十年流洙曰流竄也干戈况復塵洙曰一作行隨眼鬢髮還應子曰侯景專制河南十四年常有跋扈飛揚之心師曰甫昔與李白有就丹砂之志今相顧飄蓬故於葛洪有所愧也飛揚跋扈指祿山必為亂也聞惠子過東溪新添蘇曰右一篇劉斯立得於管城人家惠子白驢瘦歸溪唯病身皇天無老眼空谷滯斯人崖蜜松花熟洙曰崖一作嵓熟一作古定功曰本草蜜一名白蜜一名崖蜜在髙山嵓石之間圖經云近宣州有黃連蜜色味黃小苦維洛間有梨花蜜如凝脂亳州太淸宮有檜花蜜色小赤並以蜂採其花作之而性之溫良亦相近崖蜜松花熟亦有蜂採松花而成蜜也山杯本中曰一作村醪竹葉春修可曰吳地志曰吳興烏程酒有名張華輕薄篇曰蒼梧竹葉竹青冝城九醖酒故張景陽七命云荆南烏程豫北竹葉田曰陳隂鏗竹詩葉醖冝城酒柴門了生事黃洙曰一作園綺未稱臣贈裴南部新添塵滿萊蕪甑堂橫單父琴蘇曰范丹字史雲為萊蕪令清貧人歌曰釡中生魚范萊蕪甑中生塵范史雲宓子賤為單父宰彈琴不下堂而治人皆知飲水公輩不偷金本中曰鄧攸為吳郡載米之郡惟飲吳水而巳同舍郎誣直不疑偷金不疑買償之梁獄書應作洙曰去聲秦臺鏡欲臨獨醒時所嫉群小謗能深即出黃沙在應須白髮侵使君傳舊德巳見直繩心懷舊古詩三首律詩九首昔遊昔者與髙李洙曰髙適李白晚登單父臺洙曰宓子賤嘗為單父宰鮑曰按唐志單父屬宋州寒蕪際碣石萬里風雲來琪曰言其地廣逺也師曰甫昔與髙適李白同登是臺眺望山東之地沃野萬里遂敘其地豐冨如此自祿山反於山東風俗雕弊傷今不如昔也桑柘葉如雨飛藿共徘徊師曰桑柘所養蠶葉潤澤如雨藿乃葵藿人食嘉𬞞以藿為賤藿生子隨風飛徘佪蓋言𬞞菜厭飫有餘故也清霜大澤凍禽獸有餘哀是時倉廪實洞逹寰區洙曰一作宇開洙曰此言開元之際也時天下冨庶民俗殷阜山入河隍之賦稅府一積不可勝計猛士思滅胡洙曰時任蕃將務邊功將帥望三台洙曰時邊帥有帶平章事者安祿山以求宰相不得而遂反君王無所惜駕馭英雄材幽燕盛用武洙曰時祿山擊契丹無寧歲供給亦勞哉吳門轉粟帛泛海陵蓬萊洙曰時韋堅於望春樓下鑿潭以通漕大置南海珍貨舟尾相銜數十里不絶上御樓觀之肉食三十萬獵射起黃埃夢符曰右按春秋左氏傳曰肉食者鄙不能逺謀蘇曰王起虛養肉食之士三十餘万一旦社稷災變無一夫委身為朝廷者隔河憶長眺靑歲巳摧頽洙曰肅宗度河入靈武也不及少年日蘇曰王導詩思酒量猶不及少年日無復故人杯賦詩獨流涕亂丗想賢才有能洙曰一作君能市駿骨莫恨少龍媒洙曰古有市駿骨而得駿馬者以喻尊士之似賢者必得真賢商山議得失洙曰四皓也議得失謂安漢太子也蜀主脫嫌猜洙曰蜀主劉備也為曹操嫌猜呂尚封國邑洙曰封於營丘號齊傅説已鹽梅洙曰作相也師曰凡此能用賢也傷今不然景晏楚山深水鶴去低回師曰陶潛歸去來辭云鳥倦飛而知還亦此意也龐公任本性携子卧蒼苔洙曰龐德公也與妻子隱於鹿門山孟子曰窮則獨善其身逹則兼善天下上之數公皆能乘時以有為者也甫自悲不得其時則莫若俲龐公之潔己尓有懷合州鄭十八司户洙曰虔時坐汙賊貶台州司户天台隔三江洙曰天台山名三江一云江海師曰天台山在台州三江一錢塘二揚子三吳松風浪無晨暮鄭公縱得歸老病不識路洙曰沈休文夢中不識路何以慰相思趙曰暗使韓非子事六國時張敏與髙惠為友每相思不能得見敏便於夢中往尋但行至半道即迷不知路昔如水上鷗趙曰何遜詩曰可憐雙白鷗朝夕水上遊今如罝中兔洙曰詩肅肅兔罝蘇曰王㙖與弟書曰我若罝中毚兔遂能跳躑恐未免死性命由他人悲辛但狂顧洙曰周烋悲辛眩旋時復狂顧山鬼獨一腳洙曰一足曰夔魍魎也夢符曰右按楚詞屈原九歌章句有山鬼蝮蛇長如樹洙曰招魂蝮蛇蓁蓁雄虺九首呼號旁孤城歲月誰與度從來禦魑魅多為才名誤洙曰傳文十八年舜流四凶族渾敦窮竒檮杌養餮投諸四裔以禦魑魅山林異氣所生為人害者趙曰指言鄭公謫為台州司户夫子嵆阮流更被時俗惡洙曰嵆康阮藉嵆康書云阮嗣宗為禮法之士所繩故疾之為讎蘇曰傳休奕不才耿介多𬒳時俗嫌惡海隅微小吏趙曰言鄭公反謫為小吏也眼暗髮垂素洙曰潘安仁興賦素髮颯以垂領黃帽映靑袍洙曰一云鳩杖近青𫀆修可曰後漢禮儀志八十九十賜玉枝以鳩鳥為飾謂之鳩杖鳩者不噎之鳥欲使老人不噎師曰黃帽乃竹籜冠非供折腰具洙曰見凄涼為折腰注陶潛焉能折腰於閭里小兒趙曰黃帽非是當作鳩杖平生一杯酒洙曰沈休文平生少年日分手易前期勿言一樽酒明日難重持見我故人遇洙曰古詩潚湘逢故人趙曰暗用謝眺詩山川不可夢况乃故人杯相望無所成乾坤莽回互洙曰言天地雖大胡為其身若無所容乎宿靑溪驛奉懷張貟外十五兄之緒漾舟千山內鄭曰漾余亮切日入泊荒渚蘇曰荒作枉曲渚也謝靈運詩弭棹歸枉枉渚趙曰謝靈運西陵遇風詩漾舟陶嘉月莊子日入而息文選通波激枉渚我生本飄飄今復在何許洙曰言未有所定止也石根靑楓林猿鳥聚儔侶洙曰言猿鳥猶能聚其儔侶而人不能致於安適則甫之羈困可見矣月明遊子靜畏虎不得語趙曰古詩相望一水間脈脈不得語中夜懷友朋乾坤此深阻浩蕩前後間佳期付荆楚趙曰浩蕩流放之貌楚辝志浩蕩而傷懷非止言水也師曰甫離蜀中移居夔州今又自夔下峽欲之荆南夜宿青溪驛而有此作故末章云佳期付荆楚今復在何許言此不知駐足於何所也猿與鳥尚得以其類相聚甫今別張貟外中夜懷之曽猿鳥之不若乎虎喻盜賊也不得語恐姦人窺伺之亂丗匿迹若此題鄭十八著作丈台州地闊海冥冥洙曰闊一作僻雲水長和島嶼靑洙曰台州鄭貶懷舊趙曰懷蘇原明也公平生所最善今巳死而追悼之故曰懷舊地下蘇司業親情獨有君洙曰司業即原明也新史云雅善杜甫那因喪亂後洙曰喪一作衰鄭曰喪息郎切便有死生分洙曰有一云作老罷知明鏡悲來望白雲趙曰仰視浮雲馳奄忽互相踰自從失詞伯不復更論文洙曰蘇前名預緣與今上同名後改為原明趙曰王充論衡有云文詞之伯師曰時原明巳死故云地下知明鏡言覽鏡知其衰老古有白雲萹觀蘇之萹詠則情不勝其悲所思趙曰古樂府云有所思故公倚以為題虔以祿山之汚貶台州司户鄭老身仍竄趙曰言雖免死而卒不免於貶台州信洙曰一作始所傳洙曰鄭老虔也以汙賊貶台州趙曰始得其消息也為農山澗曲卧病海雲邊丗巳踈儒素蘇曰梁珩丗方用兵戈與儒素相踈三代典謨慮後此掃地其如後丗蒼生何人猶乞酒錢洙曰公嘗贈虔詩云賴得蘇司業時時與酒錢徒勞望牛斗無計􅓯龍泉趙曰使牛斗之間有紫氣事龍泉劒名也􅓯之為言掘也蓋以劒北公之在台州如劔之埋於土中雖逺望其衝斗牛之氣而無由掘顯之故也師曰台州屬吳吳應牛斗之域昔雷煥掘劒於豐城獄上常有紫氣夜衝牛斗􅓯謂掘取之也喻虔有衝斗氣朝廷不用故云無計􅓯龍泉不見魯曰近無李白消息不見李生久佯狂真可哀趙曰萁子𬒳髮佯狂唐史載以永王璘之纍流夜郎丗人皆欲殺趙曰白會赦還尋陽坐事下獄此衆人欲殺之證也吾意獨憐才敏捷詩千首飄零酒一杯匡山讀書處鄭曰匡蘆山也頭白好歸來洙曰新史載白始隱岷山後客任城居徂徠山而並不載匡山也修可曰范傳正李白新墓碑云白之先客居蜀之彰明太白生焉彰明綿州之屬邑有小大匡山白讀書於大匡山有讀書臺尚存其宅在清廉鄉後廢為僧坊居隴西院蓋以太白得名所謂匡山乃彰明之大匡山非匡廬也秦曰白以永璘王反事坐謫放春日憶李白白也詩無敵洙曰一作數飄然思不群清新庾開府洙曰蕭楊州薦土表辝賦淸新陸雲別傳雲亦善為文清新不及機趙曰庾信也在周為開府鄭曰庾信字子山為車騎將軍開府俊逸鮑參軍洙曰鮑昭字明逺為宋臨海王參軍蘇曰鍾榮曰鮑參軍詩如野鶻畨雲良馬走堤俊逸奔放渭北春天樹江東日暮雲洙曰事見昔遊詩江淹詩曰日暮碧雲合蘇曰王濟曰雲日暮不成霖雨空返故山此詩微諷讀者當識意李泰伯曰渭北甫所居也江東白之所在何時一樽酒重與細論文洙曰沈休文勿言一樽酒明日難重持趙曰論文而至於細始盡其妙矣非李杜莫造也亦孟浩然何時一杯酒重與李膺傾十朋曰王直方詩話亦云冬日有懷李白寂寞書齋裏終朝獨爾思更尋嘉樹傳不忘角弓詩洙曰昭二年傳晉侯使韓宣來聘公享之韓子賦角弓既享宴于季民有加樹韓宣子譽之武子曰宿敢不刲殖此樹以無忘角弓遂賦甘棠宣子曰起不堪也無以及召公䄈褐風霜入鄭曰䄈臣庾切下胡葛切洙曰貢禹䄈褐不完師古曰䄈者謂僮竪所著布長襦也褐毛布也還丹日月遲洙曰道經言還丹能使人長生不死趙曰以言白有仙風道骨其所燒還丹可以遲延日月賀知章號白謫仙人在李白使之為當體師曰嘉樹傳角弓詩皆指李白之不可忘也還丹九轉丹也九遍循環然後成就服之可使延年故云日月遲未因乘興去洙曰王子猷乘興訪戴安道空有鹿門期洙曰漢隂有鹿門山龐德公所隱地趙曰公自言無因乘興如王子猷訪戴而去徒與白有效龐德公隱鹿門山之期約也天末懷李白趙曰自於至德二載坐永王璘而謫夜郎故公在秦州懷之而作涼風起天末君子意如何洙曰月賦雲斂天末鴻鴈幾時到江湖秋水多文章憎命逹魑魅喜人過鄭曰上抽知下明袐切趙曰欲害之矣譬小人害君子之意師曰自古文章之士命運多蹇滯魑魅言貶所窮僻應共冤魂語投詩贈汨羅琪曰指屈原也馬曰若原不遇投汨羅江死故甫有是句鄭曰汨迷茟切暫如臨邑至㟙山鄭曰㟙當作厝資昔切縣在臨卬今云如臨邑至㟙山故知當作庴湖亭奉懷李貟外率爾成興野亭逼湖水歇馬髙林間鼉吼風奔浪洙曰鼉吼則風起魚跳日映山鄭曰跳徒聊切躍也洙曰日暖魚跳戲趙曰鼉吼則有風而浪起之時魚以日暖而跳當日映山之時皆紀宕事暫遊阻詞伯却望懷靑關趙曰詞伯指李貟外矣王充論衡文詞之伯也李膺在青關故有回望之句藹藹生雲霧唯應促駕還洙曰促駕猶速駕蘇曰郭玄遊漢中與相如禊飲沙州甚歡去曰唯愁斜陽促還趙曰此言景物之可愁矣故當速駕而返也師曰詞伯詞人之長也指李貟外靑關地名李之所居生雲霧謂天將雨故督車馬速歸也所思苦憶荆州醉司馬洙曰崔吏部倚謫官洙曰一作居樽爼洙曰一作酒定常開九江日落醒何處洙曰禹貢九江孔殷地理志九江在今蘆江潯陽縣南皆東合為大江然則江以南水無大小俗呼為江應劭謂江自潯陽合為九道尋陽記有九江之名一曰烏江二曰蚌江三曰烏白江四曰加靡江五曰畒江六曰白原江七曰廪江八曰提江九曰菌江一柱觀頭眠幾回洙曰荆州路畔有一柱觀在山上土人呼為木履觀梁劉孝綽江津寄劉之遘詩經過一柱觀出入三休臺可憐懷抱向人盡欲問平安無使來故慿錦水將雙淚好過瞿塘灔澦堆洙曰瞿唐峽名灔澦石名也在水中荆州記云灔澦如馬瞿唐莫下灔澦如象瞿唐莫上蓋人以為水則也分門集注杜工部詩卷第十九
