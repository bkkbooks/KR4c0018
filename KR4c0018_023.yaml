  text: 分門集註杜工部詩卷第二十三鳥
  hash: sha256:f0c7bc05ef85cced310779615ab077484433227a31794ef199a674d2e41b11c8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_023-1a}
body:
  text: 古詩七首律詩二十五首鳯凰臺魯曰此詩思見太平之君子也鄭曰酈道元水經云水南逕槃頭郡東而南合鳯溪水水上乗蜀水於廣業郡南逕鳯溪中有二石雙髙其形若闕漢時有鳯凰止其上故謂之鳯凰臺北去郡三里亭亭鳯凰臺洙曰謝惠連亭亭映江月西京賦干雲霧以上逹狀亭亭以迢迢劉公幹亭亭山上松師曰乃秦弄玉與蕭史吹簫于此所謂鳯凰臺上憶吹簫是也端本曰亭亭高貌北對西康州鄭曰地理志河池郡後周改曰鳯州領同谷舊曰白石置廣業郡西魏改曰同谷後周置康州大業𥘉廢唐地理成州同谷郡武徳元年以同谷置西康州貞觀元年州廢西魏槃頭郡亦唐興州之長舉縣也西伯洙曰西伯文王也今寂寞鳯聲亦悠悠洙曰西伯時鳯鳴于歧陽師曰文王七年受天命鳯鳴于歧岳而興王道自文王旣没鳯聲亦息而不聞是詩寓意傷當丗賢者不進蓋鳯之爲物有道則見無道則隱喻賢者岀處之道山峻路絶蹤石林氣髙浮安得萬丈梯爲君上上頭恐有無母雛飢寒日啾啾我能剖心出蘇曰孔郁諫靈帝帝不納郁曰臣能剖出此心後丗名莊子比干剖心飲啄慰孤愁心以當竹實烱然忘外求血以當醴泉豈徒比清流所重王者瑞敢辭微命休夢符曰春秋元命苞周成王時大治鳯皇來舞於庭成王乃授琴而歌鳯凰翔兮於紫庭余何徳兮以感靈又瑞應圖曰鳯王者之嘉瑞坐看綵翮長鄭曰如字舉意八極周自天䘖瑞洙曰一云圖䜟圖飛下十二樓洙曰十洲記曰崑崙山有十二玉樓圖以奉洙曰一作獻至尊修可曰春秋元命苞皇帝遊元扈洛水之上注元扈石室也與大司馬容光等臨觀鳯凰圖置帝前帝再拜受圖鳯以垂鴻猷蒼舒曰右按山海經鳯首文曰徳翼文曰禮背文曰義膺文曰仁腸文曰信邁曰鴻猷大道也鳯乗鴻猷所以表大道再光中興業一洗蒼生憂深衷正爲此羣盗何淹留洙曰鳯非梧桐不棲非竹實不四句非詩也盖甫於題下自記杜鵑事後人誤冩之耳或曰正古之謡語豈復以韻爲限耶按博物志杜鵑生子寄之它巢百鳥爲飼之且禽鳥之微猶知有尊故子美云重是古帝魂文云禮若奉至尊子美盖譏當時之刺史有不禽烏若也唐自明皇天寳已後天歩多棘刺史不能致節於君者可得而考嚴武在蜀雖横斂刻薄而實致職以資中原是西川有杜鵑耳其不度王命特固以自玩擅軍旅絶貢賦以自固者如杜克讓之在梓州爲朝廷西顧之憂是東川無杜鵑耳涪萬雲安刺史微不可考其尊君者爲有也懷貳自固者爲無也不在夫杜鵑真有無也西川有杜䳌東川無杜鵑涪萬無杜鵑雲安有杜鵑我昔遊錦城結廬錦水邊洙曰子美結廬在浣花里有竹一頃餘喬木上叅天蘇曰上林苑喬木參天松篁隂合珎禽奇獸自然駢集趙曰曹子建云荆棘上叅天杜鵑暮春至哀哀呌其間我見常再拜重是古帝魂趙曰鮑昭行路難云中有一鳥名杜鵑云是古時蜀帝魂公所用蓋出於此也至若此篇常再拜而重之不能拜而淚下則尊君之意前人所不到生子百鳥巢百鳥不敢嗔洙曰一作喧仍爲餧其子洙曰丗說杜鵑餋子於百鳥巢百鳥共餋其子而不敢犯禮若奉至尊洙曰成都記曰杜宇亦曰杜主自天而降稱望帝好稼穡教人務農治郫城亦曰望帝至今蜀人将農者必先祀杜主時荊州人鼈靈死其尸泝流而上至文山下復生見望帝望帝因以爲相號曰開明會巫山壅江人遭洪水開明爲鑿通流有大功望帝因以其位禪焉後望帝死其䰟化爲鳥名曰杜鵑亦曰子規又云子規深春乃有聲低且怨與比之思歸樂都不同也洛京東西多此鳥人以爲子規者誠妄矣又云宇禪位于開明升西山隱焉時適三月子規鳥鳴故蜀人悲子規鳥鴻鴈及羔羊有禮太古前行飛與跪乳識序又知恩洙曰晉羊祜鴈賦鳴則相和行則接武前不絶貫後不越序春秋繁露曰凡䞇卿用羔羔有角而不用如好仁者執之不鳴殺之不謗類死義者羔飲其母必跪類知禮者故羊之爲言猶詳故以爲䞇趙曰謂成行列而飛所以謂之鴈序也聖賢吾法則付與後丗傳君看禽鳥情猶解事杜鵑今忽暮春間值我病經年身病不能拜淚下如迸泉洙曰古詩譏丗亂而不能明臣之義者禽鳥之不若也修可曰劉越石扶風歌據按長歎息下淚如流泉余曰百斛明珠云南都王誼伯書江濵驛垣謂子美詩歷五季兵火多舛缺竒異雖經其祖父公所理尚有疑闕者誼伯謂西川有杜鵑東川無杜鵑倍南無杜鵑雲安有杜鵑盖是題下注断自我昔遊錦城爲首句誼伯誤矣蓋子美詩備諸家躰非必率合程度偘偘者然也且篇句處凡五杜鵑豈可以文害辭辭害意耶原子美之意類有所感託物以發者也亦六義之比興離騷之法歟按博物志杜鵑生子寄之他巢百鳥飼之胡江東所謂杜宇曽爲蜀帝王化禽飛去舊城荒是也且禽鳥之微知有尊故子美詩云重是古帝魂又礼若奉至尊子美蓋譏當時之刺史有不禽鳥若也自唐明皇巳後天歩多棘刺史不能致節於君者可得而考嚴武在蜀雖横歛刻薄而實資中原是西川有杜鵑耳其不受王命負固以自抗擅軍旅絶貢賦如杜克遜在梓州爲朝廷西顧憂是東川無杜䳌耳至於涪万雲安刺史微不可考凡其尊君者爲有也懐貳者爲無也不在夫杜鵑真有無也誼伯以爲來東川聞杜鵑聲煩而急乃始疑子美詩跋㚄𥿄上語又云子美不應疊用韻子美自我作古疊用韻無害於爲詩僕所見如此誼伯博學強辨殆必有以折衷之杜鵑行君不見昔日蜀天子化作杜鵑似老烏趙曰按蜀記者有姓名宇號望帝宇死俗傳化爲子規鳥一名鵑蜀人聞子規鳥皆曰望帝逐於鵑字加杜姓謂之杜鵑又直謂之杜宇寄巢生子不自啄羣鳥至今與哺鶵雖同君臣有舊禮骨肉满眼身覊孤業工竄伏深樹裏四月五月偏號呼其聲哀痛口流血所訴何事常區區爾豈摧殘始發憤羞帶羽翮傷形愚蒼天變化誰料得萬事反覆何所無萬事反覆何所無豈憶當殿羣臣趨洙曰此詩注並在杜䳌詩内趙曰鮑昭行路難云中有一鳥名杜䳌言是古時蜀帝䰟聲音哀苦鳴不息羽毛憔悴似人髠飛走樹間逐蟲蟻豈憶往月天子尊念此死生變化非常理心中惻愴不能言今公所謂哀痛口流血又有摧殘之語及末句憶羣臣趨且云萬事反覆盖岀於此也師曰時禄山反䧟兩京明皇西走幸蜀旣失帝位奈何又弃骨肉而孤寓他邦是時諸王公主皆爲賊所翦滅豈非杜鵑化而似老烏之比乎觀此詩有雖同君臣有舊禮骨肉满眼身覉孤萬事反覆何所無豈憶當殿羣臣趍之語詳味其旨蓋爲明皇感嘆者也杜鵑蜀帝也國云身死怨而化爲杜鵑鳥毎生子寄居百鳥之巢百鳥之巢百鳥爲之哺飼其子帝以四五月悲鳴流血血染山花其色殷紅號爲杜鵑花然其聲哀怨者豈非若訴國云而身摧残變而爲禽耶肅宗即位靈武不能即遣迎還明皇而使之爵孤在蜀明皇由是悒怏不得意至於化去其亦不免於怨傷乎甫之言頗有深意杜鵑新添古時杜宇稱望帝魂作杜鵑何微細跳枝竄葉樹木中搶佯瞥捩雌随雄鄭曰搶七羊切佯音羊瞥匹烈切捩力計切毛衣慘黒貌憔悴衆鳥安肯相尊崇墮形不敢栖華屋短翮唯願巢深叢穿皮啄朽觜欲秃苦饑始得食一䖝誰言養鶵不自哺此語亦足爲愚䝉聲音咽咽如有謂號啼略與嬰兒同口乾垂血轉迫促以欲上訴於蒼穹蜀人聞之皆起立至今斆學傳遺風廼知變化不可窮豈思苦日居深宫嬪嬙左右如花紅洙曰此詩注並在杜鵑詩内義鶻行彦輔曰感鳥獸猶見義而動也隂崖有蒼洙曰一作二鷹養子黒栢巔白蛇登其巢吞噬恣朝餐洙曰噬一作之雄飛遠求食雌者鳴辛酸力強不可制黃口無半存蘇曰定遠侯過隍中至門燉煌氐羗掃殄殆盡黄口亦無存者趙曰隂崖出長笛賦惟鍾籠之竒生兮于終南之隂崖朝飡出楚辭胥瓊以朝飡也黄口出家語孔子見羅者所得雀皆黄口也其父從西歸洙曰一作來飜身入長煙斯須領健鶻痛憤寄所宣斗上捩孤影鄭曰捩練結切拗捩也噭哮來九天鄭曰上古弔切深聲也下許交切脩鱗脫逺枝巨顙拆老拳時可曰石勒與李陽隣居爭漚麻池日相敺擊及貴乃召陽與酣謔引陽臂笑曰孤往日厭卿老拳卿亦飽孤毒手髙空得蹭蹬洙曰海賦蹭蹬波失勢貌短草辭蜿蜒折尾能一掉洙曰江賦揚鬐掉尾左傳尾大不掉飽膓巳皆穿生雖减衆雛死亦垂千年物情有報復快意貴目前兹實􅋧鳥最急難心惘然洙曰孔融云􅋧鳥累百棠棣兄弟急難功成失所往用捨何其賢近經潏水湄此事樵夫傳飄蕭覺素髪洙曰潘安仁班鬢彪以以承弁素髪飄以垂領凛欲衝儒冠洙曰欲一作烈盧子諒詩怒髪上衝冠人生許與分亦在顧眄間聊爲義鶻行永激壯士肝蘇曰陸遜時政論曰不以典刑善惡焉能激壯士之肝膽耶呀鶻行新添鄭曰呀虚加切張口也病鶻卑飛俗眼醜每夜江邊宿衰柳淸秋落日巳側身過鴈歸鵶錯迴首緊腦雄姿迷所向踈翮稀毛不可狀強神迷復皂鵰前俊材早在蒼鷹上風濤䬃䬃寒山隂熊羆欲蟄龍蛇深念爾此時有一擲失聲濺血非其心王兵馬使二角鷹悲臺蕭瑟石巃嵸洙曰潘岳西征賦巃從逼迫注巃嵸髙大貌也鄭曰巃力空切嵸即空切嵯峨貌哀壑􅒎枒浩呼洶鄭曰杈初牙切枝也枒五加切中有萬里之長江夢符曰右按丗說有人譏周僕射與親友言戯穢雜無檢節周曰吾若万里長江何能千里一曲即周頻也廻風䧟日孤光動角鷹翻倒壯士臂將軍玉帳軒勇氣修可曰揚子雲甘泉賦曳虹采之流離兮颺翠氣之宛延師古曰宫室廣大自然存紅紫之壯氣二鷹猛腦絛徐墜洙曰見黒白二鷹詩注荆公蘇公本並同趙曰舊本作徐侯鐩殊無理義王介甫曰善本作絛徐墜於理或然晉潘尼雨行賦有云始蒙瀎而徐墜目如怒胡視天地杉雞竹兔不自惜孩虎野羊俱辟易鄭曰上音壁下音亦洙曰新唐書裴旻射虎一日疊三十六頭見一老人曰此彪也前有眞虎将軍遇之殆矣旻怒馬赴之果有一小虎伏地而吼旻馬辟易弓天墜地趙曰辟易字祖出項羽傳楊喜追羽羽叱之喜人馬俱驚辟易師古注曰辟易謂開張而易其本處舊注引張旻射虎事誤矣鞲上鋒稜十二翮鄭曰鞲古侯苦侯二切洙曰鮑明逺昔如鞲上鷹將軍勇銳與之敵將軍樹勳起安西崑崙虞泉入馬蹄夢符曰右按楚辭囚靈元於虞淵注虞淵日所入也淵與泉同白羽曽肉三狻猊洙曰白羽箭趙曰白羽箭也猊師子也鄭曰狻先丸切猊五兮切師子一走五百里敢决豈不與之齊荆南芮公得將軍亦如角鷹下翔洙曰一云入翔雲惡鳥飛飛啄金屋洙曰謂賊䧟長安蘇曰蒙恬云鵂鶹惡鳥下啄金屋乆栖琪樹安得爾軰開其羣驅出六合梟鸞分洙曰使君子小人各得其所也趙曰啄金屋言可憎之惡鳥喙富貴家之屋當得角鷹開破之江揔曰黃鳥飛飛有時度漢武帝曰河嬌當以黄金屋貯今公取其貴而用之耳師曰悲臺哀壑長江先言荆楚風景故述角鷹之所由出也巃嵸髙大貌􅒎枒不齊貌鷹有角亦若馬有肉餕也始爲竒特楊子雲甘泉賦乗雲閣而上下兮紛蒙籠以混成曳虹彩之流離兮颺翠氣之宛延顔師古曰宫室曠大自然有紅紫之氣此云軒翠氣亦謂靑油幕下軒揚其翠氣也杜田公軒昂氣恐理或不然王兵馬與徐侯穟皆趙芮公猛将故子美以二鷹猛腦况之愁胡謂思胡地辟易退却皃不自惜言不保其性命韝以皮謂其臂也安西都護府崑崙虞泉皆在西白羽乃箭名三狻猊喻西域三部王公起于安西甞擒西域胡酋其敢决頗似是鷹故美之金屋謂天子黄金闕也惡鳥喻史思明殘黨猶䧟長安故子美欲得王公驅其羣以清六合使君子小人各得其所而不雜糅故曰梟鵉分梟食母之鳥見王監兵馬使說近山有白黒二鷹羅者乆取竟未能得王以爲毛骨有異它鷹恐臘後春生騫飛避暖勁翮思秋之甚眇不可見請余賦詩二首雲飛玉立盡淸秋趙曰此專詠鷹如雲之飛如玉之立皆言其白至清秋之尽則序所謂臘後春生騫能避暖是也不惜竒毛恣遠遊在野只教心力破千人何事綱羅求趙曰序云羅者竟未能得也一生自獵知無敵趙曰鷹所以用獵也謂其野鷹故云自獵庾信詩云野鷹能自獵江鷗解獨漁百中争能耻下鞲洙曰史滑稽傳注鞲臂捍也東觀記太守桓虞署趙勒爲督郵貪令自去虞歎曰善吏如使良鷹下鞲命中鵬礙九天須却避趙曰孔氏志曰楚文王雅好田獵有一人献一鷹曰非王鷹之疇俄而雲際有一物疑翔飄颻鮮白而不辨其形鷹見之於是竦翮而升矗苦飛電須臾物墮如雪血灑如雨良乆有一大烏墜地而死度其兩翅廣数十里衆莫能知時有博物君子曰此大鵬雛也始飛焉故爲鷹所制又王乃厚賔献者兎經三窟莫深憂洙曰鵬事見莊子馮諼曰狡兎所以免於死者有三窟今爲君一窟矣黒鷹不省人間有度海疑從北極來洙曰元命苞瑗光爲鷹趙曰北方之極也北方肅殺之氣故鷹多生於此正翮摶風超紫塞趙曰崔豹古今注曰秦所築長城土色皆紫漢塞亦然玄冬幾夜宿陽臺趙曰善本作玄舊作立冬非也字出梁元帝纂要冬日玄冬虞羅自各虚施巧洙曰隋魏彦深鷹賦可虞者之多端運横羅以羈束春鴈同歸必見猜趙曰此序所謂獵後春生騫飛避暖故云與鴈同歸萬里寒空秪一日金眸玉爪不凡材洙曰鴈門有紫壃城草皆紫色故曰紫塞催宗文樹雞柵吾衰怯行邁耒曰遠行曰邁旅次展崩迫趙曰易旅卦有旅即次任彦昇辝奪礼啓云不任崩迫之情愈風傳烏雞洙曰本草以烏雌雞治風秋卵方漫喫趙曰春如可以抱育而秋夘充食而巳自春生成者隨母向百翮駈趂製不禁喧呼山腰宅課奴殺靑竹洙曰楚人以火炙竹去其汗謂之殺青欲其兩乆也終日憎赤幘洙曰赤幘雞之有冠趙曰小說載空宅有怪或居之中夜有赤幘而來問其怪類荅曰老雄雞也踏藉盤桉翻塞蹊使之隔墻東有隙地可以樹髙柵避熱時來歸問兒所爲跡織籠曹其内令入不得擲稀閒可突過觜爪還汚席我寛螻蟻遭彼免狐貉厄應冝各長㓜自此均勍敵籠柵念有脩近身見洙曰一作知損益洙曰言非特制難而已於近身之事亦可知損益也明明領處分一一當剖析不昧風雨晨洙曰風雨晦明不乱其鳴也亂離减憂慼洙曰雞鳴之詩亭詩者以爲乱丗則思君子子美之减憂慼其可見矣其流則凡鳥其氣心匪石洙曰以不改其度也倚頼窮歲晏撥煩去洙曰一作皮冰釋趙曰莊子渙若氷將釋未似尸郷翁拘留蓋阡陌洙曰柷雞翁居尸郷山下餋雞百餘軰有名字呼名則種别而至販雞及賣子見列仙傳縛雞行鄭曰縛伏約切小奴縛雞向市賣雞𬒳縛急相喧爭家中厭雞食蟲蟻不知雞賣還遭烹蟲雞於人何厚薄吾叱奴人解其縛雞蟲得失無了時注目寒江倚山閣蘇曰杜悰注目寒水搔首思歸梁歇終日倚小閣望逺水悠然自楽後隱天台山不知所之趙曰人之得失如雞如䖝又且相仍何時而了乎至於注目寒江倚山閣則所思深矣近丗惟黄魯直逹此詩之旨其書酺池寺書堂云小黠大癡螗蜋捕蟬有餘不足䕫怜蚿退食歸來北䆫夢一江風月趂漁舡可與言詩者當自解也師曰爱䖝則害雞爱雞則害䖝利害得失要在權其輕重而爲之除冠則勞民愛民則餋寇其理亦猶是也與其養寇孰若勞民與其食䖝孰芳存雞雞紀徳名標五洙曰田饒曰夫雞戴冠文也足持距武也見敵而鬪勇也得食而相呼義也鳴不失時信也雞有五徳君猶烹而食之其所由來近矣𥘉鳴度必三洙曰禮文王出子雞𥘉鳴衣服至寝門蘇曰雞經未曉而必三唱古詩云三唱逺村雞殊方聽有異洙曰晉祖逖與劉琨同寢中夜間雞鳴蹴琨曰此非惡声因起舞失次曉無慙洙曰詩雞鳴匪雞則鳴蒼蠅之声後漢應門失守閞雎刺世趙曰公在䕫爲殊方於殊方而聽雞鳴有異於中原之它日則以雞失鳴之次而天旣曉矣殊無慙𧹞也此陳壽国志所謂失旦之雞者矣問俗人情似充庖爾軰堪洙曰禮充君之庖蘇曰梁繪兒羣雞而語曰爾軰堪充吾席之上庖氣交亭育際趙曰梁劉孝綽啓曰一物之微遂留亭育巫峽漏司南歸燕洙曰此詩公託意以自喻也自東楼下皆有所感而作然以前賢措意皆起一時之興故不敢妄生意思曲爲穿鑿也不獨避霜雪其如儔侣稀四時無失序八月自知歸洙曰言四時迭運自得其序而以炎凉往來者乃燕之自知爾春色豈相訪衆鶵還識機故巢儻未毁會傍主人飛鄭曰傍去声師曰此詩公託意以自况也避霜雪言避亂也四時迭運自有炎凉公之去就非若俗熊之奔競也故巢喻故郷燕子來舟中作湖南爲客動經春燕子衘泥兩度新洙曰見䘖泥附炎熱注舊入故園甞識主如今社日逺看人可憐處處巢居洙曰一作君室洙曰古詩思爲双飛燕㗸泥巢君室何異飄飄託此身暫語船檣還起去穿花落水益霑巾雙燕旅食驚雙燕洙曰一作双飛燕㗸泥入此堂洙曰魏文帝書旅食南館古詩思爲双飛燕㗸浞巢君堂應同避燥濕夢符曰右按春秋左氏傳子罕曰吾儕小人皆有闔廬以避燥濕寒暑且復過炎凉養子風塵際來時道路長趙曰梁呉均燕詩問余來何遲山川幾紆直今秋天地在吾亦離殊方趙曰言當秋而身於天地之間存在亦如燕捨此而去禹稱曰此詩子美托物以見巳意鸚鵡魯曰一云翦羽注皆是祢衡賦鸚鵡含愁思聦明憶别離洙曰祢衡賦性辯慧而能言才聦明以識機趙曰憶别則眷西路而長懐望故郷而延佇翠衿渾短盡紅觜謾多知洙曰紺趾丹觜緑衣翠衿趙曰以言語而階亂將不密以致危也未有開籠日洙曰閉以彫籠翦其翅羽䳡鷯賦鸚鵡慧而入籠空殘宿舊枝洙曰想昆山之髙峻思鄧林之故枝世人憐復損何用羽毛竒洙曰虽同殊於毛羽故殊智而異心子規峽裹雲安縣江樓翼瓦齊兩邊山木合終日子規啼洙曰子規杜䳌也公有杜鵑行云涪万無杜鵑雲安有杜鵑此可見矣蘇曰非親到其処不知此詩之主也眇眇春風見蕭蕭夜色凄趙曰於春風之中眇眇見之也客愁那聽此故作傍人低趙曰一作故傍旅人低非是蓋巳言愁不應更言旅人也百舌百舌來何處重重秖報春知音兼衆語整翮豈多身花密藏難見洙曰一云難相見枝髙聽轉新過時如發口君側有讒人鮑曰王直方詩話山谷云余讀周書月令反舌有声讒人在側乃解老杜過時如發口君側有䜛人之句按周書月令乃周公時訓也百舌之爲反舌見㵼烈時則訓仲夏注朝野僉載百舌春轉夏止唯食蚯蚓正月蝀開蚓出而來十月蚓藏而往蒼舒曰右按吕氏春秋反舌有声佞人在仄十朋曰反舌鳥能反復其舌隨百鳥之鳴白鳬行君不見黃鵠高於五尺童化爲白鳬似洙曰一作象老翁故畦遺穗巳蕩盡天寒歳洙曰一作日暮波濤中洙曰此杜公自喻也鱗介腥膻素不食終日忍飢西復東魯門鶢鶋亦蹭蹬聞道如今猶避風洙曰見八哀詩鄭䖍詩注師曰黄鵠髙於五尺童追思少年時也化爲白鳬似老翁傷衰暮也故畦遺穗巳蕩盡傷家郷爲冦焚蕩也波濤以喻患難鱗介腥膻素不食言巳不食不義之禄也鶢鶋海鳥止於魯東門爲避風也喻甫亂依䕫州歸鴈二首萬里衡陽鴈今年又北歸洙曰應德璉詩朝鴈鳴雲中音響一何哀問子遊何郷戢翼正徘徊言我塞門來將就衡陽棲往春翔北土今冬客南淮雙雙瞻客上一一背人飛雲裏相呼疾沙邊自宿稀繫書無浪語洙曰見雖無南過鴈注蘇曰孔琛慿鴈繫書真浪語耳其迷過於刻劔守株者愁寂故山薇再吟欲雪違胡地洙曰謝靈運詩季秋邊朔苦旅鴈違霜雪又嗷嗷雲中鴈鳴舉自委羽求凉弱水湄違寒長沙渚先花别楚雲洙曰月令鴈北郷管子曰鴈秋北春南言其避寒也楚南也故曰先花别楚雲却過清渭影高起洞庭羣塞北春隂暮江南日色曛洙曰謝靈運朝忌曛日馳又朝游竆曛黒傷弓流落羽洙曰史盈引虛弓而鴈落人問之曰此鴈傷弓也行斷不堪聞洙曰鮑明遠詩傷禽惡弦驚倦客惡離声蘇曰嚴僅囚於土蔡自嘆曰縲絏憂覊不忍聞㫁行旅鴈傖然乆之獄吏惻然歸鴈聞道今春鴈南歸自廣州見花辭漲海趙曰漲海海名也避雪到羅浮是物關兵氣何時免客愁年年霜露隔不過五湖秋趙曰五湖霜雪之多鴈之不冝故隔而秋不過也孤鴈彦輔曰一云後飛鴈公值䘮亂覊旅南土而見於詩者志甞在於郷井故託意於孤鴈也末章譏不知我而譊譊者孤鴈不飲啄飛鳴聲念羣洙曰一作声声飛念羣誰憐一片影相失萬重雲師曰鮑當孤鴈詩云更無声接緒空有影相隨孤則孤矣豈若子美有不飲啄念羣之語孤之中乃有不孤之念而誰憐一片影相失万重雲又有不尽之意乎望盡似猶見哀多如更聞野鵶無意緒鳴噪自紛紛歸鴈春洙曰一作東來萬里客亂定幾年歸腸斷江城鴈髙髙向洙曰一作正北飛師曰甫客居万里外覩鴈北飛傷巳未有歸期曽鴈之不若也官池春鴈二首自古稻粱多不足至今鸂䳵亂爲羣且休悵望看春水更恐歸飛隔暮雲師曰鴈有序喻兄弟冦亂諸弟離散有阻隔故云歸飛隔暮雲青春欲盡急還郷紫塞寜論尚有霜洙曰蕪城賦北走紫塞鴈門謝靈運詩季秋邊朔苦旅鴈違霜雪翅在雲天終不遠力微矰繳絶須防夢符曰右按文選班固兩都賦撫鴻罿御矰繳師曰矰繳言以繩繫矢而射之舟前小鵝兒洙曰漢州城西北角官池作鵝兒黄似酒對酒愛新鵝引頸嗔船逼無行亂眼多翅開遭宿雨力小困滄波客散曽城暮狐狸奈若何得房公池鵝房相西亭鵝一羣眠沙泛浦白於雲鳯凰池上應迴首洙曰見鳯沼接亨衢注趙曰公以自㒷也荀勗罷中書令爲尚書人賀之乃曰奪我鳯凰池何賀我耶爲報籠隨王右軍洙曰見鵝費羲之墨注師曰房琯相肅宗以兵敗陳陶責爲房州刺史今漢州城西池乃琯所鑿王羲之性爱鵝道士常以鵝易其字鸂䳵彦輔曰臨海異物志鸂鶆水鳥毛有五色食短狐其在溪中無毒氣故使籠寛織須知動損毛看雲莫悵望失水任呼號六翮曽經剪夢符曰右按韓詩处傳曰鴻舉千里特六翮耳背上之毛腹下之毳益一把飛不爲加髙損一握飛不爲加下孤飛卒未高且無鷹隼慮留滞莫辭澇洙曰宋謝惠連鸂䳵摧羽翮翩翻又云宛覉畜於籠樊花鴨花鴨無泥滓堦前洙曰一作中庭每緩行羽毛知獨立黒白太分明洙曰諸葛謂張温其人於淸濁太明善惡太分不覺羣心妬休牽衆眼驚稻粱霑洙曰一作知汝在作意莫先鳴鷗江甫寒鷗戲無它亦自饒却思翻玉羽隨意㸃春苗雪暗還須落洙曰一作浴風生一任飄趙曰鷗性耐寒南越志曰常以三月風至乃還洲嶼幾羣滄海上淸影日蕭蕭獸古詩八首律詩七首遣興二首同作五首三首見懷古門夭用莫如龍洙曰漢食貨志天用莫如龍地用莫如馬人用莫如龜有時繫扶桑洙曰淮南子曰日出於暘谷浴於咸池拂於扶桑是謂晨明經于隅泉是謂髙舂頓于連石是謂下舂爰止羲和爰息六螭是謂懸車薄於虞泉是謂黄昏注扶桑東方之野六螭即六龍也頓轡海徒涌洙曰郭璞六龍安可頓運流有代謝蘇曰李膺六鼇頓轡滄海怒湧魚鱉漂蕩神人身更長蘇曰元狩中海岸有神人身巨而長持戟行於淡煙中性命苟不存英雄徒自强蘇曰樊又中原巳有眞主此外英雄徒自爭強呑聲勿復道洙曰王育往事吞聲拊膺不復道真宰意茫茫洙曰老子有眞宰足以制萬物趙曰鮑照詩吞聲躑躅不敢言莊子若有眞宰存焉而不得其朕也地用莫如馬無良復誰記趙曰易曰牝馬地類行地無疆故云地用良者良馬也苟無良馬何以記取之乎此日千里鳴追風可君意君看渥洼種洙曰渥洼見前注趙曰追風秦始皇七馬之一名渥洼種見漢武帝元鼎四年有神馬岀於渥洼之中態與駑駘異蘇曰毛邵見衛玠曰是兒乃渥洼種其骨白與駑駘不羣風神自異不雜蹄齧間逍遥有能事洙曰荘子馬蹄篇沙苑行君不見左輔白沙白如水繚以周牆百餘里鄭曰繚力鳥切洙曰前漢京兆尹左馮翊右扶風謂之三輔潘岳關中記曰三輔舊治長安城中長吏各在其縣治民光武東都之後扶風出治槐里馮翊岀治髙陵班固西都賦西郊有上囿禁苑繚以周牆四百餘里其中乃有大宛之馬百官公卿表注馮輔也翊左也三輔故事曰上林連綿四百餘里張平子西京賦繚垣綿聮四百餘里矣龍媒昔是渥洼生汗血今稱獻於此洙曰前漢禮樂志天馬騋龍之媒元狩三年馬生渥洼水中作天馬歌本紀不載惟元鼎四年秋馬生渥洼水中作寳鼎天馬之歌注李斐曰南陽新野有暴利長當武帝時遭刑屯田燉煌界數於此水旁見羣野馬中有竒者與凡馬異來飲此水利長先作土人持勒靽於水後馬玩習乆之代土人持靽収得其馬獻之欲神異此馬云從水中出蘇林曰洼音窪曲之窪師古曰渥音握洼音於佳反西域傳宛别邑七十餘城多善馬馬汗血言其先天馬子也天馬歌曰霑赤汗沬流赭神異經大宛馬蹄如汗腕可握日行千里至日中汗血乗者當以綿絮纏頭苑中騋牝三千匹洙曰定之方中騋牝三千毛氏馬七尺曰騋騋馬牝馬也西域傳張騫爲漢武言宛多善馬天子遣貳師将軍李廣利將兵前後十餘萬人伐宛連四年宛斬其王母寡首獻馬三千四唐貞觀初僅有牧牝三千匹從赤岸澤徙之隴右十五年始令太僕卿張萬歲勾當羣牧麟徳間至七十萬六千匹風俗通曰馬一匹俗說相馬及君子與人相匹或曰馬夜行目明照前四丈故曰一匹或曰度馬縱横適得一匹或說馬死賣得一匹帛或云春秋左氏說諸侯相贈乗馬束帛帛爲疋與馬之相匹耳韓詩外傳呉門馬如一疋練豐草青青寒不死洙曰湛湛露斯在彼豐草古詩青青河畔草漢童謡千里草何靑青食之豪健西域無鄭曰食音嗣洙曰西域大宛國馬嗜苜蓿周王褒謝馬啓邊城無草趙曰寒時草當死而沙苑之地冝草雖寒而不死以之食馬則豪徤雖西域出馬之地亦無此豪健也舊注非每歳攻駒冠邊鄙洙曰攻一作牧周禮夏官庾人掌十有二閑之政教以阜馬佚持教駣攻駒注攻駒乗其蹄齧者閑之又校人春執駒鄭司農云執駒無令近母猶攻駒也二歳曰駒三歳曰駣玄謂執猶拘也春通滛之時駒弱血氣未定爲其乗匹傷之也月令仲夏頒馬政注教駣攻駒之類也王有虎臣司苑門入門天廐皆雲屯洙曰矯矯虎臣西都賦披飛廉入苑門西域傳蒲梢龍文魚目汗血之馬盈於黄門漢有閑駒橐泉駒駼丞華五監各有長丞文又有未央承華駒駼龍馬輅軨大廐六廐皆有令漢苑三十六所在邊劉表傳雲屯冀馬虞子陽雲屯七萃士陸機胡馬如雲屯驌驦一骨獨當御鄭曰上息逐下色莊切洙曰左傳定三年唐成公如楚有兩驌驦馬子常欲之不與三年止之唐人竊馬而獻子常子常歸唐侯馬融曰驌驦鳥也馬似之選張景陽七命云驂唐公之驌驦春秋二時歸至尊洙曰魯莊公新作延廐凡馬日中而出日中而入注中分也春分出之秋分内之趙曰虎臣所掌之馬雖多而其中唯驌驦一種之骨充御故一年之中春秋兩次進之舊注引周禮日中而出日中而入注春分出之秋分入之非是至尊内外馬盈億伏櫪在埛空大存洙曰開元初牧馬二十四萬匹十三年加至四十五萬匹魏武老驥伏櫪志在千里詩魯頌䮐䮐牡馬在埛之野趙曰言櫪中埛外空大存之而不如驌驦之駿異也逸羣絶足信殊傑洙曰顔延年賦伊逸倫之妙足又別軰越羣蜀志關羽傳諸葛謂羽曰馬超未及髯之絶倫逸羣也魏文帝與孫權馬書曰此馬善中國雖饒馬其如此絶足亦少曹毗馳馬射賊何逸羣之竒駿倜儻權竒難具論鄭曰上他下他朗反不覊也洙曰禮樂志俶儻精權竒顔延年賦雄志倜儻精權竒纍纍塠阜藏奔突鄭曰塠都回切往往坡陁縱超越洙曰列仙傳蘇躭騎鹿遇險絶處能超越語人曰龍也謝靈運詩虚丹有超越趙曰言沙苑之地其高者塠阜則馬之奔突可藏其稍峻處坡陁則馬能超越以美馬之適性且材健也文選凌邁超越角壯翻同麋鹿遊洙曰顔延年賦分馳逈塲角壯永埒韓子曰如耳說衛嗣君君悅之左右曰公何爲不相也公曰夫馬似鹿者有千金百金之馬而無一金之鹿何也馬爲人用而鹿不爲人用今如子雖辨智亦不爲寡人用吾是以不相也梁肩吾語以鹿將含笑孟子曰與鹿豕遊伍被傳見麋鹿遊姑蘇臺浮深簸蕩黿鼉窟洙曰龐公傳栖黿鼉穴於深淵之下師曰此篇甫寓意於禄山而爲之若曰唐家諸將爲不少玄宗皆以凡材視之獨以兵權委之禄山甚見寵貴故云驌驦一骨獨見御終使禄山難制奔突超越一旦反於范陽河北爲之震蕩豈非簸蕩黿鼉窟乎泉出巨魚長比人丹砂作尾黃金鱗師曰甫旣以馬比禄山又以魚北史思明蓋思明乃禄山将相繼而叛故甫託意焉豈知異物同精氣雖未成龍亦有神洙曰夏官馬質禁原蠶者注原再也天文辰爲馬蠶書蠶爲龍精月直大火則俗其種是蠶與馬同氣物莫能兩大禁再蠶者爲傷馬歟顔延年賦禀靈月駟祖雲螭也趙曰龍或魚所化或馬所爲故異物同精氣也岀易精氣爲物舊注引屈原蠶事非是瘦馬行東郊瘦馬使我傷骨骼洙曰一作骸鄭曰各額切禽獸之骨硉兀如堵墻洙曰郭璞江賦巨石硉矻以前却禮觀者如堵墻鄭曰硉郎兀切危石也沈曰骨髙皃絆之欲動轉欹側此豈有意仍騰驤洙曰東京賦六玄蚪之奕奕齊騰驤之沛艾西京賦仍奮翅而騰驤細看六印帶官字洙曰唐令諸掌牧馬以小官字印印右膊以年辰印印右髀以監名依左右廂印印尾側至二歲起春量強弱漸以飛字印左廂髀膊細馬俱以龍形印印項左官馬賜人者以賜字印配諸軍及充傳送驛者以出字印並印右頰衆道三軍遺路傍皮乾剥落雜泥滓鄭曰乾居寒切滓阻史切洙曰雜卦剥爛也物熟則剥落也毛暗蕭條連雪霜去歳奔波逐餘寇驊騮不慣不得将士卒多騎内廐馬惆悵恐是病乗黃洙曰乗黄署後漢太僕有未央廐令魏改爲乗黃廐乗黄古之神馬因以爲名乗黃亦名飛黃背有角日行萬里淮南子云天下有道飛黃伏皁一云神黄獸名龍翼馬身黄帝乗而登仙當時歷塊誤一蹶鄭曰音厥委弃非汝能周防蒭曰王褒聖主得賢臣頌過都越國蹶如歷塊見人慘澹若哀訴失主錯莫無晶光天寒逺放鴈爲絆洙曰一作侣日暮不收烏啄瘡洙曰不一作未收一作衣誰家且養願終惠洙曰顔延年頳白馬賦願終惠餋䕃本枝兮更試明年春草長師曰按唐史房琯有幸相器其才亦長於戰時帝命琯将兵與賊戰陳濤斜琯儒者不知兵用春秋車戰法爲賊所敗帝怒斥琯爲邠州刺史夫人之材各有所長琯長於輔今用違所長是以兵敗奈何一跌不復故唐史爲之歎惜甫此詩寓意於琯之見弃而朝廷寡恩莫之終惠甫欲再試用之以盡其所長斯可矣故未章有誰家且餋願終惠更試明年春草長之句騘馬行彦輔曰太常梁卿勑賜馬也李鄧公爱而有之命甫製詩鄧公馬癖人共知洙曰晉杜預耽思經籍爲春秋傳解時王濟解相馬又甚爱之而和嶠頗聚斂預常稱濟有馬癖嶠有錢癖武帝聞之謂預曰卿有何癖曰臣有左傳癖又王済傳字武子性豪侈時洛京地甚貴済買地爲埓編錢满之時人謂爲金埒済善觧馬性甞乗一馬著連軋鄣泥前有水終不肯渡済云此必是惜鄣泥使人解去便渡故杜預謂済有馬癖也趙曰馬乃梁卿受賜於君不可以予人鄧公爱而取之非是故公詩以鄧公馬癖譏之也初得花騘大宛種鄭曰宛於袁切洙曰西域傳大宛囯多善馬嶠山上有馬不可得因取五色牝馬置其下与集生駒號天馬子夙昔傳聞思一見希声曰南史䔥摩訶千聞不如一見牽來左右神皆竦雄姿逸態何崷崪鄭曰上自秋下昨没切洙曰顔延年賦弭雄姿以奉引西都賦岩峻崷崪傅玄鷹賦雄姿邈世逸氣橫生顧影驕嘶自矜寵鄭曰嘶先斉切趙曰在人有顧影自憐者矣在馬亦冝然故使自矜寵也隅目靑熒夾鏡懸洙曰顔延年賦徒觀其附筋樹骨垂梢植髪双瞳夾鏡兩權恊月又睨影髙鳴將超中折西都賦琳珉靑熒趙曰張平子西京賦猛毅髤髵隅目高匡注云隔目謂目有角也肉騣凶鬯匕碨礧連錢動鄭曰碨烏罪切礧力罪切洙曰尔雅青驎鄰驒今連錢騘也梁元帝紫騮馬詩金絡飾連錢蘇曰余在𡵨下見秦州進一馬騣凶鬯匕如生項下重胡側立倒毛生肉端蕃人云此肉騣凶鬯匕也乃知鄧公騘馬行肉駿碨礧連錢動當作肉騣凶鬯匕朝來乆試華軒下未覺千金满髙價洙曰韓子馬似鹿者直千金又漢使壯士持千金請宛善馬潘岳珥筆華軒王景玄長想馮華軒江淹許史乗華軒赤汗微生白雪毛洙曰漢書霑赤汗東觀漢記曰漢武帝欹天馬霑赤汗今親見其然血從前髆上小孔中出銀鞍却覆香羅帕洙曰陳相孫登詩落淚洒銀鞍徐敬業汗馬羅銀鞍周弘正詩銀鞍耀紫韁卿家舊賜公能取洙曰一作有之天廐眞龍此其亞洙曰周礼凡馬八尺以上爲龍礼記孟春之月天子乗蒼龍趙曰天廐眞龍乃天子所御之馬也非天子所賜不得而有之以卿家舊物而能取盖非以勢迫之則以利誘之百計中之矣晝洗須騰涇渭深朝趨可刷幽并夜洙曰顔延年賦簡偉塞門献狀絳闕旦刷幽燕晝􅐕荊楚吾聞良驥老始成此馬數年人更驚豈有四蹄疾於鳥洙曰晉曹毗馬射逸羽不能企其足顔延年云天馬狀水軼驚鳬七命曰驚紅陽之飛燕驂唐公之驌驦馬融曰驌驦烏也不與八駿俱先鳴洙曰穆天子傳曰天子之八駿赤驥盗驪白義渠黄華聊緑耳時俗造次那得致雲霧晦冥方降霜洙曰春秋考異記曰地生月精爲馬月数十二故馬十二月而生修可曰有雲雨而降精此所以爲神異瑞應啚曰龍馬者河水之精近聞下詔喧都邑肯使騏驎地上行彦輔曰肯使一作知有趙曰将下詔取之爲天子之御矣希声曰未章帰功于鄧公以此馬喻鄧公非塵世所能容只恐天詔将下騰踏帝庭故云云髙都護騘馬行師曰髙適爲哥舒翰掌書記甫甞送以詩云十年出幕府自可持旌麾至是爲安西都獲其言豈不有徴安西都護胡青騘洙曰前漢鄭吉傳吉爲衛司馬使護鄯善以西南道吉旣破車師降日逐威震西域遂并護車師以西北道故號都護都護之置自吉始焉師古曰並護南北二道故謂之都都猶大也唐安西郡東至烏蓍鎮去交河郡七万里西隣吐蕃西連䟽勒去葱嶺七百里北拒突厥貞觀中𥘉置西都護府於西州顯慶中移於亀兹城聲價歘然來向東洙曰顔延年赭白馬賦声價隆振又曰歘聳躍以鴻驚漢礼楽志太初四年亦穴馬欹曰天馬來歴无草徑千里循東道注馬從西而來東也趙曰歘音許勿反有所以吹起皃言馬致用之地在西而傳譽於東若吹而來也此馬臨陣乆無敵與人一心成大功趙曰臨陣成功指言高都護所御也功成惠養隨所致洙曰顔延年賦願終惠養隂本枝弓飄飄洙曰一作風逺自流沙至劉曰天馬歌天馬徠從西極渉流沙九夷服趙曰其至也逺自流沙眞天馬之種也雄姿未受伏櫪恩洙曰顔延年賦弭雄姿以奉引婉柔姿而侍御魏武樂府曰老驥㐲櫪志在千里烈士暮年壯心不巳梁元帝謝馬啓矧伊伏櫪弥結懷恩傅玄鷹賦雄姿邈代逸氣横生猛氣猶思戰塲利洙曰傅玄鷹賦六離猛氣又隋魏彦深賦資五方之猛氣趙曰言雖之皁棧而非馬之本心故思奮於戦塲以爲利目師曰適年五十爲書記十年出爲都護甫常送以詩云男兒功名遂亦在老大時則知適之罷都護年巳老矣猶欲爲囯家立功故甫有是句也腕促蹄髙如踣鐡趙曰腕欲促蹄欲髙丈穩如踣鐡皆馬之竒也交河幾蹴曾冰裂洙曰唐安西去交河郡七百里顔延年賦經玄蹄而雹散歷素支而氷裂神異經蹄之如汗腕可握趙曰曽氷是氷名東方朔神異記曰北方有曽氷万里厚百丈今公言交河西邊之地有曽積之氷馬幾度蹴踏之而破裂舊引顔賦經玄蹄而雹散歷素支而氷裂非是蓋賦謂騎射耳玄蹄素皮皆射帖名而雹散氷裂皆射帖之声与馬踏氷裂之義豈相干乎五花散作雲滿身孝祥曰西域傳大宛国多善馬嶠山上有馬不可得因取五色牝馬置其下与集生騎号天馬子趙曰此言馬之貴如曰个个五花文是也萬里方看汗流血洙曰天馬歌躰容与迣万里又曰霑赤汗沫流赭顔延年賦曰膺門沫赭汗溝走血應劭曰大宛馬汗血霑濡也戰国䇿白汗交流白馬篇剱騎何翩翩長安王陵間時可曰周穆王傳驊騮騄耳日馳三万里趙曰汗血之姿非万里无以見長安壯兒不敢騎趙曰以善髙都護之獨能騎也走過掣電傾城知鄭曰掣尺列切洙曰沈休文詩曰長安輕薄兒晉傅玄詩童女掣電策童兒挽雷車李延年詩一顧傾人城趙曰言馬之行如電㪯囯皆知舊引傅玄詩童女掣電䇿童兒挽雷車非其義來曰馬善行者追風逐電走過如掣電蓋言疾也不敢騎畏其太疾青絲絡頭爲君老何由却出横門道鄭曰横音光洙曰梁簡文帝紫騮馬詩青絲縣玉鐙又云宛轉青絲鞚莊子穿牛鼻絡馬首馬曰方粛宗中興安史之難巳平吐蕃不敢入宼故此馬老於絡頭无縁再出横門甫厭乱願治之心可見横音光李鄠縣丈人胡馬行鄭曰鄠扶古切扶風縣名丈人駿馬名胡騮前年避胡過金牛洙曰金牛地名余曰昔秦欲伐蜀无路通遣人告蜀王曰秦有金牛其糞成金使蜀迎与之蜀王命五丁力士開山取金牛路纔通秦伐蜀取其囯因号所開之山曰金牛迴鞭却走見天子朝飮漢水洙曰漢水漢江水也在楚地方城暮靈州洙曰靈州靈武郡唐理廻樂縣秦始皇属北地郡趙曰粛宗即位靈武故迴鞭見天子則自漢水而來靈州也自矜胡騮竒絶代乗出千人萬人愛一聞說盡急難材趙曰急難材如劉備之的驢一躍三丈過檀溪以免劉表之追劉牢之馬跳五丈澗以脫慕容垂之逼也轉益愁向駑駘輩頭上銳耳批秋竹脚下高蹄削寒玉梅曰黄伯仁龍馬頌曰耳如剡筩目象明星始知神龍别有種不比俗馬空多肉洛陽大道時再淸趙曰巳收復東京矣累日喜得俱東行鳳臆龍鬐洙曰一作麟鬐鄭曰渠伊切馬鬛也沈曰伯樂相馬經云鳯臆龍鬐言馬胸如鳯馬鬛如龍真良馬也未易識側身注目長風生師曰言馬有精神也良馬不怕寒踏雪嘶風而力愈健惜别行送劉僕射判官新添聞道南行市駿馬不限疋數軍中須襄陽幕府天下異主將儉省憂艱虞祗収壯健勝鐡甲豈因格闘求龍駒而今西北自反胡騏驎蕩盡一疋無龍媒真種在帝都子孫未落西南隅向非戎事備征伐君肯辛苦越江湖江湖凡馬多顦顇衣冠徃徃乗蹇驢梁公富貴於身踈號令明白人安居俸錢時散七子盡府庫不爲驕豪虛以兹報主寸心赤氣却西戎迴北狄羅綱羣馬藉馬多氣用驅除出金帛劉矦奉使光推擇滔滔才略滄溟窄杜陵老翁秋繫船扶病相識長沙驛强梳白髪提胡盧手兼菊花路傍摘九州兵革浩茫茫三歎聚散臨重陽當杯對客忍涕淚君不覺老夫神内傷秦州雜詩一首同作二十首二首見寺觀門餘見都邑門南使冝天馬由來萬匹强洙曰阮藉詩天馬出西北由來從東道趙曰此篇專賦天馬也岀漢書初天子發易卜之曰神馬當從西北來得烏孫馬好名天馬浮雲連陣没秋草徧洙曰一作满山長聞說眞龍種洙曰天馬徠龍種也仍殘洙曰二云空餘老驌驦洙曰見驌驦一骨獨當御注趙曰左傳唐成公如楚有兩驌驦唐人語以余爲殘盖言所余驌驦遺而不用於戰故哀鳴思戰闘也豈非公自况耶哀鳴思戰鬪逈立向蒼蒼玉腕騮洙曰江陵節度衛公馬也聞說荆南馬尚書玉腕騮頓驂飄赤汗洙曰漢歌天馬下霑赤汗跼蹐顧長楸洙曰詩正月注跼曲也蹐累足也曹子建名都篇走馬長楸間胡虜三年入乾坤一戰收趙曰禄山慶緒之亂三年之際遂仍收復斯爲一戰收矣衛公之馬豈正於此時得用乎舉鞭如有問欲伴習池遊洙曰襄陽記峴山南習郁大魚池山季倫每臨此池飲輒大醉而歸常曰此我髙陽池也城中小兒歌之曰山公去何逺來至髙陽也日夕倒載歸酩酊無所知房兵曹胡馬詩胡馬大宛名鄭曰宛於爰切洙曰漢伐大宛獲汗血馬作西極天馬之歌鋒稜瘦骨成張耒曰馬以神氣清勁爲佳不在多肉故云云竹批雙耳峻鄭曰批篇迷切趙曰後魏賈思勰載相馬經耳欲銳而小如削筒風入四蹄輕所向無空闊秦觀曰空闊謂遠也眞堪託死生洙曰如髙歡之的盧是可託死生鄭之小駟則異於此蘇曰齊繆叔見張儀論議之乆回語子姪曰張儀忼慨真君子人雖死生堪託非有中道之意也趙曰如劉寂之爲慕容垂所逼䇿馬跳五丈澗而脫也驍騰有如此洙曰顔延年赭白馬賦藝品驍驣萬里可横行蘇曰劉章曰使我得三尺快刃立止靜兩川兵甲萬里亦可横行病馬乗爾亦巳乆天寒關塞深塵中老盡力歲晚病傷心趙曰此暗使田子方事田子方出野見病馬問御者對曰此故公家畜也罷而不能爲用故岀放之曰少盡其力老弃其身仁者不爲也命束帛贖之毛骨豈殊衆馴良猶至今物微意不淺感動一沉吟師曰此詩託意人君始用其才終乎捐弃而失之寡恩也麂鄭曰居履切永與淸溪别蘇曰夷陵風俗記曰清溪山多麂麝䝉將玉饌俱洙曰爾雅曰麂大􅍪旄毛狗尾梁王筠四言詩玉饌駢羅秦曰左太冲呉都賦競其區宇則并疆兼巷矜其宴居則珠服玉饌也無才逐仙隱蘇曰九華隱翁不知何許人常驅一白麂往來人莫識其姓名年紀漢武多召不起後與麂同隱山不出趙曰仙家甞乗鹿車也不敢恨庖厨亂世輕全物微聲及禍樞蘇曰王元行求安路聞有物鳴林中問樵者曰何聲曰鹿也鳴即死少頃果爲獵人大獲元歎曰爲爾之微聲巳彰禍機不可免趙曰言亂世輕全生之物才聞鹿鳴之微聲則禍隨之矣衣冠兼盗賊饕餮用斯須洙曰文十八年傳縉雲氏有不才子天下之民以比三凶謂之饕餮注貪財爲饕貪食爲餮趙曰言衣冠之人行如盗賊唯知饕餮而巳故使人多害生物以充庖止在所須之間焉鄭曰饕吐刀餮他結切貪飲食也猿裊裊啼虚壁蕭蕭掛冷枝艱難人不免隱見爾如知趙曰人生不免艱難矣然不知隱見之機若猿則知之也蓋猿之便捷甞隱茂林之中慣習元從衆趙曰言便捷之慣衆猿皆如此全生或用竒趙曰得以全生如搏矢避弓之事前林騰每及父子莫相離從人覔小胡孫許寄人說南州路山猨樹樹懸舉家聞若欬洙曰又作挽一云共愛爲寄小如拳預哂愁胡靣初調見馬鞭許求聦惠者童稚捧應癲師曰小如拳言胡孫至小者爲竒也𥘉謂見馬鞭言始調狎之則用笞撻如馬之見鞭而後行也虫律詩三首促織促織甚微細洙曰促織秋䖝也哀音何動人草根吟不穩牀下夜相親趙曰人多置牀下也乆客得無淚蘇曰王粲乆客避地對比景物豈得無淚故妻難及晨洙曰乆客故妻皆覊苦易感者悲絲洙曰一作絃與急管感激異天眞洙曰絲管之感人不若虫声之自然也師曰促織秋虫也常夜鳴其哀切故動人此虫常吟於草根夜入人床下使乆客故妻皆覊苦易傷感者也雖有悲絲急管不若此虫声也螢火幸因腐草出洙曰月令腐草化爲螢敢近太陽飛洙曰太陽之光固非螢火之可近喻小有才而侵侮大徳者未足臨書卷時能點客衣隨風隔幔小帶雨傍林微十月淸霜重飄零何處歸師曰螢出於腐草喻小人起於微賤而侵陵大德之士一旦時清必蒙擯斥故云飄零何處歸見螢火巫山秋夜螢火飛簾踈巧入坐人衣趙曰言入於坐人之衣也忽驚屋裏琴書冷復亂簷前星宿稀却繞井欄添箇箇偶經花蘂弄輝輝滄江白髪愁看汝來歳如今歸未歸魚律詩二首黄魚日見巴東峽洙曰荆州記巴東三峽巫峽長黄魚出浪新脂膏兼飼犬洙曰韓愈叉魚詩飼犬驗今朝蒼舒曰右按鹽鐵論江陵之人以魚飼犬逸曰王充論衡云彭蠡之濵以魚飼犬長大不容身筒筩相㳂乆洙曰筒筩捕魚器也趙曰筒筩散布水中以繫餌觀其沒以爲驗而隨其用以取之也風雷肯爲神泥沙卷涎沫回首怪龍鱗白小白小羣分命洙曰物以羣分天然二寸魚細微霑水族風俗當園𬞞入肆銀花亂傾箱雪片虚生成猶拾卵盡取義何如洙曰西京賦獲胎拾卵蚳蝝盡取趙曰㣲細所當有也分門集註杜工部詩卷第二十三
