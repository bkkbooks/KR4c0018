front:
  text: 分門集注杜工部詩卷之二十一
  hash: sha256:21ff57b88f1576c2a8d4d1a2de291eee2de881248e22493ef3c81989c0d1536f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_021-1a}
body:
  text: 送别下律詩八十首奉送郭中丞兼太僕卿充隴右節度使三十韻鮑曰郭英乂也至德三載加隴右節度使傳與詩合詔發西山將洙曰辛慶忌贊曰秦漢巳來山東出相山西出將秋屯隴右兵洙曰屯一作營唐書郭英乂傳英乂知運之季子至德𥘉肅宗興師朔野英乂以將門子特見任用遷隴右節度使趙曰英乂先為秦州都督乃加隴右節度使故公詩云即非山西之出將事鄭曰屯越渾反聚也凄涼餘部曲趙曰秦州部曲也燀赫舊家聲洙曰燀一作烜齒善切謂知運先朝亦為隴右節度使也宋鮑昭東武吟將軍既即丗部曲亦空存漢光武紀注大將軍營有五部部有三校尉部下有曲曲有軍候一人李廣行無部曲行軍司馬子長報任少卿書曰李陵既生降頽其家聲雕鶚乘時去洙曰見雕鶚在秋天注師曰言得時則駕也驊騮顧主鳴趙曰雕鶚驊騮所以美英乂也師曰言戀王室也忠臣之志不忘於君艱難須上策容易即前程鄭曰易以䜴切洙曰策策略也容易猶無難也言其功名策略足以自取冨貴無難斜日當軒蓋髙洙曰一作歸風卷斾旌修可曰蓋用夏侯湛禊賦微雲承軒清風捲斾也師曰髙風八月也松悲天水冷洙曰天水郡漢武元鼎三年置秦州地記云郡前湖水冬夏無增因以名焉沙亂雪山淸洙曰後漢明帝紀祁連山名也即天山也一名雪小今名折羅漢山在伊州北沈曰其山至髙冬夏有雪故亦曰雪山和虜猶懷惠洙曰和知好也惠恩惠也防邊不敢驚趙曰指言吐蕃也至德二載使使來請賦且修好後又請和古來於異域鎮靜示專征洙曰專征請受斧鉞之賜得專征討趙曰言待之以靜不時撓之示之以有必征其侵叛之理也燕葪奔封豕洙曰葪縣燕之所都前志云秦舉兵滅燕葪左傳昭王在隨申句胥如秦乞師曰吳為封豕長蛇以荐食上國言吳貪害如蛇豕封大也豕之性善突故取喻祿山周秦觸駭鯨洙曰按新史祿山之亂英乂授蔡州都督隴右棌訪使賊將髙嵩擁兵入汧隴英乂偽勞之既而伏兵發盡虜其衆駭鯨言若鯨魚之駭難禦也陳琳擊云若駭鯨觸細網言易決也趙曰天寶十四載祿山反幽州陷河北十二月陷東京明年陷京師此所謂奔突幽葪而觸冒周秦也中原何慘黷餘孽尚縱橫洙曰文選上慘下黷注慘不登貌也哀江南賦茫茫慘黷殘孽餘寇也餘作遺趙曰祿山既弒慶緒為寇此所謂尚縱橫也箭入昭陽殿洙曰箭檄書箭也趙曰言禍亂及於宫中也笳吟細柳營洙曰笳者胡人捲蘆葉吹之以作樂也故曰胡笳張博望入西域傳其法於西京李延年更造新聲二十八解以為武樂有出塞入塞柳楊等十曲細柳營周亞夫軍營也趙曰細柳周亞夫之營任長安笳哈細柳言胡人之笳乃在漢營也內人紅袖泣王子白衣行趙曰言是王子以避亂之故隱迹為白衣而行也非是天子行幸宸極妖星動洙曰虞翻别傳日仰瞻宸極劉越石表宸極失御趙曰妖星凡二十一見晉天之志園陵殺氣平洙曰陵一作林趙曰言殺氣與園陵平也空餘金碗出洙曰碗一作碗光武紀赤眉焚西京宫室發掘園陵注園謂山墳金枕出見早時金碗出人間注趙曰漢武事有持金碗賣於市無復繐帷輕時曰繐須鋭切洙曰魏武帝遺令云吾婕妤數人著於銅雀臺堂上施六尺床張繐帷謝玄暉詩繐惟飄井幹此言賊凌暴園陵也毀廟天飛雨焚宫火徹明洙曰項羽入咸陽殺秦降王子嬰燒其宫室火二月不滅蘇曰周盤龍焚紫翠宫綺羅經火徹明不滅罘罳朝共落鄭曰罘旁尤切罳新兹切朝陟遙切旦也棆桷夜同傾洙曰言賊焚毀宗廟及宫室漢書注師古曰罘罳謂連闕曲閣也以覆重列垣墉之處其形罘罳一曰屏也東觀元壽二年盜賊並起潘燒茂陵都邑火見未央宫蒼舒曰右按詩方斫是虔注椹謂之虔升景山棆林木取松柏易直者斫而遷之正於椹上以為桷也三月師逾整群胡勢就烹瘡痍親接戰勇決冠垂成鄭曰冠古玩切洙曰此言英乂躬冒矢石功冠垂成垂成猶欲成也趙曰此微言英乂之敗而激其再立功也是年二月李光弼敗安慶緒于太原而是時英乂戰于武功敗績故有瘡痍之譬且言其功垂成也妙譽期元宰趙曰美其可為相殊恩且列卿趙曰言其兼太僕卿也幾時回節鉞戮力掃攙搶鄭曰上初街下楚耕切洙曰成十三年傳戮力同心釋文云攙搶妖星也前漢天文志石氏見攙雲如生甘氏不出三月乃生天搶石氏見搶雲如馬甘氏不出三月乃生天攙謝宣逺子房詩鴻門銷薄蝕垓下隕攙搶蘇曰言與諸公戮力掃攙搶社稷一日重正我輩光前冠後圭竇三千士洙曰儒行儒有篳門圭竇注門旁窬穿牆為竇如圭僖二十四年秦伯送衛於晉三千人實紀綱之僕修可曰左傳襄十年王叔之宰曰篳門圭竇之人而皆陵其上杜預注云篳門柴門圭竇小戶穿壁為戶上鋭下方狀如圭焉禮記儒行之語義同雲梯七十城洙曰雲梯攻城具髙長上與雲齊可依雲而立所以攻敵之城中宋王令公輸作雲梯以攻宋墨子設守宋之備九攻而墨子九却之趙曰公輸狂作雲梯以攻宋公詩有云蒼芒城七十流落劒三千恥非齊説客鄭曰説輸芮切洙曰酈生嘗為説客馳使諸侯漢王使説齊王田廣廣罷歷下兵守與漢通和與生日縱酒淮隂侯乃夜謀度兵襲齊齊以酈生賣己遂烹之甘似魯諸生洙曰漢叔孫通傳臣願徴魯諸生與臣弟子共起朝儀趙曰公自言也蓋以謂圭竇之貧士尚有三千而下七十城亦有為雲梯之具者如我曽無説客之談時為諸生之事而巳蓋自責其無輔於戰也齊説客謂酈食其下齊七十城魯諸生出叔孫通傳通所願徴者也通籍微班忝洙曰此公自言得通朝籍也微班言位下也前漢元帝紀令從官給事宫司馬中者得為大父母父母兄弟通籍籍者為三尺竹牒記其年紀名字物色縣之宫門案省相應乃得入也謝玄暉詩既通金閨籍周行獨坐榮鄭曰行胡岡切洙曰詩置彼周行箋云周之列位也後漢宣秉拜御史中丞光武特詔御史中丞與司隸校尉尚書令會同並專席而坐故京師號曰三獨坐時英乂為中丞隨肩趨漏刻蘇曰漢宣帝置行刻漏賜十郡列卿短髮寄簮纓洙曰寄一作愧徑欲依劉表洙曰魏志王粲傳粲以西京擾亂皆不就辟乃之荆州依劉表還疑厭禰衡洙曰還疑一云能無後漢文苑傳禰衡字正平孔融愛衡材數稱述於曹操操欲見之而衡素相輕疾不肯往操懷忿而以其材名不欲殺之送與劉表表及荆士大夫先服其才名甚賔禮之後復侮慢表表恥不能容以江夏太守黃祖性急躁故送衡與之卒為祖所殺漸衰那此别忍淚獨含情蘇曰劉機含情忍淚夜起薊門廢邑狐狸語洙曰襄十四年傳南鄙之田狐狸所居豺狼所嗥空村虎豹爭洙曰空村言無居人虎豹爭盜賊縱橫故也人頻墜塗炭洙曰仲虺之詰有夏昏德民墜塗炭言民之危險若蹈泥墜火公豈忘精誠鄭曰忘無放切元帥調新律前軍厭舊京鮑曰謂廣平王將復京師也安邊仍扈從鄭曰才用切莫作後功名洙曰莫作一云無使時伐宗為元帥期於收復公勉郭令立功名無後衆人也趙曰時代宗以廣平王𥘉為元帥張子儀副之新律是師律之律舊京指言長安更云仍扈從則望長安收復而車駕復還也師曰前軍壓舊京言前軍巳收京而鎮壓之尚賴諸將安邊扈駕此勉郭公之辭奉送嚴公入朝十韻鼎湖瞻望逺洙曰見先帝弓劒逺注趙曰前漢郊祀志黃帝采首山銅鑄鼎於荆山下鼎既成龍有垂胡􅐖下迎後由因名其處曰鼎湖象闕憲章新洙曰陸佐公石闕銘以為象闕之制其來巳遠春秋設舊章之教經禮垂布憲之文四海猶多難中原憶舊臣與時安反側自昔有經綸感激張天步洙曰劉越石詩鄧生何感激千里來相求從容靜塞塵南圖回羽翮洙曰莊子大鵬九萬里而圖南趙曰言嚴公入朝如鵬之圖南也北極捧星辰漏鼓還思晝宫鶯罷囀春空留玉帳術趙曰唐藝文志有玉帳經一卷蓋兵書也愁殺錦城人趙曰人思戀之也閣道通丹地洙曰禁中謂之彤庭言丹地也張正見艷歌執戟趨丹地豐貂入建章江潭隱白蘋洙曰柳渾詩汀洲採白蘋趙曰公自言也草堂近百花潭故曰江潭爾雅曰萍之大者曰蘋也此生那老蜀不死會歸秦公若登台輔臨危莫愛身洙曰言當殺身以成仁趙曰所謂贈人以言也奉濟驛重送嚴公四韻逺送從此别靑山空復情幾時杯重把昨夜月同行列郡謳歌惜三朝出入榮洙曰三朝武仕明皇肅伐也江村獨歸處洙曰一作去寂寞養殘生奉送韋中丞之晉赴湖南寵渥徴黃漸洙曰前漢循吏傳黃霸為頴川太守戶口歲增治為天下第一徴守京兆尹權冝借寇頻洙曰見河內猶冝借寇殉注湖南安背水洙曰韓信破趙反背水陳峽內憶行春洙曰後漢鄭弘傳太守行春任彥升詩涿令行春返冠蓋溢川坻謝夷吾傳行春乘柴事趙曰言公離此而公有所懷恨也王室仍多故蒼生倚大臣蘇曰朝錯云天下蒼生全倚大臣安養鼎鼐調羹手不可容易錯動還將徐孺榻處處待髙人洙曰陳蕃為徐稚下榻留别賈嚴二閣老兩院輔闕洙曰得聞字嚴武賈至按新書公家寓鄜彌年囏窶詔許公自往視田園須暫往魯曰陶淵明歸去來田園將蕪胡不歸師曰甫家在鄜詔許公視之故云須暫往戎馬惜離群洙曰老子戎馬生於郊禮記一羣索居師曰惜離羣言惜别也去逺留詩别愁多任酒醺一秋常苦雨今日始無雲沈曰言雨歇也山路晴吹角那堪處處聞洙曰處處聞言所在有兵送賈閣老出汝州鮑曰按紀二年九節度師潰汝州刺史賈至奔干襄鄧而傳不書隱之也紀與詩合西掖梧桐樹空留一院隂洙曰喻賈之德猶足庇覆一院也趙曰賈至歷中書舍人而中書省在月華門西故曰西掖艱難歸故里去住損春心師曰言奔走之勞而減少年之心也宫殿靑門隔洙曰靑門長安東城門也邵平種瓜靑門外隔靑門謂賈出汝州雲山紫邏深洙曰邏塞也取巡羅之義趙曰王立之云九域圖汝州有紫邏山故云鄭曰邏郎佐切寰宇記汝州廢臨汝縣紫邏川以邑城南臨汝水兼以名為邑人生五馬貴洙曰見五馬有光輝注趙曰漢官儀太守五馬蓋天子六馬而諸侯五馬也莫受二毛侵彥輔曰潘嶽秋興賦豫生三十有二始見二毛班白也師曰昔王羲之出守永嘉夜别五馬後人皆援為太守故事人生五馬之貴亦在少年衰老不足貴也暮春江陵送馬大卿公恩命追赴闕下自古求忠孝名家信有之洙曰後漢韋彪議曰求忠臣必於孝子之門注孝經緯之文也晉卞壼拒蘇峻力疾戰死三子見父沒相隨赴賊同時見害徴士翟湯聞之歎曰臣死於君子死於父忠孝之道萃於一門吾賢冨才術此道未磷緇洙曰論語磨而不磷涅而不緇玉府標孤映洙曰北山移文髙霞孤映霜蹄去不疑趙曰使莊子馬蹄可以踐霜雪激揚音韻徹洙曰文選神氣激揚又音聲悽以僥揚也籍甚衆多推洙曰陸賈遊漢庭名聲藉甚注言狼籍甚梁彥升云客遊梁朝則聲華籍甚潘陸應同調洙曰謝靈運詩誰謂古今殊異代可同調晉陽秋曰潘陸之徒有文質而宗師不異趙曰潘則潘嶽陸則陸機孫吳亦異時洙曰孫武吳起趙曰言時異時而巳又相同也北宸徴事業南紀赴恩私洙曰詩滔滔江漢南國之紀卿月升金掌洙曰洪範卿士惟月注卿士各有所掌如月之有别上官儀詩班籍始燕歸金掌露𥘉晞趙曰卿月指馬大卿也升金掌譬近於顯要金掌者金錮仙人捧露盤之掌也王春度玉墀洙曰春秋之文王次春趙曰言馬大卿春時在天子之玉墀也薰風行應律洙曰詩南風之薰兮禮八風從律湛露即歌詩趙曰湛露天子燕諸侯之詩言方夏𥘉即有殊恩之命矣天意髙難問人情老易悲樽前江漢闊後會且深期季夏送鄉弟韶陪黃門從叔朝謁鄭曰從才用切令弟尚為蒼水使趙曰吳越春秋禹登衡嶽血白馬以祭夢見赤繡衣男子稱玄夷蒼水使者曰聞帝使文命于斯故求候之名家莫出杜陵人洙曰杜陵有南北杜最為名家比來相國兼安蜀洙曰杜鴻漸以相國入蜀平崔旰之亂尋表旰為節度使還朝歸赴朝廷巳入秦捨舟策馬論兵地趙曰以同行二人所以可論兵矣拖玉腰金報主身洙曰西征賦拖鳴玉以出入禁門腰金帶也鄭曰拖託何切曵也趙曰專言叔父黃金也莫度淸秋吟蟋蟀洙曰潘安為黃門作秋興賦云蟋蟀鳴乎軒屏早聞黃閣畫麒麟洙曰見扈聖登黃閣并今代麒麟閣注趙曰漢武帝盡功臣於麒麟閣上也師曰時崔旰成都作亂杜鴻漸以黃門侍郎領相職入蜀平其亂遂還朝故有相國安蜀歸朝入秦之語子美勉鴻漸莫空度時節淹留於蜀皂歸論功畫象于麒麟閣也送梓州李使君之任魯曰故陳拾遺射淇人也篇末有云籍甚黃丞相能名自潁川洙曰前漢循吏傳黃霸字次公宣帝下詔曰制御史其以賢良髙第楊州刺史霸為潁川太守咸稱神明治為天下第一前後今年郡中愈治聲名籍甚後為丞相近看除刺史洙曰前漢景帝紀注凡言除除故官就新官也還喜得吾賢五馬何時到洙曰古陌上桑羅敷行使君從南來五馬立踟蹰雙魚會早傳趙曰囑李使君早寄書也古樂府客從逺方來遺我雙鯉魚呼兒烹鯉魚中有尺素書師曰昔王羲之守永嘉庭列五馬此二句言使君幾時到任早寄書逹甫老思笻竹杖洙曰一云笻杖拄漢張騫在大夏時見笻竹杖云賈人市之於身毒國冬要錦衾眠洙曰漢朱寵為太尉家貧布佊帝聞之賜錦𬒳趙曰公從李使君要此二物也笻竹蜀中所出蜀都賦天笻竹緣嶺注云中實而髙節可以作杖錦衾雖是錦𬒳而字出詩錦衾爛兮蜀中有錦故公及之不作臨岐恨洙曰陳隂鏗送始興王詩背飛傷客念臨歧憫聖情唯聽舉最先洙曰京房舉最當遷注以課最𬒳舉火雲揮汗日洙曰潘安仁詩朝想慶雲興夕遲白日移揮汗辝中宇登城臨清池淮南子旱雲煙火生趙曰隋盧思道納涼詩火雲赫而四舉史記云臨溜揮汗如雨山驛醒心泉遇害陳公殞洙曰子昻後為縣令假簡收繫憂憤死獄中于今蜀道憐君行射洪縣為我一澘然洙曰射洪屬梓州鄭曰澘師姦切涕流貌送陵州路使君赴任王室比多難鄭曰比毗至切髙官皆武臣洙曰時方急於賞功故武臣在髙位蘇曰宋針近丗兵戈優優而髙爵厚祿皆武官髙牙大斾金紫煌煌駭人耳目我輩頭白作呤局官復何益哉幽燕通使者洙曰時安史之亂平而幽燕路通矣嶽牧用詞人國待賢良急君當拔擢新佩刀成氣象洙曰晉書吕虔為刺史有佩刀相者曰以三公可服虔乃贈别駕王洋曰苟非其人刀或為害卿有公輔之量故相與也行蓋出風塵趙曰時方吐蕃之亂而刺史之蓋出風塵以往也程曰早蓋行春指路使君也戰伐乾坤破洙曰所在殘敝也瘡痍府庫貧洙曰軍用匱乏急也鄭曰瘡𥘉莊反傷也下延知切衆寮冝潔白萬役但平均蘇曰元興曰今丗事若此諸公冝潔正廉自不可學日前貪叨又王子敬万民徭役冝利使平均自無怨謗趙曰四句以戒其為政可謂贈人以言矣霄漢瞻佳士蘇曰張景陽近數佳士致身在於霄漢之上可謂當丗表儀趙曰指路君其為太守自此而遷擢當在霄漢矣泥塗任此身趙曰公自言也秋天正搖落回首大江濵江亭王閬州筵餞蕭遂州洙曰一云閬州王使君江亭餞蕭遂州離亭非舊國洙曰莊子舊國舊都望之悵然春色是他鄉老畏歌聲斷洙曰一作短愁從舞曲長二天開洙曰一作悲寵餞洙曰後漢蘇章順帝時遷冀州刺史故人為清河太守章行郡按其姦贓乃請太守為設酒殽陳平生之好甚歡太守喜曰人皆有一天我獨有二天章曰今夕蘇孺文與故人飲私恩也明日冀州刺史案事公法也遂舉正其罪五馬爛生光洙曰古陌上桑羅敷行使君從南來五馬立踟蹰使君自有婦羅敷自有夫川路風煙接洙曰謝玄暉詩馳驛不可接何况隔兩鄉風煙有鳥路江漢無限梁趙曰閬州與􅨕州相接也俱冝下鳯凰洙曰黃霸為頴川太守是時鳯凰神爵數集郡國潁川師曰閬與遂皆屬蜀道故云川路風煙接昔蕭史王喬皆神仙人也蕭與秦女跨鳯而去喬亦飛乘雙鳬今云俱冝下鳯凰豈非皆不凡歟送鮮于萬州遷巴川趙曰鮮于名炅仲通之子也廣德中為尚書都官即自將相公卿無不相厚皆稱交友京兆先時傑趙曰京兆者炅父仲通天寶末為京兆尹弟叔明乾元中亦為之長安歌曰前尹赫赫具瞻允若後尹熙熙具瞻允斯琳琅照一門洙曰甫有贈鮮于京兆詩晉史忠孝萃一門安石曰丗説有人詣王太尉遇王安豐大將軍丞相在坐别屋見季胤平子逺語人曰今日之行觸目見琳琅珠玉朝廷偏注意洙曰天下安注意於相接近與名藩趙曰自万遷巴故云接近祖帳維舟數洙曰疏廣傳設祖道供帳寒江觸石喧看君妙為政他日有殊恩洙曰蜀都賦觸石吐雲潭州送韋貟外牧韶州洙曰迢或云韋適炎海韶州牧風流漢署郎分符先令望洙曰鮑明逺將以分符竹同舍有輝光洙曰直不疑為郎為同舍郎疑取金趙曰公亦是貟外郎故於韋貟外可謂之同舍矣白首多年疾秋天昨夜涼洞庭無過鴈書疏莫相忘趙曰言自洞庭而往𬒳雖無過鴈以寄書去而彼中書音信却不可忘也潭州留别杜貟外院長洙曰韶州刺史韋迢江畔長沙澤洙曰作驛相逢纜客船大名詩獨步小郡海西偏趙曰言子美獨步曹子建與楊德祖書曰仲宣獨步於漢南小郡者韋君自謂韶州也地濕愁飛鵩洙曰賈誼為長沙王太傳以長沙卑濕但自傷悼以為壽不得長乃為鵬賦有鵩飛入誼舍止於坐隅鵩似梟不祥鳥天炎畏跕鳶洙曰馬援曰吾在浪泊西里聞虜未滅時下僚上霧毒氣董蒸仰視飛鳶跕跕墮水中去留俱失意把臂共澘然蘇曰徐璿至固陵下馬把臂兩意澘然久之乃揮涕分首奉送王信州崟北歸朝廷防盜賊供給愍誅求下詔選郎署傳聲典信洙曰一作能典州趙曰信州乃夔州見唐志蒼生今日困天子嚮時憂井屋有煙起瘡痍無血流趙曰追言天子前時以蒼生之困而選王君為守其效見於井邑有煙則逃亡復業矣瘡痍無血則誅求不再矣壤歌唯海甸趙曰擊壤之歌也唯海甸則時淮海無虞也畫角自山樓白髮寐常早趙曰公自言也荒榛農復秋趙曰言荒年之後又復有秋矣解龜踰卧轍洙曰謝靈運𥘉去郡牽絲及元興解龜在景平侯霸為臨淮太守𬒳徴百姓攀轅卧轍不許去趙曰以徐孺子自比而指王崟為陳蕃也言崟相待如陳蕃之見孺子則潁川將何以酬之乎潁川陳氏郡號也遣騎覔扁舟洙曰劉真長遣騎覔張孝廉船見晉書扁舟小舟也徐榻不知倦洙曰陳蕃為徐孺子下榻去則懸之潁川何以酬塵生洙曰一作生塵彤管筆洙曰詩彤管有煒寒膩黑貂裘洙曰蘇秦有黑貂裘髙義終焉在斯文夫矣休別離同雨散洙曰曹子建風流雲散一别如雨劉孝標煙飛雨散行止各雲浮洙曰劉越石詩功業未及建夕陽忽西流時哉不我與去矣若雲浮林熱鳥開口江渾魚掉頭鄭曰掉徒弔切趙曰此言離别之景尉他雖北拜鄭曰尉紆勿切洙曰陸賈傳時中國𥘉定尉他平南越因王之髙祖使賈賜他印為南越王尉他魋髻箕踞見賈賈因説他君王且郊迎北面稱臣於是他乃蹶然起坐謝賈卒拜他南越王今稱臣奉漢約歸報髙祖大恱乃拜賈為太中大夫太史尚南留洙曰見周南大史公注軍旅應都息寰區要盡收九重思諌諍八極念懷柔徙倚瞻王室從容仰廟謀故人持雅論絶塞豁窮愁趙曰故人指王信州也言聞王信之論則可以豁其旅寓之愁也復見陶唐理甘為汗漫遊洙曰神仙傳盧敖見一士曰吾與汗漫期於九垓之外趙曰言既復唐堯之化則無心從官而甘為方外之士也汗漫遊祖出淮南子載若士謂盧敖曰吾將與汗漫遊於九垓之上舉臂竦身而遂入雲中也師曰張景陽七命曰爾乃踰天垠越地隔過汗漫之不遊躡張亥之末迹注汗漫能遊天者也李善曰淮南子云若士曰吾汗漫遊於九垓之上若士舉臂竦身而遂入雲中并屋有煙起言民獲安居飽食也瘡痍無血流無賦斂以橫索也解龜言任滿解龜印也子美為拾遺今見斥逐故云塵生彤管筆奉送蘇州李二十五長史丈之任星拆台衡地趙曰中台星拆張華見誅而今云星拆則李二十五丈父必是台輔貴人而有此事惜乎無所考曾為人所憐洙曰前漢五行志成帝時歌謡曰邪徑敗良田讒口亂善人桂樹花不實黃爵巢其顚故為人所羡今為人所憐桂赤色漢家象華不實無繼嗣也王莽自謂黃家黃爵巢其顚公侯終必復洙曰閔元年傳畢萬筮仕於晉遇屯之比辛廖占之曰吉屯固比入吉孰大焉其必蕃昌震為士車從馬足居之兄長之母覆之衆歸之六躰不易合而能固安而能殺公侯之卦也公侯之子孫必復其始經術竟相傳洙曰韋賢少子玄成復以明經歷位至丞相食德見從事洙曰易食舊德或從王事無成克家何妙年洙曰蒙九二子克家曹植表曰終軍以妙年使越潘嶽楊中武誄子以妙年之秀趙曰言李公自妙年巳克家矣一毛生鳯穴夢符曰右按南史謝起宗父鳯超宗好學有文辭盛傳名譽新安王子鵉母殷淑儀卒超宗作誄奏之帝大嗟賞謂謝莊曰超宗殊有鳯毛靈運復出三尺獻龍泉洙曰漢髙祖提三尺取天下師古曰三尺劒也越絶書楚王召風湖子令之吳越見歐治子干將使之鑄劒三枚一曰龍泉楚王問何謂龍泉對曰龍泉狀如登髙山臨深淵晉鄭聞此劒求之不得後漢肅宗賜諸尚書劒特以寶劒自為名以尚書韓稜淵深有謀故得楚龍泉赤壁浮春暮洙曰孫權將周瑜敗曹操於烏林赤壁趙曰言赤壁以形容其所經之地也姑蘇落海邊洙曰越絶書曰闔廬起姑蘇臺三年聚材五年乃成髙見三百里趙曰言李丈往任蘇州矣有姑蘇臺故州以得名客間頭最白惆悵此離筵湖中送敬十一使君適廣陵相見各頭白其如離别何幾年一會面今日復悲歌少壯樂難得蘇曰梁瑝在囚歎曰少壯唯難得樂事坡又云此言真可書紳歲寒心匪他氣纒霜匣滿趙曰言在匣中而氣騰矣氷置玉壷多洙曰樂府清如玉壷氷趙曰言心之清也遭亂實漂泊濟時曽琢磨形容吾校老膽力爾誰過秋晚嶽增翠風髙湖湧波趙曰魏文帝浮淮賦云驚風泛湧波騫騰訪知已淮海莫蹉跎巫山縣汾州唐使君十八弟宴别兼諸公携酒樂相送率題小詩留于屋壁卧病巴東久洙曰郭璞江賦巴東之峽今年強作歸故人猶逺謫趙曰故人指唐使君也兹日倍多違接宴身兼杖聽歌淚滿衣諸公不相棄擁别借光輝章梓州橘亭餞成都竇少尹得涼新添字秋日野亭千橘香玉柸錦席髙雲涼主人送客何所作鄭曰音佐行酒賦詩殊未央衰老應為難離別賢聲此去有輝光預傳籍籍新京兆靑史無勞數趙張江亭送眉州辛别駕升之得蕪字柳影含雲幕洙曰一作重趙曰言幕之如雲也江波近酒壷異方驚會面終宴惜征途趙曰曹子建詩終宴不知疲沙暖低風蝶天晴喜浴鳬别離傷老大意緒日荒蕪蘇曰孔孟傷别離情悰惟傷老大奉送蜀州柏二别駕將中丞命赴江陵起居衛尚書太夫人因示從弟行軍司馬位中丞問俗畫熊頻洙曰漢制刺史車畫熊於軾愛弟傳書綵鷁新洙曰見上紱即朱當隨綵鷁注遷轉五州防禦使起居八座太夫人洙曰後漢以六曹尚書并令僕二人謂之八座魏以五曹尚書二僕射合為八座宋與魏同隋以六尚書左右僕射合為八座唐與同漢文紀注列侯妻稱夫人列侯死子復為列侯乃得稱太夫人子不為列侯則否楚宫臘送荆門水白帝雲偷碧海春與報惠連詩不惜洙曰謝惠連乃靈運之弟知吾班鬢㧾如銀洙曰秋興賦班鬢彪以承辨素髮颯以垂領送田四弟將軍將夔州柏中丞命起居江陵節度陽城郡王衛公幕洙曰一云蘷府送田將軍赴江陵離筵罷多酒起地發寒塘回首中丞座洙曰見周行獨座榮注趙曰言田公所起發之地在夔州寒塘也辭中丞而行猶回首顧戀也御史中丞謂之獨座馳箋異姓王洙曰見八哀臨淮王詩注趙曰漢有異姓諸侯王也燕辭楓樹日趙曰楚地多楓也辭以言燕之去鴈度麥城霜空醉山翁酒遙憐似葛強洙曰葛強山簡愛將也襄陽童謡曰舉鞭向葛強何如并州兒是也送蔡希魯都尉還隴右寄髙三十五書記洙曰時哥舒翰入奏勒蔡子先歸蔡子勇成癖洙曰癖好著也如王濟馬癖和嶠錢癖杜預左傳癖之義蘇曰張遼養勇鋭成癖恃才業成癡彎弓西射胡鄭曰射食亦切洙曰曹子建白馬篇宿昔秉良弓楛矢何參差控弦破左的右發摧月支趙曰如前漢士不敢彎弓而報怨健洙曰一作男兒寧鬪死洙曰丗説桓車騎使健兒鼓行劫鈔趙曰強健之兒也故對壯士蓋自是今日以黥面者為健兒故學者致疑耳壯士恥為儒洙曰曹子建詩名在壯士籍不得中顧私酈食其傳沛公不喜儒諸客冠儒冠來者沛公輒溺其中趙曰如項羽目樊噲曰壯士也耻為儒者義甚明如治天下當用長槍大劒何用毛錐子之類舊注引沛公溺冠事非矣官是先鋒得材緣挑戰須鄭曰挑徒了切洙曰先鋒謂先師衆而行也鋒取鋒鋭之義挑戰挑之使戰也如左氏之致師也漢髙祖紀項羽謂曹咎曰謹守成臯即漢王欲挑戰慎勿與戰臣瓉曰挑戰擲嬈敵求戰也古謂之致師身輕一鳥過余曰歐公詩話云𥘉陳舍人從易偶得杜集舊本文多脫誤至送蔡都尉詩身輕一鳥其下脫一字陳公與數客各用一字輔之或云疾云落或云下莫能定後得一善本乃是過字陳公嘆服以為雖一字諸君亦不能到槍急萬人呼洙曰言輕健如飛鳥也季廣趫健人目為飛將呼驚呼也雲幕隨開府洙曰幕府以幕為府西京雜記成帝設雲幕於甘泉春城赴洙曰一作入上都趙曰此言哥舒之入奏也天寶十一載冬入朝今言春城赴上都豈由冬末而涉春乎凡大將則有幕府蓋以幕為府也馬頭金匼匝鄭曰上口答下作答切洙曰右詩白馬黃金羈驄馬金絡頭駝背錦模糊洙曰以駝負錦趙曰駝之背負物矣而以錦帕蒙之此之謂模糊咫尺雪山路洙曰郭義恭志廣曰西域有白山通歲有雪亦名雪山班超贊曰定逺慷慨專功西域坦步蔥雪咫尺龍沙注八寸曰咫咫尺者言不以為逺歸飛西洙曰一作靑海隅洙曰言歸隴右趙曰謂希魯先勒還隴右也言視雪山路如咫尺不以為逺故歸飛西海隅也上公猶寵錫洙曰上公哥舒翰突將且前驅趙曰上公指哥舒猶有錫命未已固當少留則蔡子突將當往為前驅以先歸也漢使黃河逺洙曰漢使張騫窮河源趙曰翰為河西節度使故云黃河逺涼州白麥枯洙曰漢桓帝童謡曰小麥青靑大麥枯誰當穫者婦與姑丈夫何在西擊胡趙曰言其地言其時也因君問消息洙曰問髙消息好在阮元瑜洙曰王粲傳陳留阮瑀字元瑜少受學於蔡雍建安中都護曹洪欲使管記室瑀不為屈師曰哥舒翰開府儀同三司得自選幕府士希魯為都尉隸其麾下赴上都言隨哥舒入奏金匼匝乃金絡頭也駝背錦模糊言以駝載錦入貢也咫尺雪山路不以路逺為憚也西海隅謂還隴右唐陳藏器本草云小麥秋種夏熟受四時氣足兼有寒溫麵熱麩冷冝其然也河渭以西白麥麵涼以其春種闕二時之氣故也以地理志考之涼州正在河渭之西其出白麥蓋土地所冝時哥舒翰在涼遣子先歸歸期正白麥之熟甫因問髙適消息適隨哥舒為掌書記故比之阮元瑜在乃存問之辭送路六侍御入朝童稚情親四十年洙曰言相得於總角中間消息兩茫然更為後會知何地忽漫相逢是别筵不分桃花紅勝錦蘇曰李夫人病起南園桃花盛開李不恱武帝問其故李曰不分桃花如錦惱人病眼帝感其言遂去其花為一國笑生憎柳絮白於綿劒南春色還無賴觸忤愁人到酒邊趙曰不分生憎所以深言其紅白也皆俗語中字惟桃花之深紅絮之釅白正是春色放蕩無所倚賴者也如此故翻是觸忤愁人斷送令到酒邊以散其愁師曰甫與路侍御相得於總角之時中間不得消息未知後會在何處言今春色使人愁悶不若以酒消遣之送何侍御歸朝彥輔曰李梓州泛舟筵上作舟楫諸侯餞趙曰言章梓州作泛舟之筵也車輿使者歸洙曰御史乃使者趙曰言何公歸朝也山花相映發水鳥自孤飛春日垂霜鬢天隅把繡衣洙曰漢御史繡衣持斧故人從此去洙曰一作逺寥落寸心違魏十四侍御就弊廬相别有客騎驄馬洙曰見憲府舊乘驄注趙曰桓典為御史常乘驄馬人為之語曰行行且止避驄馬御史故公用以比魏侍御也江邊問草堂洙曰公所築也逺尋留藥價趙曰言逺來見尋因留買藥之資惜别到文場趙曰公自以其居為文場矣杜預贊元凱文場稱為武庫師曰留藥價言有所餽也到文場言傾寫詩章也入幕旌旗動洙曰入王儉幕為蓮花池歸軒錦繡香時應念衰疾書迹及滄浪洙曰迹一作疏趙曰公便自以其居為漁父之滄浪也送許八拾遺歸江寧覲省甫昔時嘗客遊此縣於許生處乞瓦棺寺維摩圖樣志諸篇末詔許辭中禁慈顔到北堂洙曰詩焉得萱草言樹之背注背北堂也北堂母氏也一云天語辭中禁家榮赴北堂聖朝新孝理洙曰以孝理天下祖席倍輝光洙曰祖席飲餞也漢祖二踈一云行子倍恩光內洙曰一作贈帛擎偏重宫衣著更香淮隂淸夜驛京口渡江航洙曰淮隂京口皆江南地名鄭曰淮隂楚州京口潤州春隔雞人晝洙曰雞人宫中司曉者言許方歸寧當隔雞人報曉爾秋期燕子涼洙曰秋期還也賜書誇父老壽酒樂城隍洙曰一云竹引趨庭曙山添扇枕涼十年過父老幾日賽城隍薛曰右按古樂府前有一樽酒主人行壽今日合來者皆令冨且貴欲令主人三萬歲終歲不知老為吏當髙遷賈市得萬倍桑蠶當大得主人冝子孫看畫曽飢渴追縱限洙曰一作恨渺茫鄭曰渺弭沼切大水虎頭金粟影袖妙獨難忘洙曰虎頭維摩相也金粟釋有金粟也修可曰愷之字長康小字虎頭晉陵無錫人多才氣尤工丹靑傳寫形勢莫不絶妙曽於瓦棺寺北殿畫維摩詰畫訖光耀月餘日師曰王洙注以虎頭為維摩相大誤矣薛曰右按王簡栖頭陀寺碑金粟如來儀文殊戾止發迹經曰淨明大士是往古金粟如來惠義寺園送辛貟外新添朱櫻此日垂朱實郭外誰家負郭田萬里相逢貪握手髙才仰望足離筵又送新添雙峯寂寂對春臺萬竹青靑照洙曰一作送客杯細草留連侵坐軟殘花悵望近人開同舟昨日何由得並馬今朝未擬回直到綿州始分首江邊樹裏共誰來惠義寺送王少尹赴成都分得新添峯字苒苒谷中寺姢姢林表峯欄竿上處逺結構坐來重騎馬行春徑衣冠起暮鍾雲門靑寂寞此别惜相從送翰林張司馬南海勒碑冠冕通南極洙曰通猶通西南夷趙曰冠冕指言張司馬南極指言南海之地文章落上台洙曰謂相國製文詔從三殿去洙曰唐有三殿學士趙曰李翰林院在麟德殿西廂束廊之後故曰三殿出者言詔自翰林院經三殿而出也舊注云唐有三殿學士何所據而亂立名字邪師曰三殿謂蓬萊拾翠紫微是也學士直殿故詔從三殿去碑到百蠻開野館濃花發春帆細雨來師曰二句皆言春時之别不知滄海上天遣幾時回贈韋􅐌善别扶病送君發自憐猶不歸秪應盡客淚復作掩荆扉江漢故人少音書從此稀往還二十載歲晚寸心違蘇曰張季鷹秋日北園詩云旅途驚歲晚歸興與心違工部用語補綴尤有工巧了不見痕迹後進可為師範趙曰陸士衡文賦吐滂沛乎寸心送韋郎司直歸成都竄身來蜀地同病得韋郎洙曰以避難奔走入蜀故言竄身韋亦避難者故言同病天下兵戈滿江邊歲月長别筵花欲暮春曰鬢俱蒼洙曰一云春鬢色俱蒼為問南溪竹洙曰一云笋抽梢合過牆趙曰公自注余草堂在成都西郭則南溪者又草堂傍近之名送魏二十四司直充嶺南掌選崔郎中判官兼韋韶州選曹分五嶺洙曰見前雲山兼五嶺注趙曰言崔郎中充嶺南掌選也使者歷三湘洙曰顔延年三湘謂洞庭七澤藹荆牧注江湘沅水皆會巴陵洞庭陂號為三湘蓋謂三江趙曰言崔郎中出使歷三湘也三湘之名按樂史寰宇記云湘潭湘鄉湘源才美膺推薦趙曰言魏為人所薦而為判官也君行佐紀綱洙曰左傳紀綱之僕趙曰言魏君之行崔佐君之紀綱也佳聲期洙曰一作斯共逺趙曰魏崔皆著佳聲而共逺矣雅節在周防明白山濤鑒洙曰山濤典選吏部並得其才再居十餘年一官闕輒啓數人甄拔人物各為題目稱為山公啓事趙曰戒魏公之佐選事當以公也嫌疑陸賈裝洙曰陸賈説尉他他賜賈槖中裝直千金他送亦千金趙曰又戒之以廉也今魏君往嶺南充掌選判官苟有千金之裝如陸賈則為嫌疑矣故人湖外少趙曰故人湖外客此是韋迢詩金句公改一字而精神健矣春日嶺南長蘇曰謝孚竄嶺外春日語客曰昔年洛下長歌痛飲唯嫌日短今窮居嶺南偏覺日長要黑不能吾其奈何豫因有感書示翟夫子慿報韶州牧新詩昨寄洙曰一作夜將送楊六判官使西蕃送逺秋風落師曰八月風髙九月風梢帖落西征海氣寒帝京氛祲滿洙曰氛祲不祥之氣言胡塵汚染帝室趙曰往吐蕃渡青海故云海氣寒也此乃至德二年九月巳前詩蓋京師猶未復故云氛祲滿也鄭曰祲子鴆切精氣感祥人丗别離難蘇曰季圭人丗萬事惟别離最難絶域遙懷怒和親願結歡趙曰中國以其懷怒侵叛而與之和親勑書憐􅐌普洙曰贊普吐蕃王名兵甲望長安馬曰望長安言欲入寇宣命前程急惟良待士寬子雲清自守今日起為官洙曰揚子雲仕宦不逹寂寞自守起為官以子雲比楊判官也亦美之而巳垂淚方投筆洙曰言以戎事為憂故垂淚投筆如班超投筆而起志在功名傷時即據鞍洙曰劉尚深入五溪軍沒馬援因復請行時年六十二帝愍其老未許之援自請曰臣尚能𬒳甲上馬帝令試之援據鞍顧盻以示可用儒衣山鳥怪蘇曰桑聞再歸中條時春鳥嘐戞聞嘆曰山鳥亦怪我儒衣歸漢節野童看趙曰蘇武仗漢節牧羊邊酒排金盞洙曰一作碗夷歌捧玉盤草肥蕃洙曰一作輕馬健洙曰胡人至秋則草肥馬健思入寇雪重拂廬乾修可曰拂廬蕃帳名趙曰吐蕃聯毳帳以居號大小拂廬也愼爾參籌畫從兹正羽翰鄭曰何于切羽也歸來權可取九萬一朝摶朝曰言當以功名自致逺大趙曰莊子言鵬之飛也摶扶搖而上者九萬里黃曰言刷整羽翼飛騰之兆在此時也送李公祕書赴杜相公幕新添青簾白舫益州來蘇曰劉濬自益州歸荆渚白舫百棹皆繡帆青簾多載妓女峽人呼為天上樓船巫峽秋濤天地回石出倒聽楓葉下洙曰灧澦堆櫓搖皆指菊花開貪趍相府今晨發恐失佳期後命催南極一星朝北斗洙曰晉天文志北極北而最尊者也天運無窮三光迭曜而星辰不移故曰居其所而衆星拱之人君之象也趙曰南極以言李公在楚而往是為南極之星北斗指長安蓋上直北斗而號北斗城也五雲多處是三台洙曰五雲五色雲也三台上台中台下台台也趙曰晉天文志三台六星兩兩而居三公之位也也三台指杜相矣送王十五判官扶侍還黔中得開字大家東征逐子回洙曰後漢扶風曹丗叔妻者同郡班彪之女名昭字惠姬和帝數召入宫令皇后貴人師事焉號曰大家子殼為陳留長垣縣長大家隨至官作東征賦以敘行李趙曰大家指言王判官母以班氏比之也風生洲渚錦帆開洙曰煬帝以錦為帆靑靑竹笋迎船出白白江魚入饌來修可曰楚國先賢傳孟宗字恭武至孝母好食笋冬月無之宗入林中哀號笋為之生後漢烈女傳薑詩及妻龐氏並至孝母好飮江水嗜魚膾又不能獨食夫婦嘗力作鱠呼鄰母共之舍側忽有泉湧味如江水每旦輒出雙鯉常供二母之膳王判官侍母回黔中故有此句余曰邵氏聞見録云子美日日江魚入饌來後得古本日日作白白不但撿句甚偶其思致亦不同離别不堪無限意艱危深仗濟時才黔陽信使應稀少鄭曰寰宇記黔州黔陽郡莫怪頻頻勸酒杯洙曰頻頻一云頻煩蘇曰蕭鳯使玉門關弟肅勸酒頻頻謂兄曰醉中庶使分𬒮不悲送韋書記赴安西夫子歘通貴趙曰歘音許勿切有所吹起貌歘通貴忽然而貴也雲泥相望懸洙曰雲泥猶貴賤之懸逺如雲之與泥余曰後漢逸民傳吳倉與矯仲彥書云乘雲行泥棲宿不同白頭無籍在洙曰無籍在朝列也籍如通籍之籍朱紱有洙曰一作即哀憐洙曰曹子建俯愧朱紱趙曰韋君為書記則賜緋矣有哀憐則言朱紱之人有哀憐於我書記赴三捷洙曰一作接采薇豈敢定居一月三捷生捷勝也三勝謂侵伐戰趙曰指安西主將也又以言韋君矣公車留二年洙曰東方朔待詔公車師古曰公軍今屬衛尉上書者所詣欲浮江海去此别意滄洙曰一作蒼然洙曰公以道不偶時欲放迹於江海也論語道不行乘桴浮于海趙曰公自謂也公自負其才既見韋之通貴而身留公車不能無觖望於欲去而之江海矣郪城西原送李判官兄武判官弟赴成都府鄭曰郪七稽切縣名在梓州慿髙送所親久坐惜芳辰逺水非無浪趙曰以言其行路之辛苦他山自有春蘇曰阮咸歸陳留衆俱留咸曰看洛中春罷去王尚曰他山春色甚可人意清泉白石清人耳目此洛中無塵土氣味野花隨處發官洙曰一作妖柳著行新鄭曰行胡岡切天際傷愁别洙曰謝玄暉詩天際識歸舟離筵何太頻師曰甫與二判官於情最親臨此送别言其此去如逺水不能無風浪它山雖有春兄弟不得同賞以至野花官柳觸目使人不能無傷感也别崔潩因寄薛據孟雲卿鄭曰潩夷記切志士惜妄動蘇曰謝安石志士之心如石豈可妄動知深難固辭趙曰志士本惜妄動而受知之深則難固辭此以言漫赴幕職於湖南也如何久磨礪但取不磷緇鄭曰磷力珍切洙曰語不曰堅乎磨而不磷不曰白乎涅而不緇喻君子雖在濁亂不能汙也謝靈運緇磷謝清曠疲薾慙貞堅趙曰言如以久磨礲淬礪便以為利乎所貴尚者取磨不磷涅不緇而巳夙夜聽憂主飛騰急濟時荆州遇薛孟為報欲論詩蘇曰阮瞻行程劇曰煩子寄語友人欲與子共竹林諸公論詩耳送王十六判官客下荆南盡君今復入舟買薪猶白帝孫曰夔州沽酒買薪鳴櫓少沙頭洙曰江陵舟船至泊於郭外沙頭衡霍生春早瀟湘共海浮荒林庾信宅為仗主人留送覃二判官先皇弓劒逺小臣餘此生洙曰皇帝葬於嬌山南空棺無尸唯劒舄在前漢郊祀志黃帝采首山銅鑄鼎於荆山下鼎既成有龍垂胡髯下迎黃帝帝上騎羣臣後宫從上龍七十餘人龍乃上去餘小臣不得上乃悉持龍髯龍髯拔墮墮黃帝之弓百姓仰望黃帝既上天乃抱其弓與龍髯故後丗因名其處曰鼎湖其弓曰烏號於是天子曰嗟乎誠得如黃帝吾視棄妻子如脫敝屐耳趙曰先帝指肅宗也蹉跎病江漢不復謁承明洙曰選云鯨魚失流而蹉跎前漢嚴助傳上問所欲對願為會稽太守於是拜為會稽太守數年不聞問賜書曰制詔會稽太守君厭承明之廬張晏曰承明之廬在石渠閣外直宿所止曰廬曹子建贈白馬王彪詩曰謁帝承明廬逝將歸舊疆應休璉百一詩問我何功德三入承明廬江文通書曰升承明之卧闕蘇曰謝宗出守仇池語友人曰吾此行當不復謁承明廬擇山水秀媚處吾斂翼卑棲無意人間丗也趙曰公於肅宗時為拾遺則常謁帝矣餞爾白頭日洙曰鄒陽白頭如新永懷丹鳯城趙曰指言長安帝城也秦穆女弄玉吹簫鳯集其城因號丹鳯城遲遲戀屈宋渺渺卧荆衡洙曰屈原宋玉趙曰言在楚地也荆則荆渚衡則衡山也魂斷航舸失趙曰望覃判官之去航黯然作别而魂斷也天寒沙水淸肺肝若稍愈亦上赤霄行洙曰七命挂歸翮於赤霄之表趙曰亦有意於長安帝京矣重送劉十弟判官分源豕韋派洙曰韋賢傳詩曰肅肅我祖國自豕韋應劭曰在商為豕韋氏趙曰言劉與杜同出也漢髙祖紀贊曰春秋晉史蔡墨有言陶唐氏既衰其後有劉纍學擾龍事孔甲范氏其後也而大夫范宣子亦曰祖自虞以上為陶唐氏在夏為御龍氏在啇為豕韋氏在周為唐杜氏晉主夏盟為范氏别浦鴈賔秋洙曰月令秋月鴻鴈來賔蘇曰張衡云賔鴈别浦蘆葦將秋年事推兄忝洙曰張釋之兄事袁盎趙曰劉孝標答郭峙書云頃年事道盡容髮衰謝年事蓋言年歲之事也舊引張檡之兄事袁盎非是才有字相犯便取為證也人才覺弟優經過辨酆劒洙曰晉書曰斗牛之間有紫氣雷煥曰寶劒之精上徹於天耳在豫章酆城令掘獄屋基入地四丈得石函中有雙劒一曰龍泉一曰太阿意氣逐吳鈎修可曰吳鈎見後出塞詩含笑入吳鈎注趙曰舊引鮑明逺詩錦帶佩吳鈎而不講其物沈存中云唐人詩用吳鈎吳鈎者刀名也刀彎今南蠻用之謂之葛黨刀也垂翅徒衰老洙曰馮異傳始雖垂翅回溪終能奮翼澠池可謂失之東隅收之桑榆先鞭不滯留趙曰劉琨與親舅書曰梟枕戈待旦志梟逆虜常恐祖生先吾著鞭耳本枝凌歲晚髙義豁窮愁他日臨江待長沙舊驛樓别蘇溪洙曰赴湖南幕故人有遊子棄擲傍天隅洙曰李陵詩遊子暮何之又各在天一涯他日憐才命居然屈壯圖趙曰他日前日也嘗愛憐蘇之才命以為必超騰矣而今居然猶壯圖之屈也十年猶塌翼洙曰陳琳檄忠義之佐垂頭塌翼絶倒為驚呼洙曰昔琅邪王澄每聞衛玠言輒歎息絶倒故時人謂之語曰衛玠談道平子絶倒消渴今如在洙曰司馬相如常有消渴病提携愧老夫洙曰禮長者與之提携則兩手奉長者之手注謂牽將行又自稱曰老夫趙曰公自言有消渴之病不能提携蘇徯為愧也豈知臺閣舊洗拂鳯凰雛洙曰蜀龐統號鳯雛易林鸞者鳯之雛得實翻蒼竹棲枝把翠梧洙曰鳯非梧相不棲非竹實不食北辰當宇宙南嶽據江湖國帶煙塵色趙曰據者盤據之據以蘇徯往為幕客故指其地而言時干戈未息故云風塵兵張虎豹符洙曰杜詩傳發兵皆以虎符數論封內事揮發府中趨趙曰言蘇徯為幕客則數論其湖南封內之事而能發揮之也府趨之人非一人也古樂府冉冉府中趍贈爾秦人䇿洙曰文十三年傳秦伯使士會行繞朝贈之以䇿曰子無謂秦無人吾謀適不用也注䇿馬撾臨别授之馬撾並示己所䇿所䇿以展情繞朝秦大夫莫鞭轅下駒洙曰灌夫傳上怒內史曰公平生數言魏其武安長短今日廷論局促效轅下駒應劭曰駒者駕著轅下張晏曰俯頭於車轅下隨母而巳暮秋將歸秦留别湖南幕府親友東津送韋諷攝閬州録事新添聞説江山好憐君吏隱兼寵行舟逺泛惜别酒頻添推薦非承乏操持必去嫌它時如按縣不得慢陶潛送趙十七明府之縣連城為寶重洙曰虞子京連城既偽往荆玉得真還趙曰此言秦王以十五城易趙和氏之璧也茂宰得才新洙曰卓茂為密令人服其德吏懷其恩蘇曰謝玄暉和伏武昌登孫權故城詩雄圖悵若茲茂宰深遐眷太白贈義興宰亦云天子思茂宰天枝得英材趙曰舊注輒指為卓茂誤矣山雉迎舟楫洙曰語山梁雌雉江花報邑人趙曰上句則禽鳥知所馴下句則草木知所喜皆美言之論交翻恨晚趙曰公與趙君晚方論交也卧病却愁春惠愛南翁恱餘波及老身趙曰言施惠愛而南人喜悅公自謂老身亦霑其餘波送鄭十八虔貶台州司户傷其臨老陷賊之故闕為面别情見于詩趙曰按唐史虔以祿山反陷賊偽授虔水部郎中潛以密章逹虛武賊平與王維等並囚宣陽然皆善畫崔圎使繪齋壁虔等即祈解於圓卒免死貶台州鄭公樗散鬢如絲洙曰莊子有樗散之材言不合丗用酒後常稱老畫師洙曰虔善盡常獻詩畫又書于明皇御批號為三絶萬里傷心嚴譴日百年垂死中興時洙曰時初復京師􅐚以汙賊貶蒼惶巳就長途往邂逅無端出餞遲便與先生應永訣九重泉路盡交期洙曰言交契之期死生不替暮冬送蘇四郎徯兵曹適桂州飄飄蘇季子六印佩何遲洙曰蘇季子言吾若有雒陽負郭三頃田安能佩六國相印乎早作諸侯客兼工古體詩洙曰見諸侯老賔客注陸士衡有擬古詩爾賢埋照久洙曰阮步兵詩沉醉似埋照余病長年悲盧綰須征日洙曰盧綰傳上使使召綰稱病不行上怒曰綰果反使樊噲擊綰髙祖崩綰遂將其衆亡入胸奴以為東胡盧王為蠻夷所侵奪居歲餘死樓蘭要斬時洙曰見樓蘭斬未還注歲陽𥘉盛動趙曰十二月二陽生矣王化久磷淄洙曰見此道未磷緇注為入蒼梧廟看雲哭九疑趙曰因送蘇徯適桂州而思舜舜南巡狩崩於蒼梧之野而葬於九疑之山耳師曰傳介子持刃欲斬樓蘭王以立功山海經云九疑山帝舜所葬在長沙零陵界又云南方蒼梧之淵舜之所葬湘中記曰九疑山在營道縣九山相似行者疑惑荆州記曰九疑山盤基數郡之界連峯接岫競遠爭髙含霞卷霧分隔天日郡國志曰九疑山有九峯一曰丹朱二曰石城三曰樓溪形如樓四曰娥皇下有舜妃五曰舜源六曰女英舜墓在此峯下七曰簫韻八曰紀峯九曰紀林有九水送假功曹歸廣州南海春天外功曹幾月程峽雲籠樹小湖日落洙曰一作蕩江明交趾丹砂重洙曰見朱就丹砂魏葛洪注趙曰交州丹砂音切稚川求為勾漏令同上韶州白葛輕洙曰白葛葛布蘇曰胡嘯寄王稽韶陽白葛巾一匹稽製為涼帔王逸少與銘其紳丗號三表衣幸君依旅洙曰一作估客時寄錦宫城饒曰錦宫城即蜀也送孟十二倉曹赴東京選君行别老親此去苦家貧藻鏡留連客夢符曰右按晉太康四年制曰藻鏡銓衡又李重選曹尚書咸序曰童忝曹郎銓管九流品藻清濁雖抵慎莫知所寄尹曰藻鏡猶藻鑒也故子美王韋左相詩又有持衡留藻鑒之句晉太康四年制曰藻鑒銓衡又唐舊史許子儒長壽中為天官侍郎子儒居選部不以藻鏡為意委令史句直以心腹注官之次子儒髙枕而卧時云句直平配道路以為口實江山憔悴人蘇曰張淇長江逺山供愁眼具兄解作憔悴與遷人秋風楚竹冷夜雪鞏梅春朝夕髙堂念應冝綵服新洙曰見休見綵衣輕注晚秋長沙蔡五侍御飲筵送殷六參軍歸澧州覲省詩佳士欣相識蘇曰祖逖遇梁劭曰久聞佳士聲名今日欣識風來慈顔望逺遊洙曰潘安賦壽觴舉慈顔和論語父母在不逺遊趙曰佳士指殷六也慈顔則殷之母也言望其逺遊而歸也甘從投轄飲洙曰陳遵嗜酒每大飲賔客滿座輒關門取客車轄投井中雖有急終不得去師古曰坐閣閉門又投車轄於井中也趙曰言甘從蔡五之飲也肯作置書郵洙曰殷羡供喬為豫章太守都下士人因羡致書者百餘函行次石頭皆棄水中曰沉者自沉俘者自浮殷羡不為致書郵趙曰言殷不苟為人携書也髙鳥黃雲暮蘇曰古樂府云黃雲莫四合髙鳥各分飛寄語逺遊子月明胡不歸趙曰祖出淮南子云黃泉之埃上為黃雲寒蟬碧樹秋趙曰江淹碧樹先秋落湖南冬不雪吾病得淹留送司馬入京新添群盜至今日先朝忝從臣歎君能戀主久客羡歸秦黃閣長司諌丹墀有故人向來論社稷為詁涕霑巾送張二十參軍赴蜀州因呈楊五侍御好去張公子通家别恨添洙曰兩家相通往來言至契熟也此别恨所以添兩行秦樹直萬點蜀山尖御史新驄馬洙曰為呈楊侍御桓典拜侍御史常乘驄馬京師畏憚為語曰行行且止避驄馬御史參軍舊紫髯洙曰為張赴參軍郗超髯府中語曰髯參軍皇華吾善處於汝定無嫌禹稱曰皇華遣使臣之詩言張有吏才趙曰正以言楊侍御為皇華之使乃吾所厚善之人則於張二十亦必無嫌所以薦之也舊注非泛江送魏十八倉曹還京因寄岑中允參范郎中季明遲日深春洙曰一作江水洙曰詩春日遲遲輕舟送别筵帝鄉愁緒外春色淚痕邊見酒須相憶將詩莫浪傳趙曰言公自負其詩如此若逢岑與范為報各衰年送裴二虬作尉永嘉孤嶼亭何處天涯水氣中故人官就此絶境與誰同趙曰故人則指裴二矣絶境則指孤嶼亭矣隱吏逢梅福洙曰漢梅福九江人輔南昌尉居家嘗讀書養性為事至元始中王莽專政梅福一朝棄妻子去九江至今傳以為仙其後見福於會稽者更名為吳市門卒所謂隱於吏也遊山憶謝公洙曰謝安石寓居會稽與羲之遊處出則漁弋山水常往臨安山中坐石室臨濬谷悠然歎曰此亦伯夷何逺安雖放情丘壑然每遊賞必以妓女從也趙曰謂謝靈運也為永嘉守好遊山水時號云謝公今積榖山南有謝公巖焉舊注妄引謝安非是扁舟吾巳就洙曰一作具把釣待秋風洙曰張翰見秋風起乃思吳中蓴羮鱸魚鱠遂命駕東歸蘇曰杜預書曰吾本麋鹿心性強拘名利欲脫不能漢水澄明鯿魚正肥待得秋風涼冷吾當把釣盡此林泉之志公安送韋二少府匡􅐌逍遙公後丗多賢洙曰韋嗣立封逍遙公所隱谷曰逍遙谷田曰北史韋敻字敬逺孝寬之兄志尚夷簡淡於榮利號曰趙遙公故丗系表謂韋氏九房以瓊之後為逍遙公房嗣立之後為小逍遙公房以别之師曰子美稱逍遙公乃韋敻非嗣立也送爾維舟惜此筵念我能書洙曰一作常能數字至將詩不必萬人傳趙曰言思念我則寄將我之詩去則不必傳之萬人也時危兵甲黃塵裏日短江湖白髮前趙曰言髮巳白矣而短景中之江湖在其前古往今來皆涕淚斷腸分手各風煙洙曰别賦造分手而銜涕又分手易前期冬晚送長孫漸舍人歸州參卿休坐幄蕩子不歸鄉洙曰古詩蕩子行不歸蘇曰顔延年古樂府嫁得遊蕩子一去未還鄉秋夜不肯明教妾卧幽房趙曰公自言也公為劒南節度參謀謂之參卿公前為之而今罷此所謂休坐幄列子曰人有去鄉土遊於四方而不歸者丗謂為任蕩之人也南客瀟湘外趙曰公北人也而在湘潭是為南客西戎鄠杜傍洙曰宣帝尤樂杜鄠之間杜屬京兆鄠屬扶風蘇曰漢明帝曰今西戎猖獗若不禦備恐犯鄠杜鄠縣杜陵俱屬京兆趙曰吐蕃之兵未息也師曰參卿言長孫坐於帷幄為參謀也蕩子子美自稱鄠杜乃京城吐蕃陷之故云西戎鄠杜傍衰年傾蓋晚洙曰鄒陽傾蓋如故費日繫舟長趙曰言舟留滯而未行也會面思來扎洙曰古詩會靣安可知又客從逺方來遺我一扎書趙曰言欲會面則每思來扎所以預囑其寄書也銷魂逐去檣洙曰别賦黯然銷魂雲晴鷗更舞風逆鴈無行趙曰盛弘之荆州記冝都四陵峽中有黃牛山山上有黃牛形江湍縈回白馬江寒樹影稀洙曰江陵縣有白馬州此别還須各努力魯曰古詩少壯不努力老大徒傷悲故鄉猶恐未成洙曰一作堪歸師曰峽與江皆險阻甫因戒之欲其慎重也長沙送李十一銜與子避地西康州洞庭相逢十二秋趙曰𥘉同避地於西康州凡十二年秋而復相逢於洞庭也逺愧尚方曾賜履趙曰公嘗為左拾遺則蒙尚方賜履矣境非吾土倦登樓洙曰王粲登樓賦雖信美而非吾土兮曾何足以少留久存膠􅃮應難並趙曰言雖有膠􅃮之好而才器相逺為難此蓋公自謙也一辱泥塗遂晚收趙曰言流落而汩沒也左傳使吾子辱在泥塗師曰廣東有康州故别蜀康州為西康尚方主造御器用昔王子喬嘗飛雙履為鳬及捕得鳬乃尚方所賜履一辱泥塗遂晚收言李𥘉得罪及晚年稍見録用李杜齊名真忝竊洙曰後漢杜密傳黨事既起密免歸本郡與李膺俱坐而名行相次故時人亦稱李杜焉前有李固杜喬故亦言也范滂傳滂詣獄與母訣曰汝今得與李杜齊名死亦無恨謂李膺與杜密朔雲寒菊倍離憂别常徴君兒扶猶杖策卧病一秋強白髮少新洗寒衣寬揔長蘇曰曹子建瘦覺衣寬長愁知酒淺淡趙曰以病瘦之後故衣寬而揔長大矣故人憂見及革曰見及猶云訪及也此别淚相忘趙曰雖别而俱不能淚所以成相忘也各逐萍流轉來書細作行涪江泛舟送韋班歸京得山字追餞同舟日傷春洙曰一作心一水間趙曰一作傷春非但不若傷心之快古詩云相望一水間飄零為客久衰老羡君還花逺洙曰一作雜重重樹雲輕處處山趙曰一作花逺非蓋重重樹則巳有逺意不可疊用也天涯故人少更益鬢毛斑公安送二十九弟晉肅入蜀余下沔鄂正解柴桑纜洙曰謝詩解纜候前侣柴桑屬潯陽郡趙曰公將下沔鄂也鄭曰柴桑地名在江州仍看蜀道行趙曰送晉肅入蜀也檣烏相背發趙曰船檣上刻為烏形塞鴈一行鳴鄭曰行胡郎切趙曰言其別之時南紀連銅柱洙曰見上南紀標銅柱注西江接錦城洙曰丗説成都州城皆種芙蕖至秋盛開望之若錦故號錦城慿將百錢卜飄泊問君平趙曰嚴君平上筮於成都日閲數人得百錢乃止送元二適江左亂後今相見秋深復逺行風塵為客日趙曰公言其遭戰鬪之時旅泊於外江海送君情趙曰言元適江左也晉室丹陽尹洙曰溫嶠為丹陽尹公孫白帝城洙曰公孫據白帝城趙曰元既往為丹陽尹則舟行而去經白帝城而下也師曰丹陽尹指元二適丹陽也白帝城甫自言客居夔州也經過自愛惜取次莫論兵洙曰元嘗應孫吳科舉送裴五赴東川故人亦流落髙義動乾坤何日通燕塞相看老蜀門東行應暫别北望若銷魂昱曰選江淹賦黯然銷魂者唯别而巳凛凛悲秋意昱曰宋五九辨云悲哉秋之為氣也非君誰與論贈别何雍生死論交地何由見一人洙曰鄭當時傳一死一生乃見交情悲君隨燕雀洙曰公孫洪傳鴻漸之翼困於燕雀薄宦走風塵洙曰陸士龍飄鷂冒風塵余曰邵氏聞見録少陵此二句本陳勝與人傭耕之語也或以此論少陵之妙豫謂少陵所以獨立千載之上者不但有所本也三百篇之作果何所本哉綿谷無通漢趙曰綿谷縣名屬利州言何公所往利州而去得歸漢上也沱江不向秦洙曰沱江在蜀城北三十里水不大秦五陵花滿眠傳語故鄉春蘇曰張翃送友人入關曰慿君傳語故園春色來歲相期友人笑而去趙曰沱江在蜀城言不尚秦尚留蜀中勢不能去則有懷故鄉之念馮小憐春日詩云傳語春光道先歸何處邊贈別鄭錬赴襄陽戎馬交馳際柴門老病身蘇曰王子敬見戴文文曰公子意厚時過柴門來慰病身所謂歲寒知松柏之操也把君詩過日蘇曰晉索靖語魏玄同曰弊居謝絶人事病中無以慰牢落把君詩軸過日足有發益念此别驚神洙曰别賦使人意奪神駭心折骨驚地闊峨眉晚洙曰一作曉峨眉山在蜀地趙曰公自言在蜀也天髙峴首春趙曰言鄭之赴襄陽也峴首在襄陽羊叔子墮淚碑所在也為於耆舊內試覔姓龐人洙曰龍德公隱於鹿門屬襄陽黃曰甫意以龐與鍊一革人故有末句重贈鄭錬絶句鄭子將行罷使臣囊無一物獻尊親江山路逺羈離日裘馬誰為感激人洙曰言雖清潔不為人所知蘇曰江揔曰今出入無馬禦寒無喪誰是感激之士憫此遷客趙曰言乘肥衣輕之人誰感激而憐鄭之貧也師曰鄭鍊出監蜀今任罷故云罷使臣然身居皇華之貴以至囊無一物雖清潔如此不能為人所知故甫欲朋友輟裘馬以資之送人從軍弱水應無地洙曰弱水水也以其力不能載物故謂之弱水趙曰無地言水多也陽關巳近天洙曰陽關地名趙曰近天言山髙也余曰唐王維詩勸君更盡一杯酒西出陽關無故人後人以為陽關曲唱之今君渡沙磧纍月斷人煙好武寧論命洙曰志於功名故也封侯不計年洙曰有功即封趙曰言其從軍乃緣好武於是用命之秋故不論命有功封侯漢制也不計年所以激發之馬寒防失道師曰李廣征胸奴失道當斬贖為庶人此戒之之辭也雪沒錦鞍韉送逺帶甲滿天地洙曰盜賊充斥時方用兵胡為君逺行親朋盡一哭洙曰楚辭悲莫悲於生别離鞍馬去孤城草木歲月晚關河霜雪清别離巳昨日因見古人情蘇曰張翰命駕歸吳一丗髙其節阮攸歎曰讀留侯范蠡遺史因此知季鷹見古人情矣趙曰楚辭曰悲莫悲於生別離則古人之情可見矣泛江送客二月頻送客東津江欲平煙花山際重舟楫浪前輕淚逐勸杯落洙曰李陵别蘇武詩對酒不能酬趙曰以其行而勸之既别矣淚所以落舊注所引非愁連吹笛生洙曰馬融去京踰年有洛客逆旅吹笛暫聞之甚悲感離筵不隔日那得易為情洙曰離筵祖席也夏夜李尚書筵送宇文石首赴縣聮句洙曰石首縣名愛客尚書重之官宅相賢子美洙曰晉魏舒少孤為外家寧氏所養寧氏起宅相者云當出貴甥外祖母以盛氏甥小而慧意謂應之舒曰當為外氏成此宅相酒香傾坐側帆影駐江邊之方翟表郎官瑞鳬看令宰仙或洙曰江淮之南謂雉青質五彩皆備曰翟蕭望之為郎有雉數十常度草翔飛王喬為葉令有仙術以舄為鳬東南飛至臺雨稀雲葉斷夜久燭花偏子美數語欹洙曰一作𫾣紗帽髙文擲綵箋之芳興饒行處樂離惜醉中眠彧單父長多暇鄭曰單時戰切父方矩切河陽實少年子美洙曰單父宓子賤所治河陽潘嶽所治客居逢自出為别幾凄然之芳洙曰宇文乃外甥也故云自出宇文朝尚書之甥崔彧乙六切司業之孫尚書之子重泛鄭監前湖審郊扉俗逺長幽寂野水春來更接連錦席淹留還出浦葛巾欹側未回船蘇曰羊枯酒中回船葛巾欹側樽當霞綺輕𥘉散洙曰謝玄暉詩餘霞散成綺棹拂荷珠碎却圎趙曰梁元帝詩荷珠漾水銀不但習池歸酩酊洙曰習池事見玉腕騮詩欲伴習池遊注歸酩酊無所如趙曰山季倫至髙陽也輒大醉而歸君看鄭谷去夤緣洙曰鄭子真耕於谷口隨章留後新亭會送諸君新添新亭有髙會行子得良時日動映江幕風鳴排檻旗絶葷終不改勸酒欲無詞已墮峴山淚鄭曰在襄陽羊祜作鎮曰立碑記功於此因題零雨詩夏日楊長寧宅送崔侍御常正字入京探韻得罙字醉酒楊雄宅洙曰楊雄有宅一區雄家素貧嗜酒人稀至門時有好事者載酒肴從遊學升堂子賤琴洙曰宓子賤治單父彈琴不下堂而自治不堪垂老鬢還對欲分襟蘇曰黃歇秋天索寞愁對分襟天地西江逺趙曰言江陵送别之處星辰北斗深烏臺俯麟閣洙曰御史府中有柏樹常有野鳥棲宿其上麟閣正字所居陳子昂為麟臺正字長夏白頭吟洙曰古樂府白頭吟疾人以新間舊不能至於白首故以為名送靈州李判官新添羯胡腥四海回首一茫茫血戰乾坤赤氛迷日月黃將軍專䇿略幕府盛才良近賀中興主神兵動朔方與嚴二歸奉禮别新添别君誰暖眼將老病纒身出涕同斜日臨風看去塵商歌還入夜巴俗自為鄰尚愧微軀在遙聞盛禮新山東群盜散闕下受降頻諸將歸應盡題書報旅人巴西聞收京送班司馬入京新添聞道收宗廟鳴鑾自陜歸傾都看黃屋正殿引朱衣本中曰黃屋車蓋也劒外春天逺巴西勑使稀念君經丗亂匹馬向王畿奉送崔都水翁下峽新添無數涪江筏鳴橈揔發時别離終不久宗族忍相遺白狗黃牛峽朝雲暮雨祠所過慿問訊到日自題詩分門集注杜工部詩卷之二十一
