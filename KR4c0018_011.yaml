front:
  text: 分門集注杜工部詩卷第十一
  hash: sha256:fa8d03f8836d57364a801fa322df79fac09d13b1af463fe0bcb927ff30b27844
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_011-1a}
body:
  text: 紀行古詩四十首北征洙曰後漢班彪更始時避地涼州發長安作北征賦鮑曰至德二年公自賊竄歸鳯翔謁肅宗授左拾遺時公家在鄜州所在寇多彌年囏窶孺弱至餓死者有墨制許自省視八月之吉公始北征徒步至三川迎妻子故有是詩蘇曰此征詩識君臣之大體忠義之氣與秋色爭髙可貴也皇帝二載秋閏八月初吉杜子將北征蒼忙問家室蘇曰胡混自金陵歸永安蒼忙下馬問里人日家室何在趙曰皇帝言肅宗也二載言至德二載也自鳯翔歸鄜州此之謂北征也蒼忙荒寂之貌維時遭艱虞朝野少暇日顧慙恩私被詔許歸蓬蓽洙曰時房琯得罪甫上言琯罪細不冝免帝怒詔三司推問甫謝因稱琯宰相子少自樹立有大臣躰帝不省録詔放甫歸鄜省家修可曰傅長虞詩歸身蓬蓽廬樂道以忘飢拜洙曰一作奉辭詣闕下洙曰一云閣門怵惕久未出雖乏諌諍姿恐君有遺失炎曰言諌免琯趙曰甫不忍輕去其君恐君又有過舉而欲諌諍之君誠中興主經緯固密勿東胡反未巳臣甫憤所切洙曰東胡祿山也憤其亂也趙曰指言安慶緒也至德二載正月乙卯安慶緒已殺其父祿山而襲偽位矣揮涕戀行在炎曰天子行幸所在曰行在道途猶恍愡魯曰言心憂也乾坤含瘡痍憂虞何時畢靡靡踰阡陌人煙眇蕭瑟洙曰靡靡猶遲遲也詩行邁靡靡蕭瑟言人皆避亂無留居也所遇多被傷呻吟更流血回首鳯翔縣旌旗晚明滅洙曰時肅宗在鳳翔前登寒山重屢得飲馬窟洙曰古樂府有飲馬寒山窟行邠郊入地底涇水中蕩潏鄭曰潏以侓切洙曰邠州古豳國昔公劉據豳其地開元十三年改豳州為邠周禮雍州川曰涇汭猛虎立我前蒼崖吼時裂菊垂今秋花石載洙曰一作帶古車轍青雲動髙興幽事亦可悅山果多鎖細羅生雜橡栗鄭曰橡徐兩切櫟實也或紅如丹砂或黑如點􅃮曾曰五白若截肪黃如蒸栗赤若丹砂黑如點漆文齊有醜女鬢若飛蓬膚如點漆雨露之所濡甘苦齊結實洙曰言山中草木皆遂其生而人不遑寧止修可曰放莊子日月之所照霜露之所墜𬗟思桃源內益歎身丗拙洙曰桃源秦俗避亂之所坡陀望鄜畤鄭曰上芳無切下諸市切洙曰鄜畤漢武郊祀之所春秋時白狄之地修可曰前漢郊祀志秦文公黃蛇自天而下屬地其口止於鄜衍文公問史敦敦曰此上帝之徵君祠之於是作鄜畤用三性郊祀白帝焉以此考之鄜畤乃文公所作非漢武也谷巖互出沒竦曰互遞互隱見也我行巳水濵我僕猶木末洙曰木末言猶逺也鴟鳥洙曰一作梟鳴黃桑野鼠拱亂穴夜深經戰洙曰一作中場寒月照白骨蘇曰李隱塞上行云寒月上征壘沙與骨共白胡馬中夜嘶斷腸穹廬客潼關百萬師往者散何卒遂令半秦民殘害為異物洙曰翰以兵二十萬守潼關及其敗也火拔歸仁曰公以二十萬一日覆敗持是安歸遂執以降賊也魏文帝與吳質書云元瑜長逝化為異物吳質與太子賤亦云陳阮徐生而今各逝以為異物況我墮胡塵及歸盡華髮洙曰甫先陷賊而亡歸趙曰言盡華髮則其存者於離亂之久見其盡老也經年至茅屋妻子衣百結蔡曰董先生衣百結慟哭松聲逈悲泉共幽咽平生所驕兒顔色白勝雪見耶背靣啼垢膩腳不襪蘇曰徐貴妃幼時隱於庶人家滿身垢膩短衣腳無襪齊皇后見而竒其相以萬金易而育之修可曰沈佺期被彈詩云窮困多垢膩牀頭兩小女補綻才過膝海圖坼波濤舊繡移曲折天吳魯曰天吳水神也修可曰木玄虛海賦天吳乍見而髣佛山海經云朝陽之谷有神曰天吳是為水伯虎身人靣八手八足八尾青黃也及紫鳯修可曰山海經云丹穴山有鸑鷟鳳之屬也如鳳五色而多紫趙曰天吳海圖所畫之物紫鳯所繡之物也顚倒在短洙曰一作衽褐修可曰當作裋音竪蓋傳寫之誤也張衡應間曰士有解裋褐而襲黼黻方言曰關西謂襜䄖短者為裋褐前漢貢禹裋褐不完師古裋謂童竪所著之𥜗褐毛布也定功曰淮南子載寧戚飯牛歌曰䄈褐短衣適上骭老夫情懷惡嘔泄卧數日洙曰一作數日卧嘔泄蘇曰邵平不喜聞是非名利事輔聞即甚惡數日嘔泄古詩是非添嘔泄郍無洙曰一作能囊中帛救汝寒凛栗粉黛亦解苞衾稠稍羅列瘦妻靣復光癡女頭自櫛學母無不為曉粧隨手抹移時施朱鉛狼藉畫眉闊洙曰宋玉登徒子好色賦臣東家之子著粉則太白施朱則太赤生還對童稚蘇曰郭攸吾幸生還故鄉善對幼稚雖死心亦足矣似欲忘飢渴問事競挽鬢蘇曰林哲自回中還鄉兒童輩皆問事爭挽鬚鬢定功曰曹子建時謝安挽其鬚曰使君於此不凡誰能即嗔喝翻思在賊愁甘受雜亂聒新婦且慰意生理焉得説至尊尚蒙塵洙曰僖二十四年傳臧文仲對曰天子蒙塵于外敢不奔問官守幾日休練卒仰看天色改旁覺妖氣洙曰一作氛豁蘇曰張子房曰幾日妖氣開豁天宇明靜隂風西北來慘淡隨回鶻洙曰一作胡紇唐書回鶻列傳云回紇其先胸奴也元魏時號髙車部或曰敕勒訛為臧勒臣於突厥至隋丗韋紇復叛去自稱回紇回鶻言勇􅋧猶鶻然其王願助順其俗喜馳突蘇曰張騫曰西羌人俗喜馳馬鬪射送兵五千人洙曰時回紇以兵五千助順驅馬一萬匹此輩少為貴四方服勇決所用皆鷹騰破敵過洙曰一作如箭疾洙曰回紇至隋曰韋紇其人驍僵初無首長逐水草轉徙善騎射喜盜鈔聖人頗虛佇時議氣欲奪趙曰言主上雖虛心以待其破賊然時議恐畢竟為害所以氣欲奪也伊洛指掌收西京不足拔官軍請深入蓄鋭伺俱發趙曰此正時議以為國家有恢復中原之理官軍深入自足破賊不必專用回紇兵也此舉開靑徐旋瞻略恆碣昊天積霜露正氣有肅殺禍轉亡胡歲勢成擒胡月洙曰隋長孫晟傳曰臣夜望磧北有赤氣長百餘里如雨下垂按兵書名灑血欲滅胸奴冝在今日胡命其能久洙曰史思明傳優相謂曰胡命盡矣皇綱未冝絶憶昨狼狽初定功曰酉陽雜爼云狼狽是兩物前足絶短每行常駕兩狼失則不能動故丗言乖者為狼狽鄭曰狽博蓋切狼相負而行曰狼狽事與古先別姦臣競葅醢鄭曰葅臻魚切洙曰祿山長反亦國忠媒蝎之同惡隨蕩折不聞夏殷衰中自誅褒妲鄭曰妲當葛反洙曰褒姒妲己也此言誅楊貴妃也鮑曰魏泰云唐人詠馬嵬之事尚矣丗所稱者劉白劉禹錫曰官軍誅佞幸天子捨夭姬白樂天曰六軍不發無奈何宛轉蛾眉馬前死此乃歌詠祿山而明皇不得巳誅貴妃也豈特不曉文體蓋亦失事君之禮老杜則不然北征詩曰憶昔狼狽初事與古先别姦臣竟葅醢同惡隨蕩析不聞夏啇衰中自誅褒妲乃明皇鑒夏商之敗畏天悔禍賜妃子死官軍何與焉周漢獲再興宣光果明哲魯曰周宣王漢光武也桓桓陳將軍洙曰陳將軍玄禮也首謀誅貴妃國忠者仗鉞奮忠烈蘇曰汲黯仗鉞宣風奮於忠烈微爾人盡非于今國猶活定功曰孫楚為石仲容與孫皓書曰愛民恬國道家所尚又齊髙席手敕王廣之子珍國云卿愛人活國甚副吾意凄涼大同殿寂寞白獸闥洙曰大同白獸皆禁中宫殿名也都人望翠華洙曰司馬相如曰建翠華之旗佳氣向金闕蒼舒曰右按神異經東北大荒中有金闕髙百丈上有明月珠徑三丈光照千里中有金階西北入兩闕中名天門園陵洙曰園陵天子所葬之地固有神掃灑數不缺煌煌太宗業樹立甚宏逹徒步歸行彥輔曰贈李特進自鳯翔赴許州途經邠州作明公壯年值時危經濟實藉英雄姿洙曰天下英雄惟操與使君趙曰晉石苞遷司馬景帝中護軍而宣帝聞苞好色薄行以責景帝景帝答曰雖細行不足而有經國才國之社稷今若是武定禍亂非公誰趙曰魏賀拔軌稱字文泰曰宇文公文足經國武能定亂鳯翔千官且飽飰洙曰言公私窘迫且飽而巴未能輕肥衣馬不復能輕肥曽曰語乘肥馬衣輕裘與朋友共敝之而無憾青𫀆朝士最困者白頭拾遺徒步歸洙曰甫謁上於鳯翔受左拾遺曽曰史白頭如新傾蓋如故人生交契無老少論交何必先同調洙曰一作論心誰謂古今殊異代可同調妻子山中哭向天須公櫪上追風驃洙曰梁邵陵王啓連翩絶景凌若追風修可曰崔豹古今注始皇七馬一曰追風廣韻曰馬黃白色曰驃師曰追風驃言李公有驃騎疾可追風逐電甫欲就之一借櫪馬槽也彭衙行彥輔曰左傳文二年晉侯及秦師戰于彭衙注遏江縣西北有彭城魯曰馮翊郡合陽縣西有彭衙城憶昔避賊初北走經險艱夜深彭衙道月照白水山盡室久徒步逢人多厚顔洙曰書五子之歌顔厚忸怩詩云顔之厚矣羞愧之情見於靣貌如靣皮厚然故以顔厚為色愧參差谷鳥吟洙曰一作鳴不見遊子還師曰前年秋七月避賊次年春尚不得還故有此句癡女飢咬我啼畏猛虎聞懷中掩其口蘇曰王莽五歲語尤乖父聞之急掩其口抱於懷中反側聲愈嗔小兒強解事鄭曰強巨兩切故索苦李餐蘇曰時賊方收録衣冠汚以偽命而避難者方銷晦聲迹故託言女啼而恐虎狼聞也虎狼喻盜賊矣一旬半雷雨泥濘相攀牽鄭曰濘乃定切既無禦雨洙曰一云禦濕備徑滑衣又寒有時經洙曰一作最契闊竟日數里間野果充糇糧洙曰擊鼓死生契闊契闊勤苦也公劉乃褁糇糧卑枝成屋椽早行石上水暮宿天邊煙少留同家窪鄭曰烏瓜切欲出蘆子關故人有孫宰髙義薄曽雲洙曰陸士衡文髙義薄雲天同家窪廬子關皆地名也故人故舊之人也高義言其恩義高逺皆説孫宰也延客已曛黑洙曰曛黑薄暮也謝靈運詩夜聽極星闌朝遊窮曛黑張燈啓重門暖湯濯我足剪紙招我魂洙曰宋玉為屈原招魂從此出妻孥相視涕闌干洙曰言淚之墮闌干衆多貌趙曰談藪王元景使梁劉孝綽送之泣下元景無淚謝曰卿勿怪我别後闌干闌干淚不斷之貌衆雛爛熳睡師曰衆雛指甫諸子昆兄也喚起霑盤餐彥輔曰僖公二十二年晉公子重耳過曹曹大夫僖負羈饋盤餐置璧焉公子受食返璧趙曰爛熳言睡之熟也盧同亦云鶯花爛熳君不來皆其多而熟也誓將與夫子永結為弟昆遂空所坐堂安居奉我歡師曰惟孫宰尚義以所坐之堂而館我况復以盤餐禮之加恤故甫誓與之結為兄弟示其親愛之誠不相忘也誰肯艱難際豁達露心肝別來歲月周胡羯仍構患鄭曰胡官切何當有翅翎飛去墮爾前趙曰胡羯之患蓋指言安慶緒蓋安緒於正月弒父而襲偽位也公既陷賊而脫身達行在故寄此詩感其恩懷其人矣發秦州洙曰乾元二年自秦州赴同谷縣紀行十二首我衰更懶拙鄭曰懶魯旱切生事不自謀無食問樂土洙曰詩適彼樂土修可曰莊子云吾無糧我無食師曰同谷在京之南不經殘破故云樂土無衣思南州洙曰雪賦祼壤重繒注不衣國也謝靈運詩南州實炎德桂樹陵寒山趙曰楚辭嘉南州之炎德南州氣暖故思南州漢源十月交鮑曰唐志漢源屬同谷郡大槩美同谷風土多暄利於貧士非九月十月之交去秦也天氣如涼秋草木未黃落洙曰月令文蘇曰長沙十月草木尚未黃落加之蒸濕北人甚不冝風土况聞山水洙曰一作東幽栗亭名更佳洙曰今成州栗亭縣下有良田疇充腸多薯蕷鄭曰上常恕下常怒切洙曰永和𥘉有採藥於衡山者道迷糧盡過息岩下見一老公四五年少對執書告之以飢與之公物如薯蕷後不復飢田曰陶隱居云薯蕷處處有之掘取食之以充糧圖經云胡閩中出一種根如芋而枝紫色煎煮食之俱美彼上人呼曰薯音殊山海經云景山北望沙澤多薯藇音與署蕷同郭璞云根似芋可食江南人呼薯為儲語有輕重耳其實一種南北之産不同故其形類差别崖蜜亦易求蘇曰崖蜜乃櫻桃也陸機崖蜜珠滿藍王子敬帖云山隂崖蜜珠甘嘉得多尤妙本草載石蜜陶隱居云即崖蜜也高山嵓石間作之色靑赤味小噞食之心煩其蜂黑色似虻又木蜜呼為食蜜懸樹枝作之又土蜜於土中作之凡蜂作蜜皆須人小便以釀諸花乃得和熟狀似作飴須糵也掌禹錫云按尋常蜜亦有木中或土中作者北方地燥多在土中南方地儑多在木中各隨土地所有而生其蜜一也崖蜜則是一蜂如陶所説出南方嵓嶺間生懸崖上蜂大如虻房著嵓窟以長竿刺令蜜出承取之多至三四石入藥用勝於凡蜜張華博物志云逺方山郡幽僻處出蜜所著巉嵓石室非攀緣所及唯於山頂藍輿自懸挂下遂得採取洪覺範冷齋夜話載蘇東坡橄欖詩云待得微甘回齒頰巳輸崖蜜十分甜乃云崖蜜事鬼谷子曰照夜清螢也百花醴蜜也崖蜜櫻桃也以子美此詩觀之十月間恐無櫻桃則崖蜜更無異議也密竹復冬笋清池可方舟洙曰西都賦鏡淸流又方舟並騖俯仰極樂趙曰謝靈運登石門最髙頂詩密竹使徑迷方舟並兩船也爾雅大夫方舟雖傷旅寓逺庶遂平生遊洙曰傷一作云此邦俯要衝實恐人事稠應接非本性蘇曰阮嗣宗頗倦人事應接進退非吾本性趙曰上子敬過越州見潭壑澄徹清流寫注云山川之美使人應接不暇登臨未銷憂洙曰王仲宣登樓賦登兹樓以四望聊假日以銷憂溪谷無異石塞田始微收鄭曰塞先代切豈復慰老夫惘然難久留日色隱孤戍洙曰惘一作焹謝玄暉詩日隱澗疑空趙曰何遜詩曰團團日隱洲烏啼滿城頭烏啼滿城頭中宵驅車去飲馬寒塘流洙曰古詩飲馬長城窟磊落星月髙鄭曰磊魯猥切趙曰古詩兩頭纎纎新月生磊磊落落向曙星蒼忙雲霧浮修可曰庾信詩寂寞歲隂窮蒼茫雲貌同大哉乾坤內吾道長悠悠師曰言天地雖寬而吾道雕喪若無所容亦終於此而已矣故曰吾道長悠悠赤谷天寒霜雪繁洙曰正月繁霜趙曰孔子曰天寒既至霜雪既降遊子有所之洙曰李陵遊子暮何之豈但歲月暮洙曰古詩涼涼歲云暮又歲月忽巳晚沈休文飛光忽我道豈止歲云暮重來未有期洙曰古詩會靣安可知蘇武相見未有期晨發赤谷亭險艱方自兹洙曰任彥升晨發冨春渚又云滿險方自知亂石無改轍洙曰曹子建中塗絶無軌改轍登髙岡趙曰不以亂石之故而改轍我車巳載脂洙曰泉水載脂載轄還車言邁山深苦多風洙曰魏文帝苦哉行溪谷多風霜露沾衣落日童稚飢洙曰苦寒行行行日已逺人馬同時飢悄然村墟逈煙火何由追洙曰曹子建中野何蕭條千里無人煙趙曰四望無煙火公詩言童稚苦飢而村墟尚逺煙火無所追求以造飯舊注非師曰按地理志秦州隴城縣有大隴山亦曰隴首山三秦記之其阪九回上者七日乃越上有清水四注下俗歌曰隴頭流水鳴聲幽咽遙見秦川肝腸斷絶甫蓋上大隴山故云云謂其阪九回故也貧病轉零落洙曰一云飄零曹子建零落歸山丘謝靈運萬事俱零落故鄉不可思洙曰又鬱鬱多愁思綿綿多故鄉文帝若哉行還望故鄉鬱何壘壘常恐死道路洙曰語寧死於道路乎永為髙人嗤洙曰古詩但為後丗嗤趙曰後漢光武為賊所敗謂耿弇曰幾為虜嗤鐵堂峽山風吹遊子縹眇乘險絶鄭曰縹普召切眇弭沼切趙曰文選神仙縹眇逢彥曰縹眇衣裳飛揚貌硤形藏堂隍立之曰山臺如堂皇峽藏于兩山之間壁色立積鐵徑磨穹蒼蟠洙曰魏文帝修條摩蒼天常道立深谷下無底髙巖暨蒼穹趙曰徑之屈蟠而摩天以言高也古歌黃鵠摩天極髙飛石與厚地裂修纎無限竹嵌空太始雪洙曰限一作垠空一作孔威遲哀壑底洙曰殷仲文哀壑叩虛無趙曰詩周道倭遲注云歷逺貌而變用威遲字徒旅慘不恱洙曰謝靈運徒旅苦奔峭顔延年改服飾徒旅首路局險艱又隱閔徒御悲威遲良馬煩水寒長冰橫魯曰謝靈運石橫水分流我馬骨正折鄭曰旨熱切洙曰詩我馬瘏矣荀子折筋絶骨生涯抵弧矢盜賊殊未滅飄蓬踰三年趙曰抵者逢抵之抵抵弧矢則遭用兵之時也飄蓬出商君書曰夫飛蓬遇飄風而行千里乘風之勢也古詩云轉蓬離本根飄飄畏長風回首肝肺熱師曰弧矢言盜賊興也自盜賊竊發以來生涯抵棄不成家計抵棄也肝肺熱言憂則內熱也鹽井彥輔曰蜀都賦家有鹽泉之井鹵中草木白洙曰地舄鹵者生鹽修可曰許愼説文曰鹵鹽地也東方謂之斥西方謂之鹵又漢宣帝常困於蓮勻鹵中注蓮勺縣有鹽池廣十餘里其鄉人名鹵中師古曰今在櫟陽縣靑者官鹽煙蘇曰郭思瑶溪詩話作直者靑鹽煙官作既有程洙曰程限也趙曰陳琳詩曰官作自有程煮鹽煙在川洙曰前漢吳王東煮海為鹽汲井歲榾榾鄭曰古忽切木名洙曰莊子天地篇子真見漢隂丈人方將為圃畦鑿隧而入井抱甕而出灌榾榾然用力甚多而見功寡出車日連連洙曰駢拇篇又奚連連如膠漆纏糾連結也天啓曰連連言運載不輟也自公斗三百轉致斛六千洙曰轉致言貿易也十三百斛六千言其利相倍什君子慎止足修可曰老子知足不辱張景陽詠史詩逹人知止足小人苦喧闐我何良嘆嗟物理固自然洙曰一云亦固然魯曰物有利則人爭取之此理之自然何可嘆嗟乎寒硤鄭曰侯夾切魯曰寒硤雲門皆秦地名行邁日悄悄洙曰詩行邁靡靡又憂心悄悄黃曰逺行曰邁山谷勢多端雲門轉絶岸積阻霾天寒鄭曰霾謨皆切洙曰爾雅釋天風而雨土為霾趙曰海賦絶岸万丈寒峽不可度我實洙曰一作貧衣裳單趙曰庾信梅詩真悔著衣單况當仲冬交帥曰甫自秦至此巳十一月故云仲冬交甫於詩皆以年月紀欲後丗有所考其行止也不然何以謂之詩史乎泝沿增波瀾野人尋煙語行子傍水餐此生免荷殳鄭曰荷何佐切負也洙曰候人詩荷戈與殳蘇曰劉肅退居嵩嶺恬然自樂謂兒姪曰尓輩當勉力耕舂此生何望青雲致身儻免荷戈執殳其幸亦非細未敢辭路難法鏡寺身危適他州黃曰身危謂避關輔之飢也勉強終勞苦蘇曰陶侃勉強仕宦終亦勞心苦力但歸老田園養此疲􅒒可矣神傷山行深秦曰山行深謂經九回坂頗令人傷神愁破崖寺古修可曰破除也謂望見法鏡寺可以駐足忽使人愁悶破除也嬋姢碧鮮淨洙曰吳都賦檀欒嬋姢玉潤碧鮮謂竹趙曰碧鮮言竹也竹謂之嬋姢唐孟郊有三嬋姢詩曰竹嬋姢月嬋姢人嬋姢也蕭摵寒籜聚鄭曰摵子六切又所隔切到也洙曰潘安秋興賦庭樹戢以灑落謝靈運初篁苞緑籜盧子諒摵摵芳葉零蘂蘂紛華落射雉賦陳柯摵以改舊籜撻各切回回山根水洙曰山一作石劉公幹回回自昏亂冉冉松上雨泄雲蒙清晨洙曰魏都賦窮岫泄雲日月恆翳顔延年泄雲巳慢慢夕雨亦淒淒田曰泄與泄同泄猶出也清晨出曹子建詩多使如名都篇雲散還城邑清晨復來還初日翳復吐洙曰陶潛景翳翳以將入宋玉賦白日初出曹子建微隂翳陽景曹顔遠密雲翳陽景朱甍半光炯鄭曰甍謨耕切炯古逈切光也戶牖粲可數鄭曰色主切拄䇿忘前期趙曰沈全期云紅日照朱甍出洙曰一作髙蘿巳亭午洙曰天台賦羲和亭午定功曰廣雅日在竹冥冥子規叫洙曰子規一名杜宇蜀人以為望帝魂趙曰谷説云望帝化為子規微徑不復取師曰甫欲小憩此寺奈聞子規聲起人思鄉况徑陌微窄難以取就一遊於是前邁故云云青陽峽塞外苦厭山南行道彌惡師曰天下山惟南最多甫自秦適同谷是自北之南也岡巒相經亘洙曰盧子諒岡巒挺茂樹雲水氣參錯洙曰謝靈運詩遡流觸驚急臨坼阻參錯林逈硤角來天窄洙曰一作穿壁靣削鄭曰窄側格切磎西五里石鄭曰磎苦奚反今作溪奮怒向我落仰看日車側蘇曰後漢李尤九曲歌安得力士翻日車俯恐坤軸弱蘇曰張化曰日車轉側羲和無功趙曰淮南子注曰乘車駕以六龍坤軸即地軸也此言落石之聲勢以其聲震天而日車為之側其勢可以壓地而坤軸為之弱也魑魅嘯有風鄭曰上丑知下明祕切洙曰天台賦始經魑魅之塗鮑明逺蕪城賦水魅山鬼野鼠城狐風嘷雨嘯昏見晨趨蘇曰何遜詩云林間夕風生隔水魑魅嘯工部言亂丗無正人使魑魅向風而嘯霜霰浩漠漠昨憶踰龍坂洙曰四愁詩欲往從之隴坂長趙曰漢書天水郡注有大坂名曰龍坂偶曰秦州記曰隴坂九曲不知髙幾里髙秋視吳嶽泰伯曰周禮雍州其鎮曰嶽山注云吳嶽也漢志吳山在汧縣西彭曰國語謂之西吳秦都咸陽以為西嶽東笑蓮花卑見蓮峯望忽開注北知崆洞薄見聊欲倚崆洞注山名也超然侔壯觀鄭曰古亂切洙曰景福殿雖咸池之壯觀夫何足以比讎趙曰言靑陽峽山超特而起可侔吳嶽之壯觀司馬相如曰此天下之壯觀也巳謂殷寥廓鄭曰殷音隱洙曰天台賦太虛寥廓而無閡曹子建大谷何寥廓突兀猶趂人及兹嘆冥寞洙曰嘆一作欲趙曰謂至其趂人之際歎神造之冥寞而不可測也龍門鎮細泉兼輕冰沮洳棧道濕鄭曰上將茹下羊恕切漸濕也棧士諌切又士限切木道也洙曰魏汾沮洳潤濕之處故為沮洳漢髙紀王燒絶棧道師古曰棧即閣也今謂之閣道不辭辛苦行迫此短景急洙曰舞鶴賦急景凋年歐曰短景急言日短急於奔程也石門雲洙曰一云雪雲雷隘洙曰一作溢古鎮峯巒集旌竿暮慘淡風水白刃澀鄭曰色立切石滑也胡馬屯成臯洙曰成臯滎陽之間胡馬回紇也趙曰成臯鞏落之地意言安史之兵耳舊以回紇非也是時乾元二年之冬回紇未反不可妄引也革曰胡馬指祿山之兵也防虞此何及洙曰言巳後時矣嗟爾逺戍人山寒夜中泣洙曰士衡苦哉逺征人拊心悲如何石龕熊羆咆我東鄭曰咆蒲交切虎豹號我西鄭曰號胡刀切洙曰魏武帝苦寒行熊羆對我蹲虎豹夾路啼我後鬼長嘯我前狨又啼鄭曰狨而中切獸也山鬼雨嘯見前蘇曰楊大年云狨之形似鼠而大尾長作金色生川峽深山中人以藥失射殺之取其尾為卧褥鞍𬒳坐氊之用狨甚愛惜其尾既中毒即嚙斷其尾以擲之惡其為身害也蓋輕捷善緣木猿狖之類趙曰回我乃公之新格劉琨扶風歌止曰鹿遊我前候戲我側兩句而巳天寒昏無日山逺道路迷洙曰登高賦白日忽其將匿天慘慘而無色恨賦白日西匿岱雲寡色蘇曰梁諤入黔中山逺林茂鳥道欹危煙霧冥暗咫尺路迷驅車石龕下仲冬見虹霓洙曰月令孟冬之月虹藏不見蘇曰惠帝時仲冬虹霓晝見三日國政頽圯節令不時諸矦弄權趙曰虹見非時怪所見也師曰虹隂氣也孟冬之月虹不見今見於仲冬謂隂勝於陽有臣侵君之象伐竹洙曰一作木者誰子悲歌上洙曰一作抱雲梯趙曰雲梯字起於墨子曰公輸班為雲梯為官采美箭五歲供梁齊趙曰􅎥使爾雅東南之美者有會稽之竹箭也梁謂汴州齊謂今之山東皆安史之兵所在也故采箭以供官用矣苦云直簳盡鄭曰簳口旱切亦作笴無洙曰一作應以充提携洙曰仲冬之月日短至則言伐木取竹箭堅成極時蘇曰郭璞秋日携𣏌菊親與大鮑曰貧者無以獻聊不空手充提携故也奈何漁陽騎鄭曰竒寄切颯颯驚蒸黎洙曰祿山之亂皆漁陽之士趙曰魚陽騎指言安慶緒之兵也師曰祿山反長驅陷兩京天下震駭故云颯颯如風之疾也積草嶺連峯積長隂詠曰謂草木隂翳也白日遞隱見鄭曰遞待禮切更也見形甸切詠曰言日光映射一有一無也颼颼林響交鄭曰颼踈鳩切慘慘石變狀山分積草嶺路異明水縣蘇曰劉安微時為明水縣吏旅泊吾道窮洙曰希聲曰仲尼曰吾道窮矣王弼曰仲尼旅人衰年歲時倦卜居尚百里休駕投諸彥洙曰江淹金閨諸彥蘇曰李尤休駕沐浴投諸英彥趙曰屈原有卜居篇諸彥出謝靈運擬鄴中詩序有云二三諸彥舊注所引在後矣邑有佳主人情如巳會靣趙曰古詩古稱會靣難來書語絶妙洙曰王粲云蘇曰沈約得來書詞語絶妙筆墨道徑無一糝塵埃氣昧可愛逺客驚深春食蕨不願餘茅茨眼中見洙曰謝靈運想見山阿人薛蘿若在眼陸士衡髣佛眼中人趙曰左太沖詠史詩飲河期滿腹貴足不願餘魏文帝詩曰眼中無故人泥功山朝行靑泥上暮行青泥中泥濘非一時鄭曰寧乃定反版築勞人功不畏道路鄭曰一作途永反將洙曰一云乃將一云及此汨沒同趙曰公言反同版築之人同汨沒於泥中也白馬為鐵驪洙曰馬靑色曰驪小兒成老翁哀猿鄭曰一作猱透却墜死鹿力所窮趙曰詩野有死鹿故用之鹿之所以死以力窮於泥中走困也寄語北來人後來莫匆匆發同谷縣鄭曰同州縣名師曰乾元二年甫寓同谷屬飢飲又入蜀此詩以下皆沿道起行賢有不黔突聖有不暖席洙曰文子曰墨子無黔突孔子無暖席况我飢愚人焉能尚安宅洙曰聖賢尚不免此吾豈能安宅乎始來兹山中休駕喜洙曰一作嘉地僻奈何迫物纍一歲四行役大臨曰詩父曰嗟呼季行役師曰一歲之中凡四行役夏發華州十月離秦州故詩云漢源十月交十一月至成州故云仲冬見虹霓十二月發同谷故云云忡忡去絶境饒曰忡忡心變貌杳杳更逺適停慘洙曰一作驂龍潭雲回首白崖石洙曰一作虎崖臨𡵨别數子握手淚再滴洙曰江淹鐏酒送征人握手淚如霰雖舊情深知洙曰一云交情無舊深趙曰公於同谷寓居未久蓋多新交而惜别之情則如故舊之深逺窮老多慘戚夢符曰右按史記翟公為廷尉賔客交集後免門可張雀羅後復為廷尉賔客欲至翟公乃署門曰一貴一賤交情乃見平生懶拙意偶值棲遁迹洙曰謝靈連既枉隱淪客亦棲肥遁賢郭景純京華遊俠客山林隱遁棲去住與願違趙曰嵆康云事與願違仰慙林間翮洙曰陶潛遲遲出林翮蘇曰裴寧夫住不能如願四海干戈未息出門無食仰見飛鳥顧子曰吾弗如此物羽翮飲棲出入自得長嘆久之孝祥曰林間鳥尚得休憩而甫奔赴無定居反有愧於林間之翮乎木皮嶺首路栗亭西鄭曰首音狩謂命車向西行也尚想鳳凰村馬曰依悒不忍去之意季冬携童洙曰一作糿稚辛苦赴蜀門魯曰即劒門也南登木皮嶺艱險不易論汙流被我體洙曰喻蜀檄流汙相屬大觀曰漢史汗流洽背祁寒為之暄洙曰書冬祁寒逺岫爭輔佐洙曰謝玄暉窗中列逺岫千巖自崩奔洙曰雪賦瞻山則千嵓俱白謝靈運洲島驟回合圻岸屢崩奔始知五嶽外别有洙曰一作見他山尊趙曰此據其最髙而形容之别無它譏意惟五嶽言尊字後漢張旭華山碑云山莫尊於嶽仰干洙曰一作看塞大明鄭曰塞悉則切俯入裂厚坤師曰自逺岫爭輔佐以下託意譏祿山不知君臣之義岫尚左右輔佐此山之尊千巖為之崩奔如千官奔走以趍王事者也别有他山尊喻祿山僣稱帝號大明君道也仰干塞大明言祿山自髙大平犯國紀而掩蔽於君俯入裂厚坤言郡縣之地為祿山所割據也再聞虎豹鬪洙曰劉安招隱士虎豹鬪兮熊羆咆蘇曰徐庶見孔明曰虎豹再鬪必有一傷先生何法格之孔明曰使三分即無鬪矣屢局風水昏髙有廢閣道洙曰棧道也摧折如短轅洙曰短一云斷下有冬青林洙曰今之楩柟也鮑曰木名經冬不雕今所在多有之石上走長根西崖特秀發煥若靈芝繁潤聚金碧氣洙曰蜀都賦金馬馳先而絶影碧雞倐忽而擢儀連珠金碧之嵓必辱鳯舞之使清無沙土䀶憶觀崑崙圖洙曰一作墟日擊玄圃存洙曰玄圃涼風在崑崙中見淮南子乂庾肩吾有從皇太子出玄圃詩炎曰莊子目擊而道存南史梁簡文自於玄圃講老莊對此欲何適默傷垂老魂趙曰蓋以崑崙之玄圃比木皮嶺也葛仙翁傳曰崑崙一曰玄圃白沙渡畏途隨長江洙曰莊子畏途者十殺一人則父子兄弟相戒芻曰釋文云險阻道可畏懼者也渡口下絶岸趙曰海賦云絶岸千里羌池上舟楫鄭曰差初加切趙曰差緩進之貌起於詩差池其羽杳窕入雲漢朱曰陸士衡遺響入於雲漢天寒荒野外日暮中流半趙曰鶡冠子云中流失船一壷千金我馬向北嘶洙曰古詩胡馬嘶北風山猿飲相喚水淸石礧礧鄭曰魯水切沙白灘漫漫洙曰九歌石磊磊兮葛蔓蔓沈休文歸海水漫漫逈洙曰一作倐然洗愁辛蘇曰王夷甫得書洗我愁辛多病一踈散蘇曰嚴助遊陸渾山歎曰多病無聊來此踈散以釋沈鬱之興高壁抵嶔崟洙曰一作岑鄭曰上去金下助針切趙曰選詩南山鬱嶽金洪濤越凌亂洙曰曹植泛舟越洪濤惠連淸波時凌亂臨風獨回首蘇曰王筠臨風長想英猷時復回首東望攬轡復三嘆洙曰王夷甫慨然攬轡古詩一彈再三嘆曹子建欲還絶無蹊攬轡止踟蹰朋曰范滂攬轡慨然有澄青天下之志趙曰左傳置食三歎禮記一唱三歎師曰甫遭亂離故忘於奔走羈旅是以有范滂澄清之志奈何時不再見用亦止於再三咨嗟傷不得志也水會渡魯曰一云水回渡山行有常程中夜尚未安蘇曰寇恂中夜悲愁不得安寢微月沒巳久崖傾路何難洙曰謝靈運崖傾光難留蘇曰程煜傾斷路人馬不通如逢泥木去住多難趙曰丘希範云崖傾嶼難傍大江動我前洙曰謝玄暉詩大江流日夜洶若溟渤寬洙曰謝靈運漲無端倪鮑明遠穿池類冥勃篙師暗理楫鄭曰篙始勞切刺船竹洙曰謝靈運理棹遄還期遵渚騖修坰夢符曰古按左太沖吳都賦稿工楫師選自閩禺習御長風狎玩靈胥責千里於十隂聊先期而須臾歌笑輕波瀾蘇曰謝眺新城路上詩吳兒未習水歌笑欺波瀾霜濃木石滑風急洙曰一作烈手足寒入舟巳千憂洙曰謝靈運入舟陽巳微陟巘仍萬盤洙曰詩陟則在巘趙曰倣陸士衡詩仰陟髙山盤回眺洙曰一作出積水洙曰作石外趙曰文子云積水成海始知衆星乾逺遊令人瘦衰疾慙加餐洙曰古詩思君令人老又努力加餐飯謝靈運衰疾當在斯楊曰曹子建沉憂今已老又吾得行遠遊逺遊欲何之趙曰屈原有逺遊賦飛仙閣土洙曰一作出門山行窄微徑緣秋豪洙曰一云徑微上秋豪蘇曰張儀過太行曰微徑穿雲仰視緣雲若秋毫蟠折棧雲闌干峻梯石結構牢洙曰見新亭結構罷注萬壑欹踈林洙曰一作竹趙曰顧㨟之萬壑爭流積隂帶奔濤寒月外淡泊長風中怒號洙曰莊子風作則萬竅怒號歇鞍在地底始覺所歷高往來雜坐卧人馬同疲勞蘇曰李陵人疲馬勞一日三戰趙曰句法使苦寒行人同馬時飲浮生有定分飢飽豈可逃蘇曰吳律飢飽榮悴人之定分非所苟欲可得也歎息謂妻子我何隨汝曹洙曰馬援傳吾欲使汝曹聞人過失如聞父母之名五盤魯曰謂棧道盤屈有五重五盤雖云險山色佳有餘洙曰陶潛山氣日夕佳仰凌棧道細洙曰道一作閣漢祖入漢中燒絶棧道俯映江木踈地僻無網罟蘇曰宋王出遊見山鳥自得玉歎曰此中林幽地僻無網罟彈射冝爾盡其天年也仲尼所謂時哉時哉宋玉此言微諷蓋明屈平之非也水清反多魚趙曰揚雄水至清則無魚公據所見而反用之好鳥不妄飛師曰淵明鳥倦飛而知還甫傷奔走曾好鳥之不若野人半巢居洙曰禮運冬居櫓巢王康居皆在太平時亦有巢居子選巢居知天寒泰伯曰搜神記云巢居知風喜見淳朴俗天啓曰莊子澆淳散朴坦然心神舒東郊尚格鬪洙曰費誓東郊不開蘇曰范曾東郊金革不息尚思格鬪戰壘滿目政散民流田畒蕪沒寧不心痛趙曰指言東京之東郊安史之兵所在公詩屢言之矣格鬪出前漢見上注巨猾何時除洙曰東京賦巨猾間亹故鄉有弟妹流落隨丘墟洙曰曹子建零落隨丘山成都萬事好豈若歸吾廬洙曰行客雖云樂不如皂旋歸李白錦城雖云樂不如早還家陶潛吾亦愛吾廬十朋曰李白詩錦城雖云樂不如早還家與此同意龍門閣淸江下龍門魯曰按地里志施州清江縣絶壁無尺土趙曰謝靈運云晨䇿尋絶壁長風駕髙洙曰一作白浪洙曰郭景純吞舟浮海底高浪駕蓬英趙曰言風駕起之浩浩自太古洙曰古詩浩浩隂陽移趙曰浩浩水貌音上聲其在水言之如醴泉湧而浩浩危途中縈盤洙曰一云縈盤道仰望垂線縷滑石欹誰鑿洙曰謝靈運苔滑誰能步浮梁裊相柱洙曰西京賦峙遊極於浮柱陸左公形聲飛棟勢超浮柱趙曰滑石自是石之滑浮梁自是梁之浮舊注所引雖旁見而其義非也目眩隕雜花頭風吹過雨洙曰一云飛過雨趙曰滑在之欹浮梁之裊皆難行之地故目生昡頭生風矣目眩出史心亂目眩之昏眩如見雜花之隕落頭風出魏太祖讀陳淋檄草頭風自愈頑或生風如過雨之吹皆言其地險絶而然也百年不敢料洙曰潘安仁人生天地間百年孰能要趙曰劉機百年興廢長知吾孰敢料也一隊那得取飽聞洙曰一作知經瞿塘洙曰瞿塘峽名足見渡大庾洙曰大庾嶺名趙曰以龍門閣之險峻推言而比之也瞿塘峽在巫之下大庾嶺在虔州之前終身歷艱險恐懼從此數師曰瞿塘大庾雖險不若此閣道為險之至甫至此恐懼若屈桓數險阻之處當從此為始也石匱閣季冬日已長唐曰日自至節後旋長宫中以紅線量日影長至遂添一線山晚半天赤何曰謂反照也蜀道多草花江間饒竒石洙曰江淹詩崦山多靈草海濵饒竒石石匱曾波上臨虛蕩髙壁夢符曰右按郭璞江賦迅雖臨虛以騁巧孤玃登危而雍容清暉回群鷗洙曰謝靈運詩山水含清暉暝色帶逺客洙曰謝靈運林壑斂暝色羇栖負幽意感歎向絶迹信甘孱懦嬰鄭曰上鋤山下奴卧切弱也不獨凍餒迫優遊謝康樂洙曰晉謝玄暉也修可曰謝玄暉封康樂公孫靈運襲其封與何長瑜等以文章賞會共為山澤之遊詩家稱康樂乃靈運非玄暉也以南史考之謝密傳云謝渾為韻語奬勸靈運等曰康樂誕通度實有名家韻王籍傳云籍為詩慕謝靈運至其合也殆無愧色時人咸謂康樂之有籍如仲尼之有丘明武陵昭王華傳云曅與諸王共作短句詩學謝靈運躰髙帝曰康樂放蕩作躰不辨有首尾安仁士衡深可宗尚簡文與湘東王書云時有效謝康樂裴鴻臚文者抑亦感焉何者謝客吐言天拔出於自然時有不拘是其糟粕亦謂靈運也因是詩注以康樂為謝玄故詳辨之云放浪陶彭澤洙曰陶潛彭澤令吾衰未自由謝爾性有適洙曰有一作所師古曰謝陶輩優遊放浪無所繫滯今甫未能自由止於二子適性之樂頗有感焉桔柏渡鄭曰桔居屑切靑冥寒江渡趙曰楚辭據靑冥而攄虹靑靑冥冥髙逺之貌駕竹為長橋竿濕煙漠漠洙曰一云竹竿濕漠漠謝玄暉生煙紛漠漠江水風蕭蕭洙曰水一作永風蕭蕭兮易水寒霸王鄭曰霸王于况切并吞與割據洙曰李特送流人至劒門箕踞四顧太息曰劉禪有此形勢而束手於人乎遂潛謀割據極力不相讓趙曰遂使英雄者見霸王特在髙視之間可以為之於是或并或吞或割據皆極力為之而不少讓吾將罪真宰洙曰見前注趙曰莊子若有真宰存焉而不得其朕意與鏟疊嶂鄭曰鏟楚産切洙曰海賦鏟臨崖之阜逹蘇曰袁盎曰諸公欲鏟連疊嶂而造物復如何趙曰韻書云平鐵也恐此復偶然臨風默惆悵洙曰成都自前漢公孫述後漢劉備晉李雄王建孟知祥之屬皆因中原多事恃險割據也趙曰末四句則公之忠憤之辭矣師曰恐當肅宗中原未平之日偶復為割據之禍者是以臨風惆悵而為國家默為之慮也鹿頭山彥輔曰按地理志漢州德陽縣有鹿頭山鹿頭何亭亭是日慰飢渴趙曰西都賦之言宫室曰狀迢迢以亭亭陸士衡詩願保金石軀慰妾常飢渴連山西南斷俯見千里豁洙曰自秦入蜀山嶺重復極為險阻及下鹿頭關東望成都沃野千里蔥鬱之氣乃若煙霞靄然遊子出京華劒門不可越洙曰京華一云咸京蒼舒曰古按文選張孟陽劒閣銘曰惟蜀之門作固作鎮是曰劒閣壁立萬仞酈元水經注曰劒戍北去大劒三十里連山絶險飛閣相連故謂之劒閣田曰鍾會平蜀至綿谷語左挍曰山川懸遠巳盡咫尺劍門不可開越何計入蜀公可籌度及兹阻險盡始喜原野闊殊方昔三分霸氣曽間發鄭曰間居莧切師曰昔魏吳蜀三分天下劉備據此一方以建霸王之業故云云天下今一家洙曰隋書今天下一家韓曰今肅宗中興天下巳一家矣雲端失雙闕洙曰華闕雙邈重門洞開又飛升躡雲端夢符曰右按神異䋌曰東南有石井其方百丈上有二石闕俠東南靣上有蹲熊有榜著闕題曰地户又古樂府仙人篇閶闔正嵯峨雙闕萬丈餘又公興孫遊天台賦雙闕雲竦以夾路瓊臺中天而懸居朱闕玲瓏於林間玉堂隱映於髙隅顧愷之啓蒙記注曰天台山列雙闕於青雲中上有瓊樓瑶林醴泉仙物畢具趙曰雲端祖出杖乘樂府曰美人在雲端天路隔無期失雙闕天子之闕也祖於元聖本紀曰許由欲觀帝意曰帝坐華堂靣雙闕君之榮願得矣公詩言失雙闕者以天下既一家皆為臣屬故所僣擬天子之闕不復見矣悠然想楊馬繼起名硉兀鄭曰硉即兀切危石也洙曰左太沖作蜀都賦江漢炳靈丗載其英欎若相如皭若君平王褒暐曄而秀發揚雄含章而挺生揚揚雄馬馬相如有文洙曰一作才令人傷師曰揚馬二子皆蜀人有文章皆不顯用於漢甫至此追思二子亦若巳之不遭其時也何處埋爾骨紆餘脂膏地髙曰紆餘廣逺貌脂膏地言其肥沃也慘淡豪俠窟洙曰蜀都賦外負銅梁於岩渠內函要害以膏腴趙曰成都冨饒之地故公指為脂膏也豪俠窟見郭璞云京華遊俠窟公變其字爾杖鉞非老臣宣風豈專達兾公柱石姿論道邦國活斯人亦何幸公鎮踰歲月洙曰公謂僕射裴兾公冕也言裴公為尹尚有歲月之期此斯人之所以幸也此句可以見杜公𥘉來成都非為嚴武而來也成都府修可曰是詩子美寓意深矣淮南子曰西景垂在樹端謂之桑榆也説曰桑榆之景理無逺照今也日薄桑榆而其光翳翳止足照我衣裳則不能逺照矣以喻明皇以太上皇居西內也初月不髙出衆星尚爭光而喻肅宗即位未久而史思明之徒尚在也蓋肅宗於天寶之丁酉而子美乾元庚子至成都以其時考之故知其寓意如此也鄭曰劎南西路蜀州也翳翳桑榆日洙曰歸去來景翳翳以將入東觀記收之桑榆江淹曾是迫桑榆歲暮從所東趙曰桑榆晚日也照我征衣裳蘇曰團圎江上月照我征衣裳趙曰沈嗣宗詠懷詩曰灼灼西隤餘光照我衣我行山川異忽在天一方蘇曰曹植與陳琳疏曰昔與子西園聮鑣遊語笑嚮今忽睽别在天一方後會邈然莫可得也古詩曰各在天一方甫亦全用又云各在天一涯觀子美詩固知為後丗史不虛語矣劉曰成都偏在西故云天一方但逢新人民洙曰曹子建不見耆舊老但覩新少年山川阻逺別從會日見長未卜見故鄉大江東流去洙曰謝玄暉大江流日夜遊子去日長洙曰短歌行去日苦多曽城填華屋鄭曰填陟刃切定也洙曰西都賦闐城溢郭旁流百㕓曹子建生存華髮處趙曰曾城層起之城淮南子云崑崙山上有層城九重華屋史記平原君傳歃血於華屋之下季冬樹木蒼洙曰西都賦靈草冬榮神木叢生東京賦修竹冬青蜀都賦寒卉冬馥髙唐玄木冬榮趙曰前於發同谷縣題下公自注云乾元二年十二月一日自隴右赴劒南紀行而今詩云季冬樹木蒼則至成都乃是月也元祐中胡資政守蜀作草堂詩碑引云先生至成都月日不可考蓋不詳此也喧然名都會吹簫間笙篁洙曰曹子建名都多妖汝京洛出少年詩吹笙鼓篂蒼舒曰右按漢志云勃碣之間一都會也信美無與適洙曰王仲宣登樓賦雖信美而非吾士兮曾何足以少留側身望川梁洙曰四愁詩側身西望涕沾裳魏文帝欲濟河無梁鳥雀夜各歸中原杳茫茫趙曰觀衆鳥識巢而夜歸乃思其中原故鄉之地而不得返𥘉月出不髙衆星尚爭光師曰初月喻肅宗𥘉即位衆星喻安史之徒與天子抗衡自古有羇旅我何苦哀傷洙曰鮑明逺古來共如此非君獨撫膺長門賦衆雞鳴而愁子兮起視月之精光觀衆星之行列兮畢昴出於東方九辨云仰明月而太息步列星而極明師曰此乃甫自寬之辭將適吳楚留別章使君留後兼幕府諸公得栁字我洙曰一作南來入蜀門歲月亦巳久洙曰古詩歲月忽巳晚豈惟長兒童自覺成老醜洙曰阮籍詩朝為美少年夕暮成醜老常恐性坦率失身為杯酒洙曰古詩失意杯酒間近辭痛飲徒折節萬夫洙曰一作人後洙曰前漢郭解年長臾折節為儉以德報怨蘇曰邢充胸襟恢廓豈折其髙節挫其鋭志從萬夫之後為參御之徒歟趙曰此言喪失其身特以愛酒而已所以下有折節云者摧折其節血悔過之義舊注引古詩失意杯酒間非是昔如縱壑魚洙曰王子淵頌如巨魚之縱大壑今如喪家狗洙曰孔子纍纍然若喪家之狗既無遊方戀洙曰所遊必有方又君子遊必擇方趙曰禮記所遊必有方言父母在堂當不逺遊也公巳無父母故無此戀矣舊注非行止復何有相逢半新故取别隨薄厚不意靑草湖洙曰青草湖在湖南扁舟落吾手蘇曰張翰曰不意吳江扁舟落吾手中眷眷章梓州開筵俯髙桞樓前出騎馬帳下羅賔友健兒簸紅旗此樂幾洙曰作或難朽日車隱崑崙洙曰莊子徐無鬼若乘日之車鳥雀噪户牖蘇曰徐騏養素曠蕩居少室山鳥雀朝夕噪宿戶牗坐隅之間波濤未足慰三峽徒雷吼洙曰七發將以八月望與諸矦逺方交遊兄弟並往觀儔乎廣陵之曲江又云雷聞百里江水逆流海水上潮波湧而滀起混混庉庉聲如雷吼鼓此天下怪異詭觀也太子能強起觀之乎所憂盜賊多重見衣冠走中原消息斷黃屋今安否洙曰黃屋斥天子也趙曰吐蕃陷京師代宗出符而地逺所未知也終作適荆蠻洙曰王仲宣十哀詩西京亂無象豺虎方構患捐棄中國去逺身適㓝蠻荆蠻非我鄉何為久滯淫安排用莊叟洙曰謝靈運居常以待終處順故安排趙曰莊子安排化去乃入于寥天一隨雲拜東皇挂席上南斗洙曰謝靈運揚帆采石華挂席拾海月趙曰屈原九歌有東皇太一東皇所以言楚春秋説題云南斗吳地也東皇之廟隨雲而拜之南斗之地排席而上之非啇吳楚而然乎有使即寄書無使長回首蘇曰韓斐送李定出上東門握斐手曰因風示信慰我跋仰定曰有使即寄書以通安好早發射洪縣南途中作將老憂貧窶魯曰詩云終窶且貧窶賤也筋力豈能及趙曰使老者不以筋力為禮征途乃洙曰一作復侵星洙曰鮑明逺侵星赴早路畢景逐前儔得使諸病入鄙人寡道氣在困無獨立俶裝逐徒旅鄭曰俶昌六切魯曰顔延年詩改服飭徒旅修可曰張平子思玄賦占既吉而無悔兮簡元辰而淑裝注俶始也達曙陵險澀洙曰潘正叔丗故尚未夷崤函方險澀寒日出霧遲清江轉山急唐曰江為山所激僕夫行不進駑馬若維縶鄭曰陟立切趙曰詩縶之維之汀洲稍踈散何曰岸行坦夷也風景開怏悒空慰所尚懷終非曩遊集衰顔偶一破勝事難屢挹茫然阮籍徒更灑楊朱泣洙曰阮籍常不由徑路而行途窮則哭楊朱泣多歧師曰甫遭窮途至於東西南北了無定居安免掦朱之揮淚邪通泉驛南去通泉縣十五里山水作魯曰地理志通泉縣在梓州東南北三十里去縣十五里有佳山水諺號沈家坑甫至此覽眺愛其山水而有是作溪衣行自濕亭午氣始散洙曰天台賦羲和亭午遊氣髙褰冬溫蚊蚋在人逺鳬鴨亂髙曰行人少也登頓生曽隂洙曰江文通日落長沙渚曽隂萬里生欹傾出髙岸驛樓衰栁側縣郭輕煙畔一川何綺麗洙曰劉公幹綺麗不可忘魯曰所謂沈家坑也盡日窮壯觀山色逺寂寞江光夕滋漫傷時愧孔父修可曰孔子嘆鳳泣麟皆傷時也去國同王粲洙曰王粲字仲宣山陽人避地􅍮州後為魏侍中在荆州日嘗思歸因登樓作賦趙曰王粲漢獻帝西遷西京擾亂乃之荆州依劉表其七哀詩西京亂無象豺虎方遘患復棄中國去逺身適荆蠻師曰昔魏王粲去國來依劉表甫去杜鄠而遊蜀豈不同王粲之去國乎我生苦飄零所歷有嗟嘆發閬中前有毒蛇後猛虎溪行盡日無村塢洙曰時盜賊縱橫政役煩重而民不安居也江風蕭蕭雲拂地山木慘慘天欲雨女病妻憂歸意速趙曰此言歸梓州也秋花錦石可玩之物以歸意速不復數之矣秋花錦石誰復數别家三月一得書避地何時免愁苦洙曰賢者避地趙曰公以九月自梓往閬至十二月而復歸梓發劉郎浦鮑曰先主納吳女處也吕溫詩云吳蜀成婚此水潯真珠步障幄黃金誰將一女輕天下欲換劉郎鼎峙心鄭曰在荆州宋曰浦屬浹州甫擬下峽過衡陽有此作挂帆早發劉郎浦疾風颯颯昏亭午夢符曰右按江陵圖經劉郎浦左石首縣浦或作伏趙曰自公安縣欲往嶽州所經行之處孫曰亭高貌謂日正髙也舟中無日不沙塵岸上空村盡豺虎洙曰言多盜賊也趙曰張孟陽云盜賊如豺虎十日北風風未回客行歲晚尤相催白頭厭伴漁人宿黃帽靑鞋歸去來趙曰雖在江湖厭與漁人為伴乃欲深藏髙隱矣沈曰黃帽乃籜冠青鞋乃芒鞋也宿鑿石浦早宿賔從勞仲春江山麗飄風過無時舟楫不敢繫洙曰飄暴風也趙曰莊子曰泛乎若不繫之舟風而不繫則流蕩矣回塘淡暮色日沒衆星嘒缺月殊未生洙曰缺殘也靑燈死分翳洙曰青言無光也窮途多俊異亂丗少恩惠洙曰以丗亂故恩惠少而窮多俊異也趙曰俊異之士在窮途則膏澤不下於民而亂丗少蒙其恩惠即非是亂丗少恩惠以致俊異之窮舊注非鄙夫亦放蕩草草頻卒歲斯文憂患餘聖哲垂彖繫洙曰聖人作易與民同憂患也其言象皆示於彖繫趙曰作易者其有憂患乎師曰分翳半晴也青燈言無光也窮途多俊異言俊異之士多困於窮賤而愚鄙多取冨貴也亂丗少恩惠言賦役橫出而民不蒙其澤也草草勞貌卒歲謂終歲勤勤斯文憂患餘言彖繫之作在仲尼不遇之日自古文土多因憂患中而作文甫是詩之作盡亦憤悶而有所激耳早行歌哭俱在曉行邁有期程孤舟似昨日聞見同一聲飛鳥數求食潛魚亦獨驚前王作網罟設法害生成洙曰網罟先王所以養民也而後王反以為業賦斂所以平民也而後丗反以害民趙曰鳥數出求食所以自飽魚既潛而猶驚所以求活而小民利之網羅其鳥罟罩其魚害物之生成此公反傷前王之設法也易曰作結繩而為網罟以佃以漁舊注非碧藻非不茂髙帆終日征干戈未揖讓崩迫開其情洙曰以干戈未寧故崩迫而情偽自開趙曰開放此情懷于終日征行之間師曰歌者為商旅哭者為征夫行邁有期程言陸行有次空靈岸鄭曰空靈當作空舲酈元水經湘水縣有空舲峽十道四畨志云湘水空舲灘沄沄逆素浪鄭曰沄音雲落落展清眺幸有舟楫遲得盡所歷妙空靈霞石峻楓栝洙曰一作枯鄭曰古活切木名隱奔峭洙曰奔奔流也峭危峭也趙曰謝靈運云徒旅苦奔峭李善注云淮南子曰岸峭者必陀許慎曰陀落也然奔亦落之義青春猶無私白日亦偏照洙曰為山嶺障閡故偏照也蘇曰陳嬪妃白日照然亦有遍照之處可使營吾居終焉託長嘯師曰逆素浪言遡流也展清眺言去巴蜀之阻漸入寬平之鄉括乃括柏也奔峭奔流峭謂峯峭白日亦偏照言岡巒互為日所出沒甫至此喜其景物佳欲託居焉故曰終焉託長嘯毒瘴未足憂兵戈滿邊徼嚮者留遺恨恥為達人誚回帆覬賞延佳處領其要宿花石戍鄭曰鄧愼思云在峽州鳳臺子以謂此詩在潭衡之間作謂在巴峽非也十道志潭州湘潭縣北二十里有錦石區疑花石即錦石午辭空靈岑夕得花石戍洙曰空靈在歸州花石戍屬陜州鮑曰唐志潭州長沙有花石戍舊注云峽州妄也夢符曰右按歸州圖經空舲峽東西十四里在峽州夷陵縣界山經云江水歷峽東徑冝昌縣之插竈下酈道元曰江之左岸絶崖壁立數百丈飛鳥所不能過棲有一火燼插在崖間望見長數尺父老傳云昔洪水時人泊舟崖側以餘燼揰之至今在焉十道志云歸有空舲峽又有大沱水沱之崖産花紋石土人採為硯空靈當作空舲岸疏開闢水洙曰一作山自白狗峽至空靈山花石皆開闢之峽木雜今古樹地蒸南風盛春熱西日暮四序本平分氣候何回互茫茫天造間理亂豈恆數繫舟盤藤輪杖䇿古樵路罷人不在村鄭曰罷音疲洙曰罷人言民困於征役而罷敝不在村不安居也野圃泉自注柴扉雖蕪沒農器尚牢固山東殘逆氣吳楚守王度洙曰安史之亂王命之所及者吳楚蜀而巳夢符曰右按春秋左氏傳史倚相誦祈招之詩曰祈招之愔愔式昭德音思我王度式如玉式如金形民之力而無醉飽之心誰能扣君門下令減征賦洙曰憫下情不上達也趙曰山東之河北也安史之亂唯吳楚知所尊王命故欲扣君門而為之減征賦也師曰開闢水言天地開闢已來有此峽水非禹之所鑿也四時多南風其地春熱宋玉九辨皇天分平四時兮竊獨悲此凛然白露既下降百草兮俺離披此梧楸四序平分寒暑自有節何此地之氣候差互乎乃知天地造化治亂之理亦無常數也盤藤輪言藤蔓盤結如車輪罷人言民困於賦役逋竄而不安居也下令咸征賦言無人以重斂請於君薄賦以恤民也早發有求常百慮斯文亦吾病以兹朋故多窮老驅馳併趙曰以斯文自任衆所共知而朋友故舊之多自是驅馳頻併矣早行篙師怠席挂風不正洙曰席張席以為帆也風不正不順風昔人戒垂堂洙曰謂千金之子坐不垂堂今則奚奔命修可曰傳云一歲七奔命濤翻黑蛟躍日出黃霞映洙曰鮑明逺騰沙欎黃霧翻浪揚白鷗煩促瘴豈侵頽倚睡未醒洙曰未一作還鄭曰醒新佞切僕夫問盥櫛暮顔洙曰一作未􅌤靑鏡鄭曰􅌤他典切洙曰暮衰也􅌤愧也言暮顔衰醜有愧於對鏡也隨意簮葛巾仰慙林花盛側聞夜來寇幸喜囊中淨艱危作逺客干請傷直性洙曰謂有求於人也薇蕨餓首陽洙曰史記伯夷叔齊不食周粟隱於首陽山下采薇蕨而食之遂至飢死也粟馬資歷聘洙曰六國以粟馬資儀秦使之歷聘賤子欲適從疑悮此二柄洙曰二柄謂采薇及歷聘也師曰無求則無慮凡有求者不免有憂文所以明道泥於文者亦吾之病君子以文會友以此故多朋友也煩促瘴豈侵言迫於煩熱豈不為瘴毒所傷乎頺倚睡未醒為早行也昔夷齊不食周粟餓于首陽蘇秦張儀資六國以歷聘此二柄者一出一處使人疑悮今甫欲從其一故云賤子欲適從適音的主也次晚洲參錯雲石稠洙曰參錯雲石互相雜然也坡陀風濤壯洙曰坡陀泛濫風浪也趙曰顔延年詩春江壯風濤梅曰坡陀髙大貌晚洲適知名梅曰晚洲非素有名因子美而名彰也秀色固異狀洙曰言其壯不一也棹經垂猿把身在度鳥上大觀曰度鳥即鳥飛過洙曰水張而船所經者髙也趙曰張所論曰白猿玄豹藏於檽檻何以知其接埀條於千仞則可謂之垂猿矣梁虞騫詩澄潭寫度鳥擺浪散怢妨危沙折花當師曰花當乃花根也羇艱暫愈悅羸老反惆悵洙曰暫愈悅次晚洲也反惆悵歎行役也中原未解兵吾得終踈放洙曰兵未解而得踈放以不見用於丗也趙曰王傷時之擾攘吾豈得終踈放而不憂懼且流落乎入衡州兵革自久逺興衰看帝王趙曰兵革不息徒自歲月之久興起其衰微自看帝王之舉耳漢儀甚照耀胡馬何猖狂洙曰猶漢唐法度未墜胡馬之亂乃猖狂爾趙曰光武為司隸校尉父老見之曰今日復見漢官儀今言唐法度未改故以比之胡馬追言安史之亂老將一失律清邊生戰埸洙曰失律失法律也易曰失律凶君臣忍瑕垢河嶽空金湯洙曰言避亂出行城池不守也故空金湯左傳曰國君含垢瑜瑾匿瑕言有所容也金謂金城湯謂湯池故名金湯趙曰傳曰國君含垢言君相𥘉含容姦逆不即誅戮故使河嶽之地雖是金城湯池失守而空如之也餘見上重鎮如割據洙曰安史亂後天下裂為藩鎮賦不上供如割據焉趙曰天下節度稍自威重如一方之割據輕權絶紀綱軍州體不一洙曰各自為政也寬猛性所將嗟彼苦節士素於圎鑿方洙曰九辨云圎鑿而方枘弓吾固知其鉏鋙而難入趙曰苦節指崔瓘也按唐史以士行修謹聞大曆中為湖南觀察使將使寬弛不奉法少以禮法繩之寡妻從為郡兀者安短墻趙曰言寡妻平日遭擾自從崔太守為郡之後如兀足者之安堵墻之下不復驚動也凋弊惜邦本洙曰惜民之凋弊也哀矜存事常趙曰言不妄刑罰哀矜其人曾子所謂哀矜而勿喜旌麾非其任洙曰言非其人也府庫實過防洙曰􅪟貯賞也恕巳獨在此多憂增內傷偏禆恨酒空卒伍單衣裳洙曰厚自奉養而不恤軍旅也趙曰瓘之修謹既如上所云然於是委以旌麾之任則悉其人防於府庫之費而吝於賜豫又以禆將卒伍衣食之不繼則遂以召亂如下文所云也元惡迷是似聚謀泄康莊夢符曰右按爾雅五逹謂之康六逹謂之莊史記曰開第康莊之衢趙曰元惡指臧玠也以兵殺崔瓘􅨕據潭州云聚謀而伐於通衢則公然不顯矣竟流帳下血大降湖南殃洙曰代宗時湖南兵馬使臧玠殺其帥崔瓘主國良因之而反烈火發中夜髙煙燋上蒼至今分粟帛殺氣吹沅湘鄭曰沅湘二水名沅在象郡湘即湘江福善理顛倒明徴天莽茫洙曰九歌令沅湘弓無波阮籍曠野奔茫茫趙曰書曰天道福善禍淫又曰明徵定保令以崔帥之謹而𬒳禍則福善之理豈不顚倒明證於天豈不莽茫乎銷魂避飛鏑纍足穿豺狼隱忍枳棘刺遷延胝研瘡洙曰言避亂奔走危窘如穿豺狼間行也心痛悼喪亂如忍棘刺手足胝胼而成瘡逺歸兒侍側猶乳女在旁久客幸脫免暮年慙激昻洙曰幸於免患也蕭條向水陸汨沒隨漁商報主身巳老入朝病見妨悠悠委薄俗鬱鬱回剛腸洙曰老而不可報王病不可入朝故不免委身薄俗欎鬱回剛腸而巳參錯走洲渚舂容轉林篁洙曰謝靈運遡流觸驚急臨圻阻參錯趙曰禮記善待問者如撞鍾疏云春謂擊也以為聲之形容言擊鍾每一舂而為一容然後盡其聲也今公借字以言其行之悠悠如鐘聲一舂一容未便盡也片帆在郴岸洙曰郴地名鄭曰郴丑林切桂陽縣通郭前衡陽洙曰衡州也華表雲鳥埤鄭曰賔彌切名園花草香旗亭壯邑屋烽櫓蟠城隍趙曰三代丗表會旗亭下注市樓也立旗於上故名旗亭巽賦云抗旗亭之嶢薛烽櫓者設烽燧於擼也櫓者城上守禦望樓城隍者城下之壕也中有古刺史洙曰言其愛民蒞事如右之刺史盛才冠巖廊趙曰祖出武帝制曰舜遊巖廊之上文頴注曰殿下小屋也扶顚待柱石獨坐飛風霜趙曰言刺史乃柱石之臣獨坐御史也風霜則御史之任昨者間瓊樹髙談隨羽觴洙曰公目言得侍御史如間瓊樹然陸士衡四坐咸同志弱觴不可算髙談一何綺蔚若朝霞爛注羽觴謂其置鳥羽於觴以急飲也余曰晉束晢傳武帝問三日曲水之義晢曰昔周公城洛邑因流水以凡酒逸詩云羽觴隨波蓋言觴輕如鳥羽之飛也原叔謂鳥羽於觴以急飲恐非也無論再繾綣巳是安蒼黃劇孟七國畏洙曰前漢遊俠傳劇孟以俠顯吳楚反時條侯為太尉乘傳東討至河南得劇孟喜曰吳楚舉大事而不求劇孟吾知其無能巳天下騷動大將軍得之若為一敵國云馬卿四賦良朱曰司馬相如字長卿有子虛上林賦哀二丗賦大人賦並載漢史傳門闌蘇生在洙曰蘇生侍御渙勇鋭白起強問罪冨形勢凱歌懸否臧洙曰末章皆美刺史也趙曰劇白馬卿以比刺史白起以比蘇渙公自注蘇生侍御涣則渙在崔公潩之幕而其人勇鋭故用白起以比其為將公於未章自注云聞崔侍潩乞師于洪府帥巳至袁州比此所謂問罪凱歌者乎冨形勢則以兵之形勢精強也氛埃期必掃蚊蚋焉能當趙曰氛埃蚊蚋以比臧玠也橘洙曰一作繘井舊地宅仙山引舟航洙曰見橘井尚髙褰注見蓬萊如可到注趙曰橘井在郴州神仙傳蘇耽將仙謂其母曰以庭前橘葉神使病者以井水服病即愈仙山則指言蘇仙所仙之山水經所載耽既仙之後乘白馬而返其所鑿井處丗謂馬嶺山公謀欲往郴故云引舟航也此行厭暑雨厥土聞清涼洙曰言親刺史之德而亡炎暑趙曰此指言郴州矣公詩意曰郴州頗涼冷橘井尚淒清舊注所引却是衡州又無比德之意諸舅剖符近洙曰言諸舅皆作郡趙曰公詩每以崔姓為舅豈剖符為刺史乃崔侍御潩者乎開緘書扎光蘋蘩命屢及磊落字百行江揔外家養洙曰陳書江揔字揔持七歲而孤依于外氏聰敏有至性舅吳平光侯蕭動名重當時多所鍾愛常謂揔曰爾操行殊異神彩英秀後之知名當出吾右謝安乘興長洙曰謝安寓居會稽出則漁弋山水入則言詠屬文無處丗意常往臨安山坐石室臨濬谷悠然嘆曰此亦伯夷何逺又與孫綽等泛海吟嘯自若放情丘壑每遊賞必常以妓女從也下流匪珠玉擇木羞鸞凰洙曰下流自言也言巳非珍異然得所託也趙曰公自謙其為人特下流耳非是珠玉之珍也傳曰窮猿投林豈暇擇木公之意自謙其不暇擇木非若鵉凰非梧桐不栖故羞鵉凰也我師嵇叔夜洙曰恬靜寡欲含垢匿瑕也趙曰公自言其放曠懶散如嵆康丗賢張子房洙曰波掾張勸趙曰公自有注以美張勸也柴荆既樂土趙曰言桞州也鵬路觀翶翔洙曰寄居樂土當日觀刺史為朝廷拔用也趙曰觀則所以指衡州刺史矣鵬路莊子云九五里者也聶耒陽以僕阻水書致酒肉療飢荒江詩得代懷興盡本韻至縣呈聶令陸路去方田驛四十里舟行一日時屬江漲泊于方田鄭曰耒陽衡州屬縣耒陽馳尺素見訪荒江眇義士列女家風流吾賢紹洙曰尺素書也史刺客傳聶政殺韓相自死其姊罌伏尸哭極哀死政之旁晉楚齊衛聞之皆曰非獨政能也乃其姊亦烈女也昨見狄相孫許公人倫表前期翰林後屈迹縣邑小洙曰言聶之才冝在翰苑而反屈迹縣邑趙曰蔡伯丗本前期作前朝其説是豈聶之父或祖嘗任翰林之職乎知我礙湍濤半旬獲浩溔趙曰溔以沼切大水貌也謝靈運山居賦吐泉之浩溔麾下殺元戎湖邊有飛旐洙曰潭州臧玠殺其帥崔瓘子美避亂而往衡州故也飛旐素旐也庾公上武昌出石頭百姓看於岸上歌曰庾公上武昌翩翩如飛鳥庾公還楊州白馬引素旐素旐乃庾尋亡也趙曰即臧玠殺衛瓘也舊注所引庾公事非飛旐字所出潘安賦飛旐翻以啓路孤舟增鬱鬱僻路殊悄悄側驚猿猱捷仰羡鸛鶴矯禮過宰肥羊愁當置清醥洙曰張平子欎鬱不得志詩憂心悄悄蜀都賦猿狖騰希而競捷又置酒髙堂觴以醥淸曹子建烹羊宰肥牛言聶以肥羊清醰乃見於禮也鄭曰醥普沼切酒清曰醥修可曰曹子建七啓云乃有春醥酒康狄所營揚雄酒賦云其味有冝城醪醲蒼梧醥清酒也妙切青匹色揚雄酒賦云蒼梧醥清詩曰既有肥牡以速諸舅禮過宰肥羊言聶令待遇之厚也唐蒙通夜郎徵發巴蜀吏卒巴蜀大驚上聞之使司馬相如作檄以責唐蒙因喻巴蜀人秦符白起破趙四十餘萬軍悉坑之甫意謂臧玠之徒不可以言喻之冝若趙卒坑之故云與在北坑趙郴岸靜論衡州無恙長沙優指玠之亂崔潩乞師于洪府師巳至袁州北揚子彬將士又自澧州逹長沙故甫得以開顔而喜叛徒見擒也分門集注杜工部詩卷第十一
