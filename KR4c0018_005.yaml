  text: 分門集注杜工部詩卷第五
  hash: sha256:5ecde78d08ace8d6a25b0ebad5bf1a17e3b69b9b1ce3286bb854967bcab605bf
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_005-1a}
body:
  text: 樓閣古詩四首律詩三十五首越王樓歌綿州州府何磊落顯慶年中越王作洙曰太宗子越王貞也顯慶中為綿州刺史創此樓顯慶中宗年號趙曰作者言其作綿州也孤城西北起髙樓洙曰古詩西北有髙樓上與浮雲齊碧瓦朱甍照城郭趙曰神仙傳蔡少霞夢人記書新宫銘有云碧瓦鱗差沈佺期詩紅日照朱甍樓下長江百丈淸謝玄暉飛甍夾馳道山頭落日半輪明洙曰謝靈運逺峯隱半規又日落月昭曜趙曰李白言月曰峩眉山月半輪秋二公各盡半輪之語矣君王舊跡今人賞轉見千秋萬古情西閣曝日晚更生江流靜猶湧四序嬰我懷羣盜久相踵黎民困逆節天子渴垂拱洙曰時喪亂既久民困於賊後天子播遷未獲收復也趙曰天子皇皇於廟謨不得垂衣拱手不必指言播遷舊注非所思注東北深峽轉修聳衰老自成病郎官未為冗凄其望吕葛洙曰以丗亂思得良臣如吕望諸葛者趙曰可以有為於丗而嘆其衰病也謝靈運詩欽聖若旦暮懷賢亦凄其魯直作陶淵明詩云凄其望諸葛蓋本於杜不復夢周孔洙曰如周公孔子不可夢見矣又况得見之乎濟丗數嚮時斯人各枯冡洙曰老子所謂其人與骨皆朽矣是也楚星南天黑蜀月西霧重趙曰以况風塵昏蔽道路阻隔而不得即去也安得隨鳥翎迫此懼將恐帥曰楚地有瀼東瀼西地髙可以登眺故云頗免崖石擁雉堞矮墻也麥無壠言麥茂熟靜猶湧言無風而波逆莭拍祿山之亂渴垂拱謂未收復京城所思注東北甫以東北為寇所擾不能無憂思也深峽轉修聳言困于楚峽不聞朝廷消息是以衰老自成病也郎官未為冗言不見用故思得賢俊如吕望諸葛周公孔子之徒出為國家整頓奈何斯人骨巳朽矣楚星南天黑蜀月西霧重庶民惟星卿士惟月復歎楚蜀數昏亂是以甫欲隨鳥翅奮飛而去也登兖州城樓東郡趨庭日洙日兖州漢之東郡南樓縱月𥘉浮雲連海岱平野入靑徐朱曰禹貢海岱惟靑州又海岱及淮惟徐州王禹稱曰海岱靑徐皆與兖相接孤嶂秦碑在洙曰秦本紀始皇東行郡縣上鄒嶧山與諸王刻石頌德李斯作文荒城魯殿餘洙曰王文考魯靈光殿賦序云恭王餘之所立遭漢中微未央及建章之殿悉皆見隳壞而靈光巋然獨存從來多古意臨眺獨躊躇師曰甫感時亂文風不振是以懷古臨眺之際躊躇而不能去矣東樓萬里流洙曰一作行沙道洙曰流沙地名老子西涉流沙而不返征西過此門洙曰晉漢有征西將軍官趙曰泛言西行之人出此西門耳一本作西征過北門義非但添新戰骨蘇曰袁耽數年相持邊疆沙場但添新戰骨爾不返舊征魂洙曰一云但添征戰骨不返死生魂樓角凌風逈城隂帶水昏傳聲看驛使送節向河源趙曰時遣使與吐蕃和借使張騫奉使尋河源事白帝城二首江城含變態洙曰朝莫雲煙變化態度多端也趙曰祖出楚辝思美人篇曰觀南人之變態一上一回新天欲今朝雨山歸萬古春英雄餘事業洙曰白帝城公孫述所築後為劉備屯戍之也改名曰永安趙曰英雄指白帝也公孫述自號白帝築為此城衰邁久風塵公自言也取醉他鄉客相逢故國人兵戈猶擁蜀洙曰謂假子璋之徒未靖也趙曰乃大曆元年崔旰之叛戰于梓州敗績舊注謂假子璋事乃在前年上元二年非是賦斂尚輸秦洙曰時國用不足多賦斂也不是煩形勝深慙畏損神趙曰不是憚煩此地之形勝而難上所慙者以畏懼而損我之神耳白帝空祠廟洙曰公孫述廟述自號白帝孤雲自往來江山城宛轉棟宇客徘徊勇略今何在當年亦壯哉洙曰述始為王莽導江卒正更始時起兵討宗成王岑之亂破之遂有蜀土僣立為帝號成家立十二年為光武所誅後人將酒肉洙曰凡舟人往來皆祠之虛殿日塵埃谷鳥鳴還過林花落又開多慙病無力騎馬入靑苔上白帝城彥輔曰華陽國志先主征吳於夷道還薨於巴東治魚復縣公孫述更名白帝章武中改曰永安先主章武元年屯白帝城遂為重鎮後王建興十五年中吳將全琮來攻不剋城峻隨天壁趙曰天然自立之石壁也師曰天壁乃西方室壁之星言城之髙與天壁相隨樓髙更女牆洙曰壁信泛江詩春江下白帝畫舸向黃牛錦纜回沙磧蘭橈避荻洲濕花隨水泛空巢逐樹流岸社多喬木山城是逈樓徐敬業登琅邪城云登陴起遐望注女牆也孝祥曰崔豹古今注女牆城上小牆也亦名睥睨言於牆上睥睨人也江流思夏后洙曰禹貢岷山導江東别為沱左傳劉子見河洛思禹功江賦巴東之峽夏后疏鑿風至憶襄王洙曰宋玉風賦楚襄王遊於蘭臺之宫宋玉景差侍有風颯然而至者王乃披襟而當之曰快哉此風老去聞悲角人扶報夕陽公孫初恃險躍馬意何長洙曰左太冲蜀都賦臨谷為塞因山為障峻阻塍埓長城豁險吞若巨防一人守隘万夫莫向公孫躍馬而稱帝劉宗下輦而自王後漢公孫述字子陽使人詐稱漢使者假述輔漢將軍蜀郡太守述恃其地險衆附自立為蜀王都成都蜀地肥饒兵力精强逺方士庶多歸之遂立為天子號成家昔蔡澤不遇而從唐舉相曰先生之壽促今以往者四十三嵗蔡澤笑謝而去謂其御者曰吾持梁刺齒肥躍馬疾驅懷黃金之印結紫綬於腰揖讓人主之前食肉冨貴四十三年足矣公孫述夢有人語之曰公子系十二為期覺謂其妻曰雖貴而祚短若何妻對曰朝聞道夕死尚可况十二年乎白帝城樓江度寒山閣城髙絶塞樓翠屏冝晚對洙曰天台賦搏壁立之翠屏注石屏風如壁蘇曰羊元居山當戶山峯竒秀每據筠床終日笑傲或偃卧看山客至謂客曰此翠屏冝晚對爽人心目顔魯公名其隱山為翠屏今人皆傳之嘗見人題詩曰萬古漸漸立翠屏昔年不枉占佳名白谷㑹深遊急急能鳴鴈輕輕不下鷗夷陵春色起漸擬放扁舟蘇曰唐劉洞庭秋來橘柚欲熟酒賤魚肥吾漸放舟傲蕩君山湘川耳白帝樓漠漠虛無裏洙曰陸機街巷紛漠漠謝玄暉詩生煙紛漠漠連連睥睨侵鄭曰上匹詣下研訃切趙曰睥睨城上女墻也侵則侵虛無之裏言其髙也師曰崔豹古今注女墻城上小墻言在大墻之上如女之於夫也一名睥睨言於墻上睥睨人也樓光去日逺峽影入江深臘破思端綺洙曰古詩客從逺方來遺我一湍綺趙曰所以禦寒春歸待一金蘇曰王逸少春歸待子一金濟貧兒今束縑何用也客皆掀髯逸少自若時懷祖以束縑贈故有是句趙曰所以充費且以為賞去年梅柳意還欲攪邊心洙曰詩祗攪我心蘇曰宗壽春曰出闉闍時風物明媚顧同行曰去年梅栁俱有春意弟妹天涯何日復得相聚惆悵久之白帝城最髙樓城尖徑吳洙曰一作翼旌斾愁獨立縹眇之飛樓洙曰海賦神仙縹眇峽坼雲霾龍虎睡江淸日抱黿鼉遊趙曰為張大之語以見樓之最髙也扶桑西枝封斷石洙曰日出暘谷浴於咸池拂於扶桑山海經云大荒之中暘谷上有扶桑十日所浴九日居下枝一日居上枝皆戴烏趙曰淮南子云日出於暘谷拂於扶桑扶桑在東故望見其向西之枝且與斷石相對隔也弱水東影隨長流洙曰禹貢弱水既西又導弱水至於合黎夢符曰右按淮南子弱水自窮石注窮石在張掖北其水弱不能勝羽趙曰蓬萊山下弱水也以弱水在東故言東影道書言蓬萊隔弱水三十万里不可到是也杖藜歎丗者誰子蘇日黃晟曰子非杖藜歎丗者也慮人疑子趙曰莊子原憲杖藜應門泣血迸空回白頭陪諸公上白帝城頭宴越公堂之作洙曰越公楊素也有堂在城上畫像尚存此堂存古制城上俯江郊落構垂雲雨趙曰雲頽而下雨落于空皆有垂之義荒階蔓草茅柱穿蜂溜蜜棧缺燕添巢坐接春杯氣心傷豔蘂梢蘇曰左希登西樓曰豔蘂傷客心和風吹薄袂英靈如過隙洙曰見身丗白駒催注宴衎願投膠洙曰古詩以􅃮投膠中趙曰指公孫述之英靈如過隙而逝亡則今日宴衎當願如以膠投􅃮結綢繆之好也莫問東流水生涯未即拋城上草滿巴西緑空城白日長風吹花片片春動水茫茫八駿隨天子洙曰王子年拾遺記周穆王巡行天下馭八龍之駿名曰絶地翻羽奔宵超影踰輝超光騰霧挾翼穆王神智逺謀使車轍跡周於四海故絶異之物不期自服羣臣從武皇洙曰見未枉周王駕淹期武帝巡注趙曰漢武帝初幸汾隂至洛陽寖尋於泰山其所巡幸周万八千里羣臣之從可知矣遙聞出巡守早晚遍遐荒趙曰不敢言天子蒙塵姑以巡守微言之師曰祿山亂玄宗出幸蜀蜀在巴之西昔周穆王漢武帝皆出巡守以比玄宗之西幸也天子諱言出奔特云巡守亦若春秋書天王出狩于河陽是也江陵節度陽城郡王新樓成王請嚴侍御判官賦七字句同作樓上炎天氷雪生趙曰當炎天而樓上生氷雪則其髙可知髙飛燕雀賀新成洙曰淮南子大厦成而燕雀相賀碧窗宿霧濛濛濕朱栱浮雲細細輕修可曰晉羊球登西樓賦云畫棟浮細細之輕雲朱栱濕濛濛之飛雨王逸少見之擊節愛羡竟日杖鉞褰帷瞻具美洙曰見杖鉞築壃開意旨注賈琮為異州刺史舊典傳車駕驂垂赤帷裳迎於州界及琮之部升車言曰刺史當逺視廣聽糾察美惡何有反投垂帷裳以自掩塞乎乃命御者褰之百城聞風自然悚震投壷散秩有餘清洙曰祭遵投壷雅歌自公多暇延參佐江漢風流萬古情洙曰庾亮鎮武昌佐吏乘月登樓不覺亮至將避之亮曰少住吾於此興不淺陶侃曰亮非獨風流兼有為政之術又作此奉衛王西北樓成雄楚都逺開山嶽散江湖趙曰言樓之所臨者髙所望者逺矣二儀淸濁洙曰陽清為天隂濁為地還髙下三伏炎蒸定有無推轂幾年唯鎮靜洙曰推吐回切馮唐傳推轂遣將趙曰推轂以言衛王奉命為將曵𥚑終日盛文儒洙曰鄒陽何王之門不可曳長𥚑乎白頭授簡焉能賦洙曰雪賦受簡於司馬大夫漢書登髙能賦可為大夫愧似相如為大夫陪章留後侍御宴南樓得風字絶域長夏晚趙曰非吾鄉而在逺亦可用絶域矣兹樓淸宴同朝廷燒棧北洙曰謂在大散之北也髙祖入漢中令韓信燒絶棧道攻破大散趙曰因宴南樓而望長安也張良說漢髙祖燒絶棧道舊注以為韓信誤矣鼓角滿洙曰一作漏天東洙曰雅州在蜀之西地多雨名漏天屢食將軍第洙曰第宅也夢符曰右按前漢霍去病為驃騎大將軍上為治第令視之對曰胸奴不滅無以家為也由此上益重愛之蘇曰吳罕屢乞食於將軍第宅俱蒙魚味仍騎御史驄洙曰見憲府舊乘驄注唐曰甫以避亂食章公之宅騎章公之馬叙其恩禮之厚本無丹竈術洙曰道家燒丹之事蘇日郝希神仙以隂陽怡養豈有丹竈術致乘風御氣之道真妄耶修可曰江文通別賦華隂上士服食還仙術既妙而猶學道以寂而未傳守丹竈而不顧錬金鼎而方堅那免白頭翁洙曰言無丹竈之術以延年也寇盜狂歌外形骸痛飲中洙曰以酒自隱爾野雲低渡水簷雨細隨風出號江城黑趙曰夜傳號令此節度府之事也題詩蠟炬紅趙曰言宴中明燭而題詩此身醒復醉不擬哭途窮洙曰阮籍以酒自隱故得免當丗之難常出不由徑遇途窮則慟哭而反公自言取籍之自隱於酒而不倣其哭窮途也趙曰言飲醉則如阮籍而哭窮途則不擬學之臺上得凉字改席臺能逈趙曰改席則自南樓改於臺上也留門月復光雲霄遺暑濕洙曰蒸鬱也趙曰臺髙矣如在雲霄之間而不知有暑氣山谷進風凉老去一杯足洙曰不如生前一杯酒誰憐屢舞長洙曰賔之𥘉筵屢舞傞傞何須把官燭似惱鬢毛蒼登嶽陽樓昔聞洞庭水鄭曰在嶽州今上嶽陽樓洙曰風土記曰陽羡縣東有太湖中有包山山下有洞穴潜行地中無所不通謂之洞庭地脉趙曰戰國䇿吳起對魏武侯曰昔者三苗之居左彭蠡之波右洞庭之水吳楚東南坼趙曰吳與楚地相接此實道洞庭闊逺之狀乾坤日夜浮趙曰言在乾坤之內其水日夜浮也語既髙妙有力其言洞庭之光大過於此親朋無一字老病有孤舟蘇曰孔伋友人見訪問先生何之伋指溪上孤舟曰有此足以養老病復何愁焉趙曰此言於老病中尚賴有孤舟可以浮泛而生涯自如也戎馬關山北慿軒涕泗流洙曰老子戎馬生郊張景陽登臺詩逺望涕泗流趙曰關山北則言在長安一帶也王仲宣登樓賦云慿軒檻以逺望向北風而開襟陪裴使君登嶽陽樓湖闊兼雲霧樓孤屬晚晴禮加徐孺子洙曰後漢徐孺子豫章南昌人時陳蕃為太守以禮請署功曹稚不免之郡既謁而退蕃在郡不接賔客唯稚來時設一榻去則懸之後舉有道定功曰徐孺子公自比也詩接謝宣城洙曰謝眺字玄暉為宣城郡太守時之宣城出新林浦向板橋有云江路西南永歸流東北騖天際識歸舟雲中辨江樹雪岸叢梅發春泥百草生敢違漁父問從此更南征洙曰史記屈原傳令尹子蘭怒屈原使上官大夫短原於須襄王怒而遷之原至於江濵𬒳髮行吟澤畔顔色憔悴形容枯槁漁父見而問之曰非三閭大夫歟何故至此原曰舉丗混濁而我獨清衆人皆醉而我獨醒是以見放宋王作招魂辝曰獻嵗發春兮汨吾南征些送嚴侍郎到綿州同登杜使君江樓宴得心字野興每難盡江樓延賞心歸朝送使節落景惜登臨稍稍煙集渚微微風動襟重船依淺瀨輕鳥度層隂檻峻背幽谷窗虛交茂林燈光散逺近月彩靜髙深城擁朝來客師曰言滿城擁送侍郎之來天橫醉後參師曰參西方之宿蜀在西以江樓之髙逼於參星窮途衰謝意苦調短長吟此㑹共能幾諸孫賢至今師曰杜使君乃甫宗人故云云不勞朱戶閉自待白河沉夢符曰右按春秋左氏傳晉文謂舅犯曰所不能與舅氏同心者有如白水遂沉璧于河趙曰白河謂銀河也師曰白河沉言天曙不現不勞閉户坐待白河沉也七月一日題終明府水樓二首髙棟層軒巳自凉秋風此日灑衣裳洙曰招魂髙堂邃宇檻層軒劉公幹詩涕泣灑衣裳蘇曰孫康登髙軒披襟不煩風扇而自生凉杜曰春秋緯書髙棟深宇齊王踐從兄詩念別開曾軒何邵詩穆若灑淸風翛然欲下隂山雪洙曰范彥龍詩寒沙四面平飛雪千里驚風斷隂山樹霧失交河城隂山胸奴山名吐谷渾西附隂山其地四時常有氷雪雖六七月雨雹甚盛趙曰今眼前𥘉見䕫地之山當𥘉秋而翛然欲雪有類隂山此為可愁矣不去非無漢署香洙曰尚書郎漢置四人口含雞舌香以其奏事答對欲使氣息芬芳趙曰自憫其身滯留也署指書省署也公官為工部貟外郎其在省也自冝應有含香之制今以為客不去耳絶壁過雲開錦繡洙曰䕫峽路有錦繡嵓踈松隔水奏笙篁洙曰天籟是也看君冝著王喬履真賜還疑出尚方洙曰終明府功曹也兼攝奉節令故有此語佇觀奏即真也後漢方術傳王喬河東人顯宗丗為葉令喬有神術每月朔常自縣詣臺朝帝怪其來數而不見車騎密令太史伺望之言其臨至輒有雙鳬從東南飛來於是候鳬至舉羅張之但得一雙舄焉乃詔尚書侯視則四年中所賜尚書官屬履也前漢百官公卿表尚方主作禁器物師古日尚方少府之屬官也作供御之器物也宓子彈琴邑宰日洙曰潘正叔謂河陽詩宓生化單父子竒位東阿吕氏春秋曰宓子賤治單父彈琴身不下堂而治之終軍弃繻英妙時洙曰終軍傳年十八選為博士𥘉軍從濟南當詣博士步入關關吏與軍繻軍問以此何為吏曰為復傳還當以合符軍曰丈夫西遊不復傳還弃繻而去後為謁者使行郡國建節東出關關吏識之曰此使者乃前弃繻生也承家節操尚不泯為政風流今在兹可憐賔客盡傾蓋洙曰鄒陽傳曰古語白頭如新傾蓋如故何則知與不知也文頴曰傾蓋猶交蓋駐車也何處老翁來賦詩洙曰公自謂也傳鄭十子賦詩魏文帝曰巳成老翁但未白頭楚江巫峽半雲雨洙曰宋玉髙唐賦妾在巫山之陽髙丘之隈朝為行雲暮為行雨淸簟踈簾看奕碁洙曰謝玄暉珍簟清夏室江淹賦夏簟淸兮晝不暮魏文帝書彈碁間設終以博奕春日梓州登樓二首行路難如此登樓望欲迷身無却少壯跡有但羈栖江水流城郭春風入鼓鞞洙曰石勒聞鼓鞞之聲雙雙新燕子依舊巳銜泥洙曰謝玄暉詩風簾入雙燕古詩思為雙飛燕街泥巢君堂師古曰甫言久客一身羇棲今日登樓所見景物如此不能無所感天畔登樓眼隨春洙曰一作風入故園趙曰指洛陽也戰埸今始定移柳更洙曰一作豈能存趙曰史朝義巳滅戰埸雖定而故園舊所移柳更能存乎更疑辝也猒蜀交遊冷蘇日寥岸遷居人問其故曰厭此交態寒冷故有所適耳思吳勝事繁歐曰晉張翰守官於洛及秋風起忽思吳蓴菜魲魚之興遂弃官歸甫既猒蜀欲適吳楚故有思吳之句應須理舟楫長嘯下荆門定功曰袁山松冝都山川記曰南崖有山名荊門北崖有山名虎牙二山相對有象門然登樓趙曰此聞代宗車駕長安之作花近髙樓傷客心萬方多難此登臨錦江春色來洙曰一作水流天地玉壘浮雲變古今洙曰左太冲蜀都賦云夫蜀都者擴雲關以為門包玉壘而為宇玉壘山名也前水出焉在成都西北岷山界蜀有銅梁玉壘北極朝廷終不改西山寇盜莫相侵洙曰時崔旰起兵於西山趙曰吐蕃也言今朝廷如北極終不改移尓吐蕃無用相侵也可憐後主還祠廟日暮聊為梁甫吟洙曰見武矦廟詩注趙曰諸葛作梁甫吟師曰蜀有銅梁玉壘二山錦江春色來天地言錦江春色鮮妍自天地開闢以來有之非獨今也縱使玉壘古今英雄割據千變万態如浮雲終亦歸中原總統也此二句諷崔旰反成都不能為朝廷之害故下文云北極朝廷終不改昔諸葛亮佐先主圖收復功未就而亮卒及後主即位祠祭亮廟嘆無人以為之助亮未逹時常耕于隴上作梁甫吟故甫因崔旰之亂傷朝廷無諸葛之才題新津北橋樓得郊字望極春城上開筵近鳥巢白花簷外朵靑栁檻前梢池水觀為政洙曰澄淸而不撓厨煙覺逺庖洙曰言觀厨煙知其不親庖厨師曰知其逺庖厨也西川供客眼洙曰一作逺唯有此江郊蘇曰向兆曰唯有此江郊可喜故掛冠投老率兒童操丹田閣夜嵗暮隂陽催短景洙曰謝靈運雪賦嵗將暮時既昏鮑明逺鶴賦嵗崢嶸而催暮又窮隂殺節急景周年天涯霜雪霽寒霄五更鼓角聲悲壯洙曰顔氏家訓問一夜何故五更曰更歷也經也三峽星河影動搖修可曰西淸詩話云作詩用事要如釋語水中著鹽飲水乃知鹽味此說詩家祕藏也如子美五更鼓角聲悲壯三峽星河影動搖人徒見陵轢造化之工不知乃用故事也禰衡過漁陽摻其聲悲壯漢武故事星辰搖動東方朔謂民勞之應則善用故事豈有迹耶余曰百斛明珠云七言之麗者杜子美此二句後寂寥無聞野哭千家聞戰伐洙曰夫子惡野哭者非其所而哭曰野哭夷歌幾洙曰一作數處起漁樵洙曰蜀都賦曰陪以白狼夷歌成章卧龍躍馬終黃土洙曰卧龍謂孔明也郭外有孔明廟躍馬謂公孫述也城上有白帝祠此二人蜀之英雄言不免歸於土人事音書漫寂寥洙曰一云人事音塵日寂寥左太冲蜀都賦公孫躍馬而稱帝西閣二首巫山小搖落洙曰宋玉九辨草木搖落而變衰燕歌行草木搖落露為霜趙曰楚也暖其搖落也小小而巳碧色見松林百鳥各相命夢符曰右按王粲登樓賦鳥相鳴而舉翼注大載禮夏小正之鳴也者相命也孤雲無自心洙曰陶淵明詠貧士万旅各有託孤雲獨無依層軒俯江壁洙曰招魂髙堂邃宇檻層軒些要路亦髙深洙曰選先據要路津朱紱猶紗帽新詩近玉琴趙曰朱紱則朝服而紗帽則隱者之巾公官雖省郎而間曠故云功名不早立衰疾謝知音哀丗非王粲終然學越吟洙曰王粲登樓賦云莊舄顯而越吟懶心似江水日夜向滄洲洙曰謝玄暉詩既歡懷緣情復叶滄洲趣不道含香賤洙曰尚書郎含雞舌香以其奏事答謝欲使氣芬芳田曰應劭漢官儀曰始桓帝時侍中刀存年老口臭上出雞舌香與含之頗辛螫不敢咀燕疑有過賜毒藥歸舍辝决家人哀泣不知其故僚友取其藥驗之無不嗤笑後尚書郎含雞舌香始於此其如鑷白休鄭曰鑷昵輒切田曰南史鬱林王年五嵗戲髙帝傍令左右鑷白髮王問我誰耶答曰太翁帝笑謂左右曰豈有為人作曽祖而拔白髮乎即擲鏡鑷經過調碧柳趙曰通下句言秋時公詩又曰清秋凋碧柳舊誤作調碧柳非是蕭索倚朱樓畢娶何時竟洙曰謝靈運謂子尚曰男娶女畢勑斷家事勿復相關消中得自由趙曰相如有此疾也豪華看古往趙曰庾信見游春人詩云金穴盛豪華舊誤作蒙華非是服食寄冥搜朱曰選服食求神仙古賦逺寄冥搜詩盡人間興兼須入海求趙曰方欲儘南下故有入海之語夜宿西閣曉呈元二十一曹長城暗更籌急樓髙雨雪微稍通綃幕霽趙曰言天幕之色其薄如綃逺帶玉繩稀洙曰謝玄暉詩玉繩低建章注玉繩星名門鵲晨光起洙曰一作喜檣烏宿處飛師曰謝玄暉詩金波麗鳷鵲鳷鵲門名也故曰門鵲檣挂帆木而烏泊其上故子美公安送李二十九詩又有檣烏相背發之句過南嶽入洞庭詩亦云莫怪啼㾗數危檣逐夜兔也然子美發潭州詩又云檣燕語留人則不特檣烏而巳故燕子來舟中作斷句云暫語船檣還起去穿花落水益沾巾鳷鵲又觀殿名寒江流甚細有意得人歸蘇曰蘇絲野花溪草春風未齊應有意待遷人歸西閣口號呈元二十一山木抱雲稠寒空繞上頭雪崖才變石風幔不依樓社稷堪流涕洙曰賈誼上疏陳政事可為流涕者三蘇曰陳壽思社稷事使人真堪流涕安危在運籌洙曰漢書運籌帷幄之中看君話王室感動幾銷憂西閣夜恍惚寒山暮逶迤白霧昏山虛風落石樓靜月侵門擊柝可憐子洙曰魯擊柝聞於邾易重門擊柝無衣何處村洙曰詩無衣無褐時危關百慮盜賊爾猶存宿江邉閣暝色延山徑髙齊次水門薄雲巖際宿孤月浪中翻洙曰謝靈運詩云林壑斂暝色鶴賦星翻漢回曉月將落韓曰何遜入西塞示南府同僚詩云薄雲巖際出𥘉月波中上鸛鶴追飛盡豺狼得食喧不眠憂戰伐無力正乾坤西閣雨望樓雨霑雲幔山寒著水城徑添沙面出湍減石稜生趙曰徑之所以添以水落而沙面出也湍減則石露而其稜自生可謂竒語矣菊蘂凄踈放松林駐逺情滂沱朱檻濕洙曰詩狓滂沱矣萬慮倚簷楹洙曰沈休文詩夕烏傍簷飛趙曰簷邊之柱也傍倚簷楹有所思矣不離西閣二首律詩九首陪鄭公秋晚北池臨眺新添北池雲水閣華館闢秋風獨鶴元依渚衰荷且映空采菱寒刺上踏藕野泥中素楫分曹往金盤小徑通萋萋露草碧片片晚旗紅杯酒霑津吏衣裳與釣翁異方初豔菊故里亦髙桐搖落關山思淹留戰伐功嚴城殊未掩淸宴巳知終何𥙷參軍乏洙曰作事歡娛到薄躬奉和嚴中丞西城晚眺十韻汲黯匡君切洙曰前漢汲黯字長孺武帝時為中散大夫以數切諌不得久留內遷於東海太守武帝曰古有社稷之臣如汲黯近之矣廉頗出將頻洙曰史記廉頗趙之良將頻為趙將兵破齊魏直詞才不丗雄略動如神洙曰取汲黯之直言廉頗之雄略以美嚴公也政簡移風速洙曰史記丗家太公至國修政因其俗簡其禮民多歸齊故五月而報政成周公曰政不簡不易民不有近平易近民民必歸之詩淸立意新余曰吕氏童蒙訓老杜詩云淸詩立意新最是作詩用力處蓋不可循習陳言只規摹舊作也魯直云隨人作計終後人又云文章切忌隨人後此自魯直見處也近丗人學老杜多矣左規右矩不能稍出新意終成屋下架屋無所取長魯直下語未嘗似前人而卒與之合此為善學層城臨媚洙曰一作暇景絶域望餘春洙曰層城髙城也絶域逺域也言蜀與京畿逺絶旗尾蛟龍㑹洙曰禮蛟龍為旗樓頭燕雀馴師曰言公之德及鳥獸也地平江動蜀天闊樹浮秦趙曰此兩句張大城上所望之逺也帝念深分閫洙曰馮唐曰上古王者之遣將也跪而推轂曰閫以內者寡人制之閫以外者將軍制之韋昭曰此郭門之閫也門中橛曰閫軍須逺算緍洙曰軍須師旅之費也漢武元狩四年𥘉算緡錢李旻曰緡絲也以貫錢出算二十也師古曰謂有儲積錢者其緍貫而稅之花羅封蛺蝶蘇曰漢武時西域獻蛺蝶羅師曰算緡衰丗之法公貢花羅瑞錦以應軍須與算緍者逺矣瑞錦送麒麟洙曰蛺蝶麒麟羅錦上絲繡也蘇曰漢武日本國貢麒麟錦十端金花眩人眼目趙曰言嚴公之入貢不忘朝廷也辭第輸髙義洙曰霍去病傳上為治第今視之對曰胸奴未滅無以家為由此上益重愛之觀圖憶古人洙曰馬援傳顯宗圖畫建武中名臣列將於雲臺以椒房故獨不及馬援東平王蒼觀圖言於帝曰何故不畫伏波將軍像帝笑而不言趙曰言嚴公可與古人為比當圖畫之征南多興緒事業暗相親晉杜預作征南將軍興緒公自為譜以預為祖出郭霜露晚凄凄髙天逐望低逺煙鹽井上洙曰蜀都賦家有鹽泉井立之曰逺煙蓋煮鹽也斜景雪峯西洙曰雪山也立之曰斜景落日也故國猶兵馬洙曰公長安人也他鄉亦洙曰一作正鼓鼙江城今夜客還與舊烏啼趙曰公惑亂而與烏俱啼其傷至矣瀼西寒望水色含羣動洙曰陶潜詩曰入羣動息朝光切太虛趙曰天台賦太虛寥廓年侵余日一作終頻悵望洙曰陸機豫書行前路既巳多後塗隨年侵興逺一蕭踈猿挂時相學鷗行炯自如瞿塘春欲至定卜瀼西居洙曰瀼水名管郫縣江水橫通山谷處市人謂之瀼趙曰先在赤甲方移瀼西也曉望白帝城鹽山徐步移班杖看山仰白頭翠深開斷壁紅洙曰一作江逺結飛樓日出淸江洙曰二作塞望喧和散旅愁春城見松雪洙曰顔延年詩山明望松雪始擬進歸舟洙曰謝玄暉詩天際識歸舟野望因過常少仙野橋齊度馬秋望轉悠哉竹覆靑城合孫曰蜀多以竹為橋參差不齊今云野橋齊可度馬江從灌口來洙曰靑城山名灌口地名昔秦守李氷疏鑿離堆以灌蜀土因而得名入村樵徑引嘗果栗園開落盡髙天日幽人未遣回野望淸秋望不極迢遞起曽隂鄭日遞待禮切趙曰晉陸冲詩層巒起曽隂逺水兼天淨孤城隱霧深葉稀風更落山逈日𥘉沉獨鶴歸何晚昏鴉巳滿林洙曰譏小人衆多也蘇曰陸機晚立汀上獨鶴未至曰獨爾歸晚昏鴉巳滿林矣余疑子美先得後句就而𥙷之趙曰何遜詩昏鴉接翅歸野望金華山北洙日一作南涪水西趙曰金華山涪水皆射洪縣也仲冬風日始凄凄山連越嶲蟠三蜀鄭曰嶲悉委切唐韻郡名十州志漢置越嶲郡以隸三蜀洙曰東西兩川及梁謂之三蜀田日左太冲賦注三蜀蜀郡廣漢犍為也水散巴渝下五溪洙曰越嶲郡名也當南蠻之要李德𥙿鎮蜀日置屯以制蠻寇五溪屬交址馬援征五溪蠻見上注鄭曰巴渝二州十州志太清四年武陵王於巴陵置楚州隋改為渝州獨鶴不知何事舞飢烏似欲向人啼射洪春酒寒仍録目極傷神誰為携洙曰射洪縣名屬梓州野望西山白雪三城戍洙曰按新史髙適傳上皇還京復分劒南為兩節度百姓弊于調度而西山三城列戍適上疏論之不納蘇曰西山雲嶺松州蕃界也鄧禹三年戍雪山經五十餘戰戰無不捷趙曰善本作三城舊本作三年非時吐蕃入寇故須防戍也南浦淸江萬里橋洙曰見卜居詩注趙曰公草堂在万里橋西也鄭曰成都第三橋海內風塵諸弟隔天涯涕淚一身遙洙曰寇亂諸弟離散獨公一人入蜀唯將遲暮供多病未有㳙埃答聖朝跨馬出郊時極目不堪人事日蕭條亭榭古詩三首律詩八首陪李北海宴歷下亭洙曰平邑人寋處士等在坐北海漢中壽縣也齊置比海唐屬靑州李北海李雍也鄭曰亭李之芳所作春秋戰國時並屬齊秦屬齊郡漢韓信伐齊至歷下乃此地也漢文帝分置濟南景帝改為濟南郡唐復為齊州東藩駐皂蓋洙曰後漢志中二千石皆皂蓋趙曰雍為靑州太守京師為東故稱東藩則上林賦齊列為東藩也北渚凌淸河洙曰一作靑荷陸士衡詩永嘆遵北渚趙曰屈原湘夫人云帝子降兮北渚漢輿服志清河則指言濟河濟河謂之清濟故也海右洙曰一作內此亭古謝逸曰此亭乃李之芳所創居海之右此亭作之久矣故云古濟南名士多洙曰後漢輿服志中二千石皆皂蓋朱兩轓陸士衡詩永嘆遵北渚張平子南都賦靑池亂北渚陸士龍詩北渚無河梁書濟南伏生蘇曰吳帝濟南英豪窟宅多出名士尹曰後漢左雄上言上九卿位亞三事班在大臣行有佩玉之節動有庠序之冝趙曰海在東而州在西則謂之海右冝矣濟南則指齊州名士則題注所謂邑人寋處士等也雲山巳發興鄭曰興去聲汪革曰陶淵明詩夏雲多竒峯故曰雲山師曰選詩靑雲却炎暉雲山發興謂喜得炎暉之却也玉佩仍當歌蒼舒曰春秋左傳吳申叔時乞糧於公孫有山氏曰佩玉蘂兮余無所緊之旨酒一盛兮余與褐之父睨之魏武帝短歌行對酒當歌趙曰言既有雲山之淸興又有三佩之人歌以侑飲取詩瓊琚玉佩者也薛列左傳佩玉蘂以為證乃是佩玉非玉佩修竹不受暑交流空湧波師曰傍有修竹淸隂森爽了無暑氣雖曲水流觴竟不如此故云云藴真愜所遇落日將如何洙曰謝靈運詩表靈物莫賞藴真誰為傳江淹詩悠悠藴真趍東京賦修竹冬靑隂池幽流趙曰藴真字江淹曽使言藏藴真趍也詩云悠悠藴真趍下言落日則惜其景之幽真而酒筵將散也師曰藴真者謂此亭韜藏真趣俗士莫知惟賢者遇此非常欣愜奈何興未䦨而日巳西頽故嘆云云貴賤俱物役從公難重過鄭曰重儲用切再也趙曰文選有牽以物役此非特言雍當之官而各别又見公之不趍貴以為夸矣彼淺文夫者冀宵燭之末光分玉􅕌之餘瀝而不知耻與公有間哉師日貴指言李北海賤甫自謂也貴賤雖殊其為事物所役則一人生天地間勞形體疲精神歡㑹時少怨别時多恐此一㑹罷難與公再獲過此甫所悵惜也登歷下古城貟外新亭北海太守李雍作洙日本傳云李雍天寶𥘉為汲郡北海二太守時李之芳自尚書郎出齊州司馬作此亭歷下齊州春秋戰國並屬齊秦屬齊郡漢韓信伐齊至歷下即其地文帝分置濟南景帝改為濟南郡朱後周同隋𥘉郡廢煬帝𥘉置齊州大唐復為齊州或為臨淄郡復改為濟南郡吾宗固神秀洙曰謝宣逺答靈運詩華宗誕吾秀之子紹前胤公有譜系自言李杜同出故言吾宗也夢符曰右按此亭乃李之芳所構詩乃北海太守李雍為之芳作也注言李杜同出其誤甚矣趙曰題下公自注云李之芳出齊州司馬製此亭今雍言吾宗蓋指李之芳耳此景甚易曉體物寫謀長洙曰陸士衡文賦體物而瀏亮潘嶽西征賦摹寫舊豐制造新邑形制開古跡趙曰舊有此亭而之芳新之杜公前篇所謂海右此亭古也師曰人禀神秀之氣能體物景寫其謀謨創造此亭頗有長人之智然即其古城而開敞之故云形制開古跡曾冰延樂方鄭曰曽昨棱切重也趙曰謝靈運詩峩峩曽氷食師曰曾氷者諸家多不曉其義殊不知重隂沍寒之氣排煩暑爽情思可以延引歡笑此其術也方術也太山雄地里巨壑眇雲莊洙曰陳江㧾鍾銘舟移巨壑髙興泊煩促洙曰張荗先答何邵詩煩促每有餘永懷淸典常洙曰詩維以不永懷易既有典常含弘知四大洙曰易卦含弘光大品物咸亨老子域中有四大道大天大地大王亦大出入見三光洙曰日月星為三光亦謂之三辰又前漢郊祀志三光天文也負郭喜粳稻洙曰左太冲詠史詩陳平無産業歸來翳負郭左太冲蜀都賦粳稻漠漠謝靈運㑹吟行滮池溉粳稻趙曰蘇秦曰使我有洛陽負郭田二頃安能偑六國相印乎安時歌吉祥洙曰莊子人間丗篇吉祥止止趙曰莊子安時處順雍詩多有出處然公集中録雍首唱之詩於此豈取其同法門耶師曰地理志此古城枕太山之麓極為雄壯又襟帶濟水巨壑即溪壑之接濟水者是也水氣在天為雲雲莊即雲氣屯聚如莊然莊者藏聚之義眇言襟帶之逺也上句有曾氷故下言髙興泊煩促謂隂凉之氣爽人故也典常言李之芳以常道化民風俗肅淸大懷其惠永永不忘含弘者謂古城廣逺無所不包足見其有四大之制太山髙大日月星辰迭為隱見一出一入皆慿髙可以望而見之負郭者倚郭也黍粘曰稻榖者民之司命太守者民之師帥太守登臨所以觀民風豈徒從事於逰覽而巳哉今覩負郭粳稻之稔足知為康樂之時吉祥兆于此故從而歌之也亭對鵲湖洙曰公自注亭對鵲湖趙曰李北海唱之於前而公和之於後新亭結構羅洙日左太冲招隱詩岩穴無結構何平叔景福殿賦結構則修梁彩制謝玄暉郡內髙齊詩結構何迢繞王延壽靈光殿賦其結構規模應天趙曰亭對鵲湖故云或隱或見於淸湖之隂者言昏明異候也句如謝惠連行雲星隱見是也隱見淸湖隂洙曰謝惠連西陵遇風詩分𬒮澄湖隂注水南曰隂跡籍臺觀舊鄭曰觀古玩切釋名曰觀於上觀望也趙曰此亭乃圖籍所載舊有臺觀之跡彥輔曰魏文帝銅雀臺詩朝遊髙臺觀氣溟海嶽深趙曰言東海太山之氣相與冥接也彥輔曰隋江揔碗賦副君海停嶽峙圎荷想自昔彥輔曰陳祖孫登詠荷詩圓荷承日暉遺堞感至今洙曰遺堞城堞也鄭曰堞徒協切城上垣也趙曰指物感槩蓋詩人之興芳冥此時俱彥輔曰謝眺賦曲水宴詩曰嘉樂具矣芳宴在斯哀絲洙曰一作絃千古心蘇曰何敬祖聽隂子堅彈琴古人不見哀絲上寫出千古之意心田曰𥙷遺云枚叔七發天下之至悲趙日言後之視今亦猶今之視昔矣記云絲聲哀故云哀絲主稱壽尊客洙曰張平于南都賦客賦醉言歸露未晞曹子建樂府詩主稱千金壽賔奉万年酬彥輔曰史記武安君起為壽如淳曰上酒為稱壽筵秩宴北洙曰一作密林洙曰詩賔之𥘉筵左右秩秩趙曰鬱彼北林因所宴實在北林故借用也彥輔曰秩秩肅敬也曹植詩徑回路兮造北林不阻蓬蓽興洙曰傳長虞贈何劭歸身蓬蓽廬蓽荊織門也禮蓽門圭竇趙曰蓽音畢官韻注云藩落也謂亭處幽逺故有蓬蓽之興得兼洙曰一作兼得梁甫吟洙曰陸士衡詩齊僮梁甫吟諸葛亮躬耕隴畒好為梁甫吟盛弘之荊州記鄧城西七里有獨樂山諸葛亮常登此山作梁甫吟趙曰諸葛亮登山作梁甫吟蓋在野之一歌也其詩曰步出齊城門遙望蕩隂里里中有三墳纍纍正相似問是誰家冢田強古治子力能排南山文能絶地理一朝𬒳讒言二桃殺三士誰能為此謀相國齊晏子觀此則見公之深意矣彥輔曰劉向雅琴賦潜心蓬蓽之中樂府有梁甫吟李善注蔡雍琴頌曰梁甫悲吟師曰此詩乃甫和李北海之詩然李公之詩何以得集于杜詩之內蓋謂李公唱之甫和之遂見其本末之由故先編李公詩而以甫詩繼于後也新亭乃李之芳所創者水南曰陽水北曰隂清湖乃鵲湖也按地理志歷下亭居鵲湖之北故云隱見淸湖隂臺觀舊謂後齊築作臺觀猶存之芳特因其舊迹敞以新亭氣溟海嶽深謂此城慿太嶽襟帶滄海海嶽之氣溟濛然而深邃矣李之芳疏鵲湖種圎荷修飾雉堞至今人感思之如召公聽訟甘棠下後丗思之而不忘以為勿翦勿伐遺堞者城上矮墻也哀絲乃琴瑟之聲哀怨此時俱謂諸賔客畢集于此千古心謂歷下之城廢興非一代覩今感昔哀樂之情一寫之琴瑟而巳主稱壽者稱舉也言主人重客故舉觴為壽北林謂此亭居鵲湖之北林木森爽筵設於此尊卑之位秩秩然有次序蓬窗蓽户甫自言貧賤之居諸葛亮常作梁甫吟梁甫吟者山東之音也凡人思鄉各為本土之音杜甫西人也今客山東寧無思鄉之情然對食當歌必有所感傷故云不阻蓬蓽興得兼梁甫吟意謂家不阻限東西其興為如之何猶得兼為梁甫之吟不亦善乎滕王亭子彥輔曰在玉臺觀內王調露年中任閬中刺史云一云閬州玉臺觀滕王亭子作王曾典此州君王臺榭枕巴山萬丈丹梯尚可攀洙曰謝靈運詩灑步臨丹梯謝玄暉敬亭山詩要欲追竒趣即此凌丹梯春日鶯啼修竹裏仙家犬吠白雲閒洙曰神仙傳淮南王丹成上升雞大䑛其鼎亦仙去今天上有雞鳴犬吠淸江碧石傷心麗趙曰麗矣而謂之傷心則追感滕王之殁空餘景在耳嫩蘂濃花滿目班人到于今歌出牧來遊此地不知還滕王亭子寂寞春山路君王不復行古牆猶竹色虛閣自松聲鳥雀荒村暮雲霞過客情尚思歌吹入鄭曰吹盡僞切千騎把霓旌洙曰髙唐賦不見其底虛聞松聲又云霓為旌翠為蓋梁孝王傳得賜天子旌旗千乘萬騎章梓州水亭洙曰時漢中王兼道士席謙在㑹同用荷字韻城晚通雲霧亭深到芰荷吏人橋外少蘇曰尹伯吉為用陽令好飲語友人曰可同過橋飲彼處吏人少潘嶽詩貪杯避吏人秋水席邊多近屬淮王至洙曰淮南王劉安以比漢中主髙門薊子過鄭曰薊居例切洙曰家家迎薊子以此席道士也趙曰後漢薊子訓有神異之術士大夫嚮慕之到京師公卿以下候之者座上常數百人今公詩句又以尊章梓州之能致異人矣荊州愛山簡吾醉亦長歌洙曰山簡習池事以比章梓州也趙曰以山簡比章留後山簡每出嬉游多之池上置酒輒醉時有童兒歌曰山公出何許每至髙陽池日夕倒戴歸酪酊無所知公言吾醉亦長歌則效童兒之為歌矣登牛頭山亭子路出雙林外亭窺萬井中洙曰市井也江城孤照日山洙曰一作春谷逺含風兵革身將老關河信不通趙曰吐蕃猶盛也猶殘數行淚鄭曰行胡岡切忍對百花叢題鄭縣亭子鄭縣亭子㵎之濵户牖慿髙發興新洙曰言臨髙多發新興雲斷嶽連臨大路洙曰路一作道蓮蓬望忽開注趙曰指言蓮花峯也天晴洙曰一作淸宫栁暗長春趙曰指言長春宫也在同州朝邑縣皆華山所臨巢邉野雀羣欺燕花底山蜂逺趂人更欲題詩滿靑竹晚來幽獨恐傷神洙曰野雀欺燕山蜂趂人皆感時而作故未有幽獨傷神趙曰舊注謂感時而作也此實道其事而似譏之爾蓋公以論房琯不宜廢帝怒而出之當時無嫉之者重題鄭氏東亭洙曰在新安界鮑曰即駙馬鄭潜曜也華亭入翠微洙曰釋名山未及上曰翠微見昭陵詩注夢符曰右按爾雅釋山未及上曰翠微疏曰未及頂上在旁坡陀之處名翠微一說山氣靑縹色故曰翠微秋日亂淸輝洙曰江文通詩秋日懸光輝謝靈運山水含淸輝崩石欹山樹淸漣曵水衣薛曰右按詩河水淸且漣漪水成文曰漣師曰水衣荇也紫鱗衝岸躍何曰紫鱗魚也蒼隼護巢歸師曰隼以客遊故歸護其巢此甫所以傷其無家也向晚尋征路殘雲傍馬飛泊松滋江亭紗帽隨鷗鳥扁舟繫此亭江湖深更白松竹逺還洙曰一作微靑一柱全應近洙曰劉孝綽詩云經過一柱觀髙唐莫再經蘇曰王允下峽嘆曰髙唐灔澦莫願再經今宵南極洙曰一云南斗外甘作老人星洙曰前漢天文志狼星北地直大星曰南極老人老人見治安不見兵起常以秋分時候之南郊晉志老人星在孤南趙曰公將盡楚而往故云南極外也江亭坦腹江亭暖洙曰王羲之東床坦腹長吟野望時水流心不競雲在意俱遲寂寂春將晚欣欣物自私洙曰陶淵明賦木欣欣以向榮故林歸未得排悶強裁詩洙曰排猶排去也蘇曰劉公幹曰吾非好吟詠強裁排悶耳師曰萬物感陽而各遂其性甫以故林歸未得以至憂悶殆不若夫欣欣之物邪分門集注杜工部詩卷第五
