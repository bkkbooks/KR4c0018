  - {type: variant, offset: 0, length: 24557, content: 曰杜言儒冠栖栖不偶於丗不如世胄綺紈飽食終身師曰杜甫生於睿宗先天元年死於代宗大曆五年年五十有九歷睿宗玄宗肅宗代宗凡四朝也天寳十三年獻三賦玄宗命宰相試以文章授河西尉不行天寳十四年安禄山亂甫挈家避亂郟州䧟賊中肅宗至德二載脫身歸鳯翔府上謁肅宗肅宗授以左拾遺當是時房琯以宰相緫兵與賊戰琯儒者用春秋車戰之法爲賊所敗由是得罪甫上䟽論琯不宜廢肅宗怒貶甫爲華州司功甫旣不得志聞李白在山東將爲山東之遊遂作此詩辭韋左丞明巳無罪而去觀甫嘗有憶李白詩之句何時一樽酒重與細論文蓋謂此行爲㝷李白故也紈袴貴遊子弟之服餓之義有二絶粒曰餓不食禄亦曰餓若伯夷叔齊餓于首陽采薇而食不食周禄正此餓也當禄山之亂武夫悍卒皆以軍功取封侯其子弟從自襁褓至于老死誰有不食禄者獨文儒之士不能擐甲出戰皆寂寥不見用以此誤身者多矣甫嘗有詩曰儒衣山鳥怪蓋軍興之際山鳥見儒衣猶且恠駭甫於此時唯以文儒爲務得不誤身乎蓋嘆武夫得志傷吾道之不用也丈人試靜聽賤子請具陳洙曰易師貞丈人吉注丈人嚴莊之稱也應璩百一詩避席跪自陳賤子實玄虚鮑昭東武吟主人且勿喧賤子歌一言趙曰吴越春秋載伍子胥謂漁父曰性命屬天今屬丈人此乃杜公呼爲丈人者矣具陳見蜀志許靖與曹公書有云豈可具陳而丗有託名東坡事實輒云毛遂有言賤子一一具陳之以爲渾語却不引出何書其全秩引類皆如此非特浼吾杜公又浼蘇公而罔無識眞大難之厄學者之不幸也師曰丈人尊長之稱指韋丈也賤子謙辭甫自稱也甫欲韋又静聽故具陳其所以不遇之意甫昔少年日洙曰少一作妙賈誼洛陽年少定功曰沈休文别范安成云平生少年日早充觀國賔洙曰易觀國之光利用賔于王彦輔曰杜嘗策名薦書也師曰甫天寳十三年獻三賦召試文章故云云讀書破萬卷下筆如有神洙曰魏文帝典論云傅武仲下筆不能自休孔文舉表性與道合思若有神呉質曰摛藻下筆鸞龍之文奮矣蘇曰仲舒荅䇿下筆疑有神助趙曰梁孝元帝之敗焚圖書十四萬卷曰讀書萬卷猶有今日故焚之中着一破字則字着力而新竒矣賦料揚雄敵蘇曰司馬長卿賦時人皆稱典而麗雖詩人之作不能多也揚子雲曰長卿之賦不似從人間來其神化所至即子雲學長卿爲賦故雅推服趙曰雄傳曰顧嘗好辭賦毎擬相如故公於賦則言敵揚雄詩看子建親洙曰左太冲詠史詩曰弱冠弄柔翰卓犖觀群書著論准過秦作賦擬子虚又詩言論准宣尼辭賦擬相如揚雄有長楊甘泉等賦子建曹植也黃曰曹植字子建封陳思王善屬文著洛神賦責躬公讌等詩後人謂天下才共一石子建獨得八㪷趙曰鍾嶸爲詩品其品子建詩云植詩原出於國風氣骨髙竒辭彩華茂超越今古卓爾不羣故公於詩言親子建也親字親近之親親子建者言與之近也彦輔曰杜於詩賦盖以二人爲凖李邕求識面洙曰李邕見文苑傳廣陵江都人父善嘗注文選邕少知名長安李嶠等薦邕詞髙行直堪爲諌官由是召拜左拾遺玄宗東封獻賦稱旨能文養士賈生信陵之流後進不識京洛阡陌聚觀以爲古人或傳眉目有異衣冠望風㝷訪門巷又中使臨問索其新文性豪侈不護細行尢長碑頌中朝衣冠多持金帛往求其文修可曰識面字如北史齊神武自太原來朝見宋遊道曰常聞其名今日始識其面王翰願卜隣洙曰卜一作爲唐文苑傳王翰并州晉陽人少豪蕩不覊櫪有名馬家有妓樂翰發言立意自比侯王日聚英豪從禽擊鼔恣爲歡賞文士祖詠杜華嘗在座趙曰李邕王翰唐文苑一時之文人也以李邕而有識面之求以王翰而有卜隣之願則公之名重於時可知彦輔曰左傳曰惟鄰是卜師曰破萬卷謂識破其理如中庸曰君子之道語大天下莫能載語小天下莫能破大抵人誰不讀書識破其理者寡矣故孔子曰黙而識之甫旣識破萬卷之理縱横妙用無施不可故下筆之際如有神異漢揚雄嘗作甘泉等賦魏曹子建其兄常欲殺之子建七歩成詩曰煑豆燃豆箕豆向釡中泣本是同根生相煎何太急甫以揚雄之賦與巳相敵躰以子建之詩但親近於已是甫以詩才自負謂子建所不若也唐李邕有才名後進想慕求識其面以至道塗聚觀傳其眉目有異唐王翰文士也杜華嘗與遊從華母崔氏云吾聞孟母三徙吾今欲卜居使汝與王翰爲隣蓋愛其才故也甫以文章知名當丗士大夫皆想慕之故以李邕王翰自比自謂頗挺出洙曰出一作生彦輔曰一作特立登要路津洙曰古詩何不策髙足先據要路津致君堯舜上再使風俗淳洙曰伊尹致君堯舜又魏杜恕舉明主於唐虞之上修可曰魏應璩與從弟君胄書云思致於有虞此意竟蕭條行謌非隱淪洙曰前漢朱買臣家貧好讀書不治産業艾薪樵賣以給食擔束薪行且誦書其妻亦負戴相隨數止買臣母歌謳道中買臣益疾歌妻羞之求去恚怒曰如公等餓死溝中耳何能冨貴買臣不能留即聼去其後買臣獨行歌道中負薪墓間宋顔延年詠嵇中散詩曰立俗遷流議㝷山結隱淪謝眺敬亭詩隱淪旣巳託鮑昭詩孤賤長隱淪謝靈運旣枉隱淪客趙曰列子載林類年且百歲拾穗行歌張湛註云古之隱者也舊却引朱買臣行歌道中負薪乃窮困悲歌耳與非隱淪之義不相接隱淪字出桓譚新論曰天下神人五一曰神仙二曰隱淪師曰揆者特也路與津者衝要之所乃人物輻湊之地以譬則逹官也官有清有要淸而不要則无懽要而不淸則拘於俗旣淸且要乃爲美官甫方召試文章以淸要自期必謂時出登于要路津豈期授以河西尉故此意寥寂不獲致君與澤民也隱淪者隱逸之士也甫旣不見大用辭河西尉又不能隱居林下其貧賤如朱買臣負薪行歌於路必爲隱淪之徒所非議矣昔孔子不遇見非於長沮桀溺晨門荷蓧之徒亦若此爾騎驢三十載洙曰任昉詩結歡三十載生死一交情陶潜閑居三十載彦輔曰後漢獨行傳向相或騎驢入市乞丐於人杜自言不遇蓋一丗矣定功曰後漢李尤有騎驢馳村狐兎驚走旅食京華春定功曰言貧困騎驢三十載矣而畢竟乃旅食長安此自傷之意耳魏文帝與呉質書旅食南館耳彦輔曰郭璞詩曰京華豪俠窟朝扣冨兒門鄭曰朝陟遙切早也下去苟切擊也又苦侯切義同趙曰鮑昭詩結交多貴門山入冨兒鄰是也暮隨肥馬塵殘盃與冷炙洙曰顔氏家訓云礼曰君子无故不徹琴瑟古來名士多所愛好者梁初衣冠子孫不知琴瑟大同以未斯風頓盡然而此樂音雅致有深味哉今丗曲解雖變於古猶足以暢神情也唯不可令有稱譽見役勲貴處之下座以取殘盃冷炙辱戴安道猶遭之况爾曹乎蘇曰吴起嘗嘆曰丈夫兒事未濟甘晦休山林焉能逐浮薄子苟冷炙殘盃焉到處潜悲辛修可曰鮑昭野鶴賦對鍾鼓之悲辛師曰驢賤者所乗也得志則乗髙車大馬貧賤則跨驢而巳昔李白以文章待詔翰林後放逸不撿遂流落不用嘗爲華隂令所辱令致對云曽遇龍巾拭吐御手調羹天子殿前尚與吾走馬華隂縣裏不許我騎驢初貴故走馬後貧賤故出騎驢甫旣辭河西尉貧在京師自未獻賦之前迨今凡三十年矣獻賦時年四十三京華者言京師乃繁華之地當春月貴遊相追逐繁絃脆管无處不有甫獨旅食于此其寂寞可知故朝扣冨兒門拯刺求見暮則隨其後塵爲當朝士夫所薄如此殘盃謂甕之餘者香巳埋歇柔肉曰炙冷炙謂宿炙也甫旣貧賤糊口京師貴遊薄之惟待我以殘盃與冷炙深使人暗地抱辛酸也主人頃見徴彦輔曰漢雜事宣帝蔣蒲與子方召見徴歘然欲求伸洙曰易曰尺蠖之屈以求伸靑冥却垂翅蘇曰李斯曰丈夫兒提筆鼓吻取冨貴易若舉盃何靑㝠之翮與鷃共垂翅乎修可曰祖出屈原悲回風云據靑冥而攄虹王逸九思玄鶴兮髙飛増逝兮青冥注靑冥雲也洙曰後漢馮異傳始雖垂翅終能奮翼龜池蹭蹬無縱鱗洙曰王褒聖主得賢臣頌曰沛乎若巨魚縱大壑海賦蹭蹬窮波失勢貌甚媿丈人厚甚知丈人眞洙曰易卦注丈人莊嚴趙曰厚言其相待之厚如後漢云所以慰藉之甚厚真言其懷抱之真盖如莊子其爲人也真毎於百寮上尹曰史相囯位諸侯王百寮之上猥誦佳句新洙曰杜詩云爲人性癖躭佳句語不驚人死不休修可曰按南史謝惠連傳族兄靈運嘉賞之云毎有篇章對惠連輒得佳語趙曰誦佳句於同寮是時公巳召試賜官也彦輔曰佳句公自謂也竊効貢公喜洙曰貢公貢禹也前漢王吉傳吉字子陽與貢禹爲友丗稱王陽在位貢禹彈冠言其取舎同也師古曰彈冠者且入仕也修可曰劉孝標廣絶交論曰王陽登而貢公喜趙曰舊所引雖是然无喜字亦不謂之貢公此乃劉孝標廣絶交論王陽登而貢公喜是也難甘原憲貧洙曰仲足弟子傳原憲在草澤中子貢相衛而結駟連騎排藜藿入窮閻過謝原憲攝敝衣冠見子貢子貢恥之曰夫子豈病乎原憲曰吾聞之无財者謂之貧學道而不能行謂之病若憲貧也非病也子貢慙而不懌而去終身恥其言之過也焉能心怏怏鄭曰怏於亮切不足也洙曰韓信傳信知漢王畏惡能其稱疾不朝由此怨望居常怏怏羞與絳灌等列師古曰怏怏志不滿周亞夫傳此怏怏非少主臣也趙曰心怏怏出吳越春秋呉王僚之母謂王曰公子光心氣怏怏常有愧恨之色舊却引韓信周亞夫鞅鞅字又不連心字非公本意所引用耳秪是走踆踆鄭曰踆也倫反洙曰踆踆行走貌張平子西京賦犬踆踆今欲東入海洙曰語曰乗桴浮于海又曰少師陽擊磬襄入于海也趙曰此詩人欲去之意造語如此非真有東海之役也即將西去秦洙曰李斯上秦始皇書今乃却賔客以弃諸侯使天下之士退而不敢西向褁足不入秦此所謂藉㓂兵而齎盗粮沈曰秦州君西戎地春秋時爲秦囯後并天下爲隴西郡彦輔曰此蓋子美欲去京師由梁齊也尚憐終南山洙曰周庾信有駕幸終南山詩地理志稱扶風武功縣東有大山古文以爲終南昭四年左傳曰荆山中南九州之險是周地之名山鄭曰福地記云其山東接驪山太華西連大向隴山北去長安八十里南入楚塞連蜀東西數百里亦曰中南回首淸渭濵洙曰吕望垂釣於渭水得玉璜遂爲帝師修可曰潘安仁西征賦言長安之境曰南有玄霸素滻北有清渭濁涇故公凡言渭必曰清渭言涇必曰濁涇皆用此矣彦輔曰孔子去魯遲遲其行孟子三宿而後出畫此可以見子美之志常擬報一飯洙曰史記范雎傳睢爲將軍於是散家財物盡以報所嘗困戹者一飯之恩必償睚眦之怨必報李固傳切感古人一飯之報注謂靈輒也孔融一飯之惠必報况懷辭大臣趙曰以一飯之恩嘗欲如靈輒之報宣子況大臣相知不獨一飯耳其去之懷爲如何白鷗波浩蕩洙曰波一作没鄭曰蕩徒朗切蘇曰波乃没字也古詩云没白鷗之浩蕩若作波字乃上下句不相符信没字耳宋敏求云鷗不善没改作波殊不知鷗之滅没於煙波間最爲自然善舊本作没禽經云鳬善浮鷗善没當以没字爲是萬里誰能馴鄭曰馴松倫切洙曰顔延年詠嵇中散詩曰鸞翮有時鍛龍性誰能馴離騷曰怨靈脩之浩蕩鮑昭詩翻浪揚白鷗謝眺詩浩蕩别親知潘岳河陽詩洪流何浩蕩夢符曰右按列子海上之人好鷗鳥者毎旦之海上從鷗鳥游其父曰吾聞鷗鳥皆從汝遊汝取來吾玩之明日之海上鷗鳥舞而不下也趙曰浩蕩雖本水而不必專言水或取流放之貌如離騷云怨靈脩之浩蕩或取曠逺之貌如楚辭曰志浩蕩而傷懷是也丗間本多作波字東坡定作没字言鷗滅没於煙波間而浩蕩逺去尤有義理而宋敏求謂鷗不解没則波字便覺一篇神氣索然也范淑衷甫云丗有師曠禽經之書其中曰鳬善浮鷗善没則没字却是沉没之没即與前說又相反矣彦輔曰按唐末有周後人翊聖者撰摭言乃以杜此篇與莫相疑行謂之自負嗚呼若人者曷足以語杜詩哉韓退之云尚何自負之有如殘盃冷炙之謂歟故老子曰不笑不足以爲道又曰下士聞道大笑之不當曰李杜文章在光熖萬丈長不知群愚兒何用故謗傷蚍蜉撼大樹可笑不自量余以退之爲知言師曰主上謂肅宗也至德二載肅宗見徴徴召也召授左拾遺歘即倐忽歘然如屈蠖乆蟄志欲求伸甫當此時謂得所施爲遂上䟽論房琯事不期貶華州司功故云青冥却垂翅蹭蹬無縱鱗青冥天也蹭蹬失勢之貌青天可以飛騰今反垂翅巨魚可以縱壑今反蹭蹬蓋傷其得罪也唯韋丈與甫相厚善而知甫爲人眞率故及于此韋丈愛甫蓋重其詩才毎於百寮之上謂於宰相前常稱誦其佳句故有拾遺之擢當此時喜得韋丈推引故効貢公之喜得王陽在位也今乃復見貶黜貧賤又如原憲誠使人所難甘矣雖然如是亦安能怏怏於朝廷秖是不免奔走託食於他郷也韓信旣謫爲淮隂侯常怏怏不樂意在怨君甫則不然踆踆奔走之狀山東慿海之郡唐都長安長安即秦地甫欲適山故云東入海秦地在西甫旣適東必離去于西秦故云西去秦終南山與渭水皆秦地山水甫將東入海尚眷眷於終南清渭者不忍弃君而去也自古忠臣身在畎畒心不忘君一飯之恩猶擬報之矧夫身爲拾遺巳嘗食人之禄其忍遽忘于君詩家獨推重杜詩蓋取其不忘君之意也大臣謂左丞也左丞與甫厚善其判别之情得無懷思乎雖然如是甫之無官守言責其進退綽綽然有餘𥙿真若鷗在浩蕩之波去來自得誰能馴狎哉浩蕩廣大之貌王荆公嘗以波字爲没字其謬甚也鷗善浮没何必獨言没耶如前輩諸公因舉杜詩身輕一鳥過之句坐間皆忘過字因共𥙷之或言下或言疾竟不似過字之爲渾成也則知没浩蕩亦不如波浩蕩之自然上韋左相二十韻彦輔曰按韋見素傳見素嘗爲左丞相子倜鄂位至給事中孫顗爲尚書左丞也鮑曰韋見素襲父爵彭城郡公十三載拜武部尚書從帝入蜀詔兼左相鳯曆軒轅紀洙曰昭十七年傳郯子來朝公與之宴昭子問焉曰少皡氏鳥名官何也郯子曰吾祖也我髙祖少皡摯之立也鳯鳥適至故紀於鳥爲鳥師而鳥名鳯鳥氏曆正也注鳯鳥知天時故以名曆正之官史記曰黄帝名軒轅龍飛四十春洙曰自玄宗即位至天寳十一載四十年十三載見素爲武部尚書同中書門下平章事龍飛玄宗即位也沈存中曰文章自應律度未嘗以音韻爲主詩第二字側入謂之正格如子羙此二句皆二字平入謂之偏格如唐名軰詩多用正格子美詩用偏格者十無二三八荒開壽域洙曰荒大也八方也歐民庶於仁壽之域昱曰列子仲尼篇逺在八荒之外前漢王吉䟽願陛下與大臣述舊禮明王制歐一丗之民躋之仁壽之域一氣轉洪鈞洙曰張茂先荅何劭詩洪鈞陶萬類霖雨思賢佐洙曰髙宗命傅說曰若歲大旱用汝作霖雨丹青憶老臣洙曰趙充國傳充國以功德與霍光等列畫未央宫成帝時西羌嘗有警上思將帥之臣追美充國廼召揚雄即充國圖像而頌之後漢胡廣傳靈帝思感舊臣乃圖畫廣及太尉黄瓊於省内詔議郎蔡邕爲其頌云孝祥曰韋相公之先人遺風餘烈至今稱之故云丹青憶老臣應圖求駿馬洙曰梅福傳欲以三代之法取當丗之士猶以伯樂之圗求騏驥於市而不可得亦巳明矣馬援好騎善别名馬於交趾得駱越銅鼓乃鑄爲馬式還上之馬髙三尺五寸有詔置於宣德殿下以爲名馬式焉趙曰此言見素以材見用也魏曹植獻文帝馬表曰臣於先帝丗得天宛紫騂一匹形法應圖舊注引梅福傳非干此也驚代得騏驎洙曰張揖注相如賦雄曰騏雌曰驎其狀麋身牛尾狼蹄一角沙汰江河濁鄭曰汰他蓋切洙曰言爲吏部日也北史新雄爲尚書郎㑹沙汰郎官雄與羊琛等八人俱見留調和鼎鼐新鄭曰鼐曩宰切洙曰言爲相也說命若作和羹用汝爲塩梅釋器云鼎絶大者謂之曰鼐韋賢初相漢洙曰韋賢字長孺授昭帝詩宣帝本始三年代蔡義爲丞相范叔巳歸秦洙曰史記范雎字叔更名姓曰張禄王稽載入秦昭王大說拜雎爲客卿封應侯相秦盛業今如此傳經固絶倫洙曰韋賢兼通禮尚書少子玄成復以明經仕至丞相故鄒魯諺曰遺子黄金滿籝不如一經豫樟深出地滄海闊無津洙曰豫樟木良材也滄海百谷之所歸其淵不可津涯北斗司喉舌洙曰李固傳陛下之有尚書猶天之有北斗也北斗爲天之喉舌尚書亦爲陛下喉舌斗斟酌元氣運于四時尚書出納王命東方領搢紳鄭曰搢即刃切洙曰郊祀志搢紳者弗道李竒曰搢紳揷笏於紳紳大帶也臣瓚曰縉赤白也紳大帶也左氏傳有縉雲氏師古曰李云搢紳是也字本作搢揷笏於大帶之間與革之間耳非揷於大帶也或作薦紳者亦謂薦笏於紳帶之間其義同相如曰搢紳先生之徒也持衡留藻鑒聽履上星辰洙曰公時兼兵部尚書故云聽履上星辰鄭崇哀帝時爲尚書僕射数求見諌爭上納用之毎見曵革履上笑曰我識鄭尚書履聲趙曰見素爲吏部侍郎平判皆誦於口銓選平允人多德之上星辰以言其親帝之旁猶言上雲霄矣獨歩才超古昱曰魏志王􅙾字仲宣山陽髙平人曹植與楊修書曰今丗作者可略而言若仲宣獨歩於漢南彦輔曰任昉曰勲遂超古餘波德照隣洙曰一云餘隂照北鄰余曰左傳僖公三十三年波及晉囯君之餘也逸曰語德不孤必有隣聦明過管輅鄭曰輅魯故切洙曰魏志方伎傳管輅字公明喜仰視星辰常云家雞野鵠猶尚知時況於人乎琅瑘太守單子春語衆人曰此年少盛有才器聽其言論近似司馬天子游獵之賦何其磊落雄壯英神巳茂必能明天文地理變化之數不徒有其言也於是發聲徐州號之神童尺牘倒陳遵洙曰前漢游俠傳遵字孟公略渉傳記瞻於文辭惟善書與人尺牘主皆藏去以爲榮倒猶傾服也豈是池中物洙曰呉志周瑜傳晉書劉元海傳並云蛟龍得雲雨非復池中物由來席上珎無巳曰礼儒行儒有席上之珎以待聘廟堂知至理風俗盡還淳魯曰此言宰相之能事畢矣才傑俱登用愚蒙但隱淪趙曰公自謂也長卿多病乆鄭曰長展兩切洙曰司馬相如字長郷嘗有消渴病與卓氏婚饒於財故其事宦未嘗肯與公卿囯家之事常稱疾間居不慕官爵子夏索居貧鄭曰索昔各反趙曰公以二人自比也司馬相如常有消渴病子夏離群索居索居蕭索也回首驅流俗余曰孟子曰同乎流俗生涯似衆人余曰莊子養生主篇其生也有涯巫咸不可問洙曰列子有神巫自齊來命曰季咸知人生死存亡禍福壽夭期以歲月卒爲壷丘子所困鄒魯莫容身洙曰莊子盗跖篇孔子再逐於魯削跡於衛窮於齊圍於陳蔡不容身於天下者豈足貴耶感激時將晚蒼茫興有神鄭曰興許應切趙曰蒼茫荒寂之貌公處荒寂之間而興有神則感激所致不覺如神也爲公歌此曲涕淚在衣巾師曰曆所以推日月星辰之數鳯知天時故軒轅以名曆官所謂鳥官者如此之類易飛龍在天大人造也龍以喻君考之鳯曆玄宗即位至天寳十一載巳經四十年見素時爲尚書同門下平章載調和一元之氣運轉洪鈞以陶成萬物遂使八方荒逺之民咸躋于仁壽之域霖兩思賢佐丹靑憶老臣謂見素之父湊遺風餘烈至今人思之故有是句應圖求駿馬謂像父而求其子果得見素之賢也沙汰江河濁言公爲相得以進退百官奬清廉而去貪濁也昔韋賢父子皆以經術相継爲漢相今見素父子亦然故下文又云傳經固絶倫范叔遭困戹變名姓曰張禄來㱕秦秦相之湊𥘉仕隋後歸唐故云范叔巳㱕秦豫樟深出地滄海闊无津言見素本盛族根本淵源之髙大也見素從玄宗入蜀兼左相天寳中爲兵部尚書故云北斗司喉舌聽履上星辰天寳五載爲吏部侍郎銓序平允故云持衡留藻鑒天寳十五載是年八月肅宗立改元至德十月丙申有星犯昴見素言於肅宗曰昴者胡也禄山將死帝曰日月可知乎見素曰福應在德禍應在刑昴金忌火行當火位昴之昏乃其時也及禄山死日月皆不差管輅善天文地理今見素所言如此故曰聦明至管輅東方朔爲縉紳領䄂或云康王之誥太保率西方諸侯入應門左畢公率東方諸侯入應門右時公爲相率百官故云領縉紳愚蒙但隱淪甫自謂病肺不堪求仕但隱居淪晦而已非若公之才傑登用于廟堂能使風俗追還淳古之治驅流俗言與流俗驅馳不能擺脫俗累生涯似衆人言貧與編户等也巫咸善知人貴賤壽夭甫雖貧賤多病猶能安於分命莫肯扣問斯人而有覬覦之心也甫自言東西南北人故有比於夫子之不容于丗也時將晚傷衰老也蒼茫曠逺貌言興之超逸贈韋左丞文濟鮑曰唐韋濟嗣立子天寳中爲尚書左丞左轄頻虚位洙曰晉天文志轄星傅軫兩旁主王侯左轄爲王者同姓右轄爲異姓詩節南山尹氏太師維周之氐義云氐作挃轄之挃言尹氏作太師之官爲周之挃轄也修可曰按唐史典云左右丞掌管轄省事糾舉憲章又舊唐史劉洎上䟽曰尚書萬機寔爲政本是以二丞方於管轄八座比於文昌故左丞爲左轄今年得舊儒趙曰皆以紀韋丈也魏晉以來左丞得彈奏八座故傅咸云斯乃皇朝之司直天臺之管轄後人用左轄義起於此舊注引晉天文志以爲星名非是相門韋氏在經術漢臣須洙曰漢韋賢及子玄成父子皆以經術爲相時議歸前列天倫恨莫俱洙曰天倫兄弟也穀梁兄弟天倫也趙曰指濟兄弟是前輩爲時議所歸鴒原荒宿草洙曰棠棣脊鴒在原兄弟急難注脊鴒雝渠也飛則鳴行則搖不能自舎耳箋云雝渠水鳥而今在原失其常處則鳴求其類天性也猶兄弟之於急難檀弓曽子曰朋友之墓有宿草而不哭注宿草謂陳根也趙曰惜其一亡至於宿草巳荒鳳沼接亨衢洙曰晉荀朂守尚書令勗乆在中書專管機事及失之甚罔然悵恨或有賀之者曰奪我鳯凰池諸君賀我耶趙曰濟由左丞可以接鳯池亨衢又羙其爲中書之貴師曰此句言累丗爲尚書也有客雖安命洙曰莊子無可柰何而安之若命也趙曰公自言也衰容豈壯夫洙曰謂以窮逹而肥癯非壯夫也趙曰此足以慰榛蕪家人憂几杖洙曰几老者所慿杖老者所扶持也家人憂其老也故借言几杖礼大夫致仕則必賜之几杖甲子混泥途洙曰襄三十年傳晉悼夫人食輿人之城𣏌者絳縣人或年長矣无子而往與於食有與疑年使之年曰臣小人也不知紀年臣生之歲正月甲子朔四百有四十五甲子矣其季於今三之一也吏走問諸朝趙孟召之而謝過焉曰武不才任君之大事以晉囯之多虞不能用吾子使吾子辱在泥途乆矣乃武之罪也敢謝不才遂仕之不謂矜餘力還來謁大巫洙曰呉志張紘傳陳琳荅紘書曰小巫見於大巫神氣盡矣歲寒仍顧遇洙曰以顧遇之礼不改故云歲寒論語歲寒然後知松栢之後凋也日暮且踟蹰洙曰日暮謂暮齒也漢書日暮途逺老驥思千里洙曰魏武樂府云老驥伏攊志在千里飢鷹待一呼洙曰魏志陳登謂吕布曰曹公言待將軍譬如養鷹然飢則爲用飽則揚去蘇曰楚人云飢如鷹待此一呼事見吕氏春秋君能微感激亦足慰榛蕪洙曰明本一云折骨効區區趙曰此又不能無所求也師曰有客甫自謂呉志張紘見楠榴枕愛其文爲作賦陳琳見之以示人曰此吾卿張子綱所作也後紘見琳作武庫賦應機論與琳書深歎善之琳荅曰自僕在河北與天下隔此間率少於文章易爲雄伯故使僕受此過差之譚非其實也今景興在此足下與子布在彼所謂小巫見大巫神氣盡矣大巫以比韋濟踟蹰言眷慕於韋不忍去也老驥飢鷹皆甫自喻甫於前詩云猥誦佳句新是韋知甫者也故此詩有意於韋之薦拔故末章云君能微感激亦足慰榛蕪遣悶奉呈嚴公二十韻蘇曰嚴武在蜀對客多騁筆札甫醉曰不謂嚴挺之有此兒武怒甫徐曰我乃杜審言孫擬捋虎鬚尓合坐大笑彌縫之武曰與公等言何至上及祖考乎深衘之甫㱕草堂遂有遣悶詩白水魚竿客淸秋鶴髮翁洙曰鮐背鶴髪言老也趙曰鶴髪老者之相庾信作賦子老矣鶴髮雞皮蓬頭歷齒胡爲來幕下秪合在舟中洙曰言躰性踈散止可與漁樵爲偶不當爲幕客也黃卷真如律趙曰自不是黄卷聖賢之義意其以黃紙所冩之法令合如何之内故云真如律大臨曰言詩書以礼法繩人靑𫀆也自公洙曰詩自公退食大臨曰言不卑小官也老妻憂坐痺鄭曰卑利切㓜女問頭風平地專欹倒分曹失異同趙曰言其散秩在府中所坐之曹不專其事而分之不知爲異爲同也禮甘衰力就義忝上官通洙曰謂能容之於散秩也趙曰公得預府幕忝關通於上官矣上官指嚴武也疇昔論詩早洙曰公與嚴公先以文才相知趙曰與嚴論詩巳在早年矣光輝仗鉞雄洙曰仗鉞言嚴公作鎮也寛容存性拙洙曰公嘗斥嚴公父名公不以爲忤翦拂念途窮洙曰謂嚴公奏請爲軍簽謀也劉孝標絶交論頋盻増其倍價翦拂使其長鳴露裛思藤架洙曰詩厭浥行露煙霏想桂叢洙曰言身雖在幕中而嘗有山林之志信然龜觸網洙曰龜筴傳預且觸網云蘇曰王飜行止如龜網雖不遭羅其駭恐亦可知也直作鳥窺籠洙曰秋興賦池魚籠鳥而有江湖山薮之思趙曰上兩句則身雖在幕府而有山林之念故如龜之在網鳥之在籠也下八句有懷草堂之意西嶺紆村北師曰自此句以下乃子羙述草堂之興恐其荒蕪而有歸休之意故末章云㑹希全物色時放倚梧桐物色言形躰衰老兾保其天年遂其真性倚梧桐以自樂也南江繞舎東竹皮寒舊翠椒實雨新紅浪簸舩應拆杯乾甕即空蘇曰蘇定戲友人曰薪盡火滅杯乾甕空藩籬生野徑斤斧任樵童洙曰自西嶺至此皆志在草堂束縛酬知己蹉跎効小忠洙曰言性雖踈散當束縛以酬知巳年雖蹉跎不足以負任責亦當効小忠也周防期稍稍太簡遂怱怱曉入朱扉啓昏歸畫角終不成㝷别業大觀曰別業指草堂也未敢息微躬烏鵲愁銀漢洙曰爲填河也炎曰烏鵲填河以渡牛女甫意謂雖參幕府无以𥙷濟故曰愁銀漢駑駘怕錦幪洙曰非其飾也㑹希全物色時放倚梧桐趙曰言如烏鵲之微力不任於填河駑駘之蹇不足以𬒳錦幪之飾則所望於故人知己者幸全其物色而放令倚於梧桐也奉贈鮮于京兆二十韻鮑曰鮮于仲通也紀十年書劒南節度使鮮于仲通及雲蠻戰于西洱河敗績不見其爲京兆豈先爲京兆耶豈以節度爲京兆耶唐開元以來在位无鮮于姓者詩有鮮于萬州乃其子也鄭曰鮮于相然切漢複姓也王國稱多士洙曰文王詩思皇多士生此王囯賢良復幾人趙曰王者之囯號稱多士矣而賢良無幾也異才應間出洙曰異才茂異也間出間生也猶間丗而生也爽氣必殊倫洙曰氣宇淸爽有殊於衆人也趙曰以言鮮于京兆也始見張京兆宜居漢近臣洙曰張敞傳潁川太守黃霸始以治行第一入爲京兆尹不稱罷於是膠東相敞守京兆尹其治京兆略循趙廣漢之迹爲乆任職漢制出爲二千石有治狀者入爲公卿故曰近臣驊騮開道路蘇曰淮隂侯韓信語蒯通曰觀子與諸郎談論辨析是非落落可聽如駑駘駕車使驊騮開路非容易追逐也使人心服可喜可喜見囯語别集鵰鶚離風塵鄭曰離力智切去也洙曰猶駿異得路者然也趙曰驊騮鵰鶚言其俊也侯伯知何算洙曰算一作等文章實致身趙曰此言侯伯之人多矣至於無算而鮮于之致身則實以文章也奮飛超等級容易失沉淪趙曰惟其奮飛而晉擢徑超邁於官之等級故其離去沉淪也易而不難如此脫略蟠溪釣洙曰吕望釣於蟠溪操持郢匠斤洙曰莊子郢人堊漫其鼻端若蠅翼使匠人斵之匠石運斤成風聽而斵之盡堊而鼻不傷郢人立不失容雲霄今巳逼台衮更誰親趙曰上公應天上三台衮則衮服三公一命衮故得稱衮也鳳穴雛皆好洙曰此言鮮于諸子也山海經丹穴之山有名鳯陸雲幼時閔鴻見而竒之曰此兒若非龍駒是鳳鶵龍門客又新洙曰後漢李膺傳膺牲簡亢無所交接唯以同郡荀淑陳實爲師友𬒳容接者名曰登龍門也義聲紛感激洙曰劉越石詩鄧生何感激敗績自逡廵洙曰莊十一年傳凡敵大崩曰敗績注師徒撓敗若沮岸崩山喪其功績故曰敗績逡廵言退貌趙曰皆公自謂也言鮮于之義声紛然感激之多而我之敗績則自逡廵不進耳途逺欲何向洙曰逺一作永主父偃曰日暮途逺天髙難重陳鄭曰重儲用切再也洙曰劉越石弃置勿重陳曹植云天髙聽逺學詩猶孺子洙曰一云子夏論語子曰小子何莫斈夫詩詩可以興可以觀可以群可以怨又子夏問曰巧笑倩兮子曰起予者商也始可與言詩巳矣郷賦念嘉賔洙曰郷賦猶郷㪯也鹿鳴燕嘉賔不得同晁錯洙曰公傳言公㪯進士不第晁錯㪯賢良對䇿髙第晁錯傳今臣密等廼以臣錯充賦如淳曰猶言備数也臣瓉曰充賦錯之謙也所以言如賦調也吁嗟後郄詵洙曰郄詵傳泰始中詔天下㪯賢良直言之士太守文立㪯詵應選對䇿上第詵曰臣㪯賢良對䇿爲天下第一猶桂林一枝也計踈疑翰墨洙曰公有詩云儒冠多誤身乃疑之時過憶松筠洙曰謂有歲塞趙曰言時巳過矣則思隱於山林舊注謂有歲寒非是獻納紆皇眷中間謁紫宸洙曰殿名且隨諸彦集洙曰江淹别賦金閨諸彦方覬薄才伸鄭曰覬几利切幸也洙曰公献三賦召試集賢殿破膽遭前政隂謀獨秉鈞洙曰劉陶傳關東破膽詩節南山秉囯之鈞陳平曰我多隂謀道家所忌趙曰林甫傳帝詔天下士有一藝者得詣闕林甫恐士對詔斥巳即建言士皆草茅徒以狂言亂聖聽請付尚書試問無一中程者子美對詔意本望髙選而爲林甫所沮故有破膽隂謀之語微生霑忌刻萬事益酸辛交合丹靑地恩傾雨露辰洙曰交契在華顯之地又當沛澤下流之辰而愁餓死者以時所不容也趙曰丹靑地指言公卿之地也塩鐵論曰公卿者神化之丹靑有儒愁餓死早晚報平津洙曰東方朔傳臣朔飢欲死平津侯公孫洪開閤延賢人與叅謀議弘身食一肉脫粟飯故人賔客仰衣食奉禄皆以給之家無所餘報平津喻報鮮于也趙曰公以獨餓死爲愁所頼者在鮮于京兆如公孫洪故人賔客仰衣食奉禄皆以給之家無所餘報平津喻報鮮于也趙曰公以獨餓死爲愁所頼者在鮮于京兆如公孫洪故人賔客仰給衣食焉師曰漢張敞嘗爲京兆尹今鮮于以賢良而居張敞之任猶驊騮之開道路鵰鶚之離風塵京兆古之侯伯知何筭言胷中藴蓄不可窮也容易失沉淪言京兆乃輦轂之下不可驕易而失身此戒之之辝郢匠斤言有断也雲霄今已逼言近天子也台衮更誰殷言必見擢爲公相也龍門客又新言門下客皆賢士也敗績自逡廵言甫自得罪去而不獲依託鮮于也日暮窮途逺喻人之衰老甫以年老更欲何所向乎天髙難重陳則又以君門難伸愬也孺子小子也甫謙言能詩不過小子之斈詩不得同晁錯吁嗟後郄詵盖言甫雖忝郷薦柰何不中第也献納謂献三賦帝說命宰相試文章且隨諸彦集謂落筆中書堂也甫以上䟽雪房琯爲當權者所疾遂見斥逐故云破膽遭前政隂謀獨秉鈞微生霑忌刻微生甫自謂也奉贈太常張卿均二十韻洙曰按唐書均張說之長子也九載爲大理卿後出爲建安太守歲中召還再遷太常卿禄山亂受僞命特免死長流合浦方丈三韓外洙曰前漢郊祀志自齊威宣燕昭使人入海求蓬萊方丈瀛洲三神山者其傳在渤海中魏志韓在帶方之南東西以海爲限有三種一曰馬韓二曰辰韓三曰棄韓故曰三韓崑崙萬國西洙曰禹貢注崑崙在荒服之外流沙之内羌髣髴之屬皆西戎也鄭曰崑公渾切崙盧昆切酈元曰外國圖云從大晉囯王西七萬里得崑崙之墟建摽天地闊洙曰天台賦赤城霞起以建摽詣絶古今迷氣得神仙逈恩承雨露低洙曰按唐書均弟垍以主壻玄宗特深恩寵許於禁中置内宅侍爲文章賞賜珍玩不可勝數時均亦供奉翰林垍嘗以所賜示均均戲謂垍曰此婦翁與女壻非是天子與斈士也趙曰上四句以譬禁掖之清切乃神仙之地唯有仙風道骨者始能遊且承恩寵也此指言張均父子相門淸議衆趙曰張均父說相囯之子故曰相門儒術大名齊魯曰均張說之子其名與父斉等也軒冕羅天闕洙曰均垍俱能文說在中書兄弟皆掌綸翰之任琳琅識介珪洙曰禹貢厥貢球琳琅玕注琳皆王名琅玕石而似珠釋地云西北之美者有崑崙墟之璆琳琅玕焉詩崧髙錫爾介珪以作爾寳箋云長寸二尺謂之介非諸侯之圭故以爲寳美均爲介珪也趙曰以琳琅則識張卿爲介珪矣介珪大珪也伶官詩必誦洙曰邶詩簡兮序衛之賢者仕於伶官皆可以承事王者注伶官樂官也伶氏丗掌樂官而善焉故後丗號樂官爲伶官也夔樂典猶稽洙曰書后夔典樂趙曰此贈太常張卿復用樂事伶官出詩仕於伶官古者採詩而伶官誦之以諌王焉太常卿掌樂者也健筆凌鸚鵡洙曰後漢禰衡字正平有才辯在黄祖座上爲鸚鵡賦筆不停綴文不加點凌過也銛鋒瑩鸊鵜洙曰鸊鵜水鳥也膏中瑩刀修可曰戴暠度開山詩云劒瑩鸊鵜膏友于皆挺拔洙曰友于言兄弟也馬曰書惟孝友于兄弟趙曰言均垍兄弟之貴且有勲業也公望各端倪洙曰公望各有所帰也趙曰言兄弟負公輔之望各有端倪也余曰莊子太宗師篇反覆終始不知端倪䟽云端緒也倪畔也通籍踰靑瑣洙曰元帝紀令從官給事官司馬中者得爲大父母父母兄弟通籍應劭曰籍者爲二尺竹牒記其年紀名字物色縣之宫門案省相應乃得入也謝玄暉詩旣通金閨籍漢給事曰暮入對靑瑣門拜謂之夕郎靑瑣以淸戸邊鏤中天子制也刻爲靑瑣文而靑塗也趙曰通籍通朝見之籍靑瑣也中有青瑣門刻爲連瑣而靑塗之亨衢照紫泥洙曰亨衢亨途也後漢志漢舊儀曰天子信璽六璽皆以武都紫泥封靑囊白素裏兩端無縫尺一板中約署皇帝余曰易大畜卦何天之衢亨靈虬傳夕箭洙曰梁陸倕字佐公新漏刻銘曰靈虬承龍言漏刻之躰以龍承之也趙曰箭浮水之物鄭曰虬居幽切無角龍歸馬散霜蹄昱曰莊子馬蹄篇馬蹄可以踐霜雪能事聞重譯鄭曰譯夷益切洙曰前漢平帝紀越裳重譯献雉師古曰譯謂傳言也道路絶逺風俗殊隔故累譯而後乃通相如重譯納貢趙曰言所能之事聞播於重譯之蛮夷矣嘉謨及逺黎余曰揚子或問忠言嘉謨曰謨合皐陶之謂嘉弼諧方一展洙曰皐陶謨曰謨明弼諧班序更何躋洙曰莊二十年傳朝以正班爵之義帥長㓜之序適越空顚躓洙曰莊子逍遙篇宋人資章甫而適諸越越人断髮文身無所用顚躓危困也鄭曰躓陟利切跲也游梁竟慘悽洙曰鄒陽齊人知呉王不可說是時梁孝王待士於是陽與枚乗嚴忌等皆去之陽從孝王游羊勝公孫詭等疾陽惡之孝王孝王怒將殺之陽從獄中上書而得免趙曰公初落魄嘗適越矣傳所謂客呉越是也公又嘗遊梁矣贈李白篇所謂亦有梁宋遊是也今公雖爲右率府胄曹然欲展弼諧於張卿而班列次序之不可攀則復有去而之它之意將適越乎空如前日之顚躓將遊梁乎竟如前日之慘悽此詩人之思也謬知終畫虎洙曰馬援傳初兄子嚴敦並喜譏議援在交阯還書戒之曰龍伯髙敦厚周慎口無擇言謙約節儉廉公有威吾爱之重之願汝曹效之杜季良豪俠好憂人之憂樂人之樂淸濁無所失父䘮致客數郡畢至吾爱之重之不欲汝曹効也効伯髙不得猶爲謹勑之士所謂刻鵠不成尚類鶩也效季良不得䧟爲天下輕薄子所謂畫虎不成終類狗也迄今季良尚未可知郡將下車輒切齒州郡以爲言吾嘗爲寒心是以不願子孫之效也微分是醯雞洙曰莊子田子方篇孔子見老聃孔子出以見顔回曰丘之道也其猶醯雞歟微夫子之發吾覆也吾不知天地之大全也注醯雞者瓮中之蠛蠓也司馬云酒上蠛蠓醯許西反萍泛無休日天斍曰萍無根隨流而巳謝靈運蘋萍泛沉深趙曰公自譬其無定也桃隂想舊蹊洙曰李廣賛曰李將軍恂恂如鄙人口不能出辭及死之日天下知與不知皆爲流涕彼其中心誠信於士大夫也諺曰桃李不言下自成蹊師古曰蹊音奚謂徑道也趙曰公言其想舊蹊之桃隂乃懷念舊日見知之人也吹嘘人所羡騰躍事仍睽碧海眞難渉洙曰十洲記扶桑在碧海之中也一面萬里大帝之宫太眞東主君所治之也靑雲不可梯安石曰郭璞游仙詩靈谿可潜盤安事登雲梯趙曰至於騰躍之便則仍乖睽如此則如渉碧海梯青雲之難也曽曰謝靈運詩共登靑雲梯顧深慙鍛錬鄭曰鍛都玩切洙曰韋彪傳鍛鍊之吏注蒼頡篇曰鍛推也鍛錬猶成熟也言深文之吏入人之罪猶工冶陶鑄鍛鍊使之成熟也前書路温舒曰鍛錬而周内之曰曰張景陽七命曰楚之陽劒歐冶所營乃錬乃鑠萬辟千灌注云鍛錬刻苦成材之義此言張卿恩顧我雖深而自慙鍛錬之未至耳舊注所引乃刑罰鍛錬之義非是才小辱提携洙曰提携猶挈維之也趙曰公自言才能之小辱張卿之提携檻束哀猿叫洙曰叫一作巧淮南子置猿檻中巧捷無所肆其能鮑明逺詩今作檻中猿枝驚夜鵲棲洙曰魏武帝樂府云月明星稀烏鵲南飛繞樹三匝何枝可依云幾時陪羽獵應指釣璜溪洙曰注揚雄傳雄十二月從羽獵璜王也吕望釣於蟠溪得璜焉刻曰姬受命吕佐之報在齊趙曰孝成帝時羽獵而揚雄從焉幾時陪羽獵有羡慕其得近清光之意鄭曰璜胡光切十道志櫟陽有釣漢浦乃吕望所釣璜溪也師曰太公老年見用今甫亦有意于暮年故云云敬贈鄭諌議十韻諌官非不逹詩義早知名洙曰鄭諫議雖不得名必善於詩者下皆詩事趙曰爲天子諫官非不謂之顯逹而於作詩之義又早歲巳有名此專美之也下句正言其詩可以知名者破的由來事洙曰言詩句中理如射之破的也庾翼謂謝尚曰卿若破的當以鼔吹相賞尚應声中之翼即以其副鼔吹給之先鋒孰敢爭洙曰嘗爲勍敵未嘗敗北趙曰破的如射之中先鋒如戦之勇王済与王愷發射一發射破的思飄雲物外鄭曰思相吏切洙曰外一作動言詩意思逺到也司馬相如傳相如旣奏大人賦天子大說飄飄有凌雲氣游天地之間意趙曰如文賦言神游万仞情鶩八極舊注引飄飄有凌雲氣非是也律中鬼神驚修可曰詩律旣中可驚鬼神如李白詩云詩成泣鬼神舊注謂如律吕和諧誤矣毫髮無遺恨波瀾獨老成洙曰曲尽物理故無遺恨才思浩瀚故如波瀾兼詞意壯健故有言老成也趙曰公言作詩中有一字一句不佳雖如毫髮之小則心自慊慊則有遺恨矣野人寧得所趙曰自此而下皆公自序也野人公自稱耳天意薄浮生多病休儒服晏曰莊子田子方篇哀公曰㪯魯囯而儒服冥捜信客旌洙曰天台賦云逺寄冥捜趙曰欲冥捜幽冥之地信客旌所指耳築居仙縹緲鄭曰縹普沼切緲弭沼切洙曰洙曰木玄虚海賦神仙縹緲食王清涯趙曰卜築欲在深逺之処如仙之縹緲難㝷也餘見上旅食歲崢嶸鄭曰崢仕耕切嶸胡萌切髙峻貌鮑明逺舞鶴賦歲峥嶸而催暮使者求顔闔洙曰莊子讓王篇魯君聞顔闔得道之人也使人以幣先焉顔闔守陋閭苴布之衣而自飯牛終逃魯君之使諸公厭禰衡洙曰後漢文苑傳禰衡字正平有才辨氣剛傲好矯時慢物曹操怒之送与劉表後侮慢表表耻不能容以江夏太守黃祖性急故送衡與之後竟爲祖所殺將期一諾重洙曰辯士曹丘生謂季布曰楚人諺曰得黄金百兩不如得季布一諾足下何以得此聲於梁楚之間哉江淹詩季布重然諾史記曰季布一諾歘使寸心傾洙曰謂傾嚮於鄭也徐庶指心曰以此方寸之地謝玄暉詩孰爲勞寸心鄭曰歘許勿切暴起也君見途窮哭宜憂阮歩兵洙曰阮籍爲歩兵校尉率意命駕不由徑路車迹所窮輒動哭而反顔延年詩物故不可論途窮能無慟十朋曰使者求顔闔謂鄭時遣人招之諸公厭禰衡言異巳者惡甫之放誔末章皆祈哀之辝寄簡上寄韓諌議師曰地理志岳州巴陵郡在岳之陽故曰岳陽有君山洞庭湖湘江韓注以諌爲職直言陳天下事代宗不恱貶岳陽注適意遊君山弃人間事將爲長往之計甫思之故有此作今我不樂思岳陽洙曰岳陽巴陵也属湖南身欲奮飛病在床洙曰詩静言思之不能奮飛美人姢姢隔秋水洙曰詩人以美人北君子故詩有彼美人兮西方之人兮趙曰公時在夔而韓在岳斯爲隔秋水矣濯足洞庭望八荒洙曰左太冲濯足万里流鴻飛冥冥日月白靑楓葉赤天雨霜洙曰選詩曉霜楓葉丹趙曰鮑昭詩窮秋九月荷葉黄北風驅鴈天雨霜雨音去聲玉京群帝集北斗洙曰玉京帝居也五方各有帝惟北極爲至尊夢符曰右按晉天文志北極五星北辰最尊者也北斗七星在太微北七政之樞機隂陽之元本故運乎天中而臨制四方以建四時而均五行人君之象號令之主注以斗爲極誤矣五星經云太上白玉京黄金闕趙曰群帝如諸王三公之類以言天子五方之帝三十三天之帝雖稱帝而於大帝爲卑故稱群帝也或騎麒麟翳鳯凰趙曰集仙傳天人降土妙想皆乗麒麟鳯凰龍鶴大鳥是也芙蓉旌旗煙霧樂洙曰楚詞搴芙蓉兮木末影動倒景搖瀟湘洙曰郊祀志登遐倒景注在日月之上反照故其影倒也趙曰言瀟湘言韓在岳陽也星宫之君醉瓊漿洙曰楚詞搖漿密勺實羽觴萃酌旣陳有瓊漿羽人稀少不在傍趙曰楚辝仰羽人於丹丘似聞昨者赤松子恐是漢代韓張良昔隨劉氏定長安帷幄未改神慘傷洙曰張良其先韓人也髙祖立䔥相國良乃稱曰家丗相韓及韓滅不爱万金之資爲韓仇強秦天下震動今以三寸舌爲帝者師封万戸位列矦此布衣之極於良足矣願弃人間事欲從赤松子遊耳乃斈道欲輕㪯師古曰赤松子仙人號也神農時爲雨師髙祖曰運籌帷幄之中決勝千里之外吾不如子房國家成敗吾豈敢色難腥腐飡風香洙曰鮑明逺何時與汝曹啄腐共吞腥趙曰神仙傳壷公留費長房於羣虎之中長房不恐又内石室中頭上有大石茅繩懸之諸虵嚙繩欲断長房不移公往撫之曰可教矣又命噉溷臭惡非常長房色難之公乃歎而謝遣之曰子不得仙也今以子爲地主周南留滯古莫惜洙曰太史公留滯周南趙曰又以太史公比之南極老人應壽昌洙曰春秋元命苞曰老人星治平則見見則主壽美人胡爲隔秋水焉得置之貢玉堂師曰令韓注隱岳陽効張良之所爲故甫云色難腥腐飡風香昔太史公留滯周南之地注見貶於岳陽何其太史公是以爲之痛惜南極星中有老人星見則主壽以應治平甫以注隱南方此之老人星嘆其不見也於末章則又云美人胡爲隔秋水欲得此美德之人貢之玉堂以輔天子不宜隱于此也所以甚惜注之不用暮秋枉裴道州手札率爾遣興寄近呈蘇渙侍御乆客多枉友朋書素書一月凡一束蘇曰王价避居逺郊一月之中得親知書僅成一束但虚訶寒温而巳空煩眼力使人厭接又倦回荅趙曰古詩云客從南方來中有尺素書虚名但蒙寒温問泛愛不救溝壑辱洙曰言友朋之書雖多但蒙寒温之問而不足拯憂也趙曰晉王獻之嘗與兄徽之操之詣謝安三兄多言俗事獻之寒温而已孟子云志士不忘在溝壑齒落未是無心人舌存恥作窮途哭洙曰張儀從楚相飲相亡璧門下意張儀盗璧共笞掠之妻曰子母讀書游說安得此辱儀曰視吾舌在不妻笑曰舌在儀曰足矣阮籍遇窮途則哭道州手札適復至紙長要自三過讀盈把那須滄海珠夢符曰右按唐書閻立本謂狄仁傑曰君可謂滄海遺珠矣趙曰王筠於書三過五抄入懷本倚崑山玉洙曰言得裴書勝珠之盈把倚裴如崑山王也蘇曰丗說毛曽與夏侯玄共坐時人謂蒹葭倚王樹也撥弃潭州百斛酒洙曰歩兵厨中貯酒數百斛蕪没瀟岸千株菊使我晝立煩兒孫令我夜坐費燈燭洙曰言得書而有所思也趙曰煩兒孫者煩其侍立也憶子初尉永嘉去鄭曰永嘉温州縣紅顔白面花映肉軍符侯印取豈遲紫燕緑耳行甚速洙曰言負超軼之材也趙曰言初爲尉之少年而材之俊逸軍府則爲節度使印則封侯矣紫燕文帝良馬名緑耳則列子周穆王駕八駿之馬而左緑耳聖朝尚飛戰鬪塵濟丗宜引英俊人洙曰兵革未息宜薦才引士以濟斯丗也黎元愁痛㑹蘇息夷狄跋扈徒逡巡洙曰如用得其人則黎民蘇而夷狄服也趙曰徒逡廵者言其空自遷延不乆掃蕩也授鉞築壇聞意旨洙曰晉禮志漢魏故事遣將出征符節即授節鉞於朝堂漢髙築壇拜韓信聞意旨言當與此事也頽綱漏網期彌綸洙曰勉興滯𥙷廢也郭欽上書見大計洙曰于寳著論思郭欽之謨而誤我戎狄之有釁御史大夫郭欽言戎狄強獷歷丗爲患今西北方戎狄雜居恐百代之後爲患宜及平呉之功以復上郡帝不許劉毅荅詔驚群臣洙曰晉武甞顧謂劉毅曰朕方漢之何如主對曰桓靈也帝曰朕克已爲理方之桓靈不亦甚乎對曰桓靈賣官錢入公府陛下賣官錢入私門以此言則知也他日更僕語不淺洙曰儒行孔子對魯哀公曰遽數之不能終其物悉數之乃留更僕未可終也注僕太僕也君燕朝則正位掌擯相更之者爲乆將倦故使之相代也明公論兵氣益振鄭曰振之人切洙曰益振益壯也傾壷簫管黒白髮洙曰黒一作理言得書而愁去白髮再黒儛劒霜雪吹靑春洙曰項莊舞劒儛與舞同宴筵曽語蘇季子後來傑出雲孫比洙曰蘇秦字季子徐穉傳角立傑出爾雅雲孫趙曰爾雅七丗孫曰雲孫故自季子至侍御取其最逺者言之茅齋定王城郭門藥物楚老漁商市趙曰定王城乃潭州漁商市亦潭州之地市北肩輿毎聮𬒮郭南抱瓮亦隱几鄭曰隱於靳切洙曰抱瓮見汲井歲榾榾注莊子齊物論南郭子綦隱几而卧無數將軍西第成洙曰衛靑傳上爲青治第令視之曰匈奴未滅無以家爲趙曰後漢馬融爲大將軍西第頌頗爲正直所羞舊注引衛靑治第事非是早作丞相東山起洙曰謝安起於東山也趙曰班固山東出相舊注作東山使引謝安事非是公亦何拘於西對東邪鳥雀苦肥秋粟菽蛟龍欲蟄寒沙水洙曰鳥雀方得時而蛟龍退藏甫自喻也蘇曰漢末兵戈蝟起鹿門隱公歎曰秋稔菽栗鳥雀甚肥而鸞鳳何卒焉余讀此莫不掩卷太息又鮑宰云鸞鳯棲荆艾蛟龍蟄寒水言小人昇騰君子淹滯不見用也趙曰上句比無功受禄下句又以比賢材之潜藏天下鼔角何時休陣前部曲終日死洙曰部曲隊伍也趙曰傷時干戈之未息以引下句激昂二公之致功名也附書與裴因示蘇此生已媿須人扶致君堯舜付公等早據要路思捐軀帥曰溝壑言失所泛愛謂禮數雷同但止於寒温之問故不救溝壑辱也丗說毛曽與夏玄共坐時人謂之蒹葭倚玉樹唐書狄仁傑滄海遺珠珠玉喻道州手札也昔阮歩兵厨中貯酒數百斛甫得書有所懷思不暇飲酒泛菊故撥弃蕪没也長者坐少者立晝立煩兒孫夜坐費燈燭言日夜思之而忘食息也永嘉温州紫燕緑耳良馬也道州負超逸之才其視軍符侯印取之若其甚速豈困於永嘉一尉乎夷狄指禄山言聖朝得人則民安冦平雖禄山跋扈不臣復何慮哉頽綱漏網言政刑彫弊頼道州經綸以禆𥙷之郭欽劉毅皆以喻道州昔當抗䟽直言他日必爲帝所禮遇黒白髮言得裴書髮更黒和氣襲人故云吹靑春甫與道州㑹間嘗談蘇侍御故以侍御爲蘇秦雲孫雲孫逺孫也楚定王都荆州時甫茅齋在郭門之外毎抱甕灌畦或隱几而坐比之南郭子綦也武帝征匈奴衛靑霍去病皆立功帝賜第宅無數軍西第成言將師平禄山思明之亂皆富貴也唯兾裴蘇早起以爲丞相故云東山起鳥雀苦肥秋粟菽言小人貪位慕禄也蛟龍欲蟄寒沙水言君子於此時反退藏也須人扶言衰老要路謂仕途之顯要者蘇大侍御渙靜者也旅于江側凡是不交州府之客人事都絶乆矣肩輿江浦忽訪老夫舟檝而巳茶酒内余請誦近詩肯吟數首才力素壯詞句動人接對明日憶其湧思雷出書篋几杖之外殷殷留金石聲賦八韻記異亦記老夫傾倒於蘇至矣龐公不浪出趙曰後漢龐德公居峴山之南未嘗入城府蘇氏今有之洙曰言亦不交州府也再聞誦新作突過黃初詩趙曰文帝爲魏太子七子從之游皆能詩如謝靈運江文通皆擬其作黃初文帝即位年號也乾坤幾反覆洙曰幾一作垍揚馬宜同時洙曰司馬相如揚雄亦蜀人也今晨淸鏡中勝食齋房芝洙曰元封二年芝生甘泉齋房歌云齋房産草九莖蓮葉趙曰此蘇渙之詩如房芝之可茹也余髮喜却變白間生黒絲洙曰生一作添趙曰變白爲黒以聞其詩之故昨夜舟天接洙曰接一作佞湘娥簾外悲百靈未敢散洙曰言百靈聞誦詩而皆來也風破寒江遲洙曰破一作波趙曰宗慤曰願乗長風破萬里浪師曰昔龐德公不應州府辟命未嘗入城郭今蘇渙不交州府頗有其風黄初魏文帝年號指子建文集也乾坤幾反覆言丗代遷變而名終不歇可與揚雄司馬相如齊名於當時也淸鏡中捐江上勝食齋房芝言咀味新更過於靈芝也白間生黒絲甫與蘇論文喜而髮爲之變文有益於人如此湘娥悲百靈不散皆言聽詩而感動之也寄裴施州廊廟之具裴施州洙曰潘安仁器非廊廟姿宿昔一逢無此流金鍾大鏞在東序洙曰禮樂之所在也夢符曰右按詩鼖鼔維鏞大鍾曰鏞書曰天球河圖在東序鍾鏞以言至和所自出東陽位也冰壷玉衡縣淸秋洙曰氣宇之淸徹也夢符曰右按文選淸如玉壷冰書曰在琁璣玉衡以齊七政玉衡正天文之器非特氣之淸也自從相遇減多病三歲爲客寛邊愁堯有四岳明至理洙曰堯建四岳以共治天下漢二千石眞分憂洙曰漢宣帝曰與我共理者惟良二千石乎幾度寄書白鹽北洙曰施州在白鹽山之北也趙曰白鹽者夔州之山此裴使君寄書與公義甚明也舊注云施州在鹽山之北非矣其下句言蟠龍銀鉤以言其書也苦寒贈我靑羔裘洙曰羔一作絲蘇曰沈約牛元慶愛其文章自解錦囊靑羔裘贈之霜雪廻光避錦䄂蛟龍動篋蟠銀鈎洙曰龍蛇銀鈎皆字體也言所惠之書如龍蛇銀鉤屈蟠交連趙曰其如龍如蛇今藏裴公銀鈎於其中所以龍蛇動於篋也紫衣使者辭復命再拜故人謝佳政將老巳失子孫憂後來况接才華盛趙曰言我將老而免憂子孫無它以後來之人相接有裴君諸子才華之盛美矣師曰東序殷學也金鍾大鏞乃禮樂之器言能文之以禮樂也冰壷玉衡言其淸和也漢有二千石有中二千石二千石其實一千四百四十石不滿二千石也中二千石其實一千一百六十石故謂之中二千石漢宣帝曰與我共理者惟良二千石乎甫以施州比堯之四岳漢之二千石施州在白鹽山之北甫屢得其惠書與羔裘霜雪回光避錦䄂盖言裘也龍蛇動篋蟠銀鈎盖言書字躰勢也紫衣使者辟復命言朝廷必遣使辟召之也鄭典設自施州歸宋曰春秋時巴國界秦昭王置黔中郡梁改爲施州吾憐滎陽秀冐暑𥘉有適名賢愼出處不肯妄行役洙曰言其以義而動也師曰出處君子之大致不可妄動鄭公雖冒暑有適盖以鄭子毎乏是以南謁裴施州亦有義動不肯妄行役也旅兹殊俗逺竟以屢空迫洙曰顔淵屢空南謁裴施州氣合無險僻攀援懸根木鄭曰援于元切登頓入矢石洙曰言險阻也青山自一川城郭洗憂慼趙曰公嘗有詩曰下視城郭消人憂聽子話此邦令我心恱懌其俗則純朴蘇曰魏人俗尚輕靡趙人俗尚淳朴楚人俗尚魚鹽不知有主客温温諸侯門禮亦如古昔勑厨倍常羞盃盤頗狼籍洙曰言雖幽逺而敬客之意不異於中華也史滑稽傳履舄交錯盃盤狼籍堂上燭滅主人留髠而送客時雖屬䘮亂事貴賞匹敵洙曰賞一作當中宵愜良㑹裴鄭非逺戚群書一萬卷博渉供務隙他日辱銀鉤洙曰銀鉤書也言字躰交運勁屈如銀鉤然森踈見矛㦸夢符曰右按北史李義深有當丗才用而心險峭時人語曰矛㦸森森李義深倒屣喜旋歸洙曰蔡邕倒屣而迎王粲趙曰倒屣不上鞋踵也畫地來所歷鄭曰畫去聲乃聞風土質又重田疇闢刺史似冦恂列郡宜競借鄭曰借音迹洙曰見權宜借冦恂注北風吹瘴癘羸老思散策蘇曰呉定臨危老拙乆厭戎馬思得散䇿林泉遂此猿猱野性渚拂蒹葭塞洙曰塞一云寒嶠穿蘿蔦羃此身仗兒僕髙興潜有激孟冬方首路洙曰顔延年改服飾徒侣首路跼險難強飯取崖壁歎爾疲駑駘汗溝血不赤洙曰言非良馬也修可曰馬援銅馬相法曰汗溝欲深長漢書曰大宛國多善馬汗血言其先天馬子也終然備外飾駕馭何所益我有平肩輿前途猶凖的翩翩入鳥道師曰鳥道謂飛鳥之道盖言髙險也庶脫蹉跌厄鄭曰蹉倉何切跌徒結切寄薛三郎中人生無賢愚飄颻若埃塵蘇曰丁固人生無賢與愚百年之後俱成糞壤又黄玘利名聚散若風中埃塵去來不足較輕重自非得神仙誰免危其身與子俱白頭役役常苦辛洙曰役役一作没没雖爲尚書郎不及村野人憶昔村野人蘇曰馬融曰我軰仕塗不及村野之人雞豚社飲足以自樂我輩區區塵土豈有此况味其樂難具陳趙曰歡樂難具陳藹藹桑麻交公侯爲等倫天未厭戎馬我輩本常貧子尚客荆州我亦滯江濵峽中一卧病瘧癘終冬春春復加肺氣此病蓋有因早歲與蘇鄭洙曰蘇鄭蘇源明鄭䖍是也痛飲情相親二公化爲土嗜酒不失眞洙曰蘇鄭亦皆嗜酒予今委脩短豈得恨命屯聞子心甚壯所過信席珍洙曰席珍席上之珍也上馬不用扶毎扶必怒嗔洙曰毎一作思賦詩賔客間揮灑動八垠乃知蓋代手洙曰可蓋覆當代也漢書功業蓋代蘇曰李密蓋代手段不可容易施呈也才力老益神靑草洞庭湖洙曰靑草洞庭皆湖名也鄭曰二湖俱在巴陵東浮滄海漘君山可避暑洙曰君山在洞庭湖心况足采白蘋子豈無扁舟往復江漢津我未下瞿塘空念禹功勤洙曰功又作力聽說松門峽吐藥攬衣巾趙曰聞松門峽之好則方喫藥而吐之遽攬衣而思去鄭曰松門峽巴中地名髙秋却束帶鼔柂視淸旻鳯池日澄碧濟濟多士新餘病不能起健者勿逡廵趙曰健者薛據也紹勃然曰天下健者豈惟董公上有明哲君下有行化臣洙曰行化臣謂承流宣化之大臣也奉贈射洪李四丈丈人屋上烏人好烏亦好洙曰詩瞻烏爰止于誰之屋注冨人之屋烏所集也修可曰尚書大傳曰武王登夏臺以臨殷氏周公旦曰臣聞之愛其人者愛其堂上烏人生意氣豁不在相逢早洙曰鄒陽傾蓋如故趙曰北史李延夀叙傳載閻信謂其祖李曉之言曰古人相知未必在早南京亂初定所向色枯槁趙曰南京成都府也肅宗至德二年以蜀郡爲南京所謂亂初定指言前年辛丑之歲四月劒南東川節度使段子璋反五月崔光逺擊斬之遊子無根株茅齋付秋草東征下月峽挂席窮海島洙曰謝靈運泛舟采石華桂席拾海月海賦維長綃挂長席萬里須十金晁曰漢書百金中人十家之産顔師古注古者一兩金直十千十金則知爲百千妻孥未相保蒼忙風塵際蹭蹬騏驎老洙曰馬蹭蹬失勢貌志士懷感傷心胷已傾倒奉酬薛十二丈判官見贈忽忽峽中睡悲風方一醒西來有好鳥爲我下靑冥師曰甫有渴疾故忽忽不樂至秋風稍蘇故云悲風方一醒西有崑崙山王母與漢武帝相㑹于此常有靑鳥爲使甫以薛十二有仙姿故以况之羽毛浄白雪慘澹飛雲汀趙曰晉道壹道人之言雪曰先集其慘澹也旣蒙主人顧舉翮唳孤亭持以比佳士及此慰揚舲洙曰江淹詩蕭舲出郊際趙曰劉勰弥勒石像碑云似揚舲游水髙曰揚舲行船也淸文動哀玉趙曰此言佳士之文淸如玉聲之哀盖環佩之類舊注引卞和泣玉非是見道發新硎洙曰莊子屠牛坦刀刃若發新硎唐曰薛之善属文復能知道故云云欲學鴟夷子洙曰貨殖傳范蠡浮江湖改姓適齊爲鴟夷子注顔師古曰自號䲭夷者言若盛酒之鴟夷多所容受而可卷懷與時張㢮陳遵傳曰自用如此不如鴟夷也趙曰李賀昌谷詩刺促成幾人好學鴟夷子盖用杜公今句也待勒燕山銘洙曰竇憲勒銘燕然山班固爲之銘誰重斷蛇劒洙曰一云口重斬邪劒漢髙有斬蛇劒致君君未聽洙曰伊尹致君堯舜趙曰此言利器如漢朱雲所用之劒而未施有致君之術業而君未用舊注引漢髙斬蛇劒以爲證大誤學者矣志在麒麟閣洙曰見今代麒麟閣注無心雲母屏洙曰後漢鄭弘爲太尉時舉第五倫爲司空班次在下毎正朔朝見弘曲躬自卑上遂聽置雲母屏風分隔其間由此爲故事師曰昔范蠡號鴟夷子鴟夷子乃韋囊也可以盛酒舒卷隨宜者似之甫勉薛十二莫學䲭夷子泛湖當如竇憲立功勤銘于燕然山畫像麒麟閣無徒若鄭洪爲帝寵眷賜以雲母屏隔坐而巳卓氏近新寡豪家朱門扄相如才調逸銀漢㑹雙星洙曰司馬相如初遊臨卭臨卭之富人卓氏有女名文君新寡善琴相如因以琴心桃之遂爲夫婦晏曰雙星牛郎織女也客來洗粉黛日暮拾流螢晏曰車㣧聚螢讀書故云拾流螢不是無膏火勸郎勤六經老夫自汲澗蘇曰孫芸銘石庵云稚子拾薪老夫汳澗細君緝紵王術自汲澗泉煑茗野水日泠泠我歎黒頭白君看銀印靑洙曰見上露雨銀章澁注卧病識山鬼洙曰九章有山鬼爲農知地形洙曰相髙下視肥磽辨五種君子不如老農誰矜坐錦帳洙曰漢百官志郎官給錦悵苦厭食魚腥蘇曰梁鴻曰鴻北人乍到江南苦厭魚鰕氣風土不相宜欲歸不能東南兩岸坼孫曰謂峽江也横水注滄溟碧色忽惆悵洙曰忽一云苦風雷捜百靈洙曰見滋山朝百靈注空中石白虎洙曰石一云有赤節引娉婷自云帝里女洙曰云一云季文選我天帝之季女噀雨鳯皇翎洙曰弄玉帝女也乗鳯皇仙去師曰欒巴噀酒爲雨故云噀雨襄王薄行跡莫學冷如丁洙曰丁丁令威也去家一十年始一歸也千秋一拭淚夢覺有微馨洙曰見宋玉髙唐賦并神女賦云人生相感動金石兩青熒洙曰李廣射石虎没羽揚子雲曰至誠則石金爲開選賦琳珉青熒丈人但安坐休辨渭與涇洙曰無分清濁也龍蛇尚格鬪洒血暗郊坰吾聞聦明主治國用輕刑洙曰尚德也銷兵鑄農器今古歲方寧文王日儉德俊乂始盈庭洙曰詩言濟濟多士文王以寜言爲國當藉才也榮華貴少壯豈食楚江萍洙曰楚昭王度江得一物大如斗色赤以問孔子孔子曰此萍實也師曰至誠則金石爲開甫言薛丈以至誠相感動能移此以感人主使之輕刑銷兵務從節儉捜求賢俊如是則天下不期治而自治薛於此可以掇取榮華於年少之日豈但如甫客寓荆楚而食萍實也哉貽華陽栁少府鄭曰華胡化切繫馬喬木間趙曰劉琨詩繫馬長松下問人野寺門師曰栁少府寓居于野寺甫㝷訪之故云云栁侯披衣笑蘇曰苻堅見張育育披衣出喜曰何堅來矣欣然握手絶倒見我顔色温並坐石堂下洙曰一云堂下石俛視大江奔火雲洗月露洙曰火雲旱雲也趙曰東坡云火雲無時出未受月露洗盖出於此絶壁上朝暾鄭曰暾他昆切日始出洙曰謝靈運早聞夕颷急晚見日月暾趙曰謝靈運登石門最髙頂詩曰晨䇿㝷絶壁自非曉相訪觸熱生病根洙曰觸冒也趙曰晉程曉詩可怜褦襶子觸熱生病根南方六七月出入異中原老少多暍死鄭曰暍於歇切傷熱也趙曰熱病謂之暍武王下車而扇暍蘇曰暍許葛反熱貌漢明帝徙河南人實河北老少途中無水暍熱死数百人汙踰水漿飜趙曰丗說載鍾㑹鍾毓見魏文帝毓面有汗帝問曰何以汗對曰兢兢皇皇汗出如漿也俊才得之子䈥力不辭煩鄭曰䈥舉欣切趙曰俊才得柳少府所以不辭䈥力之煩而往謁也指揮當丗事師曰自此句以下謂栁生負經綸之志言及國家未寧慷慨悲憂其義氣士排帝閽帝閽天門也觀柳生之義槩可與知已者論不可爲俗人道也語及戎馬存涕淚濺我裳悲氣排帝閽洙曰思玄賦叫帝閽使闢扉兮覩天皇于瓊宫鬱陶抱長策洙曰書鬱陶乎予心長䇿良策者也有良策而不見用故鬱陶義仗知者論吾衰卧江漢但愧識璵璠洙曰潘正叔寸晷惟寳豈無璵璠言巳之所識止璵璠而巳以美柳侯也文章一小伎於道未爲尊趙曰後漢楊賜傳云造作賦說以史篆小伎見寵於時起余幸班白因是託子孫趙曰起余者商也言柳少府起發余於班白衰老之間因此相見而有子孫可託之幸也俱客古信州洙曰夔乃古信州也程曰春秋時魚國漢爲魚腹縣梁隋皆爲巴東郡唐初改爲信州又爲夔州取夔國名之結廬依毀垣相去四五里徑微山葉繁時危挹佳士况免軍旅喧醉從趙女舞歌鼔秦人盆洙曰故舊禮數絶自然弃擲與時異况乃踈頑臨事拙飢卧動即尚一旬洙曰劉公幹詩弥廣十餘旬弊裘何啻聮百結洙曰見女子衣百結注君不見空墻日色晚此老無聲淚垂血贈鄭十八賁温温士君子洙曰前漢律歷志以銅有似士君子之行言不爲燥􅊜寒暑変其莭不爲風雨暴露改其形介然有常也令我懷抱盡師曰詩云温其如玉鄭賁有温潤君子之德使我得展尽厎藴無有遺恨靈芝冠衆芳安得闕親近趙曰芝以比鄭蓋靈芝人所喜見者故不可闕於親近也韓退之有云若鳯凰芝草淨先覩之爲快遭乱意不歸竄身跡非隱洙曰以避乱也趙曰山濤吏非吏隱非隱細人尚姑息趙曰礼記小人之爱人也以姑息薖曰小惠相濡潤侮慢无所不至吾子色愈謹髙懷見物理識者安肯哂卑飛欲何待捷徑應未忍洙曰不欲枉尺而直㝷也修可曰張衡應間曰捷徑邪至我不忍以投歩于進容我不忍歙扇又楚詞夫惟捷徑而窘歩盧藏用傳士大夫指嵩山終南爲仕塗捷徑示我百篇文詩家一標凖蘇曰屈平文詞乃詩家標凖也覊離交屈宋洙曰屈原宋玉牢落值顔閔洙曰顔淵閔子騫水陸迷畏途洙曰畏一作長藥餌駐脩軫逸曰言以丹薬延年也古人日巳逺靑史字不泯洙曰古詩不泯並圖青史盛德夢符曰右按應劭風俗通曰青史善著書即青史者人姓名也趙曰青史者殺青竹簡之史也江文通云俱啓丹青並圗青史詩云靡囯不泯歩趾詠唐虞追隨飰葵堇洙曰以堯舜之道自楽而不以簞瓢爲慮也數盃資好事異味煩縣尹心雖在朝謁力與願矛盾抱病排金門衰容肯爲敏洙曰敏不敏也如左傳魯人以爲敏同師曰衰老欲排金馬門尤非本志也贈衛八處士師曰按唐史拾遺甫与李白髙適衛賔相友善時賔年最少号小友今據杜詩贈衛八云昔别君未㛰知此詩乃贈衛賔乎人生不相見動如參與商洙曰見送髙書記詩註今此復何夕共此燈燭光洙曰見今夕行注一云共宿此灯花少壯能幾時鬢髮各巳蒼洙曰漢武帝秋風辝少壯幾時兮柰老何陶淵明帰去來寓形宇内復幾時饒曰蒼老蒼也訪舊半爲鬼驚呼熱中膓洙曰魏文帝与呉質書昔年疾疫親故多離其災徐陳應劉一時俱逝痛可言耶昔日遊処謂百年巳分可長共相保何数年之間零落畧尽言之傷心頃撰其遺文都爲一集觀其姓名巳爲鬼録追思昔遊猶在心目而此諸子化爲糞壤可復道哉修可曰孟子不得於君則熱中注心熱恐懼也趙曰此乃莊子内熱之義蓋煎熱之謂也焉知二十載重上君子堂趙曰王仲宣詩髙㑹君子堂昔别君未婚兒女忽成行怡然敬父執直方曰曲礼見父之執不謂之進不敢進問我來何方問荅未及巳兒女羅酒漿洙曰兒女一作驅兒何曰詩可以挹酒漿蘇曰郭育見戴逵使羅酒漿兒女進果餒夜雨剪春韮蘇曰郭林宗見友人夜冒雨剪韮作炊飯今洛汭人皆効之薛曰右按南史周顒春初早韭新炊間黄粱洙曰陶隱居曰黄粱本出青兾穗大毛長殻米俱麄於白粱食之比它榖最益脾修可曰王儉問周顒曰山中何者爲最勝曰春𥘉早韮秋未晚菘趙曰見主人意慇懃而眞也主稱㑹面難洙曰張平子賦主稱露未晞曹子建詩主稱千金壽古詩㑹面安可知一舉累十觴十觴亦不醉洙曰一作千觴亦不醉感子故意長明日隔山岳丗事兩茫茫洙曰曹頴逹詩㪯觴詠露斯蘇曰孔文㪯百觴亦不醉梅曰李牧曰呉將軍飲数十觴未見有醉容贈蘇四徯異縣昔同遊各云猒轉蓬洙曰古詩爲客若轉蓬言如蓬之隨風無所定止也别離巳五年尚在行李中洙曰左傳秦晉圍鄭燭之武夜見秦伯曰若舎鄭以爲東道主行李之往來供其困乏注行李使人戎馬日衰息乗輿安九重洙曰天子之門九重乗輿天子所乗輿時京師𥘉復天下漸平也趙曰以車駕嘗因吐蕃䧟京師而幸陜今稍平定復還長安爲九重之安矣有才何棲棲將老委所窮趙曰公毎自負矣故不以言才爲嫌微生畒云丘何爲是棲棲者欤爲郎未爲賤洙曰徯爲宣義郎子美檢校工部貟外郎非以階官也後篇云雖爲尚書郎可以證矣其柰疾病攻子何面䵩黒焉得豁心胷趙曰指言蘇徯也列子云面目黧黒巴蜀倦剽劫下愚成土風洙曰崔旰之乱也幽葪巳削平洙曰禄山所節鎮処也荒徼尚彎弓洙曰時思明未平趙曰安史之乱雖巳削平而猶有盗賊也斯人脫身來豈非吾道東洙曰儒林傳𥘉梁項生從田何受易丁寛爲項生從者讀易精敏材過項生遂事何斈成何謝寛寛東帰何謂門人受易以東矣師古曰言丁寛得其法術以去後漢鄭玄斈於馬融辝帰融喟然謂門人曰鄭生今去吾道東矣乾坤雖寛大所適裝嚢空肉食哂菜色少壯欺老翁洙曰傷時情以肥癯爲輕重也蘇曰吕安謂嵆康曰我輩稍有菜色反爲肉食軰所哂徒知其外而不知内也周澤謂諸齋郎曰若有少壯不可欺老翁翁胃中有書万餘卷若輩未到此田地諸人皆慚悚无一語對况乃主客間古來偪側同君今下荆楊趙曰言時之寛舒則寛舒同時之偪側則偪側同公詩有偪側行獨帆如飛鴻二州豪俠埸人馬皆自雄一請甘飢寒再請甘養蒙洙曰養蒙欲其晦迹以自全也君不見簡蘇徯君不見道邊廢弃池君不見前者摧折桐百年死樹中琴瑟洙曰蔡邕取㸑下桐爲琴趙曰異苑載呉平在勾章州門外怱生一株桐上有謡歌之声平悪而斫其後桐自迁立於故根上又聞歌声曰死樹今更青呉平㝷當帰桐材所以爲琴瑟今言死樹猶可爲之譬士終有用也舊注所引者非一斛舊水藏蛟龍洙曰積水成淵蛟龍生焉趙曰以譬士當守所養也丈夫蓋棺事始定洙曰古詩蓋棺事乃巳言死而後巳也蘇曰劉毅丈夫兒蹤跡不可㝷常便混羣小中蓋棺事方定矣君今幸未成老翁趙曰魏文帝与呉質書云巳成老翁但未白頭耳何恨憔悴在山中深山窮谷不可處霹靂魍魎兼狂風洙曰兼一作并一作因蘇曰鮑休清溪賦霹靂破石狂風驚林贈李白二年客東都所歷猒機巧彦輔曰東都洛陽也前漢地理志周人之失巧僞趍利余曰葛屦詩其民機巧趍利野人對羶腥彦輔曰潘岳秋㒷賦序僕野人也杜亦自謂爲郊野人耳周礼注犬腥羊羶離騷九章曰腥臊並御芳得薄兮𬞞食常不飽趙曰此意似雖日見羶腥之物而其食猶未厭乎藜藿所以對之而増媿則甫之貧困無資可見矣豈無靑精飯使我顔色好洙曰梁書安成康王秀傳兩韓之孝友純深庾郭之形骸枯槁或䂊飯菁羹惟日不足或葭牆艾席樂在其中田曰陶隱居登眞隠訣載太極眞人靑精乾石䭀飯注云以南燭草煑汁漬米爲之彭祖云大宛有青精光生淸靈眞人眞誥云霍山有道士鄧伯元者受靑精石飯之法苦乏大藥資脩可曰丹書怉丹山人大藥證云夫大藥者須錬砂中录能取鈆裏金黃芽爲根蔕水火錬功深彦輔曰洞仙傳晉中興以來名山道士合大藥得仙者甚衆山林跡如掃洙曰魏文帝㳺仙詩与我一丸藥光耀有五色服藥四五日胷臆生羽翼趙曰四句通義離爲兩端則語意不相接蓋詩人不以文害辭以靑精飯可謂之大藥矣眞誥云霍山有道者鄧伯元受靑精石飯之法内見五臟色如嬰孺豈不謂之大藥乎而靑精飯法其所用之物如以南燭草木葉煑取汁浸漬稻米炊之張君房云青稻米如䂊章西山靑米呉越靑龍稻草是也此亦費㝷討不以謂之大藥資乎彦輔曰北山移文曰乍低枝而掃跡師曰李白將爲梁宋之遊甫作此詩贈之東都洛陽也唐初都長安後都洛陽東都自安史再䧟之後民物貧窘故幾巧趍利風俗浮薄甫二年客居于此覩兹機巧之俗甚厭惡之傷昔日之不然也羶腥謂兵後東都居民肝䐉塗地風揚羶腥之氣野人甫自稱也𬞞食不飽謂物踊貴青精神仙之所服食有黄精有靑精色黄者爲黄精色靑者爲靑精亦若天黄地黄人黄也本只是一種根浮于上者爲天黄沉于下者爲地黄生于中者爲人黄靑精食之旣乆能益人顔色長年却老藥有大有小僊亦有小大也有天仙有地仙藥有丹砂黄金爲藥之上者故云大藥甫旣客居東都無大藥之資將隱于山林求靑精食之亦可以駐顔色柰何山林人迹如掃謂兵火之後絶無人煙故也蓋歎東都之不可居李侯金閨深鮑曰白嘗供奉翰林故云洙曰江文通别賦金閨之諸彦蘭臺之群英注金閨金馬門也謝玄暉出尚書省詩旣通金閨籍彦輔曰按李陽冰作白集序云天子賜金閨脫身事幽討鮑曰本傳白自知不爲親近所容求還山帝賜金帶放還趙曰李白宜通籍金閨以不得遂浮遊四方此爲事幽討也彦輔曰漢項羽問張良曰沛公安在曰脫身去間至軍白就從祖陳留採訪使彦允請北海髙天師授道籙亦有梁宋遊洙曰任彦升令云客游梁朝則聲華籍甚顔延年北使洛塗出梁宋郊鮑曰白時得還与公同在洛將適梁宋也後在梁亦与公同遊故遣懷詩云昔我遊関中得梁孝王都憶与髙李輩論交入酒爐趙曰梁謂汴州今之東京宋謂宋州今之南京也鄭曰梁古犬梁今汴京也宋古𣏌國今應天府是也方期拾瑶草江淹香爐峯詩瑶草正翕赩玉樹信葱靑江淹曹植詩徙倚拾蕙草蘇曰東方朔与友人書曰不可使塵網名韁利鎻怡然長嘯脫去十洲三島相期拾瑶草呑日月光華共輕舉爾尹曰江文通别賦惜瑶草之徒芳李善注曰髙唐賦序云我帝之季女名曰瑶姬未行而亡封于巫山之臺精神爲草寔曰靈芝山海經曰姑瑶之山帝女死焉名曰女尸化爲瑶草其葉胥成其華黄其實如兎絲服者媚於人趙曰瑶草事雖出於山海經姑瑶之山帝女死焉化爲瑶草服之者媚於人而瑶草字江淹登廬山詩瑶草正翕赩别賦云惜瑶草之徒芳盖以仙境之物美言之耳今子美正承江淹而用之也彦輔曰沈佺期詩意欲拾靈草師曰漢時凡待詔者必於金馬門美生曰彦李白嘗侍詔翰林故云金閨彦幽討謂窮討幽趣梁宋即今之東京開封府是也本魏地號曰大梁其地有香爐峰神仙所居之迹瑶草乃珊瑚樹之類仙家用以合丹藥服餌時李白擺脫翰林之職將以窮討幽趣故爲梁宋之遊拾瑶草以服食蓋白之爲人放曠不樂仕宦有意於神仙後以入水捉月或者以爲戸解戲簡鄭廣文䖍兼呈蘇司業源明廣文到官舎洙曰廣文事是醉時歌繫馬堂階下洙曰繫一作置醉即騎馬歸趙曰山簡傳日暮倒載歸酩酊無所知時時能騎馬倒着白接䍦也頗遭官長罵才名三十年坐客寒無氊趙曰唐史稱鄭䖍在官貧約澹如也乃引杜甫嘗贈以詩曰才名三十年坐客寒無氊則知公之作眞詩史矣近有蘇司業時時與酒錢洙曰與一作乞鄭曰乞丘旣切又作與師曰䖍始爲廣文館學士性嗜酒不治事數爲官長所訶怡然不以爲意禄山反䧟于賊受禄山僞署後竄歸坐免官故至貧窶惟蘇源明重其才時時給餉之杜詩云得錢即相覔沽酒不復疑盖謂此也戲贈友二首元年建巳月洙曰肅宗去上元三年年號止稱元年月以斗建辰爲名也師曰肅宗止稱元年復以月建之辰稱月蓋法上古之制也年號自漢武帝方有之甫特於此年以元年建巳月爲稱記肅宗之立上古制不然何以謂之詩史乎郎有焦校書自誇足膂力能騎生馬駒一朝被馬踏脣裂板齒無壯心不肯巳欲得東擒胡趙曰公使魏武帝樂府云老驥伏櫪志在千里烈士暮年壯心不巳師曰胷腸之間曰膂生馬駒其馬未調習者板大齒也仲尼嘗譏子路暴虎慿河死而無悔謂其好勇故也此詩雖云諧戲亦爲好勇者之戒元年建巳月官有王司直馬驚折左臂骨折面如墨洙曰國語望之如墨駑駘漫染泥何不避雨色師曰觀此詩有何不避雨色之句盖爲躁進者之戒云勸君休歎恨未必不爲福洙曰此詩所諷近白居昜新豊折臂翁趙曰淮南子云塞上翁馬亡入胡人皆弔之曰何知非福居數月其馬引胡駿馬而歸人皆賀之曰何知非禍及家冨馬良其子好騎墮而折躰人又弔之曰何知非福居一年胡人大入丁壯戰死者十九其子獨以跛故父子得獲相保舊注引居易新豊折臂翁穿鑿矣分門集註杜工部詩卷之十七, WYG: ''}
