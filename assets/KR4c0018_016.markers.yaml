  - {type: variant, offset: 0, length: 27821, content: 分門集註杜工部詩卷第十六文章古詩二首律詩十四首夜聽許十誦詩愛而有作許生五臺賔洙曰河北有五臺山鄭曰五臺山名今在河北其山五蠻環秀巍然俗謂之五臺仙人之都也業白出石壁趙曰此言許生客居五臺行業精白而出也佛經以美業爲白惡業爲黒逹磨甞曰當勤修白業大觀曰石壁字暗使列子載趙㐮子狩於中山有一人從石壁出隨煙上下余亦師粲可身猶縳禪寂洙曰師粲善詩修可曰粲可乃六祖僧粲及慧可二禪師粲傳法偈華種雖因地從地種花生若無人下種花地盡無生可傳法偈本來縁有地種花生本來無有種花亦不能生二人乃禪中祖師故子美師之非師粲善能詩者也趙曰粲則僧粲可則慧可傳燈云正与逹磨丗次相接公方与許生共斈性空事故云許生巳業白而出吾猶縳禪空而未脫也縳字出佛書其語曰貪著禪味是菩薩縳縳禪則不能解也何階子方便謬引爲匹敵趙曰此言有何因階得子垂方便之行而以爲之匹也洪駒父引佛經善巧方便其說是而舊注以爲田子方離索晚相逢昱曰記檀弓吾離羣而索居包蒙欣有擊洙曰易九二包蒙上九擊蒙誦詩渾洙曰一作混遊衍四座皆辟易洙曰皆一作俱項羽傳項羽瞋目叱赤泉侯人馬俱驚辟易数里應手看捶鈎鄭曰捶子果切又之累之睡二切洙曰莊子知北遊大馬之棰鈎者年八十矣而不失豪芒大馬曰子巧欤曰臣有守也臣之年二十而好捶鈎於物無視也非鈎无察也是用之者假不用者也以長得其用而况乎無不用者乎物孰不資焉注拈捶鈎之輕重而無豪芒之差都無懷則物來皆應大馬司馬也郭云捶者拈捶鈎之輕重而不失豪芒也或說云江東三魏之間人皆謂錘爲棰音字亦同郭失之今不從此說趙曰莊子輪扁斵輪有曰得之於心而應之於手清心聽鳴鏑洙曰前漢匈奴傳冒頓作鳴鏑出獵左右皆隨鳴鏑而射殺頭曼應劭曰髐箭也左思詩邊城苦鳴鏑陸機鳴鏑自相知趙曰黃鲁直云新詩如鳴弦盖出於此也鄭曰鏑丁歷切矢鋒也精微穿溟涬鄭曰上亡頂反下户頂反洙曰莊子在宥篇大同乎涬溟注与物无際趙曰礼記致廣大而盡精微帝系譜曰天地𥘉起溟涬𪷟鴻舊注引莊子大同乎涬溟注云自然之氣然終非本出杜公不敢倒用也師曰謂詩之精微与天地之氣相貫穿飛動摧霹靂洙曰公羊注曰雷疾而甚者爲震震與霆皆謂霹靂也陶謝不枝梧洙曰陶潜謝玄暉靈運惠連之徒也前漢項籍傳即帳中斬宋義頭諸將讋服莫敢枝梧如淳曰枝猶枝梧也臣瓉曰小柱爲枝邪柱爲梧今屋斜柱是也師曰霹靂雷霆之威謂詩思飄然飛動雖霹靂之威亦爲摧沮足見詩思之壯也風騷共推激紫鸞自超詣洙曰紫鸞當作紫燕字之誤也西京雜記文帝自代還有良馬九皆天下之駿其第五馬名紫燕翠駮誰剪剔洙曰爾雅駮如馬倨牙食虎豹管子曰桓公乗馬虎望見而伏公問管仲管仲意者君乗駮馬公曰然仲曰駮馬食虎豹故疑焉紫燕良馬名也莊子曰治馬者燒之剔之君意人莫知人間夜寥閴蘇曰羲之一曰披襟立池上無語羊欣曰人莫知君意何也趙曰寥閴寂静之義梁蕭子範直坊賦曰何坊禁之寥閴對長夜之蕪永蒭曰末句崔非傷無知巳者乎贈蜀僧閭丘師兄彦輔曰太常博士均之孫大師銅梁秀洙曰左思蜀都賦於東則左綿巴中百濮所充外負銅梁於嚴渠内函要害以膏腴田曰太平御覧載張孟蜀都賦注云銅梁山名也按其山有桃枝竹東西連亘二十餘里山嶺之上平整逺望諸山此獨秀也山在合州界銅梁縣籍籍名家孫洙曰袁陽源白馬篇籍籍關外來車徒傾國鄽安石曰籍籍名聲之衆也嗚呼先博士炳靈精氣奔洙曰左太冲蜀都賦近則江漢炳靈丗載其英鬱若相如皭若君平王褒暐曄而秀發揚子含章而挺生師曰炳靈言英靈顯赫也惟昔武皇后臨軒御乾坤多士盡儒冠墨客藹雲屯洙曰楊子雲上長楊賦聊因筆墨之成文章故藉翰林以爲主人子墨爲客卿以諷陸士衡馬如雲屯當時上紫殿不獨卿相尊洙曰謝玄暉直中書省紫殿肅隂隂丗傳閭丘筆師曰閭丘文筆號爲大手峻極逾崑崙洙曰禹本紀曰崑崙髙三千五百里日月所相避隱爲光明也詩峻極于天鳳藏丹霄暮洙曰一作穴龍去白水渾洙曰東京賦我丗祖忿之乃龍飛白水鳯翔參墟青熒雪嶺東洙曰西都賦琳珉青熒去一作出沈曰雪嶺在蜀一名太白山碑碣舊製存鄭曰碣巨列切田曰東蜀牛頭山下有閭丘均撰瑞聖寺磨崖碑嚴政書寺今改爲天寕羅漢禪院斯文散都邑髙價越璵璠洙曰均以文名當時四方碑碣多出其手晚看作者意趙曰郄生見王導詩歎曰晚見作者妙意梅曰作者指均也妙絶與誰論洙曰陸韓卿賦歌能妙絶吾祖詩冠古鄭曰冠古玩切同年蒙主恩豫章夾日月歲乆空深根洙曰見豫章深出地注小子思踈闊豈能逹詞門蘇曰宗戩讀渊明詩抚卷歎曰小子踈略焉能逹文詞之門閫使人有愧服之心信乎一丗之真儒窮愁一揮淚洙曰愁一作秋陸士衡揮淚歎流離又揮涙廣川隂相遇即諸昆我住錦宫城洙曰成都記錦城以江山明麗錯雜如錦兄居祇樹園鄭曰祇翹移切洙曰金剛經佛在舎衛囯祇樹給孤獨園田曰楞嚴經云祗洹精舎注云祇洹林樹名㖵云祇陁洹或云逝多此云戦勝即太子名林王是彼故云勝林精告建立有二因縁須逹長者施園祇陁太子施樹地近慰旅愁徃來當丘樊天涯歇滯雨粳稻卧不翻漂然薄遊倦始與道旅敦旅一作侣鲁曰敦厚也景晏歩脩廊而無車馬喧洙曰陶渊明結廬在人境而无車馬喧夜闌接軟語落月如金盆洙曰謝靈運夜聽極星闌車又継以闌夕語法華經又以軟語一云言詞柔軟漠漠丗界黒洙曰一作空驅驅爭奪繁唯有摩尼珠可照濁水源洙曰言性照圜明如摩尼珠然雖識濁水而不爲汚濁所累也如語云涅而不淄田曰圎斍經譬如清淨摩尼宝珠映於五色隨方各現諸愚癡者見彼摩尼寔有五色圎斍净性現於身心隨類各應亦復如是觀無量壽佛經云諸天童子摩尼以爲纓絡光照百餘里猶如和合百億日月不可具名室志云馮翊嚴生家漢南現山得一洙如弹丸色胡人曰此西囯清水珠也若至濁水冷然洞澈矣以三十萬易之而去師曰摩尼珠以喻法性圎明淸浄不染塵垢甫奔走盗賊間健羡閭丘不爲汚濁所累故云云寄李十二白二十韻昔年有狂客號爾謫仙人洙曰賀知章㑹稽人自號四明狂客見白文章乃歎曰子謫仙人也筆落驚風雨洙曰驚一作聞驚風雨言敏速也詩成泣鬼神洙曰泣感鬼神蘇曰李白墓銘云公在長安時祕書監賀知章吟公烏栖曲云此詩可以哭鬼神聲名從此大汨没一朝伸洙曰按史言知章言白於玄宗召見金銮殿奏頌一篇賜食帝爲調羹召供奉翰林文彩承殊渥流傳必絶倫洙曰帝甞召白爲樂章白巳醉援筆成文婉麗精巧無留思帝爱其才数宴見龍舟移棹晚獸錦奪𫀆新洙曰白外傳云白作樂章賜錦𫀆白日來深殿青雲滿後塵乞歸優詔許洙曰白爲髙力士所諸自知不爲親近所容懇求還山帝賜金放遂遇我宿心親洙曰宿一作夙與子美等爲醉中八仙未負洙曰一作逐幽棲志兼全寵辱身劇談憐野逸嗜酒見天眞洙曰嗜好也揚雄家貧嗜酒醉舞梁園夜洙曰雪賦梁王不恱遊於兎園今汴州乃梁園故地行歌泗水春洙曰孔子行歌於泗水之上泗水今泗濵是也才髙心不展道屈善無隣處士禰衡俊洙曰平原處士禰衡字正平見諸公厭祢衡注諸生原憲貧洙曰見難甘原憲貧注稻粱求未足洙曰廣絶交論分鴻鶩之稻粱薏苡謗何頻鄭曰薏於記苡養里切洙曰馬援征交趾載薏苡種還人謗之以爲明珠大貝喻白之遇讒也五嶺炎蒸地三危放逐臣洙曰見雲山分五嶺風壌帶三苗注幾年遭鵩鳥洙曰賈誼作長沙王傳不得志有鵩集于舎隅遂作鵩鳥賦獨泣向麒麟洙曰王翰古峨眉怨朝晡泣對麒麟樹樹下蒼苔日漸班蘇武先還漢洙曰見握節漢臣回注黃公豈事秦洙曰夏黃公也見羽翼懷商老注楚筵辭醴日洙曰見門引申白賔注梁獄上書辰洙曰白坐事下潯陽獄鄒陽於梁孝王獄中上書即出之巳用當時法誰將此義陳老吟秋月下病起暮江濵莫怪恩波隔乗槎與問津洙曰博物志有居海者八月乗查而上天犯牽牛星孔子使子路問津焉送竇九歸成都文章亦不盡竇子才縱橫非爾更持節何人符大名讀書雲閣觀問絹錦宫城我有浣花竹題詩須一行偶題文章千古事得失寸心知趙曰言文章垂不朽之事其得其失蓋吾心自知之作者皆殊列名聲豈浪垂洙曰言以文章名必有所長也騷人嗟不見洙曰丗之言文章者謂文至於斉梁之間変而爲風騷矣趙曰指言屈原宋玉也文章之祖起於騷嗟不見則屈宋逺矣漢道盛於斯洙曰漢文章深厚有古人之風趙曰言漢有司馬遷相如劉向王褒之属傷今不復見古人也師曰文章惟漢爲渾厚森嚴故曰漢道盛於斯心從弱歲疲前軰飛騰入餘波綺麗爲洙曰綺麗騷人之作也趙曰文章至於綺麗乃騷雅之末流矣故謂之餘波後賢兼舊利洙曰利一作列後之作者兼騷人之躰也歷代各淸規趙曰所謂逓相祖述也法自儒家有心從弱歲疲趙曰公自謂也吾之用心自弱冠時疲苦至今也永懷江左逸洙曰江左晉元帝渡江所都也阮藉之流文多尚逸趙曰江左則嵇阮鮑謝之徒文選多采取焉故公永懷之多病鄴中竒洙曰病一作謝鄴魏所都文帝好文故作者多尚竒江文通云關西鄴下旣巳罕同河外江南頗爲異法騄驥皆良馬麒麟帶好兒趙曰麒麟之子仍是麒麟故云帶好兒車輪徒已斵洙曰莊子桓公讀書輪扁以爲聖人之糟粕桓公曰寡人讀書輪人安得議乎輪扁曰以臣之事觀之夫斵輪徐則甘而不固疾則苦而不入不徐不疾得之於手應之於心口不能言有數存焉於其間臣不能以喻臣之子臣之子亦不得受之於臣是以行年七十而老斵輪古人之与其不可傳也死矣然則君之所讀者古人之糟粕巳陸士衡文賦是蓋輪扁所不得言故非華說之所能精也堂構惜仍虧洙曰書曰若考作室旣底法厥子乃弗肯堂矧肯構謾作潜夫論洙曰後漢王符字莭信隱居著書三十餘萹以譏當時失得不欲章顯其名故號曰潜夫論虚傳㓜婦碑洙曰曹操与楊脩讀曹娥碑隂有八字曰黄絹㓜婦外孫韲臼脩解得操行三十里乃悟云黃絹是色絲絶字也㓜婦少女少女妙字也外孫女子女子好字也韲曰受辛之器受辛辤也言絶妙好辤与楊合操曰有智无智校三十里縁情慰漂蕩洙曰文賦詩縁情而綺靡抱疾屢遷移經濟慙長䇿洙曰言无經済之才趙曰公雖爲自謙蓋亦自傷於不用也飛棲假一枝洙曰鷦鷯賦巢不過一枝左太冲巢林棲一枝可爲逹士模塵沙傍蜂蠆鄭曰傍蒲浪切近也江峽繞蛟螭洙曰蜂蠆蛟螭皆毒物也言避患難不暇耳趙曰言樓托於夔州之地如此非有譬托蕭瑟唐虞逺洙曰沈休文論虞夏以來遺文不覩趙曰歎治古之不復見聮翩楚漢危洙曰江文通雜躰詩序夫楚謡漢風旣非一躰魏製晉造固亦二躰趙曰傷戰爭之不能安聖朝兼盗賊洙曰胡虜爲中原之乱也趙曰言前有安史今有吐蕃是也異俗更喧卑洙曰公北人而在南故呼楚人爲異俗喧卑囂雜貌鬱鬱星辰劒洙曰張華夜登樓望見牛斗間有異氣乃鄷城寳劒也蒼蒼雲雨池洙曰周瑜傳蛟龍得雲雨恐非池中物革曰此二句子美自喻失其所也如此兩都開幕府洙曰兩都東京西京也幕府謂元帥也萬㝢揷軍麾洙曰謂天下用兵也南海殘銅柱洙曰馬援勒功銅柱趙曰言在南亦有侵犯者馬援征南時立銅柱而勒功其上也師曰恨無人立功如馬援也東風避月支洙曰匈奴傳東胡強而月氏盛趙曰以比吐蕃也師曰言避吐蕃之難也音書恨烏鵲洙曰西京雜記乾鵲噪而行人至趙曰恨烏鵲之不信也號怒恠熊罷洙曰苦寒行熊羆對我蹲趙曰言夔州山居之所有也稼穡分詩興洙曰役於營生不暇吟詠也柴荆學士冝洙曰習其風俗也故山迷白閣秋水憶黃陂洙曰白閣黃陂閞中山水趙曰白閣則終南山相附之山皇陂則皇子陂也舊以爲黄陂誤矣不敢要佳句鄭曰要伊逍切愁來賦别離趙曰言夫郷囯之逺也戲爲六絶庾信文章老更成凌雲健筆意縱橫趙曰庾信文章綺麗爲丗所尚江南賦尤見稱於丗謂若相如作大人賦飄然有凌雲之氣今人嗤點流傳賦田曰于宝晋紀云蓋丗共嗤點以爲灰塵而相詬病矣不覺前賢畏後生洙曰周書庾信字子山有盛才文章綺艶爲丗人所尚謂之庾躰宿斈後生竟相模範毎有一文出京都莫不稱誦作哀江南賦尤爲麗絶至今行於丗楊王盧駱當時體洙曰楊烱王勃盧照鄰駱賔王以文詞斉名天后初海内呼爲楊王盧駱號爲四傑後盧以疾投頴水卒楊卒官駱以檄武君死徐敬業難王溺死也輕薄爲文哂未休趙曰四子之文大率浮麗故公以爲輕薄爲文而哂之未休也孔子曰其言不遜是故哂之爾曹身與名俱滅不廢江河萬古流歐曰唐史李敬玄稱楊烱盧照鄰駱賔王王勃必當顯貴裴行儉曰士之致逺先器識後文藝勃等雖有文才而浮躁淺露豈享爵禄之器也縱使盧王操翰墨劣於漢魏近風騷洙曰謂漢魏文雖近風騷未失其大全尓趙曰此篇文㪯照隣与勃也言漢魏之文去古未逺終有風騷之氣而盧王之文比之爲劣龍文虎脊皆君馭洙曰龍文虎脊馬之駿異者皆君馭言皆得逸才修可曰漢天馬歌驊騮駿驥龍文虎脊武帝時西域大宛馬虎春魚目龍文鳯頸尾如蒲梢也歷塊過都見爾曹鄭曰過古禾切洙曰見斈並盧王敏注王褒頌過都越國蹶若歷塊趙曰謂文章之妙如龍文虎脊之馬皆可充君之馭然或過都而蹶則猶不爲不良馬也爾曹指盧王矣師道曰言逸足過都如歷士塊之易也才力應難誇數公凡今誰是出羣雄或看翡翠蘭苕上趙曰郭景純詩翡翠戯蘭苕容色更相鮮言珍禽在芳草間交相暉映而公借用言文章也未掣鯨魚碧海中洙曰言今之爲文者止得小巧而已趙曰公自負其出羣雄者如掣鯨魚於碧海非釣手之善氣力之雄安能然哉不薄今人愛古人淸詞麗句必爲隣竊攀屈宋冝方駕恐與齊梁作後塵洙曰屈原宋玉言其丈才足以方駕並驅也梁齊詩躰格輕麗議者以丈之失始齊梁也趙曰此公之志也公必欲追逐屈宋而與之並駕者唯恐不超越齊梁而翻與之作後塵蓋齊梁躰格輕麗公所不取也未及前賢更勿疑遞相祖述復先誰别裁僞體親風雅夢符曰右按南史徐陵多變舊躰有新意又北史庾信父肩吾與徐陵並爲東宫學士文辝竒艷丗號徐庾躰後進競相模􅚘轉益多師是汝師趙曰裁納之以近風雅亦無常師必多求前人所最長者爲師耳師曰遞相祖述言齊梁相習爲輕薄之文無有慨然以風雅正躰倡先者多師言意尚不一也解悶五首同作十二首五首見果實門二首見絶句沈范早知何水部洙曰謂水部郎中薛據沈約范雲見能詩何水部注曹劉不待薛郎中洙曰曹子建劉幹薛據也趙曰若薛據者恨不與曹子劉楨同時獨當省署開文苑兼泛滄浪學釣翁趙曰若薛前在省部今在荆南有江湖之樂斯爲斈釣翁李陵蘇武是吾師洙曰丗之言五言詩始於蘇武李陵孟子論文更不疑蘇曰顔延年云李陵蘇武句法可師餘區區軰不足数南子端論文䆒理惟孟軻之書使人不疑趙曰指孟雲卿也魏文帝有論文篇末句專言孟雲卿一飯未曽留俗客蘇曰陶侃未嘗延俗客數篇今見古人詩蘇曰校書郎孟雲卿復憶襄陽孟浩然清詩句句盡堪傳即今耆舊無新語蘇曰殷湛曰曹劉泯跡文章无宗師觀耆舊區區於毫楮閒淈竒新語何後生者敢尓爲也謾釣槎頭縮項鯿鄭曰卑連切洙曰項一作頸浩然開元時人詩云梅花殘臘月栁色半春天鳥泊随陽鴈魚藏縮頸鯿又云試垂竹竿釣果得查頭鯿鯿魚也楚人云長腰粳米縮頭鯿魚爲美味也趙曰言今耆舊之間不復造新語以言鯿魚但謾釣之而已習鑿齒㐮陽耆舊傳云漢水中鯿魚甚美禁人捕以槎断水因謂之槎頭鯿陶冶性靈存底物洙曰詩能陶冶情性修可曰梁鍾嶸評阮嗣宗詩无彫蟲之工而詠懷之作可以陶冶靈性幽思趙曰言用何物以爲陶冶性靈者惟有詩而巳故下句自長吟新詩改罷自長吟蘇曰謝惠連改詩旣罷无知音者遇好句自吟而已熟知二謝將能事洙曰玄暉霊運趙曰熟知者稔熟之熟也公言其稔熟知謝靈運謝惠連將作此詩爲能事頗學隂何苦用心蘇曰梁術云隂鏗何遜文章傑出諸公用心太苦趙曰隂則隂鏗何則何遜苦用心則不苟且爲心矣不見髙人王右丞鄭曰本注云相國縉藍田丘壑蔓寒藤趙曰右丞王維也有别墅在藍田所謂輞川也最傳秀句寰區滿未絶風流相國能洙曰唐書王維傳維字摩詰開元中擢進士第乾元中轉尚書右丞以詩各盛於時尤長五言詩晚年得宋之問藍田别墅墅在輞口水周於舎下竹洲花塢与道交裴迪浮舟往來弹琴賦詩嘨歌終日甞聚其田園所爲詩號輞川集代宗時弟縉爲宰相代宗好文求維文縉編綴得四百餘篇上之趙曰王維能詩號􅬈川集行于丗其弟相國縉本傳云少好斈與兄維俱以名聞書畫古詩律詩共二十四首李潮八分小篆歌余曰邵氏聞見録云韓退之石鼔詩躰子美八分歌也蒼頡鳥跡旣茫昧字體變化如浮雲洙曰蒼頡黄帝臣也觀鳥跡而爲文字自蒼頡之後字躰変易如浮雲焉无定躰也陳蒼石鼓又巳訛趙曰韓退之詩周網陵遲四海沸宣王憤起揮天戈鑴功勒成告万丗鑿石作鼓隳嵯峨鄭曰陳蒼山名在鳯翔寳雞縣大小二篆生八分洙曰周太史籕始剏大篆唐蘇載記石鼓文謂之周宣王獵碣共十鼔其文則史籕大篆漢蔡邕字伯喈爲中郎將正六經于太斈石壁天下摹斈邕大篆入妙品小篆者秦丞相李斯刪古文複篆及史籕之書也𥘉諸侯力正文字異形秦始皇帝𥘉兼天下丞相李斯乃奏同之罷其不與秦文合者斯作蒼頡篇胡母敬作博斈篇皆取史籕大篆或頗改所謂小篆秦有李斯漢蔡邕見上注中間作者寂不聞趙曰八分篆与八分事書苑所載不一以予觀之蔡文姬別傳曰臣父邕言八分書割李斯小篆去二分取八分故曰八分書嶧山之碑野火焚棗木傳刻肥失眞洙曰嶧山碑李斯書也爲野火所焚人惜其文故以棗木傳刻按史記始皇二十八年東行郡囯上鄒嶧山於是刻之于石乃頌秦徳苦縣光和尚定功曰苦縣屬陳囯故城今在亳州骨立修可曰續漢書詔苦縣立老子祠兼刻石即蔡邕八分書也趙曰野火焚謂李斯書也尚骨立謂蔡邕書也故於嶧山之碑則傷棗木之失眞於苦縣之碑則喜其有骨立也嶧音亦書洙曰一作書貴痩硬方通神蘇曰羊欣曰古將軍筆畫勁硬妙絶通神惜哉李蔡不復得洙曰李斯蔡邕不可復得吾甥李潮下筆親尚書韓擇木騎曹蔡有隣開元巳來數八分潮也奄有二子成三人洙曰韓擇木昌黎人官至工部尚書散騎常侍工八分師蔡邕法風流閑媚號伯喈中㒷蔡有隣濟陽人官至胄曹叅軍善八分始拙弱至天寳中遂精妙相衛間多其筆跡况潮小篆逼秦相快劒長㦸森相向八分一字直百洙曰一作千金蘇曰程邈見李斯書曰此一字直千金蛟龍盤拏肉屈強鄭曰屈九勿反亦作倔洙曰言筆跡竒怪勁屈如蛟龍之盤拏也呉郡張顚誇草書草書非古空雄壯洙曰張旭呉郡人官至右率府長史時善草書言吾見公主擔夫爭路而得其意後又觀公孫氏舞劒器而得其神飲醉輒草書揮筆大叫以頭濡墨水中天下呼爲張顛醒後自視以爲神人謂之草聖豈知吾甥不流宕鄭曰徒浪切過也丞相中郎丈人行洙曰丞相斯也中郎邕也丈人行尊老之稱也巴洙曰一作江東逢李潮逾月求我歌我今衰老才力薄潮乎潮乎奈汝何師曰昔蒼頡觀鳥跡以制字自頡之後有大篆小篆隷与八分行草之類字躰変易如雲无定書苑云八分書者秦羽人上谷王次仲飾隷書爲之鍾繇謂之章程書王愔曰王次仲始以古書方廣少破勢建中𥘉以隷書作楷法字方八分始皇得次仲文簡略赴急疾之用甚善之蔡姬別傳曰臣父邕言八分書割程邈隷字法去八法李斯小篆去二分取八分故曰八分書蔡希總曰王次仲以楷法局促更引而伸之爲八分故號八分書張懷􅗕云八分本謂之楷書楷者法也漸若八字分散故名八分後漢指帝紀延熹八年春正月遣中常侍左悺之苦縣祠老子注云苦縣厲郷今屬陳囯故城在亳州續漢書云桓帝夢見老子令左悺於頼卿祠之詔陳相邊韶立祠兼刻石即蔡伯喈八分書也又靈帝紀光和五年始置鴻都門生注云於鴻都門内置斈召能爲尺牘及工書鳥篆者時南陽人師冝官稱八分爲最大則一字徑丈小則方寸以是考之疑苦縣蔡邕書光和師宜官書也詳觀此歌嶧山之碑野火焚謂李斯書也苦縣光和尚骨立謂蔡邕書也故初言秦有李斯漢蔡邕次惜哉李蔡不復得卒言丞相中郎丈人行而未甞一言師宜官然苦縣之祠立於桓帝之延熹而光和乃靈帝年號豈非祠立於延熹而碑刻於光和乎蓋延熹全光和纔十年之近尓或謂光和爲伯喈所書華山碑苦縣老子朱龜碑未知孰是親近也言近於李蔡秦相即李斯快劒長㦸森相向解在鄭典設自施州歸行音項輩也草書失之流宕篆則不然送顧八分文學適洪吉州中郎石經後八分蓋憔悴洙曰蔡邕拜中郎將校書東觀邕以經籍去聖乆逺文字多謬俗儒穿鑿疑誤後斈熹平中表求正定六經文字靈帝許之邕乃自書冊于碑使工刻立於太斈門外兩京記云正觀中得蔡邕石經數段邕能八分書顧侯運鑪錘鄭曰錘之瑞切鍛也筆力破餘地洙曰運鑪鍾言能鍜錬以成一家之書夢符曰右按莊子曰无莊之失其美據梁之失其力黃帝之亡其智皆在鑪錘之間耳蘇曰黃刋見蔡邕八分書曰筆力尚可破餘地昔在開元中韓蔡同贔屭鄭曰上平袐切下虚器切洙曰開元中韓擇木蔡有鄰二人善八分事見李潮八分歌注修可曰張平子西京賦綴以二華巨靈贔屭注贔屭作力之貌玄宗妙其書是以數子至御扎早流傳揄揚非造次洙曰明星師韓擇木甞於彩牋上八分書賜張說三人並入直洙曰韓蔡顧三人也恩澤各不二顧於韓蔡内辨眼工小字分日示諸王鉤深法更祕洙曰顧丈斈八分外尤能小字也文學與我遊蕭踈外聲利追隨二十載浩蕩長安醉髙歌卿相宅文翰飛省寺視我楊馬間洙曰視公如楊雄司馬相如白首不相弃驊騮入窮巷蘇曰顔倚訪原憲憲曰驊騮亦肯入窮巷必脫黃金轡趙曰顧君騎驊騮相訪脫黃金轡者言其冨貴也一論朋友難遲莫敢失墜古來事反覆相見橫涕泗嚮者玉珂人鄭曰珂丘何切誰是靑雲器洙曰此事之反覆也言貴者未必賢才盡傷形體洙曰一作骸病渇汙官位洙曰司馬病渇李㝷曰乆汚玉堂之署故舊獨依然危時話顚躓鄭曰音致我甘多病老子負憂丗志胡爲困衣食顔色少稱遂逺作苦辛行順從衆多意舟檝無根蔕蛟鼉好爲祟况兼水賊繁特戒風飊駃崩騰戎馬際往往殺長吏子干東諸矦勤勉防縱恣邦以民爲本魚飢費香餌趙曰言當厚施予以恤民爲本也請哀瘡痍深告訴皇華使使臣精所擇進徳知歷試惻隱誅求情洙曰當勒恤民困也固應賢愚異洙曰不可一槩爲苛急當存賢愚之用心尓烈士惡苟得俊傑思自致趙曰皆以指言顧文斈所以責望之深也贈子猛虎行出郊載酸鼻洙曰陸士衡樂府猛虎行渇不飲盗泉水熱不息惡木隂惡木豈無枝志士多苦心此皆勉其自振立也趙曰又戒之以無苟從也師曰漢蔡邕爲中郎將善八分書書六經文命工刻碑於太斈門外自邕之後八分書彫零故云憔悴張平子西都賦云綴以二華巨霊贔屭注云贔屭作力之兒及書苑云唐明皇好圖畫工八分章草豐茂英特𥘉張說爲麗正殿斈士献詩明皇自於彩牋上八分書讃曰徳重和鼎功逾済川詞林秀發翰苑光鮮所謂御扎流傳者此也辨眼言於字中最號明眼者也神農本草云珂貝類大如鰒皮黃黒而骨白以爲馬餙生南海勒謂之珂晋阮咸字仲容爲始平太守顔延年五君詠曰仲容靑雲器靑雲言器之髙逺也按斉書江淹夢得五色筆由是文章日新後夢有人稱郭璞取之尓後爲詩絶无美句時人謂爲才尽甫謙言已才巳尽况又病渴豈可汚辱官位是以下文有我甘之語駃音山吏反疾皃崩騰即奔騰也軍㒷之際賦斂慘刻動殺長吏以叛魚飢費長餌喻民困當抚以恩也甫意欲顧生告于皇華使閔其瘡痍精擇良吏以爲佐勤恤民隱无徒誅求一槩爲苛急略无賢愚之異尓烈士惡茍得戒顧生无以不義而負得當自致富貴也樂府猛虎行云偈不飲盗泉水熱不息惡木隂欲其自振立之意殿中楊監見示張旭草書圖斯人已云亡草聖祕難得趙曰漢張伯英善草書人謂之草聖及兹煩見示滿月一悽惻蘇曰孫登人事悽凉滿目凄惻悲風生微綃洙曰潘安仁凱風揚微綃萬里起古色師曰言有古人之氣象鏘鏘鳴玉動落落羣松直連山蟠其間溟漲與筆力趙曰言筆力浩汗若溟勃之漲水乞与之也此篇言玉動松直山蟠皆狀其草書耳師曰自鏘鏘鳴玉動至此句皆言草書之狀有練實先書臨池眞盡墨洙曰張伯英善草書凡家之衣帛必先書而後練臨池斈書乆池水尽黒人謂之草聖俊拔爲之主㤗伯曰俊抜言筆力超越人也暮年思轉極未知張王後趙曰張則伯英王則羲之誰並百代則嗚呼東呉精洙曰張乃蘇州人也逸氣感淸識洙曰張旭草書毎大醉叫呼狂走乃下筆自視以爲神趙曰張旭之逸氣感楊監之淸識楊公拂篋笥安石曰謂祕藏也舒卷忘寢食蘇曰李成得王逸少帖舒卷披玩寢食俱忘示兒曰此吾傳家之寳也安石曰忘寢食言愛之也念昔揮毫端不得觀酒徳洙曰張自言始見公主檐夫爭道而得書法意觀公孫大娘舞劒器而得其神俊觀張旭用意不獨在於大醉而已趙曰公嘗曰張旭三盃草聖傳又劉伶善飲而有酒徳頌也寄張十二山人彪三十韻獨卧嵩陽洙曰一作雲客三違潁水春師曰時彪避禄山隱居嵩陽凡三載矣故云三違違別也艱難隨老母慘澹向時人謝氏㝷山屐洙曰宋謝霊運好登山陟嶺必造幽峻嵓障數千重莫不尽登躡常着木屐上山則去前齒下山則去後齒陶公漉酒巾洙曰陶潛在家酒熟取頭上葛巾漉酒畢還復著之羣兇彌宇宙此物在風塵洙曰猶使之過時則必能自致因寇乱故在風塵蘇曰鄭莊未濟時居洛下殷穆歸謂子曰於廣衆井見鄭子風神秀麗如麟鳯處羣類此物豈乆在風塵耶黃曰此物指彪也歷下辭姜𬒳洙曰見醉眠秋共𬒳注趙曰後漢姜肱有兄弟四人居貧作一布𬒳而共之關西得孟鄰洙曰見荒蕪孟母鄰注趙曰孟子之母爲子擇鄰早通交契密晚接道流新静者心多妙先生藝絶倫草書何太古洙曰一云應甚苦詩興不無神洙曰公詩云下筆如有神曹植休前軰洙曰曹植能詩休言爲張所掩趙曰以終言其詩之神張芝更後身洙曰言山人草書若張芝再生趙曰以終言其草書之古數篇吟可老蘇曰黃旟見隂鏗詩歎曰吾得此軸吟詠可老何必多也一字買堪貧將恐曾防寇深潛託所親寧聞倚門夕洙曰薛包事母至孝凡出入必有時未甞違也至期母必倚門望之包必至矣盡力㓗飡晨洙曰束廣微補亡南陔詩馨尓夕膳㓗尓晨飡踈懶爲名誤彦輔曰嵆康書信復踈懶筋駑肉緩驅馳䘮我眞索居猶寂寞洙曰禮離羣索居猶一作尤相遇益愁辛洙曰江淹嵆中散詩鍾鼔或愁辛流轉依邊徼洙曰邊徼邊境也逢迎念席珍洙曰儒行席上之珍以待聘時來故舊少亂後別離頻丗祖脩髙廟洙曰後漢祭祀志光武建武二年正月立髙廟于洛陽四時祫祀髙帝爲太祖一歲豆祀文公賞從臣洙曰僖二十四年晉侯賞從亡者介子推不言禄禄亦弗及推商山猶入楚洙曰見羽翼懷商老注渭水不離秦洙曰離一作知見欲問桃花宿注趙曰源本指言桃源也存想靑龍祕洙曰靑龍道家存想之術騎行白鹿馴洙曰周義眞入龍矯山見羡門子乗白鹿而行耕嵒非谷口魯曰楊子谷口鄭子真耕于嵒石之下結草即河濵洙曰河上公不知姓結草河濵讀老子漢景帝親問道以素書授于帝肘後符應驗洙曰葛稚川有肘後方數卷囊中藥未陳旅懷殊不愜良覿眇無因洙曰謝霊運詩引領兾長覿自古皆悲恨浮生有屈伸程曰言張之勢伸而甫之势屈也張以踈散故伸甫以貶逐故屈也此邦今尚武洙曰今一作全方以武濟於時何處且依仁魯曰語依於仁鼓角凌天籟洙曰莊子汝不聞天籟乎關山信月輪洙曰古今江有月重輪官塲洙曰一作壕羅鎭磧趙曰言官之戰塲也故曰言四鎭皆置官塲收賦歛以供軍也賊火近洮岷洙曰洮岷地名屬隴右孫曰言吐蕃入寇于此蕭瑟論兵地蒼忙鬪將辰大軍多處所餘孽尚紛綸髙興知籠鳥彦輔曰潘岳秋興賦猶池魚籠鳥而有江湖山藪之思斯文起獲麟洙曰起一作豈孔子西狩獲麟師曰張之髙興視甫如籠鳥之局促其文不遇如孔子傷麟出非其時也窮秋正揺落廻首望松筠洙曰松一作湘松筠有歲寒之操丹靑引魯曰贈曹將軍覇將軍魏武之子孫趙曰魏武則曹公操也於今爲庶爲清門洙曰昭傳三十二年三后之姓於今爲庶主所知也英雄割據雖巳矣文彩風流今尚存蘇曰晉羊枯字叔子至蜀愛其山川風物明媚謂御驂者曰楊雄王褒君平相如雖去數百年覧其遺蹤想風流文彩宛然如在疑其典刑不泯範法尚存遂追賦四先生詩趙曰司馬遷恨文彩不表於後丗晉書天下之言風流者推王衍樂廣學書初學衛夫人洙曰晉李夫人名衛善書但恨無過王右軍洙曰王羲之善隷書爲今古之冠論者稱其筆勢以爲飄然若游雲矯若驚龍初羲之爲老嫗書紙扇謂曰但言是王右軍書以求百錢丹青不知老將至冨貴於我如浮雲洙曰語不知老之將至又曰不義而冨且貴於我如浮雲開元之中常引見承恩數上南薫殿鄭曰数色角切又如字凌煙功臣少顔色洙曰唐制畫李靖等二十四人於凌煙閣時正觀中太宗爲序將軍下筆開生面趙曰凌煙畫像顔色巳暗而曹將軍重爲之畫故云開生面用字盖因左氏狄人帰先軫之元而面如生也良相頭上進賢冠洙曰後漢志進賢冠古緇布冠也文儒者之服也猛將腰間大羽箭洙曰太宗嘗自製長弓大羽箭皆倍常制褒公鄂公毛髮動洙曰鄂公尉遲敬徳褒公叚志玄英姿颯爽來酣戰趙曰淮南子曰魯陽公与韓戦戦酣日暮援戈而揮之先帝天馬玉花騘畫公如山貌不同是日牽來赤墀下洙曰劉孝摽辯命論時在赤墀之下逈立閶闔生長風趙曰天門也李善文選注有紫微宫門名曰閶闔言馬之上而生風以其神駿詔謂將軍拂絹素意匠慘澹經營中斯須九重眞龍出一洗萬古凡馬空玉花却在御榻上趙曰玉花先帝之馬也畫手精妙尽得其眞榻上庭前屹相向鄭曰屹魚乞切至尊含笑催賜金圉人太僕皆惆悵弟子韓幹早入室洙曰言得其真蹟也故稱入室晏曰語由也升堂矣未入於室也亦能畫馬窮殊相幹唯畫肉不畫骨蘇曰韓幹善畫馬大梁人右丞王維見其畫遂推獎之官至太府寺丞善冩貌人物尤工鞍馬𥘉師匠曹覇於後則獨善子美与韓幹畫馬子美豈知畫者徒以幹畫馬肥大遂有畫肉之誚忍使驊騮氣凋䘮將軍盡善蓋有神必逢佳士亦寫眞夢符曰右按晉書顧愷之善丹青毎畫人成或數年不點目精人問其故苔曰四躰妍媸本无闕少於妙處傳神寫照正在阿堵中趙曰梁簡文帝詠美人看畫詩云可令俱是畫詩能辨冩真即今漂泊干戈際屢貌㝷常行路人途窮返遭俗眼白洙曰言職者盖寡耳丗上未有如公貧但看古來盛名下洙曰唐房琯賛曰盛名之下爲難名矣終日坎壈纒其身觀薛稷少保書畫壁少保有古風得之陜郊篇洙曰公詩曰駈車越陜郊北顧臨大河師曰周公召公分陜而治自陜以東周公主之自陜以西召公主之稷嘗爲古風詩以美周召是有志於周召而立功名也惜哉功名忤但見書畫傳洙曰稷薛収之從子以詞學知名博雅尤工隷書自貞觀永徽之際虞丗南褚遂良時人宗其書跡自後罕能継者稷外祖魏徴冨國籍多有虞禇舊跡稷銳精模倣筆態遒麗當時無及之者又善畫博採古跡睿宗在藩留意於文學稷於是特見招引除太子少保睿宗甞召稷入宫中叅决庶政恩遇莫與比及竇貞仗誅稷以知其謀賜死於萬年縣獄中矣我遊梓州東遺跡涪江邊鄭曰涪扶塢切水出徼外南入漢畫藏青蓮界洙曰青蓮界佛寺也書人金牓懸洙曰事見天門日射黃金牓注仰看垂露姿不崩亦不騫洙曰漢曹喜工篆隷變懸針垂露之法詩天保不騫不崩騫虧也鬱鬱三大字蛟龍岌相纒鄭曰岌魚及切趙曰稷所書慧普寺碑上三字字方徑三尺許筆畫雄勁然公於李潮八分小篆歌云八分一字直千金蛟龍盤弩肉倔強是言八分及草書之纏糾然後可言有蛟龍之勢也然稷三大字乃眞書其勢豈若蛟龍耶余嘗到慶壽寺觀之三字之傍有贔屭纏捧乃龍虵岌相纒也詩人道實事爲壯觀之句耳又揮西方變發地扶屋椽趙曰其所盡西方變相則亡矣慘淡壁飛動到今色未填此行疊壯觀師曰甫獲觀其故宅與書畫故云疊壯觀郭薛俱才賢不知百載後誰復來通泉洙曰通泉前有郭代公後有薛少保故云郭薛奉先劉少府新畫山水障歌新添堂上不合生楓樹怪底江山起煙霧聞君掃却赤縣云无雲而雨謂之天泣野亭春還雜花逺洙曰丘希範書雜花生樹漁翁瞑踏孤舟立滄浪水深青溟闊欹岸側島秋毫末不見湘妃鼔瑟時至今班竹臨江活趙曰楚以狀所畫之竹言湘妃逺矣夢符曰右按楚詞逺遊章句使湘靈鼓瑟兮令海若舞馮夷張華博物志舜死二妃淚下染竹即班死爲湘水神故曰湘妃今公詩行語乃詩全妙如此劉侯天機精洙曰莊子耆欲深者天機淺愛畫入骨髄十朋曰徐邈吾見王貴畫入骨髄愛恨吾斈不到竒妙處自有兩兒郎揮灑亦莫比大兒聦明到能添老樹巔崖裏小兒心孔開貌得山僧及童子趙曰祢衡曰大兒孔文㪯小兒楊徳祖若耶溪洙曰越溪也雲門寺十朋曰南史何胤字子季隱居不仕㑹稽山多靈異徃游焉居若耶山雲門寺𥘉㣧二兄求點並棲遁至㣧又隱焉丗號點爲小山㣧爲大山亦曰東山兄弟又云大隱小隱吾獨胡爲在泥滓青鞋布襪從此始蘇曰謝玄暉曰胡爲翰墨埸屋中出没㑹稽山水竒秀布襪青鞋鶡冠竹杖吾志從此始矣戲題王宰畫山水圖歌彦輔曰王宰畫宰丹青絶倫十日畫一水五日畫一石能事不受相促迫王宰始肯留眞跡壯哉崑崙方壷圖洙曰壷一作丈列子湯問夏革曰渤海之東不知幾億萬里有大壑焉實惟無㡳之谷其下底名曰歸墟八宏九野之水天漢之流莫不注之而無减焉注丗傳大海與天海通其中有五山一曰岱嶼二曰圎嶠三曰方壷四曰瀛洲五曰蓬萊又周穆王宿于崑崙之阿汾水之陽山海經云崑崙山有五色水也挂君髙堂之素壁巴陵洞庭日本東洙曰巴陵岳陽也洞庭在其左海東有日本國赤岸水與銀河通魯曰赤岸地名本中曰南兖州記曰瓜歩山東五里江有赤岸山南臨江中羅君章云赤岸若朝霞即此也濤水自海入江衝激六百里至此岸側其勢始衰郭景純江賦云鼓洪濤於赤岸趙曰先言崑崙方丈持在仙山形容之下言洞庭赤岸水則又壯其水之闊逺也巴陵郡岳州也洞庭在焉赤岸在真州中有雲氣隨飛龍洙曰莊子姑射山有神人乗雲氣御飛龍而遊乎四海之外江賦鼓波濤於赤岸舟人漁子入浦溆鄭曰象吕切山水盡亞洪濤風洙曰亞一作帶江賦舟子渉人又蘆人漁子海賦舟人漁子徂南極東七發陵赤岸篲扶桑尤工逺勢古莫比咫尺應須論洙曰一作千萬里夢符曰右按南史景陵王子良傳賁字文煥能書善畫於扇上圖山水咫尺之内便同萬里爲遥矜愼不傳自娯而巳焉得并州快剪刀蘇曰索靖見顧愷之畫欣然曰恨不帶并州快剪刀來欲剪松江半幅紋練歸去古詩曰借君快剪刀輕綃剪波去剪取呉松半江水趙曰呉松言呉地之松江也㤗伯曰甫託意言水王璘反漢中呉松江爲之阻絶不通時李光弼守并州所攻必下喻以快剪刀言其断也意欲得光弼之將平漢中以通呉松故云云觀李固請司馬弟山水圖三首洙曰一云李七簡易髙人意洙曰一作體敏功曰易以䜴切平易也揚子以簡以易匡牀竹火爐蘇曰張扶隱居太白山茅庵石鼎匡床竹火爐藥壷而巳甞有白猿隨行漢武累徴不起使繪像進呈帝再三加賞後尸解趙曰莊子騎姬與晉公同匡牀而食寒天留逺客碧海掛新圖雖對連山好貪看絶島孤羣仙不愁思冉冉下蓬壷洙曰蓬壷山名神仙所宅之地方丈渾連水天台惣映雲洙曰方丈天台二仙山人間長見畫老去恨空聞范蠡舟偏小洙曰范蠡爲越破呉功成名遂乃乗扁舟浮江湖變姓名適齊爲鴟夷子王喬鶴不羣趙曰其圖必畫舟與鶴故以范蠡王喬比之王喬鶴事見昔遊詩注此生隨萬物何處出塵氛洙曰莊子所謂與物轉徙也髙浪垂翻屋洙曰郭景純詩髙浪駕蓬萊崩崖欲壓床野橋洙曰一作樓分子細沙岸繞微茫紅浸珊瑚短青懸薜荔長浮查並坐得仙老暫相將嚴公㕔宴同詠蜀道畫圖得空字日臨公館静畫列地圖雄劒閣星橋北洙曰華陽記李冰造七星橋上應七星松州雪嶺東洙曰西山有松州當吐蕃要衝也趙曰雪嶺西山也在今威州之外冬夏常雪華夷山不斷呉蜀水相通趙曰錦江之直下通雨浙也興與煙霞㑹清樽幸不空洙曰孔融傳座上客常满樽中酒不空奉觀嚴鄭公㕔事岷山沲江畫圖十韻得忘字沲水臨中座鄭曰沲唐水切寰宇記在成都府新繁縣岷山到北堂洙曰到一作對江賦惟岷之導江水所出也書沱潜旣導今蜀縣花丘及漢中沔陽皆有沱水趙曰此篇句句皆尽義甚分明白波吹粉壁青嶂揷雕梁洙曰謝靈運詩連嶂鼻崿青華香深沉直訝杉松冷兼疑菱荇香雪雲虚點綴沙草得微茫嶺鴈随毫末川蜺飲練光趙曰亦只是畫作清川之景自有蜺飲練光之態不必畫蜺也霏紅洲蘂亂拂黛石蘿長暗谷非關雨丹楓不爲霜洙曰曉霜楓葉丹趙曰暗谷處非眞是雨而暗丹楓葉不爲眞是遭霜而丹皆以言畫也秋成玄圃外洙曰成一作城崑崙山有玄圃蒼舒曰右按楚詞曰朝發軔於蒼梧兮夕余至乎玄圃注玄圃神山也淮南子曰崑崙玄圃惟絶通天鄭曰崑崙山去地萬一千里上有層城九重或上侣之是謂闐風又倍之爲懸圃景物洞庭傍洙曰洞庭湖名趙曰皆以形容其畫乃其景也繪事功殊絶幽襟興激昻從來謝太傅丘壑道難忘洙曰太傅謝安也安雖貴而東山之志不忘夢符曰右按晉書明帝問謝鯤曰論者以君方庾亮何如荅曰端委廟堂使百僚凖則鯤不如亮一丘一壑自謂過之師曰薛夢符續注云云頋長康畫鯤在石嵓裏人問其故頋曰謝玄一丘一壑自謂過之此子冝置丘壑中又謝安寓居㑹稽與義之攴遁遊出則漁山水毎往臨安山中坐石室放情丘壑及薨贈太傅以此考之謝太傅乃安也非謝鯤故子美别房太尉墓詩又有對碁陪謝傅之句當從内翰注爲正題李尊師松樹障子歌老夫清晨梳白頭玄都道士來相訪握髪呼兒延入戸彦輔曰周公一沐三握髪手提新畫青松障障子松林靜杳冥慿軒忽若無丹青隂崖却承霜雪幹洙曰雪一作露馬季長長笛賦生於終南之隂崖南都賦幽谷岑夏含霜雪偃蓋反走虬龍形老夫平生好竒古對此興與精靈聚巳知仙客意相親更覺良工心獨苦蘇曰管子曰事無終始無多事業此言學者貴能成就也唐人爲詩皆量巳力以致功常積情思數十年然後各自名家今人不然未有小得於巳髙視前人自以爲無敵然知音之難万事悉然杜工部云更覺良工心獨苦用意之妙舉丗莫知者此所以爲獨苦歟又曰故人董傳善論詩余甞云子美詩不免有凡語巳知仙客意相親更覺良工心獨苦此豈非凡語耶傳笑曰此句殆爲君發凡人用意深處人罕能識此所以獨苦豈難畫哉馬曰徐貌畫魚人多模學薖曰韓宏曰良工用心何苦刻如斯松下丈人巾屨同偶坐似是商山翁洙曰似一作自一云南山四皓隱於商山避秦室之乱悵望聊歌紫芝曲洙曰悵望一云惆悵四皓歌曰燁燁紫芝可以療飢時危慘淡來悲風師曰玄都壇名道士受録皆於此壇障子松林静杳冥言畫松无声也已知仙客意相親言有歲寒之操也昔四皓遭秦乱隱于商山歌紫芝甫傷時盗賊擾攘悵望四皓而想其髙躅故云時危慘淡來悲風戲韋偃爲雙松圖歌鮑曰韋偃見畫馬歌注天下幾人畫古松畢宏巳老韋偃少洙曰松一作樹畢宏亦畫工也鄭曰宏大曆二年爲給事中少失照切絶筆長風起纎末洙曰長笛賦其應淸風也纎末奮籍滿堂動色嗟神妙蘇曰蕭紼春宴時金甌七發七中滿堂賔客動容嗟服神妙趙曰滿堂字如滿堂爲之不樂秦曰左傳使者色動而言肆兩株慘裂苔蘚皮屈鐡交錯廻髙枝白摧朽骨龍虎死黒入太隂雷雨垂松根胡僧憇寂寞尨眉皓首無住著偏袒右肩露雙脚鄭曰袒徒旱切洙曰金剛經偏袒右肩右膝著地修可曰楞巖經云名無住行名無着行公取而合用之也葉裏松子僧前落韋矦韋矦數相見我有一匹好東洙曰一作素絹重之不減錦繡叚洙曰四愁詩美人贈我錦繡叚巳令拂拭光凌亂洙曰謝惠連淸波時凌亂請公放筆爲直幹師曰畢宏韋偃皆唐之善畫者也白摧朽骨龍虎死謂松枝也黒入太隂雷雨垂謂暗碧之色也偏袒右肩露雙脚言胡僧之狀也東絹謂山東大練也通泉縣署屋壁後薛少保畫鶴薛公十一鶴皆冩青田眞洙曰晉永嘉記青田有雙鶴生子即便去孫曰地理志處州青田縣在州東南一百五十里有雙鶴生子即便化去人以爲異畫色乆欲盡蒼然猶出塵修可曰此史劉歊矯矯出塵如雲中白鶴低昻各有意洙曰薛公畫鶴低昻皆有意如返啄踈翎唳天警露之類皆隨而名之磊落如長人洙曰晉書嵇紹在稠人中昻然若野鶴在雞羣佳此志氣逺豈唯粉墨新師曰鶴磊落比之賢人無塵俗氣象甫竒其有逺志豈特悅其粉墨之新䴡哉萬里不以力羣遊森㑹神威遲白鳯態洙曰揚雄作甘泉賦夢吐白鳯秋胡詩行路正威遲非是倉鶊隣洙曰七月有鳴倉庚注倉庚黃鸝也髙堂未傾覆幸得慰佳賔曝露牆壁外終嗟風雨頻赤霄有眞骨恥飲洿池津洙曰拾遺記鶴飲洛溪之水鶴賦多飲于瑶他師曰甫託意譏賢者羞食汚君之禄時不用賢之咎也冥冥任所往脫略誰能馴洙曰有遺支遁鶴者遁曰尓冲天之物寕爲耳目之玩逐放之任所往姜楚公畫角鷹歌楚公畫鷹鷹戴角殺氣森森洙曰一云如到幽朔觀者貪愁掣臂飛趙曰如在幽朔見此鷹之殺氣蓋名鷹出於此地也故公又云代北有豪鷹畫師不是無心學此鷹寫眞在左綿却嗟眞骨遂虚傳梁間鷰雀休驚怕亦未搏空上九天洙曰言有其質無其才也師曰書曰宅朔方曰幽都幽隂也朔北也幽朔肅殺之方此鷹殺氣窮極幽朔掣臂謂掣臂韝而欲飛物有異質而世所未嘗覩者人見之必駭而不信馬有肉駿非東坡誰辨之鷹有角非杜甫誰詠之丗人寕不謂虚傳乎畫師不是無心學盖恐人未之信也末章譏朝廷之士稱才角出者率有虚名而無實効楊監又出畫鷹十二扇近時馮紹正能畫鷙鳥様明公出此圖無乃傳其狀殊姿各獨立清絶心有向疾禁千里馬鄭曰禁居吟切氣敵萬人將洙曰狀其快疾勇快也夢符曰右按前漢文帝有獻千里馬者三國志評曰關羽張飛萬人之敵也憶昔驪山宫冬移含元仗天寒大羽獵此物神俱王洙曰玄宗盛時常以冬十月幸温泉宫時肆獵趙曰莊子曰澤雉一歩一啄百歩一飲神雖王不善也當時無凡材百中皆用壯洙曰時寕主有髙麗赤鷹尤俊異帝獵則置之駕前號决雲兒粉墨形似間識者一惆悵干戈少暇日眞骨老崖嶂爲君除狡兎㑹是翻韝上畫鷹素練風洙曰一作如霜起張孝祥曰言鷹之威猛如風霜也蒼鷹畫作殊􅑷身思狡兎鄭曰欆荀勇切洙曰􅑷身猶竦身也孫楚鷹賦擒校兎於平原史記狡兎死獵犬烹側目似愁胡洙曰隋魏彦深鷹賦立如植木望似愁胡王琪曰鷹産於岱北出於胡地愁胡謂思胡地也絛鏇光堪擿洙曰絛鏇所以攀鷹也趙曰所畫絆鷹之絛鏇也光而堪擿取焉鄭曰絛他力切鏇徐釧切圎轆轤也軒楹勢可呼黃庭堅曰可呼以獵也何當擊凡鳥毛血洒平蕪畫鶻行洙曰一作畫鵰髙堂見生洙曰一作老鶻颯爽動秋骨𥘉驚無拘攣洙曰曹褒傳羣寮拘攣猶拘束也潘安西征賦陋吾人之拘攣何得立突兀乃知畫師妙巧刮造化窟冩此神俊姿洙曰支道林云怜其神俊趙曰李賀云二十八宿羅心􅎍筆端造化天無功蓋出於此充君眼中物烏鵲滿樛枝洙曰詩南有樛木釋文云木下曲曰樛樛下垂也趙曰謝玄暉詩樛枝聳復低軒然恐其出側腦看靑霄寧爲衆禽没長翮如刀劒人寰可超越唐曰舞鶴賦歸人寰之喧卑乾坤空崢嶸洙曰鮑明逺歲崢嶸而催暮又金石崢嶸深髙之貌也粉墨且蕭瑟緬思洙曰一作想雲沙際自有煙霧質吾今意何傷顧歩獨紆鬱洙曰舞鶴賦煙交霧凝若無毛質陸士衡紆鬱游子情趙曰劉希夷邊城夢還詩雲沙撲地起煙霧質所以言其真質也摘用鮑明逺舞鶴賦煙交霧凝若無毛質也韋諷録事宅觀曹將軍畫馬圖引國初巳來畫鞍馬趙曰鮑昭詩鞍馬光照地神妙獨數江都王鄭曰名畫記江都王緒霍王元軌之子將軍得名三十載人間又見眞乗黃洙曰乗黃見瘦馬行注黃曰詩大叔于田乗乗黃趙曰江都王宗室也將軍即曹將軍覇也明皇雜録云陳義曹覇等善繪畫時稱神妙乗黃神馬也曾貌先帝照夜白鄭曰貌莫角切皃人類狀下屢皃同洙曰明皇馬名别傳云上乗照夜白龍池十日飛霹靂蒼舒曰右按唐㑹要明皇在藩邸宅居興慶里宅有龍池湧出日以浸廣至開元中爲興慶宫趙曰以狀所畫神妙而照夜白者乃真龍耳盖真龍在圖感動龍池中龍如此内府殷紅馬䐉盤鄭曰殷烏閑切婕妤傳詔才人索洙曰唐制以婕妤才人代世婦鄭曰上即葉下女諸切婦官也盌賜將軍拜舞歸鄭曰盌烏管切或作椀輕紈細綺相追飛趙曰盌別本作盤盖專賜瑪瑙盤故拜舞婦其從者輕紈細綺也呉越春秋羣臣拜舞天顔舒貴戚權門得筆跡始覺屏障生光輝昔日太宗拳毛騧鄭曰古華切太宗所乗九駿名皆平盜時所乗拳毛騧乃平劉闥時所乗近時郭家師子花洙曰吐蕃潰郭子儀収復京師代宗以九花虬賜之一名師子聮今之新圖有二馬復令識者乆歎嗟此皆騎戰一敵萬縞素漠漠開風沙師曰雖畫縞素之上而有開拓沙磧之態其餘七匹亦殊絶逈若寒空動煙雪霜蹄蹴踏長楸間鄭曰楸此由切洙曰曹子建名都篇走馬長楸間新一作畫定功曰莊子有馬蹄可以踐霜雪維摩經龍象蹴踏非驢所堪馬宫厮養森成列鄭曰厮息移切可憐九馬爭神駿洙曰漢武帝有九逸支遁曰憐其神駿耳顧視清髙氣深穩借問苦心愛者誰鄭曰借資昔切後有韋諷前支遁洙曰支遁字道林憶昔廵幸新豐宫洙曰新豐宫驪山也趙曰神駿字支遁養馬曰余憐其神駿耳以支遁養馬韋諷藏畫馬皆苦心之所愛矣翠華拂天來向東洙曰南都賦望翠華之葳㽔東都賦旌旗拂天騰驤磊落三萬匹皆與此圖筋骨同洙曰明皇幸驪山王毛仲以廐馬數萬從毎色爲一隊相間若錦繡自從獻寳朝河宗趙曰穆天子傳天子西征至陽紆之山河伯無夷都是爲河宗觀舂山之寳所謂朝河宗者河宗朝而獻寳也無復射蛟江水中洙曰元封五年漢武自㝷陽浮江親射蛟江中獲之君不見金粟堆前松栢裏龍媒去盡鳥呼風洙曰漢武歌曰天馬騋龍媒金粟堆在玄宗㤗陵南趙曰唐舊紀云玄宗至睿宗橋陵見金票岡有龍盤鳯翥之勢謂侍臣曰吾千秋萬歳後冝葬此曁升遐羣臣遵先旨葬焉師曰自禄山反馬政荒廢天子猶不偏車騎良馬戰没殆盡甫傷之故云天育驃騎歌洙曰天育馬廐名驃匹妙切趙曰名驃則所畫馬名吾聞天子之馬走千里洙曰荀子曰騏驥一日千里穆天子傳曰天子之八駿赤驥盗驪白義踰輪山子渠黃驊騮騄耳漢文帝却千里馬神異經曰西南大宛宛丘有良馬其大二丈鬛至膝尾委於地蹄如汗腕可握日行千里至日中而汗血今之畫圖無乃是洙曰莊子曰齊景好馬命使善畫者圖之訪似者朞年不得今人君考古籍以求賢亦不可得也趙曰出荀勗所上穆天子傳中云天子之馬走千里蓋所謂八駿是也今張景順畫圖無乃是穆天子之馬乎是何意態雄且傑駿尾蕭梢朔風起洙曰選朔風動秋草邊馬有歸心蘇曰漢天馬曲曰尾䔥梢弓朔風起足銀砧兮破層冰雖用古人語而琢句法混然天成不假翰墨𡵨逕若非織綃大手不能到此趙曰神異經西南大宛丘有良馬鬛至膝尾委於地則駮尾之長者蕭梢然矣馬尾之長䔥梢揺動可起朔風朔風則最撡烈者師道曰䔥梢者摇尾之皃朔風起即北風取其寒馬之良者不怕寒嘶風踏雪愈有精神毛爲緑縹鄭曰普沼反靑黃色也兩耳黃琪曰史驥垂两耳眼有紫熖雙瞳方洙曰秦本紀周穆王得騄耳之駟相馬經曰馬眼欲紫艶光口中欲赤色顔延年賦雙瞳夾鏡两權協月矯矯洙曰一云矯然龍性彦輔曰一云矯龍性逸合變化洙曰崧髙詩四牡矯矯顔延年賦龍性誰能馴卓立天骨森開張洙曰周官曰凡馬八尺以上爲龍魯國黄伯仁龍馬頌曰禀神祗之純化乃大宛而載育修可曰蔡邕作庾侯碑曰英風發於天骨袁彦伯三國名臣賛曰天骨踈㓪言人而公借用耳師曰馬有龍性負天骨合能變化殆非常馬之比開張壯大之皃甫自喻於良馬謂己之才非凡俗軰可擬伊昔太僕張景順監牧攻駒閱淸峻洙曰一云考牧神駒一云老牧神駒周穆王置太僕正以伯冏爲之掌輿馬唐龍朔二年改太僕爲司馭咸亨𥘉復舊光宅年改爲司僕神龍𥘉復舊天下監牧置八使五十六監唐兵志監牧所以蕃馬也其制起於近世唐之𥘉起得突厥馬二千疋又得陏馬三千於赤岸澤徙之隴西監牧之制始於此其官領以太僕𥘉用太僕少卿張萬歲字景順領羣牧自貞觀至麟徳四十年間馬七十萬六千置八坊岐幽涇寧間地廣千里厩牧令諸牧牧馬四歲遊牝五歲責課一百匹毎年課駒六十其二十歲以上不在課限趙曰唐兵志監牧之制其官領以太僕今公詩所謂太僕張景順乃開元時人舊注便安排作張萬歲自是貞觀時人誤學者矣今按張說作開元十三年隴右監牧頌徳碑其序云元年牧馬二十四萬匹十三年乃四十三萬匹上顧謂太僕少卿兼秦州都督監牧都副使張景順曰吾馬幾何其蕃育卿之力也對曰帝之力也仲之令也臣何力之有焉其頌曰有霍公之掌政擇張氏之舊令所謂霍公即王毛仲也遂令大奴守天育蘇曰舊本作大奴守天育子瞻題子美天育驃驥圖後作大奴字天育盖天育爲大奴字也今定猶有石本趙曰大奴王毛仲也毛仲父髙麗人坐事没爲官奴守天育則唐兵志云毛仲領内外廐所謂天育乃廐名也别養驥子憐神俊洙曰宋顔延年天馬狀曰降靈驥子九方是選梁元帝荅齊國驤馬書曰價匹龍媒聲齊驥子周王褒謝賚馬啓曰漢時伯樂偏愛權竒晉世桑門時求神俊世說支遁常養數匹馬而世或言道人亦畜馬支遁曰貧道重其神俊耳當時四十萬匹馬張公歎其材盡下洙曰通典貞觀𥘉僅有牡牝三千匹從赤岸澤徙之隴右十五年始令太僕卿勾當羣牧至麟德四十年間馬至七十萬六千匹置八使領九監跨蘭渭秦原四州之地猶爲隘狹更拆八監布於河西其時天下以一縑易一馬儀鳯三年少卿李思文檢校隴右諸牧監方稱使爾後或戎狄外侵牧圉乖散泊乎垂拱潜耗太半開元𥘉收馬二十四萬匹十三年加至四十五萬匹莊子云臣之子皆不才也魯曰張公即景順也修可曰趙充國云林下犬馬齒衰此在人言之而在馬亦可用矣故獨寫眞傳世人見之座右乆更新年多物化空形影嗚呼徤歩無由騁如今豈無騕褭與驊騮鄭曰騕於皎褭奴了切時無王良伯樂死即休洙曰魯國黃伯仁爲龍馬頌曰踰騕褭之躰勢逸飛莬之髙蹤兼驥騄之美質逮驊騮之足雙秦本紀造父以善御幸於周穆王得驥温􅌐驊騮騄耳之駟西巡狩樂而忘歸郭璞曰色如華而赤今名馬驃赤者爲棗騮騮馬赤也徐廣曰赤馬黒毛曰騮戦國策曰汗明見春申君曰夫驥之齒長服鹽車而上太行漉汗洒地白汗交流中坎遷延負轅不能上伯樂遭之下車攀而哭之解綾衣以募之騮於是免而賁仰見伯樂之知巳也漢書音義騕褭者神馬也赤喙黒身與飛莬同以明君有徳則至也又出瑞應圗薦祢衡表云飛莬騕褭絶足奔放良樂之所急也歐陽曰王良善御伯樂善相馬孟子斉景公使嬖奚與王良乗返命曰天下之良工也史伯樂名孫陽嘗過虞阪見駕鹽車馬曰此良馬也取而試之果然又有鬻馬者三日不售伯樂去而眎之回而睍之明日其價三倍趙曰韓退之有言曰世有伯樂然後有千里馬千里馬常有而伯樂不常有此乃豈無騕褭驊騮而時無伯樂之謂公因題畫巳死之驃故起末句死即休之意亦猶人抱出羣之材而不遇知巳以死爲可嗟矣師曰粛宗中興正冝任賢使能房琯以宰相器出爲邠州刺史甫以貶爲華州司功何世無才何才不可用但恨無賢君耳琯之與甫何以異是故云云題壁上韋偃畫馬歌鮑曰朱景玄畫斷云韋偃伯父工龍馬父銮工山水松石偃又工仙僧老松異石人知其善畫馬不知其松石更工韋侯别我有所適鄭曰韋侯韋偃也知我憐君洙曰一作渠畫無敵戯拈彦輔曰一云試拈秃筆掃驊騮歘見騏驎岀東壁洙曰顔延年白馬賦歘聲躍以鴗驚驊騮良馬也騏驎瑞獸也時可曰於天育驃騎歌中􅴈周穆王傳驊騮騄耳日馳三萬里一匹齕草一匹嘶鄭曰齕下没切坐看千里當霜蹄鄭曰當丁浪切時危安得眞致此與人同生亦同死洙曰莊子馬蹄可以踐霜雪齕草飲水吕布甞御良馬號曰赤兎能馳城飛塹馳突燕軍一日或至三四斬首而出趙曰莊子而摘用之也末句乃所向無空闊眞堪託死生之意師曰韋偃唐之善畫者也取別於甫甫試令於壁上作馬末章寓意遭時艱危安得此真馬以濟患難免使甫困躓道路故云與人同生亦同死音樂古詩三首律詩五首觀公孫大娘弟子舞劒器行并序大曆二年十月十九日夔府别駕元持宅見臨潁李十二娘舞劒器壯其蔚跋問其所師曰余公孫大娘弟子也開元三載余尚童稚記於郾城觀公孫氏舞劒器渾脫瀏灕鄭曰上力周切下力支切頓挫獨出冠時自髙頭冝春梨園二伎坊內人洎外供奉曉是舞者聖文神武皇帝𥘉公孫一人而巳玉貌錦衣况余白首今兹弟子亦匪盛顔旣辯其由來知波瀾莫二撫事慷慨聊爲劒器行徃者呉人張旭善草書書帖數嘗於鄴縣見公孫大娘舞西河劒器自此草書長進豪蕩感激即公孫可知矣行曰昔有佳人公孫氏一舞劒器動四方觀者如山色沮䘮天地爲之乆低昂敏功曰言不自安也㸌如羿射九日落鄭曰㸌音酷洙曰堯時十日並出堯令羿射中九日日烏皆死墮其羽翼矯如羣帝驂龍翔來如雷霆収震怒罷如江海凝清光洙曰皆言舞劒器回旋疾徐變態也趙曰選詩秋月懸清光絳脣珠䄂兩寂寞洙曰蕪城賦玉貌絳脣蘇曰杜遵過銅雀臺序云𬗟懷朱唇翠䄂絲竹絃索今俱寂寞唯有崇山逺水依舊敏功曰謂公孫已死也晚洙曰又云脫有弟子傳芬芳饒曰李十二娘傳其術臨潁美人在白帝洙曰李十二娘也饒曰白帝即夔州魚復縣用於此見之妙舞此曲神揚揚與余問荅旣有以感時撫事増惋傷先帝侍女八千人晁曰先帝指元宗也公孫劒器𥘉第一五十年閒似反掌風塵澒洞昏王室趙曰指言禄山之乱也梨園弟子散如煙夢符曰右按唐書志元宗旣知音律又酷愛去曲選坐部女子弟三百教於梨園號皇帝梨園子弟宫女数百亦爲梨園弟子居冝春北院女樂餘姿映寒日洙曰禄山之乱梨園弟子及雜伎皆流散也趙曰指言李十二娘也十月十二日見之此所謂映寒日金粟堆南木巳拱洙曰見金粟堆南松栢裏注左傳墓木拱矣江淹恨賦拱木斂䰟趙曰金粟堆在明皇㤗陵之北今詩懷想之也瞿塘石城草蕭瑟玳筵急管曲復終夢符曰古按右樂府今日楽相樂行綺殿文雅遒玳筵歡趣密又曰歌朱唇動愛神㪯浴陽少童邯郸女古稱渌水今白紵催絃急管爲君舞樂極哀來月東出老夫不知其所徃足繭荒山轉愁疾洙曰足重繭也言奔走流落而足重繭尓趙曰公自言去留未定今徒足繭荒山足耳胝如繭也所謂重旣累蠒是也聽楊氏歌佳人絶代歌獨立發皓齒洙曰前漢外戚傳李延年侍上起舞歌曰北方有佳人絶代而獨立以其顔色特異當代無匹也夢符曰右按楚詞朱唇皓齒嫭以姱些北徳好間習以都些豊肉微骨以娯些䰟乎歸徠安以舒些姱目冝笑娥眉曼些容則秀雅穉朱顔些魂以歸徠静以安些又古樂府雜曲從來著名推趙子復有丹唇發皓齒一嬌一態本難逢如畫如花定相似定功曰阮籍詠懷詩南囯有佳人榮萆君桃李朝遊江北岸夕宿瀟湘沚時俗薄朱顔誰爲發皓齒滿堂慘不樂洙曰前漢刑法志古人有言曰滿堂飲酒有一人向隅而悲泣則一堂皆爲之不樂故一人不得其平爲之悽愴於心響下青虚裏洙曰一作浮雲裏江城帶素月洙曰謝希逺月賦素月流大况乃清夜起洙曰曹子建中夜起長歎老夫悲暮年壯士淚如水洙曰丗說王敦毎酒後輙詠魏武帝樂府曰老驥伏櫪志在千里烈士暮王壯心不巳以如意打玉唾壷唾壷尽荆軻歌於易水之上士皆涙垂也玉盃乆寂寞洙曰山海經曰犬戎國有一女子方跪進玉盃食韓子曰紂爲象箸而箕子怖以爲象箸必不加於上鉶必將犀玉之杯象箸玉杯必不羮菽藿則必薦豹胎金管迷宫徴洙曰丗之議樂者以絲不如竹竹不如肉言肉聲勝於絲竹則金石固當有間矣孟嘉語也趙曰以玉盃之寂寞言不敢爲聲以金管迷宫徴言其聲之不逮於歌皆以形容歌聲之妙也勿云聽者疲愚智心盡死洙曰韓娥過宋人辱之娥曼聲而哭長㓜皆泣下宋人謝之娥乃曼聲而歌老㓜皆喜躍言聲感人心也如此古來傑出士豈待一知巳洙曰孟子曰豪傑之士雖無文王猶興吾聞昔秦青傾側天下耳洙曰一云傾倒修可曰列子曰背薛譚學謳於秦青未窮青之技自謂盡之遂辝歸青弗止餞於郊衢撫節悲歌声振林木響遏行雲譚乃謝求返終身不敢言歸趙曰傾天下之耳則非待一知已而已夜聞􅓋篥鄭曰上必吉切下力質切夜聞􅓋篥滄江上衰年側耳情所嚮鄰舟一聽多感傷塞曲三更歘悲壯趙曰胡笳有出塞曲入塞曲也積雪飛霜此夜寒孤燈急管復風湍君知天地洙曰一作下干戈滿不見江湖洙曰一作湘行路難師曰樂部曰􅓋篥者笳管也卷蘆爲頭截竹爲管出於胡地制法角音九孔漏聲五音咸備唐編入鹵部名爲笳管通典曰􅓋篥本名悲慓出於胡中其聲悲東夷有卷桃皮爲之者亦出南蠻雜録云􅓋篥者龜兹國樂風湍謂風雜湍水之聲行路難白居易之所作也吹笛吹笛秋山風月淸誰家巧作斷腸聲洙曰鮑明逺離聲斷客情又行子心膓斷蘇曰阮晟聞笛曰客中月夜聞此聲韻使人腸斷風飄律吕相和切洙曰馬融笛賦律吕旣和哀聲互降月傍關山幾處明洙曰向秀月夜聞笛遂作懷舊賦趙曰吹笛於月明之中詩人自道到此舊所引非胡騎中宵堪北走洙曰言笛聲怨切能動郷思胡人聞之當北走矣夢符曰右按晉劉疇甞避亂塢壁賈胡百数欲害之疇無懼色援笳吹之爲出塞入塞之聲以動其遊客之思羣胡皆垂淚而去笳羗笛也可曰晉劉琨爲并州刺史常爲胡騎所圓琨乗月登樓清嘯賊間之長嘆中夜吹胡笳則又有流涕嘘欷有懷土之意遂弃圍而去薛注誤云賈胡爲胡騎非也趙曰此指言史朝義借用胡笳事笳羗笛也武陵一曲想南征洙曰王徽之聞桓伊善笛一日相逢於江次未甞相識謂伊曰聞君善笛請爲我一弄伊巳貴顯素聞徽之名便爲據胡床三弄而去賔主竟不言伊爲南征將軍故園楊柳今揺洙曰一作摧落何得愁中却盡生洙曰拆楊柳落梅花皆曲名蘇曰桓伊善笛撰折楊栁尤盡巧妙後人不能盡其指訣趙曰一本曲盡生無義縁笛有折楊栁之曲故思感也秋笛淸商欲盡奏奏苦血沾衣洙曰五音中惟商爲最悲盖商主秋而有寥落之意趙曰五音惟商最悲今欲盡奏以全其曲則聞者必揮涕而繼之以血也他日傷心極征人白骨歸趙曰它日士有死於戰而以白骨歸時聞此聲尤傷心矣相逢恐恨過故作發聲微趙曰恐聞此而恨極故發聲微細矣不見秋雲動悲風稍稍飛洙曰言笛声哀切風雲亦爲之悽慘趙曰盖言不獨人愁而巳雖天亦爲之愁故雲動而風悲也即事百寳裝腰帶夢符曰右按北史逹奚武生貪爲大司寇取萬釘寳帶以歸因以賜之趙曰此篇贈舞者故云舊注所引非眞珠絡臂鞲鄭曰古侯切洙曰馬后傳蒼頡衣緑鞲注鞲臂衣也以縛左右手於事便也錦纏頭以賞歌舞者開元間富人王元寳常㑹賔客元寳富於財而無文采日親友問曰昨日髙㑹有何佳談元寳視屋良乆曰但費錦纏頭爾笑時花近眼舞罷錦纏頭贈花卿錦城絲管日紛紛半入江風半入雲此曲秪應天上有夢符曰右按白樂天詩注霓裳曲開元老西凉府節度使楊敬述造鄭愚津陽門詩注云葉法善嘗引上入月宫聞仙樂及歸但記其半遂於笛中冩之㑹楊敬述進婆羅門曲與其聲調相符遂以月中所聞爲散序以歌述所進爲腔宣室志元宗夢仙子十輩御卿雲而下列於庭各執樂器而奏之其度曲淸越殆非人世也及樂關有一仙子前曰陛下知此樂乎此䄂仙紫雲之曲也人閒能得幾回聞江南逢李龜年岐王宅裏㝷常見崔九堂前幾度聞洙曰公自注云即殿中監崔滌中書令是之弟正是江南好風景落花時節又逢君洙曰明皇雜録云天寳中上命宫中女子數百人爲梨園弟子皆居冝春北院上素曉音律時有馬仙期李龜年賀懷智皆洞知律度安禄山自范陽入覲亦獻白玉簫管數百事皆陳於梨園自是音響殆不類人間有龜年特承顧遇於東都大起第宅僣侈之制逾於公侯後流廢江南毎遇良辰勝景常爲人歌数關座上聞之莫不掩泣罷酒器用右詩四首律詩三首石硯詩平侍御者平公今詩伯天覺曰伯長也秀發吾所羡奉使三峽中孫曰瞿塘明月巫峽也長嘯得石硯師曰晉謝琨長嘯却胡騎時峽中亂平侍御持節出使靖其亂長嘯雍容不勞智力巨璞禹鑿餘洙曰禹開鑿以䟽江河趙曰此使鑿字正言石也郭景純賦云巴東之峽夏禹䟽是也異狀君獨見其滑乃波濤其光或雷電聮拗各盡墨洙曰拗硯穴也聮拗謂雙穴相並各盡墨謂盡墨力所謂發墨是也多水遞隱見薖曰謂温潤出水也揮洒容數人十手可對面比公頭上冠正質未爲賤趙曰平公爲侍御故云頭上冠者獬冠也獬豸一角獸而能觸邪此所以爲正質當公賦佳句况得終清宴洙曰曹子建公子愛敬客終宴不知疲公含起草姿洙曰起草掌綸紼也不逺明光殿致于丹青地知汝随顧眄洙曰明光殿霍去病借以避暑修可曰漢殿名之秦記曰明光殿以金爲戺玉爲階元傳曰成都侯商嘗病欲避暑從上借明光宫是巳荆南兵馬使太常卿趙公大食刀謌太常樓船聲嗷嘈洙曰漢武鑿昆明池始製樓船上建樓櫓戈矛四角垂幡髦旌葆麾蓋官有樓船將軍問兵刮冦超下牢洙曰下牢楚地牧出令奔飛百艘夢符曰牧州牧也令縣令也牧出令奔同赴軍事也艘船也劉備遣關羽乗船數百艘皆㑹於江陵艘蘇曹切猛蛟突獸紛騰逃白帝寒城駐錦𫀆洙曰華陽國志先主征呉於夷道還屯於巴東治魚復縣公孫述更名白帝章武中改曰永安也玄冬示我胡國刀壯士短衣頭虎毛洙曰莊子說劒庶人之劒蓬頭突鬢垂曼胡之纓短後之衣憑軒拔鞘天爲髙鄭曰鞘所交切飜風轉日木怒號鄭曰平聲冰翼雪淡傷哀猱鄭曰奴刀切䥴錯碧甖鸊鵜膏鄭曰鸊歩覓切鵜田黎切洙曰方言曰野鳬甚小好没水中南楚之人謂之鸊鵜爾雅注鸊鵜似鳬而小膏中瑩刀鋩鍔已瑩虚秋濤洙曰鋩鍔一云銛鋒王褒頌巧冶鑄干將之朴清水卒其鋒越砥斂其鍔注鋒刃芒端秋濤言其色之澄徹如此鬼物撇捩亂坑壕鄭曰撇匹蔑切捩練結切蒼水使者捫赤絛洙曰捜神記曰秦時有人夜渡河見一人丈餘手橫刀而立叱之乃曰吾蒼水使者也龍伯國人罷釣鼇洙曰列子湯問龍伯之國有大人一釣而連六鼇合負而趍歸其國焉芮公廻首顔色勞洙曰芮公荆南節度使分閫救世用賢豪洙曰分閫謂閫內事寡人制之閫外之事將軍制之賢豪趙公也趙公玉立髙歌起攬環結佩相終始萬歳持之護天子得君亂絲與君理洙曰隱四年傳衆仲曰以徳和民不聞以亂猶理絲而棼之漢龔遂曰治亂民猶治亂䋲不可急也唯緩之然後可治也蜀江如線針如水洙曰蜀水至瞿塘則爲峽所束如線焉荆岑彈丸心未巳鄭曰彈徒案切洙曰言有以一丸泥封大散關也賊臣惡子休干紀洙曰史記亂臣賊子陸士衡誅鋤干紀魑魅魍魎徒爲耳洙曰宣三年傳王孫滿曰昔夏之方有徳也鑄鼎象物百物而爲之備使民知神姦故民入川澤山林不逢不若魑魅魍魎莫能逢之注魑山神也獸形魅怪物魍魎水神也妖腰亂領敢欣喜用之不髙亦不庳鄭曰音婢又音卑不似長劒須天倚夢符曰右按前漢文帝有獻千里馬者三國志評曰關羽張飛萬人之敵也修可曰荆楚故事曰襄王與唐勒景差宋玉等游於雲陽之臺王謂左右曰能爲大言者乎唐勒曰壯士怒兮絶天柱北斗戾兮㤗山夷景差曰狡士猛毅撼揺覆載鋸牙鋸雲聲其大吐舌萬里唾一世玉曰方地爲輿圎天爲蓋弯弓掛扶桑長劒倚天外王曰善吁嗟光禄英雄弭大食寳刀聊可比蘇曰晉永徽中大食國獻寳刀使者云漁人夜見溪中有光疑其寳也視之得此刀天色晦暝匣中錚錚有聲晉㓕其刀不知所適丹青宛轉麒麟裏光芒六合無泥滓洙曰言終用此刀澄淸六合畫像麒麟閣桃竹杖引洙曰贈章留後蘇曰栁子厚詩云盛時一失貴反賤桃笙葵扇安可常不知桃笙爲何物偶閱方言簟宋魏之間謂笙方悟桃笙以桃竹爲簟也梁簡文納南王獻書云五離九折出桃枝之翠笋乃謂桃枝竹簟也桃竹出巴渝間江心蟠石生桃竹趙曰爾雅謂桃皮山海經謂桃枝竹也蒼波噴浸尺度足斬根削皮如紫玉江妃水仙惜不得洙曰江賦水夷倚浪以傲晲江妃含嚬而瞟眇注水夷水仙也梓潼使君開一束滿堂賔客皆歎息洙曰君一作者憐我老病贈兩莖出入爪甲鏗有聲老夫復欲東南征乗濤鼔枻鄭曰餘制切白帝城洙曰白帝城在魚復有公孫述像也路幽必爲鬼神奪杖劒洙曰一作拔劒或與蛟龍爭重爲告曰杖兮杖兮爾之生也甚正直愼勿見水踴躍學變化爲龍趙曰神仙傳曰壷公遣費長房歸以一竹杖與之騎長房騎杖忽然如眠便到家以竹投葛陂顧之乃靑龍也石曰杖爲物旣禀正直之姿當以正直輔吾無爲化龍而去使我不得爾之扶持滅跡於君山湖上之靑峯洙曰君山在洞庭湖心也趙曰謝靈運滅迹入靈峯噫風塵澒洞兮豺虎咬人鄭曰澒胡孔切咬古爻切洙曰時盗賊害人如豺虎忽失雙杖兮吾將曷從師曰甫意若曰天下未平尚頼此杖扶持衰老流寓逺郷苟失雙杖吾將曷從㯶拂子鄭曰子紅切㯶拂且薄陋豈知身効能不堪代白羽蘇曰諸葛嘗持白羽扇以指麾又顧榮伐陳敏以白羽扇麾之有足除蒼蠅洙曰詩營營蒼蠅熒熒金錯刀洙曰四愁詩美人贈我金錯刀尹曰李善文選注金錯刀云續漢書曰佩刀諸侯王黃金錯環謝承後漢書曰詔賜應奉金錯把刀續漢書班固與弟超書曰竇侍中遺仲叔金錯半垂刀一枝前漢食貨志曰錢新室更造契刀錯刀契刀其鐶如大錢身形如刀長二寸文曰契刀刀直五百錯刀以黃金錯其文一刀直五千熒熒金錯刀乃佩刀之屬也對雪詩云金錯囊徒整乃是錢刀而以金錯之也虎牙行金錯旌竿滿雲直蓋以黃金而錯縷旌竿也大抵古人之於器物以黃金錯之皆謂之金錯如秦嘉妻以金錯琬奉其夫盛水之類是以當随其器物而名之不可以名同不究其實焉趙曰續漢書曰佩刀諸侯王黃金錯環擢擢朱絲繩洙曰鮑昭直如朱絲繩非獨顔色好亦用顧盻稱趙曰金錯刀朱絲繩二物者非特以其金朱之好顔色耳皆係乎人之顧盻也吾老抱疾病家貧卧炎蒸咂膚倦撲滅鄭曰咂作荅切洙曰蠅蚋咂膚頼爾甘服膺洙曰顔子得一善則拳拳服膺物微世競棄義在誰肯徴三歳淸秋至未敢闕緘縢師曰按唐史玄宗以李林甫代張九齡相九齡旣不見用因作白羽扇賦以自見其志云縱秋氣之移奪终感恩于篋中白羽爲物可以驅蠅蚊爲世所用九齡自喻也㯶拂其質薄陋雖不堪代白羽猶足以驅除蒼蠅時林甫以瑣陋之材而代九齡其材能全无用於朝廷曽㯶拂之不若乎楚辝云美人贈我金錯刀古者以金爲幣錯􅍢其文或謂之刀布後丗用錢代之朱絲繩所以中琴瑟之用金錯刀与朱絲繩以利用而見顧豈特取其顔色之好以爲玩物哉㯶拂爲物雖微有理義在蓋可用之除蠅柰何世人不肯徴信其義而競弃之甫傷淸秋廢置不用不敢怠於緘藏兾其他時之復用然㯶拂微有功於人猶護惜之况白羽其可奪於秋氣一弃而不復顧藉乎所以傷九齡之見弃而疾林甫之獲用也蕃劒致此自僻逺又非珠玉裝如何有竒怪每夜吐光芒趙曰斗牛之間有紫氣虎氣必騰上龍身寧乆藏趙曰孔章臨亡戒其子以劒自隨後其子爲建安從事劒忽躍出見二龍相隨焉風塵苦未息持女奉明王銅瓶亂後碧井廢時淸瑶殿深師曰銅瓶所以汲水以濟人者也喻賢者宣君之恩以及衆丗亂則弃捐於寒甃時淸可収用於瑶殿銅瓶未失水百丈有哀音趙曰想平日清平之時玉殿深䆳宫人以瓶汲井離水欲上時有滴水之音也側想美人意應悲寒甃沉蛟龍半缺落猶得折黃金趙曰井中或得断釵遺珥有黃金蛟龍之狀則有之矣又於韋處乞大邑瓷盌大邑燒瓷輕且堅扣如哀洙曰一作寒玉錦城傳君家白盌勝霜雪急送茅齋也可憐食物古詩八首律詩四首閿郷姜七少府設鱠戲贈長歌鄭曰閿音聞姜侯設鱠當嚴冬昨日今日皆天風趙曰漢髙皇后八年太尉入未央宫擊吕産天風大起也河凍未漁不易得洙曰一作黄河水漁鑿冰恐侵河伯宮饔人受魚鮫人手洙曰周礼天官内饔饔和也熟食曰饔割烹煎和之稱潘安仁西征賦饔人縷切銮刀若飛應刃落爼靃靃霏霏紅鮮紛其初載賔旅竦而遲御旣食服而屬厭泊恬静以况欲廻小人之腹爲君子之慮洗魚磨刀魚眼紅無聲細下飛碎洙曰一作素雪有骨巳刴觜春葱洙曰七啓云纍如疊縠離若散雪輕隨風飛刃不轉切又膾西海之飛鱗七命云范公之鱗出自九溪赬尾丹腮紫翼靑鬐命支離飛霜鍔紅肌綺散素膚雪落觜平聲偏勸腹腴愧年少軟炊香飯洙曰一作梗縁老翁蒼舒曰按礼記冬右腴鄭氏曰腴腹下也前漢書九州膏腴顔師古曰腹之下肥曰腴落碪何曽白紙濕鄭曰碪音砧放筯未覺金盤空新懽便飽姜侯徳洙曰詩旣醉以酒旣飽以徳清觴異味情屢極趙曰陳周弘譲荅王褒書云南風雅操淸觴妙曲大臨曰左傳云必嘗異味東歸貪路洙曰一作貧路自覺難欲别上馬身無力可怜爲人好心事於我見子眞顔色師曰言姜侯礼皃非僞爲也不恨我衰子貴時悵望且爲今相憶觀打魚歌綿州江水之東津魴魚鱍鱍色勝銀鄭曰魴符方切鱍北末切魚棹尾洙曰詩魴魚赬尾鱍鱍跳躍貌修可曰尓雅曰魴魾也今之鯿魚是陸機䟽曰魴魚廣而薄肥甜而少肉細鱗之美者也漁人漾舟沉大網截江一擁數百鱗衆魚常才盡却弃赤鯉騰出如有神洙曰陶弘景本草曰鯉最爲魚宁之主形可愛又能神變乃至飛越山湖所以琴髙乗之也潜龍無聲老蛟怒迴風颯颯吹沙塵饔子左右揮霜刀鱠飛金盤白雪髙洙曰西征賦饔人縷切鑾刀若飛應刃落爼靃靃霏霏徐州秃尾不足憶漢隂槎頭逺遁逃洙曰秃尾查頭皆魚名魴魚肥美知第一旣飽驩娯亦蕭瑟趙曰廣州記曰魴魚廣而肥甜魚之美者也君不見朝來割素鬐鄭曰渠伊切魚鬛也咫尺波濤永相失師曰綿州属西川道魚善變化乃龍之類老蛟怒惡傷其類故也秃尾槎頭縮項皆魚之名旣飽歡娯亦蕭瑟謂樂極則哀繼之春秋隱公矢魚於棠聖筆書之以爲譏甫此詩𥘉叙得魚之樂而末則有咫尺波濤永相失之句豈非得聖人危亡之戒耶又觀打魚蒼江漁子清晨集設網提綱萬洙曰一作取魚急能者操舟疾若風鄭曰操七刀切持也撑突波濤挺义入洙曰顔回濟于觸深之泉見操舟者若神西征賦徒觀其鼔柂回輪洒鉤投網重餌出入挺人來往也定功曰莊子津人之操舟若神且曰善游者數能也潘安仁西征賦垂耳出入挺义往來小魚脫漏不可紀半死半生猶戢戢大魚傷損皆垂頭屈強泥沙有時立鄭曰屈強正作倔渠勿切梗戾也洙曰蜀志曰武陽小魚大如針一斤千頭蜀人以爲醬七發云其根半死半生東津觀魚巳再來主人罷鱠還傾盃日暮蛟龍改窟穴趙曰以言打魚之故而驚動神物也山根鱣鮪隨雲雷修可曰郭璞注爾雅曰鱣大魚似鱏而鼻短口在頷下躰有斜行甲無鱗肉黃江東人呼爲黃魚干戈兵革鬪未止洙曰一云干戈革鬪尚未巳鳳凰麒麟安在哉吾徒胡爲縱此樂暴殄天物聖所哀洙曰春秋繁露曰恩及䖝魚則麒麟至孝經援神契曰德至鳥獸則鳯凰翔師曰义魚义也持以入水網大繩也所以舉網覆巢毀卵則麒麟不至鳯凰不翔自禄山之亂干戈日㝷戕害生民之命亦巳甚矣蛟龍改窟穴鱣鮪隨雲雷喻賢人君子遇亂而遁迹也聖人仁及草木昆虫今於戰闘之際復暴殄天物寒露寒漢殿名開冰淸玉壷洙曰鮑昭淸如玉壷冰君王納凉晚此味亦時須種萵苣并序鄭曰上烏禾下勤吕切旣雨巳秋堂下理小畦隔種一兩席許萵苣向二旬矣而苣不甲拆伊人莧青青趙曰别本伊人作獨野是傷時君子或晚得微禄轗軻不進因作此詩隂陽一錯亂驕蹇不復理枯旱於其中炎方慘如燬鄭曰虎委切火也趙曰在炎方則慘毒如焚燬詩王室如燬言隂陽乖繆而致旱也植物半蹉跎嘉生將已矣洙曰以旱而物無生意也趙曰漢書嘉生之類注專指爲禾雲雷歘奔命師伯集所使趙曰唐狄仁傑傳風伯清塵雨師洒道故公摘而用之指麾赤白日澒洞靑光起雨聲先巳風散足盡西靡趙曰謝眺詩森森散雨足端本曰澒洞雲色起兒散足言雨散作而止足也巳風猶言止風風止則雨降西靡謂斜雨向西也山泉落滄江霹靂猶在耳終朝紆颯沓信宿罷蕭洒堂下可以畦呼童對經始洙曰經始言𥘉無畦而始經構之也苣兮𬞞之常随事蓺其子破塊數席間荷鋤功易止兩旬不甲拆蘇曰魯哀公丗禾黍兩旬不甲拆尹父潘雷空惜埋泥滓趙曰易云百榖草木皆甲拆選奮迅泥滓野莧迷汝來宗生實於此修可曰揚子雲蜀都賦其竹則宗生簇攅俊茂豐美又左思呉都賦楠檣之木相思之樹宗生髙崗族茂幽阜此輩豈無秋亦蒙寒露委翻然出地速滋蔓户庭毀因知邪干正掩抑至没齒洙曰言苣爲莧所蕪以喻賢者爲小人見掩枊也賢良雖得禄守道不封巳趙曰言賢良之人得位則不恣非似邪佞得位而封巳亦猶嘉𬞞之苣出地則不滋非似野莧之得而滋蔓也國語叔向曰引黨以封巳注曰封厚也擁塞敗芝蘭衆多盛荆𣏌洙曰小人衆也趙曰芝蘭所以壅塞者以荆𣏌之衆多也非特苣耳中園䧟蕭艾老圃永爲耻登于白玉盤洙曰漢官儀曰封禪壇有白玉盤藉以如霞綺莧也無所施胡顔入筐篚洙曰有其丈者必有其容有其容者必有其徳喻小人雖有掩抑之才而終不爲邦家所用師曰胡顔謂強厚顔也野莧始雖盛及萵苣生長登於白玉之盤藉以如霞之綺遂使彼無所用不猶強顔入吾筐篚之内不亦無耻乎以喻小人掩君子一旦登于玉堂則小人將何顔而猶居朝乎終亦不用而巳矣園官送菜并序園官送菜把本數日闕矧苦苣馬齒掩乎嘉𬞞傷小人妬害君子菜不足道也比而作詩趙曰三曰比之義淸晨蒙菜把常荷地主恩蘇曰陶侃得張餗園𬞞曰乆客常荷地主恩私家貧無所報但手加額而巳趙曰岀國語越王以㑹稽三百爲范蠡地曰後世有敢侵蠡之地者皇天后土四郷地主正之守者愆實數略有其名存蘇曰祖平曰東漢文章掃地見今之圎冠輩略存其名巳苦苣刺如針馬齒葉亦繁靑靑嘉𬞞色埋没在中園洙曰此序所以言小人害君子也趙曰公言所送止苦苣馬齒莧爾而所謂嘉𬞞者未嘗摘以相遣也張載登成都白菟樓云原隰植嘉𬞞師曰嘉𬞞比君子苦苣馬齒比小人言小人掩君子君子不得其所園吏未足怪世事固堪論嗚呼戰伐乆荆棘暗長原師曰老子曰大軍之後必有凶年荆棘生焉乃知苦苣輩傾奪蕙草根洙曰蕙草薫草也小人塞道路爲態何喧喧又如馬齒盛氣擁葵荏昏洙曰葵荏嘉𬞞也趙曰苦苣馬齒如小人可知葵荏正以言嘉𬞞蕙草雖不可爲𬞞而要之君子之比師曰蕙草香有君子之象蕙草見奪於苦苣君子爲小人所勝也小人得志則作態驕淫矜夸靡所不至故云爲態何喧喧葵荏嘉𬞞又爲馬齒昏塞足見小人勢盛君子道消也點染不易虞師曰喻君子爲小人所汚絲麻雜羅紈一經器洙曰一作氣物內永挂麄刺㾗趙曰以苦苣馬齒一經器物所盛則便永逺挂麄之㾗然則君子固冝傷所染矣師曰喻國家爲小人所敗國者天下之大器也志士採紫芝放謌避戎軒洙曰古有紫芝歌亦神仙所作趙曰皇甫謐髙士傳秦丗坑黜儒術四皓於是作歌曰莫莫髙山深谷逶迤曄曄紫芝可以療飢畦丁負籠至感動百慮端蘇曰孫鍾治𬞞圃爲生甞與畦丁負籠拾李暇日小園散病將種秋菜督勒耕牛兼書觸目不愛入州府蘇曰劉稚吾任真放逸不能巧言取媚大人長者多嫌亦不愛時入州府畏人嫌我眞洙曰襄陽耆舊記寵徳公在沔水上至不入襄陽城及乎歸茅宇洙曰一云及歸在茅屋旁舎未曾嗔趙曰漢髙祖適從旁舎來老病忌拘束蘇曰王祥老病纏綿不堪拘束應接䘮精神趙曰使人應接不暇江村意自放林木心所欣秋耕屬地濕山雨近甚勻冬菁飯之半牛力晚來新修可曰張平子南都賦酸甜滋味百種千名春夘夏笋秋韮冬菁蘇蔱紫薑拂撒羶腥注菁蔓菁也黃石公三略云牛力日新深耕種數畝未甚後四隣嘉𬞞旣不一名數頗具陳荆巫非苦寒採擷接靑春飛來兩白鶴暮啄泥中芹雄者左翮垂損傷巳露筋一歩再流血尚經洙曰一云驚矰繳勤三歩六號叫志屈悲哀頻鸞皇不相待側頸訴髙旻杖䔧俯沙渚爲汝鼻酸辛趙曰宋玉賦寒心酸鼻驅竪子摘蒼耳趙曰蒼耳今所謂羊負菜也在詩則謂之卷耳江上秋巳分林中瘴猶劇畦丁告勞苦洙曰畦丁種田者也猶今之佃民無以供日夕蓬莠猶不燋蘇曰乆旱不雨王戎出郊語父渾曰炎歊赫赫嘉𬞞盡槁禾黍枯悴蓬蒿蕕莠獨不焦旱豈造物之私耶父駭其言而異之野𬞞暗泉石卷耳况療風洙曰見本草蘇曰寵濟昨使畦丁去樀卷耳得滿筐筥者此物療風氣故分贈友人童兒且時摘洙曰一云童僕先時摘侵星驅之去爛熳任逺適放筐亭午際洗剥相蒙羃趙曰洗其土剥其毛登床半生熟趙曰登食床也或作生菜或作熟菜下筯還小益趙曰小益謂療風也加點瓜薤間依俙橘奴跡洙曰李衡以橘爲木奴故江左有橘奴號亂世誅求急黎民糠籺窄夢符曰右按前漢書陳平傳或謂平何食而肥若是其㛐疾平之不視家生産曰亦食糠覈耳晉灼曰覈音紇京師人謂麄屑爲紇頭飽食復何心荒哉膏粱客夢符曰右按唐栁芳氏族論曰三世有三公者曰膏梁有令僕者曰華腴富家厨肉臭戰地骸骨白洙曰言天下荒亂饑饉荐仍而在位者无救恤之意寄語惡少年黃金且休擲洙曰燕太子者得荆軻與之臨池軻以瓦抵鼃太子命捧金以進軻用抵之又進軻曰非爲太子愛金乃臂痛爾趙曰梁元帝古意詩中有惡少年伎能專自得江閣卧病走筆寄呈崔盧兩侍御客子庖厨薄江樓枕席清衰年病秪瘦長夏想爲情滑憶彫胡飯洙曰憶一作喜沈休文彫胡方自炊西京雜記太液池邊皆是彫胡菰之有米者長安人謂彫胡又㑹稽人顧翺少失父事母至孝母好食彫胡飯常躬自採擷家近太湖湖中後自生彫胡無復餘草香聞錦帶羹夢符曰右按荆湘間有錦帶春末開花紅白如錦其苗亦嫩脆可食師曰薛夢符云荆湘間有花名錦帶其花條生如郁李春末方開紅白如錦初生葉柔脆可食渚宫又謂之文官花安陸王彦輔中散云錦帶吐綬雞也其肉脆美堪作臛錦帶花則予親見之謂吐綬雞爲錦帶則傳記所不載彦固傳斈而文恐其言亦有所據溜匙兼暖腹誰欲致盃甖秋日阮隱居致薤三十束鄭曰薤胡介切葷菜葉似韭隱者柴洙曰一作荆門內畦𬞞繞舎秋盈筐承露薤洙曰詩卷耳不盈頃筐挽歌薤上露不待致書求束比青芻色魯曰詩云靑芻一束圎齊玉筯頭衰年關鬲冷味暖併洙曰一作腹無憂唐曰薤性暖益老人故云云關節也鬲胷也除架洙曰瓜架也束薪巳零落趙曰爪架必以薪爲之今瓜巳摘則架上之薪零落也瓠葉轉蕭踈幸結白花了寧辭靑蔓除趙曰瓜實旣結則其蔓可除秋䖝聲不去暮雀意何如洙曰架除而鳥失栖也寒事今牢落人生亦有初洙曰言瓜未生之初則作架以承之纔結花則有將實之望而其意稍怠矣故架壞則除去而不修也亦猶人事銳始而怠終趙曰此詩作於秦州爲客不堪如此然人生未嘗無初則公之初在太平之時文采動上聲譽烜赫本不如是之牢落也廢畦秋𬞞擁霜露豈敢惜凋殘暮景數枝葉趙曰公自憫也不忍𬞞之彫殘故於暮景之中數其枝葉爾天風吹汝寒緑霑泥滓盡香與歲時䦨生意春如昨悲君白玉盤分門集註杜工部詩卷第十六, WYG: ''}
