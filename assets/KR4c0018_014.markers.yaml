  - {type: variant, offset: 0, length: 16220, content: 分門集註杜工部詩卷第十四時事上古詩三十一首兵車行洙曰春秋有兵車之㑹語不以兵車管仲之力也王深父云雄武之君喜驅中國之衆以開邊服逺爲烈而不寤其事乃先王之罪人耳此詩蓋號於漢以刺玄宗云師曰律詩拘於聲律古詩拘於語句以是詞不能逹夫謂之行者逹其詞而巳如古文而有韻耳自唐陳子昻一變江左之體而歌行暴于丗行者詞之遣無所留礙如雲行水行曲折溶洩不爲聲律語句之所拘但於古詩句法中得増辭語耳此行爲唐玄宗所作玄宗承太宗米斗三錢之後國家豐冨侈心一動遂貪邊功𥘉用張九齡爲相開元中號爲賢君其後罷九齡用李林甫楊國忠之徒從事吐蕃訖唐之丗吐蕃爲患者玄宗實開其釁而巳車轔轔鄭曰離珍切洙曰秦國風有車轔轔有馬白顚注轔轔衆車聲也列女傳衛靈公與夫人夜坐聞車聲轔轔至関而止夫人曰此蘧伯玉也王元長曲水詩序暢轂埋轔轔之轍馬蕭蕭洙曰車攻詩蕭蕭馬鳴悠悠斾旌注言不讙譁行人弓箭各在腰蔡伯丗曰行人行役之人也耶孃妻子走相送彦輔曰杜元注云古樂府云不聞耶娘哭子聲但聞黃河之水流濺濺塵埃不見咸陽橋何覬曰咸陽橋即長安城外橋兵行塵埃坌起故橋爲之不見也牽衣頓足欄道哭鄭曰楚人與蒲騷戰兵行父老牽衣哭于道修可曰前漢楊惲報孫㑹宗書頓足起舞彦輔曰魏文帝見挽船七兄弟辭别詩妻子牽衣𬒮落淚沾懷抱王温舒頓足嘆後漢書百姓遮道說文曰欄門遮也師曰頓足者足踊於地而爲之困頓哭聲直上干雲霄洙曰孔德璋干青霄而直上蜀都賦干青霄而秀出道旁過者問行人行人但云點行頻師曰點行者漢史謂之更行以丁籍點照上下更換差役玄宗數出兵故頻行之法頻或從十五北防河師曰防河謂築堤備河水泛決便至四十西營田洙曰防河營田皆役也顔師古曰營田如漢趙充國献營田之策無事則耕有事則戰寓兵於農之意去時里正洙曰里正一里之長髙荷曰里正即今之保正也與褁頭鮑曰蜀亂兵戈不止東川咸用老弱俱戰亡又括郷里少小爲之里正與褁頭擐甲彦輔曰按律䟽里正掌追呼催督歸來頭白還戍邊洙曰還一作猶明逺東武吟少壯辭家去窮老還入門韓駒曰古者及丁方裹頭少年裹頭行役及歸來頭已白還又屯戍邊疆蓋言役使無巳故也邊庭流血成海水洙曰後漢卧鼓邊庭主父偃傳古之人君一怒必伏屍流血書血流漂杵楊子川谷流人之血賈誼過秦論伏屍百萬流血漂鹵彦輔曰王隱晉書荀晞爲青州刺史曰斬千人流血成川武皇開邊意未巳洙曰武一作我嚴助傳武帝好征伐西夷開置邊郡文選云選將開邊班固曰武帝廣開三邊君不聞漢家山東二百州彦輔曰按十道四蕃志関巳東七道凡二百一十一州千村萬落生荆杞洙曰通典周文帝西魏計州二百十有一隋文帝改州爲郡凡郡百九十唐天寳初改州爲郡刺史爲太守大凡都府三百二十有八老子師之所處荆棘生焉大軍之後必有凶年選阮嗣宗詩堂上生荆𣏌蔡琰詩城郭爲山林庭宇生荆艾王粲從軍城郭生榛棘唐曰落部落也趙曰此記漢以言之舊引通典置天下州郡誤矣然言山東者太行山之東也昔言山東即古之晉地今之河北杜牧所謂山東言不得不王是也彦輔曰阮籍詩堂上生荆杞師曰甫意以武皇喻玄宗是時楊國忠專權引安禄山爲將領漁陽突騎生事邀功于四夷其後反叛山東二百州皆䧟于賊無復唐有玄宗殊不悔悟豈不若武帝開邊不知止乎縱有健婦把鋤犂彦輔曰健婦耕則夫𬒳征戍可知古詩不能同沮溺相隨把鋤犂禾生隴畒無東西蘇曰漢末䘮亂禾與莠俱滿壟畒人多迷昏東西莫辨趙曰古詩隴西行健婦持門戸勝一大丈夫師曰疆埸不修禾生壠畒不成倫理故曰無東西也詩云衡從其畒謂一從一衡各有東西之辨傷今不然况復秦兵耐苦戰鄭曰耐奴登切又奴代切洙曰秦人勇於攻戰趙充國傳土地寒苦漢馬不能冬屯兵在武威張掖酒泉萬騎以上皆多羸痩師古曰能讀曰耐蘇曰白起曰燕趙勇敵秦兵勁銳耐戰戰苦不怯陣陣皆克勝故関中不可不取也被驅不異犬與雞長者雖有問役夫敢伸恨洙曰文元年傳江芊怒曰呼役夫賤者之稱且如今年冬未休關西卒洙曰関一作隴一云役夫心益憤如今縱得休休爲隴西卒彦輔曰杜前言山東後言関西明無不用兵處也縣官急索租鄭曰索急責切彦輔曰舊本云縣官云急索洙曰霍光傳縣官天子也宣元六王傳不敢指斥天子故謂之縣官嚴助傳租稅之収足以給乗輿之御前志衣食仰給縣官租稅從何出蘇曰孔文舉曰兵革未止乆旱苗槁民實痩乏州縣苦於徭役民旣空虚租歛復何從出師曰唐置租庸調法租出榖庸出絹調出兵縣官索租甚緊欲給関西之師民户消耗无所従出况耕夫出征田萊多荒將何以供其求乎信知生男惡反是生女好生女猶是嫁比鄰鄭曰比音毗洙曰王粲詩万里猶比鄰趙曰曹子建詩万里猶比鄰舊引爲王粲誤矣陳琳詩生男愼莫㪯生女哺冝脯杜公以役夫之苦故云生男惡也生男埋没随百草師曰生男人之所喜生女人之所賤此常理也今以生男爲惡生女爲好盖男兒充丁驅之戦埋没草野曽不如生女尚得嫁毗鄰或時相見此皆有所相感而激爲是言君不見青海頭洙曰哥舒翰傳築神威軍於青海上吐蕃至攻破之又築城於青海中郭元振傳青海吐軍宻迩蘭鄯趙曰時有事于吐蕃乃青海之地哥舒翰所立功処也彦輔曰隋西域傳吐谷渾城在青海西十五里古來白骨無人収洙曰蔡文姬詩城郭爲山林庭宇生荆艾白骨不知誰縱横莫覆盖潘安仁関中詩肝䐉塗地白骨交衢王粲七哀賦出門无所見白骨平原滿趙曰公言古來者盖託之以興也新鬼煩冤舊鬼哭天隂雨濕聲啾啾洙曰声一作悲文二年傳吾見新鬼大故鬼小王元長策秀才云肺石少不冤之民棘林多夜哭之鬼山鬼云猿啾啾兮又夜鳴雷塡塡兮雨冥冥劉安蟪蛄鳴兮啾啾彦輔曰鬼言新舊傷死者未巳也修可曰陳寵爲廣漢太守先是洛陽城南毎隂雨堂有哭声寵聞而疑其故使吏按行問還言丗乱時此地多死亡者而骸骨不得葬寵尽収葬之自是哭声遂絶彦輔曰隋文帝歲暮登仁壽殿宫外又聞哭声左右報曰鬼哭趙曰啾字王逸楚辝注曰鳴声也閑居賦管啾啾而並吹師曰青海軍迫近吐蕃此邊地郡也昔文王殯枯骨當丗㱕其仁今玄宗屡与吐蕃戦于青海兵敗死者不復収葬使新舊之鬼或冤或哭无所依㱕其視文王之仁爲如何哉鬼神依人而作有所主則有所㱕故不爲病葬者藏也謂鬼神依藏于此鬼以新舊言之則知戦闘相仍死者相継踵也悲陳陶彦輔曰唐書房琯傳琯奉使霊武立粛宗因請將兵誅冦孽収復京都琯分爲三軍遣楊希文將南軍自冝壽入劉悊將中軍自武功入李光進將北軍自奉天入琯自將中軍爲前鋒鮑曰天宝十五年十月辛丑房琯及禄山戦于陳陶斜敗績癸卯琯又以南軍戦敗績公故有是詩蘇曰琯之敗唐傳作陳陶斜杜詩作陳陶未知孰是琯旣敗猶欲持重有所伺而中人促戦遂大敗故後篇云焉得附書与我軍忍待明年莫倉卒孟冬十郡良家子洙曰漢趙充囯始爲騎士以六郡良家子房琯傳十月庚子師次便橋辛丑一軍先遇賊於咸陽縣之陳壽斜接戦琯軍敗績血作陳陶澤中水洙曰時琯用春秋車戦之法以車二十乗馬歩夾之旣戦賊順風揚塵鼓譟牛皆震駭因縳蒭縱火焚之人畜燒敗乃中使刑延恩等督戦倉黃失據遂及於敗野曠天清洙曰曠一作廣清一作晴無戰聲四萬義軍同日死洙曰爲賊所傷殺者四万餘人存者数千而巳羣胡歸來血洗箭洙曰血一作雪仍唱洙曰一云撚箭胡歌飲都市都人廻面向北啼日夜更望官軍至洙曰一云前後官軍苦如此王深父序云至徳元年宰相房琯以車師戦禄山之黨而陳陶敗績趙曰此言朔方安西回紇大食兵相助討賊然夷狄之性不无殘擾故房琯雖䘮兵矣都人不願胡兵討賊只望官軍至也師曰禄山焚劫暴虐都人怨之而思唐徳遂有望官軍之句粛宗一㪯而復兩京豈非因民謳吟思唐之心乎悲青坂彦輔曰王深父序云孔子行三軍好謀而成謀之未全而敢戦所以速敗我軍青坂在東門天寒飲馬太白窟魯曰在歧州郿縣去長安三百里黃頭奚兒日向西數騎彎弓敢馳突洙曰匈奴傳上力能弯弓尽爲甲騎趙曰前篇悲陳陶則辛丑之敗也此篇悲青坂則癸卯之敗也以兩敗各散而㱕所以言曰向西其餘散騎猶敢馳突以言其暴掠不改也山雪河冰野蕭飋青是烽煙白人骨洙曰舞鶴賦冰塞長河雪滿羣山焉得附書與我軍忍待明年莫倉卒趙曰房琯戦於陳陶斜不利猶欲持重而牽於邢延恩所促戦故敗而公詩有忍待明年之戒所以重傷之也新安吏王深父曰乾元二年郭子儀等九節度之師圍安慶緒于鄴時不立元帥以中官魚朝恩爲觀軍容宣慰使師遂潰于城下諸節度各還本鎮子儀保河陽詔晋守東都此詩盖哀出兵之役夫古者遣將有推轂分閫之命今弃師於敵也虐至於无告如詩之所憾其君臣豈不刺哉然子儀猶寛度得衆故卒章美焉師曰従新安吏以下至无家別乃乾元元年所作粛宗於至徳二載改元乾元時九節度兵圍安慶緒于相州大敗而還朝廷調諸郡兵益急雖次丁尽行秦之謫戊无以加此惟郭子儀能撫恤士卒有詔晋守東都故甫於首篇諷朝廷重困民力未章美子儀善飬士卒惜夫肅宗任之不專權分于九節度緫統不一以至于敗也客行新安道洙曰新安地名喧呼聞點兵洙曰古木蘭詩昨夜見軍帖可汗大點兵借問新安吏縣小更無丁府帖昨夜洙曰帖一作符夜一作日下次選中男行中男絶短小何以守王城肥男有母送痩男獨伶俜洙曰潘安仁寡婦賦少伶俜而偏孤伶音零俜無成單子貌修可曰古猛虎行曰少年惶且怖伶俜到他郷鄭曰俜普丁切伶俜行不正貌白水暮東流靑山猶哭聲洙曰猶一作聞木蘭詩不聞爺娘哭子聲但聞黃河流水鳴濺濺莫自使眼枯收汝淚縱橫眼枯却見骨天地終無情我軍取相州洙曰取一作至時九莭度圍相州而師潰也日夕望其平豈意賊難料蘇曰吴起出兵不可輕戦賊勢難料歸軍星散營趙曰乾元初詔子儀率李光弼等九莭度兵二十万討慶緒於相州圍之慶緒求救於史思明王師不利南潰諸莭度引還故公今詩云云就粮近故壘練卒依舊京掘壕不到水牧馬役亦輕洙曰牧一作看世言子儀保河陽詔留守東都况乃王師順撫養甚分明送行勿泣血僕射如父兄鄭曰郭子儀也潼關吏王深父曰安禄山反哥舒翰以潼關擊賊翰敗禄山遂䧟長安其後收復長安頗増飾餘險此詩蓋刺非其人則舉關以弃之得其人雖舊險亦足以恃不必衆而持無益也孟子所謂也利不如人和也士卒何草草築城潼關道大城鐡不如小城萬丈餘薛曰右按潤州圖經城号鐡瓮城吴孫權所築杜牧潤州詩城髙鐡瓮橫強弩文丗說曰若湯池鐡城無可攻之勢借問潼關吏修關還備胡洙曰脩開一作築城要我下馬行鄭曰要於宵切爲我指山隅連雲列戰格飛鳥不能踰胡來但自守豈復憂西都丈人視要處窄狹容單車蘇曰李左車云井陘之道車不得方軌騎不得成列艱難奮長㦸千古用一夫洙曰匈奴賛厲長㦸勁弩之械劒閣銘一人荷㦸万夫趑趄蜀都賦一夫守隘萬夫莫向淮南子一人守隘千夫莫何哀哉桃林戰百萬化爲魚洙曰武成牧牛桃林之野注桃林在華山東西京付左有崤函重險桃林之塞陸士衡春言懷桑梓無乃化爲魚光武紀决水灌之百萬之衆可使爲魚請囑防關將愼勿學哥舒洙曰唐哥舒翰突騎施首領哥舒部落之裔也蕃人多以部落稱始以爲氏翰至潼關次于靈寳縣之西原與賊交戰官軍南迫險峭北臨黃河因爲兇徒所乗三師自相擠排墜于河翰與數百騎馳而西歸爲火技歸仁執降於賊禄山僞署翰司空諸將光弼等皆爲書罪翰不死莭後爲安禄山所殺師曰今肅宗旣收復兩京儻不更選賢將事之成敗未可知也故甫有愼勿學之句石壕吏鄭曰壕胡刀切王深父曰驅民之丁壯尽置死地而猶急其老弱雖爲閭左之戍不堪也嗚呼其時急矣哉暮投石壕洙曰石壕地名鄭曰澠池有二崤東壕土崤西爲石崤石崤即石壕矣村有吏夜捉人老翁踰墻走老婦出門看吏呼一何怒婦啼一何苦聽婦前致詞三男鄴城戍洙曰江淹飛蓋遊鄴成王粲歌舞入鄴城魏都也一男附書至洙曰一作到二男新戰死存者且偷生吕曰李陵曰陵豈偷生之士死者長巳矣室中更無人所有乳下孫孫有母未去出入無完裙洙曰一作孫母未便出見吏無完裙老嫗力雖衰洙曰文頴曰幽州及漢中皆謂嫗爲媪請從吏夜歸急應河陽役沈曰河陽東都也猶得備晨炊洙曰史晨炊蓐食師曰時三莭度屯兵於此以禦慶緒兵敗無丁可抽故老嫗請起河陽之役以洪炊㸑而已夜乆語聲絶如聞泣幽咽天明登前途獨與老翁别垂老别王深父曰軍興之甚至於老者亦介胄則又甚於閭左之戍矣四郊洙曰一作方未寧靜洙曰曲禮四郊多壘卿大夫之辱也垂老不得安子孫陣亡盡蘇曰衛隆吾宗丗業儒值此離亂子孫不慣操戈陣亡皆尽焉用身獨完投杖出門去同行爲辛酸幸有牙齒存所悲骨髓洙曰一作肉乾男兒旣介胄長揖别上官洙曰左思詩長揖歸田廬酈食其長揖髙祖老妻卧路啼歲暮衣裳單孰知是死别且復傷其寒此去必不歸蘇曰主父偃此行斷當不復歸矣吾吐詞與物多忤還聞勸加餐古詩努力加餐飲古辭上言加餐食土門壁甚堅杏園度亦難洙曰史思明傳李光弼出土門收常山郡郭子儀以朔方蕃漢二萬人自土門而至常山軍威遂振趙曰時土門杏園設備以待史思明時思明巳殺安慶緒自立爲帝矣與天寳十五載潼關旣潰之後思明爲安禄山攻王門䧟常山時事皆相逺勢異鄴城下縱死時猶寛人生有離合豈擇衰盛洙曰一作老端憶昔少壯日遲廻竟長歎洙曰鮑昭臨路獨遲廻萬國盡征戍洙曰一云東征烽火𬒳岡巒洙曰蜀都賦岡巒糾紛盧諶詩岡巒挺茂樹鮑昭烽火入咸陽積屍草木腥洙曰晉天文志太陵中一星曰積尸明則死人如山蘇曰衛紹累年兵戈不解積屍偏野草木皆腥狐驕鳥肥流血川原丹洙曰楊子川谷流人之血原野厭人之肉西都平原赤何郷爲樂土洙曰詩適彼樂土安敢尚盤桓弃絶蓬室居塌然摧肺肝洙曰曹植詩哀哉傷肺肝又顧念蓬室士王仲宣喟然傷心肝列子曰北宫子死其蓬居若廣厦之䕃蘇曰張約過金陵回首淚不能止心肝摧折師曰痛念國家急難征戍烽火何郷不有吾豈能獨安不慮哉不敢盤桓義也塌然傷别者仁也詩之意不忘仁與義此甫幾乎風雅之作矣無家别王深父曰先王子惠困窮苟推其所不忍逹之於其所忍則天下無敗亂之兆矣此詩何爲作乎師曰甫詩言無家者蓋離别不成家計爾寂寞天寳後魯曰天寳明皇年號也園廬但蒿藜洙曰䘮亂園廬殘破也我里百洙曰一作萬餘家丗亂各東西存者無消息死者爲洙曰一作委塵泥蘇曰梁竦賢愚貴賤一死皆爲塵泥造化豈有彼此之異賤子因陣敗歸來㝷舊洙曰一作故蹊乆行見空巷日瘦氣慘悽蘇曰王齊累日飢腸慘悽覺瘦但對狐與狸竪毛怒我啼洙曰若寒行熊羆對我蹲虎豹來路啼言田里荒蕪人跡罕少惟狐狸爾四鄰何所有一二老寡妻洙曰四鄰所居之鄰近也人多死于征役所居者惟寡婦爾孟子老而無夫曰寡宿鳥戀本枝安辭且窮棲洙曰安一作敢人情之戀故郷如宿鳥之戀本枝也雖窮棲且安辭矣言人情之安土也唐太宗爲太原父老曰飛鳥過故郷猶躑躅况朕少小所遊之郷里乎王正長人情舊郷客鳥思棲故林顔延年刻意藉窮棲方春獨荷鋤洙曰陶濳雖有荷鋤倦鄭曰荷下可切負荷也蘇曰潘勗見陸機曰今天下三分兵戈騷屑吾當獨荷鋤山谷采芝木養此衰朽不復有意於丗間事也日暮還灌畦縣吏知我至召令習鼔鞞洙曰張景陽人間鼓鞞聲鄭曰府移切又薄迷切鞞助鼓莭雖從本州役曽曰盧諶詩肯謂郷曲譽謬充本州役内顧無所擕近行止一身逺去終轉迷家郷旣盪盡鄭曰盪徒沆切劉曰謝靈運家郷皆掃盡逺近理亦齊永痛長病母五年委溝谿生我不得力蘇曰陳渉人言父母生我不得力吾試慿三尺逐秦鹿使羣兒洗目看享富貴見函谷碑終身兩酸嘶人生無家别何以爲蒸黎洙曰傷不得養父母師曰昔宣王中興勞來還定安集之而鴻鴈之民獲安其居今肅宗中興使民無家而至於生無以養死無以葬其視周宣之安民不亦厚顔也哉觀甫詩持政之美惡皆可得而知也留花門鮑曰按唐志甘州有留花門山堡東北千里至回鶻衙帳是年八月廣平王爲元帥以朔方吐蕃回紇諸兵討賊公逆知其害故言麥倒桑折卒曰花門旣須留原野轉蕭瑟言其爲農桑害也趙曰花門即回紇之别名也北門洙曰一作方天驕子飽肉氣勇決洙曰門一作方前漢匈奴傳單于遣使遺漢書曰南有大漢北有強胡胡者天之驕子也不爲小禮以自煩今欲與漢闓大関取漢女爲妻歲給遺酒糵萬石稷米五千斛雜繒萬匹它如故約則邊不相盗矣又匈奴居北邊君王以下咸食畜肉衣其皮而已矣髙秋馬肥徤洙曰前漢匈奴漙秋馬肥大㑹蹛林課校人畜計趙充國曰秋馬肥變必起矣李廣以臨右北平盛秋師古曰盛秋馬肥健恐虜爲冦也挾矢射漢月自古以爲患洙曰賛曰書戒蠻夷猾夏戎狄是膺春秋有道守在四夷乆矣夷狄之爲患也嚴尤曰匈奴爲害所從來乆矣未聞上丗有必征之者也侯應曰周秦以來匈奴爲害暴桀冦侵邊境漢興尤𬒳其害四子講徳論夫匈奴者百蠻之最強者也天性蹇驕習俗桀暴賤老貴壯氣力相髙業在攻伐事在獵射兒能騎羊走箭飛鏃云云詩人所歌自古患之如此也詩人厭薄伐洙曰周懿王時王室遂衰戎狄交侵暴虐中國被其苦詩人始作疾而歌之曰靡室靡家獫狁之故豈不曰戒獫狁孔棘至懿王曽孫宣王興師命將以征伐之詩人美大其功曰薄伐獫狁至於太原言遂出之脩徳使其來覊縻固不絶洙曰語逺人不服脩文徳以來之賛曰其慕義而貢獻則接之以禮譲覊縻不絶使曲在彼蓋聖王制御蠻夷之常道也揚雄書曰然尚覊縻之計不顓制也應劭漢官儀曰馬曰覊牛曰縻言四夷如牛馬之受覊縻也胡爲傾國至出入暗金闕中原有驅除隱忍用此物洙曰王莽賛曰聖王之驅除云爾蘇林曰王莽爲光武驅除也驅逐蠲除以待聖人也公主歌黃鵠洙曰西域傳烏孫使使獻馬願得尚漢公主昆弟天子問羣臣議計曰必先納聘然後遣女烏孫以馬千匹聘漢元封中遣江東王建女細君爲公主以妻焉賜乗輿服御物爲備官屬侍御數百人贈送甚盛烏孫昆莫以爲左夫人匈奴亦遣女妻昆莫昆莫以爲右夫人公主至其國自治宫室居歲時再與昆莫㑹置酒飲食以幣帛賜王左右貴人昆莫年老言語不通公主悲愁自爲作歌曰吾家嫁我兮天一方逺託異國兮烏孫王穹廬爲室兮旃爲墻以肉爲食酪爲漿居常土思兮心内傷願爲黃鵠歸故郷天子聞而隣之趙曰乾元元年肅宗以㓜女寧國公主嫁回紇可汗故云歌黃鵠君王指白日洙曰詩大車謂予不信有如皎日皎白也我言之信有如皎然之白日指白日以爲誓盟約連雲屯左輔百里見積雪洙曰三輔故事馮輔也翊佐也左輔馮翊郡也趙曰此指言回紇留左輔之爲害也長㦸鳥休飛蘇曰吕布曰長㦸霜戈鳥亦不能飛度吴人何患耶哀笳曉幽咽田家最恐懼麥倒桑枝折洙曰講徳論收秋則奔狐馳兎穫刈則顚倒殪仆驚邊杌士屢犯蒭蕘哥舒翰傳吐蕃至麥熟時率部衆至積石軍穫取呼爲吐蕃麥趙曰時殘害麥與桑故田夫懼之莎苑臨清渭洙曰莎苑馮翊郡界泉香草豐㓗蘇曰王臻至渼陂愛其泉香草木豐秀遂編茅讀書精通三傳渡河不用船千騎常撇烈洙曰一云㓕没胡塵踰太行洙曰太行山名古詩驅車太行道也雜種抵京室花門旣須留原野轉蕭瑟洙曰丘希範書姬漢舊邦無取雜種王深父留花門序云肅宗之復兩京籍回紇之師助焉雖幸成功而朝野更𬒳其毒語曰人無逺慮必有近憂以天子之尊推誠仗順集中國之智力滅一狂賊豈有不足哉不忍須臾之遲顧引勍虜入於腹心之地卒不危禍其社稷者僅耳所謂飲鴆救渇此詩蓋憂其事其後陸䞇賀吐蕃抽軍不助討洙泚亦此云塞蘆子王深父序云徹其西備而爭利於東非所以固國者也五城何迢迢洙曰沈存中云延州今有五城說者謂舊有東西二城夾河薱立商萬典郡始展南北東三關乃知天寳中有五城謂商始展非也鮑曰唐志延州延昌縣北有蘆子關又夏州注長慶四年節度使李祐築烏延宥州臨塞隂河陶子與塞蘆子蓋五城名也迢迢隔河水邊兵盡東征洙曰文六年知秦之不復東征城内豈荆𣏌洙曰阮嗣宗詩堂生荆𣏌思明割懷衛洙曰史思明雜種胡人也天寳十四年隨安禄山反河陽懷衛盡䧟於賊秀巖西未巳洙曰髙秀巖哥舒翰麾下將也後爲思明僞河東莭度使降肅宗帝也廻略大荒來洙曰山海經曰大荒之中有山名曰大荒之山日月所入是謂大荒之野崤凾蓋虚爾洙曰項藉賛秦孝公據崤凾之固師古曰崤謂崤山今陜縣東二崤是也凾谷今桃林縣南洪溜澗是也虚言其無備禦爾延州秦北戸關防猶可倚焉得一萬人疾驅塞蘆子歧有薛大夫旁制山賊起洙曰歧一作頃近聞昆戎徒爲退三百里蘇曰蕭銑與衛人戰日退三一日里蘆關扼兩寇深意實在此誰能呌帝閽胡行速如鬼洙曰時官兵止知東討収復河洛而不知蘆子之可塞公懼有乗隙而起者故有此作滕曰揚雄甘泉賦選巫咸弓叫帝閽洗兵馬洙曰收京後作中興諸將收山東趙曰山東河北也安禄山反先䧟河北諸郡至二京巳復慶緒奔于河奔北之後史思明等降而諸郡漸復矣故公今詩云中興也捷書日報淸晝同河廣傳聞一葦過洙曰衛詩誰謂河廣一葦航之胡危命在破竹中洙曰晉杜預傳今兵威巳振譬如破竹数莭之後迎刃而解無復著手處也秖殘鄴城不日得獨任朔方無限功趙曰指言郭子儀也素爲朔方莭度使時專任子儀故云京師皆騎汗血馬洙曰汗血事見前詩廽紇餧肉蒲萄宫洙曰張耳傳如以肉餧虎何益三輔黃圖曰漢有蒲萄宮趙曰汗血馬出大宛盖胡馬也皆騎汗血馬以言回紇騎胡馬之多沈曰餧肉出張耳傳如以肉餧虎何益則視回紇爲虎以言強暴爲患也孝祥曰蒲萄宮見景龍文館記云中宗召近臣宴東蒲萄園奏以宫樂謂此園耳巳喜皇威淸海岱洙曰禹貢海岱惟靑州常思仙仗過崆峒洙曰玉元長䇿崆峒有順風之請廣成子在崆峒山黃帝順下風膝行進而問道三年笛裏關山月洙曰虞蕩胡笳関下思羗笛隴頭鳴黃曰風月者平時可娯之物臨風對月足快人意關山者家郷所在也萬國兵前草木風修可曰周王襃燕歌行云無復漢地関山月唯有漠北薊城雲也蘇曰趙肅萬國兵革振動如雄風偃草木其悲聲非一成王功大心轉小洙曰文王小心翼翼時成王爲元帥鮑曰乾元元年徙封俶爲成王郭相謀深古來少洙曰郭子儀也司徒淸鑒懸明鏡洙曰言李光弼尚書氣與秋天杳洙曰指言僕固懷㤙蘇曰晏子歸謂諸大夫曰司寇氣論杳若秋天明月誰可量其逺近髙下趙曰尚書指言王思禮本傳長安平思禮先入淸宫收東京戦數有功遷兵部尚書江子之以尚書爲房琯非是劉曰按至徳元載十月琯用車戦以敗二載琯罷相卒貶琯邠州刺史舊注作懷恩非是秦曰據本傳復雨京懷恩雖有功止詔加鴻臚卿其後乾元二年方召入爲工部尚書今公詩是收復兩京後豈却是懷恩耶二三豪俊爲時出整頓乾坤濟時了東走無復憶鱸魚彦輔曰張翰見秋風起乃思呉中蓴羹鱸魚遂命駕東歸呉時人號爲江東歩兵矣南飛覺有安巢鳥洙曰古詩越鳥巢南枝曹子建詩願隨越鳥飜南翔趙曰曹曰運籌帷幄之中吾不如子房謝宣逺張子房詩婉婉幕中畫張公一生江海客身長九尺鬚眉蒼蘇曰謂張鎬也蕭嵩薦之曰用則帝王師不用則窮谷一叟耳十朋曰東坡云乆困江湖不見偉人昨在金山滕元發以扁舟破巨浪出船巍然使人神聳好个没興底沈曰唐舊史云蕭昕與鎬友善表薦之曰如鎬者用之則爲王者師不用則幽谷之叟爾玄宗擢鎬爲拾遺不數年出將入相徴起適遇風雲㑹洙曰二十八將論咸能感㑹風雲扶顚始知籌䇿良洙曰語顚而不扶靑𫀆白馬更何有定功曰庾信哀江南賦曰青𫀆如草白馬如練後漢今周喜再昌寸地尺天皆入貢竒祥異瑞爭來送不知何國致白環洙曰丘希範書白環西獻楛矢東來顔延年歌亘地稱皇罄天作主月毳來賔日際奉王丗本曰舜時西王母獻白環及佩復道諸山得銀甕洙曰禮運山出器車注器車謂若銀甕丹甑隱士休歌紫芝曲安石曰皇甫謐髙士傳秦丗道㓕徳消坑黜儒術四皓於是退而作歌曰莫莫髙山深谷逶迤曄曄紫芝可以療飢唐虞丗逺吾將何歸駟馬髙蓋其憂甚大富貴之畏人兮不如貧賤之肆志乃共又啇洛隱地肺山秦滅漢髙帝徴之不至深入終南山不能屈也詞人解撰河淸頌歐陽曰鮑昭字明逺元嘉中河濟俱清當時以爲美瑞昭爲河清頌趙曰公詩言此者是嵗旣収京而於七月嵐州合關河黃河三十里淸如水蓋収京之祥實事也田家望望惜雨乾鄭曰居乾切布榖處處催春種洙曰布榖鳴鳩也趙曰楊惲云田家作苦故對布榖催耕之鳥淇上健兒歸莫懶眺曰時思明餘黨未殄故衛相等州尚留兵屯故甫有淇上健兒之句城南思婦愁多夢洙曰東山詩三章言室家之望女也婦嘆于室安得壯士挽天河洙曰梁沈約詩安得壯士馳奔波後漢李亢九歌安得壯士翻日車蘇曰蜀相劉文静曰方今鼎足宇宙鑊居黎氓烏得五丁壯土挽回天河洗滌天下之甲兵車書一同凶器長不用皇天后土豈不知區區之誠哉孔明賢之淨洗甲兵長不用洙曰武王伐紂大雨洗兵往在往在西京時胡來滿彤宫魯曰胡禄山也中霄焚九廟洙曰天子九廟趙曰彤宫天子之宫也天子七廟而王莽増爲九廟今云九廟以其盛者言之也此篇首述明皇天寳十五載安禄山䧟長安也雲漢爲之紅解瓦飛十里繐帷紛曽空洙曰繐帷廟中素帷也疚心惜木主一一灰悲風洙曰疚心心如有疾也木主神主也史記武王伐紂載木主而行合昏非鐡騎清旭散錦􅐒洙曰一云幪鄭曰􅐒亡東切驢子也修可曰古樂府紫騮馬曲玉鞍繡纏騌金鞍覆錦幪錦幪鞍帕也賊臣表逆節相賀以成功是時妃嬪戮連爲糞土叢洙曰王昭君辝昔爲匣中玉今爲糞土英當宁䧟玉坐洙曰玉坐帝坐也時禄山及吐蕃兩䧟京也天子出奔趙曰天子當宁而立謝玄暉銅萑䑓詩玉座猶寂寞舊注言吐蕃䧟京邑則代宗事非是玉座帝座也時禄山及吐蕃兩䧟京邑天子出奔也白間剥畫蟲定功曰何平叔景福殿賦皎皎白間離之列錢晨光内照流景外埏張詵注曰白間牎也以白塗之畫以錢文猶言綺䟽青瑣之類師曰白間黼扆也畫蟲畫雉以飾之不知二聖處洙曰玄宗肅宗私泣百歲翁車駕旣云還楹角歘穹崇洙曰代宗自陜還先修九廟楹角廟楹也魯丹楹刻桷也趙曰此述肅宗至德二載復京師也舊注又以代宗廣德元年十二月事亂之矣左傳丹楹刻桷也師曰歘忽也穹崇髙貌故老復涕泗祠官樹椅桐鄭曰椅於冝切梓類師曰守祠之官種此木將以興禮樂宏壯不如初巳見帝力雄洙曰時屢臻䘮亂國力凋敝雖未及未焚之前而巳見帝力之雄矣前春禮郊廟祀事親聖躬趙曰此述乾元元年朝享于太廟有事于南郊也微軀忝近臣黃曰甫爲拾遺諌官得以親近天子故曰近臣景從陪羣公鄭曰景於景切從才用切洙曰廣徳元年吐蕃䧟京師代宗幸陜是年子儀収復帝還京二年春享廟及郊新舊唐史皆不載甫官夢符曰右按文選東都賦云天官景從祲威盛容登堦捧玉冊洙曰玉冊冊文也峩冕耿洙曰一云聆金鍾趙曰聆舊本作耿非也聆盖言聆金奏也峩冕聆金鍾則奉祠者具法服也侍祠恧先露鄭曰恧女六切慚貌掖垣邇濯龍洙曰侍祠之官恧暴露猶假濯龍門即宗廟未至全備爾夢符曰右按後漢桓帝祠老子於濯龍宫以文罽爲壇飾黃金爲缷器設華盖之座趙曰得預其事者爲榮其有合預侍祠而不幸先露所以慙恧矣史有先朝露以言臣之不幸也紫垣者紫掖之垣也濯龍池名也薛綜注載洛陽圖經曰濯龍池名故歌曰濯龍望如海河橋渡似雷天子惟孝孫五雲起九重洙曰韓愈賀慶雲表按沈約宋書云慶雲五色者太平之應又據孝經援神契曰王者徳至山陵則慶雲出昱曰選恩幸論九重奥絶鏡奩換粉黛昱曰奩音廉盛晉器又鏡奩也翠羽猶䓗曨洙曰光烈隂皇后名麗華崩葬原陵明帝性孝愛追慕無巳時當謁原陵夜夢先帝太后如平生歡旣寤悲不能寐即按曆明旦日吉遂率百官及故客上陵其日降甘露於陵樹帝令百官採取以薦㑹畢帝從席前伏御牀視太后鏡奩中物感慟悲涕令易脂澤裝具左右皆泣莫能仰視趙曰鏡奩乃供后廟神御之物也翠羽乃飾神御之物也出曹子建詩或拾翠羽前者厭羯胡洙曰明皇禄山䧟長安後來遭犬戎洙曰代宗吐蕃䧟長安俎豆腐洙曰一云臠膻肉罘罳行角弓鄭曰罘房尤切罳新慈切蒼舒曰漢書文帝紀云七年夏六月未央宫東闕罘罳災崔豹古今注云罘罳屏也罘者復也罳者思也言臣朝君至屏外復思所奏之事於其下顔師古注云罘罳謂連闕曲閣也以覆重刻垣墉之處其形罘罳然一曰屏也又禮記云䟽屏天子之廟飾也鄭注云屏謂之樹今浮思也刻之爲雲氣蟲獸如今闕上爲之矣按唐蘇鶚演義稱罘罳織絲爲之輕疎浮虚象羅網交文之狀蓋宫殿簷户之間也乃引文宗實録云太和中甘露之禍羣臣奉上出殿北門裂断罘罳而去又引温庭筠𥙷陳武帝與王僧辨書云罘罳晝卷閶闔晨開爲證皆非曲閤屏障之意反以崔豹師古之徒爲大誤又按叚成式酉陽雜俎稱上林間多呼殿榱桷護雀網爲罘罳其淺誤也如此乃引張揖廣雅曰復思謂之屏又王莽性好時日小數遣使壞渭陵延陵園門罘罳曰使民無復思漢也又按魚豢魏略曰黃初三年築諸門闕外罘罳爲證反以鋒網之說爲大謬余謂二說皆通以罘罳爲網則結繩爲之施於宫殿簷楹之間如蘇鶚之說是也以罘罳爲屏則刻木爲之施於城隅門闕之上如成式之言是也然就二說之中叚氏之說爲長按五行志注云罘罳闕之屏也玉篇云罘罳屏樹門外也又曰罘罳罟也但屏上彫刻爲之其形如網罟之狀故謂之罘罳音浮思則取其復思之義耳漢西京罘罳合版爲之亦築土爲之毎門闕殿舎前皆有焉于今郡國㕔前亦樹之安得自西極申命空山東盡驅詣闕下士庶塞關中主將曉逆順元元歸始終趙曰言令始終歸順爲王之臣也一朝自罪已洙曰見思聞罪已詔注趙曰禹湯罪已其興也勃焉萬里車書通余曰記中庸天下書同文車同軌後漢光武車書共道鋒鏑供鋤犂征伐聽所從趙曰供鋤犂則以兵器爲農器也聽所從則不復拘留之以爲征戍而聽其所從或爲農或爲民也冗官各復業蘇曰黃忠放冗官瑣材盡歸農業免虚耗府庫土著還力農鄭曰著直略切趙曰當用兵擾攘之際有冗監爲官者各令復業土着戸口前日失耕種者今還力穡以爲農也君臣節儉足朝野懽呼同洙曰呼一作娱食貨志安民之道土著爲本張景陽詩昔在東都時朝野多歡娯中興似國初繼體如太宗端拱納諌諍蘇曰趙襄了清穆端拱開納諌諍計直之臣和風日冲融赤墀櫻桃枝隱映銀絲籠千春薦陵寢永永垂無窮洙曰薦桃言奉宗廟無所窮極也定功曰月令仲夏之月羞以含桃先薦寢廟注櫻桃也漢惠帝出離宫叔孫通曰古者春秋甞菓方今櫻桃可獻願陛下出因取櫻祧獻宗廟唐李綽歲時記四月一日内園准櫻桃寢廟薦訖頒賜各有差京都不再火涇渭開愁容歸號故松栢歐曰使京師奠枕涇渭之民頓豁愁容得以歸號墳墓也老去若飄蓬趙曰庾信燕歌行云千里飄蓬無復根歐曰惟甫衰老若飄蓬然不獲還故郷故自傷也靑絲靑絲白馬誰家子洙曰樂府有白馬篇梁呉筠白馬黃金覊梁元帝宛轉青絲鞚趙曰靑絲所以言鞚也南史侯景傳𥘉大同中童謡曰靑絲白馬壽陽來及景之叛乗白馬靑絲以應䜟麤豪且逐風塵起洙曰風塵喻亂蘺也鮑曰豈懷恩之反有從亂者也趙曰風塵多以言征戰言盗賊而云逐風塵則乗此爲盗者不聞漢主放妃嬪洙曰誅貴妃也近靜潼関掃蜂蟻趙曰此公戒約麄豪子之辭殿前兵馬破汝時十月即爲韲粉期韲祖稽切洙曰韲粉言破碎若韲粉也趙曰告以必破亡之證也韲粉出莊子云宋王之猛非直驪龍也子能得車者必遭其睡也使宋王而寤子爲韲粉夫韲之爲言若以爲韲粉之爲言散全物爲屑舊注謂破碎若韲粉非是未如面縳歸金闕洙曰如又作知欲其歸降天子也左傳克許許子面縳衘璧萬一皇恩下玉墀洙曰時降者皆受節鎮河北之患自此起矣趙曰教以悔過歸命而庶幾皇恩寛宥之也此篇蔡伯丗曰以爲五谷盗賊事其說是按通鑑廣徳二年吐蕃入長安諸軍亡卒及郷曲無頼相聚爲盗丁巳以太子賔客薛景仙討之所以有殿前兵馬破汝時之句也師曰靑絲爲絡頭麄豪且逐風塵起謂禄山反不逞之徒皆起附爲亂漢王放妃嬪喻肅宗誅楊貴妃斥宫人也近靜潼関掃蜂蟻哥舒翰守潼関爲賊所破遂䧟兩京肅宗鳩義兵收復兩京如掃蜂蟻然殿前兵馬乃神䇿軍天子親征羣盗望風而敗恐碎若韲粉不如前期背縳歸降京師尚有見赦之理時賊黨來降帝復授以節鎭終唐之丗藩鎭䟦扈者蓋由此也近聞近聞犬戎逺遁逃洙曰說文解字曰赤狄本大種也故字犬子匈奴聞漢兵大出老弱奔走歐畜産逺遁逃蕭望之白狄遁逃竄伏趙曰犬戎此指言吐蕃也牧馬不敢侵臨洮洙曰臨洮郡名也賈誼過秦論胡人不敢南下而牧馬蘇曰班超鎮西醜虜屈膝不敢南向牧馬趙曰今之洮州也渭水逶迤白日淨隴山蕭瑟秋雲髙趙曰選有紆餘逶迤蓊茸蕭瑟崆峒五原亦無事此庭數有關中使洙曰言通知也趙曰突厥通好也或云回紇等不附吐蕃亦遣使中國其說亦是似聞賛普更求親洙曰賛普吐蕃也夢符曰右按唐吐蕃傳其俗謂強雄曰賛大夫曰普故號君長賛普今西域有籛逋者即賛普之聲訛而爲籛逋也趙曰先帝昔甞和親以公主嫁賛普矣吐蕃本西羗屬其俗謂強雄曰賛大夫號君長曰賛普舅生和好應難弃漁陽彦輔曰時禄山平以雍王遥領范陽盧龍節制而不出閣趙曰按通鑑十月以雍王适爲天兵馬元帥舊注以雍王受節制而不出閣非是漁陽突騎猶精銳鮑曰光武曰吾聞漁陽上谷突騎天下精兵趙曰此指雍王所統之兵修可曰引漢光武謂馬武曰吾聞魚陽上谷突騎欲令將軍將之又引唐六典注蔡邕曰冀州強弩幽州突騎天下之精也其說是赫赫雍王都節洙曰一作前制猛將飄然恐後時本朝不入非髙計洙曰禄山巳破而朝廷不能革其積敝復以盧龍授蕃鎭故李懷仙朱滔之屬得以跋扈竟不爲朝廷所有也蘇曰李靖西羗犯塞若不深入虜庭擣其巢穴實非髙計趙曰按編年通載十月雍王适大敗史朝義將以汴州降十一月薛嵩等皆以五州降是歲公在梓聞雍王之勝尚聞河北猶未有入朝者故告諭諸將等飄然而來巳爲後時而乃不入本朝豈髙計乎舊注殊不考按乃云禄山巳破而復以盧龍受藩鎭故李懷仙朱滔之屬得以䟦扈非也按朱滔反乃是徳宗建中三年李懷光反乃是徳宗興元元年以雍王适爲雍王遥李懷光爲懷仙此皆顛倒錯亂疑悮學者此不得不辨也禄山北築雄武城舊防敗走歸其營繫書請問燕耆舊今日何須十萬兵洙曰按新書言禄山計天下可取逆謀日熾遂乃築壘范陽北號強武峙兵積榖趙曰魯仲連繫書約矢以射聊城中也此篇上兩句舉往事以懲警之也言禄山初爲走計而竟不保耳黃河二首鮑曰黄河北岸海西軍胡人髙鼻動成羣謂吐蕃入宼舊注謂禄山非也黄河西岸是吾蜀鄭公軍也謂當狗之戰舊注謂明皇肅宗非也黃河北岸海西軍椎鼔鳴鐘天下聞鐡馬長鳴不知數胡人髙鼻動成羣洙曰禄山之反皆漁陽突騎及所養同羅降奚契丹曳落河并誘置諸蕃皆胡騎也趙曰黄河之北大海之西則河北一帶之州郡也此篇言椎鼓鳴鍾躰面如此至使胡人動成羣而來縣乃罪其不能致力於禦之乎李陵重報蘇武書云吟嘯成羣聽之不覺淚下黃河西岸是吾蜀欲須供給家無粟願驅衆庶戴君王混一車書弃金玉洙曰時明皇在蜀肅宗起霊武趙曰此篇憫蜀人困於供給而終之以願君王之無侈靡也如傳云不寳金玉之義自平自平宮中吕太一洙曰吕太一代宗時爲廣南市舶使逐刺史張休而反蘇曰自平宫中吕大一丗莫曉其義而妄者以謂唐有自平宫偶讀玄宗實録有宫中吕太一叛於廣南故下有南海收珠之句定功曰宫中當作中官見舊唐史帝紀收珠南海千餘日近供生犀翡翠稀洙曰時太一反賦不上倛也復恐征戍干戈密蠻溪豪族小動摇蘇曰蘇漸今黔旋蛮皃小有揺動亦須數年不止兵革日平丗封刺史非時朝洙曰時溪洞蛮酋㱕順者皆丗授刺史蓬萊殿裏諸主將才如伏波不得驕趙曰言汝軰才如馬伏波可以辦征南之事而輒不得驕悍也師曰東坡嘗云讀杜詩不識太一之義及覧拾遺見有吕寕爲太一宫使領廣南市舶逐刺史張休而叛乃曉太一非人名宫號也廣連蛮洞守官者不務懷輯則羣蛮相率而叛珠璣犀象翡翠之類所以不來貢也自平吕太一之後節制者得其人是以南海收珠几三載矣近來供貢稀少復恐鎮守者不能懷柔妄舉兵征誅羣蛮此羣蛮不復來貢矣唐太宗之時應溪蛮來㱕者皆封刺史不以時朝不比内諸侯姑務羈縻而巳是以蛮洞畏威懷徳盖太宗時諸將之才率類馬援故不敢驕慢悖命傷今不然昔漢馬援爲伏波將軍羣蛮畏服歲晏行歲云暮矣多北風瀟湘洞庭白雲中漁父天寒網罟凍莫徭射鴈鳴桑弓定功曰隋地理志長沙郡雜有夷蜑名曰莫徭自言其先祖有功常免徭役故以爲名去年米貴闕軍食今年米賤大傷農洙曰榖貴則傷民榖賤則傷農髙馬逹官厭酒肉此輩杼軸茅茨空洙曰言在位者不知爲政但厭酒肉而巳詩大東小東國困於役而曰杼軸其空注言其政偏失砥矢之道然也楚人重魚不重鳥洙曰一作肉蘇曰風俗通云呉楚之人嗜魚塩不重禽獸之肉汝休枉殺南飛鴻况聞處處鬻男女割慈忍愛還租庸洙曰唐制授人以口分丗業田凡授田者丁歲納粟稻謂之租用人之力歳不過二十日不役者日爲絹三尺謂之庸時民力困故於是有鬻男賣女以還租庸調者往日用錢捉私鑄今許洙曰一云來鈆錫和靑銅刻泥爲之最易得好惡不合長相蒙洙曰唐制盗鑄錢者死没其家属至天宝間盗鑄益甚雜以鐡錫無復錢秦王旣平天下乃銳意經籍於宫城之西開文學館以待四方之士於是以杜如晦房玄齡並以本官兼弘文館學士圖其形狀且顯爵士命褚亮爲像贊藏之書府號十八學士給五品珍繕分爲三番更直宿干閣下預入閣者時人謂之曰登瀛洲青襟胄子困泥塗白馬將軍若雷電洙曰時方貴武而賤文也定功曰魏寵徳毎戰每䧟陣与関羽交戦射羽中額時徳常乗白馬羽軍時謂白馬將軍若雷電則言馬之駿驟大意言武人之寵幸故其威勢如此千載少似朱雲人至今折檻空嶙峋洙曰朱雲請上方斬馬劒以斬佞臣張禹帝怒將雲下欲斬之雲攀檻檻折後欲理檻帝曰勿理故以旌直臣也修可曰左太冲魏都賦造文昌廣極棟宇之規榱題黮􅩙階􅿄嶙峋注嶙峋髙也鄭曰嶙離玲珣思遵切深崖皃婁公不語宋公語尚憶先皇容直臣洙曰婁師徳宋璟也言互以正救爲心張嘉貞代璟爲相閱堂按見其危言讜議未甞不失声歎息也天邊行天邊老人歸未得蘇曰陳秀漂泊西平秋月自嘆鴻燕皆帰天邊老人尚困逆旅悽愴日暮東臨大江哭隴右河源不種田胡騎羗兵入巴蜀洙曰大曆中吐蕃三道入寇誡其衆曰吾要蜀川爲東府連䧟郡邑而士庶奔亡山谷趙曰廣徳元年吐蕃䧟隴右而河源不種矣十二月䧟松維保三州則八邑蜀矣洪濤滔天風拔木洙曰洪濤滔天言民罹昏墊也項王圍漢王大風拔木前飛秃鶖後鴻鵠趙曰鶖音秋水鳥也九度附書向洛陽十年骨肉無消息師曰甫客居天邊遣兵馬之亂帰郷不得寕不悲傷時吐蕃分爲三道入寇一自隴右一自河源一自巴蜀田畒廢而不耕蜀中騷動故甫思欲附鶖鶬鴻鵠奮飛以帰郷蓋有所不得也洪濤滔天風拔木喻天下兵革不寕民罹墊溺之患也鶖鶬九頭鳥大麥行大麥乾枯小麥黃婦女行泣夫走藏洙曰見崆峒小麥熟注東至集壁西梁洋洙曰集壁梁洋皆蜀地州郡谷問誰腰鎌胡與羗趙曰此又言吐蕃与向紇也鮑明逺東武吟腰鎌刈葵藿倚杖牧雞豚豈無蜀兵三千人洙曰一云千人去部領辛苦江山長安得如鳥有羽翅託身白雲還故郷師曰古詩云小麥青大麥枯誰當獲者婦与姑大夫何在西擊胡集壁梁洋四州名時吐蕃入宼四州之民皆奔竄山谷腰鎌穫麥惟羌与胡而已時杜鴻漸以蜀兵三千遏賊衝突江山險澁士卒至有介胄生䖝而不得休息者故云部領辛苦江山長苦戰行苦戰身死馬將軍自云伏波之子孫干戈未定失壯士蘇曰牛繪戦死張光嘆曰天下未安兵戈尚尓遽失壯士仰天悲悼趙曰伏波漢馬援也吐蕃去冬䧟松維保三州則干戈豈便息邪使我歎恨傷精魂蘇曰山濤曰嵆中散就誅使我失精神歎憤而巳去年江南討狂賊臨江把臂難再得别時孤雲今不飛時獨看雲淚橫臆鮑曰謂叚子璋戦遂州時公与此事送別江上今其人死矣故有感而作遂州在涪江少南故云江南也趙曰倣李陵与蘇武詩曰良時不再至離別在須臾屏營衢路側執手野踟蹰仰視浮雲馳奄忽互相踰師曰漢馬援爲伏波將軍甞云大丈夫當死邊野以馬革褁尸而帰唐馬璘讀漢書至此嘆曰使吾祖勲業墜地乎時馬璘与吐蕃戦没失囯家壯士甫是以傷之去年江南討狂賊謂於涪江之南討叚子璋之乱也時甫与馬將軍訣別把臂今傷其死狄仁傑嘗望白雲孤飛曰吾親在其下甫悵望去年別処見雲飛故思其人而淚下横胷去秋行魯曰時段子璋反於東川去秋涪江木落時臂搶走馬誰家兒蘇曰王宏見陸景曰彼陣前臂搶走馬往來返逐者誰家小兒得如此俊偉到今不知白骨處部曲有去皆無歸洙曰見部曲異平生注遂州城中漢節在遂州城外巴人稀鮑曰上元二年四月劒南節度兵馬使段子璋反䧟緜州遂州刺史嗣號王巨死之節度李奐奔于城都故詩云遂州城中漢節在蓋傷之也趙曰意兵敗績而死亡者多故有巴人稀之實戰塲冤䰟毎夜哭空令野營猛士悲師曰部曲行伍部有曲昔漢蘇武使匈奴凡十九年留匈奴中行卧常持漢節時馬璘死於吐蕃持節而死巴人屯守遂州城外吐蕃兵攻遂州巴人死盡故云巴人稀光禄坂行山行落日下絶壁西望千山萬山赤洙曰山一作水謝靈運日落山照曜樹枝有鳥亂鳴洙曰一作棲時暝色無人獨歸客洙曰謝霊運林壑歛瞑色馬驚不憂深谷墜草動只怕長弓射鄭曰食亦切安得更似開元中洙曰一云開元年鄭棨傳信記云開元𥘉上勵精理道不六七月天下大治安西諸國悉平爲郡縣行者不囊糧上猶楊厲未巳道路即今多擁隔洙曰白日賊多翻是長弓子弟鮑曰按崔寕傳寳應𥘉蜀亂山賊乗險道路不通與此詩合北風北風破南極洙曰北隂也南陽也北風破南極喻小人道長而見君子道消也朱鳯日威洙曰一作低垂洙曰喻君子不得志洞庭秋欲雪鴻鴈將安歸洙曰喻小人道盛而君子無所歸也蘇曰諸葛瑾曰方今南北鼎沸東西兵革不止冥冥之鴻鴈吾与汝將安歸趙曰南極所以言楚地北風破南極而鳯威垂洞庭秋雪而鴻鴈安歸此言值時如此於是乎失所也威垂無氣象之貌非惟舊注穿鑿而近有東溪先生云北風悲燕謂寇來自北故以爲况不知此詩乃大曆三年作也言吐蕃則可豈可更言燕寇之亂王室乎又豈有寇自北來之事乎恐惑後斈不得不爲之辨十年殺氣盛六合人煙稀洙曰言碊敝也蘇曰劉述曰強秦旣衰鹿走中原劉項並起兵戈沸海人煙稀少吾慕漢𥘉老時淸猶茹芝洙曰漢𥘉老隱者也蘇曰漢𥘉老四皓之徒也龐徳公云時淸物阜吾亦茹芝木趙曰自天寳十四年至此十三年矣而云殺氣盛則舉其大數耳商山四皓避秦之亂方漢之𥘉可以出矣而猶茹芝焉則以畏禍之心未能巳也客從客從南溟來遺我泉客珠珠中有隱字欲辨不成書趙曰此言珠從來不易得其中若自言之者蓋泉客珠事任昉述異記海南鮫人室水居如魚不廢機織其眼泣則出珠鮫人即泉仙也又名泉客緘之篋笥乆以俟公家須開視化爲血哀今徴斂無趙曰必用泉客珠言其珠從眼泣所出也至於化爲血矣猶慮公家之徴斂而無以供之頃與蔡伯丗同定此詩乃爲潭州作而東溪先生以爲安史之際不知安史至是巳滅七年矣大非也師曰此詩寓意公家徴斂而索其所無有之物詩云俾出童羖是也白馬白馬東北來空鞍雙貫箭可憐馬上郎意氣今誰見近時主將戮中夜商洙曰商或作傷於戰蘇曰張儀欺楚止以商於之地鮑曰商州也崔屬楚楚丗家注在今順陽郡南郷丹水二縣有商城在於水中乃知商於爲啇州即張儀欺楚王之地也趙曰此篇記事之作蔡伯丗曰乃潭州詩主將謂崔灌也公自潭州如長沙而逢亂按九域志衡州北至州界乃潭州以公自南而北言之則所見之馬爲東北來矣東溪先生誤以主將之戮爲禄山之亂而又以白非戰馬昔侯景之亂舉軍皆白馬青𫀆而謂非戰馬可乎䘮亂死多門嗚呼涕如霰趙曰商於當作傷於按商於山名在虢州與此潭州之亂无相干断不可取屈原九歌哀郢篇云涕淫淫其如霰師曰江文通雜躰詩云日暮浮雲滋握千涙如線梁簡文帝述覇賦孟夏守節雄風吹甸晚解䌫乎郷津涕淫淫其若霰商於楚地此詩殆爲永王璘叛於楚而作故有中夜商於戰之句三絶句前年渝州殺刺史今年開州殺刺史鮑曰崔寧傳所書山賊也前年渝州殺刺史謂叚子璋䧟綿遂今年開州殺刺史謂徐知道之反有乗亂者開去成都逺不知其故史不書失之羣盗相隨劇虎狼趙曰張孟陽云賊盗如豺虎食人更肯留妻子師曰歩將呉璘殺渝州刺史劉卞以反杜鴻漸討平之又部卒翟封殺開州刺史蕭崇之以叛楊子琳討平之兩川盗賊乗隙而發虎狼喻盗賊也劇甚也甫疾其亡上下之分以爲甚於豺狼是以有呉楚之遊二十一家同入蜀唯殘一人出駱谷蘇曰十道至云駱谷道西南界入洋州路蜀將姜維出駱谷圍長安即此也屬盭屋趙曰魏至姜維出駱谷圍長安即此谷道也自說二女齧臂時洙曰丗說趙飛燕姊弟少貧微及飛燕見召與女弟齧而别廻頭却向秦雲哭帥曰禄山亂百姓隨玄宗入蜀凡二十一家後出駱谷但存一人飢困蜀亂勦盡甫聞其說自傷妻子皆幸免是以回頭望蜀而哭痛斯民之不得其所也殿前兵馬雖驍雄鄭曰驍堅堯切縱暴略與羗渾同洙曰時神策軍恣横聞道殺人漢水上婦女多在官軍中師曰吐谷渾西羗之種也殿前兵馬乃王師王者之師奉辭伐罪以吊其民秋毫無撓時天子命睦璀以三千神策軍彈壓蜀中之亂奈何神䇿軍横恣虜掠婦女其殘暴更甚於羗渾百姓怨之甫傷朝廷政治不明縱使殿前之兵搔動良民若此豈所謂王師吊民伐罪者乎分門集註杜工部詩卷第十四, WYG: ''}
