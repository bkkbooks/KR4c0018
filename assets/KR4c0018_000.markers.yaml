先生寄題草堂云經營上元始斷手寶應年然則先生之來成都殆上元之初乎嚴武入朝先生送武至巴西遂如梓州蜀亂乃之閬州將遊荆楚會武再鎮兩川先生乃自閬州挈妻子歸草堂武辟先生爲叅謀武卒蜀又亂先生去之東川移居䕫州遂下荆渚泝沅湘上衡山卒於耒陽先生以詩鳴於唐凡出處去就動息勞佚悲懽憂樂忠憤感激好賢惡惡一見於詩讀之可以知其丗學士大夫謂之詩史其所遊歷好事者隨處刻其詩於石及至成都則闕然先生之故居松竹荒凉略不可記今丞相吕公鎮成都復作草堂於先生之舊址繪先生之像於其上假符於此乃録先生之詩刻石置於草堂之壁間先生雖去此而其詩之意有在於是者亦附其後庶幾好事者於以考先生去來之迹云元祐庚午資政殿學士中大夫知成都軍府事胡序王彦輔序曰唐興承陳隋之遺風浮靡相矜莫崇理致開元之間去雕篆黜浮華稍裁以雅正雖絺句繪章人得一槩爭各所長如大羮元酒者則薄滋味如孤峯絶岸者則駭廊廟穠華可愛者乏風骨爛然可珍者多玷缺逮至子美之詩周情孔思千彚萬狀茹古涵今無有端涯森嚴昭煥若在武庫見戈㦸布列蕩人耳目非特意語天出尤工於用字故卓然爲一代冠而歷丗千百膾灸人口予毎讀其文竊苦其難曉如義鶻行巨顙拆老拳之句劉夢得𥘉亦疑之後覽石勒傳方知其所自出蓋其引物連類掎摭前事往往而是韓退之謂光𦦨萬丈長而丗號爲詩史信哉予時漁獵書部甞妄注緝且十得五六官遊南北因循中輟投老掛冠杜門家居日以無事行樂之暇不度蕪淺旣次其韻因閲舊注惜不忍去捜考所知再加鐫釋然予不幸病目無與乎簡牘之觀遂命子澂洎孫端仁參夫討繹俾之編綴用償夙志尚愧孤陋未臻詳盡在昔聖人猶曰有所不知丘蓋闕如顧惟聞見之寡兹所不免但藏篋中以貽來裔非敢示諸博古之君子按鄭文寳少陵集張逸爲之序又有蜀夲十卷自王原叔内相再編定杜集二十卷後姑蘇守王君玉得原叔家藏於蘇州進士何瑑丁脩處及今古諸集相與參考乃曰義有兼通者亦存而不敢削故予之所注以蘇本爲正云時洪宋八葉明天子之在御政和紀元之三禩下元日序嘉興魯訔序曰騷人雅士同知祖尚少陵同欲模楷聲韻同苦其意律深嚴難讀也余謂少陵老人𥘉不事艱澁左隱以病人其平易處有賤夫老婦所可道者至其深純宏妙千古不可追跡則序事穩實立意渾大遇物冩難狀之景紓情出不說之意借古的確感時深逺若江海浩漾風雲蕩汨蛟龍黿鼉出没其間而變化莫測風澄雲霽象緯回薄錯峙偉麗細大無不可觀離而序之次其先後時危平俗媺惡山川夷險風物明晦公之所寓舒局皆可槩見如陪公杖屨而遊四方數百年間猶對面語何患於難讀邪名公巨儒譜叙注釋是不一家用意率過異說如蝟余因舊集略加編次以古詩近體一其後先摘諸家之善有考於當時事實及地理歲月與古語之的然者聊注其下若其意律乃詩之六經神會意得隨人所到不敢易而言之叙次旣倫讀之者如親罹艱棘虎狼之慘爲可驚愕目見與時甿庻𬒳削刻轉塗炭爲可憫因感公之流徙始而適中而瘁卒至於爲少年輩侮怱以訖死爲可傷也紹興癸酉五月晦日丹丘冷齋序鄭卬序曰讀少陵詩如馳騖晉楚之郊以言其髙則鄧林千巖楩楠𣏌梓扶踈摩雲以言其深則溟波萬頃蛟龍黿鼉徜徉排空拭眥極目方且心駭神悸莫知所以若其甄别名狀實難爲功韓退之推其光熖萬丈長殆謂是矣國家追復祖宗成憲學者以聲律相飭少陵矩範尤爲時尚於其淹貫羣書比類賦象渾涵天成竒文險句厭人目力讀者未始不以捜㝷訓切爲病卬近因與二三友質問爰就隱奥處著爲音義至夫人物地理古今傳志咸極討論施之新學不亦可乎時紹興改元歳次辛亥長至後五日長樂鄭卬序王安石序曰予考古之詩尤愛杜甫氏作者其辭所從出一莫知窮極而病未能學也丗所傳巳多計尚有遺落思得其完而觀之然每一篇出自然人知非人之所能爲而爲之者惟其甫也輙能辯之予之令鄞客有授予古之詩丗所不傳者二百餘篇觀之予知非人之所能爲而爲之實甫者其文與意之著也然甫之詩其完見於今者自予得之丗之學者至乎甫而後爲詩不能至要之不知詩焉爾嗚呼詩其難惟有甫哉自洗兵馬下序而次之以示知甫者且用自發焉皇祐壬辰五月日臨川王安石序温陵宋冝序曰詩之言生乎志而言之聲出乎情自變風作而志之形於言與夫情之發於聲者雖感憤憂思之成文而尚可以和金石諧律吕而爲聖人之所取也及夫先王之澤竭雖有作者浮虚之相矜綺靡之相勝而無復風雅之正矣唐之時以詩鳴者最多而杜子美逈然特異相望數千載之間而獨得古人之大體其詞曲而中其意肆而隱雖怪竒偉麗變態百岀而一之於法度不幾於古之言志而詠情者歟惜乎遒人之不見采而子美不見知於上愈窮而愈工然丗之所傳尚有遺落而不完頃者處士孫正之得所未傳二百篇而丞相荆公繼得之又増多焉及觀内相王公所校全集比於二公互有詳略皆從而爲之序故子美之詩僅爲完備近丗取士壹於經術而風騷之學有所不暇雖幽居閑放之人時或諷味而皆鄙俚陳近之辭求其知子美者蓋寡矣豈子美之詩深逺而難知邪抑其篇章之浩博而難窮考邪今兹退休田里始得陳君浩然授予子美詩一編乃取其古詩近體析而類之使學者恱其昜覽得以㳂其波而討其源也予嘉陳君有志於詩而惟子美之爲嗜則可謂篤於詩學者矣因其請而爲之序云元豐五年二月二十三日序孫僅序曰五常之精萬象之靈不能自文必委其精萃其靈於偉傑之人以渙發焉故文者天地真粹之氣也所以君五常母萬象也縱出横飛疑無涯隅表乾裏坤深入隱奥非夫腹五靈精心萬象靈神合冥㑹則未始得之也夫文名一而所以爲用之者三謀勇正之謂也謀以始意勇以作氣正以全道苟意亂思率則謀沮矣氣萎體瘵則勇䘮矣言蒭辭蕪則正塞矣是三者迭相羽翼以濟乎用也備則氣淳而長剥則氣散而涸中古而下文道繁冨風若周騷若楚文若西漢咸角然天岀萬丗之衡軸也後之學者瞽實聾正不守其根而好其葉由是日誕月艶蕩而莫返曹劉應楊之徒唱沈謝徐庾之徒和之爭柔闘葩聮組擅繡萬鈞之重爍爲錙銖眞粹之氣殆將滅矣洎夫子之爲也剔陳梁亂齊宋抉晉魏瀦其淫波遏其煩聲與周楚西漢相凖的其夐邈髙聳則若鑿太虚嗷萬籟其馳驟怪駭則若仗天䇿而騎箕尾其首截峻整則若儼鈎陳而界雲漢樞機日月開闔雷電昂昂然神其謀挺其勇握其正以髙視天壤趨入作者之域所謂真粹氣中人也公之詩支而爲六家孟郊得其氣熖張籍得其簡麗姚合得其清雅賈島得其竒僻杜牧薜能得其豪健陸龜蒙得其贍愽皆出公之竒偏爾尚軒軒然自號一家爀丗烜俗後人師擬不暇矧合之乎風騷而下唐而上一人而巳是知唐之言詩公之餘波及爾於戲以公之才冝器大任而顛宼虜汨没蠻夷者屯於時耶戾於命耶將天嗜厭代未使斯文大振耶雖道振當丗而澤化後人斯不朽矣因覽公集輙洩其憤以書之王琪曰近丗學者爭言杜詩愛之深者至剽掠句語迨所用險字而模畫之沛然自以絶洪流而窮深源矣又人人購其亡逸多或百餘篇少或數十句藏去矜大復自以爲有得翰林王君原叔尤嗜其詩家素畜先唐舊集及採祕府名公之室天下士人所有得者悉編次之事具于記於是杜詩無遺矣子美博聞稽古其用事非老儒愽士罕知其自出然缺乆矣後人妄改而𥙷之者衆莫之遏也非原叔多得其真爲害大矣子美之詩詞有近質者如麻鞋見天子垢膩脚不韈之句所謂轉石於千仞之山勢也學者尤効之而過甚豈逺大者難窺乎然夫子之刪詩也至于檜曹小國寺人女子之詩苟中法度或取而弦歌善言詩者豈拘於人哉原叔雖自編次余病其卷帙之多而未甚布暇日與蘇州進士何君瑑丁君脩得原叔家藏及今古諸集聚于郡齋而叅考之三月而後巳義有兼通者亦存而不敢削閱之者固有淺深也而又吴江邑宰河東裴君煜取以覆視乃益精密遂鏤于板庶廣其傳或俾余序于篇者曰如原叔之能文稱于丗止作記于後余竊慕之且余安知子美哉但本末不可闕書故槩舉以附于卷終原叔之文今遷于卷首云嘉祐四年四月望日姑蘇郡守太原王琪後記跋子美詩并序鄭卬余讀李元賔𥙷遺傳及韓退之題杜工部墳詩皆自摭遺所載疑非二公所作然大曆元和時之相去猶未爲逺不當與本集抵捂若是大抵後之好事者託而質之也甞攷子美以大曆五年四月臧玠殺崔灌由是避地入衡州至耒陽遊嶽祠以大水涉旬不得食耒陽聶令具舟迎之水漲遂泊方田驛子美詩以謝之繼而㳂湘流將適漢陽暮秋歸秦有詩别湖南幕府親友豈以夏而溺死耒陽復有此作盖其卒在潭岳間秋冬之際元微之誌銘亦畧見本末作史者惑於摭遺之說遂有牛炙白酒一宿卒之語信史之誤余不可以不辨長樂鄭卬謹䟦杜子美之於詩實積衆家之長適當其時而巳昔蘇武李陵之詩長於髙妙曹植劉公幹之詩長於豪逸陶潜阮籍之詩長於沖澹謝靈運鮑昭之詩長於峻潔徐陵庾信之詩長於藻麗於是子美窮髙妙之格極豪逸之氣包沖澹之趣兼峻潔之姿備藻麗之態而諸家之作所不及焉然不集諸家之長子美亦不能獨至於斯也豈非適當其時故耶孟子曰伯夷聖之清者也伊尹聖之任者也柳下惠聖之和者也孔子聖之時者也孔子之謂集大成嗚呼子美亦集詩之大成者歟讀子美詩孫何丗系留唐史丘封寄耒山髙名落身後遺集出人間逸氣應天與淳風自我還鋒鋩堪定霸徽墨可繩姦進退軍三令廻旋馬六閑楚詞休獨歩周雅合重刪李白從先逹王維亦厚顔庖刀盡餘刃羿彀肯虚彎聖域分中土天樞奪要關逍遥登禁闥偃蹇下塵寰麗思蘇幽蟄神功鑿險艱語成新體句才折好官班誰氏傳軒冕何人得佩環朱弦夲䟽越黃鳥浪緜蠻元白詞華窄錢郎景象鏗蜀峰愁杳杳湘水浪潺潺子欲探驪頷吾思擷虎斑毛錐應穎脫燕石竟踈頑巴襲蘭兼菊無嫌蒯與菅二南如有得髙躅願追攀子美畫像歐陽脩風雅乆寂寞吾思見其人杜君詩之豪來者孰比倫生焉一身窮死也萬丗珍言苟可垂後士無羞賤貧子美畫像王安石吾觀少陵詩爲與元氣侔力能排天斡九地壯顔毅色不可求浩蕩八極中生物豈不稠醜妍巨細千萬殊竟莫見以何雕鎪惜哉命之窮顚倒不見收青衫老更斥餓走半九州瘦妻僵前子仆後攘攘盗賊森戈矛吟哦當此時不廢朝廷憂甞願天子聖大臣各伊周寧令吾廬獨破受凍死不忍四海寒颼颼傷屯悼屈止一身嗟時之人死所羞所以見公畫再拜涕泗流惟公之心古亦少願起公死從之遊讀子美集張伯玉寂寞風騷主先生第一材詩魂躔斗壁筆力撼蓬萊運動天樞朽奔騰地軸摧萬蛟盤險句千馬夾雄才勢走岷峨盡辭含混沌來剖山無鵲石傾廐盡龍媒薦擢誇三賦飄零放一盃艱難行蜀道感激上燕臺日月兵前没江湖笑裏開獨吟千載後肝膽洗塵埃觀子美畫像楊蟠文光萬丈照詞林獨歩才難一代欽塵土未淪今日貌篇章空憶舊時心寂寥冠劒無由作零落丹青豈復吟師法望公千載後仰風三歎感知音題子美墳唐韓愈撰何人鑿開混沌殻二氣由來有清濁孕其清者爲聖賢鍾其濁者成愚樸英豪雖没名猶嘉不肖虚死如蓬麻榮華一旦丗俗眼忠孝萬古賢人芽有唐文物盛復全名書史冊俱才賢中間詩筆誰清新屈指都無四五人獨有工部稱全美當日詩人無擬倫筆追清風洗俗耳心奪造化回陽春天光晴射洞庭秋寒玉萬頃清光流我常愛慕如飢渇不見其面生閑愁今春偶客耒陽路淒慘去㝷江上墓召朋特地踏煙蕪路入溪村數百歩招手借問騎牛兒牧兒指我祠堂路入門古屋三四間草茅縁砌生無數寒竹珊珊揺晚風野蔓層層纏庭户升堂再拜心惻然心欲䖍啓不成語一堆空土煙蕪裏虚使詩人嘆悲起怨聲千古寄西風寒骨一夜沉秋水當時處處多白酒牛䏑如今家家有飲酒食䏑今如此何故常人無飽死子美當日稱才賢聶侯見待誠非喜洎乎聖意再搜求姦臣以此欺天子捉月走入千丈波李白入水捉月忠諌便沉汨羅底屈原沉湘固知天意有所存三賢所歸同一水過客留詩千百人佳詞繡句虚相美墳空飫死巳傳聞千古醜聲竟誰洗明時好古疾惡人應以我意知終始子美墓誌銘唐元稹撰叙曰余讀詩至杜子美而知大小之有所揔萃焉始尭舜時君臣以賡歌相和是後詩人繼作歷夏殷周千餘年仲尼緝拾選練取其干預教化之尤者三百篇其餘無聞焉騷人作而怨憤之態繁然猶去風雅日近尚相比擬秦漢巳還採詩之官旣廢天下妖謡民謳歌頌諷賦曲度嬉戲之詞亦隨時間作至漢武賦栢梁詩而七言之體具蘇子卿李少卿之徒尤工爲五言雖句讀丈律各異雅鄭之音亦雜而詞意簡逺指言事情自非有爲而爲則文不妄作建安之後天下之士遭罹兵戰曹氏父子鞍馬間爲文往往横槊賦詩其遒壯抑揚冤哀悲離之作尤極於古晉丗風槩稍存齊宋之間教失根本士子以簡慢歙習舒徐相尚丈章以風容色澤放曠精清爲髙蓋吟冩性靈流連光景之文也意氣格力固無取焉陵遟至於粱陳淫艶刻飾佻巧小碎之詞劇又宋齊之所不取也唐興官學大振歷丗之文能者互出而又沈宋之流研練精切稳順聲勢謂之爲律詩由是而後文變之體極焉然而莫不好古者遺近務華者去實効齊梁則不逮於魏晉工樂府則力屈於五言律切則骨格不存閑暇則纎濃莫備至于子美蓋所謂上薄風騷下該沈宋言奪蘇李氣吞曹劉掩顔謝之孤髙雜徐庾之流麗盡得古今之體勢而兼人人之所獨專矣使仲尼考鍜其旨要尚不知貴其多乎哉苟以其能所不能無可無不可則詩人巳來未有如子美者是時山東人李白亦以竒文取稱時人謂之李杜余觀其壯浪縱恣擺去拘束模冩物象及樂府歌詩誠亦差肩於子美矣至若鋪陳終始排比聲韻大或千言次猶數百詞氣豪邁而風清調深属對律切而脫棄凢近則李尚不能歷其藩翰况壼奥乎予甞欲條析其文體别相附與來者爲之凖特病嬾末就適遇子美之孫嗣業啓子美之柩襄祔事於偃師途次于荆雅知余愛言其大父之爲文拜余爲誌辭不能絶余因係其官閥而銘其卒葬云係曰晉當陽成侯姓杜氏下十丗而生依藝令於鞏依藝生審言善詩官至膳部貟外郎審言生閑閑生甫閑爲奉天令甫字子美天寶中獻三大禮賦明皇竒之命宰相試文文善授右衛率府胄曹属京師亂歩謁行在拜左拾遺歲餘以直言失出爲華州司功㝷遷京兆功曹劒南節度嚴武狀爲工部貟外郎叅謀軍事旋又棄去扁舟下荆楚間竟以寓卒旅殯岳陽享年五十有九夫人弘農楊氏女父曰司農少卿怡四十九年而終嗣子曰宗武病不克葬殁命其子嗣業嗣業貧無以給䘮収什乞匄焦勞晝夜去子美殁後餘四十年然後卒先人之志亦足爲難矣銘曰維元和之癸巳粤某月某日之佳晨合窆我杜子美於首陽之山前嗚呼千歲而下曰此文先生之古墳子美傳皇朝宋祁奉勑撰甫字子美少貧不自振客吴越齊趙間李邕竒其材先往見之舉進士不中第困長安天寶三載玄宗朝獻太清宫饗廟及郊甫奏賦三篇帝竒之使待詔集賢院命宰相試文章擢河西尉不拜改右衛率府胄曹參軍數上賦頌因髙自稱道且言先臣恕預以來承儒守官十一丗迨審言以文章顯中宗時臣頼緒業自七歲屬辭且四十年然衣不蓋體常寄食於人竊恐轉死溝壑伏惟天子哀憐之若令執先臣故事抜泥塗之乆辱則臣之述作數不足鼓吹六經至沈鬱頓挫隨時敏給楊雄枚臯可企及也有臣如此陛下其忍棄之㑹禄山亂天子入蜀甫避走三川肅宗立自鄜州羸服欲奔行在爲賊所得至德二年亡走鳯翔上謁拜左拾遺與房琯爲布衣交琯時敗陳濤斜又以客董廷蘭罷宰相甫上䟽言罪細不冝免大臣帝怒詔三司雜問宰相張鏑曰甫若抵罪絶言者路帝解甫謝且稱琯宰相子少自樹立爲醇儒有大臣體時論許琯才堪公輔陛下果委而相之勸其深念主憂義形於色然性失於間酷耆鼓琴廷蘭託琯門下貧疾昏老依倚爲能惜人情一至玷汙臣歎其功名未就志氣挫衂覬陛下棄細録大所以冒死稱述渉近訐激違忤聖心陛下赦臣百死再賜骸骨天下之幸非臣獨蒙然帝自是不甚省録時所在㓂奪甫家寓鄜彌年囏窶孺弱至餓死因許甫自往省視從還京師出爲華州司功參軍關輔饑棄官去客秦州負薪採橡栗自給流落劒南結廬成都西郭召𥙷京兆功曹參軍不至㑹嚴武節度劒南東西川往依焉武再帥劒南表爲參謀檢校工部貟外郎武以丗舊待甫甚善親詣其家甫見之或時不巾而性褊躁傲誕常醉登武牀瞪視曰嚴挺之乃有此兒武亦暴猛外若不爲忤中銜之一日欲殺甫及梓州刺史章彛集吏於門武將出冠鉤于簾三左右白其母奔救得止獨殺彛武崔盰等亂甫往來梓夔間大曆中出瞿塘下江陵泝沅湘以登衡山困客耒陽游嶽祠大水遽至渉旬不得食縣令具舟迎之乃得還令甞饋牛炙白酒大醉一昔卒年五十九甫放曠不自檢好論天下大事髙而不切少與李白齊名時號李杜甞從白及髙適過汴州酒酣登吹臺慷慨懷古人莫測也數甞宼亂挺節無所汙爲歌詩傷時橈弱情不忘君人憐其忠云賛曰唐興詩人承陳隋風流浮靡相矜至宋之問沈