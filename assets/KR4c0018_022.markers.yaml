  - {type: variant, offset: 0, length: 25507, content: 分門集註杜工部詩卷第二十二慶賀古詩一首律詩四首覽栢中允兼子姪數人除官制詞因述父子兄弟四美載歌絲綸洙曰按唐書栢氏無顯人惟栢耆傳云將軍良器之子元和中人不顯州郡甫又有詩寄栢學士林居趙曰此詩有戮力自元昆意其栢正節也然竊有疑焉公詩又有桓學士林居栢大兄弟詩栢二别駕詩豈可指言栢正節之家乎俟明識辨之紛然喪亂際見此忠孝門洙曰晉卞壼傳翟湯歎曰父死於君子死於父忠孝之道萃於一門蜀中㓂亦甚栢氏功彌存深誠𥙷王室戮力見元昆洙曰魏書重以王室多故爾雅先生爲昆漢髙紀勠力注并力也趙曰父子兄弟有功於行陣則詩人宜以忠孝稱之三止錦江沸獨清玉壘昏洙曰左太冲蜀都賦廓霊關而爲門包玉壘而爲宇註玉壘山名華陽國志錦江言蜀人織錦濯其中則色鮮明他江則不好故命曰錦江也成都記玉壘山導江縣西北三十里趙曰傳所謂以湯止沸也寰宇記曰濯錦江係之華陽懸公自入蜀見成都之亂蓋寳應元年徐知道反永嘉元年崔肝反殺郭英乂大曆三年七則楊子琳以瀘州刺史反此錦江之三沸也蜀都賦包玉壘而爲宇李善注玉壘山名前水岀焉以今考之永康軍是也髙名入竹帛洙曰鄧禹曰垂功名於竹帛新渥照乾坤洙曰渥恩也子弟先卒伍芝蘭疊與璠洙曰謝玄與從兄㓪爲叔父安所器重曰譬如芝蘭玉樹生於階庭同心注師律洙曰易師出以律灑血在戎軒洙曰後漢賛二十八蔣有來羣后捷我戎軒梁呉均䄂間血灑地絲綸實具載洙曰禮緇衣子曰王言如絲其出如綸王言如綸其出如綍言岀彌大者也紱冕巳殊恩洙曰班固西都賦紱冕所興奉公舉骨肉誅叛經寒温金甲雪猶凍朱旗塵不翻洙曰陸佐公石闕銘朱旗萬里每聞戰塲說歘激懦氣奔聖主國多盗賢臣官則尊方當節鉞用蘇曰蔡邕謂董卓曰子氣勢方當節鉞之用何故兢兢耶必絶祲沴根鄭曰沴音戾趙曰以其有功必使之膺節鉞之用必絶泠根以報朝廷也吾病日迴首雲臺誰再論洙曰後漢馬武等傳二十八將論云永平中顕宗追感前丗功臣乃圗畫二十八將於南宫雲臺上作歌挹盛事蘇曰張茂先作歌告萬方推挹盛事推轂期孤騫鄭曰惟通回切洙曰前漢鄭當特推轂士及官属丞吏誠有味其言也注言薦㪯人如車轂之輪轉也馮唐傳王者遣將跪而推轂此詩注栢中允爲栢耆按新舊二史所載耆止入鎮州說王承宗諭承元移鎮及使李同捷以擅殺同捷流放至賜死而詩中乃言俲力於成都又云三止錦江沸即非耆矣切疑爲栢貞節崔旰之殺郭英乂也貞節與瀘州楊子琳帥師以討之杜鴻漸鎮蜀表授卭州刺史二史皆於傳無所考信故未能修去闕之以俟有聞者趙曰舊注引馮唐事非是師曰求忠臣於孝子之門勠力并力也元昆長兄也錦江蜀有濯錦江銅梁玉壘蜀中二山名時崔旰殺郭英乂栢正節與楊子琳討平之然正節父子兄弟皆盡忠孝之節率先士卒注意師律流血於兵重其英聲義氣載之絲綸天子褒以紱冕其皇恩巳優渥矣故云新渥照乾坤芝蘭香草與璠美玉芝蘭與璵璠相疊謂㪯族皆賢也誅叛經寒温謂討賊歷涉歲時金甲雪猶凍言威嚴可畏賊不寒而慄朱旗塵不翻謂靈旗所指煙塵遂息也故聞栢氏之風者懦夫亦爲之激昂故曰歘激懦氣奔聖人因多難而典國家多盗而能解紛治劇此其所以爲聖人故云聖主囯多盗置官本以待賢士惟臣之賢始尊之以官故云賢臣官則尊祲沴不祥之氣苟朝廷用栢氏秉節鉞必能止不祥之禍甫以多病甘自退縮惟回首属望栢氏畫像雲臺再論其功故云雲臺誰再論栢氏孝萃于一門此亦唐家之盛事也故甫作詩以歌其事庶幾天子命之爲師推轂而遣其勢騫揚特出衆人之表故曰期孤騫也說者皆以栢耆止於入鎮說王承宗非也奉賀陽城郡王太夫人恩命加鄧國太夫人衞幕衘恩重洙曰左傳呉公子札自衞如晉宿於戚聞鍾聲曰異哉夫子之於此也如燕之巢於幕上也戚衞地夢符曰右按前漢書晉灼注曰衛靑征匈奴絶大幕大克獲帝就拜大將軍於幕中故曰幕府幕府之名始於此也趙曰衛幕衞靑之幕也一本題下注云陽城王衞伯王也以其姓衛則用之尤切潘輿送喜頻洙曰潘安閑居賦太夫人乃御板輿升輕軒逺覽王畿近周家園濟時瞻上將趙曰申言郡主節度江陵爲上將錫號戴慈親冨貴當如此蘇曰五侯出人嘆曰冨貴勢要正當如此尊榮邁等倫郡依封土舊國與太名新趙曰言郡封雖仍是陽城郡而夫人之囯加爲鄧囯是爲新矣紫誥鸞回紙夢符曰右按晉載記石季龍五色紙在木鳯之口鹿盧迴轉快若飛翔焉又古樂府半溪度曲制賜文犀節驛報紫泥書趙曰紫誥紫錦之誥也鵉回紙則紙上之字有回鵉之勢也淸朝燕賀人洙曰大厦成而燕雀相賀逺傳冬笋味洙曰孟宗後母好笋令宗冬月求之宗入竹林慟哭笋爲之生更覺綵衣春弈葉班姑史洙曰班姑扶風曹丗叔妻班彪之女名昭字惠姬一名姬博斈髙才丗叔早卒有節行法度兄固著漢書其八表及天文志未及竟而卒和帝詔昭就東觀藏書閣踵而成之昭所著賦頌銘誄問注哀辝書論上䟽遺令凡十六卷子婦王氏爲撰集之又作大家讃焉芬芳孟母隣洙曰潘安仁閑居賦此里仁以爲美孟母所以三徙義方兼有訓洙曰左傳教子以義方詞翰兩如神蘇曰王献之詞語秀麗筆畫雄勁兩如神江左爲獨歩委曲承顔體騫飛報主身可憐忠與孝雙羙畫麒麟洙曰麒麟閣名也上畫忠目像秦州見勑洙曰一作除目薛三璩授司議郎畢四曜除監察與二子有故逺喜遷官兼述索居三十韻大雅何寥闊蘇曰邵平大雅寥邈後丗幾無所聞斯人尚典刑洙曰雖無老成人尚有典刑交期余潦倒材力爾精靈洙曰嵇康書足下舊知吾潦倒麄踈不切事情精霊猶精明也蘇曰梁靖見顧秀私謂同列曰秀之風標太華鍾其霊秀之文章奎星降其精使賈馬嚴楊聽其談論當北面而拱誰可拒敵耶二子身同日諸生困一經文章開突奥洙曰突又作㝔東北隅也一云窟也突奥深遂貌荀子笑奥之内枕簟之上鄭曰施没切爾雅傳謂之笑下方到切室之西南隅曰奥遷擢潤朝廷蘇曰王罕擢翰苑潤色朝廷典誥趙曰潤如德潤身之潤舊好何由展新詩更憶聽别來頭併白秦曰古詩相看俱白頭相見眼終靑洙曰阮籍善爲青白眼見佳客則爲青眼見俗客即爲白眼伊昔貧皆甚同憂心不寧洙曰心一作歲栖遑分半菽浩蕩逐流萍洙曰劉孝標絶交論莫肯廢其半菽罕有落其一毛流萍喻流落如萍之在水也趙曰祖出漢書項羽歳飢人貧卒食半菽俗態猶猜忌洙曰一云猜忍蘇曰張華過洛汭俗士皆有猜忌之態妖氛忽杳冥獨慙投漢閣洙曰見子雲識字終投閣注俱議哭秦庭洙曰吴入郢申胥求救於受司議也屬東宫蘇曰徐牧云下明詔洗滌赦其餘罪也趙曰司議即東宫之官點染爲文字也以言薛璩柱史正零丁洙曰畢受御史老聃爲柱下史點染零丁言未盡其半也趙曰老子爲柱下史而畢擢除監察故以柱下言之零丁介獨之貌官忝趨栖鳯朝回歎聚螢洙曰歎一作欲早胤聚螢喚人靑騕裊不嫁惜娉婷鄭曰上普丁下唐丁切洙曰張易之出塞行騕裊青緑騎娉婷紅粉粧趙曰言二公𥘉不自眩鬻以駿馬佳人爲喻師曰凡此皆甫自喻不見用於丗掘劒知埋獄提刀見發硎洙曰劒埋於豐城獄張華夜見其氣在斗牛間使人掘之庖丁解牛十九年而刀刃若新發硎鄭曰硎音刑砥石梅曰此二句喻薛畢二子子幾年埋没今始奮發殆見遇事剸裁也侏儒應共飽洙曰東方朔傳方待詔公車俸禄薄未得省見乆之朔給侏儒曰上以若曹無益於縣官欲盡殺若曹侏儒大恐啼泣朔教曰上即過叩頭請罪居有頃聞上過侏儒皆號泣頓首上問何爲對曰東方朔言上欲盡誅臣等上知朔多端召問朔何恐侏儒爲對曰臣朔生亦言死亦言侏儒長三尺餘俸一囊粟錢二百四十臣朔長九尺餘亦俸一囊粟錢二百四十侏儒飽欲死臣朔飢欲死臣言可用幸異其禮不用罷之無令但索長安米上大笑因使待詔金馬門遂稍稍得進用焉趙曰以言二公猶未甚顯拔與侏儒共飽耳東寄此詩今日西京掾多除南省郎洙曰府掾四人同日拜郎通家惟沈氏謁帝似馮唐洙曰見名慙白首郎注文選謁帝承明廬趙曰公自比也馮唐以白首而見文帝公四十歲始以献賦召試見明皇也詩律群公問蘇曰王仲宣流落荆南多有名士日問詩律儒門舊史長趙曰却言沈東美也謂之舊史則東美者史官沈旣濟之胄也淸秋便寓直洙曰寓寄也晉潘岳兼虎賁中郎將寄直於散騎省中故云寓直也趙曰言沈受命之時也便音平声列宿頓輝光鄭曰宿息救切洙曰謂郎官上應列宿也未暇申安慰含情空激揚司存何所比洙曰比屬也言司之所在何屬逢原曰語則有司存膳部黙悽傷趙曰言沈丈所存之司何所比擬乎公直以比其大父也蓋公之大父審嘗爲此官故因沈丈而追感矣貧賤人事略經過霖潦妨禮同諸父長洙曰父長猶父兄之行也相尊爾天子謂同姓諸侯諸侯謂同姓大夫皆曰父趙曰以見尊沈丈之年恩豈布衣忘趙曰公新召試入官前此蓋布衣耳天路牽騏驥雲臺引棟梁趙曰袁彦伯三國名臣賛曰整轡髙衢驤首雲路此牽騏驥之謂也馬曰淮南子云雲臺之髙髙注曰髙際於雲故曰雲臺即非漢之臺名徒懷貢公喜䬃䬃鬢毛蒼洙曰見切効貢公喜注王陽入仕貢禹弹冠師曰漢制以曹官爲掾如屋之掾言有所負荷也時府禄四人同日拜郎西京漢也除擢也言除舊而寘新甫與沈家相通往來馮唐老年爲郎今東美亦然故以比之詩律群公問言沈長於詩群公皆就質疑便音駢謂安間也直謂直舎也貧賤無車馬阻於霖潦故人事簡略布衣甫自稱也甫末章有意於沈汲引故云牽騏驥引棟梁也􅉑國夫人新添鮑曰唐后妃傳楊貴妃有姊三人長曰大姨封􅉑國並承恩出入宫掖􅉑國夫人承主恩平明上馬入宫門修可曰明皇雜錄云號國毎入禁中乗騘馬使小黃門爲御皆俊健端秀才冠一時却嫌脂粉涴顔色淡掃蛾眉朝至尊鮑曰楊妃外傳虢國夫人不施朱粉自有艶態傷悼古詩八首律詩二十二首八哀詩并序傷時盗賊未息興起王公李公歎舊懷賢終于張相國八公前後存没遂不詮次焉洙曰王仲宣張景陽皆作七哀詩黃鳥哀三良亦其義也贈司空王公思禮彦輔曰桉思禮傳加守司空上元二年以疾薨贈太尉謚曰武烈司空出東夷童稚刷勁翮端本曰謂修整其儀矩追隨燕葪兒頴銳物不隔洙曰銳一云脫王思禮營州城傍髙麗人也少習戎旅隨節度使王忠嗣至河西與哥舒翰對爲押衙髙麗東夷也修可曰張景陽七命有云落勁翮平原傳毛遂曰使遂早得處囊中乃頴脫而出服事哥舒翰意無流沙磧洙曰及翰爲隴右節度使思禮爲翰押衙無流沙言其輕視夷狄不以爲意也端本曰沙石曰磧言必掃蕩之也未甚拔行間犬戎大充斥敏公曰充斥言盛大也短小精悍姿屹然強㓂敵定功曰前漢嚴延年爲人短小精悍敏捷於事雖子貢冉有通於政事不能絶也趙曰言屹如山而爲強㓂之敵也按史加思禮金城大守安禄山反翰爲元帥奏思禮赴軍玄宗曰吐蕃有釁唯倚思禮且觀玄宗之言則思禮在金城時能敵吐蕃可知矣貫穿百萬衆出入由咫尺馬鞍懸將首蘇曰辛倚破匈奴常懸蕃將首於鞍前齊太祖見而賞愛倚能騎射尤妙文墨甲外控鳴鏑夢符曰右按前漢書冒頓作鳴鏑習勒其騎射應劭曰髐箭也趙曰倣蔡琰詩馬鞍懸虜頭洗劒靑海水孫曰靑海在山東刻銘天山石洙曰思禮以技石堡城功在行間除右金吾衛將軍充關西兵馬使左傳盗賊充斥蔡琰詩馬鞍懸虜頭鳴鏑匈奴以射頭曼者班固爲竇憲刻燕然銘也趙曰皆戰勝而深入也班固爲竇憲刻燕山銘敏修曰唐薛仁貴傳云三箭定天山九曲非外蕃其王轉深壁夢符曰右按唐㑹要景龍四年賛普請昏以左衛大將軍楊矩爲送金城公主使後矩爲鄯州都督吐蕃厚賂之因請河西九曲之地以爲公主湯沐之邑矩遂奏與之吐蕃旣得九曲其地肥良尤與唐地接近自是復叛矩懼飮藥而死唐王思禮傳事哥舒翰以功授右衛將軍關西兵馬使從其討九曲也趙曰則九曲非外蕃飛兎不近駕修可曰飛兎古之神馬也淮南子曰夫待腰褭飛兎而駕之則丗莫乗車矣晁曰馬名飛兎善走躍而復能飛以名馬其駿抉可知矣鷙鳥資逺擊洙曰十二歲翰征九曲思禮後期欲引斬之續命使釋之思禮徐言曰斬則斬却喚作何物諸將皆以是壯之趙曰飛兔古之神馬陳孔璋荅東阿王牋曰飛兔流星超越山海傳曰擊鳥之擊曉逹兵家流飽聞春秋癖修可曰漢藝文志云兵家者流凡百八十二家也晉杜預雖爲將軍而有左傳廦匈襟日沉静肅肅自有適洙曰前漢蓺文志兵權謀十三家兵形勢十一家隂陽十六家兵技巧十三家兵家者蓋出於古司馬之職自春秋至於戰國岀竒設伏變詐之兵並存漢興張良韓信序次兵法凡百八十二家晉杜預有左氏傳癖裴楷自夏侯玄云肅肅如入宗廟中俱見禮樂器師曰自短小精悍姿至此句皆美思禮之辭潼關𥘉潰散萬乗猶辟易饒曰辟易退却奔走之貌偏禆無所施元帥見手格洙曰禄山之反也思禮從翰守潼關密語翰誅國忠又欲以三千騎劫之翰不從遂至於敗思禮爲偏禆而謀不見從翰遂𬒳擒元帥翰也萬秉天子也辟易播遷也饒曰格鬪也太子入朔方至尊狩梁益鄭曰劒南胡馬纏伊洛中原氣甚逆蘇曰蒙將軍一日謂扶蘇曰今天色黯淡回視中原其氣甚逆吾慮者恐不測之禍在其中後果如所言肅宗登寳位塞望勢敦迫鄭曰塞入聲洙曰翰旣敗潼關不守玄宗幸蜀太子從百姓之請遂入靈武圗興復而羣臣勸進遂即位於靈武以從人望思禮奔行在趙曰勢出於裴冕等所迫也知肅宗以皇太子爲天下兵馬元帥北收兵至靈武裴冕等奉皇太子即皇帝位公時徒歩至請罪將厚責際會清河公間道傳玉冊天王拜跪畢讜議果氷釋洙曰思禮至行在上責其不堅守坐畢下將斬之會房琯在蜀奉太上皇冊命至諌上以爲可收後効遂釋之蘇曰徐倜數上書明劉向事讜議䛕論即日冰釋翠華卷飛雪熊虎豆阡陌洙曰書如熊如羆如虎如貔趙曰翠華天子之旗上林賦建翠華之萎蕤卷飛則言其時在冬周禮熊虎爲旗所謂亘阡言兵旗之多也舊注引如虎如貔却是言兵旅非是屯兵鳯凰山帳殿涇渭闢洙曰天子所在以帳爲殿象宫闕臺殿也趙曰行宫殿帳以爲殿庾肩吾云回川入帳殿鳯凰山鳯翔山名涇渭則在平凉乃渭州金城賊咽喉詔鎭雄所搤鄭曰乙革切洙曰思禮旣釋尋副房琯戰便橋不利更爲關内行營節度河西隴右伊西行營兵馬使守武功以控賊及廣平王收復思禮入淸宫禁暴靖無雙爽氣春淅瀝師曰和爽之氣如春風然巷有從公歌洙曰詩無小無大從公于邁野多靑靑麥洙曰言賊不敢犯境土也及夫哭廟後復領大原役洙曰郭子儀收復兩京時太廟爲賊所焚權移神主於大内長安殿上皇謁廟請罪及光弼鎭河陽制以思禮爲太原而北京留守河東節度使兼御史大夫貯軍糧百萬器械精銳尋加守司空自武德以來三公不居於宰輔唯思禮而巳恐懼禄位髙悵望王土窄洙曰昔也日闢國百里今也日蹙國百里趙曰在我之禄位則恐其髙本朝之土地則恨其窄又以美其謙忠不得見清時嗚呼就窀穸洙曰左傳唯是窀穸之事永繫五湖舟洙曰范蠡事勾踐旣㓕呉乗扁舟泛五湖有功成身退之忠而不能遂悲甚田橫客洙曰田橫死賔客聞之從死者五人言思禮賔客尤甚於横也千秋汾晉間事與雲水白趙曰前云復領太原役則兩在太原矣宜有顯績歷千年如雲水之白矣昔觀文苑傳豈述廉藺績洙曰言思禮撫御積畜之才在汾晉之間者與雲水無晦也廉頗藺相如古名將也言有武功者不必責之以文德矣趙曰以形容思禮文不足而武有餘也廉頗藺相如古之名將豈必書其文采於文苑傳乎末句正譏文勝者徒以取禍嗟嗟鄧大夫士卒終倒㦸洙曰鄧景山曹州人以文吏見稱亦爲太原尹北京留守至太原以鎮撫紀綱爲己任檢覆軍吏隱没者衆懼有一偏將抵罪當死諸將各請贖其罪景山不許其弟請以身代其兄又不許其弟請納馬一匹以贖兄罪景山許其咸死衆咸怒謂景山曰我等人命輕如一馬乎軍衆憤怒遂殺景山上以景山撫御失所以故不復驗其罪故司徒李公光弼司徒天寳末北收晉陽甲洙曰按唐書李光弼傳光弼營州人㓜持節行善騎射能讀班氏漢書少從戎嚴毅有大畧天寳十三年郭子儀薦之堪當閫寄禄山之亂玄宗幸蜀肅宗理兵靈武授光弼戸部尚書兼太原尹晉陽太原也趙曰光弼加撿校司徒在至德二載尋遷司空矣今上云司徒則據爲司徒已前事而稱其官耳按史云安禄山反郭子儀薦其能持節何東節度副大使晉陽則河東之太原也胡騎攻吾城愁寂意不惬人安若泰山葪北斷右脅朔方氣乃蘇黎首見帝業洙曰賊將史思明等四僞帥來攻城光弼麾下衆不滿萬皆烏合之人賊以太原屈指可取光弼伺其怠出擊大破之斬首十餘萬級又破思明于嘉山而河北歸順者十餘郡朔方河北也趙曰光弼屢戰屢勝所以斷葪北之脅蘇朔方之氣使萬民得見帝業觀公爲華州子儀進㓕殘宼形勢圖狀云平盧兵馬在賊左脅正此義二宫泣西郊師曰二宫謂肅宗與皇后九廟起頽壓洙曰見及夫哭廟後注未散河陽卒思明僞臣妾復自碣石來火焚乾坤獵髙視笑禄山公又大獻捷洙曰乾元二年爲天下兵馬元帥與九節度兵圍安慶緒於相州拔有日矣史思明自范陽來救屢絶糧道光弼身先士卒苦戰勝之思明因殺慶緒即僞位縱兵河南賊勢甚熾光弼識洛不足抗賊遂檄官吏令避㓂引兵入三城賊憚光弼頓兵白馬祠不敢西犯宫闕遂戰於中潭西大破逆黨賊走保懷州趙曰唐史思明乗勝西嚮光弼敦陣徐行趍東京謂留守韋陟曰公計將安出陟曰不如移軍河陽表裏相應此猨臂勢也遂悉軍趍河陽光弼禽周摯等思明未知光弼駈所俘示之思明大懼築壘以拒官軍髙視笑禄山言思明笑禄山而自矜也獻大捷則傳所謂獻俘太廟異王冊崇勲小敵信所怯定功日光弼以功封臨淮王非謂非劉氏而王也小敵信所怯謂北邙之敗也光武與王鳯等戰自將歩騎千餘前去諸部喜曰劉將軍平生見小敵怯今見大敵勇甚可畏也擁兵鎭河汴千里初妥帖鄭曰妥吐火切安也洙曰光弼以功進封臨淮王鎮何汴謂鎭臨淮漢光武見小敵則快蘇曰張遜上隋文帝表云幅貟暫寕千里安帖民瘵未痊冝寛恤蒼生羅寵英俊靑蠅紛營營風雨秋一葉内省未入朝死淚終映睫洙曰靑蠅喻魚朝恩程元振等也初北邙之戰光弼屢表賊未可破爲僕固懷恩譛害遂至於敗及吐蕃犯京師代宗幸陜徴天下兵光弼與程元振不叶遷延不至後遂不敢入朝及卒諸將問後事曰吾乆在軍不得就養旣爲不孝子夫復何言時母在河中所謂風雨秋一葉者也修可日按唐史北邙之敗魚朝恩羞其䇿謬深忌光弼功髙而程元振尤嫉之及來瑱爲元振䜛死光弼愈恐吐蕃㓂京師代宗詔入援光弼畏禍遷延不敢行帝逺長安因拜東都留守察其去就光弼以乆須詔不至二年光弼疾篤薨大屋去髙棟洙曰髙棟大屋所恃而安喻光弼朝廷之所倚頼也長城掃遺堞洙曰倚光弼如長城今其死矣是掃遺堞也平生白羽扇洙曰裴啓語林曰諸葛武侯持白羽扇指麾三軍言人亡而所用之物存爾零落蛟龍匣洙曰蛟龍匣劒匣也言人亡不復見用故云零落爾雅望與英姿洙曰二十八將論至使英姿茂績委而不用也惻愴槐里接洙曰命京兆尹第五倫監護喪事葬於三原詔宰臣百官祖送於延平門外前漢槐里屬右扶風武帝茂陵昭帝平陵在趙曰槐里豈葬地乎以詔百官送葬延平門外按長安志延年門乃在郭西而前漢槐里屬右扶風今之鳯翔府正在長安之西矣三軍晦光彩烈士痛稠曡直筆在史臣將來洗箱篋洙曰言平生功名書在史冊也趙曰言史以直筆書光弼之功業不幸遭䜛致公恐懼之事將來先濯箱篋之汙辱矣吾思哭孤冡南紀阻歸楫洙曰時甫避亂荆衡故云南紀趙曰南紀楚之分公自南紀往歸長安則可以弔光弼之英䰟今阻而不能故云扶顚永蕭條洙曰言光弼有扶顚之力也未濟失利渉洙曰時未至大治而光弼亡如未濟而失舟也疲薾竟何人鄚曰薾乃結切疲皃灑涕巴東峽洙曰巴東峽在荆州趙曰巴東峽指言巙州而舊注指爲荆州非是贈左僕射鄭國公嚴公武鄭公瑚璉器洙曰鄭嚴武所封瑚璉宗廟器華岳金天晶鄭曰晶子盈切洙曰以其得山岳之孕精也趙曰武挺之之子華州華隂人爾雅曰華爲西岳古有帝王之號曰金天氏昔在童子日巳聞老成名趙曰本傳武㓜豪爽母不爲挺之所荅獨厚其妾武始八􅍲恠問其母母語之故武奮然以鐵鎚碎其妾首嶷然大賢後鄭曰嶷鶚力反復見秀骨清洙曰嚴武傳武中書侍郎挺之子神氣雋爽敏於聞見㓜有成人風讀書不究精義渉獵而巳大賢謂嚴子陵歟趙曰大賢指嚴挺之舊注謂嚴子陵非是開口取將相小心事友生洙曰甫與武丗契也嘗醉登武床呼斥其父名而武不忤趙曰凡開口只欲爲將相傳云與元載厚相結求宰相而事不遂是已小心事友生蓋普言其實舊注引甫嘗醉登武床武不之忤其說拘矣閱書百紙盡洙曰紙一作氏落筆四座驚歷職匪父任嫉邪常力爭洙曰武弱冠以門䕃䇿名哥舒翰奏充判官至德初粛宗初靖難大收才傑武仗節赴行在宰相房琯素重之及是首薦才畧可稱累遷給事中趙曰言武初離𥙷䕃其後自致身累遷殿中侍御史所謂嫉邪者乃御史之職而嘗力爭乃武之能矣舊注以武爲給事中乃在粛宗時而與嫉邪有何相干漢儀尚整肅洙曰時武爲侍御史胡騎忽縱橫洙曰禄山之乱也飛傳自河隴逢人問公卿趙曰史云玄宗入蜀擢爲諌議大夫則天寳末武在蜀中矣飛傳則傳遽之報也傳張恋反河隴西來蜀中之道肅宗即位靈武而前路梗澁有飛傳自河隴來武必詢問公卿爲誰不知萬乗出雪涕風悲鳴受詞劒閣道謁帝蕭關城洙曰河隴劒閣蕭関城事新舊二史皆不載趙曰武在蜀之逺亦不知万乗所岀之的所以雪涕悲鳴其忠義之情如此於是請於玄宗乞往行在也鄭曰渭州清原縣乃武州舊治蕭関縣按其地即漢朝那縣在原州西一百八十里龍朔中故於白草軍城置蕭関寂寞雲臺仗洙曰庾信哀江南非無北闕之兵猶有雲臺之仗修可曰言行宫儀衛之草創也飄颻沙塞旌江山少使者笳鼔凝皇情洙曰顔延年窮逺凝聖情又笳鼔震𬈑洲壯士血相視洙曰別賊刎血相視也忠臣氣不平趙曰指嚴武也密論正觀體洙曰正觀太宗撥乱反正時揮發岐陽征洙曰時粛宗理兵鳳翔感激動四極聮翩收二京洙曰二京長安東都也二史皆不載武收復功定功曰史云至德初武赴肅宗行在房琯薦爲給事中巳收長安拜京兆尹則固有建議收復者矣西郊牛酒再洙曰沈休文碑牛酒日至壷漿塞陌西郊謂文王也牛酒謂擊牛釃酒饗士也原廟丹靑明洙曰叔孫通願爲原廟注原重也先以有廟今更立之也脩張良廟教云可改構棟宇而修丹青也匡汲俄寵辱洙曰匡衡汲黯趙曰以武之諌諍如匡汲也旣拜京兆尹矣而坐房琯事貶巴州此則寵之所辱也衞霍竟哀榮洙曰衞青霍去病趙曰武爲東川及劒南節度則遷謫之中雖可哀而復榮也四登會府地洙曰旣收長安以武爲京兆少尹兼御史中丞時年三十二後又遷京兆尹兼御史大夫三掌華陽兵洙曰華陽成都也武以史思明阻兵不之官優游京師頗自矜大出爲緜州刺史迁劒南東川節度使登發上皇誥以劒南兩川合爲一道拜武成都尹充劒南節度使入復求爲方面拜成都尹在蜀累年肆志逞欲恣行猛政威震一方趙曰武爲京兆少尹又爲京兆尹爲成都尹劒南節度又復節度劒南此爲四登㑹府書曰華陽黒水惟梁州則東川西川皆華陽也京兆空柳色洙曰色一云市張敝爲京兆尹走馬章臺街唐詩有章臺柳是也尚書無履聲洙曰前漢哀帝擢鄭崇爲尚書僕射數求見諌諍上初納用之每見曳革上笑曰我識鄭尚書履声注生曰革群烏自朝夕洙曰成帝時御史府中列栢株常有野烏數千栖宿其上晨去暮來號曰朝夕烏烏去不來者數月長者異之後果廢御史大夫爲司空是其徴也白馬休横行趙曰漢張湛爲光禄大夫常乗白馬光武每有異政輒曰白馬生且復諫矣諸葛蜀人愛洙曰陳壽言蜀人愛亮雖甘棠之詠召公鄭人歌子産曰未足爲過也文翁儒化成洙曰西漢文翁之守蜀召下縣子弟以爲學官弟子爲除更繇髙者補郡吏以爲孝弟力田由是大化蜀之學於京師者比齊魯公來雪山重公去雪山輕洙曰雪山西山也言輕重在公而不在山記室得何遜洙曰梁書何遜爲建安王記室王爱文學之士日與遊宴又爲虜陵王記室復隨府於江州韜鈐延子荆洙曰晉孫楚字子荆叅石苞驃騎軍事四郊失壁壘洙曰失壁壘言無屯戍也此美武能鎭静也趙曰鎭静無事也記曰四郊多壘卿大夫之辱也虚館開逢迎洙曰開閤以禮士也堂上指圖畫軍中吹玉笙師曰言公鎭静蜀中惟以宴樂圖畫與衆共樂無寇盗之憂也豈無成都酒憂國只細傾時觀錦水釣問俗終相并趙曰上句雖成都有醇酒難而不敢盛爲宴飲也下句言車騎之出非專爲間遊終以問俗爲事也意待犬戎滅人藏紅粟盈洙曰見近聞犬戎逺遁逃注漢太倉之粟紅腐不可食趙曰犬戎指吐蕃也武再節度劒南日破吐蕃七万衆于當狗城然其意終待尽㓕而人免誅求使粟至於紅腐也以兹報主願庶或禆丗程洙曰或一云獲炯炯一心在洙曰見此心炯炯應君識注馬曰炯炯明皃沉沉二豎嬰洙曰晉侯疾求醫于秦秦伯使醫緩爲之未至公夢疾爲二豎子曰彼良醫也懼傷我焉逃之其一曰我居肓之上尓居膏之下若我何醫至曰不可爲也在肓之上膏之下攻之不可逹之不及藥不至焉不可爲也公曰良醫也顔回竟短折洙曰顔回年二十九蚤死武終時年四十洪範注短未六十折未三十也賈誼徒忠貞洙曰禇淵碑忠貞允亮也師曰公之意在於報主不幸疾化故比之回誼謂年少而殂也飛旐出江漢洙曰潘安賦飛旐翩以啓路趙曰武卒於蜀舟行而歸故今云云孤舟轉荆衡洙曰荆衡乃楚地也虚無馬融笛洙曰見如聞馬融笛注蘇曰後漢馬融精覈術數性好音律能吹笛爲督郵無留事獨卧郡平陽鄔中有洛客舎送旅吹笛融去京師踰年暫聞悲甚而樂之作長笛賦悵望龍􅋮塋洙曰王濬以龍驤將軍平陳及卒以龍􅋮名墓田曰武帝以謡言拜王濬爲龍􅋮將軍至太康六年卒葬栢谷小大營塋城舊注以龍驤名墓非是空餘老賔客身上媿簪纓洙曰武在蜀辟甫爲叅謀贈太子太師汝陽郡王璡鄭曰資辛切汝陽讓帝子洙曰譲皇帝憲本名成器睿宗長子立爲皇太子以玄宗有討平韋氏之功成器懇讓儲位封爲寧王薨謚曰譲皇帝長子汝陽郡王璡也眉宇眞天人虬鬚似太宗洙曰書生相太宗曰龍鳯之姿天日之表又有虬鬚也趙曰讓帝睿宗子也以其譲爲皇嗣玄宗以其有髙丗之行非大號不稱故追謚讓皇帝汝南郡王璡讓帝長子枚乗七發陽氣見於眉宇之間鄧禹傳注衆皆切言劉公真天人也餘見上色映塞外春師曰謂貌和雅也往者開元中主恩視遇頻出入獨非時禮異見羣臣師曰玄宗以璡父讓位于巳故眷遇之恩異於諸王出入宫禁不以時也愛其謹㓗極洙曰此史採此語倍此骨肉親從容聽朝後或在風雪晨忽思格猛獸洙曰江都王力格猛獸苑囿騰清塵洙曰司馬相如諫獵書云今陛下好陵阻險射猛獸卒然遇逸材之獸駭不測之地犯属車之淸塵豈不殆哉羽旗動若一萬馬肅駪駪洙曰三礼圖全羽爲旞析羽爲旗全羽析羽皆五采繫之於旞旌之上所謂注旄於竿首也詩駪駪征夫注衆多之貌鄭曰駪踈臻切馬衆多也詔王來射鴈拜命巳挺身箭出飛鞚内洙曰言王從帝獵苑中帝詔王射鴈也上又回翠麟洙曰又一作入翻然紫塞翮修可曰崔豹古今注曰秦所築長城土色皆紫漢亦然故云紫塞者塞也下拂明月輪趙曰言鴈下而拂弓也皆言王射獵之精絶胡人雖獲多天笑不爲新洙曰長楊賦上將大誇胡人以多禽獸令胡人手搏之自取其獲上親臨觀焉天笑天子之笑也夢符曰右按仙傳拾遺木公與一玉女投壷設有不入者天爲之􅦍嘘注􅦍嘘開口而笑也􅦍呼監切王每中一物手自與金銀袖中諌獵書扣馬乆上陳洙曰漢武帝方自擊熊逐獸相如因上書諌之伯夷叔齊叩武王馬而諌趙曰言王雖隨獵矣而有書諫獵也諌獵書暗以司馬相如比之竟無衘橜虞洙曰相如書曰且夫清道而後行終路而馳猶時有御橜之變橜音掘聖聦矧多仁官免供給費水有在藻鱗洙曰以其諌獵而罷故官免供給之費而物亦得所趙曰非特止獵且不漁也匪唯帝老大皆是王忠勤趙曰皆王諌之之効也晚年務置醴門引申白賔洙曰璡歷大僕卿与賀知章褚庭誨爲詩酒之交天寳初終又加特進楚元王交好書多材藝少時甞與魯穆生白生申公俱受詩於浮丘伯元王卽至楚以穆生白生申公爲中大夫初元王敬禮申公等穆生不嗜洒元王毎置酒甞爲穆生設醴師古曰醴甘酒也少麴多米一宿而熟不齊之矣道大容無能永懷侍芳茵洙曰言巳無能而惟王之所容侍芳茵言侍王也趙曰家語道大不容莊子無能者無所求好學尚貞烈義形必霑巾洙曰義形於色揮翰綺繡揚篇什若有神川廣不可泝趙曰言自別之後流落於蜀欲泝而上見王則川廣不可泝也倣詩漢之廣矣不可泳思墓乆狐兎隣洙曰張孟陽七哀詩借問誰家墳皆云漢丗主狐兔窟其中蕪穢不復掃宛彼漢中郡洙曰王弟瑀早有才望偉儀表天寳十五載從玄宗幸蜀至漢中因封漢中王文雅見天倫洙曰見天倫恨莫俱注趙曰劉公幹贈五官中郎將討云君侯多壯思文雅縱横飛何以開我悲泛舟俱逺津温温昔風味少壯巳書紳洙曰書之紳帶也語子張書諸紳舊遊易磨滅衰謝多酸辛贈袐書監江夏李公邕長嘯宇宙間髙才日陵替蘇曰王粲曰小人日覺得志髙才日覺陵替夫造物者其意於賢愚何如哉趙曰長咲嘆之長也左傳云上陵下替古人不可見前輩復誰繼憶昔李公存詞林有根柢洙曰唐文苑傳李邕廣陵江都人父善甞注文選六十卷行於時邕少知名在長安𥘉李嶠張廷珪並薦邕詞髙行真堪爲諫諍官蘇曰潘安仁文章瑰瑋友人謂璠詞林繁茂根扺衍密不然何妙秀美發如斯聲華當健筆灑落富清製風流散金石追琢山岳銳鄭曰追都回切治玉也洙曰邕早擅才名尤長碑頌中朝衣冠天下寺觀多出其手趙曰金石以言碑追琢山岳則若磨崖碑之謂師曰言得山岳英銳之氣情窮造化理學貫天人際洙曰董仲舒言天人相與之際干謁走其門蘇曰羊叔子吾非干謁走人門碑版照四裔各滿深望還森然起凡例洙曰杜預左氏傳序發凡以言倒邕雖貶黜在外人亦多齎金帛往求其文也蕭蕭白楊路洞徹寳珠恵趙曰墳墓也墳墓之路幽昏而得邕之文如寳珠之洞徹以照之所以爲惠龍宮塔廟湧浩劫浮雲衛洙曰雲一作空夢符曰右按南史阿育王佛滅度後一日一夜造八萬四千塔𣑽言塔華言廟也又王簡棲頭陀寺碑功濟塵刼法華經曰如人以力磨三千大千上復未盡爲一塵一塵爲刼唐書辛替否曰窮金三修塔廟仙傳拾遺昆明池龍宫有仙方三十六首又廣異記丁約謂韋子威曰郎君終當弃俗尚隔兩塵丁曰儒謂之丗釋謂之刼道謂之塵趙曰浩刼無窮之刼也度人經曰唯有元始浩刼之家部制我界統乗玄都也龍宫之塔廟得邕之文亘歷浩刼而浮雲衛護之也宗儒爼豆事故吏去思計洙曰李玄盛爲酒泉太守百姓思之請勒銘許之羊祜爲荆州刺史立碑峴山百姓見而悲感號爲墮淚碑趙曰爼豆事言作修學校記文宣王廟記之属也去思計言使者太守縣令替罷而作頌政碑之屬眄睞巳皆虚鄭曰睞洛代切跋渉曽不泥向來映當時豈獨勸後丗洙曰自蕭蕭白楊路至此皆邕所造碑事意也沈休文論辭人才子並標能擅美獨映當丗是以一時之士各相慕習也趙曰言其文之光熖巳自輝映當時而歆慕之非止勸率後人豐屋珊瑚鈎騏驎織成罽紫騮隨劒几洙曰髙紀賈人母得衣罽師古曰罽織毛若今毼及氍覦鄭曰說文曰西湖毳布也義取無虚歲洙曰傳言自古鬻文獲財者未有如邕之盛也趙曰豐屋大屋也珊瑚鈎屋中之簾鈎織成罽則罽上所織者麒麟也罽居例切旣以紫騮馬而又隨之以寳劒与慿几此数者皆冨貴家物不惜以饋邕矣義取無虚歲則以文得財矣新史云奉金帛請其丈前後所受鉅萬計分宅脫驂間感激懐未濟洙曰吴志周瑜推道南大宅以舎孫策与䇿爲友升堂拜母有無通共史記越石父賢在縲紲中晏子出遭之塗解左驂贖之延入爲上客急於養士如此趙曰以邕雖以文受人之財而氣義好與思古人分宅或脫驂之事其所感慨常以未濟爲懷衆歸賙給美擺落多藏穢洙曰邕素負美名頻被貶斥皆以邕能文養士而賈生信陵之流執事忌勝剥落在外趙曰在衆人則㱕其能賙給在邕之身則雖多藏而能擺落其穢也獨歩四十年風聽九臯唳洙曰邕知名長安中死天寳𥘉四十年間可謂獨歩矣累献詞賦甚稱玄宗旨後因上許中使臨索其新文以文章徹天聽故有九臯唳云趙曰傳言帝封大山還邕見帝汴州詔献詞賦帝恱上許京師中人索所爲新文以進上則聲聞于天可比鶴矣嗚呼江夏姿趙曰此黃香也漢人語云天下無雙江夏黄童竟掩宣尼袂洙曰孔子獲麟反𬒮拭面稱吾道窮往者武后朝引用多寵嬖否臧太常議洙曰邕有批韋巨源謚議文士推重之面折二張勢洙曰初邕爲左拾遺俄而御史中丞宋璟奏侍臣張昌宗兄弟有不順之言請付法斷則天𥘉不應邕在陛下進曰璟言事關社稷望陛下可其奏則天色解始允朱璟旣出或謂邕曰子名位尚卑若不稱旨禍福將不測何爲造次如是邕曰不顚不狂其名不彰衰俗凛生風排蕩秋旻霽忠貞負冤恨趙曰以邕忠正爲人所䧟宫闕深流綴趙曰此言天子深居九重不加省察也放逐早聮翩低垂困炎厲洙曰邕始以與張柬之善貶雷州玄宗初又貶崖州後召還爲姚崇所嫉貶柞州㣲爲陳州玄宗東封回邕謁見於汴獻辭賦稱旨頗自矜衒爲張說所惡發陳州贓事抵死許州人孔璋上䟽救之會赦免貶欽州後於嶺南從中官楊思朂討賊有功轉括渭淄三州刺史上計京師邕少有名累𬒳貶逐後進不識京洛阡陌聚觀以爲古人或將眉目有異衣冠望風尋訪門巷又中使臨問索其新文復爲人隂中竟不得進用也日斜鵩鳥入䰟斷蒼梧帝洙曰賈誼賦鵩集予舎又野鳥入室主人將去玄暉雲去蒼梧野趙曰言其悲愁如賈誼鵩鳥賦云庾子日斜鵩集余舎帝舜之狩至蒼梧而死今之梧州也榮洙曰一作䇿枯走不暇星駕無安稅洙曰李斯未知稅駕也趙曰榮枯之不常故奔走不暇所以無安息稅駕之地詩星言夙駕幾分漢庭竹洙曰漢制以竹使符分給郡守邕累爲刺史故曰幾分也夙擁文侯篲洙曰魏文侯擁篲以迎朋友終悲洛陽獄事近小臣敝禍階初負謗易力何深嚌洙曰邕與柳勣馬一疋及勣下嶽吉温令勣引邕議及休咎事遂誅趙曰天寳初栁勣有罪天獄邕甞遺勣馬故吉温使引邕甞以休咎相語隂賂遺竟杖死北海郡伊昔臨淄亭酒酣託末契洙曰甫有陪李北海宴歷下亭詩是也重叙東都别朝隂改軒砌鄭曰朝陟遥切論文到崔蘇洙曰崔信明蘇源明二人皆以文章擅丗指盡流水逝近伏盈川雄洙曰唐文苑傳楊炯爲盈川令卒張說曰楊盈川文思如懸河注酌之不竭旣優於盧照隣亦不減王勃未甘特進麗洙曰張說曰李嶠之文如良金美玉無施不可特進李嶠爲特進故也是非張相國相振一危脆洙曰玄宗東封回邕於汴州謁見累獻詞賦甚稱上㫖由是頗自矜衒自云當居相位又素輕張說與相惡時說爲中書令甚惡之趙曰指張說也邕素輕與張說相惡公詩言張說以國相勢力所能勝邕特邕身危脆易於一扼耳爭名古豈然洙曰魏文帝典論云文人相輕自古而然鍵捷欻不閉洙曰老子善閉者不用關鍵趙曰邕於關鍵則捷急而欻然不閉所以召禍鄭曰鍵巨展切鑰牝犍其献切門限也倒及吾家詩曠懷掃氛翳慷慨嗣眞作洙曰和李大夫趙曰公以詩自負如此言例則邕与公比肩以詩爲常例也氛翳言䜛謗之人也咨嗟玉山桂洙曰郄說云崑山片玉桂林一枝鍾律儼髙懸鯤鯨噴迢遰師曰鍾律喻詩有法度鯤鯨喻其雄健坡陁青州血趙曰言杖死之也師曰坡陁髙聚皃青州血謂死所蕪没汶陽瘞洙曰邕葬所也哀贈竟蕭條恩波延揭厲洙曰代宗時國恩例得贈秘書監子孫在如綫舊客舟凝滯洙曰不絶如綫江淹別賦舟凝滯於水濵趙曰存如綫傷李其無後也舊客則公自傷其流落於外未能乗扁舟以往也君臣尚論兵將帥接燕葪朗詠六公篇洙曰邕有張桓等五玉洎狄相六公詩憂來豁蒙蔽洙曰盧藏用甞謂邕如干將莫邪難与争鋒但虞傷缺耳後卒如其言趙曰嘆時之多艱當後如邕者慷慨有所陳說故詠其所作六公詩以解憂也公自注云桓彦範敬暉崔玄暉張柬之袁恕已也洎狄相六公六公篇詠其載邕傳故祕書少監武功蘇公源明武功少也孤趙曰源明京兆武功人故直以此名之徒歩客徐兖讀書東岳中十載考墳典洙曰按新史源明初名預字弱夫少孤寓居徐兖工文辭有名時下菜蕪郭忍飢浮雲巘鄭曰語蹇切負米晚爲身毎食臉必泫洙曰子路爲親百里負米源明養不及親負米自爲而巳故每食必泫夜字照爇薪夢符曰右按丈士傳侯瑾字子瑜家貧傭賃暮輙燒柴薪以讀書獨處一室如對尊賔垢衣生碧蘚庻以勤苦志報兹劬勞願洙曰以已勤苦之志報父母劬勞也學蔚醇儒姿洙曰賈山渉獵書記不能爲醇儒文包舊史善洙曰左傳序仲尼因魯史䇿書成文其餘皆即用舊史師曰源明甞私著國史後史館采其語故云云灑落辭幽人歸來潛京輦射䇿君東堂宗匠集精選制可題未乾乙科巳大闡洙曰源明天寳中及進士第更試集賢院漢書顔師古曰射䇿者謂爲難問疑義書之於䇿量其大小署爲甲乙之科列而置之不使彰顯有欲射者隨其所取得而釋之以知優劣文章日自負掾吏亦累踐趙曰累遷太子諭徳晨趨閶闔内足踏宿昔趼鄭曰古典切胝也一麾出守還洙曰源明累遷太子諭德出爲東平太守故召爲囯子司業也夢符曰右按文選屢薦不入官一麾乃出守趙曰宿昔趼言其由貧賤中也足胝曰趼莊子云百舎重趼是巳出守謂出爲東平太守黃屋朔風卷不暇陪八駿虜庭悲所遣趙曰朔風卷則明皇乗輿以禄山反而出狩源明不得扈從而留虜庭毎悲恨以遣懷耳八駿事周穆王乗八駿以出遊也平生滿樽酒蘇曰阮述愛詩好飲足不跡公卿大夫之門水邊林下放懷自若張翰相顧遇問其所欲述曰平生滿樽酒活計一張琴翰歎伏曰眞傲逸竒士非我輩比也斷此朋知展憂憤病二秋有恨石可轉洙曰安禄山䧟京師源明以病不受僞官趙曰詩曰我心匪石不可轉也其二秋憂憤則石可轉而吾心不轉焉此言源明不汙賊也肅宗復社稷得無逆順辨洙曰肅宗復兩京權考功郎中知制誥范曄顧其兒洙曰沈休文宋書云范曄字蔚宗爲髙祖相國掾稍遷太子詹事坐謀反誅范泰之子趙曰范曄坐謀反誅臨刑醉其子藹亦醉取地土及果皮以擲曄曄問曰汝瞋我耶藹曰今日何縁瞋但父子同死不能不悲李斯憶黃犬洙曰李斯傳二丗二年七月具斯五刑論腰斬咸陽市顧謂其子曰吾欲與若復牽黄犬俱出上蔡東門逐狡兎豈可得言受僞官之人如范李之顧戀也袐書茂松意洙曰源明後以袐書少監卒茂松意以不變節於姦危如松栢不爲風霜所奪也載從祠壇墠前後百卷文枕藉皆禁臠趙曰禁臠言其文之美也出晉元帝始鎮建業每得二豚以爲珎膳項上一臠尤美輙以薦帝呼爲禁臠篆刻揚雄流溟漲木末淺趙曰揚雄以賦爲童子雕蟲篆刻然竟爲長揚羽賦見稱於時溟漲謂其文波瀾浩汗雖溟海之張其本末比之猶爲淺青熒芙蓉劒師曰言能斷决也犀兕豈獨剸洙曰吴越王允常取純鈎劒示薛燭曰先乎如屈陽之華沉沉如芙蓉始生於湖王子淵頌巧冶鑄干將之樸水斷蛟龍陸剸犀兕鄭曰剸止兖切截也反爲後輩䙝予實苦懷𬗟煌煌齋房芝事絶萬手搴洙曰漢武帝大興祠齋房生芝而作歌肅宗時宰相王璵以祈禬進勸上興祠禱禁中稍崇淫祀源明数進時政得失鄭曰搴九輦切取也垂之俟來者正始徴勸勉趙曰源明所言可以垂後丗法乃正始之道也不要懸黄金胡爲投亂贙洙曰獸名似犬修可曰按爾雅贙有力注云出西海大秦國似狗多力獷惡炙轂子載贙銘曰爰有獷獸厥形似犬飢則馴服飽則反眼出于西海名之曰畎趙曰所以美之且危之也乳贙謂乳虎也蓋言安媚則黄金可惡而切直犯上之怒不啻投飢贙也贙乎大反結交三十載洙曰任彦升哭雲僕射結懽三十載生死一交情吾與誰遊衍洙曰新史亦言源明雅善杜甫鄭䖍滎陽復冥寞衆罟以横骨鄭曰上户孟切下音畎洙曰謂鄭䖍也嗚呼子逝日始㤗則終蹇長安米萬錢凋䘮盡餘湍趙曰言源明未死間猶及肅宗反正之後時巳向㤗矣而源明死後時復屯蹇所以有米萬錢而至凋䘮也舊注所引非戰伐何當解歸㠶阻清沔尚纒漳水疾洙曰劉公幹余嬰沉痼疾竄身清濵漳趙曰公言在雲安不得沂汚以㱕永負蒿里餞洙曰蒿里送士大夫庻人挽歌蘇曰徐翔之姪陵泣曰永負蒿里之哀東門相餞趙曰傷其不得一弔酹之故著作郎貶台州司户滎陽鄭公䖍鶢鶋至魯門鄭曰鶢干元切鶋斤求切不識鍾鼔饗洙曰莊子至樂篇昔者海烏止於魯郊魯侯御而觴之于廟奏九韶以爲樂具太牢以爲膳鳥乃眩視憂悲不敢食一臠不敢飲一杯三日而死此以巳養養鳥也非以烏養養烏也海烏鶢鶋也孔子謂臧文仲不智者三而祀鶢鶋一也注鶢鶋止於魯東門文仲使國人祀也孔翠望赤霄愁思彫籠養洙曰孔翠翡翠孔雀也其志在丹霄然終不免籠樊之愁者以其質之異於衆离也故鷦鷯賦彼鷲鴞鵾鴻孔雀蓊翠或陵赤霄之際或託絶垠之外翰羽足以冲天觜距足以自衞然皆負繒纓繳羽毛入貢何者用於人者然也趙曰言鄭公如鶢鶋如孔翠非鍾鼓所能樂之雕籠所能拘之也師曰䖍嗜酒放誕不樂檢束更置廣文館以䖍爲博士䖍聞命訴宰相何異饗鶢鶋以鍾鼓養孔雀以雕籠乎滎陽冠衆儒早聞名公賞地崇士大夫况乃氣清爽洙曰文藝傳鄭䖍鄭州滎陽人天寳初爲恊律郎天然生知姿學立游夏上神農或闕漏黄石愧師長洙曰黄石古書也夢符曰右按前漢張良傳父出一編書曰讀是則爲王者師後十年㒷十三年孺子見我濟北榖城山下黄石即我矣遂去不見丗之所謂三畧者即其書也此言黄石愧師長名其人耳非書也公著薈蕞等諸書之外又撰胡本草七卷趙曰鄭䖍自著書外又選胡本草七卷故公所言𥙷闕乃神農本草之所不載也張良遇黄石公爲師今公言愧者愧則不敢爲䖍之師長也藥纂西極名兵流指諸掌貫穿無遺恨薈蕞何技痒鄭曰薈烏外切蕞祖外切小皃痒以兩切本作癢圭臬星經奥蟲篆丹青廣洙曰按新史䖍集撰當丗事著書八十餘篇有窺其藁者上書告䖍私傳撰囯史䖍蒼黄焚之坐謫十年名其書爲㑹粹孔子作春秋游夏不能賛皇猷䖍私撰國史是出其上也神農黄石藥繤兵流皆古書也言䖍無不貫穿復通游藝星經丹青之類趙曰圭泉言其善地理也選言陳圭置臬圭者土圭所以側日影臬者表臬所以度廣狹虫篆言能書丹青又言能畫子雲窺未遍洙曰揚雄字子雲少好學愽覧無所不見蘇曰劉薦語陳貞曰吾腹中書皆揚子雲窺未徧者方朔諧太枉洙曰東方朔上書曰臣年十三斈三冬文史足用十五學擊劒十六學詩書誦二十二萬言十九學孫吴兵法戰陣之具征鼓之教亦誦二十二萬言凡臣朔已誦四十四萬餘言趙曰言䖍能知荒逺之所在也東方朔每言其所指皆神仙之處故云諧枉尤大迃神翰顧不一體變鍾兼兩洙曰䖍好書及畫恨無𥿄慈恩寺貯杮葉數屋䖍取隷書歲乆皆遍修可曰書苑曰䖍善草隷吕揔云䖍書如風送雲收霞催月上鍾兼兩鍾繇鍾會也父子善隷書皆盡其妙或云兼兩車也漢吴恢爲南海太守欲殺青冩書子祐諫曰此書若成則載之兼兩注車有兩輪故稱文傳天下口蘇曰相如片文蒦字朝出而暮傳天下古詩云髙文滿天下籍籍喧萬口大字猶在牓昔獻書畫圗新詩亦俱往滄洲動玉陛寡鶴誤一響三絶自御題四方尤所仰洙曰䖍自冩其詩并畫以獻帝大署其尾曰鄭䖍三絶宣一作寡也嗜酒益踈放洙曰䖍嗜酒踈放故杜甫贈詩云頼得蘇司業時時与酒錢蘇司業源明也蘇曰陶潜阮籍軰嗜酒踈放逸山野終免其禍當丗莫及其髙見自全之機彈琴視天壤洙曰嵆康曰目送歸鴻手彈五絃形骸實土木親近唯几杖趙曰言親近於天子今以言几杖則未甞暫離之意未曽寄官曹梅曰謂不寓意於官職突兀倚書幌洙曰䖍𥘉坐謫還京師上爱其材欲置左右以不事事更爲置廣文館以䖍爲博士䖍間命不知廣文曹司何在訴宰相曰上増國斈置廣文館以居賢者令後丗言廣文博士自君始不亦美乎晚就芸香閣洙曰遷著作郎魚豢典畧云芸香辟紙魚蠧故藏書臺稱芸臺胡塵昏坱莽曾曰映莽廣皃反覆歸聖朝點染無滌盪趙曰䖍值禄山反爲受䖍水部郎中因稱風緩求市令潛以密章逹靈武故言無一點所染不煩澆蕩之老蒙台州掾泛泛浙江槳洙曰禄山反遣張通儒劫百官置東都僞授䖍水部郎中因稱風緩求攝市令潛以密章逹靈武賊平免死貶台州司户叅車履穿四明雪洙曰東郭先生乆待詔公車貧困其履行雪中有上足跡踐也飢拾楢溪橡洙曰四明楢溪皆浙江地名言䖍貧困拾橡而食之定功曰按唐史䖍以汚禄山僞官貶台州司户四明及楢溪皆属台州孫綽賦云登陸則有四明天台趙曰暗使莊子冬日食橡栗空聞紫芝歌不見杏壇仗洙曰莊子魚父篇孔子遊乎緇帷之林休坐乎杏壇之上弟子讀書孔子絃歌鼔琴奏曲天長眺東南秋色餘魍魎洙曰天台賦始經魑魅之塗卒踐無人之境師曰言荒僻也别離慘至今班白徒懷曩洙曰曩昔時也春深㤗山秀葉墜清渭㓪劇談王侯門野稅林下鞅洙曰鮑明逺無田稅歸鞅操𥿄終夕酣時物集遐想師曰自春深㤗山秀至此追憶昔時與䖍聚會于關中春和秋凉之日或劇談或解鞅操紙賦詩把酒酣飲今詞場踈闊故傷之詞塲竟踈闊平昔濫吹奬洙曰甫自言甞爲䖍濫吹奬也廬諶濫吹乗名實趙曰指言昔與鄭遊於詞翰之塲而今竟踈逺間闊仍憶鄭之平昔濫有推奬扵巳也百年見存没洙曰百年交情見於存没之際䖍至台州後數年卒牢落吾安放洙曰一云放趙曰孔子將死子貢曰㤗山其頽吾將安仰梁木將壞吾將安放蕭條阮咸在岀處同丗網洙曰阮咸阮照子也任逹不拘雖處丗不交人事他日訪江樓含悽述飄蕩洙曰著作與今祕書監鄭君審篇翰齊價謫江陵故有阮咸江樓之句趙曰阮籍與其姪共爲竹林之遊今以阮咸比鄭審故云空餘跡咸在也故右僕射國相張公九齡相國生南紀師曰滔滔江漢南國之紀說者援是詩以江漢爲南紀非也蓋南紀乃分野名唐天文志云東循嶺徼逹甌閩中是謂南紀所以限蠻夷也張相國曲江人曲江隷韶州正嶺徼甌粤之地大抵自江漢以南皆謂之南紀非特江漢而巳金璞無留礦洙曰張九齡父爲韶州别駕因家于始興今爲曲江人九齡㓜聦敏善屬文以書于廣州刺史王方慶方慶大嗟賞之曰此子必䏻致逺金玉未成器曰礦言九齡成器早故不留礦也田曰圎覺經云譬如銷金礦金非銷故有雖復本來金皆以銷成就一成真金體無復重爲礦趙曰言巳爲金而不復留在鑛以譬張曲江出而應用不復退縮也仙鶴下人間獨立霜毛整洙曰言九齡之出也如仙鶴然㓗白修整矯然江海思蘇曰阮熈年來浩然起江海之思復與雲路永趙曰矯然有江海之思而復思奮飛與雲路齊永師曰言其志趣髙逺前程亦不淺也寂寞想上階未遑等箕頴洙曰堯土階三尺想士階有致君堯舜之心也有致君之心故未遑於箕頴箕山也頴水也巢父許由所隱之也上君白玉堂倚君金華省洙曰九齡登進士第應拔萃登乙科拜校書郎玄宗在東宫舉天下文藻之士親加䇿問九齡對䇿髙第遷右拾遺由玉堂金華省言直登清華之地趙曰此言張曲江爲秘書郎爲左拾遺爲左𥙷闕爲中書舎人爲集賢院學士是也碣石歲崢嶸天地日蛙黽師曰碣石山在東禄山所據之方崢嶸髙大皃禄山有叛志嘗自髙大視天地間如蛙黽然全無忌禪相國判其有反意屢請于帝退食吟大庭何心記榛梗洙曰大庭古至治之國也言九齡雖退食之間未甞忘致治也榛梗言不以嫌猜爲心也骨驚畏曩哲洙曰曩哲昔賢也謂其不若故骨驚鬒變負人境洙曰鬒黒髮也變而爲白以負人事而已謝玄暉誰能鬒不変趙曰上句言畏其不逮故前人下句憂其髮白而將老皆傷功名之不立也江淹賦云心折骨驚雖蒙換蟬冠右地恧多幸洙曰侍中冠加貂蟬九齡爲相以文雅爲上知右相李林甫惡之引牛仙客以傾之遂罷趙曰此乃侍中事而史不載漢官儀侍中冠武帝大冠加金璫附蟬爲文貂尾爲飾謂之貂蟬也下句則以九齡以尚書右丞相罷言在右地巳慚恧爲多幸何者有林甫之嫉仙客之憾則得此爲幸矣敢志二踈歸洙曰踈廣爲漢太子太傅謂兄子受曰吾聞知足不辱知止不殆豈如父子相隨出關歸老不亦善乎遂上䟽乞骸骨上言之公卿設祖道供帳東都門外痛迫蘇耽井蘇曰神山蘇耽種橘鑿泉以救時疫病者食橘葉飲泉即愈趙曰神仙傳蘇仙翁名眈忽辭母去母曰使我如何存活仙翁明年天降疫疾庭中水簷邊橘樹可以代養紫綬映暮年荆州謝所領洙曰𥘉九齡爲相薦長安尉周子諒爲監察御史至是子諒以妄陳休咎上親加請問令於朝堂决殺之九齡坐引非其人左遷荆州大都督府長史庾公興不淺洙曰庾亮鎮武昌諸佐吏殷浩之徒乗月登南樓俄而不覺亮至將起避之亮徐曰諸公少住老子於此興不淺便據胡床與浩等談詠其坦率如此黃霸鎮每静洙曰循吏傳黃霸與用寛和爲治擢爲楊州刺史潁川太守治爲天下第一自漢興言治民吏以覇爲首賔客引調同洙曰謝靈運異代可同調諷詠在務屏詩罷地有餘篇終語清省一陽發隂管趙曰謂如黃鍾之律也言其詩之和而可聽耳淑氣含公鼎趙曰謂如大烹之和也言其詩之美而可味於口乃知君子心用才文章境洙曰九齡善屬文有集二十卷散帙起翠螭倚薄巫廬並洙曰謝霊運散帙問所知巫廬二山名趙曰言開散曲江文帙神物歘起其髙至並巫廬之山也廣雅云龍有角曰螭師曰公有集二十卷荆人刻之碑螭即碑頭刻螭文也倚薄巫廬並巫廬二山其才氣能与二山之氣相倚迫也綺麗玄暉擁洙曰謝眺字玄暉少有美名爲文綺麗牋誄任昉騁洙曰任昉字彦升長於牋誄自我一家則未闕隻字警洙曰史記序勒成一家傳序隻字之褒千秋滄海南名繫朱鳥影趙曰韶州即滄海之南朱鳥南方之宿當時謂九齡爲滄海遺珠則有名稱矣歸老守故林戀闕悄延頸趙曰九齡在荆州之乆封始興縣伯諸還展墓也戀闕言其心不忘君也波濤良史筆蘇曰班孟堅信知一代良史下筆善惡瀾翻而昭著無絶大庾嶺洙曰限賦終蕪絶於異域九齡自荆州請㱕拜墓因遇疾卒年六十八謚曰文憲至德𥘉上皇在蜀思九齡先斍安禄山面有反相乃下詔褒贈司徒仍遣使就韶州致祭趙曰意謂九齡之文如波濤之翻可充良史之筆惜乎蕪没隔絶於大庾嶺之外也向時禮數隔制作難上請趙曰此言帝眷巳衰難以制作上請於朝也再讀徐孺碑猶思理煙艇蘇曰謝安石理五湖煙艇趙曰後漢徐孺漢之髙士也曲江爲之墓碣公之句意謂今再讀之而猶思理煙艇則以慕徐孺髙風而不忘江漢之念别房太尉墓彦輔曰閬州太尉名琯常与嚴武等交結貶邠州刺史上元元年爲漢州刺史寳應二年拜刑部尚書在路遇疾廣徳六年卒於閬州僧舎年六十七他郷復行役駐馬别孤墳近淚無乾土趙曰言淚多而濕之也低空有斷雲對碁陪謝傅洙曰晉謝安傳安贈太傅𥘉苻堅入㓂諸將退敗相継次于淮肥京師震恐加安征討大都督妷謝玄入問計安夷然无懼色玄不敢言乃令張玄重請問遂命駕出墅親朋畢集至夜還指受帥將各當其任玄等旣破堅有驛書至安方對客圍碁看書旣竟便攝於床上了無喜色碁如故客問之徐啓云小兒遂巳破賊旣罷還内過户限心喜甚不斍展齒折其矯情鎮物如此把劒覔徐君洙曰新序曰延陵季子將西聘晉帶寳劒以過徐君徐君不言而色欲之季子爲有上國之事未献也然心許之矣使於晉顧返則徐君死於是以劒帶徐君墓樹而去江淹詩延陵輕寳劒謝霊運詩延陵協心許解劒非所惜逢原曰謝傳徐君指房太尉也唯見林花落鶯啼送客聞承聞故房相公靈櫬自閬州啓殯歸葬東都有作二首楷曰房琯字治律河南人逺聞房太守歸葬陸渾山洙曰伊洛間有陸渾山昔辛有適伊川見被髮而祭者言此地當夷後爲陸渾之戎所有山因而得名鄭曰十道志山在洛陽趙曰舊本作太守非善本作太尉盖琯謫漢州刺史召拜刑部尚書道病卒贈太尉不應呼之爲太守也一德興王後洙曰周德以興王業也伊尹咸有一徳趙曰琯爲相廟堂固以一德興王矣孤魂乆客間洙曰房公客死閬州孔明多故事洙曰蜀志陳壽上言臣壽等言前有著作郎侍中領中書監濟北侯臣荀朂中書令關内侯臣和嶠奏使臣定故蜀丞相諸葛亮故事亮佐危國負阻不賔然由存錄其言恥善有遺誠是大晉光明至德澤𬒳无疆自古以來未之有倫也輙刪除復重隨類相從凡爲二十四篇篇名如右安石竟崇班洙曰謝安薨時六十六帝三日臨於朝堂賜東園祕器朝服贈太傳謚曰文靖以无下舎詔府中備凶儀及葬加殊禮依大司馬亘温故事師曰孔明多故事喻房公奏議可爲朝廷典故安石竟崇班喻房公死後竟追贈褒崇之也嘉陵縣屬閬州他日嘉陵涕鄭曰嘉陵江名仍霑楚水還趙曰霊櫬自閬州起發則由嘉陵江而下故云丹旐飛飛日洙曰丹旐銘旌也寡婦賦龍轜儼以星駕飛旐翩以啓路初傳發閬州風塵終不解趙曰時吐蕃未息也江漢忽同流趙曰霊櫬所經者江与漢也師曰風塵終不解言盗賊未息而房公忽与江漢同遊故嘆惜之劒動新身匣趙曰善本作親身方有義書歸故國樓蘇曰陳惇放㱕故囯載書一千卷㱕家起楼今西歧觀風楼是也盡哀知有處爲客恐長休趙曰此因逺送霊櫬之㱕有感而言也哭嚴僕射歸櫬素幔隨流水歸舟返舊京洙曰舊京故國修可曰盧子諒詩南望舊京路老親知洙曰知一作如宿昔按新史武卒母哭且曰今而後吾知免爲官婢矣趙曰言嚴公之母尚健如宿昔耳舊注所引新史非是不知何自得之部曲異平生洙曰言部曲有異於存日也宋鮑昭東武吟將軍旣即丗部曲亦罕存後漢光武紀注大將軍營有五部三校尉部下有曲曲有軍候一人風送蛟龍雨洙曰見蛟龍雲雨注趙曰以嚴公若蛟龍則風之所送者乃蛟龍雨也師曰子美詩云蛟龍得雲雨言賢者之得勢今云風送蛟龍雨雨𬒳風吹断則蛟龍失勢可知天長驃騎營洙曰晉書齊献王攸遷驃騎將軍時驃騎當罷營兵士數千人戀攸恩德不肯去一哀三峽暮遺後見君情趙曰言所以遺傳於後世見君有恩德於公之情如此也師曰遺後者謂恩德遺与後人使人哀思之不忘則君之情可見也哭李尚書之芳漳濵與蒿里逝水竟同年洙曰劉公幹余嬰沉痼疾竄身清漳濵又云逝者如流水哀此遂離分李延年分送䘮歌爲二等薤露送王公大人蒿里送士大夫庻人使挽柩者歌之爲挽歌欲掛留徐劒洙曰見上把劒覔徐君注猶廻憶載船洙曰見上應尋戴安道注相知成白首洙曰潘安仁投分寄石友白首同所㱕此别間黃泉洙曰左傳不及黄泉風雨嗟何及江湖涕泫然鄭曰泫胡畎切洙曰詩何嗟及矣文中于泫然流涕修文將管輅洙曰見上修文地下郎注趙曰言李尚書之有竒才應如魏之管輅也奉使失張騫洙曰見上查上覔張騫注史閣行人在洙曰周禮大行人小行人趙曰史閣言其書之史冊也詩家秀句傳蘇曰陸士龍題詩對南山日晚得秀句客亭鞍馬絶趙曰言其死於道路也彭曰此句言子美爲客停留於此李公无復鞍馬來相尋矣旅襯網蟲懸洙曰沈休文詩髙車塵未成珠履故无声賔階緑錢滿客位紫苔生又網蟲垂户織夕鳥旁簷飛復塊昭丘逺洙曰登楼賦西接昭丘楚昭王墓鄭曰荆州記當陽東南七十里有昭王墓故云云歸魂素滻偏洙曰宋玉魂兮㱕來鄭曰滻所簡切水名在京兆趙曰素滻長安之水也言李尚書乃長安人也潘安仁西征賦地有玄灞素滻大臨曰此二句言李葬於此樵蘇封葬地喉舌罷朝天洙曰李固云陛下之有尚書猶天之有北斗斗爲天之喉舌尚書亦猶陛下喉舌秋色凋春草王孫若箇邊洙曰招隱芳草兮萋萋王孫兮不歸大臨曰此句言李即与春草爲鄰矣重題涕灑不能收哭君餘白頭兒童相顧盡竦曰言少時相顧今盡於此矣宇宙此生浮江雨銘旌濕洙曰記曰銘明旌湖風井逕秋洙曰蕪城賦歌曰邊風起兮城上寒井逕戚兮丘隴殘還瞻魏太子賔客減應劉洙曰曹丕書曰應徐陳劉一時俱逝矣趙曰公自注云公歴禮部尚書薨于太子賔客應則應瑒劉則劉焯送盧十四弟侍御護韋尚書靈櫬歸上都二十韻素幕渡江逺朱幡登陸微洙曰漢二千石朱幡兩輪趙曰朱幡丹旐也舊引漢二千石朱兩轓誤矣轓字從車幡字從巾義不同也悲鳴駟馬顧趙曰有戀主之意失涕萬人揮洙曰陸士衡詩揮淚廣川隂又得與故人揮叅佐哭辭畢門䦨誰送歸洙曰見門闌多喜色注從公伏事乆之子俊才稀長路更執紼此心猶倒衣洙曰詩自公召之顛倒裳衣感恩義不小蘇曰夏侯勝感恩戀德義實不小懷舊禮無違墓待龍􅋮詔洙曰漢献加魏武九錫曰龍驤虎視旁眺八方修可曰唐史遺事武后幸洛陽至閿郷縣東騎不進召巫問之巫曰晉龍將軍王濬云臣墓在道南每爲樵採所苦聞大駕至故哀求后遂詔云墓百步不得樵採子美八哀詩亦云虚無馬融笛悵望龍驤塋趙曰晉王濬爲龍驤將軍卒葬栢谷中大營塋域待龍􅋮詔則言盧尚書之墓如王濬者也臺迎獬豸威鄭曰豸宅買切趙曰獬豸侍御史冠也獬豸獸名一角知人曲真而觸不直者此言韋尚書霊櫬至上都而送之者盧侍御如此深衷見士則雅論在兵機趙曰丗說鄧艾年十二至頴川讀陳太丘碑丈曰言爲丗範行爲土則遂自名範字士則戎狄乗妖氣塵沙落禁闈趙曰禁闈天子之内也此言吐蕃䧟京師也往年朝謁斷修可曰言去上都之乆而断朝謁也佗日掃除非趙曰言除掃吐蕃不得上䇿所以爲非也但促銅壷箭洙曰漏刻銘筮筩方圎之制注金謂壷又云銅史司刻金徒抱箭趙曰欲上之未明求衣而早朝也休添玉帳旂洙曰見空留玉帳旂注趙曰言不必添兵也玉帳將軍之帳也動詢黄閣老洙曰見扈聖登黄閣注肯慮白登圍洙曰前漢匈奴傳髙帝至平城歩兵未盡到冒頓緃精兵三十餘萬圍於白登七日漢兵中外不得相救䬲匈奴騎其西方盡白東方盡䭾北方盡驪南方盡騂髙帝乃使間厚遺閼氏迺謂冒頓曰兩主不相困今得漢地單于終不能居之且漢主有神單干察之冒頓亦與韓信將王黄趙利期而兵乆不來疑其與漢有謀亦取閼氏之言廼爲開一角於是髙皇帝令士皆持滿傅矢外郷從解角直出得與大軍合而冒頓遂引兵罷使劉敬結和親之約師古曰白登在平城東南去平城十餘里趙曰言天子雖屢詢大臣而莫知以白登之圍爲慮者此豈勸親征之徒歟黄閣者三公也宋忠曰三公黃閣鄭曰白登地名在平城東南十餘里萬姓瘡痍合蘇曰邪元云萬姓瘡痍始合兵甲尚未全息恐西北乗勢再爲患也趙曰言其困扵誅求役使也羣兇洙曰一云雄嗜慾肥趙曰言將帥乗此爲驕也刺規多諌淨趙曰所望於盧侍御也端拱自光輝儉約前王體風流後代希趙曰言盧侍御之登對所論之事如此對敭期特逹鄭曰敭與揚同衰朽再芳菲趙曰言對敭天子之前當在特逹而勿委靡則衰朽之人再獲芳菲言同受其業也空裏愁書字洙曰見咄咄正書空注山中疾採薇洙曰伯夷傳登彼首陽采其薇矣撥盃要忽罷抱被宿何依蘇曰聶授抱𬒳隨王肅棺宿趙曰撥盃者揮盃也卽别矣撥盃之相要忽罷平昔抱𬒳就宿今又何依也眼冷看征蓋兒扶立釣磯清霜洞庭葉故就别時飛洙曰楚辭湘夫人洞庭波兮木葉下哭李常侍嶧二首鄭曰嶧夷益切一代風流盡蘇曰曹桴曰子建没陳劉俱逝一代風流從此盡矣後丗誰氏可繼髙名趙曰南史張緒死其從弟融於緒靈前酌飲慟哭曰阿兄風流頓盡修文地下深洙曰見修文地下郎注顔淵爲地下修文郎斯人不重見蘇曰山巨源哭嵆原曰中散死埋玉重泉沉珠滄海不重見斯人矣趙曰孔子言伯牛之疾曰斯人也而有斯疾也蓋嗟其人之賢也將老失知音洙曰伯牙以鍾子期爲知音子期死而牙絶絃蘇曰鮑叔云將老矣遽失知音趙曰指李常侍如鍾子期也曹丕與吴李質書曰昔伯牙絶絃於鍾子期仲尼覆醢於子路痛知音之難遇傷門人之莫逮也短日行梅嶺鄭曰大庾嶺寒山落桂林洙曰山一作江趙曰言李常侍之櫬自廣南來也大庾嶺多梅故謂之梅嶺廣志曰桂生於髙山之嶺其類自爲林長安若箇畔猶想映貂金洙曰侍中冠貂蟬阮脩以貂蟬換酒青瑣陪雙入銅梁阻一辭洙曰見通籍踰青瑣注蜀有銅梁縣風塵逢我地江漢哭君時趙曰言當風塵之際相逢於江漢而今在江漢聞其䘮而哭也次第尋書札呼兒檢贈詩洙曰古詩遺我一書札又呼兒烹鯉魚文選有贈荅詩發揮王子表不愧史臣詞定功曰常侍者宗室之子也故用王子表字前漢書有王子侯表哭韋大夫之晉悽愴郇瑕邑洙曰左傳晉謀去故絳諸大夫曰必居郇瑕氏之地鄭曰郇湏倫切國名差池弱冠年洙曰曲禮二十曰弱冠蘇曰蘇代云弱冠之年差池文采士人叨禮數文律早周旋洙曰左傳與君周旋臺閣黃圖裏洙曰三輔黄圖又漢宫闕詔簪裾紫蓋邊洙曰沈沐文碑陪龍駕於伊洛待紫蓋於咸陽尊榮真不忝端雅獨翛然貢喜音容間洙曰見竊効貢公喜注馮招病疾纒洙曰左太冲馮公豈不偉白首不見招鄭曰馮招馮唐南過駭蒼卒鄭曰上采莽下七没切北思悄聮綿洙曰洞簫賦吟氣遺往聮綿飄敞又云翩綿聮以牢落鵩鳥長沙諱洙曰見冶濕愁飛鵩注犀牛蜀郡憐洙曰見石犀牛行素車猶慟哭寶劒欲髙懸洙曰見把劒覔徐君注漢道中興盛韋經亞相傳洙曰建武永平未盡中興之美韋賢不如教子一經冲融標丗業磊落映時賢城府深朱夏江湖眇霽天倚樓關樹頂洙曰古詩西北有髙樓交䟽結綺䆫飛旐泛堂前洙曰寡婦賦飛旐翩以啓路弈幕欵風鷰洙曰弈幕霄懸謝玄暉詩風簾入雙鷰笳簫急暮蟬興殘虚白室鄭曰興許應切洙曰莊子虚室生白跡斷孝廉船洙曰丗說張慿舉孝廉負其才自謂必叅時彦𥘉欲詣劉真長郷里及同舉者共笑之張遂往詣真長延之上座凊言彌日因留宿至曉張退劉曰卿且前去當取卿共詣撫軍張還船同旅問何處宿張笑而不荅須臾真長遣傳教覔張孝簾船同旅宛愕即同載詣撫軍至門劉進曰下官今日與公得一太常愽士撫軍與之言咨嗟稱善即用爲太常愽士童孺交遊盡喧卑俗事牽老來多涕淚情在強詩篇誰繼方隅理朝難將帥權春秋褒貶例名器重雙全師曰郇瑕晉地韋大夫靈櫬歸晉故子美悽愴以傷之子美少與公結交故云差池弱冠年王陽在位貢禹喜而彈冠子美上韋左丞詩云竊効貢公喜今巳死故曰貢喜音容間子美擬効馮公之招隱柰爲疾病所纒而巳鵩鳥長沙諱子羡自言斥逐困於此地也犀牛蜀郡憐言蜀人思韋之德也綺樓關樹頂言奠樓之髙也帟幕欵風鷰言子羙之失韋無所棲託如燕之巢于風幕也惟名與器不可以假人韋之化去朝廷慎難不輕以帥權授人故云誰繼方隅理聞髙常侍亡忠州作鮑曰髙適也本傳繼廣德元年後言召爲刑部侍郎左散騎常侍歸朝不相見蜀使忽傳亡虚歷金華省洙曰江淹上建平王書升降承明之闕出入金華之殿班固傳王鳯薦班伯召見宴昭殿誦說有法拜爲中常侍時上方嚮學鄭寛中張禹朝夕入說尚書論語於金華殿中詔伯受焉數年金華之業絶出注金華殿在末央宫何殊地下郎洙曰丗說顔回爲地下修文郎致君丹檻折洙曰見折檻詩注哭友白雲長蘇曰山巨源哭嵆中散曰白雲央央我心悲傷揮哭望雲雲路阻長趙曰自渝州望長安而哭爲白雲長矣獨歩詩名在趙曰曹子建與楊德祖書曰昔仲宣獨歩於漢南田曰南史沈約謂王荺文章之美可謂後來獨步秪令故舊傷洙曰適有詩名於時哭長孫侍御道爲詩書重孝祥曰人誰不讀書但誦其章句而不明其道不足重也長孫之學獨爲可重以其逹道故也名因賦頌雄逸曰子雲賦頌名重漢朝禮闈曽擢桂洙曰禮闈禮部所設以取士也郄詵對武帝云臣舉賢良對䇿爲天下第一猶桂林一枝憲府舊乗騘洙曰御史所居之署漢謂之御史府亦謂之憲臺唐龍朔中爲東宫憲府後漢桓典拜侍御史是時宦官秉權典執政無所回避常乗騘馬京師畏憚爲之語曰行行且止避騘馬御史流水生涯盡趙曰子在川上曰逝者如斯夫不舎晝夜宋曰生涯盡言其清貧也浮雲丗事空趙曰浮雲易散之物故以比丗事所以悼之也唯餘舊臺栢蕭瑟九原中洙曰成帝時御史府中列栢樹檀弓曰文子曰從大夫於九京也注晉卿大夫之墓地在九原京當作原趙曰亦御史事漢朱愽爲御史大夫其府列栢樹常有野烏數千棲宿其上古注云檀弓注卿大夫之墓地在九原哭王彭州掄執友驚淪没趙曰禮記執支稱其仁也斯人巳寂寥新文生沈謝洙曰沈約謝靈運也趙曰以沈謝比之則王君必能文矣異骨降松喬洙曰王君平謂茅盈曰子有異骨可學仙漢文帝壽命非松喬得神仙赤松子王喬也北部初髙選洙曰漢有北部太守趙曰言其初官得京畿尉也故用北部事曹操年二十除洛陽北部尉舊注謂北部太守豈有才起身而遂爲太守者乎東堂早見招洙曰晉郄詵還遷雍州刺史武帝於東堂會問詵曰卿自以爲何如詵對曰臣舉賢良對䇿爲天下第一猶桂林之一枝崑山之片玉帝笑侍中奏免詵官帝曰吾與之戲耳不足爾蛟龍纒倚劒趙曰言禁從之地變化者如蛟龍纒繞其所倚之劒鸞鳳夾吹簫洙曰王子晉趙曰鸞與鳯夾其所吹之簫也秦有簫史教弄玉以吹簫而鳯凰降舊注於此句下注王子晉誤惑學者子晉乃是吹笙非簫也歷職漢庭乆洙曰職任也中年胡馬驕洙曰謂安史亂兵戈聞兩觀洙曰東京賦建象魏之兩觀寵辱事三朝洙曰随國之寵辱趙曰謂明皇肅宗與當日代宗也蜀路江干窄洙曰見謾勞車馬駐江干注彭門地里遥洙曰彭門地名屬彭州鄭曰即彭州即兩峯相對曰天彭解龜生碧草洙曰謝靈運解龜在景平謂解去所佩龜郎諌獵阻清霄洙曰司馬長卿上書諌獵趙曰王君必彭州替罷而有封事於雖朝上而不報也頃壯戎麾出叨陪幕府要趙曰言王在彭州而叅成都節度軍謀矣將軍臨氣候趙曰指言揔戎之人壯士塞風飈趙曰指言戦闘之士井渫洙曰又作滿鄭曰渫悉列切泉誰汲洙曰易井之九三井渫不食爲我心惻可用汲注言㓗已而不見用也烽踈火不燒趙曰凡軍旅所在必先論井泉凡有警必頻舉烽燧今井泉不汲而烽火不燒則無事矣皆以王君參謀所致而然也前籌多自暇洙曰張良借筯前籌隱几接終朝鄭曰隱去聲洙曰孟子隱几而卧翠石俄雙表洙曰蔡伯喈樹碑表墓寒松竟後凋洙曰語歲寒然後知松栢之後凋贈詩焉敢墜染翰欲無聊蘇曰晁建中僻居山林經年不識車馬養成嬾散或荅親友書亦無聊染翰誰復著書者耶趙曰謂不敢以其死而廢詩篇之贈然染翰之間自痛悼而其情無聊矣再哭經過罷洙曰橋玄見曹植曰天下將亂安生民者其在君乎後玄死操經過玄墓輙愴悽致祭感其知巳也趙曰聞其死巳哭矣靈櫬從舟中經過䕫州則公又再哭焉離魂去住銷洙曰言去者有思念之心住者有思念之意故皆銷魂也趙曰離别之魂或去自蘷州或住䕫州皆自銷矣之官方玉折洙曰蕭望之便道之官王褒死如玉折也寄葬與萍漂洙曰寄葬莽也趙曰追悼其才赴任而遂如玉折又傷念其寄殯若萍泛未安也曠望渥洼道洙曰渥洼水出龍馬謂王之如龍馬不可復見矣霏㣲河漢橋洙曰烏鵲填河爲橋以渡牛女謂王之魂當在仙境矣趙曰言王君之䘮未能歸郷言其所出陸馬所經之塗與夫渡橋而往方其曠望之間霏微之眇矣天馬篇天馬徠循東道此所謂道也河漢橋如丗傳織女渡河而烏鵲爲橋也舊所引王之魂當在仙境非是夫人先即丗令子各清標趙曰歎王君没後如此巫峽長雲雨洙曰見峽内多雲雨注趙曰言公身之在䕫秦城近斗杓洙曰斗杓斗極也趙曰公懷長安之逺鄭曰杓卑遥切柄也馮唐毛髮白歸興日蕭蕭洙曰見白首恨爲郎詩注趙曰公自嘆其留滯空老又因王君之䘮不即還郷而感傷也奉漢中王手札報韋侍御蕭尊師亡秋日蕭韋逝淮王報峽中洙曰漢有淮南王賢王少年疑柱史洙曰王康琚詩老聃伏柱史老子傳考子百有六十餘歲以其脩道而養壽多術恠仙公趙曰淮王則漢南王安其人賢以比漢中王也柱史以言韋侍御老子爲周柱下史而韋以少年爲之疑其不似也仙公以言蕭尊師仙公冝有多術以延生而死故怪之也不但時人惜祗應吾道窮洙曰左傳反𬒮拭面稱吾道窮一哀侵疾病相識自兒童處處隣家笛洙曰向子期思舊賦序于時日薄虞淵寒木凄然鄰人有吹笛者後發聲寥亮追想曩昔遊讌之好感音而嘆作賦飄飄客子蓬洙曰曹子建轉蓬離本根飄飄随長風類此遊客子捐軀逺從戎趙曰公自嘆其飄零也強吟懷舊賦洙曰潘安仁作懷舊賦巳作白頭翁洙曰魏文帝已成老翁但未白頭耳哭台州鄭司户蘇少監新添故舊誰憐我平生鄭與蘇存亡不重見䘮亂獨前途豪俊人誰在文章掃地無覉遊萬里闊凶問一年俱白日中原上清秋大海隅夜臺當北斗泉路著東吴得罪台州去時危棄碩儒移官蓬閣後榖貴殁潜夫流慟嗟何及銜冤有是夫道消詩發興心息酒爲徒許與才雖薄追隨跡未拘班揚名甚盛嵇阮逸相須會取君臣合寧詮品命殊賢良不必展廊廟偶然趨勝決風塵際功安造化鑪從容詢舊學慘淡閟隂符擺落嫌疑乆哀傷志力輸俗依綿谷異客對雪山孤童稚思諸子交期列友于情乖清酒送望絶撫墳呼虐痢飱巴水瘡痍老蜀都飄零迷哭處天地日榛蕪過故斛斯校書莊二首此去巳云殁鄰人嗟亦休竟無宣室召洙曰漢文帝召賈誼於宣室徒有茂陵求洙曰謝玄暉詩廣平聽方藉茂陵將見求前漢司馬相如旣病免家居茂陵天子曰司馬相如病甚可往從悉取其書若不然後失之矣所忠往而相如已死无遺書問妻對曰長卿未甞有書也時時著書人又取去長卿未死時爲一卷書曰有使來求書奏之其遺札書言封禪事所忠奏焉天子異之妻子寄他食園林非昔遊空餘繐帷在洙曰謝玄暉詩繐帷飄井幹陸士衡注繐細布而踈者爲靈帳裙繐帳之冥漠也淅淅野風秋鷰入非傍舎趙曰鷰仍入其舎鷗歸秪故池斷橋無復板卧柳自生枝洙曰池館依舊而人不可見也趙曰梁孝威詩卧柳尚還生遂有山陽作洙曰見贈王侍御契詩注多慙鮑叔知洙曰鮑叔與管仲交貧則知其困而容之逹則知其賢而舉之管仲曰生我者父母知我者鮑叔素交零落盡洙曰劉孝標絶交論斯賢逹之素交歷萬古而一遇素交盡利文興謝靈運万事俱零落白首淚雙垂不歸河間尚征伐宋曰河間郡名此詩甫從弟經亂離未歸也汝骨在空城趙曰此言公之從弟有死而寄骨於其處從弟人皆有終身恨不平數金怜俊邁師曰數金謂初時知錢數也緫角愛聦明洙曰見緫角草書又神速注面上三年土春風草又生師曰言三年飄蕩風埃之中今春草又生也故武衛將軍挽詞三首嚴警當寒夜前軍落大星洙曰晉陽春秋曰有星赤而芒角自東北西南流投于諸葛亮營三投再還往大還小而亮薨趙曰軍事以嚴終破軍中謂之嚴警安石曰三國志注載晉陽春秋有星投于亮營而亮卒壯夫思敢决哀詔惜精靈趙曰思其敢决邁往之氣也王者今無戰洙曰鍾士季檄蜀丈王者之師有征無戰書生巳勒銘洙曰班孟堅爲竇憲作勒燕然山銘秦曰書生甫自謂也當爲之勒銘封侯意踈闊編簡爲誰靑洙曰李廣不封侯餘見青簡爲誰編注舞劒過人絶洙曰髙祖紀項莊請以劒舞因擊沛公項伯亦起舞常以身蔽翼沛公鳴弓射獸能洙曰曹子建詩攬弓健鳴鏑驅上彼南山左挽因右發一縱兩禽連銛鋒行惬順趙曰言舞劒之絶也猛噬失蹻騰鄭曰蹻音橋趙曰言射獸之能也赤羽千夫膳修可曰家語赤羽若日白羽若月千夫膳言所膳者千兵也師曰赤雨千夫膳古詩云桃花乱落如紅雨赤雨言落葉也黃河十月冰横行沙漠外洙曰所向無前故曰横行神速至今稱洙曰岑彭兵至蜀公孫述以技擊地曰是何神也哀挽青門去洙曰哀挽哀歌也漢書霸城門民間所謂青門新阡絳水遥路人紛雨泣洙曰諸葛亮亡人皆野哭時可曰出曹子建作王仲宣誄曰延首歎息雨泣交頸趙曰詩涕泣如雨師曰路人猶泣况親知乎天意颯風飈部曲精仍銳洙曰見部曲異平生注匈奴氣不驕趙曰此言將軍之餘烈如此孫曰氣不驕言畏其威也無由覩雄略大樹日蕭蕭洙曰馮異傳諸將並坐論功異常獨屏樹下軍中號曰大樹將軍存殁口號二首席謙不見近彈碁洙曰席謙吴人善弹碁黄曰漢梁兾傳注藝經曰彈碁兩人對局白黒碁各六枚先列碁相當更先彈也余曰酉陽雜俎謂丗說言彈棊起自魏室粧奩戯也今彈棊用棊二十四以色别貴賤又魏戯法先立一棊立於局中餘中間白黒圍繞之十八籌成都計畢耀仍傳舊小詩洙曰畢耀善爲小詩見玉臺集玉局他年無限笑薛曰右按道藏成都地神踴岀扶一玉局白楊今日幾人悲洙曰陶潜挽歌云蔓草何茫茫白楊亦蕭蕭趙曰言幾人爲之悲特有我而巳鄭公粉繪隨長夜曹霸丹靑巳白頭天下何曽有山水人間不解重驊騮洙曰髙士滎陽鄭䖍善畫山水曹覇魏曹髦之後善畫馬趙曰言無人珍重而藏其畫也分門集註杜工部詩卷第二十二, WYG: ''}
