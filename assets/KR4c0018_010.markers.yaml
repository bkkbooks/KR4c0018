  - {type: variant, offset: 0, length: 23111, content: 分門集註杜工部詩卷第十園林果實附古詩三首律詩二十四首樂遊園歌彦輔曰晦日賀蘭楊長史筵醉中作樂遊古園崒森爽洙曰西京記曰樂遊園漢宣帝所立唐長安中太平公主於原上置亭遊賞其池四望寛敞每三月上巳九月重陽士女戲就此祓禊登髙幄幕雲布車馬填塞虹彩映日馨香滿路朝士詞人賦詩翌日傳於京師煙綿碧草萋萋長洙曰謝霊運詩萋萋春草繁江淹賦春草碧色劉安招隱士春草生兮萋萋公子華筵勢最髙秦川對酒平如掌洙曰文選王粲家本秦川周王襃關山篇遥遥泰川水千里長如帶沈佺期長安路詩秦地平如掌層城出雲漢長生木瓢示真率更調鞍馬狂歡賞青春波浪芙蓉園洙曰魏文帝有芙蓉池作在鄴都西園芙蓉園在城南曲池坊臨水亭進芳門外即樂遊園也玄宗紀開元二十年廣花萼樓築夾城至芙蓉園王莽傳乃西波水之北郎池之南晉灼曰黄圖波浪二水名也在甘泉苑中師古曰晉說非也黄圖有西波池郎池皆在石城南上林中趙曰長生木瓢則木瓢脩長而生者盖用之以酌則始爲真率也白日雷霆夾城仗洙曰夾當作甲閶闔晴開映蕩蕩洙曰曹植平陸東行曰閶闔天衢通前漢禮樂志遊閶闔觀玉臺天門開淡蕩蕩注閶闔天門蕩蕩天體堅清之狀相如大人賦排閶闔而入帝居鄧后夢捫天蕩蕩色正青曲江翠幕排銀牓洙曰潘安仁籍田賦曰翠幕黙以雲布陳張正見詩即此神仙内銀牓映仙宫陳沈烱林屋館記崑山平圃銀牓相暉蓬閬山宫金臺幄起神異經曰東方青宫門有銀牓晉潘尼洛水詩翠幕映洛湄蘇曰姚萇張翠弈繡簾掛金篆銀牓拂水低囬舞袖翻縁雲清切歌聲上洙曰曹植云華閣縁雲上征夢符曰右按曹植言華閣縁雲此稱歌聲清切耳列子云薛譚學謳於秦青辝歸秦餞於郊衢撫節悲歌聲振林木響遏行雲西京雜記曰髙帝令戚夫人歌出塞望歸之曲後宫齊唱聲入雲霄趙曰後漢王延壽魯霊光殿賦飛陛掲孽縁雲上征薛夢符刋誤乃引列子載秦青之歌響遏行雲又引西京雜記戚夫人歌聲入雲霄其意以爲兩事皆有雲字遂用證之殊不知遏雲别遏住之且非杜公縁雲本意唯入雲霄方有縁雲之義却憶年年人醉時只今未醉巳先悲彭曰甫遊此悲感當年之樂翻爲此日之憂風物巳非舊時華麗但覩碧草萋萋黍離之作与此同意數莖白髮郍抛得百罰深盃亦不辭洙曰罰一作刻說文曰漏以銅盛水刻節晝夜百刻蘇曰桑乂在江揔席上曰推來盃百罰吾亦不辤聖朝巳知賤士醜洙曰揚子曰秦之士也賤陸機玄冕無醜士趙曰思北歸賦况北州之賤士爲炎士之流人一物自荷皇天慈洙曰江淹一物之微有足悲者又天羣物之祖此身飲罷無歸處獨立蒼茫自詠詩洙曰庾信乞酒詩蕭索風聲慘蒼茫雲貌愁梁朱异田飲引值寒野之蒼茫梁元帝詩秋氣蒼茫結孟津潘安仁哀永逝文曰視天日兮蒼茫趙曰蒼茫荒寂之貌彭曰蒼茫謂池上也甫不怨朝廷貶黜之非自傷年老無所依歸至於獨立池上詠詩遣懐其情爲可憫也阻雨不得歸瀼西甘林三伏適巳過洙曰隂陽書曰夏至後第三庚𥘉爲𥘉㐲第四庚爲中伏立秋後初庚爲未伏王彪之并賦三伏焦暑元陽重授輕飈不扇纎雲不上詠曰以金伏畏火故熱驕陽化爲霖欲歸瀼西宅阻此江浦深壞舟百板坼師曰自此句以下叙阻雨舟破恐泥不可濟故思歸也峻岸復萬㝷篙工初一棄恐泥勞寸心洙曰舡敗而不可致逺也佇立東城隅悵望髙飛禽趙曰此言望瀼西而阻於渡渉恨無羽翼以飛去也草堂亂玄圃不隔崑崙岑昏渾衣裳外曠絶同層隂園甘長成時三寸如黃金諸侯舊上計厥貢傾千林洙曰禹貢淮海惟楊州厥包橘柚錫貢江文通日落長沙渚曽隂萬里生蜀都賦户有橘柚之園漢武計偕注計者上計簿使也邦人不足重所迫豪吏侵客居暫封植日夜偶瑶琴洙曰昭二十年季氏有佳樹宣子譽之武子曰宿敢不封殖此樹也趙曰甘可用入貢以奉至尊非不貴也而邦人反不足以爲重者無它苦於豪吏之侵奪故耳邦人旣不重之唯客居尚可封植也字出左傳敢不封植此樹虚徐五株態側塞煩胷襟焉得輟兩足杖藜岀嶇􅋂鄭曰上虧于下驅音切條流數翠實偃息歸碧潯洙曰靈運云舉目眺嶇􅋂拂拭烏皮几趙曰謝眺詠烏皮隱几詩曰蟠木生附枝刻削豈無施又云曲躬奉微用聊承終宴疲喜聞樵牧音蘇曰郄詵數日山行喜聞樵語牧唱洗盡五年塵士腸胃欣然倚驂臨水乆之而去矣趙曰公得歸瀼西聞平昔之音而喜張景陽投來循岸側時聞樵採音令兒快搔背蘇曰袁安卧負暄頽簷頗覺和暢四肢舒展令兒搔背甚快人意脫我頭上簮洙曰見憑乆烏皮綻注甘林捨舟越西岡洙曰謝霊運舎舟眺逈渚入林解我衣趙曰惟恐入山之不深入林之不密青芻適馬性好鳥知人歸修可曰曹子建好鳥鳴髙枝晨光映逺岫洙曰陶潜晨光喜微謝玄暉䆫中列逺岫夕露見日晞遲暮少寢食清曠喜荆扉洙曰荆扉柴門也經過倦俗態蘇曰張愽遇陳暄於途中曰君子何不迂歩經山家暄曰吾猒子俗態故不足以下也在野無所違試問甘藜藿洙曰莊子藜藿不糝未肯羡輕肥洙曰子路願肥馬衣輕裘蘇曰梁資隱嵩山不仕友人勉仕養妻子不致寒瘦資曰小君甘与吾笋蕨同老未肯羡輕肥友人負慙而退喧静不同科岀處各天機洙曰莊子其嗜欲深者乃天機淺趙曰天機雖三出莊子而今所用則蚿曰子動吾天機主自然也舊注非勿矜朱門是洙曰郭景純朱門何足榮未若託蓬萊陋此白屋非洙曰蕭望之傳周公致白屋之意師古曰白屋謂白蓋之屋以茅覆之賤人所居也明朝歩隣里長老可以依時危賦斂數鄭曰色角切脫粟爲爾揮洙曰公孫弘身食一肉脫粟飯師古曰才脫粟而巳不精鑿也此言民雖困賦斂猶能致意於賔客故曰可依也相携行豆田秋花藹菲菲子實不得喫貨市送王畿趙曰言豆雖結實矣而長老者不得喫也盡添軍旅用迫此公家威洙曰言賦斂煩重而民無餘貲迫此公家威在上者苛急也主人長跪辭戎馬何時稀我衰易悲傷屈指數賊圍勸其死王命慎莫逺奮飛趙曰詩不能奮飛奉陪鄭駙馬韋曲二首韋曲花無頼家家惱殺人趙曰古詩白楊多悲風蕭蕭愁殺人渌樽湏盡日趙曰沈休文詩憂來命渌樽鄭曰渌龍玉切本作醁美酒也白髮好禁春洙曰禁一作傷鄭曰禁居吟切勝也石角鈎衣破沈曰石角謂石菱角也藤枝刺眼新鄭曰刺七亦切何時占叢竹頭戴小烏巾蘇曰劉岩隱逸不仕常著緇衣小烏巾天下咸稱其名行師曰甫意欲卜居植竹以怡情也野寺垂楊裏春畦亂水間美花多映竹好鳥不歸山師曰託言猶在仕途未能拂衣林下也城郭終何事風塵豈駐顔趙曰言城中多風塵徒催人老耳誰能共公子薄暮欲俱還趙曰尚欲留連之意師曰甫意欲與鄭公於暮年俱還政以自養也陪鄭廣文遊何將軍山林十首彦輔曰東方朔傳竇太后曰回輿枉路臨妾山林應劭曰公主園中有山謙不敢稱第故言山林不識南塘路今知第五橋趙曰於志在萬年縣郭外之西南名園依緑水洙曰謝玄暉詩逶迤帶緑水野竹上靑霄洙曰北山移丈干青霄而直上谷口舊相得洙曰前漢王貢傳鄭子真脩身自保成帝時王鳯時以禮聘子真子真道不屈而終楊雄曰谷口鄭子真不詘其志耕乎巖石之下名震于京師豈其卿豈其卿趙曰谷口以鄭子真指其廣文濠梁同見招洙曰莊子惠子同遊濠梁之上趙曰相視爲荘惠也平生爲幽興未惜馬蹄遥蘇曰蘇愽招杜預曰山家酒香雞肥君子不惜道長馬蹄遥逺可訪蓬蓽慰此拳拳耳師曰甫詩云第五橋東流水恨則第五橋乃蜀中橋名鄭子真与王鳯有舊莊子與惠子同遊濠梁之上喻甫之陪鄭廣文也百頃風潭上千重夏木清趙曰舊夲千重無義善本作章出前漢食貨志大木曰章卑枝低結子趙曰魏文帝芙蓉池云卑枝披拂羽接葉暗巢鸎鮮鯽銀絲鱠香芹碧澗羮洙曰謝靈運詩銅陵映碧澗趙曰碧澗皆狀物之語而薛公𥙷遺以爲地名名偶与同耳非是翻疑柂樓底鄭曰柂徒可切晚飯越中行師曰越地盛有芹魚行舡中多煑芹鱠魚故甫有云云萬里戎王子何年別月支鄭曰章移切洙曰張騫傳匃奴破月支王師古曰月氐西域胡國也趙曰戎王子說者以爲花名義固然也又言别月支是必月支之物異花開絶域滋蔓匝清池漢使徒空到洙曰如張騫李廣利之類趙曰張騫於西域止移胡桃石榴苜蓿而不移此所謂戎王子是爲徒空到矣舊注因不省戎王子之謂模稜其說也神農竟不知洙曰神農甞百草之滋味而竟不知言多異卉趙曰言此絶域異花不載於神農本草露翻兼雨打開拆漸離披洙曰揚雄賦配藜四施注配藜披離也趙曰宋玉云白露下衆草兮奄梧楸而離披師曰月支西域國名何将軍嘗征西域禽其王子歸朝傳其地花草數種故池館皆異花雖張騫之愽望神農之辨草木猶爲未徧也旁舎連髙竹踈籬帶晚花碾渦深没馬洙曰碾渦碾磑間水渦旋也鄭曰渦烏禾切水回也藤蔓曲藏洙曰一作垂虵詞賦工無洙曰一作何益趙曰公時爲布衣故云山林跡未賖趙曰言我之蹤跡不乆在山林也盡捻書籍賣趙曰王叔艾嗜酒家貧常挾祖父所蓄書籍賣酬酒價鄭曰捻正本作拈如兼切唐韻指取物也來問爾東家洙曰史東家丘夢符曰右按文選陳孔璋爲曹洪與魏文帝書曰怪乃輕其東家謂爲倩人邴原列傳曰原遊學詣孫崧崧曰君郷里鄭君學者之模範也君乃舎之所謂以鄭君爲東家丘也原曰君以鄭君爲東家丘以僕爲西家愚夫耶師曰何将軍雖武人家藏書籍多故甫欲依之以就其書而有末句剰水滄江破殘山碣石開趙曰任彦昇詩滄江路窮禹貢地名碣石以其碣起之右矣朱子京得之於唐書中有殘膏賸馥之句賸俗作剰字師曰滄江碣石山水之雄言何將軍山水之樂分得滄江碣石之真趣緑垂風折笋紅綻雨肥梅趙曰倒言方健銀甲彈箏用洙曰古詩十五學弹箏銀甲不曽卸以銀作指甲取其有聲金魚洙曰一作盤換酒來洙曰阮孚爲常侍以金貂換酒帝宥之興移無洒掃隨意坐莓苔蘇曰鄭子真得酒以瓦盞瓷瓶隨意所在藉芳草快飲趙曰此尤見其野逸之興風磴吹隂雪趙曰磴石悌之道也雲門吼瀑泉鄭曰瀑薄報切酒醒思卧簟衣冷欲洙曰一作得裝綿野老來看客河魚不取錢只疑淳朴處自有一山川趙曰淳朴者太古之丗也以其山野乃淳朴處矣師曰磴石道也雲門謂雲擁翼山門野老來看客言少有人到也河魚不取錢言魚賤也棘樹寒雲色茵蔯春藕香蘇曰東方朔好食蘭以醋塩拌之同茵蔯蘭牙食之皆笑之朔自若脆添生菜美趙曰生菜非一矣而得茵蔯春藕又添其美也隂益食單凉趙曰言鋪食單於棘樹之下隂益其凉也謂之益則山中巳涼矣野鶴清晨岀洙曰一作至蒼舒曰右見晉書山精白日藏洙曰山精鬼魅趙曰蜀帝得山精以爲妻庾信云山精􅍢寳刀石林蟠水府百里獨蒼蒼憶過楊柳渚鄭曰過古禾切洙曰渚洲渚走馬定昆池洙曰唐安樂公主作定昆池言勝昆明趙曰皆何將軍山林所徑過之處醉把靑荷葉蘇曰李膺醉手常把青荷葉爲扇障日趙曰孫登詩青荷乗日暉狂遺白接籬洙曰丗說接籬衫也山簡爲襄陽守甞醉習家髙陽池襄陽小兒歌曰山父時一醉遥造髙陽池日暮倒載歸酩酊無所知復乗騘馬去到着白接籬舉手問葛强何如并州兒刺船思郢客鄭曰刺七亦切洙曰郢客善操舟解水乞吴兒洙曰吴人善泅趙曰南人謂北人爲滄父北人謂南人爲吴兒皆常語也坐對秦山晚江湖興頗隨師曰安樂公主中宗初女甞請昆明池爲私沼帝曰先帝未有以與人者主不恱自鑿定昆池延袤數里定言可抗訂之也青荷葉盃也白接籬巾也郢楚都也吴楚之人善操舟與泳水床上書連屋階前樹拂雲將軍不好武稚子揔能文醒酒微風入洙曰嵇康微風動摇聽詩静夜分洙曰沈沐丈時月華臨静夜絺衣挂蘿薜鄭曰北激切或作壁凉月白紛紛趙曰謂之紛紛言其在薜蘿之間如此也蘿薜者藤蘿與薜荔也師曰書連屋言按上疊書之高也堦前樹拂雲蓋言将軍樹也昔馮異不爭功獨屏樹下坐人呼爲大樹将軍蘿乃松蘿薜乃薜荔幽意忽不愜蘇曰嵇彦不愜幽意忽然出山趙曰暗使丗說云左太冲作三都賦𥘉思意甚不愜師曰愜謂欲歸也歸期無柰何岀門流水住師曰水住言水歸駐也回首白雲多洙曰一作雜花多自笑燈前舞誰怜醉後歌秪應與朋好風雨亦來過鄭曰古禾切重過何氏五首問訊東橋竹將軍有報書蘇曰郝隆王將軍近日有邊報趙曰言欲重過主人所以託爲問訊其竹而報許之也故有下句速往之義倒衣還命駕洙曰再遊何將軍山林也倒衣爲聞報而欲遽往急命駕也倒衣如詩有云顛倒裳衣髙枕乃吾廬洙曰主人無間故客至則安之若吾廬也陶潜云吾亦愛吾廬花妥鸎捎蝶鄭曰妥吐火切蘇曰関中人謂落爲妥溪喧獺趂魚趙曰句法則花枝安妥之際有鸎捎掠於蝶溪聲喧沸之中獺趂魚也重來休沭地眞作野人居趙曰言野人居則幽静可知師曰東橋即第五橋也訊者問以言也花妥言花閑静也捎欲捎取之花無情而鸎有情溪無意而獺有意静中有動意古人立語多如此休沐地言此可以休歇爲湯沭之所山雨樽仍在沙沉榻未移趙曰樽與榻皆前日之所設樽在而榻未移又見将軍之好客犬迎曾宿客鵶護落巢兒雲薄翠微寺鄭曰貞觀十三年於洛南營太和宫後改爲翠微宫元和中改爲翠微寺天靑黃子陂洙曰陂名也趙曰舊本作黄子義非按志所載皇子陂在萬年縣以秦葬皇子起塜陂北原上得名别無黄子之稱公又有鄭䖍詩云皇陂岸北結愁亭是也向來幽興極歩屣過東籬洙曰陶潜詩采菊東籬下師曰樽仍在榻夫移言前日宴集也犬迎客鵶恐犬害其子故護之此十字句法山未及上曰翠微黄叔度汪汪如千頃陂翠微黄子非寺與陂名特言其義也落日平臺上洙曰梁孝王傳孝王築東苑廣睢陽城大治宫室爲複道自宫連屬於平臺三十餘里如淳曰平臺在大梁東北離宫所在也晉灼曰或說在城中東北角師古曰今其城東二十里所有故臺基其處寛博丗俗云平臺上趙曰此萹直書景物耳平臺應是平穩之臺别無他義舊注引梁孝王傳非是也春風啜茗時石欄斜點筆趙曰置硯於石欄之上桐葉坐題詩蘇曰黄藏好詩酒幽居得句家無𥿄即摘桐葉題之句法膾炙人口好事者常以毫楮遺之趙曰題詩於桐葉之上翡翠鳴衣桁鄭曰户庚切杜作側聲用師曰下浪切蜻蜓立釣絲自今幽興熟洙曰一云自逢今日興蘇曰謝敦往來旣相熟相見亦無定期間暇即造門來往亦無期師曰平臺在大梁東北離宫所在也師古曰今其城東二十里所有故臺基其処寛愽丗俗云平臺上言其地僻静翡翠蜻蜓皆馴自今幽興巳熟是以來往無期刻也頗恠朝叅懶洙曰樂於安間故獺於朝叅朝叅謂又朝叅謁應耽野趣長雨抛金鏁甲蘇曰李廣金鎻甲未可輕抛朝廷尚憂西北趙曰甲言金鎻以金線連鎻之也苻堅造金銀細甲金爲綖以縲之乃其類也苔卧緑沉槍洙曰槍甲皆器之犀利者不以功名爲務故雨霑苔卧也夢符曰右案車頴秦書曰苻堅使熊邈造金銀細鎧金爲綖以縲之緑沉精鐵也北史隋文帝賜張奫緑沉槍甲獸文具裝武庫賦曰緑沉之槍蘇曰霍去病痛苔生槍架塵滿馬鞍無復征戰之用趙曰以緑色之物沈洙其柄也武庫賦有云緑沉之槍舊薛云以緑沉爲精鐵非也田曰廣志言緑沉古弓名劉劭趙郡賦言弓弩亦有緑沉黄間之號師曰薛夢符云緑沉精鐵也北史隋文帝賜張􅔿緑沉槍甲獸丈具裝武庫賦曰緑沉之槍子嘗博考緑沉之義或以爲􅃮或以爲用緑設飾羲之筆經云有人以緑沉􅃮竹鏤管見遺藏之多年實有愛玩詎必金宝雕琢然後爲貴乎此以緑沉爲漆也廣志曰緑沉古弓名劉紹超趙郡賦曰其器用則六弓四弩緑沉黄間溪魚揚丁今角端古樂府結客少年塲行云緑沉明月絃金絡浮雲轡此言緑沉皆謂弓也弩名黄間以黄飾之也弓謂之緑沉其亦以緑爲飾乎緑沉槍疑以緑飾之三說不同故並載之手自移蒲柳家纔足稻粱趙曰蒲柳楊也爾雅曰楊蒲柳是也看君用幽意白日到羲皇洙曰陶潜羲皇上人趙曰言白日則有雍容閑暇不盡之意到此應嘗宿相留可判年蹉跎暮容色洙曰容色衰暮也蹉跎差跌也悵望好林泉何日霑微禄歸山買薄田斯遊恐不遂把酒意茫然洙曰賈誼鵬賦斯遊遂城卒𬒳五刑應劭曰李斯西遊於秦身登相位二丗時爲趙髙所讒身受五刑斯游此遊也謂沾禄買田之事也以爲李斯則非趙曰言未霑微禄此爲布衣時也公方三十九嵗冬方献三賦次年方召試得官故此言斯遊恐不遂其意也師曰判年半年也甫亦有山林歸老之意故見意于末篇園仲夏流多水清晨向小園碧溪揺艇闊蘇曰何遜京口詩云碧溪水色闊摇艇煩舟子朱果爛枝繁始爲江山靜終防市井喧畦𬞞繞茅屋自足媚盤飡趙曰媚者冝也沈約詩旅游媚年春左傳盤飡加璧小園由來巫峽水夲自楚人家客病留因藥春深買爲花秋庭風落果瀼岸雨頽沙問俗營寒事將詩待物華寒雨朝行視園樹柴門雜樹向千株丹橘黃甘北地無趙曰江南種橘江北成枳則知甘橘惟楚地之所有耳江上今朝寒雨歇籬中秀洙曰一作邊新色畫屏紆桃蹊李徑年雖故洙曰李廣賛諺曰桃李不言下自成蹊師古曰蹊爲徑道也言桃李以其華實之故非有所召呼而人爭歸趣來往不絶其下自然成徑以喻人懷誠信之人故能潜有所感梔子紅椒豔色殊洙曰一作豔復殊鏁石藤梢元自落到天松骨見來枯林香出實垂將盡葉蔕辭枝洙曰一作柯不重蘇愛日恩光蒙借貸洙曰冬日可愛清霜殺氣得憂虞洙曰釋名云霜者䘮也其氣慘毒物皆䘮也趙曰仲秋之月殺氣浸盛衰顔動覔藜牀坐洙曰管寧家貧坐藜牀欲穿爲斈不倦緩歩仍須竹杖扶洙曰費長房投竹杖於葛陂化龍而去散騎未知雲閣處啼猿僻在楚山隅洙曰潘安秋興賦寓直于散騎之省髙閣連雲趙曰今公以别無官署故言未知雲閣處止在猿啼之地耳將别巫峽贈南郷兄瀼西果園四十畒趙曰果園四十畒而公直㪯以贈人此一段美事而古今未甞揄揚公之美良可歎也苔竹素所好萍蓬無定居洙曰木玄虚海賦萍流而蓬轉逺遊長兒子幾地别林廬雜蘂紅相對他時錦不如具舟將岀峽廵圃念携鋤正月喧鶯未兹辰放鷁𥘉洙曰司馬相如賦浮文鷁揚桂枻注鷁水鳥畫其象於舟首以厭水神淮南子曰龍舟鷁首天子之乗也雪籬梅可折風榭柳微舒託贈卿家有因歌野興踈殘生逗江漢何處狎樵漁課小竪鉏斫舎北果林枝蔓荒穢淨訖移牀三首洙曰一云秋日閑居病枕依茅棟荒鋤淨果林背堂資僻逺在野興清深山雉防求敵洙曰詩雉鳴求牡趙曰雉性强而善闘江猿應獨吟趙曰應平聲以鋤斫果林荒穢凈其枝蔓則猿來者少應有獨吟而巳洩雲髙不去洙曰見洩雲蒙清塞注隱几亦無心洙曰莊子東郭子綦隱几嗒然似䘮其耦注言心形兩忘也衆壑生寒早長林卷霧齊青蟲懸就日朱果落封洙曰一作成泥洙曰以泥封其接枝也薄俗防人面洙曰人一作狸左傳人心不同如面蘇曰使人面獸心之義舊引左氏人心不同如其面焉止其面之不同於防字無義全身學馬蹄洙曰莊子有馬蹄篇言齕草飲水適足其身馬之真性有善治馬者出則馬失真性而不得盡其生也趙曰所謂馬蹄可以踐霜雪毛可以禦風寒齕草飲水翹足而陸此馬之真性也吟詩坐迴首隨意葛巾低籬弱門何向趙曰言籬觸處損壞門無定向也沙虚岸只洙曰一作自摧日斜魚更食客散鳥還來寒水光難定秋山響易哀天涯稍曛黒洙曰謝霊運詩朝遊窮曛黑倚杖更徘徊蘇曰陶侃毎見山水佳麗之地莫不怡然倚杖徘徊至興罷則已果實古詩一首律詩九首園人送瓜趙曰此太平遣送官園中瓜也師曰時栢公守夔遣人送瓜江間雖炎瘴瓜熟亦不早栢公鎮䕫國鄭曰栢中丞滯務兹一掃食新先戰士洙曰成十年傳桑田巫言晉侯不食新矣注言公不得及食新麥逸曰食新甞新也共少及溪老師道曰共少分甘也溪老甫自稱傾筐蒲鴿青鄭曰鴿葛合切師曰青瓜色如蒲鴒蒲鴿貍首皆瓜名也滿眼顔色好竹竿接嵌竇鄭曰嵌丘衘切嵌岩山險也師曰嵌竇岩泉也引注來鳥道師曰鳥道乃飛鳥之道髙貌沉浮亂水玉洙曰魏文帝浮甘瓜於清泉赤松子服水玉沈曰寒水玉水精也愛惜如芝草落刃嚼冰霜開懷慰枯槁許以秋蔕除洙曰謝玄暉殘翩似秋蔕仍看小童抱洙曰一作飽東陵跡蕪絶楚漢休征討洙曰東陵邵平種瓜之地也園人非故侯種此何草草趙曰此篇兩押草字亦豈東坡所云兩耳義不同故得重用邪師曰草草辛苦貌詣徐卿覔果子栽草堂少花今欲栽不問緑李與黄梅洙曰西京雜記初修上林苑羣臣逺方各献名果制爲美石以標奇麗李十五種内有緑李石筍街中却歸去洙曰石筍見李詩注果園坊裏爲求來甘園春日清江岸千甘二頃園青雲着葉密洙曰着一作羞白雪避花繁洙曰郭璞柑賛花染繁霜葉鮮翠藍趙曰本言密葉如雲白花如雪而變其語云雲羞雪避乃公新竒之句結子隨邊使開筒近至尊洙曰蜀柑歲入貢蘇曰隋文帝好食柑蜀中摘黄柑即以蠟汗其蔕用筠筒盛封之使不泄香氣後於桃李熟終得獻金門洙曰公自託意於末章解悶五首同作十二首五首見文章門二首見絶句一辭故國十經秋毎見秋瓜憶故丘洙曰一作侯長安東門瓜絶美乃邵平故事趙曰邵平種瓜長安東門也公長安人故有懐郷之詩今日南湖采薇蕨何人爲覔鄭瓜洙曰一作袁州洙曰公自注今鄭祕監審趙曰言鄭必有瓜州之命或舊曽守瓜州故云師曰瓜州金陵之别號鄭審乃公故人也先帝貴妃俱寂寞荔枝還復入長安洙曰楊貴妃傳妃嗜荔枝必欲生致之乃置騎傳送数千里味色未變至京師炎方每續朱櫻獻趙曰礼記仲夏之月天子以含桃先薦寢廟今云朱櫻献則亦南方之所貢也玉座應悲白露團洙曰謝玄暉詩玉座猶寂寞况乃妾身輕脩可曰唐史遺事云乾元初明皇幸蜀回嶺南進荔枝上感念楊貴妃不覺悲慟師曰髙力士於御座傍設位享之上稍蘇息憶過瀘戎摘荔枝青楓隱映石逶迤京華應見無顔色趙曰君指言荔枝也紅顆酸甜只自知洙曰蜀無荔枝惟戎瀘最多蓋荔枝常生於嵐瘴之地也師曰瀘戎二州名蜀荔枝譜云廣南及梓䕫之間所出大率早熟肌肉薄其味甘酸其精好者近比閩中之下品戎州圖載郡國志云𤏡人住西夷中多以荔枝爲業園植萬株樹收百解故戎州有荔枝園戸翠瓜碧李沉玉甃洙曰玉甃井也魏文帝書有云浮甘瓜於清泉沉朱李於寒水赤梨葡萄寒露成可憐先不異枝蔓此物姢姢長逺生趙曰此物言荔枝也可憐先與荔枝不異枝蔓他處所有而此物長於逺地姢姢然生所以嘆異之也側生野岸及江蒲不熟丹宫滿玉壷趙曰此篇山谷云亦貢荔枝之什蜀都賦側生荔枝江蒲則自戎𤏡而下例以畒爲蒲今官私契約皆然因以押韻丹宫神仙之宫以比禁苑王壷畛責之器以言至尊之奉惟其不熟丹宫而滿玉壷所以求之於逺也雲壑布衣鮐皆死勞生洙曰謝師厚云生當作人重馬翠眉須洙曰重當作害須一作踈定功曰此一絶亦言荔枝歐陽公夲作勞人害馬翠眉須蜀都賦有曰卬竹縁嶺茵桂臨崖旁挺龍眼側生荔枝布緑葉之萋萋結朱實之離離按楊貴妃嗜荔枝必欲生置乃置騎曉夜傳至京師色未變馹召至於老死山谷間故曰勞人害馬也翠眉指貴妃也題桃樹趙曰此非止因桃而題其所懷蓋含仁民愛物之心與夫遏乱喜治之意其詳於逐句下小逕升堂舊不斜五株桃樹亦從遮髙秋揔餧貧人實趙曰言其至高秋時盡熟皆以分餧貧者以其不害來歲之花仍是滿眼則望復其結實矣此其爲仁民之心乎來歳還舒满眼花簾户每宜通乳鷰洙曰乳鷰鷰雛也謝玄暉詩花叢乱数蝶風簾入雙鷰余曰王直方詩話云漢駒父見陳無己小放歌行云不惜捲簾通一頓此爲竒語蓋通字未嘗有人通予曰子豈不記老杜云簾户毎冝通乳鷰邪兒童莫信打慈鵶洙曰鵶有慈孝之名以其授哺反哺也趙曰於簾破萬顆勻圎訝許同憶昨賜霑門下省退朝擎出大明宫修可日唐李綽歳時記云四月一日内園進櫻桃寢廟薦訖頒賜各有差金盤玉筯無消息此日嘗新任轉蓬洙曰唐制賜近臣櫻桃有宴轉蓬自言流落如蓬之隨風任其轉徙也蕭八明府寔處覔桃栽奉乞桃栽一百根春前爲送浣花村河陽縣裏洙曰一作底雖無數洙曰潘岳爲河陽令種桃李花人號曰河陽一縣花濯錦江頭未滿園池沼舟楫橋梁附律詩九首秋日寄題鄭監湖上亭三首碧草違春意洙曰别賦春草碧色沅湘萬里秋鄭曰沅音元洙曰沅湘二水名池要山簡馬洙曰見習池未覺風流盡注月静庾公樓洙曰晉庾亮在武昌諸佐吏殷浩之徒乗秋夜共登南樓俄而不覺亮至諸人将起而避之亮徐曰諸君可住老子於此處興復不淺便據胡床与浩等談詠竟夕其坦率行多此類磨滅餘篇翰洙曰尚書序其餘錯乱磨滅蘇曰吴湘曰一代風流磨滅殆盡唯有餘篇遺翰氣熖熖然平生一釣舟趙曰此兩句公自言也髙唐寒浪滅髣髴識昭丘洙曰登樓賦北彌陶牧西接昭丘趙曰髙唐峽水入東而浪滅則可以行故能髣髴望昭丘而識之王粲登樓賦西接昭丘注當陽東南有楚昭王墓新作湖邊宅還聞賔客過自須開竹逕誰道避雲蘿趙曰旣開竹逕則其逕顯豁豈是隱避於雲蘿之間乎官序潘生拙洙曰潘岳閑居賦拙者絶意乎寵荣之事趙曰潘生所以比鄭監蓋言其林器可以超遷而止如潘岳之拙也才名賈誼多洙曰本傳言誼年少頗通諸家之書文帝召爲愽士毎詔令議下諸老先生未能言誼盡爲之對捨舟應卜地鄰接意如何趙曰公欲往江陵故有鄰接之問暫住蓬萊閣終爲江海人洙曰沈休文詩江海事多違趙曰鄭爲秘書監即漢之東觀後漢東觀書曰學者稱東觀爲老氏藏室道家蓬萊山今鄭君罷退斯江海之人矣揮金應物理洙曰張景陽詩揮金樂當年歲暮不留儲夢符曰右按古樂府煌煌京洛篇揮金留客坐饌玉待鍾鳴師曰揮金蓋二踈散金事張恊字景陽詠史詩曰昔在西京時朝野多歡娱藹藹東都門羣臣祖二踈朱軒耀金城供帳臨長衢逹人知上足遺榮忽如無揮金樂當年歲暮不留儲按踈廣爲太傅兄子受爲少傅乞骸骨歸上加賜黄金二十斤皇太子贈以五十斤旣歸日具酒食待族人賔客相与娱樂故子美有揮金應物理之句拖玉豈吾身洙曰西征賦飛翠緌拖鳴玉以出入禁門者衆矣羮煑秋蓴弱盃迎露菊新洙曰陶淵明詩秋菊有佳色裛露棳其英泛此無憂物逺我逹丗情一觴雖獨進盃盡壷復傾賦詩分氣象佳句莫頻頻趙曰言鄭君賦詩分我得吟詠之氣象則佳句莫也頻頻有之乎暮春陪李尚書李中丞過鄭監湖亭泛舟得過字海內文章伯洙曰唐文章三變而楊王爲之伯故子美引而用之湖邊意緒多五樽移晚興洙曰古歌辭曰上金殿酌玉樽趙曰曹子建仙人篇曰玉樽盈桂酒桂楫帶酣歌趙曰元帝烏栖曲曰沙棠作船桂爲楫春日繁魚鳥江天足芰荷鄭荘賔客地衰白逺來過洙曰鄭當時字莊置驛馬長安諸郊請謝賔客夜以継日晚秋陪嚴鄭公摩訶池泛舟得溪字魯曰池在使府内蕭摩訶所開因是得名鄭曰摩訶池即汙池也在錦城西湍駚風醒酒鄭曰駚苦夫切馬日行千里洙曰謝霊運浩浩夕流駚馬曰駚疾貌船回霧起隄髙城秋自落雜樹晚相迷坐觸鴛鴦起巢傾翡翠低莫須驚白鷺爲伴宿青溪趙曰公指浣花溪爾陪王漢州留杜綿州泛房公西湖舊相恩追後春池賞不稀洙曰房琯相肅宗以事責宫後爲漢州刺史湖琯所鑿也闕庭分未到舟檝有光輝趙曰舊相言房琯也指言於恩追而未行之間則數數遊此湖此追道其實也又言闕庭未到之間且於此遊湖而當承恩命時則舟楫爲有光輝也豉化蓴絲熟洙曰丗說王武子前有羊酪指示陸雲雲曰千里蓴羮但未下鹽䜴師曰唐吴筠隱不仕帝賜以湖爲扁舟之樂甫雖未蒙朝廷之賜然舟檝亦有光輝矣本草云蓴生水中葉似鳬葵採莖堪啖花黄白子紫色三月至八月莖細如釵股通名爲絲蓴十一月麄短爲瑰蓴亦名爲猪蓴刀鳴鱠縷飛洙曰見設鱠歌注趙曰潘安仁西征賦云饔人切縷鑾刀若飛使君雙皂蓋灘淺正相依洙曰漢二千石皂蓋朱轓荅楊梓州悶到楊洙曰一作房公池水頭坐逢楊子鎮東州洙曰梓州東川也却向青溪不相見回船應載阿戎遊洙曰阮籍謂王渾曰与卿語不若与阿戎談阿戎王戎也渾之子師曰楊梓州先人嘗守鑿池一百頃引水爲農田利今在梓州青溪之西號楊公池今子又再守此州故甫詩有載阿戎遊之句與任城許主簿遊南池鮑曰任城屬兖州秋水通溝洫城隅集小船晚涼看洗馬森木亂鳴蟬菱熟經時雨蒲荒八月天晨朝降白露遥憶舊青氊洙曰王献之夜卧齋中而有偷人入室盗物都盡献之徐曰偷兒青氊我家舊物可特置之偷驚走趙曰當白露降故憶青氊師曰甫悲秋而思故郷故有是句溪上峽内淹留客溪邊四五家古苕生迮洙曰一作濕鄭曰迮側格切迫也地秋竹隱踈花塞俗人無井洙曰峽俗多引泉或負水以自給山田飯有沙西江使舡至時復問京華洙曰心未甞忘王室也蘇曰王粲曰聞江西有使者船至煩問洛陽消耗舟檝律詩十一首放舡送客蒼溪縣鮑曰唐志蒼溪屬閬州鄭曰閬州地名寰宇記衡州新平縣吴録云神龍二年移在蒼溪之西是知爲閬州地也山寒雨不開直愁騎馬滑故作泛舟回趙曰孟浩然云爲多山水樂頻作泛舟行勢亦相似青惜峯巒過黄知橘柚來鮑曰言舟行湍移景物如畫雖速而不言速也鄭曰柚余救切似橙而酢江流翠自在坐穩興悠哉數陪李梓州泛江有女樂在諸舫戲爲豔曲二首上客迴空騎佳人滿近船江清歌扇底洙曰以扇自障而歌故謂之歌扇野曠舞衣前玉袖凌風並金壷隱浪偏競將明媚色偷眼豔陽天洙曰一作年趙曰公言佳人自衒其美色偷眼瞻視春光以爭相勝之意鮑明逺詩兹辰自爲美當避豔陽天白日移歌袖青霄近笛牀翠眉縈度曲鮑曰古詩云度曲翠眉低雲鬢儼分行立馬千山暮迴舟一水香使君自有婦莫學野鴛鴦修可曰古樂府栢上桑羅敷行云使君謝羅敷寧可共載車羅敷前致詞使君一何愚使君自有婦羅敷自有夫李梓州泛江有女樂公用此以諷之陪諸貴公子丈八溝携妓納凉晚際遇雨二首落日放舡好輕風生浪遲竹深留客處荷淨納凉時趙曰簡文帝晩景納凉詩荷淨月應來公子調冰水佳人雪藕絲洙曰謝玄暉詩秋藕折䡖絲蒼舒曰右按家語孔子侍坐於魯哀公公賜之桃与黍仲尼先飰黍而後啖桃公曰黍以雪桃也注雪拭也竦曰公子風調如冰水之清佳人拂拭如藕絲之際片雲頭上黒應是雨催詩趙曰盖戲言也雨甚當速歸而詩不了将欲爲雨以催之矣坡嘗使云颯颯催詩白雨來雨來霑席上風急洙曰一作惡打船頭越女紅裙濕燕姬翠黛愁洙曰越多美女西施越女也古詩燕越多佳人趙曰枚乗七發越女侍側鮑明逺舞鶴賦燕姬色沮䌫侵堤柳繫趙曰盖急雨當避進舟於岸傍故侵堤柳而繫纜也幔卷浪花浮洙曰泿起如花歸路翻蕭颯陂塘五月秋趙曰必稱月者以當五月炎天而遂成秋盖公句法也泛江方舟不用楫趙曰方舟並船也字出尔稚大臨曰隨流也極目揔無波洙曰招魂曰目極千里兮傷春心長日容盃酒深江淨綺羅大觀曰言江花色净如綺羅也亂離還奏樂飄泊且聽歌故園流清渭如今花正多陪王使君晦日泛江就黃家亭子二首山豁何時斷江平不肯流稍知花改岸始驗鳥隨舟結束多紅粉趙曰言有妓也古詩娥娥紅粉粧歡娱恨白頭蘇曰陳苑曰青春風物雖好歡娱獨恨白頭翁不得馳逐五陵年少吁嗟乆之非君愛人客晦日更添愁洙曰添一作禁趙曰時景迁移尽矣不爲不愁蔡伯丗曰古以正月尽爲令節曰晦日其說是有徑金沙軟無人碧草芳野畦連蛺蝶趙曰相連之蝶也裴子野雪詩云栖葉如連蝶江檻俯鴛鴦日晚煙花亂風生錦繡香趙曰言花錦繡之香也不須吹急管衰老易悲傷進艇南京乆客耕南畒洙曰明皇幸蜀號成都爲南京置尹比兩都北望傷神卧北䆫晝引老妻乗小艇晴看稚子浴清江俱飛蛺蝶元相逐並蔕芙蓉夲自雙茗飲蔗漿携所有瓷甖無謝玉爲釭洙曰鄒陽酒賦醪醸旣成緑瓷旣啓宋王招魂云濡鱉炮羔有蔗漿些城西陂泛舟青蛾皓齒在樓舩洙曰見大食刀詩注横笛短簫悲逺天春風自信牙檣動洙曰庚信賦鐵軸牙檣鄭曰檣器良切㠶柱也宋曰舡檣鐃如牙遲日徐看錦䌫牽洙曰吴甘寧以錦纜牽舡魚吹細浪揺歌扇燕蹴飛花落舞筵鄭曰蹴七六切洙曰以扇自障而歌故謂之歌扇公曾云程曰歌扇所以掩口遮羞不有小舟能盪漿百壷郍送酒如泉夢符曰按方言楫謂之橈或謂之櫂所以櫂謂之漿又前漢地理志酒泉郡師古曰舊俗傳云城下有金泉之味如酒覆舟二首巫峽盤渦暁洙曰江賦衝巫峽以迅激又盤渦谷轉黔陽貢物秋丹砂同隕石洙曰僖十六年隕石于宋五翠羽共沉舟洙曰洛神賦或拾翠羽鄒陽書積羽沉舟覉使空斜影洙曰覉旅也趙曰一句冩出押舡使者舡覆而無聊之意尽矣龍居悶積流洙曰龍居寳之所㱕聚也趙曰罪流之爲孽也丗言覆舟之物多爲龍宫之所聚耳篙工幸不溺俄頃逐輕鷗洙曰言其能泅尔竹宫時望拜洙曰前漢礼樂志正月上辛用事甘泉圜丘使童男女七十人俱歌昏祠至明夜常有神光如流星止集于祠壇天子自竹宫而望拜百官侍祠者數百人皆肅然動心趙曰詳味此篇盖因祠享而貢物也上四句言祠享下四句言覆舟桂館或求仙洙曰前漢郊祀志公孫卿曰仙人可見上常處以故不見今陛下可爲館如緱氏城置棗脯神人冝可致仙人好樓居於是長安創飛廉桂館師古曰飛廉及桂館二館名黄曰竹宫桂館事皆語諷玄宗好神仙姹女凌波日鄭曰姹陟駕切洙曰曹子建洛神賦凌波微涉羅襪生塵桓帝童謡河間姹女工數錢也神光照夜年趙曰所謂神光如流星是已此四句言祠神而神降之徒聞斬蛟劒洙曰荆佽飛得寳劒渡江中流兩蛟繞舟幾没佽飛拔劒斬蛟乃得濟趙曰恨無劒以斬蛟無復爨犀船洙曰温嶠爨犀以照水怪使者隨秋色迢迢獨上天洙曰張騫也趙曰上天以言見帝也然使者之情爲可嗟矣橋梁律詩三首陪李七司馬皂江上觀造竹橋即日成往來之人免冬寒入水聊題短作簡李公二首伐木爲橋結構同褰裳不渉往來通洙曰詩濟有深渉孫炎曰掲衣褰裳曹顔逺褰裳不足難天寒白鶴歸華表洙曰遼東華表上有一鶴自稱丁令威趙曰橋前二柱曰華表柱昔有白鶴集於柱上有云有鳥有鳥丁令威三千年吾其歸日落青龍見水中洙曰橋影落水中如青龍顧我老非題柱客洙曰見水宿遣興詩登樓必題柱注知君才是濟川功洙曰說命若濟巨川用汝作舟楫合歡却笑千年事驅石何時到海東洙曰秦始皇作石塘欲過海看日出處有神人能驅石下海石去不速神輒鞭之石皆流血趙曰言与賔客落橋之成而歡飲因笑往事之勞徒驅石也把燭橋成夜迴舟客坐時天髙雲去盡江逈月來遲衰謝多扶病招邀屢有期洙曰謝惠連詩輟䇿共駢筵並坐相招邀異方乗此興樂罷不無悲趙曰見橋成而飜悲何也盖橋所以通往來公流落旅寓而不能歸此其所以悲也李司馬橋了承髙使君自成都迴向來江上手紛紛三日成功事出羣巳傳童子騎青竹揔擬橋東待使君洙曰并州小兒騎竹馬以迎郭伋使君燕飲古詩六首律詩二十一首醉時歌魯曰按新唐書鄭䖍鄭州滎陽人天寳初爲恊律郎彦輔曰贈廣文館愽士鄭䖍諸公衮衮登臺洙曰一作華省洙曰衮衮言相継而登賢不肖無所辨也䖍以是不得志故不事事而官獨冷裴逸民叙前言往行衮衮可知蘇曰鍾繇諸公皆登臺寺省卿唯伊予尚卑折下僚趙曰衮兖出王濟云張華說漢史衮衮可聽言其議論不絶也彦輔曰諸公謂當時進任衮衮相續不絶貌廣文先生官獨冷洙曰國子監置黄文館愽士四人助教二人並以文士爲之領生徒爲進士者天寳九年置趙曰明皇愛鄭䖍之才置左右以其不事事更爲置黄文館處之則爲冷官可知彦輔曰北齊王晞曰非不愛作熱官但思之爛熟耳洙曰按本傳䖍坐謫私撰國史十年還京師玄宗愛其才欲置左右以不事事更爲置廣文館以䖍爲愽士䖍聞命不知廣文曹司何在訴宰相宰相曰上増國斈置廣文以居賢者令後丗言廣文博士自君始不亦美乎䖍乃就職乆之雨壞廡舎有司不復脩完寓治國子館自是遂廢其官貧約甚澹如也甲第紛紛厭粱肉廣文先生飯不足甲第甲乙丙丁之次也陸士衡擬古詩甲第椒与蘭又甲第崇髙闥虞子陽詩甲第始脩營謂第一宅也晋書傳咸曰今賈竪皆厭梁肉田蚡治宅甲諸第夏侯嬰傳賜嬰北第第一師古曰北第者近北闕之第嬰最第一也故張衡西京賦曰北闕甲第當道直啓前漢朱邑傳飢者甘糟糠穣歲餘粱肉此詩傷時多無功而受禄先生有道岀羲皇蘇曰董廉曰道出羲皇之上趙曰暗使陶潜自謂羲皇上人也彦輔曰旣爲之上則出可知矣或曰出謂原生於彼也先生有文洙曰一作才過屈宋洙曰一云所談或屈宋晏殊曰屈原宋王德尊一代常坎軻洙曰古詩坎軻長苦辛趙曰祖出楚辭七諌云年旣過半百兮愁坎軻而滯留晏曰王逸注坎軻不遇也各垂萬古知何用孫瞻民曰昔人爲名盖若畫餅充飢者也杜言鄭名雖大無益於用師曰酒古人所禁唯天子燕諸侯則曰不醉無歸晋竹林七賢或爲囚飲或爲豕飲大扺賢人不遇則寓意于酒以自遣適而已故名曰醉時歌衮者衮同也衮衮言衮同無别之甚唐制御史臺其屬有三院一曰臺院二曰殿院三曰察院掌糾正百官之罪悪省有三一曰中書省二曰尚書省三曰門下省臺省清要之職今也賢不肖無所甄别使小人得以衮同而登之是以鄭䖍耻與之並進寧甘心居乎冷官按唐史玄宗置廣文館以䖍爲愽士而以官冷云者蓋玄宗方窮兵於邊不留心經術其後官解頽榻寓次國子監由是遂廢故曰官獨冷甲第謂楊貴妃兄國忠賜宅京師以甲乙丙丁爲次第國忠之進特以妃寵而爵髙禄厚䖍反貧約不足於飯詩刺素食盖謂此也道出羲皇陶淵明所謂羲皇上人是也屈宋謂屈原宋玉坎軻不得志之貌古云使我有身後名不如眼前一杯酒生不遇時死留虚名果何益哉自古有才之士得道者寡矣由之勇賜之辨非無才也語其得道則未焉今䖍才過屈宋而又道全德備惜夫坎軻不得志也杜陵野客人更嗤被褐短窄鬢如絲洙曰後漢杜陵屬京兆杜預曰古唐杜氏也老子𬒳褐懷寳陶淵明詩𬒳褐欣自得屢空常晏如鄭曰地理志京兆府有杜陵縣乃古杜城溪宣帝改爲杜陵甫丗居此趙曰公家於杜陵故云又言杜陵有布衣又言杜陵野老也衱褐短窄使貧者衣短褐耳日糴太洙曰一作㤗倉五升米蒼舒曰前漢東方朔傳無令但索長安米史記八書太倉之粟紅腐不可食陶淵明曰不能爲五斗米折腰向郷里小兒時赴鄭老同襟期得錢即相覔沽酒不復疑忘形到爾汝洙曰文士傳禰衡有逸才與孔融作爾汝交時衡年二十餘融年巳五十孫瞻民曰莊子曰養志者忘形痛飲眞洙曰一作直吾師彦輔曰丗說王孝伯云但甞得無事痛飲讀離騷可稱名士程演曰莊子許􅒘曰吾師乎吾師乎師曰甫杜陵人也褐毛褐之衣賤者所服孟子云褐夫是也被褐短窄言貧約衣不掩脛日糴言無宿儲也大倉术言陳腐之米其價廉賤者所食五升言食指寡足知其貧不能贍養僕妾故也按甫有二子一曰宗文二曰宗武并妻共四口借曰人食一升只是一妻一妾而已何以異於齊人之貧哉同襟期言范張雞黍之期鄭老指䖍也朋友有通財之義故得錢即相覔杜詩云頼有蘇司業時時與酒錢是也不復疑者不以妻子掣財有嫌疑也甫與䖍相善稱汝稱我索於形骸之外其相忘如此相忘雖無少長至若䖍之痛飲真令甫北而不可不屈服也故曰真吾師也清夜沉沉動春酌宋援曰陸涶贈僚友詩敷文永清夜應璩書曰酌彼春酒簷洙曰一作燈前細雨燈洙曰一作簷花落趙曰近乎簷邊之花也劉邈詩簷花初照月學者多以簷雨之細如花遂以簷花爲簷雨之名非也但覺髙歌有鬼神蘇曰呉肅醉發耳熱浩歌春風疑有鬼神所助焉知餓死填溝壑洙曰昭十三年傳擠于溝壑左太冲詠史詩當其未遇時憂其填溝壑汲黯傳臣自以爲填溝壑石敏若曰朱買臣妻曰如公等餓死溝中耳相如逸才親滌器洙曰司馬相如傳文君奔相如俱之臨卭尽賣車騎買酒舎乃令文君當壚相如身着犢鼻褌與庸保雜作滌器於市中師古曰條洒也器食器也賤役也子雲識字終投閣洙曰揚雄傳王莽時劉歆甄豐皆爲上公莽旣以符命自立即位之後欲絶其原以神前事而豐子㝷甄子棻復獻之莽誅豐父子投棻四裔辭所連及便收不請時雄校書天禄閣上治獄使者來欲收雄雄恐不能自免洒從閣上自投下幾死莽聞之曰雄素不與事何故在此間請問其故廼劉棻嘗從雄學作竒字雄不知情有詔勿問然京師爲之語曰惟寂寞自投閣彦輔曰此言揚馬才學如此猶不爲時所用先生早賦歸去來石田茅屋荒蒼苔洙曰陶潜爲彭澤令是時郡遣督郵至吏白當束帶見督郵潜乃歎曰我不能爲五斗米折腰向郷里小兒乃自解印綬将歸田野命篇曰歸去來石曰史記子胥曰猶石田無所用注石田無可耕言此亦陶潜三逕就荒之意也儒術於我何有哉洙曰莊子帝力何有於我哉孔丘盗跖俱塵埃蘇曰崔祥曰男兒當壯即仕儒術於我焉有所損哉阮兢曰孔丘盗跖今爲塵埃人生不樂胡爲解憂趙曰意謂伯夷死名於首陽之上盗跖死利於東陵之下其於殘生傷性均也彦輔曰莊子孔子往見盗跖曰魯人孔丘聞將軍髙義敬再拜謁者按周乃寓言耳子美之意以謂至聖大悪同歸於盡而巳不須聞此意慘愴鄭曰上七感下楚亮切生前相遇且銜盃洙曰古之賢者不遇全身於醉者衆矣故此詩末章皆寓意於酒而又以醉名篇劉敞曰司馬遷書曰未甞銜盃酒趙曰劉伶云銜盃漱醪師曰說者謂簷花爲脫花非也杜詩云白花簷外朶或云簷竹如暮雨㵼簷竹則知簷花爲簷前之花簷竹爲簷前之竹明矣清夜沉沉言人寂也人寂雨細寧不發動酒㒷耶髙歌有鬼神言聲幽怨也杜詩云時無王良伯樂死即休丈夫不以貧賤死生動其心前輩云莫憂身外無窮事且盡生前有恨盃今宵有酒今宵且醉死生一付之天命焉知餓死填溝壑乎觀相如有逸才武帝嘗曰朕恨不與斯人同時尚且貧賤滌器賣漿揚雄投閣自殺古人不遇類皆如是何獨我輩是以甫勉䖍賦歸去來欲其棄官而去也石田乃沙石之田其田最廋陶淵明歸去來辭云歸去來兮田園將蕪胡不歸䖍雖貧尚有磽田可耕有茅屋可居何必効子雲仕於乱世以速投閣之禍况儒術遇用武之際不足負恃如孔子號爲真儒終以不遇老死干行盗跖横行天下膾食人肝其善悪雖不同而死朽化爲塵埃則一人生天地間浮名浮利皆不足慕要之終歸一死生前相遇且以酒同遣適其它不足慘愴區區然以爲憂也杜詩云酒不到劉伶墳上土亦是意矣蘇端薛復筵簡薛華醉歌文章有神交有道端復得之名譽早愛客滿堂盡豪傑趙曰漢書賔客滿堂開筵上日洙曰一作月思芳草趙曰尚書正月上日孔安國注上日朔日也故玉燭寳典以正月一日爲上日安得健歩移逺梅師曰此詩末章言氣酣日落西風来則知此上日爲日出時開筵思芳草嘆無花可賞也故有移逺梅之句亂揷繁花向晴昊千里猶殘舊冰雪百壷且試開懷抱垂老惡聞戰鼓悲急觴爲緩憂心擣洙曰小弁我心憂傷惄焉如擣心疾也趙曰謝霊運擬王粲詩云急觴盪幽黙少年努力縱談笑洙曰樂府少壯不努力老大徒傷悲看我形容巳枯槁洙曰漁父篇顔色憔悴形容枯槁座中薛華善醉歌歌辭自作風格老蘇曰盧蒙見江揔文歎曰格老詞麗非後生軰所到近來海内爲長句汝與山東李白好何劉沈謝力未工洙曰梁書何遜八歲能詩賦一文一詠范雲輙嗟賞沈約亦爱其文遜文章與劉孝綽並見重於丗丗謂之何劉丗祖著編論之云詩多而能者沈約少而能者謝眺何遜又劉孝綽七歲能屬文毎作一篇朝成暮遍好事咸諷誦傳冩流聞絶域又沈約傳謝玄暉善爲詩任彦异工於文章約兼而有之然不過也才兼鮑昭愁絶倒洙曰鮑昭字明逺晋衛玠談道平子絶倒修可曰宋景公筆録曰今人多誤鮑照爲鮑昭李啇隱詩有肥烹鮑照葵之句昔金陵人得地中石刻作鮑照蓋武后名昭唐人讀昭爲照爾鮑昭作明逺諸生頗盡新知樂洙曰少司命云樂莫樂兮新相知萬事終傷不自保氣酣日落西風來願吹野水添金柸蘇曰阮籍与人野飲酒盡興未盡籍曰焉得東風吹野水添此壷使金盃不空耶如澠之酒常快意洙曰左傳有酒如澠亦知窮愁安在哉忽憶雨時秋井塌古人白骨生青苔如何不飲令心哀韓曰陳歈古人白骨遍野雨生莓苔在生胡不飲酒飲中八仙歌修可曰蔡絛云舡字眠字天字前字各再押前字凡三押於古未見其體常質之叔父元度云此歌分八篇人人各異雖重押韻無異亦周詩分章之意也余曰邵氏聞見録云子美此歌用兩船兩天兩眠三前字韻如牽牛織女詩蛛絲小人態曲綴瓜果中又防身動如律竭力機杼中用兩中字韻李太白髙陽歌云鸕鷀杓鸚鵡杯百年三萬六千日一日須傾三百杯用兩杯字韻廬山謡云影落前湖青黛光金闕前開三峯長又翠影紅霞映朝日鳥飛不到吴江長用兩長字韻韓退之李花詩冰盤夏薦碧寶脆斥去不御慙其花又誰堆平地萬堆雪剪刻作此連天花用兩花字韻猛虎行猛虎死不辭但慙前所爲又親故且不保人誰信所爲用兩爲字韻子美太白退之於詩無遺恨當自有體邪師曰詩家多爲此歌重疊用韻天字二眠字二前字三以贈八人析爲八章故不爲病如李啇隱作九日詩云正是龍山落㡌時又云乞漿問路知何時旣曰丹楓隕葉紛墮飛又曰歸心自逐霜鴻飛豈謂贈八人耶殊不知李杜之作盖有所本詩祖於風雅頌如著詩云俟我於庭乎而充耳以青乎而尚之以瓊英乎而疊韻之法起于此耳知章騎馬似乗船眼花落井水厎眠洙曰唐書文苑傳賀知章㑹稽永興人少以文詞知名陸象先在中書引薦爲太常愽士象先即知章之族姑子與知章甚相親善知章性放曠善謔笑當時賢逹皆傾慕之晚年尤加縱誕無復規矩自號四明狂客又稱秘書外監遨遊里巷又善草隷書好事者供其牋翰毎紙不過數十字共傳寶之天寳三年知章因病恍愡上䟽請爲道士求還郷舎本宅爲觀上許之壽終八十六嵗蘇曰阮咸醉騎馬欹傾人皆指而笑曰箇老子騎馬如乗舡行波浪中主祥醉慿肩輿頭不舉歸其親戲之曰子眼花在井底身在水中睡亦不醒耶趙曰公以知章在馬上傲中如乗船戲之也眼花出吴均詩夢中難言見終成亂眼花彦輔曰梁簡丈筝賦耳熱眼花之娯杜以南方之士不習鞍馬故戲之師曰賀知章吴人善乗舡荆楚吴越之人習玩於水皆能精於操舟亦若西北之人迫近羌胡皆善騎射勢使然也知章乗舡安若騎馬故曰騎馬似乗舡此到用文杜詩若此類者頗多如黄鵠髙於尺童化爲白鳬似老翁亦謂五尺之童髙於黄鵠又爲老翁則似白鳬井者目井也醉人目井皆生花故曰眼花落井水厎眠者謂醉卧舟中任其泛泛所之豈非水底眠乎說詩不以文害辭不以辭害志盖謂是也彦輔曰范傳正李白墓碑曰公及賀監汝陽王崔宗之裴周南等八人爲酒中八仙按子美此篇無裴周南豈范别有所稽邪汝陽三斗始朝天蘇曰北齊王詢好飲帝一日召詢曰待此三斗盡方去見帝帝聞笑之道逢麴車口流涎恨不移封向酒泉洙曰本集八哀詩有贈太子太師汝陽郡王璡詩又贈特進汝陽王詩神異經西北荒中有酒泉孔融書天垂酒旗之曜地列酒泉之郡陸機百年歌自若濁鏡口垂涏應劭漢官儀曰酒泉城下有泉味如酒故曰酒泉蘇曰郭弘漢帝甚寵顧一日見帝帝曰欲封卿郡邑何地好弘好飲對曰若封酒泉郡實出望外帝笑後日果封酒泉郡王見郭弘碑彦輔曰漢班彪䟽曰願入玉門関不敢望封酒泉郷議論數不同自免去詩云避賢初罷相樂聖且衘杯試問門前客今朝幾箇來子美正用適之詩語也師曰左相李適之也唐百官志有左右僕射玄宗時改爲左右丞相昔何曾日食萬錢猶云無下筯處漢晉以來善飲者不過一石唐酒價賤毎斗三百杜詩云速冝相就飲一斗恰有三百青銅錢酒一石直錢三千然左相日費萬錢以斗石當其錢數而通計之則飲酒凡三石三斗有餘也其視劉伶軰一飲一石五斗解酲更高出其右矣觀其雄飲若此豈非鯨吸百川之比乎酒有清有濁清者爲聖人濁者爲賢人樂聖言樂聖人也時牛仙客爲尚書李林甫爲丞相遂罷適之政事故適之以退避賢路爲辤所以諷牛李也適之雖退避以酒自娱柰當丗稱其賢不以酒荒而掩其大德耳宗之蕭灑美少年舉觴白眼望青天彦輔曰阮籍善爲青白眼觀杜詩工於用字而畧其本意他多倣此皎如玉樹臨風前洙曰李白傳侍御史崔宗之謫官金陵與白詩酒唱和嘗月夜乗舟自採石逹金陵白衣宫錦𫀆於舟中顧瞻笑傲旁若無人晉阮籍傳籍能爲青白眼阮籍詩朝爲美少年江淹詩風吹玉階樹梁何遜詩長安美年少謝玄荅叔父安曰譬如芝蘭玉樹欲使其生於庭階耳丗說庾亮亡何楊州臨葬云埋玉樹於土中使人情何能巳又毛曾與夏侯玄共坐時人謂之蒹葭倚玉樹師曰宗之爲侍御史嘗與李白詩酒唱和昔阮籍能爲青白眼見賢士青其眼見庸士白其眼白眼望青天言以酒笑傲青天也視造化如小兒耳皎如玉樹言姿質潔白美丈夫也蘇晉長齋繡佛前醉中往往愛逃禪洙曰蘇晋蘇珦之子玄宗監國所下制命多晉藁定修可曰晉頲之子也逃禅言逃去而禅坐耳此東坡所謂蒲褐禅同夜禪者也以晉好佛故云爾師曰蘇晉學浮屠術嘗得胡僧慧澄繡彌勒佛一本晋寳之甞曰是佛好飲米汁正與吾性合吾願事之他佛不愛也蓋彌勒佛即今丗所謂布袋和尚是也常於市中飲酒食豬首時人無識之者故甫有長齋繡佛前愛逃禪之句李白一斗詩百篇長安市上酒家眠天子呼來不上船蘇曰船方言也所謂襟紐是巳萝符曰右按関中呼衣襟爲船詩曰何以舟之舟亦船也其來遠矣鮑曰劉偉明云蜀人呼衣襟爲船有以見白醉甚雖天子披襟自若其真率之至也定功曰唐范傳正作白墓碑曰元宗泛白蓮池召李白作序時巳𬒳酒命髙将軍扶以登舟蜀人謂衣領爲船妄也自稱臣是酒中仙洙曰李白字太白山東人少有逸才酣歌縱酒天寳初客逰㑹稽與道士呉筠隱於剡中旣而玄宗詔筠赴京師筠薦之于朝遣使召之與筠俱待詔翰林白旣嗜酒日與飲醉於酒肆玄宗度曲欲造樂府新詞亟召白白巳於酒肆醉矣召入宫人以水灑面即今秉筆頃之成十餘章帝頗嘉之嘗沉醉殿上别足令髙力士脫靴由是斥去浪迹江湖初賀知章見白賞之曰此天上謫仙人也後以飲酒過度醉死於宣城趙曰不上船丗共疑之舊注不解此乃長安方言襟謂之船也薛蒼舒引詩何以舟之舟亦舡也杜公又引李翰林墓碑云玄宗泛白蓮池召公作序公以披命力士扶以登舟以此之意則竟上舡矣非不上舡也亦又非是師曰不上舡不即時上舡以其醉也帝常宴白蓮池忽欲有所賦遣人召李白使者遍長安市上求索之巳見白醉卧于酒家矣及至帝所醉不能登舟帝命力士扶上舡故云天子呼來不上舡杜詩贈李白曰龍舟移棹晚蓋謂此尔或以蜀人衫衿爲舡蜀方言並無此說當以贈白詩為證張旭三盃草聖傳脫帽露頂王公前揮毫落紙如雲煙洙曰唐賀知章傳呉郡張旭与知章相善旭善草書而好酒飲後號呼狂走索筆變化無窮若有神助時人號爲顛後漢張奐傳奐長子芝伯英善草書王愔文志曰芝少時髙操以名臣子勤學尤好草書學崔杜之法家之衣帛必書而後練臨池學書水爲之黑爲丗所寳寸紙不遺韋仲將謂之草聖胡母輔之與謝鯤阮放畢卓羊曼桓彛阮孚散髪祼袒閉室酣飲已累日光逸排户入守者不聽逸便於戸外脫衣露頭於狗竇中窺之大呌輔之驚曰它人决不能耳必成孟祖也遽呼入遂与飲不捨於晝夜時人謂之八逹趙曰漢張芝善草書號草聖故以比之號旭爲張顛故有脫帽露頂之句如後漢班超傳單于脫㡌徒洗旭爲人酒秃脫帽則露頂矣乃所以戲之蘇東坡所謂顛張醉素兩秃翁末句美其冩字之疾也潘安仁作楊荆州誄云動翰如飛紙如雲師曰苦救衰朽差科死則巳鄭曰差楚皆切簡也誓不舉家走今年大作社洙曰社祭也所以祈農事也春祈秋報故嵗有春秋二社趙曰左傳鄭子産大爲社也拾遺能住否呌婦開大瓶盆中爲吾取感此氣揚揚須知風化首洙曰郡守縣令風化之首趙曰晏子傳其御者意氣揚揚也語多雖雜亂說尹終在口朝來偶然出自卯將及酉乆客惜人情如何拒鄰叟髙聲索果栗欲起時被肘洙曰言屢爲掣肘蘇曰孔文㪯就里人飲夜深而歸家人責其遟曰欲命駕數數被肘工部一世偉人造語深得要妙胷中無國子監者不可讀其詩師曰足知甫乆客与鄰叟無一日不如此也指揮過無禮未覺村野醜洙曰㪯止無度不可責礼法也月出遮我留仍嗔問升斗蘇曰何憙以春秋知各海内累詔不仕嗜酒毎飲不問升斗俱尽醉中猶長褒貶人皆欽服其量陪王侍御同登東山最髙頂宴姚通泉晚携酒泛江姚公美政誰與儔不減昔時陳太丘洙曰丗說陳紀字元方年十一時候袁紹袁公問曰卿家居在太丘逺近稱之何所履行元方曰老父在太丘强者綏之以德弱者撫之以仁恣其所安乆而益敬袁公曰孤往者嘗爲鄴令正行此事不知卿家君父何師元方曰周公不師孔子孔子不師周公邑中上客有柱史多暇日陪騘馬遊洙曰老子爲柱下史舊說騘馬御史東山髙頂羅珍羞洙曰晋謝安雖貴而東山之志不謝曹子建緩帶傾庶羞下顧城郭銷我憂洙曰登樓賦聊假日以銷憂清江白日落欲盡復携美人登綵舟笛聲憤怒哀中流妙舞逶迤夜未休洙曰漢武秋風辭携佳人兮不能忘横中流兮揚素波簫鼓鳴兮發棹歌歡樂極兮哀情多宋曰逶迤即委蛇燈前往往大魚出聽曲低昻如有求洙曰荀子瓠巴鼓瑟游魚出聽師曰自此以上旣陳宴樂之㒷遂於末章有警戒之意盖樂極則継之以哀樂不可過古人戒之作詩之躰當然自三更風起寒以下皆警戒之辭三更風起寒浪湧取樂喧呼覺船重满空星河光破碎四座賔客色不動請公臨深莫相違迴船罷酒上馬歸人生歡㑹豈有極無使霜露霑人衣洙曰此言極樂則悲來也修可曰此倣謝希逸月賦日月旣役兮露欲晞歲万晏兮無与㱕佳期可以還微霜露霑人衣湖城東遇孟雲卿復歸劉顥宅宿宴飲散因爲醉歌疾風吹塵暗河縣洙曰楊給事誄軼我河縣俘我洛畿趙曰長門賦天漂漂而疾風行子隔手不相見楷曰管子道塗揚塵十步不相見也湖城城南一開眼駐馬偶識雲卿面况非劉顥爲地主趙曰左傳地主致餼言人爲地之主也嬾迴鞭轡成高宴蘇曰宋宗昨見王済遂成高臺之宴清談如玉屑落金盤使人嬾迴鞭轡継燭飛玉觥劉侯歎我携客來置酒張燈促華饌且將𣢾曲終今夕夢符曰右按魏文帝碼碯勤賦賦曰碼碯玉屬也出自西域文理交錯有似馬腦故其方人因以名之又古樂府湘東王曲幄中清酒碼碯鐘群邊雜佩琥珀龍霊持寄心不惜共指星河向今夕悮疑茅堂過江麓洙曰堂一作屋巳入風磴霾雲端鄭曰磴丁鄧切霾謨皆切洙曰陸士衡飛陛躡雲端自是秦樓壓鄭谷洙曰秦樓以秦女弄玉吹簫於樓上得仙故曰秦樓鄭谷以鄭子真耕於谷口故曰鄭谷時聞雜佩聲珊珊鄭曰相干切洙曰孔子入見衛霊公夫人南子自絺惟中再拜環珮玉聲璆然師曰山海經曰崑崙山有琅玕樹其子似珠以珠爲簟如琅玕色故曰夏簟青琅玕琥珀出罽賔國初如桃膠凝乃成焉魏文帝碼碯賦序曰碼碯玉属也出自西域文理交錯有似馬腦故其方人因以名之甫有渇疾故喜飲冰漿風磴乃風路也霾雲端言其石磴之髙秦樓壓鄭谷言駙馬冨貴非谷口貧賤之比也故云悮疑茅堂茅堂即甫草堂是已雜佩声珊珊指公主之環佩也崔駙馬山亭宴集蕭史幽棲地洙曰蕭史弄玉夫也好吹簫教弄玉作鳳鳴而作鳳臺一旦夫妻皆隨鳯去林間踏鳥毛師曰蕭史聚秦女弄玉故言比崔駙馬踏鳥毛謂蕭史与弄玉同跨彩鵉而去也洑流何處入鄭曰洑房六切洙曰洄洑之水亂石閉門高趙曰皆言其幽悽客醉揮金椀趙曰揮者棄也旣醉而遂以金椀与之戴暠詩云揮金留客坐詩成得繡𫀆洙曰李白外傳云白對明皇撰樂府新詞得宮錦袍趙曰唐武后使東方虬宋之問賦詩詩先成者得錦𫀆亦此得繡𫀆清秋多宴㑹洙曰一云賞樂終日困香醪洙曰香醪酒也又有濁醪白醪鄭駙馬池臺喜遇鄭廣文同飲不謂生戎馬洙曰老子戎馬生於郊何知共酒盃燃臍郿塢敗洙曰董卓傳吕布殺卓使皇甫嵩攻卓弟旻於郿塢殺其母妻男女尽滅其族乃尸卓於市天時始熱卓素充肥脂流於地守尸吏燃火置卓臍中光明逹晝師曰此句言禄山伏誅也握節漢臣回洙曰蘇武仗漢節牧羊起卧操持節毛尽落積十九年還㱕師曰此句言鄭自賊㱕也白髮千莖雪丹心一寸灰洙曰言爲憂患所困而心巳無物矣故云一寸灰别離經死地披冩忽登臺洙曰王粲登樓賦聊假日以忘憂与此同意師曰披寫言剖懷也重對秦簫發洙曰見始知秦女善吹簫注俱過阮宅來洙曰見自湏留阮宅注師曰以䖍之踈放比之阮籍也留連洙曰一作醉留春夜舞淚落強徘徊洙曰一云醉連春苑夜舞淚落徘徊陪李金吾花下飲勝地初相引徐洙曰一作余行得自娱見輕吹鳥毳鄭曰充芮反隨意數花鬚鄭曰數所矩切計也蘇曰王逸少居山隂日凭欄黙數花鬚或摘撚咀嗅怡然自若人莫識其意細草稱偏坐趙曰亦飲酒闌珊而偏於細草之上而不思起矣香醪懶再沽蘇曰張超香醪遽尽吾懶再沽煩尓軰与吾去取醉歸應犯夜可怕李金吾洙曰漢制金吾將軍主徼廵京師時可曰韋𫐠西都新記曰京師街衢有金吾曉暝傳呼以禁夜行唯正月十五日夜敕許金吾㢮禁前後各一日故蘇味道上元詩曰金吾不惜夜玉漏莫相催師曰薛夣符補遺引李廣從之田間飲㱕覇陵縣尉止之今將軍尚不得夜行事誤矣吹鳥毳言走見金吾骨䡖似吹鳥毛之輕疾也隨意數花鬚言遲留也香醪懶再沽意属下句可怕李金吾也宴胡侍御書堂洙曰李尚書之芳鄭袐監審同集㱕字韻江湖春欲暮牆宇日猶微闇闇書籍滿輕輕花絮飛翰林名有素墨客興無違洙曰揚雄作長揚賦藉翰林以爲主人子墨爲客卿以諷趙曰指言李尚書鄭袐監胡侍郎皆翰林之手也末句言文星亦然今夜文星動吾儕醉不歸洙曰漢苟陳德星聚左傳吾㑪小人又云况吾㑪乎㑪等也詩不醉尤帰書堂飲旣夜復邀李尚書下馬月下賦絶句湖上林風相與淸殘鐏下馬復同傾蘇曰阮孚居汶上嵇迷往别飲至夜分散明日述下馬叩門曰殘鐏可傾乎遂飲酣揮鞭而去其眞率如此乆拚野鶴如雙鬢遮莫鄰雞下五更洙曰趙典傳云大儀鵠髪注白髪也五更見和賈舎人早朝大明宫注春夜峽州田侍御長史津亭留宴得筵字北斗三更席西江萬里船杖藜登水榭揮翰宿春天白髮煩多酒明星惜此筵趙曰夜将尽而曉則明星行暗矣於是筵終爲可惜也始知雲雨峽洙曰高唐賦云巫山之陽髙丘之岨朝爲行雲暮爲行雨忽盡下牢邊洙曰下牢地名也陪王待御宴通泉東山野亭江水東流去清樽曰復斜異方同宴賞何處是京華亭影臨山水村煙對浦沙狂歌遇形勝趙曰過於字如過乎恭過乎哀之義豈言踰過於勝絶者乎得醉即爲家蘇曰阮宣飄流往來人間居止何地曰得醉処即爲家宴王使君宅題二首漢主追韓信蒼生起謝安洙曰漢王入関諸將多逃䔥何獨追韓信晉謝安髙卧東山爲蒼生起吾徒自飄泊丗事各艱難逆旅招邀近他郷意緒寛不才甘朽質洙曰楊惲書材行朽穢文質無所底趙曰所以自処之語髙卧豈泥蟠洙曰揚子龍蟠于泥趙曰所以自謙也汎愛容霜鬢留歡上夜關洙曰一作色䦨子美父諱閑諸家本辨兩處非閑字此亦可知其誤矣自吟詩送老相勸酒開顔戎馬洙曰古詩戎馬遍九州今何地郷園獨在山江湖墮清月趙曰李白亦云更看江月墮清波酩酊任扶還蘇曰嵆康常醉人扶還家古詩曰但教長酩酊任自别人扶宴戎州楊使君東樓勝絶驚身老情忘發興竒趙曰破題已對言勝雖絶矣而驚見在之身則老情雖忘矣而發所對之㒷則竒也座從歌妓密樂任主人爲趙曰歡樂之事一任主人爲之重碧拈洙曰一作酟春酒洙曰曹子建七啓云春清縹酒注縹深碧色蘇曰歐陽文忠公曰酤當作拈趙曰舊本作酤春酒非也善本作拈則元稹元日詩羞看稚子先拈酒白楽天歲假詩云歲酒先拈辝不得如此則拈酒乃唐人之語也輕紅擘洙曰一云酌又掌荔枝洙曰蜀都賦旁挺龍目側生荔枝蘇曰李充閩中行云擘荔枝濕輕紅酌竹葉艶深緑王愷見而竒之趙曰荔子雖有数種而膜皆帶粉紅黄魯直在戎州時王公權家荔子緑廖致平家緑荔枝詩試傾一盃重碧色快剥千顆輕紅肌樓髙欲愁思横笛未休吹季秋蘇五弟纓江樓夜宴崔十三評事韋少府姪三首峽險江驚急樓髙月􅒯明一時今夕㑹萬里故郷情蘇曰梁里起故園万里之情星落黄姑渚蘇曰蜀記黄惠女下巫峽聞兒亡乃悲泣累日而止於水湄丗號其地曰黄姑渚秋辭白帝城老人因酒病堅坐看君傾明月生長好浮雲薄漸遮悠悠照邊塞洙曰月賦升素質之悠悠悄悄憶京華蘇曰陸雲春來客思酷憶京華丗事悄悄可憂也清動盃中物鮑曰陶淵明詩天運苟如此且尽盃中物晋楽廣傳常有親客乆閉不復來廣問其故荅曰前在坐蒙賜酒方欲飲見盃中有蛇意甚惡之旣飲而疾于時河南㕔事壁上有􅃮弓畫作蛇廣意盃中蛇即角影乃復置酒於前謂客曰酒中復有所見否荅曰所見如𥘉廣乃告其所以客醒然意解沉痾頓愈髙隨海上查洙曰事見查上覔張鶱注不眠瞻白兎洙曰劉孝綽月詩攅柯半玉蟾植叢映金兎拾遺記玄州之南以水精爲月刻瑶爲兔楚辭夜光何得蟾光在復百過落烏紗洙曰烏紗帽也對月那無酒登樓况有江聽歌驚白鬢笑舞拓秋䆫樽蟻添相續洙曰子建七啓盛以翠樽酌以彫觴浮蟻鼎沸酷烈馨香沙鷗竝一雙盡憐君醉倒更覺片洙曰一作我心降洙曰詩我心則降劉九法曹鄭瑕丘石門宴集秋水清無底蕭然淨客心掾曹乗逸興洙曰漢制以曹官爲掾如室之掾也言其有所負荷趙曰題是与劉法曹故云曹掾鞍馬去相尋洙曰一云到荒林能吏逢聮璧洙曰潘岳夏侯湛每同行人以爲連璧華筵直一金張詠曰文帝惜百金罷露臺顔師古注以爲金一兩直十千則百金者一千緍乃中人十家之産也晚來横吹好沈括曰後漢班超假鼓吹注古今樂録曰横吹胡樂也張騫自西域傳其法於長安唯得摩訶兠勒一曲李延年因之更造新声二十八解乗㒷以爲武樂後漢以給邊將俗用者黄鵠隴頭出関入関出塞入塞折楊柳黄覃子赤芸楊望行人十曲泓下亦龍吟洙曰馬融長笛賦近丗雙笛從羌起羌人伐竹未及巳龍鳴水中不見以已截竹吹之声相似與鄠縣源大少府宴渼陂得寒字應爲西陂好金錢罄一飡夢符曰按前漢書曹丘生數招權顧金錢蘇曰隋焬帝宫娃遊揚州見菱芡曰罄錢一飡其奢冨如此見大拾遺飰抄雲子白洙曰雲子雨也荀子雲賦曰託地而遊宇友風而子雨時可曰漢武帝内傳王母謂帝曰太上之藥乃有玄光梨角風實雲子趙曰雲子指言菰米飰也西陂中則有菰矣宋玉云主人女炊香菰之飰惟菰米之香滑㓗白然後足以當雲子之譬也瓜嚼水精寒無計廻船下空愁避酒難趙曰言主人苦相勸酒無計避之耳主人情爛熳持荅翠琅玕洙曰四愁詩美人贈我翠琅玕何以報之雙玉盤趙曰情爛熳盖情多之意持荅翠琅玕意以篇什當之也師曰漢武帝傳王母謂帝曰太上之藥乃有玄光黎角風實雲子帝園王族昌城王藥紫虬童子九色龍腦太真䖵芝天漢神草南宫大碧西郷扶老有得服之後天而老内翰以雲子爲雨誤矣翠珢玕以喻投我之想重故以此詩荅之和江陵宋大少府暮春後同諸公及舎弟宴書齋渥洼汗血種洙曰漢武元鼎四年秋馬生渥洼水中作天馬之歌歌曰太一况天馬下霑朱汗沬流赭注大宛馬汗血言汗從前肩髀出如血渥洼事見送封主簿王郎詩天上麒麟兒洙曰徐陵年數歲家人携見宝誌上人誌以手摩頂曰天上石麒麟也才士得神秀洙曰孫綽賦天台山岳之神秀書齋聞爾爲棣華晴雨好洙曰棠棣之華宴兄弟之詩綵服暮春冝洙曰老萊子班衣趙曰取暮春者春服旣成朋酒日歡㑹洙曰豳七月朋酒斯饗兩樽曰朋蘇曰荀爽朋壷助春勸㑹老夫今始知蘇曰西門卓歧路荆棘人情炎凉老夫今日始知矣夜宴左氏莊風林纎月落定功曰古詩兩頭纎纎月初生衣露淨琴張饒節曰月落露下言夜深也暗水流花逕春星帶草堂檢書燒燭短蘇曰韋玄毎使子弟讀書或檢閱文字燒短燭燼則罷課夜常以此爲程短尺燭也趙曰謂之檢書則必尋討事出之類檢或未獲冝乎燒燭至於短看洙曰一作說劒引盃長洙曰看劒一云煎茗趙曰東坡有云引盃看劒話偏長正使此句一本作說劒字則話說而巳未必因之而長引盃也詩罷聞吴詠洙曰吴詠作吴人詠詩声也蘇曰公孫滿寓秦中月夜聞人吴音棹歌浩然有㱕心即日命駕㱕矣扁舟意不忘趙曰惟其聞吴詠故有扁舟之㒷王十五前閣㑹楚岸收新雨春臺引細風情人來石上趙曰鮑明逺詩留釣待情人鮮鱠出江中趙曰枚乗七發云鮮鯉之􅳬鄰舎煩書扎洙曰司馬相如傳扎木蘭之薄小者時未多用紙故給扎以書録趙曰王十五者必公之鄰也肩輿強老翁趙曰以筍輿來迎公也病身虚俊味趙曰以病不能食而虚其俊美之味何幸飫兒童趙曰饋食於公持之以㱕故燕及兒軰矣獨酌歩屧深林晩開樽獨酌遲仰蜂粘落絮洙曰一作蘂趙曰蜂黏花蘃是也一作落絮非是行洙曰行列之行蟻上枯梨薄劣慙眞隱洙曰謝霊運詩彼美丘園道喟焉傷薄劣幽偏得自怡本無軒冕意不是傲當時洙曰冕服軒車也蒼舒曰右按莊子曰今之所謂得志者軒冕之謂也軒冕在身非性命也物之儻來寄者也師曰蜂粘落絮蟻上枯梨言無味也獨酌最無㒷味故以喻之隱有真有假如杜淹之隱嵩山徼求利禄此所謂仕塗之捷徑耳甫以薄劣而遁丗故云真隱非有意於軒冕也獨酌成詩燈花何太喜洙曰西京雜記云樊將軍噲問陸賈曰自古人君皆云受命于天有瑞應豈有是乎賈應之曰有之夫目瞤得酒食燈花得錢財乾鵲噪而行人至蜘蛛集而百事喜小既有徴大亦冝然趙曰今公得酒獨酌而用燈事大抵取喜事而巳酒緑正相親洙曰緑一作色醉裏從爲客趙曰任從爲客而不辭也師曰言爲客得醉且以寛釋也詩成覺有神洙曰如有神助也公甞有詩云讀書破萬卷下筆如有神趙曰禰衡之能文章曰思若有神兵戈猶在眼儒術豈謀身師曰言兵戈之際儒道非可圖冨貴苦𬒳微官縛低頭愧野人何曰低頭言愧而不能仰視也蘇曰鮑暾放逸傲丗不仕士大夫多枉駕過廬不問高下皆平揖未嘗低折人目爲後軰卧龍一日部使者謁暾少頃弟昭曰子卑賤如此如何不深雲笑傲作此態豈不愧野人耶分門集註杜工部詩卷第十, WYG: ''}
