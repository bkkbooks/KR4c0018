  - {type: variant, offset: 0, length: 23401, content: 分門集註杜工部詩卷第二十尋訪古詩三首律詩十三首晦日尋崔戢李封朝光入甕牖洙曰朝光晨光也漢賈誼過秦論陳涉甕牖繩樞之子孟康曰以瓦甕爲䆫尸洙曰一作方寢驚弊裘洙曰論語郷黨曰寢不尸包曰偃卧四體布展手足似死人起行視天宇黃曰陶淵明詩昭昭天宇闊春氣漸和柔興來洙曰一云得興不暇懶今晨梳我頭出門無所待徒洙曰一作徙歩覺自由杖藜復恣意修可曰莊子載原憲杖藜應門蘇曰林鳯恣意携杖藜看竹過南溪免值公與侯晚定崔李交會心真罕儔洙曰薛夢符云丗說晉簡文幸華林園謂左右曰㑹心處不在逺脩然林水便有濠梁之趣田曰夢符引此非也是時蓋言與崔李定交相㑹以心不以跡也黄曰古樂府後周徐謙短歌云意氣青雲裏爽朗煙霞外不重一囊錢唯重心襟㑹此乃㑹心之意薖曰㑹心意相契合每過得酒傾洙曰一作契鄭曰過左禾切二宅可淹留喜結仁里懽逢原曰語里仁爲美趙曰張平子思玄賦匪仁里其焉宅况因令節求李生園欲荒舊洙曰一作有竹頗脩脩引客看掃除隨時成獻酬崔侯初筵色逢原曰詩賔之初筵巳畏空樽愁洙曰孔融曰坐上客常滿樽中酒不空未知天下士至性有此不洙曰一至作志不方鳩切草牙旣青出蜂聲亦煖遊思見農器陳洙曰農器耒耜之類何當甲兵休上古葛天氏不貽黃屋憂洙曰屋一作綺上林賦聽葛天氏之歌范蔚宗黄屋非堯心師古曰黃屋車上之蓋也皆天子之儀修可曰漢書紀信乃乗王車黃屋李斐曰天子車以黄繒爲裏也至今阮籍等熟醉爲身謀洙曰顔延年詠阮步兵詩阮公雖論跡識宻鍳亦洞沈醉似醒然寓辭類託諷籍傳云籍本有濟丗志屬魏晉之際天下多故名士少有全者籍由是不與丗事遂酣飲爲常文帝求婚於籍醉大十日不得言而止鍾㑹數以時事問之欲因其可否而致之罪以酣醉獲免威鳯髙其翔洙曰一云自髙翔時天下大亂賢者退處若威鳯然髙其翔而不下全身逺害也宣帝紀威鳯爲寳服䖍曰威鳯謂鳥名也晉約曰鳯之有威儀者也與尚書鳯凰來儀長鯨吞九州洙曰謂盗賊縱横如長鯨之吞并九州也長鯨鯨魚也文選長鯨吞航地軸爲之翻洙曰海賦又似地軸拔而爭廻百川皆亂流當歌欲一放淚下恐莫收濁醪有妙理蘇曰王啇見于存飲濁酒啇笑曰君子何苦好此物耶存曰自有妙理非公所知庶用慰沉浮師曰自古賢者不得志多適意于酒况濁醪之有妙理乎雨過蘇端端置酒雞鳴風雨交洙曰鄭國風風雨凄凄雞鳴喈喈師曰雞鳴思君子之詩寓意思憶蘇端故乗雨而過之乆旱雨亦好杖藜入春泥無食起我早蘇曰夏侯無食不寐使我早起諸家憶所歷一飯洙曰一作飽跡便掃洙曰言交態之薄也蘇曰邵平曰交態浮薄吾甘自養或有親知家得一飯即掃遂不復再扣門矣丗態由此見也蘇侯得數過鄭曰數色角切歡喜每傾倒也復可憐人呼兒具梨棗濁醪必在眼盡醉攄懐抱紅稠屋角花鄭曰稠直由切碧委墻隅草親賔絶談謔喧閙慰衰老况蒙霈澤垂粮粒或自保妻孥隔軍壘撥棄不擬道趙曰阮籍詠懷一身不自保何說戀妻子今於糧粒或自保之下言妻子隔軍壘亦使此矣撥棄不擬道亦自淵明撥置且莫念之変也師曰天寳十五年甫携家三川是詩未章云妻孥隔軍壘則知此詩之作在至德二載也是年八月始許往三川迎家有北征詩夏日李公見訪洙曰一云李家今見訪逺林暑氣薄公子過我遊蘇曰阮元瑜公子得暇可過我菊坡遊師曰公子指李白也貧居類村塢洙曰馬融在陽塢中僻近城南樓趙曰沈約詩逺林響咆獸近樹聒鳴蟲貧居類林塢僻近城南樓此所謂城南韋杜也傍舎頗淳朴所願亦易求鄭曰易以䜴切隔屋喚西家借問有酒不鄭曰方鳩切弗也牆頭過濁醪洙曰江淹恨濁醪夕引蘇曰友人見陶侃侃家貧無以致誠其鄰人賢謂侃曰子門有長者軒車何不延之論當丗事侃曰貧不能備醴餌鄰人密於墻頭度以濁酒隻雞遂成終日之樂本朝王兾公過侃廟有詩云九重天閽夢摶翼黄雞白酒鄰舎恩名公謂其詩中題展席俯長流清風左右至符曰江淹晨飈自逺至左右芙蓉披客意巳驚秋巢多衆鳥闘葉密鳴蟬稠苦遭此物聒孰語吾廬幽洙曰詩蟬噪林逾静鳥鳴山更幽陶淵明詩衆鳥欣有託吾亦愛吾廬時可曰古詩言庭樹曰此物何足貴水花晚色静庶足充淹留預恐罇中盡更起爲君謀洙曰孔融曰坐上客常滿罇中酒不空古今注蓮花一名水旦一名水芝一名水花楊曰荷花㓗静猶清人之神思只恐樂有餘而杯不足無以延客之歡故云云有客幽棲地僻經過少洙曰幽棲所居之地也經過往還也以所居之地幽棲少往還也謝叔原逰西池詩逍遥越城肆願言屢經過謝靈運詩恣此永幽棲豈伊年歳别老病人扶再拜難豈有文章驚海内謾勞車馬駐江干洙曰詩寘之河之干兮注干涯也梁范雲詩江干逺樹浮竟日淹留佳客坐洙曰劉安招隱詩云攀援桂枝兮聊淹留又詩於焉嘉客又我有嘉客百年麄糲腐儒飡洙曰麄糲麄衣糲食也腐儒見題省中壁詩注趙曰戰國䇿嚴仲子進百金於聶政曰以爲夫人麤糲之費莫嫌野外無供給乗興還來看藥攔洙曰見山隂野雪興難乗注客至魯曰喜崔明府相過舎南舎北皆春水但見洙曰一作有群鷗日日來花徑不曽縁客掃蘇曰王武仲隱居羊欣相訪武仲曰君子冝去吾不可啓関恐踏碎滿徑落花欣嗟賞乆之而歸蓬門今始爲君開洙曰言尋常爲鷗鳥往來未甞有客至今也方除剪蓬蒿以待君子盤飡市逺無兼味趙曰潘岳作夏侯湛誄有云重珍兼味樽酒家貧只舊醅肯與隣翁相對飲隔籬呼取盡餘盃嚴中丞枉駕見過洙曰嚴自東川除西川勑令兩川都節制一本云嚴黄門枉駕見過元戎小隊出郊埛洙曰詩六月元戎十乗以先啓行注元大也夏后曰鈎車先正也殷曰寅車先疾也周曰元戎先良也爾雅曰邑外謂之郊林外謂之埛問柳尋花到野亭川合東西瞻使節洙曰玄宗在蜀合東西兩川爲一道以武爲尹趙曰公自注云嚴自東川除西川勑令西川都節制地分南北任流洙曰一作孤萍洙曰謂長安有南杜北杜也趙曰公自言也自蜀望長安則長安爲北而蜀爲南也扁舟不獨如張翰洙曰晉文苑傳張翰字季膺㑹稽賀循赴命入洛經吴閭門於船中彈琴翰𥘉不相識乃就循言談便大相欽悅問循知其入洛翰曰吾亦有事北京便同載即去而不告家人後爲齊王曹囧曹掾因見秋風起思蓴鱸遂命駕南歸趙曰晉文苑有張翰傳傳中别無扁舟之文唯云爲掾於齊王囧幕見秋風起思菰蓴鱸鱠遂命駕歸吴而巳白帽應兼似管寧洙曰魏青龍中徴命管寧寧不至常著白帽布𥜗袴趙曰魏管寧傳青龍中徴命不至居海上常着皂帽社佑通興所載亦然今云着白㡌公必有據也寂寞洙曰一作今日江天雲霧裏何人道有少微星洙曰隋天文志少微四星在太微西士大夫之位也一名處士明黄則賢士舉矣晉書隱逸謝敷傳初月犯少徴一名處士星占者以隱士當之俄而敷死嚴公仲夏枉駕草堂兼携酒饌魯曰得寒字一云鄭公枉駕携饌訪水亭竹裏行厨洗玉盤花邊立馬簇金鞍蒼舒曰右按古樂府對酒行金樽清俊滯玉盤亟來親又白馬行白馬黄金鞍蹀躞㧕城前又輕薄篇象牀沓繡𬒳玉盤傳騎食非關使者徴求急洙曰見前白帽應兼似管寧注趙曰莊子載顔闔守陋閭魯君之使者至闔對曰恐聽者謬而遺使者罪不若審之使者還反審之復求之不得矣舊注所引殊無使者求之之文非是自識將軍禮數寛洙曰嵇康書云阮籍爲禮法之士所繩頼大將軍保持之耳百年地闢柴門逈五月江深草閣寒看弄漁舟移白日老農何有罄交歡趙曰弄漁舟則則以言蔽公也移白日言盡日也老農公自言也王十七侍御掄許携酒至草堂奉寄此詩便請邀髙三十五使君同到老夫卧穩朝慵起白屋寒多暖始開江鸛洙曰一作鶴巧當幽徑浴鄰雞還過短牆來繡衣屢許携家醖洙曰漢侍御有繍衣直指出討姦滑治大獄劉恢每一見令人欲倒家釀趙曰故公指言王侍御也皂蓋能忘折野梅洙曰續漢志二千石皂蓋朱兩轓陸凱詩折梅逢驛使寄與隴頭人戲假霜威促山簡須成一醉洙曰一云醉裏習池廻洙曰謂侍御邀髙使君故言假霜威山簡習池乃襄陽山公醉習家池趙曰霜威言王侍御謂御史風霜之任山簡指髙公山簡傳無習池字惟出㐮陽記曰峴山南習郁大池山季倫毎臨此池大醉而歸王竟携酒髙亦同過共用寒字卧病荒郊逺通行小徑難故人能領客携酒重相看自愧無鮭菜蘇曰梁受友人至曰家貧愧无鮭菜以待君子蜀人重鮭菜趙曰鮭户皆切晉人以魚爲鮭菜也又南史庾杲之清貧自業食惟生韮雜菜任防戲之曰誰謂庾郎貧食鮭空煩缷馬鞍移時勸山簡頭白恐風寒洙曰髙毎云汝年幾且不必小於我此句戲之徐九少尹見過魯曰唐以少尹爲行軍長史有節度使即謂之行軍司馬也晚景孤村僻行軍數騎來交新徒有喜禮厚愧無才賞靜怜雲竹忘歸歩月臺趙曰蓋公所居有臺焉何當看花蘂欲發照江梅范二貟外邈吴十侍御郁特枉駕闕展待聊寄此作蹔往比鄰去洙曰比近也音毗空聞二妙歸洙曰衛瓘與尚書郎索靖俱善草書時人號爲一臺二妙幽棲誠簡略衰白巳光輝野外貧家逺村中好客稀蘇曰柳下惠莊周好客稀少論文或不愧重肯𣢾柴扉洙曰范彦龍贈張徐州詩田家樵採去薄暮方來歸還聞稚子說有客欵柴扉輕蓋照墟落傳瑞生光輝傳陟戀切九月一日過孟十二倉曹十四主簿藜杖侵雲露蓬門啓曙煙力稀經樹歇老困撥書眠秋覺追隨盡來因孝友偏趙曰言今來孟氏家因重其兄弟孝友偏篤也清談見滋味爾軰可忘年洙曰爲忘年之契也趙曰禰衡始弱冠孔融年四十爲忘年交過客相尋窮老真無事江山巳定居地幽忘盥櫛洙曰地幽故得遂踈慵也客至罷琴書洙曰惟以琴書自樂也挂壁移筐果呼兒問煑魚洙曰樂府呼兒烹鯉魚時聞繫舟檝及此問吾廬洙曰陶潜吾亦愛吾廬趙曰公自言凢有舟楫過往必來見之也賔至患氣經時乆師曰甫有肺疾故云云臨江卜宅新洙曰舊史所謂結廬枕江也喧卑方避俗踈快頗冝人有客過茅宇呼兒正葛巾洙曰諸葛亮葛巾毛扇指麾三軍司馬宣王聞之歎曰名士也自鋤稀菜甲蘇曰張騫有客至自鋤菜甲作羮小摘爲情親師曰物雖薄出於力之所致王十五司馬弟出郭相訪兼遺營茅堂貲客裏何遷次江邊正寂寥修可曰陳樂昌公主詩今日何遷次新官對舊官肯來尋一老趙曰詩不憗遺一老愁破是今朝蘇曰阮簡乆寓西山一日友人携酒炙雞往見阮大笑曰今朝愁膓破矣其曠放如此憂我營茅棟携錢過野橋他郷唯表弟還往莫辭遥師曰漢𥘉應曜隱於淮陽山中與四皓俱徴曜獨不至時人語曰南山四皓不如淮陽一老曜即應劭八代祖又管寧書曰唯陛下聽野人山藪之願使一老得盡微命次乃次舎遷次謂遷卜比居愁破言客來破吾之愁聞斛斯六官未歸故人南郡去去索作碑錢本賣文爲活洙曰唐書言以文獲財未有如李邕者蘇曰段湛家貧賣文爲活後子弟多歷顯要趙曰夫爲人作碑以至逺去索錢爲可傷矣其求碑之人亦可鄙矣飜令室倒懸洙曰左傳室如懸磬孟子由解倒懸趙曰孟子云如解倒懸言其室中飢餓不啻倒懸荆扉深蔓草土銼冷踈煙洙曰蜀人呼釡爲銼蘇曰王褒家貧土銼經日無煙土銼瓦錭也鄭曰銼粗卧切唐韻蜀呼鈷䥈老罷休無頼趙曰言老而罷也歸來省醉眠師曰唐史拾遺斛斯子明尤工碑銘四方以金帛求其文者嵗不减十萬隨得隨費家人至貧窶不給子明不以介意故甫末章有老罷休無頼歸來省醉眠之語深以爲戒也酬荅律詩九首寄題杜二錦江野亭洙曰成都尹嚴武作謾向江頭把釣竿懶眠沙草愛風湍莫倚善題鸚鵡賦洙曰禰衡爲黄祖作鸚鵡賦筆不停綴丈不加點何須不着鵕䴊冠洙曰佞倖傳孝惠時皆冠鵕䴊冠具帯傅脂粉化閎籍之屬也漢書音義曰鵕䴊鳥名也以羽飾於冠焉趙曰盖嚴公以子美之才如禰衡矣而剛直隱淪不喜仕䆠决不肯爲侍中而冠鵕䴊厠迹佞臣之側也腹中書籍幽時曬洙曰郝隆七月七日曬腹於庭中人問之曰我𦢊腹中書肘後醫方静處看洙曰葛洪傳洪自號抱朴子抄金匱藥方一百卷肘後要急方四卷興發㑹能馳駿洙曰一作五馬終須重到使君灘奉酬嚴公寄題野亭之作拾遺曽奏數行書洙曰公曽任左拾遺懶性從來水竹居奉引濫騎沙苑馬洙曰公詩中頻言奉引及侍祠事而本傳不載趙曰拾遺掌供奉則騎馬以奉引後漢劉聖公傳李松奉引馬驚奔觸北宫鐡柱則奉引有馬之證矣幽棲真釣錦江魚洙曰赭白馬賦弭雄姿以奉引公有沙苑馬詩謝安不倦登臨費洙曰以謝安比嚴公也安寓居會稽與王羲之髙陽許詢桑門支遁游處出則漁弋山水毎往臨安山中坐石室臨濟谷放情丘壑然毎游賞處必以妓女從之趙曰安於土山營墅樓館林竹甚盛子姪往來遊集肴膳亦屢費百金公言費則以嚴公有遺厨載酒之費也阮籍焉知禮法踈洙曰阮籍性踈懶至爲礼法之士疾之如讎焉師曰唐於沙苑置坊監養馬甫爲拾遺侍肅宗收復京師奉引者導駕也武數過子美草堂携酒餽遺頗厚故云謝安不倦登臨費阮籍焉知礼法踈子美自釋不著鵕䴊冠之罪也枉沭洙曰一作今日旌麾出城府草茅無逕洙曰無一作荒欲教鋤洙曰卜居賦寕誅鋤草茅以力耕乎贈杜二拾遺趙曰題云贈二拾遺其官云蜀州刺史髙適傳道招提客洙曰招提佛寺詩書自討論佛香時入院僧飯屢過門聽法還應難洙曰支遁与許詢同講維摩經互爲設難尋經剰欲飜洙曰飜譯也莊子飜十二部經趙曰舊注誤引莊子繙十二經爲飜十二部經非也莊子言繙十二經以說老子其云繙者委曲敷衍之謂非飜譯爾十二經解者以爲六經六緯非佛十二部經也草玄今巳畢此後更何言洙曰揚子雲作太玄經解嘲曰時方草太玄師曰維摩經云如入薝蔔林唯齅薝蔔不嗅餘香若入此室但聞佛功德之香不楽聞辟文佛功德香也此詩乃髙適作以贈子美故後篇子美用以酬髙適酬髙使君相贈古寺僧牢落空房客寓居故人供禄米洙曰禄米俸廪鄰舎與園𬞞洙曰陶淵明摘我園中𬞞雙樹容聽法洙曰釋書言佛說法於祗園樹下三車肯載書洙曰法華經火宅喻三車牛車羊車鹿車也草玄吾豈敢賦或似相如洙曰司馬相如善爲賦夢符曰司馬相如上林賦子虚賦意思蕭散不復与外事相関揔引天地錯綜古今忽然如睡渙然而興幾百日而從其盛長道甞作賦相如荅曰合綦組以成丈列錦繡而爲質一經一緯一宫一啇此賦家之迹賦家之心包括宇宙揔質人物斯乃得之於心不可得而傳之也趙曰揚雄傳孝成帝時有薦雄文似相如者今公詩意姑以著書則不敢爲賦則能之耳早發湘潭寄杜貟外院長韋迢作北風昨夜雨江上早來凉楚岫千峯翠蘇曰景差蘭臺春望千峯楚岫碧萬木郢城隂湘潭一葉黃故人湖外客白首尚爲郎洙曰見名慙白首郎注趙曰杜公晚爲貟外郎也馮唐顔駟白首爲郎相憶無來鴈何時有報章蒼舒曰右按文選顔延年和謝監詩盡言非報章聊用布所懷酬韋韶州見寄養拙江湖外朝廷記憶踈深慙長者轍洙曰長者轍見前漢陳平傳趙曰言見過之無人也重得故人書洙曰古詩客從逺方來遺我一札書又相去萬里餘故人心尚爾趙曰言書問之不至也白髮絲難理蘇曰張企素髮如絲無計料理幾煩梳鏡時起咨嗟新詩錦不如雖無南過鴈洙曰見書成無過鴈注看取北來魚洙曰漢使謂單于曰天子於上林射鴈足有書故知蘇武所在也又古詩呼童烹鯉魚中有尺素書趙曰今公荅韋迢無南鴈之語故以北來魚戯之也杜貟外兄垂示詩因作此寄上郭受判官新詩海内流傳困舊德朝中屬望勞郡邑地卑饒霧雨洙曰見亦可變携卑濕地注江湖天闊足風濤洙曰顔延年春江壯風濤松醪酒熟旁看醉蘇曰謝敷曰山家松醪酒熟吾不能飲傍坐看子醉蓮葉舟輕自學操洙曰莊子顔回問仲尼曰吾甞濟乎觴深之泉津人操舟若神吾問曰操可學乎曰可善游者數習而後能蘇曰吴宫美人毎侍宴姑蘇回輕舟蘭棹載酒唱採蓮詞其舟皆宫婢操春興不知凡幾首衡陽𥿄價頓能髙洙曰出武家紙又云出五里𥿄邢子才苟一文出京師爲之𥿄貴庾闡造楊都賦成偉麗時人相傳爭寫爲之紙貴酬郭十五判官才微歲老尚虚名卧病江湖春復生藥裏關心詩揔廢花枝照眼句還成只同燕石能星隕洙曰左傳隕石于宋五隕星也又星隕如雨荀卿曰宋之愚人得燕石於梧臺之東自得隋珠覺夜明洙曰隋侯之珠夜光之璧喬口橘洲風浪促繫㠶何惜片時程洙曰橘洲見橘州田土仍膏腴注師曰宋之愚人得燕石于梧臺之惻藏之以爲大寳周客聞而觀焉主人齋七日端冕元服以發寳革櫃十重客見俛而掩口胡盧而笑曰此燕石也其與瓦甓不殊主人大怒曰盲瞽之言藏愈固守愈謹藥褁関心言治病也無暇於詩篇隋珠喻郭判官詩喬口橘洲乃荆衡之地繫㠶何惜片時程欲郭來訪己也酬别杜二嚴武新添獨逢堯典日再覩漢官時未効風霜勁空慙雨露私夜鍾清萬户曙漏拂千旗並向斜亭謁俱承别館追斗城怜舊路鍋水惜歸期峯樹還相伴江雲更對垂試回滄海棹更妬敬亭詩秪是書應寄無忘酒共持但令心事在未肯鬢毛衰最悵巴山裏清猿惱夢思恵貺古詩一首律詩三首太子張舎人遺織成縟段客從西北來遺我翠織成洙曰古詩客從逺方來遺我一端綺開緘風濤湧蘇曰吴翰開緘詞采璀璨筆勢若風動濤湧中有掉尾鯨洙曰江賦揚鬐掉尾又介鯨乗濤以出入海賦其魚則横海之鯨偃髙濤巨鱗挿雲鄭曰掉徒弔切摇也逶迤羅水族何曰逶迤委曲貌瑣細不足名洙曰皆言織紋也師曰自開緘風濤湧至此句皆叙織段之文客云充君褥承君終宴榮修可曰曹子建詩終宴不知疲安石曰宴榮乃安榮也空堂魑魅走師曰空堂言堂上無所有四壁徒立而巳魑魅走言鬼神驚駭此物也髙枕形神清梅曰謂爽人神思領客珍重意顧我非公郷留之懼不祥洙曰左傳服之不衷身之災蘇曰王剪留之懼不祥生其間去之可也施之混柴荆服飾定尊卑大哉萬古程洙曰書車服以庸韓曰程謂法度今我一賤老短褐更無營洙曰見短褐霜風入注趙曰短褐者蓋短窄之褐也煌煌珠宫物寢處禍所嬰洙曰書臣有作福作威玉食害于而家凶于而國蘇曰段植有送九華戰𫀆碾玉腰帶植曰珠宫貴物非武人所服之辝趙曰珠宫指言龍宫也楚辭云貝闕兮珠宫蓋言以此物而寢處非卑賤所冝懼嬰於禍歎息當路子干戈尚縱横掌握有權柄衣馬自肥輕洙曰語乗肥馬衣輕裘李鼎死𡵨陽實以驕貴盈來瑱賜自盡鄭曰瑱陟刃切襄州節度使氣豪直阻兵洙曰上元三年肅宗追瑱入京裴茙稱瑱屈強難制冝早除之代宗潜令裴茙圖之瑱擒茙妻子於江漢瑱入朝謝罪代宗含怒寳應二年貶瑱播州縣尉翌日賜死於鄠縣籍没其家瑱先爲襄陽節度使左傳阻兵安忍昔聞黃金多洙曰蘇季子位髙金多老子曰多藏則厚亡坐見悔吝生奈何田舎翁洙曰漢祖起田舎翁受此厚貺情錦鯨卷還客鄭曰卷古轉切始覺心和平振我麤席塵蘇曰胡誼家貧讀書不憚寒暑所卧床上唯麤席布衾木枕而巳媿客茹藜羮洙曰王子淵頌羮藜含糗者不足論太牢之滋味趙曰莊子云藜羹不糝舊注所引王子淵頌羹藜含糗非徒在後又字倒矣師曰甫傷兵革之際生民有不得其食不得其居處者我何忍獨安于此又自以卷還客始覺心和平足知甫之所養於中者宏深雖伯夷目不視惡色耳不聽惡声何以加此孟倉曹歩趾領酒醬二物滿器見遺老夫趙曰夏侯湛賦詰朝之暇歩趾前廡楚岸通秋屐胡床面夕畦藉糟分汁滓洙曰酒德頌枕麯藉糟後漢樊皇皇者華君遣使臣也文七年傳荀林父曰同官爲僚吾常同僚敢不盡心乎漢髙祖詈酈食其曰腐儒幾敗廼公事師曰古今詩話云古之文章自應律度未以音韻爲主自沈約增崇韻學之後巧其辭語體製漸多始有蹉對假對雙聲疊韻之類如自朱邪之狼狽致赤子之流離不惟赤對朱邪對子兼狼狽流離乃獸名對鳥名又如厨人具雞黍雉子摘楊梅以雞對楊之類皆爲假對子美以飲子對懷君及惡樹詩枸𣏌因吾有雞棲奈尓何殆亦所謂假對也柴胡可煎爲飲子喫之通汗夔峽間多險阻唯州稍平故子美云林中纔有地峽外更無天此言早作取平塗欲其來就此平地相見也謝嚴中丞送青城山道士乳酒一瓶山瓶乳酒下青雲氣味濃香幸見分鳴鞭走送憐漁父趙曰謝靈運詩鳴鞭適大阿漁父公自謂也公前篇有云強擬晴天理鈞絲是洗盞開甞對馬軍洙曰軍州謂馬軍蓋以騎兵送酒趙曰公自注軍州謂駈使騎爲馬軍以漁父對馬軍字爲工矣師曰屈原逢漁父於江畔漁父憐其憔悴原曰舉丗皆醉惟我獨醒漁父曰何不哺其糟啜其醨鳴鞭走送憐漁父盖憐其獨醒故遣馬軍走送乳酒送别上古詩十九首送殿中楊監赴蜀見相公趙曰相公杜鴻漸也大曆元年受劒南節度使去水絶還波洙曰古詩長江無迴浪洩雲無定姿洙曰陸機賦曰有輕盈之艶狀無實體之眞形人生在丗間聚散亦暫時離别重相逢偶然豈定期趙曰莊子曰人生丗間如白駒之過隙送子清秋暮風物長年悲趙曰淮南子云木葉落長年悲豪俊貴勲業邦家頻出師相公鎮梁益軍事無孑遺解榻再見今洙曰陳蕃禮周璆别置一榻去則懸之來則解用才復擇誰况子巳髙位爲郡得固辭難拒供給費愼哀漁奪私洙曰言不以道取也如漁人之漁焉蘇曰張曙秉權勢漁奪貧民私帑干戈未甚息紀綱正所持汎舟巨石横登陸草露滋山門日易乆當念居者思趙曰此公自言也左傳有居行者之語師曰甫意謂巳能逐姦邪苟能用之則亦軒然而奮矣湘江宴餞裴二端公赴道州白日照舟師朱旗散廣川趙曰楚詞云青春受謝白日照羣公餞南伯肅肅秩初筵洙曰餞謂羣公相餞也南伯謂道州南邦也詩賔之𥘉筵左右秩秩亦整粛粛皃鄙人奉末眷佩服自早年洙曰末眷謂於裴有親也早年少年也自少巳佩服其德矣義均骨肉地懷抱罄所宣盛名富事業無取愧髙賢不以䘮亂嬰保愛金石堅洙曰言宜以功業著盛名使無愧於髙賢也無嬰於䘮乱以変乱名節冝保之若金石之固此子美以骨肉之義故其所言及此也趙曰髙賢指裴端公也保愛謂保身之意故子美以骨肉之義故所言及此舊注非計拙百寮下氣蘇君子前會合苦洙曰又作共不乆哀樂本相纒交遊颯向盡宿昔浩茫然促觴激百慮洙曰促觴言行觴急促也掩抑涙潺湲洙曰重别有所感也熱雲集曛黒闕月未生天洙曰九歌横流涕兮潺湲謝靈運朝游窮曛黒古詩三五明月滿四五蟾兎闕白團爲我破華燭蟠長煙夢符曰右按梁元帝燭賦長䄂留賔待華燭燭燼落燭華明花抽珠漸落珠懸花更生又古樂府三婦豔詩大婦留芳縟中婦對華燭鴰鶡催明星鄭曰鴰古活切鶡何葛切蘇曰魏文帝早起戒途至新林聞鴰鶡催天明明星落林表今江湖水邊有解袂從此旋上請減兵甲下請安井田永念病渇老附書逺山巔師曰道州南邦也州長曰伯粛粛敬也鄙人甫自稱於裴有末親是以欲其盡懷抱以告之自盛名冨事業以下皆戒之之辝冝以功業著盛名使无愧於髙賢无以䘮乱嬰懷抱保全節操如金石之堅甫之自爲計則拙其爲道州謀則氣義宏矣故云氣蘇君子前合㑹苦不乆言欲别去樂極而哀継之也颯衰颯也交遊之中衰替向尽平昔契舊回首茫然况今促觴行遽寧不感激万慮而淚落潺湲乎日入日曛别筵夜熱團扇爲之摇破鴰鶡催曙之鳥夜巳䦨矣始分袂旋歸故甫又以兵甲井田爲戒古人謂贈之以言者此也陪章留後惠義寺餞嘉州崔都督赴州中軍待上客洙曰晋以郤縠將中軍孔融謂李膺爲登龍之上客趙曰中軍指章留上客指崔都督左傳凡言某人中軍則以言主將也令肅事有恒前驅入寳地洙曰縣令負弩前驅祖帳夏景欵留此寺遺却炎蒸之氣故下文有永願坐長夏之句釋氏有大乗有小乗如來謂之大乗教羅漢謂之小乗教甫以衰老之年欲棲心於大乗惜宴會謂愔别也别蔡十四著作賈生慟哭後寥落無其人洙曰賈誼上書言時事云可爲慟哭安知蔡夫子髙義邁等倫蘇曰朱雲意氣超邁等倫映絶今古獻書謁皇帝志已清風塵流涕灑丹極萬乗爲酸辛天地則創痍朝廷當洙曰一云多正臣異才復間出洙曰間出猶間生也周道日惟新使蜀見知已别顔始一伸主人薨城府扶櫬歸咸秦鄭曰櫬𥘉僅切洙曰言主人薨謝蔡扶櫬歸秦也趙曰史記云士伸於知巳主人指郭英人於㤗天元年爲崔旰所殺故言薨巴道此相逢洙曰巴道蜀道也相如論蜀文巴蜀之士會我病江濵憶念鳯翔都聚散俄十春我衰不足道但願子意陳稍令社稷安自契魚水親洙曰蜀先主得孔明猶於魚之得水也趙曰以孔明待蔡君矣我雖消渇甚敢忘帝力勤尚思未朽骨復覩耕桑民洙曰民安於耕桑則至治之丗然也積水駕三峽浮龍倚長津趙曰郭景純遊仙詩云髙浪駕蓬萊浮龍倚長津亦實道三峡中有如此事楊舲洪濤間蘇曰馬藻楊舲槮檛語笑於洪濤之間仗子濟物身鞍馬下秦塞王城通北辰洙曰北辰北極也象於帝居趙曰秦塞則出陸矣北辰言帝居也玄甲聚不散兵乆食恐貧洙曰兵聚而食貧也窮谷無粟帛使者來相因若馮南轅使洙曰又作南轅史書扎到天垠洙曰使者徴歛之使也相因言來相継漢書陳陳相因之北而南轅古詩云遺我一書扎垠岸也甘泉賦有云漂龍淵而還九垠趙曰班固燕山銘曰玄甲曜日注鐡甲也窮谷指夔州也來相因不断也此言方用兵湏食而頻遣使者來至窮谷如此則南轅之使可馮其史而附書也送髙三十五書記鮑曰髙書記適也字逹夫渤海人少落魄客梁宋間宋州刺史張九臯竒之舉有道調封丘尉不得志去客河西河西莭度使哥舒翰表爲左驍衛兵曹叅軍掌書記師曰適爲武威郡鎮帥哥舒翰府掌書記故甫送以此詩崆峒小麥熟鄭曰崆苦紅切峒徒紅切夏竦曰寰宇記肅州昔月支之地漢武時爲武威酒泉郡崆峒山在郡東且洙曰一作吾願休王師洙曰尓雅四極北載斗極爲崆峒之山家語曰宓子賤爲單父宰百姓化之斉人攻魯道由單父單父父老請曰麥已熟矣今斉㓂至不及人人自收其麥請放民皆使出穫麥可以益粮且不資㓂三請而宓子賤不聽俄而斉㓂逮乎麥季孫聞之怒使人譲之宓子蹙然曰今兹無麥明年可種若使不耕者得穫是使民樂有㓂也季孫聞之𧹞然媿曰地若可入吾豈忍見宓子哉賈誼書同續漢書曰栢帝時童謡曰小麥青青大麥枯誰當穫者婦与姑丈夫何在擊西胡蘇曰武帝欲討西戎耿遜諌曰今崆峒小麥方熟陛下冝休王師使割麥實其備帝從之修可曰崆峒西方山也按史記云黄帝西至于崆峒韋昭注曰在隴右九域圖志云岷州和政郡有崆峒山皆非尔雅所載按尔雅乃作空桐字請公問主將焉用窮荒爲彦輔曰窮荒謂窮兵武貪土地也師曰西北地寒時晚小麥熟是五月之時玄宗開元𥘉用張九齡爲相天下安平遂貪邊功開拓土地致有吐蕃之憂榖麥者民之司命今麥正熟願休兵使邊民得収穫小麥是爲生民之本請髙適問主將哥舒翰何用窮荒之地俾民不得穫麥乎且夷狄之地乃窮荒所在譬如石田不可以耕雖得其地果何益哉此以忠言諷之饑鷹未飽肉側翅隨人飛洙曰魏志吕布因陳登求徐州牧不得布怒登喻之曰登見曹公言待將軍譬如養虎當飽其肉不則噬人公曰不如卿言譬如養鷹饑則爲用飽則揚去布乃解載記慕容垂猶鷹也飢則附人飽則髙飛李希声曰杜言此以喻髙也髙生跨鞍馬彦輔曰古詩云鞍馬光照地有似幽并兒洙曰曹子建白馬篇白馬飾金覊連翩西北池借問誰家子幽并游俠兒鮑明逺擬古詩幽并重騎射少年好騎逐山簡㪯鞭問葛強何如并州兒鄭曰洪水旣平舜分兾州爲幽州并州二州爲游俠之士師曰鷹之爲用可飢不可飽飽則飛去得一兎飼一鼠得一禽飼一雛飢而後可用也譬若髙適豪傑之士其肯爲哥舒翰用是故卑微其官使之發激立功而後加以髙爵重禄鷹不飢不肯側翅以隨人髙適官不薄亦不肯隨哥舒翰往武威此必然之理也幽并二州逼近羗戎其俗皆習鞍馬馳射髙適本儒生今能跨馬有似幽并之兒以其文武兼資故也脫身簿尉中鮑曰適以封丘尉不得志去故云始與捶楚辭鄭曰捶主蘂切洙曰北山移文云𫾣扑諠嚻犯其慮韓愈云判司卑官不堪說未免捶楚塵埃間司馬遷書以稍陵遟至於鞭捶之間鮑曰謂唐時叅軍簿尉受杖非也今詳杜所言捶有罪者也退之江陵途中云栖栖法曹掾何處事卑陬何况親犴獄敲榜發姦偷此豈身受杖如漢諸署郎耶余曰邵氏聞見録云子美贈髙適詩云云杜牧之寄姪阿冝詩云一語不中治鞭捶身滿瘡盖唐叅軍簿尉有罪加撻罰如今之胥吏也髙子勉見山谷云尓予初疑其不然因讀史代宗命劉晏考所部官善惡刺史有罪者五品以上刻治六品以上杖訖奏參軍簿尉不足道也借問今何官鄭曰借資昔切觸熱向武威洙曰前漢武威郡故匈奴休屠王地武帝太𥘉四年開隋志舊置凉州後周置揔管府大業𥘉府廢李㤗伯曰程曉詩觸熱到人家荅云洙曰一作言一書記所媿國士知洙曰陳琳袁本祕書記之士又阮瑀管書記之任賈誼傳豫子曰中行以衆人畜我我故衆人亊之智伯以國士遇我我故國士報之人實不易知鄭曰易以豉反更洙曰一作尤須愼其儀洙曰一作冝范睢傳侯陵請信陵君曰人固未易知知人亦未易昱曰抑詩敬慎威儀十年出幕府自可持旌麾洙曰一作旗李廣傳幕府省文書晉灼曰將軍職在征行无常処所在爲治故言幕俯幕大也或曰衛青征匈奴絶大漠大克獲帝就拜大將軍於幕中府故曰幕府幕府之名始於此師古曰二說皆非也幕府者以軍幕爲義古字通用軍旅无常居止故以張幕言之廉頗李牧市租皆入幕府此則非因衛青始有其號又幕大於義乖彦輔曰旌麾謂旌旗麾盖將兵者所建丗說曰掘尾盖此行旣特逹足以慰所思洙曰一云亦足慰逺思男兒功名遂亦在老大時鄭曰大唐佐切巨也又徒盖切師曰今髙適脫身於簿尉中巳免捶楚之憂矣武威即凉州觸熱謂小麥熟正當五月之時書記掌撰兵符軍檄露布之類甫問髙適今巳辤捶楚而爲何官蓋適之行期觸冒暑熱向武威郡爲掌書記而巳然媿荷哥舒翰以國士禮與之結知甫因戒之曰人相結知不爲易得當小心謹慎其儀無待才髙驕傲於主將則爲失己失人也古云相識徧天下知心能幾人故曰人實不易知古人於别離有財則贈之以財無財則贈之以言今甫戒以慎其儀乃古人贈言之意也適甞與李白酒酣登吹臺爲人豪放不檢甫恐彼踈脫於哥舒翰故戒以慎其儀大將行兵無宫室可居惟以青油幕爲府以避風雨故云幕府唐制從軍歲乆者始得大郡髙適今在幕府爲書記十年間出須得大郡故云自可持旌麾析羽爲旌所恃以指麾也故曰旌摩適之此行巳辭捶楚他日立功復持旌麾豈非特逹乎足以慰甫懷思之情而无所恨也自古大丈夫功名成遂亦在晚年不必皆少逹也文選云嘉榖不早熟大器當晚成甫旣勉以十年出幕府恐嫌於遲暮故有下句爾常恨結驩淺李希聲曰左傳云願結歡於二三君各在天一涯洙曰古詩相去万餘里各在天一涯又如參與商洙曰蘇武詩昔爲鴛與鴦今爲參與辰王正長雜詩云王事離我老殊隔過參啇陸士衡詩形聲參商乖音息曠不逺昭元年傳子産曰昔髙辛氏有二子伯曰閼伯季曰實沈居于曠林不相能也日尋干戈以相征討后帝不臧遷閼伯于啇丘主辰啇人是因故辰爲商星遷實沈于大夏主參唐人是因以服事夏商故參爲晉星驚風吹洙曰一作飄鴻鵠不得相追隨余曰張良傳鴻鵠髙飛一舉千里羽翼以就横絶四海黃塵翳沙漠潘大觀曰曹植賦揚黄塵之冥㝠念子何當歸洙曰前漢匈奴傳隔以山谷壅以沙漠盧諶贈崔温詩北眺沙漠垂曹子建樂府少小去郷邑揚聲沙漠垂蘇武欲展清商曲念子不能歸江淹詩飲馬出城濠北望沙漠路陳湯傳匈奴不敢南郷沙漠前書音義沙土曰漠即今磧也邊城有餘力早寄從軍詩洙曰王仲宣云從軍佂遐路討彼東南夷陸士衡樂府詩有從軍行苦哉逺征人北戍長城阿師曰古云歌驩希遇愁别多逢盖人生天地間爾東我西是以結驩淺故云各在夫一涯辰參二星不相得各居一方人之離别不獲㑹聚者似之生平旣与適少相驩㑹今又執别如參与商中腸安得不悲慘也驚風者回飈也鴻鵠一舉千里漢書陳勝云燕雀安知鴻鵠之志然鴻鵠得疾風吹嘘其勢髙舉逺引彼燕雀之徒豈得相追隨也鳲鵠喻適甫以燕雀自譬恨不得追隨於適而去也沙磧曰漠武威乃邊郡與沙漠相連風揚黄塵障翳人目豈冝乆居不知歸期當在何日或邊城無㓂綽有餘暇早寄詩什庶知適之安否昔王粲有從軍詩適本文墨之士不以軍事廢擲篇章甫之所囑者以此送長孫九侍御赴武威判官騘馬新鑿蹄師曰後漢桓典爲御史常乗騘馬時人語曰行行且止避騘馬御史銀鞍被來好洙曰東祖孫登詩落涙灑銀鞍徐敬業汗馬躍銀鞍繡衣黃白郎洙曰漢侍御史有綉衣直指持斧捕盗騎向交河道洙曰漢侯應上書車而前國王治交河城河水分流繞城下故號交河唐安西去交河郡七百里問君適萬里取别何草草天子憂凉州嚴程到須早蘇曰嚴顔謂左校曰乆不得江左信息尔冝嚴程勉力早到甚妙去秋羣胡反不得無電掃馬曰風激電掃此行牧遺甿風俗方再造洙曰唐書王室再造族父領元戎洙曰元戎元帥也名聲閣中老奪我同官良飄飄按城堡使我不能餐令我惡懷抱若人才思闊饒曰若人羡孫侍御也溟漲浸絶島罇前失詩流蘇曰房炳見嵆康歸山隂曰今日樽前失我詩流塞上得洙曰一作多國寳皇天悲送逺雲雨白浩浩洙曰楚辭曰天自顥說文曰顥白貌九辨皇天平分四時竊獨悲此凛秋又悲秋若逺行登山臨水送將歸東郊尚烽火朝野色枯槁西極柱亦傾如何正穹昊洙曰列子湯問篇折天柱又云常怒流於西極蘇曰徐貞曰慿君寄語數執事方今天柱傾反穹昊何計以正送樊二十三侍御赴漢中判官威弧不能弦蘇曰司馬遷刳木爲弧以威四方然弧不能自弦自發其威安弦者人也君子有道不能自彰使彰名者亦人也此言安父子爲亂而乗輿播遷肅宗駐蹕鳯翔也威弧出揚雄河東賦曰玃天狼之威弧張平子思玄賦又云弯威弧之拔刺自爾無寧歲易弦木爲弧剡木爲矢弧矢之利以威天下蓋取諸睽鮑明逺寕歳猶亡奔國語姜氏告於公子曰自子之行晉無寕歲師曰易曰弧矢之利以威天下玄宗開元初天下冨實自謂四方無虞偃然荒縱酒色寵愛貴妃禄山以胡種居髙位揔兵從事夷狄中國武備皆弛是不能以弧矢之利威天下也禄山一旦乗隙而叛自此紛亂略無寕嵗故曰威弧不能弦自尔無寕歲川谷血横流洙曰楊子川谷流人之血豺狼沸相噬蘇曰崔甫干戈未止狼虎相噬黄曰豺狼喻盗賊也天子從北來黄曰言肅宗即位於靈武也長驅振凋敝頓兵𡵨梁下洙曰肅宗理兵鳯翔唐曰肅宗爲中興恢復之計故云長駈振凋敝却跨沙溟裔帥曰沙溟裔捐漢中郡謂跨歷楚漢諸州並皆整兵從帝東討二京䧟未収四極我得制修可曰尔雅釋地東至於秦逺西至於邠國南至於濮㳂北至於祝栗謂之四極注此四方逺極之國名歐陽曰肅宗以太子稱尊號雖云偏據一方而四極之廣皆爲緫制何命而不從乎蕭索洙曰作瑟漢水清𬗟通淮湖稅使者紛星散洙曰古詩星使日夜馳王綱尚旒綴洙曰詩長發爲下國綴旒又公羊傳君若贅旒然㤗伯曰言其危而欲絶也南伯從事賢君行立談際洙曰揚雄或立談間而封侯趙曰南伯指言漢中主將也從指言樊爲判官也言南伯與從俱賢相投在立談間耳生知七曜曆洙曰月令命大史司天曆候日月星辰七曜爲經二十八宿爲紀修可曰漢志注日月五星謂之七曜北史劉焯博學治聞如九章筭術周髀七曜書莫不覈其本根窮其秘要手畫三軍勢洙曰馬援於帝前聚米爲山谷指畫形勢開示衆軍所從道徑往來曲折昭然可曉帝曰虜在吾目中矣定功曰前漢張安丗子千秋與霍光子禹俱度潦將軍范明友擊烏桓還詔大將軍光問千秋闘戰方略山川形勢千􅽠口對兵事畫地成圖无所忘失光復問禹禹不能記曰皆有文書光歎曰霍氏出衰張氏興矣師曰漢中係荆湖南路南伯言南方諸侯之長從事乃幕府属内官也南伯從事賢謂樊侍御之賢爲漢中判官謀事有成功只在立談之間可收其效七曜日月五星也昔馬援聚米爲山谷指畫形勢光武曰虜在吾目中矣生知七曜手畫三軍蓋知天文與地理也冰雪净聦明雷霆走精銳幕府輟諌官朝廷無此例至尊方旰食洙曰左傳曰伍奢曰楚君大夫其旰食乎旰晏仗爾布嘉惠𥙷闕暮徴入柱史晨征憇洙曰老聃爲柱下史正當艱難時洙曰天歩艱難蘇曰吴起正當艱難之際舉兵深入唯慮粮不継䧟彼逆計更冝度而行之實藉長乆洙曰一作大計回風吹獨樹趙曰周王褒送葬詩平原看獨樹臯亭望列亭又庾信詩冋風郎送師白日照執袂慟哭蒼煙根山門萬里閉居人莽牢落遊子方迢遰鄭曰音第徘徊悲生離洙曰九章悲莫悲兮生别離局促老一丗洙曰古詩蟋蟀相局促局促轅下駒夢符曰右前漢書灌夫傳上怒内史曰公平生數言魏其武安長短今日廷論局促効轅下駒陶唐歌遺民洙曰左傳吴季札聞唐之歌曰思深哉其有陶唐氏之遺民乎後漢更列洙曰一作別帝恨無匡復姿洙曰一作資聊欲從此逝洙曰吾亦從此逝矣師曰慟哭蒼煙恨山門萬里閉甫旣與樊生有萬里之别從此消息閉絶妻子間隔朋友别離是以慟哭于蒼煙之根居人甫自謂牢落辛苦之皃遊子指樊生迢逓言逺行也局促老一丗甫自痛拘迫當今之丗謂所至亂離竄匿林谷而不獲騁左傳云其有陶唐氏之遺民乎唐継堯之後德祚長逺未能遽絶故云有陶唐之遺民亦若孟子云其故家遺俗流風善政猶有存者漢承文景之餘澤遭王莽篡奪不失其天下光武因民謳吟思漢遂建中興之業肅宗亦然故云後漢更列帝甫自恨當艱難日無匡復之才以佐天子但從此長往山林因勉樊生當努力以賛中興云送從弟亞赴安西判官洙曰一云河西鮑曰亞字次公肅宗在靈武上書論當丗事擢校書郎杜鴻漸節度河西奏署幕故詩云令弟草中來蒼然請論事南風作秋聲蘇曰王澄曉來南風漸作秋聲故山𣏌菊苗吾當從事於斯矣師曰南風生養之風今作秋聲敷氣盛也時禄山反河北二十四郡皆䧟没于賊安得隂陽調和南風作秋聲盖有由也殺氣薄炎熾洙曰南風作秋聲言當生育而有肅殺聲盛夏鷹隼擊洙曰月令立秋之日鷹隼乃擊選常恐鷹隼擊時危異人至令弟草中來蒼然請論事詔書引上殿奮舌動天意洙曰動天意言君意爲之囬動也解嘲伸其舌而奮其筆蘇曰李斯奮三寸舌取冨貴兵法五十家爾腹爲篋笥洙曰兵法見前漢藝文志邊韶腹便便五經笥蘇曰張敞聽郝焜說書從容語左右曰萬卷書郝腹爲篋笥収貯乎應對如轉丸洙曰漢祖從諌若轉圜修可曰開元遺事張九齡每與賔客議論滔滔不竭如下坂走丸時人服其俊辯踈略通文字經綸洙曰易屯君子以經綸皆新語洙曰陸賈有新語足以正神器洙曰老子天下神器蘇曰李斯扶正神器四海歡心宗廟尚爲灰君臣俱洙曰一作皆下淚洙曰九廟爲賊所焚也崆峒地無軸清海天軒輊洙曰言天地未安也夢符曰按詩戎車旣安如輕如軒又後漢馬援夫居前不能令人䡖居後不能令人軒主軒輊輕車也鄭曰䡖乍利切車後頓曰軒前曰䡖西極最瘡痍趙曰前漢季布傳瘡痍未瘳連山暗熢燧彦輔曰害六典云唐鎮戍烽候所至大率相夫三十里其逼邊者築城以致之其放煙有一炬二炬三炬四炬者毎日初夜舉一炬謂之平安火餘則隨賊多少而爲差程曰漢光武紀修烽炬注云前書音義曰邊方備警急作土臺臺上作桔槹頭上有兠笭以薪草置其中常低之有㓂即然火㪯之以相告曰烽又多積薪㓂至即燔之望其煙曰燧書則燔燧夜則㪯烽俯曰廣雅言兠笭籠也竦曰相如諭蜀文曰㪯烽燧帝曰大布衣洙曰布衣韋帶之士魯曰左傳衛文公大布之衣大帛之冠藉卿佐元帥坐看清流沙洙曰書曰𬒳于流沙䟽流沙當境最逺者也而地理志流沙爲張掖居延澤是也計三危在居延之西大逺矣志言非也所以子奉使歸當再前席洙曰文帝前席賈生漸促近聽說適逺非歷試馬曰舜歷試諸難須存武威郡爲書長乆利孤峯石戴驛快馬金纒轡黃羊飫不羶蘆酒多還醉踴躍常人情慘澹苦士志安邊敵何有反正洙曰唐書天子反正計始遂吾聞駕鼔車洙曰漢文以千里馬駕鼔車修可曰後漢循吏傳曰建武十三年異囯有献名馬者日行千里又進寳劒價兼百金詔以馬駕鼔車劒賜騎士建武乃光武年號非孝文止郤千里馬无駕鼔車之說不合用騏驥龍吟廻其頭夾輔待所致洙曰左傳夾輔周室黄曰漢文帝以千里金馬駕鼔車騏驥非駕鼔之用大才不冝岀爲判洙曰一作氏羗陬害安郷郡河州理枹罕縣枹罕故羗侯邑枹音孚本枹鼓字也此邦承平日剽劫吏所羞洙曰前漢地理志推剽掘冢師古曰推殺人而剽切之剽匹妙切急也况乃胡未滅控帶莽悠悠府中韋使君道足示懷柔秦曰詩懷柔百神令姪才俊茂二美又何求受詞太白脚洙曰太白山在武功縣南去長安三百里十朋曰録異記金星之精墜於終南號爲太白其精化爲白石狀如美玉常有紫氣覆之玄宗立玄元廟取其石琢爲像焉㤗伯曰地圖記曰太白山甚髙上常積雪無草木半山有雲如瀑布則澍雨人常候驗如離畢焉故語曰南山瀑布不朝則暮走馬仇池頭洙曰成州上禄縣有仇池也晉永嘉末爲氐羗丈茂所據太白山名歐陽曰三秦記曰仇池山上廣百頃地平如砥其南北有山路東西懸絶百仞一夫守道萬夫莫向山勢自然有樓櫓却敵之狀上有崗阜泉源史記謂秦得百二之固也馬曰南史武興國本仇池楊難當自立爲秦王本朝同州河池乃故地俯曰太白事見喜逹行在所猶太白注仇池事見秦州雜詩萬古仇池穴讀記憶仇池注古色沙土裂洙曰色一作邑前書音義曰沙土曰漠即今磧也積隂霜雪稠洙曰一作積雪隂雲稠羗父豪猪靴羗兒青兕裘趙曰朱公招魂曰君王親發兮憚青兕大臨曰說文曰兕如野牛靑皮堅厚吹角向月窟洙曰顔延年歌月毳來賔毳窟也月窟西極長楊賦西壓月窟㤗伯曰樂録曰蚩尤率魑魅與黄帝戰于涿鹿帝乃命吹角爲龍鳴以禦之其後魏武北征烏丸越沙漠而軍士思歸於是減爲中鳴而声更悲矣胡角者本以應胡笳之声後漸用之蒼山旌斾愁鳥驚出死樹趙曰吴平爲句章州門前忽生一株青桐樹上有歌謡之声平惡而斫之平隨軍北虜首尾三年死樹歘自還立於故根上樹巓空中歌曰死樹今更青吴平尋當歸故公詩又曰君不見前者摧折桐百年死樹中琴瑟也龍怒拔老湫鄭曰湫七由切洙曰郊祀志湫澗祠朝郍湫音子由反湫水在涇州界興雲雨土俗亢旱毎於此求之相傳云龍之所居也天下山川隈曲有之古來無人境今代横戈矛修可曰孫興公遊天台山賦序云踐入无人之境蘇曰范蠡今日横戈簇矛相持之場皆古來无人之境傷哉文儒士憤激馳林丘中原正格闘洙曰相抱而殺之曰格蘇曰宋玉見襄王曰方今強秦恣横六邦鼎沸韓魏蜂起中原格闕不息願王駕御英雄練兵訓士待其不虞免其危削王善之趙曰格闘字祖出前漢而陳林飲馬長城窟行云男兒寧當格闘死何能拂欝長城道後會何縁由百年賦命定定功曰古詩人生不滿百豈料沉與浮且復戀良友握手歩道周洙曰謝玄暉桑榆隂道周魯曰詩有枤之杜生于道周釋文周曲也韓詩右也師曰道周即道邊也論兵逺壑浄亦可縱冥搜洙曰天台賦序師曰㝠搜即搜吟也題詩得秀句蘇曰陸士龍題詩對南山日晚得秀句扎翰時相投送髙司直尋封閬州丹雀銜書來洙曰文王之時赤雀銜書集于周社也暮棲何郷樹驊騮事天子辛苦在道路洙曰丹雀異也驊騮駿也言駿異処非其位趙曰尚書中候曰赤雀丹書入豊止于昌前昌拜稽首受之舊注模稜所引非是驊騮事列子周穆王駕八駿之乗有曰右服驊騮此言髙司直通籍事主故以丹雀之於文王驊騮之於穆王比之司直非冗官荒山甚無趣洙曰司直華選也而在荒山此所以无趣借問泛舟人胡爲入雲霧與子姻婭間旣親亦有故洙曰姻婭猶言姻聮也詩瑣瑣姻婭非特親也又有故舊萬里長江邊邂逅一相遇洙曰邂逅言不期而遇也長卿消渇再公幹沉綿屢洙曰長卿相如也病渇劉公幹詩余嬰沉痼疾竄身清瘴濵趙曰公自言其病與相如公幹同清談慰老夫開卷得佳句時見文章士蘇曰枚叔見司馬犬子逺寄詩喜而謂室家曰示意開卷得此佳句瓊瑰南金不足貴也欣然淡情素伏枕聞别離疇能忍漂寓良會苦短促溪行水奔注熊羆咆空林蘇曰古詩熊羆呼林寒言小人得志自肆之意也游子愼馳騖鄭曰亡遇切西謁巴中侯洙曰閬爲巴中趙曰巴中侯則封閬州也官難險則髙君之不憚逺如此艱險如跬歩主人不丗才先帝常特顧洙曰主人巴中侯也拔爲天軍佐洙曰天軍禁軍也趙曰必甞佐禁旅之任崇大王法度淮海生清風南翁尚思慕趙曰言淮海則必爲楊州等處官南公者南方之老人也公宮造廣厦木石乃無數洙曰言幕府方須才也趙曰建廣厦於官府者也凡官府貴處謂之公宫左傳構其公宫舊注謂幕府乃湏才不知此乃述封閬州事非指髙使者也初聞伐松栢猶卧天一柱趙曰此言廊廟之具矣非封閬州不足以當之神異經云崑崙有銅柱焉其髙入天所謂天柱也我瘦洙曰一作病書不成蘇曰郭贄乆疾書不成欹傾倒側今月自讀亦不能識何况兒童搭耶成字讀亦誤爲我問故人勞心練征戍洙曰此詩觀末章則閬州是房琯也趙曰故人指封閬州也師曰文王時丹雀來歧岳驊騮穆王之駿二物皆王者瑞喻司直冝瑞聖丗不冝在荒山也今入雲霧尋封閬州故云甚無趣姻婭連襟也非惟親戚亦與甫有故甫病肺乆卧故比之長卿公幹熊羆喻盗賊巴中侯即閬州半歩曰跬巴蜀路險難行故云如跬歩主人指巴中侯玄宗常擢之爲禁軍副將持軍整肅故云崇大王法度南翁甫自稱以流滯於南州也公宫造廣厦言天子正再造王室人材雖多一柱尚未用盖言房琯見貶閬州訓練征戍之兵故甫託司直以勞問之奉送魏六丈佑少府之交廣鄭曰海南郡賢豪賛經綸功成空名垂子孫不振耀洙曰一云子孫没不振歷代皆有之鄭公四葉孫洙曰鄭公鄭公徴也長大常苦飢蘇曰安諒長大常苦飢寒負薪拾黍未甞不帶書暇即誦習後以三傳馳名衆中見毛骨猶是麒麟兒洙曰見徐卿二子歌注趙曰嵆紹謂其友曰琅邪王毛骨非常殆非人臣之相寳誌見徐陵謂曰此兒天上石麒麟也磊落正觀事致君樸直詞洙曰鄭公在正觀時多所獻替新史言犯顔正諌議者謂雖賁育不能過家聲蓋六合行色何其微洙曰謂佑行色不稱家聲也之子孔子說盗跖歸遇柳下季曰今者車馬有行色遇我蒼梧隂鄭曰舜葬處忽驚㑹面稀議論有餘地公侯來未遲洙曰左傳公疾必復其始趙曰蒼梧桂州之地古詩主稱㑹靣難莊子曰刃有餘地虚思黃金貴洙曰一作遺自笑青雲期趙曰貴當作遺方在貧困之中故思以黄金饋之青雲期言貴逹如在青雲之上自笑其期之逺也長卿乆病渇武帝元同時洙曰蜀人楊得意爲狗監侍上上讀子虚賦而善之曰朕獨不得與此人同時哉得意曰臣邑人司馬相如自言爲此賦上驚乃召問相如趙曰此魏侑病而能文不如相如之遇也季子黒貂弊得無妻嫂欺洙曰蘇季子未用黒貂裘弊又出遊數歳大困而歸兄弟嫂姝妻妾皆竊笑之趙曰季子蘇秦也借以比魏佑之有才而困厄也尚爲諸侯客獨屈州縣卑南遊炎海甸趙曰言其爲少府也浩蕩從此辭洙曰之交廣也窮途仗神道洙曰正也丗亂輕土冝洙曰不可安於上也解㠶歲云暮可與春風歸出入朱門家華屋刻蛟螭玉食亞王者洙曰供範惟辟玉食樂張游子悲趙曰以其爲客也侍婢豔傾城綃綺輕洙曰一作煙霧霏掌中琥珀鍾行酒雙逶迤新歡繼明燭梁棟星辰飛兩情顧眄合珠碧贈於斯洙曰言交廣繁冨如斯也夢符曰右按愽雅碧瓐玉也司馬相如子虚賦曰錫碧金銀趙曰言珠碧則交廣之所有上貴見肝膽下貴不相洙曰一作見疑心事披冩間氣酣逹洙曰所爲錯揮鐡如意莫避珊瑚枝洙曰石崇傳崇與王愷爭豪武帝每助愷甞以珊瑚樹賜之髙二尺許枝柯扶踈丗所罕比愷亦示崇崇便以鐵如意擊之應手而碎愷旣惋惜崇曰不足恨乃命左右悉取珊瑚樹髙三四尺者六七株始兼洙曰一作無逸邁興終愼賔主儀趙曰雖氣之豪邁而賔主之儀不可不愼也戎馬闇天宇嗚呼生别離師曰自古賢者之後多不振魏徴封鄭公而魏乃徴四葉孫困於飢寒昔徐陵見宝誌上人上人曰天上石麒麟六合天地四方也佑以少府之交廣故云行色何其㣲蒼梧乃梧州㑹面稀言少相見也公侯來未遟言爲卿相未晚也虚思黄金貴言黄金不足羡也自笑青雲期以卑宦爲可哂也甫有渇疾故自比相如相如雖遇武帝官亦不甚顯甫詩云甫也諸侯老賔客炎海即南海甸謂郊甸浩蕩逺貌輕土冝言避乱而輕去郷土也王者屑玉而食然侯門奢侈亞於王者足見綱紀乱矣逶迤匝貌交廣多珠翠儻與侯門投合必蒙珠翠之惠然人相知貴相知心是以所爲無疑忌也雖珊瑚宝擊碎不吝况其它乎雖然負此逸興要在慎賔主之儀斯能全其交如甫之於嚴武不慎其儀幾爲武所殺故甫以是戒之别張十三封建甞讀唐實録國家草昧初洙曰未治之𥘉也劉裴建首義龍見尚躊躇洙曰劉丈静裴寂文静大業爲晉陽令寂爲晉陽宫監時唐祖鎮太原二人察上有大志又見太宗器度非常乃與决大計將發髙祖不從丈静因裴寂開說又介寂交於太宗遂得進議也秦王撥亂姿一劒揔兵符洙曰撥乱謂撥開其乱也漢書撥乱反正漢髙祖曰提三尺劒取天下者朕也汾晉爲豐沛洙曰汾晉唐公故郷喻若漢祖之豐沛也暴隋竟滌除宗臣則廟食洙曰傼以蕭曹爲宗臣子羙以裴劉比蕭曹故曰宗臣廟食配享於廟也後祀何踈蕪趙曰以子孫之不顯逹也彭城英雄種冝膺將相圖爾惟外曾孫倜儻汗血駒洙曰建封劉文静外孫也汗血駒天馬種倜儻言其不覊之才眼中萬少年用意盡﨑嶇洙曰少年雖衆用意無若建封者相逢長沙亭洙曰長沙潭州乍問緒業餘洙曰緒業丗緒所業也乃吾故人子童丱聮居諸趙曰詩日居月諸揮手灑衰淚仰看八尺軀内外名家流風神蕩江湖范雲堪結交洙曰梁書范雲𥘉與髙祖遇於齊境陵王子良邸又甞接里閈髙祖受禪雲甞侍讌髙祖謂臨川王宏等曰我與范尚書少親善申四海之敬今爲天下主此禮旣革汝冝代我呼范爲兄二王下席拜與雲同車還尚書省時人榮之雲好節尚竒專趣人之急少時與領軍長史王駭善駭亡於官舎貧無宅居雲乃迎䘮還家躬營唅歛嵆紹自不孤洙曰嵇康與山儔結神交康臨誅謂其子紹曰山公在汝不孤矣趙曰必如山濤而後孤爲可託擇材征南幕洙曰杜預爲征南將軍湖落回乎以封建爲羽人其所望之深矣師曰實録國史也𥘉髙祖鎮太原劉文静裴寂首建議勸帝舉大事帝猶未允頼秦王賛之遂起兵故曰龍見尚躊躇昔漢髙起於豐沛今髙祖興于汾晉是以汾晉爲豐沛宗尊也漢以蕭何曹叅爲宗臣今子美以劉裴比之廟食謂配饗于廟後祀何踈蕪言子孫衰寂也彭城指劉文静建封乃文静之外孫爲人倜儻如汗血駒有千里之才八尺軀指建封堂堂一人也時甫老大建封年少故云堪晚交甫得建封可以囑託其子故曰嵇紹自不孤然公冝大用今備幕府之佐如鯨魚淹回於湖落也賈生慟言時危也樂毅書言帝猜疑諸將不能推誠任下也師老荒京師言兵乆無功也舊兵復稅駕言建封罷權還故里也管葛以比張惜乎時不見用譬之栝栢不以歲寒而變易也十洲記蓬萊山在碧海中當此時賢臣欲建功業如羽人之掃碧海其事茫昧而難爲功耳别唐十五誡因寄禮部侍郎賈鮑曰賈至本傳寳應𥘉轉禮部侍郎九載一相逢百年能幾何洙曰古詩百年能幾何㑹少别還多蘇曰隂騭百年相逢花朝月夕髙歌酣飲流宦南北能得幾何復爲萬里别送子山之阿白鶴乆同林潜魚本同河未知棲集期蒼舒曰右按文選謝靈運擬鄴中詩末塗幸休明棲集建薄質蘇曰劉據送蕭𣢾曰與君衰老又作別未知後㑹棲集何地衰老強髙歌歌罷兩悽惻洙曰燕丹送荆軻入秦别於易水之上髙漸離擊缶軻歌髮上衝冠士皆淚垂六龍忽蹉跎洙曰羲和以六龍御日蹉跎言遲暮也師曰謂衰老也相視髮皓白况難駐羲和師曰謂日月逝矣歲不我與胡星墜燕地鄭曰燕烏前切師曰旄頭星主胡云云謂禄山亂漢將仍横戈師曰漢將即唐將唐承漢因謂之漢猶今承唐亦謂之唐朝蕭條四海内人少豺虎多趙曰胡星墜言今歲上元元年史朝義弑其父思明也仍横戈言史朝義襲僞位復爲亂戦國策衛行人燭過免胄横戈而進少人愼莫投多虎信所過饑有易子食洙曰宋子罕夜登子反床而告病曰易子而食析骸而爨獸猶畏虞羅洙曰虞羅可避之物而獸猶畏之至於父子之親而不能相保則時可知矣余曰古今詩話云梅聖俞愛杜詩蕭條九州内人少虎狼多少人愼莫投多虎信所過飢有易食子獸猶畏虞羅如此等句含蓄深矣殆不可模倣子負經濟才蘇曰戴逵送王卞曰子負經濟之才幸遇明時胡爲把犂鉏老於嵓谷乎天門鬱嵯峩趙曰晉石苞傳天門㤗山之稱記云㤗山盤道屈曲而上凡五十餘盤經小天門大天門又漢官儀曰㤗山東上七十里至天門所以稱嵯峩也飄颻適東周洙曰周平王東遷于洛故謂之東周來往若崩波南宮吾故人洙曰南宫禮部也定功曰按天官書南宫朱鳥權衡太微三光之庭藩臣將相執法郎位衆星咸在漢建尚書百官府名曰南宫蓋取象也蓋南宫猶南省非止稱禮部而巳趙曰南宫蓋指言賈侍郎也故此篇末云云舊注以南宫爲禮部非也白馬金盤陀雄筆映千古蘇曰羲獻筆畫雄勁映絶千古非羊欣軰比也師曰謂賈公大手筆也見賢心靡他洙曰詩之子矢靡他言見賢之心出於誠一也念子善師事歲寒守舊柯洙曰歲寒然後知松栢之後凋以其不易柯葉也蘇曰班及歳寒雪苦松栢不易舊柯雖艱險萬端君子不易節行矣師曰欲唐生無變節於賈公爲吾謝賈公病肺卧江沲鄭曰徒河切師曰甫有脾疾不及與賈公㑹集徒𬗟想而巳託唐生以謝罪送韋諷上閬州録事叅軍國歩猶艱難洙曰詩天歩難難趙曰此篇憂國愛民之意切矣兵革未衰息萬方哀嗷嗷洙曰民困于役而無許故哀嗷嗷修可曰鴻鴈詩哀鳴嗷嗷十載供軍食饒曰自天寳十四年至寳應間凡十年庶官務割剥不暇憂反側誅求何多門晁曰謂歛取非一端也賢者貴爲德洙曰哀一作尚載一作年一云賢俊愧爲力韋生富春秋洙曰髙五王傳皇帝春秋冨師古曰言年㓜也比之於財方未匱竭故謂之冨洞徹有清識操持紀綱地喜見朱絲直洙曰鮑昭白頭吟直如朱絲繩當令豪奪吏洙曰大吏豪奪趙曰管子曰凡輕重散歛以時平凖故大賈冨家不得豪奪吾人也自此無顔色必若救瘡痍何曰喻民困傷也先應去蝥賊鄭曰蟊莫交切洙曰詩去其螟􅭈及其蝥賊蘇曰吴起善治田者先去蟊賊然後獲實善治國者先屏姦佞然後進賢覺範曰爾雅釋虫食心曰蝥何曰喻害民之吏揮淚臨大江髙天意悽惻行行樹佳政馬曰樹立也慰我深相憶洙曰此詩欲韋抑暴斂也送率府程録事還郷鄙夫行衰謝洙曰鄙賤也自稱故曰鄙夫抱病昏妄集常時往還人記一不識十程侯晚相遇與語才傑立洙曰徐稺角立傑出薫然耳目開頗覺聦明入千載得鮑叔末契有所及洙曰管仲與鮑叔爲友意鍾鄭曰一作中老栢青義動脩虵蟄洙曰易龍蛇之蟄師曰言陳公辭官歸郷如龍虵之蟄以藏身故其髙義可以聳動於吾若人可數見洙曰謝靈運平生疑若人通蔽互相妨潘安仁詩若人饒曰語君子哉若人尚德哉若人慰我垂白泣洙曰謝靈運戚戚感物態星星白髮垂趙曰杜欽傳紀陽侯與欽子業書曰誠哀老姊垂白師古曰垂白者言白髮下垂也告别無淹晷百憂復相襲見登髙翻百憂注内愧突不黔洙曰文子曰墨子無黔突孔子無煖席揚雄曰孔席不煖墨突不黔巨炎反庶羞洙曰一云明似以賙給素絲挈長魚碧酒隨玉粒蒼舒曰右按歷城北有使君林魏正始中鄭公慤三伏之際率賔僚避暑于此取大蓮葉盛酒以簮刺葉令與大柄通屈莖輪囷如象鼻傳噏之名碧筒酒又戦國䇿粒米如玉修可曰碧筒酒以蓮莖得名此言碧酒乃酒之色非碧筒也酒譜曰安期先生與神女會於圜丘酣玄碧之酒途窮見交態洙曰阮籍詩途窮能無慟鄭當時一貧一富迺見交態蘇曰潘遜至漢中見姪英曰今日窮途失適舉目添愁其丗態交情可見楊朱之悲使然也丗梗悲路澁洙曰潘正叔詩丗故尚未夷崤丞方險澁東風吹春冰泱莽后土濕洙曰謝玄暉晨光復泱漭月今東風解凍魚上冰宋玉九辨皇天淫溢而秋霖后土何時兮得乾泱漭澹泞也師曰禄山反范陽在東故云東風吹春冰冰有兵革之象泱漭后土濕言率土之民皆䧟於塗泥也念君惜羽翮旣飽更思戢莫作翻雲鶻聞呼向禽急送孔巢父謝病歸遊江東兼呈李白洙曰按唐書孔巢父冀州人字弱翁早勤文史少與韓凖李白張叔明陶沔隱於徂萊山時號竹溪六逸永王璘赴江淮聞其賢以從事辟之巢父察其必敗側身潜遁由是知名後爲潭州刺史湖南觀察使未行曽德宗幸奉天遷給事中御史大夫興元元年使李懷光於河中巢父遇害巢父掉頭不肯住東將入海隨煙霧洙曰不肯住謂謝病歸江東也莊子在宥篇鴻蒙拊髀爵躍掉頭曰吾弗知也趙曰掉頭者於事不可之狀莊子鴻濛掉頭曰吾不知也東將入海則如擊磬襄入于海之海入耳舊注引此東入于海却是水也詩卷長留天地間蘇曰吴璿投劉楨詩楨曰斈海深淵非璿敢量將此卷長留天地間後知音者賞之釣竿欲拂珊瑚樹洙曰一云三株樹西都雜記積草也中有珊瑚樹髙一丈二尺一本三柯上有四百六十二條是南越王趙他所献號爲烽火樹至夜光景常欲然丗說王愷常以一珊瑚髙二尺許枝柯扶踈以示石崇崇以鐡如意擊碎乃令取珊瑚樹髙三尺條幹絶丗者六七示愷南州志曰珊瑚出大秦國海中生海底石上趙曰珊瑚樹生海底石上見晉書大秦國事以其在海底故以拂言之也言巢父歸江東之後遂可入海有此興也深山大澤龍虵逺洙曰㐮二十年傳叔向之母妬叔虎之母美而不使有子謂其子曰深山大澤實生龍蛇彼美吾懼其生龍虵以禍女注龍虵喻竒怪言非常之地多生非常之物春寒野隂風景暮洙曰一云花繁草青春日暮趙曰顔延年贈王太常詩庭昏見野隂蓬萊織女囬雲車洙曰陸士衡牽牛西北四織女東南顧彦輔曰蓬萊三山名小雅跂彼織女終日七㐮陶隱居真誥朱関内真以雲車虚轅相適沈約遊仙詩雲車委輕霰指點虚無引歸路定功曰曹子建虚無求列仙余曰按原叔彦輔師等本並云虚無是征路彦輔曰相如大人賦乗虚無而上假自是君身有仙骨蘇曰栖嵓老人見孫登曰君非丗俗人身有伸仙玉骨趙曰以巢父常隱於徂徠則仙風道骨矣神仙傳有神謂黒翟曰子有仙骨也彦輔曰神仙傳嚴青居貧忽有人以一卷素書與青曰汝有仙骨應得長生丗人那得知其故惜君只欲苦死留富貴何如草頭露洙曰一云我欲苦留君冨貴何如草頭易晞露古詩薤上朝露何易晞詩湛湛露斯在彼豐草趙曰巢父旣謝病而歸則爲輕冨貴矣孰能留之惜之者雖苦死相留豈知冨貴如草露之易滅哉彦輔曰李嶠詩曰冨貴榮華能幾時陸機歎逝賦曰草無朝而遺露李善曰露之在草無一朝而有餘喻人之居丗無一時而能故蘇武傳曰人生如朝露師曰巢父與李白友善李白時在江東巢父欲尋之問斈神仙之術遂以病辭朝廷游江東故云掉頭不肯住東將入海隨煙霧珊瑚似琉璃有五色青者可入藥爲上生海底漁人常以網掛得之巢父亦善屬文吟詩有文集行丗號徂徠集今游江東以魚釣爲樂故釣竿欲拂珊瑚樹惟餘詩集留人間與天地相爲長乆而已昔叔向之母曰深山大澤實生龍虵彼叔虎之母美恐生龍虵以禍其族巢父棄絶房色頥養精氣故云深山大澤龍虵逺風景暮謂晚春時此叙執别之時虚無謂神仙之境樓臺殿閣皆変化而成巢父此行蓬萊仙人与織女各回轉雲車以迎之必將指點於神仙之境盖以素有仙骨何患功不成乎征路即所往之路也草頭露言不乆日出即乾人生冨貴不能長享譬如草頭之露朝廷重惜巢父名節諸公欲乆留之柰巢父輕視冨貴如草頭露是以謝病告歸也蔡侯静者意有餘清夜置酒臨前除洙曰陸士衡擬古詩閑夜命􅌚友置酒迎風館江丈通詩置酒坐飛閣逍遥臨華池曹子建詩清夜遊西園除階除也彦輔曰魏文詩清夜延賔客漢書云置酒髙㑹又江淹詩曰置酒坐飛閣罷琴惆悵月照席幾歲寄我空中書彦輔曰空書中未詳或曰蓋鴈書耳應瑒詩云鴈鳴雲中王褒亦曰豈若雲中鴈秋時塞外歸梁簡文鴈詩相思不得反且寄別書歸虞丗南詩爲有傳書意聮翩入上林則杜意殆謂是欤南尋禹穴見李白洙曰一云若逢李白騎鯨魚太史公自序司馬迁年二十南遊江淮上㑹稽探禹穴張宴曰禹廵狩至㑹稽而崩因葬焉上有孔穴或云禹入此穴江淹詩幸遊建德郷觀竒經禹穴修可曰御覧載括略曰會稽山有一石委曲黄帝所藏書於此禹得之又吴越春秋禹藏之所謂之禹穴也趙曰禹穴在㑹稽山上史記曰太史公登㑹稽探禹穴白時在㑹稽矣乃巢父欲入海之路也又注云若逢李白騎鯨魚蓋賀知章以白爲謫仙人其與巢父皆有斈仙之質則可以騎鯨矣揚雄羽獵賦乗鉅鱗騎鯨魚注鯨大魚也彦輔曰時白遊㑹稽故其詩㑹稽無賀老却掉酒船回道甫問信今何如洙曰一云深山大澤龍虵逺華繁草青風景暮仙人玉女囬雲車指點虚無引歸路若逢李白騎鯨魚道甫問信今何如揚雄羽獵賦乗鉅鱗騎鯨魚一本作云巢父掉頭不肯住東將入海隨煙霧書卷長携天地間釣竿欲拂珊瑚樹我擬把𬒮苦留君冨貴何如草頭露深山大澤龍虵逺花繁草青風景暮仙人玉女回雲車指點虚無引歸路若逢李白騎鯨魚道甫問信今何如師曰静乃蔡侯名意有餘謂懃意有餘也除庭除也空中書謂鴈傳書琴中有別鶴操蔡侯罷琴惆悵盖惜别也因謂巢父此别幾年得有書相逹禹葬于會稽上有孔穴因名禹穴今巢父遊江東尋見李白煩道甫問其安否此致意之辭禹治水至此㑹計其人功多寡之数因號其山曰㑹稽或云穴即壙穴禹所葬之墓穴在此山故云禹穴說者謂上有孔穴禹入此穴而化其說謬矣贈李十五丈别峽人鳥獸居其室附層巔洙曰魏都賦嵓崗淵潭帳蠻隔夷瓊危之覈也蠻陬夷落度導而通者鳥獸之氓也下臨不測江中有萬里船多病紛倚薄趙曰謝霊運拙疾相倚薄少留改歲年絶域誰慰懷開顔喜名賢孤陋忝末親等級敢比肩人生意頗洙曰一作氣合相與襟袂連一日兩遣僕三日一共筵揚論展寸心壯筆過飛泉修可曰曹子建作王仲宣詩曰發言可詠下筆成篇文若春華思若湧泉又李廣利拔刃刺山飛泉湧出壯筆過飛泉言其快利也玄成美價存洙曰韋賢四子少子玄成復以明經歷位至丞相故鄒魯諺曰遺子黄金滿籝不如教子一經子山舊業傳洙曰東信字子山父肩吾爲梁太子中庶子掌書記徐陵及信並爲抄撰斈士信父子在東宫岀入禁闥文並綺麗丗號徐庾躰不聞八尺軀常受衆目憐且爲苦辛行蓋被生事牽北廻白帝棹南入黔陽天鄭曰黔陽屬武陽郡今辰州三亭縣而黔陽故城即漢故事縣汧公制方隅鄭曰汧輕煙切洙曰汧李之所封定功曰汧公李勉也按舊史上元𥘉爲梁之刺史山南道防禦使李十五丈在峽中往謁之故公作詩以别之以李之所封也逈出諸侯先封内如太古時危獨蕭然淸髙金莖露洙曰一作金掌露正直朱絲絃洙曰西都賦抗仙掌以承露擢雙立之金莖軼埃􅮣之混濁鮮顥氣之清英鮑明逺詩清如玉壷冰直如朱絲䋲黨錮傳直如絃死道邊昔在堯四岳今之黄頴川洙曰四岳分掌四岳之諸侯黃霸爲頴川太守有治狀此皆美李汧公也于邁恨不同所思無由宣洙曰所行不同故所思難宣也山深水増波解榻秋露懸客遊雖云乆亦思月再圎師曰李丈待甫正當秋月甫以客遊旣乆爲辝主人更要月再圓言挽留之誠意也晨集風渚亭師白謂李丈餞别也醉操雲嶠篇鄭曰操七到反蘇曰徐陵醉中作白雲出渚嶠篇明日酒醒讀之自驚以爲神助陳統見而心降師曰此句謂送之以詩也丈夫貴知已趙曰史記士伸於知己而屈於不知歡罷念歸旋師曰謂酒罷將歸念念不忘盖惜別之意也贈别賀蘭銛鄭曰思廉切黃雀飽野粟羣飛動荆榛趙曰此比時人之蹇淺也今吾抱何恨寂寞向時人趙曰此傷賀蘭而問之老驥倦驤首洙曰騏驥逢伯樂之知􅋮首長鳴趙曰暗使戰囯䇿汗明見春申君曰夫驥之齒至矣服塩車而上太行漉汗灑地白汗交流而不能上伯樂遭之下車攀而哭之解紵衣以幕之驥於是俛而噴仰而鳴聲造於天仰見伯樂之知己也今云倦則以無伯樂而倦也蒼鷹愁易馴趙曰權翼慕容垂由鷹飢則附人飽則髙飛今云愁則以苟於食養而愁髙賢丗未識固合嬰飢貧國歩𥘉返正洙曰時𥘉復京師乾坤尚風塵洙曰史思明猶鴟張河朔悲歌鬢髮白逺赴湘吴春我戀岷下芋君思千里蓴生離與死别自古鼻酸辛洙曰岷山之下沃懋下有踆鴟至死不飢師古曰踆鴟羊也千里蓴羹未下塩䜴楚詞悲於生别離髙唐賦孤子寡婦寒心酸鼻師曰黃雀物之微者一饱之外則無所求蒼鷹飢則隨人飽則揚去馴狎也甫自喻如老驥倦舉首以求人知賀蘭如飢鷹側翅隨人故云易馴自古賢士君不見知未免嬰累乎飢貧何獨賀蘭乎國歩𥘉反正謂肅宗收復京師乾坤尚風塵謂史思明尚吞噬相衛悲歌鬢髮白爲國家憂也逺赴湘吴春謂甫移居䕫州旣而下峽適荆吴岷山蜀中之山地産芋魁可以充糧凶年不能飢甫旣去蜀故戀岷山之芋吴地出蓴菜鱸魚昔張翰吴人也在洛守官忽思蓴菜遂去官而歸賀蘭在蜀故思吴中之蓴舉其物則思其人相思故也别董頲鄭曰他預切窮冬急風水逆浪開㠶難士子甘㫖闕不知道里寒洙曰急於養父母故不知道里寒有求彼樂土洙曰詩適彼樂土南適小長安趙曰光武紀注曰小長安故城在今鄧州公今詩言逆浪開㠶若在潭州言之逆浪則往衡州而南矣别我舟檝去覺君衣裳單素聞趙公節兼盡賔主歡已結門廬望無令霜雪殘趙曰趙公必知鄧州也董以甘旨之闕離母而往鄧故用母主事齊王孫賈之母謂賈曰汝朝出而晚來則吾倚門而望無令霜雪殘則囑其早歸也老夫䌫亦解鄭曰䌫盧瞰切蘇曰山濤帖曰子幾日掛席東下老夫得風亦解䌫矣乍别冝㥀重脫粟朝未餐洙曰脫粟言脫其榖而已未至於精細也夢符曰右按前漢公孫洪傳洪食一肉脫粟飯顔師古曰才脫粟而已不精鑿也飄蕩兵甲際幾時懷抱寛蘇曰王逸少曰懷祖不來寒食俯至天氣晴明不見容貌使吾幾時寛此懷抱蘇曰閤下有此帖漢陽頗寧静洙曰漢陽軍也在岳陽鄭曰漢水之陽也峴首試考槃鄭曰峴胡典切山名在㐮陽縣東十里洙曰詩考槃在澗峴首山也趙曰峴首在㐮州與鄧州相近公因董君之往鄧故語及之當念著白帽采薇青雲端洙曰管寧不應州郡之辟常着白帽趙曰公甞使云白㡌應須似管寧考之本傳云常着皂帽而杜佑通典作白帽豈今國志誤耶采薇則四皓之事也師曰孝子薦其甘㫖董以甘㫖有闕急於奉親故不知道里之寒小長安乃成都也明皇幸蜀後改爲西京故云小長安或曰胤陽縣有小長安故城在今鄧州南陽郡西趙公守此故董適此以謁之巳結門廬望言親老倚門望之也漢陽軍在岳陽甫以此地寕静欲寄居之故云試考槃考槃成其樂也峴首山名昔管寕不應辟命甞著白帽甫欲効之分門集註杜工部詩卷第二十, WYG: ''}
