  - {type: variant, offset: 8, length: 17566, content: 卷第二四時古詩一首律詩四十首春日戲題惱郝使君兄使君意氣凌靑霄趙次公曰北山移文公干青霄而直上憶昨歡娱常見招細馬時鳴金騕褭鄭卬曰騕於皎褭於了切杜修可曰盧照隣詩漢家金騕褭佳人屢岀董嬌饒王洙曰嬌饒名姬也朱子侯有董嬌饒詩汪革曰董妖饒妓名也東流江水西飛鷰可惜春光不相見趙次公曰此句以興見招之後不復見其姬也故下句有願携之請焉句法則古東飛伯勞等歌曰東飛伯勞西飛鷰黄姑織女時相見願携王趙兩紅顔汪端夲曰王趙亦通泉有色之妓再騁肌膚如素練通泉百里近梓州請公一來開我愁蘇軾曰王戎與公破悶開愁舞處重看花滿面樽前還有錦纏頭王洙曰唐王元寳冨而無學識甞㑹賔客明日親友謂之曰昨日必多佳論元寳曰但費錦纏頭爾杜田曰唐明宴于清元小殿自打羯鼔曲終戯謂八姨曰樂籍今日有幸約供養夫人請一纏頭八姨曰豈有大唐天子阿姨無錢用耶出三百萬爲一局爾師古曰前軰詩云不能文字飲惟解醉紅裙甫之戯惱郝使君盖一弛一張君子之道此亦君戯謔者矣正月三日歸溪上有作簡院内諸公野外堂依竹籬邊水向城蟻浮仍臘味王洙曰酒也周庾信謝賜酒詩曰浮獵對春開鷗泛巳春聲王洙曰南越志鷗水鳥也在漲海中隨朝上下三月風至乃去蘇軾曰耿异曰門前池水巳有春色客曰如何异曰今日鷺浴鷗泛漣漪灔灔藥許鄰人斸趙次公曰公之不吝如此師古曰子美詩有天寒斸茯苓之句言以鐵椎斸地而得之也書從雉子擎趙次公曰言文書多任稚子也白頭趨幕府深覺負平生趙次公曰公嘆老而猶仕耳公與嚴故人故顯言之别无指旨舊注非奉酬李都督表文早春作力疾坐清曉趙次公曰晉載記姚弋侍求見石虎虎力疾見之師古曰力疾言雖病猶力起坐也来詩悲早春轉添愁伴客蘇軾曰王當避地江表徒歩唯有愁恨仲遂無情悰作文字後醉作放歩行更覺老隨人紅入桃花嫰靑歸柳葉新望郷應未巳四海尚風塵春歸趙次公曰此言歸當春時非謂春色之歸也苔逕臨江竹茅簷覆地花趙次公曰言花倚簷而覆地也古燕歌行桃柚覆地春花舒舊注謂花落在地非也别來頻甲子王洙曰見甲子混泥塗注歸到忽春華王洙曰忽輕忽也師古曰甫避崔旰乱適東川後復以春時歸草堂見江竹無恙唯落花覆地故下文云别來頻甲子甲子記時莭也如甲子混泥塗皆言歷時之乆及歸到草堂倐忽又春華也内翰不明春歸草堂謂春色歸去遂以忽爲輕忽悮矣倚杖看孤石蘇軾曰謝安所居有石一株安常倚杖相對吟嘯終日忘歸北齊謝洙名之爲玉笋峯唐柳公權榜其亭曰獨秀峯傾壶就淺沙逺鷗浮水静輕鷰受風斜余葵曰詩眼云工部有所喜用字如脩竹不受暑吹面受和風野航恰受兩三人輕鷰受風斜受字皆入妙老坡尤爱輕鷰受風斜以謂燕迎風低飛乍前乍却非受字不能形容也至於能事不受相促迫莫受二毛侵雖不及前句警策要自穩愜尔丗路雖多梗吾生亦有涯王洙曰莊子曰吾生也有涯此身王洙曰一作且應醒復醉乗興即歸家暮寒霧隱平郊樹王洙曰鮑明逺詩風断隂山樹霧失交河城江淹詩千里何蕭條白石隱寒樹趙次公曰言霧遮掩其樹風含廣岸波沉沉春色静慘慘暮寒多戍鼔猶長擊趙次公曰吐蕃之乱至今春尚防戍也林鸎遂不歌忽思髙宴會朱䄂拂雲和王洙曰古詩今日良宴㑹周礼春官大司樂雲和之琴瑟注雲和地名也玄謂雲和空桑龍門皆山名東京賦孤竹之管雲和之瑟鮑明逺五侯相餞送髙㑹集新豊趙次公曰漢祖置官髙㑹周礼大司樂雲和之琴瑟注地名也以其産良材而中爲琴瑟故後人承用直以雲和便當琴瑟名朱䄂紅䄂也用字新竒矣春水生二絶二月六夜春水生王洙曰孫權傳春水方生門前小灘王洙曰一作籬渾欲平鸕鷀鸂䳵莫漫喜吾與汝曹俱眼明趙次公曰二禽見水生而喜公語之以与汝曹俱眼明則公可謂與物委蛇而同其波矣一夜水髙二尺強數日不可更禁當趙次公曰禁當蜀中俗語南市津頭有舡賣無錢即買繫籬傍漫成二首野日荒荒白王洙曰日一作月荒荒一云茫茫趙次公曰王褒送葬詩塵昏野曰黄春流泯泯清師古曰泯絶也言其絶清渚蒲随地有趙次公曰梁簡文帝晚春詩渚蒲変新莭村逕逐門成只作披衣慣師古曰披衣以示踈嬾也常從漉酒生王洙曰陶潜以葛巾漉酒眼邊無俗物多病也身輕蘇軾曰全紹獨居一小室前後種松竹䆫下列圖史燒香默坐語曰眼前無俗物撓雖病身亦安穏杜田曰丗說嵆阮在竹林酣飲王戎後往阮歩兵曰俗物亦復來敗人意則知子美無俗物冝其雖病而輕身也江臯巳仲春王洙曰謝靈運歌白日麗江臯又詩仲春喜游遨楚詞朝馳予馬兮江臯師古曰臯緩也江岸其土性緩故云江臯花下復清晨仰面貪看鳥回頭錯應人余葵曰上蔡謝氏語解或問言動非礼則可以止視聽如何得合礼曰四者皆不可易易則多非禮故仁者先難而後獲所謂難者以我視以我聽以我言以我動也仰面貪看鳥回頭錯應人視聽不以我也胥失之矣讀書難字過師古曰言老年讀書但識大義不能逐字經意也對酒滿壼頻近識峨嵋老石敏若曰峨嵋山在蜀知余懶是真王洙曰東山隐者春逺肅肅花絮晚菲菲紅素輕趙次公曰兩句通義紅所以言花絮所以言素也日長唯鳥雀蘇軾曰周素山居風暖日長不謝賔客俯簷把琖但聞鳥雀啁秋亦足爲幽人之樂春逺獨柴荆趙次公曰言無往來之人故獨柴荆而巳數有關中亂何曽劒外清故郷王洙曰一作園歸不得地入亞夫營趙次公曰此指言長安屯兵乃公之故郷而爲軍營矣亞夫營在長安其事則文帝單子入㓂三分將軍軍棘門灞上與細柳而細柳營則周亞夫之所軍者也春水三月桃花浪趙次公曰韓詩於溱與洧方渙渙兮注云謂三月桃花水下時也鄭卬曰桃花開時水乃漲云桃花水江流復舊㾗王洙曰言復漲也朝來没沙尾碧色動柴門王洙曰古詩春水似挼藍接縷垂芳餌王洙曰水深可以垂釣連筒灌小園王洙曰連筒以引水巳添無數鳥趙次公曰古詩寄語故林無数鳥㑹入羣裏比毛衣爭浴故相喧春望國破山河在王洙曰劉越石云家國破亡親友凋殘城春草木深王洙曰春一作荒感時花濺淚恨别鳥驚心梅聖俞曰花鳥常時可娱之物今覩之濺涙心驚其憂可知烽火連三月家書抵萬金蘇軾曰王筠乆在沙場得家書抵得萬金顔師古曰王筠意思真堪笑却把家書抵萬金趙次公曰考此作於天寳十五載之正月蓋禄山反於十四載之十一月至則烽火連三月也白頭搔更短渾欲不勝簮王洙曰司馬公曰牂羊墳首三星在罶言不可乆古人爲詩貴於意在言外使人思而得之故言之者無罪聞之者足以戒也近丗詩人唯杜子美最得詩人之體如國破山河在城春草木深感時花濺淚恨别鳥驚心山河在明無餘物矣草木深明無人矣花鳥平時可娱之物見之而泣聞之而悲則時可知矣他皆類此不可徧舉杜修可曰鮑照行路難云白髪零落不勝簪蘇軾曰張茂先謂子曰利名縶鎻未遂山林之興短髪搔白渾不勝簪矣史臣不載何也絶句漫興九首趙次公曰題名漫興蓋言眼前之景而漫成耳别無譏刺眼見王洙曰一作前客愁愁不醒無頼春色到江亭即遣花開深造次趙次公曰言愁如睡醉而不醒也言即遣花飛去此所以爲春之造次也便覺王洙曰一作教鶯語太丁寕手種桃李非無主野老墻低還是家趙次公曰野老公自况也恰似春風相欺得夜來吹折數枝花趙次公曰言方藉見隣家桃李以爲翫而春風相欺吹折数枝熟王洙曰一作耐知茅齋絶低小江上鷰子故來頻㗸泥點汚琴書内王洙曰一作困更接飛蟲打著人王洙曰已上皆傷爲客見欺趙次公曰此篇專言鷰也只道實事别無所譏師古曰巳上甫自傷爲客而爲小人見欺也二月巳破三月來杜田曰沈佺期度安梅入龍編詩云别離頻破月容鬢驟催年漸老逢春能幾回莫思身外無窮事且盡生前有限杯王洙曰張翰詩使有身後名不如即時一杯酒腸断春江欲盡頭王洙曰春江一云江春盡一作白趙次公曰此王維所謂行到水窮処也杖藜徐歩立芳洲顛狂柳絮隨風去蘇軾曰嵆叔夜見豪少年上巳游恣嵆榰頥長嘯乆乃作柳篇云有傱其輕薄兮飄舞隨風輕薄桃花逐水流洙曰柳絮桃花非乆固之物欲隨風逐水無有定上此詩亦譏以勢利相交趙次公曰實道其景别無所譏懶慢無堪不出村呼兒日在掩柴門趙次公曰乃嵆康性踈懶而有七不堪是也陶淵明歸去來云門雖設而常開蒼苔濁酒林中静碧水春風野外昏糝逕楊花鋪白氊點溪荷葉疊王洙曰疊一作纍青錢筍根雉子無人見鮑文虎曰說者引唐人食笋詩云稚子脫錦棚謂稚子爲笋賛寕雜志竹根有䑕大如猫其声類人名竹豚亦名稚子今按稚即雉字字畫小訛爾若以笋爲稚子則鳬雛復是何物笋詩雖以稚子脫棚喻笋非便謂稚子爲笋也蘇軾曰笋是稚子乃竹根稚子葛琰云竹根数稚子喜無人見採送阿洪爲早饌阿洪乃葛洪也琰洪叔也趙次公曰是稚雞子子耳西京雜記太液池其間鳬雛稚子布滿充實稚子性好伏沉其身小在笋之傍難見縁近丗本誤作稚子故起紛紛之說近丗洪覺範以稚子爲笋名夫旣謂之笋根稚子則稚子别是一物豈仍是筍耶沙上鳬雛旁母眠師古曰稚子說者不一或以爲竹留或以爲雉雛或以爲笋皆非也殊不知子美多借爲對偶其語句相混後人多不曉其義稚子乃甫之子宗文也甫有二子一曰宗文字稚子二曰宗武字驥子如云驥子春猶隔鶯歌暖正繁乃憶㓜子之詩也借驥子以偶鶯歌正似此以稚子對鳬雛之類是也甫詩云老妻畫紙爲棊局稚子敲舡整釣鈎又云晝引老妻乗小艇晴看稚子浴清江又云鄰人有美酒稚子夜能賖則稚子乃宗文也審矣筍根稚子无人見此㝷兒不見忽於竹叢下得子遂有此句復何疑乎殊不看下句沙上鳬雛傍母眠以禽鳥猶知爱其子可以人反不如之乎盖謂小兒戯於竹邊偶㝷不見遂至感物以興已意其理灼然舎西柔桑葉可拈趙次公曰其葉繁茂可引手而拈之江上細麥復纎纎人生幾何春已夏王洙曰魏武短歌行對酒當歌人生幾何不放香醪如蜜甜蘇軾曰巴子歌香醪甜似蜜峽魚美可鱠隔户王洙曰一云户外楊柳弱嫋嫋杜修可曰宋鮑明逺詩嫋嫋柳垂道恰似十五兒女腰誰謂朝來不作意杜修可曰琅邪王歌云新買五尺刀懸着中梁柱一日三摩挲劇於十五女狂風挽斷最長條傷春五首師古曰時避㓂在蜀作天下兵雖滿趙次公曰謂廣德元年吐蕃䧟京師車駕幸陜春光王洙曰一作青春日自濃西京疲百戰趙次公曰吐蕃留京師聞郭子儀軍至驚潰子儀復長安北闕任羣凶蘇軾曰除符北闕震蕩羣凶肆威若不誅鋤恐逼洛汭趙次公曰指言程元振魚朝恩之徒按史記柳伉䟽吐蕃犯順罪由元振請斬之以謝天下關塞三千里趙次公曰公在閬中望乗輿所在有三千里関塞之隔矣煙花一萬重蒙塵清露急王洙曰見至尊尚蒙塵注御宿且王洙曰一作有誰供殷復前王道王洙曰啇之中宗髙宗能復前王之道周遷舊國容王洙曰平王東迁於洛邑蓬萊足雲氣應合揔從龍趙次公曰豈言蓬萊殿乎蓋言羣臣當尽隨駕易雲從龍也雲以比羣臣龍以比天子鸎入新年語花開滿故枝天清王洙曰一作青風卷幔草碧水通池牢落官軍速蕭條萬事危王洙曰憂時之心切故於万事未見其安也鬢毛元自白淚點向來垂不是無兄弟其如有别離王洙曰言雖有兄弟而爲䘮乱阻隔不得相保爾巴山春色静北望轉逶迤王洙曰巴山蜀山也北望謂長安在蜀之北也師古曰甫謂憂時之心切故於万事未見其安也日月還相闘星辰屢合圍王洙曰屢合一云亦屢漢天文志五星所行合散犯守陵歷闘食彗孛飛流日月薄蝕韋昭曰星相撃爲闘髙祖七年月暈圍參畢七星不成誅執法焉得變危機王洙曰天文志南宫南四星名執法中端門趙次公曰廣雅曰熒惑謂之罰星或謂之執法今指熒惑而言則指程元振之熒惑人主也大角纒兵氣王洙曰天文志大角者天王帝座廷其兩旁曰攝提魏都賦姦回内贔兵纏紫微趙次公曰京師兵又滿矣故曰纏兵氣西都賦云兵纏紫微鉤陳岀帝畿王洙曰西都賦周以鉤陳之位注鉤陳王者法之主行宫也煙塵昏御道王洙曰黄道也耆舊把天衣王洙曰一云固無牽白馬幾至著青衣蘇軾曰煬帝幸維楊朝廷耆艾把天衣諌不止趙次公曰父老不欲車駕之岀皆索挽帝衣行在諸軍闕蘇軾曰漢帝諸軍闕食四掠居民趙次公曰言軍士稀少來朝大將稀王洙曰吐蕃䧟京師天子幸陜諸鎮畏程元振魚朝恩讒構莫肯奔命朝廷所恃者郭子儀一人而巳趙次公曰言藩鎮不朝賢多隱屠釣王肯載同歸王洙曰賢者避地自隱於屠釣王能爲文王載吕望事否任彦昇爲蕭楊州薦士表隱鱗卜祝藏器屠保蘇軾曰􅑔元自古賢人哲士或抱關擊柝或隱迹屠釣或雜魚樵師古曰日月相闘星辰合圍言天示変異故盗賊興執法者大將之權也不命將以誅之則危機不得息大角纏兵氣言禄山䧟京師天王之位尚妖氛所纒繞也鈎陳者天子之仗出帝畿言帝出幸耆舊把天衣言父老皆攀車駕再有朝廷亂難知消息真近傳王在洛復道使歸秦王洙曰歸一作通謂傳者不一也奪馬悲公主登車泣王洙曰一作哭貴嬪蕭關迷北上王洙曰漢武行幸雍祠五畤通回中道遂北岀蕭關迷北上謂東行陜故下句有欲東廵之句滄海欲東廵王洙曰秦始皇東廵海上銘石勒功敢料安危體猶多老大臣豈王洙曰一作得無嵆紹血霑灑屬車塵王洙曰晉書忠義傳紹以天子蒙塵承詔馳詣行有所值王師敗績於蕩隂百官及侍衛莫不散潰唯紹儼然端冕以身捍衛兵交御輦飛箭雨集紹𬒳害於帝側血汚御服天子深哀歎之及事定左右欲浣衣帝曰此嵆侍中血不可去司馬相如諌獵書云犯屬車之清塵師古曰吐蕃再䧟京城代宗幸陜故云再亂滄海欲東廵言代宗幸陜如始皇之東廵勞民動衆也敢料安危體言朝廷老臣猶多國體未遽危也豈無嵆紹血言艱雞之際衛帝者豈無忠臣義士如嵆侍中者乎聞說王洙曰一作道初東幸孤兒却走多王洙曰宣帝紀注取從軍死事者之子養羽林官教以五兵號曰羽林孤兒少壯者令從軍也趙次公曰此篇聞官軍逃亡之詩却走退却而走也難分太倉粟王洙曰漢太倉之粟紅腐不可食趙次公曰言其旣走則雖有太倉之粟而難與之也競棄魯陽戈王洙曰魯陽公與韓遘戰酣日暮援戈而揮之日爲之反三舎趙次公曰言戈乃魯陽之戈可以麾戰而反棄之爲可痛矣胡虜登前殿王洙曰吐蕃䧟京師也王公出御河王洙曰出奔也得無王洙曰一作忍爲中夜舞王洙曰晉春秋曰祖逖字士稚與司空劉琨雄豪著名時與琨同辟司馬州主簿情好綢繆共𬒳而寢中夜聞雞鳴起舞曰此非惡聲毎語丗事或中宵起坐相謂曰若四海鼎沸豪傑並起吾與足下相逐中原耳劉琨與親舊書曰吾枕戈待旦志梟逆虜常恐祖生先吾着鞭誰王洙曰一作冝憶大風歌王洙曰漢髙祖作大風歌云大風起兮雲飛揚安得猛士兮守四方發沛中兒教之歌酒酣上撃缶而和之趙次公曰此又見公之忠義深矣師古田代宗出幸禁軍皆逃竄也難分太倉粟言國用乏也競棄魯陽戈言兵敗北也英雄之士於斯時豈無覬覦如劉琨者故曰得無中夜舞誰憶大風歌言無人守四方也春色生烽燧王洙曰見悲青坂詩注幽人泣薜蘿王洙曰猶賢者泣於草野爾趙次公曰幽人公自謂也方春之時而惟有烽燧此薜蘿之中幽人無如之何所以但泣而巳君臣重修德猶足見時和王洙曰巴閬僻逺傷春罷始知春前巳收宫闕趙次公曰尤見公之經濟矣春日江村五首農務村村急王洙曰農務田事春流岸岸深乾坤萬里眼時序百年心茅屋還堪賦王洙曰秋興賦僕野人也偃息不過茅屋茂材之下桃源自可㝷王洙曰見欲問桃花宿注艱難昧王珠曰一作賤生理飄泊到如今迢遞來三蜀趙次公曰蜀郡廣漢郡犍爲郡爲三郡也師古曰蜀吴魏分爲三國故曰三蜀蹉跎又六年王洙曰又一作有趙次公曰公自乾元二年冬到蜀至今乾元七年凡六年矣客身逢故舊王洙曰得嚴公薦舉也發興自林泉過懶從衣結王洙曰董京威衣百結衣頻遊任履穿王洙曰東郭先生履穿行雪中着地處皆足迹藩籬頗無限恣意向王洙曰一作買江天師古曰言江天恣意賞眺不費錢買也種竹交加翠栽桃爛熳紅經心石鏡月到面雪山風王洙曰石鏡雪山皆蜀中故事巳見前注赤管隨王命王洙曰漢官儀尚書令僕丞郎月給赤管大筆一雙公爲檢校尚書工部故云赤管也銀章付老翁王洙曰見霧雨銀章澁注趙次公曰銀章方賜朱朱服也故次篇有垂朱紱之句也豈知牙齒落蘇軾曰李笴有子在江南乆不至語其妻曰阿陳豈知我牙齒豁落如桑榆倒景何與子相見耶名玷薦賢中扶病垂朱紱王洙曰紱古蔽膝也象冕服以韋爲之曹矛建俯愧朱紱鮑文虎曰公謂檢校工部貟外郎賜緋也歸休歩紫苔王洙曰休沐也漢制五日一下休沐沈休文客位紫苔生郊扉存晩計王洙曰顔廷年側同幽人居郊扉常晝閉衰暮之計也幕府媿羣材王洙曰見幕府秋風日注趙次公曰衛青傳云開幕府蓋設幕以爲府也鷰外晴絲卷鷗邊水葉開蘇軾曰阮籍詩浴鷗開水葉戲蝶避風絲其語冲淡子美往往尤盡巧妙書示任師中鄰家送魚鼈問我數能來羣盗哀王粲王洙曰見乆客詩注趙次公曰王粲避乱客荆州中年召賈生王洙曰見過故斛斯校書莊詩注趙次公曰文帝召賈誼至宣室登樓初有作王洙曰王粲在荆州思歸作登樓賦前亮性器𥚹窄才術無能肉食非我所冝幽棲林泉平生心足矣趙次公曰謝靈運詩買此永幽棲門逕王洙曰一作逕没從榛草無心待王洙曰一作走馬蹄蘇軾曰崔豹讀書尚無暇誰有心待輪蹄來往師古曰花鳥逢春皆爲可娱但不合客於異方轉使人傷心也三年落日低言爲客已涉三年嗟己之衰暮也畏人言避宼也甫自言性𥚹與物相忤今冝隱居以畏人而成此築室殆非功成名遂而身退也門逕從榛草將息交絶遊也可惜花飛有底意趙次公曰謂有甚㡳事老去願春遲可惜歡娱地都非少壯時寛心應是酒遣興莫過詩鄭卬曰過古禾切此意陶潜解鄭卬曰胡買切唐韻曉也吾生後汝期王洙曰陶潜性好琴酒一撫一盃笑詠而巳趙次公曰淵明所樂詩酒而巳公恨不與同時師古曰陶潜以早悟弃官而歸今甫當衰老而困於覉旅故云吾生後汝期落日落日在簾鈎溪邊春事幽芳菲縁岸圃王洙曰楚詞芳菲滿堂趙次公曰言芳菲之圃縁岸而爲者也樵爨倚灘舟洙曰應璩樵蘇不爨趙次公曰言樵爨之舟倚灘而泊者也啅雀爭枝墜王洙曰啅噪也飛蟲滿院遊濁醪誰造汝一酌散千憂王洙曰一酌一作酌酒一云一酌罷人憂東方朔曰夫積憂者得酒而解沈括曰東方朔列傳武帝幸甘泉長平坂道中有蟲赤如肝頭目口齒悉具朔曰此謂怪氣必秦獄處也夫積憂者得酒而解乃取蟲置酒中立消故云云絶句二首遲日江山麗春風花草香趙次公曰爲春日所照景象佳麗也泥融飛燕子沙暖睡鴛鴦江碧鳥逾白山青花欲燃杜修可曰岀孟子如火之始然余葵曰孟子若火之始然今春看又過何日是歸年師古曰北齊陽松玠談藪云吴均有才氣甞爲詩云秋風籠白水鴈足印黄沙沈隱侯曰黄沙語大儉均曰亦見公詩云野棠開未落山櫻發欲燃均曰我始欲燃卿巳印訖絶句趙次公曰或云江邊踏青乃成都事每以三月三日出郊言踐踏青草故謂之踏青江邊踏青罷廻首見旌旗風起春城暮髙樓鼔角悲杜修可曰唐李綽歳時記云三月上巳有錫宴羣臣於曲江傾都人物於江頭禊飲踏青即事暮春三月巫峽長王洙曰盛弘之荆州記巴東三峽巫峽長皛皛行雲浮王洙曰一作无日光鄭卬曰皛胡了切趙次公曰陶渊明詩云皛皛川上平雷聲忽送千峯雨花氣渾如百和香鄭卬曰和胡卧切王洙曰古詩博山炉中百和香欝金蘇合与都梁蘇軾曰解濟逰楽游園云日烘花氣如百和香惹衣雅然冝数数行樂趙次公曰梁孝元帝巴陵詩花氣尽薫舟黃鸎過水飜廻去燕子㗸泥濕不妨飛閣卷簾圗畫裏虚無只少對瀟湘趙次公曰雖眼前之山水如畫圖而其所虚无只欠少瀟湘爲對也暮春卧病擁塞在峽中瀟湘洞庭虚映空趙次公曰言瀟湘洞庭之景虚在彼処映空而我卧病於此不得見之也楚天不斷四時雨蘇軾曰蜀卭𤏡山後四時常无晴曰梁益稱爲漏天古詩地近漏天經歳雨巫峽長吹千里風洙曰巫峽多風趙次公曰地理志黎州之西有漏天四時常雨今公借字以言楚地耳沙上草閣柳新闇城邊野池蓮欲紅暮春鴛鷺立洲渚挾子飜飛還一叢趙次公曰叢聚也言鴛鷺与子叢聚也夏古詩三首律詩四首夏日歎夏日出東北陵天經中街王洙曰中街黄道之所經也薛夢符曰右按前漢書天文志日有中道月有九行中道者黄道一曰光道光道北至東井去北極近南至牽牛去北極逺東至角西至婁去極中夏至至於東井北近極故晷短立八尺之表而晷景長尺五寸八分冬至至牽牛逺極故晷長立八尺之表而晷景長丈三尺一寸四分春秋分日至婁角去極中而晷中立八天之表而晷景長七尺三寸六分此日去極逺近之差晷景長短之制去極逺近難知要以晷景晷景者所以知日之南北也日陽也陽用事而日進而北晝進而長陽勝故爲温暑隂用事則月退而南晝退而短隂勝故爲涼寒也故曰進爲暑退爲寒若日之南北失節晷過而長爲常寒退而短爲常燠此寒燠之表也故曰爲寒暑朱光徹厚地趙次公曰楚辝云陽杲杲其朱光鬱蒸何由開王洙曰晋天文志夏至極起而天運近北而斗去人逺日去人近南天氣至故蒸熱也張景陽大火流坤維白日馳西陸漢書昴畢爲天街應璩書曰処凉臺而有炎蒸之煩招魂朱明承夜注明日也張孟陽朱光馳北陸浮景忽西沉翰曰朱光日也陸士衡功臣頌朱光以渥楚詞杲杲光光上蒼乆無雷無乃號令乖王洙曰易傳當雷不雷陽德弱也郎顗傳雷者号令其徳生養号令殆廢當生而殺則雷反作其時无歳趙次公曰言君令之不時雨降不濡物趙次公曰言彼相之无澤良田起黃埃王洙曰易潤万物者莫疾乎雨濡滋也蘇軾曰隋煬帝時大早任安曰上蒼乆不降甘雨良田黄埃勃起飛鳥苦熱死池魚涸其泥王洙曰鮑昭苦熱行身熱頭且痛鳥墮䰟家㱕又曰晨禽不敢飛萬人尚流冗舉目唯蒿萊蘇軾曰鮑昭賦上古壘望蒿萊尽目力沈括曰晋灼曰蒿萊荆棘㪯目皆是至今大河北盡如虎與豺王洙曰言大河之此民皆飢餓相吞如豺虎也浩納微凉王洙曰謝霊運不怨秋夕長常苦熱夜短虚明見纎毫王洙曰陶潜凉風起將夕夜景湛虚明羽蟲亦飛揚蘇軾曰李靳雜感月華滿院寒飛揚羽虫乱物情無巨細自適固其常王洙曰詩熠燿宵行羽虫也念彼荷戈士王洙曰詩候人荷戈与祋荷下可切窮年守邊疆何由一洗濯執熱互相望王洙曰无方切言荷戈之士乆苦於炎熱但相望而巳未能一先濯也師古曰兵革以來雨暘失序甫苦於旱熱因覩羽虫夏夜飛揚而適其性乃念彼荷戈之士執熱而不得一濯君天下者不能推好逸惡勞之心与衆共之豈所謂爲民父母也哉竟夕擊刁斗鄭卬曰刁音彫喧聲連萬方王洙曰李廣傳程不識正部曲行伍營陣擊刁斗至明軍目便孟康曰刁斗以銅作鐎受一斗晝炊飯食夜擊持行名曰刁斗今在滎陽庫中也西域傳斥堠七百餘人五分夜擊句斗自守師古曰夜有五更故分而持之也青紫雖𬒳體蘇式曰韓耀雖青紫𬒳体鍾鼎列前皆非吾所欲也但得衡山一峯笑卧雲間吾心足矣不知早還郷王洙曰李白蜀道難云錦城雖云楽不如早還家韋賢取青紫如俯拾地芥也北城悲笳發鸛鶴號且翔鄭卬曰胡刀反王洙曰豳詩鸛鳴于垤况復王洙曰一作懷煩促倦激烈思時康魯訔曰張茂先詩煩促每有餘蘇子卿詩長歌正激烈毒熱寄簡崔評事十六弟大暑運金氣王洙曰暑一作火五行相生以成四時夏火也秋金也金當代火而畏火故金氣伏而火流所以熱也荆揚不知秋趙次公曰大暑當作大火詩曰七月流火月令曰孟秋之月盛徳在金大火流而運金氣所以爲七月矣旣巳七月也而荆楊楚地是爲炎方故獨不知秋也林下有塌翼王洙曰陳孔璋檄垂頭塌翼莫所慿恃蘇軾曰王子渊文夫兒失志如鵰鶚損羽翮豈塌翼垂頭於林下乎趙次公曰鳥以熱而難飛也水中無行舟杜修可曰書云罔水行舟千室但掃地蘇軾曰李篆赤眉盗過千室掃地俱尽也閉關人事休老夫轉不樂旅次兼百憂蝮蛇暮偃蹇王洙曰蝮蛇毒蛇也往往在人居室中蘇軾曰宋純嶺南行云蝮蛇偃蹇於道周客子悲辛而躑躅空床難暗投炎霄惡明燭况乃懷舊丘杜修可曰鮑照結客少年塲云去郷三十載復得還舊丘蘇軾曰戴深秋風巳動㱕思况更懷舊隱林丘如此一洒令人心折開襟仰内弟執熱露白頭束帶負芒刺蘇軾曰葛殷昨日束帶見人卑折躬揖如負芒刺吾欲裂巾毀冠偃仰林下接居成阻脩何當清霜飛㑹子臨江樓載聞大易義諷興詩家流藴藉異時輩檢身非苟求薛夢符曰右按前漢孔稚圭等論曰咸以儒宗居宰相位服儒衣冠傳先王語其醖藉可也又唐權德輿醖藉風流自然可慕皇皇使臣體信是徳業優趙次公曰指乎崔評事必爲使也楚材擇𣏌梓王洙曰𣏌梓楚之良材也薛夢符曰右按春秋左傳楚令尹子木問声子曰晋大夫与楚孰賢對曰晋卿不如楚其大夫則賢皆卿材也如𣏌梓皮革自楚往也唯楚有材晋實用之趙次公曰唯楚有材晋實用之舊注模稜乃云𣏌梓楚之良材非是漢苑歸驊騮短章逹我心理爲識者籌王洙曰爲一云待孔融附此短章聊神我心素趙次公曰驊騮所以美崔言漢苑則漢有天馬之苑識者盖指評事也熱三首雷霆空霹靂雲雨竟虚無炎赫衣流汗低垂氣不蘇乞爲寒水玉願作冷秋菰汪革曰寒水玉水精也菰蒲也成於冷秋二物皆凉故願爲之何似兒童嵗風凉出舞雩王洙曰冠者五六人童子六七人浴乎沂風乎舞雩詠而㱕瘴雲終不滅師古曰瘴雲乃炎瘴之雲瀘水復西來鄭卬曰瀘龍都切孫僅曰瀘水岀瀘州属蜀道閉户人髙卧蘇軾曰黄起雨中見竇朴朴家貧雨中揜蓬門髙卧長笑自若起歎曰袁安卧雪人俱稱賢竇夫子雨中髙卧的不譲古人也歸林鳥却廻趙次公曰人髙卧而但睡鳥不安而又飛以見其熱之甚矣峽中都似火江上只空雷想見隂宫雪風門颯踏開張孝祥曰宫中暑月積雪爲山取其隂凉朱李沉不冷雕胡炊屢新王洙曰魏文帝書浮甘瓜於清泉浸朱李於寒水沈休文長祕屢以拂朝胡方自炊將衰骨盡痛被褐王洙曰一作暍味空頻趙次公曰暍於歇反傷暑也夏禹扇暍武王亦扇暍歘鄭卬曰許律反翕炎蒸景飄颻征戍人十年可解甲爲爾一霑巾王洙曰憫其經寒暑而不得休息也蘇軾曰孫約征伐十年不解甲兵師古曰彫胡即菰米被褐言其賤也身賤而味重併享此寧不傷征戍者十年不得解甲乎多病執熱奉懷李尚書衰年正苦病侵凌首夏何湏氣鬱蒸王洙曰古詩首夏猶清和敲蒸欝凌冥應璩書曰處凉臺而有欝蒸之氣大水淼茫炎海接鄭卬曰淼弭沼切竒峯硉兀火雲昇王洙曰硉郎兀切選詩夏雲多竒峯淮南子旱雲煙火蘇軾曰岳齊火雲亦如竒峯不能致雨空來空去趙次公曰賦選狀滔天以淼茫郭璞江賦巨石硉矹以前却思霑道暍黃梅雨王洙曰京房傳暑有暍者漢武紀暍死暑中熱死也趙次公曰暑病曰暍思道暍之人以黄梅一雨霑之此武王扇暍之意公之爲仁可見矣鄭卬曰暍於歇切傷暑也敢望宫恩玉井氷王洙曰後漢書琅邪有冰井厚丈餘魚豢魏略明帝九龍殿前玉井綺欄趙次公曰唐制百官賜氷而公甞爲左拾遺當預賜冰之列今旣逺矣故有是句不是尚書期不顧王洙曰前漢陳遵嗜酒每飲賔客滿堂輙閉門取客車轄投井中雖有急終不得去時北部刺史奏事過遵值其方飲刺史大窮候遵霑醉時突入見遵母叩頭自白當對尚書有期㑹狀母乃令從從閭岀去應休璉與滿公琰書曰當此之時仲孺不辝同産之服孟公不願尚書之期山隂野雪興難乗王洙曰王徽之甞居山隂夜雪初霽月色清朗四望皓然獨酌酒詠左思招隱詩忽憶戴逵逵時在剡便夜乗小船詣之造門不前而返曰乗興而行興盡而返何必見安道秋古詩五首律詩二十首七月三日亭午巳後較熱退晚加小凉穩睡有詩因論壯年樂事戲呈元二十一曹長今兹啇用事蘇軾曰應瑀秋日燕山隂序云啇飈用事金帝持權羊弘云啇帝行令草木摇落餘熱亦巳末洪覺範曰末無也餘熱將無也衰年旅炎方王洙曰炎方南方趙次公曰公時在夔爲楚地故云旅炎方生意從此活亭午減汗流杜修可曰梁元帝纂要云在午曰亭干北鄰耐人聒晚風爽烏匼洪蒭曰烏匼不舒貌風爽人烏匼之懷筋力蘇摧折薛夢符曰右按子美曰馬頭金匼匝所謂烏匼即烏巾也閉目踰十旬大江不止渇退藏恨雨師健歩聞旱魃主洙曰雨師行雨神也退藏不用事也神異經曰南方有人長三二尺走行如風名曰旱魃所見之囯大旱也園𬞞抱金玉無以供採掇趙次公曰言其貴而難得如金玉也宻雲雖聚散徂暑終衰歇前聖眘焚巫鄭卬曰眘古慎字王洙曰魯僖公欲焚巫而臧文仲止之武王親救暍王洙曰武王見暍人王自左擁而右扇之見丗紀隂陽相主客時序遞回斡王洙曰隂陽相推而用事則四時斡流而為寒暑灑落唯清秋昏霾一空闊蕭蕭紫塞鴈南向欲行列趙次公曰言清秋則昏霾一掃空矣塞鴈是時南向之行列不必以熱為念也歘思紅顔日霜露凍堦闥胡馬挾彫弓鳴弦不虚發王洙曰弦不虚發中必决眥趙次公曰此思少年乗寒射獵之事而感歎年老也長鈚逐狡兎突羽當滿月薛夢符曰右按家語子路白羽若月赤羽若日趙次公曰鈚音批韻書云箭也突羽又所少言箭其羽奔突而疾故曰突羽當滿月言挽弓之滿箭當其挽滿之間也薛注所引大非也師古曰秋月光滿故曰滿月惆悵白頭吟王洙曰古楽府有此吟疾人相知以新間舊不能至白首也趙次公曰祖出卓文君以相如置妾之故以其不能至於白首而爲此吟故公借用耳張詠曰此句傷衰老也蕭條游俠窟王洙曰游俠豪傑也前漢有游俠傳杜定功曰郭景純遊仙詩京華游俠窟舊注引前漢游俠傳即非窟字出処矣臨軒望山閣縹緲安可越張天斍曰縹緲髙逺貌髙人錬丹砂張天斍曰髙人指元曹長也未念將朽骨王洙曰丗說舟砂可以駐年薛夢符曰右按抱朴子曰臨氾縣有廖氏丗老壽後移子孫輙殘折它人居其故宅復累丗夀乃知是宅所爲不知何故疑井水赤乃掘井左右得古人堭丹砂十斛丹汁入井是以飲水而得壽又楽府但使丹砂就令億万年少壯跡頗踈王洙曰踈縱誕也歡樂曽倐忽王洙曰倐怱不可留也杖藜風塵際老醜難翦拂王洙曰翦裁也拂拂拭言老醜難可矜飾也蘇軾曰北史盧思道翦拂吹嘘長其先賈趙次公曰劉孝標絶交論言翦拂使長鳴吾子得神仙本是池中物賤夫美一睡煩促嬰詞筆王洙曰周瑜蛟龍得雲雨非復池中物也張華湏促毎有餘趙次公曰言我非若子之得神仙俱美一睡而巳師古曰言其癖於文章也秋風二首秋風淅淅吹巫山上牢下牢修水関王洙曰上牢下牢皆峽内也名水関関津也鄭卬曰与上牢相連荆州記峽江突起最險処山複陡下名下牢闕師古曰水関乃関津也春夏多雨水秋冬多旱乾修水関必在秋時吴檣楚柂牽百丈王洙曰檣柂百丈皆舡上器用也薛夢符曰右按今湖湘間行舟以竹相續為索以引上水舟謂之百丈以謂其長可百丈今州峽尤多用之暖向神都寒未還趙次公曰楚南方暖乆而寒遟要路何日罷長㦸戰自青羌連百蠻趙次公曰有羌蛮之戦則長㦸滿矣舊本作百蛮善本作白字極是盖嶲州以而有烏蛮白蛮也公於䕫詠懷詩云絶塞烏蛮地中巴不曽消息好暝傳戍鼔長雲間王洙曰戍鼔戍楼鼓也秋風淅淅吹我衣東流之外西日微王洙曰東流言逝而不反也日微言迫遟暮也趙次公曰此冩眼前之景死轉含蓄道不尽悽感之意天清小城擣練急王洙曰為征戍者爲寒衣也石古細路行人稀王洙曰以啇旅未通也不知明月爲誰好早晚孤㠶他夜歸㑹將白髪倚庭樹故園池臺今是非王洙曰時經䘮乱也師古曰百川東流其勢順然也喻天下當効順于天子月臣道也日君道也月微乃其常日不當微西日微喻京師為賊所䧟代宗出幸擣練急謂婦人送征戍之衣行人稀謂啇旅不通也故園池臺今是非傷故里為宼焚蕩也早秋苦熱堆案相仍七月六日苦炎蒸師古曰甫詩有元年建巳月如此云七月六曰皆以年月紀時使後丗事可以考其行止不然何以謂之詩史乎至德二載甫目賊竄帰謁帝帝授左拾遺房琯云敗陳濤斜帝怒甫上䟽論其罪帝貶甫為華州司功郎軻元元也是年七月任華州西北地早寒於七月六日猶苦熱故甫託意以譏羣臣不時賀蘭進明譛琯於帝併及甫甫𬒳逐對食暫飡還不能趙次公曰蔡琰詩曰飢當食兮不能飡毎愁王洙曰一云常愁夜中王洙曰一作來自足王洙曰一作皆是蝎鄭卬曰許竭切趙次公曰蝎者螫蟲中原有之南中无有韓退之謫南方及其帰也有詩云照壁喜見蝎則毎以得帰為念雖蝎之螫而見之反喜也况乃秋後轉多蠅束帶發狂欲大呌簿書王洙曰唐書切於簿書期㑹何急來相仍南望青松架短壑趙次公曰江文通擬謝光禄郊遊詩風散松架險注云松枝可以為架故因謂之架焉安得赤脚踏層冰蘇軾曰馬融夏夜直館是夕蒸燠倍常如坐甑中謂同舎曰安得披襟赤脚踏隂山之層冰洗滌塵熱立秋後題日月不相饒蘇軾白王献之覧鏡見髪顧兒童曰日月不相饒村野之人二毛俱催矣汝等何不汲汲為斈寸隂過而不可復得也節叙昨夜隔玄蟬無停號鄭卬曰胡刀切秋燕巳如客蔡伯丗曰古詩秋蝉鳴樹間玄鳥逝將適宋玉燕翩翻而辝帰蝉寂寞而无声蘇軾曰張衡寓旅洛汭生計无聊有命駕之心顧梁上鷰曰秋風巳至想如客㒷斯難乆留也平生獨往願惆悵年半百罷官亦由人何事拘形役王洙曰帰去來旣自以心為形役奚惆悵而獨悲淮南王莊子畧要曰江海之士山谷之人輕天下細万物而獨往司馬彪注曰獨往自然不復顧也陶淵明誰謂形蹟拘也師古曰甫此二篇詩作於乾元元年至二年果棄官之秦州立秋雨院中有作李泰伯曰此詩在嚴武書院中作山雲行絶塞大火復西流王洙曰張景陽詩大火流坤維閑居賦望流火之餘景薛夢符曰右按春秋左氏傳哀十二年冬十二月螽季孫問仲尼仲尼曰丘聞之火復而後蟄者畢令火猶西流司歷過也又尔雅云大火謂之大辰注大火心也在中最明故時候至也飛雨動華屋䔥䔥梁棟秋王洙曰謝玄暉詩朔風吹飛雨䔥條江上來旣洒百常觀復集九城臺窮途愧知己趙次公曰指嚴鄭公也暮齒借前籌王洙曰張良願借前著以籌之左太冲壯齒不恉居嵗暮常慷慨杜修可曰言其晚年而得預節度府叅謀也巳費清晨謁李希声曰甫言曰過武廳謀府事那成長者謀趙次公曰又自謀之辝解衣開北户髙枕對南楼趙次公曰北户南楼自是當時實事舊注所引徒紛紛矣樹濕風凉進江喧水氣浮禮寛心有適趙次公曰言嚴公待以寛礼節爽病微瘳趙次公曰時節清爽乃題所謂立秋曰公素有肺疾惟氣爽則少蘇也主將歸調鼎吾還訪舊丘王洙曰主將謂嚴公也言公還朝秉政曰吾當遂帰計也鮑明逺詩去郷三十載復得還舊丘軍城早秋鄭國公嚴武作昨夜秋風入漢關朔雲邊雪滿西山更催飛將追驕勇王洙曰漢匈奴號李廣爲飛將莫放沙場匹馬還王洙曰吐蕃常入積石軍取麥哥舒翰殺之隻馬无還李修可曰春秋僖公公羊云匹馬隻輪无返者舊引哥舒翰事何干嚴公乎奉和秋風嫋嫋動髙旌王洙曰九歌嫋嫋兮秋風洞庭波兮木葉下髙旌旌旗也玉帳外弓射虜營蘇軾曰賀若弻征可汗夜分勁弓射虜營皆破継而追殺大捷趙次公曰帳大將軍之帳巳收滴博雲間戍趙次公曰滴博城名雲間戍以言其髙也欲奪蓬婆雪分城王洙曰滴博蓬婆皆西山地名趙次可曰蓬婆吐蕃城名以其逺在雪山之外秋野五首秋野日𬞞蕪王洙曰謝玄暉邑里向蕪𬞞寒江動碧虚繫舟蠻井絡王洙曰蜀都賦岷山之精上爲井絡趙次公曰楚在春秋為蛮夷卜宅楚村墟王洙曰䕫古楚附庸棗熟從人王洙曰一作行打葵荒欲自王洙曰一作旦鋤蘇軾曰左思曰鋤園葵客問其勤如此左曰去其猶草耳盤飡老夫食分减及溪魚易識浮生理難交一物違王洙曰物不可違其性也水深魚極樂林茂鳥知歸王洙曰見林茂鳥春帰水深魚知聚注吾老甘貧病榮華有是非趙次公曰吾衰老矣自安於貧病而无它念正以榮華非不美也而有是与非焉秋風吹几杖不厭北王洙曰一云此山薇王洙曰夷斉隱於首陽山採薇而食之蘇軾曰殷竦晉宣帝兩徵不起里人勸其仕竦曰老子不厭此山蕨薇君其如予何人皆服其量禮樂攻吾短山林引興長王洙曰嵆康書済類見寛不政其過又云至為礼法之士所繩疾之如言又云有入山林而不反之論遊山澤觀魚鳥心甚楽之也趙次公曰漢史所謂山林之士入而不能出也掉頭紗帽側王洙曰莊子在宥篇爵躍掉頭紗㡌見管寧紗帽静注曝背竹書光王洙曰竹書古簡冊也趙次公曰所謂竹簡之書也暗用郝隆曬腹中書也風落收松子天寒割蜜房王洙曰蜜房蜂房也趙次公曰班固終南頌曰蜜房溜其㒹稀踈小紅翠趙次公曰言秋花也駐屐近微香逺岸秋沙白連山晚照紅王洙曰海賦波如連山潜鱗輸駭浪王洙曰海賦駭浪暴洒驚波飛遊趙次公曰言魚以深爲樂而峽水之深則輸冩駭浪歸翼會髙風王洙曰魏文帝適與髙風㑹李修可曰張翰曰如歸翼得髙風翶翔投林中古詩云翩翩歸鴈翅更得髙秋風趙次公曰乃翼乎鴻毛遇順風之義砧響家家發王洙曰謝惠連櫩髙砧響發楹長杵聲哀樵聲箇箇同王洙曰峽中樵人常唱大昌歌以弔柳青毎聲闕即呼柳青然不知所爲也飛霜任靑女賜被隔南宫王洙曰淮南子云霜神青女注云青女天神青天王女主霜雪後漢樂崧甞直南宫家貧無𬒳帝聞而嘉之詔大官賜尚書郎巳下食并給帷𬒳公雖爲郎而在位故云隔尓身許騏驎畫王洙曰見今代騏驎閣注年衰鴛鷺羣王洙曰公晚方登朝籍大江秋易盛空峽夜多聞逕隱千重石帆留一片雲兒童解蠻語鄭卭曰解佳買切識也不必作參軍王洙曰丗說郝隆爲南蠻參軍上巳日作詩曰娵隅濯清池桓温問何物荅曰名魚爲娵隅温曰何爲作蠻語隆曰千里投公始得一蠻府那得不蠻語也趙次公曰趙壹居漢中一日兒童作褒音壹歎曰仲尼之道衰遟夷言蠻語習成風俗乃挈子弟歸中原也秋興三首䕫州作同作八首餘見宫殿門玉露凋傷楓樹林王洙曰李宻詩金風蕩佳節玉露凋晚林巫山巫峽氣蕭森王洙曰張景陽荒楚欝蕭森趙次公曰巫山以言山巫峽以言水也江間波浪兼天湧塞上風雲接地隂叢菊兩王洙曰一作重開他日淚趙次公曰此句含蓄蓋公於夔州見菊花者二年矣方叢菊之兩開皆是他日感傷之淚孤舟一繫故園心寒衣處處催刀尺白帝城髙急暮砧王洙曰郭㤗機皎皎白素絲織爲寒女衣良工秉刀尺棄我忽若遺䕫府孤城落日斜每依南斗望京華趙次公曰蓋長安上直北斗號北斗城也舊本南斗非聽猿實下三聲涙王洙曰見雨晴有猿揮涙尽注奉使虚隨八月查王洙曰見查上以張騫注畫省香爐違伏枕王洙曰見遂阻雲臺宿注趙次公曰畫省以粉畫之謂之畫省𥘉學記載應劭漢官儀曰尚書郎入直臺廨中給女侍史二人執香炉燒薫以從入臺違伏枕則違去畫省香炉者以伏枕之故也山樓粉堞隱悲笳王洙曰堞城堞也粉謂飾以堊土也胡人卷蘆葉吹之以爲笳趙次公曰指言白帝城也請看石上藤蘿月巳映洲前蘆荻花趙次公曰想像扁舟之景如此北山移文云秋桂遺風春蘿罷月千家山郭静朝暉日日洙曰一作一日江樓坐翠微王洙曰見熊羆守翠微注趙次公曰樓在山間也爾雅山欲上曰翠微以其氣然也信宿漁人還汎汎趙次公曰詩汎汎楊舟淸秋燕子故飛飛趙次公曰江揔别詩黄鵠飛飛逺匡衡抗䟽功名薄王洙曰匡衡傳有日蝕地震之変上問以政治得失衡遂上䟽上恱其言又傳昭儀及子定陶王爱幸寵於皇后太子衡復上䟽衡爲少傅數年數上䟽陳便冝言多法義上以爲任公卿由是爲御史大夫劉向傳經心事違洙曰劉向傳㑹𥘉立榖梁春秋徵更生受榖梁講論五經於石渠更生後改名向趙次公曰漢初立穀梁春秋徴更生受榖梁講論五經於石渠公其心事欲如劉向之傳經于朝而乃違背不偶也同學少年多不賤五陵衣馬自輕肥薛夢符曰右按文選范彦龍贈張徐州詩田家採樵去薄暮方來歸還聞稚子說有客欵柴扉儐從皆珠玳裘馬悉輕肥軒蓋照墟落傳瑞生光輝又劒騎何翩翩長安五陵間云蘇軾曰劉嵩謂兒童曰若等不見我同學少年皆衣錦食肉若等不力學復何爲終身之計耶趙次公曰五陵衣馬言貴公子也西都賦北眺五陵言長陵安陵陽陵茂陵平陵髙貴家傑之家所居舊引嚴陵與光武同學何相干耶登髙新添風急天髙猿嘯哀王洙曰宋玉云天髙而氣清潘安仁勁風凄急渚清沙白鳥飛廻無邊落木蕭蕭下王洙曰江賦㝷之無邊楚詞洞庭波兮木葉下又風颯颯兮木蕭蕭不盡長江衮衮來王洙曰謂不舍晝夜故云不盡萬里悲秋常作客王洙曰宋玉悲秋百年多病獨登臺王洙曰相如多病卧於茂陵艱難苦恨繁霜鬢潦倒新停濁酒杯王洙曰嵆康曰酒一盃潦倒麄踈傷秋林僻來人少山長去鳥微髙秋収畫扇王洙曰一云藏羽扇班姬詠扇詩常恐秋風至凉飈奪炎熱棄捐篋笥中恩情中道絶乆客掩柴扉王洙曰范彦龍云有客欵柴扉懶慢頭時櫛王洙曰嵆康書懶與慢相成艱難帶減圍王洙曰謝惠連腰帶准疇昔卜知今是非將軍思汗馬王洙曰見收京詩注趙次公曰吐蕃未息天子尚戎衣王洙曰見社稷一戎衣注白蔣風飈脆鄭卭曰說文蔣菰也唐雅曰蔣菰其末謂之彫胡殷檉曉夜稀王洙曰白蔣茭草也殷檉檉柳也鄭卭曰殷烏閑切赤黒色檉丑成切可柳爾雅曰檉河柳何年減豺虎似有故園歸王洙曰王仲宣七哀詩西京亂無象豺虎方遘患南登灞陵岸回首望長安張孟陽七哀詩季葉䘮亂起賊盗如豺虎悲秋凉風動萬里羣盗尚縱橫家逺傳王洙曰一作待書日秋來爲客情王洙曰此二事皆情意之極者愁窺髙鳥過王洙曰髙鳥言東西南北猶得所適老逐衆人行王洙曰老者尚爲衆人亦悲時之不與也始欲投三峽何由見兩京薄遊淅淅風生砌王洙曰柳惠連淅淅振條風團團月隱牆王洙曰班婕妤團圎似明月遥空秋鴈滅半嶺暮雲長病葉多先墜王洙曰秋興槁葉多隕寒花只暫香巴城添淚眼今夕復清光趙次公曰公以薄遊之無定見月而添淚也揺落揺落巫山暮寒江東北流煙塵多戰鼓風浪少行舟鵝費羲之墨王洙曰王羲之傳羲之性愛鵝㑹稽有孤居姥養一鵝善鳴求而未能得遂携親友命駕就看姥聞羲之將至烹以待之羲之歎息彌日又山隂有道士好養鵝羲之往看焉意甚恱因求市之道士曰爲冩黄庭經當舉鵝相贈耳羲之欣然冩畢籠鵝而歸甚以爲樂貂餘季子裘王洙曰史記蘇秦說季兊兊遺之黒貂裘蘇秦游秦秦不能用於是貂裘色敝趙次公曰戰國䇿蘇秦仕趙趙王負貂裘黃金使說秦書十上而說不行黒貂之裘弊今云貂餘季子裘言貧如蘇子矣長懷報明主卧病復髙秋季秋江村喬木村墟古蘇軾曰孫陽云重到樵溪喬木蔽日村墟故老無一存者踈籬野蔓懸青王洙曰一作素琴將暇日趙次公曰言將琴往江村當暇日也白首望霜天登爼黄柑重王洙曰鷦鷯賦肉不登于爼味支牀錦石圎王洙曰史龜䇿傳南方老人用龜支牀足逺遊雖寂寞難見此山川大曆二年九月三十日爲客無時了悲秋向夕終瘴餘䕫子國王洙曰魚復古䕫子國霜薄楚王宫王洙曰楚王遊蘭臺之宫草敵虚嵐翠花禁冷葉紅年年小摇落不與故園同蘇軾曰同素塞上行云八月嚴霜邊岸白風光豈與故園同隂鏗云秦川風物異不與故園同秋清髙秋蘇肺氣白髪自能梳藥餌憎加减王洙曰謝靈運詩藥餌憎所止衰疾忽在斯門庭悶掃除王洙曰陳蕃不事一室志掃除天下杖藜還客拜愛竹遣兒書趙次公曰王子猷愛竹凡遣兒書則題字於竹上十月江平穩輕舟進所如秋盡秋盡東行且未廻茅齋寄在少城隈王洙曰蜀之張儀城也趙次公曰公將往於東蜀矣姑寄草堂故成都也少城城内小城也籬邊老却陶潜菊王洙曰陶潜詩采菊東籬下悠然見南山江上徒逢袁紹盃王洙曰典略曰劉松袁紹於河朔三伏之際晝夜飲酒至於無知以避一時之暑故河朔間有避暑之飲雪嶺獨看西日落趙次公曰西山謂之雪嶺劒門猶阻北人來王洙曰阻一作旦言京信尚阻不辭萬里長爲客懷抱何時得好開冬古詩四首律詩九首前苦寒行二首漢時長安雪一丈牛馬毛寒縮如蝟王洙曰芒刺也杜修可曰西京雜記漢元封二年大雪深一丈野中鳥獸皆死牛馬踡縮如蝟鮑明逺出自蒯北行疾用衝塞起沙礫自飛揚牛馬縮如蝟角弓不可張鄭卬曰蝟千貴切蟲似豪猪者楚江巫峽冰入懷虎豹哀號又堪記秦時老翁荆楊客王洙曰公杜陵人乃秦地也慣習炎蒸嵗絺綌玄冥祝融氣或交手持白羽未敢釋趙次公曰以楚地多熱故也白羽以言扇矣去年白帝雪在山今年白帝雪在地凍埋鮫龍南浦縮趙次公曰此言水涸少也寒刮肌膚北風利楚人四時皆麻衣趙次公曰楚地多熱故四時麻衣以雪爲訝也師古曰楚峽地暖從來無雪今乃如水入懷虎貂之類哀號此又足堪記也歳絺綌謂歲暮猶衣絺綌玄冥冬伸祝融夏神冬夏之交常持羽扇是以知楚峽之暖也楚天萬里無晶輝三足之烏足恐斷羲和迭送將安歸王洙曰言隂盛陽弱日不能破羣隂也蘇軾曰管寧乆雪隂霾謂友人曰吾恐凍断三足烏脚寕不吾憂人皆変色趙次公曰日中有踆烏注云踆趾也謂三足烏也羲和日御也以雪而烏断則羲和馭日車失其所歸矣皆以形容雪深之意也後苦寒行二首南紀巫廬瘴不絶太古以來無尺雪王洙曰丗說南州謂之炎方地常温无雪蠻夷長老怨苦寒崑崙天關凍應折玄猿口噤不能嘯白鵠翅垂眼流血安得春泥補地裂蘇軾曰孔文舉語友人曰今地軸輾然裂安得東君汲海作泥而補之晚來江門王洙曰一云間失大木猛風中夜飛白屋王洙曰白屋見甘林詩注天兵斷斬青海戎殺氣南行動坤軸不爾苦寒何太酷王洙曰疑殺戮太過也巴東之峽生凌澌彼蒼回幹人得知十月一日有瘴非全歇爲冬不亦難趙次公曰時巳十月矣而瘴尚未全歇所以爲冬候之難也夜郎溪日暖王洙曰夜郎西南夷也犍爲有夜郎溪白帝峽風寒蒸褁如千室王洙曰後漢賛一夫得情千室鳴絃峽俗以蒸褁爲節物燋糟王洙曰一作糖幸一柈薛夢符曰右按元微之詩雜蓴多剖膳和黍半蒸菰此與蒸褁无異燒糟皆荆楚人所食者柈與盤同又抱朴子曰士柈瓦胾无救朝飢趙次公曰以糖爲止蒸褁燋糖皆十月一日之事如此一柈史多用此安字書乃俗槃字之真者也鄭卭曰柈簿官切王注音盤與盤同玆辰南國重舊俗自相歡初冬垂老戎衣窄王洙曰垂老臨老也戎衣窄爲作簽軍謀歸休寒色深趙次公曰時方戍屯以防吐蕃漁舟上急水獵火著髙林日有習池醉趙次公曰陪嚴公出也山簡在襄陽習氏有佳園池簡日醉焉愁來梁甫吟王洙曰見得兼梁甫吟注趙次公曰公以諸葛亮自比也師古曰甫云此句其志厭唐室之乱可知干戈未偃息出處遂何心孟冬殊俗還多事趙次公曰公中原人而流落巴䕫故指爲殊俗也方冬變所爲破甘霜落爪甞稻雪翻匙巫岫寒都薄趙次公曰楚地煖故也烏蠻王洙曰一作黔溪瘴逺隨鄭卭曰梁益記嶲州嶲山其地接諸蛮部有烏蛮秋蛮終然減灘瀬暫喜息蛟螭王洙曰南都賦憚夔龍兮布蛟螭又云或藏蛟螭趙次公曰水盛滿則蛟螭横旣冬則水日落可以暫息蛟螭之憂也至後冬至至後日初長王洙曰周禮冬至日在牽牛影長一丈三尺夏至日在東井影尺有五寸長短之至也晉魏間宫中以紅線量日影至後添長一線趙次公曰漢時宫中繍工以線量日影冬至後添一線也舊注所引周礼乃是立表求地中之說非此也逺在劒南思洛陽青袍白馬有何意王洙曰公止服九品服尔金谷銅駞非故郷王洙曰金谷園銅駞陌皆蜀中故事鄭卭曰皆在漁陽師古曰金谷園銅駝街皆不及故郷之樂梅花欲開不自覺棣蕚一别永相望王洙曰棣蕚猶兄弟也公前有詩云干戈猶未定弟妹各何之愁極夲慿詩遣興詩成吟詠轉淒涼蘇軾曰庾子山云本託詩遣㒷詩成反使旅思淒凉冬深王洙曰一云即日花葉隨天意江溪共石根早霞随類王洙曰一作戾影趙次公曰言其変態不常隨所類之影而呈現也寒水各依王洙曰一作流痕易下楊朱淚王洙曰楊朱泣歧路謂其可以南可以北趙次公曰公之流落困於歧路故云爾難招楚客魂王洙曰宋玉哀屈原憂愁山澤魂魄飛散其命將落故作招魂欲以復其精神延其年壽外陳四方之惡内崇楚國之美以諷于君風濤暮不穩趙次公曰古詩風濤暮不止幾日到瀟湘薛夢符曰公欲南下以嵗暮而未成行也捨掉宿誰門十二月一日三首今朝臘月春意動雲安縣前江可憐鄭卭曰十道志雲安在䕫州本漢朐腮縣也一聲何處送書鴈百丈誰家上水舩蘇軾曰古離别曲百丈牽舡上水遟郎去瞿塘幾日㱕鍾㑹呼挽舡索爲百丈今舟子皆呼之爲實故事趙次公曰百丈者牽舡篾内地謂之宣音彈未將梅蘂驚愁眼更取椒花媚遠天明光起草人所羡鄭卭曰長安志明光殿在東内肺病幾時朝日邊王洙曰明光殿名也漢王啇借明光殿起草作制誥也相如病肺多渴遂卧疾于茂陵趙次公曰晉明帝云只聞人自長安來不聞人自日邊來其後人遂以日邊爲帝都寒輕市上山煙碧日滿樓前江霧黃負鹽出井此溪女打鼔發船何郡郎新亭舉目風景切茂陵著書消渇長趙次公曰晉王導傳洛京傾覆中州士人避乱江左十六七毎至暇日邀出新亭飲宴周顗中坐而嘆曰風景不殊㪯目有江山之異皆相視流涕惟導愀然変色曰當共戮力剋復神州何至相對作楚囚泣耶衆收淚而謝茂陵著書乃司馬相如事春花不愁不爛熳楚客唯聽棹相將即看鷰子入山扉豈有黃鶯歷翠微短短桃花臨水岸輕輕柳絮點人衣蘇軾曰張麗華遊園有柳絮點衣謂後主何能點人衣王曰輕薄物試卿意也笑而不荅趙次公曰十二月一日作詩而有鷰子桃花之類何也此義在末句所謂也日一盃難強進者也此盖逆道其事耳春來凖擬開懷乆老去親知見面稀他日一盃難強進重嗟筋力故山違歲暮歲暮逺爲客邊隅還用兵煙塵犯雪嶺王洙曰煙塵兵氛也趙次公曰此篇全言吐蕃之乱也西山近接維松上有積雪經夏不消人謂之雪山也鼔角動江城天地日流血王洙曰謂多戰闘朝廷誰請纓王洙曰終軍願請長纓以係狂虜濟時敢愛死寂寞壯心驚趙次公曰公自悼其有濟時之志而壯心巳消故也分門集註杜工部詩卷第二, WYG: ''}
