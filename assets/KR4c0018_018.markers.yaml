  - {type: variant, offset: 0, length: 25392, content: 分門集註杜工部詩卷之十八簡寄中律詩十三首秋日夔府詠懷奉寄鄭監審李賔客之芳一百韻絶塞烏蠻北洙曰雋州以西有蛮號烏白孤城白帝邊洙曰公孫述更魚復縣爲白帝城飄零仍百里蘇曰吴靖爲長沙令一日自嘆曰讀五車書辛勤十年不得綴鴛鴦班髮白蹤跡飄零尚爲百里陶元亮復何人邪趙曰公自入中原入蜀又自蜀南下可謂飄零矣以病住雲安今又移居於䕫故云仍百里消渇巳三年洙曰司馬相如有消渇病雄劒鳴開匣洙曰雷煥得双劒於鄷城劒有雌雄群書滿繫船洙曰一云所向皆窮轍餘生且繫船亂離心不展洙曰詩亂離莫矣不展謂憂心如結也趙曰選詩所麻心莫展衰謝日蕭然洙曰名迹消泯也筋力妻孥問洙曰一作斍菁華歳月遷洙曰陶徴士誄菁華隱没芳流渇絶注菁華猶矣華也登臨多物色陶冶頼詩篇洙曰登髙臨逺多有景物所以象其変態者有詩以陶成之尓陶如陶者之􅓨埴冶如工冶之鎔鑄夢符曰晉梁鍾嶸詩評曰阮嗣宗詩其源出于小雅无彫蟲之功而懷詠之作可以陶性靈發幽思趙曰顔氏家訓言文章曰陶冶性靈從容諷諌峽束滄江起巖排石樹圎趙曰善本作古字舊作石樹非拂雲霾楚氣鄭曰霾謨皆切風雨土泰伯曰此句謂霧瘴之氣拂雲天也潮海蹴吴天趙曰言江流朝宗于海其勢蹴踏吴囯之天也煑井爲鹽速洙曰蜀都賦曰濵以塩池注塩巴東北新井縣水出也如涌泉可煑以爲塩燒畬度地偏鄭曰畬詩遮切度逹各切洙曰峽土瘠確暖氣晚逹故民燒地而耕謂之火耕亦謂之畬田有時驚疊嶂洙曰沈休文詩山嶂逺重疊任彦升詩疊嶂易成響何處覔平川洙曰峽中无川也鸂䳵雙雙舞獼猴壘壘懸洙曰壘壘重疊貌修可曰孟陽七哀歌北芒何疊疊碧蘿長似帶錦石小如錢蘇曰黄牛峽出錦石圎如錢上有五綵花紋隋煬帝時張异來獻帝號曰春池叢玉近丗詩云錦石來巫峽春地開玉叢春草何曽歇洙曰謝靈運詩芳草亦未歇寒花亦可憐洙曰張景陽詩寒花發黄彩師曰夔地煖春草寒花四時不断故云云獵人吹戍火趙曰謂之戍火則有屯戍在白帝城也獵人至其上野店引山泉洙曰峽民依山而居故鮮水常以竹引山泉而食師曰自峽束滄江起至野店引山泉皆述䕫風景也喚起搔頭急洙曰西京雜記武帝過李夫人就取玉簮搔頭自此後宫搔頭皆用玉價倍貴觀此詩搔頭乃抓頭也何遜云金粟裹搔頭趙曰言寢睡之中𬒳人喚起頭方煩痒以簮搔頭不停手而頗急公自注何遜云金粟裹搔頭以見搔頭字所出師曰喚起鳥也晨鳴之鳥喚人睡起因以得名前輩詩云喚起䆫全曙催㱕日未西東坡謂喚起催帰二鳥名古人用事後丗不知多作虚字解釋其失前賢之旨逺矣扶行幾屐穿洙曰阮孚字遥集性好屐客有詣孚正見自蠟屐因自嘆曰未幾一生能着幾緉屐神色自閑暢趙曰言旣睡起爲人所扶而行凡穿破幾屐則其行往来之頻矣公自著云諸阮云一生能着幾屐以見幾屐字所出也師曰扶行杖也扶行遍歷故屐齒穿兩京猶薄産四海絶隨肩洙曰公有田在韋杜絶隨肩言无故舊也幕府𥘉交辟洙曰蔡邕薦邊讓於何進曰幕府𥘉開博選清英班固傳幕府新開廣延群英郎官幸備貟洙曰公爲郎俻貟猶俻数言不事事趙曰嚴武東西川爲節使辟公爲叅謀故云交辟時公爲尚書工部貟外郎備貟公自謂也瓜時猶旅寓洙曰莊八年斉侯使連稱管至父戍葵丘瓜時而往曰及瓜而代期戍公問不至請代不許故謀而作亂萍泛若夤縁洙曰謝靈運詩蘋萍泛沉深藥餌虚狼籍洙曰謝靈運詩薬餌情所止衰疾忽在斯陸賈名声籍甚注言狼籍甚盛秋風洒静便趙曰便平声謝靈運詩還得静者便開襟驅瘴癘洙曰峽多嵐瘴氣候蒸􅊜故多瘴癘憂愁鬱結者易為所困故開襟以驅之趙曰王仲宣登楼賦向北風而開襟明目掃雲煙洙曰掃一作拂史明目張膽延年詩城闕生雲煙蘇曰魯粛雲煙掃尽明目望逺髙宴諸侯禮趙曰赴藩侯之宴㑹而感傷所聞之曲也諸侯謂唐之藩鎮佳人上客前洙曰古詩主人爱上客哀筝傷老大洙曰魏文帝書哀箏順耳華屋豔神仙洙曰曹子建箜篌引空存華屋処落落帰丘山謝靈運華屋非蓬居古詩金屋羅神仙南内開元曲鄭曰明皇所在常時弟子傳法歌聲變轉滿坐涕潺湲洙曰都督栢中丞筵開梨園弟子李仙奴歌明皇雜録云天宝中上命宫中女子数百人爲梨園弟子皆居冝春北院上素曉音律時有馬仙期李龜年賀懷忠皆洞知律度安禄山自范陽入覲亦獻白玉簫管数百事皆陳於梨園自是音響殆不類人間其後李龜年流廢江南毎遇良晨勝景爲人歌闋座上聞之者莫不掩泣而罷酒有梨園法曲及霓裳曲至今尚有弔影夔州僻洙曰言獨客䕫州旁无親舊惟与影相弔而巳李令伯陳情表焭焭孑立形影相弔回腸杜曲煎洙曰宋玉髙居賦口感心動且回腸氣司馬迁書腸一日而九回趙曰公在長安家于杜曲故懷杜曲而回腸煎熬也即今龍廐水莫帶犬戎羶洙曰犬戎吐蕃是也謂䧟京師趙曰兩京龍廐門苑馬門也謂水流苑門内此公自注也公不知中原消息故深憂之以今龍廐門邊之水莫也為犬戎所羶汚乎耿賈扶王室洙曰耿賈後漢二十八將耿弇賈復也論曰賈耿之洪烈又翼扶王運蕭曹供御筵洙曰䔥曹之功尊拱王室趙曰旣憂吐蕃之羶汚又思廟堂大臣有耿賈䔥曹焉可以伐叛而息兵矣乗威滅蜂蠆洙曰左傳公卑邾不設俻而禦之臧文仲曰君其无謂邾小蠭蠆有毒而况囯乎戮力効鷹鸇洙曰左傳季文子使太史克對曰先大夫臧文仲教行父事君之禮行父奉以周旋弗敢失墜曰見有礼於其君者事之如孝子之養父母也見无礼於其君者誅之如鷹鸇之逐鳥雀又子産問然明爲政對曰見不仁者誅之如鷹鸇之逐鳥雀也舊物森猶在洙曰哀元年傳祀夏配天不失舊物凶徒惡未悛洙曰左傳子家亦无悛志注悛改寤悛且縁切止也國須行戰伐人憶止戈鋋洙曰言人厭兵革也光武紀道未方古亦止戈之武焉東都賦戈鋋彗雲注矛矟也奴僕何知禮恩榮錯與權洙曰衛青傳青曰人奴之生得无笞罵即足矣公孫洪傳賛曰衛青奮於奴僕言以恩而假奴僕以權任人之失也蘇曰公孫邈叱衛青曰尓奴僕庸夫也焉知礼義青神色頓挫趙曰言武夫悍卒有立功而蒙寵者然公此句无所畏惮言亦痛悼其弊出於中誠也胡星一彗孛洙曰前漢天文志昴曰旄頭胡星也張晏曰彗所以除舊布新也孛氣似彗也趙曰旄頭胡星也星妖所纏謂之彗亦謂之孛師曰胡星指安史之亂黔首遂拘攣洙曰秦本紀更民曰黔應劭曰黔亦黎黒也鄒陽傳以其能越挛拘之語漢曹褒傳療拘挛難与圗始生拘挛猶拘束也潘安征西賦陋吾乆之拘挛哀痛絲綸切洙曰前漢西域傳賛武帝末年遂弁輪臺之地而下哀痛詔礼緇衣子曰王言如絲其出如綸煩苛法令蠲洙曰前漢書云髙祖約法三章蠲除煩苛業成陳始王洙曰詩七月陳王業也言因時而変陳王業之艱難以警時君也歐曰言粛宗成中興之業兆喜出于畋洙曰斉丗家太公望吕尚以漁釣奸周西伯將出獵卜之曰所獲非熊非驪非虎非羆所獲覇王之輔於是西伯獵果遇太公望於渭陽載与俱帰立爲師宫禁經綸密台階翊戴全洙曰梁竦傳宮省事宻莫有知者台堦事見建都詩注熊羆載吕望鴻鴈美周宣洙曰美其能勞來旋定安集側聽中興主洙曰烝民宣王任賢使能周室中興焉顯宗紀先帝受命中興側聽諦聽也長吟不丗賢洙曰王吉云欲治之主不丗出師古曰言有遇之不常出也杜延年蒯通傳並云畧不丗出曹子建曰不丗之賢趙曰言王室中興本乎得賢而鄭李乃所謂賢者故吟詠而思之選有永嘨長吟也音徽一柱數洙曰梁劉孝綽江津寄劉之徽詩經過一柱觀出入三休臺道里下牢千洙曰下牢関在巫峽之南趙曰公自注鄭在江陵李在夷陵一柱觀在荆州渚宮故事宋臨川王於羅公淵上立觀甚大而唯一柱所以言江陵也下牢関在峽州所以言夷陵也数通音問故言数相去千里故云千也師曰一杜觀上牢下牢皆在夔峽音徽一柱数言得李鄭音書之頻数也道里下牢千言鄭在江陵李在夷陵与子美相距凢千里時不絶音問也鄭李光時論文章並我先隂何尚淸省梅曰言其文清新而警省於人沈宋歘聮翩洙曰隂何沈宋皆能文者並見上注趙曰以四子比鄭李也隂則隂鏗何則何遜沈則沈佺期宋則宋之問隂何前代而二公比之彼尚清省未爲冨艶沈宋近代歘然追逐与之相䏈翻也梅曰聮翻文疾速也律比崑崙竹洙曰前漢律歷志黄帝使伶倫去大夏之西崑崙之隂取竹之嶰谷断兩節間而吹之以爲黄鍾之宫音知燥濕絃洙曰伯牙弹琴意在山子期曰巍巍乎志在水子期曰蕩蕩乎子期死伯牙遂絶絃修可曰按劉孝標廣絶交論曰抚絃徽音未逹燥􅊜変響張羅沮澤不睹鴻鴈髙飛又按韓詩外傳趙王曰夫時有燥􅊜絃有緩急徽指推移不可記也使者曰臣詩借此以譬之故公有燥􅊜之句風流俱善價洙曰王衍楽廣宅心事外見重於時天下言風流者惟王楽爲首見晉書愜當乆忘筌趙曰上四句以言三公之文章也文賦誇目者尚奢愜心者貴當王弼明象曰猶筌者所以在魚得魚而忘筌也置驛常如此洙曰鄭當時孝景時爲太子舎人毎五日洗沐常置驛馬長安諸郊請謝賔客夜以継日至明旦常恐不徧師古曰此謂長安城外四靣之郊耳邑外謂之郊登龍蓋有焉洙曰李膺獨持風裁以声名自髙士有𬒳延接者名爲登龍門趙曰上句以言鄭監之好客下句以言李賔客之待士雖云隔禮數洙曰名位不同礼亦異数隔猶不同也趙曰公自謙以謂与之位貌隔也不敢墜周旋洙曰左傳奉以周旋不敢失墜髙視収人表洙曰曹子建与楊德祖書曰足下髙視於上京楊德祖荅牋云自周章於省覧何遑髙視哉更信賛髙視當丗趙曰任彦昇撰王文憲集序曰經師人表虚心味道玄洙曰老子云虚其心又玄之又玄馬來皆汗血洙曰見馬詩注鶴唳必靑田洙曰永嘉記靑田有双白鶴年年生子長便去鮑明逺詩獨鶴方朝淚趙曰以馬比二公則皆汗血以鶴比二公則必青田汗血馬詳見上注羽翼商山起洙曰見收京詩注趙曰以言李賔客者太子官也故用四皓事蓬萊漢閣連洙曰西都賦脩塗飛閣自未央而連桂宮又云瀛州方壷蓬萊皆起于中央趙曰以言鄭監乃祕書監也故用蓬萊字後漢書曰斈者稱東觀爲老氏藏室道家蓬萊山唐祕書監掌圗書秘記即漢之東觀也管寧紗㡌淨洙曰見嚴中丞杜駕見過詩注江令錦𫀆鮮洙曰陳書江揔爲尚書令能属文於五言七言尤善然傷於浮艶故爲後主所幸多有側篇好事者相傳諷翫于今不絶日与後主遊宴後亭共陳暄等十餘人當時謂之狎客趙曰江㹅傳不載錦𫀆事其文集自有山水納𫀆賦其序云皇儲監囯餘辰勞謙終宴有令以納袍降賜何以奉揚恩德東郡時題壁蘇曰南史桞惲詩云亭皐木葉下壠首秋雲飛琅琊王融見而歎賞因題東壁惲于粉切南湖日扣舷洙曰舷船唇也扣擊也郭璞江賦云詠採菱以扣舷選賦鳴榔叩舷說文曰根髙木也以長木叩舷爲声以驚魚使入網之中趙曰此專言鄭也有寄鄭監湖亭三首又有過鄭湖亭泛舟又有重泛鄭監前湖是也鄭曰南湖在夷陵扣丘候切舷胡田切船舷也逺遊臨絶境洙曰逺遊履名洛神賦云踐逺遊之文履古詩云足下双逺遊佳句染華牋洙曰華牋蜀牋也趙曰丗說孫㒷作天台賦以示范榮期毎至佳句則曰是我軰語毎欲孤飛去洙曰謝玄暉雪賦瞻雲鴈之孤飛趙曰此巳下言二公之遊賞欲往從之不得且起故郷之念江揔南楼詩不及孤飛鴈徒爲百慮牽洙曰江淹詩抚枕懷百慮又去歳暮百慮交生涯巳寥落洙曰生涯言巳之生計也寥落无成也國歩尚迍邅洙曰尚一作乃一作巧柔桑詩囯歩斯頻囯歩蔑資易迍卦六二迍如邅如難行不進之皃衾枕成蕪没范塘作棄捐洙曰囯乱離故寢処宴安之地皆芜没而弃捐也蘇曰江揔池塘荒廢筆硯弃捐尓來欲謝人事抱一守真趙口公自注云平生多病卜築遣懷因乨離故寢食宴安之地皆芜没弃捐也别離憂怛怛鄚曰當割切洙曰怛怛傷慘不足皃伏臘涕漣漣洙曰臘夏曰嘉平殷曰清祀周曰大蜡漢改為臘伏臘人所以祭祀也公在殷郷故於伏臘多有所感史記秦德公始為伏師曰暦忌釋曰伏者何也金氣伏藏之日也一時代謝皆以相生立春木伐水水生木立夏火伐木木生火立冬水伐金金生水立秋金伐火金畏火故至庚日必伏庚者金也隂陽書言從夏至第三秋燕言欲帰而未得尓仲長統云人事可遣何爲促局䔥踈聽晚蟬洙曰宋玉九辨而翩翩其辝帰兮蟬寂寞而无声蘇曰張翮渭南詩云䔥索渭南客馬上聞晚蝉撩我故郷思攪我心懸懸趙曰謝靈運蕭踈野趣生雕蟲蒙記憶洙曰揚子曰童子雕蟲篆刻俄而曰壯夫不爲也蘇曰王武子逺蒙雕蟲知君子記憶烹鯉問沉綿洙曰古楽府詞呼兒烹鯉魚中有尺素書趙曰言二公記憶其䏻賦詩故致尺書以問其病躰也沉綿者若乆病之謂也卜羡君平杖洙曰嚴君平卜筮於成都市以爲卜筮者賤業而可以惠衆人有邪惡非正之問則依蓍龜爲言利害各因勢道之以善從吾言者巳過半矣裁日閲数人得百錢足自養則閉肆下簾而授老子阮修宣子常歩以百錢掛杖頭至酒店便獨酣暢家无儋石之儲也偷存子敬氊洙曰見舊物森猶在注囊虚把釵釧米盡拆花鈿趙曰言皆賣易之也甘子隂凉葉茅齋八九椽陣圖沙北岸洙曰桓温傳𥘉諸葛亮造八陣圗於魚復平沙之上壘石爲八行行相去二丈温見之謂之常山蛇勢也文武皆莫能識之市曁瀼西巔洙曰公自往市曁夔人語也工水横通山谷処方人故謂之瀼也覊絆心嘗折洙曰江淹別賦心折骨驚棲遲病即痊趙曰每爲事物覊絆故其心甞折今得棲遲可以養而痊也紫収岷嶺芋洙曰一云紫秧岷下芋前漢貨殖傳蜀卓氏曰吾聞岷山之下沃壄千里下有蹲䲭至死不飢師古曰踆鴟謂芋也其根可食以充粮故無飢年華陽國志曰汶山郡都安縣大芋如蹲䲭也趙曰從此巳下紀懹西草堂所自也白種陸家蓮洙曰家一作池色好梨勝頰穰多栗過拳洙曰蜀都賦紫梨津潤樼栗鏬發勑厨唯一味蘇曰段干木見客供苞唯笋羹瀹笋干木曰家貧山居唯此一味客曰清竒雅味趙曰王羲之傳有一味之甘割而分之求飽或三鱣洙曰楊震傳冠雀銜三鱣魚飛集講堂前注鱣似蛇一音善兒去㸔魚笱洙曰一云俗異隣蛟室詩敝笱在梁也蘇曰孫林終日溪上守漁笱獨坐吟嘯自得其忘形若此人皆愛之人來坐馬韉洙曰一云朋來坐馬韀晉王尼𥘉爲護軍府軍士胡母輔之等齎羊酒詣護軍門入遂坐馬廐下与尼炙羊飲酒醉飽而去定功曰戰國蘇秦少与張儀友秦在趙爲相儀至趙使人白秦秦必激之令儀於城東門外坐以破馬韉進之粗食儀憤乃西入秦昭王善之拜爲相儀歎曰馬韉之事乃至是乎人來坐馬韉言貧無席坐也縳柴門窄窄洙曰一云柴門窄小小通竹溜㳙㳙洙曰縳柴縳柴爲門也通竹引泉以竹也陶淵明泉㳙㳙而始流塹抵公畦稜鄭曰魯鄭切洙曰京師農人指田逺近多云幾稜耒曰公畦官園也村依野廟壖鄭曰而宣切洙曰晁錯傳鑿太湖廟堧垣師古曰堧者内垣之外游地也人縁反缺籬將棘拒倒石頼藤纒借問頻朝謁何如稳晝眠趙曰言瀬不出仕誰云行不逮洙曰語古者言之不出恥躬之不逮也自覺坐能堅洙曰馬援曰大丈夫窮當益堅老當益壯霧雨銀章澁洙曰前漢百官公郷表銀章印皆龜鈕其文曰章謂刻其官之章也趙曰銀章乆不服之所以澁也馨香粉署妍洙曰粉署郎署也趙曰公時乃工部貟外郎不生詣省中徒想其官署之妍美耳省謂之蘭者以其諸郎官握蘭含香也故云馨香又謂之畫省以粉畫之也故言粉署紫鸞無逺近黄雀任翩翾鄭曰許縁切趙曰上句以譬髙才之人則不論逺近而往下句則公自謙如黃雀之小徒任翶翔而巳紫鸞者亦紫色之鸞也困學違從衆洙曰与俗俯仰而巳孔子拜下違從麻冕從衆明公各勉􅏧洙曰楊惲傳方當盛漢之隆願勉旃無多談師古曰􅏧勉也言子當自勉勵以立功名不湏多爲我言也趙曰言巳之局促如黄雀而勉二公之爲功名也楊子困而不學斯爲下矣聲華夾宸極洙曰言李鄭声華足以夾輔宸拯早晚到星躔洙曰郎官象列星諸侯象四七宰相法三台皆星躔早晚言非乆㧞用之也懇諌留匡鼎洙曰匡衡傳諸儒爲語曰無說詩匡鼎來匡說詩解人頥服䖍曰鼎猶言當之也言匡且來也應劭曰鼎方也張晏曰匡衡時字鼎長乃易字稚圭丗傳衡与貢禹上書言衡敬報下言匡鼎白知是字也師古曰服應二說是也傳載衡言日食事甚切到鄭曰西京雜記匡鼎小名鼎諸儒引服䖍洙曰後漢儒林傳服䖍字子慎𥘉名重又名祗後改爲䖍少以清苦建志入太斈受業善著文㪯孝廉不逢輸鯁直洙曰逢一作過㑹是正陶甄宵旰憂虞軫洙曰宵衣旰食黎元疾苦駢雲臺終日畫洙曰馬援傳顯宗圖畫建武中名臣列將於雲臺劉孝標論影組雲臺者摩看詩獻納雲臺表蘇武傳丹靑所畫者何以過子卿靑簡爲誰編洙曰青簡殺竹青爲簡也春秋序小事簡牘而已齊崔杼亂大史氏書之死南史間之執簡而往青簡乃史臣所以記事者編編條也如今之史亦有編修官趙曰不過用鯁直以進當爲正陶甄之化耳所以然者上則天子軫宵旰之憂下則黎元駢疾苦之事也如此則可畫像於雲臺而書名於史冊耳雲臺詳見上注田曰文選載劉向別録治青竹作簡書謂之青簡余曰後漢吴祐傳青簡注火炙簡令汗取其青易書復不蠧謂之汗簡行路難何有洙曰古有行路難詩招㝷興巳專由來具飛檝洙曰木玄虚海賦飛迅鼔檝暫擬控鳴絃洙曰西域傳控弦者十餘萬趙曰兩句通義言檝飛之疾如箭之往也身許雙峯寺田曰釋氏要覧云曹溪在韶州雙峯寺下昔晉武帝曹叔良宅也門求七祖禪洙曰雙峯寺名也釋書有六祖此言七祖不知其故田曰按佛書毗婆尸佛尸弃佛毗舎浮佛拘留孫佛勾那含牟尼佛迦葉佛釋迦牟尼佛謂之七祖其所說七偈乃禪源也趙曰謂之門求則所求之法舊注摸令無法田說是師曰又按佛書毗婆尸佛尸棄佛毗舎浮佛拘留孫佛勾那含牟尼佛迦葉佛釋迦佛牟尼佛謂之天望七祖其所說七偈乃禪源也自逹磨至慧能謂之中華六祖由五祖而上盖梁隋開元以前人六祖慧能入滅於唐睿宗先天元年而子美於是年始生六祖之道至肅宗上元𥘉方盛故肅宗自曹溪請其衣鉢歸内供養子美於是漂泊在蜀以此考之則六祖与子美盖同時先後人也故所求禪言七祖而不言六祖也因是詩注云不知其故乃叙其丗次而辨之落㠶追宿昔衣褐向真詮洙曰天台賦披毛褐之森森真詮佛法也趙曰言於彼處落㠶乃是宿昔之願其衣褐之身專爲依向真詮也褐者布衣之謂安石名髙晉洙曰公自注云鄭髙簡得謝太傅之風趙曰此謝安也昭王客赴燕洙曰公自注云李宗親有燕昭之美燕昭之裔趙曰以燕昭北李途中非阮籍洙曰阮籍時率意獨駕不由徑路車迹所窮輒慟哭而返查上似張騫洙曰因話録漢書載張騫窮河源言其奉使之逺實無天河之說惟張茂先博物志說近丗有人居海上毎年八月見槎來不違時齎一年粮乗之到天何見婦人織丈夫飲牛遣問嚴君平去某年某月日客星犯牛斗即此人也後人相傳云得織女支機石持以問君平都是虚慿河之說今成都嚴真觀有一石呼爲支機石皆云當時君平留之宝暦中余下第還家於京師途中逢官差遞夫舁張騫槎先在東都禁中今准詔索有司取進不知是何物也前軰詩往往有東君槎者相襲訛謬矣縱出雜詩亦不足據也披拂雲寧在洙曰拂一作晤衛􅗕見樂廣曰瑩然若披雲霧覩青天趙曰選云歩幽蘭以披拂淹留景不延洙曰劉安招隱士詩云援桂枝兮聊淹留風期終破浪師曰子美淹留江漢年已老矣破浪謂下峽歸故里故曰他日辝神女水怪莫飛涎洙曰孔子丗家水之怪龍罔象韋昭曰龍獸也非常見故曰怪海賦其垠則有天琛水怪鮫人之室江賦水物怪錯又太揚鬐掉尾濆浪飛涎趙曰言我之風期必破浪而往告尓水怪母爲孽也南史宗慤曰願乗長風万里浪選云噴沬飛涎而義則飢虎垂涎之意他日辭神女洙曰宋玉有神女賦廟在巫山傷春怯杜䳌洙曰蜀都賦鳥生杜䳌之魄見華陽風俗録蘇曰曹晏遊巴江聞杜鵑語友人曰吾年來傷春怯聞此声使我心索然趙曰旣離夔而於巫峽辝別神女之日當在暮春時也師曰雲安有杜䳌客情畏聽杜䳌也淡交隨聚散洙曰礼君子之交淡如水澤國遶廻旋洙曰言地多陂澤故言澤囯本自依迦葉洙曰王簡栖頭陁寺碑以法師景行大迦葉故以頭陁爲稱首注大迦葉佛大弟子也師曰此句言寓居僧舎也何曽藉偓佺鄭曰藉去声偓音渥佺音詮洙曰列仙傳偓佺魏里采藥父也食松實形体生毛數寸能飛行捷走馬揚雄甘泉賦云雖方征橋与偓佺兮猶仿佛其若夣師古曰偓佺仙人名鑪峯生轉眄洙曰廬山東南有香爐山孤峯起遊氣籠其上氛氲若若香煙鄭曰廬山記東南有香炉山孤峯秀起橘井尚髙褰洙曰神仙蘇耽種橘鑿井以救郷里之有病者以井泉服一橘葉即已東走窮歸鶴洙曰遼東歸鶴見卜居詩注南征盡跕鳶鄭曰跕的恊切洙曰馬援傳云吾在浪泊西里間虜未㓕之時下潦上霧毒氣薰盛仰視飛鳶跕跕墮水中卧念少游平生時語何可得也注䲭鳶跕跕堕水晚聞多妙教卒踐塞前愆鄭曰塞悉則切洙曰妙教釋教也釋書云能脩其教者足以追塞前業也顧凱丹青列洙曰晉顧凱尤善丹青圖冩特妙謝安深重之以爲有蒼生以來未之有也凱之毎畫人成或數年不點目精人問其故荅曰四体妍蚩本無闕少於妙處傳神冩照正在阿堵中頭陁琬琰䥴洙曰姓氏英賢録云王中字簡栖作頭陁寺碑文頭陁寺者沙門釋憲宗之所立也敢寓言於彫篆庶髣髴乎衆妙琬琰䥴碑也衆香深黯黯洙曰法華經云曉燒衆名香煙天台賦衆香馥以楊師曰如戒香定香憲香解脫香之類幾地肅芊芊洙曰潘岳籍田賦蟬冕熲以灼灼兮碧色肅其芊芊師曰幾地謂釋氏自苐一地至第十地修行言有漸也勇猛爲心極洙曰經云猛勇情進清羸任體孱鄭曰鋤連切弱也洙曰陳書姚察居憂齋素日乆後主見察柴瘠爲之動容勑曰卿羸瘠如此齋菲累年不冝一飯有乖將攝也金箆空刮眼鄭曰箆邊迷切鏡象未離銓洙曰一云平等未離銓釋書涅盤經云如目肓人爲治目故造詣良醫即以金箆刮其眼膜師曰鏡象言鏡中之象未離乎相迹要當悟豈逹本如得魚而忘其筌乃爲善學道也寄岳州賈司馬六丈巴州嚴八使君兩閣老五十韻衡岳啼猿裏巴州鳥道邊洙曰言州居山之險絶處也李白云西當太白有鳥道三徑微窄止能容鳥度而巳趙曰南中八志曰交趾郡治龍編縣自古㒷鳥道四百里以其險絶獸猶無蹊人所莫由特上有飛鳥之道耳故人俱不利洙曰一作別謫䆠兩悠然開闢乾坤正趙曰言収復二京矣榮枯雨露偏洙曰言澤不均也趙曰言二子不得受聖㤙而謪去也長沙才子逺釣瀬客星懸洙曰漢賈誼洛陽才子也黜爲長沙王傳嚴子陵釣瀬光武徴之太史奏客星犯于帝座之嚴使君也憶昨趨行殿洙曰天子行幸所止曰行殿趙曰自此巳下公自言也肅宗即位靈武公自賊中竄身至鳯翔見帝殷憂捧御筵彦輔曰言自賊中赴鳯朔討胡愁李廣奉使待張騫洙曰見焉知李廣不封侯注又見查上覔張騫注趙曰討強胡未捷則愁李廣使之未還則待張騫無復雲臺仗虚修水戰船洙曰見寂寞雲臺伏注漢武作昆明池以習水戰中有戈舡樓舡百般上建樓橹趙曰言行宮草創不復嚴整法仗也便言哀江南賦猶有雲臺之仗蒼茫城七十洙曰􅐱食其慿軾下齊七十餘城流落劒三千洙曰莊子說劒昔趙文王喜劒劒士來門而客三千餘人日夜相擊於前畫角吹秦晉洙曰吹一作歌晉一作塞春秋時秦晉通􅊚又爲敵囯旄頭俯澗瀍洙曰見旄頭𥘉淑擾注澗瀍二水也在伊洛間趙曰此言安史前漢天文志昴爲尾頭胡星也小儒輕董卓洙曰董卓廢立凶暴无道忍性矯情擢用羣士以尚書韓馥䓁爲刺史馥䓁到官与袁紹之徒十餘人各㒷義兵同盟討卓有識笑苻堅洙曰苻堅違衆伐晉遂至破敗抚畜鮮卑苻融諫之不聽後爲鮮卑所亡故爲有識者所笑趙曰小儒有識公自謂也董卓苻堅指安史也董卓擢用羣士以韓馥䓁爲刺史馥到官与袁紹㒷義兵同盟討卓浪作禽塡海洙曰山海經曰發鳩之山有鳥名精衛本赤帝之女嬉遊於東海溺而死不返化爲精衛常取西山木石以塡東海江淹詩精衛銜木石誰能測幽微那將矢射天洙曰商本紀帝乙无道爲偶人謂之天神与之博令人爲行天神不勝乃僇辱之爲革囊盛血仰而射之命曰射天武乙獵於河渭之間暴雷震死趙曰皆言安史之不知量也萬方思助順洙曰助順助天子也一鼓氣無前洙曰言得衆助故所向必破左傳曹劌曰夫戦氣也一鼔作氣再而衰三而竭隂散陳倉北晴熏太白巓洙曰陳倉郡陳寳鳴雞在焉北近長安也太白山名亂麻屍積衛洙曰武五子賛秦始皇即位三十九年内平六囯外攘四夷死人如乱麻暴骨長城之下衛地河北相衛之間也破竹勢臨燕洙曰杜預傳今兵威巳震勢如破竹数節之後迎刄而解燕地范陽禄山巢穴也法駕還雙闕洙曰天子還京也西都賦乗鵉輿備法駕王師下八川洙曰見八水散風濤注此時霑奉引洙曰見奉引濫騎沙苑馬注趙曰公爲拾遺掌供奉故云佳氣拂周旋洙曰光武紀論望氣者蘇伯阿爲王莽使至南陽遥望見舂陵郭唶曰氣佳哉鬱鬱葱葱然貔虎開金匣洙曰書如虎如貔蔡文姻詩軍衆來東下金甲曜日光麒麟受玉鞭洙曰凉州記咸寕二年發張駿陵得鞭飾以珊瑚晉明帝以七寳鞭与賣食嫗即玉鞭或有之伹未知所出趙曰公爲以言御馬按蘇鴞杜陽編代宗甞賜郭子儀九花虬馬并紫玉鞭轡舊注模稜矣侍臣諳入仗廐馬解登仙趙曰法仗復俻皆侍臣所舊諳入者矣時可曰淮南子乗黄獸名龍翼馬身黄帝乗之而仙花動朱樓雪城凝碧樹煙洙曰江淹詩碧樹露阡阡生煙紛漠漠顔延年詩空城凝寒雲衣冠心慘愴洙曰顔延年拜陵廟詩衣冠終冥漠陵邑轉葱青故老淚潺湲洙曰九辨倚結軫太息涕潺湲沾軾九歌横流涕兮潺湲哭廟悲風急洙曰見及夫哭廟後注朝正霽景鮮魯曰朝正元日朝㑹鄭曰朝直遥下諸成切歳之首月月分梁漢米洙曰梁漢間所出者水月分廪給也春得水衡錢洙曰宣帝本始二年春以水衡錢爲平陵徙民起第宅應劭曰水衡与少府皆天子私藏耳縣官公作當仰給司農今出水衡錢言宣帝即位爲異政也晉灼曰食貨志𥘉大司農𬋩塩鐵官布多故置水衡欲以主塩鐵及楊可告緡林財物衆乃令水衡主上林上林三官主鐵錢也内蘂繁於纈鄭曰奚結切文繒魯曰内蘂宫花也宮花軟勝綿恩榮同拜手出入最隨肩洙曰入一作処書皐陶曰拜手稽首礼五年之長則肩隨之晚著華堂醉寒重繡𬒳眠轡齊兼秉燭趙曰言並轡而行也書枉满懷牋趙曰言在禁掖時往來書尺也毎覺昇元輔深期列大賢趙曰所以極言二公之才器可爲宰輔也秉鈞方咫尺洙曰詩節南山秉囯之鈞左傳不違顔咫尺鎩翮再聮翩洙曰顔延年鵉翮有時鎩注鎩殘也謝靈運聮翩何窮也趙曰言爲宰執不逺而乃謫去如鳥之殺翮也无巳曰淮南子云飛鳥鎩羽許愼注云鎩殘羽禁掖朋從改洙曰一作換微班性命全靑蒲甘受戮洙曰受一作就漢元帝疾史丹以親宻侍疾侯上寢直入卧内頓首伏青蒲誅趙曰公以拾遺爲職故使青蒲事白髮竟誰憐洙曰左太冲馮唐豈不傳白首不見招弟子貧原憲洙曰見難甘原憲貧注諸生老伏䖍洙曰見諸儒引伏䖍注趙曰公自比原憲㐲䖍也公本傳云入太斈受菐有雅才以其入斈之故故云諸生老伏䖍尓師資謙未達郷黨敬何先舊好腸堪斷洙曰謝靈運楚人心者絶裁容膓今断鮑明逺行子心腸断新愁眼欲穿逸曰穿破也趙曰公懷二公也翠乾危棧竹鄭曰乾居寒切棧助諌切棚也紅膩小湖蓮洙曰湖一作池賈筆論孤憤洙曰韓非作孤憤属賈司馬詩嚴君賦幾篇逸曰属嚴使君定知深意苦莫使衆人傳貝錦無停織洙曰詩萋兮菲兮成是貝錦趙曰貝錦以喻䜛也朱絲有斷絃洙曰鮑昭直如朱絲繩趙曰鍾子期伯牙絶絃公詩歎二子无知音而戒之也浦鷗防碎首霜鶻不空拳鄭曰鶻胡骨切蘇曰王粛張欽同舟見野鶻盤旋欽曰浦鷗然間暇疑防鶻下老拳碎首沙毛趙曰兩句通意謂二子如浦鷗言官如霜鶻旣不空拳期於必中則鷗當有碎首之防矣其戒之至也地僻昏炎瘴趙曰言岳州近南爲有瘴矣山稠隘石泉趙曰言巴山在乱山間也且將棊度日應用酒爲年典郡終微眇洙曰嚴使君也治中實弃捐洙曰賈司馬也晉職官志置别駕治仲從事趙曰治從平聲二公在禁掖而出斯爲微眇弃捐矣安排永傲吏洙曰謝靈運居常以待終処順故安排定功曰郭景純遊仙詩曰漆園有傲吏菜氏有逸妻注莊子甞爲漆園吏楚威王聘之欲以爲丞相謂使者曰亟去无汙我故曰傲吏比興展歸田洙曰陶渊明田園將芜胡不帰去去才難得洙曰語才難不其然乎趙曰去去之語如去囯之義古詩夫去復去去蒼蒼理又玄洙曰蒼蒼天也言天理玄妙莊子天之蒼蒼其正色耶趙曰謂天理難喻也老子曰玄之又玄古人稱逝矣洙曰漢髙祖紀吾亦從此逝矣吾道卜終焉洙曰終窮也吾道窮於此乎隴外翻投跡漁陽復控弦洙曰言安慶緒復熾也笑爲妻子累甘與歳時遷親故行稀少洙曰時乱而離散故親故稀少兵戈動接聮洙曰接跡聮属言充斥也他郷饒夢寐失侣自迍邅師曰言吐蕃復入寇隴外思明再乱漁陽甫傷爲妻子所累是以客居秦州甘与歳時迁移也失侣言与賈嚴間隔多病加淹泊長吟阻靜便宋曰平聲安貌如公盡雄俊志在必騰騫洙曰一云公如尽憂患何事有陶甄趙曰言二公不乆復用也寄劉峽州伯華使君四十韻峽内多雲雨秋來尚鬱蒸洙曰髙唐賦朝爲行雲暮爲行雨應璩書処凉䑓而有鬱蒸之煩趙曰此言楚地也逺山朝白帝洙曰見上白帝城詩注趙曰說䕫州盖公之所在深水謁夷陵洙曰謁一作出峽州有夷陵縣趙曰說峽州盖言劉使君之所在也遲暮嗟爲客西南喜得朋洙曰易西南得朋哀猿更起坐趙曰聞哀猿之聲不斍起坐更音平聲落鴈失飛騰趙曰以譬其身如鴈之落而失於飛騰也伏枕思瓊樹洙曰江淹賦云願一見顔色不異瓊樹枝矣趙曰李陵贈蘇武詩思得瓊樹以解長渇飢公思劉使君亦如之臨軒對玉繩洙曰星名謝靈運詩玉繩低建章趙曰思与劉使君臨軒而坐直至王繩星見時也青松寒不落洙曰歳寒若青松色何敬祖詩青青陵上松亭亭髙山栢光色冬夏茂根柢无凋落趙曰言劉使君之歲寒莊子云松栢在冬夏青青舊引何敬祖詩在後矣碧海闊逾澄洙曰器宇若碧海十洲記扶桑在碧海之中趙曰以言劉使君之寛量東方朔十洲記東有碧海廣狹浩汗与東海等水不鹹苦正作碧色昔歳文爲理群公價盡增洙曰尚文之丗群公皆馳譽得時其價増趙曰言往時尚文爲治故群公諸儒増價也饒曰言玄宗之丗以文理天下也家聲同令聞鄭曰聞亡運切名達也以令聞爲家聲時論以儒稱洙曰以儒名丗趙曰此言劉使君先丗家聲与公祖杜審言同沐當時士論並以儒稱之帰劉杜氏太后當朝肅洙曰當一作臨多才接迹昇翠虚捎魍魎鄭曰捎所交切洙曰甘泉賦捎䕫魍魎扶橘征羽獵賦曳捎星之旗捎拂也東京賦捎魑魅斯獝狂丹極上鯤鵬洙曰莊子鯤化爲鵬趙曰太后指則天也言弃捐不才如捎魍魎賢者得君如上鵾鵬有九万之翶翔也東京賦捎魍魎而獝狂注云捎殺也師曰翠虚言山林之間捎拂魍魎喻小人逺遁也下句言賢者奮迅於丹霄也宴引春壷满洙曰一作酒趙曰自此言太后朝所寵賜大臣如此詩春酒百壷恩分夏簟冰洙曰錫宣賜冰也江淹夏簟清兮晝不暮蘇曰魏明帝賜許玩黄藤蚪紋簟玉井氷以表優㤙彫章五色筆洙曰江淹夢得五色筆由是文藻日進後有人夢中稱郭璞而取之趙曰彫章之作在紫殿夜宴之時田曰斉䔥慤秋夜賦詩云芙蓉露下落楊柳月中踈髙林以爲斯文彫章間出紫殿九華燈洙曰西京雜記元日燃九華燈於南山上照見百里謝玄暉紫殿粛隂隂學並盧王敏洙曰唐文苑傳盧照隣与楊炯王勃駱賔王以文詞斉名海内稱爲王楊盧駱號爲四傑書偕禇薛能洙曰禇遂良薛稷也褚遂良之書得王逸少之躰稷外祖魏徴家多禇書稷銳意模斈時无及者老兄真不墜小子獨無承洙曰言伯華所斈真不墜古人大躰惟巳無所承於前輩近有風流作聊從月繼徴蘇曰庾凱聞足下近有風流佳客不惜寄雲卧野人顔延年宋郊祀歌月竁來賔月際奉士注云竁窟也一作峽又作月継非趙曰自此下言劉使君之詩也言其詩之風流用對月継則日月相継而徴之舊作月竁竁窟也作月竁則於徴求劉使君之詩全无說矣放蹄知赤驥洙曰列子周穆王有赤驥晁曰喻其才馳騁也捩翅服蒼鷹洙曰捩一作校鸚鵡賦曰蒼鷹鷙而受絀此一對皆言文才俊逸蘇曰盧充曰赤驥失秣駑駘見欺放蹄始知俊逸馬融語友人曰蒼鷹捩翅百禽咸服真儒一言群詞俱挫趙曰兩句言劉使君詩如馬行鷹飛駿疾如此晁曰服其豪迈也卷軸來何晚襟懷庻可慿趙曰卷軸所寄之晚所以怪之而我襟懷所望於詩也㑹期吟諷數益破旅愁凝洙曰疑結也趙曰㑹欲數數吟諷之而用破散旅愁之凝結焉雕刻初誰料洙曰一作解楊子或間彫刻衆形匪天歟曰以其不彫刻也如物刻而彫之焉得力而給諸趙曰言其彫刻之妙誰能輕料之此盖以造化言之也掦子曰如物刻而彫之則天焉得力而給諸纎毫欲自矜趙曰言纎毫皆妙而可矜誇也神融躡飛動田曰列子曰心凝形釋骨肉都融不斍形之所倚足之所履隨風東西戰勝洗侵凌田曰韓子昔云子夏見曽子何肥對曰戰勝故肥曽子曰何謂也對曰吾入見先王之義則榮之出見冨貴又榮之兩者戰於胷中未知勝負故􅋯今先王之義勝故肥也妙取筌蹄棄洙曰易得魚忘筌得兎忘蹄趙曰以詩言之不拘泥髙冝百萬層洙曰言格致髙逺也白頭遺恨在趙曰公之自歎也青竹幾人登洙曰青竹青簡也猶書於青簡者能幾人回首追談笑勞歌跼寢興鄭曰跼渠六切不伸也趙曰以追懷劉使君之談笑故待勞我之歌詠而跼蹐於一寢一門之興也年華紛巳矣丗故莽相仍洙曰嵆康書云丗故繁其慮七不堪也趙曰方遭安史之乱而又有吐蕃之擾則丗故相仍如草莽之多矣刺史諸侯貴洙曰崔方進奏曰古選諸侯賢者以爲州伯今部刺史居牧伯之位秉一州之統請罷刺史置州牧趙曰今日刺史乃古諸侯之貴也郎官列宿應洙曰漢明帝館陶公主爲子求郎帝不許賜錢壹千萬曰夫郎官上應列宿出宰百里非其人民受其殃趙曰公乃尚書工部貟外郎漢明帝云郎官上應列宿故也潘生驂閣逺洙曰一云潘安雲閣逺又潘安仁賦髙閣連雲黄霸璽書増洙曰黄霸爲頴川太守治爲天下第一天子以霸治行終長者又下詔稱揚賜関内侯黄金百斤循吏傳云二千石有治理效者輒報璽書勉勵増秩賜金趙曰專言劉伯華爲太守有政績如黄霸之治頴川以循吏而徴入也鄭曰治行去聲乳贙號攀石鄭曰贙胡畎切洙曰乳虎也趙曰自此而下公自叙之也言乳贙號叫而攀石贙音畎田曰尔雅贙有力注出西海大秦國似狗多力獷惡又音鉉舊注謂乳虎非也饑鼯訴落藤鄭曰鼯訛胡切洙曰蕪城賦階聞􅍪鼯趙曰鼯以訴飢而至於落藤皆道夔州山居事藥囊親道士趙曰以其病之故求服食於道七灰劫問胡僧洙曰武帝穿昆明池悉是灰墨有外國胡道人云此是天地劫灰之餘趙曰以丗故之多形乎憂懼遂有胡僧之問矣慿乆烏皮綻洙曰烏皮几也蘇曰宋明不仕杜門注黄老書孫登惠烏羔皮裏几歲乆慿皆破綻自號守一先生簪稀白帽稜洙曰管寜常著曰㡌趙曰言髮少之故白帽白紗㡌也林居看蟻穴洙曰焦戇易林曰蟻封户穴大雨將集傳物志蟻如將雨蘇曰焦林郊居終日看蟻穴運壤怡然自樂人莫識其意也趙曰閑散之事也野食待魚􅊻洙曰􅊻魚網也筋力交彫䘮飄零免戰兢蘇曰髙翃致仕語弟曰昔居諫省日夕如履氷戦氷今遂飄零幸免此亦佳事也趙曰避免而眼中不見戰伐之事故得免戦戰兢兢之憂懼也皆爲百里宰趙曰言身爲郎官當其時自可以爲百里宰矣正似六安丞夢符曰右按後漢桓譚數言事忤旨出爲六安丞忽忽不樂道病卒趙曰公言房琯無罪忤肅宗遂弃不省之正如桓譚之忤旨也姹女縈新裏鄭曰姹陟駕切洙曰姹神女也善燒煉因而得乗煙仙去或云能點化修可曰漢魏真人參同契曰丹砂木精得金乃并漢眞人大丹訣曰姹女隱在丹砂中注姹女录也以二書考之則姹女非神仙人丹砂冷舊秤洙曰葛洪求爲勾漏令就采丹砂而巳但求椿壽永洙曰莊子曰古有大椿者以八千歳爲春以八千歳爲秋莫慮𣏌天崩洙曰𣏌國人憂天崩墜身无所寄趙曰兩句亦以永長在而巳勿以天尚有崩而不信無長年之效錬骨調情性洙曰文子曰太上養神其次養形張兵撓棘矜鄭曰巨巾切洙曰徐樂傳奮棘矜師古曰棘㦸也矜者棘之杷時秦銷兵器故但有㦸之杷耳養生終自惜伐數必全懲洙曰數一作叛稽康有養生論七發云伐性斧趙曰言養生終日爱惜而時之用兵伐叛必全懲之政術甘踈誕詞埸愧服膺洙曰顔子拳拳服膺趙曰公自謙而言之也以爲不若劉使君也展懷詩頌魯洙曰魯諸侯而有頌德者以德可歌誦也趙曰指言劉使君之政割愛酒如繩洙曰平生所好消渇止之見汝陽王詩注趙曰公自注云左傳有酒如繩咄咄寧書字洙曰丗說殷中軍名浩𬒳廢長安終日甞畫空作字楊州吏人㝷議之竊視唯作咄咄怪事四字而巳冥冥欲避矰洙曰楊子鴻飛冥冥戈人何慕焉江湖多白鳥天地有青蠅洙曰青蠅以喻讒鮑曰與白鷗波浩蕩萬里誰能馴同意指言自適也靑蠅言有讒也修可曰按白鳥有二說一說謂鷗鷺之類詩言白鳥鶴是也喻賢者之㓗白乃弃置江湖之間一說白鳥蛟蚋也以譬則小人言賢者居乱丗欲隱則爲蚊蚋所替欲出則爲青蠅所汚是無逃於天地之間矣趙曰此言在江湖之間天地之内無所逃蚊蠅之害又戴記白鳥者謂蚊蚋也贈王二十四侍御契四十韻往往雖相見蘇曰蘇章曰與子相别往往難得再相見也萬事努力飄飄愧此身不關輕紱冕洙曰冕冠冕也紱朱紱也皆朝服言此身之不仕非輕禄仕也不得志而巳但是避風塵洙曰兵氛也竇融拔起風塵之中趙曰紱綬冕冠也公以左拾遺出爲華州功曹而遂自罷官若輕紱冕者但以風塵之警不得不避亂也一别星橋夜洙曰華陽記李水造七星橋上應七星三移斗柄春洙曰公羊隱元年春王正月注春者天地開閉之端昏斗指東曰春史記攝提者直斗杓所指以建時節也趙曰以志時也斗杓隨時而指東則爲春三移則三年矣敗亡非赤壁洙曰阮元瑜爲曹公作書與孫權曰昔赤壁之役遭罹疫氣燒船自還以避惡也非周瑜水軍所能抑挫也江陵之守物盡榖殫無所復據徒民還師又非瑜之所能敗也馬曰赤壁近江陵尹曰言潼関之敗柄京遂䧟其禍酷烈殆非赤壁之比奔走爲黄巾洙曰後漢靈帝中平元年春鉅鹿人張角自稱黄天其部師有三十六萬皆着黄巾同日反叛安平甘陵人各執其主以應之有頴川黄巾有南陽黄巾張漫成有汝南黄巾有葛陂黄巾有青徐黄巾炎曰黄巾以喻禄山者也子去何蕭灑洙曰孔德璋北山移文䔥灑出塵之想余藏異隱淪洙曰見行歌非隱淪注朋曰甫因奔走避寇遂成隱淪非本志也故曰異隱淪書成無過鴈洙曰蘇武傳昭帝即位數年匈奴与漢和親漢求武等匈奴詭曰武死後漢使復至匈奴常惠請其守者与俱得夜見漢使具自陳道教使者謂單于言漢天子射上林中得鴈足有係帛書言武等在某澤中使者大喜如惠語以責單于單于視左右而驚謝漢使曰武等實在范彦龍詩寄書雲中鴈爲我西北飛衣故有懸鶉洙曰荀子曰子夏貧衣若懸鶉恐懼行裝數鄭曰色角切洙曰孔子歷聘諸侯席不暇暖也蘇曰王敬恐懼行裝數煩遷挈今又避地東南恐臨老无依止之地而巳伶俜卧疾頻洙曰劉公餘卧疾漳蘇曰賈瞻伶俜万里不宜風士頻頻疾作第恐難見太平符曰伶俜失所皃曉鶯工迸淚秋月解傷神洙曰聞鸎而泣見月而傷則公之不得志於時可知矣蘇曰王粲觀秋月懷弟妹故里而傷神趙曰春鶯秋月人所賞翫而鸎所工者在於遊人之涙月所解者在於傷人之神則以亂離疾病之所感也深父曰鶯月可娱之物對此而傷此所以見公之不得志也㑹靣嗟黧黒洙曰泰誓播弃黧老孫炎曰耉靣凍黧色似浮垢也靣色似黧故稱黧老李斯傳二丗責問斯曰禹鑿龍門股無胈脛無毛手足胼胝靣色黧黒趙曰列子載楊朱之語曰靣色黧黒含悽話苦辛洙曰陸機慷慨含辛楚古詩坎軻長苦辛接輿還入楚洙曰論語楚狂接輿鳯兮師曰言甫自蜀適荆衡也王粲不歸秦洙曰謝靈運曰王粲家本秦川貴公子孫遭亂流寓自傷情多詩整裝辝秦川秣馬赴楚壤趙曰王粲秦川貴公子也遭乱流寓公取其不得帰長安故又以王粲爲比師曰自喻不得帰故郷也錦里殘丹竈趙曰以景物明煥錯雜如錦故曰錦里別賦云守丹竈而不顧花溪得釣綸洙曰浣花溪見上注詩其釣維何維絲伊緍注緍綸也趙曰以言前此不在浣花而人往往得之消中祗自惜洙曰消一作霄趙曰公自言也取古人以此消中消渇也司馬相如常有消渇病晚起索誰親洙曰嵆康與山濤書晝卧喜晚起而當閞呼之不置一不堪也趙曰爲况蕭索无親之者又音求索之索言將求誰親我乎亦通以俟明識伏柱聞周史洙曰史記老子周守藏室之吏也而史記周太史儋見秦孝公或曰儋即老子也王康琚詩伯夷竄首陽老聃伏柱史師曰柱史比王公乗槎似漢臣洙曰見查上憶張騫詩注趙曰兩句指言王侍御上句以御史之官故用老子比之老子爲周柱下史下句豈王侍御嘗使吐蕃乎別篇有云魂断使臣鞍查上似張騫鴛鴻不易狎龍虎未冝馴趙曰言王侍御如鴛鴻龍虎之莫能狎馴也客即挂冠至洙曰葛洪挂冠不仕交非傾蓋新洙曰鄒陽傳白頭如新傾蓋如故師曰時公守漠州甫往依之公一見如舊不以甫貧賤爲耻故甫嘆丗之勲貴不易親近比之鴛鴻龍虎而有取於公之傾蓋由來意氣合直取性情真浪跡同生死洙曰亡壽夭也趙曰言共遭亂離而爲友即同生同死也無心耻賤貧洙曰樂窮通也偶然存蔗芋洙曰蜀都賦瓜疇芋區甘蔗辛薑幸各對松筠洙曰歳寒之物也麤飯依他日洙曰公孫洪脫粟飯窮愁怪此辰洙曰虞卿窮愁女長裁褐穩男大卷書勻洙曰四句通義言麤糲之飯依如他日所以窮愁者継以女長男大則昏嫁之事迫矣漰口江如練鄭曰漰普崩切又普氷切洙曰漰口岷江所經也謝玄暉詩澄江靜如練趙曰此巳下言王侍御所居也樂史寰宇記李氷擁江作漰口漰堰在導江縣蠶崖雪似銀洙曰蠶崖閣名在西山也名園當翠巘野棹没靑蘋洙曰宋玉風賦風生於地起於靑蘋之末屢喜王侯宅時邀江海人洙曰邀一作逢趙曰王侯宅普言之而王侍御亦在其中矣江海人公自况也追隨不覺晚洙曰江文通月出照園中冠佩相追隨欵曲動彌旬但使芝蘭秀洙曰謝玄暉少爲叔父安所器重安甞戒約子姪軰曰子弟亦何豫人事而正欲使其佳諸人莫有言者玄荅曰譬如芝蘭玉樹欲使其生於庭堦耳安悅何須棟宇鄰趙曰陶淵明荅龐叅軍四言詩歡心孔洽棟宇惟鄰公居在成都浣花注侍御在導江故有此句也山陽無俗物洙曰向秀字子期与嵆康爲竹林之游作思舊賦云済黄河以泛舟兮經山陽之舊居顔延年向常恃流連何裏游惻愴山陽賦師曰言王門下无俗客也鄭驛正留賔洙曰見置驛嘗如此注趙曰史記鄭莊爲太子舎人嘗置驛馬於長安諸郊請謝賔客夜以継日出入並鞍馬光輝參席珎洙曰參一作忝儒行儒有席上之珎趙曰鮑明逺云鞍馬光照地重遊先主廟洙曰見謁先主廟詩注師曰自此句以下甫又傷嚴武之死朋舊彫䘮今幸遇王侍御礼待之隆可以駐足更歷少城闉洙曰少城張儀城石鏡通幽魄洙曰見石鏡詩注琴臺隱絳唇洙曰文君桃琴心事鮑明逺芜城賦若夫歌堂舞閣之基玉貌絳唇莫不理䰟幽石委骨窮塵趙曰蜀王葬其妃徇以石鏡琴臺則司馬相如弹琴之所送終惟糞土結愛獨荆榛置酒髙林下師曰自此句以下叙甫之依王也觀碁積水濵趙曰此以結上句初以石鏡送終今墓中之人巳糞土矣以琴結夫婦之情今則徒生荆棘矣旣往之事爲可弔則置酒觀碁以遣懷耳區區甘累趼洙曰謂奔走避難故累趼也趙曰趼足瘡也莊子云百舎重趼而不息鄭曰趼古典切胝也稍稍息勞筋洙曰孟子曰劳其筋骨蘇曰秦伯犂㱕永嘉十餘年謝絶人事杜門著書人勸其仕秦曰迩來漸斍耳目清爽勞筋稍息何再爲耶網聚粘圎鯽絲繁煑細蓴洙曰蓴菜也陸雲曰千里蓴羹趙曰此又言㱕成都之樂也網聚則漁者非一人之網耳謂之絲繁以言其多本草云鯽魚合蓴作羹食良長歌敲栁癭洙曰栁癭木之節目如疣鄭曰癭於郢切瘤也小睡凭藤輪洙曰蒲團也以藤爲之蘇曰魯宿有白藤輪嘗凭坐待曉農月須知課田家敢忘勤鄭曰忘无放切浮生難去食洙曰洪範八政一曰食食者万勿之始人之所本良㑹惜清晨洙曰曹子建名都賦雲散還城邑清晨復來還列國兵戈暗今王德教淳要聞除猰㺄鄭曰上烏八下勇主切獸名洙曰揚子雲長楊賦云昔有強秦封豕其士窫其民鑿齒之徒相与磨牙而爭之窫食人之獸修可曰尓雅猰㺄類貙虎牙食人迅走山海經曰少城山有獸狀似牛而赤身人靣馬足名曰窫声如嬰兒則窫自是一獸注引窫證猰㺄非也師曰猰㺄北盗賊當從尓雅說休作畫麒麟洙曰見今代麒麟閣注趙曰但以除猰㺄爲心不必志於閣畫麒麟閣上也洗眼看輕薄洙曰崔宏見長安中多豪家輕薄子曰吾當洗眼見尓曹矣輕薄言交道之不終者蓋公有激而云虚懷任屈伸莫令膠漆地萬古重雷陳洙曰古詩以膠投漆中誰能别離此後漢陳重与同郡雷義同爲㪯辟更相推讓郷里爲之語曰膠漆自爲堅不如雷与陳趙曰公之望王侍御者至矣秋日荆南送石首薛明府辭滿告别奉寄薛尚書頌德叙懷斐然之作三十韻南征爲客乆西候别君初趙曰上句言其在江陵也梁張纉南征賦西候屬西之時候乃秋日也歳滿歸鳬舄洙曰見眞賜還冝出尚方注趙曰鳬舄以薛明府之爲縣令即王喬之乗鳬秋來把鴈書洙曰見雖无南去鴈注趙曰應得其兄尚書之書也鴈書使蘇武事荆門留美化洙曰唐蕭銑屯軍荆門號荆門軍在夷陵鄭曰荆門山名十道志荆門江陵縣郢城縣東南岸有荆門山姜𬒳就離居洙曰續漢書姜肱兄弟三人皆以孝行著名肱年長与二弟共被卧親友如此聞道和親入洙曰見肯慮白登圍注垂名報國餘連枝不日並八座幾時除洙曰見起居八座太夫人注景帝紀注凡言除者除故官就新官趙曰言尚書与薛石首不日相並如木之連理枝也往者胡星孛洙曰胡星旄頭也孛星光芒短其光四出逢逢孛孛然趙曰指言禄山也恭惟漢網踈洙曰漢刑法志禁網踈闊風雲相澒洞鄭曰澒胡孔切洙曰洞簫賦風洪洞而不絶澒相連貌趙曰凡兵乏地謂之風塵淮南于曰未有天地之時鴻濛澒洞莫知其門天地一丘墟洙曰王粲詩崤凾復丘墟趙曰言人民寡而城郭荒矣殿瓦鴛鴦坼洙曰鄴都銅雀臺皆鴛鴦瓦庾信賦昔爲一雙瓦飛入魏王宮趙曰魏文帝問周宣王曰吾夢殿屋兩瓦墜地化爲鴛鴦何也宣對曰後宫當有暴死者帝曰吾詐卿耳宣曰夫夢者意耳苟以形言便占吉凶言未卒黄門令奏宫人相殺宮簾翡翠虚洙曰西京雜記有翡翠簾鉤陳摧徼道洙曰西都賦周以鉤陳之位衛以嚴更之署又周廬千列徼道綺錯槍櫐失儲胥鄭曰櫐力軓切洙曰長楊賦木擁槍櫐以爲儲胥注槍櫐作木槍相櫐爲柵也儲胥銑注武帝先作迎風館於甘泉山後加露寒儲胥二館趙曰上四句以言京師之䧟而宮殿之毀也文物陪廵狩趙曰指言肅宗幸鳯翔也文物陪則言衣冠集於此也親賢病拮据鄭曰拮吉屑切据斤於切趙曰詩云予手拮据注云拮据撠挶也言爲巢之至苫其手病也公時呵猰㺄洙曰猰㺄摩牙而食人定功曰尓雅猰㺄類貙虎牙食人首唱却鯨魚洙曰見上京觀且僵尸注趙曰鯨魚大魚左傳曰取其鯨鯢以爲京觀呵猰㺄却鯨魚以譬却退巨賊之義勢愜宗蕭相洙曰蕭相謂蕭何也國之宗臣材非一范睢洙曰史記載范睢逃魏梁之辱入秦爲相終復魏梁之讎趙曰公自注蓋秦拜范睢爲客卿卒聽其謀使五大夫綰伐魏抜懷其相秦也東伐韓少曲髙平拔之又以其謀縱反間於趙趙以馬服子代廉頗大破趙於長平皆范睢之謀故以比諸將屍塡太行道鄭曰行胡剛切血走浚儀渠洙曰太行山在何北浚儀汴河也滏口師仍㑹鄭曰滏方矩切水名函關憤巳攄趙曰函谷關是巳於是復京師矣紫微臨大角洙曰隋天文志紫微天帝之座也又大角一星在攝提天王座也又名天棟趙曰言肅宗還長安也皇極正乗輿洙曰皇極乗輿輿子輦属趙曰洪範曰建用皇極史曰乗輿返正皇極賞從頻峨冕鄭曰從才用切洙曰僖二十四年傳晉侯賞從亡者殊私再直廬洙曰公自注公舊執金吾新受羽林前後二將軍趙曰直廬則直宿殿廬也豈惟髙衛霍曽是接應徐洙曰衛青霍去病應德璉徐公幹降集飜翔鳯洙曰賈誼賦鳯凰翔于千仞兮覽德輝而下之趙曰言兄弟如鳯之翺翔也追攀絶衆狙洙曰莊子朝三暮四衆狙皆怒侍臣雙宋玉洙曰宋玉楚襄王大夫戰䇿兩穣苴洙曰穰苴有司馬兵法趙曰今以文章言之則文章如雙宋玉以戰䇿言之則武畧如兩穣茸乃所以美薛之兄弟也鑒澈勞懸鏡趙曰公言蒙尚書之鑒照澄澈如鏡之懸也荒蕪巳荷鋤洙曰見上春言終荷鋤注趙曰公自昔從事於翰墨今以荒蕪而乃從事於耕耘矣嚮來披述作洙曰石首處見公新文重此憶吹嘘洙曰見上只待吹嘘送上天注白髮甘凋䘮靑雲亦卷舒經綸功不朽趙曰又以言薛尚書也跋渉體何如洙曰公自注公頃奉使和吐蕃巳見上應訝躭湖橘洙曰潭州有橘洲常餐占野𬞞十年嬰藥餌洙曰見上藥餌扶吾隨所之注萬里狎樵漁揚子淹投閣洙曰見子雲識字終投閣注鄒生惜曵𥚑洙曰鄒陽書何王之問不可曳長𥚑乎趙曰揚子鄒生公以自况也但驚飛熠燿洙曰東山詩熠燿霄行注熠燿燐也燐螢火不記改蟾蜍洙曰謝玄暉詩借問下車日匪直望舒圎張景陽下車如昨日蟾蜍四五圎古詩四五蟾蜍缺三五明月滿趙曰兩句皆以記時之變易也煙雨封巫峽江淮略孟諸洙曰孟諸九澤名云趙曰公追言其舊居也湯池雖險固洙曰金城湯池蘇曰侯本論曰金城湯池雖然險固亦不可恃遼海尚闐淤努力輸肝膽休煩獨起予洙曰起予者商也趙曰時幽燕猶有不順命者矣前漢溝洫志云塡淤反壤之害師古曰塡淤謂壅泥也未句所以激之也師曰師古曰以木擁搶及櫐繩連結以爲儲胥有儲蓄以待所須也薛尚書嘗奉使回紇乞兵以助討故云聞道和親入埀名報國餘文物陪廵守言尚書昔隨玄宗幸蜀親賢病拮据言皇子皆流離辛苦也猰㺄喻盗賊公時唱大義以討賊豈特一范睢相秦但復魏齊之讎乎滏口師仍㑹言公督諸節度兵㑹於滏口收復京師故曰函關憒巳攄皇極正乗與言天子還京也豈惟髙衞霍曽是接應徐德璉徐公幹文士也天子中興非特賞武功且又禮接文儒而公文倍宋玉武過穰首侍帝廟堂子美但荷鋤躬耕而巳故曰荒蕪巳荷鋤遼海尚塡淤言禄山未平故子美未章勉薛尚書爲國立功不獨爲詩以起予也寄彭州髙三十五使君適􅉑州岑二十七長史叅三十韻故人何寂寞洙曰故一作古今我獨凄凉老去才難盡秋來興甚長洙曰潘安仁有秋興賦物情尤可見師曰目有所見則心有所感故云云詞客未能忘洙曰詞客謂髙岑也俱以詩名丗海内知名士雲端各異方洙曰彭在蜀􅉑在山南髙岑殊緩歩沈鮑得同行洙曰沈休文鮑明逺言髙岑可與沈識並驅也意愜關飛動篇終接混茫趙曰以言二子之詩其妙如此沈佺期祭文思合飛動才冠卿雲舉天悲冨駱洙曰冨嘉謩爲文皆以經典爲本時人欽慕文體爲之一變駱賔王嘗作帝京篇當時以爲絶唱近代惜盧王洙曰盧照隣王勃也照隣爲鄧王典籖王重其文待以相如勃六歳能文與兄勔助才相類人謂之王氏三珠樹悲惜各以才不容於丗故也似爾官仍貴前賢命可傷洙曰傷上四人趙曰富謂冨嘉謩駱謂駱賔王盧謂盧照隣王謂王勃盖皆文章之伯而不容於丗以言髙岑二子亦文章而作貴官則比四子爲得志矣諸侯非弃擲半刺巳翶翔洙曰刺史古之諸侯庾亮與郭游書曰别駕與刺史同流王化於萬里任居刺史之半安可非其人也趙曰諸侯以言髙適爲刺史半刺以言岑叅詩好幾時見書成無使將趙曰言公在秦州欲寄書於二公也男兒行處是客子閫身強覊旅推賢聖洙曰孔孟皆覊旅趙曰公自言孔孟皆如此不獨我也沉綿抵咎殃三年猶瘧疾一鬼不銷亡鮑曰公遇王倚詩云瘧癘三秋熟可忍寒熱百日交相戰與此正合三秋謂一在鄜一在華一在秦地趙曰公言其病之沉綿也丗言瘧鬼故云隔日捜脂髓増寒抱雪霜洙曰此言瘧之狀也徒然潜隙地有靦屢鮮粧洙曰俗言辟瘧鬼必伏於幽隙之地不爾即畫容易貌鄭曰靦他典切說文靣見也何太龍鍾極蒼舒曰按廣韻龍鍾竹名丗言龍鍾取此義也謂其年老如竹之枝葉揺曳而不能自禁持也子今出處妨趙曰言病則龍鍾而妨出入也無錢居帝里盡室在邊疆洙曰寓同谷也劉表雖遺恨龐公至死藏洙曰見劉表不得取注趙曰後漢龐公襄陽人也居峴山之南未嘗入城府荆州荆史劉表数延請不能屈竟隱於鹿門山不反心微傍魚鳥魯曰嵆康游山觀魚鳥而心甚樂之肉痩怯豺狼洙曰豺狼類貪暴者蘇曰漢元狩中盗賊屢起州邑割據隱君子往往遭害申舒隱中條山行絜德著謂諸子曰吾肉瘦法衆豺狼蓋言兵戈之際君子不能全其身也工部值禄山亂流離悲怨用此句語故得其趣不假群書證一詩一句足矣隴草蕭蕭白洮雲片片黄彭門劒閣外洙曰劒閣劒関也在蜀定功曰後漢郡國志湔氏道注蜀王夲紀曰縣前有兩石對如關號曰彭門􅉑略鼎湖傍洙曰號有朔城廼鼎湖也夢符曰右按史記黃帝採首山之銅鑄鼎於荆山下鼎成乗龍而升天虢鼎湖此近鼎畧未知孰是又張平子西京賦想乗龍於鼎湖荆玉簪頭冷趙曰荆山之王也爲岑君而言巴牋染翰光洙曰荆玉出􅉑巴牋蜀牋也趙曰爲髙君而言烏麻蒸續曬丹橘露應嘗豈異神仙宅俱兼山水郷竹齋燒藥竈花嶼讀書床更得清新否遥知對屬忙洙曰言吟詩也趙曰言二子才思清新也舊官寧改漢淳俗本歸唐師曰􅉑本晉地詩國風曰此晉也而謂之唐本其風俗憂深思逺乃有堯之遺風焉故云濟丗宜公等安貧亦士常趙曰安貧公自言也蚩尤終戮辱胡羯漫猖狂洙曰史記蚩尤最爲暴黄帝能伐之胡羯安史也㑹待妖氛靜論文暫裹糧洙曰孟子曰行者裹糧言往論文也蘇曰韓裹糧就揚雄學授太元解師曰甫欲冦平裹糧就高共論文章故有末句奉贈蕭二十使君昔在嚴公幕俱爲蜀使臣艱危叅大府前後間清塵洙曰嚴再鎮成都今復叅幕公自注嚴再領成都余復叅幕府趙曰蕭於嚴公𥘉鎮時入幕而公在其再來時遂爲間也起草鳴先路趙曰言蕭自嚴幕而往爲舎人矣唐制舎人凡詔旨制勑璽書冊命皆起草乗槎動要津洙曰見虚乗八月槎注古詩先據要路津趙曰以言其貴也王鳬聊暫出洙曰見逺愧尚方曽賜履注蕭雉只相馴洙曰蕭望之爲郎有雉隨魯恭爲中牟令翟雉馴於桑下趙曰蕭廣齊孝子傳蕭芝至孝除尚書郎有雉數十頭飲啄宿止當上直送至歧路下直入門飛鳴車前舊注引蕭望之惑後學矣終始任安義洙曰前漢任安字少卿爲益州刺史司馬遷書責以古賢臣之義也修可曰前漢衛青爲大將軍霍去病爲驃騎將軍禄秩與大將軍等自是青日衰而去病日益貴故人門下多去事去病輒得官爵惟任安不背去子美詩首云昔在嚴公幕俱爲蜀使臣及有塤篪金石之語元注云嚴公旣没老母在堂使君温清之問若巳之周庭焉及太夫人傾逝又撫孤之情不减骨肉以是考之足以見蕭使君如任安之事衛青有終始之義注引司馬遷責以古賢臣之義非是荒蕪孟母隣聮翩匍匐禮洙曰詩凡民有䘮匍匐救之意氣死生親洙曰公自注云嚴公殁後老母在堂使君温清之問甘脆之禮名数若已之庭闈焉大夫人傾逝䘮事又首諸孫主典撫孤之趙曰所謂一死情不减骨肉則膠􅃮之契可以見矣一生乃見交情也張老存家事洙曰左專晉侯以張老爲中軍司馬趙曰禮記檀弓晉獻文子成室晉大夫發焉張老曰美哉輪焉美哉奐焉歌於斯哭於斯聚國族於斯今公以張老比蕭使君言能存嚴公之家令諸孫奉太夫人䘮事哭於斯聚國族於斯不失其家也嵆康有故人洙曰康臨死謂子曰山公在汝不孤矣食恩慙鹵莽趙曰言蕭使君之心舊食嚴公之恩尚慙報之鹵莽鏤骨抱酸辛趙曰言蕭使君御嚴公之恩銘鏤肌骨常抱酸辛阮嗣宗詩悽愴抱酸辛巢許山林志趙曰公以巢公許由自比也䕫龍廊廟􅎇洙曰巢父許由䕫與龍也趙曰言蕭使君也䕫則典樂之䕫龍則納言之龍如三人之林當在廟堂也舊以爲龍逢誤鵬圖仍矯翼洙曰見泊岳陽樓詩變化有鵾鵬注熊軾且移輪趙曰言蕭使君如大鵬之圖南仍矯奮其翼固當遂晉擢矣而且爲太守故憑熊車以移輪也磊落衣冠地蒼忙土木身洙曰嵆康土木形骸趙曰公自言其身如嵆康而亦在衣冠之列也塤篪鳴自合洙曰詩天之牖民如塤如篪絶交論道恊膠漆志婉変於塤箎金石瑩逾新洙曰文賦𬒳金石而德廣流管絃而日新趙曰於是再与蕭相見如塤箎之合而金石不移所以瑩逾新重憶羅江外鄭曰寰宇記本涪城縣地天宝元年爲羅江縣同遊錦水濵趙曰羅江属綿州錦水則成都也結歡隨過隙蘇曰王陽與子結歡眼隨過隙之駒趙曰莊子曰人生一丗如白駒過隙懷舊益霑巾洙曰陸賈傳君何不交歡太尉深相結潘安仁懷舊賦涕泣流而霑巾曠絶含香舎洙曰見不去非無漢署香注趙曰後漢尚書郎口含雞舌香以其奏事欲使氣芬芳也公爲工部貟外郎而不得坐省所所以爲曠絶稽留伏枕辰洙曰張茂先詩伏枕終遥昔寤言莫予應趙曰詩展轉伏枕停驂雙闕早洙曰謝玄暉停驂我悵望趙曰言不得朝謁而思入朝之士廻鴈五湖春洙曰沈休文旅鴈毎廻翔趙曰言在湘潭之時也張勃吴録五湖者太湖之別名以其周行五百里故名之不逹長卿病洙曰見長卿多病後注趙曰長卿有消渴之疾而公亦同之故自怪其不省解如此從來原憲貧洙曰見奉贈韋左丞詩寜甘原憲貧注監河受貸粟一起轍中鱗洙曰見莊子轍魚事贈李八祕書别三十韻往時中補右扈蹕上元初洙曰扈扈從也蹕鳴蹕也天子之出鳴蹕以淸道後漢輿服志蘭臺令史皆執蹕以督整專驅謂之護駕反氣凌行在洙曰天子所幸謂之行在反氣謂賊未破也妖星下直廬洙曰見収京詩注陸機詩云厭直承明廬六龍瞻漢闕洙曰易時乗六龍蕭何作漢宫闕記萬騎略姚墟洙曰蔡邕獨断曰大駕備千乗万騎王元長曲水序殷殷均乎姚澤帝王丗紀曰瞽捜之妻曰握登生舜於姚墟故得姓氏於姚氏也玄朔廵天歩洙曰廵一作廻詩天歩斯頻神都憶帝車洙曰武后以東都爲神都時天子尚在蜀故言憶後漢輿服志以攜龍角爲帝車一戎纔汗馬洙曰書一戎衣天下大定公孫弘臣愚駑無汗馬之勞師古曰言未嘗從事軍旅也百姓免爲魚洙曰昭元年劉子曰美哉禹功明德逺矣微禹吾其魚乎蘇曰漢中河决蕭望之塞定人曰百姓免此回爲魚事見塞河碑通籍蟠螭印洙曰通籍注籍者爲二尺竹牒記其年紀名字物色懸之宫門案省相應乃得入蟠螭謂印鼻劒上文也晉陽春秋曰重光照洞微上蟠螭文隱起夢符曰右按漢官義天子六璽皆玉螭虎紐也差肩列鳯輿事殊迎代邸洙曰髙帝崩吕産欲危劉氏周勃爲丞相陳平朱虚矦劉章共誅諸吕遂奉天子法駕迎代王於伐邸立爲孝文皇帝喜異賞朱虚洙曰齊哀王弟章入宿衞於漢髙后封爲朱虚侯以吕禄女妻之後吕禄吕産作乱章與太尉周勃丞相平等誅之章乃先斬吕産文帝益封朱虚侯二千戸黄金一千斤冦盗方歸順洙曰歸順歸降納欵乾坤欲晏如洙曰寧静也不才同𥙷衮洙曰謂作拾遺也衮職有闕仲山甫𥙷之奉詔許牽𥚑洙曰魏辛毗字佐治文帝欲徙兾州七家十萬户實河南毗諌帝怒不荅起入毗隨而引其𥚑帝怒良乆乃出曰佐治卿持我何太急耶毗曰今徙旣失人心又巳無食帝遂徙其半鴛鷺叨雲閣洙曰古詩厠迹鴛鷺行謂侍從列也潘安仁髙閣連雲騏驎滯玉除洙曰一作石渠属李祕書也文園多病後洙曰司馬相如傳相如嘗有消渇疾後拜爲孝文園令中散舊交踈洙曰嵆康爲中散飄泊哀相見平生意有餘風煙巫峽逺洙曰煙一作塵臺榭楚宮虚洙曰一作除觸目非論故洙曰阮歩兵詩云物固不可論新文尚起予洙曰語起予者商也清秋凋碧桞别浦落紅蕖消息多旗幟洙曰髙紀張旗幟於山上爲疑兵經過歎里閭洙曰爲䘮乱多凋弊戰連脣齒國洙曰僖五年傳晉侯假道於虞以伐虢宫之竒諌曰􅉑虞之表也􅉑亡虞必從之此所謂輔車相依脣亡齒寒者其虞􅉑之謂軍急羽毛書洙曰魏武帝奏事曰若有急則揷羽於檄謂之羽檄幕府籌頻問洙曰李廣幕下省文書師古曰幕府者以軍幕爲義山家藥正鋤洙曰袐書北卧青城山下台星入朝謁使節有吹嘘西屬災長弭南翁憤始攄對敭抗士卒鄭曰敭余章切洙曰益稷曰時而颺之注颺道揚舉也畢命對揚文武之光命又說命敢對掦天子之休命乾没費倉儲鄭曰乾居寒切洙曰張湯傳湯始爲小吏乾没與長安冨賈田甲魚翁叔之属交私服䖍曰乾没謝成敗也如淳曰豫居物以待之得利爲乾失利爲没勢藉兵須用功無禮忽諸御鞍金騕裊洙曰漢書音義曰騕裊者神馬也赤喙烏身與飛兎同明君有德則至宮硯玉蟾蜍洙曰西京雜記晉靈公冡甚壞壯四角以石爲玃犬捧燭石人男女四十餘皆立侍棺器無復形兆尸猶不壞孔竅中皆有金玉其餘器物皆朽爛不可別惟有玉蟾蜍一枚大如拳腹空容五合水光潤如新玉取以盛其書滴拜舞銀鈎洙曰銀鈎字也猶詔書恩波錦帕舒洙曰西京雜記言袐閣圖書皆表以牙籖覆以錦帕此行非不濟良友昔相於去棹依顔色㳂流想疾徐沉綿疲井臼洙曰馮衍傳兒女常自操井臼倚薄似樵漁乞米煩佳客洙曰乞去聲鄭曰乞云旣切與人物鈔詩聽小胥鄭曰鈔楚交切洙曰小胥小吏也杜陵斜晚照洙曰漢書曰宣帝葬杜陵元紀杜陵在長安南五十里張湯爲御史大夫蕭望之爲前將軍皆徙杜陵也潏水帶寒淤鄭曰潏以律切淤衣居切洙曰潏水名也上林賦豐鎬潦潏杜陵潏水公之故里莫話青溪髮鄭曰在荆州鬼谷子學仙處蕭蕭白映梳蘇曰黄休年老多病素髮映梳燈下不辨蠅頭丗事䟽也奉贈盧五丈叅謀琚鄭曰斤於切洙曰丈人使自江陵在長沙待恩旨先支率錢米恭惟同自出洙曰左傳我之所自出謂我甥也妙選異髙標入幕知孫楚洙曰孫楚子子荆石苞都督揚州事孫楚爲叅軍披襟得鄭僑洙曰鄭僑子産也孔子與爲友趙曰左傳季札聘於鄭見子産如舊相識丈人藉才地趙曰丈人指言廬五叅謀也門閥冠雲霄老矣逢迎拙相於契託饒趙曰言雖衰老拙於逢迎而與盧丈相於所以契託饒縱也賜錢傾府待爭米駐船遥趙曰題注所謂支率錢米也鄰好艱難薄氓心杼軸焦夢符曰右按揚雄方言土作謂之杼木作謂之軸大東小東杼軸其空軸當作柚又後漢劉騊駼書曰杼柚空於公私之求趙曰盧丈使自江陵也蓋當艱難之際杼軸空而民心焦敖則不可多歛以爲隣好之奉也客星空伴使洙曰嚴光也見鈞瀬客星懸注趙曰客星公自謂也伴使以言伴盧之爲使星也舊注引嚴陵事虽是客星兩字而惑乱其義矣寒水不成潮素髮乾埀領鄭曰乾居寒切洙曰秋㒷賦素髮䬃以垂領師曰自言其老矣銀章破在腰洙曰見霧雨銀章濕注蘇曰張嵩清之守莭爲巴西令官滿駕柴車載書數百卷腰垂破銀章辝邑人而去邑人惜其去懇留於隋文帝即日擢爲巴西太守有德政遺愛碑尚在余爲兒童聞先子對客談此說詩能累夜醉酒或連朝洙曰中山有酒一醉千日趙曰公自言也藻翰惟牽率洙曰左傳牽率老夫湖山合動摇蘇曰王逸少清氣壯節揺湖山時清非造次興盡却蕭條天子多恩澤蒼生轉寂寥休傳鹿是馬洙曰趙髙指鹿爲馬莫信鵩爲鴞洙曰見地濕愁飛鵩注又見留别杜貟外注未解依依𬒮還斟汎汎瓢流年疲蟋蟀洙曰詩蟋蟀在堂歲律云暮古詩四時更變化歲暮一何速晨風懷苦心蟋蟀傷局促體物幸鷦鷯洙曰莊子鷦鷯巢林不過一枝文賦體物而瀏湸張茂先作鷦鷯賦辜負滄洲願洙曰謝玄暉詩復叶滄洲趣誰云晚見招蘇曰嵆康云年來名利汩没未遂休閑深負滄洲願心趙曰此公感激之言涵蓄深逺揚雄檄虚賦曰丗有黄公者起於滄洲精神養性與道漂游太冲詩曰馮公豈不偉白首不見招則見招者乃朝廷也李陵云陵雖孤恩漢亦負德孤負本只是孤獨之孤舊作辜負流傳之誤矣師曰前溪朱愽傳齎閥閱詣府師古注曰伐功勞也閱所經歷也車千秋傳曰千秋無伐閱勞注伐積功也閱所經也唐六典以上通用烏頭大門又曰表掲又曰閥閱義謝云表掲閥閱是也俗呼爲檽星門是詩所謂閥閱冠雲霄者盖言盧氏積日積月立功而致表掲髙於雲霄賜錢傾府待爭米駐船揺謂盧丈待恩旨未到先支錢米以民心焦急也寒水不成潮言水淺也峽人以春水生乃行船自素髮以下乃子美自述休傳鹿是馬言天子聦明也莫信鵩如鴞言莫愁迁謫也滄州神仙所居之地也云云贈崔十三評事公輔飄颻西極馬洙曰漢郊祠歌云天馬來西極來自渥洼池洙曰見沙苑行注趙曰言崔公有天馬之妙而所從來之逺也漢郊祠歌曰馬生渥洼水中颯飁定山桂洙曰定一作寒趙曰當作寒山楚辝云桂樹叢兮山之幽此其義也師曰定山當作鄧山鄧林有桂西極馬鄧山桂比崔公之才低徊風雨枝趙曰選詩桂枝生自直不冝低徊今桂所以低回者風雨之故也以譬崔評事之美材而困於邊徼之水官矣彦輔曰飁音習唐韻云颯飁大風也我聞龍正直道屈爾何爲趙曰如龍之直而屈在僚屬故公怪而問之且有元戎命洙曰屈道而起謂有元戎之命悲歌識者知洙曰元戎節度使也以元戎命之而有行役不能無悲歌而惟識者知之官聮辭冗長洙曰文賦固無取乎沉長鄭曰長直亮切多也趙曰崔評事於元戎之僚屬可辝冗長矣師曰時王思禮爲帥表請崔爲幕職故云云冗長不急之務也行路洗欹危洙曰當闢公正之路趙曰以舟行則免欹危之苦也脫劒主人贈洙曰脫解也季札脫劒挂樹以贈徐君趙曰主人指元戎也以劒贈人亦理之常如伍子胥解劒以贈漁父也舊注引季札以劒挂徐君墓上却是贈死者耳可用證此乎去帆春色隨隂沉鐵鳯闕洙曰陸佐公石闕銘蒼龍玄武之制銅爵鐵鳯之工教練羽林兒洙曰宣帝紀羽林孤兒注天有羽林星林諭若林木之盛羽有羽翼􅋧擊之意故以名武官焉百官表取從軍死事者之子養羽林官教以五兵號曰羽林孤兒天子朝侵早雲臺仗數移趙曰言天子多難其朝侵早以兵練卒故所御非一處而移雲臺之仗矣分軍應供給百姓日支離洙曰支離言不親黠吏因封巳公才或守雌洙曰老子知其雄守其雌趙曰封厚也言貪吏乗之以封巳廉吏閔之以柔克也公正美崔公之才守雌柔之道不乗勢刻削以嵆於封己則爲可尚尓燕王買駿骨洙曰燕昭王以金帛市駿骨人知好駿馬不逺千里而來渭老得熊羆洙曰見田獵舊非熊注活國名公在拜壇群盗疑冰壷動瑶碧洙曰鮑昭清如玉壷冰野水失蛟螭黄曰謂㓂賊將就擒也入幕諸彦集洙曰别賦捨金閨之諸彦渇賢髙選冝騫騰坐可致九萬起於斯洙曰見圖南未可料注趙曰方當渇賢而崔君冝應髙選必能騫騰如鵬飛之九萬里矣黄曰言崔奮迅自此始復進出矛㦸昭然開鼎彞洙曰銘功於鼎彜㑹看之子貴歎及老夫衰豈但江曽决洙曰孟子若决江河還思霧一披洙曰衞瓘見樂廣曰若披雲霧覩青天趙曰我豈特平昔與之談論如江河之决當此之時又思一披霧以相見也暗塵生古鏡拂匣照西施舅氏多人物孫曰崔乃子美之舅氏其人物爲丗所重故曰多人物多重也無慙困翮垂趙曰舅氏之家多有好人村必應如我上所言騫騰冨貴之事今日尚尓行役無慙困苦也寄李十四貟外布十二韻洙曰新除司議郎兼萬州别駕雖尚伏枕巳聞理裝名叅漢望苑洙曰漢愽望苑武帝爲戾太子置之使通賔客從其所好職述景題輿洙曰周景爲豫州刺史辟陳蕃爲別駕蕃不就景題别駕輿曰陳仲舉坐也巫峽將之郡荆門好附書趙曰預囑其不相忘也逺行無自苦蘇曰王粲逺行異域無勞自苦事事慎重内熱比何如洙曰内熱言熱中也莊子我其内熱欤正是炎天闊那堪野館踈黄牛平駕浪洙曰黄牛峽名郭景純髙浪駕蓬萊畫鷁上凌虚洙曰謝靈運詩鷁首戲清池修可曰張平子西京賦鷁首注云船頭畫鷁鳥厭水神試待盤渦歇洙曰郭璞江賦盤渦谷轉凌濤山頽趙曰水漲則有盤渦今勸其且休行故曰待盤渦歇方期解纜𥘉洙曰江淹解䌫候前侣還望方鬰陶悶能過小徑自爲摘嘉𬞞洙曰自一作日陶淵明歡言酌春酒摘我園中𬞞趙曰自此巳下約李貟外訪其居也渚桞元幽僻村花不掃除宿隂繁素㮏洙曰潘安仁閑居賦云㮏曜丹白之色過雨亂紅蕖趙曰紅蕖蓮花寂寂夏先晚趙曰以處所幽寂雖夏未晚而此地先晚將似秋矣泠泠風有餘江清心可瑩洙曰郭景純詩前有寒泉井聊可瑩心神竹冷髮堪梳洙曰堪一作宜直作移巾几秋帆發弊廬夢符曰右按春秋左氏張趯謂太叔曰自子之歸也小人糞除先人之弊廬曰子其將來今子皮實來小人失望師曰黄牛峽浪髙與峽齊故云平駕浪畫鷁船也上凌虚謂船逆水而上如凌虚空盤渦言水廻伏如碾碓然甫意欲待峽水稍平穩即解䌫訪李故末章云直作移巾几秋帆發弊廬寄董卿嘉榮十韻聞道君牙帳洙曰曹子建關中詩髙牙乃建牙大旗也兵家書牙旗將軍之旗立於元帥帳前故謂之牙旗防秋近赤霄洙曰謂西山三戍也西山記曰東觀成都若在井底下臨千雪嶺洙曰西山記曰上有積雪經夏不消却背五繩橋洙曰岷江湍急不可爲梁乃以竹䋲爲橋駕虚而渡鄭曰即岷江笮橋海内乆戎服洙曰用兵日乆京師今晏朝洙曰後漢明帝論曰明帝善刑理法令分明日晏坐朝幽枉必逹洙曰以前日用兵之乆而今日罷兵則可以晏朝也犬羊曽爛熳洙曰應劭曰鮮卑隔在漠北犬羊爲群宫闕尚蕭條洙曰孫子荆書四海蕭條非復漢有顔延年宮陛多巢穴城闕生雲煙趙曰以吐蕃爲患之乆故前日嘗䧟京師今尚蕭條也猛將冝甞膽洙曰李陵書猛將如雲越王勾踐反國苦身勞思置膽於坐坐卧即仰膽飲食亦甞膽也曰汝忘㑹稽之恥耶趙曰猛將謂董嘉榮也龍泉必在腰洙曰事見奉送蘇州李長史之任詩三尺獻龍泉注黄圖遭汚辱洙曰天子圖籍也趙曰有三輔黄圖之書言宫殿名號與京畿地理也月窟可焚燒洙曰長楊賦西壓月窟又言月窟雖髙猶可燒之也蘇曰吴術曰大丈夫按劒横行沙塞取月支之首焚其竁窟向區區奔走塵埃中爲掃門兒態耶章炳壯其言薦爲遊擊將軍趙曰指言吐蕃巢穴也㑹取干戈利趙曰此戒董卿之辝干戈利則書敿乃干榖乃戈之義無令斥候驕洙曰西域傳斥候百人五分之夜擊刀斗自衞趙曰無令其驕則號令嚴肅也候斥兵家探候也居然雙捕虜洙曰後漢丗祖建武四年拜馬武捕虜將軍顯宗𥘉西羗寇隴西覆軍殺將朝廷患之復拜武捕虜將軍自是一嫖姚洙曰霍去病爲嫖姚校尉落日思輕騎蘇曰何斌輕騎數百轉戦至日暮斬馘擒酋首趙曰史有云輕騎襲之秋天憶射鵰洙曰李廣時爲上郡太守匈奴侵上郡上使中貴人從廣勒習兵擊匈奴中貴人者將十騎從見匈奴三人與戦射傷中貴人殺其騎且尽中貴人走廣廣曰是必射鵰者廣乃從百騎往馳三人三人亡馬歩行行數里廣令其騎張左右翼而廣自射彼三人者殺得二人生得一人果匈奴射鵰者修可曰北史斛律金子光見一大禽射之正中其頸形如車輪而下乃鵰也邢子髙歎曰此射鵰手也人號爲落鵰都督是詩寄董嘉榮而元注引李廣傳匈奴射鵰非是雲臺畫形像洙曰見雲臺終日畫往皆爲掃氛妖洙曰掃氛妖言能静患乱也趙曰所以激昂董卿也漢雲臺畫二十八將之像以其有功氛妖也移居公安敬贈衛大郎鈞衞侯不易得余病汝知之雅量涵髙逺魯曰袁宏三國名臣賛淵哉大𥘉宇量髙雅淸襟照等夷尹曰袁􅙾荅儉詩云老夫亦何寄之子照淸襟清氣溢素襟彦輔曰夷平也謂平交也平生感意氣趙曰言意氣之感也少小愛文辭蘇曰羊欣少小爱筆研文辝名公多竒之河海由來合風雲若有期洙曰河出崑崙千里一曲九曲入海古詩風雲若遇㑹形容勞宇宙洙曰陶潜寓形宇宙復幾時趙曰言憔悴而空老於丗質朴謝軒墀趙曰言無復仕於朝廷自古幽人泣洙曰易幽人貞吉流年壯士悲蘇曰文選流年苒苒壯士悲感水煙通徑草秋露接園葵洙曰陸士衡園葵詩種葵北園中零露垂鮮澤趙曰述其移居於公安之地也入邑豺狼鬪洙曰見上豺狼在邑龍在野注趙曰以比盗賊也言入邑之豺狼以有所爭而相闘也傷弓鳥雀饑洙曰何晏似傷弓之鳥飢亦不敢自喙趙曰言傷弓之鳥以創病而飢也以比窮困之民白頭供宴語趙曰白頭公自謂也供宴語可以供衛公之語也烏几伴棲遲趙曰烏皮几也言迁於公安唯有烏几爲伴耳交態遭輕薄洙曰古詩五陵輕薄兒今朝豁所思分門集註杜工部詩卷第十八, WYG: ''}
