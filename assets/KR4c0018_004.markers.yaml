  - {type: variant, offset: 6, length: 19534, content: 部詩卷第四山嶽古詩三首律詩三首望嶽岱宗夫洙曰書岱宗泰山爲四岳所宗風俗通云泰山山之尊者一曰岱宗岱始也宗長也萬物之始隂陽交代爲五岳之長鄭曰岱宗泰山也今屬兖州升中告代于此是山爲五岳之長故曰岱宗師曰岱宗朱猶云楚天之類徐曰按王原叔吕居仁王彦輔魯訔諸本並作夫獨師本作天字說如何齊魯靑未了師曰㤗山跨齊魯兩國之境眺望其山之靑巳窮齊魯而其山未窮故曰靑未了造化鍾神秀洙曰晉孫興公孫遊天台賦序天台者蓋山岳之神秀也陳書虎丘山者呉之神秀魯曰劉禹錫言九華山爲造化一尤物師曰鍾聚也詩云崧髙維岳維岳降神凡名山大川皆有神異天地造化鍾聚神秀之氣于此隂陽割昏曉趙曰言其山之長大如史記言崑崙日月所相避隱爲光明也割字輔曰杜言此爲造化所鍾不割之割割者分也彦蔽腐也師曰割者分也隂陽日月也此山旣髙日月迭昏曉也盪胸生曽雲鄭曰盪他浪切曽昨陵切經也經過之雲洙曰公羊曰觸石而岀膚寸而台不崇朝而徧天下者泰山之雲也張衡南都賦㳙水盪其胷陳張種與沈炯書虎丘山者吴之神秀也趙曰盪滌也舊注引南都賦㳙水盪其胷本言水流如盪滌地之胸今言盪胷生曽雲則借言雲之潤氣盪滌人胷也陸機文賦有曽雲之峻注曽積也彦輔曰庾肩吾山詩曽雲霾峻嶺師曰曽雲杜詩通作層即雲勢之重疊而起泰山出雲須臾遍太虛而爲雨以其有功於民故祀之雲生于山人登山故雲盪其胸决眥入歸鳥鄭曰眥前智切目眥夢符曰右按子虚賦稱射藝之妙所中者必决裂其目眥也杜子美望嶽以言觀覽之逺攄决其目力入飛鳥之羣與射了無相干明矣趙曰眥目睫也音墻細切按子虚賦本言射而决裂獸眥詩人取好字穩則借用之蓋决眥入歸鳥則人目眥决裂入鳥之歸處言所望之逺也王逢原曰眥目眥也歸鳥入林决去其眥乃能辨之蓋言山髙若此㑹當凌絶頂一覽衆山小洙曰孟子曰孔子登東山而小魯登太山而小天下揚子升東嶽而知衆山之迤邐也漢官儀及泰山盤道屈曲上凡五十餘盤經小天門大天門如從穴中視天䆫也師曰登臨山之絶頂俯視衆山其培塿歟衆山知尊乎大岳衆流知宗乎滄海當安史之亂僣稱尊號天子蒙塵其朝宗之義爲如何甫望嶽之作未章云一覽衆山小固知安史之徒乃培塿之細者又何足以上抗巖巖之大也哉望嶽南岳配朱鳥秩禮自百王洙曰五月南巡狩至于南岳衡山釋山又云霍山爲南岳衡之與霍皆一山有兩名南岳本自以兩山爲名非從近來也而學者多以霍山不得爲南岳又云漢武帝來始乃名之斯不然矣衡山一名霍山言萬物霍而大也應劭曰風俗通曰岳者稱考功徳黜陟之故謂之岳四方皆有七宿名成形東方成龍形西方成虎形皆南首而北尾南方成鳥形北方成龜形皆西首而東尾以南方之宿象鳥故謂之朱鳥七宿也書望于山川注諸侯境内名山大川如其秩次望祭之故五岳牲禮視三公四瀆視諸矦其餘視子男趙曰荊州記曰衡山者五岳之南岳也今云配朱鳥者朱鳥南方之宿也秩則尚書咸秩無文之秩秩者等也所講五岳視三公四瀆視諸侯是巳等秩之禮其來乆矣故云自百玉歘吸領地靈洙曰地之百靈顔延年詩邑社揔地靈趙曰江文通雜擬詩歘吸鵾雞悲注云猶俄傾也鴻洞半炎方邦家用祀典趙曰王褒四子講徳論洪洞㓪天言天地之神光洪洞相通明㓪於天也在徳非馨香洙曰五岳皆載祀典廵守何寂寥有虞今則亡洙曰自戰國縱横而廵守之禮亡矣有虞虞舜也謂五年一廵狩洎吾隘丗網行邁越瀟湘洙曰隘言丗網所拘迫也行邁猶行役也趙曰公之所以行邁者以丗網隘窄故欲曠懷於江湖之上也渴日絶壁出趙曰難逢日霽以望其峯於日如渴也蓋如渴雨之渴漾舟淸光旁祝融五峯尊峯峯次低昻紫蓋獨不朝爭長嶫相望洙曰祝融峯名也朱陵祝融紫蓋石􅌲芙蓉所謂五峯也爭長言相峙而立有如爭長也趙曰考衡山記有芙蓉峯紫蓋峯石門峯而韓退之詩曰紫蓋連延接天柱石廪騰擲堆祝融則又有天柱峯祝融峯爲五峯舊注以朱陵𥙷之非也恭聞魏夫人羣仙夾翶翔洙曰魏夫人神仙也主衡山夢符曰右按眞告南岳夫人與弟子言東岳上眞卿司命君等左二十二眞人坐西起南向東行太和靈嬪上眞太夫人右十五女眞東坐北起南行上眞司命南岳夫人即魏夫人也田曰夫人諱華存字賢安晉司徒舒之女也㓜純讀書喜神仙其後四仙人降車從鮮盛夫人旣與仙者遊盡傳其秘術咸和八年終壽八十二舊說以謂夫人實不死以杖代尸而升天扶桑大帝君授夫人靑瓊之板丹録之文治南岳有時五峯氣散風如飛霜牽迫限脩途未暇杖崇崗洙曰言爲行邁拘限未暇䇿杖而登崇崗也歸來覬命駕沐浴休玉堂三歎問府主曷以賛我皇牲璧忍衰俗神其思降祥洙曰忍都賦文王對霤石室相距注皆何人所居又云王堂府主所居也故有三嘆之問謂丗乱俗薄祀典闕而舉欲賛之於是帝崇牲璧則神必降祥於此矣師曰衰乱之俗廢祀典而不舉今甫欲以牲璧礼神庶使岳神賛翊吾君而降福祥矣丈人山洙曰青城山記云此山爲五岳之長故名丈人有丈人觀自爲青城客沈曰玄中記蜀郡靑城山有洞穴爲三道西此通崑崙茅君傳青城十洞天之一也不唾青城地趙曰唾地者有所惡而唾也元魏爾朱榮乎毁匿名書唾地曰云云是也不唾其地所以敬之也又陳徐陵作玉臺新詠載劉勲妻王雜詩云千里不唾井况乃昔所奉爲愛丈人山丹梯近幽意洙曰謝玄暉敬亭山詩要欲返竒趣即此陵丹梯靈運躧歩陵丹梯丈人祠西佳氣濃洙曰陶潜山氣日夕佳後漢欝欝葱葱氣佳哉縁雲擬住最髙峯洙曰靈光殿賦飛陛住孽縁雲上征掃除白髮黃精在洙曰出說黃精乆服反老爲少君看他時氷雪容洙曰莊子肌膚若氷雪望岳西岳崚嶒洙曰一云稜危竦處尊洙曰華岳也諸峯羅立洙曰一作列似兒孫洙曰言序列而不敢與岳爭長安得仙人九節杖洙曰仙人有九節杖笻杖亦九節蘇曰列仙傳玉烈魯授赤城老人九節蒼藤竹柱杖行地馬不能追拄到玉女洗頭盆洙曰玉女洗頭盆因山形而爲名蘇曰三峯記華山雲臺上有石盆可容水數斛明瑩如玉上有古篆字人莫識俗呼爲玉女洗頭盆修可曰集神録明望玉女者居華山服玉漿白日昇天中頂白龜其廣數畒髙三仞其側有梯磴逹皆見玉女祠祠前有白石曰號玉女洗頭盆其中水色碧緑澄徹雨不加益旱不加耗秦曰張衡思玄賦云載太華兮召洛浦之宓妃即明皇玉女也車箱入谷無歸洙曰一作回路師曰箱乃車所盛載之所也箭栝通天有一門師曰言神仙之門難入也箭栝其竇至小稍待秋風凉冷後髙㝷白帝問眞源洙曰白帝西方之帝趙曰言白帝則華岳乃西方之鎭也梁孝儀和昭明太子鍾山講解詩云降道訪眞源白鹽山卓立羣峯外蟠根積水邊他皆任厚地爾獨近髙天白牓千家邑趙曰言縣額以白爲牌耳清秋萬古船詞人取佳句刻畫竟難傳趙曰欲以佳句專詠白鹽之狀雖加刻畫終難傳播所以重言於難措辭也天寳初南曹小司㓂舅於我太夫人堂下累土爲山一匱盈尺以代彼朽木承諸焚香瓷甌甌甚安矣旁植慈竹蓋兹數峯嶔岑嬋姢宛有塵外數致乃不知興之所至而作是詩一匱功盈尺洙曰論語子曰譬如爲山未成一匱注匱土籠也盈尺一尺而巳三峯意出羣洙曰猶華岳之三峯也趙曰華山記有云其三峯直上晴霽可睹舊注云直云猶華岳之三峯非是望中疑在野幽處欲生雲慈竹春隂覆香爐暁勢分洙曰廬山有香爐峯惟南將獻壽洙曰詩如南山之壽佳氣日氛氲師曰陸機本草䟽云南方生子母竹今慈竹是也又謂之孝竹漢章帝三年子母竹生白虎殿前時謂之孝竹羣臣作孝竹頌子美此詩序云累土爲山代彼朽木承諸焚香瓷甌非謂廬山香爐峯也江河陂池溪潭附古詩九首律詩十二首三川觀水漲二十韻鮑曰天寳十五載乙亥禄山䧟京師公徒歩避宼鄜州三川縣有是詩時七月也我經華原來不復見平陸洙曰華原屬京兆郡後魏置北雍州西魏改爲宜州又置北池郡㝷改爲通川郡武德𥘉復置通州罷郡北上惟土山連天走窮谷火雲無時出飛電常在目洙曰一云出無時趙曰夏雲謂之火雲魯曰隋慮思道納凉賦云陽風淟其長扇火雲赫而四舉也自多窮岫雨行潦相豗蹙鄭曰上呼回切相擊也洙曰海賦磊匒匌而相豗蓊匌川氣黃鄭曰上音烏下口荅切又音溘匝也趙曰蓊匌則氣之翁欝羣流㑹空曲淸晨望髙浪忽謂隂崖踣鄭曰蒲北切洙曰郭璞詩髙浪駕蓬萊趙曰長笛賦云惟鍾籠之竒生兮于終南之隂崖恐泥竄蛟龍鄭曰泥乃計切登危聚麋鹿洙曰海賦云狐玃登危而雍容枯查卷拔樹礧磈鄭曰查士街切礧洛罪磈口罪切不平也共充塞聲吹鬼神下趙曰礧磈石也聲吹言其聲之吼勢閱人代速不有萬穴歸何以尊四瀆洙曰海賦江河旣道萬穴俱流薛曰右按爾雅江河淮濟是爲四瀆者發源而注海者也趙曰公詩作於離亂之中意在衆所歸往以尊王也及觀泉源漲反懼江海覆漂沙拆岸去鄭曰漂匹妙切浮也洙曰海賦飄沙礐石蕩􅠞島濵漱壑松栢秃洙曰海賦漱壑生角選沈液潄陳根乗凌破山門廻斡到地軸洙曰春秋括地象云地有三千六百之軸海賦狀如天輪膠戾而激轉又似地軸挺抜而爭廻交洛赴洪河及關豈信宿應沉數州没如聽萬室哭洙曰江賦滈汗六州之域穢濁殊未淸風濤怒猶蓄洙曰海賦於是鼔怒溢浪揚浮江賦乃鼔怒而作濤何時通舟車洙曰漢武筭及舟車昱曰記中庸云舟車所通蓋言德之所及者逺而原叔以筭及舟車釋之非矣師曰南北阻隔舟車不通而云何時者厭亂願治之辭也隂氣不黲黷鄭曰上千敢下徒卜切垢黒也趙曰何時得水落而舟車可通且隂氣開㓪而不黲黷選有上慘下黷浮生有蕩汨吾道正覊束人寰難容身趙曰舞鶴賦歸人寰之喧卑師曰謂當兵革擾攘吾道拘而不得騁武夫悍卒正得志之秋人寰難容身天地雖大若無所往石壁滑側足雲雷屯不巳艱險路更跼鄭曰渠玉切促也普天無川梁欲濟願水縮洙曰魏文帝雜詩欲濟河无梁謝玄暉江漢恨無梁陸機詩怨彼河無梁引領望大川因悲中林士未脫衆魚腹洙曰詩肅肅兎置施於中林王康琚反招隱今雖盛明丗能無中林士屈原荅漁父云寧赴湘流葬於江魚腹中舉頭向蒼天安得騎鴻鵠趙曰陸士衡擬西北有髙樓云思駕歸鴻羽奉同郭給事湯東靈湫作東山氣濛鴻宫殿居上頭趙曰東山驪山也在長安之東北望雲陽悉見山阜之形而恒若雲霧之中故云氣濛鴻君來必十月樹羽臨九州洙曰湯泉温泉也山上有宫殿天寳中甞以十月幸之樹羽立羽葆蓋也趙曰言温湯也長安志云開元後玄宗毎嵗十月幸温湯歲盡而歸詩崇牙樹羽彦輔曰立葆羽也江淹詩有云君王澹以思樹羽望楚城隂火煑玉泉噴薄漲巖幽洙曰温泉也海賦陽水不冶隂火潜然修可曰博物志云凡水源有硫黃其泉則温故云隂火有時浴赤日光抱空中樓洙曰山海經大荒之中暘谷上有扶桑十日所浴又曰有七子名曰羲和浴日於甘泉又曰日拂于扶桑岀於暘谷浴于咸池閬風入轍跡曠原洙曰一作野延冥搜洙曰大人賦登閬風而遥集莊子廣莫之野廣原崑崙東北脚名也覺範曰神異經崑崙三角北曰閬風巔西曰玄圃臺北曰崑崙宫趙曰崑崙一名閬風其義則周穆王欲車轍馬迹遍天下之意謂之欲冥搜蓋言乗輿自驪山而出若將訪崑崙而遊廣原也沸洙曰一作拂天萬乗動觀水百丈湫洙曰前漢郊祀志湫淵祀朝那注水清澈可愛不容穢濁龍之所居趙曰鮑明逺蕪城賦歌吹沸天言其聲之多幽靈新洙曰一作靈湫新可佳王命官屬休初聞龍用壯洙曰大壯九三小人用壯擘石摧林丘洙曰郭縁生述征記巨靈擘開華山謝惠連詩落雪洒林丘中夜窟宅改移因風雨秋趙曰窟穴改而移天台山賦序靈仙之所窟宅倒懸瑶池影洙曰漢郊祀志谷永云登遐倒景覽觀縣圃浮遊蓬萊如淳曰在日月之上反從下照故其景倒大人賦貫列缺之倒景孫綽天台賦或倒景於重溟張協七命云倒景而開軒海賦瑰琦之所窟宅廣稚曰景在下曰倒景趙曰此以狀湫之深廣險激公詩又於過麗山之下曰瑶池氣鬱律舊注引到景以證倒懸非是屈注蒼江流味如甘露漿揮弄滑且柔翠旗淡偃蹇洙曰九歌靈旗偃蹇兮姣服又蹇將憺兮夀宫枚乗七發旌旗偃蹇相如建翠華之旗注以翠羽爲旗上葆也大人賦掉指橋以偃蹇又云蜩蟉偃蹇趙曰蒼江當作滄謝眺詩結軫靑郊路廻暾滄江流揮弄岀郭璞賦揮弄灑珠滑且柔取周禮柔而滑雲車紛少留薛曰右按楚詞東皇太一曰靈偃蹇兮姣服又大司命曰乗回風兮載雲旗二章屈原之所作也簫鼔蕩四溟洙曰漢武帝簫鼓鳴兮發棹謳顔延年笳鼓震𬈑州異香泱漭浮鄭曰泱烏㓪切漭模㓪切洙曰木玄虚海賦泱漭泞七啓入乎泱漭之野謝玄暉晨光復泱􅐯張平子泱漭無疆劉伶泱漭望舒隱蛟人獻微一作徴綃洙曰呉都賦泉室潛織而卷綃注云鮫人織輕綃於泉室出以賣之趙曰蛟人水居南海之外有之善織綃見海賊曾祝沈豪牛魯曰穆天子傳賜文山之民豪牛豪馬百祥奔盛明洙曰書作善降之百祥古先莫能儔坡陁金蝦蟆魯曰相如哀二丗賦登陂陁之長阪岀見蓋有由曽曰小說有人夜見林中光属天上如月迹而眎之有一金背蝦蟆趙曰唐五行志有載蝦蟆色如金者或云驪山上有古碑載之矣至尊顧之笑王母不遣一作肯收洙曰大人賦吾乃今日覩西王母暠然白首載勝而穴処兮亦幸有三足烏爲之使張揖曰西王母其狀如人豹尾虎首蓬髪暠然白首烏三足靑鳥也主爲西王母取食在崑崙山之北復歸虚無底化作長黃虬一作龍與虬飄飄靑璅郞洙曰漢武帝說相如大人賦飄飄有凌雲氣初秦漢别給事黃門之職後漢併爲一官故有給事黃門侍郞掌從左右給事中使開通中外及諸王朝見於殿上引王就坐日暮入對靑瑣門拜故謂之夕郎宫闕簿曰靑瑣門在南宫衞瓘注呉都賦曰靑瑣户邊靑鏤也范雲寺有云攝官靑瑣門文采珊瑚鈎洙曰西域傳罽賔囯岀珊瑚本草云生海底枝何狀明潤如紅玉蘇曰相如見枚叔文謂友人曰如珊瑚之鈎璠輿之器非丗間尋常所見也趙曰以明潤如玉故比人之文采也珊瑚鈎出纂典記載嵩岳嫁女事云周穆王把酒請王母歌以珊瑚鈎擊盆而歌師曰郭給事能爲文章如珊瑚之可貴浩歌緑水曲淸絶聽者愁洙曰盧湛俯澡緑水馬季長笛賦中取度於白雪緑水注二曲名嵇叔夜琴賦𥘉渉緑水中奏淸徴張翰吊賈生賦敢不敬吊寄之緑水蘇曰元温月下聞笛其声淸絶同舟数人倚墻聽乆愁思浩然師曰緑水即伯牙髙山流水之音後丗製爲法曲名曰緑水言給事歌寺淸雅絶倫聽者愁莫能及也終又叙給事文章收功之意渼陂行趙曰渼音美士大夫非西人者多讀爲于亮切乃蕩漾之漾遂使鬻書一本直作漾陂行深誤斈者按長安志渼陂在鄠縣西十道志云陂魚甚美因名之岑參兄弟皆好奇携我逺來游渼陂師曰揚雄言馬遷好竒蓋遷之性好周游天下今岑參兄弟携我來游渼陂豈非若遷之好竒也天地黤慘忽異色洙曰王粲登樓賦天慘慘而無色波濤萬頃堆瑠璃洙曰西域傳罽賔出琉璃孟康曰琉璃靑色如玉師古曰魏略云大秦囯出赤白黒黃青緑縹紺紅紫十種琉璃孟言靑色不愽通也此蓋自然之物也蘇曰王筠詩曰扁舟泛西池衝破碧琉璃庾升見此稱賞乆之琉璃漫汗泛舟入洙曰張平子賦布濩漫汗梁簡文池水淨琉璃趙曰後漢黃叔度汪汪如万頃陂也堆琉璃言其色之靑瑩耳水如瑠璃則爲可愛可以泛舟矣事殊興極憂思集鼉作鯨吞不復知蘇曰徐陵江行鯨鯢湧波鼉蛟作浪鄭曰鼉徙河切說文曰水蟲似蜥蝪而長大惡風白浪何嗟及洙曰詩中谷有蓷啜其泣矣何嗟及矣張季膺詩謳吟何嗟及主人錦帆相爲開洙曰隋煬帝以錦爲帆修可曰陳隂鏗渡靑草湖詩曰平湖錦帆張舟子喜甚無氛埃洙曰詩招招舟子郭璞江賦舟子於是搦棹涉人於是檥榜趙曰沈休文詩夜静㓕氛埃无氛埃則又倣魏都賦風无纎埃也前以天地黤慘而遊者憂今以无氛埃而憂者喜不亦冝乎鳬鷖散亂棹謳發洙曰班固西都賦鳥則鳬鷖鳩鴈朝發河海夕宿江漢沈浮往來雲集霧散又櫂女謳鼓吹震漢武秋風辭簫鼓鳴兮發棹歌絲管啁啾空翠來趙曰公使漢武帝秋風辝簫鼔鳴兮發棹歌也啁竹包切說文啁嘐也又楚辝曰鵾雞啁􅑜而悲鳴棹歌發則喧矣故鳬鷖驚而散亂空翠來則晴矣故絲管乾而啁啾沉竿續蔓深莫測菱葉荷花靜如拭宛在中流渤澥淸洙曰詩蒹葭宛在水中央楊子渤海之島蘇曰按述文東海之别有渤澥故來与海其稱渤海下歸無極終南黒半陂巳南純浸山動影裊窕冲融間洙曰木玄虚海賦冲融滉瀁船舷瞑戞雲際寺舷胡田切瞑莫定切洙曰宋謝靈運石門巖上宿詩瞑還雲際宿孫綽山銘飛宇雲際郭璞江賦詠採菱以扣舷舷脣也水面月出藍田關趙曰雲際山名在鄠縣東南有大定寺監田關在監田縣東南船舷之戛可聞於雲際之寺月出之所可想其當於藍田關皆以陂之廣大然也舊注引謝霊運詩瞑還雲際宿以其字相犯便妄引以惑斈者此時驪龍亦吐珠洙曰莊子列御㓂人有見宋王者錫車十乗以其十乗驕稺莊子曰河上有家貧持葦蕭而食者其子没於淵得千金之珠其父謂其子曰取石來鍜之夫千金之珠必在九重之淵而驪龍頷下子能得珠者必遭其睡也使驪龍而寤子尚奚微之有哉今宋囯之深非直九重之淵也宋王之猛非直驪龍也子能得車者必遭其睡也使宋王而寤子爲韲粉矣馮夷擊鼓羣龍趣洙曰謝惠連雪賦馮夷剖蚌列明珠注馮夷河伯也曹子建洛神賦馮夷鳴鼓女媧清歌大人賦使霊媧鼓琴而舞馮夷莊子大宗師馮夷得之以游大川釋文司馬云清冷傳曰馮夷華隂潼郷隄首人也服八石得水仙是爲河伯又一云以八月庚子浴於河而溺死一云渡河溺死湘妃漢女出歌舞洙曰曹子建神女賦從南湘之二妃携漢濵之游女鄭曰舜二妃堯女娥皇女英以舜南廵不反自沉湘而死故曰湘妃漢女漢上游女金支翠旗光有無洙曰前漢禮樂志金支秀華庶旌翠旌張晏曰金支百二十支秀華中主有華豔也文頴曰柝羽爲旌翠羽爲之也臣瓉曰樂上衆飾有流遡羽葆以金爲支其首敷散若草木之秀華也師古日瓉說是司馬相如曰建翠華之旗梁元帝檄文建翠鳳之旗北齊祖孝徴翠旗臨塞道咫尺但愁雷雨至蒼茫不曉神靈意洙曰漢郊祀歌靈之車結玄雲靈之来先以雨九歌云雲容容兮在下又東風飄兮神靈雨趙曰蒼茫荒寂之貌已具前篇舊注引歌靈之車來沉而非是少壯幾時奈老何向來哀樂何其多洙曰漢武秋風辭歡樂極少哀情多少壯幾時兮奈老何趙曰秋風辭歡樂極兮哀情多少壯幾時兮奈考何謂之哀樂何其多則此一日之間𥘉至以天地黤慘而愁旣而晴無氛埃則可以縱游而樂也朋曰君子遇憂則憂遇樂則樂俯仰屈伸任運而巳詩家體格其抑揚頓挫大㮣若此首叙鼉作鯨吞之可憂中叙鳬鷖菱荷與夫湘妃漢女之樂末嘆哀樂相半故曰向來哀樂何其多凡遣辭命意常以此爲法也渼陂西南臺髙臺面蒼陂六月風日冷朋曰六月此臺獨冷以水氣通人也蒹葭離披去天水相與永洙曰謝靈運云雲日相輝映空水共澄鮮趙曰詩蒹葭蒼蒼其物則陂岸有之矣易有天與水違行訟相與字多矣如長笛賦乃相與集乎其庭懷新目似擊洙曰謝靈運詩懷新道轉逈㝷異景不延莊子田子方篇仲尼見温伯雪子目擊而道存接要一作接惡鄭曰要於消切心巳領洙曰陶潜詩醒醉還相笑發言各不領仿像識鮫人洙曰搜神記南海之外有鮫人水居如魚不廢緝績其人能泣珠海賦仿像其色又其垠則有天琛水怪鮫人之室郭璞鮫人搆館乎懸流曹植弄珠蚌戯鮫人空蒙辨魚艇洙曰廣雅曰舡二百斛以下曰艇其形徑艇一人二人所乗行也趙曰鮫水南海之外有之泣則成珠善織綃仿像識鮫人言其深廣若有鮫人在其中也空蒙出謝玄暉朝雨詩空濛如薄霧言若無而空若有而濛也蒙即濛字錯磨終南翠顚倒白閣影洙曰終南白閣並山名終南五經要義云終南山長安南山也一名太一漢書曰太一山古文以爲終南山潘岳關中記曰其山一名中南言在天之中都之南故曰中南毛詩亦云終南周之名山中南也福地記云其山東接驪山太華西連太白隴山北去長安八十里南入楚塞連蜀東西諸山周回數百里名曰福地辛氏三秦記長安西可二百里南山石室名曰地肺可避洪水秦時四皓亦隱於此山崷崒增光輝洙曰一作隂西都賦嚴峻崷崒鄭曰崷自秋切山峻皃乗凌惜俄頃洙曰謝靈運詩恒充俄頃用勞生愧嚴鄭洙曰嚴陵鄭子眞也嵇叔夜幽憤詩仰慕嚴鄭樂道閑居蘇日嵇中散芳生蹤跡甚愧嚴陵子眞耶修可曰嚴甚冥乆幽而不改其操鄭子眞不屈其志耕於巖石之下外物慕張邴洙曰張良邴原也謝靈運詩偶與張邴合乆欲還東山趙曰張良貴極願弃人間事邴曼容免官養志自脩丗復輕驊騮吾甘雜鼃黽鄭曰上烏蝸切下音泯趙曰重漢丗不我知而輕驊騮之駿則欲隱居於陂上焉倪曰范蠡曰吾先君魚鼈之與處其鼃黽之與同渚公詩句之意謂此知歸俗可忽取適一作足事莫並趙曰言知所歸宿則丗俗可忽取適於巳則凡事無可得而並身退豈待官洙曰謝靈運辭滿豈多秩謝病不待年老來苦便靜趙曰蓋言身欲求退不必待於爲官之後舊注引謝病不待年混亂之矣老子功成名遂身退天之道便静字出謝靈運云拙疾相倚薄還得靜者便便音平聲况資菱芡足鄭曰芡巨險切說文云雞頭也方言曰南楚謂之雞頭北燕謂之之䓈靑徐淮泗謂之芡䓈䓈營隻切庶結茅茨逈鄭曰茨疾資切從此具扁舟彌年逐淸景趙曰菱菱角也芡雞頭也皆陂中可食之物也范蠡乗扁舟泛五湖南池崢嶸巴閬間所向盡山谷希聲曰巴閬蜀中二州也巴閬間山多險阻故云云安知有蒼池萬頃浸坤軸余日張華博物志曰崑崙東北地轉下有八玄幽都方二十餘萬里地下有四柱廣十萬里地有三千六百軸互相牽也呀然閬城南昱曰呀虚加切張口貌枕作控帶巴江腹芰荷入異縣粳稻共比屋洙曰堯比屋可封皇天不無意美利戒止足髙田失西成此物頗豐熟淸源多衆魚逺岸冨喬木蘇曰郭元澤近舎溪岸有磻石可坐卧兼喬木蔽日時曳履投竿不知塵事獨歎楓香林春時好顔色南有漢王祠終朝走巫祝歌舞散靈衣洙曰潘安仁寡婦賦伯神宇之寥寥瞻靈衣之披披荒哉舊風谷髙堂亦明王魂魄猶正直不應空陂上縹緲親酒食滛祀自古昔趙曰左傳非所祭而祭名曰滛祀非唯一川瀆干戈浩茫茫地僻傷極目洙曰楚詞目極千里傷春心平生江海興遭亂身局促洙曰沈休文纓佩空爲忝江海事多違古詩蟋蟀傷局促趙曰漢景帝局促如轅下駒駐馬問漁舟躊躇慰羈束蘇曰邢元駐馬立江中借問漁舟客征戰何時停我亦卜林宅師曰鬼神非其族類不歆其祀自古淫祀媚神徼福者多矣豈特此一川瀆而巳哉有道之丗鬼神無所施其靈響甫傷丗亂而祀典不舉固有淫邪之祭則云干戈浩茫茫地僻傷極目局促不得騁之貌漁舟泛泛煙波之上得以自由甫謂平生有五湖之興今羈束亂丗而不得騁是以駐馬問漁舟而少有所慰者也萬丈潭同俗縣作靑溪合冥寞神物有顯晦趙曰謝莊詩靑溪如委黛神物指言龍也有顯有晦許愼所謂能幽能明者也晉劉琬賦曰大哉龍之爲德變化屈伸隱則黃泉出則升雲龍依積水蟠窟壓一作厭萬丈內洙曰天台賦臨萬丈之絶冥張景陽流澗萬餘丈跼歩凌垠堮洙曰西京賦靈囿之中前後无有垠堮淮南子出於無垠堮之門跼渠六切堮逆各切側身下煙靄前臨洪濤寛却立蒼石大山危一徑盡岸絶兩壁對削成根虚無洙曰顔延年踐華因削成倒影垂澹瀩洙曰一作頼天台賦序或倒影於重溟蒼舒曰右按前漢郊祀谷永曰丗有仙人服食不終之藥乗興輕舉陟遐倒景覧觀縣圃浮遊蓬萊耕耘五徳朝種暮穫與山石無極注如淳曰在日月之上反從下照故其景倒鄭曰瀩徒對反澹沲也水帶沙往來貌黒知洙曰一作又如灣澴底洙曰澴音還淸見光烱碎孤雲到來深飛鳥不在外髙蘿成帷洙曰一作帳幄洙曰陸士衡宻葉成翠幄天台賦踐莓苔之滑石搏壁立之翠屏䕃樛木之長蘿援葛藩之飛莖寒木壘旌斾修可曰康協終南行楓丹杉碧壘旌立斾逺川曲通流嵌竇潜洩瀬鄭曰嵌工衘切造幽無人境洙曰天台賦卒踐無人之境發興自我軰告歸遺恨多將老斯遊最閉藏脩鱗蟄出入巨石礙何事炎天過快意風雨㑹洙曰雨一作雲泛溪落景下髙堂進舟泛廻溪洙曰謝靈運詩對嶺林廻溪誰謂築居小洙曰謝靈運詩躡險築幽居未盡喬木西洙曰詩南有喬木逺郊信荒僻秋色有餘凄練練峯上雪馬曰練練白皃也纎纎雲表霓童戲左右岸洙曰岸一云峯一云兒童戲左右謝靈運海鷗戲春岸趙曰上言西山峯上之雪承秋色之後而言雪則西山謂之雪山江淹麗色賦云色練練而欲奪梁書呉筠詩練練波中月皆取白之義師曰童戲甫之子宗文宗武也罟弋畢提携翻倒荷芰亂指揮逕路迷洙曰謝靈運連嵓覺路塞密竹使逕迷來人忘新術去子感故蹊趙日莊子曰畢弋多鳥亂於上網罟多魚亂於下網罟以取魚畢弋以取鳥今謂畢提携者乃是畢盡之畢也以言兒戲至尽携網罟畢弋以取魚鳥師曰恐小兒之迷道故指揮之得魚巳割鱗採藕不洗泥人情逐鮮美物賤事巳一作迹睽趙曰龍陽君以得魚棄前魚爲恩奪而泣者也公因目前實事起意以雖小兒猶如好新而厭故也師曰開元中物賤今兵火以來百物踊貴與向者巳睽異矣吾村靄暝姿程曰言日巳黒矣異舎雞亦棲蕭條欲何適洙曰沈休文蕭條何所欲出處庶可齊衣上見新月霜中登故畦濁醪自初熟東城多鼔鼙蘇曰應璩過温水見孟嘉問曰何適嘉曰欲歸東城濁酒狂歌度此疲耳璩曰今狼虎滿野鼓鼙聲多我軰無措毛足矣古詩云暮出城東路鼔鼙愁殺人趙曰此言濁酒幸自初熟可以俱冝安郊村之興况東城之多鼔聲乎濁醪出魏都賦淸酤如濟濁醪如河師曰東城多鼔鼙言禄山亂范陽溪漲當時淙花橋溪水纔尺餘白石一作月明可把洙曰艶歌行云水清石自見趙曰水之淸淺而石可見也詩白石鑿鑿水中有行車洙曰華陽風俗録浣花亭在州之西南有江流至淸之所也其淺可涉故中有行車甫有宅在焉秋夏忽沉溢豈唯入吾廬洙曰莊子秋水時至百川灌河陶潜吾亦愛吾廬蛟龍亦狼狽况是鼈與魚洙日七發說濤云其旁作而奔起也六駕蛟龍附從大白又云横暴之極魚鼈失勢趙曰狼與狽本二獸名半其躰相附而行苟失其一則無據矣故倉皇失據者謂之狼狽師曰蛟龍喻君子魚鼈喻小人兹晨巳半落歸路跬歩踈馬嘶未敢動趙日跬音丘弭反舉一足也與蹞同荀子云不積跬歩無以致千里逢原曰半歩曰跬前有深填淤衣虚切田曰前漢溝洫志云填於反壤之害顔師古曰填淤謂壅泥也師曰君子遇險而止此處亂世之道也青青屋東麻散亂床上書穌曰陳璋亂後歸中條與兄琳書曰䆫牖網蜘蛛凡案蒙塵床書散亂鄰里零替惘然不聊生意不意逺山雨夜來復何如我遊都市間晚憇必村墟趙曰言晝日遊成都市晚必憇意於村墟村墟指言草堂也乃知乆行客終日思其居太平寺泉眼招提慿髙岡洙曰見巳從招提遊注趙曰招提佛寺也西天謂寺爲招提踈散連草莽洙曰景帝紀廣薦草莽草稠曰薦深曰莽出泉枯柳根汲引歳月古石間一作門見海眼趙曰成都記云石笋之下是海眼孫曰成都府城西門外道傍有石笋蜀人言天以鎭海眼北泉從石中而出亦如海眼天畔縈水府歐曰小說潤州爲中源水府修可曰張纉南征賦曽潭水府廣深丈尺間宴息敢輕侮靑白二小蛇幽姿可時覩如絲氣或上爛熳爲雲雨洙曰公羊傳曰觸石而出膚寸而合不崇朝而徧天下者太山之雲也山頭到山下鑿井不盡土取供十方僧香美勝牛乳北風起寒文弱藻舒翠縷舒一作勝明涵客衣淨細蕩林影趣何當宅下流餘潤通藥圃三春濕黃精一食生毛羽洙曰嵇康書又聞道士遺言餌木黃精令人乆壽意甚信之黃曰神農本草黃精乆服輕身延年日華子云黃精九蒸九曝食之駐顔秦曰博物志云天姥謂黃帝曰太陽之草名黃精餌之長生太隂之草名鉤物入口立死人信鉤之殺人不信黃精之益壽不亦惑乎真誥云衡山中有學道者張禮正治明期二人禮正以漢末在山中服黃精顔色丁壯常如年四十時後乗雲升天今在方諸飈室爲上仙趙曰鑿井自山頭至山下皆石而巳不能窮盡至有七處也鑿井之難如此而得泉眼爲可美也聲驅灔澦深一作沉未辭添霧雨趙曰江海不讓衆流以爲大雖霧雨之微亦可添益其流接上遇洙曰一作過衣襟趙曰舟中之人接於其人則先經過於衣襟間也此是微雨而作實其其事耳瞿塘兩崖三峽傳何處雙崖壯此門入天猶石色趙曰雨靣壁立而髙挿天穿水忽雲根趙曰雲根亦以言石傳云五岳之雲觸石而出其後唐人多使雲根字以名石猱玃鬚髯古鄭曰玃俱縛切搏也蛟龍窟宅尊洙曰江賦瑰竒之所窟宅羲和冬馭洙曰一作驂近洙曰天台賦羲和亭午愁畏日車飜趙曰淮南子注云日乗車駕以立龍羲和爲之馭公以山之髙故日去之近然冬日景短故畏其車飜去李尤歌曰安得猛士飜日車瞿塘懷古新添鄭曰寰宇記䕫州瞿塘在州東一里西南萬壑注勍敵兩崖開地與山根裂江從月窟來削成當白帝洙日蜀魚復縣公孫述更名白帝自後爲重鎮空曲隱陽臺䟽鑿功雖美洙曰郭景純江賦巴東之峽夏后䟽鑿陶鈞力大哉灔澦堆巨石水中央洙曰蒹霞宛在水中央江寒岀水長沉牛荅雲雨洙曰楚俗祈而獲雨必沉牛以荅神貺如馬戒舟航洙曰丗說灔澦如馬瞿塘莫下言其險絶蘇曰三巴録灔澦如象舟船莫上灔澦如馬舟船莫下長年三老常以此候之張華詩云象馬誠可驗波神亦露機永叔以爲絶唱有包蓄之法天意存傾覆神功接混茫洙曰莊子繕性古之人在混茫之中與一丗而得澹漠焉干戈連解纜行止憶垂堂洙曰袁盎傳千金之子坐不垂堂百金之子立不倚衡師古曰言冨人之子則自愛也垂堂謂坐堂外邊恐墯也趙曰干戈之変解纜之危二者相連可不愼乎灔澦灔澦旣没孤根深洙曰灔澦如馬瞿塘莫下灔澦如象瞿塘莫上此峽人以灔澦爲水候也旣没則尤漲不可下矣夢符曰右按古樂府灔澦作淫澦其詞曰淫澦大如服瞿塘不可觸金沙浮轉多桂浦忌經過西來水多愁太隂洙曰言隂氣太盛也江天漠漠鳥飛去風雨時時龍一吟舟人漁子謌廻首洙曰海賦府人漁子江賦蘆又漁子趙曰龍吟未必可聞而水之深積想其如此矣估客胡商淚滿襟蘇曰南海有烈婦夫戰死行哀水畔胡商賈客見之皆泣下遂投水而死今有廟焉劉非熊作記予親見灔澦趙曰以水之令漲不行則滯留行則憂心傾沉之患此所以泣也寄語舟航惡年少休翻鹽井撗洙曰一作擲鄭曰撗户孟切不以理也黃金洙曰蜀都家有鹽井之泉渡江春江不可渡蘇曰河記曰春江桃花泛漲吾弟舟重不可迅渡恐風浪驚兒女軰二月巳風濤洙曰顔延年云春江莊風濤蘭野茂荑英尹曰顔詩正此之謂也舟楫斜欹疾洙曰一作甚魚龍偃卧髙趙曰以水漲爲使也渚花張素錦汀草亂靑𫀆趙曰非時白花如素錦而巳着一兼字可推見其意古詩靑袍似春草戲問垂綸客悠悠見汝曹洙曰見一作是巴西驛亭觀江漲呈竇使君新添宿雨南江漲波濤亂逺峯孤亭凌噴薄洙曰見直氣森噴薄注萬井逼春容趙曰記注春容謂重繫鍾也今公借言水若繫鍾之狀霄漢愁髙鳥黃曰鳥愁言不得其食泥沙困老龍蘇曰吴漢老龍失势暫困泥沙天邉同客舎携我豁心胷又一首轉驚波作怒即恐岸隨流頼有杯中物還同海上鷗黃日列子海上人好鷗鳥其父欲取玩之明日之海上鷗鳥舞而不下關心小剡縣傍眼見楊州爲接情人飲朝來減片愁又呈竇使君新添向晚波微緑連空岸脚靑日兼春有暮愁與醉無醒漂泊猶盃酒踟蹰此驛亭相看萬里别同是一浮萍江漲江發蠻夷漲洙曰蜀水之源皆出夷地山添雨雪流大聲吹地轉洙曰海賦又似地軸拔挺而爭廻髙浪蹴天浮洙曰海賦浮天無岸游仙詩髙浪駕蓬萊魚鼈爲人得蛟龍不自謀洙曰七發横暴之極魚鼈失勢輕帆好去便吾道付滄洲洙曰公以道之不行故有乗桴之意江漲江漲柴門外兒童報急流蘇曰李栩居淫水上讀書謝絶賔客一日滻漲兒童報曰急流至栩怡然自若整卷几上書徐徐而岀人皆服其量下牀髙數尺倚杖没中洲趙云鮑明逺詩倚扶牧雞豚細動迎風鷰輕摇逐浪鷗漁人縈小楫容易抜洙曰跋一作捩船頭臨邑舎弟書至苦雨黃河泛溢隄防之患簿領所憂因寄此詩用寛其意二儀積風雨百谷漏波濤洙曰老子江海爲百谷王聞道洪河拆遥連滄海髙職司憂悄悄洙曰謂當職司水之官郡國訴嗷嗷洙曰嗷嗷声也舎弟卑棲邑洙曰仇覽爲主簿人謂之栖鵉於荆棘言位職卑下防川領簿曹洙曰堤防也尺書前日至洙曰韓信傳咫尺之書版築不時操洙曰以版築夾土而築也書得傳說於版築之間難假黿鼉力洙曰江淹方駕以黿鼉爲梁趙曰以謂无是物爲橋梁也紀年曰周穆王三十七年東至于九江此黿鼉以爲橋梁舊注所引不知本始空瞻烏鵲毛洙曰淮南子烏鵲填河燕南吹畎畒濟上没蓬蒿洙曰泛濫至於燕南済上皆漂没也螺蚌滿近郭蛟螭乗九臯洙曰泛溢故螺蚌在陸蛟螭在霄漢徐關深水府碣石小秋毫洙曰徐關碣石皆池名書碣石入于海張天斍曰徐關尽成水府碣石山爲水所没其細如秋毫白屋留孤樹靑天洙曰一作雲失萬艘趙曰白屋巳漂矣唯孤樹存焉下句言万艘乗漲速去於靑天長逺之間頃刻之中望之若失矣吾衰同泛梗利渉想蟠桃洙曰山海經曰東海有山名度索山有大桃屈盤三千里名曰蟠桃趙曰蟠桃正在斉地東海度索山故因水漲可以渉舟望之也倚頼洙曰一作却天涯釣猶能掣巨鼇洙曰龍伯囯大人一釣六鼇趙曰列子言龍伯之國人一舉釣六鼇師曰甫意以此職司大手又能治河邑之所恃頼也故云云天池天池馬不到洙曰天池山上池也嵐壁鳥纔通蘇曰宋玉望岳詩嵐壁立萬仞鳥逕人莫通百頃靑雲杪曽波白石中洙曰楚辭眇視目層波詩白石磷磷鬱紆騰秀氣洙曰陸士衡紆欎游子情蕭瑟浸寒空直對巫山岀洙曰一作峽兼疑夏禹功魚龍開闢有趙曰言其所有之最逺菱芡古今同洙曰一作豐聞道奔雷黒趙曰選賦有云電檄雷奔初看浴日紅洙曰日出於暘谷浴於咸池飄零神女雨洙曰髙唐賦暮爲行雨斷續楚王風洙曰宋玉賦楚㐮王㳺於雲臺之宫有風颯然而至王乃披襟而當之昱曰文選風賦雲臺作蘭臺欲問支機石如臨獻寳宫洙曰見自從献寳朝何宗九秋驚鴈序洙曰曹子建丹唇含九秋南都結九秋之增傷萬里狎漁翁洙曰一作樵童蘇曰黃覇休官求隱人問其故覇曰吾欲拏輕舟適浩蕩狎漁翁与鷗尔更是無人處誅勞任薄躬趙曰公自言其身以引末句雖无人之処可以下居其誅鉏草茅之勞任責於微薄之躬也登白馬潭水生春纜没洙曰呉志孫權傳注權爲牋与曹公說春水方生公宜速去又諸葛瑾傳注呉録曰曹操圍朱然於江陵瑾以大兵救之及春水生潘璋等作水城於上流瑾進攻浮橋眞等退走瑾乃全師日出野船開宿鳥行猶去花叢笑不來人人傷白首處處接金盃莫道新知要趙曰言爲新知之所要也楚詞云樂莫樂於新相知南征且未迴洙曰宋玉招魂泪吾南征屈平離騷曰済沅湘以南征就重華而陳辭都邑古詩二首律詩三十五首閬山歌鄭曰閬音浪閬州城東靈山洙曰一云雪山白閬州城北玉臺碧洙曰靈山玉臺皆閬山景也松浮欲盡不盡雲江動將崩巳一作未崩石那知根無鬼神㑹巳覺氣與嵩華敵趙曰此言靈山玉臺也潘岳晉武誄有等壽嵩華中原格鬪且未歸應結茅齋看靑壁洙曰兩相敵曰格鬪師曰靈山玉臺皆閬州風景五岳西曰華山中曰嵩山凡名山大川鬼神之所扶持此山雖不與五岳之數安知鬼神不㑹於是甫愛閬中山水謂中原盗賊未平且暫居于此其後蜀中亂遂之呉楚閬水歌嘉陵江色何所似洙曰嘉陵江源出散關而入于閬趙曰使謝安石內集問諸子曰白雪紛紛何所似石黛碧玉相因依正憐日破浪花出趙曰阮籍寒鳥相因依日出正照水也更復春從沙際歸趙曰費昶雜詞云春隨楊柳㱕巴童蕩槳欹側過薛曰古按廣韻槳檝屬趙曰所以揺檝之處古歌云艇子打兩槳者扶兩檝而夾也水雞衘魚來去飛閬中勝事可腸斷蘇日劉表曰故郷勝事使人臨風對月回腸欲断閬州城南天下稀洙曰閬州城南有山極秀麗人謂之錦屏山師曰地里志閬州閬中郡城臨閬水却據連崗嘉陵江源岀散關而谷流于閬其山水之色逺視如黛玉之相因依日照浪花春媚沙際殊可人意巴人善操舟嘉陵岀美魚詩所謂南有嘉魚是也水雞衘魚來去飛蓋言魚多也城南有曰屏山錯麗如錦屏號爲天下第一故云閬州城南天下稀本朝前軰嘗詠福唐詩云曉角吹殘十二枝春風樓閣酒旗飛桂陵未識三山好却道閬城天下稀蓋閩蜀同風故也建都十二韻彦輔曰建都以蜀爲南京也置尹比二京鮑曰寶應元年嵗次壬寅公年五十一在成都建卯月辛亥建五都以京兆府爲上都河南府爲東都鳯翔府爲西都江陵府爲南都太原府爲北都故有是詩蒼生未蘇息洙曰蒼生百姓也書海隅蒼生未蘇息言尚困于盗賊胡馬半乾坤洙曰半天下也議在雲臺上洙曰後漢議功於雲臺誰扶黃屋尊洙曰黃屋天子車蓋此指言誰爲安王室者建都分魏闕下詔闢荆門恐失東人望其如西極存洙曰東人謂關中父老也時明皇在蜀故云西極時危當雪耻洙曰洗雪也耻囯耻也孟子梁惠王曰寡人耻之願比死者一洗之計大豈輕論雖倚三階正洙曰東方朔傳云願陳㤗堦六符應劭曰㤗堦天之三階也上階爲天子中階爲諸侯公卿大夫下階爲士庶人三階平則是謂太平天下大安終愁萬國翻洙曰翻謂翻覆也牽𥚑恨不死洙曰魏文帝欲遷冀州上以實河南辛毗諌帝不荅而起毗引其𥚑漏網辱殊恩洙曰前漢刑法志網漏吞舟之魚永負漢庭哭洙曰賈誼傳可爲慟哭遥憐湘水魂洙曰屈原沉湘窮冬客江劒隨事有田園風斷靑蒲節霜埋翠竹根衣冠空穰穰關輔乆一作逺昬昬洙曰穰穰衆多皃言衣冠雖多不濟危難故曰空史記貨殖傳天下穰穰皆爲利往願枉一作唯駐長安日光暉照北原江陵望幸洙曰望車駕臨幸也時大駕在蜀雄都元壯麗洙曰曹子建壯哉佳麗殊百城髙紀上見宫室壯麗怒蕭何曰非壯麗不足重威望幸歘威神洙曰魯靈光殿賦景福乎帝室之威神又云彰聖主之威神甘泉賦配帝宫之懸圃兮象太一之威神趙曰顔延年車駕幸京口云望幸傾五州也歘音許勿反注云有所吹起也地利西通蜀趙曰江自西而來舟車所通故謂之西江天文北照秦定功曰謂長安在荊渚之北風煙含越鳥洙曰謝玄暉詩風煙有鳥路江漢恨无梁古詩越鳥巢南枝舟楫控吳人未枉周王駕洙曰顔延年車駕幸京口詩虞風載帝狩夏諺頌王游春方動震駕望幸傾五州又周御窮轍迹夏載歷山川周王駕謂穆王滿終期漢武廵洙曰漢武行幸雍幸汾隂滎陽還至洛陽瞻望河洛廵狩預州甲兵分聖旨蘇曰羊祜得聖旨來分甲兵西北防秋趙曰言車罵之出則禁兵隨衛居守付宗臣洙曰蕭何漢之宗臣左傳君行則居守蘇曰趙勝大事付宗臣議論早發雲臺杖㤙波起涸鱗洙曰哀江南賦猶有雲臺之仗涸鱗見餘波期救涸注莊子車轍中有鮒魚峽隘聞說江陵府洙曰荆州也雲沙靜眇然白魚如切玉朱橘不論錢水有逺湖樹人今何處船趙曰言江陵府以水言之在逺在湖逺之樹而所謂欲往江陵之人其船今在何處乃公自言也靑山若在眼却望峽中天趙曰若巫之靑山在眼仰望峽中之天矣意謂峽山兩立才能見其天也巳秦州雜詩十七首居仁曰同作二十首二首見寺觀門一首見馬門鄭曰寰宇記魏初中分隴右為秦州師曰甫論房琯事貶華州司功屬關輔飢棄官去客秦州遂有此作滿目悲生事因人作逺遊師曰因琯有此逰也遲迴度隴怯鄭曰十道志隴州有隴山浩蕩及洙曰一作入關愁水落魚龍夜洙曰秦有魚龍川蘇曰倦遊録云隴州地各魚龍岀石魚掘地破石得之多鰍鯽之形鱗鬛皆具狀如描畫魚龍古之陂澤也豈非魚生其中山頽塞乆而上凝為石遂留形迹耳此詩正謂隴川也沈曰太平御覽載水絰注有一水出天水縣西山人謂小隴山其水出五色魚俗以爲龍而莫敢捕謂是水爲魚龍水山空鳥䑕秋洙曰禹貢所謂鳥鼠同穴者是矣鳥䑕谷名鄭曰孔安囯注鳥䑕共爲雌雄同穴而處西征問烽火心折此淹留洙曰别賦心折骨驚蘇曰王戎非吾願在此淹留毎想故園風物客心將折趟曰時有吐蕃之亂州圖領同谷驛道出流沙洙曰同谷縣名流沙地名鄭曰寰宇記成州禹貢梁州之域古西夷地天寳元年改爲同谷郡流沙西域地降虜兼千帳鄭曰降胡江切居人有萬家馬驕珠汙落趙曰傳玄乗輿馬賦流汗如珠胡舞白蹄斜洙曰蹄一作題夢符曰石按南史裴子野傳時西北逺邊有白題入貢莫知所出子野曰漢頴隂侯斬白題一人服䖍曰白題胡名也年少臨洮子鄭曰洮徒刀切洙曰一作至臨洮郡名西來亦自誇師曰臨洮通羗胡其人驍勇善戰願隨王師擊賊故云云鼔角縁邊郡趙曰此篇詠鼓角也川原欲夜時秋聽殷地發彦輔曰殷盛也風散入雲悲趙曰言當秋欲近之景則聞鼔角為可傷矣抱葉寒蟬靜歸山獨鳥遲蘇曰古詩有夕鳥背山遲有㱕林孤鳥遲何敬祖倦鳥山林遲工部頒得換骨法逸曰獨鳥失羣之鳥甫自喻也萬方洙曰一作年聲一槩趙曰時東有安史之亂西有吐蕃之擾故曰聲一槩吾道竟何之洙曰戎馬之際天下皆有鼔角聲人方以武事為急吾道何所施蘇曰盧玄萬方鼙鼔之聲一槩吾軰復之何地但死趙曰孔子云吾道非耶莊子芒乎何之城上胡笳奏山邊漢節歸趙曰言用兵以禦吐蕃也使蘇武恃漢節事言通使於吐蕃尔防河赴滄海奉詔發金徽蒼舒曰右按續唐通典羈縻州有金徽州隷振武軍也趙曰防河之士自金徽而發也鄭曰舎徽隴右地名士苦形骸黒趙曰言士卒勞苦之故旌踈鳥獸稀趙曰旌字一本作林那堪徃來戍恨解鄴城圍洙曰鄴城史思明所據恨解圍者言士苦於征戍而恨賊之未平也趙曰西邊旣苦吐蕃之戰而鄴城史賊猶未平則戍役疲於住所以恨也莽莽萬重山孤城山一作石谷間無風雲出塞不夜月臨關趙曰今秦州有無風塞不夜城蓋亦後人因杜詩而爲之名也田曰齊地記曰齊地有不夜城蓋古者有日夜中照於東境故萊子立此城以不夜爲名師曰云不夜蓋取月明如晝也屬國歸何晚洙曰蘇武㱕漢爲典屬囯樓蘭斬未還洙曰傳介子傳先是龜兹樓蘭嘗殺漢使者介子特節使誅斬樓蘭王安歸首懸之北闕以直報怨不煩師衆其封介子爲義陽侯煙塵一洙曰一作獨長望衰颯正摧顔洙曰一作催聞道㝷源使從天此路回洙曰張騫㝷河源趙曰時遣使吐蕃云尋源使則借張騫以爲官牽牛去幾許洙曰博物志昔有人乗查泛河忽忽不知晝夜至一處多見織女有一丈夫牽牛渚次飲之歸問嚴君平君平曰某日客星犯牛女宛馬至今來朱曰見宛馬惣肥春苜蓿注逸曰宛馬每入貢置牧監于此一望幽燕隔何時郡國開洙曰時幽燕在賊境郡囯未安寧東征健兒盡羗笛暮吹哀洙曰士多死亡哀憤氣形於羗笛今日明人眼臨池好驛亭叢篁低地碧髙柳半天靑洙曰叢篁低地髙栁半天是亦傷君子沉下位也公之命意多有如此者趙曰此實道其景非譏誚也師曰竹有節喻君子柳質柔脆望秋先零喻小人稠疊多幽事洙曰稠疊猶重疊蘇曰陶竺幽居春來事亦稠兼眼前兒女惱人喧呼閱使星洙曰時亂民喜見使者故喧呼晉志流星天使後漢李郃指使星以視二使趙曰指言往來使上蕃者老夫如有此不異在郊埛趙曰老夫若有此亭景則如在郊埛矣雲氣接崑崙蘇曰黄河記云雲氣浩漫逺接崑崙涔涔塞雨繁鄭曰涔鋤簮切羗童看渭水趙曰言吐蕃之兵窺覷渭水使客向河源洙曰張騫秦使西域㝷黃河源師曰此句甫自比也煙火軍中幕牛羊嶺上村所居秋草静正閉小蓬門蕭蕭古塞冷漠漠秋風洙曰一作雲低黃鵠翅垂雨蒼舒曰右按文選黃鵠一逺則千里顧徘徊蒼鷹飢啄泥洙曰亦自傷也薊門誰自北漢將獨征西趙曰薊門指安史言收復燕薊者誰也征西則指言討吐蕃漢有征西將軍不意書生耳薛曰南史沈慶之曰耕當問奴織當問婢今欲伐囯而欲與白靣書生軰謀事何由濟臨衰厭洙曰一作見鼔鼙洙曰後漢皆有征西將軍鄭曰駢述切正作聲萬古仇池穴鄭曰在成州潜通小有天洙曰丗說仇池有地穴通小有洞中出神魚食之者仙蘇曰趙徳鱗曰仇池小有洞天之附庸也王仲至謂余曰吾甞奉使過仇池有九十九泉石万山環之可以避丗如桃源鮑曰按唐志成州同谷縣有仇池與秦城接壌修可曰引茅君傳大天之內有玄中洞三十六所第一王屋山之洞周回万里名曰小有清虚之天神魚人不見福地語眞傳洙曰仙經有福地鎭地皆以各山或洞府爲之夢符曰右按道書有三十六洞天七十二福地眞誥曰金陵者洞墟之膏腴句曲之福地履之者萬方知之者无一內經福地志曰伏龍之地在栁谷之西金壇之右可以髙洒金陵之福地也近接西南境長懷十九泉師曰甫有卜居之意故云云何時一茅屋送老白雲邊未暇泛滄海悠悠兵馬間塞門風落木洙曰一云塞風衰落木客舎雨連山阮籍行多興洙曰見遂令阮籍等注龐公隱不還洙曰見昔者龐徳公注東柯遂洙曰一作放踈懶洙曰東柯上詩所謂東柯谷者是也休鑷鬢毛班師曰南史欝林王年五歳戯髙帝傍帝令左右鑷白髪問王我誰耶荅曰太翁帝笑謂左右曰豈有爲人作曾祖而抜白髪乎即擲鏡鑷子曰道不行乗浮浮于海東柯好崖谷不與衆峯羣落日邀雙鳥覺範曰落日喻暮年邀双鳥言欲與妻子隱居于此晴天卷洙曰一作養片雲野人吟險絶水竹㑹平分採藥吾將老童兒未遣聞邊秋隂易夕不復辨晨光洙曰鮑昭詩曉星正寥落晨光復泱漭簷雨亂淋幔山雲低度墙蘇曰公宙過友人舎問其墻低友人曰使山雲易度耳鸕鷀窺淺井鄭曰水鳥不卵生口吐其鶵正作鶿上落胡下疾之切師曰喻細民飢而无食蚯蚓上深堂洙曰深一作髙鸕鷀窺淺井無食也蚯蚓上深堂言至空也蘇曰龐嚴亂後㱕郷時旣兵火建旄旟者皆羣細登髙堂而歎曰何蚯蚓上此矣蓋譏小人得志也趙曰以積雨乆隂而然也車馬何蕭索門前百草長蘇曰守劭守志讀書不隨郷辟簞瓢自樂門庭草数尺長魏文帝雨徴不起丗目爲當丗顔回趙曰暗使張仲蔚所居蓬蒿滿門寂无車馬事地僻秋將盡山髙夜未歸趙曰公自謂也塞雲多斷續邊日少光輝洙曰江淹恨賦摇風忽起白日西匿隴鴈少飛岱雲寡色又秋日蕭索浮雲无光蔡琰詩惟彼方兮逺陽精隂氣凝兮雪飃零警急烽常報薛曰右按前漢書長安匈奴大入烽火通於甘泉傳聞檄屢飛洙曰鮑明逺詩羽檄起邊亭烽火入咸陽師曰說文曰檄以木簡爲書長尺二以徴君也魏武奏事曰若有急則挿以雞羽謂之羽檄西戎外甥國洙曰爲尚主也蒼舒曰右按周書景龍四年以金城公主下嫁吐蕃乾元元年粛宗以㓜女寕囯公主下降回紇爾雅曰妻之父爲外舅郭璞曰謂我舅者謂之甥然則亦呼壻爲甥孟子曰帝館甥于二室是也唐書賛普遣名悉躐奉表言甥先帝舅顯親也何得近天威洙曰近一作迕天子之威也左傳王賜齊侯胙命无下拜齊侯曰天威不違顔咫尺鳳林戈未息魚海路常難魯曰鳯林魚海皆地名候火雲峯峻朱曰烽候之火夏雲多竒峯懸軍幕井乾洙曰懸軍謂路險阻縣之使下也鄧艾伐蜀懸軍深入幕一作暮夢符曰右按周官挈壷氏掌挈壷以令軍井几軍事縣壷以序聚柝易曰井收勿幕趙曰易井收勿幕注井口曰收勿幕則勿遮幕之今公言逎旅飲井者乾而所幕之井乾其懸示軍中之器以表此井也風連西極動月過北庭塞故老思飛將洙日李廣飛將何時議築壇洙曰漢祖築壇拜韓信爲大將師曰甫思得大將如信者出焉唐堯眞自聖趙日謂粛宗也逸曰君自聖則忠讜不聞甫微言以託諷也野老復何知洙曰莊子所謂帝力何有於我哉趙曰公自謂也曬藥能無婦應門亦有兒洙曰李令泊表內無應門五尺之童丗說荀淑使叔明應門慈明行酒師曰應音因當門户幸有兒子藏書聞禹穴洙曰司馬迁年十嵗誦古文二十四而南游江淮淮上㑹稽探禹穴窺九疑趙曰言禹穴藏書也讀記憶仇池憶一作悟蘇曰許靖過仇池樹下有碑靖駐馬一覧無遺人皆稱賞陸士衡有詩云有客逺方來過我滿蓬蓽尾罍酌松醪呼兒且低筆詞語淸氷霜書如鵉鳯立爲報鴛行舊趙曰指言平日同禁省之人鷦鷯在一枝見卑棲但一枝注趙曰莊子鷦鷯巢林不過一枝韓曰父之執友皆在鵷行想其子必有所託故云云龍門洙曰在洛陽之南逺望雙闕對峙如門然鄭曰河南志龍門驛在河南縣南十八里龍門横野斷驛樹出城來曽鞏曰驛樹言驛道雨畔之樹也氣色皇居近洙曰東都也曽曰言近治邑也金銀佛寺開洙曰山有佛寺金碧照耀最爲勝㮣洪覺範曰此句蓋謂龍門山有奉先寺佛地有金丗界銀丗界往還時屢改川陸日悠哉相閱征途上生涯盡幾回趙曰在龍門閱視征行之人盡此生涯能幾夔州歌十絶句一首見陵廟門中巴之東巴東山趙曰水經劉漳分三巴有中巴有巴西有巴東江水開闢流其間白帝髙爲三峽鎭洙曰三峽瞿塘巫山黃牛也夔州險過百牢關洙曰南都賦於東則左綿巴中百􅗛所充外圎銅梁於岩渠內函要害以膏腴蘇曰辛毗曰䕫州百牢関兵馬不可越趙曰瞿塘兩崖壁立大江中流無路可行非舟莫済宋曰十道志梁州有百牢山師曰說者以子美有上牢下牢修水関之句謂瞿塘之險倍百於上牢下牢之關此說非也啚經云百牢關孔明所建故基在今㒷元西縣泥口化撿玉觀山下傍臨白馬河東自梁洋北自武㒷西入金牛三泉皆渉北河以済河之西南壁山相對六十里不斷嶓冡漢江水流其閒與白馬河合縁江乃入金牛益昌路也雖不甚險而爲入川之隘口此瞿塘兩崖壁立大江中流無路可行非舟莫濟固有間矣白帝夔州各異城洙曰公孫述自稱白帝故䕫有白帝城蘇曰風俗記曰白帝城據百牢至夔州千里蜀江楚峽混殊名英雄割據非天意蘇曰武侯曰英雄鼎立割據士彊誠非天意趙曰言公孫之与劉豈天容其割據乎覇王并吞在物情羣雄競起向前朝趙曰指言巳前之代也王者無外見今朝洙曰公羊傳曰天王出居于鄭王者無外此其言出何不能于母弟也東都賦子徒識函谷之可閉不知王者之無外比訝漁陽結怨恨洙曰漁陽禄山舊鎮趙曰禄山以怨恨起兵於漁陽元聽舜日舊簫韶趙曰此明皇時太平爲虞舜之日時明皇寵幸禄山每与之宴未嘗不奏霓裳之曲此句含蓄美中有刺如此赤甲白鹽俱刺天鄭曰刺七迹切洙曰南都賦森尊尊而刺天蘇曰裴悰曰白塩掙空赤甲刺天峽浪匈湧鳥道盤紆閭閻繚繞接山巔楓林橘樹丹靑合洙曰蜀都賦家有塩泉之井户有橘柚之園西京雜記中南山有樹直上百丈無枝上結叢條如車蓋葉一青一赤望之班駮如錦繡長安謂之丹靑樹也蘇曰阮季行南埭上曰紅楓緑橘如丹靑相合複道重樓錦繡懸趙曰言其華麗瀼東瀼西一萬家孫曰瀼奴㓪切夔有澗水出於山谷之間謂之瀼溪人居其左右謂之瀼東瀼西江北江南春冬花背飛鶴子遺瓊蘂趙曰魏王粲白鶴賦云食靈岳之瓊蘂相趂鳬鶵入槳牙洙曰其草則蔣蒲葭又云其沃瀛則有攅蔣叢蒲東屯稻畦一百頃北有澗水通靑苗修可曰夔有平田号青苗陂晴浴狎鷗分處處洙曰孫綽詩物我俱忘懷可以狎鷗鳥趙曰狎鷗言可狎之鷗也列子海上有人狎鷗是巳雨隨神女下朝朝洙曰髙唐賦朝朝暮暮陽臺之下蜀麻呉鹽自古通萬斛之舟行若風長年三老長謌裏洙曰峽人謂操舟人爲長年三老師曰峽人以船頭把篙相水道者曰長年正梢者三老白晝攤錢髙浪中田白梁冀傳能意錢之戲佐何承天纂文曰詭憶日射意一日射數即攤錢也趙曰蜀人賭錢之名憶昔咸陽都市合趙曰指長安也山水之圖張賣時蘇曰郭秀才過巫峽愛十二峯立馬乆之嘆曰吾昔年賣山水圖疑其妄粧景色今日親見勝彼啚十八九矣巫峽曾經寳屏見楚宫猶對碧峯疑趙曰言昔畫啚上見楚宫今對碧峯灘由疑是舊所見之畫圖也閬風玄圃與蓬壷鄭曰酈元水經注崑崙之山三級二曰閬風一曰玄圃中有髙堂天下無洙曰南都賦崑崙無以侈閬風不能踰趙曰其上臺觀皆金玉故曰天下無借問䕫州壓何處峽門江腹擁城隅峽口二首峽口大江間洙曰一作闊西南控百蠻洙曰施黔五溪之蛮也城欹連粉堞鄭曰逹協切城止垣岸斷更靑山開闢當洙曰一作多天險洙曰天設之險也言險因開闢而後通爾防隅一水關洙曰峽口有関断以鐵鏁亂離聞鼔角秋氣動衰顔趙曰以身逢乱離聞鼔角声所以感動衰顔也時淸關失險丗亂㦸如林去矣英雄事荒哉割據心洙曰當公孫𫐠劉俻之際蘷爲要衝趙曰皆以英雄而割據一隅也蘆花留客晚楓樹坐猿深疲􅒒煩親故鄭曰􅒒乃結切蘇曰麻緗隱居終南山不仕常有親知見緗緗曰疲􅒒之人何煩親故往來存問諸侯數賜金鄭曰数色角切洙曰言多得諸侯贈遺也蒼舒曰主人中丞頻分明俸趙曰公自注云主人栢中丞類分明俸蓋節度古諸侯也因言諸侯所貽之金得稱賜金黃草鄭曰峽中記三峽劒側多黃草生虎豹賢之故云黃草峽西船不歸赤甲山下行人稀趙曰舊作少人稀惟蔡伯丗本作人行稀是黃草峽在涪州峽之西則蜀中矣言水行之舡不歸陸行之人稀少此所以致疑道路之梗塞也秦中驛使無消息蜀道兵戈有是非鮑曰崔寧之乱郭英乂犯寕家室寕逐之是也以大義責之則寕以徧禆逐大將非也趙曰望秦中之驛使則無消息聞蜀道之兵戈或是或非未敢必科也蔡伯丗曰是時蜀中多故冬日詩公自注曰傳聞軍官自圍普遂可見之矣萬里秋風吹錦水洙曰成都記濯錦江秦相張儀所作笮橋東下枕水舊錦里勝基址由在此濯錦即鮮明它水不得大原公濬而闢之堅其岸而踈大之澄而陽之水居者以虹橋跨水綵昼相鮮笙歌之樂恍若天外之意也趙曰因蜀道之兵戈而起思秋風言万里橋之秋風也錦水正在其下誰家別淚濕羅衣洙曰古詩𬒳服羅衣裳蘇曰王洎聞砧詩空閨少婦聽别淚滿羅衣趙曰言行兵出戍与夫避難逃禍者爲有離别矣莫愁劒閣終堪據洙曰張孟陽劒閣銘㒷實在徳嶮亦難恃蘇曰姜維曰劒閣堪據實蜀路要之處聞道松州巳𬒳圍洙曰松州在西山吐蕃之南鄙也蘇曰梁元帝解松州之圍趙曰勿謂劒閣之險可恃而欲割據雖松州在劒閣之内巳有圍之者矣此所以戒守士之臣也南楚南楚靑春異暄寒早早分趙曰公在夔而云南楚則䕫在戰囯爲楚也無名江上草隨意嶺頭雲正月蜂相見非時鳥共聞杖藜妨躍馬洙曰蔡澤曰吾躍馬食肉四十年亦足矣不是故離羣蘇曰公自言適楚本避地而巳非離羣也趙曰言官在身而在諸人之間則必騎馬今也杖藜而獨往乃放曠所然不是故離羣也師曰南地與北異冬反暖春却寒故有春寒料峭之語杖藜貧賤也躍馬冨貴也子美避地而甘於貧賤非故意離羣乃不得巳也余曰邵氏聞見録子美詩不是故離羣離字如律當讀平声記檀弓離羣索居釋文離字讀去声力智反退之云凡爲文辭冝畧識字有以也夫南極南極靑山衆趙曰南極星名老人之南極也晉天文志南極在井栁之中正是南方之星故云於夔州詩可用矣西江白谷分古城踈落木荒戌密寒雲洙曰顔延年詩憔悴征戍勤又故囯多喬木空城凝寒雲曹顔逺落落卉木踈歳月蛇常見蘇曰景二年冬蛇見不蟄乃政令失時風飈虎忽聞近身皆鳥道殊俗自人羣睥睨登哀柝洙曰宣十二年專守陴者皆哭注陴城上睥睨也鄭曰睥匹詣切睨研計切城上女牆析撻各切趙曰睥睨城上小城也登哀柝指言白帝城上之事有屯戍故也矛弧照夕曛亂離多醉尉尹曰南史何敬容傳謝郁作書戒之日召侯巳得瞻望朝夕出入禁門醉尉終不敢呵灰然不無其慚趙曰左傳取蝥弧以登乃鄭之旗名也照夕曛則旗爲日所照舊作矛弧無義愁殺李將軍洙曰李廣贖爲庶入数与故頴隂侯屏居藍田南山中射獵甞夜從一騎出從人田間至亭霸陵尉醉呵止廣廣騎曰故李將軍尉曰今將軍尚不得夜行何故將軍也宿廣亭下師曰李廣傳止言霸陵尉呵止廣而子美使醉尉字蓋出謝郁書云睥睨城上短墻也分門集註杜工部詩卷第四, WYG: ''}
