  - {type: variant, offset: 284, length: 13719, content: 卜巳宜何所居因𫐠其詞成都記草堂寺府西十里浣花亭三里寺極宏麗有名僧履空居其中杜貟外居處偪近常恣遊焉鮑曰上元元年嵗次庚子公年四十九在成都劎南節度使裴冕爲卜成都西郭浣花溪作草堂居焉所謂主人爲卜林塘幽是也前注以主人爲嚴武非趙曰縁楚辝屈原有卜居一篇故得倚以名詩公又有卜居一篇則在䕫州也浣花流洙曰一作之水水西頭洙曰浣花溪名鄭曰在成都主人爲卜林塘幽洙曰主人嚴武也趙曰主人謂地主或所館置之人不可指爲嚴武也巳知出郭少塵事洙曰梁張纉啓常願卜居幽僻屏避諠塵修可曰陶淵明云閑居三十載遂與塵事㝠更有澄江銷客愁洙曰謝玄暉詩澄江靜如練曹子建詩云誰與銷愁無數蜻蜓齊上下一雙鷄䳵對沉浮東行萬里堪乗興須向山隂上洙曰一作入小舟洙曰蜀有萬里橋在浣花之東昔孔明送吴使至此曰萬里之行從此始矣因是得名乗興欲傚王子猷月夜泛舟謁戴安道也故有下句山隂王子猷所居之地狂夫萬里橋西一洙曰一作新草堂洙曰公築居浣花里在萬里橋之西萬里橋事見卜居詩注百花潭水即滄浪洙曰成都記杜貟外别業在百花潭臺猶在風含翠篠姢姢靜洙曰謝靈運詩緑篠媚新連雨裛紅蕖冉冉香趙曰翠篠竹也紅蕖荷花也古詩姢姢新月躰冉冉衆多之皃選詩云柔條紛冉冉厚䘵故人書斷絶洙曰言交態薄也杜元凱曰僻居林下謝絶人事厚禄故交音書断絶晚進小子不足與言它其如予何恒饑稚子色淒凉欲填溝壑唯踈放自笑狂夫老更狂洙曰公以狂自隱爾舊史言公於成都浣花里結廬枕江與田畯野老相狎蕩嚴武過之有時不冠其傲誕如此趙曰将欲填溝壑而死矣却惟只是踈放而不管此其所以爲狂也非嚴武過之而不冠之意野老野老籬前江岸廻柴門不正逐江開漁人網集澄潭下趙曰謂百花潭也賈客船随返照來鄭曰賈公土切行曰商坐曰賈長路關心悲劒閣洙曰劒門也閣棧道也趙曰回念其𥘉來蜀時道路之難也鄭曰梁益記劒門山勢連絡限蜀爲阻閣棧道也片雲何意洙曰一作事又云行雲幾處趙曰事字一作意不若事之快傍琴臺鄭曰十道志成都有琴䑓即相如與文君貫酒處今海安寺王師未報収東郡馬曰滑州城闕秋生畫角哀趙曰成都改爲南京故公自注得稱城關江村淸江一曲抱村流洙曰後漢巴郡南郡蠻注清江縣水色清照十丈分砂石蜀人見澄清因名清江趙曰此言浣花溪之澄清也舊注以爲清曲縣却是施州矣長夏江村事事幽洙曰沈佺期詩坐㸔長夏曉趙曰長夏言自四月至六月也舊注引沈詩誤矣自去自來洙曰一作歸堂上鷰相親相近水中鷗老妻畫紙爲洙曰一作成碁局稚子𫾣針作釣鈎趙曰此言事事清幽也師曰妻比臣夫此君棊局直道也針本全直而敲曲之言老臣以直道成帝業而㓜君壞其法稚子比㓜君也此天厨禁臠之說也或說老妻以比楊妃稚子以比禄山盖禄山爲妃養子棊局天下之喻也妃欲以天下私禄山故禄山得以邪曲包藏禍心此說爲得之雖然甫之意亦不如此老妻稚子乃甫之妻子甫其肯以巳妻子而託意於淫婦人與逆臣哉理必不然如進艇詩云晝引老妻乗小艇晴看稚子浴凊江則将何所比况乎此皆村居與妻子適情以自樂故形之詩詠皆若託意於草木鳥獸之類不冝區區於穿鑿也多病所湏惟藥物微軀此外更何求洙曰何一作無一室一室他郷遠洙曰一作老後漢陳蕃曰大丈夫處丗當掃除天下安事一室乎空林暮景懸洙曰江文通詩秋日懸清光趙曰張景陽雜詩鳴鶴聒空林正愁聞塞笛獨立見江船巴蜀來多病洙曰成都記其西即隴之南首故曰隴蜀以與巴接復曰巴蜀趙曰巴與蜀相連之地也荆蠻去幾年洙曰一作千荆蠻荆楚也詩謂之蠻荊太史公得漢古文春秋乃知中國之虞與蠻荆句吴兄弟也應同王粲宅留井峴山前洙曰峴山荆楚也今屬襄陽有井在焉人呼爲仲宣井云王粲故宅也師曰暮景謂晚照也其影倒懸於林梢甫以避宼駈馳來蜀遂成肺疾荊蠻去幾年意欲適荆楚厭蜀崔旰之亂不知幾年得去也昔王粲依劉表卜居峴山下後人呼爲王粲宅宅前有井呼爲仲宣井甫之此室殆王粲宅之比也田舍田舎淸江曲洙曰一作上柴門古道傍草深迷市井地僻嬾衣裳蘇曰穆政林居地僻見客衣裳亦嬾吾雖放曠如此不識客意如何櫸栁枝枝弱鄭曰櫸居許切正作柜枇杷樹樹香洙曰櫸栁木名枇杷果名鸕鷀西日照曬翅滿漁梁洙曰鸕鷀水鳥也蜀人以之捕魚趙曰陶侃母責其爲漁梁吏而寄鮓爲農錦里湮塵外洙曰華陽國志錦江織錦濯其中則鮮明濯他江必不好故命曰錦里公居在近郊無氛埃故云煙塵外江村八九家圎荷浮小葉細麥落洙曰一作墜輕花余曰吕氏童蒙訓曰五言詩第三字要響如此一句浮字落字是響字也所謂響者致力處也予竊以爲字字當活活則字字自響卜宅從兹老爲農去國賖洙曰顔延年詩去國還故里幽門樹蓬蔾曲禮大夫上去國君去其國晏曰賖遠也逺慚勾漏令鄭曰交阯邑不得問丹砂洙曰晉葛洪傳洪字稚川從祖玄吴時學道得仙號曰葛仙公其錬丹秘術悉得真法以年老欲錬丹砂以期選壽聞交阯出丹求爲勾漏令帝以洪資高不許洪曰非欲爲榮以有丹砂帝從之西郊時出碧雞坊洙曰漢郊祀志宣帝時或言益州有金馬碧雞之神可醮祭而致遣王褒持節而求之故成都有碧雞坊鄭曰梁益記成都之坊一事有二第四曰碧雞坊西郊向草堂洙曰成都記草堂寺府西七里市橋官柳細洙曰成都記市橋水中有石犀盖吴漢爲賊將延岑所破之處鄭曰酈元水經注益州西南石牛門曰市橋趙曰按樂史寰宇記云於成都府載市橋在州之西江路野梅香趙曰市橋江路皆草堂所經之地傍架齊書帙㸔題减洙曰一作檢藥囊無人競洙曰一云與一云覺來往鄭曰介甫云下得覺字大好若作與遂爲一篇之病踈懶意何長趙曰荆公本作覺來往甚善余甞讀梁徐姚婦題甘蕉示人曰夕立巳非踈夢啼真太數雄當夜枕知過此無人覺舊本作競又作執誤矣村夜粛肅風色暮江頭人不行村舂雨外急鄰火夜深明胡羯何多難樵漁寄此生蘇曰梁革曰衣冠我非敢倚甘寄生於漁樵中盡此天年中原有兄弟萬里正含情蘇曰臨風黙含情草堂即事荒村建子月趙曰肅宗上元元年歳在辛丑於九月壬寅大赦去尊號又去上元號稱元年以十一月爲歳首以十所建辰爲名今公作此詩以紀著事蓋有意於後丗之所考信者矣獨樹老夫家趙曰王褒送塟詩云平原看獨樹雪裏江船渡風前逕竹斜寒魚依宻藻宿鷺起圎沙蜀酒禁愁得鄭曰禁居吟切無錢何處賖水檻遣興二首去郭軒楹敞無村眺望賖趙曰無林木謂之村惟其無村所以眺望可賖賖者遠也澄江平少岸幽樹晚多花細雨魚兒出㣲風燕子斜城中十萬户此地兩三家蜀天常夜雨尹曰蜀雅州常多隂雨號曰漏天江㩜巳朝晴葉潤林塘宻衣乾枕席清不堪秖老病何得尚浮名淺把㳙㳙酒深慿送此生到村碧澗雖多兩洙曰謝玄暉詩銅陵映碧澗石磴冩紅泉秋沙先洙曰又云亦鄭曰先先見切後也少泥蛟龍引子過荷芰逐花低老去參戎幕洙曰爲作簽謀也趙曰爲劎南節度參謀也歸來散馬蹄洙曰曹子建詩俯身散馬蹄稻粱湏就列洙曰爲貧而仕也榛草即相迷趙曰言旣離草堂而入使院則路逕生草反相迷矣蓄積思江漢洙曰蓄積猶鬰結也思江漢以㵼其鬰結爾頑踈惑町畦上他典下胡圭切洙曰嵆康云匪降自天實由頑踈町畦隴畒也蒼舒曰右按南華真經人間丗篇曰彼且爲無町畦亦與之爲無町畦趙曰言其禀性頑踈所惑者但在於町畦之間故雖朝夕在院仍思欲一歸也暫酬知巳分還入故林栖洙曰王正長人情舊鄒客鳥栖思故林蘇曰鹿岑曰山野性豈能拘禄仕但夕即還故林單栖一枝私心足矣後果弃官入梁山人髙其節趙曰知巳謂嚴公言旣稍酬報知巳之分乃因遂歸故林爾舎弟占歸草堂檢校聊示此詩乆客應吾道趙曰家語載孔子陳蔡之厄曰吾道其非耶相隨獨爾來孰知江路近頻爲草堂廻鵝鴨冝長數柴荆莫浪開東林竹影薄臘月更湏栽懷錦水居止二首軍旅西征僻風塵戰伐多蘇曰孫權風塵滿天相力伐不止四海困窮黎民流亡上愧乎天中愧乎人下愧乎地趙曰永㤗元年僕因懷恩誘吐蕃等宼奉天京師大震帝自将苑中急召子儀屯涇陽故曰西征猶聞蜀父老洙曰猶一作獨司馬相如有難蜀父老不忘舜謳歌鄭曰忘無放切洙曰孟子曰謳歌者不謳歌堯之子而謳歌舜趙曰關外之亂蜀人間之必駭而所謳歌在舜天險終難立洙曰劒門天設之險也難立無德不可恃趙曰憂吐蕃能犯蜀之險矣易曰天隂不可升也師曰子美以崔旰亂成都故避亂之東川然旰雖叛民心未忘唐室雖據劍閣之險終難自立柴門豈重過鄭曰重儲用切再也洙曰謂思草堂未得再到朝朝巫峽水逺逗錦江波洙日錦江水與巫峽相通趙曰重懷成都之意水徒相通而不能即返焉鄭曰逗文透切佳也萬里橋南宅百花潭北莊洙曰浣花草堂在萬里橋之南地有百花潭趙曰舊本作橋南非是蓋公詩又云萬里橋西一草堂百花覃北即滄浪層軒皆靣水修可曰宋王招䰟高堂䆳宇檻層軒老樹飽經霜趙曰四時纂要冬瓜飽霜雪嶺界天白錦城曛日黄洙曰雪嶺錦城並見嚴中丞詩注惜哉形勝地回首一茫茫洙曰張孟陽劎閣銘曰形勝之地匪親勿居蘇曰姜維曰劎門乃形勝之地㧚三巴要路不可不惜趙曰以西山尚有屯戍恐蜀受其禍故嘆惜形勝之地而憂之也題忠州龍興寺所居院壁忠州三峽内洙曰蜀都賦經三峽之峥嶸注三峽巴東永安縣有髙山相對相去可二十文左右崖甚髙人謂之峽江水過其中井邑聚雲根趙曰雲根言石也張恊詩雲根臨八極蓋取五岳之雲觸石而出則石者雲之根也小市常爭米孤城早閉門蘇曰楚人侵鄖鄖閉門常早空看過客淚莫覔主人恩蘇曰子美自稱主人指張使君上篇有㝠忠州張君宅淹泊仍愁虎深居頼獨園洙曰金剛經給孤獨園移居䕫州郭伏枕雲安縣遷居白帝城春知催桞別趙曰言春知人之離居故催栁之生以供行人之爲别也相别多用栁者盖古有折楊栁曲多言離别也江與洙曰一作巳放舩淸洙曰以放船之清爽也農事聞人說山光見鳥情禹功饒斷石且就土㣲平洙曰㳂峽皆因開鑿而成故少平土惟䕫州相平尓入宅三首奔峭背赤甲洙曰謝靈運詩孤客傷逝湍徒旅苦奔峭趙曰赤甲本岬字按水經注南連基曰帝山甚髙大其石背赤土人云如人祖胛故謂之赤岬山鄭曰寰宇記赤甲城公孫述所築樹木土石悉赤如人袒臂故云赤甲在縣北斷崖當白鹽洙曰赤甲白塩瞿唐峽口二山趙曰白塩髙可千餘丈人見其髙白故因名之客居媿遷次洙曰次舎也遷次由移居也趙曰如樂昌公主詩今日何遷次也春色漸多添花亞欲移竹趙曰言花枝偃亞於欲将移去之竹矣鳥窺新卷簾㐮年不敢恨勝槩欲相兼亂後居難定春歸客未還水生魚復浦洙曰魚復白帝舊名鄭曰十道志䕫州古魚國漢魚復縣地師曰魚復縣即不州峽人以春水張謂之水生雲暖麝香山定功曰後漢郡國志巴郡魚復古之庸地左氏文十年魚人逐楚師是也䕫州圖經麝香山州東南一百二十五里山出麝香故以名之也半頂梳頭白趙曰白髪之所存者僅半頂耳過眉柱杖班相㸔多使者一一問函關洙曰時㓂亂未平關中之信未通爾趙曰時吐蕃未平所以問之也宋玉歸州宅洙曰歸州有宋玉宅今亡矣雲通白帝城洙曰見白帝城樓詩注吾人淹老病趙曰吾人乃自言也漢宣帝歌曰泛濫不止兮愁吾人旅食豈才名趙曰於食他州豈坐才名之故耶峽口風常急江流氣不平趙曰江流之洶湧如人氣之不平也只應與兒子飄轉任浮生卜居歸羡遼東鶴洙曰遼東華表桂有鶴集其上曰有烏有鳥丁令威去家千年今始歸城郭如故人民非何不學仙冡爲人吟同楚執珪洙曰淮南子宣王以執珪封子發子發亂而不得楚法得子胥爵執珪莊舄爲楚執圭王仲宣賦莊舄何而越吟趙曰此兩句數其不得歸郷也史記曰莊舄故越之細鄙人也爲楚執珪病而尚猶越聲本無吟字而王粲登樓賦云莊舄顯而越吟也未成遊碧海洙曰十洲記曰扶桑在碧海之中地去西南萬里大帝之宫太眞東王君所治趙曰十洲記云東有碧海廣狹皓汗與東海等水不鹹苦正作碧色也著處覔丹梯洙曰謝靈運詩躧歩陵丹梯謝玄暉詩即此陵丹梯雲嶂寛江北趙曰䕫江之北其山稍遠爲寛矣春耕破瀼西洙曰南瀼水管郫縣也趙曰公自赤甲而遷此江北乃瀼西之地瀼者水名音譲鄭曰瀼奴浪切水名今作灢桃紅客若至定似昔洙曰一作晉人迷洙曰見欲問桃花宿注赤甲卜居赤甲遷居新兩見巫山楚水春炙背可以獻天子趙曰列子宋國有田夫曁春東作自曝於日不知天下有綿纊狐狢顧謂其妻曰負日之暄人莫知者以獻吾君将有重賞羙芹由來知野人洙曰嵆康書野人有快炙皆而美芹子者欲獻之至尊雖有區區之意亦巳踈矣荆州鄭薛寄書近蜀客郄岑非我鄰洙曰鄭薛郄岑皆公之故舊見于前詩注笑接郎中評事飲病從深酌道吾眞師曰赤甲山屬䕫州子美登高詩云艱難苦恨繁霜鬢潦倒新停濁酒杯則知子美以病断酒今郎中評事深酌勸子美道子美眞性嗜此如何不飲甫亦難逆其意而云病從深酌道吾眞暮春題瀼西新賃草屋五首乆嗟三峽客再與暮春期修可曰樂史寰宇記俞州有三峽之名曰西峽巴峽巫峽明月峽在夔州之西即西峽矣百舌欲無語趙曰反舌無聲在芒種後十日今謂之欲無語則暮春之時也師曰百舌江東人謂之信鳥逢春則效百鳥語故名百舌或曰反舌反舌無聲盖暮春也繁花能幾時谷虚雲氣薄波亂日華遲戰伐何由定哀傷不在兹洙曰百舌反舌也禽名此郊千樹橘不見比封君洙曰李衡種甘橘千樹號千頭木奴前漢貨殖傳蜀漢江陵千樹橘比其人皆與千戸侯等養拙干戈際全生麋鹿群蘇曰陳遂曰幸得全生於麋鹿群中盡老矣畏人江北草旅食瀼西雲蘇曰言其客路萍跡無定計也古詩云旅食如閑雲王仲宣漂泊南北如水上萍旅食不定若出谷雲趙曰畏人在於江北之草間旅食在於漢西之雲裏此公之自歎也師曰畏人江北草言草動則驚恐盗伏其中也萬里巴渝曲洙曰前漢禮樂志巴渝鼓貟三十六人師古曰巴巴人也渝渝人也當髙祖初爲漢王得巴渝人並趫捷善鬪與之定三秦滅楚國存其武樂也巴渝之樂因此始也巴即今巴州渝即今渝州本蜀都之地三年實飽聞蘇曰司馬遷三年飽聞仁政趙曰自永㤗元年至今大歷二年爲三年矣綵雲隂復白錦樹曉來靑身丗雙蓬鬢趙曰言身巳老而雙鬢如蓬矣乾坤一草亭趙曰言天地之間有此瀼西一草亭也哀歌時自短師曰古詩有短長吟子美渝州侯侍御詩云虚費短長吟故此云哀歌時自短醉舞爲誰醒細雨荷鋤立蘇曰晁詠因思詩荷鋤立雨中衣濕不自覺人皆愛其苦學江猿吟翠屏洙曰見眷言終荷鋤并却畧羅翠屏注黄曰陶淵明帶月荷鋤歸壯年學書劎洙曰項籍少年學書不成去學劒他日委泥沙洙曰言不見用於丗趙曰公自歎於流落也事主非無禄浮生即有涯髙齋依藥餌絶域市喧宜近利洙曰西居近市易巽近利市三倍林僻此無蹊洙曰曹子建欲還絶無蹊若訪衰翁語須令䞉客迷道北馮都使髙齋見一川子能渠細石吾亦沼淸泉枕帶洙曰一作席還相似柴荆即有焉斫畬應費日夢符曰古按荆楚多畬田先縱火熂爐候經雨下種歷三歳土脉竭不可復樹藝但生草木復熂旁山唐劉禹錫適連州畬田行云何處好畬田團團縵山腹鑚龜得雨卦上山燒卧木又云下種暖灰中乗陽坼牙孽蒼蒼一雨後苕頴如雲發白居易子規歌云畬田有粟何不啄石楠有枝何不棲燒榛種田也爾雅一歳曰菑二歳曰新三歳曰畬易曰不菑畬皆音餘畬田凡三歳不可復種盖取畬之義也熂音餼燹火燎草也爐音盧火燒山界也解䌫不知年洙曰見畬田費火耕注牢落西江外參差北户間乆遊巴子宅鄭曰寰宇記䕫子國後爲楚所滅至秦分爲巴郡卧病楚人山幽獨移佳境淸深隔遠關寒空見鴛鷺廻首想朝班洙曰謝靈運安排徒空言幽獨頼鳴琴思玄賦幽獨守此側陋從驛次草堂復至東屯茅屋二首峽裏歸田客洙曰恨賦欲通抵見罷歸田里趙曰以張平子自比也張公作歸田賦畧曰起塵矣以遐逝與丗事乎長辭江邊借馬騎洙曰有馬者借人乗之非㝷戴安道洙曰見山隂詩注似向習家池洙曰見琬騮詩習池注山險風煙合洙曰江淹賦風煙有鳥道天寒橘柚垂洙曰蜀都賦户有橘柚之園築埸看歛積洙曰豳詩十月築場圃一學楚人爲短景難高卧洙曰秋興賦何微陽之短晷謝玄暉髙卧猶在兹衰年強此身山家蒸栗暖野飯射麋新洙曰玉色如蒸粟趙曰左傳射左麋鹿龜龜者麋背之髙處也丗路知交薄門庭畏客頻蘇曰陸抗家貧畏客過門趙曰惟其從爲靣交而不心所以畏客來之多徒爲紛紛也牧童斯在眼田父實爲鄰蘇曰黄起云編怢作友田父爲鄰全勝薄官汨没於市􅒡塵土間暫往白帝復還東屯復作歸田去趙曰言自白帝歸田也猶殘穫稻功築埸憐穴蟻趙曰以見公之不殘拾穂許村童趙曰以見公之不吝拾穗詩云遺秉滯穗伊寡婦之利也落杵光輝白除芒子粒紅加飡可扶老趙曰古詩上言加飡飯扶老扶吾身之老也倉庾慰飄蓬慿孟倉曹将書覔土婁舊莊平居喪亂後不到洛陽岑爲歷雲山問無辭荆棘深北風黃葉下南浦白頭吟洙曰文君作白頭吟夢符曰右按楚詞予交手兮東行送美人兮南浦波滔滔兮來迎魚鱗鱗兮媵予十載江湖客茫茫遲暮心簡吴郞司法有客乗舸自忠州遣騎安置瀼西頭洙曰前詩注所謂瀼東瀼西者古堂本買藉踈豁借汝遷居停宴遊趙曰借吴司法自舟中遷來以居而我甘心停宴遊也雲石熒熒髙葉暁洙曰一作曙風江䬃䬃亂帆秋却爲姻婭過逢地夢符曰右按爾雅婦婦父母婿之父母相謂爲婚姻兩婿相謂爲亞注詩云瑣瑣姻婭今江東人呼同門爲僚婿許坐曾軒數散愁趙曰古堂本公之所有旣借吴郞住却是姻婭家之屋舎乃爲我過逢之地耳仍應我坐於曽軒以散其愁也王録事許修草堂貲不到聊小詰爲嗔王録事不寄草堂貲昨屬愁春雨能忘欲漏時隣里律詩四首過南隣朱山人水亭趙曰此篇公歸草堂所作也所謂南隣豈前者錦里先生乎相近竹參差相過人不知幽花欹滿樹小水細通池歸客村非遠趙曰公自言也殘樽席更移看君多道氣從此數追随趙曰曹子建公讌詩飛盖相追随北鄰明府豈辭滿洙曰後漢張湛傳明府注郡所居曰府明府者尊髙之稱前書韓延壽爲東郡太守門卒謂之明府亦其義也藏身方告勞洙曰詩不敢告勞靑錢買野竹白幘岸江皐洙曰劉隗岸幘大言意氣自若趙曰靑錢蜀人語謂見錢也愛酒晉山簡趙曰山簡每出嬉遊多之池上置酒輙醉名之曰髙陽池能詩何水曹洙曰梁書何遜字仲言八歳能賦詩沈約愛其文甞謂遜曰吾毎讀卿詩一日三復猶不能巳其爲名流所稱如此爲安武王叅軍兼水部郎初遜文章與劉孝綽並見重於丗丗謂之何劉時來訪老疾歩屧到蓬蒿洙曰三輔决錄江曰張仲蔚隱身不仕所居蓬蒿没人孫曰屧悉協切履薦也南鄰修可曰左太冲詩云南隣擊鍾磬有此南隣字故公取以爲題錦里先生烏角巾洙曰巾之有角者郭林宗遇雨而角折人皆折雨以斂之夢符曰右按晉史羊祜與從弟琇書曰旣定邊當角巾東第爲容棺之虚園収芋栗洙曰一作粟不全貧洙曰史記卓氏曰吾聞汶山之下沃野下有蹲䲭注大芋也成都風俗曰大飢不飢蜀有蹲䲭言有所済尔蘇曰舊本作粟甫以其園只收芋栗故謂之貧然猶有芋栗可収所以不爲全貧若更収粟則不可爲貧矣慣看賔客洙曰又作朋友一本作門户兒童喜趙曰慣看賔客則常喜即與魏野詩云兒童不慣見車馬走入蘆花深處藏異矣得食堦除鳥雀馴洙曰言忘機也類狎鷗翁趙曰置食堦除間而鳥雀得之以馴擾蘇曰黄椹養鳥雀数百就掌中取食俱無疑忌自號林泉逸老秋水纔洙曰一作雖深四五尺野航洙曰一作艇恰受兩三人趙曰丗多疑此謂之航豈止恰受兩三人乎余觀詩云誰謂河廣一葦航之如今之一葉舟也抗即航也則野舫不必名其大矣白沙翠竹江村暮相送洙曰一作對柴門洙曰一作籬門月色新又呈吴郎堂前撲棗任西鄰夢符曰右按前漢王吉傳東家棗樹垂吉庭其妻取棗啖吉吉知乃夫婦鄰人欲伐年四十有五在奉先以舅崔公爲白水縣尉故適白水有是詩鄭曰十道志同州白水漢栗邑南界臨白水魏文改爲此縣客從南縣來浩蕩無與適洙曰古詩客從遠方來蘇曰姚萇四溟浩蕩困鱗無所適耳趙曰浩蕩悠逺不定止之皃如浩蕩乗滄溟之義旅食洙曰唐書朱克融輩皆旅食長安白日長向當朱炎赫髙齋坐林杪鄭曰亡招切木末也信宿洙曰再宿曰信左傳遊衍􅞔鄭曰衍于線切閴苦邀切寂靜也清晨陪躋攀傲睨俯峭壁鄭曰睍五計切洙曰海賦馮夷俯浪以傲晲趙曰曹子建贈白馬彪云清晨發皇邑崇岡相枕帶曠野懷洙曰一作回咫尺洙曰嵆康賦託峻嶽之崇岡趙曰言野雖曠遠而懷之若咫尺也始知賢主人贈此遣愁寂危堦根靑冥増冰生淅瀝洙曰招䰟増水峩峩飛雪千里謝惠連雪賦霰淅瀝而生集雪紛糅而遂多趙曰青㝠者青雲杳冥之際楚詞據青冥而攄虹上有無心雲下有欲落石洙曰陶潜歸去來雲無心而出岫江惣賦雲無情而自合泉聲聞復息動靜随所激蘇曰郭汲曰君不見幽谷之鍾而不自鳴人擊即聲人之動靜亦随所擊然後應之也鳥呼藏其身有似懼彈射鄭曰食亦切洙曰隋長係晟善彈射吏隱洙曰王喬梅福皆吏隱也適洙曰一作通情性兹焉其窟宅洙曰海賦瑰竒之所窟宅天台賦靈仙之所窟宅白水見舅氏洙曰左傳僖二十四年晉文公謂子犯曰所不與舅氏同心者有如白水投其璧於河内薛曰右按子美近躰詩有白水明府舅氏宅喜雨詩得過字即知白水者地名非晉文公所謂白水明矣諸翁乃仙伯杖藜長松隂洙曰天台賦隂落落之長松修可曰莊子載元憲杖藜應門馬曰劉珣擊馬長松下作尉洙曰梅福作尉人謂之仙尉窮谷僻爲我炊雕胡逍遥展良覿洙曰西京雜記太液池邊皆雕胡紫籜緑節之類菰之有米者長安人謂之雕胡謝靈運搔首訪行人引領兾良覿趙曰雕胡菰米也爲飯極滑長安人謂爲雕胡出宋玉諷賦曰主人之女爲臣炊雕胡之飯勸臣食也坐乆風頗怒晚來山更碧相對十丈蛟歘翻盤渦析洙曰海賦盤渦谷轉鄭曰渦烏禾切水拗也師曰自相對十丈蛟以下寓意於禄山之叛十丈蛟喻禄山也何得空裏雷殷殷㝷地脉鄭曰殷於謹切詩隱其雷長門賦雷隱隱而響起趙曰卞雷聲之殷殷而㝷地脉所在亦詩人在南山之陽南山之側南山之下之理也煙氛藹崷洙曰一作崒魍魎森慘戚崑崙崆峒顛廻首如不隔前軒頽洙曰一作推反照巉絶華岳赤鄭曰華胡化切洙曰太行孟門豈云巉絶爾雅曰落光反照於東謂之反景劎閣銘云太行孟門豈云巉絶兵氣漲林巒川光雜鋒鏑鄭曰丁歷切知是相公軍鐵馬雲霧洙曰一作煙積趙曰天寳十四載禄山反帝召哥舒翰守潼關明年拜尚書左僕射故云相公軍也玉觴淡無味胡羯豈強敵鄭曰羯居謁反長歌激屋梁淚下流衽席洙曰蘇武詩長歌正激烈曹植賦君朝日之照屋梁趙曰黄香天子頌曰献萬年之玉觴徐曰黄庭内景經淡然無味此言至尊旰食雖衘酒而無味然有相公之軍胡羯亦不足敵也晏曰屋梁岀宋玉神女賦曰日朝出照屋梁舊注引爲曹植賦誤矣人生半哀樂天地有順逆慨彼萬國夫休明備征狄洙曰一作敵猛将紛填委廟謀洙曰後漢光武賛明明廟謀畜長䇿洙曰前漢匈奴傳制百蠻之長䇿李陵書猛将如雲劉公幹職事相填委文墨紛消散東郊何時開洙曰書周公既設命君陳分正東郊成周作君陳曰命汝户兹東郊又命畢公保釐東郊又徐夷並興東郊不開帶甲洙曰史帶甲百萬且未䆁欲吿清宴疲難拒幽明廹洙曰易繫知幽明之故三嘆酒食傍何由似平昔洙曰古樂府一彈再三歎孝祥曰左傳魏献子将受梗陽人賂饋入召閻没女寛比置三嘆程曰魏子曰唯食忘憂三嘆何也曰或賜二小人酒不夕食饋之始至恐其足是以嘆中置自咎曰豈将軍食之而有不足是以再嘆及饋之畢願以小人之腹爲君子之心屬饜而巳献子辭梗陽人趙曰借用閻没女寛當饋而三嘆今公所嘆嘆其不若往日太平之時也兩當縣吴十侍御江上宅俯曰按地理志鳯州兩當縣州西八十五里漢故道縣後魏置兩當以大散關與嘉陵地勢險隘相當故云兩當寒城朝煙淡洙曰謝玄暉寒城一凝眺平楚正濸然山谷落葉赤洙曰謝靈運曉霜楓葉丹夕曛嵐氣隂隂風千里來吹汝江上宅洙曰謝玄暉朔風吹飛雨蕭條江上來趙曰詳味詩意吴侍御遷謫之因爲卞論良民不是姦細以此悮權貴而得罪耳首四句以秦地之時候景物言其宅在兩當縣之江上所以爲之感激也兩當枕嘉陵江上傳云吳侍御宅今子孫尚居之鵾雞號枉渚日色傍阡陌洙曰王徽詩窈靄瀟湘空歘吸鵾雞悲謝靈運弭棹薄枉渚指景待樂闋歌朝騁騖兮江臯夕弭節兮北渚楚辭朝發枉渚以宿辰陽七發鶚鵠晨號乎其上鵾雞哀鳴翔乎其下沈曰相如上林賦云藺玄鶴亂鵾雞張楫曰鵾雞似鶴黄白色張無尽武陵圖經紏繆云余閱四方圖經何其舛訛之多也以武陵善德出一事觀之其餘可知矣武陵之東口二山一曰枉山二曰踊岀山吴均宋起居注云宋元嘉七年五月大水武陵枉山䧟爲枉渚隋開皇中刺史樊子重以枉山甞爲善卷所居名其地爲善德山悅其名而遺其實也唐貞元中惣印禪師居踊出山鑿井㗖泥刳木爲庵開山建寺裴公美以踊岀非佳名爲易山之名爲古德山渾院額爲古德山禪院宣鑒嗣之而德山之名遂著劉禹錫集善卷壇在枉山上又曰枉渚在郭東周朴詩曰先生遺跡武陵西且善卷之有壇壇非堯舜時所有地枉山䧟而壇在山上枉渚在東而謂之在西斯則訛之又訛矣太平御覽載江南諸水云湘州記云枉山在郡東十七里有枉焉山西溪口有小灣謂之枉渚山有楚辭焉革曰謹按兩當縣隷鳯州乃古雍州之地子美是詩枉渚乃渚之斜曲而不直者皆謂之枉渚非武陵相潭之枉渚也敏功曰陸雲荅張士然詩曰通波激枉渚悲風薄丘榛注云枉渚曲渚也亦以斜曲爲義田曰鵾雞楚地有之楚辭曰鵾雞嘲唽借問持斧翁幾年長沙客洙曰武帝末暴勝之爲直指使者衣繡衣持斧逐盗長沙長沙湖南地名趙曰持斧御史事指言吴侍御也長沙即潭州賈誼所謫之地哀哀失木狖洙曰西都賦猿狖失木淮南子猿狖顛墜而失木矯矯避弓翮洙曰見鴈矯銜蘆内猿啼失木間趙曰淮南子鴈銜蘆而翔以避弋繳以比吴之失所也亦知故郷樂洙曰飛鳥過故郷猶躑躅未敢思宿昔昔在鳯翔都共通金閨籍洙曰謝玄暉旣通金閨之籍趙曰金閨金馬門也共通者公爲左拾遺與吴共通籍也天子猶蒙塵洙曰僖二十四年傳臧文仲曰天子蒙塵於外敢不奔問官守東郊暗長㦸洙曰書㤗誓東郊不開晁錯曰兩軍相近平地淺草可前可後此長㦸之地也又曰勁弩長㦸射䟽及遠兵家忌間諜洙曰李收爲鴈門謹烽火多爲間諜此輩常接跡臺中領舉劾端夲曰㪯善劾有罪御史職也君必慎剖析不忍殺無辜洙曰書與其殺不辜寧失不經所以分白黒洙曰曹子建蒼蠅間白黒䜛巧乏親踈上官權許與失意見遷斥洙曰謝靈運遭物悼遷斥師曰肅宗時禄山未平賊遣諜者行反間之言以中傷朝臣吴侍御作臺官正領㪯劾之職毎得罪者必爲之分剖曲直是非之理不忍濫殺無罪由是失宰相意遂見斥逐於兩當上官宰相也吴侍御雖有所卞明宰相雖權時從之必竟不悅以此故黜之仲尼甘旅人洙曰王弼仲尼旅人則國可知矣向子識損益修可曰後漢向長字子平潜隱於家讀易至損益卦喟然嘆曰吾知冨不如貧貴不如賤未知死何如生耳趙田舊解引春秋叔向怪鄭人鑄刑書事了不相干朝廷非不知閉口休歎息洙曰張厚此事巳知閉口何勞嘆息余時忝諍臣趙曰時爲拾遺也丹陛實咫尺洙曰僖九年傳天威不違顔咫尺相看受狼狽洙曰見北征詩注至死難塞責蘇曰吕産罪雖至死亦難塞責趙曰以見吴之斥而不能言也行邁心多違洙曰詩行邁靡靡沈休文江海事多違出門無與適於公負明義惆悵頭更白洙曰袁陽源詩義分明於霜趙曰落句見公之恨深矣師曰甫時爲拾遺其去天子不逺可以諌矣坐看吴公之狼狽雖死不足塞吴公之責盖甫自知於吴公有負是以惆悵自刻責其非義也故云於公負明義惆悵頭更白寄栢學士林居自胡之反持干戈天下學士亦奔波洙曰避乱奔散也如波之奔然歎彼幽栖載典籍蕭然暴露向山阿洙曰暴露言无所休庇也漢書衣冠暴露靑山萬里靜散地白雨一洗空垂蘿亂代飄零予到此古人成敗子如何荆楊春冬異風土洙曰風土記荆楊之間春寒而秋煖此所以爲異也巫峽日夜多雲雨洙曰神女朝爲雲暮爲雨赤葉楓林百舌鳴洙曰楓木凡經霜則葉赤百舌鳥也黃泥洙曰一作花野岸天雞舞洙曰天雞鳥名謝靈運海鷗戯春岸天雞弄和風夢符曰右按爾雅釋虫螒天雞注小虫黒身赤頭一名前雞又曰摴雞盗賊縱橫甚宻邇形神寂寞甘辛苦幾時髙議排金門各使蒼生有環堵洙曰使民各安其居也別李袐書始興寺所居不見祕書心若失及見祕書失心疾洙曰旣見君子我心則降安爲動主理信然我獨覺子神充實重聞西方止觀經洙曰佛西方之教其法有大觀大覺也老身古寺風泠泠妻兒待米洙曰又云我且歸去他日杖藜來細聽蘇曰盧璀聞匡山雨璀歸容它日杖藜再造門下細聽淵妙之理赤谷西崦人家鄭曰崦衣檢切師曰按地理志秦州有崦嵫山在赤谷之西曹操與劉備戦于此谷川水爲之丹因號曰赤谷甫乾元元年貶華州司功屬關輔饑亂乾元二年遂弃官之秦州宿于赤谷西崦人家因有此作躋險不自安洙曰謝靈運詩躋險築幽居安一作喧出郊巳淸目溪廻日氣暖逕轉山田熟鳥雀依茅茨師曰言其靜也藩籬帶松菊洙曰陶淵明三逕就荒松菊猶存宋玉曰藩籬之鷃料天地之髙師曰言其幽也如行武陵暮欲問桃源宿洙曰一本作桃花陶潜桃源記曰晉太康中武陵人捕魚從溪而行忽逢桃花林夾爾岸数百歩無雜木芳華鮮美落英􅌭紛漁人異之前行窮林尽見山有小口髣髴有光便捨舟歩入𥘉極狹行四五十歩忽然開朗邑屋連接雞犬相聞男女𬒳髪怡然自樂見漁人大驚問所從來要還爲設酒食云先此避秦難率妻子來此遂與外隔絶不知有漢無論魏晉也旣出白太守太守遣人隨而㝷之迷不復得路也題栢大兄弟山居屋壁二首叔父朱門貴洙日郭景純朱門何足榮郞君玉樹髙洙曰見玉樹臨風前注山居精典籍文雅渉風騷江漢終吾老雲林得爾曹哀絃繞白雪夢符曰右按宋王對楚襄王問曰客有歌郢中者其始下里巴人國中屬和者數千人其爲陽春白雪國中屬而和者數十人而巳又文選鮑昭蜀琴抽白雪郢曲繞陽春尹曰哀絃琴也記曰絲聲哀哀以立廉廉以立志君子聽琴瑟之聲則思忠義之臣又枚乗七發曰龍門之桐髙百尺而無枝使班爾斫斬以爲琴野繭之絲以爲絃孤子之鈎以爲隱九寡之珥以爲㢩使師堂操張伯牙為之歌此亦天下之至悲也太子能強起而聽之乎生㢩音的隱㢩琴上飾取孤子寡婦之寳而用之欲其聲多悲哀九寡九度寡也琴録曰琴曲有幽蘭白雪風入松烏夜啼俗人非知音者故未可與之操未與俗人操洙曰琴有白雪操野屋流寒水山籬帶薄雲靜應連虎穴喧巳去人群筆架霑䆫雨書籖映隙曛鄭曰籖子廉切蕭蕭千里馬洙曰詩蕭蕭馬鳴漢文却千里馬箇箇五花文栢學士茅屋碧山學士焚銀魚洙曰移文云焚芰製而裂荷衣也蘇曰張褒梁天監中不供學士聀御史欲彈劾褒曰碧山不負吾乃焚章長嘯而去白馬却走身巖居日曰光武臨朝或有惰容張湛輙陳諌其失湛常乗白馬帝毎見曰白馬生且復諌矣古人巳用三冬足洙曰東方朔三冬文史足用年少今開萬卷餘洙曰今一作曽見讀書破萬卷晴雲滿户團傾蓋洙曰鄒陽傾蓋如故宼蓋若浮雲秋水浮堦溜决渠洙曰張景陽階下伏泉通堦上水衣生陸土衡豐注溢修霤黄潦侵堦除雲隂結不解通衢化爲渠冨貴必從勤苦得蘇曰徐陵見弟姪讀書陵指其書語人曰人之冨貴必從此勤苦而得男兒須讀五車書洙曰莊子天下篇恵施多方其書五車題郪縣郭三十二明府茅屋壁鄭曰郪七稽切縣名在梓州江頭且繫船鄭曰係吾詣切爲爾獨相憐雲散灌壇雨鄭曰博物志太公爲灌壇令春靑彭澤田頻驚適小國一擬問髙天別後巴東路逢人問幾賢崔氏東山草堂愛汝玉山草堂静髙秋爽氣相鮮新有時自發鍾磬響師曰言无鄰築也落日更見漁樵人盤剥白鵶谷口栗飯煑青泥坊底芹洙曰白鵶谷靑泥坊皆地名石曰坊音防即堤邊也何爲西莊王給事柴門空閉鎻松筠鮑曰王維時𬒳張通儒禁在東山此詩有所歎息故云趙曰唐史鄭䖍傳安禄山反遣張通儒却置百官於東都李監宅尚覺王孫貴洙曰王孫王者之後亦相尊敬之稱韓信傳哀王孫豪家意頗濃洙曰豪貴之家也屏開金孔雀洙曰隋長孫晟貴盛甞畫二孔雀於屏間以擇婿褥隱繡芙蓉洙曰刺繡紋爲芙蓉也蘇曰漢明帝西或献翠毛撚金美蓉𬒳褥并細文玉枕師曰隱如隱几之隱隱倚也且食雙魚美洙曰姜詩孝感地爲之出泉日生雙鯉詩得之以供母誰看異味重洙曰河敬祖食必四方珍異師曰孟子曰魚我所欲史記云彈鋏歸来兮食无魚上客所食之物况兼異味之重累乎門䦨多喜色女婿近乗龍洙曰後漢明帝紀勞賜元氏門闌走卒夢符曰右按楚囯先賢傳孫雋李元礼俱娶大尉桓焉女時人謂桓叔元兩女婿俱乗龍言得婿如龍也李監宅新添落葉春風起髙城煙霧開雜花分户映嬌燕入簷廻一見能傾産虚懐只愛才鹽官雖絆驥名是漢庭來田園古詩二首律詩五首秋行官張望督促東渚耗洙曰一作刈稻向畢淸晨遣女奴阿鄭曰烏葛切小女本作咹稽竪子阿叚往問洙曰文十年王在渚宫注小洲曰渚東渚雨今足佇聞粳稻香洙曰謝靈運詩滮池漑粳稻說文粳稻屬也稻稌也上天無偏頗蒲稗各自長洙曰匈奴傳朕聞天不頗覆地不偏載謝靈運湖中作芰荷迭映蔚蒲稗相因依人情見非類洙曰前漢朱虚矦章請爲吕太后言耕田髙后兒子畜之笑曰顧乃父知田耳若生而王子安知田乎章曰臣知之太后曰試爲我言田意曰深耕穊種立苗欲䟽非其種者鋤而去之太后黙然師古曰以斥諸吕也穊稠也穊種者言多生子孫也修可曰前漢劉章云非其種者鋤而去之田家戒其荒洙曰前漢武帝紀野荒治苛也注曰荒田畒不闢功夫競榾榾除草置岸傍洙曰食貨志芸除草也莊子天地篇榾榾然用力甚多榾苦骨切穀者命之本客居安可忘洙曰命之一云今土范子計然曰五穀者万民之命國之重寳也晉書黎元以穀爲命青春具所務勤墾免亂常吴牛力容易並驅動莫當鄭曰驅區遇切洙曰驅去聲動莫當一云紛遊場丗說滿奮云吴牛見月而喘斉還詩並驅從兩牡兮潘安仁籍田賦浮遊場染履岀說今之水牛生江淮故謂之吴牛畏熱見月疑日所以喘也趙曰容易言其水牛力之最多不以爲難也並驅則雙駕之也埸者疆埸之埸豐苗亦巳穊見上注鄭曰几利切稠也雲水照方塘洙曰劉公幹雜詩方塘含白水有生固蔓延靜一資隄防督領不無人提携頗在綱洙曰携一作挈書盤庚若網在綱有條而不紊荆楊風土暖洙曰周官曰楊州荆州冝稻江淹南中氣候暖朱華陵白雪肅肅候㣲霜尚恐主守踈用心未甚臧洙曰臧善也趙曰守指行官張望也淸朝遣婢僕寄語踰崇岡西成聚必散洙曰書平秩西成不獨陵我倉洙曰詩我倉旣盈又曽孫之庾如坻如京潘安仁籍田賦有云我倉如陵我庾如坻也豈要仁里譽洙曰里仁爲美蘇曰祖宥守志自養文名四馳永嘉太守屢杜駕見之曰君子道髙德尊所致如此非仁里所要譽感此亂丗忙洙曰非欲賙施以要仁里之譽盖亂丗不可不蓄積以爲給也北風吹蒹葭蟋蟀近中堂洙曰北風冬風也言歲向冬矣詩十月蟋蟀入我床下故近中堂荏苒百工休鬰䊸遲暮傷洙曰礼月令霜降百工休謝宣遠詩履運傷荏苒陸士衡䊸鬰游子情謝琨遲暮獨如何蘇曰陸士衡歳華荏苒而莫百工俱休師曰詳味此詩託意於除惡以佑善人其終篇在於聚而能散以閔乱丗之困乏使甫爲政其意必有見于丗者惜夫莫之用也行官張望𥙷稻畦水歸東屯大江北洙曰一枕大江鄭曰屯徒渾切聚也百頃平若桉饒曰六尺爲歩歩百爲畒畒百爲頃六月靑稻多千畦碧泉亂揷秧適云巳引溜加漑灌更僕往方塘鄭曰更古行切洙曰更僕以畨次更代使之也劉公幹方塘含白水决渠當斷岸洙曰西都賦决渠降雨荷挿成雲趙曰鮑明遠蕪城賦崪若断岸公私各地著鄭曰著陟畧切洙曰食貨志理民之道地著爲夲師古云謂安土也浸潤無天旱主守問家臣洙曰陸韓云庶子及家臣分明見溪畔竿竿烱翠羽剡剡生銀漢鄭曰剡以冉切蘇曰桑敬剡剡兮雲生銀漢趙曰曹子洛神賦云或拾翠羽廣雅云天何謂之天漢亦曰銀漢也師曰剡剡竹末削殺貌生銀漢謂水注如傾河漢鷗鳥鏡裏來關山雪邊看秋菰成黒米鄭曰菰音孤洙曰菰米雕胡也趙曰鏡裏雪邊皆収畦水之明㓗也精鑿洙曰一作穀傳白粲夢符曰右按鄭氏釋詩俾䟽斯粺云米之率米于粺九鑿八侍御七趙曰夲草云菰又謂之茭白嵗乆中心生白臺謂之菰手其臺中有黒者謂之茭欎至後結實乃雕胡米也精鑿出左傳粢食不鑿音作鑿謂治米使白晁曰傳合也以菰米合白粲炊飯玉粒足晨炊紅鮮任霞散趙曰蘇秦所謂米貴如玉也上言米粒之珎貴下云紅鮮方是言飯紅潤之色韓信傳晨炊蓐食終然添旅食作苦期壯觀洙曰楊惲田家作苦趙曰魏文帝云旅食南館遺穗及衆多我倉戒滋漫趙曰詩云遺秉滯穗伊寡婦之利師曰利於人而嗇於巳之意茅堂檢校収稻二首香稻三秋末平田百頃間喜無多屋宇幸不礙雲山御裌侵寒氣洙曰秋興賦籍莞蒻御裌衣鄭曰裌古洽切複衣嘗新破旅顔紅鮮終日有玉粒未吾慳夢符曰右按文選尺爐重㝷桂紅粒貴瑶瓊李善云戦國䇿曰蘇秦之楚三月乃得見王談卒辝行楚王曰先生不遠千里而臨寡人曾弗肯留願聞其說對曰楚囯食貴於王薪貴於桂謁者難見於鬼王難見於帝今臣食玉炊桂因鬼見帝其可得乎稻米炊能白秋葵煑復新誰云滑易飽老藉軟俱匀種幸房州熟苗同伊闕春鄭曰縣名在洛陽無勞映渠盌自有色如銀黄曰魏文車渠椀賦車渠玉属也多纎理縟文生于西國其俗寳之惟二儀之普育何萬物之殊形料珍怪之上美無兹椀之獨虚苞華文之光麗發浮彩而揚榮理交錯以連属似将離而復井又梁陸倕蠡杯銘曰用邁羽杯珍逾渠椀實同蠡側形均樸滿廣雅云車渠石次玉刈稻了詠懷稻穫空雲水川平對石門洙曰南都賦縁以劎閣阻以石門趙曰此乃夔州詩而言石門乃下篇雙崖壯此門也舊引蜀都賦阻以石門舊注云石門在漢中之西豈于䕫州事哉非是寒風踈草木洙曰又云落木旭日散雞豚洙曰孟子雞豚狗彘野哭𥘉聞戰樵歌稍出村無家問消息作客信乾坤佐還山後寄二首同作三首一首見宗族門白露黄粱熟分張素有期巳應舂得細頗覺寄來遲味豈同金菊香冝配緑葵趙曰潘安仁賦有緑葵含露老人他日愛正想滑流匙幾道泉澆圃鄭曰澆堅堯切交横落幔坡葳蕤秋葉小洙曰小一本作少一作葉色隱映野雲多隔沼連香芰通林帶女蘿甚聞霜薤白鄭曰薤胡介切軰菜葉似韭重惠意如何楷曰此三篇叙其姪還山後之事分引泉水以灌園故交横而落也慢坡言坡翠如慢葳蕤盛貌秋葉言黄落之葉女蘿乃松蘿也分門集註杜工部詩卷第七, WYG: ''}
