  - {type: variant, offset: 0, length: 306, content: 分門集註杜工部詩卷第七居室下鄰里附律詩三十八首堂成背郭堂成䕃白茅洙曰以白茅覆也緣江路熟俯靑郊趙曰謝玄暉和徐都曹詩結軫青謂青麥盖地青青然也榿林礙日吟風葉洙曰榿木名也不材可充薪而巳惟蜀地最宜種鄭曰榿五來切師曰廣韻玉篇無此字恐刋誤也原叔言此木不村只可充薪又云惟蜀地最冝種不知有何所據籠竹和煙滴露梢洙曰竹有籠筀名趙曰榿林籠竹正川中之物鄭曰籠力鍾切蜀有以鍾籠竹暫止洙曰一作下飛烏将數子頻來語燕定新巢旁人錯比揚雄宅嬾墮洙曰一作慢無心作解嘲洙曰揚雄傳有田一􅒡有宅一區丗丗以農桑爲業哀帝時丁傳董賢用事雄方草太玄或朝雄以玄尚白而雄解之號曰解朝左太冲詠史詩寂寂揚子宅門無卿相輿東寥空宇内所講是玄虚卜居洙曰屈原作卜居一首原往太卜鄭詹尹, WYG: ''}
