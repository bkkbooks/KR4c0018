  - {type: variant, offset: 0, length: 383, content: 分門集註杜工部詩卷第八仙道古詩三首律詩一首昔遊昔謁華蓋君緑𫀆崑玉脚人棺巳上天白日亦寂寞洙曰後漢方術傳王喬為葉令後天下玉棺於堂前吏人推排終不揺動喬曰天帝獨召我邪乃沭浴服飾寢其中蓋便立覆宿昔葬於城西其夕縣車牛皆流汗喘乏而人無知者百姓乃爲立廟號葉君祠暮升艮岑頂洙曰艮岑東北之岑也巾几猶未却弟子四五人入來淚俱落余時遊名山發軔在遠壑鄭曰軔而振切洙曰離騷朝發軔於蒼梧又朝發軔於天津良覿違夙願洙曰謝靈運詩搔首訪行人引領兾良覿含淒向寥廓林昏罷幽磬竟夜伏石閣王喬下天壇㣲月映皓鶴洙曰嵇康琴賦王喬披雲而下墜天台賦王喬控鶴以冲天何敬祖在昔王子喬有道發伊洛迢遞陵峻岳連翩御飛鶴王喬傳或云即古仙人王子喬也劉向列仙傳曰王子喬周靈王太子晉山好吹笙作鳯鳴遊伊洛聞道士浮丘公接上山三十餘年後來於山上告桓梁曰告我家七月七日待我緱氏山頭果乗白鶴駐山頭望之不得到㪯首謝時人而去晨溪嚮虚駃鄭曰駃苦夬切駃馬日行, WYG: ''}
