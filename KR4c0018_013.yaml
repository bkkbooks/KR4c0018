front:
  text: 分門集注杜工部詩卷之十三
  hash: sha256:f18865f2c70ad036fa63d05cf49e3c289aaabf569af20883daaa1ab6fcd4e503
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_013-1a}
body:
  text: 𫐠懷下病附律詩五十二首夔府書懷四十韻昔罷河西尉𥘉興薊北師洙曰公召試集賢授河西尉不拜而安祿山反鮑明逺詩有出自薊北門不才名位晚洙曰事見詩年譜蘇曰鄭侁不才無逺見致此名位迃晚誤𬒳恩私敢恨省郎遲趙曰嚴武再為東西川節度辟公為參謀方為尚書工部貟外郎扈從崆洞日洙曰見常思仙仗過崆洞詩注趙曰肅宗幸平涼公為左拾遺扈從乘輿矣端居灔澦時洙曰謂居夔州也灧澦巳見上注趙曰謂今日寓居夔州灔澦在瞿塘江中故言夔萍流仍汲引樗散尚恩慈鄭曰散蘇旱切洙曰萍之無根任漂流也樗散莊子樗櫟不材而壽者公自言蹤迹萍流仍為人汲引嚴公辟請也不材而猶蒙恩謂除京兆功曹不赴也蘇曰孔融以樗散不才尚賴恩慈之厚也遂阻雲臺宿洙曰一作靈臺宿直宿也後漢鍾離意傳樂嵩家貧為郎常擉直言上無𬒳枕止食糟粳帝夜入臺輒見嵩問其故甚嘉之自此詔大官賜尚書以下朝夕食給幃𬒳皂𫀆及侍史二人趙曰公以病不得歸直也雲臺南宮臺名乃顯宗畫二十八將於南宫雲臺是也常懷湛露詩洙曰湛露天子宴諸矦詩翠華森逺矣洙曰南都賦望翠華之威蕤趙曰翠華者天子之旗也白首颯凄其洙曰謝靈運詩懷賢亦凄其拙𬒳林泉滯生逢酒賦欺文園終寂寞洙曰司馬相如拜為孝文園令漢閣自磷緇洙曰揚雄自投天祿閣見但取不磷緇注病隔君臣議洙曰公以病辝名慙紆德澤私趙曰公𬒳召命以病不行不參預國論徒荷私恩也揚鑣驚主辱洙曰漢書主辱臣死趙曰鑣者馬銜也拔劒撥年衰社稷經綸地洙曰時方艱難有賴於經綸也趙曰公忠義之心為之憤怒乃拔劒慷慨以撥遣年衰也風雲際會期洙曰後漢咸能偶風雲之會血流紛在眼洙曰謂方事戰爭也趙曰揚子川谷流人之血涕泗亂交頥鮑曰卞和泣玉於楚山下三日三夜淚盡繼之以血黃祖涕泗交頥仰天不能告公自喻不見用也四瀆樓船泛洙曰見太常樓船聲欶嘈注趙曰樓船大舟所以載兵所以運糧漢有樓船將軍中原鼓角悲洙曰人心悲憤故鼓角之聲亦悲爾賊壕連白翟洙曰左傳有長狄白狄戰瓦落丹墀洙曰後漢昆陽屋瓦皆落先帝嚴靈寢洙曰靈一作虛趙曰指言肅宗也空虛其寢舊作虛寢非師曰言肅宗收京修寢廟也宗臣切受遺洙曰蕭何傳一代宗臣公孫洪傳受遺則霍光金日彈師曰言受遺詔立代宗也恆山猶突騎洙曰恆山河北遼海競張旗洙曰遼東也田父嗟膠漆洙曰見天下朋友皆膠􅃮注行人避蒺藜趙曰膠漆所以為弓誅求之多則田父以供輸為嗟也鐵蒺䔧所以禦馬所在布蒺藜於地而行人避之周易據于蒺藜避蒺藜言行道梗澀如蒺藜之害揔戎存大體洙曰揔戎元帥也時代宗為帥蘇曰王衍揔戎握符貴其持重不可輕敵使莭制存其大躰降將飾卑詞楚貢何年絶洙曰左傳齊責楚曰尓貢苞茅不入見聞河北諸莭度入朝歡喜口號詩注堯封舊俗疑洙曰堯有可封之俗蘇曰作辨孟子云堯舜之民比屋可封桀紂之民比屋可誅信如此説則堯時諸侯滿天下桀時大辟偏四海故公所以疑之長吁翻北寇趙曰指言安史也一望卷西夷趙曰今有西夷之禍一望思欲席卷之也不必陪玄圃趙曰言巳身以譬不必在朝列也葛仙傳曰崑崙一曰玄圃仙人所居耳鄭曰淮南子崑崙山去地萬一千里上有層城九重或上陪之是謂闐風又倍之為懸圃超然待具茨洙曰莊子徐無鬼黃帝將見大搜于具茨之山至于襄城之野七聖皆迷遇牧馬童子問塗焉在滎陽密縣東凶兵鑄農器洙曰凶一作休老子曰兵者凶器聖人不得巳而用之趙曰公之望太平如此傳所謂銷鑄劒戟為農器也講殿闢書幃洙曰東方朔傳文帝集上書囊為殿幃廟算髙難測洙曰廟堂之籌算也髙難測假意以譏時無善謀者天憂實在兹趙曰天子之憂每在此耳故後篇云獨使至尊憂肝食諸君何以答升平形容真潦倒洙曰嵆康書云潦倒粗踈答效莫支持洙曰答效猶報國也趙曰公之自傷無輔也使者分王命群公各典司恐乖均賦斂不似問瘡痍洙曰喪亂之際公私窘急所分之命所典之司必未至於均賦斂問瘡痍也瘡痍言民傷尓萬里煩供給蘇曰張華出師萬里恐煩長安供給孤城最怨思趙曰孤城指言夔州公雖寓居而眼前所見當為之傷矣緑林寧小患洙曰後漢劉玄傳諸亡命共攻離鄉聚藏於緑林中緑林山在今荆州當陽縣東北詠曰謂荆楚復亂也雲夢欲難追洙曰韓信傳信𥘉之國行縣邑陳兵出入有告信欲反書聞上患之用陳平謀偽遊於雲夢者信果來朝遂擒以歸趙曰憂藩鎮為患也詠曰恐其難擒也即事須嘗膽洙曰越句踐既脫會稽之難思有以報吳出入嘗膽蒼生可察眉洙曰言時多盜賊也列子却雍能視盜察眉知之千無一遺蘇曰東方朔言蒼生憂樂見其眉事可察近丗注工部詩者妄引事真可為笑趙曰公意言蒼生為盜賊之情可得於眉睫之間但當撫綏之則不為盜耳議堂猶集鳯洙曰議一作義蜀都賦議殿爵堂蘇曰班孟堅曰髙林論議者皆駕鳯騎鯨之士正觀是元龜洙曰言欲求治當以正觀為元龜也龜言有先知之靈爾趙曰議堂者議論之堂也猶集鳯又申言廟堂諸公如鳳之集欲除上所陳之患但以正觀為龜鑑可也處處喧飛檄洙曰左太沖詩云邊城苦鳴鏑羽檄飛京都張景陽常懼羽檄飛神武一朝征家家急競錐洙曰江淹書云競錐刀之利孝祥曰其賦斂之急如此蕭車安不定趙曰漢蕭育傳哀帝南郡多盜賊拜育為太守以育耆舊名臣乃以三公安使車載育入殿中受䇿曰南郡盜賊為害朕甚憂之以太守威信素著故委之官其為民除害安元元而巳舊注所引非特無義又以蕭育為望之誤矣蜀使下何之洙曰蕭望之為郎常有飛雉隨車飛翔司馬相如為郎使蜀諭巴蜀父老趙曰公之詩意乃信今日遣使在寡誅求除盜賊之事而巳非若相如諭蜀父老也師曰言朝廷遣人安撫之猶不服畢竟將何往言無所逃也釣瀨踈墳籍洙曰後漢嚴光披羊裘釣澤中後人名其釣處為嚴陵瀨踈墳籍言典籍所稀載也耕巖進奕碁洙曰揚子谷口鄭子真不詘其志耕于巖石之下名震于京師趙曰此公自敘釣瀨則以嚴陵自比蓋陵釣於七里灘也耕嵓則以鄚子真自比蓋鄭子真耕于嵓谷之下也踈墳典進奕碁乃間曠而然地蒸餘破扇蘇曰司空逹嶺南蒸濕北人乍居殊不冝風土破扇嘗不釋手冬暖更纎絺洙曰前覽物詩所謂形勝有餘而風土惡此見之矣趙曰以夔之風土多暄也豺遘哀登楚洙曰王仲宣七哀詩西京亂無象豺虎方遘患又南登灞陵岸回首望長安趙曰乃是荆州之樓此謂登楚哀登楚者哀登楚之人也麟傷泣象尼洙曰史記魯哀公西狩獲麟孔子見之曰吾道窮矣喟然歎曰莫我知夫公道不行於時故悲歎若孔子之見麟也趙曰孔子之生其父母禱之於尼丘故名丘字仲尼而傳記又載孔子之首象其山故公云衣冠迷適越趙曰言欲離夔而南下且未能所以迷適越莊子曰宋人資章甫而適諸越越人斷髮文身無所用之也藻繪憶遊睢洙曰睢水也漢武帝祀后士於睢水之上夢符曰右按陳孔璋與魏文帝書曰遊睢渙者學藻繪之綵傳云睢渙之間出丈章故其黼黻絺繡日月華蟲以奉宗廟服御焉前漢書郊祀志武帝立后土祠於汾隂睢上音雖此遊睢之字當作雖述異志曰睢渙二水波文皆若五色其人多文章故名繢水又九州要記曰睢渙之間出文章天子郊廟御服出焉尚書所謂厥篚織文者也李善曰睢渙二水之名其處能織藻繪錦綺天子御服出焉趙曰睢水在南都昔之宋州也公少年嘗遊故云憶也賞月延秋桂洙曰沈休文山中咸可悅賞逐四時移春光發隴首秋風生桂枝趙曰三秋皆秋桂也而非八月不足以當之故定此篇為八月作也為其當秋延賞故曰秋桂傾陽逐露葵洙曰曹子建表若葵藿之傾太陽大庭終反朴趙曰幸天下之治平反淳復朴也大庭氏在莊子與赫胥氏粟陸氏相連大率至德之丗也舊注便安排作神農之别號非是京觀且僵尸洙曰翟方進傳詔曰古者伐不敬取其鯨鯢築武軍封以為大戮於是乎有京觀以懲淫慝此左傳載楚莊王辝也髙枕虛眠晝哀歌欲和誰洙曰左太沖哀歌和漸離謂若傍無人南宮載勳業洙曰後漢永平中顯宗追感前丗功臣乃圗畫二十八將於南宫雲臺凡百愼交綏洙曰左傳交綏而退蘇曰此兩句深戒大臣及諸將欲功成圗像當以交綏為愼勿輕使志之不堅而後可也師曰自釣瀨以下乃子美自𫐠傾陽逐露言慕君也綏乃車綏愼乃綏當以兵為可戒秋日荆南述懷三十韻昔承推奬分愧匪挺生材遲暮宫臣忝洙曰陸機詩矯迹厠宫臣艱危衮職陪洙曰詩衮職有闕趙曰公自言當肅宗時拜拾遺掌供奉諌諍揚鑣隨日馭鄭曰鑣悲驕切馬銜也折檻出雲臺洙曰朱雲折檻顯宗畫二十八將於雲臺見致君丹檻折趙曰言諌諍不合帝意而出也罪戾寬猶活干戈塞未開鄭曰塞悉則切趙曰上欲誅甫賴張鎬救之而免言一出之後干戈日相尋也星霜玄鳥變洙曰古詩玉衡指孟冬衆星何歷歷白露霑野草時節忽復易秋蟬鳴樹間玄鳥逝安適趙曰玄鳥燕也星霜之中見玄鳥變則不一其年矣身丗白駒催洙曰莊子知北遊人生天地之間若白駒之過卻忽然而巳釋文白駒或云日也郤本作隙張良願棄人間事學道輕舉吕后強食之曰人生如白駒之過隙何自苦如此良不得巳強食又酈生往説魏豹豹謝曰人生一丗間如白駒過隙師古曰言其速疾也白駒謂曰影也隙壁隙伏枕因超忽扁舟任往來九鑽巴噀火鄭曰噀蘇困切洙曰語鑽燧改火後漢欒巴噀酒救蜀火謂之巴噀火則欒巴所噀之火以形容其在成都及東川及夔州凡在蜀地者九遇淸明三蟄楚祠雷洙曰易龍蛇之蟄楚詞雷填填兮雨冥冥鮑曰山谷簡王觀復曰子美入蜀下峽年月詩中可見其曰九鑽巳噀火三蟄楚祠雷則往來兩川九年在夔州三年可知也趙曰公以八月在夔在江陵是為雷之三蟄矣雷以三月而奮而以八月而蟄也謂之楚祠雷則楚人所祠之雷蓋楚人好祠祭也望帝傳應實洙曰見杜鵑詩注昭王問不回洙曰僖四年傳齊侯之師侵蔡蔡潰遂伐楚楚子使與師言曰君處北海寡人處南海唯是風馬牛不相及也不虞君之涉吾地也何故管仲對曰爾貢苞茅不入王祭不共無以縮酒寡人是徴昭王南征而不復寡人是問對曰貢之不入寡君之罪也敢不共給昭王之不復君其問諸水濵蛟螭深作橫鄭曰橫尸孟反豺虎亂雄猜趙曰兩句因託以典焉蓋是時有跋扈之強臣賊盜之巨猾故也素業行巳矣浮名安在哉蘇曰李膺前輩浮名安在爭如一鐏醇醪斷送歲月何苦區區計較利名耶琴烏曲怨憤庭鶴舞摧頽洙曰琴烏由烏夜啼也吳人舞白鶴於市趙曰其所怨憤寄之琴曲則烏夜啼也而庭鶴為之舞矣秋水漫湘竹洙曰湘妃揮淚濺竹竹皆班隂風過嶺梅洙曰大庾嶺多梅人號梅嶺苦搖求食尾洙曰司馬子長報任少卿書曰猛虎在深山百獸震恐及在檻穽之中搖尾而求食積滅約之漸也常曝報恩腮洙曰見浩蕩報恩珠注三秦記江海集龍門魚登者化龍不登者點額曝腮鄭曰腮蘇來切魚頰也結舌防讒柄探腸有禍胎鄭曰探他含切洙曰前漢博士結舌而不敢談又鉗口結舌梅乘福有基禍有胎也蒼茫步兵哭洙曰阮籍為步兵哭途窮展轉仲宣哀趙曰仲宣王粲也以避難流離作七哀詩飢籍家家米鄭曰杜元注籍入聲秦昔反愁徴處處杯休為貧士嘆任受衆人咍得喪𥘉難識榮枯劃易該差池分組冕合沓起蒿萊不必伊周地皆登屈宋才洙曰登一作知伊尹周公屈原宋玉漢庭和異域洙曰前漢胸奴傳贊和親之論發於劉敬是時天下𥘉定遭平城之難故從其言約結和親賂遺單于兾以救安邊境孝惠髙后時遵而不違胸奴寇盜為衰止而單于反以加驕倨逮至孝文與通關市妻以漢女增厚其賂歲以千金而胸奴數背約束屢被其害是以文帝中年赫然發憤遂躬戎服親御鞍馬從六郡良家材力之士馳射上林講習戰陳聚天下精兵軍於廣武顧問馮唐與論將帥喟然嘆息思古名臣此則和親無益巳然之明效晉史拆中台洙曰晉中台拆而張華誅霸業尋常體宗臣忌諱災趙曰中國之於夷狄甘心於和親此霸業尋常之體也而大臣充使或留或誅則宗臣以為忌諱矣群公紛戮力聖慮窅徘徊鄭曰窅伊鳥反深目也數見銘鍾鼎洙曰季武子作林鍾之銘銘魯公衛孔俚鼎銘真冝法斗魁洙曰隋志北斗一至四為魁五至七為杓願聞鋒鏑鑄洙曰賈誼過秦論秦收天下之兵聚之咸陽銷鋒鏑鑄以為金人十二以弱天下之民趙曰家語顔回云願鑄劎戟以為農器莫使棟梁摧洙曰衛玠卒謝琨哭之曰梁棟折不覺哀趙曰晉陸玩拜司空謂賔客曰以我為三公是天下無人矣索酒著柱間祝曰當今乏才以尓為柱石之目莫傾人梁棟盤石圭多剪洙曰漢封子弟盤石之宗成王封康叔剪桐葉為圭凶門轂少推洙曰馮唐傳曰臣聞上古王者遣將也跪而推轂修可曰唐李衛公對唐太宗曰古者命將受鉞鑿凶門而出垂旒資穆穆洙曰禮天子穆穆祝網但恢恢洙曰成湯祝網老子天網恢恢東京賦慕天乙之弛罟因教祝以懷人赤雀翻然至黃龍不假媒洙曰春秋孔漁圖曰鳥化為書孔子奉以告天赤雀集書上化為黃玉後漢黃龍見于譙趙曰此言祥瑞也遁甲曰赤雀不見則國無賢注赤雀主銜書陽精也孫應圖曰黃龍者四龍之長也王者不漉池而漁則應和氣而遊於池沼此皆為瑞之證矣賢非夢傳野洙曰髙宗夢得説於傳巖之野隱類鑿顔壞洙曰楊雄傳或鑿壞以遁莊子魯君聞顏闔賢欲以為相使者往聘因鑿後垣而亡壞壁也自古江湖客冥心若死灰趙曰莊子心可使若死灰師曰唐六典注云輔闕拾遺武后垂拱中置取山甫輔衮闕名官子美肅宗時為左拾遺故云陪衮職集中又有不才同輔衮備貟竊衮衮職曽無一字輔謝放三司推門狀云猥厠衮職願少禆輔皆以拾遺之官同輔君闕故也琴録曰琴曲有長清短清幽蘭白雪風入松烏夜啼吳兢古樂府解題云烏夜啼宋臨川王義慶造也其辭籠窗窗不開烏夜啼夜啼望郎來鮑明逺舞鶴賦始連軒以鳯蹌終宛轉而龍躍躑躅徘徊振迅騰摧願聞鋒鏑鑄若家語顔回願鑄劒戟以為農器是也往在詩云鋒鏑供犂鋤亦此意元注引鑄金人事非也晉陸抗拜司空謂賔客曰以我為三公是天下無人矣索酒著地祝曰當今乏才以爾為柱石之臣莫傾人棟梁史記成王與叔虞戲削桐葉為圭曰以此封君史佚曰天子無戲言言則史書之禮成之樂歌之於是遂封虞叔於唐李衛公對唐太宗曰古者出師命將齋三日授之以鉞推其轂曰進退惟時軍中伹聞將軍之令不聞君命揚鑣隨日馭謂侍肅宗於靈武也折檻出雲臺謂諌房琯事見逐華州司功故云出雲臺也火九鑽雷三蟄則知子美之客巴蜀凡三年矣望帝乃蜀帝其魂化為杜鵑父老相傳其言不虛故云傳應實子美居楚地託言昭王不回之事蛟螭豹虎以喻荆楚盜賊之多自亂離以來元勳舊德皆檳棄不用而武夫年少多驟遷故子美有得喪難識榮枯易該之語而下文又言差池分組冕合沓起髙萊又言賢非夢傳野皆託風濫進者多也漢庭和異域言回紇送兵來助唐求尚主也晉史拆中台言房琯得罪也霸易尋常體言雜用霸道也宗臣忌諱災言宗臣不敢直言也盤石圭多剪言廣封同姓也凶門轂少推言命將多非其人也子美意欲朝廷禮敬大臣寬大憲網自然朱鳯來黃龍至無使賢人隱遁則天下不約而自平也隱類鑿顔壞子美自喻遣悶地闊平沙岸舟虛小洞房洙曰謝玄暉洞房殊未曉使塵來驛道城日避烏檣洙曰一作烏槍趙曰泊船之處近城日為城所障不照及檣故云避烏檣此公之巧句也暑雨留蒸濕江風借夕涼蘇曰段瑄泛舟夜聞江風清冷瑄欣然曰馮夷借我一夕之涼趙曰當暑雨之際留住蒸濕而得江風借之以夕涼也行雲星隱見鄭曰見賢遍反趙曰雲合則星隱雲過則星見也疊浪月光芒洙曰宋玉朝為行雲趙曰前浪後浪月光皆照也螢鑒緣帷徹趙曰螢光可以照物故曰螢鑒蛛絲骨鬢長鄭曰罥音畎泰伯曰罥鬢猶掠鬢也哀箏猶憑几鄭曰憑皮孕切鳴笛竟霑裳趙曰𥘉聞哀箏猶忍淚憑几聽之而巳至聞鳴笛則情不禁矣於是乎淚竟霑裳也倚著如秦贅鄭曰贅之芮切洙曰賈誼傳秦人家冨子壯則出分家貧子壯則出贅應劭曰出作贅壻也師古曰言其不出妻家亦猶人身體之有贅非應所有也一説贅質也家貧無有娉財以身為質也君平曰子美寓他鄉如贅壻然過逢類楚狂洙曰楚狂接輿氣衝看劒匣洙曰任彥升劒氣凌雲又張華見劒氣衝牛斗頴脫撫錐囊洙曰平原君傳曰夫賢士之處丗也譬如錐之處囊中其末立見毛遂曰使遂早得處囊中乃脫頴而出非特末見而巳妖孽關東臭兵戈隴右瘡蘇曰班仲升云隴右兵戈瘡痍未艾時清疑武略丗亂局文場趙曰當時淸則以武略疑而不用及丗亂則文場局而不展矣餘力浮于海洙曰語道不行乘桴浮于海端憂問彼蒼洙曰見賦端憂多暇注詩彼蒼者天百年從萬事故國耿難忘蘇曰辛受老年百事俱廢無心繫戀唯故國舊友耿耿難忘趙曰言百年之內任從事緒之多而唯有懷鄉不能巳也風疾舟中伏枕書懷二十六韻奉呈湖南親友軒轅休製律洙曰甫自注云伏羲造琴神農作琴舜彈五弦舉歌南風之篇矣史記黃帝名曰轅軒前漢律歷志黃帝使伶倫自大夏之西崑崙之隂取竹之解谷生有竅厚均者斷兩節間而吹之以為黃鍾之宫制十二簘以聽鳯鳴其雄鳴為六雌鳴亦六此黃鍾之宮而皆可以生之是為律本虞舜罷彈琴洙曰樂記舜作五弦之琴以歌南風尚錯雄鳴管趙曰前所謂十二筒以聽鳯之鳴其雄鳴六也猶傷半死心洙曰枚乘七發云龍門之桐髙百尺而無枝其根半死半生冬則風雪之所激趙曰此因風疾而上數句所以戲為怨恨風求之語聖賢名古邈羇旅病年侵洙曰范蔚宗聞道雖巳積年力互頽侵陸士衡前路既巳多後塗隨年侵趙曰言造琴律之聖賢其名巳古逺矣舟泊常依震洙曰震東方也有震澤湖平早見參洙曰早一作半參曉星也鮑昭曉星正參落如聞馬融笛洙曰馬融好吹笛有長笛賦序云性好音律能鼓琴吹笛若倚仲宣襟洙曰王粲登樓賦云慿軒檻以遙望兮向北風而開襟今兩句言風來舟中如吹笛之所召倚樓之所逢也故國悲寒望洙曰顔延年息徒顧將夕極望梁陳分故國多喬木空城疑寒雲趙曰故國長安也悲當寒望之中群雲慘嵗隂洙曰謝惠連雲賦嵗將暮時既昏寒風積愁雲繁趙曰歲寒謂嵗晚也水鄉霾白蜃楓岸疊靑岑蘇曰顧穆洞庭楓岸逺幾疊靑岺髙趙曰楚詞曰江水湛湛兮上有楓楚岸多楓故曰楓岸鬱鬱冬炎瘴洙曰張平子欎鬱不得志魏文帝鬱鬱多愁思濛濛雨滯淫洙曰東山零雨其濛勃海方淫滯鼓迎非祭鬼洙曰語非其鬼而祭之諂也趙曰楚俗好巫祀彈落似梟禽洙曰賈誼鵩賦云鵩鳥似梟鮑曰莊子見彈而求梟炙興盡才無悶洙曰王子猷興盡而返易遁丗而無悶也愁來遽不禁生涯相汩沒時物自蕭森洙曰自一作正張景陽溪壑無人迹荒林鬱蕭森疑惑尊中弩修可曰抱朴子曰豫祖郴為汲令注風俗通作汲令應郴以夏至日請主簿杜宣飲酒北壁上有懸赤弩照於杯中如蛇宣惡之及飲得疾後郴知之延宣於舊處置酒其見如𥘉因謂宣曰此弩影耳宣疾遂廖此與樂廣傳蛇影事大相類特弓與弩異耳淹留冠上簮洙曰移文借問披簪逸海岸沈休文待此未抽簪趙曰冠簮卿大夫之禮也致仕開散者謂之投簪今云淹留冠上簮則公以猶未能遂棄冠冕也牽裾驚魏帝洙曰辛毗諌帝帝怒起引帝𥚑趙曰言為左拾遺時諌房琯不冝廢而肅宗怒之也投閣為劉歆洙曰見子雲識字終投閣注趙曰揚子雲校書天祿閣上以劉歆嘗問竒字而歆以言祥祥得罪有司誤以連子雲子雲為投閣今之為劉歆則又言琯既貶邠州刺史而公出為華州司功也狂走終奚適洙曰吾捨魯奚適蘇曰王修曰吾狂坐走諸侯門終身必竟奚適乃束書隱三茒山微才謝所欽洙曰陸士衡寤寐靡安豫願言思所欽吾安藜不糝洙曰孔子藜羮不糝汝貴玉為琛趙曰女古汝字言湖南親友也貴玉為琛琛者寶也詩云來獻其琛烏几重重縛鶉衣寸寸針蘇曰賈懷苦讀書常披一衲衣每寸數百針里人畏服趙曰烏皮几出鶉衣即衣如懸鶉之謂哀傷同庾信洙曰庾信作哀江南述作異陳琳趙曰陳琳健於章表曹公見其檄而頭風愈今公自謙以為𫐠作不能似之十暑岷山葛洙曰葛蜀布也十暑不易言其貧也三霜楚戶砧洙曰三霜居楚三易星霜叨陪錦帳坐洙曰郎官有錦帳見漢百官志趙曰公為尚書工部貟外郎故也郎官賜錦帳緌𬒳久放白頭吟趙曰止以老而吟詠耳白頭吟本是卓文君以相如晚年置妾而作令公借用之也反朴時難過洙曰老子還淳反朴忘機陸易沉趙曰史記東方朔坐席中酒酣據地歌曰陸沉於俗文選道勝貴陸沉注無水而沉謂之陸沉應過數粒食洙曰鷦鷯賦巢林不過一枝每食不過數粒得近四知金洙曰漢書王密懷金遺楊震曰夜無知者震曰天知地知子知我知是四知遂不受密慙而退春草歸恨洙曰劉安招隱王孫遊兮不歸春草生兮萋萋源花費獨尋洙曰見上欲問桃源宿注轉蓬憂悄悄洙曰見生涯濁轉蓬注柏州詩憂心悄悄行樂病涔涔洙曰鮑明逺有行樂至城東橋詩注謂昭有疾服藥行以宣導之漢霍光夫人顯謀毒許后后免身取附子并合大醫大九飲之有頃涔涔也藥中得無毒乎對曰無遂加煩悶而崩瘞夭追潘嶽洙曰潘嶽有掉亡詩懷舊寡婦一賦趙曰公必有喪子之禍但無所考矣潘嶽西征賦曰夭赤子於新安坎洛測而瘞之持危覔鄧林洙曰山海經云夸父死棄其杖而為鄧林列子云夸父不量力欲返日影逐之於嵎谷之際渴欲得飲赴飲河渭不足將走北飲大澤未至道渴而死棄其杖尸膏肉所浸生鄧林彌廣數千里焉蹉跎翻學步洙曰阮籍娛樂未終極白日忽蹉跎壽陵餘子學步於邯鄲失其故步匍匐而反趙曰公自傷其方隨流俗也感激在知音趙曰公自傷其無識之者也子期死伯牙破琴絶絃身不復鼓却假蘇張舌洙曰蘇張蘇秦張儀也髙誇周宋鐔洙曰莊子説劒王曰天子之劒何如曰天子之劒以燕石為鋒齊岱為鍔晉魏為脊周宋為鐔韓魏為鋏矣納流迷浩汗洙曰海賦騰湧浩汗蘇曰孔融子不見東海納萬流浩汗不溢不驚君子之量當亦如此峻址得嶔崟城府開清旭蘇曰言諸公在幕府也松筠起碧潯趙曰公自言其舟之所在潯韻書云旁深也披顔爭倩倩趙曰言往披承諸公之顔爭為倩倩以相待詩云巧笑倩兮主在乎言笑也逸足競駸駸洙曰詩載驟駸駸趙曰以駸馬比諸公也朗鑒存愚直趙曰愚直公自謂也朗鑒則所以望諸公也皇天實照臨洙曰左傳皇天后士實聞此言公孫仍恃險洙曰後漢公孫𫐠恃其地險衆附有立志蜀都賦長城結險吞若巨防一夫守隘萬夫莫向公孫躍馬而稱帝劉宗險輩而自王左傳先王不恃噞興焉侯景未生擒洙曰侯景陷臺城者書信中原闊干戈北斗深畏人千里井夢符曰右按西山十二真君傳許真君弟子施岑揮蜃中其股遂奔入豫章城西門外朴泉井中真君尋井脈追之直至長沙趙曰蘇氏演義小説載金陵記曰南計吏止於傳舍間及將就路以馬殘草㵼於井中而去謂無再過之期不久復由此飲於此井遂為昔時銼即刺喉而死故後人戒之曰千里井不㵼銼薛夢符引許真君事非千里井也問俗九州針洙曰揚雄傳贊曰針莫善於虞針作州針晉灼曰九州之針戰血流依舊洙曰見邊城流血成海水注軍聲動至今葛洪尸定解洙曰後漢方術傳注尸解者言將登仙假託為尸以解化也葛洪傳卒年八十一視其顔色如生躰亦柔軟舉尸入棺甚輕如空衣也以為尸解得仙許靖力還任洙曰蜀志曰許靖字木少與從弟劭俱知名並有人倫臧否之稱而私情不協排靖不得齒敘也趙曰王朗與靖書曰足下周遊江湖以暨南海可謂遍矣如靖之力還可勝任此公言南征而避難家事丹砂訣洙曰葛洪為何漏令求丹砂無成涕作霖洙曰甫注云伏羲退瑟神農氏作琴舜彈五絃舉歌南風之篇有矣師曰抱朴子曰豫祖郴為汲令注風俗通作汲令應郴以夏至日請主簿杜宣飲酒北壁上有懸赤弩照於杯中如蛇宣惡之及飲得疾後郴知之延宣於舊處置酒其見如𥘉因謂宣曰此弩影耳宣疾遂瘳此乃樂廣傳蛇影事大相類特弓與弩兾耳莊子載孔子之言曰方且與丗違而心不屑與之俱是陸沉者也其市南冝僚耶文選詩道勝貴陸沉注無水而沉謂之陸沉史記武帝時齊人東方朔坐席中酒酣據地歌曰陸沉於俗避丗金馬潘嶽傷弱子序曰三月壬寅弱子生五月之長安壬寅次於新安之千秋亭甲辰而弱子夭乙巳瘞于亭東故嶽西征賦云夭赤子於新安坎路側而瘞之是也按前漢書衛青為大將軍霍去病為驃騎將軍定令令秩與大將軍等自是青曰衰而去病日益貴故人門下多去事去病輒得官爵惟獨任安不肯去子美是詩首句云昔在嚴公幕俱為蜀使臣及有塤箎金石食恩之語元注云嚴公沒後老母在堂使君溫清之問甘肥之禮名數若己之閨庭焉太夫人傾逝又撫孤之情不減骨肉以是考之足以見蕭使君如任安之事衛靑有終始之義元注引與司馬遷書責以古賢臣之義非是律所以調八風舜琴亦歌南風阜財解愠今風疾足見時律不調故曰尚錯鳩鳴管如聞馬融笛言嚴武死也若倚仲宣襟言子美無所依也鼓迎非祭鬼巴蜀多淫祀如事烏鬼之類昔賈誼困於長沙忌鵩鳥今子美亦然故云彈落似梟禽疑惑樽中弩言久病也淹留冠上簮言不用也牽𥚑驚魏帝諌房琯事也子美為房琯得罪亦若子雲投閣為劉棻故也劉棻嘗從雄學作竒字既而棻得罪事逮雄使者收雄雄遂投閣今作劉歆未知所以謝所欽言諸公禮待也十暑岷山葛言十年在蜀三霜楚戶砧言三年在楚反朴時難遇言不見治平也應過數粒食得近四知金言諸公餽食賜金也春草封歸恨言不得歸鄉也源花費獨尋言尚避亂也瘞夭追潘嶽悼嚴武之亡也持危覔鄧林言武之死朝廷失大材也子美亦失其故步而感激在於諸公之知巳葛洪尸定解以喻武之化去武以金石得病而殂故云巢許山林志子美自謂隱晦而以夔龍期蕭使君水宿遣興奉呈群公魯鈍仍多病洙曰語參也魯蘇曰鄭玄魯鈍多病近稍倦書逢迎逺復迷耳聾須畫字蘇曰王笠不仕佯狂詐聾每説話即畫字後隱嵩山隋文纍詔不起髮短不勝箆澤國雖勤雨修可曰穀梁傳正月不雨言不雨者勤雨也注思雨之勤炎天竟淺泥小江還積浪趙曰江雖小而積浪則以炎天水漲也弱纜且長堤歸路非關北趙曰繫之長堤也下句言長安不可得歸耳俯曰子美北人未得歸鄉故云歸路非關北行舟却向西暮年漂泊恨今夕亂離啼童稚頻書扎洙曰古詩烈士暮年又遺我一書扎盤餐詎糝藜洙曰孔子陳蔡間七日不火食藜藿不糝我行何到此物理直難齊洙曰莊子齊物髙枕翻星月嚴城疊鼓鞞洙曰張景陽此郭非吾城入聞鞞鼓聲定功曰禮記鼓鼙之聲歡風號聞虎豹洙曰蕪城賦風嗥雨嘯又苦寒詩虎豹夾路蹄水宿伴鳬鷖洙曰蜀都賦晨鳬且至候鴈銜蘆雲飛水宿哢吭淸渠異縣驚虛往洙曰古樂府它鄉復異縣同人惜解携洙曰易出門同人蹉跎長泛鷁趙曰鷁大鳥船首畫之以驚水神俯曰泛鷁行舟也展轉屢鳴雞嶷嶷瑚璉器鄭曰嶷魚力切洙曰子貢瑚璉器夢符曰右按丗説謝琨問羊孚何以器舉瑚璉羊曰故當以為接神之器隂隂桃李蹊洙曰李廣傳桃李不言下自成蹊阮籍嘉樹不成蹊東園桃與李餘波期救涸洙曰僖二十三年傳其波及晉國者君之餘也莊子外篇車轍中有鮒魚曰吾得斗升水可以活矣費日苦輕齎趙曰言為客之欠有費時日其所輕齎於貿易而罄盡矣杖䇿門闌邃昱曰一本杖作支肩輿羽翮低趙曰杖䇿肩輿言出謁於人矣自傷甘賤役誰愍強幽棲蘇曰桓簡失意居九華山嘆曰今日悔迹朝中故人略無愍強幽棲之心巨海能無釣洙曰任公子投竿東海浮雲亦有梯勳庸思樹立語默可端倪贈粟囷應指洙曰魯肅字子敬家富於財常散以賑窮乏結豪士得鄉邑之心時盧江周瑜為居巢長聞之往求資糧肅時有米二囷各三千斛直指一困與瑜瑜益竒之乃結僑孔之交芻曰自嶷嶷瑚璉器以下敘美群公能餽其貧故有贈粟囷應指之句登橋柱必題洙曰成都記云升遷橋司馬相如𥘉西去題其柱曰不乘赤車駟馬不過此橋後果以傳車至其處橋在望鄉臺東南一里管華陽縣趙曰上數句公之所負如此蓋不以有求於人而遂屈也丹心老未折夢符曰右按文選謝玄暉詩既秉丹石寧流素絲涕又古樂府半溪渡曲本厠偏伍半一戰殄凶渠制賜文犀節驛報紫泥書入營陳御蓋還家乘紫車皇恩空已重丹心帳不紓渡瀘且不畏夌溪嗟有餘時訪武陵溪洙曰别賦心折骨驚武陵溪秦人避亂之處官定後戲贈鮑曰天寶十三年公年四十三在京師明皇朝獻太清宫享廟及郊獻賦三篇帝竒之使待制集賢院令宰相陳希烈試文章為希烈刻忌權河西尉不拜改衛率府參軍不作西河尉凄涼為折腰洙曰陶潛為彭澤令郡遣督郵至縣吏白應束帶見之潛歎曰吾不能為五斗米折腰拳拳事鄉里小人老夫怕趨走率府且逍遙洙曰老夫自言也謂州縣有趍走之勞故怕率府間曹得自肆而已趙曰𥘉授西河尉辝不行更授率府兵曹師曰甫自言怕州縣之職趍走勞頓不若帥府間曹得以自肆也耽酒須微祿狂歌託聖朝蘇曰崔獬狂歌痛飲託聖朝之至化故山歸興盡回首向風飈趙曰謂須微祿故無復歸山之興但臨風回首而已至德二載甫自京金光門出道歸鳯翔乾元𥘉從左拾遺移華州掾與親故別因出此門有悲往事此道昔歸順西郊胡正煩洙曰公昔有賊中間道歸行在趙曰言其逃賊欲之行在是為歸順在金光門道出故曰昔歸順也言當歸順時正值胡在西郊尓至今猶破膽應有未招魂洙曰言履艱危膽破魂飛也宋玉有招魂文近得歸京邑洙曰得一作恃移官豈至尊洙曰豈一作逺言移外官非天子意也趙曰言得返長安為拾遺而遽移華州本非至尊之意特以自貽伊戚耳蓋公以論房琯有才不宜廢免坐此而貶也無才日衰老駐馬望千門趙曰使千門萬戶之語也凝望於宫禁倣徨不忍去也師曰甫陷祿山軍中竄歸鳯翔謁肅宗故云歸順後論房琯事移華州司功非出天子之意蓋讒邪毀傷之也漢武帝宫中為千門萬戶之遊駐馬望千門蓋戀君不忍去也寓目趙曰左傳楚子玉之語曰得臣與寓目焉一縣蒲萄熟沈曰永徽圖經曰蒲萄生隴西五原墩煌山谷今處處有之秋山苜蓿多洙曰西域人好飲蒲萄酒馬食苜蓿二師伐宛將種歸中國沈曰神農本草云苜蓿味苦平無毒主安中利人可久食陶隱居云長安中有苜蓿園北人甚重南人不食以其無味故也關雲常帶雨塞水不成河羌女輕烽燧洙曰輕一作搖趙曰烽燧一物二名燃火曰烽舉炬曰燧胡兒制駱駝洙曰制一作製自傷遲暮恨喪亂飽經過聞官軍收河南河北新添劒外忽傳收薊北𥘉聞涕淚滿衣裳却看妻子愁何在漫卷詩書喜欲狂趙曰讀書之際聞巳收薊北得妻子有長聚之慶所以漫卷之而喜欲至於狂也白日放歌須縱酒靑春作伴好還鄉即從巴峽穿巫峽便下襄陽向洛陽余曰田園在東京空囊翠柏苦猶食修可曰楚辝云山中人兮採杜若飲泉石兮飯松柏又列仙傳云仙人偓佺食松柏之實晨霞朝可餐田曰楚辝云餐六氣而飲沆瀣漱正陽而餐朝霞注陵陽子明經云春食朝霞者日始出赤氣也秋食淪漢者日沒後赤黃氣也冬食沆瀣者北方人半氣也憂食正陽者南方日中氣也華陽真妃曰日者霞之實霞者日之精君唯聞服日之法未聞餐霞之法也蘇曰陶弘景餐霞吞氣吾不知也嵓邊清泉翠柏亦可濟飢吾豈能著腳踏是非埸中趙曰楚辝云漱正陽而餐朝霞注陽陵子明經云春食朝霞日始出赤氣也師曰甫欲餐霞食柏髙遁于丗丗人共鹵莽吾道屬艱難不㸑井晨凍洙曰樵蘇不㸑清談而巳趙曰以不爨故不及井而井晨凍矣無衣床夜寒洙曰詩無衣無褐何以卒歲囊空恐羞澀留得一錢看蘇曰晉阮孚山野自放嗜酒日持一皂囊遊會稽客問囊中何物但一錢看囊庶免其羞澀趙曰趙一之文籍雖滿腹不如一囊錢也師曰甫嘗云語言少味無阿堵少味者正羞澀之謂也遣懷愁眼看霜露寒城菊自花蘇曰古出塞云寒城菊白花曠野木脫盡子美全用深有包畜賖洙曰夜一作也蘇曰馬舉好飲夜聞鄰家有酒使童兒去賖鄰家以雙瓶贈之舉欣焉曰非老好飲喜稚子能賖師曰稚子甫之宗文獨立空外一鷙鳥河間雙白鷗師曰皆得其勢也飄颻搏擊便鄭曰搏徒官切容易往來遊趙曰摶擊謂􅋧鳥也往來遊言白鷗也白鷗往來不知鷙之將摶擊此可為寒心矣草露亦多濕蛛絲仍未收師曰詩云豈不夙夜謂行多露露犯之則濡蛛絲易染惹人甫官拾遺冝若鷙鳥獨立遇事則誅擊姦回時抗疏論房琯反為小人沾惹以朋黨至於斥逐故有草露多濕蛛絲未收之句天機近人事獨立萬端憂蘇曰蘇均獨立西樓俯仰身丗憂患萬端思之一灑使人心折骨驚趙曰或謂露下衆草則將殺草蛛絲未收則將羅物皆有殺意此並是天機如人事之好殺冝公有萬端之憂也逺遊賤子何人記師曰賤子甫自稱何人記猶言君不録用之也迷方著處家洙曰言所至即安趙曰迷方則漫行而不知所定止也鮑昭擬古云南國有儒生迷方獨淪誤竹風連野色江沫擁春沙種藥扶衰病吟詩解嘆嗟洙曰詩言之不足故嗟嘆之似聞胡騎走失喜問京華洙曰失喜言出於不自覺徐步整履步青蕪洙曰履一作屐荒庭日欲晡洙曰晡向午也芹泥隨燕觜蘇曰梁王覺為佞人奪權故人慰問指庭下泥笑謂客曰非久當隨燕觜汙君子雕梁蓋譏執政非特達賢者大抵晉唐人率多以燕雀指人王覺能説工部善用輔綴之工尤妙耳花蘂上蜂鬚洙曰蘃一作粉把酒從衣濕吟詩信杖扶敢論才見忌洙曰賈誼以才見忌實有醉如愚洙曰潛德於酒也愁坐新添髙齋常見野愁坐更臨門十月山寒重孤城水氣昏葭萌氐種逈左簷犬戎屯終日憂奔走歸期未敢論鮑曰唐志葭萌屬利州又詳左簷疑當作武擔見成都記雲山京洛雲山外音書靜不來神交作賦客洙曰神交作賦客謂宋王也山濤阮籍為神交喻不涉形迹似神交而已趙曰京洛言長安與洛陽也賦客指班張也長安則班固所謂西都張平子所謂西京洛陽則班固所謂東都張平子所謂東京望長安洛陽之音書而不來故神交於賦客而巳非謂宋王也力盡望鄉臺洙曰成都記望鄉臺隋蜀王秀所築鄭曰益州記升仙亭夾路有二臺一曰望鄉臺衰疾江邊卧親朋日暮回白鷗元水宿何事有餘哀倚杖洙曰鹽亭縣作趙曰鮑昭有倚杖雞豚之句故公倚以為題看花雖郭外倚杖即溪邊山縣早休市江橋春聚船狎鷗驚白浪洙曰狎一作野白浪一作浪子列子有狎鷗翁言忘杖故物亦不懼趙曰言可狎之鷗遊泳乎白日之中不知光景之可重也歸鴈喜靑天洙曰鴈一作鳥物色兼生意凄涼憶去年屏迹二首用拙存吾道幽居近物情桑麻深雨露燕雀半生成村鼓時時急漁舟箇箇輕杖藜從白首趙曰莊子原憲杖藜而應門心迹喜雙清蘇曰阮瑀白首杖藜來往亦鄉里中風流事謝靈運齋中讀書詩曰昔余遊京華未嘗廢丘壑矧乃歸山川之迹雙寂寞梅曰心迹雙淸無塵俗氣也晚起家何事無營地轉幽竹光團野色舍洙曰一作山影漾江流失學從兒懶長貧任婦愁百年渾得醉一月不梳頭趙曰暗使嵆康云頭靣常一月十五日不洗也歸來客裏有所過洙曰過一作適歸來知路難趙曰此篇敘其久往東劉而歸也門開野鼠走散秩壁魚乾洙曰謝玄暉詩陵澗尋我屋散秩問所知定功曰壁魚白魚也俗傳壁魚入道經函中因蠧食神仙字則身有五色人得而吞之可致神仙唐張裼之少子惑其説乃多書神仙字碎翦置瓶中取壁魚投之兾其啖食而不能得遂致心疾餘見酉陽雜爼原化記載何諷事趙曰壁魚白魚也在文書中尓尓雅所謂蟫白馬是巳沈曰郭璞注衣書中蟲今人謂之壁魚洗杓開新醖洙曰開一作低頭拭小盤洙曰一云著小冠慿誰給麴糵洙曰書若作酒醴尓惟麴糵趙曰意欲得之以造酒細酌老江干洙曰干涯也趙曰司空飲滔詩開君一壷酒細酌對春風江上值洙曰一作置水如海勢聊短述為人性僻耽佳句語不驚人死不休老去詩篇渾漫與春來花鳥莫深愁趙曰耽佳句而語驚人言其平昔如此今老矣所為詩則謾與而巳無復著意於驚人也故寄語花鳥無用深愁耳新添水檻供垂釣故著浮槎替入舟焉得思如陶謝手令渠述作與同遊洙曰見陶謝不枝梧注撥悶彥輔曰一云贈嚴二别駕聞道雲安麴米春蘇曰退之詩且可勤買拋青春國史輔酒有郢之冨水烏程之若下滎陽之土窟春冨平之石凍春劒南之燒春子美聞道雲安麴米春裴鉶傳竒亦有酒名松醪春乃知唐名酒多以春趙曰東坡詩麴米春香並舍聞蓋出於此才傾一盞即醺人乘舟取醉非難事下峽銷愁定幾巡長年三老洙曰舟師名見上注遙憐汝趙曰長年三老川中呼舟師之名師曰俗謂之翁蓋把柂者捩柂開頭捷有神洙曰開頭一作鳴鐃皆行船貌𥘉行船曰開頭趙曰捩柂開頭之捷疾捩縳結柂吐邏切巳辦青錢防雇直趙曰川人不以凖折而一色見錢為靑錢當令美味入吾脣洙曰脣一作身散愁二首久客冝旋斾蘇曰郭規久客塞上冝旋歸斾故園桃李想自成蹊鄉親時復入夢興王未息戈蜀星隂見少趙曰星以隂而見少江雨夜聞多百萬傳深入寰區望匪他司徒下燕趙收取舊山河趙曰望光弼之深也弼為檢校司空開道并州鎮尚書訓士齊洙曰并州太原也時王思禮為帥幾時通葪北洙曰范陽盧龍等也皆安史巢穴當日報關西洙曰長安以西皆謂之關西戀闕丹心破蘇曰辛毗值此喪亂兵戈未定丹心復將破矣霑衣皓首啼老魂招不得歸路恐長迷愁魯曰強戲為吳躰江草日日喚愁生蘇曰樊林呼喚濃愁酒又古樂府青青河畔草巫洙曰一作春峽冷冷非丗情趙曰水自泛泛不恂丗情人自愁寂而惑其泛泛之聲也盤渦鷺浴底心性趙曰郭璞賦盤渦谷轉獨樹花發自分明十年戎馬暗萬國洙曰自安史亂後天下草草不安者十餘年異域賔客老孤城洙曰公本北人而寓南國故云異域渭水秦山得見否人今罷病虎縱橫洙曰渭水秦山皆關中風物也時方罷弊賊寇充斥而未可歸故云得見否師曰王孫不歸來池塘春草碧草喚愁生言起歸心也巫峽之水泠泠不斷丗情踈絶非水長流之比也盤渦乃碾碓之水鷺浴自得子美心性亦鷗鷺安間之比也獨樹花發自分明喻子美不徇乎流俗也渭水秦山乃子美故卿旅夜書懷細草微風岸危檣獨夜舟定功曰王仲宣詩獨夜不能寐星垂平野闊月湧大江流洙曰王仲宣詩大江流日夜名豈文章著官應老病休飄飄何所似天地一沙鷗洙曰地一作外歸束帶還騎馬東西却渡船林中才有地峽外絶無天洙曰夔州居山水間在峽中故號為稍平然狹隘多石趙曰若盧同詩低頭雖有地仰靣若無人虛白髙人靜洙曰莊子謂虛室生白注謂室虛則純白生矣謂天能虛心以避丗則純白備於內也故詩主意髙人靜也喧卑俗纍牽洙曰喧卑囂雜貌以俗纍之牽人者如此趙曰鮑明逺舞鶴賦歸人寰之喧卑他鄉悅遲暮不敢廢詩篇客舊館新添陳迹隨人事𥘉秋別此亭重來梨葉赤依舊竹林青風幔何時卷寒砧昨夜聲無由出江漢秋渚月冥冥遣愁養拙蓬為户茫茫何所開江通神女館洙曰見神女峯姢妙注地隔望鄉臺洙曰見日落望鄉臺注漸惜容顔老洙曰傷時不可再也無由弟妹來洙曰以道路阻隔也兵戈與人事回首一悲哀即事洙曰一云天畔天畔群山孤草亭江中風浪雨冥冥洙曰楚辭雷填填兮雨冥冥一雙白魚不受釣蘇曰魯璘隱嵩山不仕傲曠鄉有大夫不廉行惡一日見璘垂釣問曰先生今日得多少魚璘曰此池淺無巨鱗有白魚一雙長二三寸不受釣大夫者沮而歸三寸黃甘猶自青師曰甘以三寸者入貢三寸猶青以其成就其加大可知多病馬卿無日起洙曰謝靈運有疾象長鄉窮途阮籍幾時醒洙曰見至今阮籍等熟醉為身謀注未聞細柳散金甲洙曰周亞夫細柳營蔡文姫詩金甲耀朝日腸斷秦州流濁涇彥輔曰公有弟妹在秦州故憂之也覽物洙曰一云峽中覽物曾為椽吏趨三輔洙曰三輔京兆扶風馮翊也公曽為掾吏趙曰公曽為華州功曹故曰掾吏華為扶風憶在潼關詩興多洙曰事見詩年譜蘇曰王納曰吾檍在洛陽詩興甚多今老矣終日思一二字無處下筆趙曰公華州所有詩即潼關之詩興矣巫峽忽如瞻華嶽鄭曰華胡化切蜀江猶似見黃河趙曰巫峽蜀江則所謂峽中覽物華嶽黃河所以言華州也師曰華嶽黃河皆子美故鄉公今客中見巫峽蜀江遂想像有感故曰忽如瞻華嶽猶似見黃河舟中得病移衾枕趙曰言其得病在雲安舟中而移衾枕於客居屋舍之下洞口經春長薜蘿洙曰謝靈運詩想見山阿人薜蘿若在眼形勝有餘風土惡幾時回首一髙歌洙曰雖號形勝之地而風土不類中原公曽有南楚詩云南楚靑春異暄寒早早分趙曰言幾時離此風土惡之地而去可以回首望之寫胸懷而浩歌也憶鄭南玼鄭曰音泚鄭南伏毒寺趙曰舊本作毒守難解師民瞻本作毒手無義一本作毒寺却似有義蓋寺名伏毒而在江心故以到江心為瀟灑也瀟灑到江心石影銜珠閣泉聲帶玉琴趙曰言泉聲如玉琴之聲也江淹去故鄉賦撫玉琴兮何親舊所引大非風杉曽曙倚雲嶠憶春臨萬里蒼茫水洙曰水一作外龍蛇只自深趙曰言滄浪水徒為龍蛇之深藏不似鄭南江心之可到懷灞上遊悵望東陵道洙曰曹何傳召平故秦東陵侯種瓜長安城東丗謂東陵瓜阮籍詩云昔聞東陵瓜近在靑門外平生灞上遊洙曰灞水也春濃停野騎夜宿敞雲樓離別人誰在趙曰所與同遊灞上之人今既離別復誰在乎經過老自休眼前今古意江漢一歸舟洙曰古詩天際識歸舟江上江上日多雨蕭蕭荆楚秋髙風下木葉洙曰洞庭波兮木葉下永夜攬貂裘洙曰蘇季子不得用而貂裘弊勳業頻看鏡洙曰惜其功名未遂而身老也修可曰左傳石碏曰老夫耄矣無能為也此古人所以惜老人之衰今公所云豈在是乎庾信詠懷詩云匣中取明鏡披圖自照看行藏獨倚樓趙曰所以念深矣余曰冷齋夜話云詩有句含蓄者老杜此二句是也時危思報主衰謝不能休江漢江漢思歸客乾坤一腐儒余曰古今詩話云楊大年不喜杜詩謂之村夫子有鄉人以杜詩強大年不服因曰公試為我續江漢思歸客一句大年亦為屬對鄉人曰乾坤一腐儒大年似少屈片雲天共逺永夜月同孤落日心猶壯秋風病欲蘇古來存老馬不必取長途洙曰田子方出見老馬於道而問焉其御曰故公家畜也子方以束帛贖之窮士歸心趙曰韓子曰管仲隰朋從桓公伐孤竹春往而冬返迷惑失道管仲曰老馬之智可用也乃放老馬而隨之遂得道焉公之意自比於老馬雖不能取長途而猶可以知道解惑也垂白洙曰一云白首垂白馮唐老洙曰見名慙白首郎注清秋宋玉悲趙曰見宋玉九辨云悲哉秋之為氣也江喧長少睡樓逈獨移時多難身何輔鄭曰難乃旦切無家病不辭趙曰公携妻孥入蜀而今句云無家豈專以故鄉為家者乎甘從千日醉洙曰中山有酒飲者一醉千日玄石飲之千日乃醒師曰張茂先博物志云昔人有姓劉名玄石者從中山酒家酤酒酒家與之千日酒而忘語數日尚醉家人不知以為死斂葬之酒家忽悟告之發塜乃醒未許七哀詩洙曰曹子建王仲宣張孟陽皆有七作師曰曹子建等七哀詩云七哀謂痛而哀義而哀感而哀怨而哀耳目見聞而哀口歎而哀鼻酸而哀子建為漢末征役别離婦人哀歎故賦此詩仲宣則哀漢室之亂孟陽則前哀人事之遷變後哀王室之漸亂故其題皆曰七哀也秋峽江濤萬古峽肺氣久衰翁不寐防巴虎全生狎楚童趙曰言為客於外年老而不敢待雖童稚亦狎熟免其猜忌為害乃所以全生也衣裳垂素髮洙曰秋興賦素髮颯以垂領門巷落丹楓洙曰謝靈運詩曉霜楓葉丹常怪商山老兼存翊贊功洙曰四皓也見羽翼思商老注獨坐二首竟日雨冥冥雙崖洗更靑水花寒落岸山鳥暮過庭暖老須燕玉洙曰唐寧王有暖王鞍又有暖玉杯以為飲器不暖而自熱趙曰燕玉婦人也古詩云燕趙多佳人美者顔如玉待燕玉而暖則孟子所謂七十非人不暖也充飢憶楚萍洙曰家語楚昭王渡江有一物大如斗圎而赤取之以問孔子曰此何物也可剖而食之吾昔過陳間童謡曰楚王渡江得萍實大如斗赤如日剖而食之甜如蜜胡笳在樓上哀怨不堪聽洙曰晉劉疇避亂為賈胡欲害疇援笳而吹之作出塞之聲以動其歸思群胡皆啼哭而去白狗斜臨北田曰水經注秭歸白狗峽蜀江中流兩靣如削絶壁之際隱出白石如狗形狀具足故以名焉黃牛更在東洙曰黃牛山在縣北四十五里周回五十里髙三十一里盛弘之荆州記曰黃牛山有重嶺疊起其最大髙崖間有石色如人負刀牽牛人黑牛黃其狀分明此崖加之江湍適回行經信宿猶尚望見行者歌曰朝發黃牛暮宿黃牛一朝一暮黃牛如故今黃牛峽山下有廟曰洛川王土人云黃牛神也東坡有碑載歐陽文忠公事云豫昔以西京留守推官為館閣校勘時同年丁寶臣元珍適來京師夢與余同舟泝江入廟中拜謁堂下豫班元珍下元珍固辭豫不可方拜時神像為起鞠躬堂上且使人邀豫上耳語久之元珍私念神亦如丗俗待館閣乃爾異禮耶既出門見一馬隻耳覺而語豫固莫識也不數日元珍除峽州通判已而豫亦貶夷陵令日與元珍處不復記前夢矣一日與元珍泝峽謁黃牛廟入門惘然皆夢中所見豫為縣令固班元珍下而門外鐫石為馬缺一耳相視大驚乃留詩廟中有石馬繫祠門之句蓋私識其事也張無盡天覺讃曰壯哉黃牛有大神力輦聚吕石百千萬億劒戟牙齒磊硊江側壅激波濤險不可測威脅舟人駭怖失色刲牲釃酒千載廟食峽雲常照夜江日會兼風曬藥安垂老應門試小童夢符曰古按莊子子貢往見原憲原憲華冠縱履杖藜而應門亦知行不逮苦恨耳多聾覽鏡呈柏中丞渭水流關內洙曰渭水入于河故浮渭而東還帝都西都賦帶以黃河涇渭之川終南在日邊洙曰詩曰終南何有王萇曰終南周之名山西都賦表以大華終南之山是也趙曰西都賦帶以洪河涇渭之川又云表以大華終南之山則渭水終南者長安也日邊言帝都膽銷豺虎窟洙曰南都賦豺虎肆虐淚入犬羊天起晚堪從事趙曰凡仕有官者必早起起晚矣可堪從事乎行遲更覺仙趙曰仙者身輕步疾老而行遲矣那更覺為仙乎鏡中衰謝色萬一故人憐趙曰傷其衰者而求憐於柏中丞也東屯北俺鄭曰俺於驗反盜賊浮生困誅求異俗貧空村唯見鳥落日未洙曰一作不逢人洙曰登樓賦白日忽其西匿鳥相鳴而舉翼原野聞其無人征夫行而未息步壑風吹靣看松露滳身逺山回白首戰地有黃塵有歎魯曰傳蜀官軍自圍普還壯心久零落趙曰魏武帝樂府曰烈士暮年壯心不巳白首寄人間蘇曰梁鴻曰白首猶寄人間萍迹可厭天下兵常鬪江東客未還趙曰公有所嘆也窮猿號雨雪洙曰晉書云窮猿奔林老馬望關山洙曰管子曰老馬之智可用也武德開元際蒼生豈重攀洙曰武德髙祖年號開元明皇年號趙曰追念祖宗之盛時也悶瘴癘浮三蜀風雲暗百蠻趙曰此夔州詩而言三蜀百蠻蓋夔在三蜀之下百蠻之北廣言之也卷簾唯白水隱几亦靑山鄭曰隱去聲猿捷長難見洙曰淮南子置猿檻中非不巧捷南都賦猿穴騰希而競捷鷗輕故不還洙曰南越志勃海中有鷗隨潮上下無錢從滯客有鏡巧催顔獨坐悲愁回白首倚杖背孤城江斂洲渚出洙曰謝惠連詩蕭條洲渚際謝靈運詩欵曲洲渚言天虛風物淸滄溟服衰謝洙曰服一作恨朱紱負平生洙曰易朱紱方來趙曰公巳賜緋矣負平生言無所用於時也仰羡黃昏鳥投林羽翮輕師曰黃昏鳥猶所歸子美以久客他鄉曽歸鳥之不如乎暮歸霜黃碧梧白鶴棲城上擊柝復烏啼趙曰白帝城也易云重門擊析矣烏啼則樂府有烏夜啼之曲也修可曰琴曲有烏夜啼吳競古樂府解題云烏夜啼宋臨川王義慶造也客子入門之捕魚此説非也楚人信巫以烏為鬼耳元稹詩曰病賽稱鬼巫占瓦代龜注南人染病競賽烏鬼楚巫列肆悉賣瓦卜夢符之説是養當讀為供養之養頓頓食黃魚鮑曰桉爾雅注鱣大魚似鱏而短口在頷下邪行無鱗內黃大者長二三丈江東呼為黃魚故公詩云脂膏兼飼犬長大不容身豈有如此大魚可以鸕鷀為捕者則知烏鬼乃烏蠻鬼耳舊識難為態新知已暗踈洙曰楚辝樂莫樂兮新相知治生且耕鑿只有不關渠洙曰峽俗養烏頭鬼祭之似人趙曰交態之態也難與之態則其人之薄矣楚辭曰樂莫樂於新相知而至於巳暗踈則其人之薄又可知故下句欲耕鑿不復與薄俗相關西歷靑羌坂鄭曰水經注江水遙巫峽過靑羌山坂南留白帝城於莵侵客恨鄭曰莵同都反虎名洙曰一作榖於宣四年𥘉若敖娶於鄖生鬪伯比若敖卒從其母畜於鄖淫於鄖子之女生子文焉鄖夫人使棄諸夢中虎乳之鄖子田見之懼而歸夫人以告遂使取之楚人謂乳榖謂虎於莵故命之曰鬪榖於搜其女妻伯此實為令尹子文粔籹作人情蒼舒曰宋王招魂云粔籹蜜餌有餦餭此二注粔敉故以蜜和米煎作之粔竒舉切籹音女蘇曰張黔送友人粔敉餳糍粔籹今糖餅蜀人呼為粔籹鄭曰粔其吕切敉尼吕切膏環也瓦卜傳神語洙曰巫俗擊瓦觀其文理分析以定吉凶謂之瓦卜夢符曰右按元微之詩病賽烏稱鬼巫占瓦代龜注南人染病競賽烏鬼楚巫列肆悉賣瓦卜畬田費火聲洙曰一作耕火耕水耨史記食貨傳載田曰楚俗燒榛種田曰畬先以刀芟治林木白斫畬其刀以木為柄刃向曲謂之畬刀劉禹錫畬田行何處好畬田子美夔府詠懷又云燒畬渡地偏是非何處定髙枕笑浮生洙曰公頃歲自秦涉隴從同谷縣出遊蜀留帶巫山趙曰言風俗處處不同孰是孰非焉有定乎但付之一睡而巳遣憂新添亂離知又甚消息苦難真受諌無今日臨危憶古人紛紛乘白馬壤壤看黃巾隋氏留宫室焚燒何太頻遣悶呈路十九曹長新添江浦雷聲喧昨夜春城雨色動微寒黃鶯並坐交愁濕白鷺群飛大劇乾晚節漸於詩律細誰家數去酒杯寬唯君醉愛淸狂客百遍相過意未闌長吟新添江渚翻鷗戲官橋帶栁隂江飛競渡日草見踏靑心已撥形骸纍真為爛熳深賦詩歌句穩不免自長吟洙曰詳此詩當為在草堂時作樓上新添天地空搔首頻抽白玉簮皇輿三極北身事五湖南戀闕勞肝肺論材愧𣏌柟亂離難自救終是老湘潭疾病古詩二首律詩二首病後過王倚飲贈歌麟角鳯觜丗莫識韓曰麟鳯治丗之祥亂丗誰識此物喻王倚生非其時丗人莫識之煎膠續絃竒自見蒼舒曰右按東方朔十洲記仙家煮鳯啄麟角金煎作膠名之續絃膠一名連金泥此物能連屬弓弩斷絃及斷折之金以膠連使力折繫它處乃斷續處不復斷也尚看王生抱此懷在於甫也何由羡且遇王生慰疇昔素知賤子甘貧賤酷見凍餒不足恥洙曰語在陳絶糧蘇曰王子淵曰吾守道處凍餒亦不足為耻今本中作陳餒尤失本意注者亦無髙見隨而疏之真可笑也今改正寫與李方叔多病沉年苦無健王生怪我顔色惡答云伏枕艱難遍瘧癘三秋孰可忍寒熱百日相交戰頭白眼暗坐有胝鄭曰丁尼反皮厚也肉黃皮皺命如線鄭曰與線同惟生哀我未平復為我力致美肴膳遣人向市賖香粳喚婦出房親自饌長安冬𦵔酸且緑金城土酥靜如練蘇曰土酥即今之蘆蔔也其種蘭臯金城尤佳魏夫人帖云膾士酥如練秦人呼為地酥能解麵毒兼求冨豪洙曰一作畜豪一作畜豕且割鮮洙曰西都賦割鮮野食趙曰金城秦地也有駝金城自能為酥其名土酥老杜身在秦州而食長安之冬𦵔金城之土酥且求畜豕而割鮮焉非肴饌之美而何魯曰畜豕一作畜豪非是密沽斗酒諧終宴師曰言禮意無盡也故人情味晚誰似令我手腳輕欲漩老馬為駒揔不虛洙曰詩角弓老馬反為駒不顧其後注巳老矣而孩童慢之箋云此喻幽王見人反悔慢之遇之如幼稚不自顧念後至年老人之遇己亦將然也當時得意况深眷但使殘年飽喫飯只願無事長相見師曰甫傷年老時輩所忽故云當時得意况深眷蓋譏時輩雖見眷遇于君不必他日至若甫之困躓也既傷交態刻薄未章遂美王生事與長相見也醉為馬墜諸公携酒相看甫也諸侯老賔客蘇曰卜子夏見魯大夫曰商也諸矦門下老賔客尓思以恢弘仲尼之道賢大夫冝如何罷酒酣歌拓金戟鄭曰拓音託梅曰拓持也騎馬忽憶少年時蘇曰許禇騎馬過新豐淚下不止客問其故禇曰憶少年時挾矢躍馬醉戲于此回首五十年事不覺淚下趙曰阮籍詩憶昔少年時散蹄迸落瞿塘石禹稱曰瞿塘峽名時甫在夔故言及此白帝城門水雲外低身直下八千尺粉堞電轉紫遊韁洙曰粉堞城堞也以堊土塗之故曰粉堞韁馬韁以紫絲為之故曰紫韁禹稱曰電轉言其疾也東得平岡出天壁逢原曰言山立與天齊髙也江村野堂爭入眼垂鞭嚲鞚凌紫陌鄭曰嚲子可切逢原曰嚲鞚謂俯勒其馬也向來皓首驚萬人自倚紅顔能騎射洙曰自恃少年自能騎射也趙曰言人雖以我皓首為驚而自謂其年少時能騎射今亦尚能也安知決臆追風足洙曰決臆縱意也追風言馬足疾可以追風也趙曰追風太宗十驥之名朱汗驂驔猶噴玉趙曰朱汗即汗血也崔液上元夜遊詩驂驔始散東城曲倐忽還逢南陌頭穆天子傳王東遊于黃澤時人語曰黃之澤其馬噴玉不虞一蹶終損傷洙曰不虞非出於虞度以馬之蹶不可預度人生快意多所辱職當憂戚伏衾枕况乃遲暮加煩促趙曰詩甬枕粲兮錦衾亂兮而摘用之熟矣張茂先云煩促每有餘朋知來問腆我顔洙曰腆厚也杖藜強起依僮僕語盡還成開口笑提携别掃淸溪曲酒肉如山又一時趙曰倣左傳有酒如澠有肉如陵𥘉筵哀絲動豪竹琪曰大管也共指西日不相貸琪曰共指西日不相貸言欲暮須痛飲不相假借喧呼且覆杯中渌何必走馬來為問君不見嵇康養生𬒳殺戮洙曰嵇康注養生論後以事坐誅耳聾生年鶡冠子黃曰袁叔真隱傳曰鶡冠子者楚人隱居深山中衣敝履穿以鶡為冠莫測其名因服成號著書言道家事馮諼嘗師之後顯於趙鶡冠子懼其薦巳遂與之絶鶡者勇雉也歎丗鹿皮翁洙曰見遣興但訝鹿皮翁注眼復幾時暗耳從前月聾猿鳴秋淚缺雀噪晚愁空黃落驚山樹呼兒問朔風師曰鶡冠子隱人也常居深山耳聾謂雉也其鬪無巳一死乃止故趙武靈王為冠以表武士是詩所謂鶡冠非武士所冠蓋名同而實異耳老病老病巫山裏稽留楚客中藥殘他日褁花發去年叢夜足霑沙雨春多逆水風合分雙賜筆洙曰見君恩隨赤管注趙曰漢官儀尚書令漢丞郎月給赤管大筆一雙公為尚書工部郎故感而有是句猶作一飄蓬洙曰見上注懷古古詩十三首律詩五首述古三首彥輔曰此詩傷賢者不得志也赤驥頓長纓洙曰列子周穆王右驂赤驥左白戚非無萬里姿趙曰王褒聖主得賢臣頌周流八極万里一息悲鳴淚至地為問馭者誰鳯凰從天來何意復髙飛竹花不結實念子忍朝飢鄭曰朝陟遙切洙曰劉公幹鳯凰集南嶽徘徊孤竹根於心不背厭奮翅淩紫氛豈不常勤苦羞與黃雀群蒼舒曰右按劉公幹魯都賦曰竹填山陔根彌坂域蒙雪含霜不踰其色翠實離離鳯鸞收食趙曰莊子鶴雛非練實不食郭象注云練實竹實也古時君臣合可以物理推賢人識定分進退固其宜洙曰大臣以道事君可則進否則奉身以退退一作用師曰昔良驥困於鹽車遇伯樂悲鳴若有所訴鳯非竹實不食驥有万里之姿御非其人則必困頓於長纓鳯有應期之瑞竹花不實則必困於飢餒譬君子不逢賢聖之君不食其祿古來君臣遇合可以物理知之是以賢人進以禮退以義知分命之所在不苟於貪冒寵榮豈非驥鳯甘於困頓飢餒之比乎市人日中集洙曰易日中為市於利競錐刀洙曰江文通云競錐刀之利置膏烈火上洙曰左濟如致脂膏於烈火之上轉增熖熾今王會諸侯亦然趙曰市人之爭利如膏火之自煎爾莊子曰膏以明自煎哀哀自煎熬洙曰莊子膏火自煎也農人望歲稔相率除蓬蒿蘇曰王陵母家每春暮蓬蒿生居人相率手除剃之所務穀為本邪贏無乃勞洙曰莊子長梧封人曰昔子為禾耕而鹵莽之則其實亦鹵莽而報子藝而滅裂之其實亦滅裂而報子豫來年變齊深其耕而熟耰之其禾繁以滋豫終年厭餐趙曰張衡西京賦云商賈禆販何必昏於作勞邪贏優而足持注邪為也欺為之事自餘贏豐饒足持也舜舉十六相身尊道何髙洙曰文十八年傳昔髙陽氏有才子八人天下之人謂之八愷髙辛氏有才子八人謂之八元此十六族也堯不能舉而舜舉之天下如一同心戴舜以為天子以其舉十六相故也秦時任商鞅法令如牛毛洙曰商君名鞅相秦十六年天資刻薄少恩變秦法令宗室貴戚多怨望者後滅商君之家也蘇曰秦法如牛毛沛公盡革去趙曰東坡先生云子美詩自許㮨契人未必許也然此詩言舜舉十六相與秦任法之事句法自是稷契輩人口中語也師曰錐刀利之微細也易曰日中為市古者敦本而抑末市人競錐刀之利喧喧不息如置膏火上自取煎熬玄宗之時利孔百出聚斂之臣削民膏血是知以利為政未有不亂者也禹稷躬稼而有天下則務農重榖國家之本是以舉十六相唯急親賢賢人用則民安其業民安其業身尊而道髙終享無為之治彼始皇任商鞅壞井田之制頭會箕斂民不堪命雖法令之密如牛毛然安能禁人之不為亂乎是以陳勝一起天下應之如影響肅宗中興故甫意欲敦本輕徭薄賦此天下可得而治也漢光得天下洙曰光武也祚永固有開洙曰禮有開必先豈惟髙祖聖功自蕭曹來經綸中興業何代無良才吾慕寇鄧勳洙曰冠恂鄧禹濟時信良哉耿賈亦宗臣趙曰班固之傳蕭曹云漢之宗臣是謂相國今公詩於耿賈亦云羽翼共徘徊休運終四百洙曰漢祚終四百故范蔚宗獻帝贊曰終我四百永作虞賔圖畫在雲臺洙曰雲臺圖功臣像蘇曰崔融君不見耿賈輩扶顛起仆漢道中興圖形雲臺照耀方丗師曰禮云國之將興有開必先漢自髙祖開基至元始年間衰弱王莽篡國光武中興使國祚再永實自髙祖有開其先也雖然豈特髙祖之聖亦本乎得蕭何曹參輔贊之功光武中興之日寇恂鄧禹耿弇賈復之徒左右羽翼與光武徜徉天下收復土宇及功成名遂光武不任以吏事俾之各奉朝請蓋得馭功臣之術是以漢運終四百餘多二十八將之功赫然畫像雲臺殆非韓彭𦵔醢殺戮之比也肅宗中興是亦光武之倫奈何諸將邀功養寇以自封其與寇鄧耿賈輩逺矣甫意傷肅宗無駕御英豪之䇿而作是詩也遣興五首蟄龍三冬卧洙曰易龍蛇之蟄以存神老鶴萬里心洙曰舞鶴賦結長悲於萬里昔時賢俊人未遇猶視今洙曰後之視今猶今之視昔也嵆康不得死洙曰一云且不死江淹恨賦中散下獄神氣激楊孔明有知音魯曰徐庶薦孔明又如壠底松用舍在所尋洙曰古詩鬱鬱澗底松大哉霜雪幹歲久為枯林洙曰傷有材而不見用師曰龍雖蟄於冬至春則賴以沛霖雨喻孔明得徐庶之薦終則見用鶴心在萬里奈巳老何喻嵆康日暮途窮左右無一言之援是以終死獄中夫昔嵆康孔明皆賢士也一則得君一則失勢豈非幸不幸耶昔者龎德公洙曰者一作在未曾入州府襄陽耆舊間處士節獨苦洙曰後漢逸民傳龐德公者南郡襄陽人也未嘗入城府夫妻相敬如賔豈無濟時䇿洙曰一作術終竟畏羅罟彥輔曰一作終歲畏罪苦林茂鳥有歸水深魚知聚舉家隱鹿門劉表焉得取洙曰荆州刺史劉表數延請不能屈乃就候之謂曰夫保全一身孰若保全天下乎龎公笑曰鴻鵠巢於髙林之上暮而得所棲黿鼉穴於深淵之下久而得所宿夫趍舍行止亦人之所巢穴也且各得其栖宿而巳天下非所保也因釋耕於壠上而妻子耘於前表指而問曰先生苦居畎畒而不肯官祿後丗何以遺子孫乎龎公曰出人皆遺之以危今獨遺之以安雖所遺不同未為無所遺也表歎息而去後遂携其妻子登鹿山採藥不反秦曰襄陽記云鹿門山舊名蘇嶺山建武中襄陽侯習郁立神祠於山刻二石鹿夾神祠道口俗因謂之鹿門廟遂以廟名山陶潛避俗翁未必能逹道蘇曰墨子未必逹吾道觀其著詩集頗亦恨枯稿趙曰因陶潛而有所悟故於此詩非直詆陶也陶集中固有恨枯稿之語矣如楚調之夏日長抱飢寒夜無𬒳眠飲酒詩顔淵稱為仁長飢至于老雖留身後名一生亦枯稿其他皆類是豈不謂之頗恨枯稿乎逹生豈是足默識蓋不早有子賢與愚蘇曰黨盟吾雖有三子賢不肖在渠輩若夫一日合眼子等榮賤任其事業非千吾事何其挂懷抱立之曰山谷書淵明文有與五子疏又命子詩曰夙興夜寐願爾斯才才之不才亦巳焉哉文責子曰白髮𬒳兩鬢肌膚不復實雖有五男兒揔不好𥿄筝阿舒巳二八懶放固無匹阿宣行志學而不愛文術雍端年十三不識六與七通子垂九齡但覔梨與栗天運苟如此且進杯中物觀淵明之詩想見其人愷悌慈祥雖謔可觀也俗人便謂淵明諸子皆不肖而淵明愁歎見於詩所謂癡兒前不得説夢也黃曰子美困於三蜀蓋不知者詬病以拙於生事又往往譏議宗文宗武失學故聊寄此詩於淵明以解嘲耳其詩名曰遣興可解也俗人亦以為譏淵明非也賀公雅吳語洙曰賀知章蘇曰陸機雅能吳語吳兒聞之皆起歸思大臨曰丗説王真見王丞相以腹尉彈棊局曰何乃訇注云吳人口冷為訇虛觥反劉既出人問見公主云何劉曰未見也異唯聞作吳語尓孝祥曰語林曰真長云丞相何竒止能作吳語及細唾也在位常淸狂洙曰武五子傳清狂不惠凡狂者隂陽脈盡濁今此又不狂似狂者故言清狂也或曰色理清徐而心不惠曰清狂清狂如今白癡上疏乞骸骨黃冠歸故鄉蒼舒曰右按禮記郊特牲曰野夫黃冠黃冠草服也蘇曰賈亮疏乞骸骨漢文不允三上不答乃棄官隱中條爽氣不可致洙曰王徽之字子猷桓公嘗謂徽之曰卿在府日久此當相料理徽之𥘉不酬答直髙視以手板拄頰云西山朝來致有爽氣耳斯人今則亡魯曰顔淵今也則亡山隂一茅宇江海日淒涼洙曰知章事明皇為祕書監自號四明狂客及祕書外監晚節尤誕放天寶𥘉夢遊帝居及寤遂請為道士歸鄉里以宅為千秋觀表求周官湖數頃為放生池有詔賜鏡湖一曲吾憐孟浩然短褐即長夜修可曰短一作裋見北征詩生陸士衡送子長夜臺王仲宣長夜何冥冥趙曰南史范曄在獄中為士題扇曰去白日之照照即長夜之悠悠賦詩何必多往往凌鮑謝魯曰鮑昭謝眺蘇曰江惣詞氣凌鮑謝筆迹踵二王史柄云足下新詩往往氣凌鮑謝趙曰往往者忽忽如此也應據百一詩云用等稱才學往往見歎譽也清江空舊魚趙曰浩然嘗有詩曰試垂竹竿釣果見查頭鯿今言清江之內空有舊魚而人不見春雨餘甘蔗每望東南雲蘇曰梁瑄不歸弟璟每見東南白雲即立望慘然久之令人幾悲吒鄭曰陟駕切正作吒修可曰郭璞遊仙詩臨川哀年邁撫心獨悲吒趙曰浩然襄陽人襄陽在秦州之東南公思而不見故望雲而起悲吒耳憶昔二首憶昔先皇巡朔方千乘萬騎入咸陽洙曰後漢靈帝末京都童謠曰侯非侯王非王先乘萬騎上北芒趙曰先皇言肅宗也肅宗即位靈武而朔方在靈州之鄰則車駕所巡矣隂山驕子汗血馬洙曰史胡者天之驕子大宛有汗血駒侯應之北邊塞隂山在遼東外東西千餘里趙曰驕子指言回紇也至德二載廣平王淑為兵馬元帥郭子儀副之以朔方安西回紇南蠻大食兵計安慶緒時回紇兵最有功也長驅東胡胡走藏趙曰東胡指言安慶緒也時廣平王之兵戰于溰水而慶緒敗走鄴城反覆不足怪趙曰慶緒河北明年乾元元年蔡希德等復會安慶緒賊復振以相州為成安府鄴城即相州也此所謂鄴城反覆指言慶緒明矣舊注模稜云胡走藏者祿山也鄴中反覆者思明未服也然不知當回紇助順之時祿山巳為慶緒所殺而巳非祿山也關中小兒壞紀綱張后不樂上為忙蘇曰梁到曰壞劉氏紀綱者數小兒也今用權勢者乃匹夫耳趙曰東坡先生詩話有曰關中小兒亂紀綱謂李輔國也張后不樂上為忙謂肅宗張皇后也舊注至謂關中小兒為越王係欲奪嫡言上為忙者以代宗畏后皆非也自有東坡成説正其謬按張后能牢寵干豫政事後與李輔國謀徙上皇又屢欲危太子皆張后之惡也至今今上猶撥亂勞心焦思補四方鄭曰思息吏切洙曰今上代宗也自為太子授天下兵馬元帥及即位內平張后越王之難外經營河朔我昔近侍叨奉引洙曰往在詩云我昔忝近侍時代宗享郊廟也此詩亦言代宗時事而云我昔近侍切奉引然二史皆不載故不知所任官也出兵整肅不可當洙曰出兵一云兵也趙曰奉引供奉之事也舊注謂奉引事二史皆不載故不知所任何官是何等語也田曰引唐六典輔闕拾遺武后置二人以掌供奉諷諌子美至德二年肅宗授左拾遺明年收京扈從還長安蓋拾遺掌供奉扈從也為留猛士守未央蘇曰謂郭子儀奪兵柄入宿衛也致使歧雍防西羌鄭曰雍於用反犬戎直來坐御床百官跣足隨天王洙曰吐蕃陷長安天子奔陜趙曰守未央東坡以為郭子儀按史程元振以子儀有天下功醜為詆譛肅宗不納其語然猶留守京師明年吐蕃入寇陷長安願見北地傳介子洙曰傅介子北地人也持節使誅斬樓蘭王安歸首懸之北闕封介子為義隅侯老儒不用尚書郎洙曰木蘭行云欲與木蘭賞不用尚書郎師曰甫嘗為工部尚書郎中犬戎之難甫欲得將如傅介子以討平之而甫文士年巳衰老想不為朝廷用所謂儒冠多誤身者此也憶昔開元全盛日修可曰鮑明逺蕪城賦曰當昔至盛之時小邑猶藏萬家室稻米流脂粟米白公私倉廪俱豐實洙曰開元間承平日久四郊無虞居人蒲野桑麻如織雞犬之音相聞蘇曰假晞倉廩豐盈民亦富畜公私通客冝舉太事九州道路無豺虎洙曰時開逺門外西行亘地里萬餘路不拾遺行者不囊糧丁壯之人不識兵器人情欣然感封禪之事蘇曰王融詩澄清九州牧道路無豺虎逺行不勞吉曰出洙曰言道路無阻隔所至皆通達不必擇日而後出也按唐書稱至怡者以開元貞觀為首齊紈魯縞車班班洙曰齊紈魯縞丗稱竒者偉強弩之末不能穿魯縞桓帝𥘉京師童謡曰車班班入河間者言上將崩乘輿班班入河間迎靈帝夢符曰右按前漢志齊織作永紈綺繍純麗之物師古曰氷謂布帛之細其色鮮潔如氷也紈素也饒曰山東出厚繒商販不絶也男耕女桑不相失洙曰揚子男子畒婦人桑梅曰言民不失其業也宫中聖人奏雲門洙曰周禮大司樂歌大吕舞雲門以祀天神天下朋友皆膠漆洙曰後漢陳重雷義為友語曰膠􅃮自謂堅不如雷與陳劉孝標絶交論道協交膠􅃮歐曰以信義相交接也百餘年間未災變叔孫禮樂蕭何律洙曰楊雄解嘲叔孫通起於枹鼓之間解甲投戈遂作君臣之儀得也聖漢權制而蕭何造律宜也豈聞一絹直萬錢蘇曰河平元年絹每端直八千至開元子美言万錢其凶荒不言何知有田種穀今流血洛陽宫殿燒焚盡洙曰安史之亂民困於役而不得耕桑長安宫殿九廟焚燒略盡宗廟新除狐兔穴洙曰張孟陽七哀詩園寢化為墟周墉無遺堵狐兔窟其中蕪穢不復掃蘇曰郭佐近除宫苑荆棘狐狸窟穴尚未持平傷心不忍問耆舊蘇曰劉璣重過故鄉井邑遷移田園荒廢駐馬傷心之久不復更問耆舊復恐𥘉從亂離説小臣魯鈍無所能洙曰劉公幹小臣信頑魯僶俯安能返朝廷記識蒙祿秩周宣中興望我皇灑血江漢長衰疾洙曰長一作身宣王承厲王之亂復修文武之業周道復興師曰百餘年間未災變謂祿山未反叔孫通為髙祖制禮蕭何定律令當是時禮樂律令修明開元之治幾於三代及罷九齡相李林甫生事逺夷中國消耗祿山一叛舉前日禮樂法律屯壞而棄之玄宗於是時雖欲奏雲門於宫中豈可得哉林甫國忠祿山之徒平昔相遊從一旦反目操戈相逐雖欲如向者膠􅃮之堅豈可得哉太宗時米斗三錢布帛稱是玄宗承冨實之餘業物價極賤兵興以來一絹直万錢前日種穀之地今鞠而為戰埸東都宫殿盡煨燼宗廟失守狐兔成群令人傷心痛者不忍道及亂離時事甫自顧魯鈍無能叨蒙工部祿秩足認朝廷不即棄捐唯以周宣中興之功仰望其君灑淚江漢之上惓倦朝廷無復一預朝會衰疾日長老死而後已未嘗一言話之間少忘其君足見甫之忠勤詩人無能及之蓋謂是也冬到金華山觀因得故拾遺陳公學堂彥輔曰拾遺唐陳子昂也少讀書於金華山程曰子昂梓州射洪人射洪在州東南六十里子昂未逹時在金華山讀書有書堂尚存甫遊金華因得子昂書堂遂有此作涪右衆山內鄭曰涪扶鳩切涪水出徼外南入漢金華紫崔嵬洙曰爾雅石戴土謂之崔嵬陸士衡西山何其峻層曲鬱崔嵬上有蔚藍天鄭曰蔚紆勿切師曰金華神仙有三十六洞天八十一福地蔚藍天乃洞天之名金華山有觀故云云垂光抱瓊臺洙曰孫綽遊天台賦瓊臺中天而顧居趙曰蔚藍則茂蔚之藍今詩人言水曰挼藍則天之青亦可言蔚藍近丗韓子蒼出沐州即事詩云恍然不悟身何處水色山光盡蔚藍繫舟接絶壁杖䇿窮縈回洙曰陸士衡杖䇿將尋逺趙曰謝靈運詩晨䇿尋絶壁四顧俯層巔修可曰謝靈運築臺基層巔淡然川谷開雪嶺日色死霜鴻有餘哀焚香玉女跪霧裏仙人來洙曰曹植逺遊詩曰靈鼇戴万丈神嶽􅌂嵯峨仙人翔其隅玉女戲其阿陳公讀書堂石柱仄靑苔悲風為我起激洌傷雄材洙曰古詩浩歌正激洌唐書陳子昂梓州射鴻人苦節讀書尤善屬文𥘉為感遇詩三十首王適見而驚曰此子必為天下文宗後詣闕上書自稱梓州射鴻縣草莽愚臣則天召見竒其對拜麟臺正字文詞宏麗甚為當時所重新書子昂有所論著當時以為法及載武后嘗問調元氣以何道而子昂勸后興明堂太學而史臣譏其以王者之事勉女主故卒為訕侮而不用也師曰子昂遭時無明聖之君故其才不得展甫傷之故云云雖傷子昂亦白傷也陳拾遺故宅拾遺平昔居大屋尚修椽蘇曰郤鑒修椽大屋貯青眉粉質悠揚荒山日慘淡故園煙位下曷足傷所貴者聖賢洙曰按子昂勸后興明堂太學及條上利便三事莫非賢聖之先務具載新書有才繼騷雅哲匠不比肩趙曰子昂𥘉為感遇詩三十首王適見而驚曰必為天下文宗故公此篇言江左之詩至子昂而𥘉變蓋本乎離騷二雅也殷仲文云哲匠感蕭辰公生揚馬後各與日月懸洙曰揚雄司馬相如皆蜀人蘇曰郭沔曰男兒焉能久生一死足矣若輩不見朝錯紀信名如日月懸空誰可掩蔽吾要明身後名非苟冨貴之徒也陳後主壯之趙曰使荀子貴名起於日月師曰拾遺諌官也子昂嘗為拾遺爵位雖卑不足傷痛後丗所貴於子昂者以能諌武后為王者之事如興明堂崇太學皆聖賢之急務况又作感遇詩三十章其才可繼離騷大小二雅雖當時哲匠善為詩者莫與之比肩子昂生於揚雄司馬相如之後時雖不同其名與日月爭輝固不減於二子二子亦蜀人故甫言及之子昂平昔與同遊英俊人多秉輔佐權洙曰子昂與陸餘慶王無競房融崔泰盧藏用趙元最厚善彥昭超玉價洙曰超一作趙趙曰趙彥昭以權幸進然必有才智者故以超玉價言之郭振起通泉洙曰郭元振舉進士授通泉尉後封代國公餘見後過郭代公故宅趙曰元振則自通泉而往先天二年定䇿誅竇懷貞等皆處相位到今素壁滑洙曰湛方生曰素壁流光灑翰銀鉤連洙曰銀鉤字勢也索靖書勢曰婉若銀鉤漂若驚鴻盛事會一時此堂豈千年終古立忠義感遇有遺編洙曰傳言子昂死有文集十卷盧藏用為之序盛行于代趙曰子昂有感遇詩曰吾觀龍變化日聖人不利巳日金鼎合還丹等篇是也師曰時同遊之士多秉輔佐之權獨子昂官不甚顯至今素壁上尚有諸公墨迹存焉以此堂經久必壞不足以傳後代然忠義之名不朽者惟感遇詩傳于天下覽者得以觀子昂之藴矣字躰如銀鉤屈曲故云灑翰銀鈎連過郭代公故宅彥輔日郭震字元振以字顯封代國公豪雋𥘉未遇其迹或脫略洙曰江淹賦脫略公卿跌宕文史師曰自昔豪俊之士多不拘小莭故云云代公尉通泉放意何自若洙曰元振尉通泉嘗盜鑄及掠賣部口以餉遺賔客及夫登衮冕直氣森噴薄洙曰靈運吳都賦噴薄沸騰寂寞長邁趙曰先天二年郭元振以兵部尚書復同中書門下竇懷貞等附太平公主潛謀不順玄宗發羽林兵睿宗聞變登承天門樓元振率兵侍衛奏上前奉誥誅懷貞等無它也磊落見異人豈伊常情度洙曰新書武后與語竒之索文章上寶劒篇遂得擢用後聘吐蕃還上疏言大將論欽陵請去四鎮兵卒分十姓地為不便趙曰此專譏太平公主事而舊注又雜之以武后召見竒之此豈登衮冕時邪定䇿神龍後宫中翕清廓洙曰按新書明皇之誅太平公主元振獨領軍扈從事定宿中書十四日以功封代國公趙曰神龍則中宗即位改元元年去天先二年凡八年而學者每疑之嘗論曰太平擅寵自中宗而末則禍胎在神龍而下也俄頃辨尊親指揮存顧託趙曰太平公主既誅則君臣之間玄宗得尊位父子之間玄宗得親傳所以感睿宗付託之意也群公有慙色洙曰玄宗之舉事也諸宰相皆走伏外省蕭至忠竇懷忠等皆從逆趙曰玄宗之平亂也諸宰相皆走伏外省獨元振舉兵扈帝王室無削弱逈出名臣上丹靑照臺閣劉曰玄宗封元振代國公畫像凌煙故云云我行得遺迹洙曰迹一作址晏曰遺迹故宅也池館皆疏鑿壯公臨事斷顧步涕橫落髙詠寶劒篇定功曰元振寶劒歌云君不見昆吾鐡治飛炎煙紅光紫氣俱赫然良工煆錬凡幾年鑄作寶劒名龍泉龍泉顔色如霜雪良工嗟咨歎竒絶琉璃玉匣吐蓮花錯􅍢金環生明月正逢天下無風塵幸得用逢君子身精光黯黯青蛇色文章片片緑龜鱗非直結交遊俠子亦曽親近英雄人何言中路遭棄捐零落飄淪古獄邊雖復埋沉無所用猶能夜夜氣衝天趙曰寶劒篇乃郭代公之竒作所愛於武后冝公服膺而髙詠之也神交付冥漠修可曰文選潘安仁作夏侯湛誄曰心照神交唯我與子南史劉訏字彥度阮孝緒博學隱居不交當丗訏一造之即顧以神交列子曰夢有六候正噩思覺喜懼此六夢者神所交也沈休文和宣城詩神交疲夢寐路逺隔思存詠懷古迹三首同作五首二首見陵廟門支離東北風塵際洙曰莊子人間丗支離疏注云形躰支離不全貌蘇曰徐懿老年病躰支離漂泊万里又值西北風塵趙云言祿山亂時在賊也公之在賊或往河陽或趍行在或居秦或居同谷是為東北風塵漂泊西南天地間洙曰漂泊言無定止趙曰言其入蜀往來東西川且在夔也三峽樓臺淹日月洙曰三峽謂瞿唐巫山黃牛也趙曰夔之上遊則月峽下遊則巴峽巫峽此三峽也五溪衣服共雲山洙曰五溪蠻夷所居馬援所征之地衣服言異制也共雲山言與之雜居薛曰右按後漢威將軍劉尚擊武陵五溪蠻夷注酈元注水經云武陵有五溪謂雄溪樠溪酉溪潕溪辰溪悉是蠻夷所居故謂五溪蠻皆槃瓠之子孫也土俗雄作熊樠作朗潕作武在今辰州界羯胡事主終無賴洙曰祿山負恩也無賴言無所倚賴詞客哀時且未還洙曰公自言傷時也庾信平生最蕭瑟暮年詩賦動江關洙曰周書庾信字子山雖位望通顯常有鄉關之思乃作哀江南賦以致其意其辝略云壯士不還寒風蕭瑟搖落深知宋玉悲洙曰宋玉一作為主九辨云悲哉愁之為氣也蕭瑟兮草木搖落而變衰又曰竊獨悲此凛秋風流儒雅亦吾師蘇曰江惣曰宋玉不惟文章亘絶風流儒雅自可為後生師範趙曰言風流以樂廣王衍為首儒雅則公孫弘董仲舒悵望千秋一灑淚洙曰謝靈運詩灑淚眺連岡蕭條異代不同時洙曰漢文帝見相如上林賦恨不與之同時江山故宅空文藻洙曰哀江南賦誅茅宋玉之宅趙曰今公尚在夔所賦詩乃言歸州宅耳雲雨荒臺豈夢思洙曰為玉曽賦陽臺事也趙曰宋玉所言朝雲行雨託興以言夢中事公詩言荒臺之雲雨豈是夢思乎詳並見上注最是楚宫俱泯滅舟人指點到今疑洙曰疑神女事也趙曰此言楚之所謂髙唐觀朝雲廟者無有矣後人亦疑其當時之有無亦未可知也群山万壑赴荆門生長明妃尚有村洙曰歸州有昭君村下有香溪俗傳因昭君而草木皆香故曰香溪一去紫臺連朔漠洙曰江淹恨賦若夫明妃去時仰天太息紫臺稍逺關山無極搖風忽起白日西匿隴鴈少飛岱雲寡色望君子兮可期終蕪絶於異域蘇曰王昭君臨行掩淚曰使妾别紫臺椒房和親朔漢大將軍寧無愧恥乎獨留靑冢向黃昏洙曰昭君墓也薛曰右桉圗經昭君臺興山山南二里漢掖庭待詔王嬙字昭君南郡秭歸人舊注云邑人閔昭君不回立臺以祭焉今有昭君村又琴操昭君伏毒而死單于舉葬之胡中多白草而此冡獨青杜曰引單于既死子逹立昭君謂逹曰將為漢將為胡曰為胡於是昭君服毒而死單于舉國葬之胡中多白草而此冡獨靑前代詞人為作歌詩以弔之畫圖省識春風靣環珮空歸月夜魂薛曰漢元帝宫人頗多嘗令畫工圗之有欲呼者披圗以召故宫人多行賂於畫工王昭君姿容甚麗無所苟求工遂毀其狀後胸奴求美女帝以昭君充行既召見帝悅之而名字巳去遂不復留帝怒殺畫工毛延壽千歲琵琶作胡語分明怨恨曲中論洙曰昭君𥘉適胸奴在路愁怨遂於馬上彈琵琶以寄其恨至今傳之謂之昭君怨薛曰右按釋名推手向前曰琵却手向後曰琶因以為名漢遣烏孫公主念其行道使知音者馬上奏琵琶以慰之歸州有昭君村趙曰若魯變詩一曲琵琶馬上彈恨聲飛入單于國是巳公安縣懷古魯曰吳大帝推蜀先主為左將軍荆州牧鎮油口即居此城時人號備為左公故名其城曰公安野曠吕蒙營洙曰吳將吕蒙營於公安鄭曰十二州志吳大帝封吕蒙為孱陵侯居此地故曰營江深劉備城洙曰劉備曽為荆州牧寒天催日短蘇曰郡平客居多事值寒天鍾鼓催簷外短日風浪與雲平蘇曰水雲風浪卷地疑與雲平一葦敢航者丈夫之勇可見也灑落君臣契趙曰言先主與諸葛也飛騰戰伐名維舟倚前浦長嘯一含情洙曰阮籍見孫登長嘯而返過宋貟外之問舊莊宋公舊池館零落守洙曰一作首陽阿洙曰阿山阿枉道秖從入吟詩許更過趙曰凡枉道而遊者猶任其入况能詩者而不許其過乎則公自負可知矣淹留問耆老寂寞向山河趙曰淹留駐迹之義欲問耆老貟外平日之事所以為之淹留貟外亡矣其莊空存對此山河徒寂寞耳更識將軍樹悲風日暮多洙曰馮異每所止舍獨居樹下軍中呼為大樹將軍漢光武以此多之師曰陽阿乃山之南時李貟外與弟執金吾居此甫枉道過之金吾已死故有寂寞向山河悲風日暮多之句將軍樹美金吾也石笋行彥輔曰成都記石笋及林亭池石之地雨過必有小珠或青黃如粟者亦有細孔可以貫絲田曰杜光庭石笋記云成都子城西曰興義門金容坊有通衢幾百五十步有石二株挺然聳峭髙丈餘圍八九尺耆舊傳云其名有六曰石笋日蜀妃闕曰沈犀石曰魚鳬仙壇曰西海之眼曰五丁石門皆非也圖經云石笋街乃先秦寺之遺址殿宇樓臺咸以金寶飾之為一代之勝概後遭兵火而廢或遇夏秋霖雨里人猶拾珠玉異物前蜀丞相諸葛亮命掘之俯觀方驗測隱其家有篆字曰蠶叢氏啓國誓蜀之碑以二石柱橫埋連接鐵其中歷代故不可毀復鐫四字曰濁歜燭蠲時人莫能曉察惟孔明默悟斯旨令左古瘞之後蜀主李雄􅺷水相范賢詰其所自再掘而詳之賢議曰然厥字四其理各有所主亥子歲濁字可記主其水災寅卯年歜字可記主其飢饉巳午年燭字可記主其火災申酉年蠲字可記主稼穡充益民物冨贍悉以年事推之應驗符響又云蜀之城壘方隅不正以景測之石笋於南北為定無所偏邪今按石笋在衙西門外僅百五十步二株雙蹲一南一北北笋長一丈六尺圍極於九尺五寸南笋長一丈三尺圍極於一丈二尺南笋蓋公孫𫐠時折故長不逮北笋趙曰此篇作於上元元年是年李輔國日離間二宫擅權之迹甚彰故因賦石笋而指譏李輔國師曰甫意謂此石必是古者卿相墓前表識後丗妄加緣飾以為海眼以蔽蒙愚俗蓋譏祿山國忠以微賤小臣蒙蔽玄宗致天寶末年之禍然誣辝謬語君子當致察君不見益州城西門陌上石笋雙髙蹲鄭曰蹲徂尊反洙曰成都記石笋城西門百餘步亦呼為石笋隅落相隅西南數步不對各折為五六段相續以立人云五丁簷亦曰蜀王妃墓表益州城郭皆不直此蓋正東西也公孫𫐠時此石折治中從事任文公歎曰噫西方智士死吾其當之歲中果卒陌一作街古來相傳是海眼洙曰來一作老苔蘚食盡波濤䀶田曰成都記距石笋二三尺每夏月大雨往往陷作土穴泓水湛然以竹測之深不可及以繩繫石而投其下愈投而愈無窮凡三五日忽然不見嘉祐春牛車碾地忽陷亦測而不能達父老云見此多矣此亦甚異者故有海眼之説云趙曰按唐劉崇逺作金華子書載海眼一事云北海郡國發得五銖錢取之不盡得一石記云此是海眼華陽風俗記曰蜀人曰我州之西有石笋焉天地之推以鎮海眼動則洪濤大濫云雨多往往得瑟瑟洙曰每雨過人多得瑟瑟蒼舒曰按博雅瑟瑟碧珠也杜陽雜編有瑟瑟幕其色經明靈薄無與為比此事恍愡難明論恐是昔時卿相墓立石為表今仍存洙曰揚雄蜀王本紀云武都丈夫化為女子顔色美絶蓋山精也蜀王納以為妃無幾物故乃發卒之武都擔土葬於成都郭中號曰武擔以石作鏡一梔表其墓華陽國志曰王哀思之遣五丁之武都擔土為妃作冡蓋地數畒髙七丈立石俗今名為石笋惜哉俗態好蒙蔽洙曰莊子蔽蒙之民亦如小臣媚至尊政化錯忤失大體蘇曰趙充國近見大臣全失燮理政化錯忤隂陽不時多失大體坐看傾危受厚恩洙曰時林甫國忠傾覆王室故子美此詩有所謂耳嗟爾石笋擅虛名後坐未識猶駿奔洙曰詩駿奔走在廟安得壯士擲天外洙曰梁沈約詩安得壯士駐奔羲孝祥曰漢髙祖大風歌安得猛士兮守四方使人不疑見本根洙曰華陽風俗録云蜀人曰我川之西有石笋焉天植之以鎮海眼動則江濤大濫四方之人有來觀者則竒而怪之贊皇公曰夫笋之為狀也亭亭揭峭髙然若削圭芒天成神矣今小大相因疊至八九節束以鐵鼓出於人力又何神乎遂命抽去鐡鼓伺事變怪則寂然而神怪不作趙曰此八句正以專指李輔國一內臣而連結張妃肅宗信任之呼為阿父故公詩言惜哉俗態好蒙蔽亦如小臣媚至尊者石笋以堆石而蒙蔽於人或指為海眼或指為表墓説終不明正如輔國之蔽肅宗而人信好之也坐看傾危受厚恩言輔國之寵幸也舊注却云是時李林甫楊國忠用事而公譏之大非是蓋公乾元元年十二月一日離同谷來蜀作此詩時李與楊巳死矣又二公為相豈得云小臣哉石犀行魯曰成都記石犀在李太白廟內君不見秦時蜀太守刻石立作三犀牛洙曰華陽國志秦孝文王以李氷為蜀守水作石犀五頭以壓水精穿石犀溪於江南命曰犀牛里後轉為耕牛二頭一在府市橋門今所謂石牛門一在淵中文自前堰上分穿羊摩江灌口西於玉女房下自涉郵作三石人立水中興江神要水竭不至足盛不沒肩時青衣出象山下伏行地中會江南安觸山脅溷崖水遁漂疾破害舟船歷代患氷發卒鑿平崖通正水道或曰氷鑿崖時水神怒氷乃操刀入水中乞神鬪迄今蒙福成都記亦云石犀五今云三犀牛未詳自古雖有厭聖法洙曰胸奴傳上以太歲厭勝所在師古注漢髙紀云蕭何𥘉立未央宫以厭勝之術埋冝然乎杜曰本朝樂史寰宇記載志云在市北乃李氷所立以厭水怪天生江水向東流洙曰向一作須襄陽白銅鞮歌漢水向東流又莫愁歌河中之水向東流蜀人矜誇一千載泛溢不近張儀樓洙曰按圖經秦張儀築少城在大城西又周地圖云張儀築城屢壞不能立忽有一龜周旋巫依龜行巡築遂得立今有龜化橋成都記云張儀樓在子城南又曰張儀樓髙一百尺𥘉築此城雖曰附龜蓋亦順江山之勢正即為耕矣乃作此樓而定南北焉今年灌口損戶口此事或恐為神羞洙曰武成以濟兆民無作神羞襄十八年苟捷有功無神羞終藉隄防出衆力髙擁木石當清秋先王作法皆正道詭怪何得參人謀洙曰莊子坂詭譎怪又諔絶詭幻幼怪易人謀鬼謀趙曰厭勝者詭怪之事為不足慿故水終有時而為害隄防者正道故終藉人力以為隄防也嗟爾三犀不經濟缺訛只與長川逝洙曰語子在川上曰逝者如斯夫趙曰此公之寓意於三犀指廟堂無經濟之人夫無經濟之用終亦缺訛隨長川而漂逝乾元三年乃吕諲李現李揆第五琦同平章事未幾以罪去但見元氣常調和自免洪濤恣凋瘵洙曰曹子建詩泛舟越洪濤趙曰謂元氣之謂特在乎得人蓋宰相以燮理隂陽為事也洪濤出晉木華海賦云帝媯巨害之丗天綱浮橘為凋為瘵洪濤瀾汗萬里無際意言汗之潢流乃為凋傷療病於民矣安得壯士提天綱再平水土犀奔茫洙曰前漢李尋傳五行以水為本其精玄武婺女天地所紀終始所生水為凖凖平王道公正修明則百川理絡脈通偏黨失綱則涌溢為敗陳蕃傳志清天綱舜典咨禹女平水土杜曰梁沈約云安得壯士駐奔羲石鏡洙曰成都記武都山精化為女子蜀王開明納為妃無幾物故王哀之取武都山土築為冡蓋地數畒以石鏡表其門蜀王將此鏡送死至空山冥寞憐香骨趙曰謝東運祭古冡文號為冥寞君提携近玉顔洙曰選美者顔如玉衆妃無復歎趙曰言昔日專寵衆妃嗟歎今既死矣無復歎也千騎亦虛還趙曰言送葬之騎獨有傷心石埋輪月宇間洙曰見石笋行注趙曰借張綱埋輪為證也琴臺茂陵多病後洙曰相如後居茂陵常病渴尚愛卓文君洙曰文君臨卬卓氏女少寡好音相如以琴心挑之文君夜奔相如相如與歸成都酒肆人間丗洙曰楠如既歸成都家居徒四壁立乃之臨卭賣車騎酤酒文君當壚自滌器於市琴臺日暮雲洙曰成都記琴臺院以司馬相如琴臺得名而非相如舊臺在浣花溪正路金花寺北廂號海安寺梁蕭藻鎮蜀增建樓臺以備遊觀元魏伐蜀下營於此掘為塹得大甕二十餘口蓋所以響琴也隋蜀王秀更增五臺并舊為六野花留寶靨薛曰右按楚詞天招曰靨輔奇牙冝笑焉趙曰以譬寶靨花鈿也蔓草見羅裙蘇曰江揔妻一日見庭草作詩曰雨過草芊芊連雲鎖南陌門前吾試看似妾羅裙色趙曰言草之緑色如見其裙也歸鳯求皇意寥寥不復聞洙曰何遜聽琴畢謂客曰吾恐伯牙絶弦之後此意寥寥丗不復聞今日何期再洗吾耳也杜曰徐陵王臺新詠載相如琴臺歌云司馬相如遊臨卭冨人卓王孫女新寡竊於壁間窺之相如鼓琴歌挑之鳯兮鳯兮歸故鄉遨遊四海求其皇又曰皇兮皇兮從我栖得託字尾永為妃則歸鳯求皇意乃見此分門集注杜工部詩卷之十三
