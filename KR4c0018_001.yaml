  text: 分門集註杜工部詩卷第一
  hash: sha256:7c49ac56e0c58ef0935e686f4fe878d0b49b6b224fa9b9914b7af08330d6002a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_001-1a}
body:
  text: 月星河附律詩二十首初月光細王洙曰一云常時弦欲上影斜輪未安王洙曰魄未圎滿也微升古塞外巳隱暮雲端王洙曰言易落也薜蒼舒曰魏秦曰夏鄭公評杜公初月詩曰微升古塞外巳隱暮雲端以謂意屬肅宗鄭公善評詩者也秦觀云退之詩煌煌東方星柰此衆客醉其順宗時乎東方謂憲宗在東宫也此論與此詩合河漢不改色趙次公曰言月出便隱惟河漢不以月之隱而改色也關山空自寒庭前有白露暗滿菊花團師古曰是時肅宗乾元初子美在秦州避亂微升古塞外喻帝即位於靈武也巳隱暮雲端喻帝爲張皇后李輔國所蔽也按唐史張后善牢籠稍稍預政事與中人李輔國相助多以私謁撓權徙太上皇西内譛寧王之賜死皆其謀也及肅宗大漸挾越王係謀危太子卒以誅死詳觀此詩頗有深意王紓曰復齋謾録云子美初月詩庭前有白露暗滿菊花團又露詩白露團甘子又江月詩玉露團清影又絶句玉座應悲白露團按謝惠連詩團團滿葉露謝玄暉猶霑餘露團此杜詩所本也月天上秋期近人間月影清入河蟾不没王洙曰庾肩吾望月詩渡河光不濕搗藥兎長生王洙曰傅玄擬問天曰月中何有白兎搗藥王經曰月中有兎與蟾何也月隂也蟾陽也而與兎並明隂係陽也薜夢符曰右按後漢張衡靈憲序曰月者隂宗之精積而成獸象兎隂之類其數耦其後有慿焉羿請無死之藥於西王母姮娥竊之以奔月是爲蟾蜍只益丹心苦能添白髪明干戈知滿地休照國西營王洙曰時官軍營於國西休照爲征夫見月而感月三首斷續巫山雨天河此夜新王洙曰天河銀漢趙次公曰謂之新則知其爲秋七月也若無青嶂月愁殺白頭人蘇軾曰李愬隱首陽山中秋夕携酒友人曰若無明月豈不愁人也魍魎多深樹王洙曰多一作移月明則魍魎遁逃故多深樹蝦䗫動半輪王洙曰月中有蝦䗫白兎趙次公曰古人言月之狀曰隻輪言月之端曰重輪今謂之半輪乃十一十二夜之象也故園當北斗王洙曰北斗辰極也公家在長安趙次公曰說者謂長安上直北斗蓋廣雅云北斗樞爲雍州公用北斗止從上直北斗之說直想照西秦併照巫山出新窺楚水清覊栖秋見裏王洙曰一作愁裏見二十四廻明趙次公曰指言在䕫歷望夜凡二十四廻也必驗升沉體王洙曰以其朝日也如知進退情王洙曰謂不違弦望趙次公曰月初岀曰升旣落曰沉升則進之道沉則退之道也不違銀漢落王洙曰鮑明逺詩夜移衡漢落亦伴玉繩橫王洙曰謝靈運詩玉䋲低建章趙次公曰漢落則月將没矣玉繩星名凡夜深則玉繩低也不逢銀漢落而罷看亦必伴玉繩横而後止此看月之盡夜也萬里瞿塘峽王洙曰一作月趙次公曰指言夔州也春來六上弦時時開暗室趙次公曰言在䕫州凡六見上弦也故故滿青天爽合風襟静當空淚臉懸趙次公曰公以覉旅在外傷時感舊也南飛有烏鵲王洙曰古詩月明星稀烏鵲南飛夜乆落江邊月四更山吐月趙次公曰在䕫州羣山之中故謂之山吐月字岀費昶省中聞擣衣詩丹墀吐明月蓋吐露其光之謂殘夜水明樓趙次公曰言夜將盡矣登樓看月其明照於水而水光照樓沈括曰詩第二字側入謂之正格如此句謂之偏格唐名軰詩多用正格杜詩用偏格者十無二三余葵曰王直方詩話云子美此二句才力冨健塵匣元開鏡王洙曰古詩破鏡飛上天趙次公曰庾信鏡詩玉匣聊開鏡信用之於鏡而公則以比月爲工矣風簾自上鈎王洙曰月詩纎纎似玉鈎姢姢若娥眉謝玄暉風簾入雙燕趙次公曰如陳蕭詮詩珠簾半上珊瑚鈎也兎應疑鶴髪蟾亦戀貂裘趙次公曰上句公又自言其老下句公又自言其貧鶴髪老者之狀庾信竹杖賦子老矣鶴髪雞皮又使蘇季子黒貂裘也斟酌姮娥寡天寒柰九秋王洙曰見九秋驚鴈序尹洙曰後漢天文志注張昭載靈憲之言曰日者陽精之宗積而成鳥象烏而有三距陽之類其數竒月隂精之宗積而成獸象兎隂之類其數耦其後有憑焉者羿請不死之藥於西王母其妻姮娥竊之以犇月將往枚筮之於有黄有黄占之曰吉翻翻歸妹獨將西行逢大晦茫母驚母恐後旦大昌姮娥託身于月是名蟾蜍元嗣宗詠懷詩恱懌若九春李善注引春秋元命包云陽氣成於三故一時三月陽氣終於九故三月一時凡九十日宋哀曰四時皆象此不獨春也九秋以九十言月圎孤月當樓滿寒江動夜扉委波金不定王洙曰前漢郊樂歌曰月穆穆以金波蘇軾曰羊勝月賦金委波而不定桂照水以常摇照席綺逾依王洙曰江淹詩綺席生浮埃趙次公曰委於波中則蕩漾而金色不定照席上則與綺繍相依未缺空山静趙次公曰未缺言月之尚圎髙懸列宿稀鄭卬曰宿悉救切列星也故園松桂王洙曰一作菊發萬里共清輝王洙曰陶潜云三徑就荒松菊猶存古詩千里共明月又清輝溢天門月夜今夜鄜州月鄭卬曰鄜芳無切今陜西路保大軍閨中只獨看趙次公曰天寳十五載夏五月公以家避難鄜州秋八月挺身赴朝廷獨轉䧟賊中閨中指其家也公在賊中而懷鄜州耳遥怜小兒女未解憶長安香霧雲鬟濕清輝玉臂寒何時倚虚幌鄭卬曰户廣切惟也雙照淚㾗乾趙次公曰江文通擬王徴詩練藥爥虚幌雙照者以言月照其夫妻相㑹之時也師古曰時寇乱甫以家寄鄜州長安謂曰都也䘵山䧟都城甫故里焚劫蕩盡虚幌謂無人也一百五日夜對月無家對寒食王洙曰丗說寒食去至一百五日趙次公曰時公寄家鄜州而身䧟賊中此所以歎其無家也有淚如金波王洙曰前漢歌月穆穆以金波斫却月中桂清光應更多王洙曰言月之清光惟桂所掩師古曰桂所以礙月之光無桂則無所礙形所以爲人之累無身則無患矣仳離放紅蘂想像嚬青娥王洙曰謝靈運詩想像崑山姿趙次公曰此乃詩中谷有蓷有女仳離之義亦離也今公詩作於無家之際女方值仳離而花發則示愁寂而巳想見其類也舊本求青娥當作蛾翠眉之謂也夏倪曰宋南平王白紵舞曲曰佳人舉袖羅青蛾牛女漫愁思秋期猶渡河王洙曰牛女牽牛織女二星丗說牛女隔河而居毎七夕則渡河而㑹人間乞巧趙次公曰因月祈感故起牽牛織女之興言二星離而終聚其在我未知如何耳師古曰甫對月娥而思妻子矣牛女猶有㑹之期甫乆别家曽牛女之不若也八月十五夜月二首滿目飛明鏡歸心折大刀王洙曰古詩藁砧今何在山上復有山何當大刀頭破鏡飛上天謂殘月也趙次公曰延篤與李文徳書煥兮爛兮其滿目是也庾信磨鏡詩明鏡如曉月師古曰唐吴競樂府古題要解藁砧今何在砧砆也問夫何處也山上復有山重山爲岀字言夫岀不在也何當大刀頭刀頭有環問夫何時還也破鏡飛上天言月半缺當還也歸心折大刀盖子美旅泊巫山中秋見月心念還歸爾題云八月十五夜月又言明鏡而不言破鏡即非殘月轉蓬行地逺趙次公曰公自謂也攀桂仰天髙趙次公曰言月中桂也劉安招隱士云攀桂枝兮長淹留水路凝霜雪林栖見羽毛此時瞻白兎直欲數秋毫王洙曰月中有白兎以其明徹無所不照故可數秋毫矣蘇軾曰元典秋夜望月坐至中宵人問其乆坐典曰仰瞻白兎直欲數其秋毫耳稍下巫山峽猶銜白帝城趙次公曰稍下猶衘言月也氣沉全浦暗飛繞樹三匝無枝可依趙次公曰宿鳥字出文選言無定名舊引烏鵲南飛全不相干也茅齋依橘柚清切露華新翫月呈漢中王夜深露氣清江月滿江城浮王洙曰一作游客轉危坐歸舟應獨行關山同一照王洙曰古詩千里共明月烏鵲自多驚王洙曰樂府月明星稀烏鵲南飛欲得淮王術風吹暈巳生鄭卬曰暈正問切日月傍氣王洙曰淮南子月隨灰而暈闕注云以蘆灰環月缺其二面暈亦隨而缺杜田曰樂府關山月云天寒光轉白風生暈欲生江月江月光於水髙樓思殺人鄭卬曰思息吏切王洙曰庾肩吾月詩樓上徘徊月䆫中愁殺人天邊長作客老去一霑巾王洙曰見月而感流落也玉露團清影王洙曰謝惠連團團滿葉露謝玄暉猶霑餘露團銀河没半輪王洙曰公月詩云不違銀漢落亦伴玉繩横珠斷王洙曰史五星如連珠縁空一鏡升王洙曰古詩破鏡飛上天餘光憶更漏况乃露華凝王洙曰謝莊詩露華識猿音江月辭風䌫江星别露船雞鳴還曙色鷺浴自清川歷歷竟誰種王洙曰謝惠連詩亭亭映江月古詩天上何所有歷歷種白榆趙次公曰見星之夕所以問其所種之榆也悠悠何處圎王洙曰沈休文詠月清光信悠悠謝希質月賦升清質之悠悠降澄暉之藹藹趙次公曰今所見月猶未圎故問之以何處逢其圎也客愁殊未巳他夕始相鮮趙次公曰言客愁旣止見星月方恱其鮮明也天河常時任顯晦秋至最分明王洙曰天河至秋則顯見人自謂銀河縱𬒳微雲掩終能王洙曰一作當永夜清魯訔曰賢人雖爲羣小所掩然終不害其明含星動雙闕伴月落邊城牛女年年渡趙次公曰斉諧記曰桂陽武丁忽謂其家曰織女渡河諸仙悉還宫吾向巳𬒳召不得停明日失丁所在何曽風浪生王洙曰丗說牽牛織女二星七夕渡河相㑹雨雪古詩十四首律詩三十六首喜雨春旱天地昏日色赤如血王洙曰前漢河平元年日岀赤如血趙次公曰公極言旱日之可畏舊注引前漢河平元年日色赤如血按成帝夲紀及天文志皆無之乃晉光熈元年五月壬辰癸已日光四散赤如血流照地皆流甲午又如之舊注妄引年號有誤後斈甚矣農事都巳休兵戈況騷屑巴人困軍須慟哭厚土熱王洙曰皇天后土實聞此言左傳趙次公曰經傳只使后土至厚地方使厚薄之厚舊注改左傳作皇天厚士實聞此言非是滄江夜來雨眞宰罪一雪榖根小蘇息沴氣終不滅何由見寧嵗王洙曰國語自子之行晉無寕嵗鮑明逺寕歳猶七奔趙次公曰沴氣隂陽錯謬之氣也沴音戻莊子曰隂陽之氣有沴解我憂思結崢嶸羣山雲交㑹未斷絶杜修可曰周禮隂陽之所交風雨之所㑹而合之於詩安得鞭雷公滂沲洗吴越王洙曰時聞浙右多盗賊与獵賦霹靂列缺吐火施鞭又鞭洛水之宓妃南都賦鞭蝄蜽蘇軾曰阮立吴楚乆旱塵氛翳日昨夜一雨旁沲洗滌俱盡苗稼稍覺蘇息師古曰天地昏言煙塵四起騷屑不安貌時永王璘反漢中吴越之間盗賊乗之而起巴峽間困於餽輓怨氣上感夢月爲之大旱故甫意欲鞭雷公滂沲下雨一洗吴越之亂吴越平則人獲安居天時自得何憂旱乾哉沴氣乃隂陽不和之氣大雨西蜀冬不雪春農尚嗷嗷王洙曰搜神記曰萬物樵枯百姓嗷嗷言旱甚也蘇軾曰吕尚曰方今亢陽百卉俱槁東作不入民嗷嗷而怨嗟望修仁德厭此武王從之上天回哀眷蘇軾曰漢文帝上天昭明曲回衷眷閔此黎民朱夏雲鬱陶王洙曰朱一作淸謝靈運幽居猶鬱陶趙次公曰孟子載象謂舜鬱陶思君耳蓋鬱結於陶窑之義故可使於朱夏之雲也朱夏見上注鲁訔曰陶鬱積不散貌執熱乃沸鼎纎絺成緼袍王洙曰詩誰能熱熱劉陶養魚佛鼎秋興賦釋纎絺語有衣敝緼𫀆風雷颯萬里霈澤施蓬蒿敢辭茅葦漏王洙曰茅葦類蓬蓽也巳喜黍豆髙三日無行人二江聲怒號王洙曰二江一作大江蜀都賦帶二江之雙流莊子萬竅怒號王禹儞曰二江涪江巴江也流惡邑里淸矧兹逺江臯趙次公曰左傳有汾澮流其惡今言大雨所蕩亦流岀穢惡也荒廷歩鸛鶴王洙曰蓋鸛鳴則雨應也隱几望波濤沉痾聚藥餌頓忘所進勞趙次公曰言以沉痾之故而聚藥餌今得大雨清凉於是頓忘供進藥餌之勞也則知潤物功可以貸不毛王洙曰諸葛亮傳五月渡瀘深入不毛言不生物也趙次公曰因雨之潤雖不毛之地亦假貸而生隂色静壠畒勸耕自官曹四鄰出耒耜何必吾家操蘇軾曰王褒喜見四鄰耒耜之具雨趙次公曰此篇主用巫山之雨爲意峽雲行淸暁煙霧相徘徊風吹蒼江樹雨洒石壁來淒淒生餘寒殷殷兼出雷白谷變氣候朱炎安在哉髙鳥濕不下居人門未開楚宫乆巳滅幽珮爲誰哀趙次公曰神女賦於是揺珮飾鳴玉鸞也髙蟾亦曰丁當玉佩三更雨侍臣書王夢賦有冠古才鄭卬曰冠古乱切冥冥翠龍駕多自巫山臺王洙曰謝玄暉朔風吹飛雨蕭條江山來楚襄王夢與袖女遇宋玉作髙唐賦曰旦爲朝雲暮爲行雨朝朝暮暮陽山之下楚詞雷填填兮雨冥冥髙唐賦虹爲旌翠爲蓋神女賦婉若游龍又乗雲翔又揺佩飾鳴玉鸞趙次公曰謝眺七夕賦回龍駕之容曳雨二首青山淡無姿白露誰能數趙次公曰暗用佛書雨露皆有頭數之義片片水上雲蕭蕭沙中雨殊俗狀巢居曽臺俯風渚王洙曰楚地面水背山俗多架木爲居以就地勢佳客適萬里蘇軾曰才惟佳客感秋風適萬里夫復何日重把此一巵臨行我心傷悲沉思情延佇王洙曰佳客逺而有所思念也猶思見君子爾掛㠶逺色外驚浪滿吴楚王洙曰時宼盗未平而永王復撓於江淮間趙次公曰此實道其事而别無託㒷舊注以驚浪比永王誤矣以永王璘之叛自是至徳二載此詩以掛帆言之則爲荆南矣以白露言之則時乃大曆三年之秋不亦相逺乎乆隂蛟螭出王洙曰言丗乆晦而賊民者出也宼盗王洙曰一云冠盖復幾許蘇軾曰劉後主冠蓋復有幾人趙次公曰古詩相去復幾許又吟空山中宵隂微冷先枕席回風起淸曉萬象萋巳碧王洙曰古詩回風動地起陸士衡迅雷中霄激驚雷光夜舒落落出岫雲王昱曰陶淵明歸去來辭雲無心而於岫渾渾倚天石日假何道行王洙曰天文志日有行黄道有行赤道者時乆雨隂晦不知日之所行何道雨含長江白連檣荆州船王洙曰江賦舳艫相屬万里連檣有士荷矛㦸南防草鎮慘霑濕赴逺役羣盗下辟山揔戎備強敵水深雲光廓鳴櫓各有適趙次公曰公有羡慕之辭漁艇息王洙曰一云自悠悠夷歌負樵客趙次公曰思其上逺適之㒷不可則又思其次也漁人之舟自如樵客之放夷歌蓋亦足樂矣留滯一老翁書時記朝夕王侏曰甫旣無所施於丗所書者時而巳趙次公曰留滯於此爲可傷也姑書時節之朝夕而巳秋雨歎三首王洙曰此詩刺時之暴虐故取詩北風其凉意雨中百草秋爛死堦下决明顔色鮮杜修可曰本草圗經云決明夏𥘉生苗七月有花黄白色趙次公曰百草以秋而又雨則爛死也冝矣而决明方以鮮明之色黄花翠葉而獨榮以譬君子在患難之中而獨立之譬也著葉滿枝翠羽蓋王彦輔曰東京賦樹翠羽之髙蓋開花無數黃金錢杜定功曰神農本草决明子生龍門川澤間與石决明同功皆主明目故有决明之號圖經云夏𥘉生苗根蔕紫色葉似苜蓿而大七月有花黄白色其子作穗似青菉豆而銳也薛夢符曰右按爾雅薢茩英茪注英明也黄葉銳赤華實如山茱茰或曰公陵也關西謂之薢茩音皆王彦輔曰此傷特立獨行之君子不得時也按本草决明夏花秋生子花赤與此篇所稱不同然公時有金錢花與菊相類多生於秋雨中俗謂之滴漏花杜豈并此邪凉風蕭蕭吹汝急恐汝後時難獨立堂上書生空白頭王洙曰荘子魯侯讀書堂上蘇軾曰邵平魯堂白頭書生焉敢輕議朝廷事余葵曰莊子天道篇桓公讀書於堂上即無魯侯讀書之說臨風三嗅馨香泣王洙曰語子路共之三嗅而作嗅香而泣傷巳之不見用而無救於時也蘇軾曰陳江揔重九日見菊采視之乆謂席上賔客曰元亮若見必不使混於蕕草中至醉又語客曰三嗅三憶古人使人三泣衆客慘然趙次公曰孔子歎山雌之得時所以傷巳之不遇至於子路共之三嗅而作則亦傷之而不苟食故也今也臨風三嗅而亦傷其徒馨之意師古曰時苦雨傷物盖政淫泆之所致也詩有北風其凉正月繁霜雨無正風雨所飄摇之作皆謂時政不善也玄宗初用張九齡開元之間治平後用李林甫楊國忠天下亂軍旅數起故隂陽不和恒雨苦之百草爛死言虐政害物也决明佳𬞞也食之能决去眼昏以益其明喻九齡引忠諌諍開其聦明去其昏蔽時林甫進用在上九齡罷黜在下不以不用而憔悴其色故云堦下决明顔色鮮葉滿枝花無數不以風雨而摇落喻君子遭患難而節操愈固不凋䘮也凉風以譬刻薄之小人時林甫國忠之徒擠䧟九齡雖九齡獨立自守恐亦不免禍也故云凉風蕭蕭吹汝急恐汝後時難獨立堂上書生甫自謂也空白頭爲國家憂故頭白昔王羲之當晉亂終日然花鬚嗅香顰蹙無言時人不㑹其意盖憂晉國之亂故也今甫臨風三嗅傷九齡有馨香之德而爲姦人所逐寧不憂思而泣乎再吟蘭風伏王洙曰一作長王安石曰㐲作仗黄庭堅曰伏當作長雨王洙曰一云東風細雨楚辭光風泛崇蘭伏三伏也秋紛紛趙次公曰䦨珊之風沈伏之雨言其風雨之不巳也䦨如謝靈運䦨暑之䦨伏如左傳夏無伏隂之伏也舊引楚辭光風泛崇蘭以伏爲三伏非是四海王洙曰一云萬里八荒同一雲王洙曰一作萬里同一雲詩上天同雲雨雪紛紛王彦輔曰風言號令雨言德澤雲障閉令萬里一同見隂小之盛也楚辭九章曰雲霏霏而承宇王逸曰佞人並進滿朝廷也去馬來牛不復辯濁涇清渭何當分王侏曰莊子秋水時至百川灌河涇流之大兩涘渚涯之間不辯牛馬趙次公曰以多雨而水漲岸逺所以不辯馬牛也涇之濁渭之清固自分辯而多雨混之則不可得而分别耳洪蒭曰選潘岳西征賦云北有清渭濁涇杜蓋謂品流混殽木頭生耳黍穗黒趙次公曰唐俚語云春雨甲子赤地千里夏雨甲子乗船入市秋雨甲子木頭生耳出朝野簽載一本作禾頭非是蓋禾粟无生耳者木頭生耳則栮是巳黍穗黒則壞爛矣故農夫无所望也農夫田父無消息王彦輔曰甲子禾生耳又本草五木耳謂楮槐榆柳桑曹子建詩黍稷委疇隴農夫安所獲城中㪷米換衾禂蘇軾曰漢未天下大荒米每㪷十餘緍京房持一衾於長安中換陳米一㪷人皆易子而食相許寧論兩相直王洙曰天寳末外窮兵夷狄内盡力宫室役使繁興民不得休息此詩所以刺也王彦輔曰舊史開元中斗米數錢論此詩則可以論其丗矣師古曰蘭風謂剪蘭之風伏雨謂三伏暑毒之雨皆非能生物者也以喻毒虐之政四海八荒同一雲言普天皆罹其害馬童而牛角涇濁而渭清此易辨也風雨冥晦馬牛不能辨涇渭不能分以譬昏亂之丗忠邪賢否混淆無别華黍時和歳豊冝黍稷也黍冝於髙燥稷冝於下濕雨暘得中故黍稷咸冝黄帝之丗五日一風十日一雨今苦雨木頭尽生耳黍稷盡黒林甫爲宰相不能爕調可知古者役民歲不過三日恐妨農時也今農夫田父皆負戈行役過期不反是以田萊多荒年凶穀踊京城之内一衾一禂纔換斗米但得相許何暇論貴賤之價相當與不相當乎玄宗窮兵四夷民貧物貴如此其視正觀中米斗三錢得無媿耶又吟長安布衣誰比數鄭卬曰所矩切說文計也反鏁衡門守環堵王洙曰陳風衡門之下可以棲遟注衡門横木爲門言淺陋也儒行儒有一畒之宫環堵之室環堵面一堵也五版爲堵五堵爲雉張景陽詩環堵自頽毀垣閭不隱形莊子讓王篇原憲居魯環堵之室韋玄成傳使得自安衡門之下師古曰衡門謂横一木於門上貧者之所居也陶潜環堵蕭然不蔽風日老夫不出長蓬蒿王洙曰莊子庚桑楚篇鑿垣牆而殖蓬蒿昭十六年傳斬艾蓬蒿藜藿而共處之月令藜莠蓬蒿並興江淹詩顧念張仲蔚蓬滿中園趙歧三輔决録注曰張仲蔚隠身不仕所居蓬蒿没人稚子無憂走王洙曰一作奏風雨雨聲颼颼催早寒鄭卬曰颼踈鳩切風貌正作䬒胡鴈翅濕髙飛難王洙曰古詩願爲雙鴻鵠奮翅起髙飛趙次公曰鴈本髙飛之物以雨多翅濕而難於髙飛亦興物以自况洪炎曰庾信喜雨詩鴈􅊜断行來秋來未曽見白日洪炎曰魏文帝秋霖賦悲白日之不晹泥汚后王洙曰一作厚土何時乾王洙曰宋玉九辯皇天淫溢而秋霖兮后土何時兮得乾此詩刺賢者退處而民漸溺於塗炭也師古曰長安京城也唐都長安布衣深衣也以練布爲之衡門謂衡一木以爲楣堵墻也孟子五畒之宅樹墻下以桑環繞其墻以爲守禦衡門環堵貧者之居也長安繁華之地貴游乗髙車駕駟馬甫困於布衣誰復有比數者言不得備數而巳是以杜門却掃安於貧賤老夫不岀長蓬蒿言耆舊之臣隱逋不出賢路荆棘惟乳臭小子當權見用無能爲國家憂慮但樂禍幸灾而巳稚子指禄山楊貴妃養爲義子杜詩云稚子𫾣針作釣鈎是也詩人多以風雨譬患難如風雨所飄揺之類禄山爲將生事邊疆非樂禍幸災而何故云走風雨雨声颼颼催早寒言寒之來有漸譬禄山叛謀漸著大夫以道去就者鴈之比也禄山叛衣冠䧟於胡者不可勝數雖欲脫身南來勢有不可故云胡鴈翅濕髙飛難當是時玄宗幸蜀駕巳岀京城無知者軍民官吏瞻望天子杳無消息故云秋來未曽見白日禄山從范陽長駈而來普天之民咸墜塗炭故云泥汚后土何時乾苦雨奉寄隴西公兼呈王徴士王彦輔曰杜元注云隴西公即漢中王瑀徵士琅邪王徹今秋乃淫雨王洙曰月令季春行秋令則天多沉隂淫雨蚤降注九月多隂淫霖也雨三日以上爲霖洪朋曰爾雅云乆雨謂之淫楊符曰蔡邕行述賦遘淫雨之經時仲月來寒風羣木水光下萬象雲氣中王洙曰萬象一作萬家唐中宗二年三月洛城東七里許地色如水側逆樹木往來車馬皆歷歷影見水中經月餘乃滅趙次公曰此盛言苦雨之狀也萬家一作象非是且旣言象則上不應言羣木也舊引中宗時地色如水事疑誤後學所思礙行潦九里信不通王洙曰詩雅泂酌彼行潦流潦也䟽云行者道也潦者雨水也行道上雨水流聚故云流潦傳云行潦之水也趙次公曰指隴西公王徵士之所居言爲苦雨所隔斯乃九里不通之謂矣悄悄素滻路王洙曰潘岳西征賦玄灞素滻唐天寳元年命陜郡太守韋堅引滻水開廣運漕悄悄言行旅不通貌鄭卬曰滻素簡切水名楊符曰李善選注玄素水色迢迢天漢東王洙曰古詩迢迢牽牛星言有所隔黄庭堅曰詩維天有漢監亦有光天漢銀河也趙次公曰天漢則中渭橋之所長安志於中渭橋引三輔黃圗曰渭水貫都以象天漢横橋南渡以法牽牛是也願騰六尺駒王洙曰一作馬背若孤征鴻王洙曰周禮凡馬八尺以上爲龍七尺以上爲騋六尺爲馬趙次公曰鴻鵠髙飛逺舉之物謂之孤征鴻蓋以其羣飛則意猶詳緩孤飛則欲逐伴而急矣劃見公王洙曰一作君子面鄭卬曰劃忽麥切蘇軾曰韓湛昨稠人冠蓋中劃見面目巳謂非俗人也超然懽笑同奮飛旣胡越王洙曰詩不能奮飛古詩胡馬依北風越鳥巢南枝趙次公曰言如胡與越之隔也王粲所謂胡越之異區也舊引胡馬越鳥誤矣王彦輔曰言如鳥奮翼而飛胡越言南北之異局促傷樊籠王洙曰古詩晨風懷苦心蟋蟀傷局促莊子澤雉不蘄畜乎樊中注樊中所以籠雉也杜修可曰南史陽休之不樂典選乆曰此官寔時清華但妨吾賞真是樊籠矣趙次公曰漢景帝云局促如轅下駒洪覺範曰王績遊北山賦長懷企羡豈出樊籠一飯四五起王洙曰史記一飯之恩必報又周公一飯三吐哺蘇軾曰李合望弟令毎一飯四五起望西北尹洙曰鮑昭詩起坐失次第一日三四迁慿軒心力窮王洙曰江文通雜躰詩慿軒詠堯老此言思見君子而不可得也師古曰春夏多雨水秋冬多旱乾此常理也當旱乾反爲苦雨乃隂氣滛泆臣浸君之象故云今秋乃淫雨立秋之候凉風始至今於仲月寒風早來隂陽不調寒暑舛逆若此水氣在天爲雲雲行則雨施杜詩云安得誅雲師今羣木皆居水光下萬象皆在雲氣中言水潦漲溢雲氣凝結以喻天下之民咸墜於塗炭也九者陽數之極九里至近柰何爲行潦所礙雖有所思欲通音問而不能逹况其逺者乎是冝素滻之路天漢之東悄悄無行人迢迢相間隔音問阻絶不獲相通陜西有滻水漢中郡琅琊郡皆在天漢之東甫居西瑀與徴居東時阻於禄山之乱人皆墊溺是以託意於雨潦而思漢中王瑀與琅琊王徵也公子指瑀與徴劃謂以刀劃開如披雲霧獲覩青天是也甫欲騰跨馬皆疾若飛鴻劃見二公子面與之同􅌚笑此述懷思之情胡在北越在南雖然如鳥之奮飛柰胡越相去之逺何不免局促於樊籠而不得騁也詩云折柳樊圃樊藩籬也時兵革遍天下動則拘礙無所適往真若局促樊籠之中是以寢食不遑安處一飯之間四五起問消息以至慿軒檻心力窮盡盖傷罹乱之丗人無所安居有如北也是詩之寄豈直爲苦雨作乎嘉𬞞没溷濁王洙曰郭景純江賦播匪藝之芒種挺自然之嘉𬞞宋玉風賦駭溷濁揚腐餘屈平卜居云俗溷濁而不清騷又云溷濁而嫉賢嘉𬞞注𬞞菜也鄭卬曰溷胡困切亂也王十朋曰記稻曰嘉𬞞時菊碎榛叢王洙曰嘉𬞞時菊刺賢者爲羣小所掩翳也潘安仁時菊耀巖阿蘇軾曰符㓪曰甘菊碎雜榛叢蕙蘭同委蒿艾趙次公曰謝玄暉詩時菊委嚴霜蓋𬞞没菊碎因苦雨所致以興賢者困於時政之煩苛也鷹隼亦屈猛王洙曰張華鷦鷯賦蒼鷹鷙而受絀屈猛志以服養嫉尸禄也趙次公曰使張華鷦鷯賦屈猛志以服養而舊解以爲禰衡誤矣烏鳶何所蒙式瞻北鄰居蘇軾曰王雋瞻彼北鄰吹笙食魚取適南巷翁掛席釣川漲焉知清興終王洙曰言賢者言於退處謝靈運揚㠶采石華掛席拾海月趙次公曰言隴西公主徴士旣不見矣姑近取北鄰南巷之人而與遊也師古曰嘉𬞞所以養人菊當秋冝得其時今碎于榛叢反失其時也溷濁塗泥也𬞞與菊皆喻賢人君子當禄山之亂小人得時賢人君子失所故有没溷濁碎榛叢之譬鷹隼當秋時冝於擊搏將帥於斯時岀力平賊之秋也今乃屈猛蓋言諸將敗衂是以禄山得以長驅烏鳶小民之比也官兵旣敗小民爲賊焚虜何所蒙其福耶蓋言民無所恃故曰烏鳶何所蒙雨僚阻礙所向不通式瞻者止於北隣所適者止於南巷其局促如此以喻諸郡䧟于賊土地迫蹙動無所往是以杜甫甞有偪仄行蓋亦如此意也當是時賢人雖隱於漁釣可以保身故曰掛席釣川漲焉知清興終掛席即掛帆也漁釣之樂烏有終窮仕於亂丗誠所憂耳雨行雲遞崇髙鄭卬曰遞待禮切更易也飛雨藹而至王洙曰蓋雲行則雨施潺潺石間溜何覬曰水穿石曰溜汩汩松上駚鄭卬曰踈吏切馬行貌亢陽乗秋熱百榖亦巳棄王洙曰陽過亢則旱而無嵗望矣蘇軾曰傳弈霖霪不止漲潦發川百榖委棄農愁民嘆皇天德澤降燋卷有生意趙次公曰應璩與岑瑜書云頃者炎旱日更甚沙礫銷鑠草木燋卷也前雨傷卒暴鄭卬曰卒蒼没切今雨喜容易趙次公曰雖雨而速止是謂倉卒及悠乆而降斯謂容易不可無雷霆間作鼔増氣佳聲達中宵所望時一致王洙曰以其應期也清霜九月天髣髴見滯穗王洙曰詩遺秉滯穗伊寡婦之利郊扉及我私王洙曰一云栽耘詩遂及我私我圃日蒼翠恨無抱甕力庻減臨江費王洙曰子貢過漢隂見一丈夫方爲圃畦鑿隧而入井抱甕而出灌蘇軾曰龐淳見里人灌竹淳曰恨老病無抱甕力助子灌此蒼翠杜修可曰峽内無井取江水飲之雨山雨不作埿江雲薄爲霧晴飛半嶺鸖風亂平沙樹趙次公曰陳正見經季子廟詩小雨濕苔碑明滅洲景微隱見巖姿露拘悶出門遊曠絶經目趣消中日伏枕臥乆塵及屨蘇軾曰羊充不仕隱中條山辟榖毎卧即浹旬至有塵滿草屨豈無平肩輿趙次公曰輿橋子也王猷聞觀辟疆有名園乗平肩輿而徑入莫辨望郷路兵戈浩未息虵虺反相顧蘇軾曰孔融豺虎相食虵虺相防悠悠邊月破蘇軾曰李恢秋日詞云邊月破鏡飛塞鴈断行數鬱鬱流年度針灸阻朋曹王洙曰針灸所以救療也譬良友朋也糠籺對童孺王洙曰時旣乏良朋所對者童孺而巳糠籺言非實徳也趙次公曰以乆病故湏針灸以安養故與朋友阻隔如賈島言多病人踈也正句言貧食糠與童孺相對而巳一命湏屈色新知漸成故窮荒益自卑飄泊欲誰訴趙次公曰以嚴武辟公爲節度叅謀所謂一命也今公受命矣則當屈色以下之以漸故蓋言死也此所以有窮荒之嘆也尫羸愁應接俄頃恐違王洙曰一云危迕浮俗何萬端幽人有髙歩王洙曰幽人不隨流俗不合汙丗自有髙致也趙次公曰左太冲詠史詩髙步追許由龐公竟獨往王洙曰龐德公也未甞入州府夫妻相敬如賔劉表不能屈後携妻子入鹿門山不反尚子終罕遇王洙曰後漢逸民傳尚長字子平髙士傳隱居不仕肆意遊五岳名山竟不知所終謝靈運畢聚類尚子宿留洞庭秋天寒瀟湘素杖䇿可入舟送此齒髮暮王洙曰漢書宿留瞽言楚詞嫋嫋兮秋風洞庭波兮木葉下趙次公曰宿留音透溜岀漢如言等候也公詩蓋言候秋時可以登舟而往矣喜晴一云喜雨皇天乆不雨旣雨晴亦佳岀郭眺西郊蕭蕭春増華青熒陵陂麥王洙曰西都賦琳珉青熒校獵賦眩矅青熒莊子外物篇青青之麥生於陵陂窈窕桃李花王洙曰李一作杏曹子建容華若桃李詩窈窕淑女幽閑也桃之夭夭灼灼其華何彼穠矣華如桃李阮籍夭夭祧李花春夏各有實我飢豈無涯干戈雖横放鄭卬曰横户孟切慘澹鬪龍虵甘澤不猶愈且耕今未賖丈夫則帶申婦女終在家力難及黍稷得種菜與麻千載啇山芝王洙曰前漢王貢兩龔鮑傳漢㒷有園公綺里季夏黄公角里先生此四人者當秦之丗避而入商雒深山以待天下之定也自髙祖聞而召之不至往者東門瓜王洙曰蕭何傳邵平者乃故秦東陵侯秦破爲布衣貧種瓜長安城東瓜美故丗謂東陵瓜從邵平始也阮詩昔聞東陵瓜近在青門外趙次公曰以四皓採芝邵平種瓜皆避秦之亂其道爲不可貶也其人骨巳朽王洙曰朽一作滅史記曰老子曰子所言者其人与骨皆朽也此道誰疵瑕王洙曰左傳不汝疵瑕英賢遇轗軻鄭卬曰上苦感下口左切王洙曰古詩坎軻長苦辛楚詞轗軻不遇坎与轗同逺引蟠泥沙王洙曰賈誼傳鳯縹縹而髙逝固自引而逺去揚子龍蟠于泥顧慙昧所失廻首白日斜王洙曰賈誼庚子日斜師古曰甫自愧昧於所適不能脫身晦迹回首自顧恨年巳老矣故云云漢隂有鹿門王洙曰後漢逸人傳漢隂老父桓帝幸竟陵過雲夢臨沔水百姓莫不觀者老父獨耕不輟又龐公㐮陽人也居峴山之南未甞入城府後携其妻子登鹿門因采藥不反㐮陽記鹿門山舊名蘇嶺山蒼海有雲查鄭卬曰音槎王洙曰見秋曰䕫府詠懷查上似張騫注趙次公曰按張華博物志載舊說天河与海通丗有人居海渚者年年八月浮槎去來不失斯人有竒志立飛閣於查上多齎粮乗槎而去奄至一処遥望宫中多織婦見一丈夫牽牛渚次飲之牽牛人驚問曰何由至此人說來意并問此是何処荅曰君還至蜀訪嚴君平則知之後至蜀問君平曰厶年月日有客星犯牛宿計年月日正是人到天河時也焉能學衆口蘇軾曰吴芮吾焉能斈衆兒女口嗜棗栗瓜果耶咄咄空咨嗟王洙曰空一作同丗說殷中軍被廢在信安終曰恒畫空作字揚州吏人㝷議之竊視唯作咄咄怪事范雲至殿門不得入但云咄咄而巳中軍殷浩也晚晴髙唐暮冬雪壯哉饒節曰髙唐楚地㐮王所夢者是也舊瘴無復似塵埃王洙曰峽中每嵐瘴起如塵埃翳天崖沉谷没白皚皚鄭卬曰莫開切江石缺裂靑楓摧南天三旬苦霧開王洙曰舞鶴賦嚴嚴苦霧赤日照耀從西來六龍寒急光徘徊王洙曰六龍曰馭也照我衰顔忽落地王洙曰言見陽而熈也口雖吟詠心中哀味怪及時少年子揚眉結義黃金臺王洙曰燕昭築黄金臺以札郭隗鮑昭豈伊白璧賜時起黄金臺汨乎吾生何飄零支離委絶同死灰王洙曰攴離言不爲時所用也莊子支離旣又心可使如死灰復隂方冬合沓玄隂塞昨日晚晴今日黒萬里飛蓬映天過孤城樹羽揚風直江濤簸岸黄沙走雲雪埋山蒼兕吼君不見䕫子之國杜陵翁牙齒半落左耳聾王洙曰䕫州古䕫子國也杜陵子美故里也雨冥冥甲子雨王洙曰楚辭雷填填兮雨冥冥巳度立春時趙次公曰兩句夏之之辭也唐諺云春雨甲子赤地千里輕箑煩相向鄭卬曰箑山合切王洙曰秋㒷賦於時乃屏輕箑注所甲反扇也蘇軾曰和用夏夜蚊雷足煩輕箑吴人俗呼扇爲箑纎絺恐自疑王洙曰秋㒷賦釋纎絺注絺葛也公言扇可相向則纎絺疑其可矣煙添纔有色風引更如絲王洙曰張景陽騰雲似湧煙密雨如散絲直覺巫山暮王洙曰髙唐賦妾在巫山之陽暮爲行雨兼催宋玉悲王洙曰宋玉故有悲秋趙次公曰催則不必待秋至而此雨巳可催之春夜喜雨好雨知時節王洙曰管子曰五政苟時春雨乃來又洪範休應則時若當春乃王洙曰一云及發生隨風潜入夜潤物細無聲王洙曰如膏也趙次公曰范元實所謂聖人復生不可改矣野徑雲俱黒江舩火獨明曉看經王洙曰一作紅濕處花重錦宫城王洙曰蜀城人以江山明媚錯雜如繡故多呼錦宫城江雨有懷鄭典設春雨闇闇塞峽中早晚來自楚王宫王洙曰謂旦爲朝雲暮爲行雨也鄭卬曰襄王故居亂波分披巳打岸弱雲狼藉不禁風鄭卬曰禁居吟切寵光蕙葉與多碧趙次公曰孔雀賦天雨之施惠於蕙葉此乃蒙寵光之義㸃注桃花舒小紅趙次公曰古燕歌行云曲桃抽覆地春花舒谷口子真正憶汝王洙曰見谷口但窮耕注岸髙瀼滑王洙曰一作闊限西東王洙曰䕫有澗水出於山谷間謂之瀼居人分其左右謂之瀼東瀼西公亦有瀼東閑望詩雨不絶鳴雨旣過漸細微映空揺颺如絲飛王洙曰古詩密雨如散絲堦前短草泥不亂院裏長條風乍稀舞石旋應將乳子王洙曰湘川記零陵有石燕雨過則飛如生燕行雲莫自濕仙衣王洙曰謂髙唐神女也朝爲行雲暮爲行雨眼邊江舸何怱促鄭卬曰舸嘉我切未得王洙曰一作侍安流逆浪歸梅雨王彦輔曰梅熟而雨曰梅雨江東呼爲黄梅雨趙次公曰周處風士記云夏至前雨名黄梅雨沾衣服皆敗黦南京犀浦道王洙曰玄宗幸蜀改成都置尹視二京號爲南京鮑文虎曰至德二載十二月戊午大赦以蜀郡爲南京鳯翔爲西京西京爲中京故云有南京犀浦道之句杜田曰正謬云肅宗至德二年以蜀郡爲南京鳯翔爲西京西京爲中京舊注以玄宗所致非師古曰原叔以爲玄宗致誤矣四月熟黃梅湛湛長江去王洙曰阮籍詩湛湛長江水上有楓樹林冥冥細雨來王洙曰隋煬帝江都夏詩梅黄雨細麥秋横楓樹蕭蕭江水平茅茨踈易濕王洙曰茅茨以茅覆屋也庾信小園賦穿漏兮茅茨雲霧宻難開竟日蛟龍喜盤渦與岸回王洙曰瓠子歌曰蛟龍騁兮方逺遊郭璞江賦盤渦谷轉凌濤山頽鄭卬曰渦烏禾切水回也師古曰水之蟠聚而洄洑者故與岸囘旋蛟龍喜以水漲故也喜雨南國旱無雨今朝江出雲趙次公曰南國荆楚也王安石曰記云山川能出雲爲風雨故曰江出雲入空纔漠漠洒逈巳紛紛巢鷰髙飛盡林花潤色分晚來聲不絶王洙曰一作更急應得夜深聞雨萬木雲深隱連山雨未開風扉掩不定蘇軾曰吴芮山居扉不用横木遇風即開掩芮欣然而樂趙次公曰風扉舟中之門也水鳥過仍廻蛟館如鳴杼鄭卬曰直吕切王洙曰文選蛟人織綃於泉室趙次公曰以在舟中視大江云不若有蛟人之館而聽其鳴杼樵舟豈伐枚王洙曰樵人於木無所取材止採薪而巳清凉破炎毒衰意欲登臺夜雨小雨夜復密廻風吹早秋野凉侵閉户趙次公曰巳閉户矣凉風透之故云侵閉户江滿帶維舟趙次公曰公言江水旣添滿而有維舟在岸也任彦昇詩序云維舟乆之郭生方至尓通籍恨多病王洙曰公通籍朝省以病不赴趙次公曰公前爲左拾遺盖甞通禁省之籍矣爲郎忝薄游王洙曰檢校尚書郎趙次公曰公官乃工部貟外郎則巳自媿其忝竊扵薄薄游宦矣漢卜式不願爲郎天寒出巫峽醉別仲宣樓王洙曰王粲字仲宣有樓在荆州更題只應踏初雪騎馬發荆州直怕巫山雨眞傷白帝秋趙次公曰公在䕫州乃巫山白帝之側故指其多雨而當時秋可傷也羣公蒼玉珮王洙曰晉公卿禮秩特進尚書令僕射皆佩水蒼玉蘇軾曰朱椿昨日見王遵緑衣佩蒼玉於羣公中風姿尤異天子翠雲裘王洙曰禮孟冬之月天子始裘趙次公曰宋玉賦主人之女爲日之乗華上翠雲之裘北王夸誕之言今公直言天子矣同舎晨趨侍胡爲淹此留王洙曰言同舎皆在侍從巳何爲而留此公之志甞在朝廷而不爲時之所用如此雨四首微雨不滑道斷雲踈復行紫崖奔處黒白鳥去邊明秋日新霑影趙次公曰以雨之故曰影朦朧爲霑影矣寒江舊落聲柴扉臨野碓鄭卬曰都内切舂也半濕搗香秔王洙曰搗一作我趙次公曰音庚稻也江雨舊無時天晴忽散絲趙次公曰古詩密雨如散絲暮秋霑物冷今日過雲遲上馬廻休出看鷗坐不辭髙王洙曰一作層軒當灔澦鄭印曰寰宇記艶預堆在䕫州西南二百歩蜀江中心瞿唐峽口冬水淺屹然露二百餘尺夏水張没水中十丈其狀如馬舟人不敢進潤色静書幃物色嵗將宴天隅人未歸朔風鳴淅淅王洙曰謝玄暉淅淅就衰林謝惠連淅淅振條風寒雨下霏霏多病乆加飯趙次公曰古詩上言加飡飯衰容新授衣時危覺凋䘮王洙曰一云䘮乱故舊短書稀楚雨石苔滋京華消息遟山寒青兕叫江晚白鷗飢神女花鈿落王洙曰宋玉有神女賦薛夢管曰右按唐志命婦之服兩博鬢飾以宝鈿金花也趙次公曰神女廟在巫山山中花即神女所以為鈿者𬒳雨而落蛟人織杼悲王洙曰江賦鮫人構館于懸流又潜織以卷綃注鮫人泉客織輕綃於泉室岀以賣之趙次公曰鮫人以雨之故悲耳吴都賦云泉客潜織而卷綃注泉客鯨人也織輕綃於泉室岀於市間賣之繁憂不自整終日灑如絲白帝白帝城中雲出門趙次公曰謝靈運詩巖髙雲若屯舊作雲出門无義白帝城下雨翻盆王洙曰雲行而雨施尔翻盆言其勢之暴也蘇軾曰黄翌過秦関值驟雨笑謂友人曰屏翳蜚廉闘競翻盆澆吾友皆笑髙江急峽雷霆闘王洙曰江為峽所束故皮声若雷霆也翠王洙曰一作古木蒼藤日月昏戎王洙曰一作去馬不如歸馬逸千家今有百家存王洙曰百一作十言殘故也哀哀寡婦誅求盡慟哭秋原何處村王洙曰時征役並㒷民死於役故多寡婦也暴賦横歛故多誅求也此言軍旅之際民不聊生如此村雨雨聲傳兩夜寒事颯髙秋挈王洙曰一作攬帶看朱紱王洙曰公任郎官故朱紱開箱覩黒裘王洙曰蘇李不得用而貂裘弊黒趙次公曰以雨之故恐其邑醭故也丗情只益睡王洙曰丗態凋弊不可膽想莫若自隱於睡尓趙次公曰亦以雨悶思及丗情惟睡而巳盗賊敢忘憂王洙曰所憂者盗賊未平松菊新霑洗茅齋慰逺遊朝雨凉氣暁蕭蕭江雲亂眼飄趙次公曰周庾信詩驚花乱眼飄風鴛藏近渚雨鷰集深條黄綺終辭漢王洙曰見羽翼終辝漢注巢由不見堯王洙曰巢父許由古之隱者列子曰堯以天下譲許由師古曰漢四皓黄公綺里季太子厚幣招之旣定太子位遂辝漢帰啇山詩人多以風雨喻患難上文言鴛藏近渚燕集深條爲避雨也故下文以黄綺辝漢巢由不仕堯朝爲巳喻草堂樽酒在幸得過清朝對雨書懐走邀許主簿東岳雲峯起溶溶滿太虚震雷翻幕燕王洙曰㐮二十九年傳季札曰夫子在此猶燕巢幕上驟雨落河魚王洙曰河一作溪座對賢人酒王洙曰魏志徐邈字景山爲尚書郎時禁酒而邈私飲至於沉醉從事趙逢問以曹事邈曰中聖人逢白之太祖甚怒將軍鮮于輔進曰平日醉客謂酒清者為聖人濁者為賢人邈性修慎偶醉言耳竟坐得免刑門聽長者車王洙曰陳平家廼負郭窮巷以席爲門然門外多長者車轍相邀愧泥濘騎馬到堦除蘇軾曰沈遜見徐陵㑹文士騎馬至堦除下馬坐客与陵皆惡之遜自若良乆揮玉麈髙談清逸闔坐傾伏師古曰東岳㤗山也雲起於㤗山須臾半天下雨遂作長者車詣許主簿白水明府舅宅喜雨得過字吾舅政如此王洙曰喜雨之應禱故美其政古人誰復過碧山晴又濕饒節曰碧山又􅊜言雨不多而於白水縣最為優渥也白水雨偏多精禱旣不昧歡娱將謂何湯年旱頗甚今日醉弦歌王洙曰湯有七年之旱此詩先言精禱不昧即禱而得雨故有醉弦歌之句晨雨小雨晨光内初來葉上聞霧交纔灑地風逆旋隨雲暫起柴荆色輕霑鳥獸羣王洙曰語鳥獸不可與同羣麝香山一半鄭卬曰寰宇記云麝香山在縣南一百一十里亭午未全分王洙曰天台賦羲和亭午趙次公曰雨氣昏之其一半明而一半未分也江閣對雨有懷行營裴二端公南極王洙曰一云南紀風濤壯杜田曰詩曰滔滔江漢南國之紀說者援是詩以江漢爲南紀非也蓋南紀乃分野名唐天文志云是循嶺徼達甌閩中是謂南紀所以限蠻夷也趙次公曰顔延年詩春江壯風濤隂晴屢不分野流行地日江入度山雲層閣慿雷殷長空水面王洙曰一作面水文雨來銅柱北應洗伏波軍王洙曰伏波馬援也甞征武陵蠻立銅柱以勤功趙次公曰銅柱在驩州洗軍字昔武王伐紂大雨太公謂之洗兵雨今因雨自銅柱而來引起馬援則遂有洗伏波軍之句對雨莽莽天涯雨江邊獨立時不愁巴道路趙次公曰指言梓州也自綿而東乃巴矣公於梓州九日寄嚴大夫云無路出巴山恐濕漢旌旗雪嶺防秋急趙次公曰雪嶺在松維州之外即西山也繩橋戰勝遲王洙曰見防秋近赤霄下臨千雪嶺却背五繩橋注趙次公曰以岷江湍急不可爲梁乃竹繩爲橋駕虚而渡西戎甥舅禮王洙曰言父尚公主則子爲甥中國爲舅也未敢背恩私趙次公曰景龍一年以金賊公主妻賛普今公言望其敦甥舅之禮而勿背焉師古曰時回紇恃功欲入宼甫不愁飄濕道路之間恐関中復遭汚辱也故託意言不愁巴道路恐濕漢旌旗胡人秋髙馬肥常入㓂故云防秋雪嶺繩橋皆蜀中蜀人以竹綍爲橋名曰繩橋竹開荒徑拄杖穿花聽馬嘶王洙曰一作鳥啼趙次公曰側聽嚴公之馬嘶也晴乆雨巫山暗新晴錦繡文王洙曰江山晴明風物鮮麗若錦繡也碧知湖外王洙曰一作上草趙次公曰洞庭湖之外遂連青草湖也紅見海東雲趙次公曰言日出之處紅雲也竟日鶯相和摩霄鶴數羣野花乾更落風處急紛紛啼烏爭引子鳴鶴不歸林下食遭泥去髙飛恨乆隂雨聲衝塞盡日氣射江深迴首周南客王洙曰太史公留帶周南驅馳魏闕心王洙曰天子之門兩閣謂之象魏薛夢符曰右按文選謝靈運詩仲連輕齊組子牟眷魏闕注吕氏春秋曰中山公子牟謂詹子曰身在江海之上心居魏闕之下柰何晚晴返照斜初散浮雲薄未歸江虹明逺飲王洙曰楚詞虹霓紛其朝霞兮乆淫淫而霖雨漢燕王旦謀反大虹下于宫中飲井水竭趙次公曰惟近飲所以明見之舊作逺飲非是黄帝占軍訣曰攻成有虹從南方來入飲城中者從虹擊之峽雨落餘飛鳬鶴終髙去王洙曰喻避丗之士能髙舉逺引也羆熊覺自肥王洙曰喻貪暴者賊民以自豐也蘇軾曰秦純詩麒麟鸞鳯何時見豺虎羆熊日覺肥工部當離乱之際託意此詩極工趙次公曰晚晴矣故鴻鴈仍髙飛而去羆熊之覺肥亦以晴而便求食也别無託興秋分客尚在竹露夕微微晚晴村晚驚風度庭幽過雨霑夕陽薫細草王洙曰别賦陌上草薰江色映踈簾書亂誰能帙杯乾自可添蘇軾曰王符好飲閉户獨酌自歡自飲時聞有餘論未怪老夫濳薛夢符曰右按後漢王符著澘夫論雨晴王洙曰一作秋霽天際王洙曰一作外秋雲薄從西萬里風今朝好晴景乆雨不妨農王洙曰以得時也蘇軾曰元符年中雖乆雨不妨農事塞柳王洙曰一作岸行踈翠山梨結小紅胡笳樓上發一鴈入髙空杜修可曰張祐詩萬人齊指處一鴈落寒空同此雨晴雨晴山不改晴罷峽如新王洙曰言隂晴在雨而不在山也天路休殊俗秋江思殺人有猿揮淚盡王洙曰荆州記曰巴東三峽長猿聲中啼至三聲聞者垂淚無犬附書頻王洙曰犬爲陸機送書也趙次公曰陸機有犬曰黄耳在洛中使附書㱕江左也故國愁眉外長歌欲損神蘇軾曰蔡琰曰故國迢逓回首愁眉之外晚晴吴郎見過北舎圃畦新雨潤王洙曰新一作佳媿子廢鉏來竹杖交頭拄趙次公曰費長房投竹杖於葛陂化龍而去柴扉隔徑開蘇軾曰顔延年過陳拱時秋暮拱呼童婦逕開門談論如鮫珠落盤琅琅可愛趙次公曰范彦龍詩有客欵柴扉欲栖羣鳥亂未去小童催明日重陽酒相迎自醱醅王洙曰開酒也鄭卬曰上普活切醱醅酘酒下匹才切未齊酒返照楚王宫北正黄昏白帝城西過雨㾗返照入江翻石壁歸雲擁樹失山村趙次公曰如鮑昭詩霧失交河城衰年肺病唯髙枕絶塞愁時早閉門不可乆留豺虎亂蘇軾曰燕寧與子祝書曰晉地豺虎正亂不可乆留速鞭馬來関中甚佳南方實有未招魂趙次公曰公自言也客於南楚䰟魄飛越實爲未招也舟中夜雪有懷盧十四侍御弟朔風吹桂水大雪夜紛紛暗度南樓月王洙曰謝惠連詩苕亭南樓期寒深北渚雲王洙曰北渚有帝子燭斜初近見舟重竟無聞不識山隂道聽雞更憶君蘇軾曰郭璞寄宋平詩曰夜夢江山逺聞雞更憶君趙次公曰語林曰王子猷居山隂大雪夜開室命酌四望皎然因詠招隱詩忽憶戴安道對雪北雪犯長沙晏殊曰北地多雪長沙南郡偶有此故云云胡雲冷萬家随風且間王洙曰一作開葉趙次公曰當作開言雪隨風灑於葉上而開之也帶雨不成花趙次公曰爲雨所融混而六岀花之狀不明也今丗有鄭獬者詩云雨作雪花開不成盖本於此金錯囊徒罄王洙曰張平子云美人贈我金錯刀趙壹云不如一囊錢杜時可曰此專言錢也漢王莽鑄大錢又造錯刀以金錯其文此錢形之如刀而金錯之之證蘇軾曰种文云共君莫惜醉罄此金錯囊銀壼酒易賖無人竭浮蟻趙次公曰浮蟻酒也祖出釋名曰酒有泛齊浮蟻在上洪炎曰無人竭浮蟻言獨酌遟也有待至昏鵶王洙曰公自注何遜詩城隂度塹黒昏鵶接翅歸杜立之曰昏鵶亦常語何必引遜句後作絶句却云釣艇收緍盡昏鴉接翅稀對雪戰哭多王洙曰哭一作國多一作若新鬼王洙曰見新鬼煩冤舊鬼哭注愁吟獨老翁亂雲低薄暮急雪舞回風王洙曰洛神賦若流風之舞回雪瓢棄樽無緑杜修可曰酒亦曰緑酒沈休文云憂來命緑樽爐存火似紅數州消息斷愁坐正書空王洙曰時方亂離故數州断消息趙次公曰天寳十四載安禄山反今嵗又䧟東宫此之謂消息断也殷浩書空作咄咄怪事又雪南雪不到地王洙曰風土記云南方無雪青崖霑未消趙次公曰當作霑爲正但雪不濃所以不到地而止着青崖耳舊主引南方無雪背違詩意微微向日薄脉脉去人遥冬熱鴛鴦病峽深豺虎驕愁邊有江水焉得北之朝趙次公曰言當愁之際觀江水只是朝東入海安得折入北朝我乗之以歸長安而朝上乎雲雷古詩一首律詩二首雷大旱山岳燋密雲復無雨王洙曰小畜密雲不雨杜修可曰荘子大旱金石流土山焦南方瘴癘地罹此農事苦封内必舞雩峽中喧擊鼓王洙曰周禮司巫若國大旱則率巫而舞雩神農求雨書曰祈而不雨則曝巫曝巫不雨則積薪擊鼓而焚神仙真龍竟寂寞土梗空俯僂王洙曰土梗土龍也葉公好龍而真龍入室吁嗟公私病稅歛缺不補蘇軾曰何儔今兵革不止稅賦尚缺科歛非一家貧無物補助故老仰面啼瘡痍向誰數趙次公曰季布傳瘡痍未瘳暴尫或前聞鄭卬曰暴歩木切尫烏光切鞭巫非稽古杜修可曰禮記穆公召縣子而問焉曰天乆不雨吾欲暴尫而奚若曰天則不雨而暴人疾子虐母乃不可欤或以爲尫非巫也瘠病之人其面上向俗謂天哀其病恐雨入其鼻故爲之旱故僖公欲焚之請先偃甲兵蘇軾曰武王問太公請先偃甲兵乃創天下長乆之基也武王喜之處分聽人主萬邦但各業一物休盡取水旱其數然堯湯免親覩王洙曰堯九年之水湯七年之旱其數然也上天鑠金石蘇軾曰武帝時夏旱張惠歎曰歊陽如是金石銷鑠何况苗稼耶請陛下修政以告上天武帝嘉之遂咸膳祈雨果獲甘澍羣盗亂豺虎王洙曰招魂曰十日並出流金鑠石七哀詩盗賊如豺虎二者存一端愆陽不猶愈王洙曰二者皆有傷於和氣也愆陽伏隂皆能爲変趙次公曰以盗賊與旱爲二也就二者之中言雖愆陽而旱不猶勝於盗賊乎舊注所說非昨宵殷其雷鄭卬曰殷於隱切風過齊萬弩復吹霾翳散虚覺神靈聚氣暍腸胃融汙滋衣裳汚王洙曰一作腐吾衰尤拙計失望築埸圃王洙曰九月築埸圃注春夏爲圃秋冬爲場雷巫峽中宵動滄江十月雷王洙曰陸士衡迅雷中宵激驚電光夜舒龍虵不成蟄王洙曰易龍蛇之蟄以存身也天地劃爭迴鄭卬曰劃呼麥切却碾空山過深蟠絶壁來何湏妬雲雨霹靂楚王臺趙次公曰宋玉髙賦言神女云朝爲行雲暮爲行雨朝朝暮暮陽臺之下而今也雷之不時若妬神女之爲雲雨而霹靂以震之也雲龍以王洙曰一作自瞿唐㑹江依白帝深終年常起峽每夜必通林収穫辭霜渚分明在夕岑髙齋非一處秀氣豁煩襟趙次公曰家家有髙齋可以登覽分門集註杜工部詩卷第一
