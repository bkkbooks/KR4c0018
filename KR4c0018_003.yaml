front:
  text: 分門集注杜工部詩卷第三
  hash: sha256:94c3b26111c575db545a8d014512af918eba0507f31aa2e954d2269edf7d3323
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_003-1a}
body:
  text: 節序千秋節附古詩律詩共五十首太歲日楚岸行將老巫山坐復春洙曰巫山屬夔州楚置巫山郡秦昭三十年伐楚取黔中巫郡是也漢為巫郡今縣北有巫山即楚詞所謂巫山之陽髙山之岨修可曰陸機云吾將老而為客病多猶是客謀拙竟何人洙曰顔延年存沒竟何人炯介在明淑閶闔開黃道洙曰丘希範侍宴樂遊苑詰旦開閶闔馳道聞鳯吹離騷吾令帝閽開關兮倚閶闔而望豫曹植閶闔天衢通前漢遊閶闔觀玉臺天門開軼蕩蕩大人賦排閶闔而入帝居楊炯賦閶闔開兮涼風嫋庾肩吾閶闔九門通衣冠拜紫宸洙曰唐韓皋為中丞常有所陳必於紫宸殿對百寮而請未嘗詣便殿下伯玉中書郎詩大方信包含優渥遂不巳躍鱗龍鳯池揮翰紫宸裏榮光懸日月洙曰中候曰榮光出河汰氣四塞榮光即五色也易繫曰懸象著明莫大乎日月趙曰瞻天顔也天子之答謂之日月之光賜與出金銀洙曰蜀先王傳取蜀城中金銀錢賜將士愁寂鴛行斷洙曰造鴛鷺之行趙曰公嘗為左拾遺今流落於外故云鴛行斷也參差虎穴鄰洙曰班超曰不入虎穴不得虎子劉安招隱士橑兮虎豹穴吳志吕蒙欲從軍母止之蒙曰不探虎穴安得虎子趙曰言在夔州乃與虎狼之穴相近也西江元下蜀趙曰楚人指蜀江為西江以其從西而下也北斗故臨秦修可曰長安上直北斗謂之北斗城言瞻望其所不能故自嘆也散地逾髙枕夢符曰右按王弼明爻通變例曰投戈散地則六親不能相保同舟而濟則胡越何患乎異心趙曰指言居夔州是間散之地也生涯脫要津趙曰古詩先據要路津脫要津則不在鴛鷺之行也天邊梅柳樹相見幾回新蘇曰謝奉容居江表佳門前梅柳幾回見新秋葉故人無音信何也趙曰言夔州去中國逺為天之一邊也公在夔州凡三年矣故云幾回新立春春日春盤細生菜趙曰齊人月令曰凡立春曰食生菜不可過多取迎新之意忽憶兩京梅發時趙曰以紀兩京當立春日巳有菜也盤出髙門行白玉趙曰行白玉盤也應劭漢官儀曰封禪壇有白玉壇菜傳纎手送青絲蘇曰東晉李鄂立春日命蘆蔔芹芽為菜盤饋貺江淮人效之古詩云蘆蔔白玉縷生菜青絲盤豫寓惠州適值春曰書示翟夫子巫峽寒江那對眼杜陵遠客不勝悲趙曰言巫峽傍江也寒那得此菜對服冝乎其悲矣此身未知歸定處呼兒覔紙一題詩元日寄韋氏妹近聞韋氏妹迎在漢鍾離洙曰濠州鍾離縣郎伯殊方鎮京華舊國移趙曰以祿山之亂而奔移也莊子有舊國舊都望之暢然春城回北斗郢樹發南枝洙曰見宿鳥戀本枝注趙曰長安城曰北斗城方春回於北斗之城乃樹木發南枝於郢地之日以紀元日公在長安而妹在鍾離也鄭曰王彥輔云或云郢字誤卬以意考之當作嶺樹故王公注云大庾嶺梅南枝落而北枝開不見朝正使啼痕滿面垂趙曰重紀亂離四方之使隔絶故也元日示宗武人日寄杜二拾遺趙曰適於肅宗時為李輔國毀短下除太子詹事未幾蜀亂出為彭州刺史又遷蜀州髙適作人日題詩寄草堂洙曰草堂公所結於浣花遙憐故人思故鄉柳條弄色不忍見梅花滿枝空斷腸身在南蕃無所預心懷百憂復千慮趙曰南蕃指言蜀州也豈當成都改為南京而蜀在成都之南故云南蕃乎今年人洙曰一作此日空相憶明年人洙曰一作此日知何處一卧東山三十春豈知書劒老風塵龍鍾還忝二千石洙曰任蜀州刺史愧爾東南西北人趙曰適勃海人少落魄客梁宋間所以引宋句之言蓋𥘉以書劒從事而至老却遭風塵雖龍鍾為太守有愧於杜公為東西南北人也孔子曰丘也東西南北之人也則以孔子歷聘比杜公矣追酬故髙蜀州人日見寄并序開文書帙中檢所遺忘因得故髙常侍適往居在成都時髙任蜀州刺史人日相憶見寄詩淚灑行間讀終篇末自枉詩巳十餘年莫記存沒又六七年矣老病懷舊生意可知今海內忘形故人獨漢中王瑀與昭州敬使君超先在愛而不見情見乎辭大曆五年正月二十一日却追酬髙公此作因寄王及敬弟自蒙蜀州人日作不意清詩久零落今晨散帙眼忽開迸淚幽吟事如昨洙曰迸淚言不可制也昨言近如昨日也嗚呼壯士多慷慨合沓髙名動寥廓歎我悽悽求友篇感時鬱鬱匡君略洙曰鬱鬱不伸貌言有匡君之略不得伸也錦里春光空爛熳趙曰謂往居在成都髙任蜀人日相憶見寄所以重歎之瑶墀侍臣巳冥寞洙曰時適巳亡矣趙曰適為刑部侍郎散騎常侍乃天子玉墀之從臣今追言其死而冥寞也瀟湘水國旁黿鼉趙曰公今和此詩乃在潭州故言潭州景也鄠杜秋天失雕鶚蘇曰劉向亡父老歎曰鄠邑杜陵何期風霜失于雕鶚也東西南北更堪論白首扁舟病獨存趙曰以答髙君東西南北之句且言其扁舟在潭也遙拱北辰纒寇盜洙曰北辰象帝居時猶為盜據未獲收復欲傾東海洗乾坤洙曰思滌去昏亂也邊塞西蕃最充斥洙曰西蕃吐蕃也充斥猶縱橫也衣冠南渡多崩奔洙曰南渡避亂也崩奔蒼黃貌趙曰晉元帝渡江而衣冠皆南渡今因惜之鼓瑟至今悲帝子洙曰湘妃堯之女也故曰帝子傳言湘靈鼓瑟也趙曰公在潭州故用潭州事以為悲焉曵裾何處覔王門洙曰鄒陽何王之門不可曵長𥚑此言愛漢中王而不見也文章曹植波瀾闊洙曰曹植陳思王服食劉安德業尊洙曰劉安淮南王與八公著書言服食神仙事也長笛誰能洙曰一云鄰家亂愁思夢符曰右按後漢馬融傳有雒客舍逆旅吹笛融云京師逾年暫聞甚悲而樂之遂作長笛賦昭州詞翰與招魂洙曰昭州敬使君趙曰嵆康序云鄰人有吹笛者發聲寥亮追思曩昔遊宴之好感音而歎故作賦云今公追思髙蜀州而反之師曰自髙寄詩巳十餘年追思之才如昨日言時光奄忽也寥廓指天地間反篇言反報之篇即追酬也鬱鬱言有匡君之略鬱滯而不得伸錦里指蜀瑶墀侍臣謂髙巳亡也甫鄠杜人今寄居湘水傍近黿鼉而不獲髙翔逺舉故云失雕鶚北辰喻帝坐為賊所據故云纏寇盜西蕃充斥言吐蕃縱橫也衣冠指士大夫南渡避亂悲帝子託言公主諸王亂離飄泊故可悲也覔王門託言漢中王瑀乃甫所親愛者不可得見曹植劉安皆宗親以比漢中王昭州指敬超先善為詞翰可為甫招魂也亂離之際精魂奔散欲以詞招之人日兩篇彥輔曰前五後七董勛問禮俗曰正月一日為雞二曰為狗三日為豕四日為羊五日為牛六日為馬七日為人則正旦畫雞於門七日鏤人户上良為此也元日到人日修可曰西清詩話云都人劉克窮該典籍嘗與客論云元日至人日未有不隂時人知其一不知其二四百年惟子美與克會耳起就架取書與客曰此東方朔占書也歲後八日一日為雞二日為犬三日為豕四日為羊五日為牛六日為馬七日為人八日為穀其日晴主所生之物育隂則災少陵意謂天寶離亂四方雲擾幅裂人物歲歲俱災此春秋豈書王正月意耶深得古人用心未有不隂時冰雪鶯難至春寒花較遲雲隨白水落風振紫山悲蓬鬢稀踈少無勞比素絲蘇曰柳博蓬首愁搔首稀踈之甚羞比素絲此日此時人共得一談一笑俗相看蘇曰王遇元語弟曰一談一笑丗俗酒炙之歡豈識文字真樂耶余元日在善化因書此詩二萹與楊太守樽前柏葉休隨酒洙曰見元日示宗武注趙曰四民月令曰元日進椒柏酒勝裏金花巧耐寒洙曰人日造華勝相遺起於晉代見賈充李夫人曲云像瑞圖金勝之形又像西王母戴勝也嵗時記人日以七種菜為羹剪綵為花勝以相遺或縷金薄為人勝以像瑞圖之形佩劒衝星聊暫拔洙曰晉輿服志漢自天子至百官無不偑劒其後唯朝帶晉書斗牛之間有紫氣雷煥曰寶劒之精上徹於天匣琴流水自須彈洙曰琴有三峽流泉操趙曰伯牙志在流水而鍾子期曰湯湯哉舊注所引却是流泉操也早春重引江湖興直道無憂行路難趙曰行路難古曲名言以直道行之無他而不可往也社日兩篇九農成德業洙曰少皥氏以九扈為九農正百祀發光輝洙曰共工氏有子曰勾龍能平水士故祀以為社左傳盛德者必百丗祀報效神如在洙曰謂祭神如神在馨香舊不違洙曰左傳所謂馨香無讒慝也南翁巴曲醉蘇曰晉初南隱者自號南翁人莫知來歷因社日至衆會上願聽巴歌乞此一日醉趙曰公自言也其在夔州得稱南翁北鴈塞聲微趙曰秋時鴈北向矣尚想東方朔恢諧割肉歸洙曰東方朔傳伏日詔賜從官肉太官丞日晏不來朔獨拔劒割肉謂其同官曰社日當蚤歸請受賜即懷肉去太官奏之詔朔自責朔曰拔劒割肉一何壯也割之不多又何廉也歸遺細君又何仁也蘇曰此社日詩所載乃是伏日或云誤使事或云大手筆寓意而巳鮑曰按十二諸侯年表秦德公二年初作伏祠社磔狗四門則祠社用伏日此詩用伏曰事何疑陳平亦分肉太史竟論功洙曰陳平傳里中社平為宰分肉甚均里父老曰善陳孺子之為宰平曰嗟乎使平得宰天下亦如此肉矣今日江南老他時渭北洙曰一作水童洙曰公生於渭北老於江南歡娛看絶塞涕淚落秋風趙曰公言流落於此故涕淚在秋風之中落也鴛鷺回金闕洙曰鴛鷺公卿也趙曰金闕天子之闕言貴人之自金闕回者誰念我也誰憐病峽中洙曰公自傷也熟食日示宗文宗武洙曰熟食日即寒節也秦人呼寒食為熟食日言其不動煙火預辦熟食物過節也齊人呼為冷節又云禁煙消渴遊江漢趙曰自志其病也羈栖尚甲兵幾年逢熟食趙曰寒食日更不舉火而冷食其物故謂之寒食亦謂之熟食萬里逼清明松柏卭山路風花白帝城田曰十道志曰卭山在路湯縣北俗以寒食省墳子美先塋在邛而其身流寓白帝於寒食不能展省故有此句鄭曰寰宇志卭州因卭來山為名水經注卭來山在漁嘉嚴道縣汝曹催我老回首淚縱橫又示兩兒令節成吾老他時見汝心趙曰令節指寒食也以汝年少未知老者之清他日汝輩老年方見其心如我之今日矣浮生看物變為恨與年深長葛書難得鄭曰春秋時鄭地今縣隸許州江州涕不禁鄭曰居吟切團圎思弟妹蘇曰季湛中秋日登仲宣樓拊欄自語登樓似有弔古之恨更值團圎忍不思弟妹共觀耶趙曰長葛江州必其弟妹所在行坐白頭吟趙曰卓文君作白頭吟諷相如詳見上注小寒食舟中作佳辰強飲食猶寒趙曰其猶食是寒物此為小寒食言之也隱鄭曰於靳切几蕭條帶鶡冠洙曰漢輿服志號賁武騎皆鶡冠南郭子綦隱几卧鄭曰鶡何葛切鳥以雞鬪必至死故勇士為冠趙曰鶡冠者隱人之冠也袁淑真隱傳鶡冠子舊注引虎賁武騎之冠誤矣春水船如天上坐趙曰魯直言前人詩有水面船如天上坐杜公改一春字而精神炯然可謂點鐵成金余曰邵氏聞見録云少陵比句本沈雲卿船如天上坐人似鏡中行船如天上去魚似鏡中懸也或以此論少陵之妙豫謂少陵所以獨立千載之上者不但有所本也三百篇之作果何本哉老年花似霧中看尹曰張歜至秦嘆曰老年看花眼眩如隔霧榖誰於燭下數牛毛也姢姢戲蝶過間幔片片輕鷗下急湍雲白山青萬餘里看雲直北至長安洙曰鮑明逺灞陵望長安河陽視京縣徐敬業登陴起遐目回首見長安王粲南登灞陵岸回首望長安蘇曰何遜古道難云直北長安道愁看别離人寒食寒食江村路洙曰一作樹風花髙下飛汀煙輕冉冉竹日淨暉暉由父洙曰一作舍要皆去趙曰要平聲言有招要則皆去也鄰家閙洙曰一作問不違洙曰别本作間不違諸家本注云子美父諱間集中不用間字後有北斗殷同蘇曰董寧淳至每有偕問不違人意甚喜得良鄰趙曰當作問言鄰家之問亦不違而受之師曰甫既卜居浣花溪上日與田父野老相狎蕩故有田父要皆去鄰家問不違之語不違者不逆其情問乃問遺也地偏相識盡雞犬亦忘歸洙曰一作機趙曰陶淵明所謂心逺地自偏也清明著處繁花矜是洙曰又云務足日長沙千人萬人出渡頭翠柳豔明眉爭道朱蹄驕囓膝洙曰朱逹平善相馬魏文將出取馬入逹平曰此馬今日死矣及將乘馬惡香囓帝膝帝怒遣使殺之趙曰以朱飾其蹄耳舊注引魏文將乘馬惡香囓帝膝帝怒殺之非是蓋惡香馬性偶如此耳若盡皆然豈不傷人乎公蓋使王褒聖主得賢臣頌曰駕囓膝驂乘旦張晏注曰皆良馬名此都好遊湘西寺諸將亦自軍中至馬援征行在眼前洙曰伏波將軍馬援征交址女子徴側復又繫武陵五溪蠻夷葛強親近同心事洙曰葛強山簡愛將也金鐙下山紅粉洙曰一作日晚牙檣捩柂青樓遠夢符曰古按廣韻鐙與燈同又魏鯨魚燈賦寫載其形記于金燈又郭景純江賦舳艫相屬萬里連檣埤蒼曰檣帆柱也又司馬相如子虛賦浮文鷁揚旌枻張揖曰枻柂也古樂府劉生詩座驚稱字孟豪雄道姓劉廣陌通朱邸大路起青樓又張正見採桑詩倡妾不勝愁結束下青樓又古曲青樓臨大道遊俠盡淹留趙曰捩柂轉船也青樓則所袚禊之處岸上有之也出古樂府劉生詩大路起青樓紅粉義非當作紅日古時喪亂皆可知人丗悲歡暫相遣弟姪雖存不得書干戈未息苦離居逢迎少壯非吾道况乃今朝更袚除洙曰袚除上巳也束晳曰周公城洛邑因流水以泛觴後人相緣因為盛集趙曰周禮女巫掌嵗時袚除舋浴鄭注如今三月三日上巳往水上之類唐氣朔大曆五年三月三曰清明以清明值上巳則祓除之義尤明師曰務足誇多也所謂鬪草者正此意也馬援以比衡州刺史也葛強乃山簡愛將以比刺史之部將也古樂府劉生詩座驚稱字孟豪雄道姓劉廣陌稱朱邸大路起青樓又張正見採桑詩倡妾不勝愁結束下青樓柂所以正船搖柂曰捩檣尾鋭如牙故曰牙檣苦難居謂無定居也甫老大工謁侯門俯仰於人非其本性故曰逢迎少壯非吾道清明二首朝來新火起新煙洙曰周禮司烜氏仲春以木鐸修火禁於國中注謂季春將出火也故子美引新火而用也趙曰唐制清明曰賜百官新火賈島詩曰晴風吹柳絮新火起厨煙湖色春光淨客船繡羽衝花他自得洙曰射雉賦有綺翼縭頭衮背紅顔騎竹我無緣洙曰郭汲傳小兒騎竹馬趙曰繡羽者眼前所見文禽也銜花亦是禽之實事也鳥銜花而自得人之不如也紅顔者少年之顔稚子騎馬之戲我不復然則老者之弗如也胡童結束還難有楚女腰支亦可憐不見定王城舊處洙曰長沙定王鄭曰寰宇記潭州長沙縣定王廟在縣東一里廟連岡髙七丈俗謂之定王岡長懷賈傅井依然洙曰今長沙賈太傅誼廟有井存焉韓愈井詩亦云賈誼宅中今始見葛洪墓上亦曽窺修可曰盛弘之荆州記曰湘州南寺之陳賈誼宅有井小而深上斂下大狀似壺即誼所穿井誼宅今為陶侃廟種柑猶有存者庾穆之湘州記同此趙曰定王則長沙定王賈傅賈誼也鄭曰寰宇記誼廟在長沙縣南六十里廟即誼宅中有井上圎下方虛霑焦舉為寒食洙曰事見桓談新論及汝南先賢傳也後漢焦舉博學遷并州刺史太原一郡舊俗以介子推焚骸有龍忌之禁至其亡月咸言神靈禁舉火由是士民每冬中徹一月寒食莫敢煙爨老小不堪歲多死者舉既到州乃作弔書以置子推之廟言盛冬去火殘損民命非賢者之意以宣示愚民使還預溫食由是衆惑稍解風俗頗革新序曰晉文公反國介子推無爵遂去而之綿上文公求之不得乃焚其山推遂不出而死事具在耿恭傳龍星木之位也春見東方心為大火之盛故謂之焚火俗傳云子推此日被焚而禁火也實藉嚴君賣卜錢洙曰見上慿傳百錢卜注鍾鼎山林各天性濁醪粗飯任吾年夢符曰右按酒經曰醪汁宰酒也丗本曰儀狄始作酒醪變五味蘇曰梁協告友人曰五斗粟非所欲也洛中有薄田數畒桑柘𬞞園又數畒老夫率兒女輩操耒耜紝織與鄰里往來濁醪粗飯任此天年庶免風波歧路易翻覆耳趙曰擊鍾而食列鼎而烹冨貴人之事也山林則隱逸之人雖處貧賤而甘之則與好冨貴者各天性耳既無盛饌姑且濁醪粗飯而巳此身飄泊苦西東右臂偏枯半耳聾趙曰出素問黃帝之言風曰或為偏枯寂寂繫舟雙下淚洙曰賈誼傳不繫之舟悠悠伏枕左書空洙曰見上稽留伏枕辰及咄咄正書空注師曰右臂既偏枯書空者唯左而巳十年蹴踘將雛逺洙曰劉向别録蹴踘黃帝所造本兵勢也或云起於戰國按踘與毬同古人蹴踘以為戲趙曰成公綏繡賦以鴻鴈之將雛師曰十年蹴踘言軍興也將雛遠謂挈子逺遊萬里鞦韆習俗同洙曰古今藝術曰鞦韆北方戲以習輕矯趙曰言去即之遠也旅鴈上雲歸紫塞洙曰蕪城賦北走紫塞鴈門孝祥曰崔豹古今注秦所築長城土皆紫色漢塞亦然故稱紫塞子美宫池春鴈詩又有青春欲盡急還鄉紫塞寧論上有霜之句家人鑽火用青楓洙曰鑽燧改火春取榆柳之火以順陽行火氣秦城樓閣煙洙曰一作鶯花裏漢主山河錦繡中風水春來洞庭闊白蘋愁殺白頭翁洙曰風水一作春去趙田四句懷長安而嘆其在湘潭也哀江頭少陵野老吞聲哭洙曰野老甫自稱少陵杜陵也春日潛行曲江曲師曰西京雜記京城龍華寺南有流水屈曲謂之曲江在秦時為冝春苑漢時為樂遊苑玄宗開元中鑿池引水環植花木為京師勝賞之地遭祿山焚劫之後荒涼可知也江頭宮殿鎖千門細柳新蒲為誰緑洙曰康駢劇談録曰曲江池本秦隑州開元中疏鑿為妙境花卉周環煙木明媚都人遊玩盛於中和節江側菰蒲蔥翠柳隂四合碧波紅蕖湛然可愛唐書鄭注傳大和九年注言秦中有災冝興力役以禳之文宗因吟杜甫詩云江頭宫殿鎖千門細柳新蒲為誰緑始知天寶四年曲江四面多樓臺行宫乃敕公卿之家住於曲江昆明二池起造亭觀詔神䇿兩軍造紫雲樓綵霞亭內出牌以賜之西京雜記云朱雀街東第五街皇城之東第三街升道坊龍華尼寺南有流水屈曲謂之曲江司馬相如弔秦二丗文云臨曲江之隑州蓋其所也關中記云宣帝立廟曲江之北名曰樂遊廟因苑為名即今升平坊內餘址是也此地在秦為冝春苑也在漢為樂遊苑也憶昔霓旌下南苑洙曰宋玉髙堂賦霓為旌唐曲池坊南有南宫苑中萬物生顔色昭陽殿裏第一人鄭曰昭陽漢殿名同輦隨君侍君側洙曰李白詩云漢宫誰第一飛燕在昭陽謂楊妃也漢成帝趙皇后傳飛燕召入宫大幸有女弟子復召入俱為婕妤貴傾後宫乃立婕妤為皇后既立后寵少衰而弟絶幸為昭儀居昭陽舍其中庭彤朱而殿上髹􅃮自後宫未嘗有焉姊弟專寵十餘年于寶注周禮云對輿曰輦輦前才洙曰一作詞人帶弓箭蘇曰晉宣帝出獵長春苑輦前才人皆乘寶馬帶畫弓白羽箭白馬嚼洙曰一作噍囓黃金勒洙曰唐制內官才人七人正四品翻身向天仰射雲鄭曰射食亦切一箭洙曰一作笑正墜雙飛翼洙曰西都賦招白鷴下雙鵠又矢不單殺中必疊雙趙曰按明皇雜録上幸華清宫貴妃姊妹名購名馬以黃金為銜勒明眸皓齒今何在朱曰曹子建皓齒內鮮明眸善盻傳武仲舞賦眄盤旋則騰清眸吐哇咬則發皓齒枚乘七發皓齒蛾眉命曰伐性之斧血汚遊魂歸不得蘇曰北齊初大戰纍年不解王襄曰吾親知言為遊魂歸故山不得唐曰申屠嘉曰臣以血汚車輪陛下不得入廟矣趙曰公此詩作於至德二載之春血汚遊魂則天寶十五載六月丁酉上皇車駕次馬嵬賜貴妃自盡淸渭東流劒閣深去住彼此無消息洙曰時明皇幸蜀貴妃誅人生有情淚沾臆江水洙曰一作草江花豈終極黃昏胡騎塵滿城欲往城南忘南北洙曰一云望城比正敏曰荆公集句云欲往城南望城北此心炯炯君應識又云欲往城南望城北三步回頭五步顧始疑杜詩誤後得荆公善本皆作忘南北或云公故改此二字以合己意然公平生未嘗改古人字觀者冝詳此黃曰甫朝哀江頭暮又聞史思明連結吐蕃入寇欲往城南省家倉皇之際心曲錯亂忘南而走北也甫家居城南麗人行曹子建洛神賦云覩一麗人于巖之畔劉向别録有麗人歌賦梁簡文帝筝賦命麗人於玉席三月三日天氣新洙曰續齊諧記曰晉武帝問尚書郎虞摯曰三日曲水其義何指答曰漢章帝時平原徐肇以三月𥘉生三女至三日俱亡一村以為怪乃招携之水濵盥洗遂因水以泛觴曲水之義起於此帝曰若如所談便非佳事尚書郎束晢曰仲治小生不足以知此臣請説其始昔周公城洛邑因流水以泛酒故逸詩云羽觴隨波又秦昭王三日置酒河曲見有金人出捧水心劒曰今君制有西夏及秦霸諸侯乃因此處立為曲水祠二漢相緣皆為盛集帝曰善賜金五十斤左遷仲治為陽城令趙曰晉宋諸人侍宴曲水皆以三月三日為題唐開元中都人遊賞於曲江莫盛於中和上巳節此三月三日所以水邊多麗人也舊注所引事為泛矣王石軍蘭亭曲水序曰天朗氣清惠風和暢此亦天氣清之謂秦曰詩云方秉蕳兮則知禊遊之事巳起於昭王之前長安水邊多麗人洙曰羅敷豔歌曰髙臺多姝麗鄭曰長安古雍州地漢始都此梅曰鮑昭蕪城賦曰東都妙姬南國麗人態濃意逺淑且真蘇曰太一仙妃態濃意逺乘風馭氣來往四方肌理細膩骨肉勻定功曰此曲盡麗人之容好矣宋玉九辨有靡顔膩理東京賦有擘肌分理徐俯曰本草經注曰肌理形色云繡洙曰一作畫羅衣裳照暮春洙曰晉張華三月三日後園會詩曰暮春元曰王羲之蘭亭詩序暮春之初會稽山隂之蘭亭古詩𬒳服羅衣裳南都賦暮春之褉元巳之辰男女姣服絡繹􅌭紛夏倪曰古詩曰𬒳服羅衣裳江淹别賦羅與綺兮嬌上春蹙金孔雀銀麒麟泰伯曰蹙金今之撚金也頭上何所有翠微㔩葉垂鬢脣洙曰微一作為㔩一作匌鄭曰㔩烏合切㔩彩婦人髻飾花也師曰翠微㔩葉謂鬢邊花以翠手鋪飾其狀輕微也背後何所見珠壓腰衱穩稱身鄭曰衱居怯切鄭玄云交領又其輒切稱昌孕切冝也修可曰爾雅曰極謂之𥚑郭璞云衣後𥚑一本㔩作匌衱作𬒳非也師曰腰衱即今之裙帶綴珠其上壓而不垂自此以上皆鋪敘麗人顔貌衣裳服飾之盛就中雲幕椒房親洙曰班固西都賦云後宫則掖庭椒房后妃之室漢官儀曰皇后稱椒房取其蕃實之義也詩云椒聊之實蕃衍盈升又以椒塗宫室亦取其溫暖辟除惡氣猶天子朱泥殿上曰丹墀也師古曰椒房在未央宫吳樹謂梁兾曰將軍以椒房之重西都記成帝設雲幄雲幕於甘泉紫殿丗謂三雲殿第五倫傳竇憲椒房之親曹子建美女篇頭上金雀叉腰佩翠琅玕此指言貴妃兄弟驕盛師曰幕即設幕次如雲霧之垂故曰雲幕賜名大國􅉑與秦洙曰唐后妃傳玄宗楊貴妃有姊三人皆有才貌玄宗並封國夫人之號長曰大姨封􅉑國八姨封秦國並承恩出入宫掖勢傾天下歲給錢千貫為脂粉之費趙曰秦􅉑乃玉真之姊妹故曰雲幕椒房親也以長安志考之􅉑國乃八姨秦國乃大姨並承恩出入宫掖勢傾天下舊注以中姨封􅉑八姨封秦非是紫駝之峯出翠釡洙曰峯一作珍漢書大月氏本行國出一封槖駝注脊上有一封髙也如封士然今俗呼為犎音峯胸奴傳師古注槖駝言能負槖囊而馱物蒼舒曰校酉陽雜俎將軍曲良翰作駝峯炙趙曰此言食之美甚也酉陽雜俎載食饌之美有將軍曲良翰作駝峯炙正以駝背一肉如峯最美水精之盤行素鱗蘇曰漢獻帝水精盤盛鮮鱠賜近臣彥輔曰貞觀中許栖巖遊洞口賦詩曰不假舟梯躡霄漢水精盤冷桂花秋晉王􅘙笙賦舞靈蛟之素鱗犀筯厭飫久未下洙曰晉何曽曰食萬錢猶云無下筯處徐君平曰酉陽雜爼云安祿山恩寵莫比其所賜有金平脫犀頭匙筯鑾刀縷切空洙曰一作坐紛綸洙曰詩信南山執其鑾刀以啓其毛注鑾刀力有鑾者言割中節也潘安仁西征賦饔人縷切鑾刀若飛應刃落爼靃靃霏霏紅鮮紛其初載師曰縷切言切膾如絲縷之細黃門飛鞚不動塵鄭曰鞚口送切馬勒也洙曰前漢西域傳蒲梢龍文魚目汗血之馬充於黃門凡號黃門以其給事於黃闈之內秦漢皆有黃門侍郎按外傳􅉑國出入皆乘駿馬使小黃門為御夢符曰右按文選鮑明遠擬古詩獸肥春草短飛鞚越平陸師曰飛鞚言鞚勒其馬疾若飛御厨絲絡送八珍洙曰絲絡一作絡驛周禮膳夫珍用八物注珍用淳熬淳母炮豚炮牂搗珍漬熬肝膋也又食醫掌八珍之齊鮑明逺詩八珍盈雕俎夢符曰右按尚膳貴嚴故以絲絡護衛之絲絡如綺疏也杜子美稱此以見寵豫之隆駱驛為不足道往在詩云赤墀櫻桃枝隱映銀絲寵師曰絲絡者謂天子遣使送御厨食相繼如繹絲不絶上文言不動塵乃知慎護天子所賜不敢有所動搖也簫鼓洙曰一作管哀吟感鬼神洙曰鼓一作管漢武秋風辭簫歌鳴兮發棹歌詩序動天地感鬼神莫近於詩賔從雜遝實要津鄭曰從才用切隨行也洙曰魏文帝與吳質書云輿輪徐動賔從無聲劉向傳雜還衆賢師古曰雜遝聚積之貌遝徒合反古詩曰先據要路津趙曰此譏其男女之糅雜也後來鞍馬何逡巡余曰賈誼過秦論九國之師遁巡而不敢進顔師古曰遁巡謂疑出而郤退也遁千旬反當軒下馬入錦茵洙曰軒一作道鮑明逺詠史詩賔御紛颯沓鞍馬光照地趙曰當軒下馬言其氣勢洋洋旁若無人也徐排贈內詩忽有當軒樹彥輔曰山巨源詠扇詩舒心謝錦茵師曰錦茵謂地鋪錦縟也楊花雪落覆白蘋青鳥飛去銜紅巾洙曰山海經曰三危之山有青鳥居之注青鳥主為西王母取食者引自棲息於此山也紀年曰穆王十三年西征子青鳥之所憩漢武故事曰七月七日上於冰華殿齋坐中忽有一鳥從西方來集殿前上問東方朔朔曰此西王母欲來也有頃王母至有二青鳥如烏挾侍王母旁江淹詩青鳥海上遊沈約銜書必青鳥趙曰青鳥應如鸚鵡之類豢飬馴熟飛銜紅巾此止借西王母以青鳥為使名之紅巾蓋婦人之飾如王勃落花篇云羅𬒮紅巾往復還炙手可熱勢洙曰一作正絶倫愼莫近前丞相嗔洙曰勢一作丗近一作向元載時委左右人四人用事權傾中外人為之語曰炙手可熱卓李鄭薛言勢熖燻灼可以炙手也帝題之御屏以示時相按新唐書楊貴妃智算警頴迎意輒悟帝大恱遂專房兄銛錡國忠最見寵遇三姊皆美劭封韓􅉑秦三國恩寵聲熖震天下每命婦入班雖公主亦不敢就位臺省州縣奉請託奔走期會過詔勑四方獻餉結納門若市然第舍聮亘謂之五家分賜珍竒使者不絶於道時國忠代李林甫為相領四十餘使性豪説捷給硜硜處決樞務自任不疑盛氣驕愎百僚莫敢相可否官屬悉苛督句剝相其心文便佞專徇帝嗜欲不顧天下成敗安祿山嘗奏上國忠大罪二十而國忠亦發祿山反狀故祿山之反以誅國忠為名後從帝幸蜀貴妃縊于馬嵬國忠亦為亂兵所殺爭噉其肉且盡諸子及羣妹盡死修可曰唐史遺安樂公主玄宗之季妹附會韋氏熱可炙手人咸畏之李彭曰炙手可熱言門第炎炎也趙曰炙手可熱言勢熖之薰灼也舊注引代宗時元載用事權傾中外此事在杜公之後非是丞相嗔指言國忠而公詩句則後漢桓帝時童謡云梁下有懸鼓我欲擊之丞卿怒之勢也觀國忠本傳國忠盛氣驕愎百僚莫敢相可否而公之詩直鋪敘二國衣服飲食之盛聲樂賔從之樂而終篇直指丞相之薰灼則公之不畏強禦可見矣師曰甫有炙手可熱慎莫見嗔於丞相之句所以戒當丗之士大夫無為譏切其黨以取禍害觀詩以碩人美莊薑與申后蓋取其碩美之德今此詩以麗人名篇豈非刺貴妃之黨徒以艷麗之色寵貴乎杜甫深意於兹可見曲江二首一片花飛減却春蘇曰丘豫見庭中花落謂友人曰飛此一片減却青春色不趂行樂復待何時耶風飄萬點正愁人趙曰秦少遊有云落紅萬點愁如海正使此也且看欲盡花經眼莫厭傷多酒入唇江上小堂巢翡翠蘇曰朱丘蒙為南陽守政善廉愛有翡翠巢于堂庾信詩翡翠本微物知愛巢髙堂花洙曰一作苑邊髙冢卧麒麟趙曰冢前有石麒麟蓋冨貴之家西京雜記云是秦始皇驪山墓上有此物也今詩言卧則冢之荒廢矣故公落句有感焉細推物理須行樂何用浮洙曰一作榮名絆此身余曰絆音半馬縶也洙曰西京雜記五柞宫西有青梧觀柏樹下有石麒麟二枚其身各刋其脅為文字是秦皇驪山墓上物也頭髙一丈五尺左腳折師曰曲江舊時風景頗佳麗為京城勝遊自祿山焚蕩之後無復向時奢華是以堂巢翡翠冢卧麒麟一盛一衰其理不常觀此理則人生不可不行樂矣朝回日日典春衣趙曰王元長古意思淚點春衣每日江頭盡醉歸洙曰陳遵日出醉歸酒債尋常行處有洙曰孫濟權之叔也嗜酒不治産業善嘯日常醉欠人酒緍人皆笑之齊怡然自若謂人曰尋常行坐處欠人酒債欲貨此緼𫀆償之古詩云典盡春衣無可奈尋常行處欠人錢人生七十古來稀洙曰古詩人生不滿百常懷千歲憂晝短苦夜長何不秉燭遊穿花蛺蝶深深見洙曰一作舞點水蜻蜓𣢾𣢾飛洙曰一作緩緩趙曰司馬遷云效其欵欵之愚傳語風光共流轉暫時相賞莫相違趙曰馬小憐春日詩傳語春光道先歸何處邊公參用之焉言相與賞玩莫相違戾此豈語同舍郎乎曲江對酒苑外江頭坐不歸趙曰苑外者芙蓉苑之外也曲江在苑北文宗嘗謂公詩曰江頭宫殿鎖千門思復升平事水精春洙曰一作宫殿轉霏微趙曰宫謂之水精宫今以水精言春殿蓋狀其清幽也桃花細逐楊花落洙曰一云桃花欲共梨花語黃鳥時洙曰一作仍兼白鳥飛蘇曰古倚欄曲云紅雨亂和春雨落白鳥時兼黃鳥飛工部用語有躰法復用古人語者以為龜鑑縱飲久判人共棄鄭曰判普官切正作拚棄懶朝真與丗相違吏洙曰一作含情更覺滄洲逺老大悲傷未拂衣洙曰謝玄暉復叶滄洲趣古樂府老大徒悲傷蘇曰匡雲年未老大日轉悲傷流離洛陽未遂拂衣之志師曰縱飲久判人共棄甫性放誕與丗相忤為人所棄故縱飲懶朝無復顧惜蓋任真如此然為薄宦所繫不遂滄洲之期至於老大悲傷不能拂衣而去也滄洲神仙之境曲江對雨城上春雲覆苑牆趙曰言芙蓉苑之牆也江亭晚色靜年洙曰一作天芳魯曰沈休文二月三曰詩年芳俱在斯林花著雨燕脂洙曰一作支落水荇牽風翠帶長洙曰荇水草也相連而生故如翠帶龍武新軍深駐輦洙曰開元二十六年析左右羽林軍置左右龍武軍以左右萬騎營隸焉芙蓉别殿謾焚香洙曰芙蓉城連曲江趙曰言駕深駐曲江不復幸芙蓉苑則别殿焚香為謾耳何時詔洙曰一作重此金錢會蘇曰開元别記明皇與妃子在花蕚樓下以金錢逺近為限賽其元擲于地者以金觥為賞今里巷皆效之諺曰卓親趙曰劇談録載開元中都人遊賞曲江盛于中和上巳節即賜宴臣僚會于山亭賜太常教方樂推此則所謂金錢會者賜金錢為宴也暫洙曰一作爛醉佳人錦瑟旁薛曰右按李啇隱詩有錦瑟篇其詞曰錦瑟無端五十弦一弦一柱思華年或云是美人名趙曰醉佳人傍者賜太常教坊樂也樂器則自有錦瑟者寶瑟瑶瑟之謂也彥輔曰崔灝少年行曰可憐錦瑟箏琵琶玉堂清酒就君家師曰唐舊史百官志左右龍武軍注太宗選飛騎之尤驍健者别署百騎以為翊衛之備武后加置千騎中宗加置万騎分為左右營自開元以來與左右羽林軍名曰北門四軍開元二十四年改為左右龍武軍按名諱莊改莊周為嚴周漢安帝父諱慶改慶氏為賀氏隋書易虎為武以唐始祖諱虎稱琥珀為武珀白虎為白武之類龍武軍本龍虎軍蓋避唐諱也開元天寶遺事云內庭嬪妃每至春時各於禁中結伴擲金錢為戲又酉陽雜爼梁時荆州掾為雙陸賭金錢花相足魚弘謂得花勝得錢時新收京宫殿焚蕩故駐輦于此回想舊時焚香於芙蓉殿安可得哉故末句有何時詔此金錢會錦瑟言瑟彩繪其文如錦曲江陪鄭八丈南史飲雀啄江頭黃柳花鵁鶄鸂鷘滿晴沙自知白髮非春事洙曰歸去來賦云農人告豫以春將有事于西疇趙曰春事嬉遊賞玩皆年少之所冝故白髮則非春事矣舊注引歸去來有事于西疇非是且盡芳樽戀物華近侍即今難浪迹魯曰近侍謂為拾遺此身那得更無家趙曰公平昔放浪今為近侍故難浪迹也前此一身轉從賊中寄家鄜州當有詩云無家對寒食今既復聚故喜而云云丈人文力猶強健豈傍青門學種瓜洙曰邵平種瓜青門號邵平瓜師曰青門長安城東門末章勉鄭八出仕未可遽隱上巳日徐司録林園宴集鬢毛垂領白洙曰潘安仁秋興賦班鬢彪以承辨素髮颯以垂領花蘂亞枝紅欹倒衰年廢招尋令節同薄衣臨積水吹面受和風有喜留攀桂洙曰劉安招隱士云攀援桂枝聊淹留無勞問轉蓬洙曰曹植詩轉蓬離本根袁陽源詩乃知古人所以悲轉蓬端午日賜衣宫衣亦有名師曰受之當有名也則賜之也豈可無名乎賜之無名是濫賞也端午𬒳恩榮細葛含風軟香羅疊雪輕自天題處濕師曰自天謂賜從天子當暑著來清意內稱長短洙曰一云拾稱身長短終身荷聖情洙曰一作明趙曰蓋言天子之意內又稱量羣臣身材長短而賜之此所以荷聖情也師曰言長短皆稱意足見君恩之重牽牛織女牽牛出河西織女處其東洙曰牽牛織女皆星名也蘇曰焦林天斗記云天河之西有星煌煌與參俱出謂之牽牛天河之東有星微微在氐之下曰織女萬古永相望鄭曰武方切七夕誰見同神光意洙曰一作竟難候此事終蒙朧颯然精靈合蘇曰東海記神龍交即風濤颯然精靈符合水為之軍何必秋遂通洙曰周處風土記七月七日其夜灑掃於庭露施几筵設酒脯時果散香粉於河鼓織女言此二星神當會少年夜者感懷私願或云見天漢中有奕奕正白氣有光曜五色以此為徴見者便拜而乞願乞冨壽又無子乞子唯得乞一不得兼求三年乃言之亭亭新粧立龍駕具曽空修可曰南齊謝眺七夕賦云回龍駕之容裔言織女之渡河也丗人亦為爾祈請走兒童稱家隨豐儉鄭曰稱昌孕反白屋逹公宮趙曰白屋貧人之屋如周公下白屋之士公宫公侯之家也出左傳有守於公宫鄭曰白屋草舍也以白茅茨覆故云膳夫翊堂殿鳴玉淒房櫳鄭曰盧紅切曝衣遍天下洙曰竹林七賢傳舊俗以七月七日曝衣時南阮冨所曝皆錦繡北阮貧乃立長竿標大布犢鼻於庭中曰未能免俗北阮阮咸也曵月揚微風蛛絲小人態曲綴洙曰一作掇瓜果中洙曰荆楚嵗時記曰七夕婦人結綵樓穿七孔針於中庭以乞巧有喜子網於瓜上則以為得巧初筵浥重露鄭曰浥乙業切潤也日出甘所終嗟汝未嫁女秉心鬱忡忡防身動如律竭力機杼中蘇曰姚萇婦女精力竭於機杼尚不能支持西比之費倉庫曰耗減矣雖無舅姑事敢昧織作功明明君臣契咫尺或未容義無棄禮法恩始夫婦恭小大有佳期戒之在至公趙曰公以君臣比夫婦之義也君臣相契於咫尺之間臣苟有虧君或不容之矣為婦者可不慎乎蓋因織女每嵗有期為不可亂則為人女為人婦者當慎守至公之戒也方圎苟齟齬鄭曰上壯所下偶許切不相值也丈夫多英雄洙曰一云勿替丈夫雄夢符曰右按楚詞九辨云圎鑿而方枘兮吾固知其齟齬而難入趙曰凡相背戾則圎鑿而方枘矣婦人女子一有齟齬為丈夫者豈能容之此人之常情也孔文舉論盛孝章書曰孝章實丈夫之雄也師曰詳味此詩託意牛女東西間隔必無私合之期孟子云男子生而願為之有室女子生而願為之有家此人之至情也雖然不待父母之命媒妁之言鑽穴隙相窺踰牆相從則父母國人皆賤之臣之事君苟不以其道而進何異於踰牆相從乎詩二之日鑿氷沖沖又士如歸妻逮冰未泮桃華於仲春以記昏姻之時未嫁之女秉心於鑿冰沖沖之月以禮防間如法律然竭力機杼無故不出外閫豈有私相會合耶譬如君臣相去咫尺非其義則不相從契合必以道也况夫婦之間其可棄禮法為私會哉始或不恭終則乖睽故云恩始夫婦恭然小大各有期會要在至公無私邪也丈夫英雄之氣苟非君臣道合殆若方鑿貟枘了不相入况牛女之東西乎是以甫云神光意難候此事終蒙朧曽空天有九重也祈請走兒童謂乞巧也自小民上至公宫隨家豐儉設果饌以祀之鳴玉凄房櫳外則膳夫翊敬於堂殿內則婦人鳴佩玉於房帷竹林七賢傳舊俗以七月七日曝衣南阮冨所曝皆錦繡北阮貧乃以竹竿標布犢鼻故云曝衣遍天下曳月揚微風謂佳人粧飾於風前月下乞巧荆楚嵗時記七夕穿七孔針於中庭有蟢子羅於瓜果上則以為得巧自露零至日出方罷此人間舊風俗也九日寄岑參彥輔曰此詩言君為姦邪所蔽而賢人幽憂出門復入門雨腳但仍舊所向泥活活鄭曰户括切洙曰一作浩浩詩北流活活謝靈運活活夕流駛趙曰活活雖云水流聲而泥之深多則行為有聲也思君令人瘦洙曰古詩思君令人老嵗月忽巳晚又詩思君令人老軒車又何遲沉吟坐秋洙曰一作西軒飯洙曰一作飲食錯昏晝寸步曲江頭難為一相就蘇曰王𫐠子在荆楚道路阻長歲云暮矣難為相就趙曰此所以懷岑生也岑應在曲江頭猶寸步耳而以雨泥故難於相就也吁嗟乎蒼生稼穡不可救蘇曰楚深秋潦淫霈民有憂色稼穡不可救飢嵗何以支持蒼蒼者意如之何趙曰舊本作呼任昌叔本作乎極是蓋詩云吁嗟乎騶虞取此三字用也尚書海隅蒼生注言蒼蒼然之生草木也閔草木而嘆之以為苦雨稼穡巳損為不可救也安得誅雲師洙曰雲師名屏翳廣雅在雲師謂之豐隆蘇曰久雨不止郭泰機曰慿誰三尺刃誅雲師掃除隂氣疇能補天漏洙曰列子湯問篇女媧氏錬五色石以輔其闕張平子西京賦察雲師之所慿趙曰蜀有地名漏天古詩地近漏天終嵗雨大明韜日月洙曰晉卦麗乎大明趙曰晝夜皆雨而日不見乎晝月不見乎夜皆無明矣曠野號禽獸趙曰惟淫雨淋注則禽獸無所以安其飛走故哀號於曠野君子強逶迤鄭曰上於危下余支切小人困馳驟趙曰以雨淫於上泥汨於下君子雖有車馬亦強逶迤而巳小人艱於行李之往來故困馳驟此公之語法字書本作委蛇自得之貌楚辭載雲旗兮逶迤維南有崇山洙曰詩節彼南山恐洙曰一作漭與川浸溜趙曰前漢書有云泰山之溜可以穿石句之意則憂君子之改節也是節東籬菊紛披為誰秀洙曰陶淵明雜詩采菊東籬下悠然望南山魏文帝與鍾繇書曰嵗往月來忽復九月九為陽數而日月並應俗嘉其名以為冝於長久故以享宴髙會是月律中無射言羣木庶草無有射地而生於芳菊紛然獨榮非夫含乾坤之淳和體芬芳之淑氣孰能如此故屈平悲冉冉之將老思食秋菊之落英輔體延年莫斯之貴謹奉一束以助彭祖之術趙曰此又言不見岑生也饒曰簡文帝九日詩是節協陽數言紛披者暗使岑生多新語性亦嗜醇酎洙曰謝惠連雪賦酌湘吳之醇酎西京雜記漢制宗廟八月飲酎用九醖太牢皇帝侍祠以正月旦作酒八月成名曰酎一曰九醖一名醇酎晉侯鄢酒賦醇酎秋發宣十五年傳秋嗜酒二也鄭曰酎直救切醇酒也采采黃金花何由滿衣袖洙曰詩采采卷耳不盈頃筐又終朝采藍不盈一襜言心有所憂而不在所采也岑生何由而免憂乎趙曰以不見岑生意緒無聊采之不能多也師曰詩人主文而譎諌觀甫此詩多託意於苦雨不直斥當時事以意逆志斯得之矣九日曲江綴席茱茰好洙曰風土記俗於九月九日折茱茰房以插頭言辟邪惡浮舟􅔽蓞衰洙曰蓮莖為茄葉為荷花為􅔽蓞實為蓮根為藕季秋時欲半洙曰一作百年秋巳半九日意兼悲江水清源曲瑱曰西京雜記以水源屈曲故謂之曲江荆門此路疑洙曰桓溫以九日宴從事於龍山孟嘉落帽龍山在荆州門外晚來髙興盡搖蕩菊花期洙曰陶潛九日無酒折菊花盈把至晚王弘送酒遂醉而返趙曰此言是日之晚在曲江賞玩之興巳盡則菊花期約又在明年矣髙興盡乃王子猷所謂興盡而返之義師曰甫云此路疑疑其風景與曲江相若也搖蕩猶云飄蕩恐復飄蕩不得與菊花相期也九日楊奉先會白水崔明甫今日潘懷縣洙曰潘嶽自河陽轉懷縣同時陸浚儀洙曰陸雲出輔俊儀令縣居都會之委要為難理雲到官肅然坐開桑落酒洙曰丗説桑落河多美酒蘇曰桑落何出馬乳酒羌人兼葡萄壓之晉宣帝時來獻九日賜百僚飲焉庾信有從蒲州使君乞酒詩亦云蒲城桑落酒灞岸菊花天來把菊花枝洙曰晉陽秋曰陶潛九月九日無酒宅邊摘菊盈把望見白衣人至乃王弘送酒便飲醉而歸趙曰有劉墮者善造酒熟於桑落之辰故酒得名焉水經載之詳矣菊花枝出庾信從蒲州使君乞酒詩曰蒲城桑落熟灞岸菊花秋舊注引丗説及陶潛事非是天宇清霜淨洙曰言氣宇清徹也公堂宿霧披洙曰衛􅗕見樂廣曰若開雲霧而覩青天宿霧披言每登公堂如披宿霧披開也趙曰公堂則楊奉先之公堂也晚酣留客舞鳬舄共差池洙曰王喬為鄴令旦望必入朝每至即雙鳬飛來帝令舉網獲之乃雙舄也差池言舞也昱曰詩差池其羽雲安九日鄭十八携酒陪諸公宴寒花開巳盡菊蘂獨盈枝舊摘人頻異趙曰言舊時摘採菊花之人頻改易而不同也輕香酒暫隨地偏初衣夾洙曰陶潛身逺地自偏秋興賦御夾衣山擁更登危洙曰風俗記尤曰登髙以禳災厄萬國皆戎馬酣歌淚欲垂九日五首闕一首重陽獨酌洙曰一云少飲杯中酒抱病豈洙曰一作起登江上臺竹葉於人既無分洙曰張景陽七命乃有荆南烏程豫北竹葉浮蟻星沸飛華萍接竹葉酒名也趙曰公病肺斷酒雖酌而竟不飲也張華輕薄篇曰蒼梧竹葉清冝城九醖酒菊花從此不須開洙曰荆楚歲時記九日登髙飲菊花酒殊方日落玄猿哭洙曰後語宋玉曰子獨不見其玄猿乎趙曰峽中多猿古歌巫山長佳啼三聲淚霑裳上林賦玄猿素此舊國霜前白鴈來洙曰漢武太子婚得白鴈於上林以為贄鮑曰筆談北方白鴈似鴈而小秋深則來白鴈至則霜降北人謂之霜信弟妹蕭條各何往干戈衰謝兩相催洙曰干戈與衰老相逼也舊日重陽日傳杯不放杯即今蓬鬢改但愧菊花開洙曰愁見節物也北闕心長戀侏曰北闕帝都也趙曰不忘君也西江首獨回茱茰賜朝士難得一枝來洙曰唐制九日賜宴及茱茰舊與蘇司業源明兼隨鄭廣文虔采花香泛泛洙曰一云簇簇坐客醉紛紛野樹歌還倚秋砧醒却聞歡娛兩冥漠洙曰言蘇鄭俱亡而巳又流落也顔延年衣冠終冥寞西北有孤雲洙曰魏文帝西北有俘雲孝祥曰唐狄仁傑授并州法曹參軍親在河陽仁傑登太行山反顧見白雲孤飛謂左右曰吾親舍其下瞻悵久之雲移乃得去故里樊川菊洙曰樊川在杜曲登髙素滻源洙曰滻所簡切滻水也他時一笑後今日幾人存洙曰言節物依然而人事更變也巫峽蟠江路終南封國門繫舟身萬里伏枕淚雙䀶洙曰巫峽終南相去萬里於流落之際而又伏枕則羈苦可知矣為客裁烏帽從兒具緑樽洙曰沈休文賔至下塵榻憂來命緑樽佳辰對洙曰一作帶羣盜愁絶更堪論洙曰當盜賊充斥道路阻絶於異鄉逢此佳節固多愁蹙也九日諸人集于林九日明朝是相要舊俗非洙曰非昔日遊賞之地也老翁難早出賢客幸知歸舊采黃花賸鄭曰賸石證切亦作剩梅曰賸有餘也新梳白髮微謾看年少樂忍淚巳霑衣蘇曰王子敬昨過嵆公墳忍淚急趨回首不覺霑衣情動於中莫可制止也九日登梓州城伊昔黃花酒如今白髮翁追歡筋力異望逺歲時同弟妹悲歌裏朝廷醉眼中蘇曰索休曰近戮子胥朝廷在吾醉眼中矣兵戈與關塞趙曰兵戈以言戰鬪閔塞以言戍屯時吐蕃之亂既與之戰且有防守也此日意無窮九日奉寄嚴大夫趙曰時嚴武歸朝以御史中丞進為大夫故云九日應愁思經時冒險艱不眠持漢節趙曰謂嚴武充明皇肅宗山陵橋道使也何路出巴山趙曰公自言也蓋公時方在梓久客厭倦而欲出耳小驛香醪嫩重巖細菊班遙知簇鞍馬回首白雲間趙曰公遙想其簇鞍馬而回首白雲以望之此嚴武所謂杜二見憶者謂此也巴嶺答杜二見憶嚴武作卧向巴山落月時趙曰指言杜公也兩鄉千里夢相思趙曰嚴與杜各在一鄉相去千里而夢想之也可但步兵偏愛酒洙曰阮籍聞步兵厨多美酒營人善釀求為校尉也知光祿最能詩洙曰謝光祿名莊字希逸所著文章四百餘首仕至光祿大夫江頭赤葉楓愁客洙曰楚辝湛湛江水兮上有楓籬外黃花菊對誰趙曰亦以問杜公也使淵明采菊東籬下句跋馬望君非一度趙曰答杜前篇簇鞍馬之語冷猿秋鴈不勝悲薛曰此詩洪覺範謂之骨含蘇李體見十九卷題省中院壁注九日去年登髙郪縣北洙曰東蜀有郪縣今日重在涪江濵趙曰射洪之江也鄭曰寰宇記江左在縣西二百里沈曰蜀有涪州以涪江得名苦遭白髮不相放羞見黃花無數新丗亂鬱鬱久為客路難悠悠常傍人酒闌却憶十年事腸斷驪山清路塵洙曰憶明皇太平之時不敢明指故致意驪山也蒼舒曰子美傷時憂憤發為辭章指陳得失莫不切至而此注謂不敢明指嗚呼謬哉趙曰驪山在臨潼縣即明皇之華清宫也孫曰驪山明皇遊幸之地九日藍田崔氏莊老去悲秋強自寬洙曰宋玉曰悲哉秋之為氣也興來今日盡君歡羞將短髮還吹帽洙曰孟嘉九日為風吹帽笑倩傍人為正冠趙曰借李下不正冠也藍水逺從千澗落洙曰三秦記曰藍田有州方三十里其水北流出銅鐵玉石玉山髙並兩峯寒洙曰前漢地理志藍田山出美玉晏曰玉山與秦山華山峙立故云髙並兩峯寒明年此會知誰健洙曰一作在蘇曰阮瞻元日會親友曰人生如風中燭樽酒何必拒其滿不知明年今日再開此會誰是強健者醉洙曰一作再把茱茰子細看夢符曰右按西京雜記武帝宫人賈蘭佩茱萸食餌飲菊花酒余曰冷齋夜話云詩有句意俱含蓄者如九日詩云云絶句每恨陶彭澤無錢對菊花如今九日至自覺酒須賖小至天時人事日相催冬至陽生春又來夢符曰右按玉燭寶典禮夏至小正十有一月王狩又沈約宋書曰魏晉冬至日受萬國及百寮稱賀因小會其儀亞於嵗朝甫稱小至當謂是也或曰陽為大隂為小冬至隂極故曰小至春秋元命苞曰冬至百八十日春夏成道宋均曰冬至陽用事歷春至夏百八十二日八分之五而陽道成也孝經援神契曰冬至陽氣萌刺繡五紋添弱線鄭曰刺七迹切吹葭六琯動浮灰洙曰續漢書以葭莩灰實律之端按歷者候之氣至則灰飛而通以六律也岸容待臘將舒柳山意衝寒欲放梅雲物不殊鄉國異洙曰左傳分至啓閉以書雲物教兒且覆掌中柸至日遣興奉寄北省舊閣老兩院故人二首去歲兹辰捧御床五更三點入洙曰一作出鵷行師曰鵷鷺之行喻縉紳之列余曰唐上宫儀傳簉羽鵷鷺欲知趨走傷心地洙曰此言為華掾趨走參謁郡將也正想氛氲滿眼香洙曰御爐香煙無路從容陪語笑有時顚倒著衣裳趙曰東方未明篇顚倒衣裳師曰言行之遽也何人錯憶窮愁日愁日愁隨一線長洙曰一云日日愁隨一線長嵗時記云宫中以紅線量日影至日日影添一線蘇曰唐雜録謂宫中以女工揆日之長短冬至後日晷漸長比當日增一線之功黃魯直云此説是趙曰至日影長繡工添一線也憶昨逍遙供奉班趙曰唐拾遺掌供奉諷諌去年今日侍龍顔洙曰漢髙祖隆凖而龍顔麒麟不動爐煙上蘇曰漢武時月氏進七寶麒麟爐百和香續絃膠孔雀徐開扇影還蘇曰孝明時南蠻進白孔雀尾扇趙曰麒麟者香爐之狀也孔雀者扇中所畫也以言至日受賀之儀玉几洙曰一作坐由來天北極洙曰周禮王左右玉几朱衣只在殿中間孝祥曰言拾遺只在殿中間與侍御史同立所謂立螭頭是也孤城此日堪腸斷趙曰公在外不得預朝賀而懷之耳故有腸斷之嘆愁對寒雲雪滿山洙曰舞鶴賦氷塞長河雪滿羣山冬至年年至日長為客忽忽窮愁泥殺人鄭曰泥乃計切江水形容吾獨老洙曰屈原放於江潭形容枯稿天涯洙曰一作天邊風俗自相親洙曰陸士龍修路無窮迹井邑自相循百城名異俗千里是良鄰歡舊難假合風土豈虛親杖藜雪後臨丹壑鳴玉朝來散紫宸洙曰西征賦飛翠綏拖鳴玉以出入禁門者衆矣心折北時無一寸洙曰别賦使人意奮神駭心折骨驚路迷何處見洙曰作是三秦洙曰項羽立三泰王臘日臘日常年暖尚遙今年臘日凍全消侵陵雪色還萱草洙曰萱草乃忘憂草今俗云萬年韭雪霜不凋漏泄春光有洙曰一作是柳條縱酒欲謀良洙曰一作長夜醉還家初散紫宸朝洙曰紫宸殿也鄭曰紫宸志宣政殿北曰紫宸門內有紫宸殿即內衙正殿口脂面藥隨恩澤翠管銀罌下九霄洙曰唐制臘日宣賜口脂面藥及賜宴趙曰唐制臘日賜脂面藥翠管銀罌所以盛之也定功曰太平御覽載盧公家範凡臘日上澡豆及頭膏面脂口脂杜位宅守歲鮑曰天寶十年辛卯時年四十嵗在京師社位宅守歲是以有四十明朝過之句守歲阿戎家鄭曰阿烏葛切洙曰王戎字濬仲少阮籍二十歲而籍與之交籍與戎父渾為友戎年十五隨父渾在郎舍籍每適渾俄頃輒去過視戎良久然後出謂渾曰共卿語不如與阿戎談椒盤巳頌花洙曰周庾信正旦詩椒花逐頌來蘇曰周處風俗記正旦楚人拜壽上五辛盤松柏頌椒花酒盍簪喧櫪馬洙曰易豫卦勿疑朋盍簪古詩老驥伏櫪列炬散林鴉四十明朝過趙曰公於天寶三十九嵗冬預明獻明年三大禮賦表云甫行年四十載矣當強仕之年官猶未定宜其感歎之切故曰四十明朝過也飛騰暮景斜誰能更拘束蘇曰徐昉真是傲逸之士誰能拘束於俗禮也乃長揖而去沈亞之陳長皆嘆羡不巳爛醉是生涯千秋節有感二首自罷千秋節頻傷八月來洙曰唐玄宗紀上以降誕日宴百僚於花蕚樓下百僚表請以每年八月五日為千秋節三公以下獻鏡及承露囊先朝常宴會壯觀巳塵埃鳳紀編生日龍池塹劫灰趙曰唐六典注興慶宫池即玄宗龍潛舊宅所居此宅東有舊井忽湧為小池常有雲氣或黃龍見其中至景龍中其池侵廣遂鴻洞為龍池焉梅曰蓋符命之先也饒曰漢武帝穿昆明池悉是灰墨有外國胡道人云比是天地劫火之餘湘川新涕淚洙曰二妃涕淚灑竹成班趙曰公自言其身之所在而感泣者也舊所引謬矣秦樹逺樓臺洙曰謝玄暉銅雀詩縹帷飄井幹樽酒若平生鬱鬱西陵樹詎聞歌吹聲井幹樓也趙曰公言去長安之逺遙望其樹與樓臺俱不見也舊所引非是寶鏡羣臣得金吾萬國回逸曰金吾將軍掌禁衛者衢樽不重飲白首獨餘哀蘇曰沈炯漂泊未歸搔首歎曰今天下兵戈洶洶弟妹分散唯獨哀白首余生恐投死無地趙曰淮南子曰聖人之道其猶中衢而致樽邪今公所言則謂當時賜宴之酒羣臣皆得霑飲正如衢樽也御氣雲樓敞含風綵仗髙仙人張內樂洙曰西京賦總會仙侣戲豹舞羆白虎鼓瑟蒼龍吹箎定功曰宣室志云唐玄宗夢仙子十餘輩御雲而下列於廷各執樂器而奏之其度曲淸越殆非人丗也趙曰鄭棨開元傳紀云云玄宗謂髙力士吾昨夜夢遊月宫月宫諸仙娛豫以上清之樂寥亮清越之音非人間所聞也吾歸其曲淒楚動人杳杳在耳力士請曲名上曰紫雲曲王母獻宫桃洙曰見九重春色醉仙桃注羅襪紅蕖豔趙曰言宫人也洛神賦凌波微步羅襪生塵又迫而察之若芙蕖出緑波金羈白雪毛洙曰曹子建白馬飾金羈連翩西北馳舞階銜壽酒洙曰舜舞干羽于兩階劉伶銜杯漱醪詩為此春酒以介眉壽走索背秋毫洙曰西京賦跳丸劒之揮霍走止索而相逢鄭曰索昔各切繩也聖主他年貴趙曰追念明皇之昔日也邊心此日勞趙曰言今在邊逺之地而感望也桂江流向北滿眼送波濤趙曰以見公北望長安之切矣晝夜夢附古詩二首律詩二十一首今夕行今夕何夕歲云徂洙曰唐詩綢繆云今夕何夕見此良人韋孟諷諌詩嵗月其徂年其逮耉鮑曰謂除夕若曰嵗月其徂同一冬可耳指今夕為歲徂其除夕明矣彥輔曰詩曰嵗聿云暮王逸九歌注悲嵗徂盡更長燭明不可孤洙曰宋玉招魂娛酒不廢沉日夜些蘭膏明燭華鐙錯些趙曰孤乃孤負之孤李陵書陵雖孤恩漢亦負德是也師曰今丗誤多用辜字殊不知辜乃辜罪之辜而非孤負之孤咸陽客舍一事無定功曰梁吳筠詩君不見長安客舍門相與博塞洙曰一云賭博為歡娛洙曰説文曰博局戲六著十二棊古者烏曹作博尹文子曰博盡關塞之冝得周通之路説苑曰塞行棋相塞謂之塞也管子曰秋行五政一曰秋禁博塞也莊子問穀奚事博塞以遊塞先代反師曰漢書注云行棊也行棊子以相塞即今丗取棊也馮陵大呌呼五白師曰五白即今之骰子李白詩有連呼五白行六傅蓋古人用六隻骰今人亦然袒跣不肯成梟盧洙曰一作牟招魂曰菎蔽象棊有六博分曹並進猶相迫成梟而牟呼五白晉制犀比費白日宋劉毅字希樂於東府聚樗蒲大擲一判應至數百萬餘人並黑犢以還唯劉𥙿及毅在後毅次擲得雉大喜褰衣繞床呌謂同坐曰非不能盧不事此耳𥙿惡之因援五木久之曰老兄試為卿答既而四子俱黑其一子轉躍未定𥙿厲聲喝之即成盧毅意殊不快也梟勝也借勝為牟五白博齒也趙曰楚辭招魂有成裊而卒呼五白注五白五木也梟勝也盧勝之名也韓非子載匡倩對齊宣王之語曰博者貴梟又慕容寶與韓黃李根等樗蒲寶危坐誓之曰丗言樗蒲有神若冨貴可期頻得三盧於是三擲盡盧祖跣大叫楷曰一云寶拜而受賜師曰梟盧博采也如今之博采有豬有豹是也英雄有時亦如此邂逅豈即非良圗趙曰如劉𥙿劉毅慕容寶等皆一丗英雄猶如此蒲博則今夕邂逅相遇未必非良圖所謂良圗則毅裕以卜成事寶以卜冨貴也君莫笑劉毅從來布衣願家無儋石輸百萬洙曰南史桓玄聞劉毅起兵曰毅家無儋石之儲樗蒲一擲百萬共舉大事何謂無成前漢蒯通傳守儋石之儲者闕卿相之位應劭曰齊人名小甕為儋石受二斛晉灼曰石斗石也師古曰儋者一人之所負儋也楊雄傳家無儋石之儲鄭曰儋都甘切儋同説文負荷也師曰詩言及此蓋以博奕者丗之所賤以為不美之事甫以客舍歡笑無害於理孰謂非良圗乎儋石言一擔石儲無儋石家至貧也劉毅家無儋石一擲百萬其志巳見於布衣窮時及後舉大事無不如志由此推之人之志量其可巳耶甫貧賤中雖有大志觀自言致君堯舜上其志可見又云此意竟蕭條奈何時命不利此所以有喻乎祖跣不肯成梟盧也夜歸夜來歸來衝虎過山黑家中巳眠卧傍見北斗向江低仰看明星當空大洙曰明星夜半則見庭前把燭嗔兩炬峽口驚猿聞一箇白頭老罷舞復歌杖藜不睡誰能郍朝二首清旭楚宫南趙曰清旭清朝也江賦視氛祲於清旭楚宮則楚王之宫也霜空萬嶺含野人時獨往趙曰朝未有行人故野人時獨往耳雲木曉相參俊鶻無聲過飢烏下食貪蘇曰朝錯仰看飛鳥無聲而過者俊鶻乾噪而下者飢烏病身終不動蘇曰西方炒華尊者國王三召不來使人又召曰如不來王當斬爾尊者曰斬即斬吾身終不動王聞而異之加禮焉搖落任江潭洙曰陸士衡戢翼江潭浦帆晨初發郊扉冷未開趙曰善本作浦帆帆音去聲今韻書亦收矣言九晨朝之際想江浦之中其帆起發而郊居之家以冷而未開其扉也村踈黃葉墜野靜白鷗來礎潤休全濕夢符曰右按淮南子山雲蒸柱礎潤趙曰休罷也言礎石之潤經夜稍乾而半濕矣雲晴欲半回趙曰言朝既晴霽其宿雲半斂而回去也巫山冬可怪昨夜有奔雷洙曰江淹山雲潤柱礎趙曰使三都賦之雷奔也晚杖藜尋晚巷炙背近牆暄洙曰嵆康書野人有快炙背而美芹子者欲獻之至尊雖有區區之意亦巳踈矣人見幽居僻吾知拙養尊朝廷問府主耕稼學山村歸翼飛棲定寒燈亦閉門洙曰曹子建歸鳥赴喬林翩翩厲羽翼陸士衡願假歸鴻翼翻飛遊江汜反照反照開巫峽趙曰開則開豁之義寒空半有無巳低魚復暗洙日魚復縣名不盡白鹽孤洙曰白鹽山名荻岸如秋水趙曰荻花密布如秋水之翻波也松門似畫圗蘇曰稽山景物竒秀王逸少云過松門如在畫圗中牛羊識童僕既夕應傳呼暝日下四山隂山庭嵐氣侵洙曰謝靈運夕曛嵐氣侵牛羊歸徑險洙曰詩牛羊下來北征賦日暗暗其將暮觀牛羊之下來烏雀聚枝深正枕當星劒收書動玉琴半扉開燭影欲掩見清砧洙曰星劒劒上有星文也玉琴以玉為琴徽也向夕畎畝孤城外趙曰畎遂溝洫田水之名也畎畝則畎之畝也江村亂水中深山催短景喬木易髙風蘇曰喬木易得髙風巨海易得驚波余曰古今詩話云如此二句了無瑕纇含蓄深美殆不可模倣鶴下雲汀近雞栖草屋同琴書散明燭長夜始堪終洙曰嘯賦清飈振乎喬木薄暮江水最深地洙曰此指蜀江楷曰一本最深作長流山雲薄暮時寒花隱亂草師曰寒花巳非其時甫自比衰年也宿鳥擇洙曰一作探深枝趙曰史云鳥則擇木木豈能擇鳥師曰鳥志在奮飛宿鳥巳有棲息之地甫自比無飛騰之志者也舊國見何日髙秋心苦悲人生不再好鬢髮白洙曰一作自成絲日暮日落風亦起城頭烏尾訛修可曰鳥尾當作烏尾殆傳印之誤按後漢五行志桓帝時京師童謡云曰城上烏尾畢逋蓋言處髙利獨食不與下共謂人主多聚斂也師道曰訛以言驚動也黃雲髙未動白水巳揚波羌婦語還哭胡兒行且歌將軍别換馬夜出擁雕戈蘇曰馬援夜出擊五蠻陳換馬自備遂橫戈而出趙曰將軍以敵人識之故換馬雕戈見此卷雕戈注日暮牛羊下來夕洙曰詩曰之夕矣牛羊下來各巳閉柴門風月自清夜江山非故園石泉流暗壁草露滿秋根洙曰一作滴秋原頭白燈明裏何須花燼繁洙曰丗俗以燈花為報喜公流泛異鄉觸事多感固無異於此也夜二首白夜月休弦燈花半委眠號山無定鹿落樹有驚蟬暫憶江東鱠洙曰張翰憶鱸魚兼懷雪下船洙曰王子猷訪戴安道蠻歌犯星起重覺在天邊洙曰重一作空城郭悲笳暮村墟過翼稀甲兵年數久賦斂夜深歸暗樹依巖落明河繞塞微斗斜人更望月細鵲休飛洙曰樂府月明星稀烏鵲南飛夜絶岸風威動洙曰蕪城賦菊藾風威寒房燭影微嶺猿霜外宿江鳥夜深飛蘇曰王詠云深夜飛江鳥言鳥夜深飛無安栖處子美逢亂丗漂轉因用此語獨坐親雄劒哀歌嘆短衣洙曰哀歌嘆短衣事近寧戚不及骭之嘆也以為胡服則非煙塵繞閶闔白首壯心違中夜中夜江山靜危樓望北辰洙曰顔延年起觀辰漢中長為萬里客有愧百年身洙曰鮑明逺爭先萬里途各事百年身蘇曰孔融中夜不寐翻覆生計無補於丗有愧百年身後之名取羞於子孫故國風雲氣洙曰顔延年故國多喬木空城凝塞雲史記風雲天之客氣者也髙堂戰伐塵胡雛負恩澤趙曰當時史朝義之亂未除而公興感亂階自祿山也嗟爾太平人洙曰明皇嘗寵祿山坐於金雞障下肅宗以為言上曰胡有異相吾厭之趙曰公追思而傷及昔為太平之人皆彼此禍也師曰望北辰言思君也雲從龍風從虎喻君臣會聚子美家京城今客萬里之遠故望風雲之氣有所感傷也中霄西閣百尋餘洙曰西京賦巨獸百尋八尺曰尋中宵步綺疏洙曰天台賦皎曰炯晃於綺疏又詩交疏結綺窗阿閣三重階陸機玄雲拖朱閣振風薄綺疏飛星過水白鄭曰過古禾切落月動沙虛擇木知幽鳥洙曰仲尼曰鳥能擇木木豈能擇鳥詩鳥鳴嚶嚶出自幽谷濳波想巨魚洙曰古詩濳虬思餘波漢書巨魚縱大壑親朋滿天地兵甲少來書不寐瞿唐夜水黑城內改更籌翳翳月沉霧輝輝星近樓洙曰景陽詩翳翳結繁雲氣衰甘少寐心弱恨容洙曰一作和又作多愁趙曰心既弱矣恨其知愁則恐以愁而尢弱矣多壘洙曰一作恨滿山谷洙曰曲禮四郊多壘卿大夫之辱也桃源無處求洙曰桃源見赤谷西崦人家詩注趙曰以兵戈未息而多壘非若桃源可以避地而問桃源何處則以仙境難造也倦夜竹涼侵卧內趙曰漢書引入卧內然几寢所皆可例稱野月滿庭隅重露成涓滴洙曰墮也稀星乍有無洙曰明滅也暗飛螢自照蘇曰王璡如飛螢自照言其勢熖尋常也水宿鳥相呼洙曰蜀都賦雲飛水宿江賦其羽族也千類萬聲自相喧聒修可曰師曠禽經曰陸鳥曰棲水鳥曰宿獨鳥曰止衆鳥曰集又曰凡鳥朝鳴曰嘲夜鳴曰㖡林鳥以朝嘲水鳥以夜㖡今林棲之鳥多朝鳴水宿之鳥多夜叫蘇曰江湜水鳥相呼言其共欲安居也因兒子過來請益逐撿録與之矣余曰王直方詩話云司空表聖自論其詩以為得味外味緑樹連村暗黃花入麥稀此句最善若子美此二句則才力冨健過表聖逺甚萬事干戈裏空悲清夜徂洙曰有感時之志而不見用於時故徒悲清夜師曰古詩云良馬白日足壯士中夜心甫有成時之志而不見用於時故空悲清秋徂夜洙曰一云秋夜客舍露下天髙秋水清洙曰江淹别賦露下地而騰文宋玉九辨云泬漻兮天髙而氣清寂寥兮收潦而小清靈運天髙秋月明空山獨夜旅魂驚定功曰玉仲宣七哀詩獨夜不能寐踈燈自照孤帆宿新月猶懸雙杵鳴洙曰易繫懸象著明莫大乎日月蘇曰李陵詩雙杵聲未斷新月懸東陽南菊再逢人卧病洙曰菊一作國北書不至鴈無情洙曰范彥龍寄書雲間鴈為我西北飛步蟾洙曰一作簷倚杖看牛斗趙曰當以步簷為正上林賦云步櫩周流李善注曰步櫩步廊也銀漢遙應接鳳城洙曰劉休玄落宿半遙城浮雲靄層闕鮑明逺倚杖牧雞豚趙曰鳯城言長安也東屯月夜抱疾漂萍老防邊舊榖屯春農親異俗歲月在衡門青女霜楓重洙曰曉霜楓葉丹青女霜神名黃牛峽水喧泥留虎鬪迹月挂客愁村喬木澄稀影輕雲倚細根數驚聞雀噪暫睡想猿蹲曰轉東方白風來北斗昏蘇曰漢元帝七月有塵埃大風自北來北斗為之昏天寒不成寢無夢寄歸魂將曉二首石城除擊柝趙曰擊柝以言警夜靜則除之鐵鎖欲開關鼓角悲荒塞星河落曉山巴人常小梗洙曰謂假子璋反也蜀使動無還趙曰吐蕃未息所以蜀使輒無還垂老孤帆色飄飄犯百蠻趙曰指荆州也舊本作蠻非軍吏回官燭舟人自楚歌洙曰項籍聞軍中皆楚歌寒沙蒙薄霧落月去清波趙曰月落時離江巳遠不復有影在水中壯惜身名晚衰慙應接多歸朝日簪笏筋力定如何曉望白帝更聲盡陽臺曉色分洙曰神女賦求之至曉趙曰白帝者白帝城也陽臺則宋玉所謂陽臺之下是也髙峯寒上日疊嶺宿霾雲蘇曰仇輝疊嶺霾雲長江激浪地坼江帆隱蘇曰樂廣曰地坼山摧國有大恐趙曰地圻言江闊也故江帆隱於其中耳天清木葉聞荆扉對麋鹿共應爾為羣夢古詩二首律詩二首夢李白二首死别巳吞聲洙曰宋鮑昭行路難吞聲躑躅不敢言生别常惻惻洙曰蘇武詩淚為生别滋歐陽建惻惻心中酸楚詞悲莫悲於生别離謝靈運惻惻廣陵散蘇曰馬融不忍生别我心惻惻江南瘴癘地魯曰劉孝標流離大海之南寄命瘴癘之地趙曰白坐永王璘之纍當誅郭子儀請解官贖罪詔長流夜郎會赦還潯陽坐事下獄潯陽今之江州也屬江南東路逐客無消息魯曰李斯為秦逐客故人入我夢明我長相憶洙曰樂府云夢見巳在傍忽覺在他鄉上有加食食下有長相憶恐非平生魂路逺不可測魂來楓林青洙曰楚辭湛湛江水兮上有相阮籍湛湛長江水上有楓樹材魂返關塞黑今君在羅網蘇曰魏壽婦人女子一旦陷君在羅網何以有羽翼洙曰時白為永王事放逐落月滿屋梁洙曰宋玉神女賦若白月初出照屋梁猶疑照顔色彥輔曰西清詩話云太白歷見司馬子微謝自然賀知章或以為可與神遊八極之表或以為謫仙人其風神超邁英爽可知後丗詞人狀其風貌者多矣亦間於丹青見之俱不若少陵云落月滿屋梁猶疑照顔色熟味之百丗之下想見風采此與李太白傳神詩水深波浪闊蘇曰宋玉海水深浩波浪廣闊非万斛舟不可泛無使蛟龍得洙曰續齊諧記曰屈原五月投汨羅而死楚人哀之每至此日祭之漢建武中長沙人歐回見一人自稱三閭大夫曰吾嘗見祭甚善然為蛟龍所苦今若有惠可以揀葉塞之縛以五色絲此二物蛟龍所畏也師曰蓋言南海風濤之險恐其罹淪溺之患也浮雲終日行師曰楚辭云日暮碧雲合言君昏暗為羣小所蔽也遊子久不至洙曰古詩浮雲蔽白日遊子不顧反三夜頻夢君情親見君意告歸常局促苦道來不易江湖多風波洙曰一云秋多風舟楫恐失墜出門搔白首蘇曰諸葛松出門無往還時復搔白首若負平生志蘇曰季常一囊粟俸拘束塵埃中負平生山林之志冠蓋滿京華斯人獨憔悴鄭曰憔昨焦悴秦醉切洙曰左太沖詩濟濟京城內赫赫王侯居冠蓋蔭四街朱輪竟長衢寂寂揚子宅門無卿相輿寥寥空宇內所講在玄虛孰云網恢恢洙曰老子天網恢恢踈而不漏將老身反纍蘇曰稽昴吾將老矣反為牛尾纍身千秋萬歲名寂寞身後事洙曰張翰曰使我有身後名不如即時一杯酒阮籍詩千秋百歲後榮名安所之按新唐書時白坐永王事當誅郭子儀請解官贖罪詔長流夜郎會赦還潯陽復坐事下獄歸夢道路時通塞江山日寂寥蘇曰丗説袁彥伯曰江山聊落居然有萬里勢也趙曰以時當用兵道路或通或塞故江山氣象日日蕭索偷生惟一老伐叛巳三朝洙曰明皇肅宗代宗三朝雨急青楓暮趙曰言南下之景蓋楚地多楓也見楚詞江水湛湛兮上有楓雲深黑水遙洙曰禹貢華陽黑水惟梁州蘇曰班彪雲黃藏黑水雪白認青城趙曰言懷望長安也黑水在鄠杜之間去長安為近師曰楚岸多青楓甫客居荆楚懷想故鄉情尚遙歸未得故云雲深黑水遙夢歸歸未得洙曰一云夢魂歸亦得不用楚辭招洙曰宋玉哀屈原憂愁山澤魂魄飛散其命將落故作招魂欲以復其精神延其年壽外陳四方之惡內崇楚國之美以諷于君兾其覺悟而還之也趙曰一作夢魂歸未得未當言歸亦得與下句方有分付宋玉哀屈原憂愁內澤之間魂魄飛散作招魂之辭以招之公今正以為方藉夢魂而歸故鄉更不須相招晝夢二月饒睡昏昏然不獨夜短晝分眠趙曰言二月昏睡不足獨只是春夜短睡不足而乃分晝之半以眠耳桃花氣暖眼自醉蘇曰一作桃花醺人眼欲醉吕安行鏡湖岸上桃花爛熳謂王恂曰醺得眼醉殷紅泛眩江揔詩云惱殺未歸客桃花醺眼醉云趙曰觀桃花在暖日中醺灼人眼巳是醉悶春渚日落夢相牽趙曰春渚才日晚夢巳相牽挽不自由矣故鄉門巷荆棘底趙曰不歸之久而生荆棘矣中原君臣豺虎邊洙曰見人少豺虎多注趙曰言盜賊也王粲詩盜賊如豺狼安得務農息戰鬪普天無吏橫索錢洙曰時多橫賦暴㰸也趙曰橫去聲吏乘軍須之勢文至於暴橫求索其為可傷也分門集注社工部詩卷第三
