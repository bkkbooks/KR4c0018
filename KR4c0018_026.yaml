  text: 年譜
  hash: sha256:3cabc51f572a87983338f688394d3bc6fe81d24e967dd8aa6df305ce0d78fb0e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_026-1a}
body:
  text: 汲郡吕大防撰睿宗先天元年癸丑甫生於是年按甫誌及傳皆云年五十九卒於大曆五年辛亥故也玄宗開元元年甲寅開元三年丙辰觀公孫弟子舞劒器詩序去開元三年余尚童稚於郾城觀公孫氏舞劒器按甫是年纔四歳年必有誤開元二十九年壬午天寳元年癸未集有天寳初南曹司宼爲山詩時年三十一天寳十一年癸巳上韋左相詩云鳯曆軒轅紀龍飛四十春是年玄宗即位四十年時有兵車行天寳中詩麗人行天寳十三年乙未是年有三大禮賦序臣生陛下淳樸之俗四十年矣時年四十三天寳十四年丙申是年十一月初自京赴奉先有詠懷詩是月有禄山之亂天寳十五年丁酉是年七月肅宗即位改至德元年是年避㓂於馮翊有白水髙齋三川觀漲詩六月帝西幸七月至蜀郡時有哀王孫詩至德二年戊戍是年自城中竄歸鳯翔拜左拾遺有薦岑參謝口敕放推問狀八月墨制放往鄜州有北征詩乾元元年巳亥是年移華州司功有試進士䇿爲郭使君論殘㓂狀時有新安吏石壕吏新婚別垂老別無家別留花門洗兵馬詩乾元二年庚子是年棄官之秦州自秦適同谷自同谷入蜀時有遣興三百首上元元年辛丑是年在蜀郡有百憂集行云即今倐忽巳五十按是年年四十九時有杜䳌行石犀行古栢行病橘病栢枯㯶枯柟憶昔各一首述上元二年壬寅是年嚴武鎮成都甫往依焉寳應元年癸卯詩有元年建巳月乃是年也代宗廣德元年申辰是年有祭房相國文嚴武再鎮西川奏甫節度參謀檢校工部貟外郎作傷春五首永泰元年丙午嚴武平蜀亂甫遊東川除京兆功曹不赴大曆元年十未移居䕫大曆三年巳酉離峽中之荆南至湘潭大曆五年辛亥有追酬髙適人日詩是年夏甫還襄漢卒於岳陽予苦韓文杜詩之多誤旣讎正之又各爲年譜以次第其出處之歳月而略見其爲文之時則其歌時傷丗幽憂切歎之意粲然可觀又得以考其辭力少而銳壯而肆老而嚴非妙於文章不足以至此汲郡吕大防記東萊蔡興宗重編玄宗先天元年壬子先生姓杜氏諱甫字子美其先襄陽人後徙河南之鞏縣晉鎮南大將軍當陽城侯預之十三丗孫曽祖依藝監察御史洛州鞏縣令祖審言修文館學士尚書膳部貟外郎父閑京兆府奉天縣令先生生於是歳元㣲之撰墓係云享年五十九王原叔集記云卒於大曆五年是也桉唐史明皇傳位後始改元而吕汲公所編年譜作睿宗先天元年癸丑皆誤天寳五載丙戍三載正月詔改年爲載有飲中八仙歌略曰左相日興費萬錢飲如長鯨吸百川銜盃樂聖稱避賢桉唐史是歳四月李適之自左相罷政七月坐韋堅累貶冝春太守明年正月自殺適之甞賦詩云避賢初罷相樂聖且傳盃集中誤爲稱丗賢九載庚寅時年三十九是歳冬進三大禮賦進表曰臣生陛下淳樸之俗行四十載矣其賦曰冬十有一月天子將納處士之議又曰明年孟陬將攄大禮又曰壬辰旣格于道祖又曰甲午方有事於采壇桉唐史十載春正月壬辰上朝獻太淸宫癸巳朝享太廟甲午合祀天地於南郊而新書列傳集記舊譜及賦題之下註文皆作十三年非也十載辛卯有杜位宅守歳詩略曰四十明朝過乃是歳也桉新書列傳集記皆以先生獻三大禮賦明皇竒之召試文章授河西尉不拜改右衞率府胄曹則或在此載下而考秋述文曰我棄物也四十無位又十三載進封西岳賦表略曰臣夲杜陵諸生年過四十甞困於衣食蓋長安一疋夫耳頃歳國家有事於郊廟幸得奏賦待制於集賢委學官試文章再降恩澤送隷有司參列選序又贈韋左丞詩有曰主上頃見徴歘然欲求伸靑冥却垂翅蹭蹬無縱鱗乃知先生進三賦後纔俾參列選序則罷尉河西改授胄曹其在天寳之末載乎故夔府書懷詩有曰昔罷河西尉初興薊北師是也十一載壬辰麗人行之謂丞相者楊國忠也桉唐史是冬國忠始拜相當是次歳以後詩而舊譜入此載非也十二載癸巳有投贈哥舒開府翰詩略曰歸來御席同又曰茆土加名數送蔡希魯還隴右因寄髙書記詩註曰時哥舒入奏勒蔡子先歸其詩有曰春城赴上都桉唐史十一載哥舒翰加開府儀同三司冬入朝是載春進封凉國公十三載甲午冬進封西岳賦賦序曰上旣封太山之後三十年桉唐史開元十三年乙丑歳封太山至是三十年矣有上韋丞相詩略曰龍飛四十春又曰霖雨思賢佐桉唐史以是歳苦雨潦閱六旬上謂宰相非其人罷陳希烈拜韋見素時明皇在位四十三年蓋詩得略舉成數非若進賦之可據而舊譜入十一載皆誤十四載乙未冬十一月有自京赴奉先縣詠懷詩桉唐史是月安禄山反於范陽肅宗至德元載丙申夏五月挈家避地鄜州有白水縣髙齋三川觀漲塞蘆子詩即自鄜挺身赴朝廷遂䧟賊中後在䕫州有詩略曰往在西京時胡來滿彤宫桉唐史六月禄山犯長安七月肅宗即帝位於靈武改元本傳謂先生聞肅宗立自鄜羸服欲奔行在爲賊所得非也冬有悲陳陶悲靑坂哀王孫諸詩二載丁酉春猶䧟賊中有哀江頭大雲寺贊公房得舎弟消息諸詩夏竄歸行在所於鳯翔拜左拾遺有述懷送長孫侍御送樊侍御送從弟亞彭衙行諸詩秋閏八月奉詔至鄜迎家有九成宫徒歩得玉華宫北征羗村諸詩復歸鳯翔有送韋評事詩冬十月扈從還京有病後遇王倚飲臘日諸詩乾元元年戊戍二月改元復以載爲年春在諌省有簡薜華醉歌送程録事晦日㝷崔戢李封雨過蘇端喜晴洗兵馬偪仄行送李校書留花門諸詩夏六月出爲華州司功有爲郭使君進滅殘㓂形勢狀試進士䇿問至日遣興寄兩院遺𥙷詩冬末以事之東都有瘦馬行路逢楊少府入京戲題呈楊貟外閿郷姜七少府設鱠秦少公短歌胡城東遇孟雲卿李鄠縣胡馬行詩二年已亥春三月回自東都有新安吏石壕吏潼關吏新昏別垂老別無家別詩桉唐史是月八日壬申九節度之師潰於相州夏在華州有夏日歎夏夜歎詩秋七月棄官往居秦州有寄賈至嚴武詩略曰舊好腸堪斷新愁眼欲穿其一秋賦詩至多冬十月赴同谷縣有紀行十二首七歌萬丈潭詩十二月一日自隴右赴劒南又有紀行十二首首篇曰一歳四行役是也又成都府詩曰季冬樹木蒼乃以是月至劒南而元祐間胡資政守蜀作草堂詩碑引云先生至成都之年月不可考蓋未詳也上元元年庚子是歳春卜居成都浣花溪上賦詩至多後在東川寄題江外草堂詩略曰經營上元始斷手寳應年桉唐史十一月楊州長史劉展反䧟昇潤等州二年辛丑有百憂集詩時年五十有喜雨詩註曰時聞浙右多盗賊戲作花卿歌桉唐史夏四月劒南東川兵馬使叚子璋反䧟緜州五月劒南節度使崔光逺克東川子璋伏誅秋九月大赦以十一月爲歳首去年號稱元年月以斗所建辰爲名草堂即事略曰荒村建子月乃是歳詩也寳應元年壬寅春建卯月有說旱文註曰初中丞嚴公節制劒南日奉此說又有遭田父泥飲美新尹嚴中丞詩夏有戲贈友二首皆曰元年建巳月桉唐史四月大赦改元復以正月爲歳首是月肅宗崩代宗即位五月有嚴公枉駕草堂詩秋送嚴侍郎至綿州其詩略曰鼎湖瞻望逺象闕憲章新㝷避成都之亂入梓州有九日奉寄嚴大夫詩及嚴武巴嶺荅杜二見憶作後歸成都草堂詩略曰大將赴朝廷群小起異圖而唐史於此年書七月劒南西川兵馬使徐知道反又別書是年六月以兵部侍郎嚴武爲西川節度使而知道拒武不得進今以先生詩文參考之是歳爲夏武皆守蜀殆赴朝廷之後蜀中始亂然八哀詩謂嚴公三掌華陽兵又諸將五詩一謂武守蜀者亦曰主恩前後三持節通鑑亦書武三鎮劒南必甞有是命第未詳何年冬游射洪通泉二縣有至金華山觀盡陪王侍御登東山十古詩其詩有曰南京亂初定及以次年春日戲郝使君詩可考此行在是歳盖居梓州止渉一春也代宗廣德元年癸卯是歳召𥙷京兆功曹不赴時嚴武尹京有春日寄馬巴州詩注曰時除京兆功曹在東川而夲傳與集記作上元年間舊譜作永泰年皆誤春夏在梓州賦詩頗多亦甞暫游左綿有題涪城縣香積寺縣在梓緜中塗緜州巴西驛亭城上詩皆春晚作也秋九月至閬州有祭故相國房公文東樓筵十一舅往靑城發閬中諸詩冬回梓州有冬狩行別章使君柳字韻諸詩遂挈家再入閬州桉唐史十月吐蕃䧟京師代宗幸陜十二月至自陜二年甲辰春居閬中有傷春五首別本註曰巴閬僻逺傷春罷始知春前巳收宫闕集中乃編作䕫州詩又有收京三首而編作鳯翔行在詩尤爲差誤桉唐史正月合劒南東西川爲一道以黃門侍郎嚴武爲節度使有奉待嚴大夫詩略曰不知旌節隔年回是也春晚自閬携家歸蜀再依嚴鄭公奏爲節度參謀有先寄嚴鄭公五詩及草堂四松水檻營屋揚旗諸詩略曰別來忽三歳以游梓閬跨三年也及他詩言三年者非一而集記乃書入蜀復適東川上元二年聞嚴武鎮成都自閬挈家往依焉其舊譜又多因之永㤗元年乙巳春在嚴公幕府有正月三日歸溪上及春日江村憶昔諸詩時授檢校工部貟外郎賜緋見之春日江村詩中夏以嚴公卒遂發成都泛舟順流經嘉戎渝忠諸郡皆有詩青溪驛隷嘉州犍爲縣秋末留寓䕫州雲安縣有九日及十二月一日諸詩桉唐史四月嚴武卒冬蜀中大亂而集記謂先生避地梓州亂定歸成都無所依乃泛江游嘉戎又編梓州秋冬數詩於再至成都詩後非也舊譜尤誤大曆元年丙午春在雲安有杜䳌客堂諸詩春晚移居䕫州有詩最多合次年所賦古律詩幾盈五卷二年丁未終歳居䕫州春自白帝城遷寓瀼西先有瀼西寒望詩略曰瞿唐春欲至定卜瀼西居又暮春題瀼西草屋詩略曰乆嗟三峽客再與暮春期乃是歳也三年戊申春發白帝下峽泊舟江陵秋晚遷寓公安縣數月歳暮發公安至岳州有發劉郎浦在公安之下石首縣歳晏行泊岳陽城下諸詩四年已酉春初發岳陽泛洞庭至潭州遂留終歳有春日岳麓山道林二寺行夏日江閣卧病暮秋枉裴道州手札對雪諸詩五年庚戍春正月有追和故髙蜀州人日見寄詩㝷發長沙入衡陽有上水遣懷并二月紀行諸詩至衡有酬郭受詩而受詩有云春興不知凡幾首衡陽紙價頓能髙三月復在長沙有清明詩以唐史氣朔考之是歳三月三日清明故卒章曰况乃今朝更祓除桉唐史夏四月八日庚子湖南兵馬使臧玠殺其觀察使崔瓘先生避亂竄還衡州有衡山縣學堂入衡州舟中苦熱遣懷諸詩其詩曰逺歸兒侍側又曰乆客幸脫免又曰中夜混黎甿脫身亦奔竄乃知甞寓家衡陽獨至長沙遂罹此變本傳謂先生數遭㓂亂挺節無所汙是也㝷於江上阻暴水半旬不食耒陽聶令具舟致酒肉迎歸一夕而卒舊譜乃書還襄漢卒於岳陽尤誤後餘四十年其孫嗣業始克歸葬於偃師元和八年癸巳歳也聞今耒陽縣南猶有先生墳及祠屋在焉議者謂元㣲之先爲墓係而卒不能歸葬也嘉興魯訔撰睿宗先天元年壬子正月改太極五月改爲延和明皇以是年八月改元桉公志及傳皆云年五十九卒於大曆五年辛亥詩史云開元元年癸丑公生公上大禮賦云臣生陛下淳樸之俗行四十載公天寳十載奏賦年三十有九逆節公今年生吕汲公攷公生先天元年癸丑天寳十三載奏賦若十三載公當四十三歳矣唐書宰相表及紀年通譜先天元年壬子而譜以爲癸丑集祭房公廣德元年歳次癸卯而譜以爲甲辰皆差一年開元元年癸丑三年乙卯公郾城觀公孫弟子舞劒行云開元三年余尚童穉於郾城觀公孫舞劒器年譜以爲三年丙辰桉公是年纔四歳年必有誤公進鵰賦表云臣素頼先人緒業自七歳所綴詩筆向四十載矣約千有餘篇則能憶四歳時事不爲誤也十四年丙寅公初遊選埸壯遊曰往昔十四五出遊翰墨埸斯文崔魏徒以我似班揚二十三年乙亥公年二十四公作開元皇帝皇甫淑妃豐碑曰歳次乙亥十月癸未朔薨又曰野老何知斯文見託不論官閥游夏入文學之科意公尚白衣天寳十載始上三大禮賦起家授河西尉或以爲是年未應稱野老當是天寳十載辛卯銘曰列樹拱矣豐碑闕然乃知後來方立碑也但未能攷其定於何年二十五年丁丑史云公少不自振客遊呉越齊趙故壯遊曰東下姑蘇臺巳具浮海航到今有違恨不得窮扶桑歸帆拂天姥中歳貢舊郷忤下考功第拜辭京尹堂放蕩齊趙間裘馬頗淸狂春登吹臺上冬獵靑丘旁遊梁亦曰昔我遊宋中惟梁孝王都憶與髙李輩論文入酒壚氣酣登吹臺懷古視平蕪昔遊曰昔與髙李輩晚登單父臺山脚曰昔我遊山東憶戲東岳陽窮秋立日觀矯首望八荒公居城南甞預京兆薦貢而考功下之唐初考功試進士開元二十六年戊寅春以考功郎輕徙禮部以春官侍郎主之公之適齊趙當在此歳以前二十九年辛巳公有酹逺祖晉鎮南將軍于洛之首陽酹文十三葉孫甫開元二十九年歳次辛巳天寳元年戊午公年三十一南曹小司㓂於我太夫人堂下壘土爲山之作系云天寳初六載丁亥公應詔退下元結諭友曰天寳六載詔天下有一藝詣轂下李林甫相國命尚書省皆下之遂賀野無遺賢于庭公上韋左相曰主上頃見徴倐然欲求伸靑冥却垂翅蹭蹬無縱鱗上鮮于京兆曰獻納紆皇眷中間謁紫宸破膽遭前政隂謀獨秉鈞正謂此邪九載庚寅紀十一月封華岳十載辛卯公年四十公奏三大禮賦元稹誌曰賦奏命宰相試文授右衞率府胄曹吏云公奏賦帝竒之命待制集賢院召試文授河西尉不拜改右衞率府胄曹公官定後戲贈曰不作河西尉淒涼爲折腰老夫怕奔走率府且逍遥莫相疑行曰憶獻三賦蓬萊宫自怪一日聲烜赫集賢學士如堵墻觀我落筆中書堂史集皆以爲十三載桉帝紀十載行三大禮十三載未當郊况表云臣生長陛下淳樸之俗行四十歳矣故知當在今歳原叔云新書作召試京兆府兵曹新書乃今舊書也今書作胄曹進西岳賦表乃云委學官試文章皆不同除夕曲江族弟位宅守歳曰四十明朝過年譜云上韋左相詩云鳯曆軒轅紀龍飛四十春壯遊放蕩齊趙間裘馬頗淸狂快意八九年西歸到咸陽則公歸自齊趙乃應詔奏賦又數年間事也十三載甲午公年四十三玄宗紀秋八月甲子朔文部侍郎韋見素拜中書門下平章事公贄見韋左相詩云龍飛四十春又曰愚蒙但隱淪則此詩似未獻賦前封西岳賦表云臣本杜陵諸生年過四十又云蓋長安一匹夫爾次歳國家有事郊廟幸得奏賦待制於集賢委學官試文章再降恩澤送隷有司參列選序則此賦又在三大禮賦後詩史以爲十二載未詳紀二月丁丑楊國忠爲司空公表云陛下元弼克生司空斯文不可寢巳則此賦當在未封西岳前而紀封華岳在九載又當考也十四載十一月安禄山反䧟河北諸郡公有自京赴奉先作註云此年十一月作集註云公在率府欲辭職遂作去矣行而家屬先在奉先詩史云葪北反書未聞公巳逸身畿甸十五載丙申公年四十五禄山僣帝于東京公在奉先以舅氏崔十九翁爲白水尉故適白水有髙齋三十韻六月辛未賊入潼關駕幸劒外七月甲子肅宗即位靈武公漸北過彭衙行曰憶昔避賊初北走經險艱夜深彭衙道馮翊界月照白水山屬同州少留周家窪欲出蘆子關七月寓于鄜川有三川觀漲詩鄜州屬縣曰我經華原來長安北公羸走靈武賊得之故贈韋評事詩曰昔沒賊中時潜與子同遊公沒賊中有九日藍田崔氏莊以下十三首至德二載丁酉公年四十六公春在賊中曲江行曰少陵野老吞聲哭春日潜行曲江曲自正月乙卯禄山死二月戊子肅宗次鳯翔李光弼敗安慶緒于太原郭子儀敗安慶緒于潼關又敗于永豐倉公西走鳯翔逹鳯翔行在曰西憶歧陽信無人遂却回又曰司隷章初覩南陽氣巳新又述懷曰去年潼關敗妻子隔絕乆今夏草木長脫身得西走元微之誌云歩謁肅宗行在拜左拾遺舊書云自京師宵道赴河西謁肅宗於彭原新書云拜右拾遺非是房綰罷相印甫上䟽不冝免帝怒詔三司雜問以張鎬言帝解赦之公有狀謝口勑又有六月十二日薦岑參諌官狀皆可考新史云自是帝不甚省録公家寓鄜彌年孺弱至餓死許甫往省親吕汲公考云八月墨敕放還鄜州有北征詩舊史云肅宗怒貶甫爲華州司功曹非是實録言御史大夫韋陟言當考北征曰皇帝二載秋閏八月初吉杜子將北征蒼茫問家室贈節度李重進曰靑𫀆朝士最苦者白頭拾遺徒歩歸閏八月朔甲寅賊安慶緒㓂好畤渭北節度李光弼進戰却之渭北壘空公得北首鄜路送韋宙同谷曰鑾輿駐鳯翔受詞太白脚秋旋自鄜畤扈從還闕贈嚴賈二閣老曰法駕還雙闕王師下八川此時霑奉引佳氣拂周旋十月丁卯天子還闕公臘日供奉紫宸曰臘日常年暖尚遥今年臘日凍全消十二月上皇至自蜀以蜀郡爲南京鳯翔爲西京西京爲中京乾元元年戊戍公年四十七春公有紫宸退朝口號賡賈至朝大明宫宣政殿晚出左掖又退朝出左掖直夜題省中壁等詩微之誌公左拾遺歳餘以直言出華州司户悲往事繫曰至德二載甫自京金光門出道歸鳯翔乾元初從左拾遺移華州掾與親故别因出此門有悲往事曰近得歸京邑移官豈至尊必大臣有不樂公者至華題鄭縣亭子曰雲斷岳蓮臨大路天晴宫柳暗長春唐官儀功曹主秋賦公有秋䇿問進士七月代華牧論殘㓂狀上朝廷䇿士丈公及冬出潼關東征洛陽道史不載有閿卿姜七少府設鱠及湖城遇孟雲卿歸劉顥宅飲宿等詩二年己亥公年四十八春留東都三月九節度之師潰于滏水郭子儀斷盟津退守洛師公有新安吏石壕吏等詩歸華放情山水間甞遊伏毒寺有憶鄭南曰鄭南伏毒寺蕭灑到江心鮑公詩譜云夏去華之秦公有秋華下苦熱曰七月六日苦炎蒸對食暫餐還不能立秋後題曰平生獨往願惆悵年半百罷官亦由人何事拘形役自是有浩然志史云關輔餓輒棄官去客秦州貧採橡栗自給有秦州二十首曰滿目悲生事因人作逺遊遲回度隴怯浩蕩及関愁公厭秦隴要衝人事煩夥西南命駕遊同谷别賛上人曰天長關塞寒歳莫飢凍逼野風吹征衣欲别向曛黒冬十月發秦州曰我衰更嬾拙生事不自謀無食思藥土無衣思南州至同谷作七歌寓同谷不盈月十二月一日發同谷曰始來兹山中休駕喜地僻柰何迫物累一歳四行役公自京至華至秦至同谷赴劒南凡四史曰同谷採橡栗自給流落劒外公詩云邑有佳主人又曰臨歧别數子握手淚再滴非寥落而遷殆迫於宼攘也送韋宙從事同谷曰此邦承平日剽切吏所羞又曰古來無人地今代橫戈矛當時必爲羌戎所迫但史不載止云十二月史思明㓂陜州公度栗亭趨劒門木皮嶺曰季冬携童稚辛苦赴蜀門鹿頭山曰鹿頭何亭亭是日慰飢渴連山西南斷俯見千里豁冀公柱石姿論道邦國活裴冕鎮成都公遂下居錦江成都曰我行山川異忽在天一方自古有覊旅我何苦哀傷上元元年庚子公年四十九裴兾公爲公卜居成都西郭浣花溪成都記草堂寺府西七里浣花寺三里寺極宏麗公卜居曰浣花流水水西頭主人爲卜林塘幽公寓浣花雖有江山之適羈旅牢落之思未免故二年之間有赴靑城縣成都西暫如新津出成都寄陶王二少尹寄髙彭州投簡成華兩縣諸子等詩柳芳曆曰髙適乾元初刺彭州公乾元初客秦有寄適于彭州上元𥘉適牧蜀而公乃有寄髙彭州詩當考二年辛丑公年五十紀夏四月劒東東川節度兵馬使叚子璋反䧟綿州節度使李奐奔于成都五月劒南節度使崔光逺克東川叚子璋伏誅公戲作花卿歌曰成都猛將有花卿學語小兒知姓名綿州刺史着柘黃我卿掃除即日平子璋髑髏血糢糊手提擲還崔大夫李侯重有此節度人道我卿絶丗無舊唐傳云梓州刺史叚子璋反以兵攻東川節度使李奐適率州兵與西川節度崔光逺攻子璋斬之西川牙將花驚定者恃勇旣誅子璋大掠東蜀新史云梓屯將叚子璋反適從崔光逺討斬之而光兵不戢遂大掠天子怒遂以適代爲西川節度紀傳與此詩皆不同當知公紀事爲審也九月壬寅大赦去上元號稱元年以十一月爲歳首以斗所建爲名公草堂即事曰荒村建子月獨樹老夫家春秋變古則書之公此意也年譜與史云嚴武鎮成都甫往依焉新史云上元二年冬黃門侍郎鄭國公嚴武鎮成都奏爲節度參謀檢校尚書工部貟外郎賜緋魚公先赴成都裴公爲卜居浣花里譜傳皆非是嚴中丞枉駕見適系云嚴武東川除西川勑除兩川都節制詩云元戎小隊出郊坰問柳㝷花到野亭川合東西瞻使節地分南北任流萍辤意皆與傳異詩史云地志劒西益彭蜀其州二十有八劒東梓綿劒普十州綿爲都會肅宗實録子璋盗綿州改年黃龍州曰龍安府代宗實録武京兆少尹御史中丞賊思明阻兵京師頗自矜大命綿州刺史未幾東劒節度詔兩劒一道新傳坐房綰貶巴州乆之遷東川玉壘記是年崔光逺尹成都花驚定平叚難而士卒剽掠士女至斷腕取金詔監軍按其罪十二月恚死寳應元年壬寅上元二年九月改元年二年四月改寳應武至成都公奉和嚴中丞西城晚眺詩蜀困於調度嚴數從公往來寄題杜二錦江野亭云莫倚善題鸚鵡賦何須不着鵕鸃冠公酬云謝安不倦登臨賞阮籍烏知禮法踈公結廬浣花渉三年草堂曰經營上元始斷手寳應年浣花曰萬里清江上三年落日低四月己已代宗即位召武公送嚴入朝曰鼎湖瞻望逺象闕憲章新四海猶多難中原憶老臣送嚴到綿州同登杜使君江樓曰歸朝送使客落景惜登臨詩史召武爲太子賔客傳還拜京兆尹爲二聖山陵橋道使封鄭公遷黃門侍郎公初與武云中丞梓州九日贈武曰大夫此詩曰侍郎再鎮蜀曰上嚴鄭公前後自可考也晚月呈漢中王多在中秋七月劒南西川兵馬使徐知道反八月已未伏誅公吟射洪曰南京亂初定故公欲駕梓至梓巳重陽九日登城九日奉寄嚴大夫曰不眠持漢節何路出巴山嚴巴嶺荅曰昨向巴山落日時兩郷千里夢相思時嚴猶未出巴地也秋歸成都迎家遂徑往梓十一月往射洪縣南途中有作南之通泉縣亦梓州邑適郭代公故宅陪王侍御因登東山最髙頂宴姚通泉晩攜酒涪江汎舟皆一時作也廣德元年癸卯春日梓州登樓曰行路難如此登樓望欲迷又曰厭蜀交遊冷思呉勝事繁應湏理舟楫長嘯下荆門公巳有東下之興公送辛貟外暫至綿還梓州陪章侍御宴南樓陪章侍御惠義寺秋章梓州水亭時公將適呉楚留别章使君留後曰終作適荆蠻安排用莊叟秋故相房琯薨公有九月壬戍祭房公文公轉遊閬中爲閬州王使君進論巴蜀安危表警急曰玉壘雖傳檄松州巳解圍系云時髙公適領西川莭度使時吐蕃犯塞爲中國患公痛其猖獗疾蜀無善將以守要害明年武再出鎮蜀道始安是歳君𥙷京兆功曹不赴二年甲辰公年五十三公自梓之閬有閬山歌等詩送李梓州之任并寄章十侍御系云初時罷梓州刺史東川留後將赴朝廷二公交印正在今春有將赴荆南遊有將赴荆南寄别李劒州遊子曰巴蜀愁誰語呉門興杳然公時意未有所適㑹嚴武復節度劒南東西川公往依焉贈武曰殊方又喜故人來重領還湏濟丗才甞怪偏禆終日侍不知旌節隔年囬房琯薨閬州贈一品公别房太尉墓曰他郷復行役駐馬别孤墳自閬州領妻子却赴蜀山三首曰汨汨避羣盗悠悠經十年不成向南國復作遊西川將赴成都草堂途中有作先寄嚴鄭公旋錦江贈王侍御曰一別星橋夜三回斗柄春亦曰猶得見殘春微之誌曰劒南節度嚴武狀爲工部貟外郎參謀軍事公楊旗系云二年夏六月成都尹鄭公置酒公堂觀騎士新旗幟曰三州䧟犬戎但見西嶺青代宗紀曰廣徳元年失松維州柳芳歷廼曰糧運絶西川節度髙適不能軍吐蕃䧟松維保三州以公詩考之當然武軍城早秋曰昨夜秋風入漢関朔風邊雪滿西山更催飛將追驕虜莫遣沙埸匹馬還公和曰秋風嫋嫋動髙旌玉帳分弓射虜營巳収滴愽雲間戊更奪蓬婆雪外城遣悶曰胡爲來幕下只合在舟中黄卷真如律青袍也自公公放誕不樂吏檢雖鄭公禮寛心契尤毎見意史云性褊躁傲誕甞醉登武床瞪視曰嚴挺之乃有此子武亦暴猛外若不忤中衘之一日欲殺甫及梓州刺史章彛集吏於門武將出冠鈎于簾三左右白其母奔救得止獨殺彛舊史不載以公詩考之武來鎮蜀彛巳交印入覲公再依武相歡洽無恨之意史當失之永㤗元年乙巳公年五十四正月三日竟歸溪上有作簡院内諸公曰白頭趨幕府深覺負平生夏四月庚寅嚴公薨公有哭歸柩五月癸丑詔定襄郡王郭英乂節度劒南紀閏十月劒南西山兵馬使崔旰反㓂成都郭英乂奔于靈池普州韓澄殺之崔寜傳寕本名旰永㤗元年武卒行軍司馬杜濟等請郭英乂爲節度寧亦丐大將王崇俊朝廷次用英乂英乂恨之召寧寧不敢還英乂自將討之寕還攻英乂英乂不勝走靈池於是劒南楊子琳起瀘州與卭州栢貞節連和討寧明年詔杜鴻漸山西劒南等道副元帥平其亂入成都政事一委寧乃表貞節爲卭州刺史子琳爲瀘州刺史以和解之大曆三年寜來朝楊子琳襲取成都以公詩考之成都亂再至東川相從行曰我行入東川十歩一回首成都亂罷氣蕭瑟浣花草堂亦何有梓州豪桀大者誰本州從事知名乆公歸成都止以嚴公再鎭草堂曰昔我去草堂蠻夷塞成都今我歸草堂成都適無虞請陳初亂時反覆乃須臾大將赴朝廷羣心起異圗中宵斬白馬盟欿氣巳麄西收卭南兵北斷劒閣隅布衣數十人亦擁專城居系云即楊子琳柏貞節之徒賤子且奔走三年望東吴弧矢暗江海難爲遊五湖不忍竟舎此復來薙榛蕪入門四松在歩堞萬竹踈營屋云愛惜巳六載兹辰去千竿以詩訂傳云大將赴朝廷羣小起異圗以爲嚴公後來公無再歸草堂之跡以爲崔旰史云大曆三年入朝寜本名旰至是賜名留其弟守成都楊子琳乗間起瀘州以精騎数千襲據其城寧妾任募勇士自將以進子琳引去公厭蜀思吴下荆門遂南下夏艤戍州燕戎州使君東楼瑜州候嚴六侍御至忠州有燕使君姪宅及夏泊雲安至十二月一日三首今朝臘月春意動雲安縣前江可憐公巳不樂雲安欲遷䕫趙傁以爲永㤗元年四月嚴武卒五月下忠渝大曆元年在雲安與詩文皆差一年髙常侍永㤗元年正月卒公有聞髙常侍亡系云忠州作知公以永㤗元年下渝忠但草堂所紀却是嚴公薨後事不敢妄定姑從舊次大曆元年丙午公年五十五題子規曰峽裏雲安縣江樓翼瓦齊移居夔州郭曰伏枕雲安縣遷居白帝城春知催柳别江與放船清客居曰西南失大將啇旅自星奔今又降元戎巳聞動行軒此詩方及失大將聞杜鴻漸出鎮與史年亦差暮春遷居瀼西有暮春題瀼西新賃草屋五首大曆二年丁未公年五十六在夔州西閣立春日巫峽寒江那對眼杜陵逺客不勝悲兩詩曰冥冥甲子雨巳度立春時資治通鑑大曆二年正月辛亥朔至十三甲子諺云春雨甲子赤地千里移居赤甲有入宅赤甲二詩曰卜居赤甲遷居新兩見巫山楚水春三月自赤甲遷居瀼西有小居暮春題瀼西新賃草居五首秋又移居東屯有瀼西荆扉且移居東屯茅屋四首曰東屯復瀼西一種住青溪來往皆茅屋淹留爲稻畦訖冬居䕫大曆三年戊申公年五十七太歲日曰楚岸行將老巫山坐復春時第五弟漂泊江左近得消息逺懷頴觀等曰陽翟空知處荆南近得書正月中旬定出三峽曰自汝到荆府書來數喚吾頌椒凉風詠禁火卜懽娱公因觀在荆楊遂發棹有將别巫峽贈南卿兄瀼西果園四十畒曰正月喧鸎末兹辰放鷁初夏有和江陵宋大少府雨後同諸公及舎弟宴書齋秋又不安於荆南舟中出南浦奉寄鄭少尹曰更欲投何處飄然去此都是秋移居公安荆南属邑府南九十里復東下發劉郎浦十道志在荆州曰掛㠶早發劉郎浦疾風飄飄昏亭午曉發公安系云數月憇息此縣泊岳陽城下巴陵郡曰岸風翻夕浪舟雪洒寒燈則冬至岳陽矣大曆四年已酉公年五十八陪裴使君登岳陽樓曰雪岸叢梅發春泥百草生敢違漁父問從此更南征公將適潭詩譜云此年春自岳陽至潭遂如衡畏熱復廻夏將如㐮陽秋將歸秦皆不果卒留潭自是率舟居詠懷及上水遣懐及銅官渚守風皆自岳陽入潭時作蓋自岳之潭之衡爲上水而自衡回潭爲順水詩皆可考五年庚戍公年五十九春去潭至衡清明曰著處繁華憐是日長沙千人萬人出則公在潭至夏湖南兵馬使臧玠殺其團練使崔灌又是嵗湖南將王國良反及西原蠻㓂州縣故公益南至衡山縣謁文宣新學堂呈陸宰及入衡州備述臧玠等亂末云橘井舊地宅仙山引舟航此行厭暑雨厥土聞清凉諸舅剖符近開緘書札光橘井在郴州諸舅請崔偉前有送二十三舅録事之楊郴州詩公將往依焉公又至耒陽州東南遊岳祠大水遽至渉旬不得食聶耒陽以公阻水致酒肉療飢荒江詩得代懷興盡夲韻至縣呈聶令傳云令甞饋牛䏑白酒大醉一夕卒王彦輔辨之爲詳以詩考之公在耒陽畏瘴癘是夏賊當巳平乃㳂湘而下故回棹之什曰衡岳江湖大蒸池疫癘偏羅含湘中記蒸水注所又順浪飜堪倚回㠶又省牽登舟將適漢陽曰春宅棄汝去秋㠶催客歸又暮秋將歸秦留别湖南幕府親友則秋巳還潭暮秋北首其卒當在衡岳之間秋冬之交元微之誌云子美之孫嗣業啓子美之柩㐮袝事於偃師途次于荆拜余爲誌辭不能絶其略云扁舟下荆楚竟以寓卒旅殯岳陽吕汲公年譜云大曆五年辛亥是年夏還㐮漢卒於岳陽以詩考之大略可見傳言卒於耒陽非也汲公云是夏亦非也今九域志衡州有公墓又未知信然或附㑹邪
