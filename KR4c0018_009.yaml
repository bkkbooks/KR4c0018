  text: 分門集註杜工部詩卷第九
  hash: sha256:3b52fd1a884e38c328732c524c34ba7ba7898f335b485b0bca5072d6cf7beb27
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_009-1a}
body:
  text: 皇族丗胄附古詩三首律詩九首哀王孫洙曰前漢韓信至城下釣有一漂母哀之飯信竟至數十日信謂漂母曰吾必重報母怒曰大丈夫不能自食吾哀王孫而進食豈望報乎王孫如言公子也王深父云安禄山驚潼閞玄宗倉卒西幸諸嗣王及公主之在外者皆不及後其後多爲禄山所屠鮮有脫者此詩記而哀之嗚呼以四海之廣人帝之尊念罔終則辱其子孫如此豈孟子所謂以其所不愛及其所愛者歟長安城頭頭白烏蘇曰陳伯辨云烏有數種慈烏比他烏微小反哺之聲可聽大喙及白頭者皆不能反哺然不謂之孝烏謂之慈烏者盖受哺之際乃其母作声張口揺翅如母哺子狀亦其母慈所致或謂頭字當作頸盖烏無頭白者夜飛延秋門上呼蘇曰神堯初得天下夜有飛鵲数百皆集延秋西門呼鳴至夜分方散又向洙曰一作來人家啄大屋屋底達官走洙曰唐書木稼逹官避胡趙曰白烏之號不祥也天寳十五載禄山䧟潼閞明皇幸蜀從延秋門岀烏飛號於門上暗言乗輿之出也乗輿旣岀矣公卿寕不逃避邪金鞭斷折九馬死洙曰折石列切骨肉不待同馳驅腰下寳玦靑珊瑚鄭曰玦古穴切洙曰左傳晉侯佩太子以金玦可憐王孫泣路隅問之不肯道姓名蘇曰陳遺過武功道中逢異人曰子先辱後榮遺與語荅問俱有理遺怪問姓名居住不荅乃長揖下路入竹林中不知所之但道困苦乞爲奴趙曰齊建安王子真𬒳誅入床下叩頭乞爲奴贖死不從巳經百日竄荆棘身上無有完肌膚髙帝子孫盡髙凖龍種自與常人殊洙曰漢髙祖爲人隆凖而龍顔服䖍曰凖音拙應劭注曰隆髙也凖頰權凖也李斐曰凖鼻也文頴曰音凖的之凖晉灼曰戦國䇿云眉目凖類權衡史記秦始皇蜂目長凖李說文音是也趙曰隋文帝子勇勇子􅌂雲昭訓所生乃雲定興女文帝喜曰皇太孫何謂生不得其地定興奏曰天生龍種所以因雲而岀豺狼在邑龍在野王孫善保千金軀洙曰易龍戦于野䜟四夷雲集龍闘野千金之子坐不垂堂趙曰倣陸士衡願保金石軀而千金軀字又用沈約雜詩坐䘮千金軀不敢長語臨交衢且爲王孫立斯須洙曰周禮䟽云舞交衢文選白骨交衢崔豹古今注大路交衢悉施華衣長音仗乃刺言也交衢謂路交錯要衝之所甫與之問荅不敢私言但共立少頃恐爲姦人窺伺故也昨夜東洙曰一作秦風吹血腥東來槖駞滿舊都洙曰師古曰橐駞言能負囊槖而䭾物也史思明傳禄山䧟兩京以駝運兩京御府珎寳於范陽不如紀極鮑曰陳來槖駞謂賊自東都進也舊都謂長安也朔方健兒好身手昔何勇銳今何愚洙曰丗說桓車騎過江時公私儉薄自使健兒鼓行劫鈔師曰哥舒翰領朔方兵守潼閞一日爲賊敗如入無人之境昔禦吐蕃稱精兵今何敗北皆歸於賊故云云竊聞太子巳傳位洙曰明皇傳位于肅宗聖德北服南單于鄭曰單時連切蘇曰霍光曰聖德北服單于南化蛮貊民䧍淳厚土各守職花門𠢐靣請雪耻鄭曰𠢐憐題切洙曰時回紇助順師曰南單于即回紇也花門乃回紇地名甫有題花門詩囘紇以花門自號𠢐靣謂披其靣皮示誠悃也慎勿岀口他人狙洙曰後漢耿秉卒匈奴聞之舉國號哭或至梨靣流血梨即𠢐字𠢐割也古通用師曰租切聽也甫欲王孫慎宻其事恐爲諜者所得哀哉王孫慎勿踈五陵佳氣無時無洙曰漢書曰髙帝葬長陵惠帝葬安陵景帝葬陽陵武帝葬荗林昭帝葬平陵謂之五陵選北眺五陵趙曰後漢王伯阿望舂陵城曰氣佳哉欎欎葱葱公之願本朝興復如此師曰玄宗幸蜀諸王流離不見収録安知五陵嘉氣中無天子岀乎故以勿踈爲戒奉贈李八丈判官我丈時英特宗枝神堯後洙曰神尭唐髙祖也珊瑚市則無洙曰珊瑚至珍也非市中所有之物騄驥人得有洙曰孔子曰驥不稱其力稱其德也故在人則有之趙曰騄耳與騏驥穆天子八駿中有之故云人得有早年見標格秀氣衝星斗洙曰劎埋没於豐城而氣衝星斗之間言不可掩也事業冨清機蘇曰曹顔遠思友詩精義側神奥清機發妙理官曹正獨守頃來樹嘉政皆巳傳衆口艱難體貴安趙曰當艱難而爲政不優其大躰貴在安靜冗長吾敢取洙曰言於艱難之際能脫畧細務也鄭曰長直亮切多也夢符曰右按文選文賦文固無取乎冗長蘇曰漢文帝冗長中似人者亦可采取趙曰凡物之剰者爲冗長長去声陸機文賦今言爲政本分之外其如物之冗長者吾不取之吾字李丈自言也區區猶歷試炯炯更持乆討論實解頥操割紛應手洙曰前漢匡衡曰匡說詩解人頥注使人笑不能止也篋書積諷諌宫闕限奔走洙曰限值也值天子播迁也趙曰雖有諌書之多積滿朝篋而身則限不能造宫闕也亦詩曰駿奔走舊注非入幕未展材洙曰一作懷幕府也夢符曰右按晉史郄超在桓温幕下謝安在外望見超曰郄生可謂是入幕之賔也秉鈞孰爲偶洙曰鈞鈞衡也詩秉國之鈞言作相所親問淹泊趙曰公自謂傳云愛其所親也楚辝王逸注曰泊止也泊與薄同汎愛惜衰朽趙曰論語汎愛衆如殷仲文云廣筵散泛愛遂以爲朋友之呼矣垂白亂南翁委身希北叟洙曰馬融傳論得北叟之後福淮南子北叟失馬人皆吊之北叟曰此何詎不爲福居数月其馬將駿馬而歸人皆賀之對曰此何詎不爲禍家冨馬良其子好騎墮而折卑人皆吊之對曰此何詎不爲福居数年胡夷大入丁壯者皆控弦而戰塞上之人死者十九此獨以跛之故父子相保也趙曰前漢項籍泛范增說項梁云南公稱曰楚雖三户云秦必楚注云南公南方之老人也北叟岀班固幽通賦云北叟頗識其倚伏則指塞上之父爲北叟也舊注引淮南子遂輒塞上之人爲北叟不知事則用淮南子塞翁失馬而字則班固也眞成窮轍鮒洙曰轍中之鮒呼莊周求斗水之活或似喪家狗洙曰孔子丗家纍櫐如䘮家狗秋枯洞庭石風颯長沙栁髙興激荆衡知音爲回首趙曰水落石岀所以爲枯也洞庭長沙荆與衡皆相連之地師曰洽聞記拂國岀珊瑚生水厎大船載鐵網下水取之東方朔云騏驥緑耳天下之良馬二物不可多得喻李公人百希有曹顔逺思交詩精義側神奥清機發妙理公有機謀故能建立事業又能守官忠正躰正躰也艱難之際貴以清静爲政冗長吾敢取言不以煩碎爲務也持乆言待心始終丗說桓席武與郄昭議芟荑朝臣條牒旣定其夜同宿明晨起呼謝安王坦之入擲䟽示之郄猶在帳内謝含笑曰郄生可謂入幕賔矣秉鈞宰相之職孰爲偶言非李之匹敵也所親言李與杜同出陶唐氏南翁甫自稱言寓居荆南也北叟塞翁也失馬云未必不爲福及得馬又云未必不爲禍甫委身之窮達希慕乎北叟洞庭長沙皆荆南之地知音爲囘首言有所思於李也别李義彦輔曰公自言杜與李司岀於陶唐氏故此詩言余亦忝諸孫也詩云中外貴賤殊乃與義爲表昆弟非李杜同岀扵陶唐氏神堯十八子十七王其門道國洎舒國實惟親弟昆洙曰唐髙祖二丨二子而此止云十七王其門未詳也道王名元慶第十六子也舒王元名第干八子也鮑曰髙祖二十二子道王元慶舒王元名衛懷王玄霸楚哀王智雲皆先薨太子建成巢王元吉以事誅詔除籍故止言十八太宗有天下故有十七子封王也中外貴賤殊師曰義宗姓爲内甫異姓爲外故云貴賤殊余亦忝諸孫趙曰神堯唐髙祖也按史有二十二子而今詩云十八子者學者尚疑之道名元慶第十六子也舒王元名第十八子詳味詩意則李義者道國之裔孫而公則舒國後裔之外孫也舊注云公自言杜與李同岀於陶唐氏是何夢語丈人嗣王業洙曰唐制諸子襲封者謂之似王趙曰丈人指言李義之父也似王業則継似前王之業也舊注云襲封謂之似王其說誤矣之子白玉温趙曰稱李義也謂其温如玉也道國繼德業請從丈人論趙曰申言丈人乃道國之後其能継其德業者請從李義之父言之也丈人領宗卿洙曰宗正卿也肅穆古制敦馬曰肅穆欽和貌古制敦謂敦厚宗族也先朝納諌諍馬曰先朝指太宗也直氣横乾坤子建文筆壯河間經術存洙曰曹子建能文漢河間王能明於經術献禮樂建三雝之教趙曰子建魏陳留王曹植也能文章漢景帝河間献王德也明於經術以此言李義之父温克冨詩禮骨淸慮不喧洗然遇知巳談論淮湖奔洙曰言談論鋒起若淮湖奔注不可涯涘也蘇曰梁衡曰見王戎談論如淮湖傾注源流莫可擬此而測掩也憶惜初見時小𥜗洙曰一作孺繡芳蓀洙曰文選芳蓀紫綺爲上𥜗𥜗袴也趙曰自經術存而下皆李義襦短衣也賈誼過秦論云衰者利短褐注曰一作短小襦也舊注妄添選五言詩爲七字云芳蓀紫綺爲上𥜗何輒附會如此長成忽㑹靣慰我乆疾魂三峽春夏交江山雲霧昏正宜且聚集恨此當離罇莫怪執盃遟我衰涕唾煩洙曰王仲宣愬盃行遟解嘲涕唾流珠沫趙曰舉杯西我獨執之遟盖以涕唾煩故也舊注引但訝盃行遟却是訴主人行盃之遟耳何于此義重問子何之西上岷江源洙曰順流爲㳂逆流爲泝自夔入蜀泝流也故曰西上願子少干謁蜀都足戎軒誤失将帥意不如親故恩洙曰甫幾不能脫嚴武之暴又爲郭英乂所不容有是句少年早歸來梅花巳飛翻趙曰王粲四言詩曰苟非鴻鵰孰能飛弩力慎風水洙曰言丗若風波也趙曰舟行之所慎也豈惟數盤飱洙曰所謂加飱食也猛虎卧在岸蛟螭出無痕洙曰言所在皆害人者也此皆譏時王子自愛惜老夫困石根生别古所嗟發聲爲爾吞洙曰王子稱李義也困石根言不得其地也吞声言声岀而復吞也贈特進汝陽王二十韻洙曰舊注王名僎天宝中封爲王祕書監同正貟父棣王琰乃玄宗第四子也琰妃韋氏少師之女也新注按唐史詩皇帝長子璡封汝陽位特進僎位祕書監此詩乃贈璡非僎也璡巳見八哀詩云鮑曰璡譲皇帝子新史書贈太子太師不書特進失之舊史言小特進贈太子太師与公詩合趙曰公八哀詩太子太師汝陽王璡曰汝陽譲帝子而舊注又以此爲棣王琰之子何自眩惑也此詩在八哀詩所贈之先盖其特進時爾特進正二品而太子太師一品也特進群公表洙曰漢官儀曰諸侯功徳優盛朝廷所敬異者賜位特進在三公下特進漢官也二漢及魏晉以加官表儀表也天人夙德升洙曰邯郸淳見曹植才卞歸對其所知歎植之才謂之天人夙早也霜蹄千里駿洙曰武帝謂劉徳爲千里駒師古曰其所言若駿馬可致千里也風翮九霄鵬洙曰莊子鵬怒而飛其翼若垂天之雲摶扶摇而上者九万里服禮求毫髮洙曰僖二十三年傳服於有礼社稷之衛趙曰言礼无纎毫違背推忠忘寢興聖情常有眷朝退若無慿洙曰不挾貴也仙醴求浮蟻洙曰醴一作醖師古曰醖甘酒也少麴多米一宿而熟不斉之漢書楚元王敬礼申公穆生不嗜酒王毎置酒甞爲穆生設醴曹子建七啓云浮蟻鼎沸酷烈馨香竒毛或賜鷹蘇曰隋文帝賜楊素白花角鷹淸閞塵不雜洙曰㑹稽典録丁寛門无雜賔劉孝標論不雜風塵也中使日相乗洙曰吴志朱然傳中使日食之物相望於道晚節嬉遊簡洙曰不以嬉遊爲務也平居孝義稱自多親棣萼洙曰友爱兄弟也誰敢問山陵洙曰後漢東平王蒼傳帝欲爲原陵顯莭陵起縣邑蒼聞之遽上䟽諌帝從而止自是朝廷毎有疑故輒以驛使諮問蒼於是悉心以對皆見幼用學業醇儒冨洙曰賈生涉獵書記不能爲醇儒醇者不雜辭華哲匠能秦曰殷仲文詩哲匠感蕭辰筆飛鸞聳立章罷鳯騫騰洙曰羡其書翰也精理通談笑洙曰雖談笑皆精於理道忘形向友朋洙曰不驕也寸腸堪繾綣洙曰寸腸取必也昱曰板詩以謹繾綣注反覆也鄭曰上去演下古轉切謹慎貌一諾豈驕矜洙曰一諾見鄭諌義詩注巳忝歸曹植洙曰見天人夙徳升注何知對李膺後漢杜宻傳黨錮事起宻与李膺俱坐而名行相次故時人亦李杜前有李固杜喬故言亦也范滂丹曰汝得与李杜斉名死亦何恨謂膺宻也子羙對汝陽謙辝也招要恩屢至鄭曰要伊消切崇重力難勝洙曰子美自言雖蒙招要之恩而礼意崇重非力所能勝也披霧𥘉歡夕洙曰衛瓘見樂廣曰見此人瑩然若披雲霧而覩青天也髙秋爽氣澄樽罍臨極浦鳬鴈宿張燈花月窮遊宴炎天避欎蒸石曰猶河朔避暑之地硯寒金井水洙曰荆州記益陽有金井数百古老傳金人以杖撞地輒成井簷動王壼冰洙曰鮑明遠詩清如玉壷冰瓢飲唯三逕洙曰顔囘一聖蔣許三逕巖栖異一塍洙曰謝靈運詩栖岩挹飛泉百層髙絶也謬持蠡測海洙曰東方朔論曰以管窺天以蠡測海張晏曰蠡瓠飘也師古曰蠡來弋反師曰今辱宴會酒量非公敵故云云况挹酒如澠鄭曰食陵切洙曰昭十二年傳晉侯与吝宴中行穆子相投壷晉侯先穆子曰有酒如淮有肉如坻寡君中此爲諸侯師中之斉侯㪯矢曰有酒如澠有肉如陵寡人中此与君代㒷亦中之昱曰澠水岀斉囯臨淄縣北入時水鴻寳全寧祕洙曰劉向傳上復㒷神仙方術之事而淮南有枕中鴻宝苑祕書師古曰鴻宝苑袐書並道術篇名藏在枕中存録之不漏泄也丹梯庶可陵洙曰謝玄暉敬山亭詩要欲追竒趣即此陵丹梯淮王門有客洙曰一作門下客淮南王安之善屬文天下方術之士多往帰焉於是遂与蘇飛李向左吴田由雷𬒳晉昌時等八人及諸儒大山小山之徒其溝淪道德緫統仁義而著鴻烈解也終不愧孫登洙曰晉隱逸孫登傳𥘉楊駿徵髙士孫登遺以布𬒳登截𬒳於門大呼曰斫斫刺刺後梁如其言登傳云好讀易甞抚一絃琴見者皆親樂之黎余幽憤詩曰昔慚桞下今愧孫登師曰楊駿无徳而登諷之璡无愧於甫故云云奉漢中王手扎國有乾坤大王今叔父尊洙曰王譲皇帝之子代宗之叔父也剖符來蜀道洙曰見将赴成都韋堂詩注歸蓋取荆門洙曰夷陵有荆門山其狀如闕然趙曰由荆門軍岀陸而往矣謂之取者取道之取也峽險通舟峻江長注海奔主人留上客避暑得名園趙曰在塗中借名以過憂也主人指爲郡之人前後緘書報分明饌玉恩天雲浮絶壁風竹在華軒趙曰觀絶壁之天雲對華軒之風竹言王名園中如此也巳覺良宵永何看駭浪翻洙曰海賦驚浪雷奔駭水迸集鮑明遠翻浪揚白鷗趙曰言時巳秋矣而風水稍定不復見浪之可駭也入期朱邸雪洙曰唐制諸侯各置邸京師故有邸吏朱邸言邸有朱户以冬爲入期故言雪謝玄暉朱邸亏開効蓬心於秋實趙曰以雪為期而至京也言制諸侯各置邸京師朱邸言邸以朱户故也朝旁紫㣲垣洙曰晉志紫宫垣一口紫微大帝之坐天子之所居也枚乗文章老洙曰西京雜記枚乗文章敏疾長卿制作淹遲皆盡一時之譽而長卿温麗枚乗時有累句故知疾行無善迹矣揚子曰軍庇之際戎馬之間飛書馳檄用枚乗廊廟之下朝廷之中髙文典冊用相如趙曰梁孝王時枚乗在諸文士之間年最髙舊注所引失公本意河間禮樂存洙曰景十三王河間獻王徳武帝時來朝獻雅樂對三雍宫又立博士修禮樂𬒳服儒術悲秋宋玉宅洙曰哀江南賦誅茅宋玉之宅趙曰宋玉宅在歸州言王在歸州又如悲秋之朱玉也失路武陵源洙曰見如逢武陵路詩生淹薄俱崖口東西異石根夷音迷咫尺洙曰楚俗語言多夷音鬼物傍洙曰一作倚黃昏洙曰蕪城賦木魅山鬼昏見晨趍犬馬誠爲戀洙曰曹子建表不勝犬馬戀主之情史記丞相翟青曰臣不勝犬馬之心趙曰公又言其有懷君之心狐狸不足論洙曰張綱傳豺狼當路安問狐狸從容草奏罷宿昔奉清罇趙曰此言漢中書爲上草奏旣罷當奉飲宴盖其清罇巳在昔日如此矣戲題寄上漢中王三首洙曰時王在梓州𥘉王乃斷酒不飲篇中有戲西漢親王子洙曰王譲皇帝之子汝南王璡弟也成都老客星洙曰公自喻也趙曰如嚴與光武同宿史占客星犯帝座百年雙白鬢一别五愁洙曰一作飛螢洙曰五飛螢則歳五換矣忍斷杯中物洙曰張翰曰使有身後名不如即時一杯酒蘇曰吴術好飲酒因醉詬權貴遂戒飲阮宣命飲術曰近斷飲宣以拳歐其背曰看看老逼癡漢忍斷杯中物耶抑而飲之秪看座右銘洙曰崔子玉有座右銘蘇曰桞渾冩座右銘自誡起坐皆書之行卧亦看不能隨皂蓋洙曰見陪王漢州遊房公西湖注趙曰皂蓋指漢中王也漢二千石朱􅙲皂蓋自醉逐浮萍䇿杖時能出修可曰吴越春秋載太王策杖去邠王門異昔遊洙曰謂其断酒也巳知嗟不起師曰言王以酒得病遂斷不飲未許醉相留蜀酒濃無敵洙曰蜀都賦􅜠以醥清一醉累月江魚美可求洙曰蜀都賦嘉魚岀於丙穴終思一酩酊蘇曰向秀曰長安酒家多好事兼酒味醇醲甚思得與嵆中散一醉淨掃鴈池頭洙曰廣漢郡有金鴈池古老相傳云有金鴈一雙隱於此池日岀見其影也趙曰此梓州詩而舊注引漢州鴈水以證豈于廣漢郡耶髙嶠詩云乗歡俯鳩池則往時素有鴈池之名於地可以泛指爲鴈池矣以俟明識鄭曰西京雜記梁孝王苑有鴈池群盗無歸路衰顔㑹逺方尚憐詩警䇿洙曰文賦云立片言以居要乃一篇之警䇿西征賦發闥卿之警䇿趙曰梁鍾嶸作詩品曰陳思贈弔仲宣七哀公幹思友阮籍詠懷靈運鄴中士衡擬古陶公詠貧之製惠連搗衣之作皆五言之警䇿者也猶憶酒顛狂魯衛彌尊重洙曰漢中王兄弟俱領重鎮蒭曰語云魯衛之政兄弟也漢中王與兄璡俱領重鎮徐陳略䘮亡洙曰魏文帝與王粲書云徐陳應劉一時俱逝何數年之間零落略盡趙曰言王賔客多䘮空餘枚洙曰一作故叟在應念早升堂洙曰枚叟公自喻也趙曰雪賦云召鄒生延枚叟鄭曰枚叟枚乗也戯作寄上漢中王二首王新誕明珠雲裏不聞雙鴈過掌中貪見一珠新洙曰三輔訣録曰孔融見韋乞将其父書曰不意雙珠生於老蚌蘇曰馬𣑽賀人有子曰欣得掌中之一珠趙曰幽明録張華言入九館之人所見癡龍𥘉一珠食之天地齊壽佛書云如掌中之珠秋風嫋嫋吹江漢洙曰謝靈運嫋嫋秋風過湘夫人云嫋兮秋風只在他郷何處人謝安舟楫風還起洙曰謝安嘗與孫綽等泛海風起浪涌諸人並懼安吟嘯自若舟人以安爲悅猶去不止風轉急安徐曰如此将何歸耶舟人黙然即回衆咸服其雅量梁苑池臺雪欲飛洙曰謝靈運雪賦歳将暮時旣昏寒風積愁雲繁梁王不悅游於兎園俄而微霰零落雪下杳杳東山携漢妓洙曰謝靈運携妓遊東山趙曰戯言漢中王謝安携妓東山之興尚杳杳然泠泠滫竹待王歸修可曰脩竹梁孝王園名也續漢書梁王兎園多植竹即所謂脩竹園地亦云孝王東苑方三百里苑中有鴈池脩竹園衡州送李大夫七丈勉赴廣州斧鉞下青冥洙曰禮賜斧鉞然後殺魏武九錫文犯關干紀罔不誅殛是用錫公斧鉞蘇曰何敬祖将軍新持斧鉞揔握虎符自青冥來鎮岷隴樓船過洞庭洙曰漢武征南越作樓船北風随爽氣洙曰登樓賦向北風而開襟王子猷西山致有爽氣南斗避文星日月籠中鳥洙曰潘安池魚籠鳥乾坤水上萍王孫丈人行洙曰匈奴云漢天子我丈人行垂老見飄零師曰諸侯賜斧鉞然後誅殺靑冥天也言天子賜李以節鉞樓船船上有樓櫓過洞庭迤邐之廣州北風隨爽氣言自北而南帶爽氣而來南斗避文星北斗以南公一人而巳籠中鳥局促不得騁子美客居局促如籠鳥飄如水萍豈意垂老之年尚見飄零失所乎行音項儔也送李卿曄王子思歸日長安巳亂兵趙曰王子指李曄也時有吐蕃之亂也霑衣問行在趙曰代宗車駕出幸陜也走馬向承明趙曰承明漢殿名暮景巴蜀僻春風江漢清晉山雖自弃魏闕尚含情趙曰按宣室志載庶史有道士尹君者隱晉山不食粟甞餌栢葉北門從事嚴綬敬事之莊子言身在江湖之上心遊魏闕之下丗胄古詩四首律詩二首寄狄明府博濟梁公曾孫我姨弟洙曰狄仁傑封梁國公母之妹妹之子曰姨弟不見十年官濟濟大賢之後竟陵遲浩蕩古今同一體比看伯叔四十人有才無命百寮底洙曰沉下位也今者兄弟一百人幾人卓絶秉周禮洙曰閔元年齊仲孫湫來省難及還公問魯可取乎對曰魯秉周禮未可動也言猶守先王之法度也此詩言兄弟雖多能守梁公之法幾人尓在汝更用文章爲長兄白眉復天啓洙曰馬良兄弟五人並有才名郷里諺曰馬氏五常白眉最良良眉中有白毛因以是爲稱左氏天将啓之汝門請從曽公說洙曰梁公也太后當朝多巧計狄公執政在末年濁河中不汚淸濟洙曰言獨立於朝不移於衆邪趙曰謝元暉始岀尚書省詩紛紛亂朝日濁河汚清濟國嗣初将付諸武公獨廷諍守丹陛洙曰武后當朝革唐爲周欲以武三思爲儲貳以問宰相皆莫敢對仁傑獨曰臣毎觀天下未厭唐德禁中冊決詔房陵洙曰房陵中宗所在前洙曰一作滿朝長老皆流涕洙曰狄仁傑傳𥘉中宗在房陵而吉頊李昭德皆有匡復讜言則天無復辭意唯仁傑每從容奏對事無不以子母恩情爲言則天亦漸省悟召還中宗太宗社稷一朝正漢官威儀重昭洗洙曰后甞夢雙陸不勝仁傑對曰雙陸不勝無子也因進說文皇帝身䧟鋒鏑而有天下以傳子孫陛下因監國掩而有之又欲以三思爲後且子母與姑姪孰親若立三思廟不袝姑后感悟即日迎中宗復唐社稷光武紀人見司隷僚属皆歎喜不自勝老吏或垂泣曰不圖今日復見漢官威儀時危始識不丗才蘇曰楊脩謂曹適曰時危始見不丗之才如孔文舉輩是也誰政荼苦甘如薺洙曰謝詩防口猶寛改食荼更如薺汝曹又冝裂土食身使門户多旌棨鄭曰康禮切兵欄說文曰傳信洙曰裂土一作裂鼎賢者之後冝有土趙曰杜田引唐制節度使就第賜旌節三品以上門立㦸後漢匈奴傳注曰有衣之㦸曰棨胡爲飄泊岷漢間干謁王侯頗歷詆洙曰詆訐也息夫躬歷詆漢朝公卿况乃山髙水有波秋風蕭蕭露泥泥洙曰謝詩疑露方泥泥鄭曰奴禮切濃露也虎之饑下巉喦蛟之横出清泚早歸來黃汙人衣眼易眯歐曰莫禮切物入眼中莊子簸糠眯目師曰甫意責博濟冝守梁公之禮法無逐奔競之風岷漢中山水險阻居官者率多麄暴動即相殘不啻虎蛟之吞噬是以勉其歸去無爲當路者所汚辱而疾之眯物入眼也古詩云昔爲掌上珠今爲眼中刺物入眼必不能容思有以去之如甫之衣嚴武尚幾爲所殺况餘人乎送李校書二十六韻鮑曰李舟也國史𥙷言舟好事與妹書曰釋迦生中國設教如周孔周孔生西方設教如釋迦天堂無則巳有則君子生地獄無則巳有則小人入則其人可知公故極稱道代北有豪鷹師曰大鷹也生子毛盡赤洙曰岱鍾二山岀鷹趙曰譬李舟也宋曰晉孫楚鷹賦曰有金剛之俊鳥生非陘之巖阻黄曰隋魏彦深鷹賦曰唯兹禽之化育實鍾山之所生而今公言亦此義也渥洼騏驥兒洙曰作種鄭曰渥於角切洼烏瓜切水名趙曰東方朔曰騏驥緑耳天下良馬也尤異是龍脊洙曰一作虎趙曰尔雅曰騮馬黄脊李舟名父子趙曰前漢蕭育傳王鳯以育名人子除爲功曹清峻流軰伯人閒好妙年不必湏白晳洙曰左傳東門之晳實興我役趙曰左傳昭公二十六年冉竪曰有君子白晳鬚十五冨文史十八足賔客十九授校書二十聲輝洙曰一作燀赫衆中毎一見使我潜動魄自恐二男兒辛勤養無益秦曰二子一曰宗文二曰宗武甫旣羡李舟自愧之不若故云云乾元元洙曰作二年春萬姓始安宅洙曰乾元肅宗時年號始收復京師民始安居蘇曰張湯万姓蘇息始安厥宅舟也衣綵衣洙曰見沐覔綵輕注趙曰列女傳老萊子孝養二親着五色綵衣卧地爲小兒啼告我欲逺適倚門固有望歛衽就行役洙曰父曰嗟予子行役趙曰戦囯策斉王孫賈之母謂賈曰汝朝出而晚來則吾倚門而望汝暮出而不還則吾倚閭而望馬曰陶渊明勸農四言云敢不歛祍南登吟白華洙曰白華孝子之㓗白巳見楚山碧洙曰鮑明遠雪端楚山見蘇曰景差至蒲騒見宋玉曰不意重見故人慰此去囯恋主之心昨到夢澤喜見楚山之碧眼力頓明今又㑹故人閉目心足矣藹藹咸陽都冠蓋日雲積洙曰張景陽藹藹言氣象也咸陽古雍郡也冠蓋士大夫也雲積言其多也又古詩冠蓋隂四衢西都賦冠蓋如雲也何時太夫人洙曰文帝紀列侯妻稱夫人列侯死子復爲列侯乃得稱太夫人子不爲列侯亦不得稱堂上㑹親戚洙曰潘安仁閑居賦太夫人在堂又云席長筵列孫子陶淵明悦親戚之情話汝翁草明光洙曰漢武帝紀太𥘉四年秋起明光宫師古曰三輔黄圖在城中元后傳云成都侯商避暑借明光宫凡掌制誥文字謂之視草也趙曰後漢尚書郎含香握蘭直宿於建礼門奏事明光殿下筆爲詔誥出語爲誥令在唐則中書舎人也晁曰凡掌制誥必有草故謂之起草天子正前席歸期豈爛漫別意終感激顧我蓬屋姿洙曰曹子建顧念蓬屋士貧賤誠足怜謬通金門籍洙曰謝玄暉出尚書省詩旣通金閨藉師曰甫爲恰遺故云云小來習性懶晚節洙曰一作歳慵轉劇洙曰嵆叔夜絶交書少加孤露性復踈懶又嬾与慢相成毎愁悔吝作如覺天地窄羡君齒髪新行巳能夕惕洙曰易乾卦夕惕若厲臨岐意頗切對酒不能喫修可曰李陵詩對酒不能酬廻身視緑野憺慘如荒澤老鴈忍春飢哀號待枯麥趙曰漢時謡大麥青青小麥枯時哉髙飛燕絢練新羽翮洙曰老鴈甫自喻也時燕喻李校書趙曰赭白馬賦云别軰超羣絢練夐絶句絇練疾也長雲濕襃斜洙曰西都賦右界褒斜隴陂之險修可曰後漢順帝罷子午道通褒斜路褒斜谷名南谷名褒北谷名斜首尾七百里鄭子真所耕在此谷口斜余遮切漢水饒巨石無令軒車遲洙曰古詩思君令人老軒車來何遲趙曰江文通詩海濵饒竒石衰疾悲宿昔師曰甫与舟有宿昔之歡况當老而有此别儻或来遲無以慰衰疾寕免悲思之乎入奏行洙曰贈西山檢察使竇侍郎竇侍御驥之子鳯之雛修可曰桓譚新論曰善相馬者曰薛公得馬惡皃而正走其名驥子又易林曰鳯生五雛年未三十忠義俱骨鯁絶代無洙曰唐李吉甫傳君有骨鯁之忠臣趙曰骨鯁者剛正之謂盖肉之有骨而魚之有鯁烱如一叚清冰岀萬壑鄭曰埛尸頂切光也置在迎風寒露之玉壷洙曰漢有迎風寒露之館古詩瑩若玉壷氷言清徹也蔗漿歸厨金盌凍楷曰盌亦作宛洙曰晉張協蔗賦曰挫斯蔗以療渴若漸醪而含宻右按前漢書礼楽志㤗尊柘漿折朝酲應劭曰柘漿取甘柘汁以爲飲也蔗与柘同趙曰宋玉招䰟云儒鼈㚿羔有蔗漿定功曰前漢礼楽志景星歌㤗尊柘漿析朝酲注取甘蔗汁以爲飲可解酲也柘音庶舊注所引似之而非洗滌煩熱足以寧君軀政洙曰一作整用踈通合典則戚聮豪貴躭文儒兵革未息人未蘇天子亦念西南隅吐蕃慿陵氣頗麤洙曰時吐蕃欲取成都爲東府竇氏檢察應時須運糧繩橋壯士喜洙曰繩橋以竹繩爲橋也斬木火井窮猿呼洙曰火井地名鄭曰在蜀修可曰博物志曰臨卬有火井縱廣五尺深千餘丈諸葛丞相往觀後火井益盛以盆著井煑塩得熟八州刺史思一戰三城守邊却可圖趙曰西山三城也此行入奏計未小宻奉聖旨恩宜殊繡衣春當霄漢立洙曰漢繡衣御史綵服日向庭闈趨洙曰老萊綵衣以娛親修可曰束晳𥙷亡詩眷恋庭闈省郎京尹必俯拾蘇曰薛光戯友人曰古人云青紫可俯拾吾令尹亦可俯拾江花未落還成都肯訪浣花老翁無洙曰一云公來肯訪浣花老爲君酤酒滿眼酤與奴白飯馬靑蒭洙曰又云携酒肯訪浣花老爲君着衫捋髭鬚趙曰此雖不言主人而持奴馬如此則主人可知与詩所謂言刈其楚言秣其馬同意秣音末帥曰吐蕃分三道入宼欲取成都爲東府竇氏以御史出檢察諸州軍儲器械得以便宜入奏甫作是詩以贈之驥子鳯雛皆不凡也逆耳之言比之骨鯁漢武帝置迎風寒露之館玉壷貯水言其瑩徹也蔗漿可以除煩天子方憂吐蕃不无内熱今竇生入奏忠言上沃帝心如蔗漿然踈通其施爲无所蔽也太宗皇后竇氏侍御正其族也故云戚䏈豪貴雖云外戚尤好儒斈西南隅謂蜀也須乃軍興所須也蜀人以竹索爲橋謂之繩橋地理志卬州有火井縣在州西六十二里斬木将以爲柵猿依於木今旣尽斬之則猿窮而失所是以號呼八州謂彭嘉黎簡嚴陵雅卭三城謂姚維松皆當吐蕃之衝兵有攻有守八州可政三城可守奏其事於朝廷以取天子之命甫謂必蒙殊恩省郎京尹如俯拾地芥行色當春秋間可還成都故云江花未落也漢暴勝之衣繡衣持斧出使故云繡衣春當霄漢立立謂立對於天陛甫築草堂居成都浣花里自稱浣花翁滿眼酤謂滿前士卒皆有勞也甫約竇帰來不遺寒賤儻賜光訪當酤酒宴集下至車從僕隷皆待以殊礼盖所以尊重於竇故也徐卿二子歌君不見徐卿二子生絶竒感應吉夢相追隨洙曰詩吉夢惟何惟熊惟羆趙曰丗說孔文㪯有二子大者十歳小者五歳晝日反眠小者狀頭盃酒飲之大兒謂曰何以不拜荅曰偷何行礼此載年小而善語言也孔子釋氏親抱送並是天上麒麟兒洙曰徐陵年数歳家人携見宝誌上人誌以手摩項曰天上石麒麟也大兒九齡色淸徹洙曰揚子吾家之童烏九齡而与我玄文趙曰祢衡有云大兒孔文㪯小兒楊德祖故公屡用也秋水爲神玉為骨蘇曰司馬大子見王岳謂客曰此兒神如秋水而清徹骨如皓玉之美秀鳯雖爲離其文彩以彰矣子美拾而用之了无斤斧痕非子美亦不能用也小兒五歲氣食牛洙曰尸子虎豹之駒雖未成文巳有食牛之氣滿堂賔客皆廻頭洙曰謝希逸月賦滿堂交客向皇如先吾知徐公百不憂積善衮衮生公侯洙曰易積善之家王済曰張華說史漢衮衮可聽趙曰言其生不絶也衮衮乃不絶之義也丈夫生兒有如此二雛者名位豈肯卑微休趙曰左傳名位不同王充論衡自紀篇位雖卑微行苟離俗必與之友贈虞十五司馬遠師虞祕監洙曰丗南也今喜識玄孫形象舟靑逼家聲器宇存洙曰見烜赫舊家声注蘇曰龎統要識家声先看器宇寛卑凄凉憐筆勢浩蕩問辭源蘇曰江揔辭源浩蕩學海渊深爽氣金天豁洙曰王子猷西山朝來致有爽氣清談玉露繁洙曰董仲舒有玉杯繁露佇鳴南嶽鳯洙曰劉公幹鳯凰集南嶽徘徊孤竹根師曰衡山南嶽也選注丹穴爲南嶽非是欲化北溟鯤洙曰莊子北海有魚名曰鯤化爲大鵬交態知浮俗趙曰鄭莊傳翟公題門曰一貧一冨乃知交態儒流不異門洙曰儒門流同門異户過逢連客位洙曰沈休文詩客位紫苔生日夜倒芳樽沙岸風吹葉雲江月上軒洙曰别賦月上軒而飛光百年嗟巳半四座敢辭喧書籍終相與青山隔故園蘇曰南史王筠字元礼沈約見筠文咨嗟而歎曰昔蔡伯喈見王仲宣稱曰王公之孫吾家書籍悉當相与僕雖不敏淸附斯言餘見王粲本傳師曰子美欲悉以書藉与虞庶幾傳子美之業同豆盧峯貽主客李貟外賢子棐知字韻練金歐冶子洙曰張景陽七命楚之陽劎歐治所營鄭曰吴越春秋干将与歐治子作劎採五山之精合六金之英煉而爲劒噴玉大宛兒定功曰穆天子東遊黄澤使宫楽謡曰黄之澤其馬歕玉皇人壽榖又賈復顧兒謂弟曰此吾宗大宛兒也一日千里亦可歕与噴同趙曰兩句以美李貟外上句比之以劒下句比之以爲大宛馬名也引之以噴玉字穆天子傳其馬歕玉符彩髙無敵彦輔曰記君子於王比德焉孚尹旁達信也注孚尹讀爲浮筠謂玉采色也田曰曹子建七啓曰符彩照燭魏文帝車渠椀賦發符采而揚榮趙曰傅玄乗輿馬賦曰符采横發大率言符光雜穆也聦明逹所爲夢蘭它日應洙曰左傳鄭文公賤妾燕姞夢天使與巳蘭曰以爲是尔子以蘭有國香人服媚之旣而文公與之蘭而御之辝曰妾幸而有子将不信敢徵蘭乎穆公名曰蘭也折桂早年知洙曰見礼闈新折桂注爛熳通經術光芒刷羽儀洙曰沈休文湖中鴈詩刷羽同揺漾易鴻漸于陸其羽可用爲儀謝庭瞻不遠洙曰晉史謝太傅諸子若芝蘭玉樹生於庭階潘省㑹於斯趙曰潘安仁云寓直于散騎之省今公乃工部貟外郎李乃主客貟外郎盧亦必官是省郎之人相會於此唱和将鶵曲田翁號鹿皮洙曰見漢丗鹿皮翁注宗族古詩六首律詩三十二首狂歌行贈四兄與兄行年校一歳賢者是兄愚者弟兄将冨貴等浮雲弟切功名好權勢長安秋雨十日泥我曹鞴馬聽晨雞公卿朱門未開鏁我曹巳到肩相齊吾兄睡稱方舒膝不韈不巾踏曉日男啼女哭莫我知身上須繒腹中實今年思我來嘉州嘉州酒重花繞樓樓頭喫酒樓下卧長歌短詠還相酬四時八節還拘禮女拜弟妻男拜弟幅巾鞶帶不掛身頭脂足垢何曽洗修可曰南史隂子春字㓜文身脂垢汗脚数年一洗言毎洗則失財敗事云在梁州因洗足致梁州敗子美云足垢何曽洗則又甚於數年一洗者矣吾兄吾兄巢許倫一生喜怒長任真日斜枕肘寢巳熟啾啾唧唧何爲人遣興二首干戈猶未定弟妹各何之洙曰言避亂奔散不知其所適拭淚霑襟血梳頭滿靣絲趙曰以思憶而痛悼之極地卑荒野大天逺暮江遲衰疾那能乆應無見汝期洙曰一作時蘇曰鄧廪送子幽遷執手悵恨乆之語曰汝去万里吾殘喘如桑榆未景應無見汝時冝自勉力我今日夜憂諸弟各異方不知死與生何况道路長洙曰蘇武詩良友逺别離各在天一方山海隔中州相去悠且長古詩相去万餘里各在天一涯道路阻且長㑹靣安可知避宼一分散飢寒永相望豈無柴門歸欲出畏虎狼仰看雲中鴈禽鳥亦有行洙曰傳休奕仰觀南鴈翔得舎弟消息風吹紫荆樹色與春庭暮花落辭故枝風回反無處洙曰周景式孝子傳曰古有兄弟忿欲分異出門見三荆同枺接葉連隂歎曰木猶欣聚况我而殊哉又田真兄弟欲分其庭前三荆便枯兄弟嘆之却合樹還榮茂骨肉恩書重漂泊難相遇猶有淚成河經天復東注洙曰丗說人問顧長康哭桓宣武之狀如何曰鼻如廣漠風眼如懸河決声如振雷破山淚如傾河注海醉歌行俯曰甫從姪杜勤落第㱕甫作此詩别之陸機二十作文賦汝更小年能綴文洙曰晉陸機字士衡作文賦序云余毎觀文士之作竊有以得其心夫其放言遣辝良多変矣妍蚩好惡可得而言毎自屬文尤見其情恒患意不稱物文不逮意盖非知之難能之難也故作文賦以述先士之盛藻作文之利害緫角草書又神速丗上兒子徒紛紛洙曰詩甫田緫角丱兮三十國春秋封秀緫角知名衛玠緫角乗羊車入市趙曰草書以遲爲工所謂怱怱不及草書是也以速爲神所謂一筆変化書是也驊騮作駒巳汗血鷙鳥舉翮連青雲洙曰汗血事見上鷙鳥累百不如一鶚詞源洙曰一作賦倒流三峽水洙曰海賦吹嘘則百川倒流枚叔七發曰江水逆流海水上潮修可曰隋藝文傳曰筆有餘力詞无竭源荆州記曰巴陵楚地有三峽峡程記曰三峽者即明月峽巫山峽廣澤峽其瞿塘灔澦之類不係三峽之数倒流三峡水謂詞源壯健可以衝激三峽之水使之倒流也趙曰詞源筆陣以比其反之敏三峽之水最迅而詞源可使之倒流詩人誇張之辝尔詞言源則隋藝文志筆有餘也而從姓之不中第何哉然㑹當是時排擊風露盖以其終有連雲之毛質焉此慰唁之且復有譏誚也岀鮑明遠書言水族之狀曰浴雨排風汝身巳見唾成珠洙曰莊子秋水篇蚿謂夔曰子不見夫唾者乎噴則大者如珠小者如霧雜而下者不可勝数蘇曰江淹謂郭鞏曰子之咳唾成珠玉吐氣作虹霓非碌碌儔比也夢符曰右按後漢趙壹傳咳唾成珠玉時可曰後趙一歌曰勢家多所宜咳唾自成珠𬒳褐懐金玉蘭蕙化爲蒭趙曰選詩咳唾自成珠公之詩意言其姪開口成文如珠耳汝伯何由髪如􅃮俯曰甫謂勤文章矢口巳成珠玉它日必貴怛恨年老頭白无由再黒如漆傷不反見勤之冨責也春光淡沲秦東亭鄭曰沲徒可切何曰淡沲即淡蕩也秦東亭即京城門外東亭送别多於此處渚蒲牙白水荇青鄭曰荇下梗切洙曰梁江淹石上菖蒲詩發歩遵汀渚詩參差荇菜釋云荇接菜也陸機云浮在水上根在水厎梁簡文帝晚春詩渚蒲変新莭蘇曰蘇恭云萍有三種大者曰蘋中者荇菜小者水上浮萍趙曰沲音待可切蒲才有牙而曰荇在水而青指東亭春景而言耳黄曰盧思道云緑葉參差映水荇風吹客衣日杲杲洙曰衛詩伯兮其雨其雨杲杲出日樹攪離思花㝠㝠洙曰楚詞山鬼雷填填弓雨冥冥蘇曰焦光仲遜共遊陸渾時春和景妍遜謂光曰何冥冥花樹攪人離思也酒盡沙頭雙玉瓶衆賔巳醉我獨醒洙曰魚人屈原曰㪯丗皆濁惟我獨清衆人皆醉惟我獨醒是以見放也乃知貧賤別更苦蘇曰衛宏失意送弟遷嶺外氣塞臆而幾不能言乆之曰貧賤中離別更苦吞聲躑躅涕泣零洙曰古詩涕泣零如雨又沉吟聊躑躅行不進貌陸士衡擬古詩沉思鍾万里躑躅獨吟歎又云躑躅再三歎又云躑躅遵林渚宋鮑昭行路難云心非木石豈无感吞声躑躅不敢言何曰在鼻曰涕在眼曰淚零落也吞声言哽咽声不能逹甫自傷貧賤巳无聊頼况加以離别故云更苦示從孫濟彦輔曰此詩譏風俗衰薄雖同姓不能忘猜疑也平明跨驢出未知洙曰一作委適誰門權門多噂踏洙曰詩十月噂踏背憎聀競由人噂踏猶相對談語背則相憎逐矣趙曰前漢息夫躬交遊貴戚趍走權門鄭曰噂祖本切踏逹合切對談語也且復㝷諸孫師曰驢賤者所跨權門乃權貴之門詩云噂踏背憎謂噂噂呇呇靣前則附耳而語背後則相譏議嫌權門多噂沓是以㝷同姓也諸孫貧無事宅舎如荒村堂前自生竹堂後自生萱萱草秋巳死洙曰衛詩伯兮焉得諼草言樹之背注諼草令人忘憂背北堂也䟽堂者房堂所居之地揔謂之堂房半以此爲此堂房半以南爲南星竹枝霜不蕃洙曰一作翻左傳具生不蕃淘米少汲水汲多井水渾刈葵莫放手放手傷葵根洙曰鮑明遠樂府詩腰鎌刈罕藿古詩採葵莫傷根傷根葵不生結交莫羞貧羞貧友不成趙曰族之有宗猶水之有原葵之有根也水有源勿渾之而已葵有根勿傷之而巳族有宗則亦勿踈之而巳阿翁懶墮乆鄭曰阿烏葛切覺兒行歩奔敏修曰阿翁甫自稱兒指済行歩奔言其強健年尚少也責済後生不來相顧所來洙曰一作求爲宗族亦不爲盤餐洙曰左傳僖二十二年晉公子及曹僖負覊之妻饋盤食寘壁見彭衙行蘇曰張昭見顧陸曰吾也來爲道義非因盤飱小人利口實洙曰頤自求口實薄俗難具論蘇曰劉章曰薄俗好利炎凉逆勢難可与論歳寒髙曰楊􅖏兵戈之後礼義壞缺士行凋弊雖有数子知書皆汚薄俗氣味難可与論典刑事勿受外嫌猜同姓古所敦洙曰鮑明遠明慮自天断不受外嫌疑趙曰此亦曹子建詩有親文義在敦之義寄從孫崇簡嵯峨白帝城東西南有龍湫北虎溪吾孫騎曹不記馬修可曰丗說王子獻爲桓冲騎曹叅軍桓問曰卿何署荅曰不知何署時牽馬來似是馬曹又所管幾何曰何由知數又間馬死多少曰未知生焉知死業學尸郷多養雞洙曰見崔樹雞柵詩注龐公隱時盡室去武陵春樹他人迷洙曰龐德公携妻子尽室入鹿山武陵春樹桃源也漁人迷路而入見欲問桃花宿與汝林居未相失近身藥裏酒長携蘇曰江淹行常使童挈酒㪺􅑕盞藥褁周易傲然人皆竒之牧叟樵童亦無頼莫令斬斷靑雲梯洙曰文選注云仙者以雲而升故謂之雲梯憶弟二首洙曰時歸在南六渾莊喪亂聞吾弟飢寒傍濟州鄭曰濟子禮切水名禹貢有濟河此因水名州人稀書不到蒭曰以道路榛梗人稀少而難行兵在見何由憶昨狂催走洙曰狂催走謂避亂岀奔如狂趙曰自言奔走而生行在所無時病去憂趙曰公素多病則又無時而病去所以憂也即今千種恨惟共水東流師曰濟屬山東弟居東故恨與水流東故也且喜河南定洙曰安慶緒弃東都走也趙曰至徳二載復東京故喜也不問鄴城圍炎曰鄴城夬思明所據百戰今誰在三年望汝歸洙曰東山周公東征也三年而歸三章言其家室望女也鮑曰公自天寳十四載乙未冬因亂而相別至乾元戊戌是爲三春故曰三年望汝蘇曰杜預與弟書三年望汝汝何不歸豈不念堂有老母故園花自發洙曰丘希範書暮春三月江南草長雜花生園群燕乱飛見故國之旗鼓感生平於疇昔師曰花自發言無主也春日鳥還飛洙曰言草木禽鳥尚得其所而人遭亂離不得相保耳趙曰言河南巳定當春之至草木禽鳥各得其所與前篇感時花濺淚恨別鳥驚心見之而泣聞之而悲者異矣黄曰禽鳥尚得其所而人遭亂離不獲聚㑹故可傷也斷絶人煙乆東西消息稀得舍弟消息亂後誰歸得他郷勝故郷蘇曰崔審與友人曰江南兵火全不如舊聞三峽人物冨盛况勝故鄉何頻頻發吟思邪趙曰休明之際則他郷雖樂不如還家惟亂離則他郷安處自足居也直洙曰一作昔爲心厄苦乆念洙曰一作得與存云趙曰以弟存亡在念也若在與在若亡與亡之義汝書猶在壁汝妾巳辭房侏曰李陵書生妻去室也舊犬知愁恨垂頭傍我床得舍弟消息二首近得平隂信鮑曰平隂屬河南郡唐𥘉屬濟州天寳元年更名濟陽郡十三載郡廢以平隂屬鄆遥憐舎弟存側身千里道洙曰言避難不得正行寄食一家村烽舉新酣戰洙曰烽燧時有宼則㪯趙曰淮南子魯陽公与韓戰韓酣日暮授戈而麾之啼垂舊血痕不知臨老日招得幾人䰟洙曰人一作時汝懦歸無計鄭曰懦奴卧切弱也吾衰往未期浪傳烏鵲喜洙曰西京雜記乾鵲喿而行人至深負鶺鴒詩鄭曰鶺資昔切鴒盧經切見鴿原驚陌草注生理何顔靣蘇曰何敬相生理荒凉家風零替重見故人揣心撫膺失何顔靣憂端且歳時兩京三十口雖在命如絲魯曰言雖不死亦若絲之欲絶可謂至危矣月夜憶舎弟戍鼔斷人行洙曰戍樓鼓也秋邊一鴈聲洙曰言孤也露從今夜白月是故郷明有弟皆分散洙曰一云覊旅趙曰公之二弟方賊乱時一在濟州一在陽翟無家問死生洙曰乱離流落故無家也寄書長不達况乃未休兵師曰一鴈声言其兄弟隔絶遂孤也當乱離流落故云无家也送舍弟頻赴齊州三首岷嶺孫曰岷峨也在蜀南蠻北洙曰南詔蛮也徐關東海西洙曰徐關齊地趙曰言弟自岷蜀起發而之齊耳徐關齊地耳此行何日到送汝萬行啼絶域惟髙枕趙曰公自中原而來蜀則亦以蜀爲絶域大抵言異方也淸風獨仗䔧危時暫相見衰白意都迷風塵暗不開汝去幾時來兄弟分離苦形容老病催江通一柱觀洙曰見一柱觀頭眠幾回注鄭曰古玩切荆州記江陵有臺上有一柱衆梁拱此或云荆州有一柱觀土人呼爲木履觀日落望郷臺洙曰成都記隋蜀王秀所創客意長東北齊州安在哉諸姑今海畔兩弟赤山東趙曰齊州近海則是山東矣去旁干戈覔來看道路通短衣防戰地洙曰趙武靈王好胡服士皆短服趙曰公自言也時吐蕃未息故戎服以在防戰之地匹馬逐秋風趙曰言弟頴之征行也莫作俱流落長瞻碣石鴻洙曰絶交論附騏驥於旄端軼歸鴻於碣石注海畔山也得舍弟觀書自中都巳達江陵今兹暮春月末合行李到䕫州悲喜相兼團圎可待賦詩即事情見乎詞爾到江陵府何時到峽州亂離生有別修可曰楚詞云悲莫悲於生別離聚集病應瘳颯颯開啼眼朝朝上水樓老身須付託白骨更何憂喜觀即到傷題短篇二首巫峽千山暗終南萬里春洙曰終南山在長安言去家萬里也病中吾見弟書到汝爲人洙曰始爲亂離所隔則莫知生死也及書到方知其爲人意荅兒童問來經戰伐新趙曰兩句通義自戰伐中來兒童見之必有所問巳意其一一荅之也泊船悲喜後欵欵話歸秦待爾嗔烏鵲沈曰西京雜記鵲噪則行人至抛書示鶺鴒趙曰待弟而來怒烏鵲之不實下言喜弟來故抛書示之枝間喜不去原上急曾經洙曰詩鶺鴒在原兄弟急難江閣嫌津桞洙曰嫌其隔望眼也風帆數驛亭洙曰數其驛程也應論十年事愁絶始星星蘇曰蘇代堂上星星之髪張禹對鏡悲鬢始變星星陸嵩云客髪一星星趙曰舊本作然絶非是星星言鬢之白也南史韻詩云星星行復岀舍弟觀歸藍田迎新婦送示二首汝去迎妻子髙秋念却廻即令螢巳亂好與鴈同來東望西江水趙曰舊作水善本作永是蜀江謂之西江公欲泛舟南下以楚之上游而西江之盡處在其東故東望其永詩江之永矣不可方思彦甫曰水當作永南游北户開趙曰成南遊則見北户之開吴都賦云開北户以向日卜居期靜處㑹有故人杯蘇曰郭林宗曰吾當比居静處期友人野酌放浪誰能學後生兒軰日傍門户低眉下氣爲錐刀之利者平趙曰卜居靜處當有故人之來楚塞難爲路洙曰一作别藍田莫滯留衣裳判白露鞍馬信淸秋滿峽重江水開帆八月舟此時同一醉應在仲宣樓趙曰王粲字仲宣劉表時在荆州因登楼而作賦其後指荆州樓爲仲宣樓鄭曰楼在荆州界今襄州舎弟觀赴藍田取妻子到江陵喜寄三首汝迎妻子達荆州消息真傳解我憂鴻鴈影來連峽内洙曰古詩弟兄鴻鴈序鶺鴒飛急到沙頭洙曰詩鶺鴒在原載飛載鳴燒關險路今虚遠漢祖入蜀張良辭歸勸髙祖燒絶棧道修可曰燒関當作嶢關音堯在峡右漢書曹參從髙祖西攻嶢関注在洛北蓝田武関西以觀赴蓝田故云尹曰燒當作嶢者堯関在上洛北蓝田南武関之西漢髙祖紀秦王嬰子誅趙高遣将将兵據嶢関禹鑿寒江正穩流洙曰江漢巴東之峽夏后䟽鑿云朱紱即當隨綵鷁靑春不假報黄牛馬度秦山雪正深洙曰度一作瘦北來肌骨苦寒侵他郷就我生春色趙曰白日峽往荆可以春時矣故國移居見客心趙曰故國人情之所不忍離也今自故國而移居以不得已而來則客心可見矣歡劇提携如意舞洙曰一云王戎好作如意舞諸葛亮出軍甞以鐡如意指麾喜多行坐白頭吟洙曰文君作白頭吟廵簷索共梅花笑泠蘃洙曰一作落踈枝半不禁庾信羅含俱有宅黄曰庾信因侯景之亂自建康遁帰仁陵居宋玉故宅宅在城北三里羅含爲桓温別駕以廨舎喧擾於江陵城西三里小舟上立茅屋而居布衣𬞞食晏如也師曰庾信宅即宋玉故宅見送李功曹之荆州詩注余知古諸宮故事羅含爲桓温別駕以廨舎喧擾於江陵城西三里小州上立茅屋伐木爲床織葦爲席而居布衣𬞞食晏如也後安成王在鎮以其宅借録事劉朗之見一丈夫衣冠甚偉水矜而立朗之驚問忽然失之人謂含有神春來秋去作誰家短墻若在從殘草喬木如存可假花卜築應同蔣詡徑洙曰三輔決録蔣詡舎中竹下惟開三徑羊仲求仲從與之游爲園須似邵平瓜洙曰邵平種瓜羙故丗謂之東陵瓜比年洙曰一作因病酒開㳙滴弟勸兄酬何怨嗟遠懷舎弟頴觀等陽翟空知處洙曰陽翟屬頴川郡夏禹所受封地荆南近得書積年仍逺别多難不安居蘇曰岑襄晉末兵戈主室多難雖有髙堂峻宇不得安居見情偏録江漢春風起氷霜昨夜除雲天猶錯莫花萼尚蕭踈趙曰以興兄弟之離隔也師曰翟陽屬頴川郡舎弟所在子美居荆南玄宗敦友弟起花萼樓取棠棣之華鄂不韡韡乃燕兄弟之詩之意對酒都疑夢吟詩正憶渠舊時元㑹日郷黨羡吾廬洙曰陶潜詩吾亦愛吾廬續得觀書迎就當陽居止正月中旬定出三峽自汝到荆府書來數喚吾頌椒添諷詠洙曰周庾信正旦詩叔花逐頌來禁火卜歡娱洙曰荆楚歳時記去冬節一百五日即有疾風甚雨謂之寒食禁火三日琴操晉文公與介子綏俱遁子綏割股以啖文公文公復國子綏无所得作龍蛇之歌而隱文公求之不得出乃焚左右木子綏抱木而死文公哀之令人五月五日不得㪯火文周㪯移書及魏武明罰今陸翽鄴中記並云寒食断火起於子推琴操所云子綏即子推也又云五月五日与介有異皆因流俗所傳據左傳史記並無介子推焚事按周礼司烜氏仲春以木鐸脩火禁于國中注云爲季春将岀火也今寒食節氣是春之未三月之極然則禁火盖周之舊制趙曰序言正月中旬定出峽於寒食必相聚矣舟楫因人動形骸用杖扶天旋䕫子峽洙曰魚復古䕫子峽也春近岳陽湖洙曰岳陽湖在巴陵蘇曰梁汶曰岳陽春近吾将鼓枻放曠澤國与簑笠尽老矣鄭曰即巴陵洞庭湖發日排南喜傷神散北呼趙曰言起發之日安排往南喜神情所傷者比望長安而不得㱕也飛鳴還接翅洙曰詩棠棣鶺鴒在原兄弟急難又小宛題彼鶺鴒載飛載鳴行序宻衘蘆洙曰春秋繁露鴈有行列傳云兄弟之齒鴈行淮南子曰鴈從風而飛以愛氣力衘蘆而飛以避繒繳俗薄江山好時危草木蘇馮唐雖晚達終覬在皇都洙曰馮唐事見元日示宗武詩名慚白首郞注蘇曰梁絢曰如馮唐垂白尚兾晚逹趙曰馮唐公以自比其白首爲郞也乗雨入行軍六弟宅曙角凌雲罷春城帶雨長水花分塹弱巢燕得泥忙今弟雄軍佐凡材汙省郞蘇曰潘岳無長材廣識謾汗省郎見真儒碩人厚顔汗熱趙曰公爲工部貟外郎而自謙之辝也萍漂忍流涕衰颯近中堂第五弟豐獨在江左近三四載寂無消息覔使寄此二首亂後嗟吾在覊栖見汝難草黄騏驥病洙曰公以騏驥自託也蘇曰陳晙卧疾梁杓過門曰霜勁草黄騏騏病矣駑駘何得快駃盖君子不得時小人自肆也少㳺一日來問曰細味工部詩皆拾古人句語綴𥙷作詩平穩妥帖若神施鬼設工部腹中幾箇國子監耶予喜此談遂筆之沙晚鶺鴒寒趙曰憫其弟之寒也詩云鶺鴒在原兄弟急難以成覉栖見汝難之句楚設關城險洙曰左傳屈完對齊恒曰君若以德綏諸侯誰敢不服君若以力楚國方城以爲城漢水以爲他注言其險固也趙曰白帝城乃䕫之險也吴吞水府寛趙曰吴則江左至吳而積水之多故云水府寛十年朝夕淚衣袖不曽乾聞汝依山寺杭州定越州趙曰題正云五弟獨在江左不拾名其州則亦傳聞而未審風塵淹別日趙曰兵戈謂之風塵蓋言風動塵起也江漢失洙曰一作共清秋趙曰言我秋時在此而不見其弟爲相失也影著啼猿樹趙曰公自言所在之處盧照隣巫山髙云莫辨帝猿樹魂飄結蜃樓洙曰史海傍唇氣象樓䑓趙曰指言弟豊所在之處故深思之也思之而魂飄謂之結蜃樓言蜃所結成樓也前漢天文志海旁蜃氣象樓臺可以證矣師曰陳藏器云車螯是大蛤一名蜃能吐氣如樓臺明年下春水東盡白雲求趙曰所以成杭州定越州之句送十五侍御弟使蜀喜弟文章進添余別興牽數盃巫峽酒百丈内江船洙曰水自偷上合者謂之内江自渝由戎瀘上蜀者謂之处江未息豺狼闘洙曰戰爭空催犬馬年洙曰公自稱其年故從卑賤晉陶侃臨終上表曰臣猶爲犬馬之齒故尚可少延歸朝多便道搏擊望秋天洙曰便道問道也夢符曰右按前漢趙充國傳甞責充國曰将軍其引兵便道西並進雖不相及使虜聞東方北方兵並來田曰舊唐史栢彦範㪯楊嶠爲御史嶠不樂搏擊之任彦範曰爲官擇人豈待情願遂引爲右䑓御史師曰御史之擊搏姦回如鷹逢秋擊搏鳥獸故云云憶㓜子洙曰字驥子時隔絶在鄜州驥子春猶隔鶯歌暖正繁別離驚節換聦慧與誰論澗水空山道柴門老樹村趙曰指言鄜州寄象之地憶渠愁只睡洙曰一作卧炙背俯晴軒師曰甫作此詩恨不得見也遣興驥子好男兒洙曰驥子公子宗武也見宗武生日詩注前年學語時問知人客姓誦得老夫詩洙曰老夫公自謂丗亂怜渠小家貧仰母慈洙曰嵆叔夜母兄鞠育有慈无威鹿門携不遂洙曰龐德公携妻子入鹿門山隱鴈足繫難期洙曰難一作无蘇武傳鴈足繫書事是上一云鹿門携有處鳥道絶无期天地軍麾滿山河戰角悲儻歸免相失見日洙曰一作尓敢辭遲得家書去慿遊客寄革曰一云休㚢騎趙曰言出遊彼處客寄之人來爲附家書今日知消息他郷且舊居趙曰指言鄜州公寄居在鄜巳是他郷但恐亂離更有遷徙故知消息而喜云尓態兒幸無恙洙曰後漢蘇竟傳公君執事無恙爾雅曰恙憂也公孫弘傳何恙不巳師曰熊兒甫小女驥子最憐渠革曰驥子公之子宗武臨老覊孤極洙曰謂流離孤苦傷時㑹合踈洙曰以時无交舊也二毛趨帳殿洙曰二毛言鬢毛二色謂班白也帳殿謂行在以帳爲殿左傳宋公曰君子不禽二毛黄巢之屯八角帳幄皆象宫殿蘇曰景敷二毛尚走塵埃兵甲之間日趍帳殿一命侍鸞輿洙曰公至行在授左拾遺師曰周有未命一命再命之士一命言官卑也北闕妖氛滿洙曰比闕帝闕也妖氛謂未收復也趙曰時安慶緒方熾西郊白露𥘉洙曰謂粛殺之威漸生趙曰指言長安西郊也以白露𥘉言之則在七月明矣凉風新過鴈秋雨欲生魚饒曰甫得家書故云新過鴈農事空山裏眷言終荷鋤洙曰一云終篇言荷鋤宋陶替雜詩種豆商山下草盛豆苗稀晨興理荒穢帶月荷鋤㱕趙曰公遭亂偒時乃欲㱕耕而巳陶淵明帶月荷鋤兒曰甫欲棄官㱕老之意宗武生日洙曰宗武小名驥子曽有詩云驥子好男兒又云驥子最憐渠小子何時見蘇曰王肅思男謂弟曰何時得見小子趙曰老杜旣有盛名於時則人皆知其有是子也高秋此日生自從都邑語巳伴老夫名洙曰禮自稱曰老夫者詩是吾家事人傳丗上情趙曰旣以詩擅名而丗間愛之者多故云熟精文選理洙曰唐儒斈傳李善揚州江都人甞注解文選分爲十六卷表上之賜絹一百二十匹詔藏下袐閣善甞受文選於同郡人曹憲寓居汴鄭之間以講文選爲業尹曰梁昭明太子賢集古人文詞詩賦爲文選李善甞受文選於曹憲後遂解注文選十六卷休覔綵衣輕洙曰列女傳曰老萊子孝養二親行年七十嬰兒自娱着五色綵衣嘗因取漿水上堂跌仆因卧地爲小兒啼或弄烏鳥於親側趙曰老萊子者五采色衣戯於親側此言熟精文選理所以責望其子而巳雖綵衣之輕猶使之休覔也凋瘵筵𥘉秩洙曰小雅賔之𥘉筵左右秩秩箋云筵席也秩秩肅敬也海賦爲凋爲瘵欹斜坐不成流霞分片片夢符曰右按抱朴子項曼卿修道山中升天遊紫府仙人飲流霞一杯輙不飢渴㳙滴就徐傾洙曰何東項曼卿好道去家三十年而反曰去時有數仙人将上天離曰數里止日之旁甚寒悽愴飢欲食輙飲我流霞一杯毎數月不飢隋江揔爲馬腦杯賦翠羽流霞之杯庾信有示内人詩定取流霞氣将添承露杯趙曰抱朴子項曼自言至天上過紫府金牀几晃晃昱昱仙又以流霞一杯飲之輙不飢渴王立之云項曼舊注又誤爲曼卿故表出之又示宗武覔句新知律攤書解滿床蘇曰嵆紹新解覔句稍知音律王渾阿戎年小漸解滿牀攤書時問難字可喜試吟靑玉案洙曰張平子四愁詩美人贈我錦繡叚何以報之青玉案莫帶紫羅囊洙曰晉謝玄少好佩紫羅香囊叔父安患之而不欲傷其意因戯賭取焚之於此遂止假日從時飲洙曰王仲宣登樓賦聊假日以銷憂時天下逼迫无暇故假借此日登樓四望師曰假乃休假非假借之假明年共我長蘇曰嵆康顧子紹曰阿紹明年共我長矣吾甚喜尔成人趙曰言今年身材如此至明年更長則與我長矣應須飽經術巳似愛文章十五男兒志洙曰論語吾十有吾而志於斈三千弟子行曽參與游夏達者得升堂洙曰孔子世家孔子以詩書礼樂教弟子盖三千焉身通六藝者七十有二人論語文斈子游子夏又曰由也升堂矣趙曰曽參則責以孝行游夏則責以文斈子曰由也升堂矣今言三子皆逹於孔子之道而升堂所以明戒之也㝠忠州使君姪宅出守吾家姪洙曰出守守士也刺史是也詩云一麾乃出守殊方此日歡自須遊阮巷洙曰晉阮咸與叔父籍爲竹林之遊咸與籍居道南諸阮居道北北阮冨而南阮貧也師曰阮咸北張子美自比籍乃知叔姪之相得也不是怕湖灘洙曰湖灘忠州下惡灘也樂助長歌逸洙曰一作送杯饒旅思寛昔曽如意舞趙曰如意乃所執之物王戊甞以如意起舞師曰如意者乃鐵如意石崇以鐵如意擊碎珊瑚樹即此牽率強爲看示姪佐多病秋風落師曰七月秋風起八月風髙九月風落君來慰眼前自聞茅屋趣只想竹林眠師曰甫欲得佐共住故云滿谷山雲起侵籬澗水懸嗣洙曰一作阮宗諸子姪早覺仲容賢洙曰阮咸字仲客籍之姪也任達不拘与叔父籍爲竹林之遊佐還山後寄同作三首二首見田圃門山晚浮雲合歸時恐路迷澗寒人欲到村黒鳥應栖野客茅茨小田家樹木低舊諳踈懶叔須汝故相携洙曰以嵆康自處嵆康性復踈懶也吾宗衛倉曹崇簡吾宗老孫子質朴古人風耕鑿安時論衣冠與丗同在家常早起蘇曰劉理常早起治𬞞圃自力桔槹憂國願年豐語及君臣際經書滿腹中洙曰言凡語論之間及於君臣之際必反覆論議用其腹中之書而證明之也外族古詩三首律詩六首敬寄族弟唐十八使君與君陶唐後盛族多其人聖賢冠史籍枝派羅源津洙曰甫自撰万年縣君京兆氏墓銘云其先係統於伊祁分尚於唐杜春秋傳云穆叔謂之丗禄其在兹乎漢髙紀賛曰范宣子亦曰祖以虞以上爲陶唐氏在夏爲御龍氏在商爲豕韋氏在周爲杜氏注唐杜二國名在今氣磊落巧僞莫敢親蘇曰朱雲許時直言端莊正立巧言僞行之徒不敢親近介立寔吾弟濟時肯殺身物白諱受玷行高無汚眞得罪永泰末放之五溪濵洙曰漢黄瓊皦皦者易爲汚嶢嶢者易爲缺四子講徳青蠅不能穢垂棘詩臼圭之玷尚可磨也語殺身以成仁馬援傳擊武陵五溪蠻夷注雄樠酉撫辰所謂五溪也趙曰所以明得罪之由以不受汙玷而致然也此與皓皓之易爲汚之義不同舊注引此非是鄭曰五溪在辰州武陵之間壷頭以下鸞鳯有鎩翮鄭曰鎩所戒切先儒曽抱麟洙曰顔延年詠嵆中散詩鵉翮有時鎩鎩所拜切殘也劉越石詩誰云聖逹節知命故不憂宣尼悲獲麟西狩涕孔丘注孔子亦抱麟而涕雷霆霹長松骨大却生筋一失不足傷念子孰自珍趙曰此以譬唐使君能得罪未能遂傷之也熟字稔熟之熟言其自􅎇巳詳熟矣泊舟楚宫岸戀闕浩酸辛除名配淸江洙曰清江屬施州鄭曰清江溪名在施州夲漢江巫縣地今䕫州巫山縣厥土巫峽鄰登陸将首途筆札枉所申歸期跼病肺叙舊思重陳春風洪濤壯洙曰顔延年春江壯風壽劉越石弃置勿重陳重陳令人傷趙曰公自言病肺之故雖欲帰朝踡跼不得申也故下句所之則欲春時乗船而往得一見唐公以相慰也谷轉頗彌旬趙曰郭景純江賦盤渦谷轉我能况中流搪突鼉獺瞋洙曰鼉獺瞋言爲小人所怒也長年巳省柂洙曰省視也柂舟尾正船者長年操舟者視柂則将行矣慰此貞良臣送重表姪王砅評事使南海鄭曰砅理罽切水深至心曰砅今作厲我之曽老姑爾之髙祖母爾祖未顯時歸爲尚書婦洙曰新唐書王珪母李王珪傳正觀十年拜礼部尚書修可曰西清詩話云唐書王珪傳珪㣲時母李氏甞云子必貴但未見與汝游者珪一日引房杜過之母曰汝貴无疑所載止此質之子美是詩我之曽老姑尓之髙祖母則珪母杜氏非李氏也且一婦人識真主於側微其事甚偉史闕而不録是詩載之爲悉丗號詩史信不誣也隋朝大業末房杜俱交友趙曰王珪與房元齡杜如晦同學於文中子則交友可知矣長者來在門荒年自餬口洙曰陳平門多長者車隱十一年傳餬其口於四方家貧無供給客位但箕箒俄頃羞頗珍寂寥人散後入怪鬢髪空吁嗟爲之乆自陳剪髻鬟鬻市充杯酒洙曰晉陶侃母常剪髪具酒食延賔客上云天下亂冝與英俊厚向竊窺數公經綸亦俱有趙曰王珪與元齡如晦善母李甞曰兒必貴然未知所与游者何如人㑹元齡等過其家李窺大驚曰二客公輔才汝貴不疑舊注於下句驚户牗引此以證不知乃秦王事非干此也次問最少年虬髯十八九鄭曰髯如古切顂須子等成大名皆因此人手下云風雲合龍虎一吟吼願展丈夫雄得辭兒女醜秦王時在坐眞氣驚户牖趙曰秦王太宗也虬髯乃太宗也有虬髯公傳易曰雲從龍風從虎馬援曰乃知帝王自有真也新唐書王珪傳曰珪始隱居時每與房元齡杜如晦善母李甞曰兒必貴然未知所与游者何如人試與偕來㑹玄齡等過其家李窺大驚具酒食飲尽日喜曰二客公輔才汝貴不疑及乎正觀初尚書踐台斗洙曰珪正觀中以侍中輔政夫人常肩輿上殿稱萬壽洙曰夫人以命婦預朝㑹也六宫師柔順法則化妃后蘇曰班姬著内訓訓六宫作女箴媍誡化及妃后至尊均嫂叔盛事垂不朽鳳雛無凡毛五色非爾曹洙曰見鳯穴雛皆好注趙曰古有鳯将雛之曲言毛者南史謝超宗作殷淑儀誄帝大嗟賞謂謝莊曰超宗殊有鳳毛往者胡作逆乾坤沸嗷嗷洙曰謂安禄山作乱也吾客在馮翊爾家同遁逃洙曰避亂也争奪至徒歩塊獨委蓬蒿逗留熱爾腸鄭曰逗大透切止也十里却呼號自下所騎馬右持腰間刀左牽紫遊韁飛走使我髙洙曰公言避乱日輟白馬載使使走免難於危險之中昔鄴下童謡曰青青御路楊白馬紫遊韁茍活到今日寸心銘佩牢洙曰懐輟馬之恩也亂離又聚散宿昔恨滔滔水花笑白首蘇曰阮紹泛西池云白首登書船反慮水花笑水花水芝皆蓮也趙曰公言在潭州賔於江故云春草隨靑袍洙曰哀江南賦青袍如草趙曰以言王評事往南海也廷評近要津節制収英髦趙曰言南海節度使幕中要賢材也北驅漢陽傳南汎上瀧舠鄭曰上力公切又音雙下都髙切洙曰漢陽地名傳傳車也如今之秉驛是也舠小舟也右按嶺南人名急湍曰瀧趙曰傳音張恋切郵馬之謂也自漢南而往故曰漢陽傳以有使南海之役故曰言瀧舠瀧吕紅切廣韻南人呼湍爲瀧家聲肯墜地利器當秋毫洙曰見烜舊家声注肯墜地言能自振立不令委墜虞詡曰不逢錯節盤根何以知爲利器也畨禺親賢領洙曰縣名屬廣州也趙曰必宗室之子爲節度也鄭曰畨禺廣劉屬縣籌運神功操大夫岀盧宋趙曰廣府節度使清白者四裴伷先李朝隱宋璟及盧奐所以比大夫於盧宋而又謂岀其上也寳貝休脂膏洞主降接武趙曰謂廉潔而不汚於貨利也昔漢孔奮凊潔身處膏脂而未甞自潤降户江反廣南有溪洞蠻其長謂之洞主禮記曰堂上接武言相継而降也海胡舶千艘夢符曰右按畨禺雜編蕃商遠國運竒貨非舶不可市舶録劉徇曰獨檣舶深五十餘肘三木舶深五十餘肘西域以肘爲度李䖍通俗文曰晉曰舶鄭曰艘蘇曹切船也趙曰舶大舡也畨禺雜録曰畨商遠國運貨貨非舶不可舶緫名曰艘猶今言幾隻也我欲就丹砂跋渉覺身勞洙曰葛洪聞交趾出丹砂求爲勾漏令至廣州刺史鄧洪留洪乃止羅浮山錬丹安能䧟糞土有志乗鯨鼇或驂鸞騰天聊作鶴鳴臯洙曰見李白騎鯨魚注别賦駕鶴上漢驂鸞騰天趙曰鯨莫大之魚也鼇臣鼇也師曰自餬口言荒年何暇具禮待人客位但箕箒言貧無餘物虬髯指太宗也雲從龍風從虎喻君臣唱和也尓曹指王殊馮翊郡名魂獨委蓬蒿言幾死於草野也水花連花也鏡謂之菱花鏡中笑我白首春草隨靑袍言𫀆色與春草同謂年老而官卑也廷評即評事也要津言官清要節制収英髦言南海節度収英髦之士如王殊輩真得人也傳十有二義漢文帝紀曰關無用傳此符傳也以木爲之書符於其上又以一板封之所以爲信也傳亦謂之棨或有用𥜗者終軍所弃是也髙祖紀曰乗傳詣洛陽此傳驛之傳也廣韻云南人名湍爲瀧又州名在廣南音雙船三百斛曰舠舠短也江南所爲名短而廣安而不傾危也北驅謂自北驅車而來遂從此南泛海而往也畨禺縣屬廣州今王殊領之其清節岀乎盧懷愼宋璟不貪寳貝以削民脂膏蠻洞聞其賢盡歸順舶客皆來交易故頓不能往也雖有志乗鯨鼇不甘䧟没于糞上其柰跋渉之逺何末章羡王殊領此得就丹砂以錬養故有驂鸞鳴鶴之語閬州東樓筵奉送十一舅往青城縣得昏字曽城有髙樓制古丹雘存洙曰梓材旣勤樸斵惟其塗丹雘注塗以􅃮丹以朱而後成山海經云靑丘之山多有貫雘頭陁碑朝霞爲丹雘顔延年雖暫丹雘陁趙曰字出淮南子崑崙之山有曾城九重迢迢百餘尺洙曰西京賦狀迢迢以亭亭古詩迢迢牽牛星雙闕百餘尺陸士衡髙樓一何峻迢迢峻而安豁達開四門髙曰舜闢四門漢髙祖豁逹大度雖有洙曰一作㑹車馬客而無人丗喧洙曰陶淵明結廬在人境而無車馬喧遊目俯大江列筵慰别魂洙曰江淹黯然銷魂者惟别而巳謝靈運得以慰别魂蘇武俯觀江漢流是時秋冬交節往顔色昏洙曰雪賦歳将暮時将昏天寒鳥獸伏洙曰登樓賦歩棲遲以徙倚兮白日忽其將匿風蕭瑟而並興天慘慘而無色獸狂顧以來群鳥相鳴而舉翼霜露在草根今我送舅氏洙曰詩渭陽沈休文樹頭鳴風颷草根積霜露萬感集淸罇洙曰謝靈運千念集日夜萬感盈朝昏豈伊山川間迴首盗賊繁髙賢意不暇王命乆崩奔洙曰靈運詩拆岸婁崩奔臨風欲慟哭洙曰賈誼傳聲出巳復吞師曰此樓多是送客于是雖有車馬往来而去塵市稍逺故云而無塵丗喧顔色昏謂離别之際慘澹無顔色也天寒鳥獸休鳥獸尚得休息而人行役故傷之也霜露在草根此乃萬物歸根之時而舅氏未能室處尚往靑城是以使我對酒不能無感懐也豈惟傷其山川間隔仍痛賊之多舅氏奉王命不遑啓居如山之崩如水之奔往來辛勤若此得無憂念之乎閬州奉送二十四舅使自京赴任靑城新添聞道王喬舄名因太史傳如何碧雞使把詔紫微天定功曰王襃傳曰方士言益州有金馬碧雞之寳可祭祀致也宣帝使襃往祀焉後漢卬都夷傳靑蛉縣禹同山有金馬碧雞光景時時岀見也秦嶺愁回馬鄭曰秦嶺在秦川涪江醉泛船靑城漫汚雜吾舅意凄然奉送崔都水翁下峽新添無數涪江筏鄭曰房越切海中捊鳴橈緫發時鄭曰橈如招切楫也别離終不乆宗族忍相遺白狗黄牛峽鄭曰十道志開州有白狗峽二石隱起如白狗也又有黄牛峽髙崖上有石色黄如牛朝雲暮雨祠所過慿問訊鄭曰過古禾切到日自題詩巫峽弊廬奉贈侍御四舅别之澧朗江城秋日落山鬼閉門中行李淹吾舅洙曰行李猶行使也見上注誅茅問老翁洙曰屈原誅茅赤眉猶丗亂洙曰光武平赤眉之亂靑眼只途窮洙曰阮籍善爲青白眼以白眼待俗客青眼待佳客傳語桃源客人今出處同洙曰見欲問桃花宿注趙曰桃源今之鼎州也四舅之澧朗故因以問桃源客也人則公自謂尔師曰桃源在澧秦人避亂之所竄避荆楚亦與秦人同出處也王閬州筵奉酬十一舅惜別之作萬壑樹聲滿洙曰顧愷之言千嵓競秀萬壑爭流千崖秋氣髙洙曰宋玉曰悲哉秋之爲氣也天髙而氣清浮舟出郡郭别酒寄江濤良㑹不復乆此生何太勞洙曰古詩今日良宴㑹窮愁但有骨群盗尚如毛洙曰窮愁而瘦極也群盗尚多故如毛蘇曰齊招群盗如毛四方擾擾吾舅惜分手使君寒贈𫀆洙曰范睢見須賈賈曰范叔寒如此哉乃取一綈𫀆以賜之後睢謂賈曰公所以得無死者以綈𫀆戀戀有故人之意沙頭暮黄鶴失侣自洙曰一作亦哀號趙曰亦一作自當以亦爲正言人别而哀矣黄鶴失侣之亦然也奉送十七舅下邵桂絶域三冬暮洙曰棄方朔傳三冬文史足用浮生一病身感深辭舅氏洙曰詩渭陽我見舅氏别後見何人縹緲蒼梧帝洙曰謝玄暉詩雲去蒼梧野顔延年謁帝蒼山溪檀弓舜葬於蒼梧之野蒼梧南越趙曰虞舜死於蒼梧之野指言虞舜以𫐠十七舅所往之處也推遷孟母隣洙曰孟子序曰㓜𬒳慈母三遷之教潘安仁閑居賦孟母所以三徙注孟軻母與軻少居近墓軻乃戲爲墓軻母曰此非所居去居市傍軻愛戲爲商賈又居學館之旁遂爲大儒趙曰孟母指言十七舅之母也昏昏阻雲水側望苦傷神洙曰張平子四愁詩側身東望涕霑翰蜀都賦望之天廻即之雲昏奉送二十三舅録事之攝郴州崔偉賢良歸盛族趙曰周禮友行以尊賢良賢則行之傑良則才之美吾舅盡知名徐庶髙交友洙曰徐庶字元直謂先主曰諸葛孔明乃卧龍也将軍豈欲見之乎先主遂詣見趙曰以言雀舅徐庶字元直其所與遊者諸葛亮龎士元司馬徳操之流而巳劉牢出外甥洙曰桓玄曰何無忌劉牢之外甥酷似其舅今舉大事孰爲無成趙曰公以無忌自比也泥塗豈珠玉蘇曰莊趙泥塗之中豈隱珠玉趙曰言崔舅謂明珠白玉之質豈冝辱在泥塗乎環堵但柴荆衰老悲人丗驅馳猒甲兵氣春江上别洙曰謝玄暉江上徒離憂楚詞湛湛江水兮上有楓目極千里傷春心淚血渭陽情洙曰詩我送舅氏曰至渭陽趙曰淚盡継之以血渭陽情全出晉書丗無渭陽情舟鷁排風影林烏反哺聲洙曰束晢𥙷亡詩嗷嗷林烏受哺於子趙曰言崔舅侍太夫人以行也李善註文選有曰純黒而反哺者烏子永嘉多北至洙曰永嘉之亂元帝渡江衣冠多自北至鄭曰永嘉晉年號趙曰言崔舅自北而來也勾漏且南征洙曰葛洪求爲勾漏令以有丹砂也楚詞油吾南征鄭曰句古侯切邑名屬交阯必見公侯復洙曰左傳公侯必復其始趙曰今句可以見崔舅貴人子孫也終聞盗賊平郴州頗凉冷橘井尚凄淸趙曰此據風士而言之也蓋以南方多熱而北郡獨凉矣橘井在郴州神仙蘇耽於山下鑿井種橘救郷里之疾病者從役何蠻貊居官志在行洙曰論語言忠信行篤敬雖蠻貊之邦行矣左傳當官而行何強而有贈比部蕭郎中十兄甫從姑之子有美生人傑洙曰人中之豪傑以其傑岀故謂之人傑漢有三傑由來積德門漢朝丞相系洙曰謂䔥相囯何梁日帝王孫洙曰梁武帝姓蕭藴藉爲郎乆洙曰以藴藉而爲郎東觀漢記桓榮温恭有藴藉文頴曰寛博有餘也魁梧秉哲尊洙曰周勃傳魁梧竒偉一音悟魁言丘墟壯大之意也梧者言其可驚悟汪端本曰漢蕭望之爲儒宗注云宗尊也又望之爲人堂堂有風貌故云云詞華傾後軰蘇曰髙鳯詞華後輩傾惟冝爲師範風雅藹孤騫趙曰騫音虚言切飛舉之皃也師曰騫騰也言飛騰无與之偶故曰孤騫宅相榮姻戚洙曰晉魏舒少孤爲外家寗氏所養寗氏起宅相宅者云當出貴甥舒曰當爲外氏成此宅相後爲公趙曰䔥兄杜家之後孫故比之爲魏舒也師曰北史李靈傳邢晏稱其甥李繪曰如對珠玉宅相之寄良在此甥又文苑傳王褒字予深七歳能屬文外祖梁司空愛之謂賔客此兒當成吾宅相蕭乃甫姑之子故有宅相之女兒童惠討論趙曰方兒童時得蕭兄惠以討論之益也林敏功曰惠聦慧也見知眞自㓜洙曰潘安仁懷舊賦序云余十二而獲見於父友東武戴侯楊君始見知名遂申之以爲婚姻謀拙媿諸昆洙曰子美與蕭爲姑舅之昆仲漂蕩雲天闊沉埋日月奔洙曰雲天闊言漂蕩而相去遼遠也日月奔謂沉埋而歳月易失也致君時巳晚懐古意空存趙曰上句言見知於蕭兄巳自㓜時而自後謀拙則每媿諸兄其謀拙者何飄蕩於外而不能仕進以致君故也中散山陽鍜洙曰嵇康爲中散大夫尚性絶巧而好鍜王戎自言與康居山陽二十年未甞見喜愠之色向秀傳嵆康善鍜秀爲之佐相對欣然旁若無人愚公野谷村洙曰列子愚公移山而智叟笑止之修可曰韓子昔齊威公入山問父老此爲何谷荅曰臣舊畜牛生犢以子買駒少年謂牛不生駒遂持去傍隣以臣爲愚遂名爲愚公谷江淹兎園賦坐帳無鶴支床有龜一寸二寸之魚三竿两竿之竹名爲野人之家是謂愚公之谷寧紆長者轍洙曰陳平以席爲門而門多長者車轍陶潜王公紆轍趙曰公在山陽愚谷之間自以其僻矣而蕭兄臨之故有此句歸老任乾坤婚姻古詩二首律詩一首佳人王深父曰俗偷則人之無告者正不足以恤之也師曰詩簡兮刺不用賢云彼美人兮西方之人兮盖言賢者有佳美之德此詩亦以佳人喻賢者君用新進少年至於踈弃舊臣甫寓意有此作非獨爲佳人之什讀者可以意㑹絶代有佳人洙曰李延年歌曰北方有佳人絶代而特立幽居在空洙曰一作山谷洙曰詩皎皎白駒在彼空谷自云良家子洙曰趙充國傳六郡良家子耒曰漢成帝選良家子充後宫零落依草木關中昔䘮敗洙曰一云䘮亂兄弟遭殺戮官高何足論不得収骨肉蘇曰崔弘磔於市骨肉不得収葬丗情惡衰歇萬事隨轉燭蘇曰徐邈萬事興㐮轉燭相似何必計較夫婿輕薄兒洙曰沈休文詩長安輕薄兒新人羙如玉洙曰一云已如玉古詩燕趙多佳人美者顔如玉合昏尚知時定功曰夲草云合歡即夜合也人家多植庭除間一名合昏陳藏器云其葉至昏即合故曰合昏趙曰佳人自怨之辭言物之有合有偶而人之不若也天覺曰周處風士記云合昏槿也詠曰陳藏器夲草曰晨葉舒而至暮即合故曰合昏一名合歡即夜合也葉似皂夾之極細繁宻孝祥曰陸倕刻漏銘曰合昏暮捲蓂莢朝開鴛鴦不獨宿洙曰詩鴛鴦于飛鄭氏婚禮謁文曰鴛鴦鳥雄雌相類飛止相隨列異傳朱康文埋韓馮夫妻宿夕文木生鴛鴦雄雌各一常栖樹上晨嫣夕交頸音聲感人趙曰崔豹古今注曰鴛鴦鳬類也雌雄朱甞相離人得其一一思而死故謂之匹鳥蒼舒曰雄鳴曰鴛雌鳴曰鴦伹見新人笑那聞舊人哭趙曰李白亦云新人如花雖可寵舊人似玉猶來重字起薖曰古詩新人工織縑在山泉水淸出山泉水濁趙曰此佳人志夫之辭逸曰晉孫綽蘭亭詩序曰古人以水喻性有旨哉斯談非所以停之則清混之則濁邪情因所習而遷移物因所遇而感興侍婢賣珠㢠洙曰東方朔傳董偃母以賣珠爲事牽蘿𥙷茅屋蘇曰陶景山居賦云采芝蕈爲盤𬞞牽藤蘿𥙷嵓屋景差山齋云牽蘿摭壞籬挽葛補漏茅此乃見工部深得換骨法摘花不揷髪修可日一作䯻以言其不事粉飾此詩所謂自北之東首如飛蓬豈無膏沐誰適爲容采栢動盈掬洙曰詩終朝采緑不盈一掬蘇曰胡彛隠居衡山采栢子食年踰百歳靣類如兒章少壯追奔不及永徽中往往人見之天寒翠䄂薄日暮倚脩竹洙曰屈原山鬼云余處幽篁兮終不見後漢竇玄舊妻與玄書别曰弃妻斥女敬白竇生卑賤鄙陋不如貴人妾日已遠彼日巳親衣不厭新人不厭故悲不可忍怨不可去彼獨何人而居我處玄以形貌絶異天子以公主妻之故舊妻乃云趙曰上句言天色巳寒而翠䄂尚薄下句則所思遠矣師曰栢與竹歳寒不改其操亦猶君子見逐於君而吾操守終無改易此所以爲忠臣貞婦也新婚别王深父曰先王之政新有婚者朞不使政出於刑名則一切便衆而巳此詩所怨盡其常分而不能忘禮義余是以録之兎絲附蓬麻引蔓故不長洙曰古詩與君爲新婚兎絲附女蘿詩弁蔦與女蘿施于松栢蔦寄生也女蘿兔絲松蘿也陸機䟽云今兔絲連草上生黄赤如金合藥兔絲子是也在草曰兎絲在木曰松蘿趙曰兔絲當附松栢而乃附蓬麻爲不得其所矣嫁女與征夫不如弃路傍蘇曰周𫐠生而怪異父曰不如弃置路傍母弗許後文章隨名結髮爲妻子洙曰蘇子卿詩結髪爲夫妻恩愛兩不疑席不暖君床洙曰孔席不暇暖蘇曰王簡楼君床席未暖遽蒙弃逐暮婚晨告别無乃太怱忙君行雖不遠守邊赴洙曰一作戍河陽洙曰河陽東都也妾身未分明何以拜姑嫜鄭曰諸良切夢符曰右按前漢廣川王去爲幸姬陶望卿作歌曰背尊章嫖以忽顔師古曰尊章言舅姑也時可曰曹子建詩妾身守空閨吕曰按陳琳飲馬長城窟行云善事新姑嫜此姑嫜字所岀也師曰姑之夫曰嫜父母養我時日夜令我藏生女有所歸洙曰歸人謂嫁曰歸雞狗亦得將洙曰狗一作犬君今死生地沉痛迫中膓洙曰鮑昭生軀蹈死也謝靈運眷言懷君子沉痛切中膓韓信置之死地而後生魏文帝詩断絶我衷膓趙曰鮑昭詩沉痛切中膓誓欲隨君往形勢反蒼黄洙曰北山移文蒼黄飜覆蘇曰形勢不可欺軍馬蒼黄擊其左右勿爲新婚念努力事戎行洙曰古詩努力加餐飯蘇武詩努力愛春花李陵努力崇明德樂府少壯不努力婦人在軍中兵氣恐不揚蒼梧曰右按前漢書李陵與單于戰陵曰士氣少衰而鼓不起者何也軍中豈有女子乎始軍岀時關東羣盗妻徙邊者隨軍爲卒妻婦大匿軍中陵按得皆劒斬之自嗟貧家女乆致洙曰一作致此羅𥜗裳鄭曰襦人朱切短衣也羅𥜗不復施洙曰淳于髠云羅𥜗襟解對君洗紅桩洙曰古詩娥娥紅粉粧仰視百鳥飛大小必雙翔人事洙曰一作生多錯迕與君永相望鄭曰無方切趙曰宋玉風賦回穴錯迕注云雜錯交迕也師曰詩采緑刺怨曠也觀甫此詩怨别又甚於采緑者矣送大理封主簿五郎親事不合却赴通州主簿前閬州賢子余與主簿平章鄭氏女子垂欲納采鄭氐伯父京書至女子巳許他族親事遂停禁臠去東牀朱曰晉謝混字叔源𥘉孝武帝爲晉陵公主求婿謂王珣曰主婿伹如劉真長王子敬便足如王處仲桓元子誠可才小冨貴便豫人家事玽對曰謝混雖不及眞長不减子敬帝曰如此便足未幾帝崩袁山松欲以女妻之珣曰卿莫近禁臠𥘉元帝始鎮建業公私窘鏧毎得一豚以爲珎膳項上一臠尢美輙以薦帝羣臣未甞敢食于時呼爲禁臠故珣因爲戯琨竟尚主王羲之傳太尉郄鍳使門生求女婿於王導導令就東廂徧觀子弟門生歸謂鍳曰王氏諸少並佳然聞信至咸自矜持推一人在東床坦腹食獨若不聞鍳曰正此佳婿邪訪之乃羲之也遂以其女妻之趨庭赴北堂洙曰語陳亢問於伯魚亦有異聞乎對曰未也甞獨立鯉趨而過庭曰學禮乎對曰未也不學禮無以立鯉退而尊禮鄘詩伯兮焉得諼草言樹之背注背北堂䟽背者何背之義婦人所常居者掌也故知背爲北堂士昏禮云婦洗在北堂注房半以北爲北堂者房室所居之地揔謂之堂風波空逺渉蘇曰劉琨至髙安歎曰事不我濟空遠渉風波琴瑟幾虚張洙曰詩鹿鳴妻子好合如鼔琴瑟董仲舒琴瑟不調心解而更張之趙曰夫婦以比琴瑟也公自注云幾音拍巨至切洎及也渥水出騏驥洙曰漢武元鼎四年馬生渥洼水中李斐曰南陽新野有暴利長當武帝時遭刑屯田潡煌界數於此水旁見群野中有竒者與凡馬異來飲此水利長先作土人持勒靽於旁後馬翫習乆之乃今乆代土人持勒靽收得其馬獻之欲神異此馬云從水中岀師古云渥音握崑山生鳯凰洙曰東京賦鳴女床之烏鳥舞丹穴之鳯凰趙曰莊子吾聞南方有鳥其名爲鳯所居積石千里則崑山可以言生鳯凰矣兩家誠欵欵蘇曰索靖法帖兩家誠心欵欵柰凡女催行中道許蒼蒼頗謂秦晉匹洙曰襄二十七年傳趙孟曰晉楚齊秦匹也晉之不能於齊猶楚不能於秦也又秦晉匹也何以卑我從來王謝郎洙曰晉江左以王謝爲胄族甞通婚青春動才調蘇曰祢衡青春惱客意處處動微吟白首缺輝光玉潤終孤立洙曰晉樂廣字彦輔人謂之冰鏡女婿衛玠字叔寳時號玉人故時語曰婦翁冰淸女婿玉潤
