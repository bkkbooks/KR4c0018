front:
  text: 分門集注杜工部詩卷第十六
  hash: sha256:db393955c44b112f2c1601ddf00b30427d596c2c72d35e2d766b3e1e60f1a014
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_016-1a}
body:
  text: 文章古詩二首律詩十四首夜聽許十誦詩愛而有作許生五臺賔洙曰河北有五臺山鄭曰五臺山名今在河北其山五蠻環秀巍然俗謂之五臺仙人之都也業白出石壁趙曰此言許生客居五臺行業精白而出也佛經以美業為白惡業為黑逹磨嘗曰當勤修白業大觀曰石壁字暗使列子載趙襄子狩於中山有一人從石壁出隨煙上下余亦師粲可身猶縳禪寂洙曰師粲善詩修可曰粲可乃六祖僧粲及慧可二禪師粲傳法偈華種雖因地從地種花生若無人下種花地盡無生可傳法偈本來緣有地種花生本來無有種花亦不能生二人乃禪中祖師故子美師之非師粲善能詩者也趙曰粲則僧粲可則慧可傳燈云正與逹磨丗次相接公方與許生共學性空事故云許生巳業白而出吾猶縳禪空而未脫也縳字出佛書其語曰貪著禪味是菩薩縳縳禪則不能解也何階子方便謬引為匹敵趙曰此言有何因階得子垂方便之行而以為之匹也洪駒父引佛經善巧方便其說是而舊注以為田子方離索晚相逢昱曰記檀弓吾離羣而索居包蒙欣有擊洙曰易九二包蒙上九擊蒙誦詩渾洙曰一作混遊衍四座皆辟易洙曰皆一作俱項羽傳項羽瞋目叱赤泉侯人馬俱驚辟易數里應手看捶鈎鄭曰捶子果切又之纍之睡二切洙曰莊子知北遊大馬之棰鈎者年八十矣而不失豪芒大馬曰子巧歟曰臣有守也臣之年二十而好捶鈎於物無視也非鈎無察也是用之者假不用者也以長得其用而况乎無不用者乎物孰不資焉注拈捶鈎之輕重而無豪芒之差都無懷則物來皆應大馬司馬也郭云捶者拈捶鈎之輕重而不失豪芒也或說云江東三魏之間人皆謂錘為棰音字亦同郭失之今不從此說趙曰莊子輪扁斫輪有曰得之於心而應之於手清心聽鳴鏑洙曰前漢胸奴傳冒頓作鳴鏑出獵左右皆隨鳴鏑而射殺頭曼應劭曰髐箭也左思詩邊城苦鳴鏑陸機鳴鏑自相知趙曰黃魯直云新詩如鳴弦蓋出於此也鄭曰鏑丁歷切矢鋒也精微穿溟涬鄭曰上亡頂反下户頂反洙曰莊子在宥篇大同乎涬溟注與物無際趙曰禮記致廣大而盡精微帝系譜曰天地𥘉起溟涬𪷟鴻舊注引莊子大同乎涬溟注云自然之氣然終非本出杜公不敢倒用也師曰謂詩之精微與天地之氣相貫穿飛動摧霹靂洙曰公羊注曰雷疾而甚者為震震與霆皆謂霹靂也陶謝不枝梧洙曰陶潜謝玄暉靈運惠連之徒也前漢項籍傳即帳中斬宋義頭諸將讋服莫敢枝梧如淳曰枝猶枝梧也臣瓉曰小柱為枝邪柱為梧今屋斜柱是也師曰霹靂雷霆之威謂詩思飄然飛動雖霹靂之威亦為摧沮足見詩思之壯也風騷共推激紫鸞自超詣洙曰紫鸞當作紫燕字之誤也西京雜記文帝自代還有良馬九皆天下之駿其第五馬名紫燕翠駮誰剪剔洙曰爾雅駮如馬倨牙食虎豹管子曰桓公乘馬虎望見而伏公問管仲管仲意者君乘駮馬公曰然仲曰駮馬食虎豹故疑焉紫燕良馬名也莊子曰治馬者燒之剔之君意人莫知人間夜寥閴蘇曰羲之一曰披襟立池上無語羊欣曰人莫知君意何也趙曰寥閴寂靜之義梁蕭子範直坊賦曰何坊禁之寥閴對長夜之蕪永芻曰末句崔非傷無知巳者乎贈蜀僧閭丘師兄彥輔曰太常博士均之孫大師銅梁秀洙曰左思蜀都賦於東則左綿巴中百濮所充外負銅梁於嚴渠內函要害以膏腴田曰太平御覽載張孟蜀都賦注云銅梁山名也按其山有桃枝竹東西連亘二十餘里山嶺之上平整逺望諸山此獨秀也山在合州界銅梁縣籍籍名家孫洙曰袁陽源白馬篇籍籍關外來車徒傾國鄽安石曰籍籍名聲之衆也嗚呼先博士炳靈精氣奔洙曰左太冲蜀都賦近則江漢炳靈丗載其英鬱若相如皭若君平王褒暐曄而秀發揚子含章而挺生師曰炳靈言英靈顯赫也惟昔武皇后臨軒御乾坤多士盡儒冠墨客藹雲屯洙曰楊子雲上長楊賦聊因筆墨之成文章故藉翰林以為主人子墨為客卿以諷陸士衡馬如雲屯當時上紫殿不獨卿相尊洙曰謝玄暉直中書省紫殿肅隂隂丗傳閭丘筆師曰閭丘文筆號為大手峻極逾崑崙洙曰禹本紀曰崑崙髙三千五百里日月所相避隱為光明也詩峻極于天鳳藏丹霄暮洙曰一作穴龍去白水渾洙曰東京賦我丗祖忿之乃龍飛白水鳯翔參墟青熒雪嶺東洙曰西都賦琳珉青熒去一作出沈曰雪嶺在蜀一名太白山碑碣舊製存鄭曰碣巨列切田曰東蜀牛頭山下有閭丘均撰瑞聖寺磨崖碑嚴政書寺今改為天寧羅漢禪院斯文散都邑髙價越璵璠洙曰均以文名當時四方碑碣多出其手晚看作者意趙曰郤生見王導詩歎曰晚見作者妙意梅曰作者指均也妙絶與誰論洙曰陸韓卿賦歌能妙絶吾祖詩冠古鄭曰冠古玩切同年蒙主恩豫章夾日月歲久空深根洙曰見豫章深出地注小子思踈闊豈能逹詞門蘇曰宗戩讀淵明詩撫卷歎曰小子踈略焉能逹文詞之門閫使人有愧服之心信乎一丗之真儒窮愁一揮淚洙曰愁一作秋陸士衡揮淚歎流離又揮淚廣川隂相遇即諸昆我住錦宫城洙曰成都記錦城以江山明麗錯雜如錦兄居祇樹園鄭曰祇翹移切洙曰金剛經佛在舍衛國祇樹給孤獨園田曰楞嚴經云祗洹精舍注云祇洹林樹名㖵云祇陀洹或云逝多此云戰勝即太子名林王是彼故云勝林精告建立有二因緣須逹長者施園祇陀太子施樹地近慰旅愁往來當丘樊天涯歇滯雨粳稻卧不翻漂然薄遊倦始與道旅敦旅一作侣魯曰敦厚也景晏步修廊而無車馬喧洙曰陶淵明結廬在人境而無車馬喧夜闌接軟語落月如金盆洙曰謝靈運夜聽極星闌車又繼以闌夕語法華經又以軟語一云言詞柔軟漠漠丗界黑洙曰一作空驅驅爭奪繁唯有摩尼珠可照濁水源洙曰言性照圜明如摩尼珠然雖識濁水而不為汚濁所纍也如語云涅而不淄田曰圎覺經譬如清淨摩尼寶珠映於五色隨方各現諸愚癡者見彼摩尼實有五色圎覺净性現於身心隨類各應亦復如是觀無量壽佛經云諸天童子摩尼以為纓絡光照百餘里猶如和合百億日月不可具名室志云馮翊嚴生家漢南現山得一洙如彈丸色胡人曰此西國清水珠也若至濁水冷然洞徹矣以三十萬易之而去師曰摩尼珠以喻法性圎明淸淨不染塵垢甫奔走盜賊間健羡閭丘不為汚濁所纍故云云寄李十二白二十韻昔年有狂客號爾謫仙人洙曰賀知章㑹稽人自號四明狂客見白文章乃歎曰子謫仙人也筆落驚風雨洙曰驚一作聞驚風雨言敏速也詩成泣鬼神洙曰泣感鬼神蘇曰李白墓銘云公在長安時祕書監賀知章吟公烏栖曲云此詩可以哭鬼神聲名從此大汨沒一朝伸洙曰按史言知章言白於玄宗召見金鑾殿奏頌一篇賜食帝為調羹召供奉翰林文彩承殊渥流傳必絶倫洙曰帝嘗召白為樂章白巳醉援筆成文婉麗精巧無留思帝愛其才數宴見龍舟移棹晚獸錦奪𫀆新洙曰白外傳云白作樂章賜錦𫀆白日來深殿青雲滿後塵乞歸優詔許洙曰白為髙力士所諸自知不為親近所容懇求還山帝賜金放遂遇我宿心親洙曰宿一作夙與子美等為醉中八仙未負洙曰一作逐幽棲志兼全寵辱身劇談憐野逸嗜酒見天真洙曰嗜好也揚雄家貧嗜酒醉舞梁園夜洙曰雪賦梁王不恱遊於兔園今汴州乃梁園故地行歌泗水春洙曰孔子行歌於泗水之上泗水今泗濵是也才髙心不展道屈善無鄰處士禰衡俊洙曰平原處士禰衡字正平見諸公厭祢衡注諸生原憲貧洙曰見難甘原憲貧注稻粱求未足洙曰廣絶交論分鴻鶩之稻粱薏苡謗何頻鄭曰薏於記苡養里切洙曰馬援征交趾載薏苡種還人謗之以為明珠大貝喻白之遇讒也五嶺炎蒸地三危放逐臣洙曰見雲山分五嶺風壤帶三苗注幾年遭鵩鳥洙曰賈誼作長沙王傳不得志有鵩集于舍隅遂作鵩鳥賦獨泣向麒麟洙曰王翰古峨眉怨朝晡泣對麒麟樹樹下蒼苔日漸班蘇武先還漢洙曰見握節漢臣回注黃公豈事秦洙曰夏黃公也見羽翼懷商老注楚筵辭醴日洙曰見門引申白賔注梁獄上書辰洙曰白坐事下潯陽獄鄒陽於梁孝王獄中上書即出之巳用當時法誰將此義陳老吟秋月下病起暮江濵莫怪恩波隔乘槎與問津洙曰博物志有居海者八月乘查而上天犯牽牛星孔子使子路問津焉送竇九歸成都文章亦不盡竇子才縱橫非爾更持節何人符大名讀書雲閣觀問絹錦宫城我有浣花竹題詩須一行偶題文章千古事得失寸心知趙曰言文章垂不朽之事其得其失蓋吾心自知之作者皆殊列名聲豈浪垂洙曰言以文章名必有所長也騷人嗟不見洙曰丗之言文章者謂文至於齊梁之間變而為風騷矣趙曰指言屈原宋玉也文章之祖起於騷嗟不見則屈宋逺矣漢道盛於斯洙曰漢文章深厚有古人之風趙曰言漢有司馬遷相如劉向王褒之屬傷今不復見古人也師曰文章惟漢為渾厚森嚴故曰漢道盛於斯心從弱歲疲前輩飛騰入餘波綺麗為洙曰綺麗騷人之作也趙曰文章至於綺麗乃騷雅之末流矣故謂之餘波後賢兼舊利洙曰利一作列後之作者兼騷人之躰也歷代各淸規趙曰所謂遞相祖述也法自儒家有心從弱歲疲趙曰公自謂也吾之用心自弱冠時疲苦至今也永懷江左逸洙曰江左晉元帝渡江所都也阮藉之流文多尚逸趙曰江左則嵇阮鮑謝之徒文選多采取焉故公永懷之多病鄴中竒洙曰病一作謝鄴魏所都文帝好文故作者多尚竒江文通云關西鄴下既巳罕同河外江南頗為異法騄驥皆良馬麒麟帶好兒趙曰麒麟之子仍是麒麟故云帶好兒車輪徒已斫洙曰莊子桓公讀書輪扁以為聖人之糟粕桓公曰寡人讀書輪人安得議乎輪扁曰以臣之事觀之夫斫輪徐則甘而不固疾則苦而不入不徐不疾得之於手應之於心口不能言有數存焉於其間臣不能以喻臣之子臣之子亦不得受之於臣是以行年七十而老斫輪古人之與其不可傳也死矣然則君之所讀者古人之糟粕巳陸士衡文賦是蓋輪扁所不得言故非華說之所能精也堂構惜仍虧洙曰書曰若考作室既底法厥子乃弗肯堂矧肯構謾作潜夫論洙曰後漢王符字莭信隱居著書三十餘萹以譏當時失得不欲章顯其名故號曰潜夫論虛傳幼婦碑洙曰曹操與楊修讀曹娥碑隂有八字曰黃絹幼婦外孫韲臼修解得操行三十里乃悟云黃絹是色絲絶字也幼婦少女少女妙字也外孫女子女子好字也韲曰受辛之器受辛辭也言絶妙好辭與楊合操曰有智無智校三十里緣情慰漂蕩洙曰文賦詩緣情而綺靡抱疾屢遷移經濟慙長䇿洙曰言無經濟之才趙曰公雖為自謙蓋亦自傷於不用也飛棲假一枝洙曰鷦鷯賦巢不過一枝左太冲巢林棲一枝可為逹士模塵沙傍蜂蠆鄭曰傍蒲浪切近也江峽繞蛟螭洙曰蜂蠆蛟螭皆毒物也言避患難不暇耳趙曰言樓托於夔州之地如此非有譬托蕭瑟唐虞逺洙曰沈休文論虞夏以來遺文不覩趙曰歎治古之不復見聮翩楚漢危洙曰江文通雜躰詩序夫楚謡漢風既非一躰魏製晉造固亦二躰趙曰傷戰爭之不能安聖朝兼盜賊洙曰胡虜為中原之亂也趙曰言前有安史今有吐蕃是也異俗更喧卑洙曰公北人而在南故呼楚人為異俗喧卑囂雜貌鬱鬱星辰劒洙曰張華夜登樓望見牛斗間有異氣乃鄷城寶劒也蒼蒼雲雨池洙曰周瑜傳蛟龍得雲雨恐非池中物革曰此二句子美自喻失其所也如此兩都開幕府洙曰兩都東京西京也幕府謂元帥也萬㝢插軍麾洙曰謂天下用兵也南海殘銅柱洙曰馬援勒功銅柱趙曰言在南亦有侵犯者馬援征南時立銅柱而勒功其上也師曰恨無人立功如馬援也東風避月支洙曰胸奴傳東胡強而月氏盛趙曰以比吐蕃也師曰言避吐蕃之難也音書恨烏鵲洙曰西京雜記乾鵲噪而行人至趙曰恨烏鵲之不信也號怒怪熊罷洙曰苦寒行熊羆對我蹲趙曰言夔州山居之所有也稼穡分詩興洙曰役於營生不暇吟詠也柴荆學士冝洙曰習其風俗也故山迷白閣秋水憶黃陂洙曰白閣黃陂閞中山水趙曰白閣則終南山相附之山皇陂則皇子陂也舊以為黃陂誤矣不敢要佳句鄭曰要伊逍切愁來賦别離趙曰言夫鄉國之逺也戲為六絶庾信文章老更成凌雲健筆意縱橫趙曰庾信文章綺麗為丗所尚江南賦尤見稱於丗謂若相如作大人賦飄然有凌雲之氣今人嗤點流傳賦田曰于寶晋紀云蓋丗共嗤點以為灰塵而相詬病矣不覺前賢畏後生洙曰周書庾信字子山有盛才文章綺艷為丗人所尚謂之庾躰宿學後生竟相模範每有一文出京都莫不稱誦作哀江南賦尤為麗絶至今行於丗楊王盧駱當時體洙曰楊炯王勃盧照鄰駱賔王以文詞齊名天后初海內呼為楊王盧駱號為四傑後盧以疾投頴水卒楊卒官駱以檄武君死徐敬業難王溺死也輕薄為文哂未休趙曰四子之文大率浮麗故公以為輕薄為文而哂之未休也孔子曰其言不遜是故哂之爾曹身與名俱滅不廢江河萬古流歐曰唐史李敬玄稱楊炯盧照鄰駱賔王王勃必當顯貴裴行儉曰士之致逺先器識後文藝勃等雖有文才而浮躁淺露豈享爵祿之器也縱使盧王操翰墨劣於漢魏近風騷洙曰謂漢魏文雖近風騷未失其大全尓趙曰此篇文舉照鄰與勃也言漢魏之文去古未逺終有風騷之氣而盧王之文比之為劣龍文虎脊皆君馭洙曰龍文虎脊馬之駿異者皆君馭言皆得逸才修可曰漢天馬歌驊騮駿驥龍文虎脊武帝時西域大宛馬虎春魚目龍文鳯頸尾如蒲梢也歷塊過都見爾曹鄭曰過古禾切洙曰見學並盧王敏注王褒頌過都越國蹶若歷塊趙曰謂文章之妙如龍文虎脊之馬皆可充君之馭然或過都而蹶則猶不為不良馬也爾曹指盧王矣師道曰言逸足過都如歷士塊之易也才力應難誇數公凡今誰是出羣雄或看翡翠蘭苕上趙曰郭景純詩翡翠戲蘭苕容色更相鮮言珍禽在芳草間交相暉映而公借用言文章也未掣鯨魚碧海中洙曰言今之為文者止得小巧而已趙曰公自負其出羣雄者如掣鯨魚於碧海非釣手之善氣力之雄安能然哉不薄今人愛古人淸詞麗句必為鄰竊攀屈宋冝方駕恐與齊梁作後塵洙曰屈原宋玉言其丈才足以方駕並驅也梁齊詩躰格輕麗議者以丈之失始齊梁也趙曰此公之志也公必欲追逐屈宋而與之並駕者唯恐不超越齊梁而翻與之作後塵蓋齊梁躰格輕麗公所不取也未及前賢更勿疑遞相祖述復先誰别裁僞體親風雅夢符曰右按南史徐陵多變舊躰有新意又北史庾信父肩吾與徐陵並為東宫學士文辝竒艷丗號徐庾躰後進競相模􅚘轉益多師是汝師趙曰裁納之以近風雅亦無常師必多求前人所最長者為師耳師曰遞相祖述言齊梁相習為輕薄之文無有慨然以風雅正躰倡先者多師言意尚不一也解悶五首同作十二首五首見果實門二首見絶句沈范早知何水部洙曰謂水部郎中薛據沈約范雲見能詩何水部注曹劉不待薛郎中洙曰曹子建劉幹薛據也趙曰若薛據者恨不與曹子劉楨同時獨當省署開文苑兼泛滄浪學釣翁趙曰若薛前在省部今在荆南有江湖之樂斯為學釣翁李陵蘇武是吾師洙曰丗之言五言詩始於蘇武李陵孟子論文更不疑蘇曰顔延年云李陵蘇武句法可師餘區區輩不足數南子端論文䆒理惟孟軻之書使人不疑趙曰指孟雲卿也魏文帝有論文篇末句專言孟雲卿一飯未曽留俗客蘇曰陶侃未嘗延俗客數篇今見古人詩蘇曰校書郎孟雲卿復憶襄陽孟浩然清詩句句盡堪傳即今耆舊無新語蘇曰殷湛曰曹劉泯跡文章無宗師觀耆舊區區於毫楮閒淈竒新語何後生者敢尓為也謾釣槎頭縮項鯿鄭曰卑連切洙曰項一作頸浩然開元時人詩云梅花殘臘月栁色半春天鳥泊隨陽鴈魚藏縮頸鯿又云試垂竹竿釣果得查頭鯿鯿魚也楚人云長腰粳米縮頭鯿魚為美味也趙曰言今耆舊之間不復造新語以言鯿魚但謾釣之而已習鑿齒襄陽耆舊傳云漢水中鯿魚甚美禁人捕以槎斷水因謂之槎頭鯿陶冶性靈存底物洙曰詩能陶冶情性修可曰梁鍾嶸評阮嗣宗詩無雕蟲之工而詠懷之作可以陶冶靈性幽思趙曰言用何物以為陶冶性靈者惟有詩而巳故下句自長吟新詩改罷自長吟蘇曰謝惠連改詩既罷無知音者遇好句自吟而已熟知二謝將能事洙曰玄暉靈運趙曰熟知者稔熟之熟也公言其稔熟知謝靈運謝惠連將作此詩為能事頗學隂何苦用心蘇曰梁術云隂鏗何遜文章傑出諸公用心太苦趙曰隂則隂鏗何則何遜苦用心則不苟且為心矣不見髙人王右丞鄭曰本注云相國縉藍田丘壑蔓寒藤趙曰右丞王維也有别墅在藍田所謂輞川也最傳秀句寰區滿未絶風流相國能洙曰唐書王維傳維字摩詰開元中擢進士第乾元中轉尚書右丞以詩各盛於時尤長五言詩晚年得宋之問藍田别墅墅在輞口水周於舍下竹洲花塢與道交裴迪浮舟往來彈琴賦詩嘨歌終日嘗聚其田園所為詩號輞川集代宗時弟縉為宰相代宗好文求維文縉編綴得四百餘篇上之趙曰王維能詩號􅬈川集行于丗其弟相國縉本傳云少好學與兄維俱以名聞書畫古詩律詩共二十四首李潮八分小篆歌余曰邵氏聞見録云韓退之石鼓詩躰子美八分歌也蒼頡鳥跡既茫昧字體變化如浮雲洙曰蒼頡黃帝臣也觀鳥跡而為文字自蒼頡之後字躰變易如浮雲焉無定躰也陳蒼石鼓又巳訛趙曰韓退之詩周網陵遲四海沸宣王憤起揮天戈鐫功勒成告万丗鑿石作鼓隳嵯峨鄭曰陳蒼山名在鳯翔寶雞縣大小二篆生八分洙曰周太史籕始創大篆唐蘇載記石鼓文謂之周宣王獵碣共十鼓其文則史籕大篆漢蔡雍字伯喈為中郎將正六經于太學石壁天下摹學雍大篆入妙品小篆者秦丞相李斯刪古文復篆及史籕之書也𥘉諸侯力正文字異形秦始皇帝𥘉兼天下丞相李斯乃奏同之罷其不與秦文合者斯作蒼頡篇胡母敬作博學篇皆取史籕大篆或頗改所謂小篆秦有李斯漢蔡雍見上注中間作者寂不聞趙曰八分篆與八分事書苑所載不一以豫觀之蔡文姬別傳曰臣父雍言八分書割李斯小篆去二分取八分故曰八分書嶧山之碑野火焚棗木傳刻肥失真洙曰嶧山碑李斯書也為野火所焚人惜其文故以棗木傳刻按史記始皇二十八年東行郡國上鄒嶧山於是刻之于石乃頌秦德苦縣光和尚定功曰苦縣屬陳國故城今在亳州骨立修可曰續漢書詔苦縣立老子祠兼刻石即蔡雍八分書也趙曰野火焚謂李斯書也尚骨立謂蔡雍書也故於嶧山之碑則傷棗木之失真於苦縣之碑則喜其有骨立也嶧音亦書洙曰一作書貴瘦硬方通神蘇曰羊欣曰古將軍筆畫徑硬妙絶通神惜哉李蔡不復得洙曰李斯蔡雍不可復得吾甥李潮下筆親尚書韓擇木騎曹蔡有鄰開元巳來數八分潮也奄有二子成三人洙曰韓擇木昌黎人官至工部尚書散騎常侍工八分師蔡雍法風流間媚號伯喈中興蔡有鄰濟陽人官至胄曹參軍善八分始拙弱至天寶中遂精妙相衛間多其筆跡况潮小篆逼秦相快劒長㦸森相向八分一字直百洙曰一作千金蘇曰程邈見李斯書曰此一字直千金蛟龍盤拏肉屈強鄭曰屈九勿反亦作倔洙曰言筆跡竒怪徑屈如蛟龍之盤拏也吳郡張顚誇草書草書非古空雄壯洙曰張旭吳郡人官至右率府長史時善草書言吾見公主擔夫爭路而得其意後又觀公孫氏舞劒器而得其神飲醉輒草書揮筆大叫以頭濡墨水中天下呼為張顛醒後自視以為神人謂之草聖豈知吾甥不流宕鄭曰徒浪切過也丞相中郎丈人行洙曰丞相斯也中郎雍也丈人行尊老之稱也巴洙曰一作江東逢李潮逾月求我歌我今衰老才力薄潮乎潮乎奈汝何師曰昔蒼頡觀鳥跡以制字自頡之後有大篆小篆隸與八分行草之類字躰變易如雲無定書苑云八分書者秦羽人上谷王次仲飾隸書為之鍾繇謂之章程書王愔曰王次仲始以古書方廣少破勢建中𥘉以隸書作楷法字方八分始皇得次仲文簡略赴急疾之用甚善之蔡姬別傳曰臣父雍言八分書割程邈隸字法去八法李斯小篆去二分取八分故曰八分書蔡希總曰王次仲以楷法局促更引而伸之為八分故號八分書張懷􅗕云八分本謂之楷書楷者法也漸若八字分散故名八分後漢指帝紀延熹八年春正月遣中常侍左悺之苦縣祠老子注云苦縣厲鄉今屬陳國故城在亳州續漢書云桓帝夢見老子令左悺於賴卿祠之詔陳相邊韶立祠兼刻石即蔡伯喈八分書也又靈帝紀光和五年始置鴻都門生注云於鴻都門內置學召能為尺牘及工書鳥篆者時南陽人師冝官稱八分為最大則一字徑丈小則方寸以是考之疑苦縣蔡雍書光和師宜官書也詳觀此歌嶧山之碑野火焚謂李斯書也苦縣光和尚骨立謂蔡雍書也故初言秦有李斯漢蔡雍次惜哉李蔡不復得卒言丞相中郎丈人行而未嘗一言師宜官然苦縣之祠立於桓帝之延熹而光和乃靈帝年號豈非祠立於延熹而碑刻於光和乎蓋延熹全光和才十年之近尓或謂光和為伯喈所書華山碑苦縣老子朱龜碑未知孰是親近也言近於李蔡秦相即李斯快劒長㦸森相向解在鄭典設自施州歸行音項輩也草書失之流宕篆則不然送顧八分文學適洪吉州中郎石經後八分蓋憔悴洙曰蔡雍拜中郎將校書東觀雍以經籍去聖久逺文字多謬俗儒穿鑿疑誤後學熹平中表求正定六經文字靈帝許之雍乃自書冊于碑使工刻立於太學門外兩京記云正觀中得蔡雍石經數段雍能八分書顧侯運爐錘鄭曰錘之瑞切鍛也筆力破餘地洙曰運爐鍾言能煆錬以成一家之書夢符曰右按莊子曰無莊之失其美據梁之失其力黃帝之亡其智皆在爐錘之間耳蘇曰黃刋見蔡雍八分書曰筆力尚可破餘地昔在開元中韓蔡同贔屭鄭曰上平袐切下虛器切洙曰開元中韓擇木蔡有鄰二人善八分事見李潮八分歌注修可曰張平子西京賦綴以二華巨靈贔屭注贔屭作力之貌玄宗妙其書是以數子至御扎早流傳揄揚非造次洙曰明星師韓擇木嘗於彩箋上八分書賜張說三人並入直洙曰韓蔡顧三人也恩澤各不二顧於韓蔡內辨眼工小字分日示諸王鉤深法更祕洙曰顧丈學八分外尤能小字也文學與我遊蕭踈外聲利追隨二十載浩蕩長安醉髙歌卿相宅文翰飛省寺視我楊馬間洙曰視公如楊雄司馬相如白首不相弃驊騮入窮巷蘇曰顔倚訪原憲憲曰驊騮亦肯入窮巷必脫黃金轡趙曰顧君騎驊騮相訪脫黃金轡者言其冨貴也一論朋友難遲莫敢失墜古來事反覆相見橫涕泗嚮者玉珂人鄭曰珂丘何切誰是靑雲器洙曰此事之反覆也言貴者未必賢才盡傷形體洙曰一作骸病渴汙官位洙曰司馬病渴李尋曰久汚玉堂之署故舊獨依然危時話顚躓鄭曰音致我甘多病老子負憂丗志胡為困衣食顔色少稱遂逺作苦辛行順從衆多意舟楫無根蒂蛟鼉好為祟况兼水賊繁特戒風飊駃崩騰戎馬際往往殺長吏子干東諸矦勤勉防縱恣邦以民為本魚飢費香餌趙曰言當厚施豫以恤民為本也請哀瘡痍深告訴皇華使使臣精所擇進德知歷試惻隱誅求情洙曰當勒恤民困也固應賢愚異洙曰不可一槩為苛急當存賢愚之用心尓烈士惡苟得俊傑思自致趙曰皆以指言顧文學所以責望之深也贈子猛虎行出郊載酸鼻洙曰陸士衡樂府猛虎行渴不飲盜泉水熱不息惡木隂惡木豈無枝志士多苦心此皆勉其自振立也趙曰又戒之以無苟從也師曰漢蔡雍為中郎將善八分書書六經文命工刻碑於太學門外自雍之後八分書雕零故云憔悴張平子西都賦云綴以二華巨靈贔屭注云贔屭作力之兒及書苑云唐明皇好圖畫工八分章草豐茂英特𥘉張說為麗正殿學士獻詩明皇自於彩箋上八分書讃曰德重和鼎功逾濟川詞林秀發翰苑光鮮所謂御扎流傳者此也辨眼言於字中最號明眼者也神農本草云珂貝類大如鰒皮黃黑而骨白以為馬飾生南海勒謂之珂晋阮咸字仲容為始平太守顔延年五君詠曰仲容靑雲器靑雲言器之髙逺也按齊書江淹夢得五色筆由是文章日新後夢有人稱郭璞取之尓後為詩絶無美句時人謂為才尽甫謙言已才巳尽况又病渴豈可汚辱官位是以下文有我甘之語駃音山吏反疾貌崩騰即奔騰也軍興之際賦斂慘刻動殺長吏以叛魚飢費長餌喻民困當撫以恩也甫意欲顧生告于皇華使閔其瘡痍精擇良吏以為佐勤恤民隱無徒誅求一槩為苛急略無賢愚之異尓烈士惡茍得戒顧生無以不義而負得當自致富貴也樂府猛虎行云偈不飲盜泉水熱不息惡木隂欲其自振立之意殿中楊監見示張旭草書圖斯人已云亡草聖祕難得趙曰漢張伯英善草書人謂之草聖及兹煩見示滿月一悽惻蘇曰孫登人事悽凉滿目凄惻悲風生微綃洙曰潘安仁凱風揚微綃萬里起古色師曰言有古人之氣象鏘鏘鳴玉動落落羣松直連山蟠其間溟漲與筆力趙曰言筆力浩汗若溟勃之漲水乞與之也此篇言玉動松直山蟠皆狀其草書耳師曰自鏘鏘鳴玉動至此句皆言草書之狀有練實先書臨池真盡墨洙曰張伯英善草書凡家之衣帛必先書而後練臨池學書久池水尽黑人謂之草聖俊拔為之主泰伯曰俊拔言筆力超越人也暮年思轉極未知張王後趙曰張則伯英王則羲之誰並百代則嗚呼東吳精洙曰張乃蘇州人也逸氣感淸識洙曰張旭草書每大醉叫呼狂走乃下筆自視以為神趙曰張旭之逸氣感楊監之淸識楊公拂篋笥安石曰謂祕藏也舒卷忘寢食蘇曰李成得王逸少帖舒卷披玩寢食俱忘示兒曰此吾傳家之寶也安石曰忘寢食言愛之也念昔揮毫端不得觀酒德洙曰張自言始見公主檐夫爭道而得書法意觀公孫大娘舞劒器而得其神俊觀張旭用意不獨在於大醉而已趙曰公嘗曰張旭三杯草聖傳又劉伶善飲而有酒德頌也寄張十二山人彪三十韻獨卧嵩陽洙曰一作雲客三違潁水春師曰時彪避祿山隱居嵩陽凡三載矣故云三違違別也艱難隨老母慘淡向時人謝氏尋山屐洙曰宋謝靈運好登山陟嶺必造幽峻嵓障數千重莫不尽登躡常著木屐上山則去前齒下山則去後齒陶公漉酒巾洙曰陶潛在家酒熟取頭上葛巾漉酒畢還復著之羣凶彌宇宙此物在風塵洙曰猶使之過時則必能自致因寇亂故在風塵蘇曰鄭莊未濟時居洛下殷穆歸謂子曰於廣衆井見鄭子風神秀麗如麟鳯處羣類此物豈久在風塵耶黃曰此物指彪也歷下辭姜𬒳洙曰見醉眠秋共𬒳注趙曰後漢姜肱有兄弟四人居貧作一布𬒳而共之關西得孟鄰洙曰見荒蕪孟母鄰注趙曰孟子之母為子擇鄰早通交契密晚接道流新靜者心多妙先生藝絶倫草書何太古洙曰一云應甚苦詩興不無神洙曰公詩云下筆如有神曹植休前輩洙曰曹植能詩休言為張所掩趙曰以終言其詩之神張芝更後身洙曰言山人草書若張芝再生趙曰以終言其草書之古數篇吟可老蘇曰黃旟見隂鏗詩歎曰吾得此軸吟詠可老何必多也一字買堪貧將恐曾防寇深潛託所親寧聞倚門夕洙曰薛包事母至孝凡出入必有時未嘗違也至期母必倚門望之包必至矣盡力潔餐晨洙曰束廣微補亡南陔詩馨尓夕膳潔尓晨餐踈懶為名誤彥輔曰嵆康書信復踈懶筋駑肉緩驅馳喪我真索居猶寂寞洙曰禮離羣索居猶一作尤相遇益愁辛洙曰江淹嵆中散詩鍾鼓或愁辛流轉依邊徼洙曰邊徼邊境也逢迎念席珍洙曰儒行席上之珍以待聘時來故舊少亂後別離頻丗祖修髙廟洙曰後漢祭祀志光武建武二年正月立髙廟于洛陽四時祫祀髙帝為太祖一歲豆祀文公賞從臣洙曰僖二十四年晉侯賞從亡者介子推不言祿祿亦弗及推商山猶入楚洙曰見羽翼懷商老注渭水不離秦洙曰離一作知見欲問桃花宿注趙曰源本指言桃源也存想靑龍祕洙曰靑龍道家存想之術騎行白鹿馴洙曰周義真入龍矯山見羡門子乘白鹿而行耕嵒非谷口魯曰楊子谷口鄭子真耕于嵒石之下結草即河濵洙曰河上公不知姓結草河濵讀老子漢景帝親問道以素書授于帝肘後符應驗洙曰葛稚川有肘後方數卷囊中藥未陳旅懷殊不愜良覿眇無因洙曰謝靈運詩引領兾長覿自古皆悲恨浮生有屈伸程曰言張之勢伸而甫之勢屈也張以踈散故伸甫以貶逐故屈也此邦今尚武洙曰今一作全方以武濟於時何處且依仁魯曰語依於仁鼓角凌天籟洙曰莊子汝不聞天籟乎關山信月輪洙曰古今江有月重輪官場洙曰一作壕羅鎮磧趙曰言官之戰場也故曰言四鎮皆置官場收賦斂以供軍也賊火近洮岷洙曰洮岷地名屬隴右孫曰言吐蕃入寇于此蕭瑟論兵地蒼忙鬪將辰大軍多處所餘孽尚紛綸髙興知籠鳥彥輔曰潘嶽秋興賦猶池魚籠鳥而有江湖山藪之思斯文起獲麟洙曰起一作豈孔子西狩獲麟師曰張之髙興視甫如籠鳥之局促其文不遇如孔子傷麟出非其時也窮秋正搖落回首望松筠洙曰松一作湘松筠有歲寒之操丹靑引魯曰贈曹將軍霸將軍魏武之子孫趙曰魏武則曹公操也於今為庶為清門洙曰昭傳三十二年三后之姓於今為庶主所知也英雄割據雖巳矣文彩風流今尚存蘇曰晉羊枯字叔子至蜀愛其山川風物明媚謂御驂者曰楊雄王褒君平相如雖去數百年覽其遺蹤想風流文彩宛然如在疑其典刑不泯範法尚存遂追賦四先生詩趙曰司馬遷恨文彩不表於後丗晉書天下之言風流者推王衍樂廣學書初學衛夫人洙曰晉李夫人名衛善書但恨無過王右軍洙曰王羲之善隸書為今古之冠論者稱其筆勢以為飄然若游雲矯若驚龍初羲之為老嫗書紙扇謂曰但言是王右軍書以求百錢丹青不知老將至冨貴於我如浮雲洙曰語不知老之將至又曰不義而冨且貴於我如浮雲開元之中常引見承恩數上南薰殿鄭曰數色角切又如字凌煙功臣少顔色洙曰唐制畫李靖等二十四人於凌煙閣時正觀中太宗為序將軍下筆開生面趙曰凌煙畫像顔色巳暗而曹將軍重為之畫故云開生面用字蓋因左氏狄人歸先軫之元而面如生也良相頭上進賢冠洙曰後漢志進賢冠古緇布冠也文儒者之服也猛將腰間大羽箭洙曰太宗嘗自製長弓大羽箭皆倍常制褒公鄂公毛髮動洙曰鄂公尉遲敬德褒公假志玄英姿颯爽來酣戰趙曰淮南子曰魯陽公與韓戰戰酣日暮援戈而揮之先帝天馬玉花驄畫公如山貌不同是日牽來赤墀下洙曰劉孝摽辨命論時在赤墀之下逈立閶闔生長風趙曰天門也李善文選注有紫微宫門名曰閶闔言馬之上而生風以其神駿詔謂將軍拂絹素意匠慘淡經營中斯須九重真龍出一洗萬古凡馬空玉花却在御榻上趙曰玉花先帝之馬也畫手精妙尽得其真榻上庭前屹相向鄭曰屹魚乞切至尊含笑催賜金圉人太僕皆惆悵弟子韓幹早入室洙曰言得其真蹟也故稱入室晏曰語由也升堂矣未入於室也亦能畫馬窮殊相幹唯畫肉不畫骨蘇曰韓幹善畫馬大梁人右丞王維見其畫遂推獎之官至太府寺丞善寫貌人物尤工鞍馬𥘉師匠曹霸於後則獨善子美與韓幹畫馬子美豈知畫者徒以幹畫馬肥大遂有畫肉之誚忍使驊騮氣凋喪將軍盡善蓋有神必逢佳士亦寫真夢符曰右按晉書顧愷之善丹青每畫人成或數年不點目精人問其故苔曰四躰妍媸本無闕少於妙處傳神寫照正在阿堵中趙曰梁簡文帝詠美人看畫詩云可令俱是畫詩能辨寫真即今漂泊干戈際屢貌尋常行路人途窮返遭俗眼白洙曰言職者蓋寡耳丗上未有如公貧但看古來盛名下洙曰唐房琯贊曰盛名之下為難名矣終日坎壈纒其身觀薛稷少保書畫壁少保有古風得之陜郊篇洙曰公詩曰驅車越陜郊北顧臨大河師曰周公召公分陜而治自陜以東周公主之自陜以西召公主之稷嘗為古風詩以美周召是有志於周召而立功名也惜哉功名忤但見書畫傳洙曰稷薛收之從子以詞學知名博雅尤工隸書自貞觀永徽之際虞丗南褚遂良時人宗其書跡自後罕能繼者稷外祖魏徴冨國籍多有虞禇舊跡稷鋭精模倣筆態遒麗當時無及之者又善畫博採古跡睿宗在藩留意於文學稷於是特見招引除太子少保睿宗嘗召稷入宫中參决庶政恩遇莫與比及竇貞仗誅稷以知其謀賜死於萬年縣獄中矣我遊梓州東遺跡涪江邊鄭曰涪扶塢切水出徼外南入漢畫藏青蓮界洙曰青蓮界佛寺也書人金榜懸洙曰事見天門日射黃金榜注仰看垂露姿不崩亦不騫洙曰漢曹喜工篆隸變懸針垂露之法詩天保不騫不崩騫虧也鬱鬱三大字蛟龍岌相纒鄭曰岌魚及切趙曰稷所書慧普寺碑上三字字方徑三尺許筆畫雄徑然公於李潮八分小篆歌云八分一字直千金蛟龍盤弩肉倔強是言八分及草書之纏糾然後可言有蛟龍之勢也然稷三大字乃真書其勢豈若蛟龍耶余嘗到慶壽寺觀之三字之傍有贔屭纏捧乃龍蛇岌相纒也詩人道實事為壯觀之句耳又揮西方變發地扶屋椽趙曰其所盡西方變相則亡矣慘淡壁飛動到今色未填此行疊壯觀師曰甫獲觀其故宅與書畫故云疊壯觀郭薛俱才賢不知百載後誰復來通泉洙曰通泉前有郭代公後有薛少保故云郭薛奉先劉少府新畫山水障歌新添堂上不合生楓樹怪底江山起煙霧聞君掃却赤縣云無雲而雨謂之天泣野亭春還雜花逺洙曰丘希範書雜花生樹漁翁瞑踏孤舟立滄浪水深青溟闊欹岸側島秋毫末不見湘妃鼓瑟時至今班竹臨江活趙曰楚以狀所畫之竹言湘妃逺矣夢符曰右按楚詞逺遊章句使湘靈鼓瑟兮令海若舞馮夷張華博物志舜死二妃淚下染竹即班死為湘水神故曰湘妃今公詩行語乃詩全妙如此劉侯天機精洙曰莊子耆欲深者天機淺愛畫入骨髓十朋曰徐邈吾見王貴畫入骨髓愛恨吾學不到竒妙處自有兩兒郎揮灑亦莫比大兒聰明到能添老樹巔崖裏小兒心孔開貌得山僧及童子趙曰祢衡曰大兒孔文舉小兒楊德祖若耶溪洙曰越溪也雲門寺十朋曰南史何胤字子季隱居不仕㑹稽山多靈異往游焉居若耶山雲門寺𥘉㣧二兄求點並棲遁至㣧又隱焉丗號點為小山㣧為大山亦曰東山兄弟又云大隱小隱吾獨胡為在泥滓青鞋布襪從此始蘇曰謝玄暉曰胡為翰墨埸屋中出沒㑹稽山水竒秀布襪青鞋鶡冠竹杖吾志從此始矣戲題王宰畫山水圖歌彥輔曰王宰畫宰丹青絶倫十日畫一水五日畫一石能事不受相促迫王宰始肯留真跡壯哉崑崙方壷圖洙曰壷一作丈列子湯問夏革曰渤海之東不知幾億萬里有大壑焉實惟無底之谷其下底名曰歸墟八宏九野之水天漢之流莫不注之而無减焉注丗傳大海與天海通其中有五山一曰岱嶼二曰圎嶠三曰方壷四曰瀛洲五曰蓬萊又周穆王宿于崑崙之阿汾水之陽山海經云崑崙山有五色水也挂君髙堂之素壁巴陵洞庭日本東洙曰巴陵嶽陽也洞庭在其左海東有日本國赤岸水與銀河通魯曰赤岸地名本中曰南兖州記曰瓜步山東五里江有赤岸山南臨江中羅君章云赤岸若朝霞即此也濤水自海入江衝激六百里至此岸側其勢始衰郭景純江賦云鼓洪濤於赤岸趙曰先言崑崙方丈持在仙山形容之下言洞庭赤岸水則又壯其水之闊逺也巴陵郡嶽州也洞庭在焉赤岸在真州中有雲氣隨飛龍洙曰莊子姑射山有神人乘雲氣御飛龍而遊乎四海之外江賦鼓波濤於赤岸舟人漁子入浦溆鄭曰象吕切山水盡亞洪濤風洙曰亞一作帶江賦舟子涉人又蘆人漁子海賦舟人漁子徂南極東七發陵赤岸篲扶桑尤工逺勢古莫比咫尺應須論洙曰一作千萬里夢符曰右按南史景陵王子良傳賁字文煥能書善畫於扇上圖山水咫尺之內便同萬里為遙矜愼不傳自娛而巳焉得并州快剪刀蘇曰索靖見顧愷之畫欣然曰恨不帶并州快剪刀來欲剪松江半幅紋練歸去古詩曰借君快剪刀輕綃剪波去剪取吳松半江水趙曰吳松言吳地之松江也泰伯曰甫託意言水王璘反漢中吳松江為之阻絶不通時李光弼守并州所攻必下喻以快剪刀言其斷也意欲得光弼之將平漢中以通吳松故云云觀李固請司馬弟山水圖三首洙曰一云李七簡易髙人意洙曰一作體敏功曰易以䜴切平易也揚子以簡以易匡牀竹火爐蘇曰張扶隱居太白山茅庵石鼎匡床竹火爐藥壷而巳嘗有白猿隨行漢武纍徴不起使繪像進呈帝再三加賞後尸解趙曰莊子騎姬與晉公同匡牀而食寒天留逺客碧海掛新圖雖對連山好貪看絶島孤羣仙不愁思冉冉下蓬壷洙曰蓬壷山名神仙所宅之地方丈渾連水天台惣映雲洙曰方丈天台二仙山人間長見畫老去恨空聞范蠡舟偏小洙曰范蠡為越破吳功成名遂乃乘扁舟浮江湖變姓名適齊為鴟夷子王喬鶴不羣趙曰其圖必畫舟與鶴故以范蠡王喬比之王喬鶴事見昔遊詩注此生隨萬物何處出塵氛洙曰莊子所謂與物轉徙也髙浪垂翻屋洙曰郭景純詩髙浪駕蓬萊崩崖欲壓床野橋洙曰一作樓分子細沙岸繞微茫紅浸珊瑚短青懸薜荔長浮查並坐得仙老暫相將嚴公㕔宴同詠蜀道畫圖得空字日臨公館靜畫列地圖雄劒閣星橋北洙曰華陽記李冰造七星橋上應七星松州雪嶺東洙曰西山有松州當吐蕃要衝也趙曰雪嶺西山也在今威州之外冬夏常雪華夷山不斷吳蜀水相通趙曰錦江之直下通雨浙也興與煙霞㑹清樽幸不空洙曰孔融傳座上客常滿樽中酒不空奉觀嚴鄭公㕔事岷山沱江畫圖十韻得忘字沱水臨中座鄭曰沱唐水切寰宇記在成都府新繁縣岷山到北堂洙曰到一作對江賦惟岷之導江水所出也書沱潜既導今蜀縣花丘及漢中沔陽皆有沱水趙曰此篇句句皆尽義甚分明白波吹粉壁青嶂插雕梁洙曰謝靈運詩連嶂鼻崿青華香深沉直訝杉松冷兼疑菱荇香雪雲虛點綴沙草得微茫嶺鴈隨毫末川霓飲練光趙曰亦只是畫作清川之景自有霓飲練光之態不必畫霓也霏紅洲蘂亂拂黛石蘿長暗谷非關雨丹楓不為霜洙曰曉霜楓葉丹趙曰暗谷處非真是雨而暗丹楓葉不為真是遭霜而丹皆以言畫也秋成玄圃外洙曰成一作城崑崙山有玄圃蒼舒曰右按楚詞曰朝發軔於蒼梧兮夕余至乎玄圃注玄圃神山也淮南子曰崑崙玄圃惟絶通天鄭曰崑崙山去地萬一千里上有層城九重或上侣之是謂闐風又倍之為懸圃景物洞庭傍洙曰洞庭湖名趙曰皆以形容其畫乃其景也繪事功殊絶幽襟興激昻從來謝太傅丘壑道難忘洙曰太傅謝安也安雖貴而東山之志不忘夢符曰右按晉書明帝問謝鯤曰論者以君方庾亮何如答曰端委廟堂使百僚凖則鯤不如亮一丘一壑自謂過之師曰薛夢符續注云云顧長康畫鯤在石嵓裏人問其故顧曰謝玄一丘一壑自謂過之此子冝置丘壑中又謝安寓居㑹稽與義之攴遁遊出則漁山水每往臨安山中坐石室放情丘壑及薨贈太傅以此考之謝太傅乃安也非謝鯤故子美别房太尉墓詩又有對碁陪謝傅之句當從內翰注為正題李尊師松樹障子歌老夫清晨梳白頭玄都道士來相訪握髮呼兒延入戶彥輔曰周公一沐三握髮手提新畫青松障障子松林靜杳冥慿軒忽若無丹青隂崖却承霜雪幹洙曰雪一作露馬季長長笛賦生於終南之隂崖南都賦幽谷岑夏含霜雪偃蓋反走虬龍形老夫平生好竒古對此興與精靈聚巳知仙客意相親更覺良工心獨苦蘇曰管子曰事無終始無多事業此言學者貴能成就也唐人為詩皆量巳力以致功常積情思數十年然後各自名家今人不然未有小得於巳髙視前人自以為無敵然知音之難万事悉然杜工部云更覺良工心獨苦用意之妙舉丗莫知者此所以為獨苦歟又曰故人董傳善論詩余嘗云子美詩不免有凡語巳知仙客意相親更覺良工心獨苦此豈非凡語耶傳笑曰此句殆為君發凡人用意深處人罕能識此所以獨苦豈難畫哉馬曰徐貌畫魚人多模學薖曰韓宏曰良工用心何苦刻如斯松下丈人巾屨同偶坐似是商山翁洙曰似一作自一云南山四皓隱於商山避秦室之亂悵望聊歌紫芝曲洙曰悵望一云惆悵四皓歌曰燁燁紫芝可以療飢時危慘淡來悲風師曰玄都壇名道士受録皆於此壇障子松林靜杳冥言畫松無聲也已知仙客意相親言有歲寒之操也昔四皓遭秦亂隱于商山歌紫芝甫傷時盜賊擾攘悵望四皓而想其髙躅故云時危慘淡來悲風戲韋偃為雙松圖歌鮑曰韋偃見畫馬歌注天下幾人畫古松畢宏巳老韋偃少洙曰松一作樹畢宏亦畫工也鄭曰宏大曆二年為給事中少失照切絶筆長風起纎末洙曰長笛賦其應淸風也纎末奮籍滿堂動色嗟神妙蘇曰蕭紼春宴時金甌七發七中滿堂賔客動容嗟服神妙趙曰滿堂字如滿堂為之不樂秦曰左傳使者色動而言肆兩株慘裂苔蘚皮屈鐡交錯回髙枝白摧朽骨龍虎死黑入太隂雷雨垂松根胡僧憩寂寞尨眉皓首無住著偏袒右肩露雙腳鄭曰袒徒旱切洙曰金剛經偏袒右肩右膝著地修可曰楞巖經云名無住行名無著行公取而合用之也葉裏松子僧前落韋矦韋矦數相見我有一匹好東洙曰一作素絹重之不減錦繡假洙曰四愁詩美人贈我錦繡假巳令拂拭光凌亂洙曰謝惠連淸波時凌亂請公放筆為直幹師曰畢宏韋偃皆唐之善畫者也白摧朽骨龍虎死謂松枝也黑入太隂雷雨垂謂暗碧之色也偏袒右肩露雙腳言胡僧之狀也東絹謂山東大練也通泉縣署屋壁後薛少保畫鶴薛公十一鶴皆寫青田真洙曰晉永嘉記青田有雙鶴生子即便去孫曰地理志處州青田縣在州東南一百五十里有雙鶴生子即便化去人以為異畫色久欲盡蒼然猶出塵修可曰此史劉歊矯矯出塵如雲中白鶴低昻各有意洙曰薛公畫鶴低昻皆有意如返啄踈翎唳天警露之類皆隨而名之磊落如長人洙曰晉書嵇紹在稠人中昻然若野鶴在雞羣佳此志氣逺豈唯粉墨新師曰鶴磊落比之賢人無塵俗氣象甫竒其有逺志豈特悅其粉墨之新麗哉萬里不以力羣遊森㑹神威遲白鳯態洙曰揚雄作甘泉賦夢吐白鳯秋胡詩行路正威遲非是倉鶊鄰洙曰七月有鳴倉庚注倉庚黃鸝也髙堂未傾覆幸得慰佳賔曝露牆壁外終嗟風雨頻赤霄有真骨恥飲汙池津洙曰拾遺記鶴飲洛溪之水鶴賦多飲于瑶他師曰甫託意譏賢者羞食汚君之祿時不用賢之咎也冥冥任所往脫略誰能馴洙曰有遺支遁鶴者遁曰尓冲天之物寧為耳目之玩逐放之任所往姜楚公畫角鷹歌楚公畫鷹鷹戴角殺氣森森洙曰一云如到幽朔觀者貪愁掣臂飛趙曰如在幽朔見此鷹之殺氣蓋名鷹出於此地也故公又云代北有豪鷹畫師不是無心學此鷹寫真在左綿却嗟真骨遂虛傳梁間燕雀休驚怕亦未搏空上九天洙曰言有其質無其才也師曰書曰宅朔方曰幽都幽隂也朔北也幽朔肅殺之方此鷹殺氣窮極幽朔掣臂謂掣臂韝而欲飛物有異質而世所未嘗覩者人見之必駭而不信馬有肉駿非東坡誰辨之鷹有角非杜甫誰詠之丗人寧不謂虛傳乎畫師不是無心學蓋恐人未之信也末章譏朝廷之士稱才角出者率有虛名而無實效楊監又出畫鷹十二扇近時馮紹正能畫鷙鳥樣明公出此圖無乃傳其狀殊姿各獨立清絶心有向疾禁千里馬鄭曰禁居吟切氣敵萬人將洙曰狀其快疾勇快也夢符曰右按前漢文帝有獻千里馬者三國志評曰關羽張飛萬人之敵也憶昔驪山宫冬移含元仗天寒大羽獵此物神俱王洙曰玄宗盛時常以冬十月幸溫泉宫時肆獵趙曰莊子曰澤雉一步一啄百步一飲神雖王不善也當時無凡材百中皆用壯洙曰時寧主有髙麗赤鷹尤俊異帝獵則置之駕前號决雲兒粉墨形似間識者一惆悵干戈少暇日真骨老崖嶂為君除狡兔㑹是翻韝上畫鷹素練風洙曰一作如霜起張孝祥曰言鷹之威猛如風霜也蒼鷹畫作殊􅑷身思狡兔鄭曰欆荀勇切洙曰􅑷身猶竦身也孫楚鷹賦擒校兔於平原史記狡兔死獵犬烹側目似愁胡洙曰隋魏彥深鷹賦立如植木望似愁胡王琪曰鷹産於岱北出於胡地愁胡謂思胡地也絛鏇光堪擲洙曰絛鏇所以攀鷹也趙曰所畫絆鷹之絛鏇也光而堪擲取焉鄭曰絛他力切鏇徐釧切圎轆轤也軒楹勢可呼黃庭堅曰可呼以獵也何當擊凡鳥毛血灑平蕪畫鶻行洙曰一作畫鵰髙堂見生洙曰一作老鶻颯爽動秋骨𥘉驚無拘攣洙曰曹褒傳羣寮拘攣猶拘束也潘安西征賦陋吾人之拘攣何得立突兀乃知畫師妙巧刮造化窟寫此神俊姿洙曰支道林云憐其神俊趙曰李賀云二十八宿羅心􅎍筆端造化天無功蓋出於此充君眼中物烏鵲滿樛枝洙曰詩南有樛木釋文云木下曲曰樛樛下垂也趙曰謝玄暉詩樛枝聳復低軒然恐其出側腦看靑霄寧為衆禽沒長翮如刀劒人寰可超越唐曰舞鶴賦歸人寰之喧卑乾坤空崢嶸洙曰鮑明逺歲崢嶸而催暮又金石崢嶸深髙之貌也粉墨且蕭瑟緬思洙曰一作想雲沙際自有煙霧質吾今意何傷顧步獨紆鬱洙曰舞鶴賦煙交霧凝若無毛質陸士衡紆鬱游子情趙曰劉希夷邊城夢還詩雲沙撲地起煙霧質所以言其真質也摘用鮑明逺舞鶴賦煙交霧凝若無毛質也韋諷録事宅觀曹將軍畫馬圖引國初巳來畫鞍馬趙曰鮑昭詩鞍馬光照地神妙獨數江都王鄭曰名畫記江都王緒霍王元軌之子將軍得名三十載人間又見真乘黃洙曰乘黃見瘦馬行注黃曰詩大叔于田乘乘黃趙曰江都王宗室也將軍即曹將軍霸也明皇雜録云陳義曹霸等善繪畫時稱神妙乘黃神馬也曾貌先帝照夜白鄭曰貌莫角切貌人類狀下屢貌同洙曰明皇馬名别傳云上乘照夜白龍池十日飛霹靂蒼舒曰右按唐㑹要明皇在藩邸宅居興慶里宅有龍池湧出日以浸廣至開元中為興慶宫趙曰以狀所畫神妙而照夜白者乃真龍耳蓋真龍在圖感動龍池中龍如此內府殷紅馬䐉盤鄭曰殷烏間切婕妤傳詔才人索洙曰唐制以婕妤才人代世婦鄭曰上即葉下女諸切婦官也碗賜將軍拜舞歸鄭曰碗烏管切或作碗輕紈細綺相追飛趙曰碗別本作盤蓋專賜瑪瑙盤故拜舞婦其從者輕紈細綺也吳越春秋羣臣拜舞天顔舒貴戚權門得筆跡始覺屏障生光輝昔日太宗拳毛騧鄭曰古華切太宗所乘九駿名皆平盜時所乘拳毛騧乃平劉闥時所乘近時郭家師子花洙曰吐蕃潰郭子儀收復京師代宗以九花虬賜之一名師子聮今之新圖有二馬復令識者久歎嗟此皆騎戰一敵萬縞素漠漠開風沙師曰雖畫縞素之上而有開拓沙磧之態其餘七匹亦殊絶逈若寒空動煙雪霜蹄蹴踏長楸間鄭曰楸此由切洙曰曹子建名都篇走馬長楸間新一作畫定功曰莊子有馬蹄可以踐霜雪維摩經龍象蹴踏非驢所堪馬宫厮養森成列鄭曰厮息移切可憐九馬爭神駿洙曰漢武帝有九逸支遁曰憐其神駿耳顧視清髙氣深穩借問苦心愛者誰鄭曰借資昔切後有韋諷前支遁洙曰支遁字道林憶昔巡幸新豐宫洙曰新豐宫驪山也趙曰神駿字支遁養馬曰余憐其神駿耳以支遁養馬韋諷藏畫馬皆苦心之所愛矣翠華拂天來向東洙曰南都賦望翠華之葳㽔東都賦旌旗拂天騰驤磊落三萬匹皆與此圖筋骨同洙曰明皇幸驪山王毛仲以廄馬數萬從每色為一隊相間若錦繡自從獻寶朝河宗趙曰穆天子傳天子西征至陽紆之山河伯無夷都是為河宗觀舂山之寶所謂朝河宗者河宗朝而獻寶也無復射蛟江水中洙曰元封五年漢武自尋陽浮江親射蛟江中獲之君不見金粟堆前松柏裏龍媒去盡鳥呼風洙曰漢武歌曰天馬騋龍媒金粟堆在玄宗泰陵南趙曰唐舊紀云玄宗至睿宗橋陵見金票岡有龍盤鳯翥之勢謂侍臣曰吾千秋萬歲後冝葬此暨升遐羣臣遵先旨葬焉師曰自祿山反馬政荒廢天子猶不偏車騎良馬戰沒殆盡甫傷之故云天育驃騎歌洙曰天育馬廄名驃匹妙切趙曰名驃則所畫馬名吾聞天子之馬走千里洙曰荀子曰騏驥一日千里穆天子傳曰天子之八駿赤驥盜驪白義踰輪山子渠黃驊騮騄耳漢文帝却千里馬神異經曰西南大宛宛丘有良馬其大二丈鬛至膝尾委於地蹄如汗腕可握日行千里至日中而汗血今之畫圖無乃是洙曰莊子曰齊景好馬命使善畫者圖之訪似者朞年不得今人君考古籍以求賢亦不可得也趙曰出荀勗所上穆天子傳中云天子之馬走千里蓋所謂八駿是也今張景順畫圖無乃是穆天子之馬乎是何意態雄且傑駿尾蕭梢朔風起洙曰選朔風動秋草邊馬有歸心蘇曰漢天馬曲曰尾䔥梢弓朔風起足銀砧兮破層冰雖用古人語而琢句法混然天成不假翰墨𡵨徑若非織綃大手不能到此趙曰神異經西南大宛丘有良馬鬛至膝尾委於地則駮尾之長者蕭梢然矣馬尾之長䔥梢搖動可起朔風朔風則最撡烈者師道曰䔥梢者搖尾之貌朔風起即北風取其寒馬之良者不怕寒嘶風踏雪愈有精神毛為緑縹鄭曰普沼反靑黃色也兩耳黃琪曰史驥垂兩耳眼有紫熖雙瞳方洙曰秦本紀周穆王得騄耳之駟相馬經曰馬眼欲紫艷光口中欲赤色顔延年賦雙瞳夾鏡兩權協月矯矯洙曰一云矯然龍性彥輔曰一云矯龍性逸合變化洙曰嵩髙詩四牡矯矯顔延年賦龍性誰能馴卓立天骨森開張洙曰周官曰凡馬八尺以上為龍魯國黃伯仁龍馬頌曰禀神祗之純化乃大宛而載育修可曰蔡雍作庾侯碑曰英風發於天骨袁彥伯三國名臣贊曰天骨踈㓪言人而公借用耳師曰馬有龍性負天骨合能變化殆非常馬之比開張壯大之貌甫自喻於良馬謂己之才非凡俗輩可擬伊昔太僕張景順監牧攻駒閲淸峻洙曰一云考牧神駒一云老牧神駒周穆王置太僕正以伯冏為之掌輿馬唐龍朔二年改太僕為司馭咸亨𥘉復舊光宅年改為司僕神龍𥘉復舊天下監牧置八使五十六監唐兵志監牧所以蕃馬也其制起於近世唐之𥘉起得突厥馬二千匹又得陏馬三千於赤岸澤徙之隴西監牧之制始於此其官領以太僕𥘉用太僕少卿張萬歲字景順領羣牧自貞觀至麟德四十年間馬七十萬六千置八坊岐幽涇寧間地廣千里厩牧令諸牧牧馬四歲遊牝五歲責課一百匹每年課駒六十其二十歲以上不在課限趙曰唐兵志監牧之制其官領以太僕今公詩所謂太僕張景順乃開元時人舊注便安排作張萬歲自是貞觀時人誤學者矣今按張說作開元十三年隴右監牧頌德碑其序云元年牧馬二十四萬匹十三年乃四十三萬匹上顧謂太僕少卿兼秦州都督監牧都副使張景順曰吾馬幾何其蕃育卿之力也對曰帝之力也仲之令也臣何力之有焉其頌曰有霍公之掌政擇張氏之舊令所謂霍公即王毛仲也遂令大奴守天育蘇曰舊本作大奴守天育子瞻題子美天育驃驥圖後作大奴字天育蓋天育為大奴字也今定猶有石本趙曰大奴王毛仲也毛仲父髙麗人坐事沒為官奴守天育則唐兵志云毛仲領內外廄所謂天育乃廄名也别養驥子憐神俊洙曰宋顔延年天馬狀曰降靈驥子九方是選梁元帝答齊國驤馬書曰價匹龍媒聲齊驥子周王褒謝賚馬啓曰漢時伯樂偏愛權竒晉世桑門時求神俊世說支遁常養數匹馬而世或言道人亦畜馬支遁曰貧道重其神俊耳當時四十萬匹馬張公歎其材盡下洙曰通典貞觀𥘉僅有牡牝三千匹從赤岸澤徙之隴右十五年始令太僕卿勾當羣牧至麟德四十年間馬至七十萬六千匹置八使領九監跨蘭渭秦原四州之地猶為隘狹更拆八監布於河西其時天下以一縑易一馬儀鳯三年少卿李思文檢校隴右諸牧監方稱使爾後或戎狄外侵牧圉乖散泊乎垂拱潜耗太半開元𥘉收馬二十四萬匹十三年加至四十五萬匹莊子云臣之子皆不才也魯曰張公即景順也修可曰趙充國云林下犬馬齒衰此在人言之而在馬亦可用矣故獨寫真傳世人見之座右久更新年多物化空形影嗚呼健步無由騁如今豈無騕裊與驊騮鄭曰騕於皎裊奴了切時無王良伯樂死即休洙曰魯國黃伯仁為龍馬頌曰踰騕裊之躰勢逸飛莬之髙蹤兼驥騄之美質逮驊騮之足雙秦本紀造父以善御幸於周穆王得驥溫􅌐驊騮騄耳之駟西巡狩樂而忘歸郭璞曰色如華而赤今名馬驃赤者為棗騮騮馬赤也徐廣曰赤馬黑毛曰騮戰國策曰汗明見春申君曰夫驥之齒長服鹽車而上太行漉汗灑地白汗交流中坎遷延負轅不能上伯樂遭之下車攀而哭之解綾衣以募之騮於是免而賁仰見伯樂之知巳也漢書音義騕裊者神馬也赤喙黑身與飛莬同以明君有德則至也又出瑞應圗薦祢衡表云飛莬騕裊絶足奔放良樂之所急也歐陽曰王良善御伯樂善相馬孟子齊景公使嬖奚與王良乘返命曰天下之良工也史伯樂名孫陽嘗過虞阪見駕鹽車馬曰此良馬也取而試之果然又有鬻馬者三日不售伯樂去而視之回而睍之明日其價三倍趙曰韓退之有言曰世有伯樂然後有千里馬千里馬常有而伯樂不常有此乃豈無騕裊驊騮而時無伯樂之謂公因題畫巳死之驃故起末句死即休之意亦猶人抱出羣之材而不遇知巳以死為可嗟矣師曰肅宗中興正冝任賢使能房琯以宰相器出為邠州刺史甫以貶為華州司功何世無才何才不可用但恨無賢君耳琯之與甫何以異是故云云題壁上韋偃畫馬歌鮑曰朱景玄畫斷云韋偃伯父工龍馬父鑾工山水松石偃又工仙僧老松異石人知其善畫馬不知其松石更工韋侯别我有所適鄭曰韋侯韋偃也知我憐君洙曰一作渠畫無敵戲拈彥輔曰一云試拈秃筆掃驊騮歘見騏驎出東壁洙曰顔延年白馬賦歘聲躍以鴗驚驊騮良馬也騏驎瑞獸也時可曰於天育驃騎歌中􅴈周穆王傳驊騮騄耳日馳三萬里一匹齕草一匹嘶鄭曰齕下沒切坐看千里當霜蹄鄭曰當丁浪切時危安得真致此與人同生亦同死洙曰莊子馬蹄可以踐霜雪齕草飲水吕布嘗御良馬號曰赤兔能馳城飛塹馳突燕軍一日或至三四斬首而出趙曰莊子而摘用之也末句乃所向無空闊真堪託死生之意師曰韋偃唐之善畫者也取別於甫甫試令於壁上作馬末章寓意遭時艱危安得此真馬以濟患難免使甫困躓道路故云與人同生亦同死音樂古詩三首律詩五首觀公孫大娘弟子舞劒器行并序大曆二年十月十九日夔府别駕元持宅見臨潁李十二娘舞劒器壯其蔚跋問其所師曰余公孫大娘弟子也開元三載余尚童稚記於郾城觀公孫氏舞劒器渾脫瀏灕鄭曰上力周切下力支切頓挫獨出冠時自髙頭冝春梨園二伎坊內人洎外供奉曉是舞者聖文神武皇帝𥘉公孫一人而巳玉貌錦衣况余白首今兹弟子亦匪盛顔既辨其由來知波瀾莫二撫事慷慨聊為劒器行往者吳人張旭善草書書帖數嘗於鄴縣見公孫大娘舞西河劒器自此草書長進豪蕩感激即公孫可知矣行曰昔有佳人公孫氏一舞劒器動四方觀者如山色沮喪天地為之久低昂敏功曰言不自安也㸌如羿射九日落鄭曰㸌音酷洙曰堯時十日並出堯令羿射中九日日烏皆死墮其羽翼矯如羣帝驂龍翔來如雷霆收震怒罷如江海凝清光洙曰皆言舞劒器回旋疾徐變態也趙曰選詩秋月懸清光絳脣珠䄂兩寂寞洙曰蕪城賦玉貌絳脣蘇曰杜遵過銅雀臺序云𬗟懷朱唇翠䄂絲竹絃索今俱寂寞唯有崇山逺水依舊敏功曰謂公孫已死也晚洙曰又云脫有弟子傳芬芳饒曰李十二娘傳其術臨潁美人在白帝洙曰李十二娘也饒曰白帝即夔州魚復縣用於此見之妙舞此曲神揚揚與余問答既有以感時撫事增惋傷先帝侍女八千人朝曰先帝指元宗也公孫劒器𥘉第一五十年閒似反掌風塵澒洞昏王室趙曰指言祿山之亂也梨園弟子散如煙夢符曰右按唐書志元宗既知音律又酷愛去曲選坐部女子弟三百教於梨園號皇帝梨園子弟宫女數百亦為梨園弟子居冝春北院女樂餘姿映寒日洙曰祿山之亂梨園弟子及雜伎皆流散也趙曰指言李十二娘也十月十二日見之此所謂映寒日金粟堆南木巳拱洙曰見金粟堆南松柏裏注左傳墓木拱矣江淹恨賦拱木斂魂趙曰金粟堆在明皇泰陵之北今詩懷想之也瞿塘石城草蕭瑟玳筵急管曲復終夢符曰古按右樂府今日樂相樂行綺殿文雅遒玳筵歡趣密又曰歌朱唇動愛神舉浴陽少童邯鄲女古稱渌水今白紵催絃急管為君舞樂極哀來月東出老夫不知其所往足繭荒山轉愁疾洙曰足重繭也言奔走流落而足重繭尓趙曰公自言去留未定今徒足繭荒山足耳胝如繭也所謂重既纍繭是也聽楊氏歌佳人絶代歌獨立發皓齒洙曰前漢外戚傳李延年侍上起舞歌曰北方有佳人絶代而獨立以其顔色特異當代無匹也夢符曰右按楚詞朱唇皓齒嫭以姱些北德好間習以都些豐肉微骨以娛些魂乎歸徠安以舒些姱目冝笑娥眉曼些容則秀雅稚朱顔些魂以歸徠靜以安些又古樂府雜曲從來著名推趙子復有丹唇發皓齒一嬌一態本難逢如畫如花定相似定功曰阮籍詠懷詩南國有佳人榮萆君桃李朝遊江北岸夕宿瀟湘沚時俗薄朱顔誰為發皓齒滿堂慘不樂洙曰前漢刑法志古人有言曰滿堂飲酒有一人向隅而悲泣則一堂皆為之不樂故一人不得其平為之悽愴於心響下青虛裏洙曰一作浮雲裏江城帶素月洙曰謝希逺月賦素月流大况乃清夜起洙曰曹子建中夜起長歎老夫悲暮年壯士淚如水洙曰丗說王敦每酒後輒詠魏武帝樂府曰老驥伏櫪志在千里烈士暮王壯心不巳以如意打玉唾壷唾壷尽荆軻歌於易水之上士皆淚垂也玉杯久寂寞洙曰山海經曰犬戎國有一女子方跪進玉杯食韓子曰紂為象箸而箕子怖以為象箸必不加於上鉶必將犀玉之杯象箸玉杯必不羮菽藿則必薦豹胎金管迷宫徴洙曰丗之議樂者以絲不如竹竹不如肉言肉聲勝於絲竹則金石固當有間矣孟嘉語也趙曰以玉杯之寂寞言不敢為聲以金管迷宫徴言其聲之不逮於歌皆以形容歌聲之妙也勿云聽者疲愚智心盡死洙曰韓娥過宋人辱之娥曼聲而哭長幼皆泣下宋人謝之娥乃曼聲而歌老幼皆喜躍言聲感人心也如此古來傑出士豈待一知巳洙曰孟子曰豪傑之士雖無文王猶興吾聞昔秦青傾側天下耳洙曰一云傾倒修可曰列子曰背薛談學謳於秦青未窮青之技自謂盡之遂辝歸青弗止餞於郊衢撫節悲歌聲振林木響遏行雲談乃謝求返終身不敢言歸趙曰傾天下之耳則非待一知已而已夜聞􅓋篥鄭曰上必吉切下力質切夜聞􅓋篥滄江上衰年側耳情所嚮鄰舟一聽多感傷塞曲三更歘悲壯趙曰胡笳有出塞曲入塞曲也積雪飛霜此夜寒孤燈急管復風湍君知天地洙曰一作下干戈滿不見江湖洙曰一作湘行路難師曰樂部曰􅓋篥者笳管也卷蘆為頭截竹為管出於胡地制法角音九孔漏聲五音咸備唐編入鹵部名為笳管通典曰􅓋篥本名悲慓出於胡中其聲悲東夷有卷桃皮為之者亦出南蠻雜録云􅓋篥者龜兹國樂風湍謂風雜湍水之聲行路難白居易之所作也吹笛吹笛秋山風月淸誰家巧作斷腸聲洙曰鮑明逺離聲斷客情又行子心腸斷蘇曰阮晟聞笛曰客中月夜聞此聲韻使人腸斷風飄律吕相和切洙曰馬融笛賦律吕既和哀聲互降月傍關山幾處明洙曰向秀月夜聞笛遂作懷舊賦趙曰吹笛於月明之中詩人自道到此舊所引非胡騎中宵堪北走洙曰言笛聲怨切能動鄉思胡人聞之當北走矣夢符曰右按晉劉疇嘗避亂塢壁賈胡百數欲害之疇無懼色援笳吹之為出塞入塞之聲以動其遊客之思羣胡皆垂淚而去笳羌笛也可曰晉劉琨為并州刺史常為胡騎所圓琨乘月登樓清嘯賊間之長嘆中夜吹胡笳則又有流涕噓欷有懷土之意遂弃圍而去薛注誤云賈胡為胡騎非也趙曰此指言史朝義借用胡笳事笳羌笛也武陵一曲想南征洙曰王徽之聞桓伊善笛一日相逢於江次未嘗相識謂伊曰聞君善笛請為我一弄伊巳貴顯素聞徽之名便為據胡床三弄而去賔主竟不言伊為南征將軍故園楊柳今搖洙曰一作摧落何得愁中却盡生洙曰拆楊柳落梅花皆曲名蘇曰桓伊善笛撰折楊栁尤盡巧妙後人不能盡其指訣趙曰一本曲盡生無義緣笛有折楊栁之曲故思感也秋笛淸商欲盡奏奏苦血沾衣洙曰五音中惟商為最悲蓋商主秋而有寥落之意趙曰五音惟商最悲今欲盡奏以全其曲則聞者必揮涕而繼之以血也他日傷心極征人白骨歸趙曰它日士有死於戰而以白骨歸時聞此聲尤傷心矣相逢恐恨過故作發聲微趙曰恐聞此而恨極故發聲微細矣不見秋雲動悲風稍稍飛洙曰言笛聲哀切風雲亦為之悽慘趙曰蓋言不獨人愁而巳雖天亦為之愁故雲動而風悲也即事百寶裝腰帶夢符曰右按北史逹奚武生貪為大司寇取萬釘寶帶以歸因以賜之趙曰此篇贈舞者故云舊注所引非真珠絡臂鞲鄭曰古侯切洙曰馬后傳蒼頡衣緑鞲注鞲臂衣也以縛左右手於事便也錦纏頭以賞歌舞者開元間富人王元寶常㑹賔客元寶富於財而無文采日親友問曰昨日髙㑹有何佳談元寶視屋良久曰但費錦纏頭爾笑時花近眼舞罷錦纏頭贈花卿錦城絲管日紛紛半入江風半入雲此曲秪應天上有夢符曰右按白樂天詩注霓裳曲開元老西凉府節度使楊敬述造鄭愚津陽門詩注云葉法善嘗引上入月宫聞仙樂及歸但記其半遂於笛中寫之㑹楊敬述進婆羅門曲與其聲調相符遂以月中所聞為散序以歌述所進為腔宣室志元宗夢仙子十輩御卿雲而下列於庭各執樂器而奏之其度曲淸越殆非人世也及樂關有一仙子前曰陛下知此樂乎此䄂仙紫雲之曲也人閒能得幾回聞江南逢李龜年岐王宅裏尋常見崔九堂前幾度聞洙曰公自注云即殿中監崔滌中書令是之弟正是江南好風景落花時節又逢君洙曰明皇雜録云天寶中上命宫中女子數百人為梨園弟子皆居冝春北院上素曉音律時有馬仙期李龜年賀懷智皆洞知律度安祿山自范陽入覲亦獻白玉簫管數百事皆陳於梨園自是音響殆不類人間有龜年特承顧遇於東都大起第宅僣侈之制逾於公侯後流廢江南每遇良辰勝景常為人歌數關座上聞之莫不掩泣罷酒器用右詩四首律詩三首石硯詩平侍御者平公今詩伯天覺曰伯長也秀發吾所羡奉使三峽中孫曰瞿塘明月巫峽也長嘯得石硯師曰晉謝琨長嘯却胡騎時峽中亂平侍御持節出使靖其亂長嘯雍容不勞智力巨璞禹鑿餘洙曰禹開鑿以疏江河趙曰此使鑿字正言石也郭景純賦云巴東之峽夏禹疏是也異狀君獨見其滑乃波濤其光或雷電聮拗各盡墨洙曰拗硯穴也聮拗謂雙穴相並各盡墨謂盡墨力所謂發墨是也多水遞隱見薖曰謂溫潤出水也揮灑容數人十手可對面比公頭上冠正質未為賤趙曰平公為侍御故云頭上冠者獬冠也獬豸一角獸而能觸邪此所以為正質當公賦佳句况得終清宴洙曰曹子建公子愛敬客終宴不知疲公含起草姿洙曰起草掌綸紼也不逺明光殿致于丹青地知汝隨顧眄洙曰明光殿霍去病借以避暑修可曰漢殿名之秦記曰明光殿以金為戺玉為階元傳曰成都侯商嘗病欲避暑從上借明光宫是巳荆南兵馬使太常卿趙公大食刀歌太常樓船聲嗷嘈洙曰漢武鑿昆明池始製樓船上建樓櫓戈矛四角垂幡髦旌葆麾蓋官有樓船將軍問兵刮冦超下牢洙曰下牢楚地牧出令奔飛百艘夢符曰牧州牧也令縣令也牧出令奔同赴軍事也艘船也劉備遣關羽乘船數百艘皆㑹於江陵艘蘇曹切猛蛟突獸紛騰逃白帝寒城駐錦𫀆洙曰華陽國志先主征吳於夷道還屯於巴東治魚復縣公孫述更名白帝章武中改曰永安也玄冬示我胡國刀壯士短衣頭虎毛洙曰莊子說劒庶人之劒蓬頭突鬢垂曼胡之纓短後之衣憑軒拔鞘天為髙鄭曰鞘所交切翻風轉日木怒號鄭曰平聲冰翼雪淡傷哀猱鄭曰奴刀切鐫錯碧罌鸊鵜膏鄭曰鸊步覓切鵜田黎切洙曰方言曰野鳬甚小好沒水中南楚之人謂之鸊鵜爾雅注鸊鵜似鳬而小膏中瑩刀鋩鍔已瑩虛秋濤洙曰鋩鍔一云銛鋒王褒頌巧冶鑄干將之朴清水卒其鋒越砥斂其鍔注鋒刃芒端秋濤言其色之澄徹如此鬼物撇捩亂坑壕鄭曰撇匹蔑切捩練結切蒼水使者捫赤絛洙曰搜神記曰秦時有人夜渡河見一人丈餘手橫刀而立叱之乃曰吾蒼水使者也龍伯國人罷釣鼇洙曰列子湯問龍伯之國有大人一釣而連六鼇合負而趍歸其國焉芮公回首顔色勞洙曰芮公荆南節度使分閫救世用賢豪洙曰分閫謂閫內事寡人制之閫外之事將軍制之賢豪趙公也趙公玉立髙歌起攬環結佩相終始萬歲持之護天子得君亂絲與君理洙曰隱四年傳衆仲曰以德和民不聞以亂猶理絲而棼之漢龔遂曰治亂民猶治亂繩不可急也唯緩之然後可治也蜀江如線針如水洙曰蜀水至瞿塘則為峽所束如線焉荆岑彈丸心未巳鄭曰彈徒案切洙曰言有以一丸泥封大散關也賊臣惡子休干紀洙曰史記亂臣賊子陸士衡誅鋤干紀魑魅魍魎徒為耳洙曰宣三年傳王孫滿曰昔夏之方有德也鑄鼎象物百物而為之備使民知神姦故民入川澤山林不逢不若魑魅魍魎莫能逢之注魑山神也獸形魅怪物魍魎水神也妖腰亂領敢欣喜用之不髙亦不庳鄭曰音婢又音卑不似長劒須天倚夢符曰右按前漢文帝有獻千里馬者三國志評曰關羽張飛萬人之敵也修可曰荆楚故事曰襄王與唐勒景差宋玉等游於雲陽之臺王謂左右曰能為大言者乎唐勒曰壯士怒兮絶天柱北斗戾兮泰山夷景差曰狡士猛毅撼搖覆載鋸牙鋸雲聲其大吐舌萬里唾一世玉曰方地為輿圎天為蓋彎弓掛扶桑長劒倚天外王曰善吁嗟光祿英雄弭大食寶刀聊可比蘇曰晉永徽中大食國獻寶刀使者云漁人夜見溪中有光疑其寶也視之得此刀天色晦暝匣中錚錚有聲晉滅其刀不知所適丹青宛轉麒麟裏光芒六合無泥滓洙曰言終用此刀澄淸六合畫像麒麟閣桃竹杖引洙曰贈章留後蘇曰栁子厚詩云盛時一失貴反賤桃笙葵扇安可常不知桃笙為何物偶閲方言簟宋魏之間謂笙方悟桃笙以桃竹為簟也梁簡文納南王獻書云五離九折出桃枝之翠笋乃謂桃枝竹簟也桃竹出巴渝間江心蟠石生桃竹趙曰爾雅謂桃皮山海經謂桃枝竹也蒼波噴浸尺度足斬根削皮如紫玉江妃水仙惜不得洙曰江賦水夷倚浪以傲晲江妃含嚬而瞟眇注水夷水仙也梓潼使君開一束滿堂賔客皆歎息洙曰君一作者憐我老病贈兩莖出入爪甲鏗有聲老夫復欲東南征乘濤鼓枻鄭曰餘制切白帝城洙曰白帝城在魚復有公孫述像也路幽必為鬼神奪杖劒洙曰一作拔劒或與蛟龍爭重為告曰杖兮杖兮爾之生也甚正直愼勿見水踴躍學變化為龍趙曰神仙傳曰壷公遣費長房歸以一竹杖與之騎長房騎杖忽然如眠便到家以竹投葛陂顧之乃靑龍也石曰杖為物既禀正直之姿當以正直輔吾無為化龍而去使我不得爾之扶持滅跡於君山湖上之靑峯洙曰君山在洞庭湖心也趙曰謝靈運滅迹入靈峯噫風塵澒洞兮豺虎咬人鄭曰澒胡孔切咬古爻切洙曰時盜賊害人如豺虎忽失雙杖兮吾將曷從師曰甫意若曰天下未平尚賴此杖扶持衰老流寓逺鄉苟失雙杖吾將曷從棕拂子鄭曰子紅切棕拂且薄陋豈知身效能不堪代白羽蘇曰諸葛嘗持白羽扇以指麾又顧榮伐陳敏以白羽扇麾之有足除蒼蠅洙曰詩營營蒼蠅熒熒金錯刀洙曰四愁詩美人贈我金錯刀尹曰李善文選注金錯刀云續漢書曰佩刀諸侯王黃金錯環謝承後漢書曰詔賜應奉金錯把刀續漢書班固與弟超書曰竇侍中遺仲叔金錯半垂刀一枝前漢食貨志曰錢新室更造契刀錯刀契刀其鐶如大錢身形如刀長二寸文曰契刀刀直五百錯刀以黃金錯其文一刀直五千熒熒金錯刀乃佩刀之屬也對雪詩云金錯囊徒整乃是錢刀而以金錯之也虎牙行金錯旌竿滿雲直蓋以黃金而錯縷旌竿也大抵古人之於器物以黃金錯之皆謂之金錯如秦嘉妻以金錯琬奉其夫盛水之類是以當隨其器物而名之不可以名同不究其實焉趙曰續漢書曰佩刀諸侯王黃金錯環擢擢朱絲繩洙曰鮑昭直如朱絲繩非獨顔色好亦用顧盻稱趙曰金錯刀朱絲繩二物者非特以其金朱之好顔色耳皆係乎人之顧盻也吾老抱疾病家貧卧炎蒸咂膚倦撲滅鄭曰咂作答切洙曰蠅蚋咂膚賴爾甘服膺洙曰顔子得一善則拳拳服膺物微世競棄義在誰肯徴三歲淸秋至未敢闕緘縢師曰按唐史玄宗以李林甫代張九齡相九齡既不見用因作白羽扇賦以自見其志云縱秋氣之移奪終感恩于篋中白羽為物可以驅蠅蚊為世所用九齡自喻也棕拂其質薄陋雖不堪代白羽猶足以驅除蒼蠅時林甫以瑣陋之材而代九齡其材能全無用於朝廷曽棕拂之不若乎楚辝云美人贈我金錯刀古者以金為幣錯􅍢其文或謂之刀布後丗用錢代之朱絲繩所以中琴瑟之用金錯刀與朱絲繩以利用而見顧豈特取其顔色之好以為玩物哉棕拂為物雖微有理義在蓋可用之除蠅奈何世人不肯徴信其義而競弃之甫傷淸秋廢置不用不敢怠於緘藏兾其他時之復用然棕拂微有功於人猶護惜之况白羽其可奪於秋氣一弃而不復顧藉乎所以傷九齡之見弃而疾林甫之獲用也蕃劒致此自僻逺又非珠玉裝如何有竒怪每夜吐光芒趙曰斗牛之間有紫氣虎氣必騰上龍身寧久藏趙曰孔章臨亡戒其子以劒自隨後其子為建安從事劒忽躍出見二龍相隨焉風塵苦未息持女奉明王銅瓶亂後碧井廢時淸瑶殿深師曰銅瓶所以汲水以濟人者也喻賢者宣君之恩以及衆丗亂則弃捐於寒甃時淸可收用於瑶殿銅瓶未失水百丈有哀音趙曰想平日清平之時玉殿深邃宫人以瓶汲井離水欲上時有滴水之音也側想美人意應悲寒甃沉蛟龍半缺落猶得折黃金趙曰井中或得斷叉遺珥有黃金蛟龍之狀則有之矣又於韋處乞大邑瓷碗大邑燒瓷輕且堅扣如哀洙曰一作寒玉錦城傳君家白碗勝霜雪急送茅齊也可憐食物古詩八首律詩四首閿鄉姜七少府設鱠戲贈長歌鄭曰閿音聞姜侯設鱠當嚴冬昨日今日皆天風趙曰漢髙皇后八年太尉入未央宫擊吕産天風大起也河凍未漁不易得洙曰一作黃河水漁鑿冰恐侵河伯宮饔人受魚鮫人手洙曰周禮天官內饔饔和也熟食曰饔割烹煎和之稱潘安仁西征賦饔人縷切鑾刀若飛應刃落爼靃靃霏霏紅鮮紛其初載賔旅竦而遲御既食服而屬厭泊恬靜以况欲回小人之腹為君子之慮洗魚磨刀魚眼紅無聲細下飛碎洙曰一作素雪有骨巳刴觜春葱洙曰七啓云纍如疊縠離若散雪輕隨風飛刃不轉切又膾西海之飛鱗七命云范公之鱗出自九溪赬尾丹腮紫翼靑鬐命支離飛霜鍔紅肌綺散素膚雪落觜平聲偏勸腹腴愧年少軟炊香飯洙曰一作梗緣老翁蒼舒曰按禮記冬右腴鄭氏曰腴腹下也前漢書九州膏腴顔師古曰腹之下肥曰腴落砧何曽白紙濕鄭曰砧音砧放筯未覺金盤空新歡便飽姜侯德洙曰詩既醉以酒既飽以德清觴異味情屢極趙曰陳周弘讓答王褒書云南風雅操淸觴妙曲大臨曰左傳云必嘗異味東歸貪路洙曰一作貧路自覺難欲别上馬身無力可憐為人好心事於我見子真顔色師曰言姜侯禮貌非僞為也不恨我衰子貴時悵望且為今相憶觀打魚歌綿州江水之東津魴魚鱍鱍色勝銀鄭曰魴符方切鱍北末切魚棹尾洙曰詩魴魚赬尾鱍鱍跳躍貌修可曰尓雅曰魴魾也今之鯿魚是陸機疏曰魴魚廣而薄肥甜而少肉細鱗之美者也漁人漾舟沉大網截江一擁數百鱗衆魚常才盡却弃赤鯉騰出如有神洙曰陶弘景本草曰鯉最為魚寧之主形可愛又能神變乃至飛越山湖所以琴髙乘之也潜龍無聲老蛟怒回風颯颯吹沙塵饔子左右揮霜刀鱠飛金盤白雪髙洙曰西征賦饔人縷切鑾刀若飛應刃落爼靃靃霏霏徐州秃尾不足憶漢隂槎頭逺遁逃洙曰秃尾查頭皆魚名魴魚肥美知第一既飽歡娛亦蕭瑟趙曰廣州記曰魴魚廣而肥甜魚之美者也君不見朝來割素鬐鄭曰渠伊切魚鬛也咫尺波濤永相失師曰綿州屬西川道魚善變化乃龍之類老蛟怒惡傷其類故也秃尾槎頭縮項皆魚之名既飽歡娛亦蕭瑟謂樂極則哀繼之春秋隱公矢魚於棠聖筆書之以為譏甫此詩𥘉叙得魚之樂而末則有咫尺波濤永相失之句豈非得聖人危亡之戒耶又觀打魚蒼江漁子清晨集設網提綱萬洙曰一作取魚急能者操舟疾若風鄭曰操七刀切持也撑突波濤挺義入洙曰顔回濟于觸深之泉見操舟者若神西征賦徒觀其鼓柂回輪灑鉤投網重餌出入挺人來往也定功曰莊子津人之操舟若神且曰善游者數能也潘安仁西征賦垂耳出入挺義往來小魚脫漏不可紀半死半生猶戢戢大魚傷損皆垂頭屈強泥沙有時立鄭曰屈強正作倔渠勿切梗戾也洙曰蜀志曰武陽小魚大如針一斤千頭蜀人以為醬七發云其根半死半生東津觀魚巳再來主人罷鱠還傾杯日暮蛟龍改窟穴趙曰以言打魚之故而驚動神物也山根鱣鮪隨雲雷修可曰郭璞注爾雅曰鱣大魚似鱏而鼻短口在頷下躰有斜行甲無鱗肉黃江東人呼為黃魚干戈兵革鬪未止洙曰一云干戈革鬪尚未巳鳳凰麒麟安在哉吾徒胡為縱此樂暴殄天物聖所哀洙曰春秋繁露曰恩及蟲魚則麒麟至孝經援神契曰德至鳥獸則鳯凰翔師曰義魚義也持以入水網大繩也所以舉網覆巢毀卵則麒麟不至鳯凰不翔自祿山之亂干戈日尋戕害生民之命亦巳甚矣蛟龍改窟穴鱣鮪隨雲雷喻賢人君子遇亂而遁迹也聖人仁及草木昆蟲今於戰鬪之際復暴殄天物寒露寒漢殿名開冰淸玉壷洙曰鮑昭淸如玉壷冰君王納凉晚此味亦時須種萵苣并序鄭曰上烏禾下勤吕切既雨巳秋堂下理小畦隔種一兩席許萵苣向二旬矣而苣不甲拆伊人莧青青趙曰别本伊人作獨野是傷時君子或晚得微祿轗軻不進因作此詩隂陽一錯亂驕蹇不復理枯旱於其中炎方慘如燬鄭曰虎委切火也趙曰在炎方則慘毒如焚燬詩王室如燬言隂陽乖繆而致旱也植物半蹉跎嘉生將已矣洙曰以旱而物無生意也趙曰漢書嘉生之類注專指為禾雲雷歘奔命師伯集所使趙曰唐狄仁傑傳風伯清塵雨師灑道故公摘而用之指麾赤白日澒洞靑光起雨聲先巳風散足盡西靡趙曰謝眺詩森森散雨足端本曰澒洞雲色起兒散足言雨散作而止足也巳風猶言止風風止則雨降西靡謂斜雨向西也山泉落滄江霹靂猶在耳終朝紆颯沓信宿罷蕭灑堂下可以畦呼童對經始洙曰經始言𥘉無畦而始經構之也苣兮𬞞之常隨事藝其子破塊數席間荷鋤功易止兩旬不甲拆蘇曰魯哀公丗禾黍兩旬不甲拆尹父潘雷空惜埋泥滓趙曰易云百榖草木皆甲拆選奮迅泥滓野莧迷汝來宗生實於此修可曰揚子雲蜀都賦其竹則宗生簇攢俊茂豐美又左思吳都賦楠檣之木相思之樹宗生髙岡族茂幽阜此輩豈無秋亦蒙寒露委翻然出地速滋蔓户庭毀因知邪干正掩抑至沒齒洙曰言苣為莧所蕪以喻賢者為小人見掩枊也賢良雖得祿守道不封巳趙曰言賢良之人得位則不恣非似邪佞得位而封巳亦猶嘉𬞞之苣出地則不滋非似野莧之得而滋蔓也國語叔向曰引黨以封巳注曰封厚也擁塞敗芝蘭衆多盛荆𣏌洙曰小人衆也趙曰芝蘭所以壅塞者以荆𣏌之衆多也非特苣耳中園陷蕭艾老圃永為耻登于白玉盤洙曰漢官儀曰封禪壇有白玉盤藉以如霞綺莧也無所施胡顔入筐篚洙曰有其丈者必有其容有其容者必有其德喻小人雖有掩抑之才而終不為邦家所用師曰胡顔謂強厚顔也野莧始雖盛及萵苣生長登於白玉之盤藉以如霞之綺遂使彼無所用不猶強顔入吾筐篚之內不亦無耻乎以喻小人掩君子一旦登于玉堂則小人將何顔而猶居朝乎終亦不用而巳矣園官送菜并序園官送菜把本數日闕矧苦苣馬齒掩乎嘉𬞞傷小人妬害君子菜不足道也比而作詩趙曰三曰比之義淸晨蒙菜把常荷地主恩蘇曰陶侃得張餗園𬞞曰久客常荷地主恩私家貧無所報但手加額而巳趙曰出國語越王以㑹稽三百為范蠡地曰後世有敢侵蠡之地者皇天后土四鄉地主正之守者愆實數略有其名存蘇曰祖平曰東漢文章掃地見今之圎冠輩略存其名巳苦苣刺如針馬齒葉亦繁靑靑嘉𬞞色埋沒在中園洙曰此序所以言小人害君子也趙曰公言所送止苦苣馬齒莧爾而所謂嘉𬞞者未嘗摘以相遣也張載登成都白菟樓云原隰植嘉𬞞師曰嘉𬞞比君子苦苣馬齒比小人言小人掩君子君子不得其所園吏未足怪世事固堪論嗚呼戰伐久荆棘暗長原師曰老子曰大軍之後必有凶年荆棘生焉乃知苦苣輩傾奪蕙草根洙曰蕙草薰草也小人塞道路為態何喧喧又如馬齒盛氣擁葵荏昏洙曰葵荏嘉𬞞也趙曰苦苣馬齒如小人可知葵荏正以言嘉𬞞蕙草雖不可為𬞞而要之君子之比師曰蕙草香有君子之象蕙草見奪於苦苣君子為小人所勝也小人得志則作態驕淫矜夸靡所不至故云為態何喧喧葵荏嘉𬞞又為馬齒昏塞足見小人勢盛君子道消也點染不易虞師曰喻君子為小人所汚絲麻雜羅紈一經器洙曰一作氣物內永挂粗刺㾗趙曰以苦苣馬齒一經器物所盛則便永逺挂粗之㾗然則君子固冝傷所染矣師曰喻國家為小人所敗國者天下之大器也志士採紫芝放歌避戎軒洙曰古有紫芝歌亦神仙所作趙曰皇甫謐髙士傳秦丗坑黜儒術四皓於是作歌曰莫莫髙山深谷逶迤曄曄紫芝可以療飢畦丁負籠至感動百慮端蘇曰孫鍾治𬞞圃為生嘗與畦丁負籠拾李暇日小園散病將種秋菜督勒耕牛兼書觸目不愛入州府蘇曰劉稚吾任真放逸不能巧言取媚大人長者多嫌亦不愛時入州府畏人嫌我真洙曰襄陽耆舊記寵德公在沔水上至不入襄陽城及乎歸茅宇洙曰一云及歸在茅屋旁舍未曾嗔趙曰漢髙祖適從旁舍來老病忌拘束蘇曰王祥老病纏綿不堪拘束應接喪精神趙曰使人應接不暇江村意自放林木心所欣秋耕屬地濕山雨近甚勻冬菁飯之半牛力晚來新修可曰張平子南都賦酸甜滋味百種千名春卯夏笋秋韭冬菁蘇蔱紫薑拂撒羶腥注菁蔓菁也黃石公三略云牛力日新深耕種數畝未甚後四鄰嘉𬞞既不一名數頗具陳荆巫非苦寒採擷接靑春飛來兩白鶴暮啄泥中芹雄者左翮垂損傷巳露筋一步再流血尚經洙曰一云驚矰繳勤三步六號叫志屈悲哀頻鸞皇不相待側頸訴髙旻杖䔧俯沙渚為汝鼻酸辛趙曰宋玉賦寒心酸鼻驅竪子摘蒼耳趙曰蒼耳今所謂羊負菜也在詩則謂之卷耳江上秋巳分林中瘴猶劇畦丁告勞苦洙曰畦丁種田者也猶今之佃民無以供日夕蓬莠猶不燋蘇曰久旱不雨王戎出郊語父渾曰炎歊赫赫嘉𬞞盡槁禾黍枯悴蓬蒿蕕莠獨不焦旱豈造物之私耶父駭其言而異之野𬞞暗泉石卷耳况療風洙曰見本草蘇曰寵濟昨使畦丁去樀卷耳得滿筐筥者此物療風氣故分贈友人童兒且時摘洙曰一云童僕先時摘侵星驅之去爛熳任逺適放筐亭午際洗剝相蒙羃趙曰洗其土剝其毛登床半生熟趙曰登食床也或作生菜或作熟菜下筯還小益趙曰小益謂療風也加點瓜薤間依俙橘奴跡洙曰李衡以橘為木奴故江左有橘奴號亂世誅求急黎民糠籺窄夢符曰右按前漢書陳平傳或謂平何食而肥若是其㛐疾平之不視家生産曰亦食糠核耳晉灼曰核音紇京師人謂粗屑為紇頭飽食復何心荒哉膏粱客夢符曰右按唐栁芳氏族論曰三世有三公者曰膏梁有令僕者曰華腴富家厨肉臭戰地骸骨白洙曰言天下荒亂饑饉荐仍而在位者無救恤之意寄語惡少年黃金且休擲洙曰燕太子者得荆軻與之臨池軻以瓦抵蛙太子命捧金以進軻用抵之又進軻曰非為太子愛金乃臂痛爾趙曰梁元帝古意詩中有惡少年伎能專自得江閣卧病走筆寄呈崔盧兩侍御客子庖厨薄江樓枕席清衰年病秪瘦長夏想為情滑憶雕胡飯洙曰憶一作喜沈休文雕胡方自炊西京雜記太液池邊皆是雕胡菰之有米者長安人謂雕胡又㑹稽人顧翺少失父事母至孝母好食雕胡飯常躬自採擷家近太湖湖中後自生雕胡無復餘草香聞錦帶羹夢符曰右按荆湘間有錦帶春末開花紅白如錦其苗亦嫩脆可食師曰薛夢符云荆湘間有花名錦帶其花條生如郁李春末方開紅白如錦初生葉柔脆可食渚宫又謂之文官花安陸王彥輔中散云錦帶吐綬雞也其肉脆美堪作臛錦帶花則豫親見之謂吐綬雞為錦帶則傳記所不載彥固傳學而文恐其言亦有所據溜匙兼暖腹誰欲致杯罌秋日阮隱居致薤三十束鄭曰薤胡介切葷菜葉似韭隱者柴洙曰一作荆門內畦𬞞繞舍秋盈筐承露薤洙曰詩卷耳不盈頃筐挽歌薤上露不待致書求束比青芻色魯曰詩云靑芻一束圎齊玉筯頭衰年關鬲冷味暖併洙曰一作腹無憂唐曰薤性暖益老人故云云關節也鬲胸也除架洙曰瓜架也束薪巳零落趙曰爪架必以薪為之今瓜巳摘則架上之薪零落也瓠葉轉蕭踈幸結白花了寧辭靑蔓除趙曰瓜實既結則其蔓可除秋蟲聲不去暮雀意何如洙曰架除而鳥失栖也寒事今牢落人生亦有初洙曰言瓜未生之初則作架以承之才結花則有將實之望而其意稍怠矣故架壞則除去而不修也亦猶人事鋭始而怠終趙曰此詩作於秦州為客不堪如此然人生未嘗無初則公之初在太平之時文采動上聲譽烜赫本不如是之牢落也廢畦秋𬞞擁霜露豈敢惜凋殘暮景數枝葉趙曰公自憫也不忍𬞞之雕殘故於暮景之中數其枝葉爾天風吹汝寒緑霑泥滓盡香與歲時䦨生意春如昨悲君白玉盤分門集注杜工部詩卷第十六
