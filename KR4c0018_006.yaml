front:
  text: 分門集注杜工部詩卷第六
  hash: sha256:e29ef61a458b9bd792b1149d7abdedfd0ffff26e54a10dbc6b867f2bf5d6a744
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_006-1a}
body:
  text: 宫殿宫詞附古詩二首律詩五首玉華宫師曰自此詩以不至羌村乃甫趍鄜路逢所經見兼𫐠抵家情況讀者可以隨篇曉其意也溪回松風長梅曰苻堅墓在此宫前有溪曰醽醁蓋取溪色如酒色之碧也溪回言回逺也惟回逺故松風不歇蒼鼠竄古瓦不知何王殿遺構絶壁下隂房鬼火青洙曰淮南子人血為憐許愼云兵死之血為鬼火燐者鬼火之名趙曰謝靈運登石門最髙頂詩晨䇿尋絶壁此宫在坊州宜君縣正觀二十年太宗所作也髙宗永徽二年廢之為寺而公今詩云云壞道哀湍㵼洙曰書說築傳嵓之野注傳氏之嵓在虞號之界通道所經有澗水壞道常使胥靡刑人等護此道萬籟真笙竽秋色洙曰一作氣正蕭灑洙曰莊子齊物篇子綦曰汝聞地籟而末聞天籟子游曰地籟則衆竅是也人籟則比竹是也敢問天下子綦曰夫吹萬不同而使其自巳也美人為黃土況乃粉黛假當時侍金輿故物獨石馬梅曰潘嶽美人歸重泉列子粉白黛黑佩環雜芷若蘇曰梁隱過茂林覽遺蹟了無故舊碑文考驗往事獨石馬在茂草中憂來藉草坐浩歌淚盈把冉冉征途間誰是長年者洙曰天台賦萋萋之纎草又嗟人生之短期孰長年之能執九成宫洙曰武德元年廢麟遊郡置鄜州有九成宫即隋仁壽宫隋文帝崩於此蒼山入百里崖斷如杵臼曽宫慿風逈洙曰一作回岌嶪土囊口鄭曰上逆及下逆怯切洙曰宋玉風賦夫風生於地起於青蘋之末侵淫溪谷盛怒於士囊之口西京賦狀嵬峩以岌嶪也立神扶棟梁鑿翠開戶牖敏修曰魯靈光神靈扶其棟宇其陽産靈芝蘇曰隋文帝終南山陽石柱上産金花芝十莖趙曰以言瑞物斷生如漢廟柱生芝其隂宿牛斗洙曰西都賦其陽則崇山隱天幽林穹谷其隂則冠以九峻陪以甘泉天台賦䕃牛宿以曜舉趙曰以言其髙紛披長松倒揭􅠣怪石走鄭曰􅠣魚列切趙曰洞簫賦若凱風紛披魯靈光殿賦飛陛揭􅠣緣雲上哀猿啼一聲客淚迸林藪洙曰宜都山川記曰峽中猿鳴至清諸山谷傳其響泠泠不絶行者歌三聲淚霑衣荒哉隋家帝製此今頽朽洙曰楊素為隋文帝營仁壽宫仁壽宫規構鴻侈文帝怒曰素為吾掊怨天下素懼封倫曰毋恐后至當自免既而果然向使國不亡焉為巨唐有洙曰齊景公遊牛山北臨其國曰若何去此而死乎晏子曰使賢人若常守則太公有之吾君安得此位而為流涕是不仁也齊侯飲酒樂曰若何晏曰昔爽鳩氏始居此季萴逢伯陵蒲姑氏太公因之若古無死則爽鳩之樂非君所願得也傳曰不有廢也君何以興雖無新增修尚置官居守巡非瑤水逺洙曰王元長曲水序夏后兩龍載驅璿臺之上穆滿八駿如舞瑤水之隂言周穆王遊於崑崙山見西王母與宴於瑤池之上也跡是雕墻後洙曰五子之歌峻宇雕墻注雕飾畫也我來屬時危仰望嗟嘆久天王守太白洙曰趙充國傳曰今太白髙深入者勝天王天子也守太白待時而進也趙曰守音狩太白山名守之為義言肅宗在鳯翔也駐馬更搔首早朝大明宫呈兩省寮友新添賈至銀燭朝天紫陌長禁城春色曉蒼蒼千條弱柳垂青瑣百囀流鶯滿建章劒佩聲隨玉墀步衣冠身染御爐香共沐恩波鳯池裏朝朝染翰侍君王和賈至舍人早朝大明宫洙曰舍人先丗掌絲綸鄭曰長安志東內大明宫五夜漏聲催曉箭洙曰顔氏家訓云或問一夜何故五更更何所訓答曰魏漢以來謂為甲夜乙夜丙夜丁夜戊夜又云一鼓二鼓三鼓四鼓五鼓亦云一更二更三更四更五更皆以五為莭更歷也經也鼓五四更爾趙曰魏漢以來名夜有五起於甲盡於戊故曰五夜故公所言指言五更𥘉也師曰箭乃漏箭軍中傳箭以直更五夜謂五鼓天將曉也九重洙曰一作天春色醉仙桃洙曰天子之門九重漢武故事西王母齎其桃七枚獻帝帝欲留核種之王母笑曰此桃一千年生一千年結實人壽幾何遂止西王母指東方朔曰仙桃三熟此兒巳三偷趙曰春色著桃酣醉然以宫中之物故得以仙桃為言師曰凡詩稱春者皆酒也如趨東春燒青春之類春色醉仙桃言入朝飲酒其色如桃今俗云相公入朝是也杜亦云汝陽三斗始朝天正此之謂也旌旗日暖龍蛇動趙曰東坡曰杜甫七言之偉麗者余竊謂夏文莊硯中旗影動龍蛇徐師川旌旗不動御爐香皆剽杜也然工拙可見矣而御廬香豈於旌旗動不動乎宫殿風微燕雀髙蘇曰言當時持權者皆小人而燕雀微物尚乘宫殿之風自工部隂蓄有巧思王子淵曰鵰鷹飛平川闊野寧肯視燕雀哉余曰百斛明珠云七言之偉麗者杜子美如此二句後寂寥無聞趙曰或以燕雀髙比小人得位則龍蛇動又何所比乎後學妄引此以為東坡事實而遽穿鑿如此朝罷香煙携滿䄂蘇曰韋賢詩曰御爐煙滿䄂丞相出朝時詩成珠玉在揮毫欲知丗掌絲綸美趙曰賈至曽之子也曾於開元間與蘇晉同掌制誥玄宗幸蜀拜至起居舍人帝曰昔先天誥命乃父為之辭今兹命冊乃爾為之兩朝盛典出卿家父子可謂繼美矣昱日記緇衣篇王言如絲其出如綸王言如綸其出如綍注言言出彌大也綸今有秩嗇夫所佩也池上于洙曰一作如今有洙曰一作得鳯毛時可曰宋書謝鳯子超宗有文辭𥙷新安王常侍作王母殷叔儀誄帝大嗟賞謝莊曰超宗殊有鳯毛同前新添王維絳幘雞人送曉籌尚衣方進翠雲裘九天閶闔開宫殿萬國衣冠拜冕旒日色才臨仙掌動香煙欲傍衮龍浮朝罷須裁五色詔佩聲歸到鳯池頭同前新添岑參雞鳴紫陌曙光寒鶯轉皇州春色䦨金鎖曉鍾開萬戶主階仙仗擁千官花迎劒佩星初落柳拂旌旗露未乾獨有鳯凰池上客陽春一曲和皆難宣政殿退朝晚出左掖鄭曰掖夷益切長安志宣政門內有宣政殿殿東有東上閣門西有西上閣門故以掖稱天門目射黃金榜洙曰崔融詩金榜照晨光銅鈎起夕凉春殿晴曛赤羽旗洙曰以赤鳥羽為旗宫草微微洙曰一云霏霏承委珮洙曰曲禮主佩垂則臣佩委爐煙細細駐遊絲洙曰遊絲蛛絲之遊散者香煙似之雲近蓬萊常五色雪殘鳷鵲亦多時鄭曰鳷章移切洙曰蓬萊殿名鳷鵲樓名趙曰蓬萊殿名也鳷鵲漢觀名在甘泉宫秦曰謝玄暉詩云金波麗鳷鵲則借漢殿觀名以比當時之禁掖侍臣緩步歸靑瑣洙曰青瑣門也以青畫戶邊鏤中天子制也趙曰靑瑣漢門在未央宫今亦借用退食從容出每遲昱曰羔羊詩自公退食紫宸殿退朝口號鄭曰長安志宣政殿北曰紫宸門內有紫宸殿即內衙正殿戶外昭容紫䄂垂洙曰唐制昭容正二品係九嬪田曰唐制天子坐朝宫人引至殿上敬宗天祐二年始止小黃門祇候引從宫人不得出內雙瞻御座引朝儀蒼舒曰右按唐制天子坐朝宫人引至殿上至天祐二年十二月詔曰宫嬪女職本備內任今後每遇延英坐日只令小黃門祗候引從宫人不得出內又百官志注昭容為九嬪正二品趙曰應用昭儀二人為引謂之瞻則回瞻也香飄合殿春風轉花覆千官淑景洙曰一作日移師曰淑景日景也晝漏聲洙曰一作稀聞髙閣報趙曰以閣之髙而傳之逺也天顔有喜近臣知洙曰言近臣密邇清光宫中每出歸東省㑹送䕫龍集洙曰一作到鳯池洙曰䕫龍舜之良臣䕫典樂龍納言鳯池荀朂為中書令及罷云奪我鳯鳯池趙曰唐制左拾遺領門下省而門下省在東故曰東省宫詞律詩九首秋興五首同作八首餘見四時門聞道長安似奕碁洙曰奕碁互勝負也百年丗事不勝洙曰一作堪悲王侯第宅皆新主洙曰以喪亂而傷主也左太冲濟濟王城內赫赫王侯居文武衣冠異昔時洙曰非故舊也直北關山金鼓振洙曰時河北尚用兵也趙曰言䕫州之北用兵乃隴古關輔間也舊本輒云河北尚用兵考之大曆二年豈有此事乎征西車馬羽書遲楷曰征西興於漢代以張遼為征西大將軍也一作馳趙曰此所云西指言吐蕃之過征西者將軍之號也魚龍寂寞秋江冷故國平居有所思洙曰秦有魚龍川修可曰草閣秋興詩乃䕫州所作豈可言秦之魚龍川乎按酈元水經曰魚龍以秋日為夜龍秋分而降蟄寢於淵故以秋日為夜也此二詩皆秋時是以子美言魚龍回夜水魚龍寂寞秋江冷也趙曰言故國平時之事今有所思也蓬萊宫闕對南山承露金莖霄漢間洙曰漢武帝置金露盤西都賦抗仙掌以承露摧雙立之金莖軼埃壒之混濁鮮皓氣之清英西望瑶池降王母洙曰漢武帝內傳七月七日西王母降漢武帝夜忽見天西南如有白雲起俄頃王母至趙曰周穆王觴王母於瑶池之上今云望瑶池則望其自瑶池而降也東來紫氣滿函關洙曰老子傳注列仙傳曰關令尹喜者周大夫也善學星宿服精華隱德行仁時人莫知老子西遊喜先見其氣知真人當過候物色而迹之果得老子亦知其竒為著書與老子俱之流沙之西服巨勝實莫知其所終亦著書九篇名關令子雲移雉尾開宫扇洙曰見雲橫雉尾髙注趙曰崔豹古今注云商髙宗有雊雉之祥服章多用翟羽故有雉尾扇今公言天子雉扇則天子御朝用日繞龍鱗識聖顔一卧滄江驚嵗晚趙曰公自謂也幾回靑瑣點朝班洙曰見通籍踰靑瑣注趙曰想望省中諸公之朝也靑瑣者漢未央宫中門名瞿唐峽口曲江頭萬里風煙接素秋洙曰瞿唐曲江雖南北萬里相逺而秋止一色也花萼夾城通御氣洙曰見白日雷霆夾城仗注趙曰花萼明皇樓名芙蓉小苑入邊愁洙曰見靑春波浪芙蓉園注花萼樓芙蓉園皆長安宫禁故事趙曰芙蓉苑在敦化坊本天子遊幸之地而今乃有邊愁入於其間以紀吐蕃之亂當陷京師故也珠簾繡柱圍黃鶴洙曰昭陽殿織珠為簾風至則鳴如珩珮之聲趙曰言繡窠作雙鶴圎而用茰線繡為鶴也舊解惑於黃鶴二字遂便以為黃鶴樓非錦纜牙檣起白鷗回首可憐歌舞地秦中自出帝王州洙曰謝元暉鼓吹曲江南佳麗地金陵帝王州昆明池水漢時功洙曰初武帝欲征昆明夷為有填河乃作池以習水戰因而得名武帝旌旗在眼中織女機絲虛月夜石鯨鱗甲動秋風洙曰西京雜記昆明他刻玉石為鯨每至雷雨鯨常鳴吼鬐尾皆動漢丗祭之以祈雨往往有驗西都賦集乎豫章之宇臨乎昆明之池左牽牛織女似雲漢之無涯修可曰西都賦注武帝鑿昆明池於左右作牽牛織女以象天河波漂菰米沉雲黑洙曰西京雜記太液池邊皆是雕胡緑節之類菰之有米者長安人謂之為雕胡菰之有首者謂之緑節見滑憶雕胡飯注趙曰言菰之多其望之長逺黯黯如雲之黑也露冷蓮房墜粉紅洙曰蓮房蓮花也修可曰蓮房墜粉紅謂蓮實上花葉墜也爾雅荷芙蓉芙蕖其華菡蓞其實蓮其中的郭璞注云蓮謂房也的房中子也以此考之則蓮房非花矣唐本草圗經云菰又謂之茭白嵗久者中心生白臺如小兒臂謂之菰手其臺中有黑者謂之茭鬱至後結實乃雕胡米也沉雲黑其茭欎乎趙曰言蓮花一朵而諸相是花房中巳自有一蓮蓬其房中有的其的有薏皆分明也關塞極天唯鳥道洙曰言道路多俠所通者鳥道而巳趙曰言白帝城之塞鳥道則一帶皆髙山也沈曰南中地志交趾郡治龍遍縣自興古鳥道四百里江湖滿地一漁翁趙曰公自謂也昆吾御宿自逶迤鄭曰晉灼曰昆吾地名有亭顔師古曰御宿苑在長安城南孟東曰諸宫别觀不許人往來上宿皆宿於此故名御宿紫閣峯隂入渼陂洙曰一云紫閣峯隂入渼陂昆吾御宿自逶迤鄭曰渼莫彼切今本作漾如亮切非是趙曰此篇紀其舊遊漾陂之事也昆吾御宿皆地名以長安志考之在萬年縣西紫閣峯終南山之峯名香稻啄餘鸚鵡粒碧梧棲老鳯凰枝余曰古今詩話云紅飯啄餘鸚鵡粒碧梧棲老鳯凰枝此語反而意竒退之詩云舞鑑鸞窺沼行天馬度橋亦效此里佳人拾翠春相問洙曰洛神賦或拾翠羽趙曰費昶春郊望美人詩芳郊拾翠人仙侣同舟晚更移洙曰李膺郭林宗同舟而濟人望之為仙舟綵筆昔曾干氣象白頭吟望苦低垂洙曰卓文君有白頭吟趙曰公自言昔日曽携綵筆題詩干歷其氣象老矣正白頭中吟詠而望之其頭苦於低垂洞房洞房環珮冷玉殿起秋風蘇曰楊妃過溫湯行云玉殿空掩屝秋風動琪樹昔日繁華事盡逐流波去介甫永叔俱稱絶題趙曰此篇思長安而懷帝闕也言洞房所以環珮冷者以玉殿起秋風之時也楚辭修容修態亘洞房秦地應新月龍池滿舊宫洙曰興慶宫明皇潜龍之地也有龍池在焉趙曰按長安志龍池在興慶宫躍龍門南本是平地垂拱初因雨水流潦成小池至景龍中爾亘數頃深至數丈常有雲氣或見黃龍繫舟今夜逺洙曰莊子謂藏舟於壑謂之固矣然夜半有力者負之而走淸漏往時同洙曰漏聲依舊也趙曰所繫舟之處去秦地為逺而想像淸漏與往時無異萬里黃山北園陵白露中洙曰東方朔微行始北至池陽西至黃山晉灼曰宫名在槐里趙曰尤見懷長安之心切矣舊所引脫誤今桉傳去唐帝微行而至黃山蓋右扶風槐里縣有黃山宫惠二年所起宿昔洙曰詠天寶中事也宿昔靑門裏逸曰靑門京城東門蓬萊仗數移鄭曰數色角切逸曰蓬萊殿名花驕迎雜樹洗曰天寶中最重木芍藥群花不可比其貴盛趙曰言雜樹之花則如桃李之屬沈約望春詩春風搖雜樹龍喜出平池洙曰柳芳傳信記云天寶中興慶宫小龍常游於宫垣南溝水中落日留王母洙曰山海經云西王母狀如人狗尾蓬頭戴勝善嘯居洵水之涯漢武帝內傳云西王母與上元夫人降帝美容貌神仙人也微風倚少兒洙曰衛靑傳衛媪次女少兒趙曰王母以言楊貴妃少兒以言妃之諸姨矣少兒則衛少兒也宫中行樂祕夢符曰右按前漢書周仁為人隂重不泄得幸入卧內於後宫祕戲少有外人知能畫能畫毛延壽洙曰西京雜記杜陵畫工毛延壽善為人形醜好老少必得其真投壷郭舍人洙曰東方朔傳幸倡郭舍人滑稽不窮西京雜記武帝時郭舍人善投壷以竹為矢不用棘也能激矢令還一矢百餘反謂之驍言如博之豎於輩中為驍傑也每為武帝投壷輒賜金帛也每蒙天一笑洙曰玉女投壷天為之笑則電修可曰仙傳拾遺大公與玉女投壷不入者天為之嚂噓注嚂噓開口笑也又太平御覽載神異慱曰東王公與玉女投壷設而不接天為之笑開口流光今電是也二說大同小異師曰玄宗時承平日久驕逸遂生百技皆能感動帝意故云云復以物皆春政化平如水洙曰言無偏詖也皇恩斷若神洙曰言不可測也時時用抵戲亦未雜風塵洙曰抵戲謂角抵也今兩兩相當角力量其技爾趙曰言至用抵戲而止不甚雜民俗之風塵事也鬪雞鮑曰東城父老傳云明皇以乙酉生而喜鬪雞兆亂之象也鬪雞初賜錦洙曰楊妃外傳云國忠始以鬪雞供奉曹子建鬪雞東郊道趙曰明皇好鬪雞有賈昌者以善養雞蒙寵當時為之歌曰生兒不用識文字鬪雞走犬勝讀書賈家小兒年十三冨貴榮華代不如推此則賜錦可知矣舊所引國忠事皆妄舞馬既登牀洙曰既一作解明皇常令教舞四百蹄臣之為某家驕其曲謂之傾杯樂奮首鼓尾無不應節又施三層木牀乘馬於上抃轉如飛命壯士舉馬舞於榻上安祿山亂馬散落人間田承嗣得之一日軍中大饗馬聞樂而舞承嗣以為妖而殺之簾下宫人出樓前御柳洙臼一作曲長仙遊終一閟女樂久無香洙曰謂祿山亂天子出幸女樂流散也趙曰仙遊言明皇上升矣宜女樂之久無香也寂寞驪山道淸秋草木黃洙曰言不復行幸也定功日傷嘆之也秋風辭云草木黃落兮鴈南飛省宇律詩五首題省中院壁掖垣竹埤梧十尋趙曰禁掖之垣墻也竹埤當側聲國語訟桓不生埤注云埤下濕也音卑又皮靡切洞門對雪洙曰一作霤常隂隂洙曰洞門猶洞戶師曰董賢傳重殿洞門注洞門謂門之相當也定功曰對雪當作對霤左太冲吳都賦云增岡重阻列真之宇王當對霤石室相距蓋是詩有鳴鳲乳燕落花遊絲之話乃春時非可言對雪但傳寫之誤蘇曰魯直常云唐省中皆青壁畫雪落花遊絲白日靜洙曰梁簡文帝春日詩落花隨燕入遊絲帶蝶驚鳴鳩乳燕靑春深洙曰乳燕雛燕腐儒衰晚謬通籍洙曰黥布傳上置酒對衆折隋何曰腐儒為天下安用腐儒哉師古注腐者爛敗言無所堪者通籍見通籍微班添注退食遲回違寸心衮職曾無一字𥙷洙曰詩衮職有闕仲山甫補之注衮君之上服𥙷之善𥙷過趙曰公前為拾遺故用𥙷衮事不必泥仲山甫為宰相事也許身愧比雙南金洙曰古詩美人贈我緑綺琴何以報之雙南金師曰甫自賦歸謁肅宗肅宗授左拾遺得通籍禁省退食遲回違寸心言老年仕宦非其本心况無忠言以𥙷天子無以報君恩之重故云許身愧比雙南金春宿左省花隱掖垣暮趙曰隱者隱蔽之也啾啾棲鳥過星臨萬户動月傍九霄多趙曰使漢宫千門萬戶之萬戶也九霄多意言九霄之間月色明遍斯為多也不寢聽金鑰因風想玉珂鄭曰丘何切洙曰玉珂鳴珂也蒼舒曰按通典老鵰入海為珬可截作馬勒謂之珂蘇曰郭汕立風簷時聽玉珂趙曰兩句有封事而欲上故聽開門且想朝馬之鳴珂也明朝有封事洙曰言事也欲其密故封之以逹數問夜如何鄭曰數色角切趙曰起於詩夜如何其也師曰漢武帝為千門萬戶之遊萬户指宫中之門也月傍九霄言親近天子也聽金鑰恐天子門開羣臣入朝風傳玉珂之聲故數問夜如何玉珂導者所鳴之珂或云鳥非也晚出左掖晝刻傳呼淺洙曰新漏刻銘云衛宏載傳呼之節較而未詳注衛宏著漢儀使夜漏起宫衛傳呼以為備也趙曰傳呼淺則傳呼在晝不若夜之逺也春旗簇仗齊洙曰春旗羽衛孫曰記月令退朝花砥散歸院柳邊迷樓雪融城濕宫雲去殿低避人焚諌草騎馬欲雞栖洙曰髙士簾每有獻納必焚其草文選雞登栖而斂翼師曰騎馬出在掖雞欲棲于時謂日之夕矣肅宗至德𥘉子美為拾遺岑參為𥙷闕或問二人孰賢杜田曰子美賢或曰何以知之曰以其詩知之子美之詩曰避人焚諌草騎馬欲雞栖又曰明朝有封事數問夜如何參之詩曰聖朝無闕事自覺諌書稀至德初安史之亂方劇上皇在蜀朝野騷然果無闕事時耶宿府清秋幕府井梧寒洙曰梧桐也趙曰魏明帝詩雙梧生枯井詩用井梧自此始矣獨有江城蠟炬殘永夜角聲悲自語中天月色好誰看蘇曰李固邊角風急永夜無寐時唯自語鄭當時中天月色皎潔故人流落千里不知渠與誰看也風塵荏苒音書絶關塞蕭條行路難巳忍伶俜十年事洙曰伶俜猶零丁也流落貌強移栖息一枝安洙曰莊子言鵬鷃事而云鷦鷯巢於深林不過一枝以謂性各有極苟足其極則不知其所以然矣院中晚晴懷西郭茅舍幕府秋風日夜淸洙曰幕府事見送髙三十五書記詩武帝拜霍去病大將軍於幕府中故號幕府也淡雲踈雨過髙城葉心朱實堪時落洙曰劉越石朱實隕徑風繁茰落素秋階面靑苔先自生洙曰沈休文詩賔除緑錢滿客位紫苔生復有樓臺銜暮景不勞鍾鼓報新晴浣花溪裏花饒笑肯信吾兼洙曰一作今吏隱名洙曰公嘗為嚴公參謀故云吏隱趙曰言浣花之開似能獻笑必笑我離草堂而宿院此中有公家事亦不信我兼為吏隱也字出汝南先賢傳鄭欽吏隱於蟻陂之陽兼一作今陵廟古詩二首律詩十四首橋陵詩三十韻因呈縣內諸官鮑曰開元三年六月睿宗崩十月葬橋陵公故有是詩師曰天子之墳曰山陵取其髙大之義先帝昔晏駕洙曰前漢天文志宫車晏駕注天子當晨起早作而方崩殞故稱晏駕者凡臣子之心猶謂宫車晚出也趙曰先帝指言睿宗也茲山朝百靈洙日海賦竭盤石栖百靈趙曰兹山橋陵也陸機作吳大帝誄有云幽驅百靈崇岡擁象設洙曰嵇叔夜琴賦託峻嶽之崇岡沃野開天庭洙曰張平子西京賦廣衍沃野厥田上上實為地之奧區神臯夢符曰右按楚詞招魂象設君室靜安間些即事壯重險洙曰易習坎重險也天台賦履重險而逾坂沈休文即事既多矣論功超五丁洙曰蜀王本紀曰天為蜀王生五丁力士能徙山秦王獻美女與蜀王蜀王遣五丁迎女見一大蛇入山穴中五丁共引蛇山崩秦五女皆上山化為石坡陀因厚地洙曰相如二丗賦登坡陀之長坂却略羅峻屏修可曰孫綽詩逺山却略羅峻屏蒼舒曰天台賦壁立之翠屏雲闕虛冉冉洙曰天台賦雙闕雲竦以夾路風松肅泠泠洙曰顔延年拜陵廟詩松風遵路急離騷七諌下泠泠而來風蘇武詩泠泠一何悲石門霜露白玉殿莓苔靑洙曰孫綽踐莓苔之滑石異苑曰天台山石有莓苔之險宫女曉知署祠官朝見星趙曰以其勤洛而䖍於從事也空梁簇畫㦸修可曰隋薜道衡云空梁落燕泥隂井敲銅瓶中使日夜繼惟王心不寧豈徒恤備享尚謂求無形趙曰禮記備物之享禮云視於無形孝理敦國政神凝推道經洙曰莊子曰用志不分乃凝於神瑞芝産廟柱洙曰唐書肅宗延英殿御座梁上生玉芝一莖三花上製靈芝詩趙曰自是橋陵廟中柱耳舊注却引肅宗延英殿梁上生芝非是好鳥鳴洙曰一作巢巖扄修可曰曹子建好鳥鳴髙枝髙嶽前嵂崒洪河左瀅濙鄭曰上烏定下于扄切小水也洙曰西都賦右界褒斜隴首之險帶以洪河涇渭之川趙曰髙嶽指嵩髙山也字起於嵩髙惟嶽洪河指言橋陵之左是洪河所過也金城蓄峻趾洙曰班固賦建金城之萬雉乃鑿墉之趾以益其髙也修可曰金城地名前漢地理志秦地西有金城武威唐以金城為蘭州郡公以金城對沙苑其為地名可知炎曰漢金城郡注云昭帝始元六年置應劭曰𥘉築城得金故曰金城沙苑交回汀永與奧區固洙曰西都賦防禦之阻則天地之奧區焉張平子賦實為地之奧區神皋川原紛眇冥居然赤縣立洙曰張衡慮圖曰崑崙東有赤縣之州風雨有時寒暑有節苟非此土南則多暑北則多寒東則多隂故聖主不處焉史記鄒衍著書云中國於天下八十一分居其一分耳中國名赤縣內自有九州禹之叙九州是也不得為州數中國外亦如赤縣州者有九乃謂九州也趙曰蒲城縣本屬同州開元四年以縣之豐山建睿宗橋陵改為奉先縣仍隸京兆府十七年舁為赤故公詩言赤縣舊注引崑崙東有赤縣非是臺榭爭岧亭洙曰江淹詩岧亭南樓期西京賦于雲霧而上逹狀亭亭以迢迢官屬果稱是聲華真可聽洙曰謂縣內諸官也蘇曰二陸聲華使人可服王劉美竹潤洙曰爾雅東南之美者有㑹稽之竹箭焉晉江遁竹賦有嘉生之美竹翕幽液以潤夲裴李春蘭馨洙曰說文蘭香草也嵇叔夜琴賦春蘭𬒳其東鄭氏才振古洙曰詩振兹如古注振自也啖侯筆不停鄭曰啖杜覽切洙曰王劉裴李鄭啖皆當時赤縣官也趙曰禰正平鸚鵡賦序衡因為賦筆不停綴遣辭必中律鄭曰中丁仲切洙曰陸士衡文賦放言遣辭良多變矣禹以聲為律身為度利物常發硎鄭曰奚經切硎石也洙曰莊子養生篇庖丁為文惠君解牛文惠君曰嘻善哉拔蓋至此乎庖丁釋刀對曰臣之所好者道也進乎拔矣始臣之解牛之時所見無非牛者三年之後未嘗見全牛也今臣之刀十九年而所解數千牛矣而刀刃若新發於硎綺繡相展轉琳琅愈洙曰一作逾青熒洙曰禹貢雍州厥貢球琳琅玕注皆玉名琅玕石而似珠西都賦琳珉靑熒校獵賦玉名嶜崟昡耀靑熒側聞魯恭化洙曰後漢魯恭字仲廉為中牟令專以德化為理不任刑罰河南尹袁安聞之疑其不實使仁恕掾肥親往察之肥還府以三異狀白安安因上書言狀帝異之秉德崔瑗銘洙曰後漢崔瑗字子王髙於文辭尤喜為書記針銘所著賦碑針頌今座右銘傳於世太史候鳬影王喬隨鶴翎洙曰見終明府水樓并昔遊詩注朝儀限霄漢洙曰謝靈運照灼爛霄漢又結念屬霄漢孤景莫與謾趙曰此公之自述也知縣入朝矣而公不得預朝此所以自嘆耳客思回林坰洙曰謝惠連相送越林坰趙曰爾雅林外謂之坰轗軻辭下杜鄭曰上苦感下口左切洙曰孝宣紀尢樂杜鄠之間率常在下杜孟康曰在長安南師古曰下杜即今之杜城飄颻凌濁涇吕曰詩涇以渭濁諸生舊短褐洙曰婁敬日臣衣帛衣帛見衣褐衣褐見趙曰使貧者衣短褐也舊注引㟺敬衣褐見非是旅泛一浮萍洙日古詩泛泛江漢萍漂蕩水元根劉靈曰俯觀万物優擾焉如水之載浮萍王逸曰自比如萍隨水浮遊荒嵗兒女瘦暮途涕泗零吕曰漢書主父偃曰日暮途逺吾故倒行而逆施詩涕泗滂沱主人念老馬洙曰韓詩外傳日昔者田子方出見老母於野喟然有志問於御者曰故公家畜也罷而不為用故放出田子方曰少尽其力而老弃其身仁者之不為也束帛贖之窮士聞之知所歸心焉廨宇容秋螢流寓理豈愜趙曰謝靈運擬王粲詩序云家本秦川貴公子遭亂流寓自傷情多也窮愁醉未醒修可曰史記虞卿非窮愁亦不能著書以自見於後丗何當擺俗纍浩蕩乘滄溟洙曰史虞卿傳贊虞卿非窮愁亦不能著書以自見於後丗蘇曰蘇勛何時擺脫俗纍乘一葉泛滄𬈑之浩蕩偃仰視八極挹瓊漿丹砂吾志足矣歐陽曰腐草化為螢其質不美甫喻諸官不以其質不美而賤之故云容秋螢流寓者出於事勢不得巳甫豈樂為之苟能擺脫俗纍優游於江湖之上乃甫性之所樂尚以俗纍所拘為限矣題衡山縣文宣王廟新學堂呈陸宰旄頭彗紫微無復爼豆事洙曰旄頭胡星也彗彗星也紫微帝宫也胡星彗帝宫喻祿山亂中原陷長安也丗亂爼豆之事不講故云無復也趙曰按晉天文志昴七星天之耳也又為旄頭胡星彗紫微則言其犯帝座也彗字在天文志與孛俱為妖星之名此追言安史之亂金甲相排蕩靑襟一憔悴洙曰蓋民狃於戰爭不遑學校也嗚呼巳十年儒服弊于地洙曰不振也征夫不遑息學者淪素志我行洞庭野歘得文翁肆侁侁胄子行鄭曰侁踈臻切行貌若舞風雩至洙曰文翁為蜀郡守興建學校以教蜀人故風俗大變可比齊魯侁侁整肅貌胄子謂元子以下至卿大夫子弟從學者若舞風雩而至也語曰風乎舞雩也趙曰論語疏雩者祈雨之祭名使童男女舞之因謂其處為舞雩周室冝中興孔門未應棄是以資雅才渙然立新意洙曰周室借周以喻唐也言唐所以冝中興則孔門豈可弃乎蓋君君臣臣父父子子百姓日用而不知者皆在是也雅才陸宰也新學資之而成爾衡山雖小邑首唱恢大義洙曰丗亂而衡山能首建學校也因見縣尹心根源舊宫閟洙曰詩閟宮頌僖公能復周公之宇也講堂非曩構大屋加塗墍鄭曰巨至切仰塗也下可容百人墻隅亦深邃何必三千徒始壓戎馬氣洙曰學校者教化之所自也魯侯能修泮宮而淮夷攸服則其所以折暴亂者何必三千之徒言文德足以服逺也林木在庭户密幹曡蒼翠有井朱夏時轆轤凍階戺鄭曰上盧谷切下落胡切圎轉水戺鋤里切砌也耳聞讀書聲殺伐災髣佛鄭曰芳未切趙曰聞讀書而樂彼殺伐之災在此特覺其髣佛而巳故國延歸望衰顔減愁思南紀收波瀾洙曰言能以文德易暴亂趙曰洗波瀾之氛妖西河共風味洙曰史記子夏居西河教授為魏文侯師共風味者言人樂其教也采詩倦跋涉載筆尚可記趙曰言采詩之官倦跋山涉水之勞而不來采之則史官之載筆尚可記陸宰之美也髙歌激宇宙凡百慎失墜洙曰尚可記一云記竒異師曰青禴謂學士以青緣衣領也父母存則衣冠飾以青禴素志謂其志不展也文翁肆指縣學前漢杜鄴子林清靜好古有雅才又其胡廣傳注又後漢髙彪有雅才而訥於言雅才指陸宰新學資之而立故云首唱恢大義墍塗壁也昔僖公修泮宫而服淮夷今陸宰為是學文德自足以懷逺何必三千之徒始壓戎兵氣平轆轤所以運水言學中種木鑿井無不備具殺伐災髣佛言此邦絃誦之樂兵革之患少也南紀改瀾波言變其荊楚輕剽之風而恩波廣𬒳也昔子夏居西河教授今陸宰與之同其風使人咀味其教也太師采詩以觀民風今采詩之官倦於跋涉使陸宰德政不聞于上甫得不以是篇而記其事以備國史之失墜也行次昭陵彥輔曰唐太宗文皇帝之陵也舊俗疲庸主洙曰舊俗謂隋氏庸主煬帝疲困也群雄問獨夫洙曰獨夫以失道而無助也書獨夫紂群雄如李密之流也䜟歸龍鳯質洙曰䜟書也唐太宗龍鳯之姿天曰之表書生云威定虎狼都洙曰蘇秦傳秦虎狼之國謂先定關中也天屬尊堯典洙曰父子天屬也尊堯典謂循功典法也太宗髙祖次子也師曰髙祖禪位於太宗猶堯之遜天下於舜故云云神功協禹謨魯曰謂親定九州也趙曰謂禹成厥功而書有大禹謨也舊注非風雲隨絶足洙曰風雲㑹合隨馬足而起也趙曰魏文與孫權送馬書曰中國雖饒馬其知名絶足亦時有之矣師曰時李靖之徒皆以風雲之㑹隨馬足而奮也日月繼髙衢洙曰日月謂相繼而明也謂髙祖禪位文物多師古洙曰文物典章左傳文物以紀之師古謂以古為師也猶稽古趙曰文物如唐贊云太宗之治制度紀綱之法朝廷半老儒洙曰太宗之時朝廷多老儒碩學趙曰老儒謂房杜之屬沈曰太宗置學館招延十八學士故云云直詞寧戮辱趙曰如魏鄭公王圭之諌諍賢路不﨑嶇洙曰太宗納諌容直言如魏徵之切直無所不至而以能容之孫伏伽諫論元律罪不當死賜以蘭陵公主園直百萬其用人如馬周之流咸能盡其才趙曰言不艱於進用如用馬周之才也往者災猶降蒼生喘未蘇指揮安率土蕩滌撫洪爐甌陽曰謂陶成天下如洪爐尓壯士悲陵邑洙曰陵色陵廣也有奉色幽人拜鼎湖洙曰鼎湖黃帝鑄鼎鼎成而仙去後丗名其地為鼎湖趙曰言天變未弭而指麾安率士蕩滌撫洪爐則言太宗之意猶欲勒兵於逺地立思方如此遽爾升遐故繼之以有陵色之悲鼎湖之拜也玉衣晨自舉洙曰上賜霍光玉衣梓宫耿秉亦賜玉衣修可曰玉衣貴人死者珍異之衣鐵馬汗常趨薖曰陸佐公鐡馬千群松柏瞻虛殿洙曰虛一作靈塵沙立瞑途寂寥開國日洙曰謂太宗躬親戎馬平一天下開建國社也易開國承家流恨滿山隅師曰追想太宗開國之日今無英雄之主如太宗以安天下是以流恨也重經昭陵草昧英雄起洙曰屯難之時也師曰草而不齊昧而不明言隋末之亂也謳歌曆數歸洙曰孟子謳歌者不謳堯之子而謳歌舜語天之曆數在汝躬言其天命之所在也風塵三尺劒洙曰髙紀上擊布時為流矢所中行道疾甚呂后迎良醫又入見上問醫曰疾可治於是上慢罵之曰吾以布衣提三尺取天下師古曰三尺劒也社稷一戎衣洙曰武成一戎衣天下大定衣服也一著戎衣而滅約言衆心同也翼亮貞文德丕承戢武威洙曰書丕顯哉文王謨丕承哉武王烈師曰置文館以招學士故云云聖圗天廣大洙曰無不覆燾也宗祀日光輝洙曰奕葉隆盛也陵寢盤空曲熊羆守翠微洙曰陵山陵也寢寢廟也古詩陵寢暮煙青再窺松柏路還見五雲飛洙曰天子有孝感則五雲見見往在詩注俯曰五雲五色雲也禹廟禹廟空山裏秋風落日斜蘇曰楊修晚蟬噪秋風饑鴉閙斜日荒庭垂橘柚古屋畫龍蛇洙曰招魂仰觀刻桷畫龍蛇雲氣生虛壁洙曰一作清虛壁江聲走白沙早知乘四載洙曰史記河渠書云夏書曰禹湮洪水十三年三過不入門陸行載車水行載舟泥行蹈橇山行即橋一作輦疏鑿洙曰一作流落控三巴洙曰華陽國志曰武王克商封其子宗姬於巴爵之以子古者雖大爵不過子故吳楚及巴皆曰子獻帝時征東中郎將安漢趙韙建議分巴為二郡韙欲得巴舊名故曰巴益州牧劉璋以墊江以上為巴郡江州至臨江為永寧郡朐忍至魚復為固陵郡巴遂分矣璋復改永寧為巴郡以固陵為巴東徙龐義為巴西太守是三巴郭璞江賦巴東之峽夏后疏鑿趙曰按樂史寰宇記於渝州記云閬白二水東西流三曲如巴字是為三巴則非分有其地之定名當俟博聞訂之鄭曰十道志渝州巴縣并巴東西是為三巴冬日洛城北謁玄元皇帝廟洙曰唐天寶元年陳王府參軍田周秀上言玄元皇帝降于丹鳯門之通衢告錫靈符在尹喜之故宅上遣使就函谷故關尹宅發得之乃置玄元廟於大寧坊親享于新廟是秋改為太上玄元皇帝宫二年追尊大聖祖玄元皇帝仍於天下諸郡為紫微宫秋改譙郡紫微宫為太清宫趙曰玄元皇帝李老君也配極玄都閟洙曰配皇等極老子曰是謂配天極玄都觀也閟閉也神也詩閟宫有洫田曰配紫極也紫極北極也晉謝安建宫室極合辰極乃其義矣趙曰以廟在城之北故曰配極玄都丹臺仙真之所也故用玄都言廟舊注言玄都觀也妄引妄注惑亂義理陳敏修曰閟幽深也慿髙禁禦長洙曰前漢宣紀詔池禦未御幸者假與貧民注禦者禁苑前漢書音義曰折竹以懸繩連之使人不得往來謂之禦守祧嚴具禮洙曰周禮春官守祧注逺廟曰祧遷主之所藏也趙曰周禮守祧掌守先王之廟祧故監廟者謂之守祧掌節鎮非常洙曰禮掌節注節猶信也行者所執之信掌節掌守邦節而辨其用以輔王命趙曰必有御賜之信以為鎮故得借掌節以為言朝冲之曰賜以節所以鎮重其廟碧瓦初寒外趙曰葛仙傳夢人書新宫銘云碧瓦鱗差琪曰碧瓦琉璃瓦也𥘉寒外指冬日也金莖一氣旁洙曰劉駼騊詩曰縹碧以為瓦班固西都賦抗仙掌以承露擢雙立之金莖郊祀志漢武作柏梁銅柱承露仙人掌之屬也山河扶繡户洙曰謂户上繪畫若繡也梁沈約春風詠明珠簾於繡户散芳塵於綺席日月近雕梁洙曰雕刻梁棟也修可曰擅約陽春歌曰白日映雕梁相近日月言髙大也仙李盤根大洙曰神仙傳老子姓李名耳字伯陽楚國苦縣屬鄉曲仁里人也盤根大故枝葉繁盛謂唐室以李為聖祖也定功曰老子主指李樹為姓而唐以為聖祖故曰仙李盤根大猗蘭奕葉光洙曰漢武帝故事曰孝景王后夢日入其懷以七月七日生武帝於猗蘭殿奕葉猶纍丗也沈曰郭子橫洞冥記曰漢武末生景帝夢一赤彘從雲中直下崇芳之閣帝覺而至於閣上見赤氣如煙霞來蔽戶牗乃改崇芳閣為猗蘭殿後王夫人生武帝于此殿奕葉猶纍丗也丗家遺舊史洙曰史記有老子傳而無丗家道德付今王洙曰老子道德經明皇御注畫手看前輩吳生逺擅埸洙曰廟有吳道子畫張平子東京賦秦政利觜長距終得擅場鮑曰山谷道人簡王立之曰凡作詩賦要以宋玉賈誼相如子雲為師略依放其步驟乃有古風杜詩云畫手看前輩吳生逺擅場蓋古人於能事不獨求誇時輩須要於前輩中擅埸耳森羅移地軸洙曰河圖括象曰地有三百六十軸趙曰肇論云万象森羅海賦云又似地軸挺拔而爭回妙絶動宫牆洙曰言筆跡巧妙冠絶也五聖聮龍衮洙曰唐書天寶八年上親謁太清宫上聖祖玄元皇帝尊號為聖祖大道玄元皇帝髙祖太宗中宗睿宗五帝皆加大聖皇帝之字禮器天子龍衮千官列鴈行洙曰丘遲書功臣名將鴈行有序謂繪五帝侍從也冕旒俱秀發洙曰禮器天子之冕朱緑藻十有二旒諸侯九上大夫七下大夫五士三梅聖俞曰秀發謂五聖氣宇清秀也旌斾盡飛揚洙曰儀仗也趙曰旌斾旌之有斾也陸士衡長旌誰為斾翠柏深留景趙曰魏魏收庭柏詩陵寒翠不奪紅梨逈得霜趙曰言梨葉得霜而紅也梁庾肩吾詩梨紅大谷晚桂白小山秋風筝吹玉柱洙曰風筝謂製筝挂之風際風至則鳴也江淹詩玉柱楊清曲露井凍銀床洙曰古詩後園鑿井銀作床金瓶素綆汲寒漿趙曰露地之井之也庾丹秋閨云空汲銀床井余曰邵氏聞見録少陵露井東銀床本晉書樂志淮南篇後園鑿井銀作床金瓶素綆汲寒漿也或以此論少陵之妙豫謂少陵所以獨立千載之上者不但有所本也三百篇作果何本哉馬存曰銀床井欄也身退卑周室洙曰史老子周守藏室之吏也修道德其學自以隱無名為務居國久之見周之衰乃遂圡修可曰老子之引退為周室日以卑削之故史記曰周之衰乃去經傳拱漢皇洙曰漢又景間崇黃老之教師曰漢文景皆崇尚黃帝老子之術故云經傳拱漢皇拱謂用其術以致無為之治故垂衣拱手也谷神如不死洙曰老子谷神不死是謂玄牡養拙更何鄉師曰谷所以藏物谷神猶云藏神何鄉謂無所止猶云何有之鄉湘夫人祠洙曰屈原九歌有湘夫人韓愈黃陵廟碑云湘旁有廟曰黃陵自前古立以祠堯之二女舜二妃者庭有石碑斷裂分散在地其文剝缺考圖記言漢荊州牧劉表兄字景升立題碑曰湘夫人今碑驗其文乃晉太康九年又題其額虞帝二妃之碑非景升之立者秦博士對始臯帝云湘君者堯之二女舜妃者也劉向鄭玄亦皆以二妃為湘君離騷九歌既有湘君又有湘夫人王逸之解以為湘君者自為水神而謂湘夫人乃二妃也從舜南征三苗不返道死沅湘之間山海經曰洞庭之山帝之二女居之郭璞疑二女者帝舜之后不當降小君為其夫人因以二女為天帝之女以余考之璞與王逸俱失也堯之長女娥皇為舜正妃故曰君其二女英自宜降曰夫人也故九歌辭謂娥皇為君謂女英為帝子各以其盛者言之也禮有小君明其正者得稱君也書曰舜陟方乃死傳謂舜升道南方以死或曰舜死葬蒼梧二妃從之不及溺沅湘之間余謂竹書紀年帝王之沒皆曰陟陟升也謂升天也書殷禮陟配天言以道終其德協天也書紀舜之沒云陟者與竹書司文也其下言陟方乃死者所以釋陟為死也地之勢東南下如言舜南巡而死宜言下方不得言陟方也以此謂舜死葬蒼梧之野於時二妃從之不及而溺者皆不可信肅肅湘妃廟洙曰肅肅敬也詩思齊肅肅在廟空墻碧水春蟲書玉佩蘚燕舞翠帷塵晚泊登汀樹微馨借渚蘋蒼梧恨不淺染淚在叢筠洙曰湘妃涕泣以淚揮竹染竹成班趙曰張華博物志云舜死二妃淚下即班祠南夕望百丈牽江色洙曰海賦揭百丈百丈所以牽船也連竹為之孤舟泛日斜興來猶杖屨鄭曰興許應切目斷更雲沙山鬼迷春竹洙曰屈平九歌有山鬼詞云余處幽篁兮終不見天路險難兮獨後來湘娥倚暮花洙曰湘娥屈平所謂湘君也詞云采薛荔兮水中搴芙蓉兮木末趙曰事雖折謂湘夫人而字則郭璞江賦協靈爽於湘娥也鬼迷竹而娥倚花亦是詩家當然舊注引湘君詞搴芙蓉兮木末非也此得屈原言不得志猶登山緣木而採芙蓉不可得也湖南淸絶地萬古一長嗟洙曰郭璞江賦協靈爽於湘娥蘇曰徐元詩萬古長安景搔頭一嘆嗟謁先主廟洙曰成都記曰先主廟府南八里惠陵東七十步齊髙帝夢益州有天子鹵簿詔刺史博覃修立而卑小後至長沙王鍾改更構及四面壇屋置守墓户五百慘淡風雲㑹洙曰古詩藹藹風雲㑹佳人一何繁劉植說李軼書曰以龍虎之姿遭風雲之時中興二十八將論曰咸能感㑹風雲奮其智勇乘時各有人力侔分社稷志屈偃經綸洙曰屯君子以經綸趙曰言劉葛之志屈而不得伸所以偃仆經綸之業也復漢留長䇿中原仗老臣洙曰復漢謂欲興劉氏也老臣孔明也蜀志建安二十五年魏文帝稱尊號改年曰黃𥘉或傳聞漢帝見害先主乃發喪制服譙周等上言曰大王襲先帝軌迹亦興於漢中又大王出自孝景皇帝中山靖王之胄宜即帝位博士計慈等上尊號為文曰惟建安二十六年四月丙午皇帝備敢用玄牡昭告皇天上帝后土神祗漢有天下曆數無疆曩者王莽篡盜光武皇帝震怒致誅社稷復存今曹操阻兵長安忍戮殺主后滔天泯夏罔顧天顯操子丕載其凶逆竊居神器群臣將士以為社稷隳廢備冝修之嗣武二祖惟神嚮祚于漢家改元章武以諸葛亮為丞相趙曰先主欲與劉氏而稱漢其所留之長䇿與後主也所留長䇿者欲取中原仗諸葛老臣耳雜耕心未巳洙曰後主建興十二年春亮悉大衆由斜谷出以流馬運據武功五丈原與司馬宣王對於渭南每患糧不繼使已志不伸是以分兵屯田為久駐之基耕者雜於渭濵居民之間百姓安堵軍無私焉歐血事酸卒鄭曰歐於口切洙曰亮與宣王相持百餘日其年八月亮疾病卒于軍年五十四魏書亮糧盡勢窮憂恚歐血一夕燒營道走入谷道發病卒漢晉春秋曰亮卒于郭氏塢臣松之以為亮在渭濵魏人躡迹勝負之形未可測量而云歐血蓋因亮自亡而自誇大也夫以孔明之略豈為仲逹歐血乎及至劉堒喪師與晉元帝箋亦云亮軍敗歐血此則引虛記以為言也其云入谷而卒緣蜀人入谷發喪故霸氣西南歇朱曰晉陽秋曰有星赤而芒角自東北南流投于亮營三投再還往大還小俄而亮卒譙周云西上有黃氣趙曰譙周等初觀進曰西氣願大王應天順民今葛亮巳死中原莫圖則霸所以歇也雄圖歷數屯錦江元過楚劒閣復通秦洙曰言拓地至秦楚趙曰錦江劒閣蜀國之土也也過楚通秦則言夲可以混一而不能焉則所以傷之也舊俗存祠廟空山立鬼神洙曰立一作泣虛簷交鳥道洙曰交一作扶趙曰此是夔州先主廟廟在山中故云交鳥道鳥道則山中之險道也舊所引乃成都先主廟事地理錯亂也枯木半龍鱗洙曰成都記諸葛亮廟亦在先主故宅城西復立素像先主廟西院即武侯廟廟前有雙大梧古峭可愛人云諸葛手植襄陽記曰亮𥘉卒所在吝求為立廟朝議以禮秩不聽百姓遂因時節私祭之於道陌上言事昔或以可聽立廟於成都者後主不從步兵校尉習隆中書郎尚充等共上表曰臣聞周人懷召伯之德甘棠為之不伐越王思范蠡之功鑄金存其像自漢興以來小善小德而圖形立廟者多矣況亮德範遐邇勳蓋季丗興王室之不壞實斯人是賴而蒸嘗止於私門廟像問而莫立使百姓巷祭戎夷野祀非所以存德念功述追在昔者也臣愚以為冝因近其墓立之沔陽使所親屬以時賜祭凡其臣故吏欲奉祠者皆限至廟所斷其私祀以崇正禮於是始從竹送清溪月蘇曰黃綏詩云姢姢釣絲竹幾送清溪月森森澗砥松風回落霜雪苔移玉座春洙曰玉座玉牀也謝玄暉銅雀臺詩玉座猶寂寞况乃妾身輕閭閻兒女換歌舞嵗時新洙曰成都記舊俗以四時祀十二月亦祈禱閭里門也閻里中門也蘇曰葛稚川再到鄉園閭井改易兒女更換唯緑水青山少不減舊耳趙曰此言夔州之人所事先主者如此舊所引成都記事誤矣絶域歸舟逺荒城繫馬頻如何對搖落洙曰宋玉搖落而變衰謝玄暉拜中軍記室辭隋王箋臯壤搖落對之惆悵𡵨路東西或以嗚唈趙曰此句已下公言其身之流落因先主廟即諸葛之功以自比而感嘆也况乃久風塵洙曰晉揔紀論悠悠風塵孰與關張並洙曰關羽張飛傳曰初劉備襲蜀丞相掾趙戩曰劉備其不齊乎拙於用兵每戰則敗奔亡不暇何以圖人蜀雖小區險固四塞獨守之國難卒用兵也徴士傳幹曰劉備寬仁有度能得人死力諸葛逹治知變正而有謀而為之相張飛關羽勇而有義皆萬人之敵而為之將此三人者皆人傑也以備之略三傑佐之何為不濟諸葛傳先主與亮情好日密關張等不恱先主解之曰孤之有孔明猶魚之有水也願諸君勿復言羽飛乃止趙曰此蓋言諸葛與關羽張飛之才器孰與並乎言不可並矣功臨耿鄧親洙曰耿弇鄧禹後漢論云寇鄧之髙勳耿賈之鴻烈修可曰公評品以為鄧禹之髙勳耿賈之鴻烈可親近矣應天才不小洙曰應一作繼蜀譙周等上言臣聞河圖洛書五經䜟緯孔子所甄驗應自逺謹按洛書甄曜度日赤三日德昌九丗㑹備合為帝際洛書寶號命曰天度帝道稱皇以統握契百成不敗洛書録運期曰九侯七傑爭命民以炊骸道路籍籍履人頭誰使主者玄且來孝經鉤命决録曰帝三建九㑹備臣父群未亡時言西南數有黃氣直上數丈見來積年時有景雲祥風從璿璣下來應之此為異瑞又二十有二年中數有氣如旗從西竟東中天而行圖書曰必有天子出其方加是年太白熒惑鎮星常從嵗星相追近漢初興五星從嵗星主義漢位在西義之上方故漢法常以嵗星候人主當有聖主起於此州以致中興時許帝尚存故群下不敢漏言頃者熒惑復追歲星見在胃昴畢昴畢為天綱經曰帝星處之衆邪消亡聖諱預覩推揆期驗符合數至若此非一臣聞聖王先天而天不違後天而奉天時故應際而生與神合契願大王應天順民得士契無鄰洙曰蜀志先主復領益州牧諸葛亮為股肱法正為謀主關羽張飛馬超為爪牙許靖麋笁簡雍為賔友及董和黃權李嚴等本璋之所授用也吳一費觀等又璋之璋之㛰親也彭羡又璋之所擯也劉巴者宿昔之所忌恨也皆處之顯任盡其器能有志之士無不競勸趙曰譙周𥘉勸進曰願大王應天順民傳曰得士者強在先主言之專指諸葛亮而巳耳遲暮堪帷幄洙曰運籌帷幄之中飄零且釣緍洙曰詩何彼穠矣其釣維何維絲伊緍向來憂國淚寂寞灑衣巾洙曰謝靈運廬陵王墓下作灑淚眺連岡蘇曰孔煒常下憂國之淚詠懷古跡五首三首見懷古門蜀主窺吳幸三峽崩年亦在永安宫洙曰劉先主以孫權襲關羽之故東征三吳為將陸議所破於秭歸步歸魚復改為永安遂卒於永安鄭曰十道志蘷州永安宫劉備作在豐溪南翠華想像空山裏洙曰空一作寒翠華車蓋想像猶髣佛趙曰翠華天子之旗也先主即皇帝位故得用翠華字也玉殿虛無野寺中洙曰山有卧龍寺先主祠在焉古廟杉松巢水鶴嵗時伏臘走村翁洙曰言民猶祭祀武侯祠屋長鄰近一體君臣祭祀同洙曰注見武侯廟注又云公自注云殿今為寺廟在宫東諸葛大名垂宇宙洙曰謂孔明之名垂於天下宗臣遺像肅清髙洙曰漢以蕭何為宗臣以功業為時所宗尚也言孔明勳烈見於後丗者亦可擬蕭何三分割據紆籌䇿洙曰三分謂魏吳蜀當時孔明多籌䇿萬古雲霄一羽毛洙曰言聲名飛揚獨步萬古趙曰以髙飛鳥喻之也伯仲之間見伊吕洙曰孔明佐蜀瑾佐吳俱受重任而孔明又受顧託趙曰言孔明在二公之間也魏文帝論傳毅之於班固伯仲之間爾指揮若定失蕭曹洙曰謂功垂成而亮薨福移漢祚難恢復洙曰大福不可再志决身殱軍務勞鄭曰殱子廉切滅也洙曰孔明在軍罰二十巳上皆親覽蜀相丞相祠堂何處尋洙曰蜀諸葛亮傳先主建安二十六年即帝位冊亮為丞相録尚書事祠堂孔明廟也錦宫城外柏森森洙曰成都記府城亦呼為錦宫城以江山明麗錯雜如錦也廟有古柏武侯手植之映階碧草自春色洙曰江文通别賦春草碧色隔葉黃鸝空好音洙曰空一作多詩泮水懷我好音王僧逹詩楊園流好音三顧頻繁天下計洙曰本傳曰時先主屯新野徐庶見先主先主器之謂先主曰諸葛孔明卧龍也將軍豈願見之乎先主曰君與俱來庶曰此人可就見不可屈致也將軍宜枉駕顧之由是先主遂詣亮凡三往乃見又亮上疏曰先主不以臣卑鄙猥自枉屈三顧於草廬之中言先主之自見亮亮為先主而仕皆為天下大計兩朝開濟老臣心洙曰先主於永安病篤召見屬以後事謂亮曰君才十倍曹丕必能安國立定大事若嗣子可輔輔之如其不才君可自取亮泣曰臣敢喝股肱之力效貞信之節繼之以死又亮表云興漢室還於舊都此臣所以報先帝而忠陛下之職分也兩朝謂先主及禪也出師未捷身先死洙曰未捷一云未用又未戰長使英雄淚滿襟洙曰閔其志不遂也本傳云十二年春亮悉大衆由斜谷出以流馬運據武功五丈原與司馬宣王對於渭南相持百餘日其年八月亮疾卒于軍軍退司馬宣王案行其營壘處所曰天下之竒才師曰亮欲合一天下未及出師一戰而死使亮未死則吳魏豈能保其土地哉諸葛廟久遊巴子國洙曰䕫古巴子國也程曰寰宇記䕫州春秋時夔子國後為楚地秦滅楚置郡即為巴郡屢入武侯祠竹日斜虛寢溪風滿薄帷君臣當共濟賢聖亦同時翊戴歸先主并吞更出師洙曰翊戴言輔翊尊戴劉氏也并吞謂出師表有并吞中國之志蟲蛇穿畫壁巫覡醉蛛絲鄭曰覡研歷切夢符曰右按前漢志民之精爽不二齊肅聰明者神或降之在男曰覡在女曰巫使制神之處位為之牲器以見廟弊巫覡醉於蛛絲中也趙曰事雖出國語在男曰覡在女曰巫而合用巫覡字則張衡東京賦巫覡操茢也歘憶吟梁父躬耕起未遲洙曰亮耕南陽作梁父吟趙曰公惑孔明梁父吟事方却思歸耕而起爾舊本作也未遲非蓋却成方欲躬耕也武侯廟洙曰成都記云諸葛公廟在先主廟故宅城西復立素像先主廟西院即武侯廟前有雙大柏古峭可愛內有裴令公所著碑柳僕射書相國段公古柏文遺廟丹青落空山草木長猶聞辭後主不復卧南陽洙曰蜀志諸葛亮傳亮父玄卒亮躬耕隴畒好為梁父吟漢晉春秋曰亮家于南陽之鄧縣在襄陽城西二十里號曰隆中徐庶謂先主曰諸葛孔明者卧龍也將軍豈見之乎先主病勑後主曰汝與丞相從事事之如父建興元年封亮武鄉侯五年率諸軍北駐漢中臨發上表辭卒於軍魏鎮西將軍鍾㑹至漢川祭亮之廟令軍士不得於亮墓所左右芻牧樵採䕫州歌一首同作十首餘見都邑門武侯祠堂不可忘洙曰祠堂一作生祠中有松柏參天長洙曰見丞相祠堂何處尋錦宫城外柏參參孔明廟前有老柏黛色參天二千尺詩趙曰夔州武侯廟有也干戈滿地客愁破雲日如火炎天涼上卿翁請修武侯廟遺像缺落時崔卿權夔州大賢為政即多聞趙曰言多有傳聞之善政也刺史真符不必分尚有西郊諸葛廟卧龍無首對江濆洙曰徐庶謂先主曰諸葛孔明卧龍也居室上古詩十一首寄題江外草堂魯曰梓州作寄成都故居泰伯曰甫從同谷入蜀卜居成都亂遂走梓州今於梓州懷思草堂遂作是詩寄題焉我生性放誕洙曰唐賀知章晚節尤誕放蘇曰嵇肅生平放誕性僻泉石焉能王公大人門下心緒卑屈難欲逃自然覺範曰自然道也釋氏謂之逃禪儒者謂之逃自然嗜酒愛風竹洙曰風一作修蘇曰吳謨嗜酒每醉愛觀風竹怡然自樂人或曰陶弘景愛聽松風王子猷愛竹先生愛風竹其清氣可相敵吳笑而不答卜居此林泉洙曰此一作必遭亂到蜀江俯曰遭亂謂祿山反卧痾遣所便洙曰沉痾病也趙曰謝靈運卧痾對空床君平曰便安靜也誅茅初一畒洙曰屈原卜居誅鋤草茅以力耕儒行儒有一畒之宫廣地方連延經營上元始斷手寶應年洙曰上元寶應皆年號趙曰公以乾元元年十二月未至成都明年即上元元年乃公建草堂之始又二年即寶應元年乃公成草堂之日也唐髙祖勑云使至知玄堂巳成不知諸作早晚得斷手凡營造了當言斷手者矣敢謀土木麗彭曰堂名以草者取其草創豈求土木之華麗乎自覺面勢堅洙曰東京賦審曲面勢周禮考工注審察方面形勢之宜臺亭隨髙下敞豁當清川洙曰陸士衡清川帶華薄雖有㑹心侣蒼舒曰古按古樂府短歌不羡一囊錢唯重心襟㑹數能同釣船干戈未偃息安得酣歌眠蛟龍無定窟黃鵠摩蒼天洙曰魏文帝修條摩蒼天古來逹士志洙曰一云賢逹士寧受外物牽顧惟魯鈍姿豈識悔吝先偶携老妻去慘淡陵風煙事迹無固必洙曰語孔子無固無必幽貞愧雙全尚念四小松趙曰秦本紀幽而不正非君子之幽也見幽人之貞蔓草易拘纒霜骨不甚長永為鄰里憐師曰以四小松為念憫其有剛姿徑節而為蔓草所戕不獲遂其主長之性故云云英乂見殺四子遇害甫託意傷之草堂洙曰草堂在成都浣花里楊子琳之亂甫去草堂亂定復歸也昔我去草堂蠻夷塞成都今我歸草堂成都適無虞請陳初亂時反覆乃須臾蘇曰曹參曰事反覆於須臾之間大將赴朝廷洙曰時崔寧入朝留其弟寬守成都楊子琳乘間來襲群小起異圖中宵斬白馬盟歃氣已粗洙曰榖梁傳齊桓衣裳之㑹十有一未嘗有㰱血之盟蘇秦說趙令㑹天下之將通質刳白馬而盟漢髙祖刑白馬盟孟子五霸桓公為盛葵丘之㑹諸侯束牲戴書而不歃血西取卬南兵洙曰子琳與卬州柏正節同叛北斷劒閣隅布衣數十人亦擁專城居洙曰楊子琳為瀘州刺史柏正節卬州刺史其勢不兩大洙曰兩大不相事始聞蕃漢殊洙曰子琳本賊帥也杜鴻漸表以為刺史西卒却倒戈洙曰子琳為寧妻任氏所敗走為王守仙所誅賊臣互相誅焉知肘腋禍自及梟鏡徒洙曰前漢郊祀志梟鳥名食母破鏡獸名食父黃帝欲絶其類使百吏柌皆用之破鏡如貙而虎眼漢五月五日作梟羹賜百官義士皆痛憤紀綱亂相踰一國實三公洙曰僖五年左氏狐裘尨茸一國三公吾誰適從萬人欲為魚趙曰左傳昭公元年劉定公歎禹之功曰微禹吾其魚乎光武紀百萬之衆可使為魚唱和作威福孰肯辨無辜眼前列杻械背後吹笙竽談笑行殺戮濺血滿長衢到今用鉞地風雨聞號呼洙曰左傳至於用鉞鬼妾與鬼馬洙曰鬼一作人趙曰巳殺其主矣則妾謂之鬼妾馬可謂之鬼馬如胸奴以亡者之妻為鬼妻色悲充爾娛國家法令在此又足驚吁賤子且奔走三年望東吳弧矢暗江海難為遊五湖不忍竟舍此洙曰特蜀亂既平甫復舍草堂也復來剃榛蕪鄭曰剃他計切除草蘇曰安謂隋文帝召為博士性便山水復來舊隱剃草徘徊而去後辭官不起入門四松在步堞萬竹踈洙曰堞一云屧鄭曰堞徒協切城上垣趙曰宋書袁粲為丹陽尹常步􅓏白楊郊野間舊犬喜我歸低徊入衣𥚑鄰舍喜我歸沽酒携胡蘆洙曰一云提榼壷大官喜我來遣騎問所須城郭喜我來賔客隘村墟天下尚未寧健兒勝腐儒洙曰黥布傳上對衆折隋為天下安用腐儒哉飄颻風塵際何地置老夫於時破鏡獸名食父黃帝欲絶其類見疣贅鄭曰疣羽求切結痛也贅之鋭切趙曰莊子云附贅掛疣此公自以傷見剩其身在天地間如之骨髓幸未枯飲啄愧殘生食薇不敢餘洙曰莊子駢拇疣贅養生澤雉又十步一啄百步一飲嵇康採薇山阿趙曰倣古詩食蕨不願餘師曰嚴武鎮成都卒於永泰元年夏間朝廷有詔崔光遠代甫年未老而不見用故云骨髓幸未枯食薇不敢餘謂其貧也薇菜之薄者柟樹為風雨所拔歎倚江柟樹草堂前故老相傳二百年洙曰故一云古誅茅卜居揔為此趙曰屈原問漁父云誅鉏草茅以力耕乎五月髣佛聞寒蟬東南飄風動地至洙曰老子曰飄風不終朝江翻石走流雲氣洙曰莊子雲氣不待族而雨蘇曰漢四年大風起東南江浪翻吼沙驚石走林木多折幹排雷雨猶力爭根斷泉源起天意滄波老樹性所愛浦上童童一靑蓋洙曰蜀先主舍東南有一樹遙望之童童若車蓋野客頻留懼雪霜行人不過聽竽籟洙曰莊子言地籟風作則萬竅怒號前者唱于而隨者唱喁冷風則小和飄則大和趙曰言其聲之鼓動如之宋玉髙唐賦云纎條悲鳴聲似竽籟舊注止引莊子地籟似之而非矣虎倒龍顚委榛棘淚痕血點垂胸臆趙曰乃卞和淚盡繼之以血也我有新詩何處吟草堂自此無顔色師曰楩柟𣏌梓天下之良材柟樹為風雨所拔喻嚴武死於蜀甫無所依故歎惜之上元二年嚴武鎮成都甫自閬州挈家往依之武歸朝廷甫浮游左蜀諸郡往來非一武再鎮兩川奏為節度參謀檢校工部貟外郎氷泰元年夏武卒郭英乂代之甫失所依乃泛江移䕫州大曆三年春下峽至荊南詳味此詩殆為嚴武而發歎焉甫築草堂於成都浣花里甫為得此樹以為遊息木仁類以覆庇其下甫賴武以庇焉今也如虎倒龍顚是使草堂之人憔悴而無所棲託故云草堂自此無顔色茅屋為秋風所破歌蘇曰古之封謝侯分之以茅土所謂茅屋者制節之方州也風號令也所以鼓舞万民和四方之義也天寶十四載祿山起漁陽之師詭言奉詔誅楊國忠是謂義兵號令天下陷河北郡縣是謂茅屋破也八月秋髙風怒號修可曰莊子大塊噫氣其名為風唯是無作作則萬竅怒號也卷我屋上三重茅蘇曰八月隂中也隂以肅殺為事秋髙風怒號者秋於五性為義天寶十四載十一月九日范陽節度使安祿山率藩漢兵十餘万自幽州南向指闕詭言起義以誅楊國忠為名其怒號之甚也卷我屋上三重茅者是時方陷三郡謂先殺太原尹楊光􅔘於博陵郡十二月六日陷陳留郡殺張介然九日陷滎陽郡殺太守崔無詖故云卷三重茅也茅飛度江灑江郊洙曰灑一作滿髙者挂罥長林梢鄭曰罥古犬切下者飄轉沉塘拗鄭曰拗於郊切地竄也蘇曰分茅之臣悉皆奔逃濵於患難之側而不顧者若范陽副使封常清三與戰皆不勝西奔陜髙仙芝鎮陜弃城西保潼閞故曰灑江郊也髙者以義為髙也林君也肅宗即位靈武玄宗在蜀長林也髙義之臣扈從左右如韋見素陳玄禮故曰挂罥長林梢也塘拗泥塗也下者卑汚喪節處於泥塗是時河北二十四郡俱為所陷如譙守陽万石令狐潮楊希文劉貴哲皆附賊其後潮亦說張巡曰蓋相從以苟冨貴可謂飄轉而不能自守也南村群童欺我老無力忍能對面為盜賊公然抱茅入竹去脣燋口燥呼不得蘇曰南明也村鄙也童無知也明明鄙野無知之輩以我國家師老而莫能為之敵所以盜吾土疆賊吾善良故令狐潮說張巡曰本朝危蹙兵不能出關天下事去矣豈非欺我老無力也平原太守顔真卿以食尽援絶弃郡渡河於是河北郡縣尽陷賊豈非對面為盜賊也竹制節也公然抱茅入竹者祿山反顔杲卿袁履謙緋袍令與假子守土門所謂抱茅制節者也杲卿謂祿山曰汝營州牧羊羯奴竊荷恩寵天子負汝何事而乃反乎祿山怒縛之節解而罵不絶賊鉤斷其舌杲卿含胡而絶不獨夫是張巡保睢陽使南霽雲詣賀蘭進明告急賀蘭無意出援兵且張樂以大饗霽雲言城中食尽力屈賀蘭不聽遂截指示信竟不食而去豈非呼不得也趙曰韓詩外傳曰乾喉焦脣仰天而嘆曹子建善哉行曰日來丈難口燥唇乾蓋公參用之也歸來倚杖自歎息俄頃風定雲墨色蘇曰甫嘗與韋宙同陷賊遁㱕行在所此所以欷戲嘆息也方是時張巡許逺搗其腹心而賊勢遂衰四方掎角而祿山詭言之號令無所施猶風之定也雲墨色者雲喻禮樂法度墨色不明也天子蒙塵而幸忠臣繼踵而陷賊禮義法度無自而明秋天漠漠向昏黑布衾多年冷似鐡嬌兒惡卧踏裏烈蘇曰秋義也望天子以義理天下今也宦豎蔽其明女謁侈其心漠漠而無所察治向昏者重老之晚年也墨不明也明皇晚年髙力士導其欲太真妃迷其情豈非向昏而黑也布者女工之本儉之所尚也衾者所以衣𬒳也以布為衾蓋以恭儉而衣𬒳天下且置之而不用所以冷而似鐵鐵黑金也而以斬殺為事斬殺則少恩明皇末年非惟不知崇儉以衣被天下又且少思以徇太真妃之欲也嬌兒太真妃也卧安寢也太真妃搖其安謂嘗以祿山為養子出入宫掖不禁穢醜稔聞而明皇不悟祿山出范陽與真妃為內外援且令進竒禽異物以蠱帝心宰相太子多言其反太真妃力保之故帝不信及漁陽難作且約太真妃為之內應朝廷機謀祿山靡所不知豈非踏裏裂也床床屋漏無乾處雨腳如麻未斷絶蘇曰床人所即以為安也床床四方之所安居者屋漏無乾處者謂今皆陷於泥塗是時滄趙見拔博平虜陷潼關失守南破宛洛張介然崔無詖死其城郭李憕盧奕蔣青死其官所謂如麻未斷絶者蓋天下浸淫於塗泥未有巳也揚雄嘗曰震風凌雨然後知厦屋之為帡幪故甫以雨腳未斷言亂之滋也自經喪亂少睡眠長夜沾濕何由徹蘇曰祿山父子僣竊於三年之間四方搔然不遑安枕豈非少睡眠也蜀道尚艱難靈武未還內故謂之沾濕何由徹也安得廣厦千萬間趙曰白樂天詩我願布衾千万丈與君同蓋洛陽城然近乎戲語豈有万丈之衾乎若公言千万間之廣厦二公之言自有深旨大庇天下寒士俱歡顔風雨不動安如山蘇曰亂而願治憂而思樂忠臣義士之常心甫於是時官卑位下身親罹之力無所施不免傷今思古而欲得庇覆天下之蒼生謂其歡然懷歸尚未忍弃去義祖太宗之遺烈故欲覆安之使無震風凌雨之虞故曰不動安如山也嗚呼何時眼前突兀見此屋吾廬獨破受凍死亦足蘇曰嗟歎之不足故永歌之甫遇亂而願治其所以嗟歎永歌者蓋寫其憂憤之心冀欲有興衰撥亂之主而庚濟王室以成巍巍突兀之功謂之何時者所望之誠至也吾廬獨破受凍死亦足者祿山之亂天子入蜀甫走鳯翔謁肅宗授拾遺與房琯少為布衣交至德元年七月二十一日琯敗於陳陶斜罷相甫上疏言琯罪細不宜免肅宗怒詔吏推問後意解出為華州司功曹然不甚省録時寇奪甫家鄜弥年孺弱至餓死繼而弃官去客秦州負薪採橡栗自給故其斷章所以言死亦足也左傳楚申叔展問還無社曰有麥麴乎有山芎藭乎注二物可以禦濕欲使無社逃泥水中時子美方為嚴武所不容詩之作其近於此乎趙曰按舊注引楚申叔展之明嚴武所不容然所引事迹與意大不相同十二詩皆上元二年之作嚴武鎮蜀𥘉則廣德元年公在梓州再則廣德二年公在幕中故詩定為上元元年之秋也假使舊注不引左氏又不誤指嚴武直論詩意豈有府尹不相容者也師曰秋者肅殺之氣兵革之象也王者之封諸侯各本五方之土色而苴以茅賜之茅屋所以覆庇人所依託焉既為秋風所破則無以自庇甫以嚴武鎮成都遂往依之不幸武卒郭英乂代武為節度甫由是見知英乂託以為芘焉兼與楊子琳柏正節二刺史相善崔旰殺英乂併攻楊子琳柏正節是卷三重茅之比也茅飛度江灑江郊謂子琳正節蒼皇竄避也髙者罥挂長林柏謂在位賢者逃于林野下者飄轉沉塘拗地不平曰拗喻下民墜於塗炭之苦童無知之稱南村羣童以譬崔旰之徒欺我老無力喻代宗師老崔旰輩無忌憚焉而恣為殘暴左傳云師直為壯曲為老公然抱茅入竹去謂竊據其茅土也脣燋口燥呼不得時代宗號令不行召諸道之兵無有應者是以避吐蕃之亂跳而幸陜今崔旰叛雖遣使諄喻豈能止其侵暴甫依託三子以為覆芘如茅屋然今三子為旰所攻是失所棲託是以倚杖有所嘆息時朝廷遣杜鴻漸討平蜀亂故旰兵稍定是以有俄頃風定之喻也然旰雖定蜀中乘隙而叛者不一如渝州開州並殺刺史之類殺氣猶盛是以有雲墨色之喻也昔楚王投醪於水以飲士卒三軍之士皆如挾纊為上者不可不恤其下布衾多年冷似鐵謂寡恩而士不和也英乂為政刻薄無溫燠之惠如布衾然嬌兒比崔旰旰乘士卒怨背舉兵以反而蜀中大亂豈非惡卧踏裏裂之譬乎床床屋漏無乾處非特甫無所芘蜀民皆失所依故也雨腳如麻未斷絶謂反者繼而起甫詩云前年渝州殺刺史今年開州殺刺史是也自經喪亂少睡眠長夜沾濕何由徹傷兵亂以來不獲安居也王者以天下為家如廣厦之大芘使天下之民咸得其寧雖有風雨其能飄搖震蕩乎甫意非獨傷己為天下歎息故有末章云水檻蒼江多風飈雲雨晝夜飛茅軒駕巨浪洙日郭景純吞舟浮海底髙浪趙曰此言志在江海豈局促於淸溪上傍柴門而遊為事乎蒼惶避亂兵洙曰言避蜀亂也緬懷邈舊丘洙曰又云𬗟邈懷舊丘舊丘故里也言避亂而逹故里也鄰人亦巳非野竹獨修修船舷不重扣鄭曰舷胡田切洙曰江賦詠採菱以扣舷趙曰晉夏中御以足扣舷歌吳曲埋沒巳經秋仰看西飛翼下愧東逝流故者或可掘新者亦易求所悲數奔竄鄭曰數色角切白屋難久留蘇曰賈復見耿弇曰子非久留白屋之士風雲㑹合子當平步天衢尓後果如其言趙曰白屋貧者之居也公自悲於奔竄不得久寧居於白屋爾師曰亂兵謂崔旰之亂甫往梓州舊丘故林也指草堂鄰人亦巳非謂流離也甫去成都凡三載向者所泛扁舟埋沒於泥沙故船舷不堪重扣舷船旁也扣之以節歌甫有東川未及西㱕故云仰看西飛翼下愧東逝流故者或可掘謂破船也營屋我有隂江竹師曰甫植万竹於草堂嘗有詩云入門四松在步堞万竹踈即此所謂我有隂江竹是也能令朱夏寒夢符曰右按梁元帝纂要曰夏曰朱夏亦曰長嬴炎夏三夏九夏又爾稚夏為朱明隂通積水內髙入浮雲端趙曰枚乘詩曰美人在雲端甚疑鬼物慿蘇曰王肅行太白見山林秀茂曰疑有神物所慿不顧翦伐殘東偏若面勢師曰謂植竹以䕃東射之日隨其所向之勢户牖可永安愛惜巳六載兹晨去千竿蕭蕭見白日洶洶開奔湍度堂匪華麗養拙異考槃趙曰詩考槃在阿考槃在澗考成子槃樂也今公言養拙而巳非若碩人之在澗在阿而後成其樂也草茅雖剃葺衰疾方少寬趙曰除草曰剃言雖有剃葺之勞而吾之衰病可寬也洗然順所適此足代加餐寂無斤斧饗師曰甫築草堂茅茨不翦椽柱不斫削蓋順其所適也故曰寂無斥斧響庶遂憩息歡洙曰甘棠勿翦勿伐考工記審曲面勢詩考槃在澗古詩上言加餐飯周禮剃氏趙曰甘棠勿翦勿敗召伯所憩注憩息也柴門泛舟登瀼西洙曰楚俗以山谷間水可涉者為瀼其涉也謂之踏瀼素俗以堰水為瀼皆謂之瀼鄭曰本作漾字如亮切水名在隴西趙曰䕫州惟有東瀼溪見水經注瀼東瀼西則水兩旁之名今云登瀼西則舟巳泊而登其岸也舊注有蹈瀼之說非也回首望兩崖革曰兩崖峽也東城乾旱天其氣如焚柴蘇曰甘士安其熱氣過如焚柴飛鳥為之不飛趙曰此燔柴也爾雅云祭天曰燔柴積薪而焚之也長影沒窈窕餘光散唅呀趙曰唅音憾哺也呀音虛加反張口也而公所用無乃唅呀乎蓋唅呀注云谷中也大江蟠㠌根鄭曰嵌口銜切歸海成一家洙曰禹貢九州之水皆入于海趙曰嵌嵓之根也出莊子賢者伏於太山嵌嵓之下公所言雖蟠曲於嵌嵓而終於流出以歸于海也下衝割坤軸洙曰海賦又似地軸挺扶而爭回竦壁攢鏌鋷鄭曰鏌靡各切鎁以蛇切趙曰巫峽之竦蓋如鏌鎁之劒矣蕭瑟灑秋色氣昏霾日車洙曰氣一作氛日車見前注峓門自此始洙曰䕫州為峽門也鄭曰峓以脂切䕫州名最窄容浮查禹功翊造化疏鑿就欹斜洙曰江賦三峽之東夏后疏鑿趙曰江賦巴東之峽夏后疏鑿舊注改為三峽之東誤矣巨渠決太古蘇曰巫峽記巨渠開石決太古之積水衆水為長蛇趙曰比水為長蛇亦新矣蘇曰赴壑如長地蓋本於此矣風煙渺吳蜀舟楫通鹽麻洙曰鹽麻見前注我今遠遊子飄轉混泥沙趙曰江賦或混淪乎泥沙萬物附本性約身不願奢趙曰孟子不願人之文繡茅棟蓋一床趙曰沈休文詩茅棟嘯蹲鴟淸池有餘花濁醪與脫粟洙曰濁醪嵇康脫粟公孫弘在眼無咨嗟山荒人民少地僻日夕佳洙曰陶淵明山氣日夕佳貧病固其常洙曰病一作賤冨貴任生涯老於干戈際宅幸蓬蓽遮石亂上雲氣杉淸延月華賞妍又分外理愜夫何誇洙曰漢書理得則不怨革曰愜欣也足了垂白年趙曰畢卓柏浮酒船中使足了一生後漢班超妹書今超年巳垂白矣敢居髙士差師曰差輩也敢以髙士為伍書此豁平昔回首猶暮霞客居趙曰此雲安詩客居所居堂前江後山根下塹萬尋岸鄭曰塹此艷切蒼濤鬱飛翻葱靑衆木梢洙曰沈休文林薄香葱靑趙曰借用王粲四言詩苟非鴻鵰孰能飛翻邪竪雜石痕趙曰沈休文詩傾壁復邪竪子規晝夜啼壯士斂精魂趙曰阮藉詠懷容色改平常精魂自漂淪峽開四千里趙曰千字疑誤豈自渝州明月峽至䕫州西陵峽而下水路有四千里乎水合數百源人虎相半居相傷終兩存蜀麻久不來吳鹽擁荆門洙曰蜀人以麻布貿易吳鹽也趙曰以商旅貿易吳鹽不行之故也西南失大將鮑曰謂鄭公卒也商旅自星奔洙曰時崔寧殺郭英乂也修可曰劉孝標廣絶交論靡不望影皇奔今又降元戎鄭曰降古巷切巳聞動行軒洙曰時除杜鴻漸為成都尹舟子候利涉亦慿節制尊我在路中央生理不得論洙曰甫依嚴武武死英乂粗暴不能容旋有崔寧之亂此甫所以進退不能也趙曰公言其欲南下以歸長安到處留帶而未能今尚在半路也舊注云甫欲依嚴武武死英乂不能容大非是卧愁病腳廢徐步視小園短畦帶碧草悵望思王孫洙曰思嚴武也修可曰楚辝劉安招隱辝曰王孫遊兮不歸春草生兮萋萋鳯隨其皇去鮑曰豈鄭公之夫人亦繼亡也籬雀暮喧繁洙曰言賢者亡而小人喧競也時崔寧楊子琳柏正節更來成都蘇曰王符隱居不仕自歎曰鵉鳯思見而不可得籬雀終日喧人耳目何其繁也又云工部此語寓意非淺覽物想故國蘇曰王仲宣周覽春物𬗟想故國花草十年别荒村日暮歸幾翼北林空自昏趙曰上句以譬能歸者幾人下句以譬故居所在徒自昏暗而無有歸栖之翼也安得覆八溟為君洗乾坤洙曰時厭亂久矣故甫前有洗兵行此有洗乾坤之說也稷契易為力洙曰言得其人則天下不足治犬戎何足吞趙曰公又嘗曰遙拱北辰纒寇盜欲傾東海洗乾坤又曰安得壯士挽天河盡洗甲兵長不用此意欲然者但得稷契而用之易為力耳彼吐蕃犬戎何足吞乎儒生老無成蘇曰孔安國云儒士懦弱到老無成立矣臣子憂四畨篋中有舊筆情至時復援洙曰詩所謂以寫我憂也客堂憶昨離少城洙曰成都之內城謂之少城趙曰指言成都也蜀都賦云亞以少城接乎其西注云少城小城也在大城西而今異楚蜀捨舟復深山趙曰謝靈運詩捨舟眺回渚窅窕一林麓蘇曰龎統愛山至牛條嘆曰欲得此窅窕林麓採薪種藥足以投老後隱中山果召不起號曰太平逸民隋文詔嘉之栖泊雲安縣洙曰雲安屬䕫州趙曰栖泊字謝靈運謂維舟而止宿也消中內相毒舊疾甘戴來衰年得無足死為殊方鬼洙曰李陵書云沒為異域之鬼頭白免短促洙曰不為夭也老馬終望雲南鴈意在北洙曰馬望雲鴈意在北以所居非故國此自喻也趙曰蓋懷鄉之譬也此乃倣胡馬嘶北風越鳥巢南枝之意别家長兒女欲起慙筋力趙曰禮曰老者不以筋力為禮客堂叙節改具物對羈束石暄蕨牙紫洙曰謝靈運山桃發紅蕚野蕨漸紫苞渚秀蘆笋緑洙曰籚竹笋也楚人謂之荻芽巴鶯紛未稀洙曰鶯一作稼趙曰舊本作巴鶯非是當作稼劉章云深耕鋤種立苗欲疏公言紛末稀則苗猶多爾徼麥早向熟悠悠日動江漠漠春辭木洙曰日華川上動謝玄暉生煙紛漠漠臺郎選才俊趙曰謂省郎也公時為尚書工部貟外郎故稱臺郎舊注非是自顧亦巳極洙曰甫先授右拾遺前輩聲名人蘇曰張融前輩聲名映照今古埋沒何所得居然綰章紱趙曰謂緋魚也受性本幽獨平生憩息地必種數竿竹洙曰王子猷所居必種竹自云不可一日無此君事業只濁醪洙曰恨賦濁醪夕飲修可曰李善注恨賦濁醪夕飲之下引嵇康與山巨源書曰濁醪一杯彈琴一曲營葺但草屋上公有記者纍奏資薄祿洙曰嚴武奏甫受劒南參謀主憂豈濟時身遠彌曠職洙曰曠職於職事無所親也循文廟算正洙曰循文守文也廟廟堂也算籌算也獻可天衢直洙曰左傳獻可替否易何天之衢尚想趨朝廷毫髮禆社稷形骸今若是進退委行色洙曰傷不得行其志爾遣興蓬生非無根漂蕩隨髙風天寒落萬里不復歸本叢客子念故宅三年門巷空洙曰曹子建轉蓬離本根飄颻隨長風何意回颷舉吹我入雲中髙髙上無極天路安可窮類此遊客子捐軀遠從戎魏文帝客子常畏人王僧逺仲秋邊風起孤蓬卷霜根白日無精景黃沙千里昏悵望但烽火洙曰胸奴傳烽火通甘泉宫戎車滿關東洙曰詩戎車既届生涯能幾何常在羈旅中分門集注杜工部詩卷第六
