body:
  text: 上韋左相二十韻彥輔曰按韋見素傳見素嘗為左丞相子倜鄂位至給事中孫顗為尚書左丞也鮑曰韋見素襲父爵彭城郡公十三載拜武部尚書從帝入蜀詔兼左相鳯曆軒轅紀洙曰昭十七年傳郯子來朝公與之宴昭子問焉曰少皡氏鳥名官何也郯子曰吾祖也我髙祖少皡摯之立也鳯鳥適至故紀於鳥為鳥師而鳥名鳯鳥氏曆正也注鳯鳥知天時故以名曆正之官史記曰黃帝名軒轅龍飛四十春洙曰自玄宗即位至天寶十一載四十年十三載見素為武部尚書同中書門下平章事龍飛玄宗即位也沈存中曰文章自應律度未嘗以音韻為主詩第二字側入謂之正格如子美此二句皆二字平入謂之偏格如唐名輩詩多用正格子美詩用偏格者十無二三八荒開壽域洙曰荒大也八方也歐民庶於仁壽之域昱曰列子仲尼篇逺在八荒之外前漢王吉疏願陛下與大臣述舊禮明王制歐一丗之民躋之仁壽之域一氣轉洪鈞洙曰張茂先答何劭詩洪鈞陶萬類霖雨思賢佐洙曰髙宗命傅説曰若歲大旱用汝作霖雨丹青憶老臣洙曰趙充國傳充國以功德與霍光等列畫未央宫成帝時西羌嘗有警上思將帥之臣追美充國乃召揚雄即充國圖像而頌之後漢胡廣傳靈帝思感舊臣乃圖畫廣及太尉黃瓊於省內詔議郎蔡雍為其頌云孝祥曰韋相公之先人遺風餘烈至今稱之故云丹青憶老臣應圖求駿馬洙曰梅福傳欲以三代之法取當丗之士猶以伯樂之圗求騏驥於市而不可得亦巳明矣馬援好騎善别名馬於交趾得駱越銅鼓乃鑄為馬式還上之馬髙三尺五寸有詔置於宣德殿下以為名馬式焉趙曰此言見素以材見用也魏曹植獻文帝馬表曰臣於先帝丗得天宛紫騂一匹形法應圖舊注引梅福傳非干此也驚代得騏驎洙曰張揖注相如賦雄曰騏雌曰驎其狀麋身牛尾狼蹄一角沙汰江河濁鄭曰汰他蓋切洙曰言為吏部日也北史新雄為尚書郎會沙汰郎官雄與羊琛等八人俱見留調和鼎鼐新鄭曰鼐曩宰切洙曰言為相也説命若作和羹用汝為鹽梅釋器云鼎絶大者謂之曰鼐韋賢初相漢洙曰韋賢字長孺授昭帝詩宣帝本始三年代蔡義為丞相范叔巳歸秦洙曰史記范雎字叔更名姓曰張祿王稽載入秦昭王大説拜雎為客卿封應侯相秦盛業今如此傳經固絶倫洙曰韋賢兼通禮尚書少子玄成復以明經仕至丞相故鄒魯諺曰遺子黃金滿籝不如一經豫樟深出地滄海闊無津洙曰豫樟木良材也滄海百谷之所歸其淵不可津涯北斗司喉舌洙曰李固傳陛下之有尚書猶天之有北斗也北斗為天之喉舌尚書亦為陛下喉舌斗斟酌元氣運于四時尚書出納王命東方領搢紳鄭曰搢即刃切洙曰郊祀志搢紳者弗道李竒曰搢紳插笏於紳紳大帶也臣瓚曰縉赤白也紳大帶也左氏傳有縉雲氏師古曰李云搢紳是也字本作搢插笏於大帶之間與革之間耳非插於大帶也或作薦紳者亦謂薦笏於紳帶之間其義同相如曰搢紳先生之徒也持衡留藻鑒聽履上星辰洙曰公時兼兵部尚書故云聽履上星辰鄭崇哀帝時為尚書僕射數求見諌爭上納用之每見曵革履上笑曰我識鄭尚書履聲趙曰見素為吏部侍郎平判皆誦於口銓選平允人多德之上星辰以言其親帝之旁猶言上雲霄矣獨步才超古昱曰魏志王􅙾字仲宣山陽髙平人曹植與楊修書曰今丗作者可略而言若仲宣獨步於漢南彥輔曰任昉曰勳遂超古餘波德照鄰洙曰一云餘隂照北鄰余曰左傳僖公三十三年波及晉國君之餘也逸曰語德不孤必有鄰聰明過管輅鄭曰輅魯故切洙曰魏志方伎傳管輅字公明喜仰視星辰常云家雞野鵠猶尚知時況於人乎琅瑘太守單子春語衆人曰此年少盛有才器聽其言論近似司馬天子遊獵之賦何其磊落雄壯英神巳茂必能明天文地理變化之數不徒有其言也於是發聲徐州號之神童尺牘倒陳遵洙曰前漢遊俠傳遵字孟公略涉傳記瞻於文辭惟善書與人尺牘主皆藏去以為榮倒猶傾服也豈是池中物洙曰吳志周瑜傳晉書劉元海傳並云蛟龍得雲雨非復池中物由來席上珍無巳曰禮儒行儒有席上之珍以待聘廟堂知至理風俗盡還淳魯曰此言宰相之能事畢矣才傑俱登用愚蒙但隱淪趙曰公自謂也長卿多病久鄭曰長展兩切洙曰司馬相如字長鄉嘗有消渴病與卓氏婚饒於財故其事宦未嘗肯與公卿國家之事常稱疾間居不慕官爵子夏索居貧鄭曰索昔各反趙曰公以二人自比也司馬相如常有消渴病子夏離群索居索居蕭索也回首驅流俗余曰孟子曰同乎流俗生涯似衆人余曰莊子養生主篇其生也有涯巫咸不可問洙曰列子有神巫自齊來命曰季咸知人生死存亡禍福壽夭期以歲月卒為壷丘子所困鄒魯莫容身洙曰莊子盜跖篇孔子再逐於魯削迹於衛窮於齊圍於陳蔡不容身於天下者豈足貴耶感激時將晚蒼茫興有神鄭曰興許應切趙曰蒼茫荒寂之貌公處荒寂之間而興有神則感激所致不覺如神也為公歌此曲涕淚在衣巾師曰曆所以推日月星辰之數鳯知天時故軒轅以名曆官所謂鳥官者如此之類易飛龍在天大人造也龍以喻君考之鳯曆玄宗即位至天寶十一載巳經四十年見素時為尚書同門下平章載調和一元之氣運轉洪鈞以陶成萬物遂使八方荒逺之民咸躋于仁壽之域霖兩思賢佐丹靑憶老臣謂見素之父湊遺風餘烈至今人思之故有是句應圖求駿馬謂像父而求其子果得見素之賢也沙汰江河濁言公為相得以進退百官奬清廉而去貪濁也昔韋賢父子皆以經術相繼為漢相今見素父子亦然故下文又云傳經固絶倫范叔遭困厄變名姓曰張祿來歸秦秦相之湊𥘉仕隋後歸唐故云范叔巳歸秦豫樟深出地滄海闊無津言見素本盛族根本淵源之髙大也見素從玄宗入蜀兼左相天寶中為兵部尚書故云北斗司喉舌聽履上星辰天寶五載為吏部侍郎銓序平允故云持衡留藻鑒天寶十五載是年八月肅宗立改元至德十月丙申有星犯昴見素言於肅宗曰昴者胡也祿山將死帝曰日月可知乎見素曰福應在德禍應在刑昴金忌火行當火位昴之昏乃其時也及祿山死日月皆不差管輅善天文地理今見素所言如此故曰聰明至管輅東方朔為縉紳領袖或云康王之誥太保率西方諸侯入應門左畢公率東方諸侯入應門右時公為相率百官故云領縉紳愚蒙但隱淪甫自謂病肺不堪求仕但隱居淪晦而已非若公之才傑登用于廟堂能使風俗追還淳古之治驅流俗言與流俗驅馳不能擺脫俗纍生涯似衆人言貧與編户等也巫咸善知人貴賤壽夭甫雖貧賤多病猶能安於分命莫肯扣問斯人而有覬覦之心也甫自言東西南北人故有比於夫子之不容于丗也時將晚傷衰老也蒼茫曠逺貌言興之超逸贈韋左丞文濟鮑曰唐韋濟嗣立子天寶中為尚書左丞左轄頻虛位洙曰晉天文志轄星傅軫兩旁主王侯左轄為王者同姓右轄為異姓詩節南山尹氏太師維周之氐義云氐作挃轄之挃言尹氏作太師之官為周之挃轄也修可曰按唐史典云左右丞掌管轄省事糾舉憲章又舊唐史劉洎上疏曰尚書萬機實為政本是以二丞方於管轄八座比於文昌故左丞為左轄今年得舊儒趙曰皆以紀韋丈也魏晉以來左丞得彈奏八座故傅咸云斯乃皇朝之司直天臺之管轄後人用左轄義起於此舊注引晉天文志以為星名非是相門韋氏在經術漢臣須洙曰漢韋賢及子玄成父子皆以經術為相時議歸前列天倫恨莫俱洙曰天倫兄弟也穀梁兄弟天倫也趙曰指濟兄弟是前輩為時議所歸鴒原荒宿草洙曰棠棣脊鴒在原兄弟急難注脊鴒雍渠也飛則鳴行則搖不能自舍耳箋云雍渠水鳥而今在原失其常處則鳴求其類天性也猶兄弟之於急難檀弓曽子曰朋友之墓有宿草而不哭注宿草謂陳根也趙曰惜其一亡至於宿草巳荒鳳沼接亨衢洙曰晉荀朂守尚書令勗久在中書專管機事及失之甚罔然悵恨或有賀之者曰奪我鳯凰池諸君賀我耶趙曰濟由左丞可以接鳯池亨衢又美其為中書之貴師曰此句言纍丗為尚書也有客雖安命洙曰莊子無可奈何而安之若命也趙曰公自言也衰容豈壯夫洙曰謂以窮逹而肥癯非壯夫也趙曰此足以慰榛蕪家人憂几杖洙曰几老者所慿杖老者所扶持也家人憂其老也故借言几杖禮大夫致仕則必賜之几杖甲子混泥途洙曰襄三十年傳晉悼夫人食輿人之城𣏌者絳縣人或年長矣無子而往與於食有與疑年使之年曰臣小人也不知紀年臣生之歲正月甲子朔四百有四十五甲子矣其季於今三之一也吏走問諸朝趙孟召之而謝過焉曰武不才任君之大事以晉國之多虞不能用吾子使吾子辱在泥途久矣乃武之罪也敢謝不才遂仕之不謂矜餘力還來謁大巫洙曰吳志張紘傳陳琳答紘書曰小巫見於大巫神氣盡矣歲寒仍顧遇洙曰以顧遇之禮不改故云歲寒論語歲寒然後知松柏之後凋也日暮且踟蹰洙曰日暮謂暮齒也漢書日暮途逺老驥思千里洙曰魏武樂府云老驥伏攊志在千里飢鷹待一呼洙曰魏志陳登謂吕布曰曹公言待將軍譬如養鷹然飢則為用飽則揚去蘇曰楚人云飢如鷹待此一呼事見吕氏春秋君能微感激亦足慰榛蕪洙曰明本一云折骨效區區趙曰此又不能無所求也師曰有客甫自謂吳志張紘見楠榴枕愛其文為作賦陳琳見之以示人曰此吾卿張子綱所作也後紘見琳作武庫賦應機論與琳書深歎善之琳答曰自僕在河北與天下隔此間率少於文章易為雄伯故使僕受此過差之談非其實也今景興在此足下與子布在彼所謂小巫見大巫神氣盡矣大巫以比韋濟踟蹰言眷慕於韋不忍去也老驥飢鷹皆甫自喻甫於前詩云猥誦佳句新是韋知甫者也故此詩有意於韋之薦拔故末章云君能微感激亦足慰榛蕪遣悶奉呈嚴公二十韻蘇曰嚴武在蜀對客多騁筆札甫醉曰不謂嚴挺之有此兒武怒甫徐曰我乃杜審言孫擬捋虎鬚尓合坐大笑彌縫之武曰與公等言何至上及祖考乎深銜之甫歸草堂遂有遣悶詩白水魚竿客淸秋鶴髮翁洙曰鮐背鶴髮言老也趙曰鶴髮老者之相庾信作賦子老矣鶴髮雞皮蓬頭歷齒胡為來幕下秪合在舟中洙曰言躰性踈散止可與漁樵為偶不當為幕客也黃卷真如律趙曰自不是黃卷聖賢之義意其以黃紙所寫之法令合如何之內故云真如律大臨曰言詩書以禮法繩人靑𫀆也自公洙曰詩自公退食大臨曰言不卑小官也老妻憂坐痺鄭曰卑利切幼女問頭風平地專欹倒分曹失異同趙曰言其散秩在府中所坐之曹不專其事而分之不知為異為同也禮甘衰力就義忝上官通洙曰謂能容之於散秩也趙曰公得預府幕忝關通於上官矣上官指嚴武也疇昔論詩早洙曰公與嚴公先以文才相知趙曰與嚴論詩巳在早年矣光輝仗鉞雄洙曰仗鉞言嚴公作鎮也寬容存性拙洙曰公嘗斥嚴公父名公不以為忤翦拂念途窮洙曰謂嚴公奏請為軍簽謀也劉孝標絶交論顧盻增其倍價翦拂使其長鳴露裛思藤架洙曰詩厭浥行露煙霏想桂叢洙曰言身雖在幕中而嘗有山林之志信然龜觸網洙曰龜策傳預且觸網云蘇曰王翻行止如龜網雖不遭羅其駭恐亦可知也直作鳥窺籠洙曰秋興賦池魚籠鳥而有江湖山藪之思趙曰上兩句則身雖在幕府而有山林之念故如龜之在網鳥之在籠也下八句有懷草堂之意西嶺紆村北師曰自此句以下乃子美述草堂之興恐其荒蕪而有歸休之意故末章云會希全物色時放倚梧桐物色言形躰衰老兾保其天年遂其真性倚梧桐以自樂也南江繞舍東竹皮寒舊翠椒實雨新紅浪簸船應拆杯乾甕即空蘇曰蘇定戲友人曰薪盡火滅杯乾甕空藩籬生野徑斤斧任樵童洙曰自西嶺至此皆志在草堂束縛酬知己蹉跎效小忠洙曰言性雖踈散當束縛以酬知巳年雖蹉跎不足以負任責亦當效小忠也周防期稍稍太簡遂匆匆曉入朱扉啓昏歸畫角終不成尋别業大觀曰別業指草堂也未敢息微躬烏鵲愁銀漢洙曰為填河也炎曰烏鵲填河以渡牛女甫意謂雖參幕府無以輔濟故曰愁銀漢駑駘怕錦幪洙曰非其飾也會希全物色時放倚梧桐趙曰言如烏鵲之微力不任於填河駑駘之蹇不足以𬒳錦幪之飾則所望於故人知己者幸全其物色而放令倚於梧桐也奉贈鮮于京兆二十韻鮑曰鮮于仲通也紀十年書劒南節度使鮮于仲通及雲蠻戰于西洱河敗績不見其為京兆豈先為京兆耶豈以節度為京兆耶唐開元以來在位無鮮于姓者詩有鮮于萬州乃其子也鄭曰鮮于相然切漢復姓也王國稱多士洙曰文王詩思皇多士生此王國賢良復幾人趙曰王者之國號稱多士矣而賢良無幾也異才應間出洙曰異才茂異也間出間生也猶間丗而生也爽氣必殊倫洙曰氣宇淸爽有殊於衆人也趙曰以言鮮于京兆也始見張京兆宜居漢近臣洙曰張敞傳潁川太守黃霸始以治行第一入為京兆尹不稱罷於是膠東相敞守京兆尹其治京兆略循趙廣漢之迹為久任職漢制出為二千石有治狀者入為公卿故曰近臣驊騮開道路蘇曰淮隂侯韓信語蒯通曰觀子與諸郎談論辨析是非落落可聽如駑駘駕車使驊騮開路非容易追逐也使人心服可喜可喜見國語别集雕鶚離風塵鄭曰離力智切去也洙曰猶駿異得路者然也趙曰驊騮雕鶚言其俊也侯伯知何算洙曰算一作等文章實致身趙曰此言侯伯之人多矣至於無算而鮮于之致身則實以文章也奮飛超等級容易失沉淪趙曰惟其奮飛而晉擢徑超邁於官之等級故其離去沉淪也易而不難如此脫略蟠溪釣洙曰吕望釣於蟠溪操持郢匠斤洙曰莊子郢人堊漫其鼻端若蠅翼使匠人斫之匠石運斤成風聽而斫之盡堊而鼻不傷郢人立不失容雲霄今巳逼台衮更誰親趙曰上公應天上三台衮則衮服三公一命衮故得稱衮也鳳穴雛皆好洙曰此言鮮于諸子也山海經丹穴之山有名鳯陸雲幼時閔鴻見而竒之曰此兒若非龍駒是鳳雛龍門客又新洙曰後漢李膺傳膺牲簡亢無所交接唯以同郡荀淑陳實為師友𬒳容接者名曰登龍門也義聲紛感激洙曰劉越石詩鄧生何感激敗績自逡巡洙曰莊十一年傳凡敵大崩曰敗績注師徒撓敗若沮岸崩山喪其功績故曰敗績逡巡言退貌趙曰皆公自謂也言鮮于之義聲紛然感激之多而我之敗績則自逡巡不進耳途逺欲何向洙曰逺一作永主父偃曰日暮途逺天髙難重陳鄭曰重儲用切再也洙曰劉越石棄置勿重陳曹植云天髙聽逺學詩猶孺子洙曰一云子夏論語子曰小子何莫學夫詩詩可以興可以觀可以群可以怨又子夏問曰巧笑倩兮子曰起豫者商也始可與言詩巳矣鄉賦念嘉賔洙曰鄉賦猶鄉舉也鹿鳴燕嘉賔不得同朝錯洙曰公傳言公舉進士不第朝錯舉賢良對䇿髙第朝錯傳今臣密等乃以臣錯充賦如淳曰猶言備數也臣瓉曰充賦錯之謙也所以言如賦調也吁嗟後郤詵洙曰郤詵傳泰始中詔天下舉賢良直言之士太守文立舉詵應選對䇿上第詵曰臣舉賢良對䇿為天下第一猶桂林一枝也計踈疑翰墨洙曰公有詩云儒冠多誤身乃疑之時過憶松筠洙曰謂有歲塞趙曰言時巳過矣則思隱於山林舊注謂有歲寒非是獻納紆皇眷中間謁紫宸洙曰殿名且隨諸彥集洙曰江淹别賦金閨諸彥方覬薄才伸鄭曰覬几利切幸也洙曰公獻三賦召試集賢殿破膽遭前政隂謀獨秉鈞洙曰劉陶傳關東破膽詩節南山秉國之鈞陳平曰我多隂謀道家所忌趙曰林甫傳帝詔天下士有一藝者得詣闕林甫恐士對詔斥巳即建言士皆草茅徒以狂言亂聖聽請付尚書試問無一中程者子美對詔意本望髙選而為林甫所沮故有破膽隂謀之語微生霑忌刻萬事益酸辛交合丹靑地恩傾雨露辰洙曰交契在華顯之地又當沛澤下流之辰而愁餓死者以時所不容也趙曰丹靑地指言公卿之地也鹽鐵論曰公卿者神化之丹靑有儒愁餓死早晚報平津洙曰東方朔傳臣朔飢欲死平津侯公孫洪開閣延賢人與參謀議弘身食一肉脫粟飯故人賔客仰衣食奉祿皆以給之家無所餘報平津喻報鮮于也趙曰公以獨餓死為愁所賴者在鮮于京兆如公孫洪故人賔客仰衣食奉祿皆以給之家無所餘報平津喻報鮮于也趙曰公以獨餓死為愁所賴者在鮮于京兆如公孫洪故人賔客仰給衣食焉師曰漢張敞嘗為京兆尹今鮮于以賢良而居張敞之任猶驊騮之開道路雕鶚之離風塵京兆古之侯伯知何算言胸中藴蓄不可窮也容易失沉淪言京兆乃輦轂之下不可驕易而失身此戒之之辝郢匠斤言有斷也雲霄今已逼言近天子也台衮更誰殷言必見擢為公相也龍門客又新言門下客皆賢士也敗績自逡巡言甫自得罪去而不獲依託鮮于也日暮窮途逺喻人之衰老甫以年老更欲何所向乎天髙難重陳則又以君門難伸訴也孺子小子也甫謙言能詩不過小子之學詩不得同朝錯吁嗟後郤詵蓋言甫雖忝鄉薦奈何不中第也獻納謂獻三賦帝説命宰相試文章且隨諸彥集謂落筆中書堂也甫以上疏雪房琯為當權者所疾遂見斥逐故云破膽遭前政隂謀獨秉鈞微生霑忌刻微生甫自謂也奉贈太常張卿均二十韻洙曰按唐書均張説之長子也九載為大理卿後出為建安太守歲中召還再遷太常卿祿山亂受偽命特免死長流合浦方丈三韓外洙曰前漢郊祀志自齊威宣燕昭使人入海求蓬萊方丈瀛洲三神山者其傳在渤海中魏志韓在帶方之南東西以海為限有三種一曰馬韓二曰辰韓三曰棄韓故曰三韓崑崙萬國西洙曰禹貢注崑崙在荒服之外流沙之內羌髣佛之屬皆西戎也鄭曰崑公渾切崙盧昆切酈元曰外國圖云從大晉國王西七萬里得崑崙之墟建摽天地闊洙曰天台賦赤城霞起以建摽詣絶古今迷氣得神仙逈恩承雨露低洙曰按唐書均弟垍以主壻玄宗特深恩寵許於禁中置內宅侍為文章賞賜珍玩不可勝數時均亦供奉翰林垍嘗以所賜示均均戲謂垍曰此婦翁與女壻非是天子與學士也趙曰上四句以譬禁掖之清切乃神仙之地唯有仙風道骨者始能遊且承恩寵也此指言張均父子相門淸議衆趙曰張均父説相國之子故曰相門儒術大名齊魯曰均張説之子其名與父齊等也軒冕羅天闕洙曰均垍俱能文説在中書兄弟皆掌綸翰之任琳琅識介圭洙曰禹貢厥貢球琳琅玕注琳皆王名琅玕石而似珠釋地云西北之美者有崑崙墟之璆琳琅玕焉詩嵩髙錫爾介圭以作爾寶箋云長寸二尺謂之介非諸侯之圭故以為寶美均為介圭也趙曰以琳琅則識張卿為介圭矣介圭大圭也伶官詩必誦洙曰邶詩簡兮序衛之賢者仕於伶官皆可以承事王者注伶官樂官也伶氏丗掌樂官而善焉故後丗號樂官為伶官也夔樂典猶稽洙曰書后夔典樂趙曰此贈太常張卿復用樂事伶官出詩仕於伶官古者採詩而伶官誦之以諌王焉太常卿掌樂者也健筆凌鸚鵡洙曰後漢禰衡字正平有才辨在黃祖座上為鸚鵡賦筆不停綴文不加點凌過也銛鋒瑩鸊鵜洙曰鸊鵜水鳥也膏中瑩刀修可曰戴皓度開山詩云劒瑩鸊鵜膏友于皆挺拔洙曰友于言兄弟也馬曰書惟孝友于兄弟趙曰言均垍兄弟之貴且有勳業也公望各端倪洙曰公望各有所歸也趙曰言兄弟負公輔之望各有端倪也余曰莊子太宗師篇反覆終始不知端倪疏云端緒也倪畔也通籍踰靑瑣洙曰元帝紀令從官給事官司馬中者得為大父母父母兄弟通籍應劭曰籍者為二尺竹牒記其年紀名字物色縣之宫門案省相應乃得入也謝玄暉詩既通金閨籍漢給事曰暮入對靑瑣門拜謂之夕郎靑瑣以淸戶邊鏤中天子制也刻為靑瑣文而靑塗也趙曰通籍通朝見之籍靑瑣也中有青瑣門刻為連瑣而靑塗之亨衢照紫泥洙曰亨衢亨途也後漢志漢舊儀曰天子信璽六璽皆以武都紫泥封靑囊白素裏兩端無縫尺一板中約署皇帝余曰易大畜卦何天之衢亨靈虬傳夕箭洙曰梁陸倕字佐公新漏刻銘曰靈虬承龍言漏刻之躰以龍承之也趙曰箭浮水之物鄭曰虬居幽切無角龍歸馬散霜蹄昱曰莊子馬蹄篇馬蹄可以踐霜雪能事聞重譯鄭曰譯夷益切洙曰前漢平帝紀越裳重譯獻雉師古曰譯謂傳言也道路絶逺風俗殊隔故纍譯而後乃通相如重譯納貢趙曰言所能之事聞播於重譯之蠻夷矣嘉謨及逺黎余曰揚子或問忠言嘉謨曰謨合皋陶之謂嘉弼諧方一展洙曰皋陶謨曰謨明弼諧班序更何躋洙曰莊二十年傳朝以正班爵之義帥長幼之序適越空顚躓洙曰莊子逍遙篇宋人資章甫而適諸越越人斷髮文身無所用顚躓危困也鄭曰躓陟利切跲也遊梁竟慘悽洙曰鄒陽齊人知吳王不可説是時梁孝王待士於是陽與枚乘嚴忌等皆去之陽從孝王遊羊勝公孫詭等疾陽惡之孝王孝王怒將殺之陽從獄中上書而得免趙曰公初落魄嘗適越矣傳所謂客吳越是也公又嘗遊梁矣贈李白篇所謂亦有梁宋遊是也今公雖為右率府胄曹然欲展弼諧於張卿而班列次序之不可攀則復有去而之它之意將適越乎空如前日之顚躓將遊梁乎竟如前日之慘悽此詩人之思也謬知終畫虎洙曰馬援傳初兄子嚴敦並喜譏議援在交址還書戒之曰龍伯髙敦厚周慎口無擇言謙約節儉廉公有威吾愛之重之願汝曹效之杜季良豪俠好憂人之憂樂人之樂淸濁無所失父喪致客數郡畢至吾愛之重之不欲汝曹效也效伯髙不得猶為謹勑之士所謂刻鵠不成尚類鶩也效季良不得陷為天下輕薄子所謂畫虎不成終類狗也迄今季良尚未可知郡將下車輒切齒州郡以為言吾嘗為寒心是以不願子孫之效也微分是醯雞洙曰莊子田子方篇孔子見老聃孔子出以見顔回曰丘之道也其猶醯雞歟微夫子之發吾覆也吾不知天地之大全也注醯雞者甕中之蠛蠓也司馬云酒上蠛蠓醯許西反萍泛無休日天覺曰萍無根隨流而巳謝靈運蘋萍泛沉深趙曰公自譬其無定也桃隂想舊蹊洙曰李廣贊曰李將軍恂恂如鄙人口不能出辭及死之日天下知與不知皆為流涕彼其中心誠信於士大夫也諺曰桃李不言下自成蹊師古曰蹊音奚謂徑道也趙曰公言其想舊蹊之桃隂乃懷念舊日見知之人也吹噓人所羡騰躍事仍睽碧海真難涉洙曰十洲記扶桑在碧海之中也一面萬里大帝之宫太真東主君所治之也靑雲不可梯安石曰郭璞遊仙詩靈溪可潛盤安事登雲梯趙曰至於騰躍之便則仍乖睽如此則如涉碧海梯青雲之難也曽曰謝靈運詩共登靑雲梯顧深慙鍛錬鄭曰鍛都玩切洙曰韋彪傳鍛鍊之吏注蒼頡篇曰鍛推也鍛錬猶成熟也言深文之吏入人之罪猶工冶陶鑄鍛鍊使之成熟也前書路溫舒曰鍛錬而周內之曰曰張景陽七命曰楚之陽劒歐冶所營乃錬乃鑠萬辟千灌注云鍛錬刻苦成材之義此言張卿恩顧我雖深而自慙鍛錬之未至耳舊注所引乃刑罰鍛錬之義非是才小辱提携洙曰提携猶挈維之也趙曰公自言才能之小辱張卿之提携檻束哀猿叫洙曰叫一作巧淮南子置猿檻中巧捷無所肆其能鮑明逺詩今作檻中猿枝驚夜鵲棲洙曰魏武帝樂府云月明星稀烏鵲南飛繞樹三匝何枝可依云幾時陪羽獵應指釣璜溪洙曰注揚雄傳雄十二月從羽獵璜王也吕望釣於蟠溪得璜焉刻曰姬受命吕佐之報在齊趙曰孝成帝時羽獵而揚雄從焉幾時陪羽獵有羡慕其得近清光之意鄭曰璜胡光切十道志櫟陽有釣漢浦乃吕望所釣璜溪也師曰太公老年見用今甫亦有意于暮年故云云敬贈鄭諌議十韻諌官非不逹詩義早知名洙曰鄭諫議雖不得名必善於詩者下皆詩事趙曰為天子諫官非不謂之顯逹而於作詩之義又早歲巳有名此專美之也下句正言其詩可以知名者破的由來事洙曰言詩句中理如射之破的也庾翼謂謝尚曰卿若破的當以鼓吹相賞尚應聲中之翼即以其副鼓吹給之先鋒孰敢爭洙曰嘗為勍敵未嘗敗北趙曰破的如射之中先鋒如戰之勇王濟與王愷發射一發射破的思飄雲物外鄭曰思相吏切洙曰外一作動言詩意思逺到也司馬相如傳相如既奏大人賦天子大説飄飄有凌雲氣遊天地之間意趙曰如文賦言神遊万仞情鶩八極舊注引飄飄有凌雲氣非是也律中鬼神驚修可曰詩律既中可驚鬼神如李白詩云詩成泣鬼神舊注謂如律吕和諧誤矣毫髮無遺恨波瀾獨老成洙曰曲盡物理故無遺恨才思浩瀚故如波瀾兼詞意壯健故有言老成也趙曰公言作詩中有一字一句不佳雖如毫髮之小則心自慊慊則有遺恨矣野人寧得所趙曰自此而下皆公自序也野人公自稱耳天意薄浮生多病休儒服晏曰莊子田子方篇哀公曰舉魯國而儒服冥搜信客旌洙曰天台賦云逺寄冥搜趙曰欲冥搜幽冥之地信客旌所指耳築居仙縹眇鄭曰縹普沼切眇弭沼切洙曰洙曰木玄虛海賦神仙縹眇食王清涯趙曰卜築欲在深逺之處如仙之縹眇難尋也餘見上旅食歲崢嶸鄭曰崢仕耕切嶸胡萌切髙峻貌鮑明逺舞鶴賦歲峥嶸而催暮使者求顔闔洙曰莊子讓王篇魯君聞顔闔得道之人也使人以幣先焉顔闔守陋閭苴布之衣而自飯牛終逃魯君之使諸公厭禰衡洙曰後漢文苑傳禰衡字正平有才辨氣剛傲好矯時慢物曹操怒之送與劉表後侮慢表表耻不能容以江夏太守黃祖性急故送衡與之後竟為祖所殺將期一諾重洙曰辨士曹丘生謂季布曰楚人諺曰得黃金百兩不如得季布一諾足下何以得此聲於梁楚之間哉江淹詩季布重然諾史記曰季布一諾歘使寸心傾洙曰謂傾嚮於鄭也徐庶指心曰以此方寸之地謝玄暉詩孰為勞寸心鄭曰歘許勿切暴起也君見途窮哭宜憂阮步兵洙曰阮籍為步兵校尉率意命駕不由徑路車迹所窮輒動哭而反顔延年詩物故不可論途窮能無慟十朋曰使者求顔闔謂鄭時遣人招之諸公厭禰衡言異巳者惡甫之放誔末章皆祈哀之辝寄簡上寄韓諌議師曰地理志嶽州巴陵郡在嶽之陽故曰嶽陽有君山洞庭湖湘江韓注以諌為職直言陳天下事代宗不恱貶嶽陽注適意遊君山棄人間事將為長往之計甫思之故有此作今我不樂思嶽陽洙曰嶽陽巴陵也屬湖南身欲奮飛病在床洙曰詩靜言思之不能奮飛美人姢姢隔秋水洙曰詩人以美人北君子故詩有彼美人兮西方之人兮趙曰公時在夔而韓在嶽斯為隔秋水矣濯足洞庭望八荒洙曰左太沖濯足万里流鴻飛冥冥日月白靑楓葉赤天雨霜洙曰選詩曉霜楓葉丹趙曰鮑昭詩窮秋九月荷葉黃北風驅鴈天雨霜雨音去聲玉京群帝集北斗洙曰玉京帝居也五方各有帝惟北極為至尊夢符曰右按晉天文志北極五星北辰最尊者也北斗七星在太微北七政之樞機隂陽之元本故運乎天中而臨制四方以建四時而均五行人君之象號令之主注以斗為極誤矣五星經云太上白玉京黃金闕趙曰群帝如諸王三公之類以言天子五方之帝三十三天之帝雖稱帝而於大帝為卑故稱群帝也或騎麒麟翳鳯凰趙曰集仙傳天人降土妙想皆乘麒麟鳯凰龍鶴大鳥是也芙蓉旌旗煙霧樂洙曰楚詞搴芙蓉兮木末影動倒景搖瀟湘洙曰郊祀志登遐倒景注在日月之上反照故其影倒也趙曰言瀟湘言韓在嶽陽也星宫之君醉瓊漿洙曰楚詞搖漿密勺實羽觴萃酌既陳有瓊漿羽人稀少不在傍趙曰楚辝仰羽人於丹丘似聞昨者赤松子恐是漢代韓張良昔隨劉氏定長安帷幄未改神慘傷洙曰張良其先韓人也髙祖立蕭相國良乃稱曰家丗相韓及韓滅不愛万金之資為韓仇強秦天下震動今以三寸舌為帝者師封万戶位列矦此布衣之極於良足矣願棄人間事欲從赤松子遊耳乃學道欲輕舉師古曰赤松子仙人號也神農時為雨師髙祖曰運籌帷幄之中決勝千里之外吾不如子房國家成敗吾豈敢色難腥腐餐風香洙曰鮑明逺何時與汝曹啄腐共吞腥趙曰神仙傳壷公留費長房於羣虎之中長房不恐又內石室中頭上有大石茅繩懸之諸蛇嚙繩欲斷長房不移公往撫之曰可教矣又命噉溷臭惡非常長房色難之公乃歎而謝遣之曰子不得仙也今以子為地主周南留滯古莫惜洙曰太史公留滯周南趙曰又以太史公比之南極老人應壽昌洙曰春秋元命苞曰老人星治平則見見則主壽美人胡為隔秋水焉得置之貢玉堂師曰令韓注隱嶽陽效張良之所為故甫云色難腥腐餐風香昔太史公留滯周南之地注見貶於嶽陽何其太史公是以為之痛惜南極星中有老人星見則主壽以應治平甫以注隱南方此之老人星嘆其不見也於末章則又云美人胡為隔秋水欲得此美德之人貢之玉堂以輔天子不宜隱于此也所以甚惜注之不用暮秋枉裴道州手札率爾遣興寄近呈蘇渙侍御久客多枉友朋書素書一月凡一束蘇曰王價避居逺郊一月之中得親知書僅成一束但虛訶寒溫而巳空煩眼力使人厭接又倦回答趙曰古詩云客從南方來中有尺素書虛名但蒙寒溫問泛愛不救溝壑辱洙曰言友朋之書雖多但蒙寒溫之問而不足拯憂也趙曰晉王獻之嘗與兄徽之操之詣謝安三兄多言俗事獻之寒溫而已孟子云志士不忘在溝壑齒落未是無心人舌存恥作窮途哭洙曰張儀從楚相飲相亡璧門下意張儀盜璧共笞掠之妻曰子母讀書遊説安得此辱儀曰視吾舌在不妻笑曰舌在儀曰足矣阮籍遇窮途則哭道州手札適復至紙長要自三過讀盈把那須滄海珠夢符曰右按唐書閻立本謂狄仁傑曰君可謂滄海遺珠矣趙曰王筠於書三過五抄入懷本倚崑山玉洙曰言得裴書勝珠之盈把倚裴如崑山王也蘇曰丗説毛曽與夏侯玄共坐時人謂蒹葭倚王樹也撥棄潭州百斛酒洙曰步兵厨中貯酒數百斛蕪沒瀟岸千株菊使我晝立煩兒孫令我夜坐費燈燭洙曰言得書而有所思也趙曰煩兒孫者煩其侍立也憶子初尉永嘉去鄭曰永嘉溫州縣紅顔白面花映肉軍符侯印取豈遲紫燕緑耳行甚速洙曰言負超軼之材也趙曰言初為尉之少年而材之俊逸軍府則為節度使印則封侯矣紫燕文帝良馬名緑耳則列子周穆王駕八駿之馬而左緑耳聖朝尚飛戰鬪塵濟丗宜引英俊人洙曰兵革未息宜薦才引士以濟斯丗也黎元愁痛會蘇息夷狄跋扈徒逡巡洙曰如用得其人則黎民蘇而夷狄服也趙曰徒逡巡者言其空自遷延不久掃蕩也授鉞築壇聞意旨洙曰晉禮志漢魏故事遣將出征符節即授節鉞於朝堂漢髙築壇拜韓信聞意旨言當與此事也頽綱漏網期彌綸洙曰勉興滯輔廢也郭欽上書見大計洙曰于寶著論思郭欽之謨而誤我戎狄之有釁御史大夫郭欽言戎狄強獷歷丗為患今西北方戎狄雜居恐百代之後為患宜及平吳之功以復上郡帝不許劉毅答詔驚群臣洙曰晉武嘗顧謂劉毅曰朕方漢之何如主對曰桓靈也帝曰朕克已為理方之桓靈不亦甚乎對曰桓靈賣官錢入公府陛下賣官錢入私門以此言則知也他日更僕語不淺洙曰儒行孔子對魯哀公曰遽數之不能終其物悉數之乃留更僕未可終也注僕太僕也君燕朝則正位掌擯相更之者為久將倦故使之相代也明公論兵氣益振鄭曰振之人切洙曰益振益壯也傾壷簫管黑白髮洙曰黑一作理言得書而愁去白髮再黑儛劒霜雪吹靑春洙曰項莊舞劒儛與舞同宴筵曽語蘇季子後來傑出雲孫比洙曰蘇秦字季子徐稚傳角立傑出爾雅雲孫趙曰爾雅七丗孫曰雲孫故自季子至侍御取其最逺者言之茅齋定王城郭門藥物楚老漁商市趙曰定王城乃潭州漁商市亦潭州之地市北肩輿每聮𬒮郭南抱甕亦隱几鄭曰隱於靳切洙曰抱甕見汲井歲榾榾注莊子齊物論南郭子綦隱几而卧無數將軍西第成洙曰衛靑傳上為青治第令視之曰胸奴未滅無以家為趙曰後漢馬融為大將軍西第頌頗為正直所羞舊注引衛靑治第事非是早作丞相東山起洙曰謝安起於東山也趙曰班固山東出相舊注作東山使引謝安事非是公亦何拘於西對東邪鳥雀苦肥秋粟菽蛟龍欲蟄寒沙水洙曰鳥雀方得時而蛟龍退藏甫自喻也蘇曰漢末兵戈蝟起鹿門隱公歎曰秋稔菽栗鳥雀甚肥而鸞鳳何卒焉余讀此莫不掩卷太息又鮑宰云鸞鳯棲荆艾蛟龍蟄寒水言小人升騰君子淹滯不見用也趙曰上句比無功受祿下句又以比賢材之潛藏天下鼓角何時休陳前部曲終日死洙曰部曲隊伍也趙曰傷時干戈之未息以引下句激昂二公之致功名也附書與裴因示蘇此生已愧須人扶致君堯舜付公等早據要路思捐軀帥曰溝壑言失所泛愛謂禮數雷同但止於寒溫之問故不救溝壑辱也丗説毛曽與夏玄共坐時人謂之蒹葭倚玉樹唐書狄仁傑滄海遺珠珠玉喻道州手札也昔阮步兵厨中貯酒數百斛甫得書有所懷思不暇飲酒泛菊故撥棄蕪沒也長者坐少者立晝立煩兒孫夜坐費燈燭言日夜思之而忘食息也永嘉溫州紫燕緑耳良馬也道州負超逸之才其視軍符侯印取之若其甚速豈困於永嘉一尉乎夷狄指祿山言聖朝得人則民安冦平雖祿山跋扈不臣復何慮哉頽綱漏網言政刑雕弊賴道州經綸以禆輔之郭欽劉毅皆以喻道州昔當抗疏直言他日必為帝所禮遇黑白髮言得裴書髮更黑和氣襲人故云吹靑春甫與道州會間嘗談蘇侍御故以侍御為蘇秦雲孫雲孫逺孫也楚定王都荆州時甫茅齋在郭門之外每抱甕灌畦或隱几而坐比之南郭子綦也武帝征胸奴衛靑霍去病皆立功帝賜第宅無數軍西第成言將師平祿山思明之亂皆富貴也唯兾裴蘇早起以為丞相故云東山起鳥雀苦肥秋粟菽言小人貪位慕祿也蛟龍欲蟄寒沙水言君子於此時反退藏也須人扶言衰老要路謂仕途之顯要者蘇大侍御渙靜者也旅于江側凡是不交州府之客人事都絶久矣肩輿江浦忽訪老夫舟楫而巳茶酒內余請誦近詩肯吟數首才力素壯詞句動人接對明日憶其湧思雷出書篋几杖之外殷殷留金石聲賦八韻記異亦記老夫傾倒於蘇至矣龐公不浪出趙曰後漢龐德公居峴山之南未嘗入城府蘇氏今有之洙曰言亦不交州府也再聞誦新作突過黃初詩趙曰文帝為魏太子七子從之遊皆能詩如謝靈運江文通皆擬其作黃初文帝即位年號也乾坤幾反覆洙曰幾一作垍揚馬宜同時洙曰司馬相如揚雄亦蜀人也今晨淸鏡中勝食齋房芝洙曰元封二年芝生甘泉齋房歌云齋房産草九莖蓮葉趙曰此蘇渙之詩如房芝之可茹也余髮喜却變白間生黑絲洙曰生一作添趙曰變白為黑以聞其詩之故昨夜舟天接洙曰接一作佞湘娥簾外悲百靈未敢散洙曰言百靈聞誦詩而皆來也風破寒江遲洙曰破一作波趙曰宗慤曰願乘長風破萬里浪師曰昔龐德公不應州府辟命未嘗入城郭今蘇渙不交州府頗有其風黃初魏文帝年號指子建文集也乾坤幾反覆言丗代遷變而名終不歇可與揚雄司馬相如齊名於當時也淸鏡中捐江上勝食齋房芝言咀味新更過於靈芝也白間生黑絲甫與蘇論文喜而髮為之變文有益於人如此湘娥悲百靈不散皆言聽詩而感動之也寄裴施州廊廟之具裴施州洙曰潘安仁器非廊廟姿宿昔一逢無此流金鍾大鏞在東序洙曰禮樂之所在也夢符曰右按詩鼖鼓維鏞大鍾曰鏞書曰天球河圖在東序鍾鏞以言至和所自出東陽位也冰壷玉衡縣淸秋洙曰氣宇之淸徹也夢符曰右按文選淸如玉壷冰書曰在琁璣玉衡以齊七政玉衡正天文之器非特氣之淸也自從相遇減多病三歲為客寬邊愁堯有四嶽明至理洙曰堯建四嶽以共治天下漢二千石真分憂洙曰漢宣帝曰與我共理者惟良二千石乎幾度寄書白鹽北洙曰施州在白鹽山之北也趙曰白鹽者夔州之山此裴使君寄書與公義甚明也舊注云施州在鹽山之北非矣其下句言蟠龍銀鉤以言其書也苦寒贈我靑羔裘洙曰羔一作絲蘇曰沈約牛元慶愛其文章自解錦囊靑羔裘贈之霜雪回光避錦袖蛟龍動篋蟠銀鈎洙曰龍蛇銀鈎皆字體也言所惠之書如龍蛇銀鉤屈蟠交連趙曰其如龍如蛇今藏裴公銀鈎於其中所以龍蛇動於篋也紫衣使者辭復命再拜故人謝佳政將老巳失子孫憂後來况接才華盛趙曰言我將老而免憂子孫無它以後來之人相接有裴君諸子才華之盛美矣師曰東序殷學也金鍾大鏞乃禮樂之器言能文之以禮樂也冰壷玉衡言其淸和也漢有二千石有中二千石二千石其實一千四百四十石不滿二千石也中二千石其實一千一百六十石故謂之中二千石漢宣帝曰與我共理者惟良二千石乎甫以施州比堯之四嶽漢之二千石施州在白鹽山之北甫屢得其惠書與羔裘霜雪回光避錦袖蓋言裘也龍蛇動篋蟠銀鈎蓋言書字躰勢也紫衣使者辟復命言朝廷必遣使辟召之也鄭典設自施州歸宋曰春秋時巴國界秦昭王置黔中郡梁改為施州吾憐滎陽秀冒暑𥘉有適名賢愼出處不肯妄行役洙曰言其以義而動也師曰出處君子之大致不可妄動鄭公雖冒暑有適蓋以鄭子每乏是以南謁裴施州亦有義動不肯妄行役也旅兹殊俗逺竟以屢空迫洙曰顔淵屢空南謁裴施州氣合無險僻攀援懸根木鄭曰援于元切登頓入矢石洙曰言險阻也青山自一川城郭洗憂戚趙曰公嘗有詩曰下視城郭消人憂聽子話此邦令我心恱懌其俗則純朴蘇曰魏人俗尚輕靡趙人俗尚淳朴楚人俗尚魚鹽不知有主客溫溫諸侯門禮亦如古昔勑厨倍常羞杯盤頗狼籍洙曰言雖幽逺而敬客之意不異於中華也史滑稽傳履舄交錯杯盤狼籍堂上燭滅主人留髠而送客時雖屬喪亂事貴賞匹敵洙曰賞一作當中宵愜良會裴鄭非逺戚群書一萬卷博涉供務隙他日辱銀鉤洙曰銀鉤書也言字躰交運徑屈如銀鉤然森踈見矛戟夢符曰右按北史李義深有當丗才用而心險峭時人語曰矛戟森森李義深倒屣喜旋歸洙曰蔡雍倒屣而迎王粲趙曰倒屣不上鞋踵也畫地來所歷鄭曰畫去聲乃聞風土質又重田疇闢刺史似冦恂列郡宜競借鄭曰借音迹洙曰見權宜借冦恂注北風吹瘴癘羸老思散策蘇曰吳定臨危老拙久厭戎馬思得散䇿林泉遂此猿猱野性渚拂蒹葭塞洙曰塞一云寒嶠穿蘿蔦羃此身仗兒僕髙興潛有激孟冬方首路洙曰顔延年改服飾徒侣首路局險難強飯取崖壁歎爾疲駑駘汗溝血不赤洙曰言非良馬也修可曰馬援銅馬相法曰汗溝欲深長漢書曰大宛國多善馬汗血言其先天馬子也終然備外飾駕馭何所益我有平肩輿前途猶凖的翩翩入鳥道師曰鳥道謂飛鳥之道蓋言髙險也庶脫蹉跌厄鄭曰蹉倉何切跌徒結切寄薛三郎中人生無賢愚飄颻若埃塵蘇曰丁固人生無賢與愚百年之後俱成糞壤又黃玘利名聚散若風中埃塵去來不足較輕重自非得神仙誰免危其身與子俱白頭役役常苦辛洙曰役役一作沒沒雖為尚書郎不及村野人憶昔村野人蘇曰馬融曰我輩仕塗不及村野之人雞豚社飲足以自樂我輩區區塵土豈有此况味其樂難具陳趙曰歡樂難具陳藹藹桑麻交公侯為等倫天未厭戎馬我輩本常貧子尚客荆州我亦滯江濵峽中一卧病瘧癘終冬春春復加肺氣此病蓋有因早歲與蘇鄭洙曰蘇鄭蘇源明鄭虔是也痛飲情相親二公化為土嗜酒不失真洙曰蘇鄭亦皆嗜酒豫今委修短豈得恨命屯聞子心甚壯所過信席珍洙曰席珍席上之珍也上馬不用扶每扶必怒嗔洙曰每一作思賦詩賔客間揮灑動八垠乃知蓋代手洙曰可蓋覆當代也漢書功業蓋代蘇曰李密蓋代手段不可容易施呈也才力老益神靑草洞庭湖洙曰靑草洞庭皆湖名也鄭曰二湖俱在巴陵東浮滄海漘君山可避暑洙曰君山在洞庭湖心况足采白蘋子豈無扁舟往復江漢津我未下瞿塘空念禹功勤洙曰功又作力聽説松門峽吐藥攬衣巾趙曰聞松門峽之好則方喫藥而吐之遽攬衣而思去鄭曰松門峽巴中地名髙秋却束帶鼓柂視淸旻鳯池日澄碧濟濟多士新餘病不能起健者勿逡巡趙曰健者薛據也紹勃然曰天下健者豈惟董公上有明哲君下有行化臣洙曰行化臣謂承流宣化之大臣也奉贈射洪李四丈丈人屋上烏人好烏亦好洙曰詩瞻烏爰止于誰之屋注冨人之屋烏所集也修可曰尚書大傳曰武王登夏臺以臨殷氏周公旦曰臣聞之愛其人者愛其堂上烏人生意氣豁不在相逢早洙曰鄒陽傾蓋如故趙曰北史李延夀敘傳載閻信謂其祖李曉之言曰古人相知未必在早南京亂初定所向色枯稿趙曰南京成都府也肅宗至德二年以蜀郡為南京所謂亂初定指言前年辛丑之歲四月劒南東川節度使段子璋反五月崔光逺擊斬之遊子無根株茅齋付秋草東征下月峽挂席窮海島洙曰謝靈運泛舟采石華桂席拾海月海賦維長綃挂長席萬里須十金朝曰漢書百金中人十家之産顔師古注古者一兩金直十千十金則知為百千妻孥未相保蒼忙風塵際蹭蹬騏驎老洙曰馬蹭蹬失勢貌志士懷感傷心胸已傾倒奉酬薛十二丈判官見贈忽忽峽中睡悲風方一醒西來有好鳥為我下靑冥師曰甫有渴疾故忽忽不樂至秋風稍蘇故云悲風方一醒西有崑崙山王母與漢武帝相會于此常有靑鳥為使甫以薛十二有仙姿故以况之羽毛淨白雪慘淡飛雲汀趙曰晉道一道人之言雪曰先集其慘淡也既蒙主人顧舉翮唳孤亭持以比佳士及此慰揚舲洙曰江淹詩蕭舲出郊際趙曰劉協彌勒石像碑云似揚舲遊水髙曰揚舲行船也淸文動哀玉趙曰此言佳士之文淸如玉聲之哀蓋環佩之類舊注引卞和泣玉非是見道發新硎洙曰莊子屠牛坦刀刃若發新硎唐曰薛之善屬文復能知道故云云欲學鴟夷子洙曰貨殖傳范蠡浮江湖改姓適齊為鴟夷子注顔師古曰自號鴟夷者言若盛酒之鴟夷多所容受而可卷懷與時張弛陳遵傳曰自用如此不如鴟夷也趙曰李賀昌谷詩刺促成幾人好學鴟夷子蓋用杜公今句也待勒燕山銘洙曰竇憲勒銘燕然山班固為之銘誰重斷蛇劒洙曰一云口重斬邪劒漢髙有斬蛇劒致君君未聽洙曰伊尹致君堯舜趙曰此言利器如漢朱雲所用之劒而未施有致君之術業而君未用舊注引漢髙斬蛇劒以為證大誤學者矣志在麒麟閣洙曰見今代麒麟閣注無心雲母屏洙曰後漢鄭弘為太尉時舉第五倫為司空班次在下每正朔朝見弘曲躬自卑上遂聽置雲母屏風分隔其間由此為故事師曰昔范蠡號鴟夷子鴟夷子乃韋囊也可以盛酒舒卷隨宜者似之甫勉薛十二莫學鴟夷子泛湖當如竇憲立功勤銘于燕然山畫像麒麟閣無徒若鄭洪為帝寵眷賜以雲母屏隔坐而巳卓氏近新寡豪家朱門扄相如才調逸銀漢會雙星洙曰司馬相如初遊臨卭臨卭之富人卓氏有女名文君新寡善琴相如因以琴心桃之遂為夫婦晏曰雙星牛郎織女也客來洗粉黛日暮拾流螢晏曰車㣧聚螢讀書故云拾流螢不是無膏火勸郎勤六經老夫自汲澗蘇曰孫藝銘石庵云稚子拾薪老夫汳澗細君緝紵王術自汲澗泉煮茗野水日泠泠我歎黑頭白君看銀印靑洙曰見上露雨銀章澀注卧病識山鬼洙曰九章有山鬼為農知地形洙曰相髙下視肥磽辨五種君子不如老農誰矜坐錦帳洙曰漢百官志郎官給錦悵苦厭食魚腥蘇曰梁鴻曰鴻北人乍到江南苦厭魚蝦氣風土不相宜欲歸不能東南兩岸坼孫曰謂峽江也橫水注滄溟碧色忽惆悵洙曰忽一云苦風雷搜百靈洙曰見滋山朝百靈注空中石白虎洙曰石一云有赤節引娉婷自云帝里女洙曰云一云季文選我天帝之季女噀雨鳯皇翎洙曰弄玉帝女也乘鳯皇仙去師曰欒巴噀酒為雨故云噀雨襄王薄行迹莫學冷如丁洙曰丁丁令威也去家一十年始一歸也千秋一拭淚夢覺有微馨洙曰見宋玉髙唐賦并神女賦云人生相感動金石兩青熒洙曰李廣射石虎沒羽揚子雲曰至誠則石金為開選賦琳珉青熒丈人但安坐休辨渭與涇洙曰無分清濁也龍蛇尚格鬪灑血暗郊坰吾聞聰明主治國用輕刑洙曰尚德也銷兵鑄農器今古歲方寧文王日儉德俊乂始盈庭洙曰詩言濟濟多士文王以寧言為國當藉才也榮華貴少壯豈食楚江萍洙曰楚昭王度江得一物大如斗色赤以問孔子孔子曰此萍實也師曰至誠則金石為開甫言薛丈以至誠相感動能移此以感人主使之輕刑銷兵務從節儉搜求賢俊如是則天下不期治而自治薛於此可以掇取榮華於年少之日豈但如甫客寓荆楚而食萍實也哉貽華陽栁少府鄭曰華胡化切繫馬喬木間趙曰劉琨詩繫馬長松下問人野寺門師曰栁少府寓居于野寺甫尋訪之故云云栁侯披衣笑蘇曰苻堅見張育育披衣出喜曰何堅來矣欣然握手絶倒見我顔色溫並坐石堂下洙曰一云堂下石俯視大江奔火雲洗月露洙曰火雲旱雲也趙曰東坡云火雲無時出未受月露洗蓋出於此絶壁上朝暾鄭曰暾他昆切日始出洙曰謝靈運早聞夕颷急晚見日月暾趙曰謝靈運登石門最髙頂詩曰晨䇿尋絶壁自非曉相訪觸熱生病根洙曰觸冒也趙曰晉程曉詩可憐褦襶子觸熱生病根南方六七月出入異中原老少多暍死鄭曰暍於歇切傷熱也趙曰熱病謂之暍武王下車而扇暍蘇曰暍許葛反熱貌漢明帝徙河南人實河北老少途中無水暍熱死數百人汙踰水漿翻趙曰丗説載鍾會鍾育見魏文帝育面有汗帝問曰何以汗對曰兢兢皇皇汗出如漿也俊才得之子筋力不辭煩鄭曰筋舉欣切趙曰俊才得柳少府所以不辭筋力之煩而往謁也指揮當丗事師曰自此句以下謂栁生負經綸之志言及國家未寧慷慨悲憂其義氣士排帝閽帝閽天門也觀柳生之義槩可與知已者論不可為俗人道也語及戎馬存涕淚濺我裳悲氣排帝閽洙曰思玄賦叫帝閽使闢扉兮覩天皇于瓊宫鬱陶抱長策洙曰書鬱陶乎豫心長䇿良策者也有良策而不見用故鬱陶義仗知者論吾衰卧江漢但愧識璵璠洙曰潘正叔寸晷惟寶豈無璵璠言巳之所識止璵璠而巳以美柳侯也文章一小伎於道未為尊趙曰後漢楊賜傳云造作賦説以史篆小伎見寵於時起余幸班白因是託子孫趙曰起余者商也言柳少府起發余於班白衰老之間因此相見而有子孫可託之幸也俱客古信州洙曰夔乃古信州也程曰春秋時魚國漢為魚腹縣梁隋皆為巴東郡唐初改為信州又為夔州取夔國名之結廬依毀垣相去四五里徑微山葉繁時危挹佳士况免軍旅喧醉從趙女舞歌鼓秦人盆洙曰故舊禮數絶自然棄擲與時異况乃踈頑臨事拙飢卧動即尚一旬洙曰劉公幹詩彌廣十餘旬弊裘何啻聮百結洙曰見女子衣百結注君不見空墻日色晚此老無聲淚垂血贈鄭十八賁溫溫士君子洙曰前漢律歷志以銅有似士君子之行言不為燥􅊜寒暑變其莭不為風雨暴露改其形介然有常也令我懷抱盡師曰詩云溫其如玉鄭賁有溫潤君子之德使我得展盡砥藴無有遺恨靈芝冠衆芳安得闕親近趙曰芝以比鄭蓋靈芝人所喜見者故不可闕於親近也韓退之有云若鳯凰芝草淨先覩之為快遭亂意不歸竄身迹非隱洙曰以避亂也趙曰山濤吏非吏隱非隱細人尚姑息趙曰禮記小人之愛人也以姑息薖曰小惠相濡潤侮慢無所不至吾子色愈謹髙懷見物理識者安肯哂卑飛欲何待捷徑應未忍洙曰不欲枉尺而直尋也修可曰張衡應間曰捷徑邪至我不忍以投步于進容我不忍歙扇又楚詞夫惟捷徑而窘步盧藏用傳士大夫指嵩山終南為仕塗捷徑示我百篇文詩家一標凖蘇曰屈平文詞乃詩家標凖也羈離交屈宋洙曰屈原宋玉牢落值顔閔洙曰顔淵閔子騫水陸迷畏途洙曰畏一作長藥餌駐修軫逸曰言以丹藥延年也古人日巳逺靑史字不泯洙曰古詩不泯並圖青史盛德夢符曰右按應劭風俗通曰青史善著書即青史者人姓名也趙曰青史者殺青竹簡之史也江文通云俱啓丹青並圗青史詩云靡國不泯步趾詠唐虞追隨飰葵堇洙曰以堯舜之道自樂而不以簞瓢為慮也數杯資好事異味煩縣尹心雖在朝謁力與願矛盾抱病排金門衰容肯為敏洙曰敏不敏也如左傳魯人以為敏同師曰衰老欲排金馬門尤非本志也贈衛八處士師曰按唐史拾遺甫與李白髙適衛賔相友善時賔年最少號小友今據杜詩贈衛八云昔别君未婚知此詩乃贈衛賔乎人生不相見動如參與商洙曰見送髙書記詩注今此復何夕共此燈燭光洙曰見今夕行注一云共宿此燈花少壯能幾時鬢髮各巳蒼洙曰漢武帝秋風辝少壯幾時兮奈老何陶淵明歸去來寓形宇內復幾時饒曰蒼老蒼也訪舊半為鬼驚呼熱中腸洙曰魏文帝與吳質書昔年疾疫親故多離其災徐陳應劉一時俱逝痛可言耶昔日遊處謂百年巳分可長共相保何數年之間零落略盡言之傷心頃撰其遺文都為一集觀其姓名巳為鬼録追思昔遊猶在心目而此諸子化為糞壤可復道哉修可曰孟子不得於君則熱中注心熱恐懼也趙曰此乃莊子內熱之義蓋煎熱之謂也焉知二十載重上君子堂趙曰王仲宣詩髙會君子堂昔别君未婚兒女忽成行怡然敬父執直方曰曲禮見父之執不謂之進不敢進問我來何方問答未及巳兒女羅酒漿洙曰兒女一作驅兒何曰詩可以挹酒漿蘇曰郭育見戴逵使羅酒漿兒女進果餒夜雨剪春韭蘇曰郭林宗見友人夜冒雨剪韭作炊飯今洛汭人皆效之薛曰右按南史周顒春初早韭新炊間黃粱洙曰陶隱居曰黃粱本出青兾穗大毛長殼米俱粗於白粱食之比它榖最益脾修可曰王儉問周顒曰山中何者為最勝曰春𥘉早韭秋未晚菘趙曰見主人意殷勤而真也主稱會面難洙曰張平子賦主稱露未晞曹子建詩主稱千金壽古詩會面安可知一舉纍十觴十觴亦不醉洙曰一作千觴亦不醉感子故意長明日隔山嶽丗事兩茫茫洙曰曹頴逹詩舉觴詠露斯蘇曰孔文舉百觴亦不醉梅曰李牧曰吳將軍飲數十觴未見有醉容贈蘇四徯異縣昔同遊各云猒轉蓬洙曰古詩為客若轉蓬言如蓬之隨風無所定止也别離巳五年尚在行李中洙曰左傳秦晉圍鄭燭之武夜見秦伯曰若舍鄭以為東道主行李之往來供其困乏注行李使人戎馬日衰息乘輿安九重洙曰天子之門九重乘輿天子所乘輿時京師𥘉復天下漸平也趙曰以車駕嘗因吐蕃陷京師而幸陜今稍平定復還長安為九重之安矣有才何棲棲將老委所窮趙曰公每自負矣故不以言才為嫌微生畒云丘何為是棲棲者歟為郎未為賤洙曰徯為宣義郎子美檢校工部貟外郎非以階官也後篇云雖為尚書郎可以證矣其奈疾病攻子何面黧黑焉得豁心胸趙曰指言蘇徯也列子云面目黧黑巴蜀倦剽劫下愚成土風洙曰崔旰之亂也幽葪巳削平洙曰祿山所節鎮處也荒徼尚彎弓洙曰時思明未平趙曰安史之亂雖巳削平而猶有盜賊也斯人脫身來豈非吾道東洙曰儒林傳𥘉梁項生從田何受易丁寬為項生從者讀易精敏材過項生遂事何學成何謝寬寬東歸何謂門人受易以東矣師古曰言丁寬得其法術以去後漢鄭玄學於馬融辝歸融喟然謂門人曰鄭生今去吾道東矣乾坤雖寬大所適裝囊空肉食哂菜色少壯欺老翁洙曰傷時情以肥癯為輕重也蘇曰吕安謂嵆康曰我輩稍有菜色反為肉食輩所哂徒知其外而不知內也周澤謂諸齋郎曰若有少壯不可欺老翁翁胃中有書万餘卷若輩未到此田地諸人皆慚悚無一語對况乃主客間古來逼側同君今下荆楊趙曰言時之寬舒則寬舒同時之逼側則逼側同公詩有逼側行獨帆如飛鴻二州豪俠埸人馬皆自雄一請甘飢寒再請甘養蒙洙曰養蒙欲其晦迹以自全也君不見簡蘇徯君不見道邊廢棄池君不見前者摧折桐百年死樹中琴瑟洙曰蔡雍取㸑下桐為琴趙曰異苑載吳平在勾章州門外匆生一株桐上有謡歌之聲平惡而斫其後桐自遷立於故根上又聞歌聲曰死樹今更青吳平尋當歸桐材所以為琴瑟今言死樹猶可為之譬士終有用也舊注所引者非一斛舊水藏蛟龍洙曰積水成淵蛟龍生焉趙曰以譬士當守所養也丈夫蓋棺事始定洙曰古詩蓋棺事乃巳言死而後巳也蘇曰劉毅丈夫兒蹤迹不可尋常便混羣小中蓋棺事方定矣君今幸未成老翁趙曰魏文帝與吳質書云巳成老翁但未白頭耳何恨憔悴在山中深山窮谷不可處霹靂魍魎兼狂風洙曰兼一作并一作因蘇曰鮑休清溪賦霹靂破石狂風驚林贈李白二年客東都所歷猒機巧彥輔曰東都洛陽也前漢地理志周人之失巧偽趍利余曰葛屨詩其民機巧趍利野人對羶腥彥輔曰潘嶽秋興賦序僕野人也杜亦自謂為郊野人耳周禮注犬腥羊羶離騷九章曰腥臊並御芳得薄兮𬞞食常不飽趙曰此意似雖日見羶腥之物而其食猶未厭乎藜藿所以對之而增愧則甫之貧困無資可見矣豈無靑精飯使我顔色好洙曰梁書安成康王秀傳兩韓之孝友純深庾郭之形骸枯稿或豫飯菁羹惟日不足或葭牆艾席樂在其中田曰陶隱居登真隱訣載太極真人靑精乾石䭀飯注云以南燭草煮汁漬米為之彭祖云大宛有青精光生淸靈真人真誥云霍山有道士鄧伯元者受靑精石飯之法苦乏大藥資修可曰丹書怉丹山人大藥證云夫大藥者須錬砂中録能取鉛裏金黃芽為根蒂水火錬功深彥輔曰洞仙傳晉中興以來名山道士合大藥得仙者甚衆山林迹如掃洙曰魏文帝遊仙詩與我一丸藥光耀有五色服藥四五日胸臆生羽翼趙曰四句通義離為兩端則語意不相接蓋詩人不以文害辭以靑精飯可謂之大藥矣真誥云霍山有道者鄧伯元受靑精石飯之法內見五臟色如嬰孺豈不謂之大藥乎而靑精飯法其所用之物如以南燭草木葉煮取汁浸漬稻米炊之張君房云青稻米如豫章西山靑米吳越靑龍稻草是也此亦費尋討不以謂之大藥資乎彥輔曰北山移文曰乍低枝而掃迹師曰李白將為梁宋之遊甫作此詩贈之東都洛陽也唐初都長安後都洛陽東都自安史再陷之後民物貧窘故幾巧趍利風俗浮薄甫二年客居于此覩兹機巧之俗甚厭惡之傷昔日之不然也羶腥謂兵後東都居民肝䐉塗地風揚羶腥之氣野人甫自稱也𬞞食不飽謂物踊貴青精神仙之所服食有黃精有靑精色黃者為黃精色靑者為靑精亦若天黃地黃人黃也本只是一種根浮于上者為天黃沉于下者為地黃生于中者為人黃靑精食之既久能益人顔色長年却老藥有大有小仙亦有小大也有天仙有地仙藥有丹砂黃金為藥之上者故云大藥甫既客居東都無大藥之資將隱于山林求靑精食之亦可以駐顔色奈何山林人迹如掃謂兵火之後絶無人煙故也蓋歎東都之不可居李侯金閨深鮑曰白嘗供奉翰林故云洙曰江文通别賦金閨之諸彥蘭臺之群英注金閨金馬門也謝玄暉出尚書省詩既通金閨籍彥輔曰按李陽冰作白集序云天子賜金閨脫身事幽討鮑曰本傳白自知不為親近所容求還山帝賜金帶放還趙曰李白宜通籍金閨以不得遂浮遊四方此為事幽討也彥輔曰漢項羽問張良曰沛公安在曰脫身去間至軍白就從祖陳留採訪使彥允請北海髙天師授道籙亦有梁宋遊洙曰任彥升令云客遊梁朝則聲華籍甚顔延年北使洛塗出梁宋郊鮑曰白時得還與公同在洛將適梁宋也後在梁亦與公同遊故遣懷詩云昔我遊關中得梁孝王都憶與髙李輩論交入酒爐趙曰梁謂汴州今之東京宋謂宋州今之南京也鄭曰梁古犬梁今汴京也宋古𣏌國今應天府是也方期拾瑶草江淹香爐峯詩瑶草正翕赩玉樹信蔥靑江淹曹植詩徙倚拾蕙草蘇曰東方朔與友人書曰不可使塵網名韁利鎖怡然長嘯脫去十洲三島相期拾瑶草吞日月光華共輕舉爾尹曰江文通别賦惜瑶草之徒芳李善注曰髙唐賦序云我帝之季女名曰瑶姬未行而亡封于巫山之臺精神為草實曰靈芝山海經曰姑瑶之山帝女死焉名曰女尸化為瑶草其葉胥成其華黃其實如兔絲服者媚於人趙曰瑶草事雖出於山海經姑瑶之山帝女死焉化為瑶草服之者媚於人而瑶草字江淹登廬山詩瑶草正翕赩别賦云惜瑶草之徒芳蓋以仙境之物美言之耳今子美正承江淹而用之也彥輔曰沈佺期詩意欲拾靈草師曰漢時凡待詔者必於金馬門美生曰彥李白嘗侍詔翰林故云金閨彥幽討謂窮討幽趣梁宋即今之東京開封府是也本魏地號曰大梁其地有香爐峰神仙所居之迹瑶草乃珊瑚樹之類仙家用以合丹藥服餌時李白擺脫翰林之職將以窮討幽趣故為梁宋之遊拾瑶草以服食蓋白之為人放曠不樂仕宦有意於神仙後以入水捉月或者以為戶解戲簡鄭廣文虔兼呈蘇司業源明廣文到官舍洙曰廣文事是醉時歌繫馬堂階下洙曰繫一作置醉即騎馬歸趙曰山簡傳日暮倒載歸酩酊無所知時時能騎馬倒著白接㒿也頗遭官長罵才名三十年坐客寒無氊趙曰唐史稱鄭虔在官貧約淡如也乃引杜甫嘗贈以詩曰才名三十年坐客寒無氊則知公之作真詩史矣近有蘇司業時時與酒錢洙曰與一作乞鄭曰乞丘既切又作與師曰虔始為廣文館學士性嗜酒不治事數為官長所訶怡然不以為意祿山反陷于賊受祿山偽署後竄歸坐免官故至貧窶惟蘇源明重其才時時給餉之杜詩云得錢即相覔沽酒不復疑蓋謂此也戲贈友二首元年建巳月洙曰肅宗去上元三年年號止稱元年月以斗建辰為名也師曰肅宗止稱元年復以月建之辰稱月蓋法上古之制也年號自漢武帝方有之甫特於此年以元年建巳月為稱記肅宗之立上古制不然何以謂之詩史乎郎有焦校書自誇足膂力能騎生馬駒一朝被馬踏脣裂板齒無壯心不肯巳欲得東擒胡趙曰公使魏武帝樂府云老驥伏櫪志在千里烈士暮年壯心不巳師曰胸腸之間曰膂生馬駒其馬未調習者板大齒也仲尼嘗譏子路暴虎慿河死而無悔謂其好勇故也此詩雖云諧戲亦為好勇者之戒元年建巳月官有王司直馬驚折左臂骨折面如墨洙曰國語望之如墨駑駘漫染泥何不避雨色師曰觀此詩有何不避雨色之句蓋為躁進者之戒云勸君休歎恨未必不為福洙曰此詩所諷近白居昜新豐折臂翁趙曰淮南子云塞上翁馬亡入胡人皆弔之曰何知非福居數月其馬引胡駿馬而歸人皆賀之曰何知非禍及家冨馬良其子好騎墮而折躰人又弔之曰何知非福居一年胡人大入丁壯戰死者十九其子獨以跛故父子得獲相保舊注引居易新豐折臂翁穿鑿矣分門集注杜工部詩卷之十七
