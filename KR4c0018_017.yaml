seq: 17
front:
  text: 曰杜言儒冠栖栖不偶於丗不如世胄綺紈飽食終身師曰杜甫生於睿宗先天元年死於代宗大曆五年年五十有九歷睿宗玄宗肅宗代宗凡四朝也天寶十三年獻三賦玄宗命宰相試以文章授河西尉不行天寶十四年安祿山亂甫挈家避亂郟州陷賊中肅宗至德二載脫身歸鳯翔府上謁肅宗肅宗授以左拾遺當是時房琯以宰相總兵與賊戰琯儒者用春秋車戰之法為賊所敗由是得罪甫上疏論琯不宜廢肅宗怒貶甫為華州司功甫既不得志聞李白在山東將為山東之遊遂作此詩辭韋左丞明巳無罪而去觀甫嘗有憶李白詩之句何時一樽酒重與細論文蓋謂此行為尋李白故也紈袴貴遊子弟之服餓之義有二絶粒曰餓不食祿亦曰餓若伯夷叔齊餓于首陽采薇而食不食周祿正此餓也當祿山之亂武夫悍卒皆以軍功取封侯其子弟從自襁褓至于老死誰有不食祿者獨文儒之士不能擐甲出戰皆寂寥不見用以此誤身者多矣甫嘗有詩曰儒衣山鳥怪蓋軍興之際山鳥見儒衣猶且怪駭甫於此時唯以文儒為務得不誤身乎蓋嘆武夫得志傷吾道之不用也丈人試靜聽賤子請具陳洙曰易師貞丈人吉注丈人嚴莊之稱也應璩百一詩避席跪自陳賤子實玄虛鮑昭東武吟主人且勿喧賤子歌一言趙曰吳越春秋載伍子胥謂漁父曰性命屬天今屬丈人此乃杜公呼為丈人者矣具陳見蜀志許靖與曹公書有云豈可具陳而丗有託名東坡事實輒云毛遂有言賤子一一具陳之以為渾語却不引出何書其全秩引類皆如此非特浼吾杜公又浼蘇公而罔無識真大難之厄學者之不幸也師曰丈人尊長之稱指韋丈也賤子謙辭甫自稱也甫欲韋又靜聽故具陳其所以不遇之意甫昔少年日洙曰少一作妙賈誼洛陽年少定功曰沈休文别范安成云平生少年日早充觀國賔洙曰易觀國之光利用賔于王彥輔曰杜嘗策名薦書也師曰甫天寶十三年獻三賦召試文章故云云讀書破萬卷下筆如有神洙曰魏文帝典論云傅武仲下筆不能自休孔文舉表性與道合思若有神吳質曰摛藻下筆鸞龍之文奮矣蘇曰仲舒答䇿下筆疑有神助趙曰梁孝元帝之敗焚圖書十四萬卷曰讀書萬卷猶有今日故焚之中著一破字則字著力而新竒矣賦料揚雄敵蘇曰司馬長卿賦時人皆稱典而麗雖詩人之作不能多也揚子雲曰長卿之賦不似從人間來其神化所至即子雲學長卿為賦故雅推服趙曰雄傳曰顧嘗好辭賦每擬相如故公於賦則言敵揚雄詩看子建親洙曰左太沖詠史詩曰弱冠弄柔翰卓犖觀群書著論準過秦作賦擬子虛又詩言論準宣尼辭賦擬相如揚雄有長楊甘泉等賦子建曹植也黃曰曹植字子建封陳思王善屬文著洛神賦責躬公宴等詩後人謂天下才共一石子建獨得八斗趙曰鍾嶸為詩品其品子建詩云植詩原出於國風氣骨髙竒辭彩華茂超越今古卓爾不羣故公於詩言親子建也親字親近之親親子建者言與之近也彥輔曰杜於詩賦蓋以二人為凖李雍求識面洙曰李雍見文苑傳廣陵江都人父善嘗注文選雍少知名長安李嶠等薦雍詞髙行直堪為諌官由是召拜左拾遺玄宗東封獻賦稱旨能文養士賈生信陵之流後進不識京洛阡陌聚觀以為古人或傳眉目有異衣冠望風尋訪門巷又中使臨問索其新文性豪侈不護細行尢長碑頌中朝衣冠多持金帛往求其文修可曰識面字如北史齊神武自太原來朝見宋遊道曰常聞其名今日始識其面王翰願卜鄰洙曰卜一作為唐文苑傳王翰并州晉陽人少豪蕩不羈櫪有名馬家有妓樂翰發言立意自比侯王日聚英豪從禽擊鼓恣為歡賞文士祖詠杜華嘗在座趙曰李雍王翰唐文苑一時之文人也以李雍而有識面之求以王翰而有卜鄰之願則公之名重於時可知彥輔曰左傳曰惟鄰是卜師曰破萬卷謂識破其理如中庸曰君子之道語大天下莫能載語小天下莫能破大抵人誰不讀書識破其理者寡矣故孔子曰默而識之甫既識破萬卷之理縱橫妙用無施不可故下筆之際如有神異漢揚雄嘗作甘泉等賦魏曹子建其兄常欲殺之子建七步成詩曰煮豆燃豆箕豆向釡中泣本是同根生相煎何太急甫以揚雄之賦與巳相敵躰以子建之詩但親近於已是甫以詩才自負謂子建所不若也唐李雍有才名後進想慕求識其面以至道塗聚觀傳其眉目有異唐王翰文士也杜華嘗與遊從華母崔氏云吾聞孟母三徙吾今欲卜居使汝與王翰為鄰蓋愛其才故也甫以文章知名當丗士大夫皆想慕之故以李雍王翰自比自謂頗挺出洙曰出一作生彥輔曰一作特立登要路津洙曰古詩何不策髙足先據要路津致君堯舜上再使風俗淳洙曰伊尹致君堯舜又魏杜恕舉明主於唐虞之上修可曰魏應璩與從弟君胄書云思致於有虞此意竟蕭條行歌非隱淪洙曰前漢朱買臣家貧好讀書不治産業艾薪樵賣以給食擔束薪行且誦書其妻亦負戴相隨數止買臣母歌謳道中買臣益疾歌妻羞之求去恚怒曰如公等餓死溝中耳何能冨貴買臣不能留即聼去其後買臣獨行歌道中負薪墓間宋顔延年詠嵇中散詩曰立俗遷流議尋山結隱淪謝眺敬亭詩隱淪既巳託鮑昭詩孤賤長隱淪謝靈運既枉隱淪客趙曰列子載林類年且百歲拾穗行歌張湛注云古之隱者也舊却引朱買臣行歌道中負薪乃窮困悲歌耳與非隱淪之義不相接隱淪字出桓談新論曰天下神人五一曰神仙二曰隱淪師曰揆者特也路與津者衝要之所乃人物輻湊之地以譬則逹官也官有清有要淸而不要則無歡要而不淸則拘於俗既淸且要乃為美官甫方召試文章以淸要自期必謂時出登于要路津豈期授以河西尉故此意寥寂不獲致君與澤民也隱淪者隱逸之士也甫既不見大用辭河西尉又不能隱居林下其貧賤如朱買臣負薪行歌於路必為隱淪之徒所非議矣昔孔子不遇見非於長沮桀溺晨門荷蓧之徒亦若此爾騎驢三十載洙曰任昉詩結歡三十載生死一交情陶潛間居三十載彥輔曰後漢獨行傳向相或騎驢入市乞丐於人杜自言不遇蓋一丗矣定功曰後漢李尤有騎驢馳村狐兔驚走旅食京華春定功曰言貧困騎驢三十載矣而畢竟乃旅食長安此自傷之意耳魏文帝與吳質書旅食南館耳彥輔曰郭璞詩曰京華豪俠窟朝扣冨兒門鄭曰朝陟遙切早也下去苟切擊也又苦侯切義同趙曰鮑昭詩結交多貴門山入冨兒鄰是也暮隨肥馬塵殘杯與冷炙洙曰顔氏家訓云禮曰君子無故不徹琴瑟古來名士多所愛好者梁初衣冠子孫不知琴瑟大同以未斯風頓盡然而此樂音雅致有深味哉今丗曲解雖變於古猶足以暢神情也唯不可令有稱譽見役勳貴處之下座以取殘杯冷炙辱戴安道猶遭之况爾曹乎蘇曰吳起嘗嘆曰丈夫兒事未濟甘晦休山林焉能逐浮薄子苟冷炙殘杯焉到處潛悲辛修可曰鮑昭野鶴賦對鍾鼓之悲辛師曰驢賤者所乘也得志則乘髙車大馬貧賤則跨驢而巳昔李白以文章待詔翰林後放逸不撿遂流落不用嘗為華隂令所辱令致對云曽遇龍巾拭吐御手調羹天子殿前尚與吾走馬華隂縣裏不許我騎驢初貴故走馬後貧賤故出騎驢甫既辭河西尉貧在京師自未獻賦之前逮今凡三十年矣獻賦時年四十三京華者言京師乃繁華之地當春月貴遊相追逐繁絃脆管無處不有甫獨旅食于此其寂寞可知故朝扣冨兒門拯刺求見暮則隨其後塵為當朝士夫所薄如此殘杯謂甕之餘者香巳埋歇柔肉曰炙冷炙謂宿炙也甫既貧賤糊口京師貴遊薄之惟待我以殘杯與冷炙深使人暗地抱辛酸也主人頃見徴彥輔曰漢雜事宣帝蔣蒲與子方召見徴歘然欲求伸洙曰易曰尺蠖之屈以求伸靑冥却垂翅蘇曰李斯曰丈夫兒提筆鼓吻取冨貴易若舉杯何靑冥之翮與鷃共垂翅乎修可曰祖出屈原悲回風云據靑冥而攄虹王逸九思玄鶴兮髙飛增逝兮青冥注靑冥雲也洙曰後漢馮異傳始雖垂翅終能奮翼龜池蹭蹬無縱鱗洙曰王褒聖主得賢臣頌曰沛乎若巨魚縱大壑海賦蹭蹬窮波失勢貌甚愧丈人厚甚知丈人真洙曰易卦注丈人莊嚴趙曰厚言其相待之厚如後漢云所以慰藉之甚厚真言其懷抱之真蓋如莊子其為人也真每於百寮上尹曰史相國位諸侯王百寮之上猥誦佳句新洙曰杜詩云為人性癖耽佳句語不驚人死不休修可曰按南史謝惠連傳族兄靈運嘉賞之云每有篇章對惠連輒得佳語趙曰誦佳句於同寮是時公巳召試賜官也彥輔曰佳句公自謂也竊效貢公喜洙曰貢公貢禹也前漢王吉傳吉字子陽與貢禹為友丗稱王陽在位貢禹彈冠言其取舍同也師古曰彈冠者且入仕也修可曰劉孝標廣絶交論曰王陽登而貢公喜趙曰舊所引雖是然無喜字亦不謂之貢公此乃劉孝標廣絶交論王陽登而貢公喜是也難甘原憲貧洙曰仲足弟子傳原憲在草澤中子貢相衛而結駟連騎排藜藿入窮閻過謝原憲攝敝衣冠見子貢子貢恥之曰夫子豈病乎原憲曰吾聞之無財者謂之貧學道而不能行謂之病若憲貧也非病也子貢慙而不懌而去終身恥其言之過也焉能心怏怏鄭曰怏於亮切不足也洙曰韓信傳信知漢王畏惡能其稱疾不朝由此怨望居常怏怏羞與絳灌等列師古曰怏怏志不滿周亞夫傳此怏怏非少主臣也趙曰心怏怏出吳越春秋吳王僚之母謂王曰公子光心氣怏怏常有愧恨之色舊却引韓信周亞夫鞅鞅字又不連心字非公本意所引用耳秪是走踆踆鄭曰踆也倫反洙曰踆踆行走貌張平子西京賦犬踆踆今欲東入海洙曰語曰乘桴浮于海又曰少師陽擊磬襄入于海也趙曰此詩人欲去之意造語如此非真有東海之役也即將西去秦洙曰李斯上秦始皇書今乃却賔客以棄諸侯使天下之士退而不敢西向褁足不入秦此所謂藉寇兵而齎盜糧沈曰秦州君西戎地春秋時為秦國後并天下為隴西郡彥輔曰此蓋子美欲去京師由梁齊也尚憐終南山洙曰周庾信有駕幸終南山詩地理志稱扶風武功縣東有大山古文以為終南昭四年左傳曰荆山中南九州之險是周地之名山鄭曰福地記云其山東接驪山太華西連大向隴山北去長安八十里南入楚塞連蜀東西數百里亦曰中南回首淸渭濵洙曰吕望垂釣於渭水得玉璜遂為帝師修可曰潘安仁西征賦言長安之境曰南有玄霸素滻北有清渭濁涇故公凡言渭必曰清渭言涇必曰濁涇皆用此矣彥輔曰孔子去魯遲遲其行孟子三宿而後出畫此可以見子美之志常擬報一飯洙曰史記范雎傳睢為將軍於是散家財物盡以報所嘗困厄者一飯之恩必償睚眥之怨必報李固傳切感古人一飯之報注謂靈輒也孔融一飯之惠必報况懷辭大臣趙曰以一飯之恩嘗欲如靈輒之報宣子況大臣相知不獨一飯耳其去之懷為如何白鷗波浩蕩洙曰波一作沒鄭曰蕩徒朗切蘇曰波乃沒字也古詩云沒白鷗之浩蕩若作波字乃上下句不相符信沒字耳宋敏求云鷗不善沒改作波殊不知鷗之滅沒於煙波間最為自然善舊本作沒禽經云鳬善浮鷗善沒當以沒字為是萬里誰能馴鄭曰馴松倫切洙曰顔延年詠嵇中散詩曰鸞翮有時鍛龍性誰能馴離騷曰怨靈修之浩蕩鮑昭詩翻浪揚白鷗謝眺詩浩蕩别親知潘嶽河陽詩洪流何浩蕩夢符曰右按列子海上之人好鷗鳥者每旦之海上從鷗鳥遊其父曰吾聞鷗鳥皆從汝遊汝取來吾玩之明日之海上鷗鳥舞而不下也趙曰浩蕩雖本水而不必專言水或取流放之貌如離騷云怨靈修之浩蕩或取曠逺之貌如楚辭曰志浩蕩而傷懷是也丗間本多作波字東坡定作沒字言鷗滅沒於煙波間而浩蕩逺去尤有義理而宋敏求謂鷗不解沒則波字便覺一篇神氣索然也范淑衷甫云丗有師曠禽經之書其中曰鳬善浮鷗善沒則沒字却是沉沒之沒即與前説又相反矣彥輔曰按唐末有周後人翊聖者撰托言乃以杜此篇與莫相疑行謂之自負嗚呼若人者曷足以語杜詩哉韓退之云尚何自負之有如殘杯冷炙之謂歟故老子曰不笑不足以為道又曰下士聞道大笑之不當曰李杜文章在光熖萬丈長不知群愚兒何用故謗傷蚍蜉撼大樹可笑不自量余以退之為知言師曰主上謂肅宗也至德二載肅宗見徴徴召也召授左拾遺歘即倐忽歘然如屈蠖久蟄志欲求伸甫當此時謂得所施為遂上疏論房琯事不期貶華州司功故云青冥却垂翅蹭蹬無縱鱗青冥天也蹭蹬失勢之貌青天可以飛騰今反垂翅巨魚可以縱壑今反蹭蹬蓋傷其得罪也唯韋丈與甫相厚善而知甫為人真率故及于此韋丈愛甫蓋重其詩才每於百寮之上謂於宰相前常稱誦其佳句故有拾遺之擢當此時喜得韋丈推引故效貢公之喜得王陽在位也今乃復見貶黜貧賤又如原憲誠使人所難甘矣雖然如是亦安能怏怏於朝廷秖是不免奔走託食於他鄉也韓信既謫為淮隂侯常怏怏不樂意在怨君甫則不然踆踆奔走之狀山東慿海之郡唐都長安長安即秦地甫欲適山故云東入海秦地在西甫既適東必離去于西秦故云西去秦終南山與渭水皆秦地山水甫將東入海尚眷眷於終南清渭者不忍棄君而去也自古忠臣身在畎畒心不忘君一飯之恩猶擬報之矧夫身為拾遺巳嘗食人之祿其忍遽忘于君詩家獨推重杜詩蓋取其不忘君之意也大臣謂左丞也左丞與甫厚善其判别之情得無懷思乎雖然如是甫之無官守言責其進退綽綽然有餘𥙿真若鷗在浩蕩之波去來自得誰能馴狎哉浩蕩廣大之貌王荆公嘗以波字為沒字其謬甚也鷗善浮沒何必獨言沒耶如前輩諸公因舉杜詩身輕一鳥過之句坐間皆忘過字因共輔之或言下或言疾竟不似過字之為渾成也則知沒浩蕩亦不如波浩蕩之自然
