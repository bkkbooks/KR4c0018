  text: 分門集注杜工部詩卷之二十四
  hash: sha256:83d927f9a7bfefdf78eea6b03b9de7ade724260c5f25d00cafc6f056540872ff
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_024-1a}
body:
  text: 花草竹木花古詩律詩共十六首早花新添西京安穩未不見一人來臘月巴江曲山花巳自開盈盈當雪杏艷艷待香梅直若風塵暗誰憂客鬢催花底新添紫萼扶千蘂黃鬚照萬花忽疑行暮雨何事入朝霞恐是潘安縣堪留衛玠車蘇曰潘嶽為河陽令植桃李花人號曰河陽一縣花衛玠在群伍中有異所至看者如堵號為璧人常乘白羊車深知好顔色莫作委泥沙風雨看舟前落花戲為新句趙曰此全篇言落花江上人家桃李枝春寒細雨出踈籬影遭碧水潛勾引鄭曰勾古侯切趙曰古樂府薄命篇云艷花勾引落風妬紅花却倒吹吹花困癲旁舟楫水光風力俱相怯趙曰庾信畫屏風詩水光連岸動劉孝儀渡吉陽州詩曰噪鼓揚風力赤憎輕薄遮入懷趙曰赤憎方言也公嘗云輕薄桃花逐水流是巳遮之為言輒也如遮莫鄰雞下五更之遮珍重分明不來接洙曰一作折蘇曰劉公幹居鄴下一日桃花爛熳值諸公子進賞久之遂去公幹問僕曰損花乎僕曰無但愛賞而巳公幹曰珍重輕薄子不來損折使老夫酒興不空也遂飲花下作放歌行見玉堂别集濕久飛遲半欲髙縈沙惹草細如毛蜜蜂胡蝶生情住偷眼蜻蜓避百勞師曰是時甫在舟中覩江上佳景春風細雨碧水紅花相映帶不勝喜樂因戲為新句以歌詠之雖眼前之事皆可樂然猶有輕薄可憎者但惟珍重謝之分明不來相接以至從物猶能縈沙惹草蜂蝶尚生情性况人而不能無動情乎蜻蜓避百勞百勞惡鳥恐為所害言人豈不如蜻蜓尚能全身遠害乎江梅趙曰江邊之梅也如在嶺曰嶺梅在野曰野梅官中所種曰官梅而後之學者凡見梅便謂之江梅梅蘂臘前破梅花年後多絶知春意早最奈客愁何雪樹元同色江風亦自波故園不可見巫岫鬱嵯峨洙曰陸幾樂府云山鬱嵯峨潘安仁崇岡鬱嵯峨陸又云崇山欎嵯峨和裴迪登蜀州東亭送客逢早梅相憶見寄東閣官梅動詩興還如何遜在楊州洙曰梁書何遜傳不見楊州事蘇曰梁何遜作揚州法曹廨舍有梅花一株花盛開遜吟詠其下後居洛思梅花再請其往從之抵揚州花方盛遜對花倣徨終日此時對雪遙相憶送客逢春可自由洙曰春一作花幸不折來傷歲暮若為看去亂鄉愁洙曰鄉一作春江邊一樹垂垂發蘇曰吳防雪梅賦照寒溪之艷艷帶冷雪之垂垂想子美雪中見梅作也今梅花中用垂垂字但可雪中梅花即用之朝夕催人自白頭江頭五詠彥輔曰王筠有才名沈約重之約於郊居作齋閭請筠為草木十詠書之於壁皆直寫之辝不加篇題約曰此詩指物呈形無假題署丁香丁香躰柔弱亂結枝猶墊鄭曰都念切下也洙曰尚書注墊溺也細葉帶浮毛踈花披素艷深栽小齋後庶近幽人占晚墮蘭麝中休懷粉身念洙曰言丁香結實則墮於蘭麝間而有粉身之患也麗春百草競春華麗春應最勝少須好顔色多漫枝條剩紛紛桃李枝處處惣能移如何貴此重洙曰一作稀如何貴重却怕有人知梔子魯曰漢書曰梔茜園注梔支子也本草曰支子一名木丹晉宫閣名曰華林囿者梔子五株名山志曰樓石山多梔子齊謝眺有墻花梔子樹詩梁簡文帝有詠梔子花詩梔子比衆木人間誠未多於身色有用洙曰蜀人取梔子色以染帛與道氣傷和洙曰梔性絶令紅取風霜實洙曰實經霜則紅青看雨露柯無情移得汝貴在映江波江畔獨步尋花七絶句江上𬒳花惱不徹無處告訴只顛狂走覔南鄰愛酒伴經旬出飮獨空牀洙曰斛斯融吾酒徒稠花亂蘂畏江濵洙曰畏一作褁行步欹危實怕春詩酒尚堪驅使在未須料理白頭人江深竹靜兩三家多事紅花映白花報答春光知有處應須美酒送生涯東望少城花滿煙洙曰梁益記云少城張儀城蒼舒曰右按左太沖蜀都賦亞以少城接乎其西市㕓所舍賈商之淵則遂百里羅肆巨千賄貨山積纎麗星繁注少城小城也在城西市在其中百花髙樓更可憐誰能載酒開金盞洙曰盞一作鎖揚雄以免復召大夫家素貧嗜酒人希至其門時有好事者載酒從遊學喚取佳人舞繡筵黃師塔前江水東春光懶困倚微風桃花一簇開無主可愛深紅愛淺紅洙曰下愛字一作映黃四娘家花滿蹊千朵萬朵壓枝低留連戲蝶時時舞自在嬌鶯恰恰啼蘇曰齊魯大臣史失其名黃四娘者獨何人哉因託是詩以不朽不是愛花即欲死只恐花盡老相催繁枝容易紛紛落嫩葉商量細細開洙曰葉一作蘂歎庭前甘菊花洙曰此詩譏小人在位賢人失所也簷前甘菊移時晚洙曰簷一作階趙曰菊以移晚而花遲故為失所爾青蘂重陽不堪摘明日蕭條盡醉醒殘花爛熳開何益籬邊野外多衆芳采擷細瑣升中堂鄭曰擷突結切捋取也洙曰芣莒薄言采之薄言擷之趙曰此詩蓋刺餘子碌碌皆得貴近言芳則非不謂之才也特細瑣而已言升中堂則貴近之意公之言傷時細碎微瑣者用而出類者廢也念兹空長大枝葉結根失所纏風霜洙曰古詩結根太山阿薖曰南史劉彥節子㑨詩城上草植根非不髙所恨風霜早趙曰言枝葉長大如人文采之秀發而託根不得地反為風霜所埋也師曰甘谷名漢武帝西置甘涼瓜沙等州其谷産菊可以入藥移晚謂失其時也盡醉醒者人盡泛菊而醉唯我無菊可泛但醒而巳殘花雖開巳無况味夫復何益此正與屈原不遇其時而云舉出皆醉唯我獨醒同意甘菊喻君子衆芳細瑣以喻小人君子不遇時不見采擢小人反獲起升登于廟堂之上此與隰桑詩小人在位君子在野無異也然賢者所􅉼飬雖大奈何結托不得其人故至於失所而盡沒乎風霜甫作此詩觀其辝意含蓄其情可知矣草古詩律詩共三首除草洙曰去􅣪也蘇曰􅣪草蜀中謂之毛􅣪毛芒可畏觸之如蜂蠆治風疹以此草點之一身失去葉背紫者入葉􅣪山韭也草有害於人曽何人阻修洙曰言草之毒者不必生於阻修之處雖平夷之地亦有之也髙曰阻修謂修逺險阻之地其毒甚蜂蠆洙曰左傳猶蜂蠆有毒蘇曰梁凖小人之言行甚於蜂蠆蜂蠆尚可去小人不可去故也趙曰蓋􅣪之上皆芒刺觸之能螫人也其多彌道周洙曰道周道兩傍也淸晨步前林江色未散憂芒刺在我眼朱曰霍光驂乘上內嚴憚之若有芒刺在背蘇曰馬援見諂佞輩如芒刺在眼中師曰草喻小人彌道周喻居王之左右君子疾之如芒刺在眼求其去之之術焉能待髙秋霜雪一霑凝洙曰一作衣蕙葉亦難留師曰春以喻賞秋以喻罰焉能待髙秋急於去小人也蘭蕙香草以此君子今與蘋草同殺喻政刑無辨善惡莫分荷鋤先童稚洙曰陶徴君荷鋤稚有倦劉曰先者以身率日入仍討求修可曰莊子日入而息轉致水中央晏曰禮剃人掌殺草有水火之化以釣舟載而致之水此水化也豈無雙釣舟頑根易滋蔓洙曰左傳無使滋蔓敢使依舊丘洙曰鮑明逺復得還舊丘師曰小人立黨其黨滋盛敢使依舊丘謂小人不可近也自兹藩籬曠更覺松竹幽洙曰草去則幽芳之物伸矣此詩有所傷而云芟荑不可闕疾惡信如讎洙曰隱六年傳周任有言曰為國家者見惡如農夫之務去草焉芟荑藴崇之絶其本根勿使能殖則善者使信之矣師曰松竹有操君子自守之象小人既去則君子道長而松竹得遂其生飬之性也此篇大有含蓄詳玩之頗有味矣庭草楚草經寒碧庭春入眼濃舊低收葉舉趙曰言舊低舉附而收斂之葉以春而舉也新掩捲牙重趙曰言新掩蔽而韜卷之牙以春而重也步履冝輕過開筵得屢供看花隨節序不敢強為容蒹葭摧折不自守洙曰生質衰脆不能自守秋風吹若何暫時花載雪墮木葉沉波洙曰言非歲寒之質也體弱春苗草叢長夜露多江湖後搖落亦恐歲蹉跎洙曰亦一作只竹律詩三首嚴鄭公宅同詠竹得香字為韻緑竹半含籜洙曰謝靈運詩𥘉篁包緑籜新梢才出墻色侵書帙晚隂過酒樽涼雨洗娟娟靜風吹細細香但令無翦伐會見拂雲長洙曰此詩公之措意極為深逺以意逆志觀者當自知矣從韋二明府續處覔錦竹三數叢華軒藹藹它年到錦竹亭亭出縣髙江上舍前無此物幸分蒼翠拂波濤蘇曰阮籍居家有竹欲分蒼翠但數箇而巳粗欲輔闕也師曰華軒則言韋明府下車來種錦竹巳成矣故就韋乞苦竹青冥亦自守軟弱強扶持鄭曰強其兩切洙曰猶強自振立也味苦夏蟲避叢卑春鳥疑軒墀曽不重剪伐欲無辝洙曰欲一作亦幸近幽人屋蘇曰崔浩菜賦種近幽人之屋藏當野客之窗霜根結在兹洙曰言此竹質雖疲軟然得其所託亦足以保其生矣趙曰言在幽人之家方有保護結根之理木古詩七首律詩八首古柏行洙曰傷有其才而不得用也孔明廟前有老柏洙曰見武矦廟注前一作階廟在成都先主廟西院柯如青銅根如石霜皮溜雨四七圍黛色參天二千尺洙曰曹子建荆棘上參天蘇曰古制以圍三徑即一圍者三尺也沈存中謂霜姿溜雨四十圍黛色參天二千尺四十圍乃是徑七尺元乃太細長也黃朝英謂若以古制論之當有百二十尺圍有百二十尺即徑四十尺安得云七尺也若以人兩手大指頭相合為一圍則一圍是一小尺即徑一丈三尺三寸又安得云七尺也孔明廟前柏當以古制為定趙曰孔明為蜀相成都則先主廟而武矦祠堂附焉夔州則先主廟武侯廟各别令詠柏專是孔明廟而巳豈非夔州柏乎公詩集中其在夔也屢有孔明廟詩於夔州十絶云武侯祠堂不可忘中有松柏參天長以絶句證之則此乃夔州之詩明矣正敏曰沈內翰譏子美此句以謂四十圍配二千尺為太細長不知子美之意但言其色事巳猶言其翠色蒼然仰視髙逺有至於二千尺而幾於參天也若如此求疵則二千尺固未足以參天而詩人謂駿極于天者更為妄語善論詩者正不應尓君臣巳與時際會洙曰蜀先主孤之有孔明如魚之有水也樹木猶為人愛惜洙曰宣九年思其人猶愛其樹况用其道而不恤其人乎劉歆曰思其人猶愛其樹况宗其道而毁其廟乎雲來氣接巫峽長洙曰冝都山川記曰巴東三峽巫峽長月出寒通宣山白尹曰范元實云形似之言蓋若詩人之賦蕭蕭馬鳴悠悠斾旌是也激昂之言蓋若詩人之興周餘黎民靡有子遺是也古人形似之言必實録是事決不可易故老杜所題詩往往親到其處益知其工激昂之言孟子所謂不以文害辝不以辝害志𥘉不可以形迹考然如此乃見一時之意如古柏詩柯如青銅根如石視之信然雖聖人復生不可改此形似之語霜皮溜雨四十圍黛色參天二千尺雲來氣接巫峽長月出寒通雪山白此激昂之語不如此則不見古柏之大也文章故多端然警䇿處往往是此兩躰尓范蜀公云武侯廟柏才十丈而杜云二千尺以謂詩人好大其事沈存中又云蒼皮四十圍乃是七尺徑而長二百丈無乃大細長乎王立之云論詩正不當爾二公之言皆非也趙曰巫峽在夔之下巫峽之雲來而柏之氣與接雲山在夔之西雪山之月出而柏之寒與通皆言其高大者也憶昨路繞錦亭東先主武侯同閟宫洙曰詩悶宫有侐趙曰此乃追言成都先主廟之柏蓋杜公近方離成都而來夔故止可言憶昨也崔嵬枝幹郊原古窈窕丹青戶牖空趙曰上句又以言成都柏之亦老也盧獻卿夢人贈詩曰十築郊原古落落盤踞雖得地冥冥孤高多烈風洙曰七發冬則烈風之所激趙曰杜篤首陽山賦曰長松落落沈約高松賦曰鬱彼髙松栖根得地扶持自是神明力夢符曰右按孫興公天台賦嗟台嶽之所異挺實神明之扶持蘇曰劉禪自是神明扶持非人力能致正直元因造化功大厦如傾要梁棟洙曰大厦將顛尹曰耿恭謂岑彭曰方今漢基頽圯英雄寒餓如大厦傾求天下之義士要為梁棟子何如此寒餓不乘時取萬戶侯復俟何時邪萬年回首丘山重鄭曰重去聲不露文章世巳驚未辭翦伐誰能送洙曰甘棠勿翦勿伐苦心豈免容螻蟻香葉終經宿鸞鳯趙曰謝靈運後漢書曰方儲遭母憂種松柏鸞棲其上志士幽人莫怨嗟古來才大難為用洙曰莊子吾有大樹人謂之樗其大本擁腫而不中繩墨立之塗匠者不顧今子之言大而無用衆所同去也蘇曰張華志士蓄怨幽人含嗟朝廷雖下哀詔誰肯出松蘿嵓穴四松四松𥘉移時大抵三尺強别來忽三歲離立如人長趙曰禮記離坐離立師曰甫詩云賤子且奔走二年望東吳則知甫去草堂及歸時凡涉三歲會看根不拔莫計枝凋傷幽色幸秀發趙曰王褒曄曄而秀發踈柯亦昂藏所插小藩籬本亦有隄防終然掁撥損鄭曰上直庚下比末切洙曰謂有所觸動也師曰道曰掁廢觸撼兒得愧千葉黃敢為故林主師曰甫傷兵亂民尚不保其故居况吾敢為故林之主而欲保四松之無損乎黎庶猶未康避賊今始歸春草滿空堂蘇曰嵆紹一日復一日篇云去日畫樓歌管沸歸來春草滿空堂詩語因即借句今杜工部往往全用古人語斯亦不害詩人之工也覽物歎衰謝及兹慰凄涼洙曰前詩有入門四松在清風為我起灑靣若微霜趙曰張茂言穆如灑淸風陸機連珠云秋風夕灑足以送老姿洙曰一云足為送老姿聊待偃蓋張趙曰抱朴子云天陵偃蓋之松我生無根蒂配爾亦茫茫有情且賦詩事迹兩可忘勿矜千載後慘淡蟠穹蒼病柏有柏生崇岡洙曰琴賦惟倚吾之所生兮託峻嶽之崇岡童童狀車蓋洙曰車一云青魏文帝西北有浮雲亭亭如車蓋陳琳柳賦象翠蓋之威㽔十明曰蜀志先主舍東南角籬上有桑樹髙丈餘遙望童童如小蓋往來者皆怪此樹非凡謂當出貴人先主少時與諸兒於樹下戲言吾必當乘此羽葆車蓋又齊書太祖宅有進武南有桑樹狀如車蓋上年數歲遊於其下從兄敬宗謂曰此樹為汝生也偃蹙龍虎姿洙曰神仙傳麒麟客有龍虎之姿主當風雲會洙曰乘風雲之會神明依正直故老多再拜蘇曰王褒歸蜀過寶稽父老遮路再拜餉以壷漿桃李餅餌之類豈知千年根中路顔色壞出非不得地蟠據亦髙大歲寒忽無慿洙曰歲寒然後知松柏之後凋日夜柯葉改洙曰禮器如松柏之有心貫四時不改柯易葉趙曰本有歲寒之姿今柏病之故云日夜顔色改也丹鳯領九雛哀鳴翔其外洙曰建康實録鳯將九雛再見於豐城衆鳥從之洞簫賦孤雌寡鵠娛優乎其下春禽群嬉翺翔乎其巔琴賦翔鸞集其嶺蘇曰東海何承天除著作年巳邁諸佐郎並年少荀伯呼為妳母承天云卿當言鳯凰將九子妳母何言耶鴟梟志意滿養子穿穴內洙曰詩有鴟梟篇客從何鄉來趙曰倣古詩客從何方來佇立久吁怪靜求元精理浩蕩難倚賴洙曰穿一作窟無精一作無根趙曰字出後漢元精所生王之佐臣師曰之罪耶物實有以侵之此詩寓意傷郭英乂也英父鎮成都為人端直蜀人重之不幸為崔旴所殺其諸孤哀泣若無所訴故有丹鳯領九雛哀鳴翔其外之句鴟梟惡鳥喻崔旰崔旰既害英乂竊據成都故有鴟梟志意滿養子穿穴內之句然正直之人神明祐之父老敬之今反罹其禍豈非歲寒無憑乎客甫自稱英乂在蜀甫為客以依之今既遇害是以為之吁怪細思天理茫茫不足倚賴蓋嘆禍淫福善之理若乖戾不可考信故也病橘洙曰此詩傷物天所而至於困悴也群橘少生意雖多亦奚為洙曰羣一作伊惜哉結實小洙曰一作少酸澀如棠梨剖之盡蠧蟲洙曰剖一作割采掇爽其冝洙曰其一作所詩芣苡薄言采之薄言掇之紛然不適口洙曰莊子柤梨橘柚皆可於口也豈止存其皮蕭蕭半死葉洙曰七發其根半生半死冬則列風飄霰飛雪之所激未忍别故枝玄冬霜雪積洙曰劉公幹自夏涉玄冬况乃回風吹嘗聞蓬萊殿蘇曰唐太宗蓬萊殿九月八日宴群臣酒行遍賜湖南新橘宰相以下有詩謝羅列瀟湘姿洙曰瀟湘有橘田橘洲丗説江南為橘江北為柚此物歲不稔玉食失光輝洙曰失一作少天子王食周禮共食玉謂入貢玉府也寇盜尚慿陵當君減膳時洙曰天子徹樂減膳汝病是天意師曰陵謂史思明未平天子嘗膽每遇凶年禍亂則必減食徹樂示自刻責今橘病不貢無乃天意使吾君減徹乎吾諗罪有司洙曰諗一作愁憶昔南海使奔騰獻荔枝百馬死山谷到今耆舊悲洙曰唐書貴妃嗜荔枝必欲生致之乃置騎傳送走數千里其味未變巳至京師也田曰漢和帝紀舊南海獻龍眼荔枝十里一置五里一堠奔騰險阻死者繼路時唐羌上書帝下詔曰逺國珍羞本以薦奉宗廟苟有傷害豈愛民之本敕太官勿復受獻謝承漢書云唐羌字伯遊辟公府補臨武長縣接交州舊貢荔枝龍眼驛馬晝夜傳送至有遭虎狼毒害頓仆死亡不絶道經臨武羌乃上書諫和帝曰臣不以滋味為德下不以貢膳為功故天子食太牢為尊不以果實為珍伏見交趾七郡獻生龍眼等鳥驚風發南州地土惡蟲猛獸不絶於路至有觸犯死亡之害死者不可復生來者猶可救也此二物升殿未必延年益壽帝從之羌即棄官還家不應徵修可曰公借其事以譏楊妃舊注引唐書其説非唐所負乃涪州荔枝由子午道而往非南海也趙曰此用獻荔枝事比之竒矣枯棕洙曰此詩傷民困於重斂也蜀門多棕櫚洙曰棕一作栟南都賦其木則棕櫚結根竦本垂條嬋媛布緑葉之萋萋敷華蘂之蓑蓑鄭曰櫚力居切栟櫚木名有葉無枝髙者十八九其皮割剝甚雖衆亦易朽徒布如雲葉青青歲寒後交橫集斧斤凋喪先蒲栁洙曰説文云楊柳即蒲也詩蒲栁之木二種一種皮正青一種皮紅布一作有夢符曰右按北史韋丗康與子弟書曰耄雖未及壯年巳謝霜早楸梧風先蒲栁又晉書顧悅之與簡文同年而髮早白帝問其故對曰松柏之姿經霜猶茂蒲栁之質望秋先零傷時苦軍之洙曰律乏軍興一物官盡取鄭曰取此苟切嗟爾江漢人生成復何有有同枯棕木使我沉歎久死者即巳休趙曰猶棕之既剝多而枯死也生者何自守洙曰何一作能趙曰猶棕之未剝者終復遭剝也啾啾黃雀啅鄭曰啅竹角切又作啄側見寒蓬走念爾形影乾鄭曰乾古寒切摧殘沒藜莠洙曰蜀人取棕皮以充用惟軍興誅求尤急師曰蒲栁之為物望秋先零棕其皮可用軍興之際割剝殆盡譬若江漢之民困於重斂然掊刻之吏刮削苦毒何異斧斤交集而民不得保其生邪啾啾黃雀啅蓋傷其無所托也蓬逐風飛喻甫為客飄蕩甫既痛嗟割剝之虐復自悼飄蕩如飛蓬恐亦堙沒隨藜莠而巳枯柟洙曰此詩傷抱材者老死丘壑而不材者見用也鄭曰柟那含切葉似桑子似杏而酸俗作楠楩柟枯崢嶸洙曰蜀都賦楩楠幽藹於谷底劉曰崢嶸髙貌鄉黨皆莫記不知幾百歲慘慘無生意上枝摩皇天洙曰魏文帝修條摩蒼天下根蟠厚地洙曰易坤厚載物巨圍雷霆折洙曰七發夏則雷霆霹靂之所感萬孔蟲蟻萃凍雨落流膠衝風奪佳氣趙曰郭璞曰今江東夏月暴雨呼為凍雨引楚辝使凍雨灑塵衝風隧風也楚辝以司命曰衝風至兮水揚波白鵠遂不來天雞為愁思洙曰謝靈運天雞弄和風七發獨鵠晨號乎其上唐曰天雞雉也猶含棟梁具無復霄漢志良工古昔少識者出涕淚種榆水中央成長何容易截承金露盤裊裊不自畏洙曰西都賦抗仙掌以承露擢雙立之金莖西京賦立修莖之仙掌承雲表之清露師曰喻君子負大材不遭明聖之君而至於困頓失所小人以柔脆嵬瑣之姿反俾之居廟堂以承重任其不傾危不可得矣昔漢武帝為金人承露植以修莖榆柔脆之木賤而易長今用以承露盤裊裊而危可不寒心乎小人貪位慕祿雖處重任不知自畏必至於傾覆而後巳此詩所以傷大材老死丘壑而小有材者居重任其顚倒如此海棕行鄭曰棕字以意逆之當作子冬切趙曰海棠記載李贊皇公云花木以海為名者悉從海上來左綿公館淸江濆師曰綿州涪水所經涪居其右綿居其左故曰左綿海棕一株髙入雲修可曰古樂府髙城上入雲龍鱗犀角相錯落蒼稜白皮十抱丈自是衆木亂紛紛趙曰王長元吉古意云况復飛營夜木葉亂紛紛海棕焉知身出群移栽北辰不可得時有西域胡僧識師曰北辰喻君也夫大材生非其地人無識者其欲衆木紛亂何以異乎中國無人識而胡僧識之正仲尼欲居九夷之意桞邊新添只道梅花發那知栁亦新枝枝揔到地葉葉自開春紫燕時翻翼黃鸝不露身漢南應老盡霸上遠愁人髙柟鄭曰那含切木名葉似桑子似杏而酸俗作楠尓雅云梅柟柟樹色冥冥江邊一蓋青洙曰劉先主所居籬角一樹逺望若車蓋近根開藥圃接葉製茅亭落景隂猶合趙曰言枝葉濃茂也微風韻可聽尋常絶醉困卧此片時醒嚴鄭公階下新松得霑字弱質豈自負移根方爾瞻洙曰民具尓瞻細聲聞玉帳洙曰聞一作侵踈翠近珠簾未見紫煙集虛蒙淸露霑何當一百丈欹蓋擁髙簷蘇曰此詩公之措意極為深逺以意逆志觀者當自知矣阮瑀松賦擁髙簷碧似欹蓋趙曰欹蓋抱朴子云偃蓋之松也慿韋少府班覔松樹子栽落落出群非櫸栁洙曰天白賦蔭落落之長松青青不朽豈楊梅洙曰莊子受命於地惟松柏獨正故四時常保其青青欲存老盡千年意為覔霜根數寸栽洙曰栽一云來慿何十一少府雍覔榿木數百栽草堂塹西無樹林洙曰樹一作木非子誰復見幽心飽聞榿木三年大與致溪邊十畝隂洙曰蜀人以愷為薪三年可燒樹間岑寂雙甘樹洙曰鮑明遠舞鶴賦去帝鄉之岑寂婆娑一院香交柯低几杖垂實礙衣裳滿歲如松碧趙曰言歲寒如松也同時待菊黃幾迥霑葉露乘月坐胡床惡樹獨繞虛齋徑常持小斧柯幽隂成頗雜惡木翦還多洙曰陸士衡云熱不息惡木隂蘇曰王筠野中吟云蘭薰種而不茂樗猶翦而還多此明君子道消小人道長也趙曰管子云士懷耿介之心不蔭惡木之枝惡木尚能恥之况與惡人同處枸𣏌固吾有趙曰以惡木敝障而枸𣏌不生因公翦去雜隂而有也雞棲奈汝何洙曰汝一作以趙曰翦去木枝似妨雞棲故云師曰枸𣏌嘉蔬也雞棲嘉木也惡樹既翦則枸𣏌雞棲遂得生長故云因吾有奈汝何猶小人既去則君子斯道長矣方知不材木洙曰木一作者生長漫婆娑洙曰莊子言櫟社之樹匠伯不顧弟子問之匠伯曰彼散木也無所可用故能若是之壽也分門集注杜工部詩卷第二十四
