front:
  text: 分門集注杜工部詩卷之十八
  hash: sha256:5922e210cfbcfa99762f6965184adeda465a726fc70e04fadf21b3b612be51f2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_018-1a}
body:
  text: 簡寄中律詩十三首秋日夔府詠懷奉寄鄭監審李賔客之芳一百韻絶塞烏蠻北洙曰雋州以西有蠻號烏白孤城白帝邊洙曰公孫述更魚復縣為白帝城飄零仍百里蘇曰吳靖為長沙令一日自嘆曰讀五車書辛勤十年不得綴鴛鴦班髮白蹤跡飄零尚為百里陶元亮復何人邪趙曰公自入中原入蜀又自蜀南下可謂飄零矣以病住雲安今又移居於䕫故云仍百里消渴巳三年洙曰司馬相如有消渴病雄劒鳴開匣洙曰雷煥得雙劒於鄷城劒有雌雄群書滿繫船洙曰一云所向皆窮轍餘生且繫船亂離心不展洙曰詩亂離莫矣不展謂憂心如結也趙曰選詩所麻心莫展衰謝日蕭然洙曰名迹消泯也筋力妻孥問洙曰一作覺菁華歲月遷洙曰陶徴士誄菁華隱沒芳流渴絶注菁華猶矣華也登臨多物色陶冶賴詩篇洙曰登髙臨逺多有景物所以象其變態者有詩以陶成之尓陶如陶者之􅓨埴冶如工冶之鎔鑄夢符曰晉梁鍾嶸詩評曰阮嗣宗詩其源出于小雅無雕蟲之功而懷詠之作可以陶性靈發幽思趙曰顔氏家訓言文章曰陶冶性靈從容諷諌峽束滄江起巖排石樹圎趙曰善本作古字舊作石樹非拂雲霾楚氣鄭曰霾謨皆切風雨土泰伯曰此句謂霧瘴之氣拂雲天也潮海蹴吳天趙曰言江流朝宗于海其勢蹴踏吳國之天也煮井為鹽速洙曰蜀都賦曰濵以鹽池注鹽巴東北新井縣水出也如涌泉可煮以為鹽燒畬度地偏鄭曰畬詩遮切度逹各切洙曰峽土瘠確暖氣晚逹故民燒地而耕謂之火耕亦謂之畬田有時驚疊嶂洙曰沈休文詩山嶂逺重疊任彥升詩疊嶂易成響何處覔平川洙曰峽中無川也鸂䳵雙雙舞獼猴壘壘懸洙曰壘壘重疊貌修可曰孟陽七哀歌北芒何疊疊碧蘿長似帶錦石小如錢蘇曰黃牛峽出錦石圎如錢上有五綵花紋隋煬帝時張异來獻帝號曰春池叢玉近丗詩云錦石來巫峽春地開玉叢春草何曽歇洙曰謝靈運詩芳草亦未歇寒花亦可憐洙曰張景陽詩寒花發黃彩師曰夔地暖春草寒花四時不斷故云云獵人吹戍火趙曰謂之戍火則有屯戍在白帝城也獵人至其上野店引山泉洙曰峽民依山而居故鮮水常以竹引山泉而食師曰自峽束滄江起至野店引山泉皆述䕫風景也喚起搔頭急洙曰西京雜記武帝過李夫人就取玉簮搔頭自此後宫搔頭皆用玉價倍貴觀此詩搔頭乃抓頭也何遜云金粟裹搔頭趙曰言寢睡之中𬒳人喚起頭方煩癢以簮搔頭不停手而頗急公自注何遜云金粟裹搔頭以見搔頭字所出師曰喚起鳥也晨鳴之鳥喚人睡起因以得名前輩詩云喚起窗全曙催㱕日未西東坡謂喚起催歸二鳥名古人用事後丗不知多作虛字解釋其失前賢之旨逺矣扶行幾屐穿洙曰阮孚字遙集性好屐客有詣孚正見自蠟屐因自嘆曰未幾一生能著幾緉屐神色自間暢趙曰言既睡起為人所扶而行凡穿破幾屐則其行往來之頻矣公自著云諸阮云一生能著幾屐以見幾屐字所出也師曰扶行杖也扶行遍歷故屐齒穿兩京猶薄産四海絶隨肩洙曰公有田在韋杜絶隨肩言無故舊也幕府𥘉交辟洙曰蔡雍薦邊讓於何進曰幕府𥘉開博選清英班固傳幕府新開廣延群英郎官幸備貟洙曰公為郎備貟猶備數言不事事趙曰嚴武東西川為節使辟公為參謀故云交辟時公為尚書工部貟外郎備貟公自謂也瓜時猶旅寓洙曰莊八年齊侯使連稱管至父戍葵丘瓜時而往曰及瓜而代期戍公問不至請代不許故謀而作亂萍泛若夤緣洙曰謝靈運詩蘋萍泛沉深藥餌虛狼籍洙曰謝靈運詩藥餌情所止衰疾忽在斯陸賈名聲籍甚注言狼籍甚盛秋風灑靜便趙曰便平聲謝靈運詩還得靜者便開襟驅瘴癘洙曰峽多嵐瘴氣候蒸􅊜故多瘴癘憂愁鬱結者易為所困故開襟以驅之趙曰王仲宣登樓賦向北風而開襟明目掃雲煙洙曰掃一作拂史明目張膽延年詩城闕生雲煙蘇曰魯肅雲煙掃尽明目望逺髙宴諸侯禮趙曰赴藩侯之宴㑹而感傷所聞之曲也諸侯謂唐之藩鎮佳人上客前洙曰古詩主人愛上客哀筝傷老大洙曰魏文帝書哀箏順耳華屋豔神仙洙曰曹子建箜篌引空存華屋處落落歸丘山謝靈運華屋非蓬居古詩金屋羅神仙南內開元曲鄭曰明皇所在常時弟子傳法歌聲變轉滿坐涕潺湲洙曰都督柏中丞筵開梨園弟子李仙奴歌明皇雜録云天寶中上命宫中女子數百人為梨園弟子皆居冝春北院上素曉音律時有馬仙期李龜年賀懷忠皆洞知律度安祿山自范陽入覲亦獻白玉簫管數百事皆陳於梨園自是音響殆不類人間其後李龜年流廢江南每遇良晨勝景為人歌闋座上聞之者莫不掩泣而罷酒有梨園法曲及霓裳曲至今尚有弔影夔州僻洙曰言獨客䕫州旁無親舊惟與影相弔而巳李令伯陳情表焭焭孑立形影相弔回腸杜曲煎洙曰宋玉髙居賦口感心動且回腸氣司馬遷書腸一日而九回趙曰公在長安家于杜曲故懷杜曲而回腸煎熬也即今龍廄水莫帶犬戎羶洙曰犬戎吐蕃是也謂陷京師趙曰兩京龍廄門苑馬門也謂水流苑門內此公自注也公不知中原消息故深憂之以今龍廄門邊之水莫也為犬戎所羶汚乎耿賈扶王室洙曰耿賈後漢二十八將耿弇賈復也論曰賈耿之洪烈又翼扶王運蕭曹供御筵洙曰䔥曹之功尊拱王室趙曰既憂吐蕃之羶汚又思廟堂大臣有耿賈䔥曹焉可以伐叛而息兵矣乘威滅蜂蠆洙曰左傳公卑邾不設備而禦之臧文仲曰君其無謂邾小蜂蠆有毒而况國乎戮力效鷹鸇洙曰左傳季文子使太史克對曰先大夫臧文仲教行父事君之禮行父奉以周旋弗敢失墜曰見有禮於其君者事之如孝子之養父母也見無禮於其君者誅之如鷹鸇之逐鳥雀又子産問然明為政對曰見不仁者誅之如鷹鸇之逐鳥雀也舊物森猶在洙曰哀元年傳祀夏配天不失舊物凶徒惡未悛洙曰左傳子家亦無悛志注悛改寤悛且緣切止也國須行戰伐人憶止戈鋋洙曰言人厭兵革也光武紀道未方古亦止戈之武焉東都賦戈鋋彗雲注矛矟也奴僕何知禮恩榮錯與權洙曰衛青傳青曰人奴之生得無笞罵即足矣公孫洪傳贊曰衛青奮於奴僕言以恩而假奴僕以權任人之失也蘇曰公孫邈叱衛青曰尓奴僕庸夫也焉知禮義青神色頓挫趙曰言武夫悍卒有立功而蒙寵者然公此句無所畏憚言亦痛悼其弊出於中誠也胡星一彗孛洙曰前漢天文志昴曰旄頭胡星也張晏曰彗所以除舊布新也孛氣似彗也趙曰旄頭胡星也星妖所纏謂之彗亦謂之孛師曰胡星指安史之亂黔首遂拘攣洙曰秦本紀更民曰黔應劭曰黔亦黎黑也鄒陽傳以其能越攣拘之語漢曹褒傳療拘攣難與圗始生拘攣猶拘束也潘安征西賦陋吾久之拘攣哀痛絲綸切洙曰前漢西域傳贊武帝末年遂辨輪臺之地而下哀痛詔禮緇衣子曰王言如絲其出如綸煩苛法令蠲洙曰前漢書云髙祖約法三章蠲除煩苛業成陳始王洙曰詩七月陳王業也言因時而變陳王業之艱難以警時君也歐曰言肅宗成中興之業兆喜出于畋洙曰齊丗家太公望吕尚以漁釣奸周西伯將出獵卜之曰所獲非熊非驪非虎非羆所獲霸王之輔於是西伯獵果遇太公望於渭陽載與俱歸立為師宫禁經綸密台階翊戴全洙曰梁竦傳宮省事密莫有知者台階事見建都詩注熊羆載吕望鴻鴈美周宣洙曰美其能勞來旋定安集側聽中興主洙曰蒸民宣王任賢使能周室中興焉顯宗紀先帝受命中興側聽諦聽也長吟不丗賢洙曰王吉云欲治之主不丗出師古曰言有遇之不常出也杜延年蒯通傳並云略不丗出曹子建曰不丗之賢趙曰言王室中興本乎得賢而鄭李乃所謂賢者故吟詠而思之選有永嘨長吟也音徽一柱數洙曰梁劉孝綽江津寄劉之徽詩經過一柱觀出入三休臺道里下牢千洙曰下牢關在巫峽之南趙曰公自注鄭在江陵李在夷陵一柱觀在荆州渚宮故事宋臨川王於羅公淵上立觀甚大而唯一柱所以言江陵也下牢關在峽州所以言夷陵也數通音問故言數相去千里故云千也師曰一杜觀上牢下牢皆在夔峽音徽一柱數言得李鄭音書之頻數也道里下牢千言鄭在江陵李在夷陵與子美相距凡千里時不絶音問也鄭李光時論文章並我先隂何尚淸省梅曰言其文清新而警省於人沈宋歘聮翩洙曰隂何沈宋皆能文者並見上注趙曰以四子比鄭李也隂則隂鏗何則何遜沈則沈佺期宋則宋之問隂何前代而二公比之彼尚清省未為冨艷沈宋近代歘然追逐與之相䏈翻也梅曰聮翻文疾速也律比崑崙竹洙曰前漢律歷志黃帝使伶倫去大夏之西崑崙之隂取竹之嶰谷斷兩節間而吹之以為黃鍾之宫音知燥濕絃洙曰伯牙彈琴意在山子期曰巍巍乎志在水子期曰蕩蕩乎子期死伯牙遂絶絃修可曰按劉孝標廣絶交論曰撫絃徽音未逹燥􅊜變響張羅沮澤不睹鴻鴈髙飛又按韓詩外傳趙王曰夫時有燥􅊜絃有緩急徽指推移不可記也使者曰臣詩借此以譬之故公有燥􅊜之句風流俱善價洙曰王衍樂廣宅心事外見重於時天下言風流者惟王樂為首見晉書愜當久忘筌趙曰上四句以言三公之文章也文賦誇目者尚奢愜心者貴當王弼明象曰猶筌者所以在魚得魚而忘筌也置驛常如此洙曰鄭當時孝景時為太子舍人每五日洗沐常置驛馬長安諸郊請謝賔客夜以繼日至明旦常恐不遍師古曰此謂長安城外四靣之郊耳邑外謂之郊登龍蓋有焉洙曰李膺獨持風裁以聲名自髙士有𬒳延接者名為登龍門趙曰上句以言鄭監之好客下句以言李賔客之待士雖云隔禮數洙曰名位不同禮亦異數隔猶不同也趙曰公自謙以謂與之位貌隔也不敢墜周旋洙曰左傳奉以周旋不敢失墜髙視收人表洙曰曹子建與楊德祖書曰足下髙視於上京楊德祖答箋云自周章於省覽何遑髙視哉更信贊髙視當丗趙曰任彥升撰王文憲集序曰經師人表虛心味道玄洙曰老子云虛其心又玄之又玄馬來皆汗血洙曰見馬詩注鶴唳必靑田洙曰永嘉記靑田有雙白鶴年年生子長便去鮑明逺詩獨鶴方朝淚趙曰以馬比二公則皆汗血以鶴比二公則必青田汗血馬詳見上注羽翼商山起洙曰見收京詩注趙曰以言李賔客者太子官也故用四皓事蓬萊漢閣連洙曰西都賦修塗飛閣自未央而連桂宮又云瀛州方壷蓬萊皆起于中央趙曰以言鄭監乃祕書監也故用蓬萊字後漢書曰學者稱東觀為老氏藏室道家蓬萊山唐祕書監掌圗書祕記即漢之東觀也管寧紗帽淨洙曰見嚴中丞杜駕見過詩注江令錦𫀆鮮洙曰陳書江揔為尚書令能屬文於五言七言尤善然傷於浮艷故為後主所幸多有側篇好事者相傳諷玩于今不絶日與後主遊宴後亭共陳暄等十餘人當時謂之狎客趙曰江㹅傳不載錦𫀆事其文集自有山水納𫀆賦其序云皇儲監國餘辰勞謙終宴有令以納袍降賜何以奉揚恩德東郡時題壁蘇曰南史桞惲詩云亭皋木葉下壠首秋雲飛琅琊王融見而歎賞因題東壁惲于粉切南湖日扣舷洙曰舷船唇也扣擊也郭璞江賦云詠採菱以扣舷選賦鳴榔叩舷說文曰根髙木也以長木叩舷為聲以驚魚使入網之中趙曰此專言鄭也有寄鄭監湖亭三首又有過鄭湖亭泛舟又有重泛鄭監前湖是也鄭曰南湖在夷陵扣丘候切舷胡田切船舷也逺遊臨絶境洙曰逺遊履名洛神賦云踐逺遊之文履古詩云足下雙逺遊佳句染華箋洙曰華箋蜀箋也趙曰丗說孫興作天台賦以示范榮期每至佳句則曰是我輩語每欲孤飛去洙曰謝玄暉雪賦瞻雲鴈之孤飛趙曰此巳下言二公之遊賞欲往從之不得且起故鄉之念江揔南樓詩不及孤飛鴈徒為百慮牽洙曰江淹詩撫枕懷百慮又去歲暮百慮交生涯巳寥落洙曰生涯言巳之生計也寥落無成也國步尚迍邅洙曰尚一作乃一作巧柔桑詩國步斯頻國步蔑資易迍卦六二迍如邅如難行不進之貌衾枕成蕪沒范塘作棄捐洙曰國亂離故寢處宴安之地皆蕪沒而弃捐也蘇曰江揔池塘荒廢筆硯弃捐尓來欲謝人事抱一守真趙口公自注云平生多病卜築遣懷因乨離故寢食宴安之地皆蕪沒弃捐也别離憂怛怛鄚曰當割切洙曰怛怛傷慘不足貌伏臘涕漣漣洙曰臘夏曰嘉平殷曰清祀周曰大蠟漢改為臘伏臘人所以祭祀也公在殷鄉故於伏臘多有所感史記秦德公始為伏師曰曆忌釋曰伏者何也金氣伏藏之日也一時代謝皆以相生立春木伐水水生木立夏火伐木木生火立冬水伐金金生水立秋金伐火金畏火故至庚日必伏庚者金也隂陽書言從夏至第三秋燕言欲歸而未得尓仲長統云人事可遣何為促局䔥踈聽晚蟬洙曰宋玉九辨而翩翩其辝歸兮蟬寂寞而無聲蘇曰張翮渭南詩云䔥索渭南客馬上聞晚蟬撩我故鄉思攪我心懸懸趙曰謝靈運蕭踈野趣生雕蟲蒙記憶洙曰揚子曰童子雕蟲篆刻俄而曰壯夫不為也蘇曰王武子逺蒙雕蟲知君子記憶烹鯉問沉綿洙曰古樂府詞呼兒烹鯉魚中有尺素書趙曰言二公記憶其䏻賦詩故致尺書以問其病躰也沉綿者若久病之謂也卜羡君平杖洙曰嚴君平卜筮於成都市以為卜筮者賤業而可以惠衆人有邪惡非正之問則依蓍龜為言利害各因勢道之以善從吾言者巳過半矣裁日閲數人得百錢足自養則閉肆下簾而授老子阮修宣子常步以百錢掛杖頭至酒店便獨酣暢家無儋石之儲也偷存子敬氊洙曰見舊物森猶在注囊虛把叉釧米盡拆花鈿趙曰言皆賣易之也甘子隂凉葉茅齊八九椽陳圖沙北岸洙曰桓溫傳𥘉諸葛亮造八陳圗於魚復平沙之上壘石為八行行相去二丈溫見之謂之常山蛇勢也文武皆莫能識之市暨瀼西巔洙曰公自往市暨夔人語也工水橫通山谷處方人故謂之瀼也羈絆心嘗折洙曰江淹別賦心折骨驚棲遲病即痊趙曰每為事物羈絆故其心嘗折今得棲遲可以養而痊也紫收岷嶺芋洙曰一云紫秧岷下芋前漢貨殖傳蜀卓氏曰吾聞岷山之下沃壄千里下有蹲鴟至死不飢師古曰踆鴟謂芋也其根可食以充糧故無飢年華陽國志曰汶山郡都安縣大芋如蹲鴟也趙曰從此巳下紀懹西草堂所自也白種陸家蓮洙曰家一作池色好梨勝頰穰多栗過拳洙曰蜀都賦紫梨津潤樼栗鏬發勑厨唯一味蘇曰段干木見客供苞唯笋羹瀹笋干木曰家貧山居唯此一味客曰清竒雅味趙曰王羲之傳有一味之甘割而分之求飽或三鱣洙曰楊震傳冠雀銜三鱣魚飛集講堂前注鱣似蛇一音善兒去看魚笱洙曰一云俗異鄰蛟室詩敝笱在梁也蘇曰孫林終日溪上守漁笱獨坐吟嘯自得其忘形若此人皆愛之人來坐馬韉洙曰一云朋來坐馬韀晉王尼𥘉為護軍府軍士胡母輔之等齎羊酒詣護軍門入遂坐馬廄下與尼炙羊飲酒醉飽而去定功曰戰國蘇秦少與張儀友秦在趙為相儀至趙使人白秦秦必激之令儀於城東門外坐以破馬韉進之粗食儀憤乃西入秦昭王善之拜為相儀歎曰馬韉之事乃至是乎人來坐馬韉言貧無席坐也縳柴門窄窄洙曰一云柴門窄小小通竹溜㳙㳙洙曰縳柴縳柴為門也通竹引泉以竹也陶淵明泉㳙㳙而始流塹抵公畦稜鄭曰魯鄭切洙曰京師農人指田逺近多云幾稜耒曰公畦官園也村依野廟壖鄭曰而宣切洙曰朝錯傳鑿太湖廟堧垣師古曰堧者內垣之外游地也人緣反缺籬將棘拒倒石賴藤纒借問頻朝謁何如穩晝眠趙曰言瀨不出仕誰云行不逮洙曰語古者言之不出恥躬之不逮也自覺坐能堅洙曰馬援曰大丈夫窮當益堅老當益壯霧雨銀章澀洙曰前漢百官公鄉表銀章印皆龜鈕其文曰章謂刻其官之章也趙曰銀章久不服之所以澀也馨香粉署妍洙曰粉署郎署也趙曰公時乃工部貟外郎不生詣省中徒想其官署之妍美耳省謂之蘭者以其諸郎官握蘭含香也故云馨香又謂之畫省以粉畫之也故言粉署紫鸞無逺近黃雀任翩翾鄭曰許緣切趙曰上句以譬髙才之人則不論逺近而往下句則公自謙如黃雀之小徒任翶翔而巳紫鸞者亦紫色之鸞也困學違從衆洙曰與俗俯仰而巳孔子拜下違從麻冕從衆明公各勉􅏧洙曰楊惲傳方當盛漢之隆願勉旃無多談師古曰􅏧勉也言子當自勉勵以立功名不須多為我言也趙曰言巳之局促如黃雀而勉二公之為功名也楊子困而不學斯為下矣聲華夾宸極洙曰言李鄭聲華足以夾輔宸拯早晚到星躔洙曰郎官象列星諸侯象四七宰相法三台皆星躔早晚言非久拔用之也懇諌留匡鼎洙曰匡衡傳諸儒為語曰無說詩匡鼎來匡說詩解人頥服䖍曰鼎猶言當之也言匡且來也應劭曰鼎方也張晏曰匡衡時字鼎長乃易字稚圭丗傳衡與貢禹上書言衡敬報下言匡鼎白知是字也師古曰服應二說是也傳載衡言日食事甚切到鄭曰西京雜記匡鼎小名鼎諸儒引服䖍洙曰後漢儒林傳服䖍字子慎𥘉名重又名祗後改為䖍少以清苦建志入太學受業善著文舉孝廉不逢輸鯁直洙曰逢一作過㑹是正陶甄宵旰憂虞軫洙曰宵衣旰食黎元疾苦駢雲臺終日畫洙曰馬援傳顯宗圖畫建武中名臣列將於雲臺劉孝標論影組雲臺者摩看詩獻納雲臺表蘇武傳丹靑所畫者何以過子卿靑簡為誰編洙曰青簡殺竹青為簡也春秋序小事簡牘而已齊崔杼亂大史氏書之死南史間之執簡而往青簡乃史臣所以記事者編編條也如今之史亦有編修官趙曰不過用鯁直以進當為正陶甄之化耳所以然者上則天子軫宵旰之憂下則黎元駢疾苦之事也如此則可畫像於雲臺而書名於史冊耳雲臺詳見上注田曰文選載劉向別録治青竹作簡書謂之青簡余曰後漢吳祐傳青簡注火炙簡令汗取其青易書復不蠧謂之汗簡行路難何有洙曰古有行路難詩招尋興巳專由來具飛楫洙曰木玄虛海賦飛迅鼓楫暫擬控鳴絃洙曰西域傳控弦者十餘萬趙曰兩句通義言楫飛之疾如箭之往也身許雙峯寺田曰釋氏要覽云曹溪在韶州雙峯寺下昔晉武帝曹叔良宅也門求七祖禪洙曰雙峯寺名也釋書有六祖此言七祖不知其故田曰按佛書毗婆尸佛尸弃佛毗舍浮佛拘留孫佛勾那含牟尼佛迦葉佛釋迦牟尼佛謂之七祖其所說七偈乃禪源也趙曰謂之門求則所求之法舊注摸令無法田說是師曰又按佛書毗婆尸佛尸棄佛毗舍浮佛拘留孫佛勾那含牟尼佛迦葉佛釋迦佛牟尼佛謂之天望七祖其所說七偈乃禪源也自逹磨至慧能謂之中華六祖由五祖而上蓋梁隋開元以前人六祖慧能入滅於唐睿宗先天元年而子美於是年始生六祖之道至肅宗上元𥘉方盛故肅宗自曹溪請其衣鉢歸內供養子美於是漂泊在蜀以此考之則六祖與子美蓋同時先後人也故所求禪言七祖而不言六祖也因是詩注云不知其故乃叙其丗次而辨之落帆追宿昔衣褐向真詮洙曰天台賦披毛褐之森森真詮佛法也趙曰言於彼處落帆乃是宿昔之願其衣褐之身專為依向真詮也褐者布衣之謂安石名髙晉洙曰公自注云鄭髙簡得謝太傅之風趙曰此謝安也昭王客赴燕洙曰公自注云李宗親有燕昭之美燕昭之裔趙曰以燕昭北李途中非阮籍洙曰阮籍時率意獨駕不由徑路車迹所窮輒慟哭而返查上似張騫洙曰因話録漢書載張騫窮河源言其奉使之逺實無天河之說惟張茂先博物志說近丗有人居海上每年八月見槎來不違時齎一年糧乘之到天何見婦人織丈夫飲牛遣問嚴君平去某年某月日客星犯牛斗即此人也後人相傳云得織女支機石持以問君平都是虛慿河之說今成都嚴真觀有一石呼為支機石皆云當時君平留之寶曆中余下第還家於京師途中逢官差遞夫舁張騫槎先在東都禁中今准詔索有司取進不知是何物也前輩詩往往有東君槎者相襲訛謬矣縱出雜詩亦不足據也披拂雲寧在洙曰拂一作晤衛􅗕見樂廣曰瑩然若披雲霧覩青天趙曰選云步幽蘭以披拂淹留景不延洙曰劉安招隱士詩云援桂枝兮聊淹留風期終破浪師曰子美淹留江漢年已老矣破浪謂下峽歸故里故曰他日辝神女水怪莫飛涎洙曰孔子丗家水之怪龍罔象韋昭曰龍獸也非常見故曰怪海賦其垠則有天琛水怪鮫人之室江賦水物怪錯又太揚鬐掉尾濆浪飛涎趙曰言我之風期必破浪而往告尓水怪母為孽也南史宗慤曰願乘長風万里浪選云噴沫飛涎而義則飢虎垂涎之意他日辭神女洙曰宋玉有神女賦廟在巫山傷春怯杜䳌洙曰蜀都賦鳥生杜䳌之魄見華陽風俗録蘇曰曹晏遊巴江聞杜鵑語友人曰吾年來傷春怯聞此聲使我心索然趙曰既離夔而於巫峽辝別神女之日當在暮春時也師曰雲安有杜䳌客情畏聽杜䳌也淡交隨聚散洙曰禮君子之交淡如水澤國繞回旋洙曰言地多陂澤故言澤國本自依迦葉洙曰王簡栖頭陀寺碑以法師景行大迦葉故以頭陀為稱首注大迦葉佛大弟子也師曰此句言寓居僧舍也何曽藉偓佺鄭曰藉去聲偓音渥佺音詮洙曰列仙傳偓佺魏里采藥父也食松實形體生毛數寸能飛行捷走馬揚雄甘泉賦云雖方征橋與偓佺兮猶仿佛其若夢師古曰偓佺仙人名爐峯生轉眄洙曰廬山東南有香爐山孤峯起遊氣籠其上氛氲若若香煙鄭曰廬山記東南有香爐山孤峯秀起橘井尚髙褰洙曰神仙蘇耽種橘鑿井以救鄉里之有病者以井泉服一橘葉即已東走窮歸鶴洙曰遼東歸鶴見卜居詩注南征盡跕鳶鄭曰跕的協切洙曰馬援傳云吾在浪泊西里間虜未滅之時下潦上霧毒氣薰盛仰視飛鳶跕跕墮水中卧念少游平生時語何可得也注鴟鳶跕跕墮水晚聞多妙教卒踐塞前愆鄭曰塞悉則切洙曰妙教釋教也釋書云能修其教者足以追塞前業也顧凱丹青列洙曰晉顧凱尤善丹青圖寫特妙謝安深重之以為有蒼生以來未之有也凱之每畫人成或數年不點目精人問其故答曰四體妍蚩本無闕少於妙處傳神寫照正在阿堵中頭陀琬琰鐫洙曰姓氏英賢録云王中字簡栖作頭陀寺碑文頭陀寺者沙門釋憲宗之所立也敢寓言於雕篆庶髣佛乎衆妙琬琰鐫碑也衆香深黯黯洙曰法華經云曉燒衆名香煙天台賦衆香馥以楊師曰如戒香定香憲香解脫香之類幾地肅芊芊洙曰潘嶽籍田賦蟬冕熲以灼灼兮碧色肅其芊芊師曰幾地謂釋氏自苐一地至第十地修行言有漸也勇猛為心極洙曰經云猛勇情進清羸任體孱鄭曰鋤連切弱也洙曰陳書姚察居憂齊素日久後主見察柴瘠為之動容勑曰卿羸瘠如此齊菲纍年不冝一飯有乖將攝也金箆空刮眼鄭曰箆邊迷切鏡象未離銓洙曰一云平等未離銓釋書涅盤經云如目肓人為治目故造詣良醫即以金箆刮其眼膜師曰鏡象言鏡中之象未離乎相迹要當悟豈逹本如得魚而忘其筌乃為善學道也寄嶽州賈司馬六丈巴州嚴八使君兩閣老五十韻衡嶽啼猿裏巴州鳥道邊洙曰言州居山之險絶處也李白云西當太白有鳥道三徑微窄止能容鳥度而巳趙曰南中八志曰交趾郡治龍編縣自古興鳥道四百里以其險絶獸猶無蹊人所莫由特上有飛鳥之道耳故人俱不利洙曰一作別謫䆠兩悠然開闢乾坤正趙曰言收復二京矣榮枯雨露偏洙曰言澤不均也趙曰言二子不得受聖恩而謪去也長沙才子逺釣瀨客星懸洙曰漢賈誼洛陽才子也黜為長沙王傳嚴子陵釣瀨光武徴之太史奏客星犯于帝座之嚴使君也憶昨趨行殿洙曰天子行幸所止曰行殿趙曰自此巳下公自言也肅宗即位靈武公自賊中竄身至鳯翔見帝殷憂捧御筵彥輔曰言自賊中赴鳯朔討胡愁李廣奉使待張騫洙曰見焉知李廣不封侯注又見查上覔張騫注趙曰討強胡未捷則愁李廣使之未還則待張騫無復雲臺仗虛修水戰船洙曰見寂寞雲臺伏注漢武作昆明池以習水戰中有戈船樓船百般上建樓櫓趙曰言行宮草創不復嚴整法仗也便言哀江南賦猶有雲臺之仗蒼茫城七十洙曰􅐱食其慿軾下齊七十餘城流落劒三千洙曰莊子說劒昔趙文王喜劒劒士來門而客三千餘人日夜相擊於前畫角吹秦晉洙曰吹一作歌晉一作塞春秋時秦晉通􅊚又為敵國旄頭俯澗瀍洙曰見旄頭𥘉淑擾注澗瀍二水也在伊洛間趙曰此言安史前漢天文志昴為尾頭胡星也小儒輕董卓洙曰董卓廢立凶暴無道忍性矯情擢用羣士以尚書韓馥等為刺史馥等到官與袁紹之徒十餘人各興義兵同盟討卓有識笑苻堅洙曰苻堅違衆伐晉遂至破敗撫畜鮮卑苻融諫之不聽後為鮮卑所亡故為有識者所笑趙曰小儒有識公自謂也董卓苻堅指安史也董卓擢用羣士以韓馥等為刺史馥到官與袁紹興義兵同盟討卓浪作禽填海洙曰山海經曰發鳩之山有鳥名精衛本赤帝之女嬉遊於東海溺而死不返化為精衛常取西山木石以填東海江淹詩精衛銜木石誰能測幽微那將矢射天洙曰商本紀帝乙無道為偶人謂之天神與之博令人為行天神不勝乃僇辱之為革囊盛血仰而射之命曰射天武乙獵於河渭之間暴雷震死趙曰皆言安史之不知量也萬方思助順洙曰助順助天子也一鼓氣無前洙曰言得衆助故所向必破左傳曹劌曰夫戰氣也一鼓作氣再而衰三而竭隂散陳倉北晴熏太白巔洙曰陳倉郡陳寶鳴雞在焉北近長安也太白山名亂麻尸積衛洙曰武五子贊秦始皇即位三十九年內平六國外攘四夷死人如亂麻暴骨長城之下衛地河北相衛之間也破竹勢臨燕洙曰杜預傳今兵威巳震勢如破竹數節之後迎刃而解燕地范陽祿山巢穴也法駕還雙闕洙曰天子還京也西都賦乘鵉輿備法駕王師下八川洙曰見八水散風濤注此時霑奉引洙曰見奉引濫騎沙苑馬注趙曰公為拾遺掌供奉故云佳氣拂周旋洙曰光武紀論望氣者蘇伯阿為王莽使至南陽遙望見舂陵郭唶曰氣佳哉鬱鬱葱葱然貔虎開金匣洙曰書如虎如貔蔡文姻詩軍衆來東下金甲曜日光麒麟受玉鞭洙曰凉州記咸寧二年發張駿陵得鞭飾以珊瑚晉明帝以七寶鞭與賣食嫗即玉鞭或有之伹未知所出趙曰公為以言御馬按蘇梟杜陽編代宗嘗賜郭子儀九花虬馬并紫玉鞭轡舊注模稜矣侍臣諳入仗廄馬解登仙趙曰法仗復備皆侍臣所舊諳入者矣時可曰淮南子乘黃獸名龍翼馬身黃帝乘之而仙花動朱樓雪城凝碧樹煙洙曰江淹詩碧樹露阡阡生煙紛漠漠顔延年詩空城凝寒雲衣冠心慘愴洙曰顔延年拜陵廟詩衣冠終冥漠陵邑轉葱青故老淚潺湲洙曰九辨倚結軫太息涕潺湲沾軾九歌橫流涕兮潺湲哭廟悲風急洙曰見及夫哭廟後注朝正霽景鮮魯曰朝正元日朝㑹鄭曰朝直遙下諸成切歲之首月月分梁漢米洙曰梁漢間所出者水月分廪給也春得水衡錢洙曰宣帝本始二年春以水衡錢為平陵徙民起第宅應劭曰水衡與少府皆天子私藏耳縣官公作當仰給司農今出水衡錢言宣帝即位為異政也晉灼曰食貨志𥘉大司農𬋩鹽鐵官布多故置水衡欲以主鹽鐵及楊可告緡林財物衆乃令水衡主上林上林三官主鐵錢也內蘂繁於纈鄭曰奚結切文繒魯曰內蘂宫花也宮花軟勝綿恩榮同拜手出入最隨肩洙曰入一作處書皋陶曰拜手稽首禮五年之長則肩隨之晚著華堂醉寒重繡𬒳眠轡齊兼秉燭趙曰言並轡而行也書枉滿懷箋趙曰言在禁掖時往來書尺也每覺升元輔深期列大賢趙曰所以極言二公之才器可為宰輔也秉鈞方咫尺洙曰詩節南山秉國之鈞左傳不違顔咫尺鎩翮再聮翩洙曰顔延年鵉翮有時鎩注鎩殘也謝靈運聮翩何窮也趙曰言為宰執不逺而乃謫去如鳥之殺翮也無巳曰淮南子云飛鳥鎩羽許愼注云鎩殘羽禁掖朋從改洙曰一作換微班性命全靑蒲甘受戮洙曰受一作就漢元帝疾史丹以親密侍疾侯上寢直入卧內頓首伏青蒲誅趙曰公以拾遺為職故使青蒲事白髮竟誰憐洙曰左太冲馮唐豈不傳白首不見招弟子貧原憲洙曰見難甘原憲貧注諸生老伏䖍洙曰見諸儒引伏䖍注趙曰公自比原憲伏䖍也公本傳云入太學受菐有雅才以其入學之故故云諸生老伏䖍尓師資謙未達鄉黨敬何先舊好腸堪斷洙曰謝靈運楚人心者絶裁容腸今斷鮑明逺行子心腸斷新愁眼欲穿逸曰穿破也趙曰公懷二公也翠乾危棧竹鄭曰乾居寒切棧助諌切棚也紅膩小湖蓮洙曰湖一作池賈筆論孤憤洙曰韓非作孤憤屬賈司馬詩嚴君賦幾篇逸曰屬嚴使君定知深意苦莫使衆人傳貝錦無停織洙曰詩萋兮菲兮成是貝錦趙曰貝錦以喻讒也朱絲有斷絃洙曰鮑昭直如朱絲繩趙曰鍾子期伯牙絶絃公詩歎二子無知音而戒之也浦鷗防碎首霜鶻不空拳鄭曰鶻胡骨切蘇曰王肅張欽同舟見野鶻盤旋欽曰浦鷗然間暇疑防鶻下老拳碎首沙毛趙曰兩句通意謂二子如浦鷗言官如霜鶻既不空拳期於必中則鷗當有碎首之防矣其戒之至也地僻昏炎瘴趙曰言嶽州近南為有瘴矣山稠隘石泉趙曰言巴山在亂山間也且將棊度日應用酒為年典郡終微眇洙曰嚴使君也治中實弃捐洙曰賈司馬也晉職官志置别駕治仲從事趙曰治從平聲二公在禁掖而出斯為微眇弃捐矣安排永傲吏洙曰謝靈運居常以待終處順故安排定功曰郭景純遊仙詩曰漆園有傲吏菜氏有逸妻注莊子嘗為漆園吏楚威王聘之欲以為丞相謂使者曰亟去無汙我故曰傲吏比興展歸田洙曰陶淵明田園將蕪胡不歸去去才難得洙曰語才難不其然乎趙曰去去之語如去國之義古詩夫去復去去蒼蒼理又玄洙曰蒼蒼天也言天理玄妙莊子天之蒼蒼其正色耶趙曰謂天理難喻也老子曰玄之又玄古人稱逝矣洙曰漢髙祖紀吾亦從此逝矣吾道卜終焉洙曰終窮也吾道窮於此乎隴外翻投跡漁陽復控弦洙曰言安慶緒復熾也笑為妻子纍甘與歲時遷親故行稀少洙曰時亂而離散故親故稀少兵戈動接聮洙曰接跡聮屬言充斥也他鄉饒夢寐失侣自迍邅師曰言吐蕃復入寇隴外思明再亂漁陽甫傷為妻子所纍是以客居秦州甘與歲時遷移也失侣言與賈嚴間隔多病加淹泊長吟阻靜便宋曰平聲安貌如公盡雄俊志在必騰騫洙曰一云公如尽憂患何事有陶甄趙曰言二公不久復用也寄劉峽州伯華使君四十韻峽內多雲雨秋來尚鬱蒸洙曰髙唐賦朝為行雲暮為行雨應璩書處凉臺而有鬱蒸之煩趙曰此言楚地也逺山朝白帝洙曰見上白帝城詩注趙曰說䕫州蓋公之所在深水謁夷陵洙曰謁一作出峽州有夷陵縣趙曰說峽州蓋言劉使君之所在也遲暮嗟為客西南喜得朋洙曰易西南得朋哀猿更起坐趙曰聞哀猿之聲不覺起坐更音平聲落鴈失飛騰趙曰以譬其身如鴈之落而失於飛騰也伏枕思瓊樹洙曰江淹賦云願一見顔色不異瓊樹枝矣趙曰李陵贈蘇武詩思得瓊樹以解長渴飢公思劉使君亦如之臨軒對玉繩洙曰星名謝靈運詩玉繩低建章趙曰思與劉使君臨軒而坐直至王繩星見時也青松寒不落洙曰歲寒若青松色何敬祖詩青青陵上松亭亭髙山柏光色冬夏茂根柢無凋落趙曰言劉使君之歲寒莊子云松柏在冬夏青青舊引何敬祖詩在後矣碧海闊逾澄洙曰器宇若碧海十洲記扶桑在碧海之中趙曰以言劉使君之寬量東方朔十洲記東有碧海廣狹浩汗與東海等水不鹹苦正作碧色昔歲文為理群公價盡增洙曰尚文之丗群公皆馳譽得時其價增趙曰言往時尚文為治故群公諸儒增價也饒曰言玄宗之丗以文理天下也家聲同令聞鄭曰聞亡運切名達也以令聞為家聲時論以儒稱洙曰以儒名丗趙曰此言劉使君先丗家聲與公祖杜審言同沐當時士論並以儒稱之歸劉杜氏太后當朝肅洙曰當一作臨多才接迹升翠虛捎魍魎鄭曰捎所交切洙曰甘泉賦捎䕫魍魎扶橘征羽獵賦曳捎星之旗捎拂也東京賦捎魑魅斯獝狂丹極上鯤鵬洙曰莊子鯤化為鵬趙曰太后指則天也言弃捐不才如捎魍魎賢者得君如上鵾鵬有九万之翶翔也東京賦捎魍魎而獝狂注云捎殺也師曰翠虛言山林之間捎拂魍魎喻小人逺遁也下句言賢者奮迅於丹霄也宴引春壷滿洙曰一作酒趙曰自此言太后朝所寵賜大臣如此詩春酒百壷恩分夏簟冰洙曰錫宣賜冰也江淹夏簟清兮晝不暮蘇曰魏明帝賜許玩黃藤蚪紋簟玉井氷以表優恩雕章五色筆洙曰江淹夢得五色筆由是文藻日進後有人夢中稱郭璞而取之趙曰雕章之作在紫殿夜宴之時田曰齊䔥慤秋夜賦詩云芙蓉露下落楊柳月中踈髙林以為斯文雕章間出紫殿九華燈洙曰西京雜記元日燃九華燈於南山上照見百里謝玄暉紫殿肅隂隂學並盧王敏洙曰唐文苑傳盧照鄰與楊炯王勃駱賔王以文詞齊名海內稱為王楊盧駱號為四傑書偕禇薛能洙曰禇遂良薛稷也褚遂良之書得王逸少之躰稷外祖魏徴家多禇書稷鋭意模學時無及者老兄真不墜小子獨無承洙曰言伯華所學真不墜古人大躰惟巳無所承於前輩近有風流作聊從月繼徴蘇曰庾凱聞足下近有風流佳客不惜寄雲卧野人顔延年宋郊祀歌月竁來賔月際奉士注云竁窟也一作峽又作月繼非趙曰自此下言劉使君之詩也言其詩之風流用對月繼則日月相繼而徴之舊作月竁竁窟也作月竁則於徴求劉使君之詩全無說矣放蹄知赤驥洙曰列子周穆王有赤驥朝曰喻其才馳騁也捩翅服蒼鷹洙曰捩一作校鸚鵡賦曰蒼鷹鷙而受絀此一對皆言文才俊逸蘇曰盧充曰赤驥失秣駑駘見欺放蹄始知俊逸馬融語友人曰蒼鷹捩翅百禽咸服真儒一言群詞俱挫趙曰兩句言劉使君詩如馬行鷹飛駿疾如此朝曰服其豪邁也卷軸來何晚襟懷庶可慿趙曰卷軸所寄之晚所以怪之而我襟懷所望於詩也㑹期吟諷數益破旅愁凝洙曰疑結也趙曰㑹欲數數吟諷之而用破散旅愁之凝結焉雕刻初誰料洙曰一作解楊子或間雕刻衆形匪天歟曰以其不雕刻也如物刻而雕之焉得力而給諸趙曰言其雕刻之妙誰能輕料之此蓋以造化言之也掦子曰如物刻而雕之則天焉得力而給諸纎毫欲自矜趙曰言纎毫皆妙而可矜誇也神融躡飛動田曰列子曰心凝形釋骨肉都融不覺形之所倚足之所履隨風東西戰勝洗侵凌田曰韓子昔云子夏見曽子何肥對曰戰勝故肥曽子曰何謂也對曰吾入見先王之義則榮之出見冨貴又榮之兩者戰於胸中未知勝負故􅋯今先王之義勝故肥也妙取筌蹄棄洙曰易得魚忘筌得兔忘蹄趙曰以詩言之不拘泥髙冝百萬層洙曰言格致髙逺也白頭遺恨在趙曰公之自歎也青竹幾人登洙曰青竹青簡也猶書於青簡者能幾人回首追談笑勞歌局寢興鄭曰局渠六切不伸也趙曰以追懷劉使君之談笑故待勞我之歌詠而局蹐於一寢一門之興也年華紛巳矣丗故莽相仍洙曰嵆康書云丗故繁其慮七不堪也趙曰方遭安史之亂而又有吐蕃之擾則丗故相仍如草莽之多矣刺史諸侯貴洙曰崔方進奏曰古選諸侯賢者以為州伯今部刺史居牧伯之位秉一州之統請罷刺史置州牧趙曰今日刺史乃古諸侯之貴也郎官列宿應洙曰漢明帝館陶公主為子求郎帝不許賜錢一千萬曰夫郎官上應列宿出宰百里非其人民受其殃趙曰公乃尚書工部貟外郎漢明帝云郎官上應列宿故也潘生驂閣逺洙曰一云潘安雲閣逺又潘安仁賦髙閣連雲黃霸璽書增洙曰黃霸為頴川太守治為天下第一天子以霸治行終長者又下詔稱揚賜關內侯黃金百斤循吏傳云二千石有治理效者輒報璽書勉勵增秩賜金趙曰專言劉伯華為太守有政績如黃霸之治頴川以循吏而徴入也鄭曰治行去聲乳贙號攀石鄭曰贙胡畎切洙曰乳虎也趙曰自此而下公自叙之也言乳贙號叫而攀石贙音畎田曰爾雅贙有力注出西海大秦國似狗多力獷惡又音鉉舊注謂乳虎非也饑鼯訴落藤鄭曰鼯訛胡切洙曰蕪城賦階聞􅍪鼯趙曰鼯以訴飢而至於落藤皆道夔州山居事藥囊親道士趙曰以其病之故求服食於道七灰劫問胡僧洙曰武帝穿昆明池悉是灰墨有外國胡道人云此是天地劫灰之餘趙曰以丗故之多形乎憂懼遂有胡僧之問矣慿久烏皮綻洙曰烏皮几也蘇曰宋明不仕杜門注黃老書孫登惠烏羔皮裏几歲久慿皆破綻自號守一先生簪稀白帽稜洙曰管寧常著曰帽趙曰言髮少之故白帽白紗帽也林居看蟻穴洙曰焦戇易林曰蟻封户穴大雨將集傳物志蟻如將雨蘇曰焦林郊居終日看蟻穴運壤怡然自樂人莫識其意也趙曰間散之事也野食待魚􅊻洙曰􅊻魚網也筋力交雕喪飄零免戰兢蘇曰髙翃致仕語弟曰昔居諫省日夕如履氷戰氷今遂飄零幸免此亦佳事也趙曰避免而眼中不見戰伐之事故得免戰戰兢兢之憂懼也皆為百里宰趙曰言身為郎官當其時自可以為百里宰矣正似六安丞夢符曰右按後漢桓談數言事忤旨出為六安丞忽忽不樂道病卒趙曰公言房琯無罪忤肅宗遂弃不省之正如桓談之忤旨也姹女縈新裏鄭曰姹陟駕切洙曰姹神女也善燒煉因而得乘煙仙去或云能點化修可曰漢魏真人參同契曰丹砂木精得金乃并漢真人大丹訣曰姹女隱在丹砂中注姹女録也以二書考之則姹女非神仙人丹砂冷舊稱洙曰葛洪求為勾漏令就采丹砂而巳但求椿壽永洙曰莊子曰古有大椿者以八千歲為春以八千歲為秋莫慮𣏌天崩洙曰𣏌國人憂天崩墜身無所寄趙曰兩句亦以永長在而巳勿以天尚有崩而不信無長年之效錬骨調情性洙曰文子曰太上養神其次養形張兵撓棘矜鄭曰巨巾切洙曰徐樂傳奮棘矜師古曰棘㦸也矜者棘之杷時秦銷兵器故但有㦸之杷耳養生終自惜伐數必全懲洙曰數一作叛稽康有養生論七發云伐性斧趙曰言養生終日愛惜而時之用兵伐叛必全懲之政術甘踈誕詞埸愧服膺洙曰顔子拳拳服膺趙曰公自謙而言之也以為不若劉使君也展懷詩頌魯洙曰魯諸侯而有頌德者以德可歌誦也趙曰指言劉使君之政割愛酒如繩洙曰平生所好消渴止之見汝陽王詩注趙曰公自注云左傳有酒如繩咄咄寧書字洙曰丗說殷中軍名浩𬒳廢長安終日嘗畫空作字楊州吏人尋議之竊視唯作咄咄怪事四字而巳冥冥欲避矰洙曰楊子鴻飛冥冥戈人何慕焉江湖多白鳥天地有青蠅洙曰青蠅以喻讒鮑曰與白鷗波浩蕩萬里誰能馴同意指言自適也靑蠅言有讒也修可曰按白鳥有二說一說謂鷗鷺之類詩言白鳥鶴是也喻賢者之潔白乃弃置江湖之間一說白鳥蛟蚋也以譬則小人言賢者居亂丗欲隱則為蚊蚋所替欲出則為青蠅所汚是無逃於天地之間矣趙曰此言在江湖之間天地之內無所逃蚊蠅之害又戴記白鳥者謂蚊蚋也贈王二十四侍御契四十韻往往雖相見蘇曰蘇章曰與子相别往往難得再相見也萬事努力飄飄愧此身不關輕紱冕洙曰冕冠冕也紱朱紱也皆朝服言此身之不仕非輕祿仕也不得志而巳但是避風塵洙曰兵氛也竇融拔起風塵之中趙曰紱綬冕冠也公以左拾遺出為華州功曹而遂自罷官若輕紱冕者但以風塵之警不得不避亂也一别星橋夜洙曰華陽記李水造七星橋上應七星三移斗柄春洙曰公羊隱元年春王正月注春者天地開閉之端昏斗指東曰春史記攝提者直斗杓所指以建時節也趙曰以志時也斗杓隨時而指東則為春三移則三年矣敗亡非赤壁洙曰阮元瑜為曹公作書與孫權曰昔赤壁之役遭罹疫氣燒船自還以避惡也非周瑜水軍所能抑挫也江陵之守物盡榖殫無所復據徒民還師又非瑜之所能敗也馬曰赤壁近江陵尹曰言潼關之敗柄京遂陷其禍酷烈殆非赤壁之比奔走為黃巾洙曰後漢靈帝中平元年春巨鹿人張角自稱黃天其部師有三十六萬皆著黃巾同日反叛安平甘陵人各執其主以應之有頴川黃巾有南陽黃巾張漫成有汝南黃巾有葛陂黃巾有青徐黃巾炎曰黃巾以喻祿山者也子去何蕭灑洙曰孔德璋北山移文䔥灑出塵之想余藏異隱淪洙曰見行歌非隱淪注朋曰甫因奔走避寇遂成隱淪非本志也故曰異隱淪書成無過鴈洙曰蘇武傳昭帝即位數年胸奴與漢和親漢求武等胸奴詭曰武死後漢使復至胸奴常惠請其守者與俱得夜見漢使具自陳道教使者謂單于言漢天子射上林中得鴈足有係帛書言武等在某澤中使者大喜如惠語以責單于單于視左右而驚謝漢使曰武等實在范彥龍詩寄書雲中鴈為我西北飛衣故有懸鶉洙曰荀子曰子夏貧衣若懸鶉恐懼行裝數鄭曰色角切洙曰孔子歷聘諸侯席不暇暖也蘇曰王敬恐懼行裝數煩遷挈今又避地東南恐臨老無依止之地而巳伶俜卧疾頻洙曰劉公餘卧疾漳蘇曰賈瞻伶俜万里不宜風士頻頻疾作第恐難見太平符曰伶俜失所貌曉鶯工迸淚秋月解傷神洙曰聞鶯而泣見月而傷則公之不得志於時可知矣蘇曰王粲觀秋月懷弟妹故里而傷神趙曰春鶯秋月人所賞玩而鶯所工者在於遊人之淚月所解者在於傷人之神則以亂離疾病之所感也深父曰鶯月可娛之物對此而傷此所以見公之不得志也㑹靣嗟黧黑洙曰泰誓播弃黧老孫炎曰耉靣凍黧色似浮垢也靣色似黧故稱黧老李斯傳二丗責問斯曰禹鑿龍門股無胈脛無毛手足胼胝靣色黧黑趙曰列子載楊朱之語曰靣色黧黑含悽話苦辛洙曰陸機慷慨含辛楚古詩坎軻長苦辛接輿還入楚洙曰論語楚狂接輿鳯兮師曰言甫自蜀適荆衡也王粲不歸秦洙曰謝靈運曰王粲家本秦川貴公子孫遭亂流寓自傷情多詩整裝辝秦川秣馬赴楚壤趙曰王粲秦川貴公子也遭亂流寓公取其不得歸長安故又以王粲為比師曰自喻不得歸故鄉也錦里殘丹竈趙曰以景物明煥錯雜如錦故曰錦里別賦云守丹竈而不顧花溪得釣綸洙曰浣花溪見上注詩其釣維何維絲伊緍注緍綸也趙曰以言前此不在浣花而人往往得之消中祗自惜洙曰消一作霄趙曰公自言也取古人以此消中消渴也司馬相如常有消渴病晚起索誰親洙曰嵆康與山濤書晝卧喜晚起而當閞呼之不置一不堪也趙曰為况蕭索無親之者又音求索之索言將求誰親我乎亦通以俟明識伏柱聞周史洙曰史記老子周守藏室之吏也而史記周太史儋見秦孝公或曰儋即老子也王康琚詩伯夷竄首陽老聃伏柱史師曰柱史比王公乘槎似漢臣洙曰見查上憶張騫詩注趙曰兩句指言王侍御上句以御史之官故用老子比之老子為周柱下史下句豈王侍御嘗使吐蕃乎別篇有云魂斷使臣鞍查上似張騫鴛鴻不易狎龍虎未冝馴趙曰言王侍御如鴛鴻龍虎之莫能狎馴也客即挂冠至洙曰葛洪挂冠不仕交非傾蓋新洙曰鄒陽傳白頭如新傾蓋如故師曰時公守漠州甫往依之公一見如舊不以甫貧賤為耻故甫嘆丗之勳貴不易親近比之鴛鴻龍虎而有取於公之傾蓋由來意氣合直取性情真浪跡同生死洙曰亡壽夭也趙曰言共遭亂離而為友即同生同死也無心耻賤貧洙曰樂窮通也偶然存蔗芋洙曰蜀都賦瓜疇芋區甘蔗辛薑幸各對松筠洙曰歲寒之物也粗飯依他日洙曰公孫洪脫粟飯窮愁怪此辰洙曰虞卿窮愁女長裁褐穩男大卷書勻洙曰四句通義言粗糲之飯依如他日所以窮愁者繼以女長男大則昏嫁之事迫矣漰口江如練鄭曰漰普崩切又普氷切洙曰漰口岷江所經也謝玄暉詩澄江靜如練趙曰此巳下言王侍御所居也樂史寰宇記李氷擁江作漰口漰堰在導江縣蠶崖雪似銀洙曰蠶崖閣名在西山也名園當翠巘野棹沒靑蘋洙曰宋玉風賦風生於地起於靑蘋之末屢喜王侯宅時邀江海人洙曰邀一作逢趙曰王侯宅普言之而王侍御亦在其中矣江海人公自况也追隨不覺晚洙曰江文通月出照園中冠佩相追隨欵曲動彌旬但使芝蘭秀洙曰謝玄暉少為叔父安所器重安嘗戒約子姪輩曰子弟亦何豫人事而正欲使其佳諸人莫有言者玄答曰譬如芝蘭玉樹欲使其生於庭階耳安悅何須棟宇鄰趙曰陶淵明答龐參軍四言詩歡心孔洽棟宇惟鄰公居在成都浣花注侍御在導江故有此句也山陽無俗物洙曰向秀字子期與嵆康為竹林之游作思舊賦云濟黃河以泛舟兮經山陽之舊居顔延年向常恃流連何裏游惻愴山陽賦師曰言王門下無俗客也鄭驛正留賔洙曰見置驛嘗如此注趙曰史記鄭莊為太子舍人嘗置驛馬於長安諸郊請謝賔客夜以繼日出入並鞍馬光輝參席珍洙曰參一作忝儒行儒有席上之珍趙曰鮑明逺云鞍馬光照地重遊先主廟洙曰見謁先主廟詩注師曰自此句以下甫又傷嚴武之死朋舊雕喪今幸遇王侍御禮待之隆可以駐足更歷少城闉洙曰少城張儀城石鏡通幽魄洙曰見石鏡詩注琴臺隱絳唇洙曰文君桃琴心事鮑明逺蕪城賦若夫歌堂舞閣之基玉貌絳唇莫不理魂幽石委骨窮塵趙曰蜀王葬其妃徇以石鏡琴臺則司馬相如彈琴之所送終惟糞土結愛獨荆榛置酒髙林下師曰自此句以下叙甫之依王也觀碁積水濵趙曰此以結上句初以石鏡送終今墓中之人巳糞土矣以琴結夫婦之情今則徒生荆棘矣既往之事為可弔則置酒觀碁以遣懷耳區區甘纍趼洙曰謂奔走避難故纍趼也趙曰趼足瘡也莊子云百舍重趼而不息鄭曰趼古典切胝也稍稍息勞筋洙曰孟子曰勞其筋骨蘇曰秦伯犂㱕永嘉十餘年謝絶人事杜門著書人勸其仕秦曰邇來漸覺耳目清爽勞筋稍息何再為耶網聚粘圎鯽絲繁煮細蓴洙曰蓴菜也陸雲曰千里蓴羹趙曰此又言㱕成都之樂也網聚則漁者非一人之網耳謂之絲繁以言其多本草云鯽魚合蓴作羹食良長歌敲栁癭洙曰栁癭木之節目如疣鄭曰癭於郢切瘤也小睡憑藤輪洙曰蒲團也以藤為之蘇曰魯宿有白藤輪嘗憑坐待曉農月須知課田家敢忘勤鄭曰忘無放切浮生難去食洙曰洪範八政一曰食食者万勿之始人之所本良㑹惜清晨洙曰曹子建名都賦雲散還城邑清晨復來還列國兵戈暗今王德教淳要聞除猰㺄鄭曰上烏八下勇主切獸名洙曰揚子雲長楊賦云昔有強秦封豕其士窫其民鑿齒之徒相與磨牙而爭之窫食人之獸修可曰尓雅猰㺄類貙虎牙食人迅走山海經曰少城山有獸狀似牛而赤身人靣馬足名曰窫聲如嬰兒則窫自是一獸注引窫證猰㺄非也師曰猰㺄北盜賊當從尓雅說休作畫麒麟洙曰見今代麒麟閣注趙曰但以除猰㺄為心不必志於閣畫麒麟閣上也洗眼看輕薄洙曰崔宏見長安中多豪家輕薄子曰吾當洗眼見尓曹矣輕薄言交道之不終者蓋公有激而云虛懷任屈伸莫令膠漆地萬古重雷陳洙曰古詩以膠投漆中誰能别離此後漢陳重與同郡雷義同為舉辟更相推讓鄉里為之語曰膠漆自為堅不如雷與陳趙曰公之望王侍御者至矣秋日荆南送石首薛明府辭滿告别奉寄薛尚書頌德叙懷斐然之作三十韻南征為客久西候别君初趙曰上句言其在江陵也梁張纘南征賦西候屬西之時候乃秋日也歲滿歸鳬舄洙曰見真賜還冝出尚方注趙曰鳬舄以薛明府之為縣令即王喬之乘鳬秋來把鴈書洙曰見雖無南去鴈注趙曰應得其兄尚書之書也鴈書使蘇武事荆門留美化洙曰唐蕭銑屯軍荆門號荆門軍在夷陵鄭曰荆門山名十道志荆門江陵縣郢城縣東南岸有荆門山姜𬒳就離居洙曰續漢書姜肱兄弟三人皆以孝行著名肱年長與二弟共被卧親友如此聞道和親入洙曰見肯慮白登圍注垂名報國餘連枝不日並八座幾時除洙曰見起居八座太夫人注景帝紀注凡言除者除故官就新官趙曰言尚書與薛石首不日相並如木之連理枝也往者胡星孛洙曰胡星旄頭也孛星光芒短其光四出逢逢孛孛然趙曰指言祿山也恭惟漢網踈洙曰漢刑法志禁網踈闊風雲相澒洞鄭曰澒胡孔切洙曰洞簫賦風洪洞而不絶澒相連貌趙曰凡兵乏地謂之風塵淮南于曰未有天地之時鴻濛澒洞莫知其門天地一丘墟洙曰王粲詩崤函復丘墟趙曰言人民寡而城郭荒矣殿瓦鴛鴦坼洙曰鄴都銅雀臺皆鴛鴦瓦庾信賦昔為一雙瓦飛入魏王宮趙曰魏文帝問周宣王曰吾夢殿屋兩瓦墜地化為鴛鴦何也宣對曰後宫當有暴死者帝曰吾詐卿耳宣曰夫夢者意耳苟以形言便占吉凶言未卒黃門令奏宫人相殺宮簾翡翠虛洙曰西京雜記有翡翠簾鉤陳摧徼道洙曰西都賦周以鉤陳之位衛以嚴更之署又周廬千列徼道綺錯槍櫐失儲胥鄭曰櫐力軓切洙曰長楊賦木擁槍櫐以為儲胥注槍櫐作木槍相櫐為柵也儲胥銑注武帝先作迎風館於甘泉山後加露寒儲胥二館趙曰上四句以言京師之陷而宮殿之毀也文物陪巡狩趙曰指言肅宗幸鳯翔也文物陪則言衣冠集於此也親賢病拮据鄭曰拮吉屑切据斤於切趙曰詩云豫手拮据注云拮据撠挶也言為巢之至苫其手病也公時呵猰㺄洙曰猰㺄摩牙而食人定功曰尓雅猰㺄類貙虎牙食人首唱却鯨魚洙曰見上京觀且僵尸注趙曰鯨魚大魚左傳曰取其鯨鯢以為京觀呵猰㺄却鯨魚以譬却退巨賊之義勢愜宗蕭相洙曰蕭相謂蕭何也國之宗臣材非一范睢洙曰史記載范睢逃魏梁之辱入秦為相終復魏梁之讎趙曰公自注蓋秦拜范睢為客卿卒聽其謀使五大夫綰伐魏拔懷其相秦也東伐韓少曲髙平拔之又以其謀縱反間於趙趙以馬服子代廉頗大破趙於長平皆范睢之謀故以比諸將尸填太行道鄭曰行胡剛切血走浚儀渠洙曰太行山在何北浚儀汴河也滏口師仍㑹鄭曰滏方矩切水名函關憤巳攄趙曰函谷關是巳於是復京師矣紫微臨大角洙曰隋天文志紫微天帝之座也又大角一星在攝提天王座也又名天棟趙曰言肅宗還長安也皇極正乘輿洙曰皇極乘輿輿子輦屬趙曰洪範曰建用皇極史曰乘輿返正皇極賞從頻峨冕鄭曰從才用切洙曰僖二十四年傳晉侯賞從亡者殊私再直廬洙曰公自注公舊執金吾新受羽林前後二將軍趙曰直廬則直宿殿廬也豈惟髙衛霍曽是接應徐洙曰衛青霍去病應德璉徐公幹降集翻翔鳯洙曰賈誼賦鳯凰翔于千仞兮覽德輝而下之趙曰言兄弟如鳯之翺翔也追攀絶衆狙洙曰莊子朝三暮四衆狙皆怒侍臣雙宋玉洙曰宋玉楚襄王大夫戰䇿兩穰苴洙曰穰苴有司馬兵法趙曰今以文章言之則文章如雙宋玉以戰䇿言之則武略如兩穰茸乃所以美薛之兄弟也鑒徹勞懸鏡趙曰公言蒙尚書之鑒照澄徹如鏡之懸也荒蕪巳荷鋤洙曰見上春言終荷鋤注趙曰公自昔從事於翰墨今以荒蕪而乃從事於耕耘矣嚮來披述作洙曰石首處見公新文重此憶吹噓洙曰見上只待吹噓送上天注白髮甘凋喪靑雲亦卷舒經綸功不朽趙曰又以言薛尚書也跋涉體何如洙曰公自注公頃奉使和吐蕃巳見上應訝耽湖橘洙曰潭州有橘洲常餐占野𬞞十年嬰藥餌洙曰見上藥餌扶吾隨所之注萬里狎樵漁揚子淹投閣洙曰見子雲識字終投閣注鄒生惜曵𥚑洙曰鄒陽書何王之問不可曳長𥚑乎趙曰揚子鄒生公以自况也但驚飛熠耀洙曰東山詩熠耀霄行注熠耀燐也燐螢火不記改蟾蜍洙曰謝玄暉詩借問下車日匪直望舒圎張景陽下車如昨日蟾蜍四五圎古詩四五蟾蜍缺三五明月滿趙曰兩句皆以記時之變易也煙雨封巫峽江淮略孟諸洙曰孟諸九澤名云趙曰公追言其舊居也湯池雖險固洙曰金城湯池蘇曰侯本論曰金城湯池雖然險固亦不可恃遼海尚闐淤努力輸肝膽休煩獨起豫洙曰起豫者商也趙曰時幽燕猶有不順命者矣前漢溝洫志云填淤反壤之害師古曰填淤謂壅泥也未句所以激之也師曰師古曰以木擁搶及櫐繩連結以為儲胥有儲蓄以待所須也薛尚書嘗奉使回紇乞兵以助討故云聞道和親入埀名報國餘文物陪巡守言尚書昔隨玄宗幸蜀親賢病拮据言皇子皆流離辛苦也猰㺄喻盜賊公時唱大義以討賊豈特一范睢相秦但復魏齊之讎乎滏口師仍㑹言公督諸節度兵㑹於滏口收復京師故曰函關憒巳攄皇極正乘與言天子還京也豈惟髙衛霍曽是接應徐德璉徐公幹文士也天子中興非特賞武功且又禮接文儒而公文倍宋玉武過穰首侍帝廟堂子美但荷鋤躬耕而巳故曰荒蕪巳荷鋤遼海尚填淤言祿山未平故子美未章勉薛尚書為國立功不獨為詩以起豫也寄彭州髙三十五使君適􅉑州岑二十七長史參三十韻故人何寂寞洙曰故一作古今我獨凄凉老去才難盡秋來興甚長洙曰潘安仁有秋興賦物情尤可見師曰目有所見則心有所感故云云詞客未能忘洙曰詞客謂髙岑也俱以詩名丗海內知名士雲端各異方洙曰彭在蜀􅉑在山南髙岑殊緩步沈鮑得同行洙曰沈休文鮑明逺言髙岑可與沈識並驅也意愜關飛動篇終接混茫趙曰以言二子之詩其妙如此沈佺期祭文思合飛動才冠卿雲舉天悲冨駱洙曰冨嘉謨為文皆以經典為本時人欽慕文體為之一變駱賔王嘗作帝京篇當時以為絶唱近代惜盧王洙曰盧照鄰王勃也照鄰為鄧王典籖王重其文待以相如勃六歲能文與兄勔助才相類人謂之王氏三珠樹悲惜各以才不容於丗故也似爾官仍貴前賢命可傷洙曰傷上四人趙曰富謂冨嘉謨駱謂駱賔王盧謂盧照鄰王謂王勃蓋皆文章之伯而不容於丗以言髙岑二子亦文章而作貴官則比四子為得志矣諸侯非弃擲半刺巳翶翔洙曰刺史古之諸侯庾亮與郭游書曰别駕與刺史同流王化於萬里任居刺史之半安可非其人也趙曰諸侯以言髙適為刺史半刺以言岑參詩好幾時見書成無使將趙曰言公在秦州欲寄書於二公也男兒行處是客子閫身強羈旅推賢聖洙曰孔孟皆羈旅趙曰公自言孔孟皆如此不獨我也沉綿抵咎殃三年猶瘧疾一鬼不銷亡鮑曰公遇王倚詩云瘧癘三秋熟可忍寒熱百日交相戰與此正合三秋謂一在鄜一在華一在秦地趙曰公言其病之沉綿也丗言瘧鬼故云隔日搜脂髓增寒抱雪霜洙曰此言瘧之狀也徒然潜隙地有靦屢鮮粧洙曰俗言辟瘧鬼必伏於幽隙之地不爾即畫容易貌鄭曰靦他典切說文靣見也何太龍鍾極蒼舒曰按廣韻龍鍾竹名丗言龍鍾取此義也謂其年老如竹之枝葉搖曳而不能自禁持也子今出處妨趙曰言病則龍鍾而妨出入也無錢居帝里盡室在邊疆洙曰寓同谷也劉表雖遺恨龐公至死藏洙曰見劉表不得取注趙曰後漢龐公襄陽人也居峴山之南未嘗入城府荆州荆史劉表數延請不能屈竟隱於鹿門山不反心微傍魚鳥魯曰嵆康游山觀魚鳥而心甚樂之肉瘦怯豺狼洙曰豺狼類貪暴者蘇曰漢元狩中盜賊屢起州邑割據隱君子往往遭害申舒隱中條山行潔德著謂諸子曰吾肉瘦法衆豺狼蓋言兵戈之際君子不能全其身也工部值祿山亂流離悲怨用此句語故得其趣不假群書證一詩一句足矣隴草蕭蕭白洮雲片片黃彭門劒閣外洙曰劒閣劒關也在蜀定功曰後漢郡國志湔氏道注蜀王夲紀曰縣前有兩石對如關號曰彭門􅉑略鼎湖傍洙曰號有朔城乃鼎湖也夢符曰右按史記黃帝採首山之銅鑄鼎於荆山下鼎成乘龍而升天虢鼎湖此近鼎略未知孰是又張平子西京賦想乘龍於鼎湖荆玉簪頭冷趙曰荆山之王也為岑君而言巴箋染翰光洙曰荆玉出􅉑巴箋蜀箋也趙曰為髙君而言烏麻蒸續曬丹橘露應嘗豈異神仙宅俱兼山水鄉竹齊燒藥竈花嶼讀書床更得清新否遙知對屬忙洙曰言吟詩也趙曰言二子才思清新也舊官寧改漢淳俗本歸唐師曰􅉑本晉地詩國風曰此晉也而謂之唐本其風俗憂深思逺乃有堯之遺風焉故云濟丗宜公等安貧亦士常趙曰安貧公自言也蚩尤終戮辱胡羯漫猖狂洙曰史記蚩尤最為暴黃帝能伐之胡羯安史也㑹待妖氛靜論文暫裹糧洙曰孟子曰行者裹糧言往論文也蘇曰韓裹糧就揚雄學授太元解師曰甫欲冦平裹糧就高共論文章故有末句奉贈蕭二十使君昔在嚴公幕俱為蜀使臣艱危參大府前後間清塵洙曰嚴再鎮成都今復參幕公自注嚴再領成都余復參幕府趙曰蕭於嚴公𥘉鎮時入幕而公在其再來時遂為間也起草鳴先路趙曰言蕭自嚴幕而往為舍人矣唐制舍人凡詔旨制勑璽書冊命皆起草乘槎動要津洙曰見虛乘八月槎注古詩先據要路津趙曰以言其貴也王鳬聊暫出洙曰見逺愧尚方曽賜履注蕭雉只相馴洙曰蕭望之為郎有雉隨魯恭為中牟令翟雉馴於桑下趙曰蕭廣齊孝子傳蕭芝至孝除尚書郎有雉數十頭飲啄宿止當上直送至歧路下直入門飛鳴車前舊注引蕭望之惑後學矣終始任安義洙曰前漢任安字少卿為益州刺史司馬遷書責以古賢臣之義也修可曰前漢衛青為大將軍霍去病為驃騎將軍祿秩與大將軍等自是青日衰而去病日益貴故人門下多去事去病輒得官爵惟任安不背去子美詩首云昔在嚴公幕俱為蜀使臣及有塤篪金石之語元注云嚴公既沒老母在堂使君溫清之問若巳之周庭焉及太夫人傾逝又撫孤之情不减骨肉以是考之足以見蕭使君如任安之事衛青有終始之義注引司馬遷責以古賢臣之義非是荒蕪孟母鄰聮翩匍匐禮洙曰詩凡民有喪匍匐救之意氣死生親洙曰公自注云嚴公殁後老母在堂使君溫清之問甘脆之禮名數若已之庭闈焉大夫人傾逝喪事又首諸孫主典撫孤之趙曰所謂一死情不减骨肉則膠􅃮之契可以見矣一生乃見交情也張老存家事洙曰左專晉侯以張老為中軍司馬趙曰禮記檀弓晉獻文子成室晉大夫發焉張老曰美哉輪焉美哉奐焉歌於斯哭於斯聚國族於斯今公以張老比蕭使君言能存嚴公之家令諸孫奉太夫人喪事哭於斯聚國族於斯不失其家也嵆康有故人洙曰康臨死謂子曰山公在汝不孤矣食恩慙鹵莽趙曰言蕭使君之心舊食嚴公之恩尚慙報之鹵莽鏤骨抱酸辛趙曰言蕭使君御嚴公之恩銘鏤肌骨常抱酸辛阮嗣宗詩悽愴抱酸辛巢許山林志趙曰公以巢公許由自比也䕫龍廊廟􅎇洙曰巢父許由䕫與龍也趙曰言蕭使君也䕫則典樂之䕫龍則納言之龍如三人之林當在廟堂也舊以為龍逢誤鵬圖仍矯翼洙曰見泊嶽陽樓詩變化有鵾鵬注熊軾且移輪趙曰言蕭使君如大鵬之圖南仍矯奮其翼固當遂晉擢矣而且為太守故憑熊車以移輪也磊落衣冠地蒼忙土木身洙曰嵆康土木形骸趙曰公自言其身如嵆康而亦在衣冠之列也塤篪鳴自合洙曰詩天之牖民如塤如篪絶交論道協膠漆志婉變於塤箎金石瑩逾新洙曰文賦𬒳金石而德廣流管絃而日新趙曰於是再與蕭相見如塤箎之合而金石不移所以瑩逾新重憶羅江外鄭曰寰宇記本涪城縣地天寶元年為羅江縣同遊錦水濵趙曰羅江屬綿州錦水則成都也結歡隨過隙蘇曰王陽與子結歡眼隨過隙之駒趙曰莊子曰人生一丗如白駒過隙懷舊益霑巾洙曰陸賈傳君何不交歡太尉深相結潘安仁懷舊賦涕泣流而霑巾曠絶含香舍洙曰見不去非無漢署香注趙曰後漢尚書郎口含雞舌香以其奏事欲使氣芬芳也公為工部貟外郎而不得坐省所所以為曠絶稽留伏枕辰洙曰張茂先詩伏枕終遙昔寤言莫豫應趙曰詩展轉伏枕停驂雙闕早洙曰謝玄暉停驂我悵望趙曰言不得朝謁而思入朝之士回鴈五湖春洙曰沈休文旅鴈每回翔趙曰言在湘潭之時也張勃吳録五湖者太湖之別名以其周行五百里故名之不逹長卿病洙曰見長卿多病後注趙曰長卿有消渴之疾而公亦同之故自怪其不省解如此從來原憲貧洙曰見奉贈韋左丞詩寧甘原憲貧注監河受貸粟一起轍中鱗洙曰見莊子轍魚事贈李八祕書别三十韻往時中補右扈蹕上元初洙曰扈扈從也蹕鳴蹕也天子之出鳴蹕以淸道後漢輿服志蘭臺令史皆執蹕以督整專驅謂之護駕反氣凌行在洙曰天子所幸謂之行在反氣謂賊未破也妖星下直廬洙曰見收京詩注陸機詩云厭直承明廬六龍瞻漢闕洙曰易時乘六龍蕭何作漢宫闕記萬騎略姚墟洙曰蔡雍獨斷曰大駕備千乘万騎王元長曲水序殷殷均乎姚澤帝王丗紀曰瞽搜之妻曰握登生舜於姚墟故得姓氏於姚氏也玄朔巡天步洙曰巡一作回詩天步斯頻神都憶帝車洙曰武后以東都為神都時天子尚在蜀故言憶後漢輿服志以攜龍角為帝車一戎才汗馬洙曰書一戎衣天下大定公孫弘臣愚駑無汗馬之勞師古曰言未嘗從事軍旅也百姓免為魚洙曰昭元年劉子曰美哉禹功明德逺矣微禹吾其魚乎蘇曰漢中河决蕭望之塞定人曰百姓免此回為魚事見塞河碑通籍蟠螭印洙曰通籍注籍者為二尺竹牒記其年紀名字物色懸之宫門案省相應乃得入蟠螭謂印鼻劒上文也晉陽春秋曰重光照洞微上蟠螭文隱起夢符曰右按漢官義天子六璽皆玉螭虎紐也差肩列鳯輿事殊迎代邸洙曰髙帝崩吕産欲危劉氏周勃為丞相陳平朱虛矦劉章共誅諸吕遂奉天子法駕迎代王於伐邸立為孝文皇帝喜異賞朱虛洙曰齊哀王弟章入宿衛於漢髙后封為朱虛侯以吕祿女妻之後吕祿吕産作亂章與太尉周勃丞相平等誅之章乃先斬吕産文帝益封朱虛侯二千戶黃金一千斤冦盜方歸順洙曰歸順歸降納欵乾坤欲晏如洙曰寧靜也不才同𥙷衮洙曰謂作拾遺也衮職有闕仲山甫𥙷之奉詔許牽𥚑洙曰魏辛毗字佐治文帝欲徙兾州七家十萬户實河南毗諌帝怒不答起入毗隨而引其𥚑帝怒良久乃出曰佐治卿持我何太急耶毗曰今徙既失人心又巳無食帝遂徙其半鴛鷺叨雲閣洙曰古詩厠迹鴛鷺行謂侍從列也潘安仁髙閣連雲騏驎滯玉除洙曰一作石渠屬李祕書也文園多病後洙曰司馬相如傳相如嘗有消渴疾後拜為孝文園令中散舊交踈洙曰嵆康為中散飄泊哀相見平生意有餘風煙巫峽逺洙曰煙一作塵臺榭楚宮虛洙曰一作除觸目非論故洙曰阮步兵詩云物固不可論新文尚起豫洙曰語起豫者商也清秋凋碧桞别浦落紅蕖消息多旗幟洙曰髙紀張旗幟於山上為疑兵經過歎里閭洙曰為喪亂多凋弊戰連脣齒國洙曰僖五年傳晉侯假道於虞以伐虢宫之竒諌曰􅉑虞之表也􅉑亡虞必從之此所謂輔車相依脣亡齒寒者其虞􅉑之謂軍急羽毛書洙曰魏武帝奏事曰若有急則插羽於檄謂之羽檄幕府籌頻問洙曰李廣幕下省文書師古曰幕府者以軍幕為義山家藥正鋤洙曰袐書北卧青城山下台星入朝謁使節有吹噓西屬災長弭南翁憤始攄對揚抗士卒鄭曰揚余章切洙曰益稷曰時而揚之注揚道揚舉也畢命對揚文武之光命又說命敢對掦天子之休命乾沒費倉儲鄭曰乾居寒切洙曰張湯傳湯始為小吏乾沒與長安冨賈田甲魚翁叔之屬交私服䖍曰乾沒謝成敗也如淳曰豫居物以待之得利為乾失利為沒勢藉兵須用功無禮忽諸御鞍金騕裊洙曰漢書音義曰騕裊者神馬也赤喙烏身與飛兔同明君有德則至宮硯玉蟾蜍洙曰西京雜記晉靈公冡甚壞壯四角以石為玃犬捧燭石人男女四十餘皆立侍棺器無復形兆尸猶不壞孔竅中皆有金玉其餘器物皆朽爛不可別惟有玉蟾蜍一枚大如拳腹空容五合水光潤如新玉取以盛其書滴拜舞銀鈎洙曰銀鈎字也猶詔書恩波錦帕舒洙曰西京雜記言袐閣圖書皆表以牙籖覆以錦帕此行非不濟良友昔相於去棹依顔色㳂流想疾徐沉綿疲井臼洙曰馮衍傳兒女常自操井臼倚薄似樵漁乞米煩佳客洙曰乞去聲鄭曰乞云既切與人物鈔詩聽小胥鄭曰鈔楚交切洙曰小胥小吏也杜陵斜晚照洙曰漢書曰宣帝葬杜陵元紀杜陵在長安南五十里張湯為御史大夫蕭望之為前將軍皆徙杜陵也潏水帶寒淤鄭曰潏以律切淤衣居切洙曰潏水名也上林賦豐鎬潦潏杜陵潏水公之故里莫話青溪髮鄭曰在荆州鬼谷子學仙處蕭蕭白映梳蘇曰黃休年老多病素髮映梳燈下不辨蠅頭丗事疏也奉贈盧五丈參謀琚鄭曰斤於切洙曰丈人使自江陵在長沙待恩旨先支率錢米恭惟同自出洙曰左傳我之所自出謂我甥也妙選異髙標入幕知孫楚洙曰孫楚子子荆石苞都督揚州事孫楚為參軍披襟得鄭僑洙曰鄭僑子産也孔子與為友趙曰左傳季札聘於鄭見子産如舊相識丈人藉才地趙曰丈人指言廬五參謀也門閥冠雲霄老矣逢迎拙相於契託饒趙曰言雖衰老拙於逢迎而與盧丈相於所以契託饒縱也賜錢傾府待爭米駐船遙趙曰題注所謂支率錢米也鄰好艱難薄氓心杼軸焦夢符曰右按揚雄方言土作謂之杼木作謂之軸大東小東杼軸其空軸當作柚又後漢劉騊駼書曰杼柚空於公私之求趙曰盧丈使自江陵也蓋當艱難之際杼軸空而民心焦敖則不可多斂以為鄰好之奉也客星空伴使洙曰嚴光也見鈞瀨客星懸注趙曰客星公自謂也伴使以言伴盧之為使星也舊注引嚴陵事雖是客星兩字而惑亂其義矣寒水不成潮素髮乾埀領鄭曰乾居寒切洙曰秋興賦素髮颯以垂領師曰自言其老矣銀章破在腰洙曰見霧雨銀章濕注蘇曰張嵩清之守莭為巴西令官滿駕柴車載書數百卷腰垂破銀章辝邑人而去邑人惜其去懇留於隋文帝即日擢為巴西太守有德政遺愛碑尚在余為兒童聞先子對客談此說詩能纍夜醉酒或連朝洙曰中山有酒一醉千日趙曰公自言也藻翰惟牽率洙曰左傳牽率老夫湖山合動搖蘇曰王逸少清氣壯節搖湖山時清非造次興盡却蕭條天子多恩澤蒼生轉寂寥休傳鹿是馬洙曰趙髙指鹿為馬莫信鵩為梟洙曰見地濕愁飛鵩注又見留别杜貟外注未解依依𬒮還斟泛泛瓢流年疲蟋蟀洙曰詩蟋蟀在堂歲律云暮古詩四時更變化歲暮一何速晨風懷苦心蟋蟀傷局促體物幸鷦鷯洙曰莊子鷦鷯巢林不過一枝文賦體物而瀏湸張茂先作鷦鷯賦辜負滄洲願洙曰謝玄暉詩復叶滄洲趣誰云晚見招蘇曰嵆康云年來名利汩沒未遂休間深負滄洲願心趙曰此公感激之言涵蓄深逺揚雄檄虛賦曰丗有黃公者起於滄洲精神養性與道漂游太冲詩曰馮公豈不偉白首不見招則見招者乃朝廷也李陵云陵雖孤恩漢亦負德孤負本只是孤獨之孤舊作辜負流傳之誤矣師曰前溪朱博傳齎閥閲詣府師古注曰伐功勞也閲所經歷也車千秋傳曰千秋無伐閲勞注伐積功也閲所經也唐六典以上通用烏頭大門又曰表揭又曰閥閲義謝云表揭閥閲是也俗呼為檽星門是詩所謂閥閲冠雲霄者蓋言盧氏積日積月立功而致表揭髙於雲霄賜錢傾府待爭米駐船搖謂盧丈待恩旨未到先支錢米以民心焦急也寒水不成潮言水淺也峽人以春水生乃行船自素髮以下乃子美自述休傳鹿是馬言天子聰明也莫信鵩如梟言莫愁遷謫也滄州神仙所居之地也云云贈崔十三評事公輔飄颻西極馬洙曰漢郊祠歌云天馬來西極來自渥窪池洙曰見沙苑行注趙曰言崔公有天馬之妙而所從來之逺也漢郊祠歌曰馬生渥窪水中颯飁定山桂洙曰定一作寒趙曰當作寒山楚辝云桂樹叢兮山之幽此其義也師曰定山當作鄧山鄧林有桂西極馬鄧山桂比崔公之才低徊風雨枝趙曰選詩桂枝生自直不冝低徊今桂所以低回者風雨之故也以譬崔評事之美材而困於邊徼之水官矣彥輔曰飁音習唐韻云颯飁大風也我聞龍正直道屈爾何為趙曰如龍之直而屈在僚屬故公怪而問之且有元戎命洙曰屈道而起謂有元戎之命悲歌識者知洙曰元戎節度使也以元戎命之而有行役不能無悲歌而惟識者知之官聮辭冗長洙曰文賦固無取乎沉長鄭曰長直亮切多也趙曰崔評事於元戎之僚屬可辝冗長矣師曰時王思禮為帥表請崔為幕職故云云冗長不急之務也行路洗欹危洙曰當闢公正之路趙曰以舟行則免欹危之苦也脫劒主人贈洙曰脫解也季札脫劒挂樹以贈徐君趙曰主人指元戎也以劒贈人亦理之常如伍子胥解劒以贈漁父也舊注引季札以劒挂徐君墓上却是贈死者耳可用證此乎去帆春色隨隂沉鐵鳯闕洙曰陸佐公石闕銘蒼龍玄武之制銅爵鐵鳯之工教練羽林兒洙曰宣帝紀羽林孤兒注天有羽林星林諭若林木之盛羽有羽翼􅋧擊之意故以名武官焉百官表取從軍死事者之子養羽林官教以五兵號曰羽林孤兒天子朝侵早雲臺仗數移趙曰言天子多難其朝侵早以兵練卒故所御非一處而移雲臺之仗矣分軍應供給百姓日支離洙曰支離言不親黠吏因封巳公才或守雌洙曰老子知其雄守其雌趙曰封厚也言貪吏乘之以封巳廉吏閔之以柔克也公正美崔公之才守雌柔之道不乘勢刻削以嵆於封己則為可尚尓燕王買駿骨洙曰燕昭王以金帛市駿骨人知好駿馬不逺千里而來渭老得熊羆洙曰見田獵舊非熊注活國名公在拜壇群盜疑冰壷動瑶碧洙曰鮑昭清如玉壷冰野水失蛟螭黃曰謂寇賊將就擒也入幕諸彥集洙曰别賦捨金閨之諸彥渴賢髙選冝騫騰坐可致九萬起於斯洙曰見圖南未可料注趙曰方當渴賢而崔君冝應髙選必能騫騰如鵬飛之九萬里矣黃曰言崔奮迅自此始復進出矛㦸昭然開鼎彞洙曰銘功於鼎彜㑹看之子貴歎及老夫衰豈但江曽决洙曰孟子若决江河還思霧一披洙曰衛瓘見樂廣曰若披雲霧覩青天趙曰我豈特平昔與之談論如江河之决當此之時又思一披霧以相見也暗塵生古鏡拂匣照西施舅氏多人物孫曰崔乃子美之舅氏其人物為丗所重故曰多人物多重也無慙困翮垂趙曰舅氏之家多有好人村必應如我上所言騫騰冨貴之事今日尚尓行役無慙困苦也寄李十四貟外布十二韻洙曰新除司議郎兼萬州别駕雖尚伏枕巳聞理裝名參漢望苑洙曰漢博望苑武帝為戾太子置之使通賔客從其所好職述景題輿洙曰周景為豫州刺史辟陳蕃為別駕蕃不就景題别駕輿曰陳仲舉坐也巫峽將之郡荆門好附書趙曰預囑其不相忘也逺行無自苦蘇曰王粲逺行異域無勞自苦事事慎重內熱比何如洙曰內熱言熱中也莊子我其內熱歟正是炎天闊那堪野館踈黃牛平駕浪洙曰黃牛峽名郭景純髙浪駕蓬萊畫鷁上凌虛洙曰謝靈運詩鷁首戲清池修可曰張平子西京賦鷁首注云船頭畫鷁鳥厭水神試待盤渦歇洙曰郭璞江賦盤渦谷轉凌濤山頽趙曰水漲則有盤渦今勸其且休行故曰待盤渦歇方期解纜𥘉洙曰江淹解纜候前侣還望方鬱陶悶能過小徑自為摘嘉𬞞洙曰自一作日陶淵明歡言酌春酒摘我園中𬞞趙曰自此巳下約李貟外訪其居也渚桞元幽僻村花不掃除宿隂繁素㮏洙曰潘安仁間居賦云㮏曜丹白之色過雨亂紅蕖趙曰紅蕖蓮花寂寂夏先晚趙曰以處所幽寂雖夏未晚而此地先晚將似秋矣泠泠風有餘江清心可瑩洙曰郭景純詩前有寒泉井聊可瑩心神竹冷髮堪梳洙曰堪一作宜直作移巾几秋帆發弊廬夢符曰右按春秋左氏張躍謂太叔曰自子之歸也小人糞除先人之弊廬曰子其將來今子皮實來小人失望師曰黃牛峽浪髙與峽齊故云平駕浪畫鷁船也上凌虛謂船逆水而上如凌虛空盤渦言水回伏如碾碓然甫意欲待峽水稍平穩即解纜訪李故末章云直作移巾几秋帆發弊廬寄董卿嘉榮十韻聞道君牙帳洙曰曹子建關中詩髙牙乃建牙大旗也兵家書牙旗將軍之旗立於元帥帳前故謂之牙旗防秋近赤霄洙曰謂西山三戍也西山記曰東觀成都若在井底下臨千雪嶺洙曰西山記曰上有積雪經夏不消却背五繩橋洙曰岷江湍急不可為梁乃以竹繩為橋駕虛而渡鄭曰即岷江笮橋海內久戎服洙曰用兵日久京師今晏朝洙曰後漢明帝論曰明帝善刑理法令分明日晏坐朝幽枉必逹洙曰以前日用兵之久而今日罷兵則可以晏朝也犬羊曽爛熳洙曰應劭曰鮮卑隔在漠北犬羊為群宫闕尚蕭條洙曰孫子荆書四海蕭條非復漢有顔延年宮陛多巢穴城闕生雲煙趙曰以吐蕃為患之久故前日嘗陷京師今尚蕭條也猛將冝嘗膽洙曰李陵書猛將如雲越王勾踐反國苦身勞思置膽於坐坐卧即仰膽飲食亦嘗膽也曰汝忘㑹稽之恥耶趙曰猛將謂董嘉榮也龍泉必在腰洙曰事見奉送蘇州李長史之任詩三尺獻龍泉注黃圖遭汚辱洙曰天子圖籍也趙曰有三輔黃圖之書言宫殿名號與京畿地理也月窟可焚燒洙曰長楊賦西壓月窟又言月窟雖髙猶可燒之也蘇曰吳術曰大丈夫按劒橫行沙塞取月支之首焚其竁窟向區區奔走塵埃中為掃門兒態耶章炳壯其言薦為遊擊將軍趙曰指言吐蕃巢穴也㑹取干戈利趙曰此戒董卿之辝干戈利則書敿乃干榖乃戈之義無令斥候驕洙曰西域傳斥候百人五分之夜擊刀斗自衛趙曰無令其驕則號令嚴肅也候斥兵家探候也居然雙捕虜洙曰後漢丗祖建武四年拜馬武捕虜將軍顯宗𥘉西羌寇隴西覆軍殺將朝廷患之復拜武捕虜將軍自是一嫖姚洙曰霍去病為嫖姚校尉落日思輕騎蘇曰何斌輕騎數百轉戰至日暮斬馘擒酋首趙曰史有云輕騎襲之秋天憶射鵰洙曰李廣時為上郡太守胸奴侵上郡上使中貴人從廣勒習兵擊胸奴中貴人者將十騎從見胸奴三人與戰射傷中貴人殺其騎且尽中貴人走廣廣曰是必射鵰者廣乃從百騎往馳三人三人亡馬步行行數里廣令其騎張左右翼而廣自射彼三人者殺得二人生得一人果胸奴射鵰者修可曰北史斛律金子光見一大禽射之正中其頸形如車輪而下乃鵰也邢子髙歎曰此射鵰手也人號為落鵰都督是詩寄董嘉榮而元注引李廣傳胸奴射鵰非是雲臺畫形像洙曰見雲臺終日畫往皆為掃氛妖洙曰掃氛妖言能靜患亂也趙曰所以激昂董卿也漢雲臺畫二十八將之像以其有功氛妖也移居公安敬贈衛大郎鈞衛侯不易得余病汝知之雅量涵髙逺魯曰袁宏三國名臣贊淵哉大𥘉宇量髙雅淸襟照等夷尹曰袁􅙾答儉詩云老夫亦何寄之子照淸襟清氣溢素襟彥輔曰夷平也謂平交也平生感意氣趙曰言意氣之感也少小愛文辭蘇曰羊欣少小愛筆研文辝名公多竒之河海由來合風雲若有期洙曰河出崑崙千里一曲九曲入海古詩風雲若遇㑹形容勞宇宙洙曰陶潜寓形宇宙復幾時趙曰言憔悴而空老於丗質朴謝軒墀趙曰言無復仕於朝廷自古幽人泣洙曰易幽人貞吉流年壯士悲蘇曰文選流年苒苒壯士悲感水煙通徑草秋露接園葵洙曰陸士衡園葵詩種葵北園中零露垂鮮澤趙曰述其移居於公安之地也入邑豺狼鬪洙曰見上豺狼在邑龍在野注趙曰以比盜賊也言入邑之豺狼以有所爭而相鬪也傷弓鳥雀饑洙曰何晏似傷弓之鳥飢亦不敢自喙趙曰言傷弓之鳥以創病而飢也以比窮困之民白頭供宴語趙曰白頭公自謂也供宴語可以供衛公之語也烏几伴棲遲趙曰烏皮几也言遷於公安唯有烏几為伴耳交態遭輕薄洙曰古詩五陵輕薄兒今朝豁所思分門集注杜工部詩卷第十八
