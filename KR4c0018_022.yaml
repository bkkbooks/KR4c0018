  text: 分門集注杜工部詩卷第二十二
  hash: sha256:05c0299e00176a15e918d04f2709f3b2377ddd881ac37a47fc28ac1003bad311
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_022-1a}
body:
  text: 慶賀古詩一首律詩四首覽柏中允兼子姪數人除官制詞因述父子兄弟四美載歌絲綸洙曰按唐書柏氏無顯人惟柏耆傳云將軍良器之子元和中人不顯州郡甫又有詩寄柏學士林居趙曰此詩有戮力自元昆意其柏正節也然竊有疑焉公詩又有桓學士林居柏大兄弟詩柏二别駕詩豈可指言柏正節之家乎俟明識辨之紛然喪亂際見此忠孝門洙曰晉卞壼傳翟湯歎曰父死於君子死於父忠孝之道萃於一門蜀中寇亦甚柏氏功彌存深誠輔王室戮力見元昆洙曰魏書重以王室多故爾雅先生為昆漢髙紀勠力注并力也趙曰父子兄弟有功於行陳則詩人宜以忠孝稱之三止錦江沸獨清玉壘昏洙曰左太沖蜀都賦廓靈關而為門包玉壘而為宇注玉壘山名華陽國志錦江言蜀人織錦濯其中則色鮮明他江則不好故命曰錦江也成都記玉壘山導江縣西北三十里趙曰傳所謂以湯止沸也寰宇記曰濯錦江係之華陽懸公自入蜀見成都之亂蓋寶應元年徐知道反永嘉元年崔肝反殺郭英乂大曆三年七則楊子琳以瀘州刺史反此錦江之三沸也蜀都賦包玉壘而為宇李善注玉壘山名前水出焉以今考之永康軍是也髙名入竹帛洙曰鄧禹曰垂功名於竹帛新渥照乾坤洙曰渥恩也子弟先卒伍芝蘭疊與璠洙曰謝玄與從兄㓪為叔父安所器重曰譬如芝蘭玉樹生於階庭同心注師律洙曰易師出以律灑血在戎軒洙曰後漢贊二十八蔣有來羣后捷我戎軒梁吳均袖間血灑地絲綸實具載洙曰禮緇衣子曰王言如絲其出如綸王言如綸其出如綍言出彌大者也紱冕巳殊恩洙曰班固西都賦紱冕所興奉公舉骨肉誅叛經寒溫金甲雪猶凍朱旗塵不翻洙曰陸佐公石闕銘朱旗萬里每聞戰場説歘激懦氣奔聖主國多盜賢臣官則尊方當節鉞用蘇曰蔡雍謂董卓曰子氣勢方當節鉞之用何故兢兢耶必絶祲沴根鄭曰沴音戾趙曰以其有功必使之膺節鉞之用必絶泠根以報朝廷也吾病日回首雲臺誰再論洙曰後漢馬武等傳二十八將論云永平中顯宗追感前丗功臣乃圗畫二十八將於南宫雲臺上作歌挹盛事蘇曰張茂先作歌告萬方推挹盛事推轂期孤騫鄭曰惟通回切洙曰前漢鄭當特推轂士及官屬丞吏誠有味其言也注言薦舉人如車轂之輪轉也馮唐傳王者遣將跪而推轂此詩注柏中允為柏耆按新舊二史所載耆止入鎮州説王承宗諭承元移鎮及使李同捷以擅殺同捷流放至賜死而詩中乃言俲力於成都又云三止錦江沸即非耆矣切疑為柏貞節崔旰之殺郭英乂也貞節與瀘州楊子琳帥師以討之杜鴻漸鎮蜀表授卭州刺史二史皆於傳無所考信故未能修去闕之以俟有聞者趙曰舊注引馮唐事非是師曰求忠臣於孝子之門勠力并力也元昆長兄也錦江蜀有濯錦江銅梁玉壘蜀中二山名時崔旰殺郭英乂柏正節與楊子琳討平之然正節父子兄弟皆盡忠孝之節率先士卒注意師律流血於兵重其英聲義氣載之絲綸天子褒以紱冕其皇恩巳優渥矣故云新渥照乾坤芝蘭香草與璠美玉芝蘭與璵璠相疊謂舉族皆賢也誅叛經寒溫謂討賊歷涉歲時金甲雪猶凍言威嚴可畏賊不寒而栗朱旗塵不翻謂靈旗所指煙塵遂息也故聞柏氏之風者懦夫亦為之激昂故曰歘激懦氣奔聖人因多難而典國家多盜而能解紛治劇此其所以為聖人故云聖主國多盜置官本以待賢士惟臣之賢始尊之以官故云賢臣官則尊祲沴不祥之氣苟朝廷用柏氏秉節鉞必能止不祥之禍甫以多病甘自退縮惟回首屬望柏氏畫像雲臺再論其功故云雲臺誰再論柏氏孝萃于一門此亦唐家之盛事也故甫作詩以歌其事庶幾天子命之為師推轂而遣其勢騫揚特出衆人之表故曰期孤騫也説者皆以柏耆止於入鎮説王承宗非也奉賀陽城郡王太夫人恩命加鄧國太夫人衛幕銜恩重洙曰左傳吳公子札自衛如晉宿於戚聞鍾聲曰異哉夫子之於此也如燕之巢於幕上也戚衛地夢符曰右按前漢書晉灼注曰衛靑征胸奴絶大幕大克獲帝就拜大將軍於幕中故曰幕府幕府之名始於此也趙曰衛幕衛靑之幕也一本題下注云陽城王衛伯王也以其姓衛則用之尤切潘輿送喜頻洙曰潘安間居賦太夫人乃御板輿升輕軒逺覽王畿近周家園濟時瞻上將趙曰申言郡主節度江陵為上將錫號戴慈親冨貴當如此蘇曰五侯出人嘆曰冨貴勢要正當如此尊榮邁等倫郡依封土舊國與太名新趙曰言郡封雖仍是陽城郡而夫人之國加為鄧國是為新矣紫誥鸞回紙夢符曰右按晉載記石季龍五色紙在木鳯之口鹿盧回轉快若飛翔焉又古樂府半溪度曲制賜文犀節驛報紫泥書趙曰紫誥紫錦之誥也鵉回紙則紙上之字有回鵉之勢也淸朝燕賀人洙曰大厦成而燕雀相賀逺傳冬笋味洙曰孟宗後母好笋令宗冬月求之宗入竹林慟哭笋為之生更覺綵衣春奕葉班姑史洙曰班姑扶風曹丗叔妻班彪之女名昭字惠姬一名姬博學髙才丗叔早卒有節行法度兄固著漢書其八表及天文志未及竟而卒和帝詔昭就東觀藏書閣踵而成之昭所著賦頌銘誄問注哀辝書論上疏遺令凡十六卷子婦王氏為撰集之又作大家讃焉芬芳孟母鄰洙曰潘安仁間居賦此里仁以為美孟母所以三徙義方兼有訓洙曰左傳教子以義方詞翰兩如神蘇曰王獻之詞語秀麗筆畫雄徑兩如神江左為獨步委曲承顔體騫飛報主身可憐忠與孝雙美畫麒麟洙曰麒麟閣名也上畫忠目像秦州見勑洙曰一作除目薛三璩授司議郎畢四曜除監察與二子有故逺喜遷官兼述索居三十韻大雅何寥闊蘇曰邵平大雅寥邈後丗幾無所聞斯人尚典刑洙曰雖無老成人尚有典刑交期余潦倒材力爾精靈洙曰嵇康書足下舊知吾潦倒粗踈不切事情精靈猶精明也蘇曰梁靖見顧秀私謂同列曰秀之風標太華鍾其靈秀之文章奎星降其精使賈馬嚴楊聽其談論當北面而拱誰可拒敵耶二子身同日諸生困一經文章開突奧洙曰突又作窔東北隅也一云窟也突奧深遂貌荀子笑奧之內枕簟之上鄭曰施沒切爾雅傳謂之笑下方到切室之西南隅曰奧遷擢潤朝廷蘇曰王罕擢翰苑潤色朝廷典誥趙曰潤如德潤身之潤舊好何由展新詩更憶聽别來頭併白秦曰古詩相看俱白頭相見眼終靑洙曰阮籍善為青白眼見佳客則為青眼見俗客即為白眼伊昔貧皆甚同憂心不寧洙曰心一作歲栖遑分半菽浩蕩逐流萍洙曰劉孝標絶交論莫肯廢其半菽罕有落其一毛流萍喻流落如萍之在水也趙曰祖出漢書項羽歲飢人貧卒食半菽俗態猶猜忌洙曰一云猜忍蘇曰張華過洛汭俗士皆有猜忌之態妖氛忽杳冥獨慙投漢閣洙曰見子雲識字終投閣注俱議哭秦庭洙曰吳入郢申胥求救於受司議也屬東宫蘇曰徐牧云下明詔洗滌赦其餘罪也趙曰司議即東宫之官點染為文字也以言薛璩柱史正零丁洙曰畢受御史老聃為柱下史點染零丁言未盡其半也趙曰老子為柱下史而畢擢除監察故以柱下言之零丁介獨之貌官忝趨栖鳯朝回歎聚螢洙曰歎一作欲早胤聚螢喚人靑騕裊不嫁惜娉婷鄭曰上普丁下唐丁切洙曰張易之出塞行騕裊青緑騎娉婷紅粉粧趙曰言二公𥘉不自眩鬻以駿馬佳人為喻師曰凡此皆甫自喻不見用於丗掘劒知埋獄提刀見發硎洙曰劒埋於豐城獄張華夜見其氣在斗牛間使人掘之庖丁解牛十九年而刀刃若新發硎鄭曰硎音刑砥石梅曰此二句喻薛畢二子子幾年埋沒今始奮發殆見遇事剸裁也侏儒應共飽洙曰東方朔傳方待詔公車俸祿薄未得省見久之朔給侏儒曰上以若曹無益於縣官欲盡殺若曹侏儒大恐啼泣朔教曰上即過叩頭請罪居有頃聞上過侏儒皆號泣頓首上問何為對曰東方朔言上欲盡誅臣等上知朔多端召問朔何恐侏儒為對曰臣朔生亦言死亦言侏儒長三尺餘俸一囊粟錢二百四十臣朔長九尺餘亦俸一囊粟錢二百四十侏儒飽欲死臣朔飢欲死臣言可用幸異其禮不用罷之無令但索長安米上大笑因使待詔金馬門遂稍稍得進用焉趙曰以言二公猶未甚顯拔與侏儒共飽耳東寄此詩今日西京掾多除南省郎洙曰府掾四人同日拜郎通家惟沈氏謁帝似馮唐洙曰見名慙白首郎注文選謁帝承明廬趙曰公自比也馮唐以白首而見文帝公四十歲始以獻賦召試見明皇也詩律群公問蘇曰王仲宣流落荆南多有名士日問詩律儒門舊史長趙曰却言沈東美也謂之舊史則東美者史官沈既濟之胄也淸秋便寓直洙曰寓寄也晉潘嶽兼虎賁中郎將寄直於散騎省中故云寓直也趙曰言沈受命之時也便音平聲列宿頓輝光鄭曰宿息救切洙曰謂郎官上應列宿也未暇申安慰含情空激揚司存何所比洙曰比屬也言司之所在何屬逢原曰語則有司存膳部默悽傷趙曰言沈丈所存之司何所比擬乎公直以比其大父也蓋公之大父審嘗為此官故因沈丈而追感矣貧賤人事略經過霖潦妨禮同諸父長洙曰父長猶父兄之行也相尊爾天子謂同姓諸侯諸侯謂同姓大夫皆曰父趙曰以見尊沈丈之年恩豈布衣忘趙曰公新召試入官前此蓋布衣耳天路牽騏驥雲臺引棟梁趙曰袁彥伯三國名臣贊曰整轡髙衢驤首雲路此牽騏驥之謂也馬曰淮南子云雲臺之髙髙注曰髙際於雲故曰雲臺即非漢之臺名徒懷貢公喜颯颯鬢毛蒼洙曰見切效貢公喜注王陽入仕貢禹彈冠師曰漢制以曹官為掾如屋之掾言有所負荷也時府祿四人同日拜郎西京漢也除擢也言除舊而置新甫與沈家相通往來馮唐老年為郎今東美亦然故以比之詩律群公問言沈長於詩群公皆就質疑便音駢謂安間也直謂直舍也貧賤無車馬阻於霖潦故人事簡略布衣甫自稱也甫末章有意於沈汲引故云牽騏驥引棟梁也􅉑國夫人新添鮑曰唐后妃傳楊貴妃有姊三人長曰大姨封􅉑國並承恩出入宫掖􅉑國夫人承主恩平明上馬入宫門修可曰明皇雜録云號國每入禁中乘驄馬使小黃門為御皆俊健端秀才冠一時却嫌脂粉涴顔色淡掃蛾眉朝至尊鮑曰楊妃外傳虢國夫人不施朱粉自有艷態傷悼古詩八首律詩二十二首八哀詩并序傷時盜賊未息興起王公李公歎舊懷賢終于張相國八公前後存沒遂不詮次焉洙曰王仲宣張景陽皆作七哀詩黃鳥哀三良亦其義也贈司空王公思禮彥輔曰桉思禮傳加守司空上元二年以疾薨贈太尉諡曰武烈司空出東夷童稚刷徑翮端本曰謂修整其儀矩追隨燕葪兒頴鋭物不隔洙曰鋭一云脫王思禮營州城傍髙麗人也少習戎旅隨節度使王忠嗣至河西與哥舒翰對為押衙髙麗東夷也修可曰張景陽七命有云落徑翮平原傳毛遂曰使遂早得處囊中乃頴脫而出服事哥舒翰意無流沙磧洙曰及翰為隴右節度使思禮為翰押衙無流沙言其輕視夷狄不以為意也端本曰沙石曰磧言必掃蕩之也未甚拔行間犬戎大充斥敏公曰充斥言盛大也短小精悍姿屹然強寇敵定功曰前漢嚴延年為人短小精悍敏捷於事雖子貢冉有通於政事不能絶也趙曰言屹如山而為強寇之敵也按史加思禮金城大守安祿山反翰為元帥奏思禮赴軍玄宗曰吐蕃有釁唯倚思禮且觀玄宗之言則思禮在金城時能敵吐蕃可知矣貫穿百萬衆出入由咫尺馬鞍懸將首蘇曰辛倚破胸奴常懸蕃將首於鞍前齊太祖見而賞愛倚能騎射尤妙文墨甲外控鳴鏑夢符曰右按前漢書冒頓作鳴鏑習勒其騎射應劭曰髐箭也趙曰倣蔡琰詩馬鞍懸虜頭洗劒靑海水孫曰靑海在山東刻銘天山石洙曰思禮以技石堡城功在行間除右金吾衛將軍充關西兵馬使左傳盜賊充斥蔡琰詩馬鞍懸虜頭鳴鏑胸奴以射頭曼者班固為竇憲刻燕然銘也趙曰皆戰勝而深入也班固為竇憲刻燕山銘敏修曰唐薛仁貴傳云三箭定天山九曲非外蕃其王轉深壁夢符曰右按唐會要景龍四年贊普請昏以左衛大將軍楊矩為送金城公主使後矩為鄯州都督吐蕃厚賂之因請河西九曲之地以為公主湯沐之邑矩遂奏與之吐蕃既得九曲其地肥良尤與唐地接近自是復叛矩懼飮藥而死唐王思禮傳事哥舒翰以功授右衛將軍關西兵馬使從其討九曲也趙曰則九曲非外蕃飛兔不近駕修可曰飛兔古之神馬也淮南子曰夫待腰裊飛兔而駕之則丗莫乘車矣朝曰馬名飛兔善走躍而復能飛以名馬其駿抉可知矣鷙鳥資逺擊洙曰十二歲翰征九曲思禮後期欲引斬之續命使釋之思禮徐言曰斬則斬却喚作何物諸將皆以是壯之趙曰飛兔古之神馬陳孔璋答東阿王箋曰飛兔流星超越山海傳曰擊鳥之擊曉逹兵家流飽聞春秋癖修可曰漢藝文志云兵家者流凡百八十二家也晉杜預雖為將軍而有左傳廦胸襟日沉靜肅肅自有適洙曰前漢藝文志兵權謀十三家兵形勢十一家隂陽十六家兵技巧十三家兵家者蓋出於古司馬之職自春秋至於戰國出竒設伏變詐之兵並存漢興張良韓信序次兵法凡百八十二家晉杜預有左氏傳癖裴楷自夏侯玄云肅肅如入宗廟中俱見禮樂器師曰自短小精悍姿至此句皆美思禮之辭潼關𥘉潰散萬乘猶辟易饒曰辟易退却奔走之貌偏禆無所施元帥見手格洙曰祿山之反也思禮從翰守潼關密語翰誅國忠又欲以三千騎劫之翰不從遂至於敗思禮為偏禆而謀不見從翰遂𬒳擒元帥翰也萬秉天子也辟易播遷也饒曰格鬪也太子入朔方至尊狩梁益鄭曰劒南胡馬纏伊洛中原氣甚逆蘇曰蒙將軍一日謂扶蘇曰今天色黯淡回視中原其氣甚逆吾慮者恐不測之禍在其中後果如所言肅宗登寶位塞望勢敦迫鄭曰塞入聲洙曰翰既敗潼關不守玄宗幸蜀太子從百姓之請遂入靈武圗興復而羣臣勸進遂即位於靈武以從人望思禮奔行在趙曰勢出於裴冕等所迫也知肅宗以皇太子為天下兵馬元帥北收兵至靈武裴冕等奉皇太子即皇帝位公時徒步至請罪將厚責際會清河公間道傳玉册天王拜跪畢讜議果氷釋洙曰思禮至行在上責其不堅守坐畢下將斬之會房琯在蜀奉太上皇册命至諌上以為可收後效遂釋之蘇曰徐倜數上書明劉向事讜議諛論即日冰釋翠華卷飛雪熊虎豆阡陌洙曰書如熊如羆如虎如貔趙曰翠華天子之旗上林賦建翠華之萎蕤卷飛則言其時在冬周禮熊虎為旗所謂亘阡言兵旗之多也舊注引如虎如貔却是言兵旅非是屯兵鳯凰山帳殿涇渭闢洙曰天子所在以帳為殿象宫闕臺殿也趙曰行宫殿帳以為殿庾肩吾云回川入帳殿鳯凰山鳯翔山名涇渭則在平涼乃渭州金城賊咽喉詔鎮雄所扼鄭曰乙革切洙曰思禮既釋尋副房琯戰便橋不利更為關內行營節度河西隴右伊西行營兵馬使守武功以控賊及廣平王收復思禮入淸宫禁暴靖無雙爽氣春淅瀝師曰和爽之氣如春風然巷有從公歌洙曰詩無小無大從公于邁野多靑靑麥洙曰言賊不敢犯境土也及夫哭廟後復領大原役洙曰郭子儀收復兩京時太廟為賊所焚權移神主於大內長安殿上皇謁廟請罪及光弼鎮河陽制以思禮為太原而北京留守河東節度使兼御史大夫貯軍糧百萬器械精鋭尋加守司空自武德以來三公不居於宰輔唯思禮而巳恐懼祿位髙悵望王土窄洙曰昔也日闢國百里今也日蹙國百里趙曰在我之祿位則恐其髙本朝之土地則恨其窄又以美其謙忠不得見清時嗚呼就窀穸洙曰左傳唯是窀穸之事永繫五湖舟洙曰范蠡事勾踐既滅吳乘扁舟泛五湖有功成身退之忠而不能遂悲甚田橫客洙曰田橫死賔客聞之從死者五人言思禮賔客尤甚於橫也千秋汾晉間事與雲水白趙曰前云復領太原役則兩在太原矣宜有顯績歷千年如雲水之白矣昔觀文苑傳豈述廉藺績洙曰言思禮撫御積畜之才在汾晉之間者與雲水無晦也廉頗藺相如古名將也言有武功者不必責之以文德矣趙曰以形容思禮文不足而武有餘也廉頗藺相如古之名將豈必書其文采於文苑傳乎末句正譏文勝者徒以取禍嗟嗟鄧大夫士卒終倒戟洙曰鄧景山曹州人以文吏見稱亦為太原尹北京留守至太原以鎮撫紀綱為己任檢覆軍吏隱沒者衆懼有一偏將抵罪當死諸將各請贖其罪景山不許其弟請以身代其兄又不許其弟請納馬一匹以贖兄罪景山許其咸死衆咸怒謂景山曰我等人命輕如一馬乎軍衆憤怒遂殺景山上以景山撫御失所以故不復驗其罪故司徒李公光弼司徒天寶末北收晉陽甲洙曰按唐書李光弼傳光弼營州人幼持節行善騎射能讀班氏漢書少從戎嚴毅有大略天寶十三年郭子儀薦之堪當閫寄祿山之亂玄宗幸蜀肅宗理兵靈武授光弼戶部尚書兼太原尹晉陽太原也趙曰光弼加撿校司徒在至德二載尋遷司空矣今上云司徒則據為司徒已前事而稱其官耳按史云安祿山反郭子儀薦其能持節何東節度副大使晉陽則河東之太原也胡騎攻吾城愁寂意不愜人安若泰山葪北斷右脅朔方氣乃蘇黎首見帝業洙曰賊將史思明等四偽帥來攻城光弼麾下衆不滿萬皆烏合之人賊以太原屈指可取光弼伺其怠出擊大破之斬首十餘萬級又破思明于嘉山而河北歸順者十餘郡朔方河北也趙曰光弼屢戰屢勝所以斷葪北之脅蘇朔方之氣使萬民得見帝業觀公為華州子儀進滅殘寇形勢圖狀云平盧兵馬在賊左脅正此義二宫泣西郊師曰二宫謂肅宗與皇后九廟起頽壓洙曰見及夫哭廟後注未散河陽卒思明偽臣妾復自碣石來火焚乾坤獵髙視笑祿山公又大獻捷洙曰乾元二年為天下兵馬元帥與九節度兵圍安慶緒於相州拔有日矣史思明自范陽來救屢絶糧道光弼身先士卒苦戰勝之思明因殺慶緒即偽位縱兵河南賊勢甚熾光弼識洛不足抗賊遂檄官吏令避寇引兵入三城賊憚光弼頓兵白馬祠不敢西犯宫闕遂戰於中潭西大破逆黨賊走保懷州趙曰唐史思明乘勝西嚮光弼敦陳徐行趍東京謂留守韋陟曰公計將安出陟曰不如移軍河陽表裏相應此猿臂勢也遂悉軍趍河陽光弼禽周摯等思明未知光弼驅所俘示之思明大懼築壘以拒官軍髙視笑祿山言思明笑祿山而自矜也獻大捷則傳所謂獻俘太廟異王册崇勳小敵信所怯定功日光弼以功封臨淮王非謂非劉氏而王也小敵信所怯謂北邙之敗也光武與王鳯等戰自將步騎千餘前去諸部喜曰劉將軍平生見小敵怯今見大敵勇甚可畏也擁兵鎮河汴千里初妥帖鄭曰妥吐火切安也洙曰光弼以功進封臨淮王鎮何汴謂鎮臨淮漢光武見小敵則快蘇曰張遜上隋文帝表云幅貟暫寧千里安帖民瘵未痊冝寬恤蒼生羅寵英俊靑蠅紛營營風雨秋一葉內省未入朝死淚終映睫洙曰靑蠅喻魚朝恩程元振等也初北邙之戰光弼屢表賊未可破為僕固懷恩譛害遂至於敗及吐蕃犯京師代宗幸陜徴天下兵光弼與程元振不叶遷延不至後遂不敢入朝及卒諸將問後事曰吾久在軍不得就養既為不孝子夫復何言時母在河中所謂風雨秋一葉者也修可日按唐史北邙之敗魚朝恩羞其䇿謬深忌光弼功髙而程元振尤嫉之及來瑱為元振讒死光弼愈恐吐蕃寇京師代宗詔入援光弼畏禍遷延不敢行帝逺長安因拜東都留守察其去就光弼以久須詔不至二年光弼疾篤薨大屋去髙棟洙曰髙棟大屋所恃而安喻光弼朝廷之所倚賴也長城掃遺堞洙曰倚光弼如長城今其死矣是掃遺堞也平生白羽扇洙曰裴啓語林曰諸葛武侯持白羽扇指麾三軍言人亡而所用之物存爾零落蛟龍匣洙曰蛟龍匣劒匣也言人亡不復見用故云零落爾雅望與英姿洙曰二十八將論至使英姿茂績委而不用也惻愴槐里接洙曰命京兆尹第五倫監護喪事葬於三原詔宰臣百官祖送於延平門外前漢槐里屬右扶風武帝茂陵昭帝平陵在趙曰槐里豈葬地乎以詔百官送葬延平門外按長安志延年門乃在郭西而前漢槐里屬右扶風今之鳯翔府正在長安之西矣三軍晦光彩烈士痛稠疊直筆在史臣將來洗箱篋洙曰言平生功名書在史册也趙曰言史以直筆書光弼之功業不幸遭讒致公恐懼之事將來先濯箱篋之汙辱矣吾思哭孤冡南紀阻歸楫洙曰時甫避亂荆衡故云南紀趙曰南紀楚之分公自南紀往歸長安則可以弔光弼之英魂今阻而不能故云扶顚永蕭條洙曰言光弼有扶顚之力也未濟失利涉洙曰時未至大治而光弼亡如未濟而失舟也疲薾竟何人鄚曰薾乃結切疲貌灑涕巴東峽洙曰巴東峽在荆州趙曰巴東峽指言巙州而舊注指為荆州非是贈左僕射鄭國公嚴公武鄭公瑚璉器洙曰鄭嚴武所封瑚璉宗廟器華嶽金天晶鄭曰晶子盈切洙曰以其得山嶽之孕精也趙曰武挺之之子華州華隂人爾雅曰華為西嶽古有帝王之號曰金天氏昔在童子日巳聞老成名趙曰本傳武幼豪爽母不為挺之所答獨厚其妾武始八􅍲怪問其母母語之故武奮然以鐵鎚碎其妾首嶷然大賢後鄭曰嶷鶚力反復見秀骨清洙曰嚴武傳武中書侍郎挺之子神氣雋爽敏於聞見幼有成人風讀書不究精義涉獵而巳大賢謂嚴子陵歟趙曰大賢指嚴挺之舊注謂嚴子陵非是開口取將相小心事友生洙曰甫與武丗契也嘗醉登武床呼斥其父名而武不忤趙曰凡開口只欲為將相傳云與元載厚相結求宰相而事不遂是已小心事友生蓋普言其實舊注引甫嘗醉登武床武不之忤其説拘矣閲書百紙盡洙曰紙一作氏落筆四座驚歷職匪父任嫉邪常力爭洙曰武弱冠以門蔭䇿名哥舒翰奏充判官至德初肅宗初靖難大收才傑武仗節赴行在宰相房琯素重之及是首薦才略可稱纍遷給事中趙曰言武初離輔蔭其後自致身纍遷殿中侍御史所謂嫉邪者乃御史之職而嘗力爭乃武之能矣舊注以武為給事中乃在肅宗時而與嫉邪有何相干漢儀尚整肅洙曰時武為侍御史胡騎忽縱橫洙曰祿山之亂也飛傳自河隴逢人問公卿趙曰史云玄宗入蜀擢為諌議大夫則天寶末武在蜀中矣飛傳則傳遽之報也傳張戀反河隴西來蜀中之道肅宗即位靈武而前路梗澀有飛傳自河隴來武必詢問公卿為誰不知萬乘出雪涕風悲鳴受詞劒閣道謁帝蕭關城洙曰河隴劒閣蕭關城事新舊二史皆不載趙曰武在蜀之逺亦不知万乘所出之的所以雪涕悲鳴其忠義之情如此於是請於玄宗乞往行在也鄭曰渭州清原縣乃武州舊治蕭關縣按其地即漢朝那縣在原州西一百八十里龍朔中故於白草軍城置蕭關寂寞雲臺仗洙曰庾信哀江南非無北闕之兵猶有雲臺之仗修可曰言行宫儀衛之草創也飄颻沙塞旌江山少使者笳鼓凝皇情洙曰顔延年窮逺凝聖情又笳鼓震𬈑洲壯士血相視洙曰別賊刎血相視也忠臣氣不平趙曰指嚴武也密論正觀體洙曰正觀太宗撥亂反正時揮發岐陽征洙曰時肅宗理兵鳳翔感激動四極聮翩收二京洙曰二京長安東都也二史皆不載武收復功定功曰史云至德初武赴肅宗行在房琯薦為給事中巳收長安拜京兆尹則固有建議收復者矣西郊牛酒再洙曰沈休文碑牛酒日至壷漿塞陌西郊謂文王也牛酒謂擊牛釃酒饗士也原廟丹靑明洙曰叔孫通願為原廟注原重也先以有廟今更立之也修張良廟教云可改構棟宇而修丹青也匡汲俄寵辱洙曰匡衡汲黯趙曰以武之諌諍如匡汲也既拜京兆尹矣而坐房琯事貶巴州此則寵之所辱也衛霍竟哀榮洙曰衛青霍去病趙曰武為東川及劒南節度則遷謫之中雖可哀而復榮也四登會府地洙曰既收長安以武為京兆少尹兼御史中丞時年三十二後又遷京兆尹兼御史大夫三掌華陽兵洙曰華陽成都也武以史思明阻兵不之官優遊京師頗自矜大出為綿州刺史遷劒南東川節度使登發上皇誥以劒南兩川合為一道拜武成都尹充劒南節度使入復求為方面拜成都尹在蜀纍年肆志逞欲恣行猛政威震一方趙曰武為京兆少尹又為京兆尹為成都尹劒南節度又復節度劒南此為四登會府書曰華陽黑水惟梁州則東川西川皆華陽也京兆空柳色洙曰色一云市張敝為京兆尹走馬章臺街唐詩有章臺柳是也尚書無履聲洙曰前漢哀帝擢鄭崇為尚書僕射數求見諌諍上初納用之每見曳革上笑曰我識鄭尚書履聲注生曰革群烏自朝夕洙曰成帝時御史府中列柏株常有野烏數千栖宿其上晨去暮來號曰朝夕烏烏去不來者數月長者異之後果廢御史大夫為司空是其徴也白馬休橫行趙曰漢張湛為光祿大夫常乘白馬光武每有異政輒曰白馬生且復諫矣諸葛蜀人愛洙曰陳壽言蜀人愛亮雖甘棠之詠召公鄭人歌子産曰未足為過也文翁儒化成洙曰西漢文翁之守蜀召下縣子弟以為學官弟子為除更繇髙者補郡吏以為孝弟力田由是大化蜀之學於京師者比齊魯公來雪山重公去雪山輕洙曰雪山西山也言輕重在公而不在山記室得何遜洙曰梁書何遜為建安王記室王愛文學之士日與遊宴又為虜陵王記室復隨府於江州韜鈐延子荆洙曰晉孫楚字子荆參石苞驃騎軍事四郊失壁壘洙曰失壁壘言無屯戍也此美武能鎮靜也趙曰鎮靜無事也記曰四郊多壘卿大夫之辱也虛館開逢迎洙曰開閣以禮士也堂上指圖畫軍中吹玉笙師曰言公鎮靜蜀中惟以宴樂圖畫與衆共樂無寇盜之憂也豈無成都酒憂國只細傾時觀錦水釣問俗終相并趙曰上句雖成都有醇酒難而不敢盛為宴飲也下句言車騎之出非專為間遊終以問俗為事也意待犬戎滅人藏紅粟盈洙曰見近聞犬戎逺遁逃注漢太倉之粟紅腐不可食趙曰犬戎指吐蕃也武再節度劒南日破吐蕃七万衆于當狗城然其意終待盡滅而人免誅求使粟至於紅腐也以兹報主願庶或禆丗程洙曰或一云獲炯炯一心在洙曰見此心炯炯應君識注馬曰炯炯明貌沉沉二豎嬰洙曰晉侯疾求醫于秦秦伯使醫緩為之未至公夢疾為二豎子曰彼良醫也懼傷我焉逃之其一曰我居肓之上尓居膏之下若我何醫至曰不可為也在肓之上膏之下攻之不可逹之不及藥不至焉不可為也公曰良醫也顔回竟短折洙曰顔回年二十九蚤死武終時年四十洪範注短未六十折未三十也賈誼徒忠貞洙曰禇淵碑忠貞允亮也師曰公之意在於報主不幸疾化故比之回誼謂年少而殂也飛旐出江漢洙曰潘安賦飛旐翩以啓路趙曰武卒於蜀舟行而歸故今云云孤舟轉荆衡洙曰荆衡乃楚地也虛無馬融笛洙曰見如聞馬融笛注蘇曰後漢馬融精核術數性好音律能吹笛為督郵無留事獨卧郡平陽塢中有洛客舍送旅吹笛融去京師踰年暫聞悲甚而樂之作長笛賦悵望龍􅋮塋洙曰王濬以龍驤將軍平陳及卒以龍􅋮名墓田曰武帝以謡言拜王濬為龍􅋮將軍至太康六年卒葬柏谷小大營塋城舊注以龍驤名墓非是空餘老賔客身上愧簪纓洙曰武在蜀辟甫為參謀贈太子太師汝陽郡王璡鄭曰資辛切汝陽讓帝子洙曰讓皇帝憲本名成器睿宗長子立為皇太子以玄宗有討平韋氏之功成器懇讓儲位封為寧王薨諡曰讓皇帝長子汝陽郡王璡也眉宇真天人虬鬚似太宗洙曰書生相太宗曰龍鳯之姿天日之表又有虬鬚也趙曰讓帝睿宗子也以其讓為皇嗣玄宗以其有髙丗之行非大號不稱故追諡讓皇帝汝南郡王璡讓帝長子枚乘七發陽氣見於眉宇之間鄧禹傳注衆皆切言劉公真天人也餘見上色映塞外春師曰謂貌和雅也往者開元中主恩視遇頻出入獨非時禮異見羣臣師曰玄宗以璡父讓位于巳故眷遇之恩異於諸王出入宫禁不以時也愛其謹潔極洙曰此史採此語倍此骨肉親從容聽朝後或在風雪晨忽思格猛獸洙曰江都王力格猛獸苑囿騰清塵洙曰司馬相如諫獵書云今陛下好陵阻險射猛獸卒然遇逸材之獸駭不測之地犯屬車之淸塵豈不殆哉羽旗動若一萬馬肅侁侁洙曰三禮圖全羽為旞析羽為旗全羽析羽皆五采繫之於旞旌之上所謂注旄於竿首也詩侁侁征夫注衆多之貌鄭曰侁踈臻切馬衆多也詔王來射鴈拜命巳挺身箭出飛鞚內洙曰言王從帝獵苑中帝詔王射鴈也上又回翠麟洙曰又一作入翻然紫塞翮修可曰崔豹古今注曰秦所築長城土色皆紫漢亦然故云紫塞者塞也下拂明月輪趙曰言鴈下而拂弓也皆言王射獵之精絶胡人雖獲多天笑不為新洙曰長楊賦上將大誇胡人以多禽獸令胡人手搏之自取其獲上親臨觀焉天笑天子之笑也夢符曰右按仙傳拾遺木公與一玉女投壷設有不入者天為之􅦍噓注􅦍噓開口而笑也􅦍呼監切王每中一物手自與金銀袖中諌獵書扣馬久上陳洙曰漢武帝方自擊熊逐獸相如因上書諌之伯夷叔齊叩武王馬而諌趙曰言王雖隨獵矣而有書諫獵也諌獵書暗以司馬相如比之竟無銜橛虞洙曰相如書曰且夫清道而後行終路而馳猶時有御橛之變橛音掘聖聰矧多仁官免供給費水有在藻鱗洙曰以其諌獵而罷故官免供給之費而物亦得所趙曰非特止獵且不漁也匪唯帝老大皆是王忠勤趙曰皆王諌之之效也晚年務置醴門引申白賔洙曰璡歷大僕卿與賀知章褚庭誨為詩酒之交天寶初終又加特進楚元王交好書多材藝少時嘗與魯穆生白生申公俱受詩於浮丘伯元王即至楚以穆生白生申公為中大夫初元王敬禮申公等穆生不嗜灑元王每置酒嘗為穆生設醴師古曰醴甘酒也少麴多米一宿而熟不齊之矣道大容無能永懷侍芳茵洙曰言巳無能而惟王之所容侍芳茵言侍王也趙曰家語道大不容莊子無能者無所求好學尚貞烈義形必霑巾洙曰義形於色揮翰綺繡揚篇什若有神川廣不可泝趙曰言自別之後流落於蜀欲泝而上見王則川廣不可泝也倣詩漢之廣矣不可泳思墓久狐兔鄰洙曰張孟陽七哀詩借問誰家墳皆云漢丗主狐兔窟其中蕪穢不復掃宛彼漢中郡洙曰王弟瑀早有才望偉儀表天寶十五載從玄宗幸蜀至漢中因封漢中王文雅見天倫洙曰見天倫恨莫俱注趙曰劉公幹贈五官中郎將討云君侯多壯思文雅縱橫飛何以開我悲泛舟俱逺津溫溫昔風味少壯巳書紳洙曰書之紳帶也語子張書諸紳舊遊易磨滅衰謝多酸辛贈袐書監江夏李公雍長嘯宇宙間髙才日陵替蘇曰王粲曰小人日覺得志髙才日覺陵替夫造物者其意於賢愚何如哉趙曰長笑嘆之長也左傳云上陵下替古人不可見前輩復誰繼憶昔李公存詞林有根柢洙曰唐文苑傳李雍廣陵江都人父善嘗注文選六十卷行於時雍少知名在長安𥘉李嶠張廷圭並薦雍詞髙行真堪為諫諍官蘇曰潘安仁文章瑰瑋友人謂璠詞林繁茂根扺衍密不然何妙秀美發如斯聲華當健筆灑落富清製風流散金石追琢山嶽鋭鄭曰追都回切治玉也洙曰雍早擅才名尤長碑頌中朝衣冠天下寺觀多出其手趙曰金石以言碑追琢山嶽則若磨崖碑之謂師曰言得山嶽英鋭之氣情窮造化理學貫天人際洙曰董仲舒言天人相與之際干謁走其門蘇曰羊叔子吾非干謁走人門碑版照四裔各滿深望還森然起凡例洙曰杜預左氏傳序發凡以言倒雍雖貶黜在外人亦多齎金帛往求其文也蕭蕭白楊路洞徹寶珠惠趙曰墳墓也墳墓之路幽昏而得雍之文如寶珠之洞徹以照之所以為惠龍宮塔廟湧浩劫浮雲衛洙曰雲一作空夢符曰右按南史阿育王佛滅度後一日一夜造八萬四千塔𣑽言塔華言廟也又王簡棲頭陀寺碑功濟塵劫法華經曰如人以力磨三千大千上復未盡為一塵一塵為劫唐書辛替否曰窮金三修塔廟仙傳拾遺昆明池龍宫有仙方三十六首又廣異記丁約謂韋子威曰郎君終當棄俗尚隔兩塵丁曰儒謂之丗釋謂之劫道謂之塵趙曰浩劫無窮之劫也度人經曰唯有元始浩劫之家部制我界統乘玄都也龍宫之塔廟得雍之文亘歷浩劫而浮雲衛護之也宗儒爼豆事故吏去思計洙曰李玄盛為酒泉太守百姓思之請勒銘許之羊祜為荆州刺史立碑峴山百姓見而悲感號為墮淚碑趙曰爼豆事言作修學校記文宣王廟記之屬也去思計言使者太守縣令替罷而作頌政碑之屬眄睞巳皆虛鄭曰睞洛代切跋涉曽不泥向來映當時豈獨勸後丗洙曰自蕭蕭白楊路至此皆雍所造碑事意也沈休文論辭人才子並標能擅美獨映當丗是以一時之士各相慕習也趙曰言其文之光熖巳自輝映當時而歆慕之非止勸率後人豐屋珊瑚鈎騏驎織成罽紫騮隨劒几洙曰髙紀賈人母得衣罽師古曰罽織毛若今毼及氍覦鄭曰説文曰西湖毳布也義取無虛歲洙曰傳言自古鬻文獲財者未有如雍之盛也趙曰豐屋大屋也珊瑚鈎屋中之簾鈎織成罽則罽上所織者麒麟也罽居例切既以紫騮馬而又隨之以寶劒與慿几此數者皆冨貴家物不惜以饋雍矣義取無虛歲則以文得財矣新史云奉金帛請其丈前後所受巨萬計分宅脫驂間感激懷未濟洙曰吳志周瑜推道南大宅以舍孫策與䇿為友升堂拜母有無通共史記越石父賢在縲紲中晏子出遭之塗解左驂贖之延入為上客急於養士如此趙曰以雍雖以文受人之財而氣義好與思古人分宅或脫驂之事其所感慨常以未濟為懷衆歸賙給美擺落多藏穢洙曰雍素負美名頻被貶斥皆以雍能文養士而賈生信陵之流執事忌勝剝落在外趙曰在衆人則歸其能賙給在雍之身則雖多藏而能擺落其穢也獨步四十年風聽九臯唳洙曰雍知名長安中死天寶𥘉四十年間可謂獨步矣纍獻詞賦甚稱玄宗旨後因上許中使臨索其新文以文章徹天聽故有九臯唳云趙曰傳言帝封大山還雍見帝汴州詔獻詞賦帝恱上許京師中人索所為新文以進上則聲聞于天可比鶴矣嗚呼江夏姿趙曰此黃香也漢人語云天下無雙江夏黃童竟掩宣尼袂洙曰孔子獲麟反𬒮拭面稱吾道窮往者武后朝引用多寵嬖否臧太常議洙曰雍有批韋巨源諡議文士推重之面折二張勢洙曰初雍為左拾遺俄而御史中丞宋璟奏侍臣張昌宗兄弟有不順之言請付法斷則天𥘉不應雍在陛下進曰璟言事關社稷望陛下可其奏則天色解始允朱璟既出或謂雍曰子名位尚卑若不稱旨禍福將不測何為造次如是雍曰不顚不狂其名不彰衰俗凛生風排蕩秋旻霽忠貞負冤恨趙曰以雍忠正為人所陷宫闕深流綴趙曰此言天子深居九重不加省察也放逐早聮翩低垂困炎厲洙曰雍始以與張柬之善貶雷州玄宗初又貶崖州後召還為姚崇所嫉貶柞州微為陳州玄宗東封回雍謁見於汴獻辭賦稱旨頗自矜衒為張説所惡發陳州贓事抵死許州人孔璋上疏救之會赦免貶欽州後於嶺南從中官楊思朂討賊有功轉括渭淄三州刺史上計京師雍少有名纍𬒳貶逐後進不識京洛阡陌聚觀以為古人或將眉目有異衣冠望風尋訪門巷又中使臨問索其新文復為人隂中竟不得進用也日斜鵩鳥入魂斷蒼梧帝洙曰賈誼賦鵩集豫舍又野鳥入室主人將去玄暉雲去蒼梧野趙曰言其悲愁如賈誼鵩鳥賦云庾子日斜鵩集余舍帝舜之狩至蒼梧而死今之梧州也榮洙曰一作䇿枯走不暇星駕無安稅洙曰李斯未知稅駕也趙曰榮枯之不常故奔走不暇所以無安息稅駕之地詩星言夙駕幾分漢庭竹洙曰漢制以竹使符分給郡守雍纍為刺史故曰幾分也夙擁文侯篲洙曰魏文侯擁篲以迎朋友終悲洛陽獄事近小臣敝禍階初負謗易力何深嚌洙曰雍與柳績馬一匹及績下嶽吉溫令績引雍議及休咎事遂誅趙曰天寶初栁績有罪天獄雍嘗遺績馬故吉溫使引雍嘗以休咎相語隂賂遺竟杖死北海郡伊昔臨淄亭酒酣託末契洙曰甫有陪李北海宴歷下亭詩是也重敘東都别朝隂改軒砌鄭曰朝陟遙切論文到崔蘇洙曰崔信明蘇源明二人皆以文章擅丗指盡流水逝近伏盈川雄洙曰唐文苑傳楊炯為盈川令卒張説曰楊盈川文思如懸河注酌之不竭既優於盧照鄰亦不減王勃未甘特進麗洙曰張説曰李嶠之文如良金美玉無施不可特進李嶠為特進故也是非張相國相振一危脆洙曰玄宗東封回雍於汴州謁見纍獻詞賦甚稱上旨由是頗自矜衒自云當居相位又素輕張説與相惡時説為中書令甚惡之趙曰指張説也雍素輕與張説相惡公詩言張説以國相勢力所能勝雍特雍身危脆易於一扼耳爭名古豈然洙曰魏文帝典論云文人相輕自古而然鍵捷欻不閉洙曰老子善閉者不用關鍵趙曰雍於關鍵則捷急而欻然不閉所以召禍鄭曰鍵巨展切鑰牝犍其獻切門限也倒及吾家詩曠懷掃氛翳慷慨嗣真作洙曰和李大夫趙曰公以詩自負如此言例則雍與公比肩以詩為常例也氛翳言讒謗之人也咨嗟玉山桂洙曰郤説云崑山片玉桂林一枝鍾律儼髙懸鯤鯨噴迢遰師曰鍾律喻詩有法度鯤鯨喻其雄健坡陀青州血趙曰言杖死之也師曰坡陀髙聚貌青州血謂死所蕪沒汶陽瘞洙曰雍葬所也哀贈竟蕭條恩波延揭厲洙曰代宗時國恩例得贈祕書監子孫在如線舊客舟凝滯洙曰不絶如線江淹別賦舟凝滯於水濵趙曰存如線傷李其無後也舊客則公自傷其流落於外未能乘扁舟以往也君臣尚論兵將帥接燕葪朗詠六公篇洙曰雍有張桓等五玉洎狄相六公詩憂來豁蒙蔽洙曰盧藏用嘗謂雍如干將莫邪難與爭鋒但虞傷缺耳後卒如其言趙曰嘆時之多艱當後如雍者慷慨有所陳説故詠其所作六公詩以解憂也公自注云桓彥範敬暉崔玄暉張柬之袁恕已也洎狄相六公六公篇詠其載雍傳故祕書少監武功蘇公源明武功少也孤趙曰源明京兆武功人故直以此名之徒步客徐兖讀書東嶽中十載考墳典洙曰按新史源明初名預字弱夫少孤寓居徐兖工文辭有名時下菜蕪郭忍飢浮雲巘鄭曰語蹇切負米晚為身每食臉必泫洙曰子路為親百里負米源明養不及親負米自為而巳故每食必泫夜字照爇薪夢符曰右按丈士傳侯瑾字子瑜家貧傭賃暮輒燒柴薪以讀書獨處一室如對尊賔垢衣生碧蘚庶以勤苦志報兹劬勞願洙曰以已勤苦之志報父母劬勞也學蔚醇儒姿洙曰賈山涉獵書記不能為醇儒文包舊史善洙曰左傳序仲尼因魯史䇿書成文其餘皆即用舊史師曰源明嘗私著國史後史館采其語故云云灑落辭幽人歸來潛京輦射䇿君東堂宗匠集精選制可題未乾乙科巳大闡洙曰源明天寶中及進士第更試集賢院漢書顔師古曰射䇿者謂為難問疑義書之於䇿量其大小署為甲乙之科列而置之不使彰顯有欲射者隨其所取得而釋之以知優劣文章日自負掾吏亦纍踐趙曰纍遷太子諭德晨趨閶闔內足踏宿昔趼鄭曰古典切胝也一麾出守還洙曰源明纍遷太子諭德出為東平太守故召為國子司業也夢符曰右按文選屢薦不入官一麾乃出守趙曰宿昔趼言其由貧賤中也足胝曰趼莊子云百舍重趼是巳出守謂出為東平太守黃屋朔風卷不暇陪八駿虜庭悲所遣趙曰朔風卷則明皇乘輿以祿山反而出狩源明不得扈從而留虜庭每悲恨以遣懷耳八駿事周穆王乘八駿以出遊也平生滿樽酒蘇曰阮述愛詩好飲足不迹公卿大夫之門水邊林下放懷自若張翰相顧遇問其所欲述曰平生滿樽酒活計一張琴翰歎伏曰真傲逸竒士非我輩比也斷此朋知展憂憤病二秋有恨石可轉洙曰安祿山陷京師源明以病不受偽官趙曰詩曰我心匪石不可轉也其二秋憂憤則石可轉而吾心不轉焉此言源明不汙賊也肅宗復社稷得無逆順辨洙曰肅宗復兩京權考功郎中知制誥范曄顧其兒洙曰沈休文宋書云范曄字蔚宗為髙祖相國掾稍遷太子詹事坐謀反誅范泰之子趙曰范曄坐謀反誅臨刑醉其子藹亦醉取地土及果皮以擲曄曄問曰汝瞋我耶藹曰今日何緣瞋但父子同死不能不悲李斯憶黃犬洙曰李斯傳二丗二年七月具斯五刑論腰斬咸陽市顧謂其子曰吾欲與若復牽黃犬俱出上蔡東門逐狡兔豈可得言受偽官之人如范李之顧戀也袐書茂松意洙曰源明後以袐書少監卒茂松意以不變節於姦危如松柏不為風霜所奪也載從祠壇墠前後百卷文枕藉皆禁臠趙曰禁臠言其文之美也出晉元帝始鎮建業每得二豚以為珍膳項上一臠尤美輒以薦帝呼為禁臠篆刻揚雄流溟漲木末淺趙曰揚雄以賦為童子雕蟲篆刻然竟為長揚羽賦見稱於時溟漲謂其文波瀾浩汗雖溟海之張其本末比之猶為淺青熒芙蓉劒師曰言能斷決也犀兕豈獨剸洙曰吳越王允常取純鈎劒示薛燭曰先乎如屈陽之華沉沉如芙蓉始生於湖王子淵頌巧冶鑄干將之朴水斷蛟龍陸剸犀兕鄭曰剸止兖切截也反為後輩褻豫實苦懷𬗟煌煌齋房芝事絶萬手搴洙曰漢武帝大興祠齋房生芝而作歌肅宗時宰相王璵以祈禬進勸上興祠禱禁中稍崇淫祀源明數進時政得失鄭曰搴九輦切取也垂之俟來者正始徴勸勉趙曰源明所言可以垂後丗法乃正始之道也不要懸黃金胡為投亂贙洙曰獸名似犬修可曰按爾雅贙有力注云出西海大秦國似狗多力獷惡炙轂子載贙銘曰爰有獷獸厥形似犬飢則馴服飽則反眼出于西海名之曰畎趙曰所以美之且危之也乳贙謂乳虎也蓋言安媚則黃金可惡而切直犯上之怒不啻投飢贙也贙乎大反結交三十載洙曰任彥升哭雲僕射結歡三十載生死一交情吾與誰遊衍洙曰新史亦言源明雅善杜甫鄭虔滎陽復冥寞衆罟以橫骨鄭曰上户孟切下音畎洙曰謂鄭虔也嗚呼子逝日始泰則終蹇長安米萬錢凋喪盡餘湍趙曰言源明未死間猶及肅宗反正之後時巳向泰矣而源明死後時復屯蹇所以有米萬錢而至凋喪也舊注所引非戰伐何當解歸帆阻清沔尚纒漳水疾洙曰劉公幹余嬰沉痼疾竄身清濵漳趙曰公言在雲安不得沂汚以歸永負蒿里餞洙曰蒿里送士大夫庶人挽歌蘇曰徐翔之姪陵泣曰永負蒿里之哀東門相餞趙曰傷其不得一弔酹之故著作郎貶台州司户滎陽鄭公虔鶢鶋至魯門鄭曰鶢干元切鶋斤求切不識鍾鼓饗洙曰莊子至樂篇昔者海烏止於魯郊魯侯御而觴之于廟奏九韶以為樂具太牢以為膳鳥乃眩視憂悲不敢食一臠不敢飲一杯三日而死此以巳養養鳥也非以烏養養烏也海烏鶢鶋也孔子謂臧文仲不智者三而祀鶢鶋一也注鶢鶋止於魯東門文仲使國人祀也孔翠望赤霄愁思雕籠養洙曰孔翠翡翠孔雀也其志在丹霄然終不免籠樊之愁者以其質之異於衆離也故鷦鷯賦彼鷲梟鵾鴻孔雀蓊翠或陵赤霄之際或託絶垠之外翰羽足以沖天觜距足以自衛然皆負繒纓繳羽毛入貢何者用於人者然也趙曰言鄭公如鶢鶋如孔翠非鍾鼓所能樂之雕籠所能拘之也師曰虔嗜酒放誕不樂檢束更置廣文館以虔為博士虔聞命訴宰相何異饗鶢鶋以鍾鼓養孔雀以雕籠乎滎陽冠衆儒早聞名公賞地崇士大夫况乃氣清爽洙曰文藝傳鄭虔鄭州滎陽人天寶初為協律郎天然生知姿學立遊夏上神農或闕漏黃石愧師長洙曰黃石古書也夢符曰右按前漢張良傳父出一編書曰讀是則為王者師後十年興十三年孺子見我濟北榖城山下黃石即我矣遂去不見丗之所謂三略者即其書也此言黃石愧師長名其人耳非書也公著薈蕞等諸書之外又撰胡本草七卷趙曰鄭虔自著書外又選胡本草七卷故公所言輔闕乃神農本草之所不載也張良遇黃石公為師今公言愧者愧則不敢為虔之師長也藥纂西極名兵流指諸掌貫穿無遺恨薈蕞何技癢鄭曰薈烏外切蕞祖外切小貌癢以兩切本作癢圭臬星經奧蟲篆丹青廣洙曰按新史虔集撰當丗事著書八十餘篇有窺其藁者上書告虔私傳撰國史虔蒼黃焚之坐謫十年名其書為會粹孔子作春秋遊夏不能贊皇猷虔私撰國史是出其上也神農黃石藥繤兵流皆古書也言虔無不貫穿復通遊藝星經丹青之類趙曰圭泉言其善地理也選言陳圭置臬圭者土圭所以側日影臬者表臬所以度廣狹蟲篆言能書丹青又言能畫子雲窺未遍洙曰揚雄字子雲少好學博覽無所不見蘇曰劉薦語陳貞曰吾腹中書皆揚子雲窺未遍者方朔諧太枉洙曰東方朔上書曰臣年十三學三冬文史足用十五學擊劒十六學詩書誦二十二萬言十九學孫吳兵法戰陳之具征鼓之教亦誦二十二萬言凡臣朔已誦四十四萬餘言趙曰言虔能知荒逺之所在也東方朔每言其所指皆神仙之處故云諧枉尤大迃神翰顧不一體變鍾兼兩洙曰虔好書及畫恨無𥿄慈恩寺貯柿葉數屋虔取隸書歲久皆遍修可曰書苑曰虔善草隸吕揔云虔書如風送雲收霞催月上鍾兼兩鍾繇鍾會也父子善隸書皆盡其妙或云兼兩車也漢吳恢為南海太守欲殺青寫書子祐諫曰此書若成則載之兼兩注車有兩輪故稱文傳天下口蘇曰相如片文蒦字朝出而暮傳天下古詩云髙文滿天下籍籍喧萬口大字猶在榜昔獻書畫圗新詩亦俱往滄洲動玉陛寡鶴誤一響三絶自御題四方尤所仰洙曰虔自寫其詩并畫以獻帝大署其尾曰鄭虔三絶宣一作寡也嗜酒益踈放洙曰虔嗜酒踈放故杜甫贈詩云賴得蘇司業時時與酒錢蘇司業源明也蘇曰陶潛阮籍輩嗜酒踈放逸山野終免其禍當丗莫及其髙見自全之機彈琴視天壤洙曰嵆康曰目送歸鴻手彈五絃形骸實土木親近唯几杖趙曰言親近於天子今以言几杖則未嘗暫離之意未曽寄官曹梅曰謂不寓意於官職突兀倚書幌洙曰虔𥘉坐謫還京師上愛其材欲置左右以不事事更為置廣文館以虔為博士虔間命不知廣文曹司何在訴宰相曰上增國學置廣文館以居賢者令後丗言廣文博士自君始不亦美乎晚就藝香閣洙曰遷著作郎魚豢典略云藝香辟紙魚蠧故藏書臺稱藝臺胡塵昏坱莽曾曰映莽廣貌反覆歸聖朝點染無滌蕩趙曰虔值祿山反為受虔水部郎中因稱風緩求市令潛以密章逹靈武故言無一點所染不煩澆蕩之老蒙台州掾泛泛浙江槳洙曰祿山反遣張通儒劫百官置東都偽授虔水部郎中因稱風緩求攝市令潛以密章逹靈武賊平免死貶台州司户參車履穿四明雪洙曰東郭先生久待詔公車貧困其履行雪中有上足迹踐也飢拾楢溪橡洙曰四明楢溪皆浙江地名言虔貧困拾橡而食之定功曰按唐史虔以汚祿山偽官貶台州司户四明及楢溪皆屬台州孫綽賦云登陸則有四明天台趙曰暗使莊子冬日食橡栗空聞紫芝歌不見杏壇仗洙曰莊子魚父篇孔子遊乎緇帷之林休坐乎杏壇之上弟子讀書孔子絃歌鼓琴奏曲天長眺東南秋色餘魍魎洙曰天台賦始經魑魅之塗卒踐無人之境師曰言荒僻也别離慘至今班白徒懷曩洙曰曩昔時也春深泰山秀葉墜清渭㓪劇談王侯門野稅林下鞅洙曰鮑明逺無田稅歸鞅操𥿄終夕酣時物集遐想師曰自春深泰山秀至此追憶昔時與虔聚會于關中春和秋涼之日或劇談或解鞅操紙賦詩把酒酣飲今詞場踈闊故傷之詞場竟踈闊平昔濫吹奬洙曰甫自言嘗為虔濫吹奬也廬諶濫吹乘名實趙曰指言昔與鄭遊於詞翰之場而今竟踈逺間闊仍憶鄭之平昔濫有推奬于巳也百年見存沒洙曰百年交情見於存沒之際虔至台州後數年卒牢落吾安放洙曰一云放趙曰孔子將死子貢曰泰山其頽吾將安仰梁木將壞吾將安放蕭條阮咸在出處同丗網洙曰阮咸阮照子也任逹不拘雖處丗不交人事他日訪江樓含悽述飄蕩洙曰著作與今祕書監鄭君審篇翰齊價謫江陵故有阮咸江樓之句趙曰阮籍與其姪共為竹林之遊今以阮咸比鄭審故云空餘迹咸在也故右僕射國相張公九齡相國生南紀師曰滔滔江漢南國之紀説者援是詩以江漢為南紀非也蓋南紀乃分野名唐天文志云東循嶺徼逹甌閩中是謂南紀所以限蠻夷也張相國曲江人曲江隸韶州正嶺徼甌粵之地大抵自江漢以南皆謂之南紀非特江漢而巳金璞無留礦洙曰張九齡父為韶州别駕因家于始興今為曲江人九齡幼聰敏善屬文以書于廣州刺史王方慶方慶大嗟賞之曰此子必能致逺金玉未成器曰礦言九齡成器早故不留礦也田曰圎覺經云譬如銷金礦金非銷故有雖復本來金皆以銷成就一成真金體無復重為礦趙曰言巳為金而不復留在礦以譬張曲江出而應用不復退縮也仙鶴下人間獨立霜毛整洙曰言九齡之出也如仙鶴然潔白修整矯然江海思蘇曰阮熙年來浩然起江海之思復與雲路永趙曰矯然有江海之思而復思奮飛與雲路齊永師曰言其志趣髙逺前程亦不淺也寂寞想上階未遑等箕頴洙曰堯土階三尺想士階有致君堯舜之心也有致君之心故未遑於箕頴箕山也頴水也巢父許由所隱之也上君白玉堂倚君金華省洙曰九齡登進士第應拔萃登乙科拜校書郎玄宗在東宫舉天下文藻之士親加䇿問九齡對䇿髙第遷右拾遺由玉堂金華省言直登清華之地趙曰此言張曲江為祕書郎為左拾遺為左輔闕為中書舍人為集賢院學士是也碣石歲崢嶸天地日蛙黽師曰碣石山在東祿山所據之方崢嶸髙大貌祿山有叛志嘗自髙大視天地間如蛙黽然全無忌禪相國判其有反意屢請于帝退食吟大庭何心記榛梗洙曰大庭古至治之國也言九齡雖退食之間未嘗忘致治也榛梗言不以嫌猜為心也骨驚畏曩哲洙曰曩哲昔賢也謂其不若故骨驚鬒變負人境洙曰鬒黑髮也變而為白以負人事而已謝玄暉誰能鬒不變趙曰上句言畏其不逮故前人下句憂其髮白而將老皆傷功名之不立也江淹賦云心折骨驚雖蒙換蟬冠右地恧多幸洙曰侍中冠加貂蟬九齡為相以文雅為上知右相李林甫惡之引牛仙客以傾之遂罷趙曰此乃侍中事而史不載漢官儀侍中冠武帝大冠加金璫附蟬為文貂尾為飾謂之貂蟬也下句則以九齡以尚書右丞相罷言在右地巳慚恧為多幸何者有林甫之嫉仙客之憾則得此為幸矣敢志二踈歸洙曰踈廣為漢太子太傅謂兄子受曰吾聞知足不辱知止不殆豈如父子相隨出關歸老不亦善乎遂上疏乞骸骨上言之公卿設祖道供帳東都門外痛迫蘇耽井蘇曰神山蘇耽種橘鑿泉以救時疫病者食橘葉飲泉即愈趙曰神仙傳蘇仙翁名耽忽辭母去母曰使我如何存活仙翁明年天降疫疾庭中水簷邊橘樹可以代養紫綬映暮年荆州謝所領洙曰𥘉九齡為相薦長安尉周子諒為監察御史至是子諒以妄陳休咎上親加請問令於朝堂決殺之九齡坐引非其人左遷荆州大都督府長史庾公興不淺洙曰庾亮鎮武昌諸佐吏殷浩之徒乘月登南樓俄而不覺亮至將起避之亮徐曰諸公少住老子於此興不淺便據胡床與浩等談詠其坦率如此黃霸鎮每靜洙曰循吏傳黃霸與用寬和為治擢為楊州刺史潁川太守治為天下第一自漢興言治民吏以霸為首賔客引調同洙曰謝靈運異代可同調諷詠在務屏詩罷地有餘篇終語清省一陽發隂管趙曰謂如黃鍾之律也言其詩之和而可聽耳淑氣含公鼎趙曰謂如大烹之和也言其詩之美而可味於口乃知君子心用才文章境洙曰九齡善屬文有集二十卷散帙起翠螭倚薄巫廬並洙曰謝靈運散帙問所知巫廬二山名趙曰言開散曲江文帙神物歘起其髙至並巫廬之山也廣雅云龍有角曰螭師曰公有集二十卷荆人刻之碑螭即碑頭刻螭文也倚薄巫廬並巫廬二山其才氣能與二山之氣相倚迫也綺麗玄暉擁洙曰謝眺字玄暉少有美名為文綺麗箋誄任昉騁洙曰任昉字彥升長於箋誄自我一家則未闕隻字警洙曰史記序勒成一家傳序隻字之褒千秋滄海南名繫朱鳥影趙曰韶州即滄海之南朱鳥南方之宿當時謂九齡為滄海遺珠則有名稱矣歸老守故林戀闕悄延頸趙曰九齡在荆州之久封始興縣伯諸還展墓也戀闕言其心不忘君也波濤良史筆蘇曰班孟堅信知一代良史下筆善惡瀾翻而昭著無絶大庾嶺洙曰限賦終蕪絶於異域九齡自荆州請歸拜墓因遇疾卒年六十八諡曰文憲至德𥘉上皇在蜀思九齡先覺安祿山面有反相乃下詔褒贈司徒仍遣使就韶州致祭趙曰意謂九齡之文如波濤之翻可充良史之筆惜乎蕪沒隔絶於大庾嶺之外也向時禮數隔制作難上請趙曰此言帝眷巳衰難以制作上請於朝也再讀徐孺碑猶思理煙艇蘇曰謝安石理五湖煙艇趙曰後漢徐孺漢之髙士也曲江為之墓碣公之句意謂今再讀之而猶思理煙艇則以慕徐孺髙風而不忘江漢之念别房太尉墓彥輔曰閬州太尉名琯常與嚴武等交結貶邠州刺史上元元年為漢州刺史寶應二年拜刑部尚書在路遇疾廣德六年卒於閬州僧舍年六十七他鄉復行役駐馬别孤墳近淚無乾土趙曰言淚多而濕之也低空有斷雲對碁陪謝傅洙曰晉謝安傳安贈太傅𥘉苻堅入寇諸將退敗相繼次于淮肥京師震恐加安征討大都督姪謝玄入問計安夷然無懼色玄不敢言乃令張玄重請問遂命駕出墅親朋畢集至夜還指受帥將各當其任玄等既破堅有驛書至安方對客圍碁看書既竟便攝於床上了無喜色碁如故客問之徐啓云小兒遂巳破賊既罷還內過户限心喜甚不覺展齒折其矯情鎮物如此把劒覔徐君洙曰新序曰延陵季子將西聘晉帶寶劒以過徐君徐君不言而色欲之季子為有上國之事未獻也然心許之矣使於晉顧返則徐君死於是以劒帶徐君墓樹而去江淹詩延陵輕寶劒謝靈運詩延陵協心許解劒非所惜逢原曰謝傳徐君指房太尉也唯見林花落鶯啼送客聞承聞故房相公靈櫬自閬州啓殯歸葬東都有作二首楷曰房琯字治律河南人逺聞房太守歸葬陸渾山洙曰伊洛間有陸渾山昔辛有適伊川見被髮而祭者言此地當夷後為陸渾之戎所有山因而得名鄭曰十道志山在洛陽趙曰舊本作太守非善本作太尉蓋琯謫漢州刺史召拜刑部尚書道病卒贈太尉不應呼之為太守也一德興王後洙曰周德以興王業也伊尹咸有一德趙曰琯為相廟堂固以一德興王矣孤魂久客間洙曰房公客死閬州孔明多故事洙曰蜀志陳壽上言臣壽等言前有著作郎侍中領中書監濟北侯臣荀朂中書令關內侯臣和嶠奏使臣定故蜀丞相諸葛亮故事亮佐危國負阻不賔然由存録其言恥善有遺誠是大晉光明至德澤𬒳無疆自古以來未之有倫也輒刪除復重隨類相從凡為二十四篇篇名如右安石竟崇班洙曰謝安薨時六十六帝三日臨於朝堂賜東園祕器朝服贈太傳諡曰文靖以無下舍詔府中備凶儀及葬加殊禮依大司馬亘溫故事師曰孔明多故事喻房公奏議可為朝廷典故安石竟崇班喻房公死後竟追贈褒崇之也嘉陵縣屬閬州他日嘉陵涕鄭曰嘉陵江名仍霑楚水還趙曰靈櫬自閬州起發則由嘉陵江而下故云丹旐飛飛日洙曰丹旐銘旌也寡婦賦龍轜儼以星駕飛旐翩以啓路初傳發閬州風塵終不解趙曰時吐蕃未息也江漢忽同流趙曰靈櫬所經者江與漢也師曰風塵終不解言盜賊未息而房公忽與江漢同遊故嘆惜之劒動新身匣趙曰善本作親身方有義書歸故國樓蘇曰陳惇放歸故國載書一千卷歸家起樓今西歧觀風樓是也盡哀知有處為客恐長休趙曰此因逺送靈櫬之歸有感而言也哭嚴僕射歸櫬素幔隨流水歸舟返舊京洙曰舊京故國修可曰盧子諒詩南望舊京路老親知洙曰知一作如宿昔按新史武卒母哭且曰今而後吾知免為官婢矣趙曰言嚴公之母尚健如宿昔耳舊注所引新史非是不知何自得之部曲異平生洙曰言部曲有異於存日也宋鮑昭東武吟將軍既即丗部曲亦罕存後漢光武紀注大將軍營有五部三校尉部下有曲曲有軍候一人風送蛟龍雨洙曰見蛟龍雲雨注趙曰以嚴公若蛟龍則風之所送者乃蛟龍雨也師曰子美詩云蛟龍得雲雨言賢者之得勢今云風送蛟龍雨雨𬒳風吹斷則蛟龍失勢可知天長驃騎營洙曰晉書齊獻王攸遷驃騎將軍時驃騎當罷營兵士數千人戀攸恩德不肯去一哀三峽暮遺後見君情趙曰言所以遺傳於後世見君有恩德於公之情如此也師曰遺後者謂恩德遺與後人使人哀思之不忘則君之情可見也哭李尚書之芳漳濵與蒿里逝水竟同年洙曰劉公幹余嬰沉痼疾竄身清漳濵又云逝者如流水哀此遂離分李延年分送喪歌為二等薤露送王公大人蒿里送士大夫庶人使挽柩者歌之為挽歌欲挂留徐劒洙曰見上把劒覔徐君注猶回憶載船洙曰見上應尋戴安道注相知成白首洙曰潘安仁投分寄石友白首同所歸此别間黃泉洙曰左傳不及黃泉風雨嗟何及江湖涕泫然鄭曰泫胡畎切洙曰詩何嗟及矣文中于泫然流涕修文將管輅洙曰見上修文地下郎注趙曰言李尚書之有竒才應如魏之管輅也奉使失張騫洙曰見上查上覔張騫注史閣行人在洙曰周禮大行人小行人趙曰史閣言其書之史册也詩家秀句傳蘇曰陸士龍題詩對南山日晚得秀句客亭鞍馬絶趙曰言其死於道路也彭曰此句言子美為客停留於此李公無復鞍馬來相尋矣旅襯網蟲懸洙曰沈休文詩髙車塵未成珠履故無聲賔階緑錢滿客位紫苔生又網蟲垂户織夕鳥旁簷飛復塊昭丘逺洙曰登樓賦西接昭丘楚昭王墓鄭曰荆州記當陽東南七十里有昭王墓故云云歸魂素滻偏洙曰宋玉魂兮歸來鄭曰滻所簡切水名在京兆趙曰素滻長安之水也言李尚書乃長安人也潘安仁西征賦地有玄灞素滻大臨曰此二句言李葬於此樵蘇封葬地喉舌罷朝天洙曰李固云陛下之有尚書猶天之有北斗斗為天之喉舌尚書亦猶陛下喉舌秋色凋春草王孫若箇邊洙曰招隱芳草兮萋萋王孫兮不歸大臨曰此句言李即與春草為鄰矣重題涕灑不能收哭君餘白頭兒童相顧盡竦曰言少時相顧今盡於此矣宇宙此生浮江雨銘旌濕洙曰記曰銘明旌湖風井徑秋洙曰蕪城賦歌曰邊風起兮城上寒井徑戚兮丘隴殘還瞻魏太子賔客減應劉洙曰曹丕書曰應徐陳劉一時俱逝矣趙曰公自注云公歷禮部尚書薨于太子賔客應則應瑒劉則劉焯送盧十四弟侍御護韋尚書靈櫬歸上都二十韻素幕渡江逺朱幡登陸微洙曰漢二千石朱幡兩輪趙曰朱幡丹旐也舊引漢二千石朱兩轓誤矣轓字從車幡字從巾義不同也悲鳴駟馬顧趙曰有戀主之意失涕萬人揮洙曰陸士衡詩揮淚廣川隂又得與故人揮參佐哭辭畢門闌誰送歸洙曰見門闌多喜色注從公伏事久之子俊才稀長路更執紼此心猶倒衣洙曰詩自公召之顛倒裳衣感恩義不小蘇曰夏侯勝感恩戀德義實不小懷舊禮無違墓待龍􅋮詔洙曰漢獻加魏武九錫曰龍驤虎視旁眺八方修可曰唐史遺事武后幸洛陽至閿鄉縣東騎不進召巫問之巫曰晉龍將軍王濬云臣墓在道南每為樵採所苦聞大駕至故哀求后遂詔云墓百步不得樵採子美八哀詩亦云虛無馬融笛悵望龍驤塋趙曰晉王濬為龍驤將軍卒葬柏谷中大營塋域待龍􅋮詔則言盧尚書之墓如王濬者也臺迎獬豸威鄭曰豸宅買切趙曰獬豸侍御史冠也獬豸獸名一角知人曲真而觸不直者此言韋尚書靈櫬至上都而送之者盧侍御如此深衷見士則雅論在兵機趙曰丗説鄧艾年十二至頴川讀陳太丘碑丈曰言為丗範行為土則遂自名範字士則戎狄乘妖氣塵沙落禁闈趙曰禁闈天子之內也此言吐蕃陷京師也往年朝謁斷修可曰言去上都之久而斷朝謁也他日掃除非趙曰言除掃吐蕃不得上䇿所以為非也但促銅壷箭洙曰漏刻銘筮筒方圎之制注金謂壷又云銅史司刻金徒抱箭趙曰欲上之未明求衣而早朝也休添玉帳旗洙曰見空留玉帳旗注趙曰言不必添兵也玉帳將軍之帳也動詢黃閣老洙曰見扈聖登黃閣注肯慮白登圍洙曰前漢胸奴傳髙帝至平城步兵未盡到冒頓緃精兵三十餘萬圍於白登七日漢兵中外不得相救䬲胸奴騎其西方盡白東方盡馱北方盡驪南方盡騂髙帝乃使間厚遺閼氏乃謂冒頓曰兩主不相困今得漢地單于終不能居之且漢主有神單干察之冒頓亦與韓信將王黃趙利期而兵久不來疑其與漢有謀亦取閼氏之言乃為開一角於是髙皇帝令士皆持滿傅矢外鄉從解角直出得與大軍合而冒頓遂引兵罷使劉敬結和親之約師古曰白登在平城東南去平城十餘里趙曰言天子雖屢詢大臣而莫知以白登之圍為慮者此豈勸親征之徒歟黃閣者三公也宋忠曰三公黃閣鄭曰白登地名在平城東南十餘里萬姓瘡痍合蘇曰邪元云萬姓瘡痍始合兵甲尚未全息恐西北乘勢再為患也趙曰言其困于誅求役使也羣凶洙曰一云雄嗜欲肥趙曰言將帥乘此為驕也刺規多諌淨趙曰所望於盧侍御也端拱自光輝儉約前王體風流後代希趙曰言盧侍御之登對所論之事如此對揚期特逹鄭曰揚與揚同衰朽再芳菲趙曰言對揚天子之前當在特逹而勿委靡則衰朽之人再獲芳菲言同受其業也空裏愁書字洙曰見咄咄正書空注山中疾採薇洙曰伯夷傳登彼首陽采其薇矣撥杯要忽罷抱被宿何依蘇曰聶授抱𬒳隨王肅棺宿趙曰撥杯者揮杯也即别矣撥杯之相要忽罷平昔抱𬒳就宿今又何依也眼冷看征蓋兒扶立釣磯清霜洞庭葉故就别時飛洙曰楚辭湘夫人洞庭波兮木葉下哭李常侍嶧二首鄭曰嶧夷益切一代風流盡蘇曰曹桴曰子建沒陳劉俱逝一代風流從此盡矣後丗誰氏可繼髙名趙曰南史張緒死其從弟融於緒靈前酌飲慟哭曰阿兄風流頓盡修文地下深洙曰見修文地下郎注顔淵為地下修文郎斯人不重見蘇曰山巨源哭嵆原曰中散死埋玉重泉沉珠滄海不重見斯人矣趙曰孔子言伯牛之疾曰斯人也而有斯疾也蓋嗟其人之賢也將老失知音洙曰伯牙以鍾子期為知音子期死而牙絶絃蘇曰鮑叔云將老矣遽失知音趙曰指李常侍如鍾子期也曹丕與吳李質書曰昔伯牙絶絃於鍾子期仲尼覆醢於子路痛知音之難遇傷門人之莫逮也短日行梅嶺鄭曰大庾嶺寒山落桂林洙曰山一作江趙曰言李常侍之櫬自廣南來也大庾嶺多梅故謂之梅嶺廣志曰桂生於髙山之嶺其類自為林長安若箇畔猶想映貂金洙曰侍中冠貂蟬阮修以貂蟬換酒青瑣陪雙入銅梁阻一辭洙曰見通籍踰青瑣注蜀有銅梁縣風塵逢我地江漢哭君時趙曰言當風塵之際相逢於江漢而今在江漢聞其喪而哭也次第尋書札呼兒檢贈詩洙曰古詩遺我一書札又呼兒烹鯉魚文選有贈答詩發揮王子表不愧史臣詞定功曰常侍者宗室之子也故用王子表字前漢書有王子侯表哭韋大夫之晉悽愴郇瑕邑洙曰左傳晉謀去故絳諸大夫曰必居郇瑕氏之地鄭曰郇須倫切國名差池弱冠年洙曰曲禮二十曰弱冠蘇曰蘇代云弱冠之年差池文采士人叨禮數文律早周旋洙曰左傳與君周旋臺閣黃圖裏洙曰三輔黃圖又漢宫闕詔簪裾紫蓋邊洙曰沈沐文碑陪龍駕於伊洛待紫蓋於咸陽尊榮真不忝端雅獨翛然貢喜音容間洙曰見竊效貢公喜注馮招病疾纒洙曰左太沖馮公豈不偉白首不見招鄭曰馮招馮唐南過駭蒼卒鄭曰上采莽下七沒切北思悄聮綿洙曰洞簫賦吟氣遺往聮綿飄敞又云翩綿聮以牢落鵩鳥長沙諱洙曰見冶濕愁飛鵩注犀牛蜀郡憐洙曰見石犀牛行素車猶慟哭寶劒欲髙懸洙曰見把劒覔徐君注漢道中興盛韋經亞相傳洙曰建武永平未盡中興之美韋賢不如教子一經沖融標丗業磊落映時賢城府深朱夏江湖眇霽天倚樓關樹頂洙曰古詩西北有髙樓交疏結綺窗飛旐泛堂前洙曰寡婦賦飛旐翩以啓路奕幕欵風燕洙曰奕幕霄懸謝玄暉詩風簾入雙燕笳簫急暮蟬興殘虛白室鄭曰興許應切洙曰莊子虛室生白迹斷孝廉船洙曰丗説張慿舉孝廉負其才自謂必參時彥𥘉欲詣劉真長鄉里及同舉者共笑之張遂往詣真長延之上座凊言彌日因留宿至曉張退劉曰卿且前去當取卿共詣撫軍張還船同旅問何處宿張笑而不答須臾真長遣傳教覔張孝簾船同旅宛愕即同載詣撫軍至門劉進曰下官今日與公得一太常博士撫軍與之言咨嗟稱善即用為太常博士童孺交遊盡喧卑俗事牽老來多涕淚情在強詩篇誰繼方隅理朝難將帥權春秋褒貶例名器重雙全師曰郇瑕晉地韋大夫靈櫬歸晉故子美悽愴以傷之子美少與公結交故云差池弱冠年王陽在位貢禹喜而彈冠子美上韋左丞詩云竊效貢公喜今巳死故曰貢喜音容間子美擬效馮公之招隱奈為疾病所纒而巳鵩鳥長沙諱子羡自言斥逐困於此地也犀牛蜀郡憐言蜀人思韋之德也綺樓關樹頂言奠樓之髙也帟幕欵風燕言子美之失韋無所棲託如燕之巢于風幕也惟名與器不可以假人韋之化去朝廷慎難不輕以帥權授人故云誰繼方隅理聞髙常侍亡忠州作鮑曰髙適也本傳繼廣德元年後言召為刑部侍郎左散騎常侍歸朝不相見蜀使忽傳亡虛歷金華省洙曰江淹上建平王書升降承明之闕出入金華之殿班固傳王鳯薦班伯召見宴昭殿誦説有法拜為中常侍時上方嚮學鄭寬中張禹朝夕入説尚書論語於金華殿中詔伯受焉數年金華之業絶出注金華殿在末央宫何殊地下郎洙曰丗説顔回為地下修文郎致君丹檻折洙曰見折檻詩注哭友白雲長蘇曰山巨源哭嵆中散曰白雲央央我心悲傷揮哭望雲雲路阻長趙曰自渝州望長安而哭為白雲長矣獨步詩名在趙曰曹子建與楊德祖書曰昔仲宣獨步於漢南田曰南史沈約謂王荺文章之美可謂後來獨步秪令故舊傷洙曰適有詩名於時哭長孫侍御道為詩書重孝祥曰人誰不讀書但誦其章句而不明其道不足重也長孫之學獨為可重以其逹道故也名因賦頌雄逸曰子雲賦頌名重漢朝禮闈曽擢桂洙曰禮闈禮部所設以取士也郤詵對武帝云臣舉賢良對䇿為天下第一猶桂林一枝憲府舊乘驄洙曰御史所居之署漢謂之御史府亦謂之憲臺唐龍朔中為東宫憲府後漢桓典拜侍御史是時宦官秉權典執政無所回避常乘驄馬京師畏憚為之語曰行行且止避驄馬御史流水生涯盡趙曰子在川上曰逝者如斯夫不舍晝夜宋曰生涯盡言其清貧也浮雲丗事空趙曰浮雲易散之物故以比丗事所以悼之也唯餘舊臺柏蕭瑟九原中洙曰成帝時御史府中列柏樹檀弓曰文子曰從大夫於九京也注晉卿大夫之墓地在九原京當作原趙曰亦御史事漢朱博為御史大夫其府列柏樹常有野烏數千棲宿其上古注云檀弓注卿大夫之墓地在九原哭王彭州掄執友驚淪沒趙曰禮記執支稱其仁也斯人巳寂寥新文生沈謝洙曰沈約謝靈運也趙曰以沈謝比之則王君必能文矣異骨降松喬洙曰王君平謂茅盈曰子有異骨可學仙漢文帝壽命非松喬得神仙赤松子王喬也北部初髙選洙曰漢有北部太守趙曰言其初官得京畿尉也故用北部事曹操年二十除洛陽北部尉舊注謂北部太守豈有才起身而遂為太守者乎東堂早見招洙曰晉郤詵還遷雍州刺史武帝於東堂會問詵曰卿自以為何如詵對曰臣舉賢良對䇿為天下第一猶桂林之一枝崑山之片玉帝笑侍中奏免詵官帝曰吾與之戲耳不足爾蛟龍纒倚劒趙曰言禁從之地變化者如蛟龍纒繞其所倚之劒鸞鳳夾吹簫洙曰王子晉趙曰鸞與鳯夾其所吹之簫也秦有簫史教弄玉以吹簫而鳯凰降舊注於此句下注王子晉誤惑學者子晉乃是吹笙非簫也歷職漢庭久洙曰職任也中年胡馬驕洙曰謂安史亂兵戈聞兩觀洙曰東京賦建象魏之兩觀寵辱事三朝洙曰隨國之寵辱趙曰謂明皇肅宗與當日代宗也蜀路江干窄洙曰見謾勞車馬駐江干注彭門地里遙洙曰彭門地名屬彭州鄭曰即彭州即兩峯相對曰天彭解龜生碧草洙曰謝靈運解龜在景平謂解去所佩龜郎諌獵阻清霄洙曰司馬長卿上書諌獵趙曰王君必彭州替罷而有封事於雖朝上而不報也頃壯戎麾出叨陪幕府要趙曰言王在彭州而參成都節度軍謀矣將軍臨氣候趙曰指言揔戎之人壯士塞風飈趙曰指言戰鬪之士井泄洙曰又作滿鄭曰泄悉列切泉誰汲洙曰易井之九三井泄不食為我心惻可用汲注言潔已而不見用也烽踈火不燒趙曰凡軍旅所在必先論井泉凡有警必頻舉烽燧今井泉不汲而烽火不燒則無事矣皆以王君參謀所致而然也前籌多自暇洙曰張良借筯前籌隱几接終朝鄭曰隱去聲洙曰孟子隱几而卧翠石俄雙表洙曰蔡伯喈樹碑表墓寒松竟後凋洙曰語歲寒然後知松柏之後凋贈詩焉敢墜染翰欲無聊蘇曰朝建中僻居山林經年不識車馬養成懶散或答親友書亦無聊染翰誰復著書者耶趙曰謂不敢以其死而廢詩篇之贈然染翰之間自痛悼而其情無聊矣再哭經過罷洙曰橋玄見曹植曰天下將亂安生民者其在君乎後玄死操經過玄墓輒愴悽致祭感其知巳也趙曰聞其死巳哭矣靈櫬從舟中經過夔州則公又再哭焉離魂去住銷洙曰言去者有思念之心住者有思念之意故皆銷魂也趙曰離别之魂或去自蘷州或住夔州皆自銷矣之官方玉折洙曰蕭望之便道之官王褒死如玉折也寄葬與萍漂洙曰寄葬莽也趙曰追悼其才赴任而遂如玉折又傷念其寄殯若萍泛未安也曠望渥窪道洙曰渥窪水出龍馬謂王之如龍馬不可復見矣霏微河漢橋洙曰烏鵲填河為橋以渡牛女謂王之魂當在仙境矣趙曰言王君之喪未能歸鄉言其所出陸馬所經之塗與夫渡橋而往方其曠望之間霏微之眇矣天馬篇天馬徠循東道此所謂道也河漢橋如丗傳織女渡河而烏鵲為橋也舊所引王之魂當在仙境非是夫人先即丗令子各清標趙曰歎王君沒後如此巫峽長雲雨洙曰見峽內多雲雨注趙曰言公身之在夔秦城近斗杓洙曰斗杓斗極也趙曰公懷長安之逺鄭曰杓卑遙切柄也馮唐毛髮白歸興日蕭蕭洙曰見白首恨為郎詩注趙曰公自嘆其留滯空老又因王君之喪不即還鄉而感傷也奉漢中王手札報韋侍御蕭尊師亡秋日蕭韋逝淮王報峽中洙曰漢有淮南王賢王少年疑柱史洙曰王康琚詩老聃伏柱史老子傳考子百有六十餘歲以其修道而養壽多術怪仙公趙曰淮王則漢南王安其人賢以比漢中王也柱史以言韋侍御老子為周柱下史而韋以少年為之疑其不似也仙公以言蕭尊師仙公冝有多術以延生而死故怪之也不但時人惜祗應吾道窮洙曰左傳反𬒮拭面稱吾道窮一哀侵疾病相識自兒童處處鄰家笛洙曰向子期思舊賦序于時日薄虞淵寒木凄然鄰人有吹笛者後發聲寥亮追想曩昔遊宴之好感音而嘆作賦飄飄客子蓬洙曰曹子建轉蓬離本根飄飄隨長風類此遊客子捐軀逺從戎趙曰公自嘆其飄零也強吟懷舊賦洙曰潘安仁作懷舊賦巳作白頭翁洙曰魏文帝已成老翁但未白頭耳哭台州鄭司户蘇少監新添故舊誰憐我平生鄭與蘇存亡不重見喪亂獨前途豪俊人誰在文章掃地無羇遊萬里闊凶問一年俱白日中原上清秋大海隅夜臺當北斗泉路著東吳得罪台州去時危棄碩儒移官蓬閣後榖貴殁潛夫流慟嗟何及銜冤有是夫道消詩發興心息酒為徒許與才雖薄追隨迹未拘班揚名甚盛嵇阮逸相須會取君臣合寧詮品命殊賢良不必展廊廟偶然趨勝決風塵際功安造化爐從容詢舊學慘淡閟隂符擺落嫌疑久哀傷志力輸俗依綿谷異客對雪山孤童稚思諸子交期列友于情乖清酒送望絶撫墳呼虐痢飱巴水瘡痍老蜀都飄零迷哭處天地日榛蕪過故斛斯校書莊二首此去巳云殁鄰人嗟亦休竟無宣室召洙曰漢文帝召賈誼於宣室徒有茂陵求洙曰謝玄暉詩廣平聽方藉茂陵將見求前漢司馬相如既病免家居茂陵天子曰司馬相如病甚可往從悉取其書若不然後失之矣所忠往而相如已死無遺書問妻對曰長卿未嘗有書也時時著書人又取去長卿未死時為一卷書曰有使來求書奏之其遺札書言封禪事所忠奏焉天子異之妻子寄他食園林非昔遊空餘繐帷在洙曰謝玄暉詩繐帷飄井幹陸士衡注繐細布而踈者為靈帳裙繐帳之冥漠也淅淅野風秋燕入非傍舍趙曰燕仍入其舍鷗歸秪故池斷橋無復板卧柳自生枝洙曰池館依舊而人不可見也趙曰梁孝威詩卧柳尚還生遂有山陽作洙曰見贈王侍御契詩注多慙鮑叔知洙曰鮑叔與管仲交貧則知其困而容之逹則知其賢而舉之管仲曰生我者父母知我者鮑叔素交零落盡洙曰劉孝標絶交論斯賢逹之素交歷萬古而一遇素交盡利文興謝靈運万事俱零落白首淚雙垂不歸河間尚征伐宋曰河間郡名此詩甫從弟經亂離未歸也汝骨在空城趙曰此言公之從弟有死而寄骨於其處從弟人皆有終身恨不平數金憐俊邁師曰數金謂初時知錢數也總角愛聰明洙曰見總角草書又神速注面上三年土春風草又生師曰言三年飄蕩風埃之中今春草又生也故武衛將軍挽詞三首嚴警當寒夜前軍落大星洙曰晉陽春秋曰有星赤而芒角自東北西南流投于諸葛亮營三投再還往大還小而亮薨趙曰軍事以嚴終破軍中謂之嚴警安石曰三國志注載晉陽春秋有星投于亮營而亮卒壯夫思敢決哀詔惜精靈趙曰思其敢決邁往之氣也王者今無戰洙曰鍾士季檄蜀丈王者之師有征無戰書生巳勒銘洙曰班孟堅為竇憲作勒燕然山銘秦曰書生甫自謂也當為之勒銘封侯意踈闊編簡為誰靑洙曰李廣不封侯餘見青簡為誰編注舞劒過人絶洙曰髙祖紀項莊請以劒舞因擊沛公項伯亦起舞常以身蔽翼沛公鳴弓射獸能洙曰曹子建詩攬弓健鳴鏑驅上彼南山左挽因右發一縱兩禽連銛鋒行愜順趙曰言舞劒之絶也猛噬失蹻騰鄭曰蹻音橋趙曰言射獸之能也赤羽千夫膳修可曰家語赤羽若日白羽若月千夫膳言所膳者千兵也師曰赤雨千夫膳古詩云桃花亂落如紅雨赤雨言落葉也黃河十月冰橫行沙漠外洙曰所向無前故曰橫行神速至今稱洙曰岑彭兵至蜀公孫述以技擊地曰是何神也哀挽青門去洙曰哀挽哀歌也漢書霸城門民間所謂青門新阡絳水遙路人紛雨泣洙曰諸葛亮亡人皆野哭時可曰出曹子建作王仲宣誄曰延首歎息雨泣交頸趙曰詩涕泣如雨師曰路人猶泣况親知乎天意颯風飈部曲精仍鋭洙曰見部曲異平生注胸奴氣不驕趙曰此言將軍之餘烈如此孫曰氣不驕言畏其威也無由覩雄略大樹日蕭蕭洙曰馮異傳諸將並坐論功異常獨屏樹下軍中號曰大樹將軍存殁口號二首席謙不見近彈碁洙曰席謙吳人善彈碁黃曰漢梁兾傳注藝經曰彈碁兩人對局白黑碁各六枚先列碁相當更先彈也余曰酉陽雜俎謂丗説言彈棊起自魏室粧奩戲也今彈棊用棊二十四以色别貴賤又魏戲法先立一棊立於局中餘中間白黑圍繞之十八籌成都計畢耀仍傳舊小詩洙曰畢耀善為小詩見玉臺集玉局他年無限笑薛曰右按道藏成都地神踴出扶一玉局白楊今日幾人悲洙曰陶潛挽歌云蔓草何茫茫白楊亦蕭蕭趙曰言幾人為之悲特有我而巳鄭公粉繪隨長夜曹霸丹靑巳白頭天下何曽有山水人間不解重驊騮洙曰髙士滎陽鄭虔善畫山水曹霸魏曹髦之後善畫馬趙曰言無人珍重而藏其畫也分門集注杜工部詩卷第二十二
