  text: 分門集注杜工部詩卷第二十五
  hash: sha256:936697f28a0d1d3c8049aabb92a2df38de38e9ef2c0044a1627b01ebe710affc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0018_SBCK_025-1a}
body:
  text: 雜賦古詩十三首律詩六首課伐木并序課隸人伯夷幸秀信行等入谷斬隂木鄭曰隸郎計切附著也洙曰冬官輪人為輪斬三材必以時注材在陽則仲冬斬之在隂則以仲夏斬之此並據山虞云人日四根止維條伊枚洙曰詩終南何有有條有枚正直侹然晨征暮返委積庭內我有藩籬是缺是補載伐篠簜洙曰禹貢揚州篠簜既敷注篠竹箭簜大竹鄭曰篠先了切竹小者簜徒沆切大竹也伊杖支持則旅次于小安山有虎知禁若恃爪牙之利必昏黑搪突䕫人屋壁列洙曰一作例鄭曰搪徒郎切突陀沒切觸也樹白菊鏝為墻鄭曰鏝謨官切柯也實以竹示式遏為與虎近混淪乎無良賔客憂洙曰一作齒害馬之徒洙曰莊子黃帝於襄城下見牧馬童子而問理天下童子曰為天下何異乎放馬去其害馬者苟活為幸可默息巳作詩付宗武誦趙曰廬陵嘗謂杜甫無韻者不可讀今此可見矣長夏無所為邁曰夏日長故云長夏也客居課奴僕清晨飯其腹持斧入白谷青冥曽巔後趙曰張平子南都賦言木有曰櫕立叢駢靑冥芊眠謝靈運詩葺宇臨回溪築觀基曽巔薖曰曾巔髙山也十里斬隂木修可曰周禮山虞仲冬斬陽木仲夏斬隂木鄭司農云陽木春夏生者隂木秋冬生者鄭玄云陽木生南山隂木生北山蘇曰韓信廟記斬十里隂木鑿五尋巨石也人肩四根巳逸曰四根四株也亭午下山麓尚聞丁丁聲洙曰天台賦羲和亭午詩伐木丁丁鄭曰丁宇耕切伐木聲功課日各足蒼皮成積委素節相照燭籍汝跨小籬當仗洙曰一云當材若虛竹空荒咆熊羆乳獸待人肉蘇曰廉頗别傳曰乳虎飢怒而待人肉豈有弃於齒牙之間也趙曰謂之跨小籬則跨越居而遮護之也此言及熊羆則山居所防豈獨虎耶不示知禁情豈唯干戈哭城中賢府主師曰嘆美䕫守也處貴如白屋蘇曰戴憑富貴如歸閭里白屋食列鼎常思黃粱師曰茅草蓋屋曰白屋蕭蕭理體淨洙曰治道貴清淨蜂蠆不敢毒洙曰左氏蜂蠆猶有毒蘇曰葛稚川與兒出戲誤捉蜂蠆不敢毒螫其父嘉之鄉曲皆推重虎穴連里閭隄防舊風俗泊舟滄江岸久客愼所觸舍西崖嶠壯雷雨蔚含蓄墻宇資屢修衰年怯幽獨爾曹輕執熱蘇曰杜周兵馬輕執熱而深入巳成虜功不可旌賞為我忍煩促秋光近青岑季月當泛菊報之以微寒共給酒一斛蘇曰徐邈酒一斛餅三事師曰甫泛舟自蜀來泊止于此要當戒慎無觸此禍又况舍西山嶠雄壯含蓄猛獸極多墻壁貴乎修葺是以課隸斬木取竹以為扞禦之備爾曹指信行等冒熱往取竹木冝有以勞之泛菊伊邇給酒一斛以報其勞仍以尉微寒爾上後園山腳朱夏熱所嬰淸旦步北林小園背髙岡挽葛上﨑崟天覺曰﨑崟山也曠望延駐目飄颻散疏襟潜鱗恨水壯洙曰水壯則非潜鱗之所居也趙曰顔延年春江壯風濤去翼依雲深洙曰蓋避難地不可不深逺也趙曰上句以譬隱淪之士須幽廣深逺而後可勿謂地無疆洙曰坤厚載物德合無疆劣於山有隂洙曰山北曰隂時喪亂九州分裂孰若山隂之可以避亂也石榞遍天下趙曰學者疑榞字之誤田曰唐韻曰榞音原木名皮可食或云善本止是石原蓋平地曰原鄭曰榞魚袁切實如甘蕉而皮可食沈曰石榞其子如芎窮其皮可以禦飢時天下荒亂小民轉溝壑水陸並載石榞以充飢水陸兼浮沉自我登隴首趙曰顔延年龍首秋雲飛十年經碧岑劒門來巫峽薄倚浩至今洙曰自鳯翔赴同谷由同谷入蜀㳂流下峽皆山水鄉也故園暗戎馬骨肉失追尋時也無消息老去多歸心蘇曰吳革老年客寓自多歸思志士惜白日洙曰荀子曰君子愛日趙曰古詩志士惜白日久客藉黃金洙曰古詩徒有萬里志欲行囊無金敢為蘇門嘯庶作梁父吟洙曰阮藉嘗登蘇門山有真人在焉藉對之長嘯及歸至半嶺間聞然有聲若數部鼓吹乃前人嘨也諸葛亮好為梁父吟師曰甫不敢以真人自居但效諸葛躬耕嘯詠而巳此謙辝又上後園山腳昔我遊山東憶戲東嶽陽窮秋立日觀矯首望八荒洙曰八一作北顔延年曰日觀臨東溟蘇曰張美登太山絶頂隂雲散尽矯首拭目下視四方朱崖著毫髮洙曰朱崖海南州也碧海海也言逺望若毫髮然碧海吹衣裳蘇曰董伋飄颻碧海之風吹我衣𥚑皎皎廣寒之月照我毛髮蓐收困用事玄冥蔚強梁洙曰蓐收秋神也玄冥冬神也言四時相代而用事則休者困而王者強梁矣逝水自朝宗鎮石各其方洙曰言逝者無所止而止者不易其所也平原獨憔悴農九廢耕桑蘇曰吳壯河朔風塵傾洞玁狁大掠况炎天非出師之時而又慮冦吾畿甸田草農力既奪必廢耕桑恐失人望非關洙曰一云北關風露凋曽是戍役傷洙曰民之貧困非天時傷於戍役而巳於時國用冨足以守邊疆朝廷任猛將逺奪戎虜場洙曰於時言當時也當玄宗冨盛之時不能節用自守而委任番將求功夷狄也蘇曰班彪引兵深入直奪戎虜帳場到今事反覆故老淚萬行洙曰樂極則悲來也龜蒙不可見况乃懷故鄉洙曰龜䝉山也去東嶽近而尚不可見况故鄉乎肺萎屬久戰骨出熱中腸憂來杖匣劒更上林北岡瘴毒猿鳥落峽乾南日黃秋風亦巳起江漢始如湯洙曰苦熱行赤阪橫西阻火山赫南威身熱頭且痛鳥隨魂來㱕湯泉發雲潭焦煙起石圻登髙欲有往蕩析川無梁洙曰欲有所行而無所由也哀彼遠征人去家死路傍不及父祖塋纍纍冢相當洙曰魏懷舊賦冡纍纍以接隴華表丁令威歌何不學仙冡纍纍後漢有曰直如弦死道邊信行逺修水筒洙曰引泉筒也師曰信行乃童行也汝性不茹葷鄭曰許云切清淨僕夫內秉心識本洙曰一云根源於事少滯礙雲端水筒坼林表山石碎洙曰鮑明逺雲端楚山見林表吳岫微觸熱藉子修通流與厨會往來四十里荒險崖谷大日曛驚未餐洙曰曛黑也貌赤愧相對浮瓜供老病裂餅常所愛洙曰何曽傳蒸餅上不坼作十字不食之趙曰公食餅則裂而與之乃常所私愛信行者也故繼以於斯答恭謹裂餅字暗使王羆與客食餅客裂餅緣羆日只是不飢於斯答恭謹足以殊殿最洙曰文賦考殿最於錙銖注下功曰殿上功曰最詎要方士符何假將軍蓋趙曰意是二師將軍拔刀刺山而飛泉出事但無蓋字耳行諸直如筆用意﨑嶇外定功曰直如筆言其有用而不邪曲也故後魏古弼太武嘉其直而有用賜名曰筆以其頭尖又名尖頭奴時人呼之為筆公後改曰弼引水魯曰䕫俗無井皆以竹引山泉而食蟠屈山腹間有至於數百丈者月峽瞿塘雲作頂洙曰庾仲雍荆州記曰巴楚有明月峽趙曰本朝史寰宇記於渝州載有明月峽以石穴圎似之故以名亂石崢嶸俗無井洙曰楚俗山居負水而食故髙者引水雲安無泉尤難得水故云雲安沽水奴僕悲魚復移居心力省洙曰後漢地理志魚復屬巴郡古庸國左傳文十年魚人逐楚師是也修可曰魚復即䕫州矣今之倚郭奉莭縣乃漢之魚復縣也白帝城西萬竹蟠接筒引水喉不乾人生留滯生理難斗水何直百憂寬洙曰莊子期斗升水之活趙曰盧照鄰秋風至詩還思不動行賴此百憂寬可歎天上浮雲如白衣斯須改變如蒼狗洙曰言雲本無躰人以為衣人以為狗而巳趙曰浮雲固變態不常之物然初為白衣而變為蒼狗以譬万事之變不可名狀也北史元諧傳如蹲狗去鹿古往今來共一時人生萬事無不有洙曰非特雲也古今人事亦如此者衆趙曰應詹與陶侃書曰其間事故何所不有也近者抉眼去其夫洙曰一云昧河東女兒身姓栁趙曰不喜其夫如抉眼中之物而去之東北人方言不喜見者每日抉眼丈夫正色動引經酆城客子王季友趙曰惟王季友正色引經在唐丈粹惟載季友詩觀公全篇所云則王佐之才矣羣書萬卷常暗誦孝經一通看在手蘇曰高嶽讀孝經一遍即背誦時五歲貧窮老瘦家賣屐好事就之為携酒趙曰暗使揚雄傳好事者載酒肴從遊學豫章太守髙帝孫洙曰宗室也引為賔客敬頗久趙曰此下紀述季友且言其逢主人李太守也聞道三年未曽語小心恐懼閉其口太守得之更不疑人生反覆看亦醜趙曰言人生相得氣合則勿疑若更反覆則旁人看之亦醜也明月無瑕豈容易紫氣鬱鬱猶衝斗洙曰明月之珠紫氣衝斗見張華傳時危可杖真豪俊二人得置君側否太守頃者在南山邦人思之比父母王生早曽拜顔色髙山之外皆培塿鄭曰上都苟切下路苟切洙曰魏都賦培塿之與方壷修可曰左傳曰部婁無松柏說文曰培塿小土山方言曰冡秦晉之間謂之培塿風俗通曰培塿者即阜之類也今齊魯之間山之小髙者曰培塿趙曰小阜也言王生之拜太守顔色如仰髙山其餘人真培塿也用為羲和天為成用平水土地為厚洙曰堯羲仲和仲書地平天成又禹平水土王也論道阻江湖李也丞疑曠前後洙曰左輔右弼前疑後丞三公論道經邦趙曰王也可以論道而留滯於江湖阻隔於致身李也可為疑丞而天子前後曠闕斯人也死為星辰終不滅洙曰見方朔為歲星注致君堯舜焉肯朽吾輩碌碌飽飯行風后力牧長回首洙曰風后力牧黃帝時良臣也師曰衣無情而狗有情如衣猶之可也變而為狗則甚矣古今人事變更有同浮雲河東柳氏之女疾其夫貧醜抉眼以去其夫王生然王生通經孝友之士也見愛於太守李侯而見惡於其妻亦足見人生返覆万事變更如浮雲然兹可歎也夏侯湛東方朔畫贊序曰先生弃俗登仙神變造化靈為星辰此又竒怪恍惚不可備論也莊子曰傳說得之以相武丁乘車維騎箕尾而比於列星陶淵明集賢羣輔録風后受金法注云金法言能决理是非力牧受凖注凖斥九事也與天老五聖知命窺紀地典為黃帝七輔州選舉翼佐帝德乂帝王丗紀也黃帝夢大風吹天下塵垢皆去復夢人執千鈞之弩驅羊數万羣帝歎曰風天號令垢去土后在也豈有姓風名后者哉千鈞之弩異力能逺驅羊萬羣牧民為善豈有姓力名牧者哉乃得風后於海隅力牧於大澤甫以王李二人比之風后力牧可以論道可以丞疑以輔王室故回首以眷思之火洙曰楚俗大旱則焚山擊鼓有合神農書楚山經月火大旱則斯舉趙曰此燒山以求雨之詩舊俗燒蛟龍驚惶致雷雨爆嵌魑魅泣鄭曰爆皮教切崩凍嵐隂昈鄭曰侯古切日光也又文彩趙曰言氷雪下墮其丈采明昈於風隂之間羅落沸百泓鄭曰烏宏切水深也根源皆萬古青林一灰燼雲氣無處所趙曰言靑林既灰燼矣雲氣無所止泊也出朱玉髙唐賦風止雨霽雲無處所入夜珠赫然新秋照牛女風吹巨熖作河棹騰煙柱勢欲焚崑崙光彌焮洲渚鄭曰焮香靳切炙也趙曰火炎崑岡參合而言之也焮字出左傳火所焮燎腥至燋長蛇聲吼洙曰一云吼爭纏猛虎神物巳髙飛趙曰指言神龍也不見石與土爾寧要謗讟鄭曰徒谷切慿此近熒侮薄關長吏憂甚昧至精主遠遷誰朴滅洙曰書若火燎于原不可嚮邇其猶可撲滅將恐及環堵流汗卧江亭更深氣如縷曲江三章章五句彥輔曰元和中中書舍人李肇撰國史譜其略曰進士既捷大宴於曲江亭子謂之曲江㑹曲江大㑹在關試後亦謂之開宴天寶元年勑以太子太師䔥嵩私廟逼近曲江因上表請移他處勑令將士為嵩營造曲江蕭條秋氣髙洙曰謝玄暉觀朝雨詩朔風吹飛雨蕭條江上來宋玉曰悲哉秋之為氣蕭瑟兮草木搖落而變衰蘇曰顔延年曰秋髙氣爽倍增蕭索修可曰出宋玉衆芳蕭條班固原野蕭條之義菱荷枯折隨風濤游子空嗟垂二毛洙曰潘安仁秋興賦晉十有四年余春秋三十有二始見二毛僖二十二年傳宋玉曰君子不禽二毛頭白有二色白石素沙亦相蕩哀鴻獨呌求其曹洙曰祢衡賦哀鳴感類曹子建激鳴哀鴻羣劉安招隱士禽獸駭兮亡其曹趙曰方髙秋之時非特菱荷枯折而巳水既瘦凅石與沙亦蕩潔而出鴻鵠失羣哀鳴而相求皆可感之事也師曰按西京雜記武帝於曲江頭大營亭館以為宴賞之地號為勝絶玄宗時勑彼太子太師蕭嵩廟于别所以敞其臺館憲宗時每宴進士必於曲江亭當時曲江風景盛傳天下祿山之亂焚爇殆尽况秋氣蕭條菱荷枯折轉令人慘傷甫覽此風物巳非昔日之盛復自傷年老兄弟間隔豈非黍離閔宗周之比乎再吟即事非今亦非古定功曰即事者即目前所覽曲江之事長歌激越梢林莽洙曰宋玉風賦蹶石我木梢殺林莽蘇武詩長欹正激烈鄭曰選羅千乘於林莽比屋豪華固難數洙曰堯舜之世比屋可封趙曰曲江方盛而於長欹激烈者特以豪華者多而我獨寂寞也吾人甘作心似灰洙曰莊子南郭子綦形固可如槁木而心固可如死灰弟姪何傷淚如雨趙曰公厭心久矣弟姪不必傷此而下淚也變詩泣涕如雨定功曰甫謂老年巳灰少游之心雖屏跡寂寞無所憾恨但傷弟姪隔别是以涕淚如雨又吟自斷此生休問天修可曰楚詞天問篇其序曰天問者屈原之所作也何不言問天天尊不可問故曰天問也東坡有此生自斷天休問轉用少陵之句敏功曰語曰死生有命冨貴在天遇不遇無非天命今曰休問天者蓋君子窮物之里尽巳之性以至逹知天命故能自斷而不必問天者也杜曲洙曰杜曲在長安俗云城南韋杜去天尺五言近京幸有桑麻田蘇曰苐五倫吾杜曲有田種麻藝桑足免飢凍故將移住南山邊洙曰楊惲傳出彼南山陸韓卿詩云屏居南山下竇嬰傳屏居藍田南山下短衣匹馬隨李廣看射猛虎終殘年洙曰前漢李廣為虜所生得當斬贖為庶人屏居藍田南山中射獵廣出獵見草中右以為虎而射之中石沒羽視之石也他日射之終不能入矣廣所居郡聞有虎常自射之及居右北平射虎虎騰廣廣亦射殺之也趙曰欲移住南山則南山之景致足樂也匹馬射虎使李廣事廣正後藍田南山中此詩人因意使事也殘年出列子汝以殘年餘力覺範曰此五句法惟即事遣興可作若題物贈送之類皆不可用三韻三篇髙馬勿唾面洙曰唾一作捶趙曰當作捶面方有義長魚無損鱗辱馬馬毛焦困魚魚有神君看磊落士不肯易其身洙曰馬魚尚不可輕士有𬒳褐而懷玉者其可輕乎師曰高馬長魚有異於類尚不輕况拔萃之士嘗晦其迹其可以𬒳褐輕賤之乎蕩蕩萬斛􅊑趙曰釋名曰船二百斛曰􅊑三百斛曰艇而趙五虎造萬斛之舟今取其大者以比興也影若揚白虹起檣必椎牛洙曰椎牛言祭也挂席集衆功趙曰椎牛所以享衆功至於用牛則人徒之衆可見船之大又可知舊注謂以牛祭非是自非風動天莫置大水中洙曰言才大不可小用也趙曰得大風而後飽其帆也出鮑照舞鶴賦箕風動天烈士惡多門洙曰晉政多門小人自同調洙曰以其同而不和也趙曰字出謝靈運誰謂古今殊異代可同調名利苟可取殺身傍權要何當官曹淸爾輩堪一笑洙曰譏趍附權勢以致名位者師曰晉政多門謂政出於不一小人自同調謂小人挾私互相黨同孔子云冨而可求也雖執鞭之士吾亦為之如不可求從吾所好名利豈可苟求權要豈可苟附唐玄宗之時牛李用事官曹混濁祿山一武夫而求平章事儻遇英明之主澄汰冗則斯輩也直付之一笑耳此詩譏趍炎附勢者示獠奴阿假鄭曰獠魯皎切山木蒼蒼落日曛竹竿裊裊細泉分洙曰以竹引泉也郡人入夜爭餘瀝趙曰以筒引水其水涸塞不通故郡人止爭餘瀝耳稚子尋源獨不聞病渴三更回白首趙曰惟阿假者獨能尋源修筒水而至焉公有渴疾賴此水為多傳聲一注濕青雲趙曰以修筒之後水來之聲自傳聞矣曽驚陶侃胡奴異怪爾常穿虎豹羣洙曰此詩全章皆引泉事惟陶侃胡奴傳記不録蘇曰侃得胡奴甚不喜語言常默坐侃一日出郊執鞭隨之胡僧見而驚禮曰此海山使者也因念墮下侃異之至夜失其所在趙曰薛夢符云晋陶侃傳家僮千餘丗說謂胡奴陶範小字侃别傳曰範侃第十子也可以見胡奴者陶侃之子名其於阿假似無相千余逆其意豈以侃奴僕之多其子胡奴必有稱異之者如今日阿假能穿虎豹羣以尋水源其在陶侃家僮千餘之中必亦有可異者意似如此以俟博聞師曰此詩乃命獠奴以竹引水以濟病渴常穿虎豹羣言入山以理水筒也白露白露團甘子洙曰見王露團淸影注淸晨散馬蹄洙曰鮑明遠附身散馬蹄圃開連石樹船渡入江溪慿几看魚樂洙曰莊子與惠子觀魚於濠梁而羡魚之樂也回鞭急洙曰一作至鳥棲洙曰王正長鳥思栖故枝師曰回鞭急者以日暮鳥樓林也漸知秋實美幽徑恐多蹊洙曰李廣傳桃李不言下自成蹊搗衣亦知戍不返趙曰婦人知其夫戍邊而不返秋至拭清砧巳近苦洙曰一作暮寒月况經洙曰一作驚長别心洙曰言佂戍之苦不保其生死寧辭搗衣倦一寄塞垣深洙曰垣城牆也塞垣猶邊城也用盡閨中力君聽空外音洙曰砧聲也師曰詩言征戍之苦秋至拭砧作寒衣送至塞垣塞垣邊城也尽閨中之力搗衣其砧聲音聞于空外使人不忍聽也少年行二首莫笑田家老瓦盆蘇曰陳暄好飲一日貴客過笑暄用陶器暄曰莫笑此老瓦盆多見興廢也客無語自從盛酒長兒孫洙曰長一作餋傾銀注瓦驚人眼共醉終同卧竹根修可曰酒譜云共醉終同卧竹根為飲器事見江淹集然遍閲江集並無竹根事唯庾信報趙王賜酒詩曰野爐燃樹葉山柸捧竹根此以竹根為飲器然子美謂卧竹根者但謂醉卧竹林中耳理甚易曉若以竹根為飲器失之太鑿也趙曰言與田家自瓦盆中喫酒共醉卧竹根之傍耳田曰竹根為飲器引庾信報趙王賜酒詩曰如聞傳上命定是賜中樽野爐然樹葉山杯捧竹根然豫切疑之以為酒器豈得謂之卧乎巢燕養雛渾去盡江花結子巳洙曰一作也無多黃衫年少來冝數趙曰黃衫想唐人富貴家之服不見堂前東逝波洙曰言行樂當及時也少年行馬上洙曰一云騎馬誰家白面洙曰一云薄媚郎臨階下馬坐人床不通姓字粗豪甚指點銀瓶索酒嘗朱曰一云未嘗絶句六首日出籬東水雲生舍北泥竹高鳴翡翠沙僻舞鵾雞洙曰九辨鵾雞嘲􅑜而悲鳴趙曰公孫月賦鵾雞舞於蘭渚藹藹花蘂亂飛飛蜂蝶多趙曰江揔詩黃鵠飛飛遠幽棲身懶動客至欲如何鑿井交棕葉開渠斷竹根扁舟輕裊纜小徑曲通村急雨梢溪足斜暉轉樹腰隔巢黃鳥竝翻藻洙曰藻水草也左傳蘋蘩藴藻之菜白魚跳舍下笋穿壁蘇曰顧榮苦志讀書經年不出户村居踈漏笋穿壁生草可沒人日惟一盂粥而手不釋卷庭中藤刺洙曰一作到刺七亦切簷地晴絲冉冉江白草纎纎江動月移石溪虛雲傍花鳥棲知故道帆過宿誰家蘇曰宋選送弟入洛登舟挂席東下選凝竚久之語細君曰帆過南浦今夜清風明月宿水涘誰家趙曰南中八志曰交趾郡治龍編縣自興古鳥道以其絶險獸猶無蹊人所莫由時上有飛鳥之道耳絶句四首堂西長笋别開門塹北行椒却背村趙曰行椒蓋成行者如官栁著行新梅熟許同朱老喫松髙擬對阮生論洙曰朱阮劔外相知欲作魚梁雲覆湍洙曰覆一作復鄭曰魚梁地名因驚四月雨聲寒青溪先有蛟龍屈竹石如山不敢安趙曰魚梁劈竹積石橫截中流以為聚魚之區也以溪下有蛟龍時興雲雨雖以魚梁人之所利也而公不敢犯害以就利異乎丗人徑行直前惟利是謀矣兩箇黃鸝鳴翠栁一行白鷺上青天鄭曰行胡岡切列也窗含西嶺千秋雪洙曰西山白雪四時不消門泊東吳萬里船洙曰西山舊謂雪山以此也趙曰公之志每欲南下其所買而治門外之船乃欲萬里往東吳之船也藥條藥洙曰一作草甲潤青靑色過棕亭入草亭苗滿空山慙取譽趙曰公自喻也藥者如本草所載各以其土地知名於世根居隙地怯成形趙曰令所種之藥在空隙之地欲成似物之形而怯於人之所易見也漫成一首新添江月去人只數尺趙曰梁虞騫詩月光移數尺風燈照夜欲三更沙頭宿鷺聮拳靜洙曰一作起趙曰聮拳者相並相續之貌船尾跳魚撥洙曰作跂刺鳴洙曰撥刺躍而有聲也夢符曰右按後漢張平子賦控飛弧之撥刺兮射嶓冡之封狼絶句三首新添鮑曰謝克家任伯云得於愼文肅家故書中猶是吳越錢氏時人所傳格律髙妙其為少陵不疑聞道巴山裏春船正好行都將百年興一望九江城水檻溫江口茆堂石笋西移船先主廟洗藥浣沙溪設道春來好狂風大放顚吹花隨水去翻却釣魚船答鄭十七郎一絶雨後過畦潤花殘步屐遲蘇曰曹植花殘惜春步屐自遲把文驚小陸洙曰小陸陸雲蘇曰王融見張充文曰子文章如小陸小陸瘦而散子文麗而秀好客見當時洙曰當時鄭莊者也三絶句彥輔曰此三絶皆愍交道凋敝風俗衰薄也初章言新合之情不能久則莫若不見之也次章言踈數之無常也三章言莫若以歲寒自守也公當亂離之際奔走流落而無上下之交故見於詩者率皆如此趙曰洪覺範謂子美詩山間野外意在譏刺風俗如三絶句是也余謂不然楸樹馨香倚釣磯鄭曰楸此由切斬新花蘂未應飛不如醉裏春風盡可洙曰楸一作春可一作何忍醒時雨打稀師曰此詩譏後進暴貴雖可為一時榮觀奈何恩重才薄眼見其零落不若未受恩眷之時雨比天恩以雨多故致花易壞也門外鸕鷀久不來沙頭忽見眼相猜自今巳後知人意一日須來一百回蘇曰齊騄見童癡且鄙鞭打不時妻曰但以財使之果善事人笑謂妻曰一日一百回亦須來往矣工部造法冝躰之師曰此詩言貪利小人畏君子之譏其短也然君子以蒙養正瑜瑾匿瑕山藪藏疾不發其隱而小人來革面諂諛不能愧耻也無數春笋滿林生柴門密掩斷人行㑹須上番看成竹趙曰上番乃川語上番則成行故謂上筤竹客至從嗔不出迎師曰前篇言花始雖斬新終為風吹雨打以至零落此詩言筍𥘉生終乎成竹而有客至從嗔不出迎之語蓋言唯君子守道為歲寒異夫小人之暴貴易壞也解悶二首同作十二首五首見果實門五首見文章門草閣柴扉星散居趙曰庾信寒園即日詩寒園星散居師曰䕫地多山少平居人傍山故星散浪翻江黑雨飛初洙曰鮑昭翻浪揚白鷗山禽引子哺紅果溪友洙曰一作女得錢留白魚師曰得錢不論其價知魚賤也啇胡離别下楊州憶上西洙曰一作蘭陵故驛樓為問淮南米貴賤蘇曰王褒淮南米價貴賤吾欲東下老夫乘興欲東流趙曰因其行而問淮南米價欲儘南下也復愁十二首洙曰此詩十二首多感時事而言故無傳信者則闕之以俟有聞人煙生處僻洙曰一云逺處趙曰曹子建千里無人煙虎跡過新蹄野雉洙曰一作鶻翻窺草蘇曰董卓每視漢獻帝如野鶻之窺深草蓋其禽心自視無異也工部作是句深得躰法村船逆上溪釣艇收緍盡昏鴉洙曰一作鷗接翅稀月生初學扇雲細不成衣洙曰初學扇謂未甚圎也不成衣言細也趙曰李義府詞鏤月成歌扇裁雲作舞衣萬國尚防冠故園今若何蘇曰楊震故園今復如何趙曰故園指長安也昔歸相識少早巳戰場多身覺省郎在趙曰公任工部貟外郎故云家須農事歸年深荒草徑老恐失柴扉金絲鏤箭鏃皂尾掣旗竽一自風塵起猶嗟行路難洙曰金絲箭皂尾旗皆胡服也正觀銅牙弩田曰南越志云龍川唐時常有銅弩牙流出水皆銀黃雕鏤取之以製弩開元錦獸張趙曰書曰若虞機張則所謂錦獸張者亦弩之物耳花門小前洙曰一作箭好此物弃沙場師曰唐六典注釋名曰弩怒也有弩怒也其柄曰臂似人臂也鉤弦曰牙似牙齒也牙外曰郭為牙之規郭也合名之曰機如門户樞機開闔有節也父老云蓋越王弩營也錦獸張設射侯也花門乃回紇胡虜何曽盛干戈不肯休閭閻聽小子談笑覔封侯趙曰此篇公蓋憤生事邀功濫冒榮寵者矣雖閭閻小人亦說取封侯也今日翔麟馬夢符曰右按唐志翔麟廄名續通典內有飛龍翔麟鳯苑鵷鵉告良六羣等大廄先冝駕鼓車洙曰漢文以千里馬駕鼓車無勞問河北諸將覺洙曰一云角榮華趙曰言此馬不勞問惟河北諸將角勝於榮華而巳任轉江淮粟蘇曰董作轉江湖淮浙粟以實河北休添苑囿兵由來貔虎士不滿鳯凰城趙曰責天下勤王而巳不在京城之兵多也江上亦秋色火雲終不移趙曰餘熱猶在也巫山猶錦樹南國且黃鸝每恨陶彭澤無錢對菊花如今九日至自覺酒須賖洙曰陶潜九日無酒採菊盈把逺望有白衣人携酒來乃王弘使人送酒至遂醉而歸病減詩仍拙吟多意有餘莫看江㧾老洙曰江揔陳後主狎客也陳破歸隋後歸老江南趙曰按江揔傳揔尢工五言律詩而不及江揔蓋公亦喜其詩矣猶𬒳賞時魚師曰江揔陳後主狎客也陳破歸隋後復歸江南子美以身未歸故鄉故託江揔以自比言揔雖易主得歸猶不若子美流落而有銀魚之賜子美檢校工部朱絞銀魚乾元中寓居同谷縣作七首魯曰同州縣名有客有客字子美洙曰以其寓居故自稱有客子美甫字也白頭亂䕫洙曰一云短髮垂過耳歲拾橡栗隨狙公洙曰亂一作短按新史言甫居同谷縣拾橡以自給兒女有至餓殍者天寒日暮山谷裏夢符曰右按列子宋有狙公愛狙而餋之先誑之曰與若芧朝三而暮四足乎衆狙皆起而怒俄而曰與若茅朝四而暮三足乎衆狙皆伏而喜注茅栗也中原無書歸不得手腳凍皴皮肉死鄭曰皴七倫切皮細起也師曰甫自傷飢寒不得㱕鄉悲風為生天為之感動況人乎嗚呼一歌兮歌巳哀悲風為我從天一作東來其二長鑱長鑱白木柄鄭曰鑱鋤䘖切吳人云犂鐡說文鋭也我生託子以為命黃精洙曰一作黃獨無苗山雪盛蘇曰朱栩貧居嘉陽常負攙采黃獨一曰雪盛不獲黃精當作黃獨往時儒者不解黃獨改作黃精魯直云以豫考之黃獨是也本草赭魁注肉白皮黃也漢人蒸食之山東人呼為土芋江西人呼作土卯蒸食之類芋魁短衣數挽不掩脛鄭曰胡定切腳脛也洙曰寧戚叩角歌曰短布單衣不及其骭此時與子空洙曰一作同歸來男呻女吟四壁靜洙曰相如家居徒四壁立嗚呼二歌兮歌始放閭洙曰一作鄰里為我色惆悵洙曰首章天哀其窮次章人亦哀其窮矣田曰列子曰昔韓娥東之齊鬻歌假食逆旅人辱之因慢食哀哭一里老幼悲愁相對三日不食老杜放歌而里閭惆悵意頗類此師曰閭里尚為之惆悵况親戚舊故乎其三有弟有弟在遠方洙曰一作各一方三人各瘦何人強洙曰後漢趙孝弟禮為賊所得將食之孝自縳詣賊曰禮瘦不如孝肥賊感其意俱舍之生别展轉不相見洙曰樂府他鄉各異縣展轉不相見胡塵暗天道路長洙曰詩道阻且長東飛鴐鵝後􅒗鶬鄭曰鴐古牙切鳥名􅒗七由切鶬七剛切洙曰揚雄傳豈鴐鵝之能捷􅒗鶬惡禽也鶬九頭詩有鶖在梁安得送我置汝傍嗚呼三歌兮歌三發汝歸何處收兄骨洙曰收一作取僖三十二年殽有二陵必死是間余收爾骨非特巳窮而巳而兄弟之親亦莫知其存云梅曰甫詩云花落辭故枝風回反無處蓋傷年老死去弟無處可以尋也亦與此句同其四有妹有妹在鍾離魯曰地理志濠州鍾離郡良人早殁諸孤癡長淮浪高蛟龍怒十年不見來何時洙曰一作遲扁舟欲往箭滿眼杳杳南國多旌旗嗚呼四歌兮歌四奏竹林猿為我啼清晝洙曰猿非有情者而亦為之啼則窮可知矣蘇曰舊作竹林後人改為林為猿今本皆因之蔡絛云崇寧間有貢士同州來籠一禽大如雀色正青善鳴問其名此竹林鳥也少陵於詩必紀其處以明風俗方物詔於後人豈易改也師曰猿乃無知之物今為我啼蓋哀傷之至也其五四山多風溪水急寒雨颯颯枯樹濕洙曰一云樹枝濕黃蒿古城雲不開白狐洙曰一云玄狐跳梁黃狐立鄭曰跳徒聊切躍也我生胡為在窮谷中夜起坐萬感集洙曰謝靈運詩千念集日夜万感盈朝昏王康琚詩哀風中夜起嗚呼五歌兮歌正長魂招不來歸故鄉洙曰招魂曰魂兮歸來師曰甫身雖寓同谷而魂夢未嘗忘故鄉可謂思鄉之甚也其六蘇曰六歌一篇為明皇作也明皇以至德二年至自蜀居興慶宫謂之南內明年改元乾元時持盈公主往來宫中李輔國常隂候其隙間之故上元二年常遷西內南有龍兮在山湫逸曰湫龍潭也古木巃嵸枝相樛鄭曰上盧紅下子紅切洙曰劉安招隱士桂樹生叢兮山之幽匽蹇連卷兮枝相樛山氣巃嵸兮石嵳峩敏功曰樛乃枝曲下垂貌木葉黃落龍正蟄洙曰秋風辭草木黃落鴈南飛蝮蛇東來水上遊鄭曰蝮芳福切洙曰招魂曰蝮蛇蓁蓁敏修曰龍蟄喻天子失勢蝮蛇東來喻祿山從山東來我行怪此安敢出拔劒欲斬且復休嗚呼六歌兮歌思遲鄭曰思相吏切洙曰一作怨遲遲溪壑為我回春姿洙曰鄒衍被讒仰天而泣五月為之降霜則士之怨憤足以感通於造物而然矣把臂開樽飲我酒酒酣擊劒蛟龍吼烏帽拂塵青螺粟紫衣將炙緋衣走趙曰指言從人也青螺粟則帽之紋也銅盤燒䗶光洙曰一作炎吐日安石曰銅盤燭臺盤承淚者夜如何其初促膝洙曰言將以紫綬易緋衣促膝言膝相近也入則促膝密語黃昏始扣主人門師曰新相知也誰謂俄頃膠在漆洙曰古詩以膠投膝中師曰古云自謂膠􅃮堅不如雷與陳甫一見嚴二便如膠漆之固萬事盡付形骸外趙曰莊子曰索我於形骸之外百年未見歡娛畢神傾意豁真佳士久客多憂今愈疾髙視乾坤又可愁一軀交態同悠悠逢原曰翟公云一貧一冨乃知交態悠悠泛交也甫視乾坤之內雖大相知者皆泛泛爾垂老遇君未恨晚似君須向古人求洙曰魏志張邈傳後陳登字元龍劉備曰若元龍文武膽志當求之於古人耳晉王戎從弟衍字夷甫帝聞其名問戎曰夷甫當時誰比戎對曰未見其比當從古人中求耳戲贈閿鄉秦少府短歌鮑曰唐志閿鄉屬陜郡去年行宮當太白鮑曰謂肅宗駐鳯翔也唐志鳯翔府郿縣有太白山朝回君是同舍客洙曰直不疑為同舍郎疑盜金師曰至德二載甫為拾遺故云朝回同心洙曰易曰同心之言不減骨肉親每語見許文章伯洙曰唐文三變王楊為之伯趙曰王充論衡超竒篇有云文辝之伯而魏陳琳與吳張絃書云此間率少於文章易為雄伯唐所引乃後人述用也今日時清兩京道洙曰乾元元年肅宗收復兩京相逢苦覺人情好昨夜邀歡樂更無多才依舊能潦倒洙曰嵇康書知吾潦倒粗踈不切事情晏曰潦倒衰老之貌同元使君舂陵行并序覽道州元使君結舂陵行兼賊退後示官吏作二首志之曰當天子分憂之地效漢官良吏之目今盜賊未息知民疾苦得結輩十數公落落然參錯天下為邦伯萬物吐氣天下少安可待矣不意復見比興體制微婉頓挫之詞感而有詩增諸卷軸簡知我者不必寄元遭亂髮盡洙曰一作遽白轉衰病相嬰沉綿盜賊際狼狽江漢行歎時藥力薄為客羸瘵成趙曰此言非不進藥以歎時之故憂思奪之其病雖痊而藥力減半也吾人詩家秀博采丗上名粲粲元道州前聖畏後生洙曰粲粲言美之盛也史三女為粲孔子曰後生可畏觀乎舂陵作歘見俊哲情復覽賊退篇結也實國楨賈誼昔流慟洙曰賈誼可為慟哭者三匡衡常引經洙曰衡上疏陳便冝及朝廷有政議傳經以對道州憂黎庶詞氣浩縱橫洙曰道州元結也劉公幹君侯多壯思文雅縱橫飛兩章對秋月洙曰一作水一字偕洙曰一作階華星趙曰魏文帝詩華星出雲間致君唐虞際洙曰見第二卷致君唐虞上注純朴憶大庭洙曰大庭氏也蘇曰崔列此方人多純朴吾大庭氏之遺民也師曰賈誼於漢之時陳治安之䇿曰可為流涕慟哭者匡衡每朝廷有論誼常引經以對道州指元結之守道州志在憂民嘗抗雨章詞氣激於忠義一字不虛設欲致君為堯舜之君使民風純朴如大庭氏故甫比之賈誼與匡衡大庭黃帝也何時降璽書洙曰前漢循吏傳二千石有治效輒以璽書勉勵焉用爾為丹青洙曰見前丹青憶老臣注趙曰莊子為丹青則藻縟王猷粉飾治具獄訟久衰息洙曰漢禮樂志百姓素朴獄訟衰息也豈惟偃甲兵悽惻念誅求薄斂近休明乃知正人意不苟飛長纓洙曰陸士衡長纓麗且光趙曰長纓者冠冕之事以歎其不苟且在冠冕之中也凉飈振南嶽洙曰南嶽衡山也之子寵若驚洙曰老子寵辱若驚色阻洙曰一云色沮金印大洙曰刺史印綬也趙曰周伯仁云今年殺諸賊奴取金印如斗大繫肘興含滄溟淸洙曰𬈑一作浪趙曰孺子歌曰滄浪之水清兮可以濯我纓我多長卿病洙曰長卿司馬相如也病渴日夕思朝廷肺枯渴太甚漂泊公孫城洙曰白帝城公孫述所據呼兒具紙筆蘇曰陸士衡有客篇云有客逺方來過我漏蓬蓽瓦罍酌松醪呼兒具紙筆詞語青氷霜書如鸞鳯立隱几臨軒楹作詩呻吟內墨淡字欹傾感彼危苦詞庶幾知者聽師曰司馬相如字長卿病渴甫亦有是疾公孫城乃䕫州是時甫客居于此思慕朝廷未嘗一日忘君隱几倚几也呻吟苦痛之聲乃為渴疾所苦字欹傾病中書字橫斜也危苦詞謂逍州春陵之作逼側行彥輔曰贈畢耀一云行篇中字亦作西征賦駢闐逼側逼側何逼側修可曰巷之隘陋也出西京賦駢羅逼側我居巷南子巷北可恨鄰里間十日不一見顔色洙曰江淹古别離詩願一見顔色不異瓊樹枝自從官馬送還官行路難行澀如棘洙曰古樂府有行路難我貧無乘非無足昔者相遇今不得實不是愛微驅洙曰一云庸相訪又非關足無力徒步翻愁官長怒此心炯炯君應識洙曰周禮正長乃官之長也潘安仁寡婦賦目炯炯而不寢鄭曰炯戶頂切光也曉來急雨春風顛睡美不聞鍾鼓傳東家蹇驢許借我定功曰七諫云駕驢而無䇿兮又何路之能極泥滑不敢騎朝天巳令請急會通籍洙曰令郎丁切一云已令把牒還請假阮籍騎驢到郡元帝紀通籍注籍者為二尺竹牒記其年紀名字物色縣之宫門省禁相應乃得入也武后時太學生請急后亦省視之男兒性命絶可憐焉能終日心洙曰一作神拳拳洙曰中庸回之為人也得一善則拳拳服膺弗失之矣注拳拳舉持之貌也憶君誦詩神凜然辛夷始花亦洙曰一作又巳落蘇曰韓文公感春詩辛夷花髙最先開辨證云此花江南地暖正月開北地寒二月開初發如筆北人呼為木筆其花最早南人呼為迎春鄭元成與故人飲辛夷花下曰昨日方開今日半落人生有酒不飲何為趙曰今之木筆花也本草云正月二月開花既落而無子夏秋復著花言花之開落所以顯人之易老况我與子非壯年街頭酒價常苦貴師曰祿山以來京城蕭索百物踊貴何獨酒乎甫以酒貴為苦傷時之意於此可見方外酒徒稀醉眠速冝相就飲一㪷恰有三百青銅錢洙曰宋鮑昭行路難且願得志數相就牀頭恆有沽酒錢功名竹帛非我事存亡貴賤委皇天丗說阮籍謂王戎曰偶得一斗美酒當與君共飲趙曰真宗問近臣唐酒價衆莫能對丁晉公獨曰每㪷三百上問何以知之丁引此詩以對錦樹行今日苦短昨日休歲云暮矣增離憂洙曰時不我與而不知老之將至也霜凋碧樹作錦樹洙曰木葉經霜而紅故若錦然萬壑東逝無停留洙曰聖䝨之傷時者莫不寓意於此孔子所以有川上之嘆荒戍之城石色古東郭老人住青丘趙曰東郭䕫州之郭也老人公自言飛書白帝營斗粟琴瑟几杖柴門幽青草萋萋盡枯死天驥跛足隨釐牛洙曰天馬隨釐牛喻君子而隨小人趙曰草枯則無以充天馬之飼與釐牛無異矣釐牛蠻中牛也自古聖賢多薄命洙曰伯夷之餓死孔子之棲棲顔回之夭孟軻之坎坷皆薄命之聖䝨也姦雄惡少封公侯洙曰漢祖之起所取侯者皆屠沽刀筆之人故國三年一消息蘇曰王粲一别三年不通消息何可以慰遷客流落寂寞情悰終南渭水寒悠悠五陵豪貴反顛倒鄉里小兒狐白裘洙曰五陵漢帝五陵也言當貴者賤當賤者貴是皆傷時也夢符曰右按史記秦囚孟嘗君昌說幸姬求解姬曰願得君狐白裘直千金以獻昭王有客能狗盜入秦宫藏盜得狐白裘獻之遂得歸齊矣又禮士不衣狐白又王褒講德曰千金之裘非一狐之腋生男墮地腰膂力生女富貴傾邦國趙曰傅玄豫章行男兒當門户墮地自生神也生男有膂力之故可以月武致功則一生之間所取富貴傾動國家與美人容貌一顧傾人城再顧傾人國不同莫愁父母少黃金天下風塵兒亦得洙曰天下風塵則姦邪得志蘇曰衛青未濟時為人隸御南郭先生曰天下風塵未息使此兒掃亦得師曰日短歲暮皆傷老之將至而歲不我與也樹以霜壓葉紅若錦然萬壑東逝無停留亦孔子嘆川逝之意此青丘乃夔州地名非洛陽之青丘也東郭老人甫自稱飛書白帝謂有所請丐也天馬跛足隨氂牛喻君子失所而混居小人之中聖賢命薄惡少逢時五陵豪貴反顛倒鄉里小兒狐白裘皆嘆亂丗貴者反賤賤者反貴如小人徒有膂力動取富貴蓋以天下風塵故也五陵巳解在前篇終南山渭水皆關中山水巳為祿山所陷嚴氏溪放歌彥輔曰時郭英乂代嚴武鎮蜀粗暴不能容甫故有公卿獨驕之作天下甲馬未盡銷豈免溝壑常漂漂劒南歲月不可度洙曰成都在劔嶺之南邊頭公卿仍獨驕趙曰此謂居邊之守臣也謂之獨蓋有跋扈不遵王命之意矣舊注謂時郭英乂代嚴武鎮蜀粗暴則固然矣然英乂乃成都尹豈得謂之邊頭公卿乎非公詩本意費心姑息是一役肥肉大酒徒相要洙曰此詩譏邊臣顧望不為朝廷憂也趙曰費心姑息特一役耳何𥙷於事哉禮記謂小人之愛人也以姑息吕氏春秋曰肥肉厚酒務以自強嗚呼古人巳糞土獨學志士甘漁樵師曰昔周公吐握待士今公已糞土此有志之士混於漁樵而莫之出蓋譏英乂不能禮賢下士是以寡援而為崔旰之所勦也况我飄轉無定所洙曰時甫方避地流徙無所依止終日戚戚忍羈旅鄭曰槭且的切痛也秋宿霜溪素月高喜得與子長夜語東遊西還力實倦從此將身更何許知子松根長茯苓遲暮有意來同煮鮑曰永泰元年公在成都憂嚴武卒郭英乂代為節度苛暴不能容公故公往來東川所謂東遊西還力實倦之句趙曰楚辝傷美人之遲暮此末句傷歲晚矣欲服餌長生之藥也師曰甫意欲暮年與嚴氏同隱溪故云虎牙行洙曰虎牙灘名也嶮絶蕭銑僭江陵日屯兵于此後常為屯戍之地鮑曰虎牙山名盛弘之荆州記郡西沂江六十里南岸有山名荆門北岸有山名虎牙二山相對楚西塞也秋風歘吸吹南國天地慘慘無顔色洞庭揚波江漢回虎牙銅柱皆傾側洙曰虎牙銅柱並灘名言江漢之問亦未寧靜也虎牙屬南郡山名見後漢志巫峽隂岑朔漠氣峯巒窈窕溪谷黑杜鵑不來猿狖寒洙曰杜鵑杜宇也山鬼幽憂雪霜逼洙曰楚九歌有山鬼詩楚老長嗟憶炎瘴洙曰以慘急所以憶炎瘴也此皆傷時也三尺角弓兩斛力洙曰弓短而徑力不能勝也壁立石城橫塞起金錯旌竿滿雲直洙曰時多防戎也漁陽突騎獵靑丘洙曰祿山之反皆漁陽突騎漁陽燕葪青丘內地屬洛陽犬戎鎖甲聞丹極洙曰大戎吐蕃也丹極帝居也時吐蕃陷京師八荒十年防盜賊征戍誅求寡妻哭洙曰夫征役在外故多寡妻逺客中宵淚霑臆蘇曰顔鑄值桓帝政弱大臣持權語徐庶曰逺客聞此不覺中宵橫淚流臆如處身烈熖中鑄與徐子非無心安反側者為之何計負薪行魯曰峽民男為商女當門户坐肆於市㕓擔負於道路者皆是婦人也蘇曰海南亦有此風每誦此詩以喻父老然亦未易變其習也䕫州處女髮半華四十五十無夫家更遭喪亂嫁不售一生抱恨堪咨嗟土風坐男使女立趙曰陸機詩土風淸且嘉應當門戶女出入十猶八九負薪歸賣薪得錢應供給趙曰晉傳玄豫章行曰男兒當門戶墮也自生神今公詩却云女當門户也至老雙鬟只垂頸野花山葉銀叉並䈥力登危集市門死生射利兼鹽井洙曰䕫有鹽井面粧首飾雜啼痕地𥚹衣寒困石根若道巫山女粗醜何得此洙曰一云北有昭君村師曰售賣也䕫有鹽井婦人當門戶或負薪販鹽以自給其女粗醜可知蒼舒曰右按歸州圖經王嬙字昭君漢紀注云南郡秭歸人待詔掖庭元帝竟寧元年胸奴呼韓邪單于來朝帝賜單于待詔掖庭王嬙為胸奴閼氏按樂府解題云帝後宫既多乃使畫工圖形按圖召幸宫人皆賂畫工多有十萬少不减五萬昭君自恃其貌獨不與乃惡圖之及後胸奴入朝選美人配之昭君當行及入辭光彩射人悚動左右天子方重失信外國悔恨不及窮按其事畫工杜陵毛延壽為人形老小必得其真陳敞劉白龔寬並工狗馬人形不逮延壽楊杜樊青尢善布衆色皆同日弃市漢人憐昭君遠嫁為作歌詩始武帝以江都王建女為公主嫁烏孫王昆莫令琵琶馬上作樂以慰其道路之思其送昭君亦然晉文王諱昭故晉人改為明君石崇有妓曰緑珠善歌舞以此曲教之而自製王明君歌其文悲雅我本漢家子是也琴操載昭君王穰女端正間麗未嘗窺門戶穰以有異人求之不與年十七獻之元帝帝以地逺不幸備後宫積五六年帝每遊後宫昭君常怨不幸後單于遣使朝賀帝宴之盡召後宫昭君乃盛飾而至帝問欲以一女賜單于誰能行者昭君越席請往時單于使在旁帝驚恨不及昭君至單于大恱遣使報送白壁一雙駿馬一十匹胡地致實之物昭君恨帝始不見遇乃作怨思之歌曰梨葉萋萋其葉黃有鳥處此集于芭桑父兮母兮道路修長嗚呼哀哉憂心惻傷單于既死子逹立昭君謂逹曰將為漢將為胡曰將為胡於是昭君伏毒而死單于舉國葬之胡中多白草而此冡獨青前代詞人為歌詩以吊之悽怨者不一鄉人思之為之立廟廟之中有大柏圍六丈五尺披葉蓊鬱出於故臺之上及有搗練石長二丈闊五尺在廟側溪中即今香溪也廟今屬興山縣樂府與琴操所傳不同故並載之最能行峽中丈夫絶輕死少在公門多在水鄭曰少始沼切富豪有錢駕大舸鄭曰加我切貧窮取給行艓子鄭曰艓冝從徒協切師曰艓音葉洙曰峽人富則為商旅貧則為人操舟以地居山水之間瘠惡無以耕也修可曰博雅曰舸舟也又揚雄方言南楚江水湘凡船大者謂之舸艓小舟言輕如小葉也小兒學問止論語蘇曰王衍云家中諸小兒學問無所兼但論語而巳何必竒字為見舊注大兒結束隨商旅欹帆側柂入波濤鄭曰柂持可切正船木撇旋梢濆無險阻鄭曰旋隨戀切洙曰撇旋梢濆皆操舟者所能也朝發白帝暮江陵頃來目擊信有徴瞿塘漫天虎鬚洙曰一作眼怒歸州長年與最能洙曰峽人以操舟人為長年趙曰言行瞿唐峽與虎鬚灘甚易也此鄉之人氣量窄悮競南風踈北客洙曰左傳南風不競蘇曰朝錯項羽氣量淺窄識見卑凡但能亂秦而無奪秦之䇿若道土無英俊才何得山有屈原宅洙曰屈原有宅在歸州定功曰後漢郡國志秭歸注云荆州記曰秭歸縣北一百里有屈平故宅方七須纍石為屋基今地名樂平惜别行送向卿進奉端午御衣之上都肅宗昔在靈武城洙曰祿山之亂肅宗即位靈武指揮猛將收咸京洙曰言用兵也趙曰天寶十五載九月裴冕奉皇太子即皇帝位是為肅宗明年九月復京師向公泣血灑行殿洙曰天子在外故曰行殿佐佑卿相乾坤平趙曰平訖坤非獨卿相之力乃向公佐佑之也向卿無所考其名逆胡冥寞隨烟燼洙曰消滅如隨烟燼也卿家兄弟功名震麒麟閣畫鴻鴈行洙曰言兄弟俱盡像於麒麟閣也紫極出入黃金印尚書勳業超千古雄鎮荆州繼吾祖洙曰祖謂杜預也趙曰尚書鎮荆州言李之芳也繼吾祖則公自言杜預也預在晉為鎮南大將軍都督荆州諸軍事師曰尚書指向卿之父珣鎮荆南昔向秀繼杜預節鎮于此故云繼吾祖裁縫雲霧成御衣拜跪題封賀端午向卿將命寸心赤靑山落日江潮白趙曰言向卿行歷之景物也卿到朝廷說老翁漂零已是滄浪客洙曰老翁公自言也師曰時珣遣子向卿奉端午御衣之上都故有此作滄浪客乃屈原也甫自喻醉歌行洙曰贈公安少府請顧八題壁神仙中人不易得趙曰丗說王恭美姿儀嘗披鶴􅌁裘涉雪而行孟昶見之曰得真神仙中人也顔氏之子才孤標洙曰顔氏公安少府也天馬長嗚待駕馭秋鷹整翮當雲霄洙曰言負駿逸之才以待用也趙曰漢禮樂志天馬徠龍之媒君不見東吳顧文學洙曰顧况吳人君不見西漢杜陵老洙曰前漢都長安後漢都雒陽長安在雒陽之西故前漢謂之西漢杜公長安杜陵人也詩家筆勢君不嫌詞翰升堂為君掃洙曰甫為詩請顧寫也蘇曰王子敬過戴安道草堂飲酣安道求子敬文子敬攘臂大言曰我辭翰雖不如古人與君一掃素壁今山隂草堂碑是也辭翰俱美趙曰公自言詩家之詞與顧君筆勢之翰升顔少府之堂各為之一掃也是日霜風凍七澤洙曰子虛賦楚有七澤蘇曰王子威寒賦霜風沍凍合七澤烏蠻落照銜赤壁洙曰施黔烏蠻之域也赤壁地名周瑜破曹公於赤壁酒酣耳熱忘頭白洙曰楊惲曰酒酣耳熱聲嗚嗚而歌秦聲修可曰魏文帝與吳質書曰昔日遊處每至觴酌流行終竹並奏酒酣耳熱仰而賦詩忽然不自知其樂感君意氣無所惜蘇曰鄭球感意氣倜儻醉何所惜一為歌行歌主客洙曰一本云醉歌行歌主客趙曰主則顔少府客則公與顧也師曰詩家甫自言能詩筆勢指顧况善寫甫為此詩贈公安少府顔氏請顧文學題于公壁故云詞翰升堂為君掃忘頭白甫下以老邁為辭歌主客發揚主客之德也白絲行師曰按唐史竇懷貞右相德玄之子少敦儉不為豪侈事後娶韋后乳媪王所謂莒夫人者故蠻婢也丗謂媪壻為阿父者軒然不慙以自壻於后又附宗楚客安樂公主以取貴仕為素議所斥韋氏敗太平公主干政又傾巳附離素節盡矣故甫作此以譏之然有取於白絲者絲之為物柔直而潔白一為所染喪其素質君子之行一為匪人所汚求其向之所謂潔白者不可得矣繅絲須長不須白鄭曰繅蘇曹切繹繭為絲趙曰須長不須白者以絲為羅與錦則有五色之章焉且以之為舞衣則須長以足用而巳不必白而後受采也越羅蜀錦金粟尺洙曰禮記夫人繅三盆魏文帝詔羣臣曰前後每得蜀錦殊不相似趙曰越羅蜀錦天下之竒紋也金粟尺邊幅尺度之足也尺以金粟飾之冨貴家之物也此何遜詩所謂金粟裹搔頭是矣象床玉手亂殷紅鄭曰殷烏間切赤黑色萬草千花動凝碧洙曰孟嘗君至楚獻象床直千金公孫成諫令勿受乃止趙曰言越羅蜀錦積在象床之多玉手擇取之則殷紅之假相亂矣万草千花則以言錦上罷上之繁紋也巳悲素質隨時染洙曰一作改裂下鳴機色相射鄭曰食亦切洙曰漢紀童子魏昭謂郭泰曰欲以素絲之質附近朱藍墨子悲素絲謂其可以黑古詩纎纎擢素手札札弄機杼趙曰素絲既染則織為羅錦故曰色相射鮑照繅絲復鳴機美人細意尉帖平鄭曰尉紆勿切火展帛也裁縫滅盡針線跡趙曰此詩句言縫為舞衣者矣春天衣著為君舞蛺蝶飛來黃鸝語鄭曰蛺古協切趙曰鮑照白紵歌云催絃急管為君舞此因言舞而言蛺蝶飛者以况舞之輕而黃鸝語以况歌之好矣落絮遊絲亦有情隨風照日冝洙曰一作疑輕舉洙曰前漢郊祀志逢興輕舉趙曰此言舞之態其身之輕可舉而仙去芻曰曹子建長䄂隨風黃曰庾肩吾曰桃紅柳絮白照日復隨風香汗輕塵汙顔色洙曰一作香汚清塵似顔色微芳起兩䄂輕汗染雙題又云裁縫用笥中刀縫為万里衣趙曰陳梁雜歌詩云朱顔潤紅粉香汗沾玉色清塵一作輕非是當以清為正古詩空牀委清塵也開新合故置何洙曰一作相許洙曰古詩云新人工織縑故人工織素織縑日一匹織素五丈餘以縑持此素新人不如故趙曰謂舞衣稍故而合之以言人情之喜新故言開新者矣而合故不著將於甚處置之歎其必委弃也黃曰崔輔國詩云妾有羅衣裳秦王在時作為舞春風多秋來不堪著亦以言新而用之故而弃之凡詩人之興致如此君不見才洙曰一作志士汲引難恐懼棄捐忍羈旅洙曰郭泰機答傅咸詩皎皎白素絲織為寒女衣寒女雖妙巧不得秉機杼天寒知運速况復鴈南飛衣工秉刀尺弃我忽若遺人不取諸身丗事焉所希况復以朝食曷由知我飢趙曰此結一篇之意夫繅絲之難染之難為羅與錦織之又難不猶才士汲引之難乎一旦而弃之故為才士者與其既用而弃不若甘心忍受於羈旅之未用耳師曰今懷貞為韋氏楚客之所汲引雖得爵祿奈公論之所弃忍何故甫託意於懷貞以戒後來百憂集行憶年十五心尚孩洙曰魯昭公十五而猶有童心老子若嬰兒之未孩聖人皆孩之趙曰孩者可提之童也十五乃志學之時心未免於孩故云尚孩健如黃犢走復來庭前八月梨棗熟一日上樹能千回即今倐忽巳五十蘇曰舊本作即今年才五六十魯直云此語似方六七十如五六十師曰此詩作於上元元年辛丑是年在蜀年四十九歲詩云巳五十舉大數然坐卧只多少行立強將笑語供主人師曰主人指郭英義英義鎮成都甫客依之笑語年少事也甫老而客雖強笑語以陪主人奈非其真情也悲見生涯百憂集入門依舊四壁空洙曰相如家居徒四壁立老妻覩我顔色同癡兒未知父子禮叫怒索飯啼門東蘇曰班超幼年每索飯稍遲即呌怒父曰此子異日當為万戶侯後果如其言莫相疑行男兒生無所成趙曰李陵書男兒生無所成名頭皓白牙齒欲落真可惜憶獻三賦蓬萊宫自怪一日聲輝赫洙曰天寶中明皇朝獻太清宫饗廟及郊十三載亦如之甫時獻三大禮賦集賢學士如堵墻觀我落筆中書堂洙曰新唐書甫獻賦帝竒之使待制集賢院命宰相試文章按開元十三年改集仙殿為集賢殿麗正殿書院為集賢殿書院院內五品以上為學七六品以上為直學士禮孔子射於矍相之圃蓋觀者如堵墻往時文彩動人主此日飢寒趨路傍洙曰時擢甫為京兆兵曹㑹祿山亂甫遂齟齬與時不合後寓同谷採橡自給男女餓殍者數人趙曰至德二載公受左拾遺及房琯罷相甫上疏論琯不冝廢肅宗怒出甫為華州司功屬關輔飢亂弃官寓同谷自負薪採耜餔糒不給遂入蜀卜居成都晚將末契託年少趙曰陸機歎逝賦云託末契於後生當面輸心背面笑洙曰時甫依嚴武幾為武所殺寄謝悠悠丗上兒不爭好惡莫相疑師曰甫嘗於天寶十三年乙未獻三大禮賦其大略云臣生陛下淳朴之俗四十年矣時年四十三賦入蓬萊宫天子命宰相試文章一日聲馳乎天下如堵墻言列看之多也中書堂即宰相所坐之堂人主謂玄宗也甫出為華州司功屬關輔飢弃官去同谷自同谷入蜀飢寒奔走故云趨路傍年少指嚴武也甫與武父嚴挺之素善武時年尚少鎮成都甫往依焉故云晚將未契託年少甫嘗醉登武床瞑目曰嚴挺之乃有是兒武憾其斥父名拔劒將殺之賴武母救止乃免武與甫由是有隙故甫譏其不以誠相待而有是作白居易嘗作蜀道難亦為甫而有是篇也短歌行贈王郎司直王郎酒酣拔劒斫地歌莫哀修可曰史記武帝時齊人有東方生名朔時坐席中酒酣據地歌曰云云我能拔爾抑塞磊落之竒才橡樟翻風白日動洙曰吳都賦木則楓柟橡􅻆言材之美者鯨魚跋浪滄溟開洙曰鯨魚之大者吳都賦長鯨吞航趙曰以大魚比之崔豹古今注鯨海魚也大者數干里小者千丈鼓浪成雷噴珠如雨且脫佩劒休徘徊蘇曰張華遇魯銍於滻水華曰且脫劔佩于此徘徊何命為之匆速如是西得諸侯棹錦水洙曰錦水蜀江也欲向何門趿珠履洙曰孟嘗養客三千皆珠履趙曰鄒陽云何門而不可曵長裾乎仲宣樓頭春已深洙曰仲宣王粲也有摟在荆州趙曰仲宣樓指言荆州也梁帝詩久返仲宣樓蓋以仲宣一丗名人故以仲宣名之青眼髙歌望吾子洙曰阮籍能為青白眼以重輕人眼中之人吾老矣師曰錦水蜀中有濯錦江王司直得蜀中刺史刺史古之諸侯甫欲依之為門下客如仲宣之依劉表望其青顧故云青眼髙歌望吾子吾子指王司直眼中之人謂甫素善司直司直必念其衰老而眷遇之甫與司直飲司直酒酣舞劒為樂謂甫云吾能拔爾竒才使汝見用當丗如橡章之翻風如鯨魚之拔浪故甫承其意而有末章之覬望也赤霄行蘇曰嚴武一日欲殺甫及章彛集吏於門武出冠掛于簾者三左右白其母奔救得止獨殺彛於是有赤霄行以叙其事趙曰此篇乃遭海而感歎之作孔雀未知牛有角渴飲寒泉逢抵觸洙曰以非類也非類故不相知不相知而相從則見辱矣赤霄玄圃須往來翠尾金花不辭辱趙曰張茂先鷦鷯賦序彼鷲鶚鵾鴻或凌青霄之際或託絶浪之外也玄圃在崑崙山上之别名見葛仙傳翠羽金花則孔雀之毛羽如此晉左九嬪孔雀賦云櫂翠羽之修莖江中淘河嚇飛燕銜泥却落羞華屋趙曰淘河者鵜鴰也飛燕從江上來為淘河所疑意謂燕爭其魚而嚇之歸華屋之下負此羞耻䘖泥而却落也莊子言鴟得腐鼠鶁雛過之仰而視之日赫也皇孫猶曽蓮勺困洙曰孝宣帝紀帝初為皇孫髙材好學然亦喜游俠鬪雞走馬具諳知閭里姦邪吏治得失數上下諸侯常困於蓮勺鹵中如淳曰為人所困辱也蓮勺縣有鹽池縱橫十餘里鄉人名為鹵中蓮音輦勺音灼衛莊見貶傷其足洙曰成十七年傳刖鮑牽而逐髙無咎齊人來招牽之弟鮑國而立之鮑國相施氏忠故齊人取以為鮑氏後仲尼曰鮑莊子之知不如葵猶能衛其足注葵傾葉向日以蔽其根言鮑牽居亂不能危行言孫衛作鮑老翁慎莫怪少年葛亮貴和書有篇趙曰老翁公自指言也少年則所見辱之子也陳壽所上諸葛亮集目録凡二十四篇而貴和第十一此公所以託言不能和則必召辱矣丈夫垂名動萬年記憶細故非髙賢洙曰言不可録小怨而弃大德也蘇曰陳遠忤徐陵陵明日枉駕訪遠遠曰君真髙賢也不記細故自此密治趙曰此見公胸懷之廓落無宿憾矣斯乃顔淵紀而不校者也漢文帝與胸奴書曰朕與單于捐細故師古曰細故小事也師曰博物志孔雀尾多變色或紅或黃有如雲霞其色無定人怕其尾有金翠五年而後成始生三年金翠尚小初春乃生四月後凋與花蘂俱寢南人取其尾握刀蔽於叢竹潜隱之處伺過急剪之若不即斷回首一顧無復光彩矣爾雅釋鳥鵜鴮鸅郭璞注今之鵜鴣也好羣飛沉水食魚俗呼為淘河孔雀與牛非其類猶君子小人非其類不虞小人反為小人中傷淘河飛燕銜泥以汚華屋猶小人居朝反為汚辱曽孫鮑莊事巳見內翰注語云君子坦蕩蕩小人長戚戚此甫所以末章貴和而不記録其小怨也不然何以見君子之大去矣行鮑曰天寶十四年歲次乙未公年四十四在率府數上賦頌不蒙采録欲辭職遂作去矣行師曰此詩為嚴武而作見後貧交行注君不見鞲上鷹鄭曰鞲古侯切射臂决也一飽則飛掣鄭曰尺列切洙曰鮑明逺詩昔如鞲上鷹今似檻中猿晉孫楚鷹賦鞲青骹戲田疇魏志吕布因陳登來徐州牧不得布怒登喻之曰登見曹公言待將軍譬如養虎當飽其肉不則噬人公曰不如卿言譬如餋鷹飢則為用飽則揚去布乃解史滑稽傳注鞲臂捍也焉能作堂上燕銜泥附炎熱洙曰古詩翩翩堂前燕冬藏夏來見庾肩吾詩可憐幕上燕古詩思為雙飛燕㗸泥巢君屋傅玄陽春賦燕􅔷泥於廣庭湛方生懷春賦燕㗸泥而來征附炎附勢也趙曰如鷹之飽而髙不學燕之戀而附此賢人義士不阿附於權貴之門也野人曠蕩無靦顔鄭曰靦他典切豈可久在王侯間魯曰語先進於禮樂野人也蘇曰江淹曰野人踈散曠蕩無名利拘繫靦顔見公等趙曰野人公自謂也字出左傳野人豫之云曠蕩者以言懷抱之間曠也有慙顔則能忍慙者公無慙顔豈肯曵裾於王侯之間乎沈休文奏彈王源云明月腆顔曽無愧畏未試囊中餐玉法明朝且入藍田山洙曰周禮天官玉府玉齊則供食玉注玉是陽精之純者食之以禦水氣鄭司農云玉齊當食玉屑列仙傳赤松子者神農時雨師服水玉以教神農能入火自燒前漢地理志藍田山出美玉在長安木玄虛海賦神仙縹眇餐玉清崖事見魏書李預傳預居長安每羡古人餐玉之法乃採訪藍田躬往攻掘得若環璧雜器形者大小百餘稍得粗黑者亦篋盛以還而至家觀之皆光潤可玩預乃椎七十枚為屑日服食之餘多惠人後預及聞者更求於故處皆無所見馮翊公源懷等得其琢為器佩皆鮮明可寶預服玉經云有效驗而丗事寢食不禁節之又加之好酒損志及疾篤謂妻子曰服玉屏居山林排弃嗜欲或當有大神力而吾猶色不絶自致於死非藥過也然吾尸躰必當有異勿使速殯令後人知餐服之妙時七月中旬長安毒熱預得停尸四宿而躰色不變其妻常氏以玉珠二枚唅之口閉常謂之曰君自言食玉有神驗何故不受含也言訖齒啓納珠因噓囑其口都無穢氣舉斂於棺堅直不傾委死時猶有遺玉屑數斗槖盛納諸棺中貧交行翻手作雲覆手雨紛紛輕薄何須數鄭曰所矩切計也洙曰沈休文詩洛陽繁華子長安輕薄兒梁簡文帝詩輕薄出三河江淹詩子矜怨勿往谷風誚輕薄阮籍平生少年時輕薄好弦歌蘇曰陳暄曰徐庾輩數輕薄兒恃勢作威福何必數耶師曰甫之作此為嚴武而作也甫與嚴武素相厚善及武鎮西川甫往依之常醉登其床曰嚴挺之乃有是兒武杖劒欲殺之母教止夫武始待甫甚厚今以小嫌欲殺之其輕薄如此何足數乎君不見管鮑貧時交此道今人棄如土洙曰史管仲少時與鮑叔牙游鮑叔終善遇之管仲曰吾始困嘗與鮑叔賈分財利多自與鮑叔不以我為貪知我貧也吾嘗與鮑叔謀事而更窮困鮑叔不以我為愚知時有利不利也吾嘗三仕三見逐於君鮑叔不以我為不肖知我不遭時也吾嘗三戰三走鮑叔不以我為怯知我有老母也公子紏敗召忽死之吾幽囚受辱鮑叔不以我為無耻知我不羞小莭而耻功名不顯於天下也生我者父母知我者鮑子也鮑叔既進管仲以身下之天下多管仲之賢而多鮑叔能知人趙曰史載管仲曰吾始困時嘗與鮑叔賈分財利多自與鮑叔不以我為貪知我貧也而題是貧交行則所主用在此矣公之緩急人所有而以有濟無交友之道也雲固為雨矣雲有淹以凄凄而後興雨祁祁則雨所濟者久雲氣不待施而雨則雨所濟者微今以翻覆手而雲遂為雨其俄傾可知矣管仲與鮑叔賈而獨分財利鮑叔弗爭則悠久每每如此豈翻覆手之間為片雲過雨之霑丐乎短歌行魯曰送祁録事歸台州因寄蘇使君前者途中一相見人事經年記君面洙曰古者有半靣之交趙曰經年之中徒記君靣而巳不得再相見也後生相動洙曰一作勸何寂寥君有長才不貧賤洙曰陳平傳張負曰人固有好美如陳平而長貧賤乎趙曰嵇康云長才廣度無所不淹君今起柂春江流鄭曰柂徒可切趙曰柂所以行大舟也余亦沙邊具小舟幸為逹書賢府主趙曰指言合州蘇使君也江花未盡㑹江樓分門集注杜工部詩卷第二十五終
